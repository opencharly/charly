# ORG-WIDE AUTO-MERGE DISPATCHER — installed in every opencharly repo.
name: auto-merge

on:
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  engine:
    if: github.event.check_run.check_suite.head_branch != github.event.repository.default_branch
    uses: opencharly/.github/.github/workflows/auto-merge-reusable.yml@main
    with:
      head-sha: ${{ github.event.check_run.check_suite.head_sha }}
    secrets: inherit

name: auto-merge
on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
permissions:
  pull-requests: write
  contents: write
jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Merge and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api "/repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR found for head SHA — already merged or not a PR branch"
            exit 0
          fi
          echo "Merging PR #$PR"
          gh pr merge "$PR" --squash --delete-branch=false
          sleep 3
          VER="v$(date -u +%Y.%j.%H%M)"
          MS=$(gh api "/repos/${{ github.repository }}/pulls/$PR" --jq '.merge_commit.sha // empty')
          if [ -n "$MS" ]; then
            gh api -X POST "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$VER" -f sha="$MS" && echo "Tagged $VER at $MS"
          fi

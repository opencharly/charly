name: auto-merge
on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
permissions:
  pull-requests: write
  contents: write
jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check all statuses and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          PR=$(gh api "/repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR found for head SHA"
            exit 0
          fi

          STATE=$(gh api "/repos/${{ github.repository }}/pulls/$PR" --jq '.state')
          if [ "$STATE" = "closed" ]; then
            echo "PR #$PR is already closed — tagging if needed"
            MS=$(gh api "/repos/${{ github.repository }}/pulls/$PR" --jq '.merge_commit.sha // empty')
            if [ -n "$MS" ]; then
              VER="v$(TZ=UTC0 git log -1 --date='format-local:%Y.%j.%H%M' --format='%cd' "$MS" 2>/dev/null)"
              TAG_EXISTS=$(gh api "/repos/${{ github.repository }}/git/refs/tags/$VER" -q '.ref' 2>/dev/null || echo "")
              if [ -z "$TAG_EXISTS" ]; then
                gh api -X POST "/repos/${{ github.repository }}/git/refs" \
                  -f ref="refs/tags/$VER" -f sha="$MS" && echo "Tagged $VER"
              fi
            fi
            exit 0
          fi

          # Check ALL status checks — not just the validator
          HEAD=$(gh api "/repos/${{ github.repository }}/pulls/$PR" --jq '.head.sha')
          ALL_GREEN=true
          FAILED_CHECKS=""
          while IFS=$'\t' read -r name conclusion; do
            if [ "$conclusion" != "success" ] && [ "$conclusion" != "skipped" ] && [ "$conclusion" != "neutral" ]; then
              ALL_GREEN=false
              FAILED_CHECKS="$FAILED_CHECKS\n  - $name: $conclusion"
            fi
          done < <(gh api "/repos/${{ github.repository }}/commits/$HEAD/check-runs" --jq '.check_runs[] | [.name, .conclusion // "null"] | @tsv')

          if [ "$ALL_GREEN" != "true" ]; then
            echo "Not all checks pass:"
            printf "$FAILED_CHECKS"
            exit 1
          fi

          echo "All checks green — enabling auto-merge for PR #$PR"
          gh pr merge "$PR" --squash --auto --delete-branch=false

          # Wait for the merge to complete
          echo "Waiting for merge to complete..."
          for i in $(seq 1 120); do
            sleep 5
            STATE=$(gh api "/repos/${{ github.repository }}/pulls/$PR" --jq '.state')
            MS=$(gh api "/repos/${{ github.repository }}/pulls/$PR" --jq '.merge_commit.sha // empty')
            if [ "$STATE" = "closed" ] && [ -n "$MS" ]; then
              TAG_VER="v$(TZ=UTC0 git log -1 --date='format-local:%Y.%j.%H%M' --format='%cd' "$MS" 2>/dev/null)"
              echo "Merged at $MS — tagging $TAG_VER"
              gh api -X POST "/repos/${{ github.repository }}/git/refs" \
                -f ref="refs/tags/$TAG_VER" -f sha="$MS" && echo "Tagged $TAG_VER"
              exit 0
            fi
          done

          echo "Timed out waiting for merge"
          exit 1
name: auto-merge
on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
permissions:
  pull-requests: write
  contents: write
jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Merge and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api "/repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR found for head SHA — already merged or not a PR branch"
            exit 0
          fi
          MERGE_RESPONSE=$(gh api -X PUT "/repos/${{ github.repository }}/pulls/$PR/merge" \
            -f merge_method="squash" \
            -f commit_title="${{ github.event.workflow_run.display_title }}" 2>&1)
          echo "$MERGE_RESPONSE"
          MS=$(echo "$MERGE_RESPONSE" | jq -r '.sha // empty' 2>/dev/null)
          if [ -z "$MS" ]; then
            echo "Merge failed, trying auto-merge queue"
            gh pr merge "$PR" --squash --auto --delete-branch=false
            sleep 5
            MS=$(gh api "/repos/${{ github.repository }}/pulls/$PR" --jq '.merge_commit.sha // empty')
          fi
          if [ -n "$MS" ]; then
            gh api -X POST "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$VER" -f sha="$MS" && echo "Tagged $VER at $MS"
          fi

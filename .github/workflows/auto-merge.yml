name: auto-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  actions: write

# The CHANGELOG-finalization step pushes a commit to the PR head branch, which
# re-runs the validator, which re-triggers this workflow. Without a concurrency
# group, overlapping runs could rename the CHANGELOG repeatedly and one run
# could merge a head another run is still re-validating. Grouping by the PR
# head branch serializes runs for the same PR (a new run queues, never
# cancels), so only one auto-merge run is ever active per PR.
concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # `gh pr merge` resolves the repository through a local git repo and runs
      # `git status` against it; the workflow_run trigger checks out nothing, so
      # without this every merge died with
      #   failed to run git: fatal: not a git repository
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check all statuses and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          STAMP=""

          # ---- Idempotent tag creation (shared by the already-closed and
          #      post-merge paths so the two cannot drift) ----
          # Existence is checked against the LOCAL git refs (the checkout
          # fetches +refs/tags/*:refs/tags/*) — NOT via `gh api …git/refs/tags`,
          # whose 404 response body is written to stdout and therefore always
          # reads as non-empty, making the guard believe every tag exists and
          # silently skip the mint (observed live: PR #27 merged, never tagged).
          ensure_tag() {
            local ver="$1" ms="$2"
            if git rev-parse -q --verify "refs/tags/$ver" >/dev/null 2>&1; then
              echo "Tag $ver already exists"
              return 0
            fi
            if gh api -X POST "/repos/$REPO/git/refs" \
              -f ref="refs/tags/$ver" -f sha="$ms" >/dev/null 2>&1; then
              echo "Tagged $ver"
            else
              # A concurrent run may have minted it between the check and the
              # POST (422 "Reference already exists") — the tag is then present.
              echo "Tag $ver already exists (concurrent mint)"
            fi
          }

          # ---- Tag version from the merge stamp. EXCEPTION: the sdk contract repo
          #      tags under its Go-module scheme v0.<YYYYDDD>.<HHMM with all leading
          #      zeros stripped> — the plain v<YYYY.DDD.HHMM> is not a valid Go module
          #      version (semver forbids a leading-zero segment, and a major >= 2 would
          #      force a /vN module-path suffix that breaks every import). Mandatory,
          #      not an exemption.
          tag_ver() {
            local stamp="$1" ddd rest doy hhmm
            if [ "$REPO" = "opencharly/sdk" ]; then
              ddd=${stamp%%.*}
              rest=${stamp#*.}
              doy=${rest%%.*}
              hhmm=${rest#*.}
              hhmm=${hhmm#0}; hhmm=${hhmm#0}; hhmm=${hhmm#0}; hhmm=${hhmm#0}
              [ -z "$hhmm" ] && hhmm=0
              printf 'v0.%s%s.%s' "$ddd" "$doy" "$hhmm"
            else
              printf 'v%s' "$stamp"
            fi
          }

          # ---- Locate the PR for this head SHA ----
          PR=$(gh api "/repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR found for head SHA $HEAD_SHA"
            exit 0
          fi
          echo "PR #$PR (head $HEAD_SHA)"

          # ---- Already merged/closed: tag idempotently and stop ----
          STATE=$(gh api "/repos/$REPO/pulls/$PR" --jq '.state')
          if [ "$STATE" = "closed" ]; then
            MS=$(gh api "/repos/$REPO/pulls/$PR" --jq '.merge_commit_sha // empty')
            if [ -n "$MS" ]; then
              VER="$(tag_ver "$(date -u -d "$(gh api "/repos/$REPO/commits/$MS" \
                --jq '.commit.committer.date')" +%Y.%j.%H%M)")"
              ensure_tag "$VER" "$MS"
            fi
            echo "PR #$PR already closed"
            exit 0
          fi

          BASE_REF=$(gh api "/repos/$REPO/pulls/$PR" --jq '.base.ref')
          HEAD=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.sha')

          # ---- Wait until EVERY status check has settled ----
          wait_all_settled() {
            local head="$1" label="$2" i pending total
            for i in $(seq 1 180); do
              pending=$(gh api "/repos/$REPO/commits/$head/check-runs" \
                --jq '[.check_runs[] | select(.status != "completed")] | length')
              total=$(( pending + $(gh api "/repos/$REPO/commits/$head/status" \
                --jq 'if .state == "pending" then ([.statuses[] | select(.state == "pending")] | length) else 0 end') ))
              if [ "$total" = "0" ]; then
                echo "$label: all status checks have completed"
                return 0
              fi
              echo "$label: $total check(s) still pending (attempt $i/180)"
              sleep 5
            done
            echo "Timed out waiting for status checks to complete"
            return 1
          }

          # ---- Verify every check concluded green (success/skipped/neutral) ----
          verify_all_green() {
            local head=$1 name conclusion state nstatuses all_green=true failed=""
            while IFS=$'\t' read -r name conclusion; do
              case "$conclusion" in
                success|skipped|neutral) ;;
                *) all_green=false; failed="${failed} $name: ${conclusion};" ;;
              esac
            done < <(gh api "/repos/$REPO/commits/$head/check-runs" \
              --jq '.check_runs[] | [.name, (.conclusion // "null")] | @tsv')
            state=$(gh api "/repos/$REPO/commits/$head/status" --jq '.state')
            nstatuses=$(gh api "/repos/$REPO/commits/$head/status" --jq '.statuses | length')
            # The combined commit-status state is "pending" by default when a
            # commit has NO commit statuses (GitHub's documented empty-default).
            # The validator posts a check-run, never a commit status, so a green
            # head reads state=pending, statuses=[]. Only a non-empty statuses
            # array whose combined state is not success (failure OR error, or a
            # pending that wait_all_settled() failed to drain) is not green.
            if [ "$nstatuses" -gt 0 ] && [ "$state" != "success" ]; then
              all_green=false
              failed="${failed} commit-status contexts (state=${state});"
            fi
            if [ "$all_green" != "true" ]; then
              echo "Not all checks pass:"
              printf '%s\n' "$failed"
              return 1
            fi
            echo "All status checks green on $head"
          }

          # ---- Wait for the validator to produce a check-run on a freshly
          #      finalized head. The finalization push is made with GITHUB_TOKEN,
          #      and GitHub does not dispatch jobs for events triggered by
          #      GITHUB_TOKEN — the validator run it triggers ends
          #      action_required with 0 jobs and no check-run. Re-run the
          #      validator so its check-run is created, then wait for it. ----
          wait_for_validator() {
            local head="$1" i run_id conclusion
            for i in $(seq 1 30); do
              run_id=$(gh api "/repos/$REPO/actions/runs?head_sha=$head" \
                --jq '[.workflow_runs[] | select(.name == "charly/pr-validator")] | .[0].id // empty')
              if [ -n "$run_id" ]; then break; fi
              echo "waiting for validator run on $head (attempt $i/30)"
              sleep 5
            done
            if [ -z "$run_id" ]; then
              echo "No validator run found on $head after finalization"
              return 1
            fi
            # Wait for the run to settle (conclusion non-null), then re-run it
            # if it ended action_required / startup_failure (no check-run).
            for i in $(seq 1 30); do
              conclusion=$(gh api "/repos/$REPO/actions/runs/$run_id" --jq '.conclusion // empty')
              if [ -n "$conclusion" ]; then break; fi
              echo "waiting for validator run $run_id to settle (attempt $i/30)"
              sleep 5
            done
            if [ "$conclusion" = "action_required" ] || [ "$conclusion" = "startup_failure" ]; then
              echo "Validator run $run_id ended $conclusion (GITHUB_TOKEN dispatch) — re-running"
              gh api -X POST "/repos/$REPO/actions/runs/$run_id/rerun" >/dev/null
            fi
            # Wait for the validator check-run to appear on the new head
            for i in $(seq 1 60); do
              n=$(gh api "/repos/$REPO/commits/$head/check-runs" \
                --jq '[.check_runs[] | select(.name == "charly/pr-validator")] | length')
              if [ "$n" -gt 0 ]; then
                echo "validator check-run present on $head"
                return 0
              fi
              echo "waiting for validator check-run on $head (attempt $i/60)"
              sleep 5
            done
            echo "Timed out waiting for validator check-run on $head"
            return 1
          }

          wait_all_settled "$HEAD" "initial" || exit 1
          verify_all_green "$HEAD" || exit 1

          # ---- Rulebook merge-time CHANGELOG finalization (best-effort) ----
          # The author writes a placeholder CHANGELOG/<calver>.md; the merge
          # contract finalizes it to the merge-time CalVer (git mv + H1 rewrite)
          # so the changelog filename/H1 and the release tag agree. Same-repo
          # PRs only (a fork head cannot be pushed by this token). Any failure
          # falls back to a plain merge + merge-commit-date tag.
          #
          # The `A`-status filter narrows finalization to files the PR added —
          # never a pre-existing or modified CHANGELOG file. Re-entrancy itself
          # is prevented by the concurrency group above: the finalize push
          # re-triggers the validator, which re-triggers this workflow, but the
          # new run queues behind the active one (same head-branch group) and
          # only starts after the PR is merged/closed.
          #
          # Finalization is idempotent: a previous auto-merge run on this PR has
          # already renamed+stamped the changelog, so skip the rename and reuse
          # that stamp for the tag so the two still agree. The state check is
          # DIRECT — it reads the head's copy of the file and looks for the
          # `auto-merge-finalized` marker the finalize writes (below). It does
          # NOT walk branch history: the earlier `git log | grep` history-text
          # proxy NEVER evaluated true in the GitHub runner across six live runs
          # (observed live: PR #24 re-finalized 1553→1627 despite the finalize
          # commit being in the branch history, re-creating the re-finalization
          # loop defect #7), while `git diff`/`git show` blob reads and
          # `gh | grep` pipelines work. A blob read tests the actual invariant
          # (the file is already finalized) instead of an indirect proxy.
          head_repo=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')
          head_branch=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.ref')
          if [ "$head_repo" = "$REPO" ]; then
            if git fetch -q origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
                 "+refs/heads/$head_branch:refs/remotes/origin/$head_branch"; then
              placeholder=$(git diff --name-status "origin/$BASE_REF...origin/$head_branch" -- CHANGELOG/ \
                | awk '$1=="A"{print $NF}' \
                | grep -E '^CHANGELOG/[0-9]{4}\.[0-9]{3}\.[0-9]{4}\.md$' | head -1 || true)
              if [ -n "$placeholder" ]; then
                if git show "origin/$head_branch:$placeholder" 2>/dev/null >/tmp/am-placeholder-check \
                   && grep -q "auto-merge-finalized: $(basename "$placeholder" .md)" /tmp/am-placeholder-check; then
                  echo "CHANGELOG already finalized — skipping finalization"
                  STAMP=$(basename "$placeholder" .md)
                else
                  stamp=$(date -u +%Y.%j.%H%M)
                  if [ "$(basename "$placeholder" .md)" = "$stamp" ]; then
                    echo "CHANGELOG placeholder already at the merge stamp $stamp"
                    STAMP="$stamp"
                  else
                    echo "Finalizing $placeholder -> CHANGELOG/$stamp.md"
                    if git checkout -q -B dev/auto-merge "origin/$head_branch" \
                       && git mv "$placeholder" "CHANGELOG/$stamp.md" \
                       && sed -i -e "1s/^# [0-9]\{4\}\.[0-9]\{3\}\.[0-9]\{4\}/# $stamp/" \
                                 -e "1a\\<!-- auto-merge-finalized: $stamp -->" "CHANGELOG/$stamp.md" \
                       && git add "CHANGELOG/$stamp.md"; then
                      # `git add <new>` stages the whole rename (deletion of the
                      # placeholder + the sed edit); committing with a pathspec
                      # would drop the deletion side and leave the old file behind.
                      if git -c user.name='opencharly auto-merge' \
                         -c user.email='actions@github.com' \
                         commit -q -m "docs: finalize CHANGELOG placeholder to $stamp (merge-time CalVer)" \
                         && out=$(git push -q origin "HEAD:$head_branch" 2>&1); then
                        HEAD=$(git rev-parse HEAD)
                        STAMP="$stamp"
                        # The finalization renames the PR's CHANGELOG file, so
                        # the diff the re-run validator will review differs from
                        # the one the author's body described. A fresh re-review
                        # compares the body against the CURRENT diff; a body that
                        # still names the placeholder reads as a description↔code
                        # mismatch and the re-validation blocks (observed live:
                        # the first finalized head was BLOCKed on the old filename
                        # in the body). Reconcile the body BEFORE the re-run by
                        # appending an auto-finalization note naming the actual
                        # (finalized) file. Idempotent: the marker prevents
                        # re-appending across re-runs. The marker is an HTML
                        # comment unique to this note — the earlier guard matched
                        # the `## Auto-merge finalization` HEADING, which a PR
                        # body describing the workflow can legitimately name in
                        # prose, so the append was silently skipped and the
                        # re-run validator blocked on the body↔diff mismatch
                        # (observed live: the canary body-append PR, whose body
                        # step 3 names the note, never received the append).
                        # Author prose cannot contain `<!-- auto-merge-finalization-note`.
                        # Failure is non-fatal — if the author's body pinned the
                        # placeholder, the re-run validator blocks and the run
                        # fails loudly, leaving the PR open.
                        if ! gh pr view "$PR" --repo "$REPO" --json body --jq .body 2>/dev/null \
                             | grep -q '<!-- auto-merge-finalization-note'; then
                          gh pr view "$PR" --repo "$REPO" --json body --jq .body 2>/dev/null \
                            | { cat; printf '\n\n## Auto-merge finalization\n\nThis run finalized the CHANGELOG at merge time: the placeholder was\nrenamed to `CHANGELOG/%s.md` (H1 rewritten to `# %s`). The current diff\ncarries the finalized file.\n\n<!-- auto-merge-finalization-note: %s -->\n' "$stamp" "$stamp" "$stamp"; } \
                            | gh pr edit "$PR" --repo "$REPO" --body-file - \
                            || echo "  PR body finalization-note update failed — continuing (the re-validation is the gate)"
                        fi
                        echo "CHANGELOG finalized; new head $HEAD — waiting for re-validation"
                        wait_for_validator "$HEAD" || exit 1
                        wait_all_settled "$HEAD" "revalidation" || exit 1
                        verify_all_green "$HEAD" || exit 1
                      else
                        echo "CHANGELOG finalize push failed — falling back to a plain merge"
                      fi
                    else
                      echo "CHANGELOG finalize edit failed — falling back to a plain merge"
                    fi
                  fi
                fi
              else
                echo "No CHANGELOG placeholder in the PR diff — skipping finalization"
              fi
            else
              echo "Could not fetch PR head — skipping finalization"
            fi
          else
            echo "Fork PR (head repo $head_repo) — skipping CHANGELOG finalization"
          fi

          # ---- Merge: enable GitHub auto-merge (atomic re-check of branch
          #      protection) and wait for it to land. There is deliberately NO
          #      direct-squash fallback: a direct merge would skip the atomic
          #      re-check and could land a head that changed after the green
          #      verdict. If enabling auto-merge fails, the run fails loudly and
          #      the PR stays open for investigation.
          echo "All status checks green — merging PR #$PR (squash)"
          gh pr merge "$PR" --squash --auto --delete-branch=false

          for i in $(seq 1 120); do
            sleep 5
            STATE=$(gh api "/repos/$REPO/pulls/$PR" --jq '.state')
            MS=$(gh api "/repos/$REPO/pulls/$PR" --jq '.merge_commit_sha // empty')
            if [ "$STATE" = "closed" ] && [ -n "$MS" ]; then
              if [ -z "$STAMP" ]; then
                STAMP=$(date -u -d "$(gh api "/repos/$REPO/commits/$MS" \
                  --jq '.commit.committer.date')" +%Y.%j.%H%M)
              fi
              VER="$(tag_ver "$STAMP")"
              echo "Merged at $MS — tagging $VER"
              ensure_tag "$VER" "$MS"
              exit 0
            fi
          done

          echo "Timed out waiting for merge"
          exit 1

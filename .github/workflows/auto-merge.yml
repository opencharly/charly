name: auto-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

# The CHANGELOG-finalization step pushes a commit to the PR head branch, which
# re-runs the validator, which re-triggers this workflow. Without a concurrency
# group, overlapping runs could rename the CHANGELOG repeatedly and one run
# could merge a head another run is still re-validating. Grouping by the PR
# head branch serializes runs for the same PR (a new run queues, never
# cancels), so only one auto-merge run is ever active per PR.
concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # `gh pr merge` resolves the repository through a local git repo and runs
      # `git status` against it; the workflow_run trigger checks out nothing, so
      # without this every merge died with
      #   failed to run git: fatal: not a git repository
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check all statuses and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          STAMP=""

          # ---- Idempotent tag creation (shared by the already-closed and
          #      post-merge paths so the two cannot drift) ----
          ensure_tag() {
            local ver="$1" ms="$2"
            if [ -z "$(gh api "/repos/$REPO/git/refs/tags/$ver" -q '.ref' 2>/dev/null || true)" ]; then
              gh api -X POST "/repos/$REPO/git/refs" \
                -f ref="refs/tags/$ver" -f sha="$ms" >/dev/null && echo "Tagged $ver"
            else
              echo "Tag $ver already exists"
            fi
          }

          # ---- Locate the PR for this head SHA ----
          PR=$(gh api "/repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR found for head SHA $HEAD_SHA"
            exit 0
          fi
          echo "PR #$PR (head $HEAD_SHA)"

          # ---- Already merged/closed: tag idempotently and stop ----
          STATE=$(gh api "/repos/$REPO/pulls/$PR" --jq '.state')
          if [ "$STATE" = "closed" ]; then
            MS=$(gh api "/repos/$REPO/pulls/$PR" --jq '.merge_commit.sha // empty')
            if [ -n "$MS" ]; then
              VER="v$(date -u -d "$(gh api "/repos/$REPO/commits/$MS" \
                --jq '.commit.committer.date')" +%Y.%j.%H%M)"
              ensure_tag "$VER" "$MS"
            fi
            echo "PR #$PR already closed"
            exit 0
          fi

          BASE_REF=$(gh api "/repos/$REPO/pulls/$PR" --jq '.base.ref')
          HEAD=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.sha')

          # ---- Wait until EVERY status check has settled ----
          wait_all_settled() {
            local head="$1" label="$2" i pending total
            for i in $(seq 1 180); do
              pending=$(gh api "/repos/$REPO/commits/$head/check-runs" \
                --jq '[.check_runs[] | select(.status != "completed")] | length')
              total=$(( pending + $(gh api "/repos/$REPO/commits/$head/status" \
                --jq 'if .state == "pending" then ([.statuses[] | select(.state == "pending")] | length) else 0 end') ))
              if [ "$total" = "0" ]; then
                echo "$label: all status checks have completed"
                return 0
              fi
              echo "$label: $total check(s) still pending (attempt $i/180)"
              sleep 5
            done
            echo "Timed out waiting for status checks to complete"
            return 1
          }

          # ---- Verify every check concluded green (success/skipped/neutral) ----
          verify_all_green() {
            local head=$1 name conclusion state all_green=true failed=""
            while IFS=$'\t' read -r name conclusion; do
              case "$conclusion" in
                success|skipped|neutral) ;;
                *) all_green=false; failed="${failed} $name: ${conclusion};" ;;
              esac
            done < <(gh api "/repos/$REPO/commits/$head/check-runs" \
              --jq '.check_runs[] | [.name, (.conclusion // "null")] | @tsv')
            state=$(gh api "/repos/$REPO/commits/$head/status" --jq '.state')
            # The combined commit-status state can be success, failure, error or
            # pending. wait_all_settled() already drained pending; anything that
            # is not success (failure OR error) is not green.
            if [ "$state" != "success" ]; then
              all_green=false
              failed="${failed} commit-status contexts (state=${state});"
            fi
            if [ "$all_green" != "true" ]; then
              echo "Not all checks pass:"
              printf '%s\n' "$failed"
              return 1
            fi
            echo "All status checks green on $head"
          }

          wait_all_settled "$HEAD" "initial" || exit 1
          verify_all_green "$HEAD" || exit 1

          # ---- Rulebook merge-time CHANGELOG finalization (best-effort) ----
          # The author writes a placeholder CHANGELOG/<calver>.md; the merge
          # contract finalizes it to the merge-time CalVer (git mv + H1 rewrite)
          # so the changelog filename/H1 and the release tag agree. Same-repo
          # PRs only (a fork head cannot be pushed by this token). Any failure
          # falls back to a plain merge + merge-commit-date tag.
          #
          # The `A`-status filter narrows finalization to files the PR added —
          # never a pre-existing or modified CHANGELOG file. Re-entrancy itself
          # is prevented by the concurrency group above: the finalize push
          # re-triggers the validator, which re-triggers this workflow, but the
          # new run queues behind the active one (same head-branch group) and
          # only starts after the PR is merged/closed.
          head_repo=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')
          head_branch=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.ref')
          if [ "$head_repo" = "$REPO" ]; then
            if git fetch -q origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
                 "+refs/heads/$head_branch:refs/remotes/origin/$head_branch"; then
              placeholder=$(git diff --name-status "origin/$BASE_REF...origin/$head_branch" -- CHANGELOG/ \
                | awk '$1=="A"{print $NF}' \
                | grep -E '^CHANGELOG/[0-9]{4}\.[0-9]{3}\.[0-9]{4}\.md$' | head -1 || true)
              if [ -n "$placeholder" ]; then
                stamp=$(date -u +%Y.%j.%H%M)
                if [ "$(basename "$placeholder" .md)" = "$stamp" ]; then
                  echo "CHANGELOG placeholder already at the merge stamp $stamp"
                else
                  echo "Finalizing $placeholder -> CHANGELOG/$stamp.md"
                  if git checkout -q -B dev/auto-merge "origin/$head_branch" \
                     && git mv "$placeholder" "CHANGELOG/$stamp.md" \
                     && sed -i "1s/^# [0-9]\{4\}\.[0-9]\{3\}\.[0-9]\{4\}/# $stamp/" "CHANGELOG/$stamp.md" \
                     && git add "CHANGELOG/$stamp.md"; then
                    # `git add <new>` stages the whole rename (deletion of the
                    # placeholder + the sed edit); committing with a pathspec
                    # would drop the deletion side and leave the old file behind.
                    if git -c user.name='opencharly auto-merge' \
                       -c user.email='actions@github.com' \
                       commit -q -m "docs: finalize CHANGELOG placeholder to $stamp (merge-time CalVer)" \
                       && out=$(git push -q origin "HEAD:$head_branch" 2>&1); then
                      HEAD=$(git rev-parse HEAD)
                      STAMP="$stamp"
                      echo "CHANGELOG finalized; new head $HEAD — waiting for re-validation"
                      wait_all_settled "$HEAD" "revalidation" || exit 1
                      verify_all_green "$HEAD" || exit 1
                    else
                      echo "CHANGELOG finalize push failed — falling back to a plain merge"
                    fi
                  else
                    echo "CHANGELOG finalize edit failed — falling back to a plain merge"
                  fi
                fi
              else
                echo "No CHANGELOG placeholder in the PR diff — skipping finalization"
              fi
            else
              echo "Could not fetch PR head — skipping finalization"
            fi
          else
            echo "Fork PR (head repo $head_repo) — skipping CHANGELOG finalization"
          fi

          # ---- Merge: enable GitHub auto-merge (atomic re-check of branch
          #      protection) and wait for it to land. There is deliberately NO
          #      direct-squash fallback: a direct merge would skip the atomic
          #      re-check and could land a head that changed after the green
          #      verdict. If enabling auto-merge fails, the run fails loudly and
          #      the PR stays open for investigation.
          echo "All status checks green — merging PR #$PR (squash)"
          gh pr merge "$PR" --squash --auto --delete-branch=false

          for i in $(seq 1 120); do
            sleep 5
            STATE=$(gh api "/repos/$REPO/pulls/$PR" --jq '.state')
            MS=$(gh api "/repos/$REPO/pulls/$PR" --jq '.merge_commit.sha // empty')
            if [ "$STATE" = "closed" ] && [ -n "$MS" ]; then
              if [ -z "$STAMP" ]; then
                STAMP=$(date -u -d "$(gh api "/repos/$REPO/commits/$MS" \
                  --jq '.commit.committer.date')" +%Y.%j.%H%M)
              fi
              VER="v$STAMP"
              echo "Merged at $MS — tagging $VER"
              ensure_tag "$VER" "$MS"
              exit 0
            fi
          done

          echo "Timed out waiting for merge"
          exit 1

# Runs charly's own gates on every push and pull request: the Go gates (`go`) and the
# generated-artifact drift gates (`drift`).
#
# Until this existed, `release-binary.yml` was the repo's ONLY workflow: it builds the binary
# and asserts `charly version`, so a compile break is caught but a failing test is not. Nothing
# ran `go test`, which means a red suite on `main` would sit unnoticed until someone happened to
# run it locally — and local runs are exactly where environment noise lives (a long $TMPDIR
# breaks every go-plugin test with a misleading handshake error; uninitialized submodules break
# the fixture tests). A clean runner is the honest arbiter.
#
# `charly/` resolves through the workspace, so go.work must be ON here and the submodules must be
# checked out — spec and sdk are `use`d by go.work and the box/* fixtures are read by tests.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: charly/go.mod
          cache-dependency-path: charly/go.sum

      # A short TMPDIR is load-bearing, not hygiene: go-plugin serves each plugin over a UNIX
      # socket at $TMPDIR/plugin<random digits> and sun_path caps the whole path at 107 bytes.
      # Over budget, bind() returns EINVAL and the loader blames the plugin's architecture or
      # libraries instead. The runner default is already short; setting it explicitly keeps the
      # job independent of that.
      - name: Test
        env:
          TMPDIR: /tmp/charly-ci
          GOTMPDIR: /tmp/charly-ci
        run: |
          mkdir -p /tmp/charly-ci
          go test ./charly/...

      - name: gofmt
        run: |
          out=$(gofmt -l charly candy tools)
          if [ -n "$out" ]; then
            echo "gofmt would rewrite these files:" >&2
            echo "$out" >&2
            exit 1
          fi

  # Two halves of this repo are GENERATED and committed: the marketplace/harness surface
  # (plugins/, .claude/, CLAUDE.md, AGENTS.md) and the docs site's reference half (docs/),
  # both projected from the candies' own entities. Each generator already ships a
  # fail-closed no-op gate, and until this job existed NOTHING invoked either — `git grep
  # 'skills:drift\|docs:drift'` over Taskfile.yml, taskfiles/, .github/ and .claude/
  # returned nothing at all. The cost was measured, not hypothetical: a regeneration
  # reverted ~1188 lines across 33 artifacts, most of them plugins-side legs of PRs whose
  # source legs never landed, and no gate ran to notice.
  #
  # The grading lives in scripts/drift-baseline.sh and is invoked FROM THE TASKFILES, so CI
  # and a developer's local run are the same code path rather than two implementations that
  # drift apart. Each gate fails on NEW drift and merely reports the debt it inherited; see
  # that script for why the baselines can only shrink.
  #
  # Both targets read the submodules they regenerate into, so the checkout is recursive; at
  # the gitlink each submodule is exactly the tree the PR claims, which is what makes the
  # comparison honest. Neither generator touches the network beyond the Go module cache —
  # both walk the filesystem (sdk/candywalk) rather than resolving @github imports.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: charly/go.mod
          cache-dependency-path: charly/go.sum

      # Installing the release tarball is how this project already installs go-task
      # everywhere else (the debian/ubuntu candy bootstraps, the rendered Containerfile).
      - name: Install go-task
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          TASK_URL="https://github.com/go-task/task/releases/latest/download/task_linux_amd64.tar.gz"
          curl -fsSL "$TASK_URL" | tar -xzf - -C "$RUNNER_TEMP/bin" task
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Both gates connect an out-of-process plugin, so the `go` job's short-TMPDIR
      # rationale applies verbatim. It stays PER-STEP rather than hoisted to job-level
      # `env:` on purpose: a job-level TMPDIR is already set while actions/checkout and
      # setup-go run, and those are Node actions that resolve os.tmpdir() before anything
      # has created the directory.
      - name: Marketplace / harness drift
        env:
          TMPDIR: /tmp/charly-ci
          GOTMPDIR: /tmp/charly-ci
        run: |
          mkdir -p /tmp/charly-ci
          task skills:drift

      # docs:drift regenerates INTO docs/ and grades the resulting diff, so this step
      # mutates the checkout — it runs last, and !cancelled() keeps it reporting even when
      # the step above already failed. Both verdicts in one run beats discovering the
      # second on the next push.
      - name: Docs-site drift
        if: ${{ !cancelled() }}
        env:
          TMPDIR: /tmp/charly-ci
          GOTMPDIR: /tmp/charly-ci
        run: |
          mkdir -p /tmp/charly-ci
          task docs:drift

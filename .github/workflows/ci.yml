# Runs charly's own Go gates on every push and pull request.
#
# Until this existed, `release-binary.yml` was the repo's ONLY workflow: it builds the binary
# and asserts `charly version`, so a compile break is caught but a failing test is not. Nothing
# ran `go test`, which means a red suite on `main` would sit unnoticed until someone happened to
# run it locally — and local runs are exactly where environment noise lives (a long $TMPDIR
# breaks every go-plugin test with a misleading handshake error; uninitialized submodules break
# the fixture tests). A clean runner is the honest arbiter.
#
# `charly/` resolves through the workspace, so go.work must be ON here and the submodules must be
# checked out — the box/* fixtures are read by tests (the sdk + spec contract modules resolve from
# the module proxy at the pinned require versions in every go.mod; neither is a workspace member).
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # The org's self-hosted fleet (label `opencharly`, host `no`) runs this instead of a
    # GitHub-hosted runner, whose queue can stall a run indefinitely: a hosted run sat
    # `queued` for >15 min and never started, and because the org-required `validate /
    # validate` gate waits for the head's check-runs to settle and then fails after 600 s,
    # that queue reds the required check on an otherwise-PASSing PR (charly#806). The
    # hosted runner remains the fallback, so an unset variable degrades to today's behaviour.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: charly/go.mod
          cache-dependency-path: charly/go.sum

      # A short TMPDIR is load-bearing, not hygiene: go-plugin serves each plugin over a UNIX
      # socket at $TMPDIR/plugin<random digits> and sun_path caps the whole path at 107 bytes.
      # Over budget, bind() returns EINVAL and the loader blames the plugin's architecture or
      # libraries instead. The runner default is already short; setting it explicitly keeps the
      # job independent of that.
      - name: Test
        env:
          TMPDIR: /tmp/charly-ci
          GOTMPDIR: /tmp/charly-ci
        run: |
          mkdir -p /tmp/charly-ci
          go test ./charly/...

      # The in-repo modules BESIDE charly/ — the `tools/*` sweep. They are separate
      # modules resolved with GOWORK=off (they are not workspace members), so
      # `go test ./charly/...` never reaches them. That gap is how the shared-pin
      # drift went unnoticed: `tools/gomod-canonical`'s
      # TestContractPinsMatchShared was already FAILING on `main` (the `tools/*`
      # modules sat on an older sdk/spec pin than charly/go.mod) and no CI job ran
      # it. This step runs every tools module, so the gate can no longer rot
      # silently — the same class of hole the golangci-lint step above closes.
      - name: Test tools modules
        # -count=1 defeats Go's test cache for this sweep, and it is load-bearing rather
        # than cosmetic: `tools/gomod-canonical`'s TestContractPinsMatchShared reads files
        # OUTSIDE its own package's input set (../../charly/go.mod as the shared-pin anchor
        # and ../../tools/*/go.mod as the lockstep modules), so a pin move inside
        # charly/go.mod leaves the package's inputs unchanged and the cached PASS stands.
        # Measured: main's own run 37746359346 logged `ok ...gomod-canonical (cached)`
        # while the assertion failed on a fresh evaluation of the same tree (charly#836).
        run: |
          set -e
          fail=0
          for d in tools/*/; do
            [ -f "$d/go.mod" ] || continue
            echo "== $d =="
            ( cd "$d" && GOWORK=off go test -count=1 ./... ) || fail=1
          done
          exit $fail

      - name: gofmt
        run: |
          out=$(gofmt -l charly tools)
          if [ -n "$out" ]; then
            echo "gofmt would rewrite these files:" >&2
            echo "$out" >&2
            exit 1
          fi

      # golangci-lint in CI. The committed local git gate (carried ONLY by the
      # umbrella `opencharly/opencharly` and installed per clone by `charly task
      # hooks`) runs it too, so `main` does not accumulate lint debt between
      # commits. Pinned by module version rather than an action so the CI and local
      # binaries are the same build, and so a new upstream release cannot turn `main` red on
      # its own schedule.
      #
      # Config selection is CWD-based: golangci-lint walks UP from $PWD and never
      # descends into the target dirs, so `charly`'s curated config is found ONLY
      # with cwd inside `charly/` — hence the `cd`. Running `run ./charly/...` from
      # the repo root silently selects the root baseline config and never runs the
      # curated set at all (charly#767).
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          ( cd charly && "$(go env GOPATH)/bin/golangci-lint" run ./... )
          # The tools/* modules are separate GOWORK=off modules, so the charly
          # invocation above never reaches them — the same detection hole the
          # `Test tools modules` step closes for tests. Each runs the root baseline
          # config, selected by its own cwd.
          fail=0
          for d in tools/*/; do
            [ -f "$d/go.mod" ] || continue
            echo "== lint $d =="
            ( cd "$d" && GOWORK=off "$(go env GOPATH)/bin/golangci-lint" run ./... ) || fail=1
          done
          exit $fail

      # NOTE: the former "opencode gate plugin contract" step (which ran
      # `node scripts/check-opencode-plugin.mjs` against this repo's own
      # `.opencode/plugins/`) is DELETED: charly carries NO harness config any
      # more (umbrella AGENTS.md Part II rule 5 — harness config lives ONLY in
      # opencharly/opencharly). The gate now runs there, against that repo's
      # plugin.

# The pin-currency control — the gate that stops a BEHIND pin reaching main.
#
# WHAT IT ASKS. `charly task pin-current` asks whether every `box/*` gitlink is at the
# tip of the branch its own `.gitmodules` entry declares, and a pin that is BEHIND
# FAILS. There is no neglect bound and no age: the old 168 h bound was deleted, so the
# strict failure replaces the argued one. It consults no tag — currency is a branch
# question, and a tag marks a merge, not the served tip a gitlink should record. The
# remedy is `charly task ff`.
#
# WHY THERE IS NO SCHEDULE. The umbrella's strict pin gate is the org-wide detector of
# a drift that happened with no PR at all, and a daily red job here would be a second
# detector of something no change in this repo caused — exactly what teaches readers to
# ignore this one. The pull_request trigger answers the owner while the change is still
# open, which is what this workflow is for.
#
# WHY fetch-depth: 0 IS LOAD-BEARING. The currency read asks `git merge-base
# --is-ancestor` whether the recorded pin is an ancestor of the branch's served tip,
# and that question needs the two commits' common history. The checkout action's
# default depth is 1, which cannot answer it: the read would report the pin as
# unjudgeable on a healthy tree — a false red that teaches everyone to ignore the gate.
name: pin-currency

on:
  pull_request:
    paths:
      - 'charly.yml'
      - '.gitmodules'
      - 'box/**'
      - 'charly/go.mod'
      - '.github/workflows/pin-currency.yml'
      # The control's OWN proof lives in this script, so a change to it is a change
      # to the control's gate and must re-run it. Without it in the trigger, the
      # proof could be weakened in a PR that never runs it.
      - 'scripts/check-pin-current.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-currency:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # The full history, for the reason in the header: the currency read asks an
          # ancestry question (`git merge-base --is-ancestor`) between the recorded pin
          # and the branch's served tip, and a depth-1 clone cannot answer it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: charly/go.mod
          cache-dependency-path: charly/go.sum

      # R9: the control runs the worktree-local, CalVer-stamped binary built from this
      # tree — never a shared install, and never a released binary that could carry a
      # different plugin-task pin than the one this tree declares.
      - name: Build the worktree-local binary (R9)
        run: ./scripts/bootstrap-charly.sh

      - name: The control's own proof — a behind pin must go red, the tip must pass
        run: ./bin/charly task pin-current-proof

      - name: The control — every box/* pin at the tip of the branch its intent names (a behind pin FAILS)
        run: ./bin/charly task pin-current

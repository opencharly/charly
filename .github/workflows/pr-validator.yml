# ORG-WIDE PR-VALIDATOR DISPATCHER — installed in every opencharly repo.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # The review's B18 ground rule requires the Go gates to be green on the head
  # before it passes. Every push starts this workflow and the ci (go) gate at
  # the same moment, and the review (~2 min) finishes before the go gate
  # (~5 min) — so a fresh-head review always sees in-progress CI and
  # self-blocks, and each blocked run leaves a red validate check that later
  # re-runs treat as a failed project gate. Wait for the head's `go` check-run
  # conclusion before invoking the review; the dispatched re-run path gets the
  # same guarantee.
  wait-ci:
    name: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the go gate on the head
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            const head = pr.head.sha;
            const deadline = Date.now() + 19 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: runs } = await github.rest.checks.listForRef({
                ...context.repo, ref: head,
              });
              const go = runs.check_runs.find((r) => r.name === 'go');
              if (go && go.conclusion) {
                console.log(`go gate on ${head.slice(0, 8)}: ${go.conclusion}`);
                if (go.conclusion === 'success') process.exit(0);
                core.setFailed(`go gate ${go.conclusion} on ${head.slice(0, 8)}`);
              }
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setFailed(`go gate did not conclude on ${head.slice(0, 8)} within 19m`);
  validate:
    name: validate
    needs: wait-ci
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.fork == false
    uses: opencharly/.github/.github/workflows/pr-validator.yml@main
    with:
      pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
      ai_review_provider: ${{ vars.AI_REVIEW_PROVIDER }}
      ai_review_model: ${{ vars.AI_REVIEW_MODEL }}
      ai_review_base_url: ${{ vars.AI_REVIEW_BASE_URL }}
    secrets: inherit

# Build the CalVer-stamped `charly` binary + the 12 welded command plugins for
# amd64, arm64 AND armv7 and attach them to the GitHub release on a v<CalVer>
# tag push. armv7 is the 32-bit appliance target (a JetKVM's uClibc armv7l
# userland, older 32-bit SBCs); it builds because of the sdk 32-bit fix
# (opencharly/sdk#263).
#
# tag-on-merge creates release tags via the REST API (git.createRef), which does
# NOT emit a push event — and auto-merge squash merges (actor app/github-actions)
# fire ZERO workflow runs at all — so `push: tags` / `push: branches` alone never
# fire for merged PRs and the release binary silently lags main's schema (the
# 2026.244 release-lag RCA). This workflow chains off tag-on-merge completion
# (workflow_run — the ONE trigger whose event delivery is proven): it builds the
# newest v* tag and uploads when that tag's release does not exist yet. The binary
# is stamped with the TAG's CalVer so the distro repos' `charly version` ==
# packaged-version assertion holds.
#
# This is the BINARY source the per-distro package repos consume: each distro
# workflow (opencharly/charly-{alpine,arch,fedora,ubuntu,debian,openwrt})
# downloads `charly-linux-<arch>` + `charly-plugins-linux-<arch>.tar.gz` +
# `charly-candy-charly.yml` for the version it is asked to package, then runs the
# `charly generate-packages` plugin (nFPM) to build the native packages. The
# `charly-candy-charly.yml` asset is packaging/charly.yml — the
# `packaging:` section is the SINGLE source of truth for package metadata + the
# per-variant plugin sets.
#
# Every binary is built with `-ldflags "-s -w"`. Go emits DWARF + a full symbol
# table by default; for `charly` + its welded plugins that is ~47% of each
# native package's compressed size, so an unstripped set pushes a distro repo
# artifact over GitHub Pages' 1 GB limit (charly-arch measured 1.19 GB). `-s -w`
# omits the symbol table + DWARF; Go's own pclntab (what panic tracebacks and
# `go version -m` read) is unaffected, so `charly version`, stack traces, and
# the arm64 `go version -m` build-info assertion below all still work.
#
# Pure Go cross-compilation (CGO_ENABLED=0), so this runs on a stock
# ubuntu-latest runner — no distro-native tooling, no self-hosted host. The
# amd64 binary is built FIRST and used to regenerate each plugin's `.providers`
# manifest (`charly __plugin-providers <candy-dir>`); the arm64 `.providers`
# files are COPIED from amd64 (the manifests are arch-independent word lists —
# the arm64 binary cannot run on the amd64 runner to regenerate them).
#
# `workflow_dispatch` runs the build from a branch (the release-upload step is
# tag-guarded), so the build can be exercised without minting a tag.
#
# The binary's CalVer stamp is the RELEASE TAG's CalVer on a tag push (a binary
# from release v<X> must report X — the distro repos' install-test asserts
# `charly version` == the packaged version), falling back to the HEAD commit's
# date (calver.sh) on a manual dispatch. Stamping from the commit date instead
# is wrong: the pr-validator computes the tag name just before the squash merge,
# so a merge that crosses a minute boundary leaves the commit dated tag+1min and
# every binary built from it reports a version that matches no release.
name: release-binary

on:
  push:
    tags:
      - 'v*'
  # tag-on-merge is the ONE reliable post-merge trigger: auto-merge squash merges
  # fire zero workflow runs, and API-created tags emit no push event. Chaining off
  # its completion means every merged PR's tag gets its release build.
  workflow_run:
    workflows: ["tag-on-merge"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve the release tag + CalVer (tag push, tag-on-merge completion, or manual dispatch)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "CALVER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            # tag-on-merge created tags via the API (no push event — auto-merge squash
            # merges fire ZERO workflow runs). Build the NEWEST v* tag WITHOUT a release
            # (a newer released tag — e.g. a manual release — must not shadow the
            # unreleased tag-on-merge tags).
            for TAG in $(git tag -l 'v*' --sort=-v:refname); do
              if ! gh release view "$TAG" >/dev/null 2>&1; then
                RELEASE_TAG="$TAG"
                echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
                echo "CALVER=${TAG#v}" >> "$GITHUB_ENV"
                git checkout "$TAG"
                break
              fi
            done
            if [[ -z "$RELEASE_TAG" ]]; then
              echo "No unreleased v* tag — skipping."
              echo "SKIP=true" >> "$GITHUB_ENV"
            fi
          else
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
            echo "CALVER=$(bash scripts/calver.sh)" >> "$GITHUB_ENV"
          fi
      - name: Build amd64 charly (native)
        if: env.SKIP != 'true'
        run: |
          cd charly && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -ldflags "-s -w -X main.BuildCalVer=${CALVER}" -o ../bin/charly-linux-amd64 .
      - name: Build the 12 welded plugins for amd64 + .providers
        if: env.SKIP != 'true'
        run: |
          mkdir -p bin/plugins .plugin-src
          while read -r spec; do case "$spec" in ''|\#*) continue;; esac
            p="${spec%@*}"; ref="${spec#*@}"
            [ "$p" != "$ref" ] || { echo "host-command-plugins.txt: '$spec' is not <name>@<tag>" >&2; exit 1; }
            # Each welded plugin lives in its OWN repo since the candy de-submodule
            # cutover; clone it at its pinned tag and build the candy from there.
            git clone --quiet --depth 1 --branch "$ref" "https://github.com/opencharly/$p.git" ".plugin-src/$p"
            d=".plugin-src/$p/candy/$p"
            t="."; [ -d "$d/cmd/serve" ] && t="./cmd/serve"
            ( cd "$d" && GOWORK=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/plugins/$p" "$t" )
            ./bin/charly-linux-amd64 __plugin-providers "$d" > "bin/plugins/$p.providers"
          done < scripts/host-command-plugins.txt
          tar -czf charly-plugins-linux-amd64.tar.gz -C bin/plugins .
      - name: Build arm64 charly (cross-compile)
        if: env.SKIP != 'true'
        run: |
          cd charly && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -buildvcs=false -ldflags "-s -w -X main.BuildCalVer=${CALVER}" -o ../bin/charly-linux-arm64 .
      - name: Build the 12 welded plugins for arm64 (copy amd64 .providers)
        if: env.SKIP != 'true'
        run: |
          mkdir -p bin/plugins-arm64
          while read -r spec; do case "$spec" in ''|\#*) continue;; esac
            p="${spec%@*}"
            # The amd64 step already cloned each repo at its pin into .plugin-src; reuse
            # that checkout so both arches build the SAME commit, not two resolutions.
            d=".plugin-src/$p/candy/$p"
            t="."; [ -d "$d/cmd/serve" ] && t="./cmd/serve"
            ( cd "$d" && GOWORK=off GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/plugins-arm64/$p" "$t" )
            cp "bin/plugins/$p.providers" "bin/plugins-arm64/$p.providers"
          done < scripts/host-command-plugins.txt
          tar -czf charly-plugins-linux-arm64.tar.gz -C bin/plugins-arm64 .
      # armv7 — the 32-bit appliance target (a JetKVM's uClibc armv7l userland,
      # and any older 32-bit SBC). It builds because sdk/buildkit's
      # Statfs_t.Bsize type is correct for 32-bit targets (opencharly/sdk#263).
      # Like arm64, the binary cannot execute on the amd64 runner, so its stamp
      # is verified via `go version -m` rather than a runtime `version` call.
      - name: Build armv7 charly (cross-compile)
        if: env.SKIP != 'true'
        run: |
          cd charly && GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -buildvcs=false -ldflags "-s -w -X main.BuildCalVer=${CALVER}" -o ../bin/charly-linux-armv7 .
      - name: Build the 12 welded plugins for armv7 (copy amd64 .providers)
        if: env.SKIP != 'true'
        run: |
          mkdir -p bin/plugins-armv7
          while read -r spec; do case "$spec" in ''|\#*) continue;; esac
            p="${spec%@*}"
            # Reuse the amd64 step's clone so every arch builds the SAME commit.
            d=".plugin-src/$p/candy/$p"
            t="."; [ -d "$d/cmd/serve" ] && t="./cmd/serve"
            ( cd "$d" && GOWORK=off GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/plugins-armv7/$p" "$t" )
            cp "bin/plugins/$p.providers" "bin/plugins-armv7/$p.providers"
          done < scripts/host-command-plugins.txt
          tar -czf charly-plugins-linux-armv7.tar.gz -C bin/plugins-armv7 .
      - name: Stage the charly candy's charly.yml (the packaging source)
        if: env.SKIP != 'true'
        run: cp packaging/charly.yml charly-candy-charly.yml
      - name: Verify the built binaries report the CalVer
        if: env.SKIP != 'true'
        run: |
          test "$(./bin/charly-linux-amd64 version)" = "$CALVER"
          # The arm64 binary is an aarch64 ELF and CANNOT execute on the amd64
          # runner ("Exec format error", exit 126), so its stamp is verified via
          # the embedded build info instead of a runtime `version` call — the
          # -ldflags "-X main.BuildCalVer=…" build setting is recorded in the
          # binary's module build info and read back by `go version -m`.
          go version -m bin/charly-linux-arm64 | grep -q "main.BuildCalVer=${CALVER}"
          go version -m bin/charly-linux-armv7 | grep -q "main.BuildCalVer=${CALVER}"
      - name: Verify the built binaries are stripped (no symbol table / DWARF)
        if: env.SKIP != 'true'
        run: |
          # Coverage for the -ldflags "-s -w" build flags above: fail if any
          # produced binary still carries a symbol table or DWARF. Without the
          # flags `file` reports ", with debug_info, not stripped" and
          # `readelf -S` lists .debug_* sections, so this step goes red — the
          # stripping is proven, not assumed.
          fail=0
          for b in bin/charly-linux-amd64 bin/charly-linux-arm64 bin/charly-linux-armv7 bin/plugins/* bin/plugins-arm64/* bin/plugins-armv7/*; do
            case "$b" in *.providers) continue ;; esac
            [ -f "$b" ] || continue
            if file "$b" | grep -q 'not stripped'; then
              echo "::error file=$b::$b is not stripped (symbol table present)"; fail=1
            fi
            if readelf -S "$b" 2>/dev/null | grep -q '\.debug_'; then
              echo "::error file=$b::$b carries DWARF (.debug_* sections)"; fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All release binaries are stripped (no symbol table, no DWARF)."
      - if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            bin/charly-linux-amd64
            bin/charly-linux-arm64
            bin/charly-linux-armv7
            charly-plugins-linux-amd64.tar.gz
            charly-plugins-linux-arm64.tar.gz
            charly-plugins-linux-armv7.tar.gz
            charly-candy-charly.yml

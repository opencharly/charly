# Build the CalVer-stamped `charly` binary + the 9 welded command plugins for
# amd64 AND arm64 and attach them to the GitHub release on a v<CalVer> tag push.
#
# This is the BINARY source the per-distro package repos consume: each distro
# workflow (opencharly/charly-{alpine,arch,fedora,ubuntu,debian,openwrt})
# downloads `charly-linux-<arch>` + `charly-plugins-linux-<arch>.tar.gz` +
# `charly-candy-charly.yml` for the version it is asked to package, then runs the
# `charly generate-packages` plugin (nFPM) to build the native packages. The
# `charly-candy-charly.yml` asset is the charly candy's charly.yml — the
# `packaging:` section is the SINGLE source of truth for package metadata + the
# per-variant plugin sets.
#
# Pure Go cross-compilation (CGO_ENABLED=0), so this runs on a stock
# ubuntu-latest runner — no distro-native tooling, no self-hosted host. The
# amd64 binary is built FIRST and used to regenerate each plugin's `.providers`
# manifest (`charly __plugin-providers <candy-dir>`); the arm64 `.providers`
# files are COPIED from amd64 (the manifests are arch-independent word lists —
# the arm64 binary cannot run on the amd64 runner to regenerate them).
#
# `workflow_dispatch` runs the build from a branch (the release-upload step is
# tag-guarded), so the build can be exercised without minting a tag.
#
# The binary's CalVer stamp is the RELEASE TAG's CalVer on a tag push (a binary
# from release v<X> must report X — the distro repos' install-test asserts
# `charly version` == the packaged version), falling back to the HEAD commit's
# date (calver.sh) on a manual dispatch. Stamping from the commit date instead
# is wrong: the pr-validator computes the tag name just before the squash merge,
# so a merge that crosses a minute boundary leaves the commit dated tag+1min and
# every binary built from it reports a version that matches no release.
name: release-binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Compute the CalVer (release tag on a tag push, else the HEAD commit)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "CALVER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CALVER=$(bash scripts/calver.sh)" >> "$GITHUB_ENV"
          fi
      - name: Build amd64 charly (native)
        run: |
          cd charly && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -ldflags "-X main.BuildCalVer=${CALVER}" -o ../bin/charly-linux-amd64 .
      - name: Build the 9 welded plugins for amd64 + .providers
        run: |
          mkdir -p bin/plugins
          while read -r p; do case "$p" in ''|\#*) continue;; esac
            t="."; [ -d "candy/$p/cmd/serve" ] && t="./cmd/serve"
            ( cd "candy/$p" && GOWORK=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "../../bin/plugins/$p" "$t" )
            ./bin/charly-linux-amd64 __plugin-providers "candy/$p" > "bin/plugins/$p.providers"
          done < scripts/host-command-plugins.txt
          tar -czf charly-plugins-linux-amd64.tar.gz -C bin/plugins .
      - name: Build arm64 charly (cross-compile)
        run: |
          cd charly && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -buildvcs=false -ldflags "-X main.BuildCalVer=${CALVER}" -o ../bin/charly-linux-arm64 .
      - name: Build the 9 welded plugins for arm64 (copy amd64 .providers)
        run: |
          mkdir -p bin/plugins-arm64
          while read -r p; do case "$p" in ''|\#*) continue;; esac
            t="."; [ -d "candy/$p/cmd/serve" ] && t="./cmd/serve"
            ( cd "candy/$p" && GOWORK=off GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "../../bin/plugins-arm64/$p" "$t" )
            cp "bin/plugins/$p.providers" "bin/plugins-arm64/$p.providers"
          done < scripts/host-command-plugins.txt
          tar -czf charly-plugins-linux-arm64.tar.gz -C bin/plugins-arm64 .
      - name: Stage the charly candy's charly.yml (the packaging source)
        run: cp candy/charly/charly.yml charly-candy-charly.yml
      - name: Verify the built binaries report the CalVer
        run: |
          test "$(./bin/charly-linux-amd64 version)" = "$CALVER"
          # The arm64 binary is an aarch64 ELF and CANNOT execute on the amd64
          # runner ("Exec format error", exit 126), so its stamp is verified via
          # the embedded build info instead of a runtime `version` call — the
          # -ldflags "-X main.BuildCalVer=…" build setting is recorded in the
          # binary's module build info and read back by `go version -m`.
          go version -m bin/charly-linux-arm64 | grep -q "main.BuildCalVer=${CALVER}"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/charly-linux-amd64
            bin/charly-linux-arm64
            charly-plugins-linux-amd64.tar.gz
            charly-plugins-linux-arm64.tar.gz
            charly-candy-charly.yml

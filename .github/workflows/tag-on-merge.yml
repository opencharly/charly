# ORG-WIDE TAG-ON-MERGE DISPATCHER — installed in every opencharly repo.
name: tag-on-merge

# Event-driven PRIMARY with a coarse cron BACKSTOP (RCA of all previous trigger
# designs, measured in this repo across 8 merges and 17 schedule runs):
#
# 1. `on: push` / `on: pull_request: [closed]` CANNOT see auto-merge merges.
#    Native-auto-merge squash merges (actor `app/github-actions`) fire their
#    webhook events — they are visible in the public event stream, e.g.
#    `21:35:01Z sha=e222762 by=github-actions[bot]` for PR #8 — but GitHub
#    Actions creates ZERO workflow runs for them (API-confirmed: no run for
#    any merge commit, and 0 `pull_request`-event runs in the workflow's
#    whole history). This is platform-level run suppression for auto-merge
#    commits; no trigger selection can observe them. (Human merges and
#    bot contents-API commits DO create runs — hence `push` is kept as a
#    secondary trigger for those paths.)
# 2. `schedule` cron: GitHub cron delivery is best-effort with no SLA, so it is
#    NOT a primary trigger — measured 21-44 min gaps (never the configured 15),
#    PR #3's tag 4+ hours late, PR #7's tag still missing 30 min after merge.
#    It is kept at a deliberately coarse cadence as a BACKSTOP only: when the
#    primary path below misses a merge, the recovery must not wait for the next
#    validator completion in that repo, which on a quiet repo can be days.
# 3. `workflow_run` on `charly/pr-validator`: the ONE trigger whose event
#    delivery is proven (the 12:12-12:51Z 8/22 runs all received the event;
#    they died at startup on a workflow-file issue, not on delivery).
#
# The pr-validator run is the last actor before the merge (its final step
# arms native auto-merge). Firing on its completion and waiting (bounded) for
# the squash to land makes the MERGE the effective gate for tagging. The org
# reusable sweep is idempotent and scans the last 24h of merged PRs.
#
# ⚑ THE BOUND IS SIZED TO THE MEASURED AUTO-MERGE LATENCY, and that is an RCA
# rather than a guess. A 5-minute bound with a single-shot sweep missed
# charly-registry#12, whose PASS completed at 20:54:18Z and whose merge landed
# at 21:01:59Z — 7m41s, one minute past the bound — so the run fell through,
# swept before the merge existed, and reported SUCCESS while doing nothing;
# #10's gap was 3m03s and it tagged. A green run that silently tagged nothing
# is the worst shape of this defect, so the bound now carries margin over the
# slowest observed case, and the backstop above recovers what it still misses.
on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"


permissions:
  contents: write
  pull-requests: read

jobs:
  wait-for-merge:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Wait for triggering PR to merge (bounded readiness probe)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0, node24
        with:
          script: |
            // Push events: the merged PR is already on main — no wait needed.
            // A scheduled backstop run carries no triggering PR either: it exists
            // precisely to sweep for merges the primary path missed.
            if (context.eventName !== 'workflow_run') {
              core.info(`${context.eventName} event — merged PRs are in the sweep window`);
              return;
            }
            const run = context.payload.workflow_run;
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            if (!prs.length) {
              core.info('No open PR for head branch — sweep covers already-merged PRs');
              return;
            }
            const pr = prs[0];
            // Sized to the measured auto-merge latency (see the header): the
            // worst observed PASS->merge gap was 7m41s, against a 5-minute bound
            // that missed it and reported success having tagged nothing.
            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: p } = await github.rest.pulls.get({
                ...context.repo, pull_number: pr.number,
              });
              if (p.merged_at) {
                core.info(`PR #${pr.number} merged at ${p.merged_at} — proceeding to tag`);
                return;
              }
              await new Promise((r) => setTimeout(r, 20 * 1000));
            }
            core.info(`PR #${pr.number} not merged within 20m — sweep still runs; the scheduled backstop and the next validator completion both recover it`);

  tag:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    needs: wait-for-merge
    uses: opencharly/.github/.github/workflows/tag-on-merge.yml@main
    secrets: inherit
# Root config — the ONLY config the 91 `candy/*` modules see.
#
# golangci-lint discovers a config by walking UP from the working directory, and
# `charly/.golangci.yml` is NOT an ancestor of `candy/<name>/`, so before this file
# every candy module ran with "No config file detected" and was gated by nothing.
# A per-module copy would put the same block in 90+ places (R3); one root config
# covers them all, and a module that wants more (candy/plugin-check) keeps its own,
# because the CLOSEST config wins.
#
# `default: standard` is what these modules ALREADY run: golangci-lint with no config
# applies its default standard set (errcheck, govet, ineffassign, staticcheck, unused).
# An earlier revision set `default: none` on the belief that "no config" meant "no
# linting" — it does not, and that silenced 6 live findings across 4 modules. This
# config therefore ADDS gofmt and removes nothing. The eleven quality linters the three
# named module configs use are still deliberately NOT enabled here; that remains a
# separate, measured cutover.
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  settings:
    errcheck:
      # The SAME exclusions charly/sdk/spec already carry. Without them the root config
      # would hold the 91 candy modules to a STRICTER errcheck than core, which is not a
      # gate improvement — it is an inconsistency that happens to fail. A deferred
      # best-effort Close on a response body or a read handle is the idiomatic form;
      # genuinely actionable errors are not excluded.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close

formatters:
  enable:
    - gofmt

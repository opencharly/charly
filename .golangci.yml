# Root config — the ONLY config for every module below this directory: the
# `charly` module and the `tools/*` modules. (The in-repo `candy/*` modules are
# gone — the candy de-submodule cutover moved every plugin candy to its own
# repo — and the counts that used to be spelled out here went stale the moment
# that landed. The scope is expressed STRUCTURALLY now: every `go.mod` under
# this directory, which is what golangci-lint's walk-up discovery resolves to
# for each of them. Two earlier claims are retired with it: "95 modules" (the
# current tree has 6) and the note that `tools/golden-cloudinit` /
# `tools/golden-compile` "do not build" — both build and lint clean now, and
# the `Test tools modules` + tools-lint CI steps keep them that way.)
#
# golangci-lint discovers a config by walking UP from the working directory, so
# this ONE file covers `charly/` and every `tools/*` module — it is an ancestor of
# each. Each module MAY keep its own closer config (the closest wins): `charly/`
# does, because it needs a stricter, explicitly-curated linter set than the
# standard one below.
#
# `default: standard` (errcheck, govet, ineffassign, staticcheck, unused) is the
# baseline for every module below this directory, and this config ADDS gofmt and
# the errcheck exclusions below, and removes nothing. The eleven curated
# quality/idiom linters are NOT enabled here — they are enabled in
# `charly/.golangci.yml`, the module's own closer config, which wins for
# `charly/`; the `tools/*` modules run this baseline alone. Enforcing both in CI
# is what the `ci.yml` golangci-lint step does, for `charly/` and now for the
# `tools/*` modules as well.
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  settings:
    errcheck:
      # The SAME exclusions the charly core module already carries. Without them the root config
      # would hold the 91 candy modules to a STRICTER errcheck than core, which is not a
      # gate improvement — it is an inconsistency that happens to fail. A deferred
      # best-effort Close on a response body or a read handle is the idiomatic form;
      # genuinely actionable errors are not excluded.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close

formatters:
  enable:
    - gofmt

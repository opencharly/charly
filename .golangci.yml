# Root config — the ONLY config the 91 `candy/*` modules see.
#
# golangci-lint discovers a config by walking UP from the working directory, and
# `charly/.golangci.yml` is NOT an ancestor of `candy/<name>/`, so before this file
# every candy module ran with "No config file detected" and was gated by nothing.
# A per-module copy would put the same block in 90+ places (R3); one root config
# covers them all, and a module that wants more (candy/plugin-check) keeps its own,
# because the CLOSEST config wins.
#
# Deliberately formatters-only. Enabling the quality linters here would gate 91
# modules on rules they have never been checked against in one step; that is a
# separate, measured cutover. This closes the formatting hole and nothing else —
# measured: 91/91 modules green with this config, so it turns nothing red today.
version: "2"

run:
  timeout: 10m

linters:
  default: none

formatters:
  enable:
    - gofmt

# Root config — the baseline for the `tools/*` modules, each of which resolves to
# this file. (The in-repo `candy/*` modules are gone — the candy de-submodule
# cutover moved every plugin candy to its own repo — and the counts that used to
# be spelled out here went stale the moment that landed. Two earlier claims are
# retired with it: "95 modules" (the current tree has 6) and the note that
# `tools/golden-cloudinit` / `tools/golden-compile` "do not build" — both build and
# lint clean now, and the `Test tools modules` + tools-lint CI steps keep them that
# way.)
#
# golangci-lint resolves ONE config by walking UP from the working directory — it
# does NOT descend into the target dirs. So a config governs a module only when
# that module (or an ancestor of it) IS the working directory. This file therefore
# covers every `tools/*` module (each runs with its own root as cwd) but NOT
# `charly/`, which carries its OWN stricter, explicitly-curated config at
# `charly/.golangci.yml`. That curated config is selected only when `charly/` is
# the cwd — `cd charly && golangci-lint run ./...` — which is exactly what the
# `ci.yml` golangci-lint step and the committed local git gate do. Invoking
# `run ./charly/...` from the repo root would instead silently select THIS baseline
# and never run the curated set at all (charly#767).
#
# `default: standard` (errcheck, govet, ineffassign, staticcheck, unused) plus the
# gofmt formatter and the errcheck exclusions below is the baseline every `tools/*`
# module runs. The curated quality/idiom linters are NOT enabled here — they live in
# `charly/.golangci.yml`, which governs `charly/` alone.
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  settings:
    errcheck:
      # The SAME exclusions `charly/.golangci.yml` carries. Without them this root config
      # would hold the tools/* modules to a STRICTER errcheck than charly, which is not a
      # gate improvement — it is an inconsistency that happens to fail. A deferred
      # best-effort Close on a response body or a read handle is the idiomatic form;
      # genuinely actionable errors are not excluded.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close

formatters:
  enable:
    - gofmt

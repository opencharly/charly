agentteams-cli:
    candy:
        version: 2026.224.0600
        description: |-
            The shared AgentTeams CLI tooling — the agt REST client built from the
            pinned AgentTeams v1.2.2 source and the mc MinIO client extracted from
            the higress mc image. Shared by the agentteams-manager and
            agentteams-worker images (R3: one build, two consumers). The pinned
            source tarball is left at /opt/agentteams-src for the consuming
            candies (the manager installs its agent trees + configs, the worker
            installs the shared protocol libs); each consumer removes it after
            use. The agt build is CGO-disabled (a thin REST client, no cgo
            deps), so this candy needs only the golang toolchain.
        require:
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
        extract:
            - source: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/mc:20260216
              path: /usr/bin/mc
              dest: /usr/local/bin/mc
        plan:
            - run: download the pinned AgentTeams v1.2.2 source tarball
              download: "https://github.com/agentscope-ai/AgentTeams/archive/refs/tags/v1.2.2.tar.gz"
              extract: tar.gz
              strip_components: 1
              to: /opt/agentteams-src
            - run: build the agt REST client from source
              command: |
                  cd /opt/agentteams-src/agentteams-controller
                  CGO_ENABLED=0 go build -o /usr/local/bin/agt ./cmd/agt/
              cache:
                  - /root/go/pkg/mod
                  - /root/.cache/go-build
            - check: the agt REST client binary is built
              file:
                file: /usr/local/bin/agt
                exists: true
                filetype: file
            - check: the mc client binary is extracted
              file:
                file: /usr/local/bin/mc
                exists: true
                filetype: file

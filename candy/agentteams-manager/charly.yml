agentteams-manager:
    candy:
        version: 2026.223.1500
        description: |-
            The AgentTeams Manager agent image — the openclaw gateway runtime the
            controller spawns for every Manager CR. Builds openclaw from the pinned
            upstream source commit (2026.4.14) because the matrix channel extension
            is NOT in the npm openclaw package and the published @openclaw/matrix
            npm package is broken (its openclaw.extensions entry references
            ./index.ts, which the tarball does not ship) — the source build is the
            only complete, version-matched path, and it is what the upstream
            manager image does. The openclaw build uses the JS pnpm
            (npm install -g pnpm@10.32.1, matching the repo's packageManager
            pin) because openclaw's scripts/pnpm-runner.mjs re-execs pnpm via
            `node $npm_execpath` — the nodejs candy's standalone ELF pnpm would
            be loaded as JS and fail. The build also re-enables npm git deps
            (npm_config_allow_git=all): the runtime-postbuild stages the bundled
            plugins' runtime deps with a bare `npm install`, and baileys depends
            on libsignal from a git URL — npm 11+ disables git deps by default
            (EALLOWGIT), while upstream's NodeSource node 22 (npm 10) has no
            such gate. Extracts mc from the higress mc image,
            builds the agt REST client from the pinned AgentTeams source, and
            installs the manager agent trees + configs. The charly-owned
            start-manager.sh waits
            for the controller's in-container services (reachable at the rewritten
            URLs through the controller container on the charly network), syncs
            the manager workspace from MinIO, renders openclaw.json from the
            template, and execs the openclaw gateway. The controller passes
            HOME=/root/manager-workspace (hardcoded upstream) and the upstream
            agent trees hardcode /root/agentteams-fs + /root/manager-workspace
            paths, so the image chmods /root to 755 (traversable by uid 1000)
            and pre-creates /root/manager-workspace, /root/agentteams-fs and
            /root/.openclaw uid-1000-writable at build time. Rootless: the service
            runs as the image user (uid 1000).
        require:
            - nodejs
            - golang
        distro:
            arch:
                package:
                    - git
                    - python
                    - make
                    - gcc
                    - gettext
                    - jq
        extract:
            - source: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/mc:20260216
              path: /usr/bin/mc
              dest: /usr/local/bin/mc
        service:
            - name: agentteams-manager
              exec: /opt/agentteams-manager/start-manager.sh
              priority: 800
              working_directory: /
        plan:
            - run: build openclaw from the pinned upstream source commit (cached)
              command: |
                  OPENCLAW_CACHE=/var/cache/charly-openclaw
                  if [ ! -f "${OPENCLAW_CACHE}/.charly-openclaw-complete" ]; then
                      # The cache mount root is a mount point and cannot be removed
                      # (rm -rf on it fails with EBUSY), so build into a subdirectory
                      # and clear a partial previous build by removing that subdir.
                      rm -rf "${OPENCLAW_CACHE}/src"
                      mkdir -p "${OPENCLAW_CACHE}/src"
                      cd "${OPENCLAW_CACHE}/src"
                      git init .
                      git remote add origin https://github.com/higress-group/openclaw.git
                      git fetch --depth 1 origin 2f35b6fa6b65d012e3b0c9f24af3f8a4b617a6e0
                      git checkout --detach FETCH_HEAD
                      # The openclaw build's scripts/pnpm-runner.mjs re-execs pnpm
                      # via `node $npm_execpath` when npm_execpath's basename
                      # matches pnpm. The nodejs candy's standalone pnpm is a
                      # self-contained ELF binary (it bundles its own node), so
                      # `node <elf>` fails with a SyntaxError. Upstream's
                      # openclaw-base installs pnpm via `npm install -g pnpm`
                      # (the JS pnpm.cjs), which is what the runner expects —
                      # match upstream, and put the JS pnpm first on PATH.
                      npm install -g pnpm@10.32.1
                      export PATH="/root/.npm-global/bin:${PATH}"
                      # The openclaw build's runtime-postbuild stages the bundled
                      # plugins' runtime deps with a bare `npm install` (no
                      # --allow-git), and @whiskeysockets/baileys depends on
                      # libsignal from a git URL. npm 11+ disables git deps by
                      # default (allow-git=none → EALLOWGIT); upstream's
                      # openclaw-base builds on NodeSource node 22 (npm 10),
                      # which has no such gate. Re-enable git deps for this
                      # trusted pinned-source build.
                      export npm_config_allow_git=all
                      pnpm install
                      pnpm build
                      pnpm ui:build
                      # The matrix channel's crypto backend is a native addon the
                      # build may not ship for this arch — fetch it if missing.
                      MSC_DIR="${OPENCLAW_CACHE}/src/node_modules/@matrix-org/matrix-sdk-crypto-nodejs"
                      MSC_VER=$(jq -r .version "${MSC_DIR}/package.json")
                      MSC_FILE=matrix-sdk-crypto.linux-x64-gnu.node
                      if [ ! -f "${MSC_DIR}/${MSC_FILE}" ]; then
                          curl -fsSL --retry 3 --retry-delay 2 \
                              "https://github.com/matrix-org/matrix-rust-sdk-crypto-nodejs/releases/download/v${MSC_VER}/${MSC_FILE}" \
                              -o "${MSC_DIR}/${MSC_FILE}"
                      fi
                      touch "${OPENCLAW_CACHE}/.charly-openclaw-complete"
                  fi
                  cp -a "${OPENCLAW_CACHE}/src/." /opt/openclaw/
                  chmod +x /opt/openclaw/openclaw.mjs
                  ln -sf /opt/openclaw/openclaw.mjs /usr/local/bin/openclaw
              cache:
                  - /var/cache/charly-openclaw
            - run: download the pinned AgentTeams v1.2.2 source tarball
              download: "https://github.com/agentscope-ai/AgentTeams/archive/refs/tags/v1.2.2.tar.gz"
              extract: tar.gz
              strip_components: 1
              to: /opt/agentteams-src
            - run: build the agt REST client from source
              command: |
                  cd /opt/agentteams-src/agentteams-controller
                  CGO_ENABLED=0 go build -o /usr/local/bin/agt ./cmd/agt/
              cache:
                  - /root/go/pkg/mod
                  - /root/.cache/go-build
            - run: install the manager agent trees and configs
              command: |
                  mkdir -p /opt/agentteams/agent /opt/agentteams/configs
                  cp -a /opt/agentteams-src/manager/agent/. /opt/agentteams/agent/
                  cp -a /opt/agentteams-src/manager/configs/. /opt/agentteams/configs/
                  rm -rf /opt/agentteams-src
            - run: pre-create the rootless manager runtime directories
              command: |
                  # The controller passes HOME=/root/manager-workspace (hardcoded
                  # upstream, written for a root container) and the upstream agent
                  # trees hardcode /root/agentteams-fs + /root/manager-workspace
                  # paths. The manager runs as the image user (uid 1000), so /root
                  # (mode 750 root:root in the cachyos base) must be traversable —
                  # chmod 755 grants traverse+read to uid 1000 — and the runtime
                  # dirs themselves are uid-1000-writable.
                  chmod 755 /root
                  mkdir -p /root/manager-workspace /root/agentteams-fs /root/.openclaw
                  chown -R 1000:1000 /root/manager-workspace /root/agentteams-fs /root/.openclaw
            - run: write the rootless manager start script
              write: /opt/agentteams-manager/start-manager.sh
              mode: "0755"
              content: |
                  #!/bin/bash
                  # start-manager.sh — charly-owned rootless AgentTeams manager
                  # launcher. The controller spawns this container with the manager
                  # env (gateway key, matrix token, cluster defaults with the
                  # embedded URL rewrite applied). This script waits for the
                  # controller's in-container services (reachable at the rewritten
                  # URLs through the controller container on the charly network),
                  # syncs the manager workspace from MinIO, renders openclaw.json
                  # from the charly-owned template, and execs the openclaw gateway.
                  set -e

                  log() { echo "[agentteams-manager $(date '+%Y-%m-%d %H:%M:%S')] $1"; }

                  # --- Wait for the controller's in-container services ---
                  # The controller rewrites MatrixURL/FSEndpoint/AIGatewayURL to its
                  # own container name on the charly network; the manager reaches
                  # them through the controller container.
                  wait_http() {
                      local name="$1" url="$2" tries="${3:-180}"
                      local i=0
                      until curl -fsS -o /dev/null "${url}" 2>/dev/null; do
                          i=$((i + 1))
                          if [ "${i}" -ge "${tries}" ]; then
                              log "ERROR: ${name} not reachable at ${url} after ${tries}s"
                              return 1
                          fi
                          sleep 1
                      done
                      log "${name} reachable at ${url}"
                  }

                  wait_http "Matrix" "${AGENTTEAMS_MATRIX_URL}/_matrix/client/versions" 180
                  wait_http "MinIO" "${AGENTTEAMS_FS_ENDPOINT}/minio/health/live" 180
                  wait_http "AI Gateway" "${AGENTTEAMS_AI_GATEWAY_URL}/" 180

                  # --- Manager credentials (injected by the controller) ---
                  : "${AGENTTEAMS_MANAGER_GATEWAY_KEY:?AGENTTEAMS_MANAGER_GATEWAY_KEY is required}"
                  : "${AGENTTEAMS_MANAGER_MATRIX_TOKEN:?AGENTTEAMS_MANAGER_MATRIX_TOKEN is required}"

                  # --- Sync the manager workspace from MinIO (best-effort; the
                  # controller's initializer creates the OSS structure, the manager
                  # workspace may be empty at first boot) ---
                  if [ -n "${AGENTTEAMS_FS_ACCESS_KEY:-}" ] && [ -n "${AGENTTEAMS_FS_SECRET_KEY:-}" ]; then
                      mc alias set agentteams "${AGENTTEAMS_FS_ENDPOINT}" "${AGENTTEAMS_FS_ACCESS_KEY}" "${AGENTTEAMS_FS_SECRET_KEY}" >/dev/null 2>&1 || true
                      mc mirror "${AGENTTEAMS_STORAGE_PREFIX}/manager/" /root/manager-workspace/ --overwrite >/dev/null 2>&1 || true
                  fi

                  # --- E2EE: convert AGENTTEAMS_MATRIX_E2EE to a JSON boolean ---
                  if [ "${AGENTTEAMS_MATRIX_E2EE:-0}" = "1" ] || [ "${AGENTTEAMS_MATRIX_E2EE:-}" = "true" ]; then
                      export MATRIX_E2EE_ENABLED=true
                  else
                      export MATRIX_E2EE_ENABLED=false
                  fi

                  # --- Render openclaw.json from the charly-owned template ---
                  export MANAGER_GATEWAY_KEY="${AGENTTEAMS_MANAGER_GATEWAY_KEY}"
                  export MANAGER_MATRIX_TOKEN="${AGENTTEAMS_MANAGER_MATRIX_TOKEN}"
                  envsubst < /opt/agentteams/configs/manager-openclaw.json.tmpl > /root/manager-workspace/openclaw.json

                  # --- Point openclaw at the rendered config ---
                  export OPENCLAW_CONFIG_PATH="/root/manager-workspace/openclaw.json"
                  mkdir -p "${HOME}/.openclaw"
                  ln -sf "/root/manager-workspace/openclaw.json" "${HOME}/.openclaw/openclaw.json"
                  export OPENCLAW_NO_RESPAWN=1

                  exec openclaw gateway run --verbose --force
            - check: the openclaw gateway binary is installed
              file:
                file: /usr/local/bin/openclaw
                exists: true
                filetype: file
            - check: the matrix channel extension is present
              file:
                file: /opt/openclaw/extensions/matrix
                exists: true
                filetype: directory
            - check: the agt REST client binary is built
              file:
                file: /usr/local/bin/agt
                exists: true
                filetype: file
            - check: the manager agent trees and configs are installed
              file:
                file: /opt/agentteams/configs/manager-openclaw.json.tmpl
                exists: true
            - check: the manager runtime directories are uid-1000-writable and /root is traversable
              command: '[ -d /root/manager-workspace ] && [ "$(stat -c %u /root/manager-workspace)" = "1000" ] && [ "$(stat -c %a /root)" = "755" ]'

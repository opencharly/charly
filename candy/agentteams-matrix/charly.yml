agentteams-matrix:
    candy:
        version: 2026.223.1436
        description: |-
            The AgentTeams Matrix homeserver — the Tuwunel static binary (a conduwuit
            fork, matrix-construct/tuwunel) extracted from the higress/tuwunel:20260216
            image, running as a supervisord service on :6167 with the CONDUWUIT_*
            environment the AgentTeams controller expects (registration token, room
            lifecycle cleanup, displayname suffix off). Rootless: runs as the image
            user (uid 1000) against the ~/.agentteams/matrix volume. The start script
            is charly-owned (written by this candy), not an upstream AgentTeams script.
        extract:
            - source: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/tuwunel:20260216
              path: /usr/bin/tuwunel
              dest: /usr/local/bin/tuwunel
        env_accept:
            - name: AGENTTEAMS_MATRIX_DOMAIN
              description: "Matrix server name (default: matrix-local.agentteams.io:8080). Pass via: charly config agentteams -e AGENTTEAMS_MATRIX_DOMAIN=<domain>"
            - name: AGENTTEAMS_REGISTRATION_TOKEN
              description: "Matrix registration token the controller uses to create worker/human accounts"
        volume:
            - name: agentteams-matrix
              path: "~/.agentteams/matrix"
        port:
            - 6167
        service:
            - name: tuwunel
              exec: /opt/agentteams-matrix/start-tuwunel.sh
              priority: 100
              user: "1000"
              enable: true
        plan:
            - run: "create the matrix volume directory under the image user's home (venue-agnostic: ${HOME} resolves to the container home on a pod, the guest home on a VM)"
              mkdir: "${HOME}/.agentteams/matrix"
              run_as: "${USER}"
            - run: write the rootless tuwunel start script
              write: /opt/agentteams-matrix/start-tuwunel.sh
              mode: "0755"
              content: |
                  #!/bin/bash
                  # start-tuwunel.sh — charly-owned rootless Tuwunel (conduwuit fork)
                  # launcher. Projects the AgentTeams env onto the CONDUWUIT_* vars the
                  # homeserver expects, then execs tuwunel. Self-provisions the
                  # registration token: when unset, a random one is generated and
                  # persisted on the ~/.agentteams/matrix volume so the controller
                  # reads the same value.
                  set -e

                  mkdir -p "${HOME}/.agentteams/matrix"

                  # Self-provision: tuwunel rejects an empty registration token when
                  # registration is allowed. When unset, generate a random one and
                  # persist it on the durable volume (rootless: the ~/.agentteams/matrix
                  # dir is uid-1000-owned). A deploy that sets
                  # AGENTTEAMS_REGISTRATION_TOKEN wins.
                  REGISTRATION_TOKEN="${AGENTTEAMS_REGISTRATION_TOKEN:-}"
                  if [ -z "${REGISTRATION_TOKEN}" ]; then
                      if [ -f "${HOME}/.agentteams/matrix/.registration-token" ]; then
                          REGISTRATION_TOKEN="$(cat "${HOME}/.agentteams/matrix/.registration-token")"
                      else
                          REGISTRATION_TOKEN="$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 24)"
                          echo "${REGISTRATION_TOKEN}" > "${HOME}/.agentteams/matrix/.registration-token"
                      fi
                  fi

                  export CONDUWUIT_SERVER_NAME="${AGENTTEAMS_MATRIX_DOMAIN:-matrix-local.agentteams.io:8080}"
                  export CONDUWUIT_DATABASE_PATH="${HOME}/.agentteams/matrix"
                  export CONDUWUIT_ADDRESS="0.0.0.0"
                  export CONDUWUIT_PORT=6167
                  export CONDUWUIT_ALLOW_REGISTRATION=true
                  export CONDUWUIT_REGISTRATION_TOKEN="${REGISTRATION_TOKEN}"
                  export CONDUWUIT_ALLOW_LEGACY_MEDIA=true
                  export CONDUWUIT_ALLOW_UNSTABLE_ROOM_VERSIONS=true
                  export CONDUWUIT_DB_POOL_WORKERS_LIMIT=32
                  # Disable Tuwunel's default new-user displayname suffix ("💕") so
                  # Matrix profiles match the AgentTeams worker/human/manager names.
                  export CONDUWUIT_NEW_USER_DISPLAYNAME_SUFFIX="${CONDUWUIT_NEW_USER_DISPLAYNAME_SUFFIX:-}"
                  # Increase default cache capacity to prevent RocksDB thrashing.
                  export CONDUWUIT_CACHE_CAPACITY_MODIFIER="${CONDUWUIT_CACHE_CAPACITY_MODIFIER:-2.0}"
                  # Agent lifecycle cleanup: collapse rooms once their last local member
                  # leaves and force a /forget on leave so a recreated same-named
                  # worker/manager/human starts from a clean room state.
                  export CONDUWUIT_DELETE_ROOMS_AFTER_LEAVE="${CONDUWUIT_DELETE_ROOMS_AFTER_LEAVE:-true}"
                  export CONDUWUIT_FORGET_FORCED_UPON_LEAVE="${CONDUWUIT_FORGET_FORCED_UPON_LEAVE:-true}"

                  exec tuwunel
            - check: the tuwunel binary is extracted
              file:
                file: /usr/local/bin/tuwunel
                exists: true
            - check: the Matrix homeserver answers the client versions endpoint
              timeout: 30s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:6167}/_matrix/client/versions"
                status: 200
            - check: the tuwunel service is running
              context:
                - runtime
              service:
                service: tuwunel
                running: true
            - check: the registration token is resolvable (env or self-provisioned file)
              context:
                - runtime
              command: '[ -n "$AGENTTEAMS_REGISTRATION_TOKEN" ] || [ -f "$HOME/.agentteams/matrix/.registration-token" ]'

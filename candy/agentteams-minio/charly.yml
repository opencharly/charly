agentteams-minio:
    candy:
        version: 2026.223.1436
        description: |-
            MinIO object storage for AgentTeams — the minio + mc binaries extracted
            from the higress/minio:20260216 and higress/mc:20260216 images, with the
            minio server (S3 API :9000, console :9001) and the mc-mirror storage
            initializer (bucket creation + agentteams-config mirror) as supervisord
            services. Rootless: both run as the image user (uid 1000) against the
            ~/.agentteams/minio volume. The service start scripts are charly-owned
            (written by this candy), not upstream AgentTeams scripts.
        extract:
            - source: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/minio:20260216
              path: /usr/bin/minio
              dest: /usr/local/bin/minio
            - source: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/mc:20260216
              path: /usr/bin/mc
              dest: /usr/local/bin/mc
        env_accept:
            - name: AGENTTEAMS_MINIO_USER
              description: "MinIO root user (default: admin). Pass via: charly config agentteams -e AGENTTEAMS_MINIO_USER=<user>"
            - name: AGENTTEAMS_MINIO_PASSWORD
              description: "MinIO root password (default: admin). Pass via: charly config agentteams -e AGENTTEAMS_MINIO_PASSWORD=<pass>"
            - name: AGENTTEAMS_ADMIN_USER
              description: "AgentTeams admin user, also used as the MinIO root user when AGENTTEAMS_MINIO_USER is unset"
            - name: AGENTTEAMS_ADMIN_PASSWORD
              description: "AgentTeams admin password, also used as the MinIO root password when AGENTTEAMS_MINIO_PASSWORD is unset"
        volume:
            - name: agentteams-minio
              path: "~/.agentteams/minio"
        port:
            - 9000
            - 9001
        service:
            - name: minio
              exec: /opt/agentteams-minio/start-minio.sh
              priority: 50
              user: "1000"
              enable: true
            - name: mc-mirror
              exec: /opt/agentteams-minio/start-mc-mirror.sh
              priority: 700
              user: "1000"
              enable: true
              env:
                AGENTTEAMS_MC_MIRROR_SCOPE: controller
        plan:
            - run: "create the minio volume directory under the image user's home (venue-agnostic: ${HOME} resolves to the container home on a pod, the guest home on a VM)"
              mkdir: "${HOME}/.agentteams/minio"
              run_as: "${USER}"
            - run: write the rootless minio start script
              write: /opt/agentteams-minio/start-minio.sh
              mode: "0755"
              content: |
                  #!/bin/bash
                  # start-minio.sh — charly-owned rootless minio launcher. Resolves
                  # the MinIO root credentials from the AgentTeams env (AGENTTEAMS_MINIO_*
                  # with AGENTTEAMS_ADMIN_* fallback); when no password is provided, a
                  # random one is generated and persisted on the ~/.agentteams/minio
                  # volume so the controller and mc-mirror read the same value. Then
                  # execs minio.
                  set -e

                  MINIO_ROOT_USER="${AGENTTEAMS_MINIO_USER:-${AGENTTEAMS_ADMIN_USER:-admin}}"
                  MINIO_ROOT_PASSWORD="${AGENTTEAMS_MINIO_PASSWORD:-${AGENTTEAMS_ADMIN_PASSWORD:-}}"

                  mkdir -p "${HOME}/.agentteams/minio"

                  # Self-provision: minio rejects a root password shorter than 8 chars,
                  # so the bare "admin" fallback is invalid. When unset, generate a
                  # random one and persist it on the durable volume (rootless: the
                  # ~/.agentteams/minio dir is uid-1000-owned). A deploy that sets
                  # AGENTTEAMS_MINIO_PASSWORD wins.
                  if [ -z "${MINIO_ROOT_PASSWORD}" ]; then
                      if [ -f "${HOME}/.agentteams/minio/.root-password" ]; then
                          MINIO_ROOT_PASSWORD="$(cat "${HOME}/.agentteams/minio/.root-password")"
                      else
                          MINIO_ROOT_PASSWORD="$(head -c 16 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 16)"
                          echo "${MINIO_ROOT_PASSWORD}" > "${HOME}/.agentteams/minio/.root-password"
                      fi
                  fi

                  export MINIO_ROOT_USER
                  export MINIO_ROOT_PASSWORD

                  exec minio server "${HOME}/.agentteams/minio" --console-address ":9001" --address ":9000"
            - run: write the rootless mc-mirror start script
              write: /opt/agentteams-minio/start-mc-mirror.sh
              mode: "0755"
              content: |
                  #!/bin/bash
                  # start-mc-mirror.sh — charly-owned rootless MinIO storage initializer
                  # + agentteams-config mirror. Waits for the minio service, configures
                  # the mc alias, creates the default bucket + placeholder dirs, then
                  # mirrors agentteams-config from MinIO to the local FS root every 10s
                  # (the controller watches that dir via fsnotify). Controller scope.
                  set -e

                  log() { echo "[agentteams $(date '+%Y-%m-%d %H:%M:%S')] $1"; }

                  # MinIO S3 URL: explicit, or cluster FS endpoint, or in-process minio.
                  # (Port 8080 is the Higress gateway, never the S3 API.)
                  MINIO_S3_URL="${AGENTTEAMS_MINIO_S3_URL:-${AGENTTEAMS_FS_ENDPOINT:-${AGENTTEAMS_MINIO_ENDPOINT:-http://127.0.0.1:9000}}}"
                  MINIO_S3_URL="${MINIO_S3_URL//:8080/:9000}"

                  # Resolve the same root credentials start-minio.sh uses: env wins,
                  # else the self-provisioned password persisted on the minio volume
                  # (minio runs at priority 50, so the file exists by the time this
                  # service starts at priority 700).
                  MINIO_ROOT_USER="${AGENTTEAMS_MINIO_USER:-${AGENTTEAMS_ADMIN_USER:-admin}}"
                  MINIO_ROOT_PASSWORD="${AGENTTEAMS_MINIO_PASSWORD:-${AGENTTEAMS_ADMIN_PASSWORD:-}}"
                  if [ -z "${MINIO_ROOT_PASSWORD}" ] && [ -f "${HOME}/.agentteams/minio/.root-password" ]; then
                      MINIO_ROOT_PASSWORD="$(cat "${HOME}/.agentteams/minio/.root-password")"
                  fi

                  # Configure the mc alias (direct S3, not the Higress gateway).
                  mc alias set agentteams "${MINIO_S3_URL}" \
                      "${MINIO_ROOT_USER}" \
                      "${MINIO_ROOT_PASSWORD}"

                  # Wait for MinIO to accept requests (probe via mc ls on the alias root).
                  elapsed=0
                  while ! mc ls agentteams/ > /dev/null 2>&1; do
                      sleep 2
                      elapsed=$((elapsed + 2))
                      if [ "${elapsed}" -ge 120 ]; then
                          log "ERROR: MinIO did not become available within 120s at ${MINIO_S3_URL}"
                          exit 1
                      fi
                  done
                  log "MinIO is ready (took ${elapsed}s)"

                  # Create the default bucket.
                  mc mb agentteams/agentteams-storage --ignore-existing

                  # Initialize placeholder dirs for shared data, worker artifacts, and
                  # the declarative agentteams-config control-plane state.
                  for dir in shared/knowledge shared/tasks workers; do
                      echo "" | mc pipe "agentteams/agentteams-storage/${dir}/.gitkeep" 2>/dev/null || true
                  done
                  for dir in agentteams-config/workers agentteams-config/teams agentteams-config/humans; do
                      echo "" | mc pipe "agentteams/agentteams-storage/${dir}/.gitkeep" 2>/dev/null || true
                  done

                  # Local mirror root (rootless: under the image user's home, not /root).
                  AGENTTEAMS_FS_ROOT="${AGENTTEAMS_FS_ROOT:-${HOME}/agentteams-fs}"
                  mkdir -p "${AGENTTEAMS_FS_ROOT}/agentteams-config"

                  # Initial mirror of the control-plane config.
                  mc mirror "agentteams/agentteams-storage/agentteams-config/" "${AGENTTEAMS_FS_ROOT}/agentteams-config/" --overwrite

                  # Signal that initialization is complete.
                  touch "${AGENTTEAMS_FS_ROOT}/.initialized"
                  log "MinIO storage initialized (controller scope) at ${AGENTTEAMS_FS_ROOT}/"

                  # agentteams-config mirror: 10-second interval for the control-plane
                  # config (CRD YAML files). The controller watches this directory via
                  # fsnotify to trigger reconcile.
                  while true; do
                      sleep 10
                      mc mirror "agentteams/agentteams-storage/agentteams-config/" "${AGENTTEAMS_FS_ROOT}/agentteams-config/" --overwrite --remove --newer-than "15s" 2>/dev/null || true
                  done
            - check: the minio server binary is extracted
              file:
                file: /usr/local/bin/minio
                exists: true
            - check: the mc client binary is extracted
              file:
                file: /usr/local/bin/mc
                exists: true
            - check: the minio S3 API answers its health probe
              timeout: 30s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:9000}/minio/health/live"
                status: 200
            - check: the minio service is running
              context:
                - runtime
              service:
                service: minio
                running: true
            - check: the mc-mirror service is running
              context:
                - runtime
              service:
                service: mc-mirror
                running: true
            - check: the minio root password is resolvable (env or self-provisioned file)
              context:
                - runtime
              command: '[ -n "$AGENTTEAMS_MINIO_PASSWORD" ] || [ -n "$AGENTTEAMS_ADMIN_PASSWORD" ] || [ -f "$HOME/.agentteams/minio/.root-password" ]'
            - check: the mc-mirror storage initialization completed
              context:
                - runtime
              command: '[ -f "$HOME/agentteams-fs/.initialized" ] || [ -f "$AGENTTEAMS_FS_ROOT/.initialized" ]'

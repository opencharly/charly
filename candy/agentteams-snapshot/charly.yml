agentteams-snapshot:
    candy:
        version: 2026.224.0600
        description: |-
            The Replicator's snapshot tool — the charly toolchain (candy/charly)
            carried into a deployment so the Replicator worker can run `charly
            agentteams snapshot --out <bundle>` (the PII-redacted hydration
            bundle) and `charly agentteams apply -f <bundle>` (hydrate) in-venue.
            The snapshot/hydrate cores live in the compiled-in
            candy/plugin-agentteams (the SAME surface the host-side `agentteams:`
            verb methods use — R3); this candy only pre-stages the charly binary
            that carries them. Composed into agentteams-worker so the Replicator
            carries it.
        candy:
            - charly
        plan:
            # The charly-binary presence check is NOT duplicated here — candy/charly's
            # own plan already bakes it (R3). This candy's plan covers only what the
            # snapshot tool adds: the `charly agentteams snapshot` command surface.
            # Depth-2 help is probed (not depth-1): the host intercepts a depth-1
            # `charly agentteams --help` with a generic out-of-process-plugin stub
            # that never enumerates subcommands, so it cannot prove the snapshot
            # command exists.
            - check: the agentteams snapshot command is registered
              exit_status: 0
              stdout:
                - contains: snapshot
              command: charly agentteams snapshot --help

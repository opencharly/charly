blogwatcher:
    candy:
        version: 2026.144.1443
        description: |
            Blog/RSS feed monitor CLI installed from source via go install
            Installs the blogwatcher cobra CLI (github.com/Hyaxia/blogwatcher)
            with `go install`, landing the binary at ${HOME}/go/bin/blogwatcher
            (GOPATH=~/go, with ~/go/bin appended to PATH). The install is
            verifiable without the network: the binary is present and
            executable, and `blogwatcher --help` runs (exit 0) and lists its
            feed-management subcommands (add, scan, blogs, articles, read).
        require:
            - golang
        env:
            GOPATH: "~/go"
        path_append:
            - "~/go/bin"
        plan:
            - run: |
                command=go install github.com/Hyaxia/blogwatcher/cmd/blogwatcher@latest
                go clean -cache
              run_as: "${USER}"
              command: |
                go install github.com/Hyaxia/blogwatcher/cmd/blogwatcher@latest
                go clean -cache
            - check: the blogwatcher binary is installed at ~/go/bin/blogwatcher
              file:
                file: ${HOME}/go/bin/blogwatcher
                exists: true
            - check: running blogwatcher --help exits 0 and lists the scan subcommand
              exit_status: 0
              stdout:
                - contains: scan
              command: "${HOME}/go/bin/blogwatcher --help 2>&1"
            - check: command=test -x ${HOME}/go/bin/blogwatcher
              id: blogwatcher-binary-executable
              exit_status: 0
              command: "test -x ${HOME}/go/bin/blogwatcher"
            - check: command=${HOME}/go/bin/blogwatcher --help 2>&1
              id: blogwatcher-cli-help
              exit_status: 0
              stdout:
                - contains: scan
                - contains: blogs
              command: "${HOME}/go/bin/blogwatcher --help 2>&1"

blogwatcher-skill:
    skill:
        name: blogwatcher
        family: tools
        owner: blogwatcher
        description: |-
            Blog/RSS feed monitor CLI.
            Use when working with the blogwatcher candy.
        content: |
            # blogwatcher -- Blog/RSS feed monitor
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (`run:` step) |
            | Depends | `golang` |
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `GOPATH` | `~/go` |
            | PATH append | `~/go/bin` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [blogwatcher]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:golang` — Required Go runtime parent dependency
            - `/charly-openclaw:openclaw-full` — Metalayer that bundles blogwatcher with other AI/agent CLIs
            
            ## Related Commands
            - `/charly-build:build` — Builds the candy (Go install via a `run:` step)
            - `/charly-core:shell` — Interactive shell to run blogwatcher inside the container
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Blog or RSS feed monitoring
            - Go-based CLI tools for feed watching
            - The `blogwatcher` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

camsnap:
    candy:
        version: 2026.144.1443
        description: |
            RTSP/ONVIF camera snapshot and clip CLI — the `camsnap` binary on $PATH
            Installs the camsnap Go CLI via `go install
            github.com/steipete/camsnap/cmd/camsnap`, landing the binary in the
            user's GOPATH bin (~/go/bin/camsnap). Verifiable end to end: the
            binary exists, is executable, and `go version -m` reports it was built
            from the upstream github.com/steipete/camsnap module.
        require:
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
        env:
            GOPATH: "~/go"
        path_append:
            - "~/go/bin"
        plan:
            - run: |
                command=go install github.com/steipete/camsnap/cmd/camsnap@latest
                go clean -cache
              run_as: "${USER}"
              command: |
                go install github.com/steipete/camsnap/cmd/camsnap@latest
                go clean -cache
            - check: the camsnap binary is installed in the user's GOPATH bin
              file:
                file: ${HOME}/go/bin/camsnap
                exists: true
            - check: the installed camsnap binary is executable
              exit_status: 0
              command: test -x ${HOME}/go/bin/camsnap
            - check: go version -m reports the binary was built from the camsnap module
              exit_status: 0
              stdout:
                - contains: github.com/steipete/camsnap
              command: /usr/bin/go version -m ${HOME}/go/bin/camsnap

camsnap-skill:
    skill:
        name: camsnap
        family: selkies
        owner: camsnap
        description: |-
            RTSP/ONVIF camera snapshot and clip CLI.
            Use when working with the camsnap candy.
        content: |-
            # camsnap -- Camera snapshot CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (a `run:` install step) |
            | Depends | `golang` |
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `GOPATH` | `~/go` |
            | PATH append | `~/go/bin` |
            
            ## Usage
            
            ```yaml
            # a box composing this candy — the candy list is inline
            my-box:
              candy:
                base: fedora
                candy: [camsnap]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:golang` — Required Go runtime parent dependency
            - `/charly-openclaw:openclaw-full` — Metalayer that bundles camsnap with other agent CLIs
            
            ## Related Commands
            - `/charly-build:build` — Builds the candy (Go install via a `command:` run step)
            - `/charly-core:shell` — Interactive shell to run camsnap inside the container
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - RTSP or ONVIF camera snapshots
            - Camera snapshot/clip tools
            - The `camsnap` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, `run:`/`check:` step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

charly-automation:
    candy:
        version: 2026.218.1200
        description: |-
            Concept candy owning the charly-automation skills (tmux/alias/udev/encryption/sidecar/…). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the automation concept candy's skill entities are present and generated into plugins/automation/skills
              id: charly-automation-present
              context:
                - build
              command: "true"

agent-skill:
    skill:
        name: agent
        family: automation
        owner: charly-automation
        description: |-
            Operate and diagnose Charly's daemon-free agent control plane, including sessions, runs, terminal channels, Pi native/orchestrator/TUI modes, tmux compatibility, federation, generic local/deployment/SSH/gRPC routes, transient Charly endpoint replication, incidents, RCA, and recovery. Use whenever a task invokes or modifies `charly agent`, `charly tui`, `charly tmux`, agent MCP tools, or agent target routing.
        content: |
            # Charly agent control

            Use Charly commands as the operational API. Do not replace them with direct container-engine or ad-hoc tmux commands. Filesystem inspection and a debugger are diagnostic fallbacks after Charly's status, logs, transcripts, incidents, and check reports have been collected.

            ## Discover capabilities

            ```bash
            charly agent runtime list
            charly agent runtime status pi --class agent-runtime
            charly agent runtime status tmux --class terminal
            ```

            Runtime names select providers, never transports. The same provider receives a CUE-validated `#TargetSpec` over `Provider.Channel` for every placement.

            ## Sessions and runs

            ```bash
            SESSION=$(charly agent session create pi | jq -r .id)
            charly agent run start "$SESSION" 'review the current changes'
            charly agent session show "$SESSION"
            charly agent run list
            ```

            Use `pi` for the native SDK runner. Set the documented orchestrator environment when compatibility with the separately installed official Pi orchestrator is required; Charly delegates the exact `rpc-stream` byte stream. Use the ordinary `pi` terminal profile with runtime `tmux` when Pi must live inside a persistent terminal. `charly tui` is a client of the same persisted control plane, not a separate runtime.

            ## Generic target routes and endpoint bootstrap

            Targets may be shorthand (`deployment`, `user@host:port::deployment`) or `#TargetSpec` JSON:

            ```bash
            TARGET='{"hops":[{"transport":"ssh","address":"box","user":"agent"},{"transport":"grpc"},{"transport":"tmux"}]}'
            charly agent terminal run pi --target "$TARGET"

            TARGET='{"deployment":"toolbox","hops":[{"transport":"ssh","address":"inner"},{"transport":"grpc"},{"transport":"tmux"}]}'
            charly agent terminal run codex --target "$TARGET"
            ```

            Every accessible deployment or SSH node works whether Charly is installed or not. The controller probes the target, keeps an equal/newer packaged Charly, or replicates its active binary through `kit.EnsureCharlyInDeployVenue` to `/tmp/charly-<hostVer>-<digest8>` and invokes that explicit path. It never changes target PATH and never downgrades a package. This bootstrap repeats recursively at every process/gRPC boundary, so exec, deployment, SSH, gRPC, and tmux compose without pair-specific code.

            ## Typed terminals

            ```bash
            RUN=$(charly agent terminal launch codex --target "$TARGET" | jq -r .run_id)
            charly agent terminal input codex 'inspect the failing test' --target "$TARGET" --run-id "$RUN" --paste
            charly agent terminal key codex enter --target "$TARGET" --run-id "$RUN"
            charly agent terminal snapshot codex --target "$TARGET" --run-id "$RUN"
            charly agent terminal transcript "$RUN"
            charly agent terminal attach codex --target "$TARGET" --run-id "$RUN"
            charly agent terminal close codex --target "$TARGET" --run-id "$RUN"
            ```

            Use `charly tmux` only as the compatibility facade for named shell sessions. It still calls the typed terminal controller and does not construct remote tmux shell commands.

            ## Federation, incidents, RCA, and recovery

            ```bash
            charly agent federation run user@box tmux 'inspect the target' --profile codex
            charly agent federation list
            charly agent incident list
            charly agent incident show INCIDENT_ID
            charly agent rca start INCIDENT_ID
            charly agent rca complete RCA_ID --root-cause 'specific cause' --finding 'evidence-backed finding'
            charly agent recover decide INCIDENT_ID --rca RCA_ID --action operator
            charly agent recover apply @decision.json
            ```

            Never retry an agent failure automatically. Record the incident, collect ordered transcript/channel evidence, complete RCA, and apply an explicit recovery decision. Emergency abort is the only pre-RCA exception and must preserve the unresolved incident.

            ## Diagnostics contract

            - Expect phase/status events such as endpoint bootstrap, `waiting-for-prompt`, `prompt-ready`, running/reattached, settled, and exit.
            - Treat silence, malformed frames, EOF before ACK, cleanup failure, warnings, and unexpected duration as incidents.
            - Use no sleep, polling loop, backoff, or arbitrary timed retry — per the project rulebook R4. Synchronize on process, tmux control, gRPC, terminal, and context events.
            - Preserve stdout for structured command results and use stderr for provider/operation/target progress and actionable failures.
            - For implementation acceptance, run the complete unmodified disposable R10 bed with `charly check run <bed>` and use its per-step logs and summary.

            ## Related skills

            - `/charly-automation:tmux` — terminal-provider and compatibility details.
            - `/charly-check:check` — full R10 workflow.
            - `/charly-internals:go` — provider placement and generated wire contracts.
            - `/charly-internals:root-cause-analyzer` — mandatory failure analysis.

alias-skill:
    skill:
        name: alias
        family: automation
        owner: charly-automation
        description: |-
            MUST be invoked before any work involving: host command aliases, charly alias add/remove/install/uninstall, or wrapper scripts that run inside containers.
        content: |
            # Alias - Command Aliases

            ## Overview

            `charly alias` creates distrobox-style wrapper scripts in `~/.local/bin/` that transparently run commands inside containers. Typing the alias name on the host executes the command inside the container via `charly shell`.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Install defaults | `charly alias install <image>` | Create wrappers from candy/box config |
            | Uninstall all | `charly alias uninstall <image>` | Remove all wrappers for a box |
            | Add manually | `charly alias add <name> <image> [command]` | Create a single wrapper |
            | Remove one | `charly alias remove <name>` | Remove a single wrapper |
            | List all | `charly alias list` | Show all installed aliases |

            ## How It Works

            ```bash
            charly alias install openclaw     # Creates ~/.local/bin/openclaw
            openclaw                      # Runs inside container transparently
            charly alias uninstall openclaw   # Removes wrapper
            ```

            ### Wrapper Script Format

            `charly alias add` / `charly alias install` writes shell scripts to `~/.local/bin/`:

            ```sh
            #!/bin/sh
            # charly-alias
            # image: openclaw
            # command: openclaw
            _charly_q(){ printf "'"; printf '%s' "$1" | sed "s/'/'\\\\''/g"; printf "' "; }
            c="openclaw"; for a in "$@"; do c="$c $(_charly_q "$a")"; done
            exec charly shell openclaw -c "$c"
            ```

            Key details:
            - The `# charly-alias` marker enables safe list/delete scanning
            - `charly alias remove` verifies the marker before deleting
            - The `_charly_q()` helper properly single-quotes each argument (POSIX sh compatible)
            - Arguments are forwarded to `charly shell <image> -c "<command> <args>"`

            ## Declaration

            ### In a candy `charly.yml`

            Candy aliases require both `name` and `command`. In the compact node-form the `alias:` list is inline in the candy's kind value:

            ```yaml
            ollama:
              candy:
                version: 2026.144.1531
                description: Ollama LLM runtime + CLI.
                alias:
                  - name: ollama
                    command: ollama
                  - name: ollama-run
                    command: "ollama run"
            ```

            ### In a box `charly.yml`

            Box-level aliases default `command` to `name` if omitted. Box-level aliases override candy aliases with the same name.

            ```yaml
            my-app:
              candy:
                base: fedora
                alias:
                  - name: myapp          # command defaults to "myapp"
                  - name: myctl
                    command: "myapp ctl"
            ```

            ### Collection

            `CollectImageAliases()` gathers aliases from the box's own candies (in dependency order) plus box-level config. **No base chain traversal** -- aliases are leaf-box specific (unlike volumes).

            Source: `candy/plugin-alias/alias.go` (moved from `charly/alias.go`), `charly/layers.go` (`AliasYAML`, `HasAliases`, `Aliases()`).

            ## Commands

            ### Install All Aliases for a Box

            ```bash
            charly alias install openclaw
            # Created alias: openclaw -> openclaw (in openclaw)
            ```

            Installs all aliases declared in the box's candies and box config.

            ### Uninstall All Aliases for a Box

            ```bash
            charly alias uninstall openclaw
            # Removed alias: openclaw
            ```

            Removes all wrapper scripts that reference the box.

            ### Add a Single Alias

            ```bash
            charly alias add mycommand my-image                   # command = mycommand
            charly alias add mycommand my-image "custom command"   # explicit command
            ```

            ### Remove a Single Alias

            ```bash
            charly alias remove mycommand
            ```

            Only removes if the file contains the `# charly-alias` marker.

            ### List All Aliases

            ```bash
            charly alias list
            # NAME         IMAGE        COMMAND
            # openclaw     openclaw     openclaw
            # ollama       ollama       ollama
            ```

            Scans `~/.local/bin/` for files with the `# charly-alias` marker.

            ## Validation Rules

            - Candy aliases require both `name` and `command`
            - Alias names must match `^[a-zA-Z0-9][a-zA-Z0-9._-]*$`
            - Duplicate alias names within a box are errors
            - Box-level alias `command` defaults to `name` if omitted

            ## Cross-References

            - `/charly-build:pull` -- Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path

            - `/charly-core:shell` -- How aliases execute commands via `charly shell -c`
            - `/charly-image:layer` -- Declaring aliases in charly.yml
            - `/charly-image:image` -- Box-level alias overrides

            ## When to Use This Skill

            **MUST be invoked** when the task involves host command aliases, charly alias commands, or wrapper scripts that run inside containers. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Post-deployment. Use after a service is running to create host command shortcuts.

enc-skill:
    skill:
        name: enc
        family: automation
        owner: charly-automation
        description: |-
            Topic skill for encrypted storage through `charly config`. MUST be invoked for gocryptfs, the `--encrypt` and encrypted-volume flags, config mount/unmount/status/passwd, or Charly encrypted-volume systemd units.
        content: |
            # Enc - Encrypted Storage

            ## Overview

            Encrypted volume backing is configured at deploy time via `charly config --encrypt <volume>`. Gocryptfs-encrypted volumes store sensitive data (credentials, keys, configs) with transparent encryption at rest. The cipher directory lives on disk; the plain directory is mounted on demand. `charly config <image>` handles initialization and mounting during deployment setup. `charly start` mounts encrypted volumes inline before starting the container.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Configure encrypted | `charly config <image> --encrypt <vol>` | Set volume backing to encrypted |
            | Setup (init + mount) | `charly config <image>` | Initialize cipher dirs and mount encrypted volumes |
            | Mount | `charly config mount <image>` | Mount encrypted volumes |
            | Unmount | `charly config unmount <image>` | Unmount encrypted volumes |
            | Status | `charly config status <image>` | Show mount status |
            | Change password | `charly config passwd <image>` | Change encryption password |

            All commands accept `--volume NAME` to target a specific volume (otherwise all encrypted volumes are affected).

            ## Configuration

            Encrypted volumes are configured at deploy time, not build time. Use `charly config --encrypt` to set a candy-declared volume's backing to encrypted:

            ```bash
            # Configure "library" volume as encrypted
            charly config immich --encrypt library

            # Or via canonical syntax
            charly config immich -v library:encrypted

            # Or via env var
            CHARLY_VOLUMES_IMMICH="library:encrypted" charly config immich --password auto
            ```

            This saves to charly.yml:
            ```yaml
            volumes:
              - name: library
                type: encrypted
            ```

            Rules:
            - Volume must be declared in `charly.yml` (or provided as deploy-only with `path:`)
            - `name`: matches a candy volume name, must match `^[a-z0-9]+(-[a-z0-9]+)*$`

            ### Per-Volume Explicit Path

            Each encrypted volume can specify its own storage directory:

            ```bash
            # Explicit per-volume paths (each volume gets its own directory)
            charly config immich-ml \
              --volume library:encrypt:/mnt/nas/immich/library \
              --volume pgdata:encrypt:/mnt/nas/immich/pgdata

            # Canonical syntax
            charly config immich-ml -v library:encrypted:/mnt/nas/immich/library
            ```

            The path is the **direct volume directory** — `cipher/` and `plain/` are created inside it:
            ```
            /mnt/nas/immich/library/
              cipher/    # gocryptfs encrypted data
              plain/     # FUSE mount point
            ```

            Without an explicit path, the global `encrypted_storage_path` is used with an `charly-<image>-<name>` prefix (backward compatible).

            ## Storage Layout

            ### Default (no explicit path)
            ```
            ~/.local/share/charly/encrypted/
              charly-<image>-<name>/
                cipher/    # Encrypted data (always on disk)
                plain/     # Decrypted mount point (mounted on demand)
            ```

            Override base path: `charly settings set encrypted_storage_path /path/to/storage` or `CHARLY_ENCRYPTED_STORAGE_PATH=/path`.

            ## Commands

            ### Setup (charly config)

            ```bash
            charly config my-app --encrypt secrets              # Set volume as encrypted + init + mount
            charly config my-app --password auto                # Auto-generate password
            charly config my-app --password manual              # Prompt for password
            ```

            `charly config <image>` handles both initialization (creating cipher directories) and mounting in a single step. If volumes are already initialized, it mounts them. Password is cached in kernel keyring for multi-volume images.

            ### Mount

            ```bash
            charly config mount my-app                    # Mount all encrypted volumes
            charly config mount my-app --volume secrets   # Mount specific volume
            ```

            Prompts for password (or reuses from keyring). Each volume is mounted inside a transient systemd scope unit (`charly-enc-<image>-<volume>.scope`) via `systemd-run --scope --user`. The plain directory becomes available for container use. Scope units can be listed with `systemctl --user list-units 'charly-enc-*'`.

            ### Unmount

            ```bash
            charly config unmount my-app                    # Unmount all
            charly config unmount my-app --volume secrets   # Unmount specific
            ```

            Unmount calls `fusermount3 -u` then stops the scope unit (`systemctl --user stop charly-enc-<image>-<volume>.scope`) to clean up the gocryptfs daemon.

            ### Status

            ```bash
            charly config status my-app
            # secrets: mounted
            # configs: not mounted
            ```

            ### Change Password

            ```bash
            charly config passwd my-app
            ```

            Changes the gocryptfs password for all encrypted volumes of an image.

            ## Single Password

            When an image has multiple encrypted volumes, `charly config`, `charly config mount`, and `charly start` all use `systemd-ask-password --id=charly-<image>` to cache the passphrase in the kernel keyring. Password is prompted once and reused for all volumes.

            ## Credential lookup — iteration-capable `ssClient`

            **Why iteration matters:** a Secret Service client that looks up credentials
            via the `default` alias **only** (no iteration) fails entirely when that alias
            resolves to a broken or stub collection — commonly seen with KeePassXC's
            FdoSecrets plugin when a previously-exposed database is unloaded. Such a client
            would hang `charly config mount` forever polling for a keyring that can't serve the
            secret, and a quadlet unit with `TimeoutStartSec=0` would wedge in
            `activating (start-pre)` indefinitely.

            The credential store is EXTERNALIZED into the out-of-process `candy/plugin-secrets`
            plugin (the C2 dep-shed; `go-keyring` no longer links into charly's core). The plugin
            ships its own minimal godbus-based Secret Service client
            (`candy/plugin-secrets/secret_service.go`, the `ssClient` type) with a three-step
            iteration in `findItemAcrossCollections`:

            1. Try the collection at the `default` alias (if healthy — skipped if its
               property reads error out).
            2. Try a collection matching the `keyring_collection_label` setting (if
               non-empty — see `/charly-build:settings`). Useful for pinning a specific
               collection by label in multi-database setups.
            3. Try every other healthy collection in listing order.

            Broken collections are skipped with a diagnostic line to stderr:

                charly: skipping broken Secret Service collection <path>: <error>
                charly: Secret Service default alias target <path> is unhealthy; falling back to collection iteration

            The client returns `ErrSSNotFound` if no collection has the credential, and
            `ErrSSAllBroken` if every candidate errored on unlock or search (distinct
            from "credential simply not stored").

            **Call path:**

                KeyringStore.Get
                  → keyringGetViaSSClient
                    → newSSClient()
                    → ssClient.findItemAnyCollection(service, username, preferLabel)
                      → readAlias("default") → health check → candidate
                      → collections() → filter by preferLabel → candidate
                      → collections() → filter healthy, dedup vs already-tried → candidates
                      → for each candidate: unlock → SearchItems({service, username}) → first match wins
                    → ssClient.getSecret(item) → []byte

            **Source:** `candy/plugin-secrets/secret_service.go` (ssClient + findItemAcrossCollections),
            `candy/plugin-secrets/credential_keyring.go` (the `KeyringStore.Get` entry point that
            delegates to ssClient). Covered by the unit tests in
            `candy/plugin-secrets/secret_service_test.go` including default-alias-healthy,
            default-alias-broken-fallback-to-iteration, preferLabel routing, all-broken
            → ErrSSAllBroken, not-found-anywhere → ErrSSNotFound, search/unlock errors,
            and candidate dedup. charly's core reaches them over `verb:credential` (the
            `charly/credential_plugin.go` adapter).

            ## Credential source semantics

            `ResolveCredential` (the core adapter `charly/credential_plugin.go`; the env check + the
            env-less store chain `resolveStoreChain` in `candy/plugin-secrets/store.go`) returns a
            `(value, source)` pair where the source string is one of:

            | Source | Meaning | Caller reaction |
            |---|---|---|
            | `env`         | Resolved from an env var override (e.g. `GOCRYPTFS_PASSWORD`) | Terminal: use the value |
            | `keyring`     | Found in the system keyring via the iteration-capable read path | Terminal: use the value |
            | `config`      | Found in `~/.config/charly/config.yml` (fallback or explicit backend) | Terminal: use the value |
            | `locked`      | Primary backend is present but locked (e.g. keyring not yet unlocked after login) | **Wait** for the unlock — unbounded and event-driven under systemd |
            | `unavailable` | Primary backend probe failed (e.g. ssClient saw every collection error out); fell back to `ConfigFileStore` but the credential isn't stored there either | **Retry on a fixed 5s poll (`EncMountPollPeriod`)** — may be transient at early boot |
            | `default`     | Backend queried successfully and the credential is **not stored anywhere** | **Terminal** — prompt the user interactively or fail with remediation |

            **The critical distinction** is between `default` and `unavailable`: both
            look identical from the ConfigFileStore return value (empty string, nil
            error), but they have opposite recovery semantics. Conflating them — polling
            forever on both — would wedge `charly-<image>.service` under `TimeoutStartSec=0`
            whenever the keyring is broken, so the two are kept distinct.

            **Under systemd (`INVOCATION_ID` set, typical for `ExecStartPre`):**

            - `default` → **fail immediately** with the actionable error built by
              `EncNotStoredError`:

                  encryption passphrase not available for charly/enc/<image>
                  (backend=<backend>, source=<source>). Remediation: run `charly doctor` to
                  check keyring health, store with `charly secrets set charly/enc <image>`,
                  or switch backend with `charly settings set secret_backend config`

            - `locked` → **wait**, event-driven and unbounded, whenever the caller wired an
              unlock waiter — which the systemd path always does (see "Event-driven keyring
              waiting" below). This path has no deadline. With no waiter wired it degrades to
              the bounded retry below.
            - `unavailable` → **retry** up to `EncMountDeadline` (package variable in
              `sdk/deploykit/enc_passphrase.go`, default `2 * time.Minute`, poll period
              `EncMountPollPeriod = 5 * time.Second`). After the deadline elapses, fail
              with a diagnostic listing backend, source, and remediation.
            - `env` / `keyring` / `config` with a non-empty value → return
              immediately.

            **In interactive mode** (no `INVOCATION_ID`), `ResolveEncPassphraseForMount`
            delegates to `ResolveEncPassphrase`, whose last resort is `AskPassword`
            (`sdk/deploykit/enc_probe.go`) — a `systemd-ask-password` prompt.

            Covered by the table tests in `sdk/deploykit/enc_passphrase_test.go` (11 test
            functions, including `default` fails fast, `locked` retries then fails,
            `locked` then succeeds, the three waiter outcomes — value, cancelled context,
            and `default` — `unavailable` stays bounded, success returns immediately, and
            reset is called between retries).

            ## Troubleshooting: broken Secret Service collection

            **Symptom:** `charly config mount <image>` hangs, or a service's `ExecStartPre`
            phase blocks in `activating (start-pre)` state. `journalctl --user -u
            charly-<image>.service` shows lines like:

                charly-<image>[...]: charly: Secret Service default alias target <path> is unhealthy; falling back to collection iteration

            Or `charly doctor` reports:

                [!] Secret Service collections -- N healthy + 1 broken. Broken: /org/freedesktop/secrets/collection/<path>. Healthy: "<label>"
                [!] Keyring index consistency -- <N indexed, <M> missing: charly/enc/<image>...

            **Cause:** KeePassXC's FdoSecrets plugin can advertise a **stub collection**
            (commonly aliased as `default`) whose every DBus method call returns
            `org.freedesktop.Secret.Error.NoSuchObject` or an `Input/output error`. The
            real credentials are in a sibling collection with a different label. This
            pattern has been observed when a KeePassXC database was previously exposed
            via FdoSecrets but later unloaded or renamed, while the collection entry
            lingers in KeePassXC's internal state.

            **Fix (nothing to do on the `charly` side):** `ssClient` iterates past the broken
            collection automatically and finds the credential in the healthy sibling.
            The credential lookup just works. No configuration change needed.

            **Optional cleanup (KeePassXC side):**
            1. Open KeePassXC
            2. Tools → Settings → Secret Service Integration → Exposed Databases
            3. Review the list; remove stale entries
            4. Restart KeePassXC
            5. Re-run `charly doctor` — the "Secret Service collections" check should now
               report "N healthy collection(s)" with no broken count.

            **Pinning a preferred collection:** if your setup has multiple healthy
            collections and you want `charly` to prefer one by label (e.g. to avoid
            iteration overhead), set:

                charly settings set keyring_collection_label "<collection-label>"

            `findItemAnyCollection` will try that label-matched collection after the
            default alias (if healthy) and before untargeted iteration. Environment
            override: `CHARLY_KEYRING_COLLECTION_LABEL`. See `/charly-build:settings` for the full
            runtime-config interface.

            **Diagnostic direct query (busctl):** to check a specific collection by
            path without using charly:

            ```bash
            # List collections
            busctl --user call org.freedesktop.secrets /org/freedesktop/secrets \
                   org.freedesktop.DBus.Properties Get ss \
                   org.freedesktop.Secret.Service Collections

            # Read the default alias target
            busctl --user call org.freedesktop.secrets /org/freedesktop/secrets \
                   org.freedesktop.Secret.Service ReadAlias s default

            # Probe a collection's health (should return Label without error)
            busctl --user call org.freedesktop.secrets <collection-path> \
                   org.freedesktop.DBus.Properties Get ss \
                   org.freedesktop.Secret.Collection Label
            ```

            A healthy collection returns its label; a broken stub returns an I/O error.

            ## Storing the gocryptfs passphrase

            Store an encrypted-volume passphrase explicitly in the active credential store
            (Secret Service when available, config-file fallback otherwise):

            ```bash
            charly secrets set charly/enc my-app <passphrase>
            ```

            To serve credentials from an existing KeePass database, open it in KeePassXC and
            enable the FdoSecrets plugin so its entries appear on the Secret Service bus —
            charly's keyring backend reads them like any other collection. See `/charly-build:secrets`
            for the full credential-store chain (env → Secret Service keyring → config-file
            fallback).

            ## Scope Unit Architecture

            The gocryptfs / `systemd-run --scope` / fusermount3 SHELLING runs OUT of charly's
            core: it is served by the compiled-in `candy/plugin-enc` (verb:enc, C16a). The enc
            leaf in `candy/plugin-pod` prelifts the resolved per-volume plan + passphrase and
            Invokes the plugin's OpExecute; the plugin runs the commands. The runtime behavior
            below is unchanged by that extraction.

            Each encrypted volume is mounted via `systemd-run --scope --user --unit=charly-enc-<image>-<volume> -- gocryptfs -allow_other <cipherdir> <plaindir>`. This creates a transient systemd scope unit that:

            - **Survives container stop/restart** — scope units are independent of the container service's cgroup, so `KillMode=mixed` on service stop does not kill gocryptfs
            - **Keeps mounts browsable on host** — the host user can access `plain/` directories even when the container is stopped
            - **Handles stale scopes** — if a scope persists from a crash, the next mount attempt stops the stale scope and retries
            - **Cleans up on unmount** — `charly config unmount` calls `fusermount3 -u` then `systemctl --user stop charly-enc-<image>-<volume>.scope`. The same teardown is available as a one-shot from the stop verb via `charly stop <image> --unmount` (see `/charly-core:stop`); plain `charly stop` deliberately leaves scopes running because the next start fast-paths through the `charly config mount` short-circuit.

            Scope unit naming: `charly-enc-<image>-<volume>.scope` (e.g., `charly-enc-immich-ml-library.scope`).

            List active scopes: `systemctl --user list-units 'charly-enc-*'`

            ### Why `-allow_other` is Required

            Rootless podman with `--userns=keep-id` creates a two-level user namespace. During container mount setup, crun runs as inner uid 0, which maps through the namespace chain to **host uid 524288** (a subordinate uid), not the FUSE mount owner (uid 1000). FUSE's kernel check rejects access. The `-allow_other` flag bypasses this check, allowing crun to bind-mount from the FUSE filesystem. gocryptfs auto-enables `default_permissions` with `-allow_other`, so kernel UNIX permission checks still apply (0700 dirs restrict access to the mount owner). Confirmed by podman issues #14488, #15314, #16350, #25894.

            ### Host prerequisite: `user_allow_other` in `/etc/fuse.conf`

            Because every mount uses `-allow_other`, the host's `/etc/fuse.conf` MUST contain an active
            `user_allow_other` line — `fusermount3` refuses `-allow_other` for a non-root user without it
            (`option allow_other only allowed if 'user_allow_other' is set`). charly handles this proactively:
            `charly doctor`'s **Encrypted Storage** group checks it (`checkFuseAllowOther`, WARNING + fix hint
            when missing), and the enc leaf **preflights** it before a mount/ensure op
            (`FuseAllowOtherEnabled` in `sdk/deploykit/enc_probe.go`) — failing fast with the exact fix
            (`echo user_allow_other | sudo tee -a /etc/fuse.conf`) instead of the raw `fusermount3` error
            mid-mount. Enable it once per host that runs charly encrypted volumes.

            ## Integration with Runtime

            - **`charly shell`/`charly start` (direct mode)**: resolves volume backing from charly.yml, verifies encrypted volumes are mounted, appends `-v <plain>:<container-path>` flags. `charly start` mounts encrypted volumes inline via systemd-run scopes before starting the container
            - **`charly config` (quadlet mode)**: generates quadlet file with `ExecStartPre=charly config mount <image>` for encrypted services. ExecStartPre creates scope units internally — these are independent of the container service. Whether that unit is started at boot depends on the configured secret backend (see below)
            - **`charly remove --purge`**: removes named volumes
            - **Data provisioning**: `charly config --seed` (default) provisions data from data candies into bind-backed directories after mounting encrypted volumes. Works for both bind and encrypted volume types

            ### Boot Behavior: Which Backend, and Why

            An encrypted deploy's quadlet carries `ExecStartPre=charly config mount <image>`.
            Whether systemd starts that unit at boot is decided by **which secret backend is
            configured** — nothing else:

            | `secret_backend` | what the quadlet gets | at boot |
            |---|---|---|
            | `keyring`, `auto`, unset | `[Install] WantedBy=default.target`, and `[Service] TimeoutStartSec=0` | starts; `ExecStartPre` blocks in the mount until the keyring unlocks, rather than timing out |
            | `config` | no `[Install] WantedBy=` target | does not start; needs an explicit `charly start <image>` |

            `auto` is the default and resolves to the keyring, so the first row is the
            out-of-the-box arrangement with nothing to configure.

            **The gate is the backend name, and the reason is policy rather than capability.**
            `emitInstallSection` (`sdk/deploykit/quadlet.go`) writes `WantedBy=default.target`
            unless `EncryptedMounts && !KeyringBackend`, and `cfg.KeyringBackend` is fed by
            `secretBackendIsKeyring()` (`candy/plugin-deploy-pod/secrets_resolve.go`), which
            tests membership of `{"keyring", "auto", ""}`. That is the branch to read if you
            want to know why a deploy skipped boot.

            It is worth being exact about *why*, because the obvious reading is wrong.
            The `config` backend does **not** need a person: `ConfigFileStore.Get`
            (`candy/plugin-secrets/credential_config.go`) reads `~/.config/charly/config.yml`
            with no prompt and no keyring — strictly *less* human-dependent than Secret
            Service, which waits for a session unlock. So a rule phrased as "start it at boot
            if the passphrase can be obtained unattended" would *grant* autostart to the
            cleartext case and deny it to the encrypted one.

            The exclusion is a **security decision, and it is recorded**: sdk#121 ruled that
            `secret_backend: config` stays supported *with a warning whenever a passphrase is
            stored in cleartext* — a warning that then shipped as code in charly#213
            (`warnCleartextStorage`) — and rejected the capability form on the grounds that
            "it would grant autostart to a deploy whose passphrase sits in cleartext". A
            passphrase in a plaintext file must not be auto-mounted, unattended, at every
            boot. Secret Service qualifies because the key is protected until an operator
            unlocks it, not because it is easier to obtain.

            One wrinkle worth knowing before you trust the source: the only rationale the
            code carries in-line is the comment `emitInstallSection` emits for the excluded
            case — `# Encrypted volumes require 'charly start' (no keyring auto-unlock)` —
            which states the *capability* reading refuted above. The comment is stale; the
            ruling is the authority.

            The mount-time predicate `usesWaitingBackend`
            (`ResolveEncPassphraseForMountWithResolver`, `sdk/deploykit/enc_passphrase.go`)
            tests the **same set**, `{"keyring", "auto", ""}` — but answers a different
            question: *will the resolver wait rather than fail fast?* Same members, different
            meaning, and deduplicating them would merge an autostart policy with a retry
            policy. See task #27.

            **Flow on reboot, unattended case:**
            1. Boot → systemd starts user instance (linger) → quadlet service starts
            2. ExecStartPre → `charly config mount` → keyring locked → the enc leaf RPCs
               `verb:credential await-unlock` to candy/plugin-secrets, which subscribes to
               DBus `PropertiesChanged` signals on Secret Service collections, with a
               30-second backstop re-probe (`awaitSignalBackstop`)
            3. User logs in → PAM unlocks GNOME Keyring / KeePassXC unlocks database
            4. DBus signal fires (or backstop re-probes) → passphrase found → volumes
               mount → container starts
            5. The wait is **unbounded** — charly blocks until the keyring unlocks or
               systemd sends SIGTERM on `systemctl stop`. No arbitrary deadline.

            **Event-driven keyring waiting:** when
            `source=locked` under a waiting-capable backend, the waiter injected into
            `ResolveEncPassphraseForMount` RPCs `verb:credential await-unlock` to
            candy/plugin-secrets — the Secret Service owner since the godbus dep-shed
            (charly's core links no godbus). The plugin subscribes to DBus
            `org.freedesktop.DBus.Properties.PropertiesChanged` signals on the
            `/org/freedesktop/secrets/collection/*` namespace; its wait loop blocks
            on `select { case <-sigCh | case <-backstop | case <-ctx.Done() }` —
            zero CPU cost between events. No polling. The blocking gRPC Invoke survives
            an unbounded wait (go-plugin sets no keepalive/idle timeout on the local
            Unix-socket connection).

            - `awaitSignalBackstop` — safety-net re-probe interval (default
              `30 * time.Second`). Catches unlock events when the Secret Service
              provider does not emit `PropertiesChanged` (KeePassXC's FdoSecrets
              plugin does NOT emit this signal; GNOME Keyring and KDE Wallet do).
              The backstop is what catches the unlock on KeePassXC hosts.
            - `awaitProgressLogInterval` — throttle for periodic "still waiting"
              journal output (default `1 * time.Hour`).
            - SIGTERM cancellation: `ResolveEncPassphraseForMountWithResolver` builds the
              wait ctx via `signal.NotifyContext(…, SIGINT, SIGTERM)` and passes it on the
              Invoke — `systemctl stop` sends SIGTERM, the ctx cancels, gRPC
              propagates the cancellation to the plugin's Invoke, the loop returns
              cleanly, and systemd transitions the unit to `inactive`.
            - If the DBus session bus is unavailable (edge case: linger-based start
              before graphical session), the plugin falls back to backstop-only
              polling at the same `awaitSignalBackstop` cadence — still unbounded,
              still low-resource.

            Source: `candy/plugin-secrets/keyring_unlock_wait.go` (`awaitUnlock`,
            `awaitUnlockLoop`, `awaitUnlockBackstopOnly`, `isCollectionUnlockedSignal`),
            reached via `verb:credential await-unlock`. The waiter is injected by the caller:
            `candy/plugin-pod/enc_cmd.go` (`pluginAwaitKeyringUnlock`) passes it into
            `deploykit.ResolveEncPassphraseForMount`. Core's former
            `pluginCredentialStore.awaitUnlock`/`credentialAwaiter` seam
            (`charly/credential_plugin.go`) is DELETED (K-wave 2 cone CONTESTED — zero
            production callers; the pod enc path carries its own waiter).

            **Bounded retry for `source=unavailable`:** transient
            backend-probe failures (`source=unavailable`) go through `RetryUnavailable`,
            a bounded poll loop with two package-level variables in
            `sdk/deploykit/enc_passphrase.go`:

            - `EncMountDeadline` — total wall-clock cap (default `2 * time.Minute`)
            - `EncMountPollPeriod` — interval between probes (default `5 * time.Second`)

            `source=default` (credential not stored anywhere) is terminal and fails
            immediately with an actionable error — no amount of retrying will conjure
            a credential that was never stored.

            **Crash recovery:** FUSE mounts survive container restarts because scope
            units are independent of the container service cgroup. On restart, the
            `ExecStartPre=charly config mount` step hits the **fast-path short-circuit**:

                All encrypted volumes for <image> already mounted (N/N)

            When every requested volume is already mounted, `pluginEncMount`
            (`candy/plugin-pod/enc_cmd.go`) iterates the mount list once, finds every target
            is live, and returns `nil` **without calling `ResolveEncPassphraseForMount`,
            touching the credential store, or dispatching verb:enc at all**. This means a broken keyring
            backend does NOT block restarts of running services — only fresh mounts
            (e.g., after reboot) need the keyring. If gocryptfs crashes (scope dies),
            the next `charly config mount` or `charly start` detects the stale scope, stops
            it, and remounts fresh — at which point the iteration-capable ssClient
            kicks in.

            ## Pre-start safety check: cipher populated + plain empty

            `VerifyBindMounts` (`sdk/deploykit/enc_probe.go`) runs in the `charly start` / `charly shell` direct-mode code path before the container is started. For any `type: encrypted` volume that does not show up as a FUSE mount, an extra discrimination fires before the generic "not mounted" error: when the cipher dir on disk holds user data (anything beyond the `gocryptfs.conf` + `gocryptfs.diriv` metadata files) AND the plain mount target is empty, the error switches to a louder form spelling out the data-loss risk:

            ```
            encrypted volume "library": cipher dir at /home/.../charly-immich-library/cipher is populated but plain mount at /home/.../charly-immich-library/plain is empty — refusing to start (would write plaintext over encrypted data); run 'charly config mount immich' first
            ```

            This guards against a real data-loss shape: a quadlet missing the `ExecStartPre=charly config mount <image>` auto-mount hook (see "Boot Behavior: Which Backend, and Why" above and `/charly-build:migrate` "charly migrate") would silently bind an empty `plain/` over a populated cipher tree, the container's services would `initdb` / first-run-wizard against the empty dir, and plaintext data would accumulate on top of an encrypted vault. This error class fails the start IMMEDIATELY when `charly start` detects that exact pre-start state.

            **Important caveat on quadlet-managed services.** This check runs only in the direct-mode (CLI) path. systemd-managed quadlet services bypass it — they go straight to `podman` after `ExecStartPre=charly config mount <image>` succeeds. The actual root-cause fix for those is the `ExecStartPre` hook itself; `VerifyBindMounts` is a belt-and-suspenders safety net for the direct path.

            Helper: `CipherPopulatedPlainEmpty(cipherDir, plainDir)` returns true only when both conditions hold. Returns false on any os.ReadDir error (the surrounding error path will surface those — this helper is purely a discrimination hint). Source: `sdk/deploykit/enc_probe.go`. Tested by `sdk/deploykit/enc_probe_test.go:TestCipherPopulatedPlainEmpty` (5 sub-cases: dangerous, metadata-only, plain-non-empty, missing-cipher, missing-plain).

            ## Volume Backing Override

            When a volume is configured as `type: encrypted` in charly.yml, it overrides the default named volume. The Docker/Podman named volume is not created -- the gocryptfs mount is used instead.

            ```yaml
            # charly.yml declares a volume:
            volumes:
              - name: data
                path: "~/.myapp"

            # charly.yml configures it as encrypted:
            volumes:
              - name: data
                type: encrypted
            ```

            ## Plain (Non-Encrypted) Bind Mounts

            For comparison, plain bind mounts use `type: bind`:

            ```bash
            charly config my-app --bind data=/mnt/nas/data    # Explicit host path
            charly config my-app --bind data                   # Auto path: ~/.local/share/charly/volumes/my-app/data
            ```

            Plain bind mounts do not use encrypted storage commands. They are direct host directory mounts.

            **Source files:**

            - `sdk/deploykit/enc_probe.go` — the enc PROBE + PLAN surface, kit-resident so both the CLI leaves and a plugin caller share one implementation. `EncPlanFor`/`EncPlanForConfig` build the per-volume plan (resolved cipher/plain dirs + init/mounted flags + scope-unit name); `LoadEncryptedVolume` loads the encrypted-volume set from the per-host config; `EncStatus` is a pure probe+print; the path/probe helpers `ResolveEncVolumeDir`/`IsEncryptedMounted`/`IsEncryptedInitialized`/`CipherPopulatedPlainEmpty` back `VerifyBindMounts`; `FuseAllowOtherEnabled` is the `/etc/fuse.conf` preflight; `AskPassword` is the `systemd-ask-password` prompt
            - `sdk/deploykit/enc_passphrase.go` — the passphrase-resolution ORCHESTRATION, taking its credential store as an injected `CredentialAccess` rather than by name. `ResolveEncPassphrase` (env var → store → auto-generate or prompt), `ResolveEncPassphraseForMount` + its testable `…WithResolver` core (the `usesWaitingBackend` split), `EncNotStoredError`, `RetryUnavailable` (the bounded `source=unavailable` poll) and its two knobs `EncMountDeadline` / `EncMountPollPeriod`
            - `candy/plugin-pod/enc_cmd.go` — the enc SHIM + deploy-model (C16a, relocated from the DELETED `charly/enc.go`, K-wave 2). `pluginEncMount`/`pluginEncUnmount`/`encPasswd`/`ensureEncryptedMounts` are thin shims that HOST-PRELIFT the per-volume plan (`encPlanFor`: resolved cipher/plain dirs + init/mounted flags + scope-unit name) and the passphrase, then `encExecViaPlugin` resolves verb:enc and Invokes OpExecute. Keeps (deploy-model): `encMount`'s all-mounted short-circuit, `encStatus` (pure probe+print), the path/probe helpers (`encryptedPlainDir`/`isEncryptedMounted`/`isEncryptedInitialized`/`cipherPopulatedPlainEmpty` — the mandatorily-core `ResolveVolumeBacking` + `verifyBindMounts` consume them), `loadEncryptedVolume` (loader), `resolveEncPassphraseForMount` (bounded retry for `source=unavailable` via `retryUnavailable`), `awaitKeyringUnlockViaPlugin` (the `source=locked` waiter — delegates the event-driven DBus wait to `verb:credential await-unlock`, out-of-process in candy/plugin-secrets, so charly's core links no godbus)
            - `candy/plugin-enc/enc.go` — the ENCRYPTED-VOLUME (gocryptfs) MECHANICS plugin (C16a, verb:enc, compiled-in): the gocryptfs / `systemd-run --scope --unit=charly-enc-<dir>-<volume>` / fusermount3 / `gocryptfs -init` / `gocryptfs -passwd` / extpass SHELLING (`mountVolumes`/`unmountVolumes`/`ensureVolumes`/`passwdVolumes`/`runGocryptfsScope`/`encExtpassArgs`), driven by the host-prelifted `spec.EncExecInput`. `-allow_other` for rootless keep-id + the stale-scope retry live here. Wire types: CUE-sourced at `spec/schema/enc.cue`, generated into `spec/spec/cue_types_gen.go` (`#EncExecInput`/`#EncVolumePlan`/`#EncExecReply`, shared by the shim + the plugin); the plain `EncMethod*` string-selector constants stay hand-written in `spec/spec/enc_consts.go` (never a JSON/YAML shape for `gengotypes` to generate)
            - `candy/plugin-secrets/keyring_unlock_wait.go` — `awaitUnlock` (the externalized event-driven DBus signal wait for `source=locked`), `awaitUnlockLoop`, `awaitUnlockBackstopOnly`, `isCollectionUnlockedSignal` (the collection-unlocked signal filter), `awaitSignalBackstop` (30s), `awaitProgressLogInterval` (1h)
            - `charly/credential_plugin.go` — the CORE adapter (THINned 213→109, K-wave 2 cone CONTESTED): `DefaultCredentialStore` (→ the `credentialResolver` interface), `ResolveCredential` (the `"unavailable"`-vs-`"default"` source distinction), `pluginCredentialStore.call`/`callCtx`/`resolve` (the VNC-password resolve path). The former `pluginCredentialStore.awaitUnlock` + `credentialAwaiter` interface + `resolveSecretBackend`/`resetDefaultCredentialStore`/`CredentialStore` interface are DELETED (zero production callers — the keyring-unlock wait lives plugin-side in candy/plugin-pod's `pluginAwaitKeyringUnlock`, driven via `deploykit.ResolveEncPassphraseForMount`).
            - `candy/plugin-secrets/secret_service.go` — godbus-based ssClient, `findItemAcrossCollections` (with locked-vs-broken tracking), `ssOps` interface for test injection, `ErrSSNotFound` / `ErrSSAllBroken` / `ErrSSInteractiveUnlockRequired` sentinel errors
            - `candy/plugin-secrets/credential_keyring.go` — `KeyringStore.Probe` (iterates collections, accepts if ≥1 healthy), `KeyringStore.Get` (delegates to `keyringGetViaSSClient`, maps `ErrSSInteractiveUnlockRequired` to `KeyringLockedError`), index-divergence warning
            - `candy/plugin-secrets/store.go` — `DefaultCredentialStore` (tracks `defaultStoreProbeErr`), `resolveStoreChain` (the env-less store resolution the core adapter's `ResolveCredential` forwards to over `verb:credential`)
            - `sdk/deploykit/deploy_volume.go` — `ResolveVolumeBacking`, which splits a box's declared volumes into named volumes and bind-backed mounts. The volume type itself is schema-sourced as `spec.DeployVolume` (`spec/schema/deploy.cue` `#DeployVolume`)
            - `candy/plugin-secrets/config_store.go` — the `KeyringCollectionLabel` field (the `keyring_collection_label` setting)

            ## Cross-References

            - `/charly-core:deploy` -- Quadlet integration, volume backing configuration, charly.yml
            - `/charly-core:charly-config` -- `encrypted_storage_path` and `volumes_path` settings, `charly config mount` short-circuit fast-path documented there too
            - `/charly-core:service` -- Container lifecycle, `charly start` inline mount
            - `/charly-build:secrets` -- Credential store hierarchy (env → keyring → config), `charly secrets set charly/enc <image>` to store a gocryptfs passphrase explicitly, `charly secrets list` to inspect indexed keys
            - `/charly-build:settings` -- `secret_backend`, `keyring_collection_label`, `encrypted_storage_path`, and other runtime config keys that control credential + volume resolution
            - `/charly-core:charly-doctor` -- "Secret Service collections" health check, "Keyring index consistency" cross-check; invoke `charly doctor` when diagnosing broken-collection symptoms

            ## When to Use This Skill

            **MUST be invoked** when the task involves encrypted storage, gocryptfs, or encrypted volume backing. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Pre-deployment. Configure encrypted volumes during `charly config`. See also `/charly-core:deploy` (volume backing).

openclaw-deploy-skill:
    skill:
        name: openclaw-deploy
        family: automation
        owner: charly-automation
        description: |-
            Topic skill (no dedicated `charly openclaw` command — the surface is candy composition + box deployment). MUST be invoked before any work involving: OpenClaw gateway configuration, model auth, browser integration, channel setup, or any box composing `openclaw-*` candies (`openclaw`, `openclaw-full`, or a custom box composing `openclaw`/`openclaw-full` + `sway-desktop`).
        content: |
            # OpenClaw - AI Gateway Configuration

            ## Overview

            OpenClaw is an AI gateway that connects LLM agents to messaging channels (WhatsApp, Telegram, Discord, Slack, Signal, iMessage, IRC, Teams) and exposes them via a WebSocket API, CLI, and web Control UI. It runs as a Node.js process with an embedded agent runtime, model failover, browser automation, and multi-agent routing.

            In OpenCharly, OpenClaw runs as a supervisord service inside containers. The `openclaw` candy provides the npm package; compose it with the `sway-desktop` metalayer (full Sway desktop + Chrome browser + VNC) for browser-based workflows like OAuth and web automation. For a desktop+browser box, compose your own from the candies (shown below); for non-browser channels use the headless `openclaw` / `openclaw-full` boxes.

            The gateway listens on port 18789 (WebSocket + HTTP). All CLI commands (`openclaw *`) connect to the gateway WebSocket. The Control UI is served at the gateway root URL. Config is stored in `~/.openclaw/openclaw.json` (JSON5 format).

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Gateway health | `openclaw health` | Check gateway connectivity |
            | Gateway status | `openclaw status --all` | Full status with channels |
            | Model status | `openclaw models status` | Show model, auth, and usage |
            | Browser status | `openclaw browser status` | Show browser connection state |
            | Browser tabs | `openclaw browser tabs` | List open Chrome tabs |
            | Open URL | `openclaw browser open <url>` | Open URL in Chrome |
            | Page snapshot | `openclaw browser snapshot` | Accessible page structure (AI refs) |
            | Screenshot | `openclaw browser screenshot` | Capture PNG to media dir |
            | Config get/set | `openclaw config get/set <key> <val>` | Read/write config values |
            | Doctor | `openclaw doctor --fix` | Health checks + auto-fixes |
            | Security audit | `openclaw security audit` | Check security posture |
            | Channel login | `openclaw channels login --channel <ch>` | Connect a messaging channel |
            | Agent message | `openclaw agent --agent main --message "..."` | Send test prompt |
            | Setup wizard | `openclaw configure` | Interactive config wizard |
            | Logs | `openclaw logs --follow` | Tail gateway logs |

            For container lifecycle, use `charly` commands -- see `/charly-core:service`.

            ## OpenCharly Integration

            ### Candy

            The `openclaw` candy (`candy/openclaw/`) depends on `nodejs` and `supervisord`. It installs the `openclaw` npm package globally, exposes port 18789, declares a `data` volume at `~/.openclaw`, and runs as a supervisord service:

            ```
            [program:openclaw]
            command=%(ENV_HOME)s/.npm-global/bin/openclaw gateway --port 18789
            ```

            The gateway binds to loopback only (no `--bind lan`). External access is handled by port_relay (socat), which forwards from the container interface to loopback. This avoids CORS origin checks entirely — the gateway only ever sees loopback connections.

            ### Box

            Compose your own desktop+browser box — e.g. an `openclaw-desktop` entry in `charly.yml` combining `openclaw-full` + `sway-desktop` on a Fedora base:

            ```yaml
            openclaw-desktop:
              candy:
                base: fedora
                candy:
                  - agent-forwarding
                  - openclaw-full
                  - sway-desktop
                  - dbus
                  - charly
            ```

            A box declares no ports of its own — the composed candies publish them (openclaw
            18789, wayvnc 5900, chrome 9222/9224) and `charly config -p` remaps them at deploy
            time. The resulting box exposes:

            | Port | Service | Protocol |
            |------|---------|----------|
            | 18789 | Gateway WebSocket + Control UI | HTTP |
            | 5900 | VNC (wayvnc) | TCP |
            | 9222 | Chrome DevTools | HTTP |

            Tunnel config exposes all ports via Tailscale (`ports: all`). Platform: linux/amd64 only.

            ### Host Alias

            ```bash
            charly alias add openclaw openclaw-desktop
            # Now: openclaw --help  (runs inside the container)
            ```

            ### Lifecycle

            ```bash
            charly box build openclaw-desktop         # Build image
            charly config openclaw-desktop        # Generate quadlet, daemon-reload
            charly start openclaw-desktop         # Start via systemd
            charly stop openclaw-desktop          # Stop
            charly status openclaw-desktop        # Check systemd status
            charly logs openclaw-desktop -f       # Follow container logs
            ```

            ## Gateway Configuration

            ### Required Settings for Container Use

            The gateway binds to loopback only (no `--bind lan`). Only one config value is required before the gateway will start:

            ```bash
            openclaw config set gateway.mode local
            ```

            Without `gateway.mode=local`, the gateway refuses to start.

            `dangerouslyAllowHostHeaderOriginFallback` is **NOT needed** because port_relay (socat) handles external access — the gateway only sees loopback connections, so no CORS origin checks are triggered.

            For Chrome integration, also set:

            ```bash
            openclaw config set browser.cdpUrl "http://127.0.0.1:9222"
            ```

            After setting these, restart the gateway:

            ```bash
            supervisorctl restart openclaw
            ```

            ### Auth Modes

            | Mode | Description |
            |------|-------------|
            | `none` | No auth (loopback only) |
            | `token` | Bearer token in WebSocket handshake |
            | `password` | Password auth |
            | `trusted-proxy` | Proxy handles auth (e.g., Tailscale identity headers) |

            ### Bind Modes

            | Mode | Description |
            |------|-------------|
            | `loopback` | 127.0.0.1 only (default) |
            | `lan` | All interfaces (0.0.0.0) -- requires auth |
            | `tailnet` | Tailscale interface only |

            ### Health Checks

            ```bash
            openclaw health --json                 # Gateway health
            openclaw doctor --fix                  # Diagnose and fix issues
            openclaw status --all --deep           # Full status with channels
            # HTTP endpoints on gateway port:
            # GET /healthz  -- liveness
            # GET /readyz   -- readiness
            ```

            ## Model Configuration

            ### Primary Model + Fallbacks

            ```json5
            // In ~/.openclaw/openclaw.json
            agents: {
              defaults: {
                model: {
                  primary: "openai-codex/gpt-5.4",
                  fallbacks: ["anthropic/claude-sonnet-4-5"]
                }
              }
            }
            ```

            ### OAuth Auth (OpenAI Codex)

            **Critical:** The `openclaw models auth login` TUI requires a real terminal to complete the post-callback token exchange. Do not pipe or redirect it. Use the typed persistent terminal provider (see `/charly-automation:tmux`):

            ```bash
            RUN=0198f140-6b7a-7b90-8a10-aabbccddee01
            TARGET='{"deployment":"openclaw"}'
            PROFILE='{"name":"openclaw-oauth","entrypoint":["openclaw","models","auth","login","--provider","openai-codex","--set-default"],"cols":120,"rows":40,"persistence":"required","transcript":"both"}'

            # Start with a real PTY, then read normalized screen/evidence without redirecting the TUI.
            charly agent terminal launch "$PROFILE" --target "$TARGET" --run-id "$RUN"
            charly agent terminal snapshot "$PROFILE" --target "$TARGET" --run-id "$RUN"
            charly agent terminal transcript "$RUN"

            # 3. Drive the browser via cdp:/vnc: plan steps (the cdp: verb is served
            #    out-of-process by candy/plugin-cdp): cdp: open the OAuth URL, then locate
            #    "Continue with Google" and "Continue" (consent) with cdp: coords on
            #    'button._buttonStyleFix_wvuha_65' / 'button._primary_3rdp0_107' and deliver
            #    each click via the vnc: verb (chrome:// + anti-automation pages need the VNC
            #    pointer). Run the leg with:  charly check live $IMG --filter cdp --filter vnc
            #    Full recipe: /charly-check:cdp.

            # 4. Verify completion from a structured snapshot or durable transcript.
            charly agent terminal snapshot "$PROFILE" --target "$TARGET" --run-id "$RUN"
            # Should show: "OpenAI OAuth complete", "Default model set to openai-codex/gpt-5.4"
            ```

            **Prerequisites:** Chrome must have an active Google session. The "Continue with Google" button on OpenAI's auth page uses Chrome's Google cookies — sign Chrome into Google (with sync enabled) via the VNC desktop before starting the OAuth flow.

            **Callback architecture:** The OAuth callback hits `http://127.0.0.1:1455/auth/callback` inside the container. Chrome and `openclaw-models` share the same network namespace — no port mapping needed for 1455. The `BROWSER=browser-open` env var (set by the chrome candy) auto-opens URLs via CDP, but may not trigger in all TTY contexts — author a `cdp: open` step (the `cdp:` verb, served out-of-process by candy/plugin-cdp) as a fallback.

            **Stale port 1455:** If a previous attempt left port 1455 occupied, kill the stale holder: `charly shell $IMG -c 'kill -9 $(ss -tlnp sport = :1455 | grep -oP "pid=\K\d+")'`. If the surviving owner is a live agent run, treat it as an incident instead (per R1): preserve its terminal/process evidence, complete RCA, and apply an explicit recovery decision.

            Tokens persist in `~/.openclaw/agents/main/agent/auth-profiles.json` in the `data` volume. Survive `charly stop`/`charly start` and image rebuilds. Only destroyed by `charly remove --purge`.

            Model name: `openai-codex/gpt-5.4`. The `--set-default` flag sets it as the default model in `openclaw.json`.

            ### Checking Model Status

            ```bash
            openclaw models status
            # Shows: provider, model, auth profiles, token expiry, usage quotas
            ```

            ### Model Failover

            Two-stage failure handling:
            1. **Auth profile rotation**: cycles credentials for current provider
            2. **Model fallback**: switches to next model in fallback chain

            Backoff: 1min -> 5min -> 25min -> 1hr (capped). Auth profiles pin per session and reset on `/new` or compaction.

            ### Custom Providers

            ```json5
            models: {
              providers: {
                "my-local": {
                  baseUrl: "http://localhost:4000/v1",
                  api: "openai-completions",
                  models: [{ id: "my-model", contextWindow: 128000, maxTokens: 32000 }]
                }
              }
            }
            ```

            ## Browser Integration

            ### Connecting to Existing Chrome

            In a composed openclaw desktop box (e.g. `openclaw-desktop`), Chrome already runs as a supervisord service on port 9222. OpenClaw must connect to it rather than launching a new instance:

            ```bash
            openclaw config set browser.cdpUrl "http://127.0.0.1:9222"
            supervisorctl restart openclaw
            ```

            Do **not** use `openclaw browser start` in this box -- it attempts to launch a separate Chrome instance that fails without Wayland environment variables.

            After configuration, verify:

            ```bash
            openclaw browser status    # Should show running: true, cdpPort: 9222
            openclaw browser tabs      # Lists open Chrome tabs
            ```

            ### Browser Commands

            ```bash
            openclaw browser open https://example.com        # Open URL in new tab
            openclaw browser navigate https://other.com       # Navigate current tab
            openclaw browser snapshot                          # AI-accessible page structure
            openclaw browser snapshot --format aria            # Accessibility tree
            openclaw browser screenshot                        # PNG to media dir
            openclaw browser screenshot --full-page            # Full page capture
            openclaw browser click 12                          # Click element by AI ref
            openclaw browser type 23 "hello" --submit          # Type + submit
            openclaw browser press Enter                       # Key press
            openclaw browser hover 44                          # Hover element
            openclaw browser fill --fields '[{"ref":"1","value":"Ada"}]'
            openclaw browser wait --text "Done"                # Wait for text
            openclaw browser wait --url "**/dashboard"         # Wait for URL pattern
            openclaw browser evaluate --fn '(el) => el.textContent' --ref 7
            openclaw browser console --level error             # Console messages
            openclaw browser cookies                           # Read cookies
            openclaw browser pdf                               # Save page as PDF
            ```

            ### Snapshot System

            Snapshots provide element references for interaction:
            - **AI snapshot** (default): numeric refs (`click 12`, `type 23 "text"`)
            - **Role snapshot** (`--interactive`): e-prefixed refs (`click e12`)
            - **Efficient preset** (`--efficient`): compact + interactive + depth reduction
            - Refs reset after navigation -- always re-snapshot before interacting

            ### Browser Profiles

            ```json5
            browser: {
              profiles: {
                openclaw: { cdpPort: 18800 },                           // managed (default)
                user: { driver: "existing-session", attachOnly: true },  // attach to running Chrome
                remote: { cdpUrl: "http://10.0.0.42:9222" },            // remote CDP
                cloud: { cdpUrl: "wss://connect.browserbase.com?apiKey=<KEY>" }
              }
            }
            ```

            ## Agent Configuration

            ### Defaults

            ```json5
            agents: {
              defaults: {
                workspace: "~/.openclaw/workspace",
                maxConcurrent: 4,
                compaction: { mode: "safeguard" },
                subagents: { maxConcurrent: 8, maxChildrenPerAgent: 5, maxSpawnDepth: 1 },
                tools: { profile: "coding" },     // coding|minimal|messaging|full
                elevatedDefault: "off"             // off|on|ask|full
              }
            }
            ```

            ### Bootstrap Files

            Placed in the agent workspace, injected on first session turn:
            - `AGENTS.md` -- operating instructions and memory
            - `SOUL.md` -- persona, boundaries, tone
            - `TOOLS.md` -- user-maintained tool documentation
            - `IDENTITY.md` -- agent name and characteristics

            ### Multi-Agent Routing

            ```json5
            agents: {
              list: [
                { id: "main", default: true, name: "Main", model: "openai-codex/gpt-5.4" },
                { id: "home", name: "Home Assistant", model: "anthropic/claude-sonnet-4-5" }
              ],
              bindings: [
                { agentId: "home", match: { channel: "telegram", peer: { id: "123" } } }
              ]
            }
            ```

            ## Channel Setup

            ### Supported Channels

            WhatsApp, Telegram, Discord, Slack, Signal, Google Chat, Mattermost, iMessage, IRC, Microsoft Teams, BlueBubbles.

            ### DM Policies

            | Policy | Description |
            |--------|-------------|
            | `pairing` | Unknown senders get approval code (default) |
            | `allowlist` | Only pre-approved senders |
            | `open` | Accept all (requires `allowFrom: ["*"]`) |
            | `disabled` | Ignore all DMs |

            ### Quick Channel Setup

            ```bash
            # Connect WhatsApp (QR code linking)
            openclaw channels login --channel whatsapp

            # Connect Telegram (requires bot token from BotFather)
            openclaw config set channels.telegram.botToken "BOT_TOKEN"
            openclaw channels login --channel telegram

            # Connect Discord (requires bot token)
            openclaw config set channels.discord.token "BOT_TOKEN"

            # Check channel status
            openclaw channels status --probe
            ```

            ## Key Config Paths

            | Path | Purpose |
            |------|---------|
            | `~/.openclaw/openclaw.json` | Main config (JSON5) |
            | `~/.openclaw/agents/<id>/agent/auth-profiles.json` | Model auth tokens |
            | `~/.openclaw/agents/<id>/sessions/` | Session data |
            | `~/.openclaw/workspace/` | Agent workspace |
            | `~/.openclaw/media/browser/` | Browser screenshots |
            | `~/.openclaw/logs/` | Audit logs |
            | `/tmp/openclaw/openclaw-YYYY-MM-DD.log` | Gateway runtime log |

            ## Troubleshooting

            ### Gateway won't start

            Check supervisord: `supervisorctl status openclaw`. If cycling between STARTING and STOPPED:

            ```bash
            # Run manually to see error output
            supervisorctl stop openclaw
            timeout 15 openclaw gateway --port 18789
            ```

            Common fixes:
            - `gateway.mode` not set -> `openclaw config set gateway.mode local`
            - Control UI origin error -> The gateway uses port_relay (socat) to bind to loopback, avoiding origin checks. If you see `allowedOrigins` errors, verify the relay is running: `supervisorctl status relay-18789`

            ### Browser not connected

            If `openclaw browser status` shows `running: false`:

            ```bash
            openclaw config set browser.cdpUrl "http://127.0.0.1:9222"
            supervisorctl restart openclaw
            ```

            ### OAuth flow

            Use `--tty` for the interactive CLI. The `BROWSER=browser-open` env var auto-opens OAuth URLs in Chrome. The callback URL (`http://127.0.0.1:1455/auth/callback`) is container-internal and needs no port mapping.

            ```bash
            charly shell <image> --tty -c "openclaw models auth login --provider openai-codex --set-default"
            ```

            For browser-assisted OAuth (Google sign-in), see `/charly-check:cdp`.

            ### First-run gateway setup (complete sequence)

            After the first container start, configure the gateway:

            ```bash
            charly shell <image> -c "openclaw config set gateway.mode local"
            charly shell <image> -c "openclaw config set browser.cdpUrl 'http://127.0.0.1:9222'"
            charly shell <image> -c "supervisorctl restart openclaw"
            ```

            ## Cross-References

            - `/charly-check:cdp` -- the `cdp:` check verb (Chrome DevTools Protocol automation, served out-of-process by candy/plugin-cdp)
            - `/charly-core:deploy` -- Quadlet, tunnels, volume backing, VNC password
            - `/charly-core:service` -- `charly start/stop/enable/disable/status/logs/update/remove`
            - `/charly-check:vnc` -- VNC desktop automation and password management
            - `/charly-automation:alias` -- Host command aliases (`charly alias add openclaw`)
            - `/charly-core:shell` -- `charly shell --tty` for interactive container commands

            ## When to Use This Skill

            **MUST be invoked** when the task involves OpenClaw gateway configuration, model auth, browser integration, channel setup, or openclaw boxes. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Post-deployment. Configure the gateway after the container is running. See also `/charly-openclaw:openclaw*` (box variants).

sidecar-skill:
    skill:
        name: sidecar
        family: automation
        owner: charly-automation
        description: |-
            Topic skill for sidecars configured through `charly config` and `charly.yml`. MUST be invoked for sidecar containers, pod networking, Tailscale exit nodes, sidecar flags, or `env_accept` and `env_require` routing.
        content: |
            # Sidecar — Deploy-Time Pod Composition

            ## Overview

            Sidecars are additional containers that run alongside an application container in a shared Podman pod. They share the network namespace (localhost connectivity) while maintaining separate filesystems. Sidecar templates are embedded in the `charly` binary — any image can get any sidecar at deploy time without image rebuilds.

            ## Quick Reference

            | Action | Command |
            |--------|---------|
            | List available sidecars | `charly config --list-sidecars` |
            | Attach sidecar | `charly config <image> --sidecar tailscale` |
            | Attach with env | `charly config <image> --sidecar tailscale -e TS_HOSTNAME=my-app` |
            | Check sidecar status | `charly cmd <image> --sidecar tailscale "tailscale status"` |

            ## Architecture

            Sidecar templates are compiled into the `charly` binary via `go:embed` — they are name-first `sidecar`-kind nodes in the embedded default `charly/charly.yml` (plain node-form YAML), parsed through the SAME unified loader as any project `charly.yml` (folded into `UnifiedFile.Sidecar`). A project may also declare its own `sidecar`-kind nodes that extend/override the embedded set. At deploy time, `charly config --sidecar <name>` merges the embedded template with the project's templates and the per-machine overrides from `charly.yml`, then generates quadlet files.

            ```
            charly binary (embedded templates)     charly.yml (per-machine overrides)
                    ↓                                    ↓
               sidecar templates              env overrides + secrets
                    ↓ MergeSidecars()                    ↓
                          ResolveSidecars()
                                ↓
                         pod + sidecar + app quadlets
            ```

            ### Generated Files

            When sidecars are attached, `charly config` generates **3 files** instead of 1:

            | File | Purpose |
            |------|---------|
            | `charly-<image>.pod` | Pod definition: `Network=charly`, ports (`PodmanArgs=-p`), `--shm-size` |
            | `charly-<image>-<sidecar>.container` | Sidecar: image, env, caps, devices, secrets, volumes |
            | `charly-<image>.container` | App: `Pod=charly-<image>.pod`, no ports/network (pod owns them) |

            ### Dual Networking

            The pod stays on the "charly" bridge network (`Network=charly` in `.pod` file) for container-to-container connectivity. The Tailscale sidecar creates a `tailscale0` tun interface for exit node routing. `--exit-node-allow-lan-access` adds a routing exception (`throw 10.89.0.0/24`) that keeps bridge traffic on the bridge.

            ```
            charly bridge (container-to-container)
            ┌─────────────────────────────────────┐
            │  charly-<image> pod (Network=charly)        │
            │  ┌───────────┐  ┌────────────────┐  │
            │  │ tailscale │  │ app container  │  │
            │  │ sidecar   │  │ :3000, :9222   │  │
            │  │ tailscale0│  │                │  │
            │  │ (tun)     │  │                │  │
            │  └─────┬─────┘  └────────────────┘  │
            └────────┼────────────────────────────┘
                     │ outbound internet only
                exit node
            ```

            ### Env Var Routing

            CLI `-e KEY=VALUE` flags are automatically routed: env vars matching a sidecar template's keys (all `TS_*` for tailscale) go to the sidecar's charly.yml env override. Other vars go to the app container.

            ## Environment Contract (env_provide / env_accept / env_require)

            Sidecars participate in the same cross-container env discovery pipeline as regular candies, with one critical caveat: **routing is explicit, not implicit**. A sidecar's env (e.g., the tailscale sidecar's `TS_*` vars) is **not** auto-injected into the app container, and vice versa — the app only sees what it explicitly opts in to via `env_accept` or `env_require` in its `charly.yml`.

            This matters for two reasons:

            1. **Prevents env var leakage.** Without opt-in filtering, every deployed service would see every other service's `env_provide`. The chrome candy doesn't want `TS_*` vars in its env; the tailscale sidecar doesn't want `BROWSER_CDP_URL`. The filtering model is the mechanism that enforces this boundary.

            2. **Enforces dependency contracts.** When the app declares `env_require` and the provider (or sidecar) is actually deployed, the provide-resolution pipeline (`provides.go`) satisfies the requirement without the user manually setting `-e` flags. When the provider is **not** deployed and no default is set, `charly config` fails hard — deployment does not proceed with a broken env contract.

            ### Tailscale sidecar as a provides participant

            The tailscale sidecar declares its advertised state (e.g., `TS_HOSTNAME`, the sidecar's tailnet IP) via the sidecar template, not via `env_provide`. The app container receives only what it declares in `env_accept`. Most images don't need to look at tailscale state from inside the container — the sidecar handles all routing transparently — so the accepts set is usually empty.

            If a future sidecar needs to forward auth tokens or service URLs into the app, the right pattern is:

            - Sidecar template declares `env_provide:` with `{{.ContainerName}}`-templated values
            - App candy declares `env_accept: [<var>]` or `env_require: [<var>]`
            - `charly config` resolves the provide at deploy time and writes it to `charly.yml` under `provides:`

            Missing `env_accept` on the consumer side silently drops the var. Missing `env_require` is a hard fail. See `/charly-image:layer` (env_require / env_accept) for the authoring side, `/charly-core:charly-config` (Provides Filtering) for the resolution pipeline, and `provides.go` in the `charly` source for the implementation.

            ### charly.yml Persistence

            `--sidecar` assignments and `-e` overrides are saved to `charly.yml`. Subsequent `charly config` calls re-read them:

            ```yaml
            selkies-desktop:
              pod:
                image: selkies-desktop
                sidecar:
                  tailscale:
                    env:
                      TS_HOSTNAME: selkies-desktop
                      TS_EXTRA_ARGS: "--exit-node=100.80.254.4 --exit-node-allow-lan-access"
            ```

            ## Tailscale Sidecar

            The built-in tailscale sidecar template (validated against `tailscale/tailscale` containerboot source):

            ### Multi-tailnet auth-key store

            The sidecar is parameterized on a `tailnet:` field declaring the target
            tailnet's MagicDNS suffix. Each tailnet's auth-key lives in `.secrets`
            (GPG-encrypted env file, loaded by direnv) under a per-tailnet env var
            name derived from the suffix.

            **Schema in the embedded `charly/charly.yml` (the name-first `tailscale` sidecar node):**

            ```yaml
            tailscale:
              sidecar:
                parameter:
                  tailnet: ""            # required: deploy must supply via parameter.tailnet
                secret:
                  - name: ts-authkey
                    env: TS_AUTHKEY                                                     # container var (what tailscale's binary reads)
                    env_from: "TS_AUTHKEY_{{.Parameter.tailnet | tailnetEnvSuffix}}"    # host-side var (what charly reads from .secrets)
            ```

            **Deploy shape (a deploy of the `sway-browser-vnc` box as the `ecovoyage` instance):**

            ```yaml
            ecovoyage:
              pod:
                image: sway-browser-vnc
                sidecar:
                  tailscale:
                    parameter:
                      tailnet: armadillo-quail.ts.net   # picks which per-tailnet auth-key to use
                    env:
                      TS_HOSTNAME: ecovoyage-browser
                      TS_ACCEPT_DNS: "true"
            ```

            **Storage convention (`.secrets`):** the `tailnetEnvSuffix` template
            helper uppercases the MagicDNS suffix and replaces every non-alphanumeric
            character with `_`. So:

            | MagicDNS suffix | Resolved host env var |
            |---|---|
            | `armadillo-quail.ts.net` | `TS_AUTHKEY_ARMADILLO_QUAIL_TS_NET` |
            | `tail297eca.ts.net` | `TS_AUTHKEY_TAIL297ECA_TS_NET` |
            | `acme-corp.example.com` | `TS_AUTHKEY_ACME_CORP_EXAMPLE_COM` |

            **Operator workflow — add a new tailnet:**

            ```bash
            # 1. Generate an auth-key in the Tailscale admin console, signed in as
            #    the OWNING ACCOUNT for the target tailnet. Verify which account
            #    you're in by checking the top-right email. The MagicDNS suffix is
            #    visible at https://login.tailscale.com/admin/dns
            #
            #    Set: reusable=yes, ephemeral=yes, preauthorized=yes,
            #    tags=tag:server (or your ACL), expiration=90d (preference).

            # 2. Store under the per-tailnet env var name:
            charly secrets gpg set TS_AUTHKEY_ARMADILLO_QUAIL_TS_NET tskey-auth-XXXXXXXXX

            # 3. Wire `parameter.tailnet:` into charly.yml under sidecar.tailscale:
            #    (operator-edited; no auto-write)

            # 4. Wipe stale state so the sidecar re-auths with the new key:
            charly volume reset <image> tailscale-state [-i <instance>]

            # 5. Apply:
            charly stop <image> [-i <instance>]
            charly config <image> [-i <instance>]
            charly start <image> [-i <instance>]

            # 6. Verify the right tailnet was joined:
            charly cmd <image> --sidecar tailscale "tailscale status --json" [-i <instance>] \
                | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["MagicDNSSuffix"])'
            # Expected: armadillo-quail.ts.net
            ```

            **Migrating a legacy single-`TS_AUTHKEY` config:**

            A legacy flat config used a single `TS_AUTHKEY` env var, which can't
            distinguish multiple tailnets. `charly migrate` upgrades it to the per-tailnet
            form:

            ```bash
            charly migrate
            # Prompts for the tailnet the existing TS_AUTHKEY belongs to (auto-detects
            # from a running sidecar when present), renames the .secrets entry to the
            # per-tailnet form, and warns about charly.yml entries that need
            # parameter.tailnet set.
            ```

            Use `--tailnet armadillo-quail.ts.net` to skip the prompt, or
            `--delete-legacy` to remove the original `TS_AUTHKEY` entry after the
            rename. Idempotent.

            Any deploy with a tailscale sidecar that doesn't supply
            `parameter.tailnet:` fails at `charly config` time with the message:

            > sidecar "tailscale": sidecar secret "ts-authkey" references parameter "tailnet" which is unset. Set `sidecars.<sidecar-name>.parameter.tailnet: <value>` in charly.yml or run `charly migrate`

            ### Environment Variables

            | Env var | Default | Purpose |
            |---------|---------|---------|
            | `TS_STATE_DIR` | `/var/lib/tailscale` | Persistent state (auth, node identity) |
            | `TS_AUTH_ONCE` | `true` | Skip re-auth when state exists |
            | `TS_USERSPACE` | `false` | **Kernel mode** — required for exit node routing |
            | `TS_DEBUG_FIREWALL_MODE` | `nftables` | Force nftables (iptables-legacy fails in rootless podman) |
            | `TS_ACCEPT_DNS` | `false` | Prevents Tailscale from rewriting `/etc/resolv.conf`. Pod quadlet adds explicit `--dns` flags for container DNS + MagicDNS |
            | `TS_ENABLE_HEALTH_CHECK` | `true` | `/healthz` endpoint |
            | `TS_LOCAL_ADDR_PORT` | `[::]:9002` | Health check listen address |
            | `TS_AUTHKEY` | Via secret | Auth key (from credential store) |
            | `TS_HOSTNAME` | Per-image | Tailscale device name (set via `-e`) |
            | `TS_EXTRA_ARGS` | Per-image | Extra `tailscale up` flags (e.g., `--exit-node=<ip>`) |

            ### Security

            - **Capabilities:** `NET_ADMIN` (iptables/nftables, IP forwarding), `SYS_MODULE` (tun/tap kernel module)
            - **Devices:** `/dev/net/tun` (TUN/TAP virtual network device)

            ### State & Secrets

            - **Volume:** `charly-<image>-tailscale-state` at `/var/lib/tailscale` — node identity persists across restarts
            - **Secret:** `charly-<image>-tailscale-ts-authkey` — provisioned as podman secret from `TS_AUTHKEY` env var (loaded from `.secrets` via `charly secrets gpg env`)

            ### Exit Node Routing

            ```bash
            # Store auth key for the sidecar's tailnet
            charly secrets gpg set TS_AUTHKEY tskey-auth-xxxxxxxxxxxx

            # Deploy with exit node
            charly config selkies-desktop --sidecar tailscale \
              -e TS_HOSTNAME=selkies-desktop \
              -e "TS_EXTRA_ARGS=--exit-node=100.80.254.4 --exit-node-allow-lan-access"
            charly start selkies-desktop

            # First time only: exit node must be set via tailscale set
            # (TS_EXTRA_ARGS only applies on first auth, not restarts)
            charly cmd selkies-desktop --sidecar tailscale \
              "tailscale set --exit-node=100.80.254.4 --exit-node-allow-lan-access"

            # Verify: pod shows exit node's IP, not host's
            charly cmd selkies-desktop "curl -s ifconfig.me"
            ```

            **Prerequisites:**
            - Exit node device must advertise as exit node (`tailscale set --advertise-exit-node` on the device)
            - Exit node must be **approved** on the sidecar's tailnet admin console
            - Exit node IP is the **Tailscale IP** (e.g., `100.80.254.4`), not a public IP

            **Persistence:** `tailscale set --exit-node` persists in the state volume. Survives pod restarts without re-configuration.

            ### Different Tailnet from Host

            The sidecar runs its own `tailscaled` daemon in the pod's network namespace with its own state volume. It is completely isolated from the host's Tailscale:

            | Aspect | Host Tailscale | Sidecar Tailscale |
            |--------|---------------|-------------------|
            | State | `/var/lib/tailscale` | Named volume |
            | Auth key | Host's | Sidecar's `TS_AUTHKEY` |
            | Network NS | Host | Pod (shared with app) |
            | Control server | Default | Configurable via `TS_EXTRA_ARGS=--login-server=...` |

            ### Host Tailnet Port Exposure

            The host's `tunnel: tailscale` (configured in charly.yml) is independent of the sidecar:
            - `ExecStartPost=tailscale serve` runs on the **host**, exposing pod ports on the **host's tailnet**
            - The sidecar handles routing on the **sidecar's tailnet**
            - Both work simultaneously (dual networking)

            ### Pod ShmSize

            Chrome requires large `/dev/shm`. In pod mode, per-container `ShmSize=` is ignored (pod infra container owns `/dev/shm`). The pod quadlet propagates ShmSize via `PodmanArgs=--shm-size=1g`.

            ## Cross-References

            - `/charly-core:deploy` — Quadlet generation, charly.yml, tunnel configuration (tunnel is charly.yml-only, not auto-inherited by instances)
            - `/charly-core:charly-config` — `--sidecar` and `--list-sidecars` flags, Provides Filtering, resource caps, NO_PROXY auto-enrichment
            - `/charly-image:layer` — `env_accept` / `env_require` authoring and the full provides filtering contract
            - `/charly-build:secrets` — `charly secrets gpg set TS_AUTHKEY` for auth key storage
            - `/charly-selkies:selkies-labwc` — Full deployment example with Tailscale exit node
            - `/charly-selkies:chrome` — Proxy deployment pattern (Tailscale exit node + HTTP_PROXY) and NO_PROXY auto-enrichment
            - `/charly-automation:enc` — Encrypted volumes in pod deployments

            ## Source

            `candy/plugin-deploy-pod/sidecar_resolve.go` (types, merge, resolution — `resolvePodSidecars` / `resolvedSidecarFromSpec`; the types are `spec.ResolvedSidecar` / `deploykit.ResolvedSidecar`; the former `charly/sidecar.go` is DELETED, K-wave 2), `candy/plugin-deploy-pod/sidecar_embedded.go` (the embedded DEFAULT sidecar template library — the former `charly/sidecar.go`'s `embeddedSidecarBodies`, now this plugin's own `//go:embed sidecar_templates.json`, served to `resolvePodSidecars` + the `charly config --list-sidecars` leaf), `spec/spec/config.go` (`Config.Sidecar`, the project's authored sidecar-template library as opaque bodies), `candy/plugin-deploy-pod/config_setup.go` / `config_write.go` (the `charly config --sidecar <name>` attachment + pod + sidecar + app quadlet emission — the former `charly/quadlet_pod.go` is DELETED, K-wave 2).

tmux-skill:
    skill:
        name: tmux
        family: automation
        owner: charly-automation
        description: |-
            Typed persistent terminal and terminal-agent sessions backed by isolated tmux control-mode servers.
            Use for local, deployment, SSH, gRPC, nested, detached, reattached, TTY, snapshot, transcript,
            literal-input, paste, key, resize, signal, cleanup, incident, and RCA workflows.
        content: |
            # Typed tmux terminal provider

            `terminal:tmux` and `agent-runtime:tmux` are generic bidirectional providers. Each run owns an isolated tmux socket derived from its UUIDv7. Charly transports CUE-generated terminal inputs and ordered channel frames; the plugin alone handles tmux control mode, ANSI/alternate-screen emulation, snapshots, pane lifecycle, and safe input translation.

            The target-side Charly endpoint must be able to resolve `tmux` on its process `PATH`; Charly itself need not be preinstalled. At every deployment or SSH boundary the controller keeps an equal/newer packaged Charly or copies the active binary through `EnsureCharlyInDeployVenue` to a versioned `/tmp` path, then starts the fixed gRPC endpoint. A named profile is resolved from project candies or the selected deployment image's `ai.opencharly.terminal_profiles` label. An inline `#TerminalProfile` JSON object is also accepted.

            ## Lifecycle

            ```bash
            RUN=0198f140-6b7a-7b90-8a10-aabbccddeeff
            TARGET='{"deployment":"my-agent-box"}'

            # Start, confirm the typed running event, and detach.
            charly agent terminal launch claude-code --target "$TARGET" --run-id "$RUN"

            # Inspect normalized screen state or durable ordered evidence.
            charly agent terminal snapshot claude-code --target "$TARGET" --run-id "$RUN"
            charly agent terminal transcript "$RUN"

            # Typed inputs: literal text, explicit paste, allowlisted key, resize, signal.
            charly agent terminal input claude-code 'review the current change' --target "$TARGET" --run-id "$RUN" --paste
            charly agent terminal key claude-code enter --target "$TARGET" --run-id "$RUN"
            charly agent terminal resize claude-code 160 50 --target "$TARGET" --run-id "$RUN"
            charly agent terminal signal claude-code interrupt --target "$TARGET" --run-id "$RUN"

            # Real-TTY attachment and explicit cleanup.
            charly agent terminal attach claude-code --target "$TARGET" --run-id "$RUN"
            charly agent terminal close claude-code --target "$TARGET" --run-id "$RUN"
            ```

            `run` waits for a real pane exit. `launch` returns only after `running` or `reattached`, leaving the run-owned server available. A proven semantic adapter may settle an `agent-runtime:tmux` run while preserving its tmux session for follow-up. A generic profile without an adapter never infers completion from silence; the operator or coordinator explicitly attaches, closes, or waits for exit.

            ## Generic route composition

            The same terminal calls accept every `#TargetSpec`; runtime names never select transport code.

            ```bash
            # Real gRPC/HTTP2 over SSH stdio, with tmux behind that endpoint.
            TARGET='{"hops":[{"transport":"ssh","address":"box.example","user":"agent"},{"transport":"grpc"},{"transport":"tmux"}]}'

            # Recursive process/gRPC placement before the same terminal provider.
            TARGET='{"hops":[{"transport":"ssh","address":"outer"},{"transport":"grpc"},{"transport":"exec"},{"transport":"grpc"},{"transport":"tmux"}]}'

            # Place the endpoint in any Charly deployment, then continue through the route.
            TARGET='{"deployment":"toolbox","hops":[{"transport":"ssh","address":"inner"},{"transport":"grpc"},{"transport":"tmux"}]}'
            ```

            SSH identity, port, environment, and deterministic `-o key=value` options are fields on the CUE target hop (`working_dir` sits one level up, on `#TargetSpec`). SSH is only the process carrier; Provider.Channel remains the wire protocol.

            The compatibility command tree uses the same controller:

            ```bash
            charly tmux run toolbox sh --session review
            charly tmux cmd toolbox 'printf READY' --session review --no-notify
            charly tmux capture toolbox --session review
            charly tmux send toolbox 'exit 0' --session review --enter
            charly tmux kill toolbox --session review
            ```

            The facade also serves `charly tmux shell` (create or reattach a persistent typed shell), `charly tmux attach` (interactive TTY), and `charly tmux list` (compatibility sessions).

            These commands never shell out recursively through `charly cmd`/`charly shell` and never touch an operator's tmux socket.

            ## Safety and evidence

            - Text uses tmux literal input; paste uses a tmux buffer; keys and signals are profile-allowlisted canonical values.
            - User content is never interpolated into a shell command.
            - Output sequences are monotonic and ACKed; replay buffers are bounded and fail loudly before unacknowledged evidence can be evicted.
            - Control disconnect detaches when persistence permits. Initial reattachment and sequence recovery use a structured resynchronization snapshot.
            - Normal zero exit or explicit close verifies server cleanup. Nonzero exit, malformed stream, evidence overflow, or cleanup failure creates an incident and performs no automatic restart.
            - Recovery requires a completed RCA, except an explicit emergency abort that still records the unresolved incident.
            - Semantic readiness is driven by tmux control-output events. `waiting-for-prompt` and `prompt-ready` statuses make the boundary observable; no capture polling, sleeps, backoff, or timed retries — per R4, pace on observable state.

            ## Terminal agents

            Claude Code, Codex, and Gemini candies publish profiles for `agent-runtime:tmux`. The Pi candy publishes both native `agent-runtime:pi` and an ordinary `pi` terminal profile, so Pi can run directly through its SDK harness or inside tmux without a transport-specific branch.

            Create a terminal-backed durable session and run it through the same headless API:

            ```bash
            charly agent session create tmux --profile codex --target '{"deployment":"coder"}'
            charly agent run start SESSION_UUID 'inspect the failing test'
            ```

            ## Related skills

            - `/charly-infrastructure:tmux-layer` — installs tmux in a candybox.
            - `/charly-core:shell` and `/charly-core:cmd` — one-shot interactive/synchronous container execution.
            - `/charly-check:check` — disposable R10 beds and live evidence requirements.

udev-skill:
    skill:
        name: udev
        family: automation
        owner: charly-automation
        description: |-
            MUST be invoked before any work involving: GPU device access rules, charly udev commands, udev rule management, or container GPU troubleshooting.
        content: |
            # Udev - GPU Device Access Rules

            ## Overview

            Manage udev rules that grant rootless containers access to GPU devices. Without these rules, DRM card nodes and AMD KFD devices may not be accessible to non-root users, blocking GPU features like NVENC encoding and ROCm compute.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Show status | `charly udev status` | GPU devices, groups, rule status, fix suggestions |
            | Print rules | `charly udev generate` | Print udev rule content to stdout |
            | Install rules | `charly udev install` | Write rules file + reload udev (requires sudo) |
            | Remove rules | `charly udev remove` | Delete rules file + reload udev (requires sudo) |

            ## What the Rules Do

            Rules are written to `/etc/udev/rules.d/99-charly-container-access.rules`:

            ```
            # Card nodes: render group access for NVENC hardware encoding
            SUBSYSTEM=="drm", KERNEL=="card[0-9]*", GROUP="render", MODE="0660"
            # AMD KFD: ROCm compute access
            SUBSYSTEM=="kfd", KERNEL=="kfd", GROUP="render", MODE="0660"
            # VFIO group nodes: rootless GPU passthrough to VMs
            SUBSYSTEM=="vfio", GROUP="kvm", MODE="0660"
            ```

            - **DRM card nodes** (`/dev/dri/card*`) — set group to `render`, mode `0660`. Render nodes (`renderD*`) are already world-accessible; card nodes need explicit rules for NVENC
            - **AMD KFD** (`/dev/kfd`) — set group to `render`, mode `0660`. Required for ROCm GPU compute
            - **VFIO group nodes** (`/dev/vfio/<group>`) — set group to `kvm`, mode `0660`. Lets rootless `qemu:///session` open the group node for GPU passthrough to a VM (`charly vm gpu` / a `libvirt.devices.hostdevs:` block). The user must be in the `kvm` group. Passthrough also needs a raised memlock limit — `charly vm gpu status` / `charly doctor` report both.

            Rootless Podman's user namespace mapping prevents DRM master abuse, making this safe.

            ## Status Output

            `charly udev status` shows:

            ```
            GPU Devices:
              /dev/dri/card0           nvidia     root:render  0660  OK
              /dev/dri/renderD128      nvidia     root:render  0666  OK

            User Groups:
              video:    yes
              render:   yes

            Udev Rules:
              /etc/udev/rules.d/99-charly-container-access.rules: installed

            Status: OK — GPU device access available for containers
            ```

            If problems are detected, it prints specific fix commands.

            ## Install Workflow

            ```bash
            charly udev status              # Check current state
            charly udev install              # Install rules (prompts for sudo)
            ```

            Install writes the rules file, then runs:
            1. `sudo udevadm control --reload-rules`
            2. `sudo udevadm trigger --subsystem-match=drm`
            3. `sudo udevadm trigger --subsystem-match=kfd`

            Idempotent: skips if rules are already up to date.

            ## Prerequisites

            - User must be in the `render` group for GPU access
            - AMD GPU users also need the `video` group
            - `charly udev status` shows exact `usermod` commands if groups are missing

            ## Cross-References

            - `/charly-core:charly-doctor` — hardware detection and dependency checks (includes GPU)
            - `/charly-distros:nvidia` — NVIDIA GPU runtime candy
            - `/charly-distros:rocm` — AMD ROCm GPU compute candy
            - `/charly-distros:cuda` — CUDA toolkit candy

            ## Source

            `candy/plugin-udev` (the `command:udev` plugin — the former `charly/udev.go` is DELETED, K-wave 2).

            ## When to Use This Skill

            **MUST be invoked** when the task involves GPU device access, udev rules, or troubleshooting container GPU passthrough. Invoke this skill BEFORE reading source code or launching Explore agents.

agent-control-operator-skill:
    skill:
        type: agent
        name: agent-control-operator
        family: automation
        owner: charly-automation
        model: inherit
        description: |-
            Operates and diagnoses Charly agent, Pi, tmux, TUI, federation, generic target transport, endpoint replication, incident, RCA, and recovery workflows using Charly commands and evidence-first rules.
        content: |
            You are the Charly Agent Control Operator.

            Use `/charly-automation:agent` and `/charly-automation:tmux` before acting. Operate through `charly agent`, `charly tui`, `charly tmux`, `charly status`, `charly logs`, `charly cmd`, `charly cp`, and `charly check`; do not substitute direct container-engine or ad-hoc tmux commands.

            For every command:

            1. Name the provider, operation, and target route.
            2. Report endpoint-bootstrap and channel status from stderr/status frames.
            3. Preserve structured stdout, run IDs, sequence/ACK evidence, transcripts, exit status, and cleanup outcome.
            4. On any anomaly, stop. Record or identify the incident, collect evidence, complete a specific RCA, and require an explicit recovery decision. Never blindly rerun.
            5. Never add sleeps or blind retries — per R4; pace on the observable state events named in `/charly-automation:agent`.
            6. Escalate to debugger attachment only after Charly-native evidence is captured and only against the exact blocked process. Do not broad-kill processes.

            An accessible target does not need Charly preinstalled. Verify that each deployment/SSH boundary keeps an equal/newer target Charly or uses the controller's versioned replicated path. Do not mutate PATH or install an untracked system package for transient control.

            For acceptance, use a generic route matrix and the complete unmodified disposable R10 bed. A single mocked route, a scope-shrunk check, or a hand-written runtime command is not proof.


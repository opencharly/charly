charly-build:
    candy:
        version: 2026.218.1200
        description: |-
            Concept candy owning the charly-build authoring skills (build/generate/list/validate/migrate/…). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the build concept candy's skill entities are present and generated into plugins/build/skills
              id: charly-build-present
              context:
                - build
              command: "true"

build-skill:
    skill:
        name: build
        family: build
        owner: charly-build
        description: |-
            MUST be invoked before any work involving: building container images, charly box build command, pushing to registries, merging layers, build caches, or Containerfile generation.
        triggers:
            - "`charly box build` / `charly box generate` / Containerfile"
        content: |
            # charly box build -- Building Container Images

            Invoked as `charly box build`. See `/charly-image:image` for the family overview.

            ## Overview

            `charly box build` generates Containerfiles from `charly.yml` and layer definitions, then builds images in dependency order using the configured build engine (Docker or Podman). Images at the same dependency level are built in parallel (up to `--jobs` concurrent builds).

            **Mode purity**: `charly box build` reads `charly.yml` only. `charly.yml` is never read during build — this is enforced by `LoadConfig` in `charly/loader_threaded.go` (it reads the PROJECT `charly.yml` only and never merges the per-host `charly.yml` overlay — no `MergeDeployOverlay`), to guarantee OCI labels are baked strictly from authored configuration, never from local deploy-time overrides. See `/charly-internals:go` "Mode purity" for the architectural invariant this protects and the bug it prevents.

            **Build-engine dispatch**: `charly box build` does not construct a generator host-side at all (the former `NewGenerator` is DELETED) — `BuildCmd.Run` computes the build tag, holds the build-activity retention lock, and dispatches through the COMPILED-IN `build:box` plugin (candy/plugin-build) over the F10 reverse channel; on return it runs the retention prune host-side. The plugin's `runBoxBuild` → `resolveBuildEngine` (candy/plugin-build/resolve.go) runs the ENTIRE build-engine RESOLVE plugin-side — loader, vocab, scan, connect, validate, box resolve, intermediates, order, effective versions, host-fs prep, render-seam-cache prep, render-prep, user-context, envelope projection, and drive-model — and returns `spec.BuildResolveReply` (the resolved-project envelope + a serializable drive-model: engine/platform, build order, per-image descriptors, resolved tunables; NO Containerfile content). This is the plugin-side replacement for the DELETED host `build-prep` fat seam (`charly/build_resolve_host.go`'s `hostBuildBuildResolve`). The plugin **OWNS the podman DRIVE** (the build-order loop, per-image build lock, `podman build`, push, and the inline-merge gate) IN the candy — it imports only the sdk module. It reaches the host ONLY for thin `buildengine-*` shards a sdk-only candy cannot hold: `buildengine-scan-local` (local candy scan), `buildengine-connect-plugins` (registry plugin connect), and `buildengine-prep` (the render-seam-floor `renderGenCache` — `hostBuildPrep` stores a CHEAP candy-scan-only Generator for the render-seam floor's reverse-channel consumers and returns an EMPTY map; the host-fs PREP itself moved plugin-side in the K3 host-prep move — `runHostFSPrep` in candy/plugin-build/host_prep.go). The resolved-project envelope + drive-model are NOT returned by `buildengine-prep` — they come from `resolveBuildEngine`'s reply. The render DRIVE is `sdk/deploykit.Generator`, driven by the candy over the envelope + `HostBuild("render-seam")` for the host-coupled render seams (#67 — the host no longer renders the `.build/` tree); `bake_plugin:` binary baking is INLINE via `deploykit.EmitBakedPlugins` (no `HostBuild("bake-plugins")` round-trip — that host-builder + `host_build_bake_plugins.go` are DELETED). `charly box generate` mirrors this via `build:generate` → `runBoxGenerate` → `resolveBuildEngine(..., generateOnly=true)`: `generateOnly` is a PLUGIN-SIDE parameter (NOT a `HostBuild("buildengine-prep")` argument — that host leg takes `spec.ResolvedProjectRequest`, which has no `GenerateOnly` field) that returns after the envelope projection (no engine/order drive-model); the candy renders the `.build/` tree itself via `deploykit.Generator` + returns the written Containerfile paths; no podman. (The resolved-project envelope that OTHER verbs fetch — `charly box inspect`, `charly fleet compile`, `charly check`, … — comes over the separate `InvokeProvider("build","project",OpResolve)` peer seam, the `build:project` word; the build/generate path projects its own envelope inside `resolveBuildEngine`.) See `/charly-internals:plugin` (the `build` provider class + the in-proc reverse channel) and `/charly-build:generate`.

            **Build-mode emission**: the build-mode Containerfile render DRIVE is `sdk/deploykit.Generator.Generate` / `generateContainerfile` (relocated from `charly/generate.go` in #67), driven by `candy/plugin-build` over the resolved-project envelope + `HostBuild("render-seam")`; the `charly/generate.go` top-level `Generate`/`writeCandySteps` orchestrator is DELETED. the pod-overlay deploy path reaches `deploykit.Generator.EmitTasks` DIRECTLY — `charly/tasks.go` holds no shim and cannot hold one (P16 import purity forbids `charly/` importing the sdk); that path stays for the pod-overlay deploy path (the candy `plugin-deploy-pod` constructs `deploykit.OCITarget` + renders via `deploykit.NewRenderGeneratorFromProject`, the per-step fragment over the `HostBuild("step-emit","oci-emit-step")` seam); the build-mode render (in `sdk/deploykit`) drives `WriteCandySteps` → `EmitTasks` directly. The render walks each layer's ops directly to write Containerfile text — NOT the `InstallPlan` IR. It shares the package-cascade / shell-snippet / localpkg compiler helpers with the IR (one source of truth, R3), but the overall walk is the direct generator. The `InstallPlan` IR + `deploykit.OCITarget.Emit` is the DEPLOY-mode path used by `charly fleet add` (the candy `plugin-deploy-pod`'s `add_candy:` overlay synthesis, rendered in its own code via `deploykit.OCITarget` + `deploykit.NewRenderGeneratorFromProject` + the external out-of-process deploys; the local/vm/kubernetes/android substrates are external plugins via `pluginDeployTarget` (S3b, dispatched through `candy/plugin-fleet`'s `Invoke(OpDeployDispatch)`) — `deploy:local` via candy/plugin-deploy-local and `deploy:vm` via candy/plugin-deploy-vm DO consume the IR (the plugin walks it via `kit.WalkPlans` over the reverse channel, the vm one over the guest `SSHExecutor`), while `deploy:kubernetes` via candy/plugin-kube does NOT, materializing its Kustomize tree PLUGIN-side (`candy/plugin-kube/materialize.go`'s `materializeKustomize`, reaching `candy/plugin-k8sgen` peer-to-peer over `verb:k8sgen`/`OpEmit`)). See `/charly-internals:install-plan` for the IR and `/charly-internals:generate-source` for the Go call graph.

            **Three-phase templates**: the embedded build vocabulary's format and builder definitions split each install operation into `phases.{prepare, install, cleanup}.{container, host}` — three phases × two venues. Build-mode emission reads the `container` cell; local deploys read `host`. A top-level `install_template:` field serves as the `(install, container)` fallback when `phases:` is absent. See `/charly-image:layer` "Service Declaration" for the analogue at the init-system level (`init.<name>.service_schema`).

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Build all images | `charly box build` | Build all images in dependency order |
            | Build specific image | `charly box build <image>` | Build single image for host platform |
            | Build and push | `charly box build --push` | Build all platforms and push to registry |
            | Build without cache | `charly box build --no-cache` | Disable build cache entirely |
            | Merge layers | `charly box merge <image>` | Post-build layer optimization |

            ## charly box build Commands

            ```bash
            charly box build [image...]                         # Build for local platform
            charly box build --push [image...]                  # Build for all platforms and push
            charly box build --platform linux/amd64 [image...]  # Specific platform
            charly box build --cache registry [image...]         # Registry cache (read+write)
            charly box build --cache image [image...]           # Image cache (read-only, default)
            charly box build --cache gha [image...]             # GitHub Actions cache
            charly box build --no-cache [image...]              # Disable cache entirely
            charly box build --jobs N [image...]                # Max concurrent images per DAG level (0=auto from defaults.jobs, else 4)
            charly box build --podman-jobs N [image...]         # Max concurrent stages within a single podman build (0=auto: min(NCPU, defaults.podman_jobs_cap))
            charly box build <image> --include-disabled         # Build an `enabled: false` image without flipping authored config
            charly box build <image> --dev-local-pkg            # EVAL-BED ONLY: build localpkg candies (the charly toolchain) from LOCAL in-dev source, not the published release
            ```

            ### `--dev-local-pkg` — disposable check beds bake the IN-DEVELOPMENT charly

            The charly toolchain normally installs the latest **published** package in an
            image build (downloaded from the per-distro repo via `download_template`). The
            check-bed runner instead passes `--dev-local-pkg` for EVERY bed image build, so the
            package is BUILT via the `charly generate-packages` plugin (nFPM) from the LOCAL
            in-development binary + plugins — a disposable check bed always tests the
            in-development charly, never a stale release. Generic across all kinds + all
            localpkg candies, one decision point (`deploykit.RenderLocalPkgImageInstall`); a
            production box build omits the flag. A dev build that cannot build via the plugin
            HARD-errors (no silent release fallback, R4).
            Full mechanics: `/charly-internals:install-plan` "Check-vs-production charly
            toolchain"; the candy view: `/charly-tools:charly`.

            ## `--include-disabled` — operational rebuild of disabled images

            Images with `enabled: false` in `charly.yml` are excluded from the build /
            inspect / validate working set by default. To rebuild ONE such image without
            flipping the authored flag (which would commit local-deployment intent into
            shared project config), pass `--include-disabled`:

            ```bash
            charly box build immich --include-disabled    # builds the disabled image
            git diff --quiet charly.yml                  # confirms charly.yml is untouched
            ```

            **Scoping.** When you pass positional `<image>` args together with
            `--include-disabled`, the override is **scoped to those names**. Other
            disabled images stay filtered out — important because widening the
            working set globally would surface unrelated dep errors (e.g., a
            disabled image with remote layers that haven't been fetched yet).
            `charly box build --include-disabled` (no positional args) widens
            globally; `charly box build immich --include-disabled` only relaxes the
            gate for `immich`.

            The flag flows from `BuildCmd.IncludeDisabled` → `ResolveOpts.IncludeDisabled`
            + `ResolveOpts.IncludeDisabledNames` → `ResolveAllBox` (a `*Config` method)
            → `ResolveBox`. The `shouldIncludeDisabled(name)` helper centralises the
            scoping rule. Sibling commands `charly box inspect <name> --include-disabled`
            and `charly box validate --include-disabled` accept the same flag for
            diagnostic / validation work on disabled entries. See `/charly-build:inspect`
            and `/charly-build:validate`.

            ## Build Config (the embedded build vocabulary)

            Containerfile generation is driven by the build vocabulary (`distro:` / `builder:` / `init:` /
            `resource:`). The DEFAULT vocabulary is EMBEDDED in the `charly` binary (`charly/charly.yml`,
            `//go:embed` — the single embedded default config, plain node-form YAML parsed by the
            same unified loader as any project `charly.yml`) and
            merged as the lowest-priority base — a project needs
            no build vocabulary of its own. A project EXTENDS or OVERRIDES it by declaring its own
            `distro:`/`builder:`/`init:`/`resource:` entries inline in `charly.yml` or in an imported
            vocabulary file (project-wins; the former `defaults.format_config:` field is gone).

            The embedded `charly/charly.yml`'s build vocabulary has three top-level sections:

            - **`distro:`** — Per-distro bootstrap commands (package manager setup, cache mounts, repo management), optional `base_user:` declaration (what uid-1000 account the upstream base image ships), and package format templates (how `rpm:`, `pac:`, `deb:` sections in charly.yml become `RUN` steps). Each format has `install`, `repos`, `copr`, `modules`, and `options` templates.
            - **`builder:`** — Multi-stage builder patterns (pixi, npm, cargo, aur). Each builder has `build_stage` and `copy_stage` templates that generate the appropriate `FROM builder AS ...` and `COPY --from=...` steps.
            - **`init:`** — Init system definitions (supervisord, systemd) including detection rules, fragment templates, entrypoint commands, and service management commands. Optional — images can omit this if they don't need an init system.
            - **`resource:`** — Exclusive host-resource vocabulary: maps an arbitration token (the name used by a deploy/bed's `requires_exclusive:` and a holder's `preemptible.holds:`) to an optional hardware selector. A `gpu:` selector (`resource: {nvidia-gpu: {gpu: {vendor: "0x10de"}}}`) lets `charly vm create` AUTO-ALLOCATE the matching PCI `<hostdev>` for a GPU-requiring VM (detect → persist into the per-host `instance.yml` → inject) — or FAIL HARD when no matching card is present. The selector lives in YAML, never hardcoded in Go: adding a resource is a config edit. Optional + additive (configs without it load unchanged). See `/charly-internals:disposable` "resource-arbitration axis", `/charly-vm:vm` "GPU passthrough", `/charly-core:deploy` `requires_exclusive`.

            All sections use Go `text/template` syntax with access to layer config data. Source: `sdk/buildkit/format_config.go` (the distro/builder type aliases, including `DistroDef = spec.ResolvedDistro` with its `BaseUser`), `sdk/buildkit/init_config.go` (`InitConfig = spec.InitConfig`), `sdk/buildkit/render.go` (`RenderTemplate` — the former `charly/format_config.go`/`init_config.go`/`format_template.go` are DELETED, K-wave 2).

            ### `base_user:` — declaring a pre-existing base-image account

            `base_user:` handles upstream base images that ship a pre-existing uid-1000 account (e.g. Ubuntu 24.04's `ubuntu:ubuntu`). Declare it under the distro when the upstream base image ships a uid-1000 account; leave it out otherwise.

            ```yaml
            distro:
              ubuntu:
                inherits: debian
                base_user:
                  name: ubuntu
                  uid: 1000
                  gid: 1000
                  home: /home/ubuntu
                # ... bootstrap inherited from debian
            ```

            All four fields (`name`, `uid`, `gid`, `home`) are required when the block is present. Inherited across distro inheritance chains — if the child has no `base_user:` but the parent does, the child inherits it (see `ResolveInherits` in `spec/spec/distro_config_methods.go`).

            Consumed by the `user_policy:` reconciliation in `sdk/buildkit/config_resolve.go:ResolveBox` — see `/charly-image:image` "user_policy" for the three-value policy (`auto` / `adopt` / `create`) and the decision matrix.

            No `base_user:` currently declared for Fedora, Arch, or Debian (their canonical base images ship no pre-existing uid-1000 account). Add one in your project's `charly.yml` build-vocabulary override if you're basing on a distro-cloud variant that DOES ship one (e.g. `debian:13-cloud`).

            ### `version:` — the canonical distro version (for VM per-version reach)

            Each distro may declare a canonical `version:` (`distro.debian.version: "13"`, `distro.ubuntu.version: "24.04"`, `distro.fedora.version: "43"`; arch/cachyos are rolling and omit it). It is the single source for synthesizing the most-specific-first tag chain `[<distro>:<version>, <distro>]` on a target that carries only a bare distro name — a `target: vm` deploy, where no image-authored `distro:` tag supplies the version. `syntheticVmBox` + the `distroTagChain` helper consume it so a VM deploy of an ubuntu guest reaches per-version `distro:` sections (e.g. `ubuntu-24.04`) exactly like an image build does. Inherited child-wins via `resolveInherits` (cachyos inherits arch → stays version-less). Image builds carry the version in their own `charly.yml` `distro:` tags and don't need it. See `/charly-image:layer` "Package Surface" and `/charly-internals:install-plan`.

            ### The `builder:` name in two places

            `builder:` appears in both the embedded build vocabulary (top-level section) and `charly.yml` (per-image map, plus `defaults.builder`). They share the name on purpose — both maps key on the same slot (the build-type name, e.g. `pixi`, `npm`, `cargo`, `aur`):

            - the embedded build vocabulary's `builder.pixi` — **definition**: detection rules, stage template, cache mounts for the pixi builder.
            - `charly.yml` `builder.pixi` — **selection**: which image (e.g. `fedora-builder`) to use as the pixi builder for this image.

            An image's effective builder map resolves as: `box.builder[type]` → `base_box.builder[type]` → `defaults.builder[type]` → `""`. Self-references (a builder image pointing at itself) are filtered automatically.

            ### Why one file, not three

            The embedded build vocabulary was unified from three former files (`distro.yml` + `builder.yml` + `init.yml`) because they were always resolved together through the same `format_config:` ref. One file → one loader (`LoadBuildConfigForBox`) → three in-memory configs (`DistroConfig` / `BuilderConfig` / `InitConfig`) — the internal split is preserved, only the YAML surface is unified. The `init:` section is optional (absent = no init system); `distro:` and `builder:` are required.

            ## Containerfile Generation

            `charly box build` runs `charly box generate` internally. You can also run it standalone to inspect generated Containerfiles:

            ```bash
            charly box generate                          # Write .build/ (Containerfiles)
            charly box generate --tag v1.0.0             # Override CalVer tag
            cat .build/my-image/Containerfile    # Inspect generated output
            ```

            ## Build Flow

            1. Run `charly box generate` internally (produces Containerfiles in `.build/`)
            2. Resolve runtime config to get build engine (`engine.build`)
            3. Resolve image build order (dependency ordering, grouped by level)
            4. Filter to requested images (and their base dependencies)
            5. For each level: build images in parallel (up to `--jobs` concurrent, default 4)
            6. After all builds: `charly box merge --all` (if `merge.auto` enabled, skipped for `--push`)

            ## Parallelism: `--jobs` vs `--podman-jobs`

            charly exposes **two** parallelism knobs with distinct meanings:

            | Flag | Env var | `defaults:` key | What it controls |
            |---|---|---|---|
            | `--jobs N` | `CHARLY_BUILD_JOBS` | `jobs` | **Outer** concurrency: how many charly-level images to build in parallel within a DAG level (e.g., when `charly box build` rebuilds the whole graph). |
            | `--podman-jobs N` | `CHARLY_PODMAN_JOBS` | `podman_jobs` (+ `podman_jobs_cap`) | **Inner** concurrency: passed to `podman build --jobs N`, controls how many stages of a *single* multi-stage build run concurrently. |

            Both knobs are **config-driven**: precedence is **CLI flag → env → `defaults:`
            in `charly.yml` → built-in fallback** (4). The inner auto value (when
            `--podman-jobs` / `CHARLY_PODMAN_JOBS` / `defaults.podman_jobs` are all unset) is
            CPU-proportional, capped at `defaults.podman_jobs_cap`: `min(NCPU, cap)`. The
            cap is the operative ceiling; the repo ships `podman_jobs_cap: 8`. (A
            high-concurrency `--cache-from` SIGABRT race in podman ≤ 5.7.x originally
            motivated a hard cap of 4 — see `CHANGELOG/` for that history and the 20-run
            race gate required before raising the cap on a new podman version.)

            ```yaml
            # charly.yml — defaults: block
            defaults:
              jobs: 4              # outer: images per DAG level
              podman_jobs: 0       # inner: 0 = auto = min(NCPU, podman_jobs_cap)
              podman_jobs_cap: 8   # ceiling for the auto calc
            ```

            ```bash
            charly box build <image> --podman-jobs 16             # fully parallel stages (override)
            CHARLY_PODMAN_JOBS=8 charly update <image> --build    # via env
            charly box build <image> --podman-jobs 1              # fully serialised, worst-case debugging
            ```

            Source: `candy/plugin-build/resolve.go` (`resolveDrivePodmanJobs`, feeding
            `buildkit.ResolvePodmanJobs`; the host-resolved `PodmanJobs` value feeds `--jobs`
            directly in `candy/plugin-build/podman.go`). Covered by
            `candy/plugin-build/podman_test.go`. The outer `--jobs` knob and the inner `--podman-jobs`
            are separate fields so the two semantics don't get conflated.

            ## Build-context excludes (`defaults.context_ignore`)

            `charly box generate` writes BOTH `.containerignore` and `.dockerignore` at the
            project root from a single source: a built-in baseline (`.git`, `bin`, `charly`,
            `*.md`, plus editor/python/node cache-bust globs) **plus** every entry in
            `defaults.context_ignore`. Both files are generated artifacts (gitignored) — do
            not hand-edit them; add excludes to `defaults.context_ignore` instead.

            ```yaml
            # charly.yml — defaults: block
            defaults:
              context_ignore:        # heavy dirs never COPYed by any Containerfile
                - image
                - .check
                - output
                - pkg
                - tests
            ```

            Why it matters: the build context tar is streamed to the engine on **every**
            build regardless of cache state, so excluding large never-COPYed directories is
            the dominant warm-rebuild win. podman reads `.containerignore`; docker reads
            `.dockerignore` — emitting both keeps the two engines in lockstep. Only add a
            directory you've confirmed no Containerfile COPY/ADDs from (generated
            Containerfiles COPY only from `candy/`, `templates/`, `.build/`). Source:
            `candy/plugin-build/host_prep.go:writeContextIgnore` + `charly/host_build_buildengine.go`
            (`baselineContextIgnore`, the embedded `context_ignore_baseline` directive the
            `buildengine-context-ignore-baseline` seam serves; the former `charly/generate.go` is
            DELETED, K-wave 2).

            ## Image-tag retention (`defaults.keep_images`)

            After `charly box build` (push runs excluded), charly prunes **tag rows** within each
            `ai.opencharly.box` group, keeping the newest `defaults.keep_images` **distinct
            images** and at most that same number of tags of each — except for rows the engine
            refuses to date, which are never removed **however many tags their image wears**, so
            the per-image cap binds datable rows only. A *distinct image* is a distinct image
            ID — every tag pointing at one ID is one image, however many tags it wears — so with
            `keep_images: 3`, four images carrying one tag each lose the oldest, while one image
            carrying six datable tags keeps three of them.

            **Which verb reclaims what.** The post-build pass cannot remove an image's LAST tag,
            so it never reclaims a *distinct image* — only surplus tags of images that wear
            several. `charly box build` holds the build-activity lock across its own prune, so
            that prune always observes a live build and the last-tag guard always engages. The
            distinct-image budget above is therefore enforced by `charly clean`, and a project
            that only ever builds will accumulate distinct images past `keep_images` without any
            surface reporting it.

            **Tag rows, not "CalVer tags":** a row is exempted from removal only when it has
            NEITHER a datable `ai.opencharly.version` label NOR a datable `:YYYY.DDD.HHMM` tag
            (`retention.go`'s guard is an AND). A bed build has a datable label and a non-CalVer
            tag, so it is a normal removal candidate rather than an excluded one.

            **Preview before enabling it**, with the value you are considering rather than one you
            have already committed to:

            ```bash
            charly clean --keep 3 --images --dry-run   # what keep_images: 3 WOULD remove
            ```

            `--keep` supplies the budget on the command line, so this answers the question while
            `defaults.keep_images` is still absent — with the key unset, retention is disabled and a
            plain `charly clean --dry-run` correctly shows nothing, which is not the preview you
            want. The count that surprises people is **tag rows, not images**.

            **Ordering is owned by `/charly-core:clean`**, which documents the retention engine
            itself — the full comparator chain, which key decides which ordinal, and why the build
            tag cannot serve as the image recency key. The two consequences that matter here:
            **between distinct images**, the datable `ai.opencharly.version` label decides when the
            two differ, and creation time decides when they tie — which is the usual case, because
            that label is **declared, not derived from content**: it is the box's own `version:`,
            else the highest candy `version:` across its whole candy set, else the base image's
            (`sdk/deploykit/effective_version.go`). So DISTINCT images built from DIFFERENT trees
            carry the SAME label until somebody bumps one of those fields, and creation time is
            what actually orders them; **within one image's tag rows**, the
            `:YYYY.DDD.HHMM` tag decides, because those rows share everything else. Do not carry
            *"creation time, not the tag"* across to the tag budget — it is true of the first and
            false of the second.

            Images referenced by a container (`podman ps -a`) are skipped, and `rmi` runs without
            `-f` as a backstop.

            ```yaml
            # charly.yml — defaults:
            defaults:
              keep_images: 3   # newest distinct images per box, and at most 3 tags of each;
                               # 0 (or absent) disables
            ```

            This stops the iterative-build tag accumulation that otherwise reclaims
            nothing. Run it on demand (and clear a backlog) with `charly clean` — see
            `/charly-core:clean` for the full retention surface (images + check runs + makepkg).

            ## Build Cache

            | Mode | Backend | Use Case |
            |------|---------|----------|
            | `image` | `<registry>/<image>` | Read-only cache from registry image (default) |
            | `registry` | `<registry>/cache:<image>` | Production CI/CD (read + write) |
            | `gha` | GitHub Actions cache | CI builds on GitHub Actions |
            | `none` | No cache | Same as `--no-cache` |

            ```bash
            charly box build --cache registry my-image        # Read+write registry cache
            charly box build --cache image my-image          # Read-only from registry image
            CHARLY_BUILD_CACHE=registry charly box build         # Via environment variable
            ```

            The default cache mode is also config-driven: precedence is `--cache` →
            `CHARLY_BUILD_CACHE` → `defaults.cache` in `charly.yml` → auto (`image` for local
            builds, `registry` for `--push`). Set `defaults.cache: image` to make the
            read-only registry cache the project default without per-invocation flags.

            ## CalVer-only tagging (no `:latest`)

            `charly box build` tags every image with exactly one tag — its CalVer
            (e.g. `ghcr.io/opencharly/fedora-supervisord:2026.114.1022`). charly does
            **not** emit a `:latest` tag, ever. Short-name resolution (in
            `sdk/kit/local_image.go`, `kit.ResolveLocalImageRef` — moved from
            `charly/local_image.go` in P12a) picks the newest CalVer for a given short name
            via the `ai.opencharly.box=<short>` + `ai.opencharly.version=<calver>`
            OCI labels. The CLI accepts an explicit `--tag <calver>` for pinning;
            an empty `--tag` resolves to newest-local automatically.

            Rationale:
            1. **No stale-`:latest`-under-`--cache-from` bug.** The documented
               caveat where podman's `--cache-from` silently pulls a stale
               `:latest` from the remote registry is unreachable when charly never
               emits `:latest` in the first place.
            2. **No "ambiguous short name" errors under multiple tags.** Previously
               the resolver listed every `:latest` + `:<calver>` tag of the same
               image as competing candidates; the CalVer sort picks the newest
               one deterministically.
            3. **One-tag-per-build keeps registry + local storage lean.** A float
               tag is a permanent nameable handle you have to garbage-collect;
               a CalVer tag is self-describing and rotates naturally.

            Any stray `:latest` tag in local storage is never refreshed by a new
            build; prune it with `podman image prune` if you want it gone.

            ## Cache Efficiency

            ### Core invariant — cache hits fully when nothing has changed

            **Running `charly box build <image>` with no source changes completes in seconds — every RUN/COPY/LABEL step hits the cache.** This is the invariant the rest of this section builds on. Cache-miss only happens when something in the build input genuinely changes; a rebuild you triggered "just to be sure" is free.

            Concretely: the cache is keyed by `(parent-image-SHA, instruction-text, COPY-source-content)`. The parent-image SHA resolves from the FROM reference at build time — a fresh CalVer tag that still points at the same image SHA keeps the subsequent RUN/COPY steps cached. Only when the underlying image SHA changes (because that upstream was rebuilt with changed content) does cache-miss cascade to the downstream steps.

            ### What legitimately invalidates cache

            Three kinds of source changes are real cache invalidators — if you see a long rebuild, one of these is the cause:

            1. **Layer source file content changed.** Editing a file under `candy/<name>/` — the canonical case is `candy/charly/bin/charly` being rewritten by `task build:binary` after a Go source edit — changes the scratch stage's content hash, which invalidates `COPY --from=<layer>` and everything downstream that depends on it.
            2. **Package list / task text changed.** Adding/removing an rpm/deb/pac entry or editing a `command:` body changes the RUN instruction text emitted for that layer, invalidating cache from that RUN onward.
            3. **Upstream image content changed.** If a base image (external like `fedora` or internal like `fedora-supervisord`) has different content from the last cached build, the FROM step resolves to a new SHA and downstream RUN/COPY steps all cache-miss. This cascades through the dependency graph — rebuilding `fedora-supervisord` forces its children to re-run from the `FROM fedora-supervisord` step.

            ### What does NOT invalidate cache

            - **CalVer tag shifts alone.** The Containerfile emits `ARG BASE_IMAGE=<registry>/<name>:<calver>` with a fresh CalVer on every generate. That ARG default appears in the Containerfile text but is not part of the cache key for subsequent RUN/COPY steps — podman/buildah resolves the FROM to an image SHA first, and caches downstream steps off that SHA. If the SHA is unchanged, cache hits. The cache cost comes from content changes in the layer itself, not the tag.
            - **Baked `plan:` edits.** LABEL directives are emitted last in every final stage (after the last USER). Editing a baked step (a `check:`/`agent-check:` step, or a runtime-context `run:` step) — a common layer mutation — only re-runs the final LABEL block (~2 seconds on a 138-step stack like `immich-ml`). (Editing a build/deploy-context `run:` step changes the install timeline, so it re-runs that RUN/COPY instead.) See `/charly-internals:generate-source` for the rationale.
            - **Re-running `charly box build` without source changes.** Fully cached; seconds to complete.

            ### `write:` vs `copy:` — cache granularity

            - `write:` steps use `StageInlineContent` (content-addressed staging under `.build/<image>/_inline/<layer>/<sha256>/`). Editing a `write: content:` block changes only that single COPY layer's cache key — siblings in the same layer keep their cache.
            - `copy:` steps reference files from the layer directory. Editing any file under `candy/<name>/` changes the WHOLE scratch stage's content hash (since `COPY candy/<name>/ /` is one instruction), invalidating every downstream `COPY --from=<layer>` step.

            ### Rule of thumb for rebuild cost

            | Edit | Cost |
            |------|------|
            | `charly box build` with zero source changes | Seconds — every step cache-hits |
            | A baked `check:` step / label entry | ~2 sec (LABEL re-emit only) |
            | A `write:` step's content | Just that single content-addressed COPY layer |
            | A `copy:` source file's content | Rebuild from that layer's COPY onward + downstream |
            | A `command:` / `download:` run step body | Rebuild from that RUN onward + downstream |
            | A package added/removed in `rpm:`/`deb:`/`pac:` | Rebuild from the install RUN onward + downstream |
            | `task build:binary` → new `candy/charly/bin/charly` | Rebuild the `charly` layer + every image that includes it |
            | An upstream image got content-changed and rebuilt | Rebuild from the FROM step onward in every descendant |

            ## Build Flow Details

            **Internal base images** use exact CalVer tags in Containerfiles (`FROM ghcr.io/opencharly/fedora:2026.46.1415`). This ensures each image references the precise version of its parent. Both Docker and Podman resolve local images before pulling from registry.

            ## Push Mode

            - **Docker:** `docker buildx build --push` for multi-platform builds
            - **Podman:** `podman build --manifest` + `podman manifest push`

            Podman manifest push uses retry with exponential backoff (3 attempts, 5s/10s/20s delays) to handle transient registry errors (e.g., GHCR 500 errors after long builds).

            Source: `candy/plugin-build/podman.go` (`retryCmd`).

            ## Layer Merging

            Post-build optimization that merges consecutive small layers:

            ```bash
            charly box merge <image> --dry-run         # Preview what would be merged
            charly box merge <image>                   # Merge small layers
            charly box merge --all                     # Merge all images with merge.auto enabled
            charly box merge <image> --max-mb 512      # Custom per-layer threshold
            charly box merge <image> --max-total-mb 4096  # Custom total image size limit
            ```

            Configure in charly.yml:

            ```yaml
            defaults:
              merge:
                auto: true        # Auto-merge after builds
                max_mb: 128       # Max merged layer size (MB)
                max_total_mb: 0   # Max total image size for merge (0 = no limit)
            ```

            CLI flags `--max-mb` and `--max-total-mb` override `charly.yml`. `auto` is only used by `charly box merge --all` to select which images to merge; `charly box merge <image>` always merges regardless. `max_total_mb` controls whether large images skip merging entirely (the merge process decompresses layers in memory). Set to `0` to disable (default), or a positive value like `2048` to cap on low-memory CI runners.

            ### Algorithm

            1. Load image from engine via `<engine> save` -> `tarball.ImageFromPath()`
            2. Get compressed sizes via `layer.Size()`
            3. Group consecutive layers into groups totaling <= `max_mb`
            4. Single-layer "groups" are kept as-is (need 2+ layers to merge)
            5. For each merge group: read uncompressed tarballs, deduplicate entries by path (last writer wins), write combined tar into a single new layer
            6. Reconstruct image with `mutate.Append()`, preserving OCI history alignment (empty-layer entries for ENV/USER/EXPOSE kept in correct positions)
            7. Save via `tarball.WriteToFile()` -> `<engine> load`

            Merge is idempotent -- running again after merging shows all layers as `[keep]`. The engine itself lives out-of-process in `candy/plugin-oci/merge.go` (`runMerge`/`mergeImageRef`, the P14a cutover); `charly box merge`'s CLI surface is `candy/plugin-box/merge_cmd.go` (P14 — relocated OUT of charly core, which now carries zero merge-specific code).

            ### Inline Merge

            Images are merged immediately after building, before their children are built. Child images inherit a merged (fewer-layer) base, producing smaller final images. Both local and push builds merge inline. `candy/plugin-build/drive.go`'s `mergeBox` handles this -- it checks `MergeAuto` on the build-resolve model and asks `verb:oci` to run the merge via `InvokeProvider` if enabled.

            For filtered builds (`charly box build <image>`), only the built images are merged. For full builds (`charly box build`), merge runs after each dependency level completes.

            ## Engine Configuration

            ```bash
            charly settings set engine.build docker   # or podman
            charly settings set engine.run docker     # or podman
            ```

            ## Host Prerequisites (First Time)

            Building images needs the `charly` binary and a container engine — `docker` or `podman`, whichever `engine.build` names. Nothing else, and no project checkout: `charly box build` runs against the `charly.yml` in the current directory, one started by `charly box new project <dir>` or read from a published project with `--repo <owner>/<repo>`.

            Install `charly` as a distro-native package with your OWN package manager (`pacman -U` / `dnf install` / `apt install` / `apk add`) — the `charly generate-packages` plugin (nFPM) builds the `.pkg.tar.zst`/`.rpm`/`.deb`/`.apk`/`.ipk` published to the per-distro package repos. Obtaining the binary is covered end to end at [Install](https://opencharly.ai/start/install/); it is the one page that describes building from a source tree.

            ```bash
            charly box build   # Generate + build + merge all images
            ```

            Multi-platform `--push` builds additionally need a Docker buildx builder that can target more than the host platform — a Docker-side prerequisite, not a charly one. Single-platform local builds need no builder setup.

            ## Common Workflows

            ### Build a Single Image

            ```bash
            charly box build my-app
            ```

            ### Rebuild After Layer Changes

            ```bash
            charly box build my-app
            # Only changed layers are rebuilt (Docker layer cache)
            ```

            ### Push to Registry

            ```bash
            # Authenticate first
            docker login ghcr.io
            # or: podman login ghcr.io

            charly box build --push
            ```

            ## Troubleshooting

            ### "charly not found"

            Install a distro-native package (built by the `charly generate-packages` plugin and published to the per-distro package repos) with your OWN package manager (`pacman -U`/`dnf install`/`apt install`/`apk add`). If it is installed but not resolving, `$PATH` is the usual cause — `which charly` reports which copy wins.

            ### Build Fails with Missing Base

            Build base images first. `charly box build` handles dependency ordering automatically, but if building a single image, its base must already exist.

            ### Cache Miss

            First build on a new machine won't have cache. Use `--cache registry` to pull from registry cache if available.

            ### RPM Conflict: ffmpeg-free vs negativo17

            If a build fails with `conflicting requests` involving `libavcodec-free` vs `libavcodec` (epoch 1), the candy is trying to install `ffmpeg-free` (Fedora) in an image that has negativo17's `ffmpeg-libs` (via cuda candy). Fix: change `ffmpeg-free` to `ffmpeg` in the candy's `rpm.packages` and add the `fedora-multimedia` repo from negativo17. See the `immich` candy for the correct pattern.

            ### YAML Unmarshal Error on charly.yml

            If you see `cannot unmarshal !!str ... into int` or similar YAML parsing errors on layer fields, the `charly` binary is older than the schema the file is stamped at. `charly version` prints its CalVer; upgrade to a newer published package and re-run `charly box validate`.

            ### Stale `charly` binary produces stale Containerfiles

            Beyond the YAML-unmarshal symptom above, a stale `charly` binary can produce *syntactically valid but outdated* Containerfile output — e.g. emitting an old broken form of a template a later release already fixed. Symptom: a build fails on a step whose generated shell does not match what the current release documents. Quick diagnostic: `charly version` against the CalVer of the release that carries the fix; if the binary predates it, upgrade to a newer published package and rebuild.

            If the symptom persists after upgrading, the copy on `$PATH` may not be the one you just installed — `which charly` reports which wins.

            ### Buildah cache-mount corruption (pixi tzdata et al.)

            Cache mounts declared via `--mount=type=cache,dst=<path>,uid=<u>,gid=<g>` (used for pixi, npm, cargo, rattler, dnf) persist across builds and are **not** evicted by `charly box build --no-cache` (which only suppresses `--cache-from`; see above). A disk-full event mid-download can leave a partial package in the cache, and every subsequent build re-hits the same broken file:

            ```
            error: × failed to link tzdata-2025c-hc9c84f9_1.conda
              ├─▶ failed to copy file ... zoneinfo/<Region>/<City>: No such file or directory
            ```

            Options, in order of least to most disruptive:

            1. **Just retry the build.** Often the cache clears itself once the partial package finishes downloading or gets superseded by a checksum mismatch.
            2. **Bump a content-hash on the builder layer** (e.g. `echo "" >> candy/pixi/charly.yml`) to evict the cache mount associated with that build-stage's hash, then revert the cosmetic change. Same workaround as the scratch-stage cache issue above.
            3. **`podman image prune -af` is NOT the right hammer** — see next note.

            ### `podman image prune -af` caveat — removes tagged-but-idle images

            `podman image prune -a -f` will delete tagged images that are **not referenced by a running container**. That means the image you just built via `charly box build` — and haven't started as a container yet — is eligible for prune. Observed sequence: `charly box build` → `podman image prune -af` → `sudo podman load` (manual rootful refresh) fails with `image not known`. Protect the fresh build by starting a container or use `prune` with explicit filters instead.

            ### `--no-cache` does not invalidate intermediate scratch-stage caches

            `charly box build --no-cache <image>` and `charly box build --cache none <image>` reliably disable the
            cache for the **final image stage**, but in observed behavior they do **not** propagate
            to intermediate scratch stages produced by `COPY candy/<x>/ /` instructions
            (`[15/25] STEP 2/2: COPY candy/labwc/ /` style). Editing a single file inside a layer
            directory and rebuilding with `--no-cache` may still pull the labwc scratch stage from
            cache, leaving the new file content out of the rebuilt image.

            **Workaround:** force a content-hash bump on the layer's `charly.yml`. The simplest is
            adding (or removing) a trailing comment line:

            ```bash
            echo "" >> candy/labwc/charly.yml          # bump content hash
            charly box build selkies-desktop                   # now invalidates the labwc scratch stage
            git checkout -- candy/labwc/charly.yml     # revert the cosmetic change
            ```

            This was discovered while shipping commit `febb9bd` (labwc autostart race fix): the
            edit to `candy/labwc/autostart` did not propagate to the rebuilt image until
            `candy/labwc/charly.yml` itself was touched. Two consecutive `--no-cache` rebuilds
            produced the same image hash (`502c8012c7a5`) until the charly.yml content changed.

            Symptom: `charly box list tags <name>` shows a new tag, but `charly shell <image> -c "cat /path/to/changed/file"`
            returns the **old** content.

            ### Known caveat: stale `:latest` under `--cache-from`

            charly's Containerfile generator currently emits `FROM <registry>/<builder>:latest`
            for parent builder images (not pinned CalVer). When charly invokes
            `podman build --cache-from <registry>/<image>`, podman resolves those `FROM`
            clauses at parse time and will **pull `:latest` from the remote registry**,
            silently clobbering any locally-rebuilt `:latest` tag. For images that rebuild
            their builder stages in the same invocation this can lead to the later
            stages using the **stale registry builder** instead of the freshly-built one.

            **Symptom observed on this project:** `charly update selkies-desktop --build`
            fails deep inside selkies' `pixi install && bash build.sh` step with
            `error: can't find Rust compiler`. The remote
            `ghcr.io/opencharly/fedora-builder:latest` predates the `build-toolchain`
            layer adding `cargo` as an RPM, so its pixi env has no rustc — even though
            the current local `build-toolchain/charly.yml` lists `cargo`. The build phase
            that rebuilds fedora-builder locally *does* run, but parent-stage FROM
            resolution happens before that stage exists, and podman pulls the stale
            remote image.

            **Workaround until the generator is fixed:**

            ```bash
            charly box build <image> --cache=none      # or equivalently --no-cache at the charly level
            ```

            Both `--cache=none` and `--no-cache` short-circuit `cacheArgs()` in
            `candy/plugin-build/podman.go` (`driveConfig.cacheArgs`) and do NOT pass `--cache-from` to podman, so
            the broken resolution path never fires. `--no-cache` is charly-level only — it
            does *not* pass `--no-cache` to podman, it just skips `--cache-from`.

            **Proper fix (not yet implemented):** charly's generator should emit pinned
            CalVer tags for builder `FROM` clauses (e.g.,
            `FROM ghcr.io/opencharly/fedora-builder:2026.105.0128`) or pass
            `--pull=never` to podman so local tags aren't resolved from the remote.
            Tracked as a follow-up.

            See also: `/charly-build:generate` for the Containerfile generation path, `/charly-core:charly-update`
            for the `--build` flag that also picks up this caveat.

            ## Project directory override

            `charly box build` (like every build-mode command) resolves `charly.yml` via `os.Getwd()`. Override with `-C <dir>` / `--dir <dir>` / `CHARLY_PROJECT_DIR=<dir>` — honoured before Kong dispatch. See `/charly-image:image` "Project directory resolution" for the canonical reference and the `charly mcp serve` use case. Typical use: building from an `charly mcp serve` MCP tool where the container cwd doesn't hold the project.

            ## Cross-References

            ### `charly box` family siblings

            - `/charly-image:image` -- Family overview + charly.yml composition reference
            - `/charly-build:generate` -- Containerfile generation (called internally; stale `:latest` FROM lives there)
            - `/charly-build:inspect` -- Inspect resolved image config before building
            - `/charly-build:list` -- Enumerate images, layers, build targets
            - `/charly-build:merge` -- Post-build layer consolidation (runs inline after each build level)
            - `/charly-build:new` -- Scaffold a new candy directory before adding to `charly.yml`
            - `/charly-build:pull` -- Pull prebuilt images; orthogonal to building (use for downstream deploy-mode commands)
            - `/charly-build:validate` -- Validate `charly.yml` + layers before building

            ### Related skills

            - `/charly-image:layer` -- Layer definitions that get built
            - `/charly-check:check` -- Tests are embedded as `ai.opencharly.description` OCI label at build time; LABEL-at-end optimization (see Cache Efficiency above) makes test edits cheap.
            - `/charly-core:charly-update` -- `charly update <image> --build` invokes `BuildCmd.Run` and picks up the same `--jobs` cap and stale-`:latest` caveat
            - `/charly-vm:vm` -- Building bootc disk images (`charly vm build`)
            - `/charly-core:charly-config` -- Engine configuration
            - `/charly-automation:enc` -- Encrypted-volume restart path interacts with the `--build` flow (`charly config mount` short-circuit means builds can restart services without touching the keyring)

            ## When to Use This Skill

            **MUST be invoked** when the task involves building images, pushing to registries, build caches, or layer merging. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Typically first in a lifecycle chain.
            Next step: `/charly-core:deploy` (quadlet setup, tunnels) → `/charly-core:service` (start and manage).

            ## Related skills

            - `/charly-internals:capabilities` — OCI labels emitted during the build stage; `CapabilityLabelMap` completeness check

            Live-deploy verification: see /charly-check:check (the 11 Testing Standards) and /charly-internals:disposable.

charly-mcp-cmd-skill:
    skill:
        name: charly-mcp-cmd
        family: build
        owner: charly-build
        description: |-
            MUST be invoked for either Model Context Protocol direction: the declarative out-of-process `mcp:` check verb that probes advertised servers, or `charly mcp serve`, which exposes the reflected Charly CLI over Streamable HTTP or stdio. Covers URL rewriting, host-networked and published ports, tool annotations, read-only filtering, project fallback, authoring tools, and the `charly-mcp` deployment layer. The name avoids collision with harness slash commands and the `/charly-coder:charly-mcp` image skill.
        content: |
            # MCP - Model Context Protocol (client + server)

            `charly` speaks MCP in both directions. This skill covers both:

            - **Client** — the declarative `mcp:` check verb: connect to any MCP server declared via `mcp_provide` and probe/call/read. Authored as an `mcp:` step in a candy/box plan and run via `charly check live <image> --filter mcp`; it is served OUT-OF-PROCESS by `candy/plugin-mcp` and has **no** host `charly check` subcommand (parallel to the `kube:`/`spice:`/`adb:`/`appium:` plugin verbs). Used to test MCP endpoints shipped by `jupyter-mcp`, `chrome-devtools-mcp`, or the charly server itself.
            - **Server** — `charly mcp serve`: expose the entire charly CLI surface (build + test + deploy modes; one tool per leaf command) as MCP over Streamable HTTP or stdio. Used by LLM agents (Claude Code, Open WebUI, OpenClaw) to drive charly remotely. Deployed in-container via the `charly-mcp` layer. The tool catalog includes a project-scaffolding + YAML-editing + file-write authoring surface, so an agent can build an `charly` project from scratch over RPC — see "Authoring tools" below.

            Both surfaces are legs of the SAME plugin candy: `candy/plugin-mcp` serves `verb:mcp` (the client) AND `command:mcp` (the server, `serve.go`), sharing one `github.com/modelcontextprotocol/go-sdk`; charly's core links NO MCP SDK — its host half is the SDK-free `charly __cli-model` seam (`charly/cli_model_cmd.go`).

            ---

            # Part 1 — Client (the declarative `mcp:` check verb)

            ## Overview

            The `mcp:` check verb connects to Model Context Protocol servers declared by running containers via `mcp_provide`, using [github.com/modelcontextprotocol/go-sdk](https://pkg.go.dev/github.com/modelcontextprotocol/go-sdk) (v1.5.0). The methods cover the full MCP client surface: `ping`, `servers`, `list-tools`, `list-resources`, `list-prompts`, `call`, `read`. No MCP URL argument is ever typed by the user — the out-of-process plugin reads the target image's `ai.opencharly.mcp_provide` OCI label via the generic `cc.ResolveImageLabel` reverse-leg, resolves `{{.ContainerName}}` templates, applies pod-aware `localhost` rewriting, and maps the container-network URL to the published host port via `cc.ResolveEndpoint` (the host owns that machinery behind the class-generic reverse-legs).

            **Served out-of-process — no host CLI subcommand.** The verb is a DECLARATIVE check verb only; there is no `charly check` subcommand for it (just like `kube:`/`spice:`/`adb:`/`appium:`). The MCP-client implementation (the go-sdk dial + the MCP methods) lives in `candy/plugin-mcp`, an out-of-tree charly plugin that charly's loader go-builds on the host and serves out-of-process over go-plugin gRPC (`LocalTransport`). A `check:` step carrying `mcp:` dispatches through the provider registry exactly like a built-in verb (`ResolveVerb("mcp")` → grpcProvider → `Provider.Invoke` with the full `Op` marshaled + a `CheckEnv` snapshot). Exercise it with `charly check live <image> --filter mcp`.

            ### Authoring shape

            Each `mcp:` step is a `check:` step — an ordered list item under a candy/box `plan:`. The method name is the scalar value for a bare-method step (`mcp: ping`), or the `method:` key of the `mcp:` map when the step carries mcp-exclusive fields (`tool:`, `uri:`, `input:`, `mcp_name:`) — those live INSIDE the `mcp:` map. Only the shared matchers (`stdout:`, `stderr:`, `exit_status:`) and `context:`/`timeout:`/`id:` stay siblings. See `/charly-check:check` for the parent router and the complete method allowlist. Example:

            ```yaml
            - check: jupyter exposes its core notebook mcp tools
              context: [deploy]
              mcp: list-tools
              stdout:
                - contains: insert_cell
                - contains: execute_cell
            ```

            ## Quick Reference

            | Action | Declarative step | Description |
            |--------|------------------|-------------|
            | Ping | `mcp: ping` | Liveness check — emits `ok` on a successful `Ping` RPC |
            | Enumerate | `mcp: servers` | List MCP servers declared by the image (no dial) |
            | List tools | `mcp: list-tools` | Tool name + first-line description per line |
            | List resources | `mcp: list-resources` | URI + name + MIME type per line |
            | List prompts | `mcp: list-prompts` | Prompt name + description per line |
            | Call | `mcp: {method: call, tool: …}` (+ optional `input:`) | Invoke a tool; emits TextContent payload |
            | Read | `mcp: {method: read, uri: …}` | Read a resource; emits Text content |

            The `tool:`/`uri:`/`input:`/`mcp_name:` fields live INSIDE the `mcp:` map; a
            bare-method step (`mcp: ping`) uses the scalar form. Every method accepts:
            - `mcp_name: <server>` (in the map) — disambiguate when the image declares multiple `mcp_provide` entries
            - `timeout: <duration>` (a shared `#Op` sibling) — per-operation timeout (default 30s)
            - the shared matchers (`stdout:`, `stderr:`, `exit_status:`) as siblings

            Output is always tab-separated plaintext fed to the matcher pipeline (no `--json` form — that was a property of the retired host CLI). Run a candy's baked `mcp:` steps against a live deployment with `charly check live <image> --filter mcp`.

            ## Architecture

            The host owns all podman / OCI-label / port-mapping machinery behind the class-generic reverse-legs (`cc.ResolveImageLabel` for the declared servers + `cc.ResolveEndpoint` for the host-routable dial address); the out-of-process `candy/plugin-mcp` provider resolves its endpoint through them and builds a single `*mcp.ClientSession` per invocation. The plugin needs no container inspection at all.

            1. **Container resolution** (host): `resolveContainer(image, instance)` → `charly-<image>[-<instance>]`.
            2. **Image ref + metadata** (host): `containerImageRef` → `ExtractMetadata` → `meta.MCPProvide` (read from OCI label `ai.opencharly.mcp_provide`).
            3. **Template substitution** (host): any `{{.ContainerName}}` in the URL is replaced with the resolved container name.
            4. **Pod-aware rewrite** (host): `podAwareMCPProvides` folds same-image entries so the URL host becomes `localhost` (identical to the CHARLY_MCP_SERVERS path used by `charly config`).
            5. **Host-side port rewrite** (host): the load-bearing piece. The host parses the URL; if the host is the container name or `localhost`, it looks up the published host port for the URL's port via `podman inspect` (same `NetworkSettings.Ports` data that powers `${HOST_PORT:N}` in declarative tests) and rewrites to `127.0.0.1:<host-port>`. Non-matching hosts (external URLs) pass through unchanged. The pre-resolved `mcp_provides` + the single picked endpoint travel to the plugin in the `CheckEnv` snapshot.
            6. **Transport pick** (plugin): `transport: http` (or empty) → `StreamableClientTransport{Endpoint}`; `transport: sse` → `SSEClientTransport{Endpoint}`; any other string errors at dial time with the declared transport echoed.
            7. **Session** (plugin): `mcp.NewClient(…).Connect(ctx, transport, nil)` runs the MCP `initialize` handshake and returns an opened `ClientSession`; the provider evaluates the step's matchers itself and returns a `{status,message}` verdict to the host. A `defer session.Close()` always fires.

            Source: the endpoint resolution lives in `candy/plugin-mcp` (`resolve.go` — the `cc.ResolveImageLabel` + `cc.ResolveEndpoint` reverse-legs), alongside the MCP client (the MCP methods + the dial: `provider.go` dispatch + `methods.go` client layer). See `/charly-internals:plugin` for the out-of-process provider model and `/charly-internals:go` for the host-side map.

            ## Methods

            Each method is shown as the declarative `mcp:` step you author. Run them against a live deployment with `charly check live <image> --filter mcp`.

            ### Ping

            ```yaml
            - check: the jupyter mcp server responds to ping
              context: [deploy]
              mcp: ping
              stdout:
                equals: ok
            ```

            Calls `ClientSession.Ping(ctx, nil)`. Passes iff the server responds. Useful as a liveness check, often paired with a short `timeout:`.

            ### Servers (discovery only, no dial)

            ```yaml
            - check: the image advertises the jupyter mcp server
              context: [deploy]
              mcp: servers
              stdout:
                contains: jupyter        # emits "<name>\t<url>\t<transport>" per server, e.g. jupyter http://localhost:8888/mcp http
            ```

            Reads `mcp_provide` from the OCI label, applies template substitution + pod-aware rewrite, emits the result. No MCP handshake — metadata only. Useful for confirming which server names the image advertises before dialing.

            ### List tools / resources / prompts

            ```yaml
            - check: the jupyter mcp server exposes its notebook tools
              context: [deploy]
              mcp: list-tools
              stdout:
                - contains: list_notebooks   # "list_notebooks\tList all notebooks accessible in the workspace."
                - contains: execute_cell
            ```

            Plaintext output is tab-separated (`name\tfirst-line-of-description`) for easy `contains:` matching without JSON parsing. Multi-line descriptions collapse to the first non-empty line. `list-resources` emits `uri\tname\tmime`; `list-prompts` emits `name\tdescription`. The provider automatically pages through `NextCursor` so all results return in a single invocation.

            ### Call a tool

            ```yaml
            - check: list_notebooks returns successfully
              context: [deploy]
              mcp:
                method: call
                tool: list_notebooks          # required
                input: "{}"                   # optional JSON arg blob; omit for zero-arg tools
              exit_status: 0                  # assert no IsError (shared #Op sibling)
            ```

            The `input:` field is the tool's arguments as a JSON object (optional — omit for zero-arg tools), parsed with `encoding/json`. Returned `TextContent` blocks emit one per line; `ImageContent` / `AudioContent` emit a `[image content: <mime>, <N> bytes]` placeholder. If the server sets `IsError: true`, the step FAILS with the error text.

            ### Read a resource

            ```yaml
            - check: reading a resource returns a non-empty body
              context: [deploy]
              mcp:
                method: read
                uri: file:///workspace/data.txt   # required
              stdout:
                - matches: "."                # non-empty body
            ```

            Calls `ReadResource(URI: …)`. Text content is emitted to stdout; binary blobs emit a `[binary resource …]` placeholder.

            ## Disambiguating multiple servers

            When an image declares more than one `mcp_provide` entry, every `mcp:` step requires the `mcp_name:` modifier; without it the step FAILS with `image provides multiple mcp servers; use mcp_name (available: jupyter, chrome-devtools)`:

            ```yaml
            - check: the chrome-devtools mcp server responds to ping
              context: [deploy]
              mcp:
                method: ping
                mcp_name: chrome-devtools
            ```

            No existing image ships multiple providers today — `jupyter` layers expose one server (`jupyter`), `chrome-devtools-mcp` exposes one (`chrome-devtools`). The disambiguation exists for future compositions.

            ## Port-publishing gotcha (encountered during live testing)

            **Symptom:** a `mcp: ping` step (e.g. via `charly check live <image> --filter mcp`) fails with:

            ```
            mcp chrome-devtools: container port 9224/tcp is not published to a host port;
            declare `ports: [9224:9224]` in the image or run the test from inside the pod
            ```

            **Cause:** the image's OCI label declares the port (e.g., `chrome-devtools-mcp` adds `9224` to `sway-browser-vnc`'s port list), but the running container's quadlet doesn't publish it because `charly.yml`'s per-image `port:` entry **replaces** (not appends to) the image-declared list. When a new mcp-providing layer is added to an image that already has a `charly.yml` entry with an explicit `port:` list, the new port silently drops out.

            **Fix:** either add the mcp port to the instance's `charly.yml` entry:

            ```yaml
            # ~/.config/charly/charly.yml
            sway-browser-vnc:
                pod:
                    image: sway-browser-vnc
                    port:
                        - "5900:5900"
                        - "9250:9222"
                        - "9224:9224"   # ← add this
            ```

            … or remove the `port:` override entirely so the image default (which already includes 9224) applies. Re-run `charly config <image>` and restart the service (`charly stop && charly start` — `charly update` may no-op if the image tag hasn't changed).

            **Verification** that the fix worked:

            ```bash
            charly status <image> --json
            # Expect: the mcp port listed in the port mappings with a non-null host port
            charly check live <image> --filter mcp
            # the mcp: ping step passes
            ```

            Instance-specific deployments (the `-i <instance>` form) typically have their ports declared at create-time and are less prone to this drift.

            ## Transport dispatch

            | Declared `transport:` | SDK transport | Notes |
            |-----------------------|---------------|-------|
            | `http` or empty | `StreamableClientTransport{Endpoint}` | Project default; jupyter-mcp and chrome-devtools-mcp both speak this |
            | `streamable`, `streamable-http` | `StreamableClientTransport{Endpoint}` | Aliases |
            | `sse` | `SSEClientTransport{Endpoint}` | Legacy SSE servers |
            | anything else | error | `"unsupported mcp transport %q (expected http or sse)"` |

            The SDK's transports are struct-literal constructors — there is no `NewStreamableClientTransport(...)` helper. Setting `Endpoint` is the only required field.

            ## Output format: plaintext

            Every method emits author-friendly plaintext with one record per line:

            - `ping` → `ok`
            - `list-tools` → `<name>\t<first-line-of-description>`
            - `list-resources` → `<uri>\t<name>\t<mime-type>`
            - `list-prompts` → `<name>\t<description>`
            - `call` → concatenated `TextContent.Text` payloads, one per line
            - `read` → concatenated `ResourceContents.Text`, one per line
            - `servers` → `<name>\t<url>\t<transport>`

            The plaintext is fed straight to the matcher pipeline. There is no JSON output form — the retired host CLI's `--json` flag went away with the subcommand; the out-of-process `candy/plugin-mcp` provider returns the plaintext to the host, which evaluates the step's matchers.

            ## Declarative authoring examples

            Checks currently shipping in the three provider candies (`candy/jupyter/charly.yml`, `candy/jupyter-ml/charly.yml`, `candy/chrome-devtools-mcp/charly.yml`), as list items under each candy's `plan:`:

            ```yaml
            # Liveness check — fastest sanity verification
            - check: the jupyter mcp server responds to ping
              context: [deploy]
              mcp: ping
              timeout: 10s

            # Catalog assertion — ensure the server exposes the tools we expect
            - check: the jupyter mcp server exposes the expected tools
              context: [deploy]
              mcp: list-tools
              stdout:
                - contains: insert_cell
                - contains: execute_cell

            # Real tool invocation — exercises the full request/response path
            - check: list_notebooks returns successfully
              context: [deploy]
              mcp:
                method: call
                tool: list_notebooks
                input: "{}"
              exit_status: 0

            # Tool with arguments
            - check: get_notebook returns a notebook with cells
              context: [deploy]
              mcp:
                method: call
                tool: get_notebook
                input: '{"path":"getting-started.ipynb"}'
              stdout:
                - contains: cells

            # Resource read
            - check: a prompt resource reads back non-empty
              context: [deploy]
              mcp:
                method: read
                uri: file:///workspace/prompt.txt
              stdout:
                - matches: "."
            ```

            Each `mcp:` step is a `check:` step — a deterministic probe that satisfies the mandatory-ADE gate. **Deploy-context only.** `mcp:` steps require a running container with the mcp port published; `charly box validate` rejects build-context mcp steps at authoring time, and `charly check box` skips them at runtime with the message `"mcp: <method> requires a running container (skip under charly check box)"`. Follow the same rule as the other four live-container verbs — `cdp`, `wl`, `dbus`, `vnc`.

            ## Validator coverage

            `charly box validate` + the CUE schema enforce (the `mcp` verb is an out-of-process plugin — its method-name enum is validated by CUE on core `#Op`, its required-modifier checks run in `candy/plugin-mcp` at dispatch):

            - Method name must be in `mcpMethods` (7 entries); unknown methods list the allowed set in the error.
            - `context` must include `deploy`; a build-context mcp step raises `"mcp: verb requires context:\"deploy\""`.
            - `call` requires `tool:`; missing field raises `"mcp: call requires modifier \"tool\""`.
            - `read` requires `uri:`.

            No other required modifiers — `ping`, `servers`, `list-*` take only the optional `mcp_name:`.

            ---

            # Part 2 — Server (`charly mcp serve`)

            ## Overview

            `charly mcp serve` runs the charly CLI *as* an MCP server. Every leaf command in the Kong CLI tree — `box.build`, `status`, `test.mcp.ping`, `config.setup`, `box.new.project`, `candy.add-rpm`, etc. — becomes a callable MCP tool. Tool catalogs are **auto-generated from Kong struct tags** by reflection — host-side, over the hidden `charly __cli-model` seam — with no hand-written schema per command. Result: **one tool per leaf command** covering the entire build + test + deploy surface, including the MCP-first authoring verbs (`image.{new.project, new.image, set, add-layer, rm-layer, fetch, refresh, write, cat}` + `layer.{set, add-rpm, add-deb, add-pac, add-aur}`).

            ```bash
            charly mcp serve                                # Streamable HTTP on :18765/mcp
            charly mcp serve --listen 127.0.0.1:9999        # Custom port
            charly mcp serve --path /api/mcp                # Custom HTTP path prefix (default /mcp)
            charly mcp serve --stdio                        # Stdio transport for editor/LLM integration
            charly mcp serve --read-only                    # Skip registering the destructive tools
            ```

            Server and client share one `github.com/modelcontextprotocol/go-sdk` inside the same plugin candy, so the wire format is identical and the `mcp: ping` check verb works against it unchanged.

            ## Architecture

            The server is the `command:mcp` leg of `candy/plugin-mcp` (`serve.go`), fed by ONE hidden host seam: `charly __cli-model` (`charly/cli_model_cmd.go`), which emits charly's ASSEMBLED Kong command tree — the core CLI struct plus the builtin command-provider grammar — as an `sdk.CLIModel` JSON document on stdout. Core links no MCP SDK.

            1. **Reflection (host-side)** — at startup `buildMcpServer(bin, readOnly, noDefaultRepo)` fork/execs `charly __cli-model` (`fetchCLIModel` — deliberately with NO project prefix: the model needs no project, so a cold-start network blip can never strip the project prefix) and registers one tool per model leaf via `cliLeafToTool(leaf, destructive)`:
               - **Name**: dot-joined command path (e.g. `box.build`, `test.mcp.ping`, `config.setup`).
               - **Description**: the leaf's help, with a `[destructive: …]` annotation appended for mutating tools.
               - **InputSchema**: JSON schema built from the model's args (`argToSchema`) — positionals become required properties, flags optional ones, `enum:`/`default:` surfaced. **Every schema has `additionalProperties: false`** — unknown keys are rejected by the SDK's input validation before the handler runs. The schema validator is LLM-honest about the allowed surface.
               - **Annotations**: destructive tools get `DestructiveHint: &true`; everything else gets `ReadOnlyHint: true`.

            2. **Destructive gating** — `mcpDestructivePaths` (`serve.go`) is an explicit allowlist of mutating tool paths (the lifecycle, config, secrets, deploy, image build/scaffold/edit, layer edit, VM, udev, alias, record, tmux, and settings families). When `--read-only` is set, `buildMcpServer` skips registration entirely rather than gating at runtime. `box.fetch` (idempotent, additive cache prime) and `box.cat` (read-only file read) are **not** in the destructive set despite living in the authoring family — they're safe under `--read-only`.

            3. **Tool invocation — fork/exec, no in-process capture** — `makeToolHandler(bin, prefix, leaf)` returns a closure. On call: decode the MCP JSON arguments, reconstruct a `[]string` argv via `argvFromJSON(…)` (booleans → bare flag, slices → repeated `--flag=value`, positionals in model order), then `forkCharly` runs `charly <prefix> <path> <args…>` as a SUBPROCESS and `assembleToolText` returns the captured stdout/stderr as a single `TextContent`. Errors become `IsError: true` tool results, not MCP-protocol errors — the LLM sees the failure text. The fork/exec design REPLACED the former in-process capture model wholesale: there is no `os.Stdout` redirect, no capture mutex, and subprocess output cannot leak past its own tool result.

            4. **Project prefix** — every tool call carries the managed prefix from `computeProjectPrefix` (see "Project-dir wiring" below); `childCharlyEnv` strips `CHARLY_PROJECT_DIR`/`CHARLY_PROJECT_REPO` from the child environment so the prefix stays authoritative.

            5. **Transport** — `mcp.NewStreamableHTTPHandler(func(*http.Request) *mcp.Server { return server }, nil)` wraps the server for HTTP mode; `--stdio` runs the same server over the stdio transport.

            ## Deployment: the `charly-mcp` layer

            Composing `charly-mcp` into an image deploys the server via supervisord:

            ```yaml
            # candy/charly-mcp/charly.yml (summary; the candy's required version: is elided)
            charly-mcp:
                candy:
                    description: Runs the charly CLI itself as an MCP server (charly mcp serve) over Streamable HTTP on :18765
            charly-mcp-candy:
                candy:
                    - charly
                    - supervisord
            charly-mcp-port:
                port:
                    - 18765
            charly-mcp-mcp_provide:
                mcp_provide:
                    - name: charly
                      url: "http://{{.ContainerName}}:18765/mcp"
                      transport: http
            charly-mcp-volumes:
                volumes:
                    - name: project        # Bind-mount the project root; see below
                      path: /workspace
            charly-mcp-env:
                env:
                    CHARLY_PROJECT_DIR: "/workspace"
            charly-mcp-service:
                service:
                    - name: charly-mcp
                      exec: /usr/local/bin/charly mcp serve --listen :18765
                      restart: always
                      enable: true
                      scope: system
            ```

            **Project-dir wiring** — build-mode tools (`box.build`, `box.inspect`, `box.list.*`) resolve `charly.yml` via `os.Getwd()`. Inside the container, cwd is `/workspace` (set by the `charly-mcp` layer's `CHARLY_PROJECT_DIR` env + `volume:` declaration). Three deployment patterns, in order of progressively less local setup:

            1. **Bind-mount** — the canonical `charly-mcp` pattern. The candy ships `env: CHARLY_PROJECT_DIR: /workspace` + `volumes: project → /workspace`; the deployer attaches a host checkout via `charly config <image> --bind project=/path/to/opencharly`. The charly CLI's global `-C` / `--dir` / `CHARLY_PROJECT_DIR` flag honours the env var before Kong dispatch, calling `os.Chdir(CHARLY_PROJECT_DIR)` once. Use this when the agent should see your in-flight local edits. The volume NAME is `project` (stable bind-mount API); the in-container PATH is `/workspace` (the generic name works whether the contents are an opencharly checkout or any other workspace).

            2. **Remote pin** — set `CHARLY_PROJECT_REPO=opencharly/charly@<sha-or-ref>` in the container env (e.g. via `charly config <image> -e CHARLY_PROJECT_REPO=...`). The charly CLI clones (or hits its `~/.cache/charly/repos/` cache) and chdirs into the cache path before Kong dispatch. No bind mount required. Use this for reproducible agent runs against a pinned upstream.

            3. **Auto-default** — `charly mcp serve` with no charly.yml reachable at cwd falls back to `github.com/opencharly/charly` by prepending a managed `--repo default` prefix to every project-dependent tool call (`computeProjectPrefix` in `candy/plugin-mcp/serve.go`); the child `charly` resolves + fetches the default-repo cache. The fallback fires regardless of `CHARLY_PROJECT_DIR` being set — the check is whether the cwd actually contains `charly.yml`, not whether the env var is populated (and `childCharlyEnv` strips the env from children so the prefix stays authoritative). This matters because the `charly-mcp` layer permanently sets `CHARLY_PROJECT_DIR=/workspace`: a deployer who forgets the `--bind` still gets a working MCP server backed by the upstream repo. Pass `--no-default-repo` to opt out — the server still runs, and project-dependent tools error at call time (the child reports "no project"). This is the only command surface that auto-fetches; the top-level CLI stays opt-in.

            See `/charly-image:image` "Project directory resolution" for the flag/env semantics; the implementation is `computeProjectPrefix` + `childCharlyEnv` in `candy/plugin-mcp/serve.go`.

            **Composition style** — `charly-mcp` uses `candy: [charly, supervisord]` (meta-layer composition) rather than `require:` (hard prerequisite) because it adds no install of its own — it's pure wiring. Boxes that want the MCP server add `charly-mcp` to their candy list; boxes that just want the charly binary continue to use the `charly` candy alone. Both `candy:` and `require:` reference other candies, but only `candy:` lets the using candy ship no install files.

            ## Verifying end to end

            ```bash
            # Build an charly-mcp-bearing image (e.g. charly-arch) and start it:
            charly box build charly-arch
            charly config charly-arch --bind project=/home/you/opencharly
            charly start charly-arch

            # From the host — the container's mcp_provide URL is auto-rewritten to the published host
            # port, then the candy's baked declarative mcp: steps (each carrying mcp_name: charly)
            # run against the live deployment:
            charly check live charly-arch --filter mcp
            # the mcp: ping / list-tools / call (version, box.list.boxes) steps all pass
            #   list-tools → the full tool catalog; call version → 2026.nnn.nnnn; call box.list.boxes →
            #   charly-arch [testing], arch [testing], … (reads charly.yml from the bind-mounted /workspace)
            ```

            The deploy-context `check:` step nodes in `candy/charly-mcp/charly.yml` cover this exact sequence: service-running, port-reachable, `mcp: ping`, `mcp: list-tools`, `mcp: call tool=version`, `mcp: call tool=box.list.boxes` (the last proves the bind-mount + CHARLY_PROJECT_DIR wiring). For an ad-hoc MCP client outside charly, point any MCP-speaking tool (e.g. `/charly-tools:mcporter`) at the published host port.

            ## Authoring tools (build-from-scratch over MCP)

            Every CLI verb under `charly box …` and `charly candy …` auto-becomes an MCP tool via Kong reflection. The authoring surface added for "build a project from scratch using only `charly mcp`" exposes these tools:

            | MCP tool | What it does |
            |---|---|
            | `box.new.project` | Scaffold `charly.yml` (the build vocabulary is embedded in the charly binary), `candy/`, `.gitignore`. |
            | `box.new.box` | Append a new image entry to `charly.yml`. |
            | `box.new.candy` | Scaffold `candy/<name>/charly.yml` with a stub. |
            | `box.set` | Set any value in `charly.yml` by dot-path (`defaults.tag`, `images.foo.layers`, …). Value is parsed as YAML. |
            | `box.add-candy` / `box.rm-candy` | Append / remove a layer from an image's `candy:` list (idempotent). |
            | `candy.set` | Set any value in `candy/<name>/charly.yml` by dot-path. |
            | `candy.add-rpm` / `candy.add-deb` / `candy.add-pac` / `candy.add-aur` / `candy.add-apk` | Append packages to a layer's `<format>.packages` list. Idempotent. Upgrades scaffold's null `package:` value to a real sequence. |
            | `box.fetch` / `box.refresh` | Pre-prime / re-clone the remote-repo cache. Spec defaults to `default` (opencharly/charly). |
            | `box.write` / `box.cat` | Write / read any file under the project root — escape hatch for free-form auxiliary files (`pixi.toml`, `package.json`, `root.yml`, scripts, `*.service`). Path is resolved against `os.Getwd()` and rejected if it escapes the project root. |

            All YAML edits go through the `yaml.v3` *node* API (not value unmarshal) so comments and key order are preserved across edits. The generic comment-preserving setter/node helpers (`kit.SetByDotPath` / `kit.MappingChild`) live in `sdk/kit/yaml.go` (tested in `sdk/kit/yaml_test.go`); the box authoring editors live in `candy/plugin-authoring/authoring_edit.go` (P14b — moved from core `charly/scaffold_cmds.go`; tested in `candy/plugin-authoring/authoring_edit_test.go`); the `candy` authoring command is the compiled-in `command:candy` plugin (`candy/plugin-candy/command.go`).

            End-to-end MCP-only worked example:

            ```jsonc
            // All called as MCP tool calls (e.g. via an `mcp: call` check step, or any MCP client):
            box.new.project   {"dir": "/tmp/hello"}
            box.new.box     {"name": "hello", "base": "quay.io/fedora/fedora:43"}
            box.new.candy     {"name": "hello-svc"}
            candy.add-rpm       {"name": "hello-svc", "packages": ["openssh-server"]}
            box.add-candy     {"image": "hello", "layer": "hello-svc"}
            image.validate      {}
            box.build         {"image": "hello"}
            box.inspect       {"image": "hello"}
            ```

            ## Port choice

            Default `:18765` chosen for non-collision with other MCP layers:
            - `8888` — jupyter-mcp
            - `9224` — chrome-devtools-mcp (via mcp-proxy)
            - `18789` — openclaw gateway

            ## Policy note

            The server registers destructive tools with `DestructiveHint: true` rather than withholding them. The LLM runtime (Claude Code, Open WebUI) is responsible for acting on the hint — e.g. prompting the user before calling an annotated tool. For hostile-LLM scenarios or untrusted network deployments, run with `--read-only` (drops the mutating tools at registration time) and/or restrict reach via the tunnel / Traefik candy.


            ## When to Use This Skill

            **MUST be invoked** when the task involves Model Context Protocol on either side:

            - **Client** — the declarative `mcp:` check verb (served out-of-process by `candy/plugin-mcp`; no host `charly check` subcommand), probing/testing MCP servers declared via `mcp_provide`, examining MCP tool/resource/prompt catalogs, debugging the URL-rewriter or port-publishing behavior, or authoring deploy-context `mcp:` step nodes in a candy/box plan.
            - **Server** — `charly mcp serve` operation, the `charly-mcp` layer, destructive-hint policy, the `--read-only` filter, Kong-reflection tool generation, the project-dir bind-mount pattern, or symptoms like "MCP tool returned empty output" (check `println` vs `fmt.Println` in the invoked command — the server captures `os.Stdout`, not fd 1).

            Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Test mode / live service operation. Client: deploy an image with `mcp_provide`, start it, then probe. Server: compose `charly-mcp` into an image, bind `--bind project=/path/to/opencharly` at config time, start the container, then consume from any MCP-speaking LLM runtime. Pairs with `/charly-check:check` (parent router + declarative-verb catalog), `/charly-core:charly-config` (consumer-side injection + `--bind` for the project dir), `/charly-coder:charly-mcp` (server deployment layer), and the consumer-layer skills (`/charly-hermes:hermes`, `/charly-openwebui:openwebui`).

docs-skill:
    skill:
        name: docs
        family: build
        owner: charly-build
        description: |-
            The `charly docs generate` verb — the generator that renders the reference half of the
            opencharly.ai documentation site from this repo's canonical sources.
            MUST be invoked before any work involving the `charly docs` command, the docs/ submodule's
            generated trees, `task docs:sync` / `task docs:drift`, the candy/plugin-docs runtime plugin,
            or the cross-reference rewriting that turns `/charly-<plugin>:<skill>` into site links.
        triggers:
            - "`charly docs` / the opencharly.ai site / the `docs/` submodule / `task docs:sync`/`docs:drift` / Starlight/Astro / `candy/plugin-docs` (runtime plugin) or `candy/docs-site`"
        content: |
            # docs — generate the opencharly.ai site

            `charly docs generate` emits the generated half of the documentation site published at
            **opencharly.ai** from the sources that already exist in this repository. It is served by
            `candy/plugin-docs`.

            ## Placement: a RUNTIME plugin, deliberately

            `plugin-docs` is **not** listed in `charly/charly.yml`'s `compiled_plugins:`. A dev-time
            documentation generator has no business inside every shipped `charly` binary — it is run on a
            contributor's machine to regenerate the site and nowhere else.

            charly prescans the declared `docs` word into the Kong grammar before parse and syscall.Exec's
            the plugin binary in CLI mode on the first actual `charly docs` invocation. Nothing about the
            generator needs the host reverse channel (it reads files and writes markdown), which is exactly
            what makes the out-of-process placement free here — the same property that lets `charly candy`
            and `charly migrate` run in either placement.

            Because it is not in `compiled_plugins:`, the plugin is **not in `go.work`**. The repository's
            checked-in automation owns generator synchronization, drift checks, plugin tests, dependency
            installation, local preview, and production builds; those are maintainer workflows rather than
            public CLI instructions.

            ## Usage

            ```bash
            charly docs generate \
              --out /absolute/path/to/site-content \
              --root /absolute/path/to/opencharly
            ```

            | Flag | Meaning |
            |---|---|
            | `--out` | docs content root to write into (required) |
            | `--root` | repo root holding `charly.yml`, `candy/`, `box/`, `plugins/` (default: cwd) |

            ## What it emits

            The generator owns six top-level entries — `index.md`, `grievances.md`, `vision.md`,
            `liberation.md`, `reference/` and `recipes/` — and rewrites them wholesale each run, so a deleted
            source entity disappears from the site instead of lingering as an orphan page. (The table below
            expands `reference/` into its sub-trees plus the single file `reference/providers.md`, so it
            runs to many rows.) What stays hand-authored is the teaching narrative this repository has no
            equivalent of: `start/`, `concepts/` and `guides/`.

            **Hand-authored pages are never WRITTEN — but they are read.** The boundary is the `DO-NOT-EDIT`
            header, not the path: the prune pass reads every `.md`/`.mdx` under `--out` and removes only those
            carrying it, so a page is matched by its content, never inferred from where it sits. The
            whole-site link gate then reads hand-authored pages too, deliberately — **a dead site-absolute
            link in a `concepts/` or `guides/` page fails generation**, exactly as it would in a generated one.
            Treating "hand-authored" as "the generator ignores it" is the trap; it will not overwrite your
            page, and it will refuse to build if you link somewhere that does not exist.

            The home page is the newest arrival and the one people get wrong: it used to be a hand-authored
            `index.mdx` restating `README.md`, and roughly two thirds of it was README prose maintained twice
            across a submodule boundary. It is now `index.md`, projected from `README.md`. **Edit the README,
            not the page.**

            | Tree | Source |
            |---|---|
            | `index.md` | `README.md`, H1 and tagline dropped (the frontmatter title and hero render them), `https://opencharly.ai/…` links rewritten site-relative, and the repo-relative targets `AGENTS.md`, `plugins/README.md` and `CHANGELOG/README.md` repointed at GitHub or their site equivalent |
            | `grievances.md` | `GRIEVANCES.md`, H1 dropped, repo-relative links rewritten for a web reader |
            | `vision.md` | `VISION.md`, H1 dropped, repo-relative links rewritten for a web reader |
            | `liberation.md` | `LIBERATION.md`, H1 dropped, repo-relative links rewritten — the deliberate easter-egg page, entered last in the sidebar as "Liberation" |
            | `reference/cli/` | one page per `command:` provider word |
            | `reference/candy/` | every defined candy: packages, services, and its `plan:` as an acceptance spec |
            | `reference/box/` | every defined box |
            | `reference/plugin/` | providers, placement, rendered `schema/*.cue` |
            | `reference/providers.md` | the inverted index: every reserved word → its owning plugin |
            | `recipes/` | every skill plus its `references/*.md` detail pages |

            Every emitted file carries a `DO-NOT-EDIT` header, and **regeneration on a clean tree is a
            no-op** — the same drift gate SDD applies to generated Go.

            ## Editing a source is a docs landing

            Everything in that table is a PROJECTION, and every one of its sources is an ordinary
            file people edit for reasons that have nothing to do with the site — a candy's
            `description:`, a plan step, a skill's prose. Each such edit re-projects its page, and
            from that moment the committed site no longer matches its sources, so this project's
            drift gate over the `docs` submodule stays red until the regenerated pages are committed
            there. **A one-line prose fix is therefore never a one-repo change.** Plan it as a
            multi-repo landing before starting, not after a gate says so.

            Two chains reach the site, and they are not the same length.

            **Candy and box prose — ONE hop.** `reference/candy/` and `reference/box/` are read
            straight off disk, walking each repo as its own project root. Editing a
            `candy/<name>/charly.yml` `description:` or `plan:` re-projects
            `reference/candy/<name>.md` in the same tree, immediately. The `docs` commit belongs to
            the same cutover as the candy edit.

            **Skill prose — TWO hops.** `recipes/` is NOT read from `candy/*/charly.yml`. A skill is
            authored as a `skill:` entity in its owning candy; `charly marketplace generate` projects
            that into `plugins/<plugin>/skills/<name>/SKILL.md`, and `charly docs generate` reads
            **that projection** — the `plugins/` submodule tree, never the candy source. Editing a
            `skill:` entity therefore changes nothing on the site until `charly marketplace generate`
            has run, and on any CLEAN checkout the tree it reads is the pinned gitlink, so the change
            reaches readers only once the `plugins` landing merges and the superproject's `plugins`
            gitlink advances. **Advancing that gitlink without regenerating `docs` in the same change
            is what leaves the published site stale**, and nothing except this project's drift gate
            will say so — which is precisely how the mirror has fallen behind before.

            The ordering this forces — regenerate the projection, land the producer repo, then the
            consumer and its pin — is `/charly-internals:git-workflow` B6's producer→consumer rule
            applied to documentation. That skill owns the landing sequence, including the
            maintenance commands this project runs for it; the mechanism above is what makes the
            sequence necessary, and is all this page needs to carry.

            ## Defined, not default-active

            The catalog enumerates what is **defined**, never what happens to be switched on. This is not a
            stylistic preference; the obvious surfaces are actively wrong for the purpose:

            - `charly box list boxes` lists **enabled** boxes, and resolves through main's `import:` closure —
              which pulls arch, cachyos and fedora but **not** debian or ubuntu. A catalog built on it omits
              every `debian.*` and `ubuntu.*` box (ten definitions that are checked out and have their own
              skills) while duplicating ten arch boxes under transitive `cachyos.arch.*` aliases.
            - A plugin absent from `compiled_plugins:` still loads out-of-process when a plan references its
              word, so "in the binary" is not the same set as "exists".

            So the generator walks **each repo as its own project root** — the superproject plus every
            `box/<distro>` submodule — and unions the results.

            ## Cross-reference rewriting

            The skill corpus is densely self-linked in harness syntax — references across many distinct
            targets in the **skill files** the generator reads, `/charly-check:check` alone appearing many
            times. (Candy, box and `VISION.md` sources carry references too; those go through other emitters
            and are not counted here.)

            **3654 of those are rewritten** into site links — every reference in a skill BODY. The remaining
            11 sit in `SKILL.md` frontmatter `description:` fields and never reach the published page at all:
            `splitFrontmatter` removes the frontmatter before the body is rewritten, and `firstLine` then
            truncates the description to its first sentence for the page subtitle, which drops all 11. They
            resolve, so nothing breaks — but that is why, not because they are published unlinked.

            An unresolvable reference **in a body** fails generation rather than emitting a dead link; a
            reference in a `description:` is never gated, because it is never published.

            Three guards keep real content from being mangled into links, each earned from an actual corpus
            case:

            1. the skill part must start with a letter — else `redis://charly-redis:6379` matches;
            2. the reference must not follow `/` — URL authorities;
            3. it must not follow a word character — image tags like `localhost/charly-selkies-kde:latest`.

            `references/<file>.md` pointers (backticked paths, never markdown links) resolve to the skill's
            own child page.

            ### Authoring consequence: you cannot write a fake reference

            Because the gate fails closed, a **well-formed reference in a skill BODY must resolve** — there is
            no escape syntax. A skill therefore cannot write `/charly-` followed by two real-looking lowercase
            words as a throwaway example: that shape matches, resolves to nothing, and fails the docs build.

            Write generic forms with angle-bracket placeholders instead — `<` is not a letter, so the
            pattern never matches:

            ```
            /charly-<plugin>:<skill>     ✅ safe in prose
            ```

            This is not hypothetical, and it bit twice in one sitting. The first draft of
            `/charly-tools:docs-site` used a made-up two-word reference as its example of an unresolvable
            one, and the generator dutifully aborted — the skill documenting the gate tripped the gate. The
            fix's own "don't do this" example then tripped it a second time. Failing closed is still the
            right behaviour (a typo'd real reference is far likelier than a deliberate fake one), so
            describe the bad shape rather than spelling it.

            ## Why declarative sources, not the CLI's help output

            The host renders every dynamic command word with a generic stub description, intercepts the
            depth-1 `--help` itself, and plugin-served help arrives in at least three mutually incompatible
            formats with no machine-readable dump. Parsing that would be the fragile shim R4 forbids. Every
            fact the site needs is already declared: `plugin.providers`, the per-plugin `schema/*.cue`, and
            each candy's `description:`.

            The trade-off is stated rather than hidden: command PARENTHOOD is a Go method
            (`CommandParent()`), not a manifest field, so CLI pages name the word and its owning plugin
            without asserting where it nests. The narrative CLI guide covers the nesting and the three
            core-spine words (`box`, `version`, `reap-orphans`) that are not `command:` providers.

            ## Cross-References

            - `/charly-tools:docs-site` — the candy + `check-docs` bed that builds and proves the site.
            - `/charly-internals:plugin` — placement, the provider model, the CUE-schema contract.
            - `/charly-internals:skills` — the skill corpus this site publishes.

            ## When to Use This Skill

            Invoke before running or modifying `charly docs`, editing `candy/plugin-docs`, touching the
            `docs/` submodule's generated trees, or changing anything the generator reads (a candy's
            `description:`, a plugin's `providers:` or CUE schema, a skill's frontmatter or cross-references).

generate-skill:
    skill:
        name: generate
        family: build
        owner: charly-build
        description: |-
            Containerfile generation from charly.yml and layers.
            MUST be invoked before any work involving: charly box generate command, Containerfile generation, .build/ directory contents, the task-verb emission pipeline, or understanding generated output.
        triggers:
            - "`charly box build` / `charly box generate` / Containerfile"
        content: |
            # charly box generate -- Containerfile Generation

            Invoked as `charly box generate`. See `/charly-image:image` for the family overview.

            ## Overview

            Parses `charly.yml`, scans `candy/`, resolves the dependency graph, and emits all build artifacts into the `.build/` directory. Called internally by `charly box build` but can be run standalone to inspect generated output before a build.

            The generator is **config-driven** — distro format templates, builder stage templates, and init system fragments all come from the build vocabulary embedded in the `charly` binary at `charly/charly.yml` (three top-level sections: `distro:`, `builder:`, `init:`) — and **declarative per-task** for install logic — each task verb (see `/charly-image:layer`) has a dedicated emitter that writes the right Containerfile directive.

            **Build-engine dispatch**: `charly box generate` does not construct a generator host-side at all (the former `NewGenerator` is DELETED) — it is served by the COMPILED-IN `command:box` plugin (candy/plugin-box, nested under the `box` grammar group), whose generate handler invokes the peer `build:generate` plugin (candy/plugin-build) over the F10 reverse channel (InvokeProvider). The plugin's `runBoxGenerate` → `resolveBuildEngine(..., generateOnly=true)` (candy/plugin-build/resolve.go) runs the ENTIRE build-engine RESOLVE plugin-side — loader, vocab, scan, connect, validate, box resolve, intermediates, order, effective versions, host-fs prep, render-seam-cache prep, render-prep, user-context, and envelope projection — and returns the resolved-project envelope (`spec.BuildResolveReply.ResolvedProject`); `generateOnly` is a PLUGIN-SIDE parameter that returns after the envelope projection (no engine/order drive-model). The host is reached ONLY for thin `buildengine-*` shards (`buildengine-scan-local`, `buildengine-connect-plugins`, and `buildengine-prep` — the render-seam-floor `renderGenCache` populate, which returns an EMPTY map; the host-fs PREP itself moved plugin-side); the envelope + drive-model come from `resolveBuildEngine`'s reply, NOT from `HostBuild("buildengine-prep")` (that host leg takes `spec.ResolvedProjectRequest`, which has no `GenerateOnly` field). The candy renders the Containerfiles itself via `sdk/deploykit.Generator` over the envelope + `HostBuild("render-seam")` (#67 — the host no longer renders); the written paths are returned — no podman (generate builds nothing). `charly box build` uses the SAME resolve pipeline (`runBoxBuild` → `resolveBuildEngine(..., generateOnly=false)`, which additionally computes the drive-model), then the candy additionally OWNS the podman DRIVE (`podman build` / push / inline-merge) IN the candy. See `/charly-internals:plugin` (the `build` provider class + the in-proc reverse channel) and `/charly-build:build`.

            **Build-mode emission is `WriteCandySteps` → `EmitTasks`** in `sdk/deploykit` (`deploykit.Generator`, relocated from `charly/generate.go` in #67, driven by `candy/plugin-build` over the resolved-project envelope + `HostBuild("render-seam")`; the `charly/generate.go` top-level `Generate`/`writeCandySteps` orchestrator is DELETED). the pod-overlay deploy path reaches `deploykit.Generator.EmitTasks` DIRECTLY — `charly/tasks.go` holds no shim and cannot hold one (P16 import purity forbids `charly/` importing the sdk); that path stays for the pod-overlay deploy path (the candy `plugin-deploy-pod` constructs `deploykit.OCITarget` + renders via `deploykit.NewRenderGeneratorFromProject`, the per-step fragment over the `HostBuild("step-emit","oci-emit-step")` seam). The render walks each layer's ops directly to write Containerfile text — NOT the `InstallPlan` IR. Build shares the package-cascade, shell-snippet, and localpkg compiler helpers with the IR (`ResolveCascadePackages`, `CompileShellSnippetSteps`, `deploykit.RenderLocalPkgImageInstall` — one source of truth, R3, relocated to sdk/deploykit in W3), but the overall walk is the direct generator, not a `DeployTarget`. The `InstallPlan` IR + `deploykit.OCITarget.Emit` is the DEPLOY-mode path: the candy `plugin-deploy-pod`'s overlay-Containerfile synthesis (rendered in its own code via `deploykit.OCITarget` + `deploykit.NewRenderGeneratorFromProject`) when `add_candy:` is set, plus the external execution targets. (The local/vm/kubernetes/android substrates are external out-of-process plugins via `pluginDeployTarget` (S3b, dispatched through `candy/plugin-fleet`'s `Invoke(OpDeployDispatch)`): `deploy:local` (candy/plugin-deploy-local) and `deploy:vm` (candy/plugin-deploy-vm) DO consume the IR — the plugin walks it via `kit.WalkPlans` over the reverse channel, the vm one over the guest `SSHExecutor` so the walk runs inside the guest — while `deploy:kubernetes` (candy/plugin-kube) does NOT, materializing its Kustomize tree PLUGIN-side (`candy/plugin-kube/materialize.go`'s `materializeKustomize`, reaching `candy/plugin-k8sgen` peer-to-peer over `verb:k8sgen`/`OpEmit`).) See `/charly-internals:install-plan` for the IR catalog and `/charly-internals:generate-source` for the Go-level call graph.

            **Build-time plugin execution**: the build path connects the project's external (out-of-tree) plugin candies via `loadProjectPlugins` (`charly/host_build_buildengine.go:51`, and `charly/check_cmd.go:70` for the check path), so a `run:` plugin verb — and a plugin builder — is registered + dialable DURING image generation, the SAME loader the deploy/check paths use. The host-side `NewGenerator` that used to perform this connect is DELETED. A builtin is already registered via `init()` and needs no connect; only an external one is host-built + connected here. `EmitTasks` then dispatches a `plugin:` verb step PLACEMENT-AGNOSTICALLY above the registry: a builtin `ProvisionActor` renders an act shell `RUN` in-proc (the zero-JSON fast path), while ANY other resolved provider — an external `grpcProvider`, or a builtin emitting a richer fragment — renders via `invokeOpEmitFragmentOpt` → `Invoke(OpEmit)` (in-proc for a builtin, go-plugin gRPC for an external), and the returned `spec.EmitReply.Fragment` is spliced verbatim into the Containerfile (egress-validated with the rest before write). This is operator-authorized build-time execution of host-built plugin code — a project's composed external plugins run as host code during its image builds. Detail → `/charly-internals:plugin` (placement) + `/charly-internals:generate-source`.

            **Build-time BUILDER leg (all via `OpResolve`)**: the builder stage emission is `deploykit.Generator.EmitBuilderStages` / `EmitBuilderArtifacts` / `EmitExternalBuilderStages` / `EmitExternalBuilderArtifacts` (`sdk/deploykit/builders_render.go` — relocated from `charly/generate.go` in #67, driven by `candy/plugin-build` over the envelope + `HostBuild("render-seam")`); the shared builder `OpResolve` helper (`renderSeamCaller.resolveBuilderStage`, `sdk/deploykit/render_generator_from_project.go`) drives both legs (the former `charly/generate.go` is DELETED, K-wave 2). These render the four DETECTION-builders' stages (pixi/npm/aur — selected by a candy's `pixi.toml` / `package.json` / `aur:` section; cargo is INLINE) by `Invoke(OpResolve)`ing their plugins — NOT from an in-core `builders.<name>` vocabulary (C10 moved the stage templates into the plugins' `kit.BuilderResolve`). For each detected `(candy, builder)`, `EmitBuilderStages` connects the plugin on-demand (`ensureBuildersConnected`) and calls the shared `resolveBuilderStage` → `prov.Invoke(OpResolve)` with a `spec.BuilderResolveInput` (the host-computed render context — builder ref, stage name, copy src, uid/gid/home, detected manifest/lockfile/build-script, aur packages/options, PRE-RENDERED cache-mount flags) as `op.Params` + a `spec.BuildEnv` as `op.Env`; the returned `spec.BuilderResolveReply.Stage` is written verbatim PRE-main-FROM (cached per `(candy, builder)`), `EmitBuilderArtifacts` writes the cached `CopyArtifacts` + once-per-builder `CopyBinary` POST-main-FROM, and cargo's `InlineFragment` splices in `WriteCandySteps` (deploykit). A candy that instead selects an OUT-OF-TREE builder via its `external_builder: <word>` field gets its multi-stage emitted by `EmitExternalBuilderStages` / `EmitExternalBuilderArtifacts` (run right after their detection counterparts), sharing the SAME `resolveBuilderStage` but sending a MINIMAL input (candy name only): the word resolves through `providerRegistry.ResolveBuilder` to an EXTERNAL `*grpcProvider`, and `EmitExternalBuilderStages` (the BUILDER-leg analogue of `invokeOpEmitFragmentOpt`) requires a non-empty `Stage`. An empty `Stage` (or empty cargo `InlineFragment`), an unresolvable word, or an Invoke error fails LOUDLY (R4) — never a silently-dropped builder stage. Every half is egress-validated with the rest of the Containerfile before write. Detail → `/charly-internals:plugin` (placement) + `/charly-internals:generate-source`.

            **Three-phase templates**: the embedded build vocabulary's format (`formats.<fmt>`) and builder (`builders.<name>`) definitions carry a `phases: { prepare, install, cleanup }.{ container, host }` structure. The generator reads `phases.install.container` when set and falls back to the top-level `install_template:` otherwise. The `host:` cell is consumed only when a `SystemPackagesStep` renders on a host venue (`RenderHostPackageCommand`) — for the external `local:` AND `vm:` deploys the plugin drives the `SystemPackages` host render via the host's `RunHostStep` channel — never by the generator.

            ## Quick Reference

            | Action | Command | Description |
            |---|---|---|
            | Generate all | `charly box generate` | Generate Containerfiles for all enabled images |
            | With tag | `charly box generate --tag TAG` | Override the image tag |

            `charly box generate` takes **no positional image argument** — it always writes the full `.build/` tree for every enabled image in `charly.yml`. To inspect a single image's output, run `charly box generate` (fast — it reuses scratch-stage caches) and then `cat .build/<image>/Containerfile`. Filtering to one image happens implicitly via `charly box build <image>`, which invokes generate internally and then builds only the requested image + its dependencies.

            ```bash
            # Generate all Containerfiles
            charly box generate

            # Generate with a custom tag
            charly box generate --tag v1.2.3

            # Inspect generated output
            cat .build/fedora/Containerfile
            ```

            ## Generated Output

            | Path | Description |
            |---|---|
            | `.build/<image>/Containerfile` | The generated Containerfile — unconditional RUN / COPY / ENV / LABEL directives |
            | `.build/<image>/_inline/<layer>/<sha256>` | Inline-content bytes from `write:` tasks (content-addressed, idempotent) |
            | `.build/<image>/traefik-routes.yml` | Traefik dynamic config (only for images with `route:` layers) |
            | `.build/<image>/<fragment_dir>/*.conf` | Init-system service configs (e.g. `supervisor/`, `systemd/`) |
            | `.build/_layers/<name>` | Symlinks to remote layer directories |

            All generated files start with `# <path> (generated -- do not edit)`.

            ## Per-layer emission pipeline

            For each layer, `deploykit.Generator.WriteCandySteps` (relocated from `charly/generate.go` in #67) runs this sequence:

            ```
            1. Comment header:    # Layer: <name>
            2. ENV from `var:` + ARG TARGETARCH + ENV ARCH=${TARGETARCH} (once per layer)
            3. Package install (rpm/deb/pac/aur/apk) — always USER root
            4. tasks: iterated in author order:
               a. Resolve ${VAR} in non-verbatim fields
               b. Determine user: (default root)
               c. Emit USER <value> if different from running USER
               d. Dispatch to the verb-specific emitter
               e. Adjacent same-verb same-user tasks coalesce into one directive
                  (mkdir, link, setcap) — see /charly-image:layer execution-order section
               f. Parent-dir auto-insertion for copy/write when no earlier mkdir covers
            5. Builders (pixi/npm/cargo/aur) — placement is end-of-layer unless an
               explicit `- build: all` task appears in tasks:
            6. Reset to USER root (unless last layer and no further root steps follow)
            ```

            **An unrenderable install is a LOUD failure, never a dropped step.** Step 3 above resolves
            a candy's packages through the shared cascade; if they cannot then be rendered, generation
            hard-errors naming the candy, the format and the box. Four conditions used to drop them
            silently — a nil `DistroDef`, a primary build format with no definition in the box's distro,
            a `RenderTemplate` error discarded by an `if err == nil` with no `else`, and an `EmitTasks`
            error written into the Containerfile as a comment. The third one shipped: a format's
            `install_template` calling a function absent from `buildkit.TemplateFuncs` is an ordinary
            authoring mistake, and the emitter turned it into a Containerfile that built successfully,
            exited 0, and produced an image with NONE of the candy's packages. Nothing in the artifact
            showed a missing step; it surfaced later, elsewhere, as an absent binary.

            A candy that resolves NO packages for this box still passes through untouched — that is the
            ordinary per-distro case (a `distro:` map with no section for this box), and it is not an
            error. The distinction that matters is *resolved but unrenderable* versus *nothing to do*.

            Two authoring consequences:

            - **A box inherits `defaults.build:` when it declares no `build:`.** A box on an Alpine base
              with no `build:` took `[rpm]`, so the cascade resolved its packages correctly and then had
              no rpm template in the alpine distro to render them with. Declare `build:` on any box whose
              base is not the project default's family.
            - **Check a template function against `buildkit.TemplateFuncs` before using it.** The set is
              twelve: `anyRepoHasURL`, `cacheMounts`, `cacheMountsAuto`, `cacheMountsOwned`,
              `default`, `hasSuffix`, `join`, `printf`, `quote`, `replace`, `shquote`, `splitFirst`.
              Anything else — `base`, say — fails at render time, which is now loud but is still
              cheaper to avoid. Prefer doing the work in the shell the template emits.

              A partial list here is worse than saying nothing: the paragraph exists to BE the list a
              reader greps against, so naming six of the twelve teaches that `join` and `replace`
              fail when they are shipped helpers. The way that happens is a `grep` over a windowed
              region of the FuncMap whose output is published as complete. Read the map's full
              literal, or count it in Go — never a
              windowed grep.

            ### Per-verb emitters (`sdk/deploykit/tasks_emit.go`)

            | Verb | Emitter | Containerfile output |
            |---|---|---|
            | `mkdir` | `EmitMkdirBatch` | `RUN mkdir -p p1 p2 … [ && chmod <mode> p1 … ]` (one RUN per batch; grouped by mode) |
            | `copy` | `EmitCopy` | `COPY --from=<layer-stage> --chmod=<mode> [--chown=<uid>:<gid>] <src> <dest>` — **no RUN** |
            | `write` | `EmitWrite` | `COPY --chmod=<mode> [--chown=<uid>:<gid>] .build/<image>/_inline/<layer>/<sha256> <dest>` — **no `--from=`** (the source is a build-context path, not a stage), **no RUN, no heredoc** |
            | `link` | `EmitLinkBatch` | `RUN ln -sf t1 l1 && ln -sf t2 l2 …` (one RUN per batch) |
            | `download` | `EmitDownload` | `RUN --mount=type=cache,dst=/tmp/downloads <shell-probe> 'export BUILD_ARCH=$(uname -m); … __c=/tmp/downloads/<sha256 of url>; [ -s "$__c" ] \|\| { curl -fsSL "$__u" -o "$__c.part" && mv -f "$__c.part" "$__c"; } && <extractor> "$__c"'` — the fetch is **content-addressed to a cache file, never piped**, so a re-run with a warm cache skips the download (one RUN per download; `export ...;` termination is required so the shell expands `${BUILD_ARCH}` in the URL) |
            | `setcap` | `EmitSetcapBatch` | `RUN setcap -r … && setcap caps path …` (strip + set chained) |
            | `cmd` | `EmitCmd` | `RUN --mount=type=bind,from=<layer-stage>,source=/,target=/ctx [--mount=type=cache,…] <shell-probe> <<'OVCMD'` + the body + `OVCMD` — a heredoc carries the multi-line body without escaping, which podman's Dockerfile parser accepts (it would otherwise split at unescaped newlines) |
            | `build` | handled inline in `WriteCandySteps` (deploykit) | Existing pixi/npm/cargo/aur multi-stage + inline blocks |
            | `plugin` | `ProvisionActor.RenderProvisionScript` (builtin, in-proc) **or** `invokeOpEmitFragmentOpt` → `Invoke(OpEmit)` | A builtin act-renderer emits a shell `RUN`; any other resolved provider (external `grpcProvider`, or a fragment-emitting builtin) returns a `spec.EmitReply.Fragment` spliced verbatim. The single seam every Containerfile plugin-step emit flows through; an unresolved verb is a loud error. `plugin: command` is the one exception — its act IS the full `EmitCmd` install-task RUN. |

            `<shell-probe>` above is the shared prefix both emit sites use instead of naming a
            shell directly (`sdk/deploykit.BuildStepShellDashC` / `BuildStepShellHeredoc`):
            `sh -c 'SH=/bin/sh; [ -x /bin/bash ] && SH=/bin/bash; exec "$SH" …' sh`. It prefers
            `/bin/bash` where the base image has it and falls back to POSIX `sh` where it does not,
            so a candy's shell steps build on a busybox base (Alpine) as well as on a bash one. The
            authored command reaches the chosen shell unchanged — the `-c` form passes it as `$1` and
            re-execs, the heredoc form relies on `exec` preserving stdin — so author `$(cmd)` and
            `${VAR}` still expand in the shell that runs them.

            ## Cache-mount inheritance

            Cache mounts come from the embedded build vocabulary — the `distro:` section (format caches) and `builder:` section (builder caches). `sdk/deploykit/tasks_emit.go`'s `TaskCacheMounts` (line 203) picks the right set based on task context:

            | Task context | Cache mount(s) |
            |---|---|
            | `cmd:` as root | Distro format caches (`/var/cache/libdnf5` / `/var/cache/apt` / `/var/cache/pacman/pkg`) + `/ctx` bind mount |
            | `cmd:` as non-root | `/tmp/npm-cache` (UID-scoped) + `/ctx` bind mount |
            | `download:` | `/tmp/downloads` (shared across layers) |
            | Package install | Distro format caches from the embedded `distro:` section |
            | pixi builder | `/tmp/pixi-cache` + `/tmp/rattler-cache` (UID-scoped) |
            | npm builder | `/tmp/npm-cache` (UID-scoped) |

            The `/ctx` bind mount exposes the layer's own directory tree to `cmd:` tasks — so you can still reference `/ctx/<file>` inside an escape-hatch shell block for one-off file access (though `copy:` / `write:` are strongly preferred).

            ## USER emission

            - `user: root` → `USER 0`
            - `user: ${USER}` → `USER <numeric UID>` (numeric form avoids an `/etc/passwd` dependency at the switch point)
            - `user: <uid>:<gid>` → `USER <uid>:<gid>` (e.g. `1010:1010`)
            - `user: <name>` → `USER <name>` (literal; requires user to exist — create via earlier `cmd: useradd` task)

            `COPY --chown=` uses numeric `<UID>:<GID>` for `${USER}` (BuildKit-safe), name-pairs for literal users.

            ## WriteBootstrap — adopt vs create

            `WriteBootstrap` (in `sdk/deploykit`, relocated from `charly/generate.go` in #67) emits the user-creation section of the base-image Containerfile and branches on `ResolvedBox.UserAdopted`:

            **Adopt mode** (`UserAdopted = true`) — the base image already ships the declared user; no `useradd` is needed. Emits:

            ```dockerfile
            # User ubuntu (uid=1000) adopted from base image (declared in the embedded charly/charly.yml distro.base_user) — no useradd needed

            WORKDIR /home/ubuntu
            USER 1000
            ```

            **Create mode** (`UserAdopted = false`) — classic idempotent useradd:

            ```dockerfile
            RUN if ! getent passwd 1000 >/dev/null 2>&1; then \
                  LOGIN_SHELL=/bin/sh; [ -x /bin/bash ] && LOGIN_SHELL=/bin/bash; \
                  if command -v useradd >/dev/null 2>&1; then \
                    (getent group 1000 >/dev/null 2>&1 || groupadd -g 1000 user) && \
                    useradd -m -u 1000 -g 1000 -s "$LOGIN_SHELL" user; \
                  else \
                    (getent group 1000 >/dev/null 2>&1 || addgroup -g 1000 user) && \
                    adduser -D -h /home/user -u 1000 -G user -s "$LOGIN_SHELL" user; \
                  fi; \
                fi

            WORKDIR /home/user
            USER 1000
            ```

            The pivot is `ResolvedBox.UserAdopted`, set by the `user_policy:` reconciliation in `sdk/buildkit/config_resolve.go:ResolveBox`. See `/charly-image:image` "user_policy" for the policy semantics, `/charly-build:build` "base_user:" for the declaration, and `/charly-distros:ubuntu` for the canonical adopt-mode worked example.

            Neither branch does destructive metadata mutation (no `usermod -l` rename). Fedora/Arch/Debian always hit the create branch (no `base_user:` declared); Ubuntu under `user_policy: auto` hits the adopt branch.

            ## Tag-section install emission

            Distro-version tag sections like `debian:13:` and `ubuntu:24.04:` are resolved via first-match-wins on the image's `distro:` priority list (e.g. `["ubuntu:24.04", "ubuntu", "debian"]`). Each matched tag section uses the primary format's full install template — so a tag section can carry `repos:`, `keys:`, `options:`, and `package:`, not just packages alone. See `charly/layers.go:TagPkgConfig.Raw` for the map that captures full tag-section YAML, and `/charly-image:layer` for authoring reference.

            ## ARCH / TARGETARCH emission

            Every layer section begins with:

            ```dockerfile
            ARG TARGETARCH
            ENV ARCH=${TARGETARCH}
            ```

            `${ARCH}` is then resolvable by BuildKit's ENV substitution in subsequent `COPY` paths, `ENV` values, and inside `RUN` shell. `${BUILD_ARCH}` is uname-style and auto-injected as a shell-local variable at the top of each `cmd:` / `download:` RUN (`BUILD_ARCH=$(uname -m)`), so multi-arch URL templates using either form work without author ceremony.

            ## Inline-content staging (`write:` verb)

            `write: content:` is written to `.build/<image>/_inline/<layer>/<sha256>` at generate time, where `<sha256>` is the SHA-256 of the content. This means:

            - **Idempotent:** rewriting the same content is a no-op
            - **Content-addressed:** editing the content changes the hash, which changes the COPY source path, which invalidates only that single COPY layer's cache
            - **No shell heredoc:** the COPY delivers the bytes directly; no `$`, backticks, or `EOF` markers need escaping

            The Containerfile references the file by its relative path: `COPY --chmod=<mode> .build/<image>/_inline/<layer>/<sha256> <dest>` — no `--from=`, because the source is a build-context path rather than a stage.

            ## Behavior

            - Generation is idempotent — safe to run repeatedly.
            - `.build/` is disposable and gitignored; `charly box generate` will recreate it from scratch.
            - Layer dependencies resolve transitively and topologically; circular `require:` is a validation error (surfaced by `/charly-build:validate`).
            - Pixi manylinux fix is injected into `pixi.toml` files during the pixi builder stage.
            - Multi-stage builds use builder images declared in the embedded `builder:` section (`pixi-builder`, `npm-builder`, `arch-builder` for AUR, etc.).
            - Stale `.build/<image>/` directories (from removed or renamed images) are cleaned at the start of each generation.

            ### LABEL placement (cache efficiency)

            All `ai.opencharly.*` LABEL directives are emitted at the **end** of
            the final stage, after the last `USER` directive. This means a test or
            label edit only re-runs the LABEL steps themselves (metadata-only, ~2
            sec) instead of invalidating the buildkit cache for every upstream
            RUN/COPY. Particularly important for test authoring: `check:` edits on
            a 138-step stack like `immich-ml` cost seconds, not minutes per
            iteration. See `/charly-internals:generate-source` "LABEL Placement" for the
            rationale and `/charly-check:check` for author-facing workflow implications.

            ## Bootc-specific generator behaviour

            Three emission rules matter specifically for bootc images (those whose `base:` is a bootc container such as `quay.io/fedora/fedora-bootc:43`).

            ### 1. `initHasFragments` pre-scan gates empty init stages

            Each init system defined in the embedded `init:` vocabulary (`supervisord`, `openrc` and `systemd`) emits a `FROM scratch AS <stage_name>` scratch stage that layers COPY fragments into, plus an `assembly_template` RUN that bind-mounts from that scratch stage. `sdk/deploykit` (relocated from `charly/generate.go` in #67) pre-scans the layer chain for each init system to check whether any layer contributes fragments (per-entry rendered from the unified `service:` list via `ServiceSchema.ServiceTemplate` / `ServiceSchema.SupportsPackaged`, plus relay configs, plus systemd `.service` files). If none, **both** the scratch stage and the assembly_template RUN are suppressed. Without this, a bootc image with only packaged-unit entries (`use_packaged:`, no rendered body) would emit an empty `FROM scratch AS systemd-services` + a RUN that bind-mounts from it — which fails at build time. The `post_assembly_template` for that init still runs — it is independent of the scratch stage. `system_enable_template` is different: it renders for the image's RESOLVED init only (`img.InitSystem`), never for every ACTIVE init. `activeInits` is a SET — a candy chain routinely contributes fragments for several inits at once, and each legitimately gets its own fragment stage and assembly step — but a distro-shipped `use_packaged:` unit is enabled by the ONE init that boots the image. Rendering the shared unit list through every active init emitted one enable command PER init into a single Containerfile, so a supervisord container carrying an openrc fragment received `rc-update add` on a base with no OpenRC (opencharly/sdk#143, opencharly/charly#313).

            ### 2. `anyRepoHasURL` helper → prepend `dnf5-plugins`

            The RPM install_template prepends `dnf install -y dnf5-plugins` whenever any layer `rpm.repos:` entry declares a `url:` (checked via the `anyRepoHasURL` template helper in `sdk/buildkit/render.go`). Required because `quay.io/fedora/fedora-bootc:43` strips `dnf5-plugins` (which provides the `config-manager` subcommand) from the default install. Without the prepend, `dnf5 config-manager addrepo --from-repofile=…` — emitted for every URL-based repo — fails with `Unknown argument "config-manager" for command "dnf5"`. `/charly-selkies:ffmpeg` is the canonical URL-repo consumer (adds negativo17's `fedora-multimedia.repo`).

            ### 3. `export BUILD_ARCH=…;` (not prefix assignment) in `download:` tasks

            The `download:` task emits `export BUILD_ARCH=$(uname -m); curl -fsSL "…${BUILD_ARCH}…"` with an explicit semicolon-separator `export`, not the prefix form `BUILD_ARCH=$(uname -m) curl ...`. Bash prefix assignments set the variable in the spawned command's environment **after** the shell has already expanded `${BUILD_ARCH}` in the command's arguments — the expansion sees an unset variable, the URL resolves with an empty arch string, and the download 404s. Source: `sdk/deploykit/tasks_emit.go:242` (`envPrefix`) with the documenting comment. Layers that use `${BUILD_ARCH}` in a `download:` URL: `/charly-languages:pixi`, `/charly-coder:typst`, `/charly-tools:yay`, `/charly-infrastructure:vectorchord`, `/charly-tools:sherpa-onnx`.

            ## Project directory override

            `charly box generate` resolves `charly.yml` via `os.Getwd()`. Override with `-C <dir>` / `--dir <dir>` / `CHARLY_PROJECT_DIR=<dir>`. See `/charly-image:image` "Project directory resolution".

            ## Cross-References

            ### `charly box` family siblings

            - `/charly-image:image` -- Family overview + charly.yml composition reference
            - `/charly-build:build` -- Building images (calls generate internally)
            - `/charly-build:inspect` -- Inspect generated output for a specific image
            - `/charly-build:list` -- Enumerate targets before generation
            - `/charly-build:merge` -- Post-build layer consolidation
            - `/charly-build:new` -- Scaffold a new candy to generate into
            - `/charly-build:pull` -- Pull prebuilt images (orthogonal to generate)
            - `/charly-build:validate` -- Validation rules for images and layers (including per-verb task rules)

            ### Related skills

            - `/charly-image:layer` — **Canonical task verb catalog, `var:` substitution, YAML anchors, execution order.** Read this first for authoring questions.
            - `/charly-check:check` — test-authoring workflow; `check:` blocks are embedded via `writeJSONLabel` and benefit directly from LABELs-at-end cache efficiency.
            - `/charly-internals:generate-source` — Deep dive on Containerfile emission internals, `Task` struct, per-verb emitters, `StageInlineContent`, the `spec.ShellQuote` quoting helper and the `BuildStepShellDashC`/`BuildStepShellHeredoc` shell-prefix pair, LABEL-placement rationale.
            - `/charly-internals:go` — Source-code map: `charly/tasks.go` (64 lines, one function: `invokeOpEmitFragmentOpt`), `sdk/deploykit/tasks_emit.go` (the per-verb emitters), `sdk/deploykit` (`WriteCandySteps` + `WriteLabels`, relocated in #67), `charly/layers.go` struct definitions.
            - `/charly-selkies:ffmpeg` — canonical URL-repo consumer (triggers the `dnf5-plugins` prepend).

inspect-skill:
    skill:
        name: inspect
        family: build
        owner: charly-build
        description: |-
            Image inspection showing resolved configuration as JSON.
            MUST be invoked before any work involving: charly box inspect command, viewing image configuration, or querying image metadata.
        content: |
            # charly box inspect -- Image Inspection

            Invoked as `charly box inspect <image>`. See `/charly-image:image` for the family overview.

            ## Overview

            Displays the fully resolved configuration of an image as JSON. Shows base image, layers, ports, platforms, registry, tags, builder selections, volumes, and all computed metadata.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Full inspect | `charly box inspect <image>` | Show complete resolved config as JSON |
            | Specific field | `charly box inspect <image> --format FIELD` | Extract a specific field |
            | Disabled image | `charly box inspect <image> --include-disabled` | Operate on `enabled: false` images without flipping authored config |

            ## Usage

            ```bash
            # Inspect full image configuration
            charly box inspect fedora

            # Get specific field
            charly box inspect jupyter --format ports

            # Get the base image
            charly box inspect sway-browser-vnc --format base

            # Get layer list
            charly box inspect ollama --format layers

            # Get platforms
            charly box inspect fedora --format platforms

            # Get the builder map (build-type → builder image)
            charly box inspect arch --format builder

            # Get the builder capabilities this image declares
            charly box inspect fedora-builder --format builds
            ```

            ## Output Fields

            The JSON output includes:

            | Field | Description |
            |-------|-------------|
            | `name` | Image name |
            | `base` | Base image (another image name or external reference) |
            | `layers` | Ordered list of layers applied |
            | `ports` | Exposed ports from all layers |
            | `platforms` | Target platforms (e.g., `linux/amd64`, `linux/arm64`) |
            | `registry` | Container registry for push |
            | `tags` | Image tags |
            | `builder` | Build-type → builder-image map (e.g. `{"pixi": "fedora-builder"}`) — resolved from image → base → defaults |
            | `builds` | Builder capabilities this image declares (e.g. `[pixi, npm, cargo, aur]`) — not inherited |
            | `volumes` | Declared volumes from layers |
            | `distro` | Distro identity tags |
            | `build` | Package format tags |

            All `--format` values are the JSON field names from the `inspect` output. When passing `--format` to select a map (like `builder`) or list, the CLI prints one entry per line.

            **Caveat — `--format bind_mounts`**: this one format option reads `charly.yml` (not `charly.yml`), because bind-mount backings are a deploy-time concept (`charly config --bind <volume>` writes them to `charly.yml`). The output is display-only — no OCI label contamination, no build-mode state leak. All other `--format` values (`ports`, `volumes`, `layers`, `base`, `builder`, …) are strictly `charly.yml`-derived per the mode-purity invariant (see `/charly-build:build` and `/charly-internals:go` "Mode purity").

            ## Project directory override

            `charly box inspect` resolves `charly.yml` via `os.Getwd()`. Override with `-C <dir>` / `--dir <dir>` / `CHARLY_PROJECT_DIR=<dir>`. See `/charly-image:image` "Project directory resolution".

            ## Cross-References

            ### `charly box` family siblings

            - `/charly-image:image` -- Family overview + charly.yml composition reference
            - `/charly-build:build` -- Build the inspected image
            - `/charly-build:generate` -- Containerfile generation for the inspected image
            - `/charly-build:list` -- Enumerate images before inspecting one
            - `/charly-build:merge` -- Post-build layer consolidation
            - `/charly-build:new` -- Scaffold new candies
            - `/charly-build:pull` -- Fetch prebuilt images into local storage
            - `/charly-build:validate` -- Validate image and layer definitions before inspect

            ### Related skills

            - `/charly-image:layer` -- Layer-level detail shown in inspect output
            - `/charly-core:deploy` -- `charly.yml` overlay applied on top of inspect's resolved config

list-skill:
    skill:
        name: list
        family: build
        owner: charly-build
        description: |-
            List components from charly.yml and filesystem.
            MUST be invoked before any work involving: charly box list commands, enumerating images, layers, build targets, services, routes, volumes, or aliases.
        content: |
            # charly box list -- List Components

            Invoked as `charly box list {images,layers,targets,services,routes,volumes,aliases}`.
            See `/charly-image:image` for the family overview.

            ## Overview

            Enumerate images, layers, build targets, and layer properties from `charly.yml` and the filesystem. Useful for discovery and scripting.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | List boxes | `charly box list boxes` | All boxes defined in charly.yml |
            | List layers | `charly box list candies` | All layers found on filesystem |
            | List targets | `charly box list targets` | Build targets in dependency order |
            | List services | `charly box list services` | Layers that declare a `service:` field |
            | List routes | `charly box list routes` | Layers that declare a `route:` field |
            | List volumes | `charly box list volumes` | Layers that declare `volume:` |
            | List aliases | `charly box list aliases` | Layers that declare `alias:` |
            | List image tags | `charly box list tags [<box>]` | Locally stored CalVer tags of charly-built images, newest first (rollback discovery for `charly update --tag`) |

            ## Usage

            ### List All Images

            ```bash
            # Show all images from charly.yml
            charly box list boxes

            # Output: one image name per line
            # fedora
            # fedora-builder
            # sway-browser-vnc
            # ...
            ```

            ### List All Layers

            ```bash
            # Show all layers found in candy/ directory
            charly box list candies
            ```

            ### Build Targets in Order

            ```bash
            # Dependency-ordered list -- useful for scripting builds
            charly box list targets
            ```

            ### Filter by Property

            ```bash
            # Which layers provide services?
            charly box list services

            # Which layers define routes (Traefik)?
            charly box list routes

            # Which layers declare persistent volumes?
            charly box list volumes

            # Which layers provide host command aliases?
            charly box list aliases
            ```

            ## Project directory override

            `charly box list …` resolves `charly.yml` + `candy/` via `os.Getwd()`. Override with `-C <dir>` / `--dir <dir>` / `CHARLY_PROJECT_DIR=<dir>`. See `/charly-image:image` "Project directory resolution".

            ## Cross-References

            ### `charly box` family siblings

            - `/charly-image:image` -- Family overview + charly.yml composition reference
            - `/charly-build:build` -- Build enumerated images
            - `/charly-build:generate` -- Containerfile generation
            - `/charly-build:inspect` -- Detailed inspection of a specific image
            - `/charly-build:merge` -- Post-build layer consolidation
            - `/charly-build:new` -- Scaffold a new candy
            - `/charly-build:pull` -- Pull prebuilt images into local storage
            - `/charly-build:validate` -- Validate charly.yml and layer definitions

            ### Related skills

            - `/charly-image:layer` -- Layer authoring and structure

merge-skill:
    skill:
        name: merge
        family: build
        owner: charly-build
        description: |-
            Post-build layer optimization via merging consecutive small layers.
            MUST be invoked before any work involving: charly box merge command, image layer reduction, merge configuration, or post-build optimization.
        content: |
            # charly box merge -- Post-Build Layer Optimization

            Invoked as `charly box merge [<image>]`. See `/charly-image:image` for the family overview.

            ## Overview

            Reduces image layer count by merging consecutive small layers. Uses `go-containerregistry` to load the image, groups consecutive layers below a size threshold, deduplicates filesystem entries (last writer wins), and reconstructs the image. Idempotent -- safe to run multiple times.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Merge single image | `charly box merge <image>` | Merge layers in specified image |
            | Dry run | `charly box merge <image> --dry-run` | Show what would be merged without changing anything |
            | Custom threshold | `charly box merge <image> --max-mb N` | Set max layer size for merge candidates (default: 128 MB) |
            | Merge all auto | `charly box merge --all` | Merge all images that have `merge.auto: true` |

            ## Usage

            ### Basic Merge

            ```bash
            # Merge consecutive small layers in an image
            charly box merge sway-browser-vnc

            # Preview without changing
            charly box merge sway-browser-vnc --dry-run
            ```

            ### Custom Size Threshold

            ```bash
            # Only merge layers smaller than 64 MB
            charly box merge sway-browser-vnc --max-mb 64
            ```

            ### Automatic Merge for All Configured Images

            ```bash
            # Merge all images that opt in via charly.yml
            charly box merge --all
            ```

            ## Configuration in charly.yml

            The unified form is name-first: the image entity carries its scalars — including
            the `merge:` map — inline in its `candy:` kind value (an image is a `candy:` node
            carrying `base:`/`from:`).

            ```yaml
            sway-browser-vnc:
                candy:
                    base: fedora
                    merge:
                        auto: true      # Include in `charly box merge --all`
                        max_mb: 128     # Size threshold (default: 128)
            ```

            ## How It Works

            1. Load image via `go-containerregistry`
            2. Group consecutive layers where each is below `max_mb`
            3. Deduplicate filesystem entries across merged layers (last writer wins) and suppress whiteout conflicts
            4. Reconstruct image with merged layers
            5. Inline merge also runs automatically after each build level during `charly box build`

            ## Whiteout Handling

            OCI/Docker images use special "whiteout" files to represent file deletions across layers. When merging layers, these must be handled correctly to prevent `EEXIST` errors during overlay unpack.

            **Three cases:**

            1. **Regular whiteout** — A file `.wh.<name>` in layer N indicates that `<name>` was deleted. If an earlier layer contains the original file, the merge suppresses the original (keeps the whiteout marker so the deletion is preserved in the merged output).

            2. **Opaque whiteout** — A file `.wh..wh..opq` in directory D means "the entire directory was replaced." All entries under D from earlier layers are suppressed. Only entries from the layer containing the opaque marker (and later layers) survive.

            3. **Reintroduction supersedes whiteout** — If a file is deleted (whiteout in layer M) then re-created (same path in layer N, where N > M), the whiteout is suppressed and the re-introduced file is kept. This prevents the merged layer from containing both a file and its own whiteout, which would cause overlay unpack failures.

            **Why this matters:** Without whiteout suppression, merged layers could contain contradictory entries (a file and its `.wh.*` marker coexisting), causing `EEXIST` errors when the container runtime unpacks the layer onto an overlay filesystem.

            ## Known limitation — `podman load: file exists` on multi-stage RPM images

            In some images (observed empirically against `immich:2026.128.x`), the post-build merge step succeeds at the Go-level (every merge group emits a valid tarball that passes internal consistency checks) but `podman load` rejects the final docker-archive with:

            ```
            unpacking failed (error: exit status 1; output: file exists)
            charly: error: post-build merge optimization failed (image is functional but unmerged): podman load: exit status 125
              Diagnostic: set CHARLY_MERGE_KEEP_TMP=1 and re-run `charly box merge <name>` to capture the failing /tmp/charly-merge-*.tar.
              This is a known limitation against multi-stage RPM-installed images; the build itself succeeded and the image at this tag is correct.
            ```

            **Investigation (May 2026)** ruled out every canonical mergeLayers bug class:

            - 0 within-layer duplicate Names
            - 0 whiteout/file collisions inside any merged layer
            - 0 broken hardlinks (all `Linkname` targets present in their own layer)
            - 0 cross-layer typeflag conflicts (no path is regular-file in one layer + directory in another)

            The trigger appears to be a podman-side overlay-unpack quirk under specific layer-content patterns — multi-stage RPM-installed images that touch `/usr/lib/sysimage/rpm/*` in 6+ source layers consistently reproduce. Possibly related to the known podman-5.7.x blob-reuse race (`storage_dest.go:TryReusingBlobWithOptions`) recorded in `CHANGELOG/`, but unconfirmed against 5.8.x.

            ### Operational impact

            **The failure is non-fatal.** `mergeBox` (`candy/plugin-build/drive.go`) treats merge failure as a non-fatal warning — it never fails the build. The build itself returns 0, the image is tagged at its CalVer, every individual layer digest is valid, and `charly start` runs the unmerged image with no functional difference — only the layer count is higher than ideal (more layers than a successful merge would produce).

            ### Diagnostic hook: `CHARLY_MERGE_KEEP_TMP=1`

            When merge fails and you want to capture the failing tarball for inspection or forensic analysis, set `CHARLY_MERGE_KEEP_TMP=1`:

            ```bash
            CHARLY_MERGE_KEEP_TMP=1 charly box merge <name>
            ```

            On failure the tarball is left at `/tmp/charly-merge-<random>.tar` (path printed to stderr) instead of being cleaned up. The tar is a docker-archive — extract `manifest.json` to see the layer chain, then `tar -xzf <hash>.tar.gz` on individual layers to inspect their contents.

            For forensic analysis of layer contents:

            ```bash
            # List paths within a single layer
            zcat <hash>.tar.gz | tar -tvf -

            # Find paths that appear in multiple layers (the cross-layer overlap pattern)
            for f in *.tar.gz; do
              zcat "$f" | tar -tf - | sed "s|^|$f\t|"
            done | awk -F'\t' '{cnt[$2]++} END {for (p in cnt) if (cnt[p]>1) print cnt[p], p}' | sort -rn | head
            ```

            Source: `candy/plugin-oci/merge.go:saveImageToDaemon` (the keep-on-fail logic; `loaded` flag gates the cleanup defer) — the go-containerregistry merge engine has lived out-of-process here since the P14a cutover; it was never in `charly/merge.go` (the former core CLI shell, itself relocated to `candy/plugin-box/merge_cmd.go` at P14).

            ## Project directory override

            `charly box merge` resolves `charly.yml` via `os.Getwd()`. Override with `-C <dir>` / `--dir <dir>` / `CHARLY_PROJECT_DIR=<dir>`. See `/charly-image:image` "Project directory resolution".

            ## Cross-References

            ### `charly box` family siblings

            - `/charly-image:image` -- Family overview + charly.yml composition reference
            - `/charly-build:build` -- Building images (merge runs inline after each build level)
            - `/charly-build:generate` -- Containerfile generation
            - `/charly-build:inspect` -- Inspect merged images
            - `/charly-build:list` -- Enumerate images before merging
            - `/charly-build:new` -- Scaffold new candies
            - `/charly-build:pull` -- Pull prebuilt images into local storage
            - `/charly-build:validate` -- Validate before merging

            ### Related skills

            - `/charly-image:layer` -- Layer authoring (layer size affects merge behavior)

migrate-skill:
    skill:
        name: migrate
        family: build
        owner: charly-build
        description: |-
            MUST be invoked before any work involving: the `charly migrate` command (the single idempotent migration that brings any opencharly config up to the latest schema CalVer), the CalVer schema-version stamp (`version: YYYY.DDD.HHMM`), the CUE-anchored HEAD/floor (`spec/schema/version.cue` → `#SchemaVersion`/`#SchemaFloor`), the declarative migration table (`candy/plugin-migrate/migrations.cue`, applied by the op-walker in `candy/plugin-migrate/engine.go`), the `LatestSchemaVersion()` load-time gate, or adding a new schema cutover as a migration-table entry.
        triggers:
            - "`charly migrate` / schema migration / legacy \u2192 latest CalVer / CalVer schema version"
        content: |
            # charly migrate — single-command schema migration

            `charly migrate` is **one idempotent command** that brings any opencharly config — as far back as the supported schema floor — up to the **latest schema CalVer**, and only to the latest. There are no sub-verbs to choose between: `charly migrate` always applies every migration-table step newer than the config, up to HEAD.

            ```bash
            charly migrate            # migrate every reachable config to the latest schema CalVer
            charly migrate --dry-run  # print every change migrate would make; touch nothing
            ```

            The project directory is the current working directory; use the top-level `-C` / `--dir` / `CHARLY_PROJECT_DIR` global to point elsewhere (`main()` chdir's before dispatch).

            ## CalVer schema versioning

            The YAML schema version is a **CalVer string** — `version: YYYY.DDD.HHMM`, the same fixed-width scheme as image tags (e.g. a HEAD like `version: 2026.174.1100`). It is CANONICAL fixed-width: a 4-digit year, a 3-digit zero-padded day-of-year, and a 4-digit zero-padded HHMM, so a plain alphanumeric sort of CalVer strings is chronological. `ParseCalVer` is EXTREMELY STRICT — it accepts ONLY that exact form (no `version: 4`, no non-padded `2026.45.830`); a non-canonical value is "not a CalVer", which the load gate treats as older-than-HEAD so it flows into `charly migrate`. `charly migrate` re-stamps every versioned file it brings forward to the canonical HEAD (`universalStamp`); a value that predates the supported floor — or is not a CalVer at all — is unmigratable and refused untouched (see "How it runs"). Every versioned file carries the stamp:

            - every project `charly.yml` (splitting into per-kind `vm.yml` / `local.yml` / … siblings is an optional `import:` convenience a project MAY use — never the default; see `/charly-image:image`)
            - the per-host `~/.config/charly/charly.yml`

            The parsed `ParsedCalVer` type, `ParseCalVer(string) (ParsedCalVer, bool)`, `ParsedCalVer.Less`, and `MustCalVer` live in **`spec/spec/calver_parse.go`** (the parsed type is named `ParsedCalVer` because `spec` already binds `CalVer = string`, the CUE wire scalar); `sdk/kit/calver.go` re-exports them for kit consumers. **CUE owns the HEAD and floor:** `spec/schema/version.cue` defines `#SchemaVersion` (the HEAD CalVer every file is stamped to) and `#SchemaFloor` (the oldest version migratable FROM). The spec module's `task cue:gen` emits `spec/spec/version_gen.go` with the `SchemaVersion` / `SchemaFloor` string consts (the superproject `task cue:gen` chains it); `spec.LatestSchemaCalVer()` and `spec.SchemaFloorCalVer()` parse them, re-exported as `kit.LatestSchemaVersion()` / `kit.SchemaFloor()` (what `candy/plugin-migrate/engine.go` calls) and shimmed in core by `charly/version.go`'s `LatestSchemaVersion()`. There is NO hand-maintained Go HEAD literal — the load-time gate requires `kit.LatestSchemaVersion()`, and `charly migrate` refuses anything below `kit.SchemaFloor()`.

            ### Per-merge release git tags (decoupled from `version:`)

            Every landing of ANY repo carries a **fresh** annotated release git tag `v<YYYY.DDD.HHMM>` — ONE per merge, so a repo accumulates MULTIPLE `v…` tags over time. The tag is **generated and applied by the fresh `pr-validator` at MERGE**, from the current UTC merge time — never by the author at push time (author-time stamps collide and mis-order across concurrent out-of-sync PRs; see `/charly-internals:git-workflow` "CalVer"). This is **decoupled** from the `charly.yml` `version:` field: `version:` is the SCHEMA version (bumped only when a cutover raises `#SchemaVersion`), whereas the tag marks the merge moment. Tag EVERY landing — including one at an unchanged `version:` (a content change, submodule extraction, image drop). Tags are **immutable**: only ever ADD new ones, never move or force-push an existing tag (so the load-time gate never sees a "newer than supported" CalVer from a re-tag). Every component is fixed-width zero-padded — 4-digit year, 3-digit day-of-year, 4-digit HHMM (`v2026.064.1937`, `v2026.142.1640`) — so tags sort chronologically under a plain alphanumeric sort; the evaluator computes `v$(date -u +%Y.%j.%H%M)` at merge (`%j` and `%H%M` are already zero-padded). Each repo — the superproject, every `box/<distro>` submodule, `plugins`, and `docs` — is tagged independently on its merged `main` HEAD (the tag marks the merge, so a repo needs no `charly.yml` to be tagged); a producer repo's PR merges + tags BEFORE its consumer's pointer bump. The SOLE exception is `sdk`, which tags under its Go-module `v0.<YYYYDDD>.<HHMM leading-zeros-stripped>` scheme (a semver requirement, not an exemption). See the project rulebook "Post-Execution Policies" (`AGENTS.md` / `CLAUDE.md`) and `/charly-internals:git-workflow`.

            ## The migration table (declarative data)

            The migration steps are **declarative DATA, not code**: an ordered list embedded from **`candy/plugin-migrate/migrations.cue`** (the TABLE lives in candy/plugin-migrate), validated at process start against the `#Migration` schema (`candy/plugin-migrate/schema/migration.cue` — a plugin-only validation schema that lives in the plugin per the kernel/plugin boundary law, concatenated at compile with the SDK's `version.cue` for `#CanonCalVer`). Each step is stamped with the CalVer of the date it landed and listed **chronologically** — the order the cutovers were authored in, which is the only correct replay order for an arbitrarily-old config. `charly migrate` applies every step whose version is newer than the config's stamp; each step is idempotent, so applying the whole set is safe (an already-current file is a no-op).

            A step is a small record:

            ```cue
            {version: "YYYY.DDD.HHMM", name: "<slug>", touches_host?: bool, ops?: [...#Op] | apply?: "<hook>"}
            ```

            `touches_host: true` flags a step that mutates per-host state (`~/.config/charly`, quadlets, `.secrets`) — those steps are skipped by remote-cache auto-migration (see below). A step carries EITHER an `ops:` list OR a single `apply:` hook, never both.

            **The op vocabulary — each op is DATA, zero Go.** Four generic key transforms cover the common cutovers, all applied by ONE comment-preserving yaml.v3 interpreter (the op-walker in `candy/plugin-migrate/engine.go`):

            | Op | Shape | Effect |
            |---|---|---|
            | `rename_key` | `{from, to, scope, under_kind?}` | rename a mapping key `from` → `to` |
            | `delete_key` | `{key, scope, under_kind?}` | drop a mapping key |
            | `remap_scalar` | `{key, from, to, under_kind?}` | rewrite a scalar VALUE `from` → `to` at `key` |
            | `move_key` | `{key, from_parent, to_parent, under_kind?}` | relocate a key between parent mappings |

            `scope` is `root` (top-level keys only) or `any` (every depth); `under_kind` further scopes an op to entities of a named kind (e.g. only `vm:` nodes). None of the four ops needs a line of new Go — the walker interprets the data.

            **The `apply:` hook — the deliberate, visible EXCEPTION.** A structural reshape the four ops can't express (splitting one node into siblings, folding a list into a map) sets `apply: "<hook>"` naming a Go function registered in the core `goHooks` map. This is the ONLY path that runs bespoke Go for a migration, and it is intentionally conspicuous: a table entry carrying `apply:` is the signal that this step needed real code.

            **CUE has NO transformation capability.** CUE is monotone unification — it can validate, default, require, and close, and nothing more; it CANNOT rewrite a config. So CUE owns exactly two things here: the version pins (`#SchemaVersion` / `#SchemaFloor`) and the SHAPE of the declarative table (`#Migration` validates every entry at startup). Every actual transform is Go — the generic op-walker, or an `apply:` hook. Do not expect CUE to migrate anything.

            **The current table.** The floor sits at the migration-baseline reset version (`2026.174.1100`), so any config predating it is unmigratable — the accepted clean-slate consequence. The table carries ONE entry, the schema-compaction cutover:

            | version | name | touches_host | apply |
            |---|---|---|---|
            | `2026.186.2323` | `compact-node-form` | `true` | `compactNodeForm` (goHook) |

            The `compactNodeForm` hook is a structural reshape the four generic ops can't express: it folds the former named data/step child-node grammar into the compact node form — collections (`env`/`volume`/`port`/`service`/…) inline in the kind value, steps as the ordered `plan:` list (a meaningful former step-node name becomes the step's `id:`), deploy data (`add_candy`/`install_opts`/`vm_state`/…) inline in the substrate node, and every authored step `plugin:`+`plugin_input:` pair rewritten to the `<word>: <input>` verb sugar. Member children (sub-entities under a deployable kind) stay named children. Remote layer caches auto-migrate on fetch (see "Remote-cache auto-migration"). The same cutover DELETED the Calamares `target:` / `module:` / `package-group:` kinds (and their plugins) — they had zero core readers; they return as their own cutover when the installer feature is real.

            ## How it runs

            The migration engine is a **COMPILED-IN command plugin** (`candy/plugin-migrate`, `command:migrate`) — the engine, table, and CLI live in the plugin, out of charly core; core keeps only the below-floor/behind-head load-gate HINTS (the `Run: charly migrate` messages). `charly migrate` dispatches to the compiled-in `command:migrate` provider; the remote-cache auto-migration (`refs.go`) resolves the same provider and Invokes it (`OpRun --project-only`) in-proc.

            `runMigrations` (`candy/plugin-migrate/engine.go`) is **floor-gated**, comparing the config's `version:` stamp against `kit.SchemaFloor()` and `kit.LatestSchemaVersion()`:

            - **at HEAD** → no-op; prints `nothing to migrate (already at schema <HEAD>)`.
            - **below the floor, or not a CalVer at all** → **unmigratable**: refused with an actionable error (`predates the supported floor … re-author against the current schema`) and **NO filesystem change**. Configs from before the baseline reset fall here. A stranded **per-host** config (`~/.config/charly/charly.yml`) at a below-floor version is doubly stuck: it can neither migrate NOR be WRITTEN — `saveDeployState` refuses to overwrite a config it cannot load (`refusing to overwrite … the existing per-host config fails to load … fix it (or remove it to regenerate) first`), so every pod/vm/local deploy — including a `charly check run <bed>` at its `config`/`deploy-add` step — fails until it is reset. Since it holds only regenerable deploy STATE (no authored intent), back it up and reset it to a bare `version: <HEAD>` stub (or remove it); the state rebuilds on the next deploy.
            - **in `[floor, HEAD)`** → apply every migration-table step newer than the stamp (in order, via the op-walker / `apply:` hooks), then re-stamp every versioned file to HEAD (`universalStamp`).

            Per-step backups follow the established `<file>.bak.<unix-ts>` convention.

            ### Remote-cache auto-migration (project-only)

            `sdk/loaderkit`'s refs seams (the former `charly/refs.go` is DELETED, K-wave 2) auto-run the remote-cache migration (`migrateCacheViaPeer`, `sdk/loaderkit/refs_seams_executor.go`) on a freshly-cloned remote-repo cache so external repos pull through at the latest schema. It skips every `touches_host` step and leaves the host-deploy path empty, so a remote fetch **never mutates the user's per-host state** — even the final re-stamp touches only the cache's project files. A remote whose config predates the floor **fails the fetch** with the same predates-floor error (an old remote is unmigratable — the accepted clean-slate consequence).

            ## Load-time gate

            The load-time gate `GateSchemaVersion` (`sdk/loaderkit/load_unified.go` — the former `charly/unified.go` is DELETED, K-wave 2) is unchanged: `LoadUnified` parses the merged `version:` and rejects anything below HEAD (or absent, or non-CalVer):

            ```
            charly.yml: schema 2026.186.2323 is required (found "4"). Run: charly migrate
            ```

            A non-CalVer value (a legacy integer, empty, or garbage) parses as "older than every real CalVer", so a stale config trips the gate with a uniform `Run: charly migrate` hint — the forward-compat trigger that makes a future migration fire. Whether that migrate then SUCCEEDS depends on the floor: a config in `[floor, HEAD)` migrates; one below the floor is refused (see "How it runs"). Residual-key checks (e.g. `kind: deployment`, `target: host`, `secret_backend: kdbx`) remain as defense-in-depth, but every remediation hint points uniformly at bare `charly migrate`.

            ## Adding a future cutover

            **From here to the end of "Standing rule" is maintenance the charly project performs on its OWN schema**, run from the superproject checkout (the spec module is vendored in-repo). Nothing in these two sections is a step an charly user runs — the user-facing surface of a schema cutover is the single command `charly migrate`, unchanged. They are recorded here because this skill owns the migration table; the commands are named as this project's maintenance, not as instructions for the reader.

            The payoff of the declarative engine: the common case needs **zero new Go** — and since the spec module is vendored into the superproject, a schema-version bump is **SAME-REPO**: bump, regenerate, and append the migration entry in ONE superproject PR. The opencharly/spec GitHub repo remains the module-proxy publication point for out-of-tree consumers (the published `sdk` module and marketplace candies resolve `require github.com/opencharly/spec` from the proxy); when a schema cutover advances the vendored tree and an out-of-tree consumer must adopt it, the operator syncs the `spec/` subtree to opencharly/spec and tags it with the spec Go-module tag scheme `v0.<YYYYDDD>.<HHMM leading-zeros-stripped>` as part of the same cutover.

            1. Bump `#SchemaVersion` in **`spec/schema/version.cue`** to the new CalVer.
            2. Run the spec module's **`task cue:gen`** to regenerate `spec/spec/version_gen.go` (the superproject `task cue:gen` chains it).
            3. Append the matching entry to **`candy/plugin-migrate/migrations.cue`** (the TABLE lives in candy/plugin-migrate) with the same `version:` — **strictly greater** than the previous HEAD, expressing the transform as an `ops:` list (`rename_key` / `delete_key` / `remap_scalar` / `move_key`) — and run the superproject's own gates. No separate spec repo landing exists: the schema, its generated types, and the migration entry ship in the ONE superproject PR.

            That is the whole common case — no bespoke migrator type, no registry function, no per-migrator Go file. Only a **structural reshape the four ops can't express** additionally registers ONE `goHooks` entry (a Go function named by the step's `apply:` field). Update the HEAD-CalVer fixtures + the repo's own versioned YAML in the same change.

            The operator command never changes — it stays `charly migrate`.

            **The validated schema is CUE-single-source.** The `@go()`-annotated `spec/schema/*.cue` defs are the sole source for the Go param structs (generated into `spec/spec` by `task cue:gen`); a wire-key change is a CUE edit first, then `task cue:gen`, then — only if it breaks existing on-disk configs — a migration-table entry here (plus the `#SchemaVersion` bump above). A pure codegen refactor that leaves every authored wire key untouched needs NO migration entry and NO `version:` bump. See the `/charly-internals:go` recipe "How to change the charly.yml schema (CUE is the single source of truth)".

            ### Standing rule: a schema/format change bumps `version:` AND mints a git tag

            Any change to the YAML schema or composition format (a key rename, a deleted key, a new key shape) is a hard-cutover that MUST:

            1. **Bump the `#SchemaVersion` CalVer** — edit `spec/schema/version.cue`, run `task cue:gen`, and append the matching entry to `candy/plugin-migrate/migrations.cue` (the same-repo sequence under "Adding a future cutover"), then land the sdk PR (the fresh `pr-validator` merges + tags it), and in the superproject bump the sdk submodule. The load-time gate then rejects any not-yet-migrated config with a `Run: charly migrate` hint, so every reader sees the new format. Raising `#SchemaVersion` WITHOUT the migration-table entry (or vice-versa) is forbidden — and `version:` is NEVER set above `LatestSchemaVersion()` (newer configs hard-fail at load). **The author writes a PLACEHOLDER `#SchemaVersion` / `version:` / `migrations.cue` CalVer; the fresh `pr-validator` FINALIZES it at MERGE** — re-stamping it strictly ABOVE the current `main` HEAD's schema version (two concurrent schema PRs would otherwise collide or mis-order; see `/charly-internals:git-workflow` "CalVer").
            2. **The fresh `pr-validator` mints the per-merge git tag** at merge — `v<YYYY.DDD.HHMM>` from the merge moment (see "Per-merge release git tags" above). The tag and the `version:` bump are decoupled: the tag marks the merge, `version:` marks the schema. A schema cutover happens to do BOTH at once, but a content-only landing (no schema change) still mints a tag at an unchanged `version:`.

            ## Idempotency

            Running `charly migrate` twice is a no-op: after the first run the config is stamped at HEAD, so the second run hits the floor gate's "at HEAD → nothing to migrate" branch. Every op is itself idempotent (a rename with no matching key does nothing). The migration table's own invariants — every entry a valid `#Migration`, versions strictly ascending and unique, HEAD == `#SchemaVersion` — are validated against CUE at process start.

            ## See Also

            - `/charly-image:layer` — the compact-node-form candy schema migrations produce
            - `/charly-image:image` — `image:` entries + `charly box build/validate/inspect`
            - `/charly-core:deploy` — the deploy entries a migration may rewrite
            - `/charly-local:local-spec` — `kind: local` templates
            - `/charly-build:secrets`, `/charly-build:settings` — the credential schema
            - `/charly-internals:go` — loader internals (`LoadUnified`, `ParseCalVer`, the `gateSchemaVersion` load gate, the `candy/plugin-migrate/engine.go` op-walker)
            - `/charly-internals:cutover-policy` — why hard-cutover + a single idempotent `charly migrate` is the required shape

new-skill:
    skill:
        name: new
        family: build
        owner: charly-build
        description: |-
            Scaffold new candies, boxes, and whole projects with template files.
            MUST be invoked before any work involving: charly box new {project, box, candy} commands, creating new projects/boxes/candies, or scaffolding directories.
        content: |
            # charly box new -- Scaffold New Projects, Boxes, and Candies

            The `charly box new` family groups three scaffolding verbs. See `/charly-image:image` for the full family overview and `/charly-image:layer` for the layer-authoring verb catalog it bootstraps.

            ## Overview

            Three verbs, in decreasing scope:

            | Verb | What it creates |
            |---|---|
            | `charly box new project <dir>` | A fresh `charly.yml` (with `discover: [box, candy]`), empty `box/` + `candy/` directories, and a `.gitignore` |
            | `charly box new box <name>` | A new discovered image at `box/<name>/charly.yml` (a `candy:` image doc — kind-keyed `candy:` carrying `base:`; there is no `box:` KIND) |
            | `charly box new candy <name>` | A new layer candy at `candy/<name>/charly.yml` (stub kind-keyed `candy:` doc, no `base:`/`from:`) |

            All three are **comment-preserving**: the YAML edits route through the `yaml.v3` Node API rather than the value API, so human-authored comments and key order survive round trips. Implementation lives in `sdk/kit/scaffold.go` (`kit.ScaffoldProject` / `kit.AddBox` / `kit.ScaffoldCandy`) + `sdk/kit/yaml.go` (`kit.SetByDotPath` / `kit.MappingChild`); the candy-list EDIT helpers (`addCandyToBox` / `removeCandyFromBox`) live in `candy/plugin-authoring/authoring_edit.go` (P14b).

            Each verb also auto-becomes an MCP tool (`box.new.project`, `box.new.box`, `box.new.candy`) via the `charly __cli-model` reflection seam (`charly/cli_model_cmd.go`) consumed by the externalized MCP server (`candy/plugin-mcp`) — so an LLM agent driving `charly mcp serve` can scaffold a project from scratch over RPC. See `/charly-build:charly-mcp-cmd` "Authoring tools".

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | New project | `charly box new project <dir>` | Scaffold a fresh charly project (charly.yml + box/ + candy/ + .gitignore) |
            | New box | `charly box new box <name> --base <ref> [--candy a,b,c]` | Write box/<name>/charly.yml |
            | New candy | `charly box new candy <name>` | Create candy/<name>/charly.yml |

            ## Usage

            ### `charly box new project <dir>`

            ```bash
            charly box new project ~/my-project
            # Creates:
            #   ~/my-project/charly.yml  (version + discover: [box, candy] + defaults)
            #   ~/my-project/box/         (empty — boxes discovered per-dir)
            #   ~/my-project/candy/       (empty — candies discovered per-dir)
            #   ~/my-project/.gitignore   (ignores .build/ + editor scratch files)
            ```

            **A scaffolded project is immediately usable.** The default distro/builder/init/resource
            build vocabulary (and the default sidecar templates) are EMBEDDED in the `charly` binary
            (`charly/charly.yml`, `//go:embed`) — no build vocabulary to copy or `format_config` to wire. Declare
            `distro:`/`builder:`/`init:`/`resource:` in `charly.yml` (or an imported vocab file) ONLY to
            extend or override the embedded default. Add a box with `charly box new box <name>`
            (writes `box/<name>/charly.yml`) and a candy with `charly box new candy <name>` (writes
            `candy/<name>/charly.yml`).

            ### `charly box new box <name>`

            ```bash
            charly -C ~/my-project box new box hello \
                --base quay.io/fedora/fedora:43 \
                --candy sshd,tmux
            # Writes box/hello/charly.yml (an image = a `candy:` node carrying `base:`).
            # The NAME is the node key, not a field — there is no `name:`:
            #   hello:
            #       candy:
            #           base: quay.io/fedora/fedora:43
            #           candy:
            #               - sshd
            #               - tmux
            ```

            Flags: `--base` (required — URL or name of another box), `--candy` (optional comma-separated candy names). Existing `charly.yml` comments + key order are preserved.

            ### `charly box new candy <name>`

            ```bash
            charly -C ~/my-project box new candy sshd
            # Creates:
            #   ~/my-project/candy/sshd/
            #   ~/my-project/candy/sshd/charly.yml  (stub: candy name + version, ready for add-rpm)
            ```

            Follow up with `charly candy add-rpm sshd openssh-server openssh-clients` (see `/charly-image:layer`) to populate packages without manually editing YAML — it creates the `distro.fedora.package` section on demand (and `add-deb` / `add-pac` / `add-aur` the matching `distro.'debian,ubuntu'` / `distro.arch` / `distro.arch.aur` sections).

            ## Workflow

            The end-to-end scaffold → build flow:

            1. `charly box new project ~/my-project` — create the project skeleton
            2. (optional) Declare `distro:`/`builder:`/`init:`/`resource:` only to EXTEND or OVERRIDE the embedded build vocabulary — a fresh project needs none
            3. `charly box new candy my-svc` — create a candy
            4. `charly candy add-rpm my-svc openssh-server` — populate packages (see `/charly-image:layer`)
            5. `charly box new box my-app --base quay.io/fedora/fedora:43 --candy my-svc` — wire into charly.yml
            6. `charly box validate` — check for errors
            7. `charly box build my-app` — build the image

            All the steps are also callable as MCP tools (`box.new.project`, `box.new.candy`, `candy.add-rpm`, …), so an agent driving `charly mcp serve` can run this entire flow over RPC. See `/charly-build:charly-mcp-cmd` "Authoring tools" for the worked MCP-only example.

            The scaffolded `charly.yml` from step 3 is minimal — the candy NAME as the node key, then a `candy:` block carrying `version:`, a placeholder `description:`, and a `plan:` with one starter `check:` (there is no `name:` field; the key IS the name). Add sections as needed: a `distro:` map (per-distro `package:` lists, populated by `charly candy add-rpm` / `add-deb` / `add-pac` / `add-aur`) for system packages, `env:` for runtime environment, `port:` / `service:` / `volume:` for services, and `task:` for install operations (mkdir, copy, write, download, link, setcap, cmd, build). The scaffolder does not create separate Taskfile shell scripts — all install logic flows through `task:` in `charly.yml`.

            ## Naming Rules

            - Lowercase-hyphenated names only (e.g., `my-tool`, `dev-tools`)
            - Must not conflict with existing layer names

            ## Project directory override

            `charly box new candy <name>` writes into `candy/<name>/` relative to `os.Getwd()`. Override with `-C <dir>` / `--dir <dir>` / `CHARLY_PROJECT_DIR=<dir>`. See `/charly-image:image` "Project directory resolution".

            ## Cross-References

            ### `charly box` family siblings

            - `/charly-image:image` -- Family overview + charly.yml composition reference
            - `/charly-build:build` -- Build images containing the new candy
            - `/charly-build:generate` -- Containerfile generation
            - `/charly-build:inspect` -- Inspect built image including the new candy
            - `/charly-build:list` -- Enumerate layers (the new one shows up here)
            - `/charly-build:merge` -- Post-build layer consolidation
            - `/charly-build:pull` -- Pull prebuilt images (unrelated; for consumers of your new candy)
            - `/charly-build:validate` -- Validate candy and box definitions

            ### Related skills

            - `/charly-image:layer` -- Layer authoring guide, charly.yml format, install files + the `charly candy set / add-rpm / add-deb / add-pac / add-aur` editing surface
            - `/charly-build:charly-mcp-cmd` -- "Authoring tools" table + the MCP-only build-from-scratch worked example
            - `/charly-internals:go` -- Implementation notes: the `yaml.v3` Node API is the reason edits preserve comments; `sdk/kit/scaffold.go` + `sdk/kit/yaml.go` house the create-side logic (`kit.ScaffoldProject` / `kit.AddBox`), `candy/plugin-authoring/authoring_edit.go` the candy-list edits

pull-skill:
    skill:
        name: pull
        family: build
        owner: charly-build
        description: |-
            Fetch an image from its registry into local container storage so deploy-mode
            commands can read its OCI labels.
            MUST be invoked before any work involving: charly box pull command, the
            ErrImageNotLocal error, fetching images by short name / fully-qualified ref /
            @github.com/... remote ref, or recovering deploy-mode commands that fail
            with "image X is not available locally".
        content: |
            # charly box pull -- Fetch Image Into Local Storage

            ## Overview

            `charly box pull` fetches an image from its registry into the local container
            engine's storage so deploy-mode commands (`charly shell`, `charly start`, `charly config`,
            `charly alias add`, etc.) can read its OCI labels via `ExtractMetadata`. It is a
            **pull-only** operation — it does not start, configure, or restart any
            service. That's `charly update`'s job (see `/charly-core:charly-update`).

            This command is the prerequisite for every deploy-mode operation on a fresh
            host. Since the `charly box` refactor, deploy-mode commands no longer read
            `charly.yml` — they read OCI labels + `charly.yml` only. If an image isn't
            in local storage, the label read fails and the CLI surfaces a friendly
            recommendation pointing here.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Pull short name | `charly box pull jupyter` | Resolves registry + tag via `charly.yml` (requires project directory) |
            | Pull fully-qualified ref | `charly box pull ghcr.io/opencharly/jupyter:2026.108.56` | Pulls as-is, works from anywhere |
            | Pull remote project ref | `charly box pull @github.com/org/repo/image:v1` | Downloads repo, reads its `charly.yml`, pulls registry ref |
            | Override tag (short name) | `charly box pull jupyter --tag 2026.108.1` | Pull a specific CalVer tag |
            | Override platform | `charly box pull jupyter --platform linux/arm64` | Pull a specific platform |

            ## Three Input Forms

            ### 1. Short name (requires project directory)

            ```bash
            cd ~/opencharly && charly box pull jupyter
            ```

            Resolves `<registry>/jupyter:<tag>` via `charly.yml`. Equivalent to the
            two-step:

            ```bash
            charly box inspect jupyter --format registry  # ghcr.io/opencharly
            charly box inspect jupyter --format tag       # ghcr.io/opencharly/jupyter:2026.108.56
            # …then podman pull <that-ref>
            ```

            …but packaged as a single command.

            ### 2. Fully-qualified ref (no project required)

            ```bash
            charly box pull ghcr.io/opencharly/jupyter:2026.108.56
            ```

            Runs `podman pull <ref>` directly. Useful from any directory, including
            `/tmp`. Supports any registry that the underlying engine (`podman`/`docker`)
            can authenticate against.

            ### 3. Remote project ref (`@github.com/...`)

            ```bash
            charly box pull @github.com/opencharly/charly/jupyter:2026.108.56
            charly box pull @github.com/opencharly/charly/jupyter          # latest git tag
            ```

            Downloads and caches the repo, reads its `charly.yml`, then pulls the
            registry ref declared there. This is the **only** place `@github.com/...`
            refs are accepted in `charly`. Deploy-mode commands (`charly shell`, `charly start`,
            `charly config`, etc.) reject them with a message pointing users here.

            ## Semantics

            - **Idempotent.** Running `charly box pull jupyter` twice with the image
              already local is a no-op (the engine's `pull` is layer-aware).
            - **No side effects on services.** Unlike `charly update`, this command does
              not restart, reconfigure, or touch any running container.
            - **Prints the resolved ref** on success. One line to stderr.
            - **Respects engine selection.** Uses the run engine from
              `ResolveRuntime` (`podman` by default; `docker` if configured).

            ## Interaction with `ErrImageNotLocal` (the sentinel pattern)

            The CLI has a centralized design for "image not in local storage" errors.
            Every deploy-mode command inherits the same friendly recommendation without
            per-call-site code:

            1. `ExtractMetadata(engine, imageRef)` in `spec/container/box_metadata_coneb.go`
               (re-exported as `kit.ExtractMetadata` / `deploykit.ExtractMetadata`) returns
               `spec.ErrImageNotLocal` (wrapped with the image ref) when the image is absent
               from local storage.
            2. `dispatchBuildEnsure` (`charly/dispatch_build_ensure.go`) dispatches to
               candy/plugin-build's `build:ensure` word (`candy/plugin-build/ensure.go`),
               which returns the same sentinel when the image is absent from both run and
               build engines.
            3. `FormatCLIError` in `charly/image.go` unwraps the sentinel at the top-level
               error boundary in `main()` and renders:

            ```
            Error: image "X" is not available locally.
                   Run 'charly box pull X' to fetch it first
            ```

            Any deploy-mode command that calls `ExtractMetadata` or `EnsureImage`
            (shell, start, stop, config, deploy, update, remove, alias, vm, service,
            cdp, wl, vnc, tmux, record, dbus, logs — essentially everything outside
            `charly box`) automatically participates. If you're authoring a new command
            that reads image metadata, just call `ExtractMetadata` and the
            recommendation falls out for free.

            ## Interaction with `charly update`

            | Aspect | `charly box pull` | `charly update` |
            |---|---|---|
            | Side effects | None. Pulls bytes, prints digest. | Pulls, seeds data into volumes, restarts active service. |
            | Required before deploy | Yes (first time only). | No — it calls `pull` internally if needed. |
            | Use when | You want labels available but aren't ready to deploy. Or just installed `charly` on a fresh host. | You have a running service and want to roll to a new image version. |

            Rule of thumb: **`pull` is the prerequisite; `update` is the refresh.**
            Use `charly box pull <image>` once to seed local storage; use `charly update
            <image>` every time you bump the version afterward.

            ## Flags

            - `--tag <tag>` (default: `latest`) — Image tag when resolving a short
              name. Ignored for fully-qualified or remote-project refs (the tag is
              embedded in the ref).
            - `--platform <platform>` — Target platform (default: host). Passed to
              `podman pull --platform`.

            ## Typical Workflows

            ### Fresh host, new user

            ```bash
            # Install charly (see README Install section)
            charly box pull jupyter                # pull once; labels now readable
            charly config jupyter                    # generate quadlet from labels + charly.yml
            charly start jupyter                     # systemctl --user start
            ```

            ### Deploying a remote image

            ```bash
            charly box pull @github.com/opencharly/charly/hermes:latest
            charly config hermes
            charly start hermes
            ```

            ### Fixing a broken deploy-mode command

            ```bash
            charly shell jupyter
            # Error: image "jupyter:latest" is not available locally.
            #        Run 'charly box pull jupyter:latest' to fetch it first
            charly box pull jupyter:latest          # follow the recommendation
            charly shell jupyter                      # now works
            ```

            ## Why this command exists

            Before the `charly box` refactor, deploy-mode commands had dual-mode logic:
            try `charly.yml` first, fall back to OCI labels. That produced drift (the
            two paths could diverge) and silently pulled-and-built remote refs as a
            side effect of what looked like a simple `charly shell @github.com/...` call.

            The refactor drew a hard line: deploy-mode commands read labels only;
            build-mode commands (`charly box …`) read `charly.yml` only. `charly box pull`
            is the bridge — it takes a build-mode identifier (short name or remote
            repo ref) and produces a deploy-mode-consumable artifact (labels in local
            storage).

            ## Project directory override

            `charly box pull` resolves `charly.yml` via `os.Getwd()` when given a short name (to resolve registry + tag). Override with `-C <dir>` / `--dir <dir>` / `CHARLY_PROJECT_DIR=<dir>`. Fully-qualified refs and `@github.com/...` remote refs don't need a project dir. See `/charly-image:image` "Project directory resolution".

            ## Cross-References

            - `/charly-image:image` — family overview; `charly box pull` is one of 8 subcommands.
            - `/charly-build:build` — pulls and builds are orthogonal; build creates images,
              pull fetches existing ones.
            - `/charly-core:charly-update` — rolls deployed services to a new image version
              (pulls + data-seeds + restarts).
            - `/charly-build:inspect` — print resolved ref from `charly.yml` without pulling.
            - `/charly-core:shell`, `/charly-core:start`, `/charly-core:charly-config`, `/charly-automation:alias`, `/charly-vm:vm` —
              deploy-mode commands that require a pulled image.
            - `/charly-core:deploy` — charly.yml overlay semantics applied on top of the
              labels `pull` materializes.
            - `/charly-internals:go` — `ErrImageNotLocal` / `dispatchBuildEnsure` / `ExtractMetadata`
              source locations (`spec/spec/image_errors.go`, `charly/dispatch_build_ensure.go`,
              `spec/container/box_metadata_coneb.go`, `charly/image.go`).

load-skill:
    skill:
        name: load
        family: build
        owner: charly-build
        description: |-
            Use when a locally-built image has to reach the NESTED podman store inside a running
            pod — a candybox that runs its own containers. `charly box load` is the container
            twin of `charly vm cp-box`. Invoked as `charly box load <target> <image>`.
        triggers:
            - "`charly box load` / delivering an image into a pod's NESTED podman store / nested-podman-socket / the container twin of `charly vm cp-box`"
        content: |
            # charly box load — deliver an image into a pod's NESTED store

            Invoked as `charly box load <target> <image>`. The container-venue twin of
            `charly vm cp-box` (`/charly-vm:vm`); both are bindings of one shared path.

            ## What problem it solves

            A pod composing `container-nesting` runs its own rootless podman, with an image
            store that is genuinely SEPARATE from the host's. Anything that must run inside
            that boundary needs its images in the NESTED store.

            The alternatives do not work. Binding the host's podman socket into the pod
            dissolves the boundary — containers spawned there land in the HOST store, beside
            everything else running on the machine. A registry pull is no escape when the
            image is private or was never pushed. That leaves local delivery, and `box load`
            is its charly-native form: before this verb the only path was a hand-run
            `podman save | podman --remote load` pipeline, a manual container-engine command
            against a charly-managed deploy (forbidden — the CLI is the only operational
            interface).

            ## Prerequisite: the venue must serve a socket

            The target pod must compose `nested-podman-socket`
            (`/charly-distros:nested-podman-socket`), which serves the nested podman's
            API socket at uid 1000 and declares the named volume at `/run/user/1000` that
            makes it possible. Without it the verb reports that the venue serves no socket
            and names the path it tried.

            The default socket is `/run/user/1000/podman/podman.sock` — the uid-1000
            rootless path that composition serves. `--socket` overrides it.

            Composing it looks like this. Note which entity this is: `base:` marks it a
            BOX — the thing you build. Deploying that box on a container venue gives you
            the pod this verb targets; on a VM venue the twin verb is `charly vm cp-box`.
            The two arguments follow from that: `<target>` names the running deploy, never
            the box, and `<image>` is the artifact being delivered into it.

            ```yaml
            my-spike-box:
                candy:
                    version: 2026.230.1200
                    base: quay.io/fedora/fedora:43
                    description: A box that serves its own rootless podman socket, so a deploy of it can receive images.
                    distro:
                        - fedora:43
                        - fedora
                    candy:
                        - nested-podman-socket    # pulls in container-nesting itself
            ```

            ## Usage

            ```bash
            charly box load <target> <image>                  # deliver into the venue's store
            charly box load <target> <image> --as <stable-ref> # …and tag it there
            charly box load <target> <image> --socket <path>   # non-default socket path
            charly box load <target> <image> --instance <n>    # when the target runs several
            ```

            `<target>` is the running deploy, named exactly as `charly shell` and `charly cp`
            take it. `<image>` is either an explicit local ref — used as authored, because
            naming a tag IS the choice — or a bare box name, which resolves to the newest
            local BUILD. That resolution is strict: it refuses to elect an image older than
            the newest local build, because delivering a stale artifact is the wrong-artifact
            class `charly check box` refuses to certify, and it is far harder to notice here
            (the load succeeds; the venue simply runs the wrong image).

            ## The transfer is verified, not assumed

            `podman load` can exit 0 on a TRUNCATED stream, registering an image whose overlay
            layers are incomplete — a later `podman run` then fails with
            `…/storage/overlay/<hash>: no such file`. So the transfer is never trusted on the
            load exit code alone:

            - the idempotency skip fires only when the venue already holds the ref AND that
              image is verified intact, so a present-but-torn image is not wrongly skipped;
            - after a load the image is probed, and on the overlay-corruption signature it is
              dropped and re-streamed ONCE; a second failure is a hard error rather than a
              broken image shipped silently.

            Nothing touches disk in between — the image streams `save | load` with no
            intermediate tarball, which also matters because a multi-GB image will not fit in
            a size-limited `/tmp`.

            ## Verification

            `check-boxload-pod` is the R10 bed — a deploy in the project's own `charly.yml`
            marked `disposable: true`, the flag that authorizes charly to destroy and
            rebuild it unattended. It delivers a host image into the pod's nested
            store and asserts, THROUGH the socket, that the image is there. The assertion is
            socket-scoped deliberately — a plain in-container `podman images` would pass even
            if the image had gone to the wrong store.

            A successful delivery reports each stage, so a skip is distinguishable from a
            transfer:

            ```
            box load: streaming localhost/my-image:latest into venue storage (save | load)...
            box load: localhost/my-image:latest is now in venue storage (verified intact)
            ```

            and an already-present, verified image says so instead of re-streaming:

            ```
            box load: venue already has localhost/my-image:latest (verified intact) — skipping transfer
            ```

reconcile-skill:
    skill:
        name: reconcile
        family: build
        owner: charly-build
        description: |-
            Use when @github layer/namespace pins drift across repos and the resolver emits
            "referenced at multiple versions" warnings — `charly box reconcile` aligns every
            pin of a repo to one version (clearing the warnings). Invoked as
            `charly box reconcile`.
        triggers:
            - "`charly box reconcile` / cross-repo `@github` pin alignment / candy-version-mismatch cleanup"
        content: |
            # charly box reconcile — align cross-repo `@github` version pins

            Invoked as `charly box reconcile`. See `/charly-image:image` for the family overview.

            ## Overview

            The layer resolver compares each layer's PER-ENTITY `version:` (read after fetch),
            not the repo git tag — so a repo re-tag of an UNCHANGED layer does NOT warn. When
            a layer DOES resolve to two different per-entity versions (a family pinned to a
            genuinely newer layer than the shared infra it composes), it **warns once and uses
            the newest** (see `/charly-internals:go` "Remote-layer resolver", `/charly-build:validate`).
            The git `:vTAG` is only the FETCH coordinate. `charly box reconcile` aligns the
            on-disk git-tag pins — for each distinct repo referenced by the project's
            versioned YAML, it rewrites EVERY pin of that repo to ONE target tag, so every
            reference fetches one commit per repo and the next `charly box generate` emits
            **zero** version warnings. Edits are comment-preserving (yaml.v3 node API). The
            default mode is idempotent; `--remote` is not, because its target is whatever the
            remote's newest tag is at the moment of the call — see "`--remote` targets whatever
            is newest NOW" below before reaching for that flag.

            The **zero-warnings R10 gate** (the project rulebook R1 (`AGENTS.md` / `CLAUDE.md`)) makes this load-bearing: a change
            that introduces a version mismatch is not landable until `charly box reconcile`
            clears the warning.

            ## Quick Reference

            | Action | Command | Description |
            |---|---|---|
            | Preview rewrites | `charly box reconcile --dry-run` | Print every pin it would change; touch nothing |
            | Align to newest referenced | `charly box reconcile` | Rewrite each repo's pins to the newest version ALREADY referenced (offline) |
            | Align to newest remote tag | `charly box reconcile --remote` | Query `git ls-remote --tags` per repo and bump to the newest tag. **Moves pins to whatever is newest at call time — not idempotent against a moving remote; never use it to CHECK alignment** |

            ```bash
            charly box reconcile --dry-run      # see the plan
            charly box reconcile                # align to newest referenced (no network)
            charly -C box/cachyos box reconcile   # reconcile a submodule's pins
            ```

            ## What it does

            1. **Scan** every `@github.com/owner/repo[/path]:vTAG` ref in the project's
               versioned YAML files (`charly.yml` + discovered `box/<name>/charly.yml` /
               `candy/<name>/charly.yml`, plus any flat-imported legacy per-kind files —
               `charly.yml` / `check.yml` / `local.yml` / `pod.yml` / `kubernetes.yml` / `vm.yml` /
               `charly.yml`). Refs appear in `import:` namespaces, image `base:` / `builder:` /
               `candy:`, and `kind:local` `candy:` lists.
            2. **Target** per repo: the newest version ALREADY referenced (default —
               `compareSemver`, orders CalVer correctly, no network) or, with `--remote`, the
               newest tag on the remote (`GitLatestTag`).
            3. **Rewrite** every pin of that repo whose version differs from the target,
               preserving comments and key order. Unpinned refs and single-version repos are
               left untouched. In the default mode this converges: the target is the newest
               version already referenced, which after one run is every pin's version, so a
               second run rewrites nothing. `--remote` carries no such guarantee.

            ## `--remote` targets whatever is newest NOW

            The default mode is safe to run as a QUESTION — *"are this repo's pins already
            aligned?"* It reads only the versions the tree already references, so it needs no
            network, converges, and answers without moving anything you did not intend to move.
            Use it, or `--dry-run`, to check alignment.

            `--remote` is a different operation. It ignores the referenced set entirely and
            resolves each repo's target from `git ls-remote --tags` at the moment of the call
            (`reconcileTargetVersion` returns `GitLatestTag` without consulting the referenced
            versions at all), so it is idempotent only against a remote that has not moved.
            Re-run it after a sibling repo publishes a newer tag and EVERY pin of that repo is
            rewritten again — including pins a previous `--remote` run had just aligned.

            The re-bump is reported, but its explanation is not. `rewrote N pin(s):` prints with
            every rewritten ref, while the per-repo `<repo> -> <tag> (was at N versions)` summary
            is emitted only for a repo found at MORE than one version. A freshly-aligned repo is
            at exactly one — so the line that would say *why* the target moved is suppressed in
            precisely the case where the target moved for a reason outside the tree.

            **The operational consequence: `--remote` invalidates evidence gathered before it
            ran.** A bed transcript, a build log, or a `charly check` run describes the tree at
            the tags the pins held when it was produced. A later `--remote` can move those pins
            to a tag no proof covers, leaving a tree that still looks correctly reconciled. So:

            - To find out whether pins are aligned, run the plain `charly box reconcile` (or
              `--dry-run`). Never reach for `--remote` to answer a question.
            - Run `--remote` deliberately, at the ONE point in a cutover where adopting the
              producer's newest tag is the intent — `/charly-internals:git-workflow` B6: after
              the producer is landed and tagged, BEFORE the consumer's authoritative R10.
            - Once it has run, the pins name the tag the R10 must be produced against. If proofs
              already exist for an older tag, either re-run the gate against the new pin or
              restore the tag the proofs cover. Shipping a newer pin on an older proof is an R10
              failure whether or not anything rebuilt.

            ## Scope — one project per invocation

            `charly box reconcile` operates on the CURRENT project (cwd; honors the top-level
            `-C` / `--dir` / `CHARLY_PROJECT_DIR`). For a multi-repo tree (the main repo + its
            `box/<distro>` submodules), run it per repo, or per submodule via `-C
            image/<name>`. This pairs with the cross-repo landing order in
            `/charly-internals:git-workflow` B6: land + tag the producer FIRST, then
            `charly box reconcile` repoints the consumer to the producer's fresh tag before the
            consumer's authoritative R10.

            ## Implementation

            `candy/plugin-box/reconcile.go` — `dispatchReconcile` (wired as a `charly box` word in
            `candy/plugin-box/box.go`; the former `charly/reconcile.go` is DELETED, K-wave 2).
            Reuses `ParseRemoteRef` (`spec/spec/ref_parse.go`, re-exported via `sdk/kit/remote_ref.go`),
            `IsRemoteCandyRef` / `StripVersion` (`sdk/deploykit/candy_ref.go`),
            `CompareSemver` / `GitLatestTag` / `RepoGitURL` (`spec/refs/git.go`), and the
            comment-preserving load/`yaml.Marshal` pattern from `sdk/kit/yaml.go`. Covered
            by `candy/plugin-box/reconcile_test.go` (newest-referenced alignment, comment preservation,
            idempotency, single-version-untouched, no-pins no-op).

            ## Cross-References

            - `/charly-internals:go` "Remote-layer resolver" — the warn-and-newest-wins resolver this aligns to.
            - `/charly-build:validate` — surfaces the multi-version warning reconcile clears.
            - `/charly-internals:git-workflow` — cross-repo (B6) producer→consumer landing that calls reconcile.
            - `/charly-build:migrate` — per-merge CalVer tags that reconcile pins point at.
            - `/charly-image:image` — `import:` / namespace authoring + the family overview.

            ## When to Use This Skill

            Invoke when the resolver warns that a layer is referenced at multiple versions,
            when aligning a consumer's pins to a freshly-tagged producer, or whenever you need
            the project's `@github` pins consistent for a zero-warnings R10.

secrets-skill:
    skill:
        name: secrets
        family: build
        owner: charly-build
        description: |-
            MUST be invoked before any work involving: charly secrets commands, Secret Service / config-file credential management, GPG-encrypted .secrets files, credential import/export, or secret administration.
        triggers:
            - "Secret management / `charly secrets` / Secret Service / GPG `.secrets`"
        content: |
            # Secrets - Secret Service & GPG Credential Management

            ## Overview

            `charly` has two distinct secret systems:

            1. **Credential store** (`charly secrets get/set/list/delete/import/export`) — keyed
               `service/key` credentials (VNC passwords, layer `secret_*` values) resolved
               from the **Secret Service** (system keyring) with a config-file plaintext
               fallback for headless hosts. Provisioned into Podman secrets at `charly config`
               time.
            2. **GPG `.secrets` files** (`charly secrets gpg …`) — project-level shell env vars
               in a GPG-encrypted `.secrets` file, decrypted by direnv on `cd`.

            > There is no direct KeePass `.kdbx` file backend. KeePassXC is fully
            > supported — but as a **Secret Service** provider (via its FdoSecrets
            > plugin), i.e. the keyring backend below, not a `.kdbx` file charly reads
            > directly. An existing `.kdbx` serves its secrets with zero data copy once
            > exposed through FdoSecrets. The obsolete `secret_backend: kdbx` /
            > `secrets_kdbx_*` config keys raise a hard load-time error pointing at
            > `charly migrate`.

            ## Credential Store Hierarchy

            Resolution order (first match wins):

            | Priority | Backend | When used |
            |----------|---------|-----------|
            | 1 | Environment variable | `CHARLY_VNC_PASSWORD`, etc. |
            | 2 | System keyring (Secret Service) | GNOME Keyring, KDE Wallet, KeePassXC (FdoSecrets) |
            | 3 | Config file | Plaintext fallback in `config.yml` (headless last-resort) |

            `secret_backend` ∈ {`auto` (default; keyring then config), `keyring`, `config`}.

            **Iteration-capable keyring read path:** when the system
            keyring backend is active, `charly`'s read path (`KeyringStore.Get` →
            `keyringGetViaSSClient` → `ssClient.findItemAnyCollection`) does NOT rely on
            the Secret Service `default` alias alone. It iterates all healthy collections,
            skipping any that return DBus errors on property reads. This makes charly
            resilient to broken `default` alias stubs (commonly seen in KeePassXC
            FdoSecrets setups) — credentials stored in a non-default collection are still
            findable. Set `keyring_collection_label` via `/charly-build:settings` to pin charly to a
            specific collection by label. When every candidate collection is locked
            (requires interactive unlock), `source=locked` is returned and
            `charly config mount` waits indefinitely via event-driven DBus signal
            subscription (zero CPU) until the user unlocks the keyring. See `/charly-automation:enc`
            for the full iteration order, source classification, event-driven waiting
            behavior, and troubleshooting.

            ## Quick Reference

            All commands below operate on the **active credential store** (Secret Service,
            or the config-file fallback) — never a `.kdbx` file.

            | Action | Command | Description |
            |--------|---------|-------------|
            | List entries | `charly secrets list [service]` | List credentials, optionally filter by service prefix |
            | Get value | `charly secrets get <service> <key>` | Print credential value |
            | Set value | `charly secrets set <service> <key> [value]` | Set credential (prompts if no value) |
            | Generate value | `charly secrets set <service> <key> --generate` | Generate 32-char hex random value |
            | Delete entry | `charly secrets delete <service> <key>` | Remove an entry |
            | Import | `charly secrets import [--dry-run]` | Copy config.yml + keyring credentials into the active store |
            | Export | `charly secrets export [--format yaml\|json]` | Export all entries (plaintext!) |

            ## Subcommand Details

            ### List

            ```bash
            charly secrets list              # All charly entries (keyring shadow index + config)
            charly secrets list charly/vnc       # Filter by service prefix
            ```

            Prints `service/key` pairs, one per line. The listing is the union of the
            keyring shadow index (`keyring_keys` in `config.yml`) and the config-file
            plaintext entries, so it reflects everything regardless of the active backend.

            ### Get / Set / Delete

            ```bash
            charly secrets get charly/vnc my-image              # Print value
            charly secrets set charly/vnc my-image              # Prompt for value securely
            charly secrets set charly/vnc my-image mypassword   # Set value inline
            charly secrets set charly/vnc my-image --generate   # Generate and print random value
            charly secrets delete charly/vnc my-image           # Remove entry
            ```

            `set`/`delete` operate on the active store (`DefaultCredentialStore()`); `get`
            reads the active store. The `--generate` flag produces 16 random bytes as a
            32-character hex string, printed to stdout.

            ### Import

            ```bash
            charly secrets import --dry-run    # Preview what would be imported
            charly secrets import              # Copy config.yml + keyring entries into the active store
            ```

            Collects credentials from:
            1. **Config file** — plaintext credentials in `config.yml`
            2. **System keyring** — entries tracked in `keyring_keys` config list

            Copies (does NOT clear the source) into the active store. This differs from
            `charly secrets migrate-secrets`, which *moves* config plaintext into the keyring
            and strips the plaintext copies.

            ### Export

            ```bash
            charly secrets export                  # YAML format (default)
            charly secrets export --format json    # JSON format
            ```

            **WARNING:** Exports plaintext credentials. Outputs nested map: `service -> key -> value`. Values are resolved through the active store (with config fallback).

            ## Common Workflows

            ### First-Time Setup

            A running Secret Service provider (GNOME Keyring, KDE Wallet, or KeePassXC with
            FdoSecrets enabled) is all that's needed — `secret_backend: auto` finds it. On a
            headless host with no Secret Service, charly falls back to the config-file store
            automatically.

            ```bash
            charly settings set secret_backend keyring   # (optional) force the keyring backend
            charly secrets set charly/secret MY_TOKEN xyz    # store a credential
            charly secrets get charly/secret MY_TOKEN        # read it back
            ```

            ### Credential-backed layer env vars (`secret_accept` / `secret_require`)

            A candy can declare credential-backed env vars in `charly.yml` via the
            `secret_accept:` / `secret_require:` sections. At `charly config` time, the
            declared values are resolved from the credential store, provisioned as
            per-image podman secrets, and injected into the container at runtime via
            `Secret=<name>,type=env,target=<var>` directives — **never landing in
            `charly.yml` or the generated quadlet as plaintext**. See `/charly-image:layer`
            (secret_accept / secret_require) for the authoring side.

            The credential store namespace for these entries defaults to `charly/secret`
            with the env var name as the key. Layer authors can override with an
            explicit `key: charly/api-key/openrouter` in charly.yml, which is useful when
            multiple consumers should resolve the same upstream credential (e.g.,
            openwebui and hermes both pointing at `charly/api-key/openrouter` so one
            `charly secrets set` populates both).

            **Storage commands:**

            ```bash
            # Default path (matches charly.yml `secret_accept: [{name: WEBUI_ADMIN_PASSWORD}]`)
            charly secrets set charly/secret WEBUI_ADMIN_PASSWORD <password>

            # Explicit key path (matches charly.yml `key: charly/api-key/openrouter`)
            charly secrets set charly/api-key openrouter sk-or-xxxxxxxx
            charly secrets set charly/api-key ollama gsk-yyyyyyyy
            charly secrets set charly/api-key immich <immich-key-from-web-ui>
            ```

            **Auto-generated `secret_require:` tokens.**
            `secret_require:` entries that miss everywhere (env + credential
            store) auto-generate a 32-byte hex token via `generateRandomHex(32)` +
            `DefaultCredentialStore.Set`, persisted at `charly/secret/<NAME>` (or the
            declared `key:` override). The first deploy that resolves the secret
            writes; every subsequent deploy reads the persisted value. Race-free
            across multi-layer declarations because `DefaultCredentialStore` caches
            via `sync.Once` — when k3s-server and k3s-agent both declare
            `K3S_CLUSTER_TOKEN`, whichever resolves first writes, and the other
            reads. No operator setup required for `charly update check-k3s-vm` to succeed
            on a fresh host.

            `secret_accept:` entries do NOT auto-generate (they're optional by
            contract; the caller falls back to `dep.Default` when missing). Only
            `secret_require:` triggers the auto-gen path.

            **Retrieve** an auto-generated value (e.g., to log into a service for
            the first time):

            ```bash
            charly secrets get charly/secret K3S_CLUSTER_TOKEN
            charly secrets get charly/secret WEBUI_ADMIN_PASSWORD
            ```

            **Override** a `secret_require:` value with a specific value before
            the first deploy:

            ```bash
            charly secrets set charly/secret K3S_CLUSTER_TOKEN <value>
            ```

            The auto-gen path is skipped whenever any non-empty value is already
            resolvable (env var, keyring, or config-file fallback).

            **Persistence venue.** When no keyring is available (headless
            first-boot, fresh CI runner), the auto-generated token lands in
            `~/.config/charly/config.yml` via `ConfigFileStore` (mode 0600).
            Operators on multi-user hosts should run a Secret Service provider
            (e.g. KeePassXC with FdoSecrets enabled) BEFORE the first deploy so
            subsequent secrets land in the keyring instead of the plaintext
            config file.

            **Rotation:** update the store and re-run `charly config`. The
            `RotateOnConfig` flag on credential-backed secrets bypasses the
            `podmanSecretExists` short-circuit, so the podman secret is re-created
            with the new value on every `charly config`:

            ```bash
            charly secrets set charly/api-key/openrouter <new-value>
            charly config openwebui --update-all
            systemctl --user restart charly-openwebui.service
            ```

            **One-shot `-e` import:** the `-e NAME=VAL` CLI flag on `charly config`
            auto-imports the value into the credential store when NAME matches a
            `secret_accept` / `secret_require` declaration on the target image. The
            plaintext is stripped from `c.Env` before it can reach `saveDeployState`
            or the quadlet writer. First-time setup:

            ```bash
            charly config openwebui -e WEBUI_ADMIN_PASSWORD=<password> -e OPENROUTER_API_KEY=sk-or-xxx
            ```

            Subsequent `charly config openwebui` resolves from the store without needing
            `-e` again.

            **Migration from legacy plaintext:** `charly config` automatically moves any
            `NAME=VAL` entry in `charly.yml` whose NAME is a `secret_accept` /
            `secret_require` declaration on the image into the credential store.
            The plaintext is stripped, `charly.yml.bak.<ts>` is written as a rollback
            point, and the migration logs each entry on stderr. Idempotent — safe to
            run on a clean host.

            **Distinction from layer-owned `secret:`:** the charly.yml `secret:`
            field (e.g., immich's `db-password`) creates per-image secrets that are
            auto-generated once at `charly config` time and never rotated. Credential-
            backed `secret_accept` / `secret_require` are user-owned, shareable
            across consumers, and refreshed on every `charly config`. Both flow through
            the same `Secret=<name>,type=env,target=<var>` quadlet emission; only the
            rotation semantics differ. See `/charly-image:layer` (secret_accept / secret_require).

            ## Config Keys

            | Key | Description |
            |-----|-------------|
            | `secret_backend` | Force backend: `auto` (default; keyring then config), `keyring`, or `config` |
            | `keyring_collection_label` | Preferred Secret Service collection label (empty = iterate naturally). Pin charly to a specific collection in multi-database setups. |

            ## Project-Level Secrets (.secrets + direnv)

            Separate from charly's credential store, project-level environment variables (e.g., `GMAIL_USER`, `GMAIL_PASSWORD`) are stored in `.secrets` — a GPG-encrypted file at the project root. direnv decrypts it in memory via `charly secrets gpg env` when entering the directory (`eval "$(charly secrets gpg env)"` in `.envrc`).

            **This is NOT managed by the `charly secrets` credential store.** The two systems serve different purposes:

            | System | What it manages | How it works |
            |--------|----------------|--------------|
            | `charly secrets` (Secret Service / config) | Container-level credentials (VNC passwords, service secrets) | Provisioned at `charly config` time into Podman secrets |
            | `charly secrets gpg` + direnv | Project-level shell env vars (API keys, credentials) | GPG-encrypted `.secrets` file, decrypted by direnv on `cd` |

            ## `charly secrets gpg` — GPG-Encrypted .secrets Management

            Manage GPG-encrypted `.secrets` environment files directly from the CLI. All commands shell out to `gpg` (must be in PATH).

            ### Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Show contents | `charly secrets gpg show [-f FILE]` | Decrypt and print to stdout |
            | Export for check | `charly secrets gpg env [-f FILE]` | Decrypt .secrets as `export KEY='value'` for check/direnv |
            | Edit in editor | `charly secrets gpg edit [-f FILE]` | Decrypt, open `$EDITOR`, re-encrypt |
            | Encrypt file | `charly secrets gpg encrypt -r KEY_ID [-i .env] [-o .secrets]` | Encrypt plaintext env file |
            | Decrypt file | `charly secrets gpg decrypt [-i .secrets] [-o FILE]` | Decrypt to file or stdout |
            | Set a key | `charly secrets gpg set KEY VALUE [-f FILE] [-r KEY_ID]` | Add or update KEY=VALUE |
            | Remove a key | `charly secrets gpg unset KEY [-f FILE]` | Remove a key from .secrets |
            | Add recipient | `charly secrets gpg add-recipient KEY_ID [-f FILE]` | Re-encrypt with additional recipient |
            | List recipients | `charly secrets gpg recipients [-f FILE]` | List GPG key IDs that can decrypt |
            | **Import key** | `charly secrets gpg import-key <path>` | Import GPG key from file, directory, or Secret Service |
            | **Export key** | `charly secrets gpg export-key [path] [--to-keystore]` | Export GPG key to directory and/or KeePassXC |
            | **Setup** | `charly secrets gpg setup` | Configure gpg-agent, import/generate key, store passphrase |
            | **Doctor** | `charly secrets gpg doctor [-f FILE]` | Health check: GPG agent, keys, Secret Service, .secrets |

            ### `charly secrets gpg env`

            Decrypt `.secrets` and output `export KEY='value'` lines to stdout. Designed for `eval` or direnv:

            ```bash
            eval "$(charly secrets gpg env)"              # Load secrets into current shell
            eval "$(charly secrets gpg env -f .secrets.prod)"  # Load from specific file
            ```

            **Behavior:**
            - Silent exit 0 if file doesn't exist (safe for `.envrc` — no error when `.secrets` is absent)
            - Parses KEY=VALUE format, skips comments and blank lines, strips surrounding quotes
            - Values are single-quoted in output (safe shell escaping via `shellQuote`)
            - Replaces the external `dotenv_gpg_if_exists` direnvrc function — no external dependency needed

            **Usage in `.envrc`:**
            ```bash
            eval "$(charly secrets gpg env)"
            ```

            ### Common Workflows

            ```bash
            # Create .secrets from a plaintext .env file
            charly secrets gpg encrypt -r 420DE2B3 -i .env -o .secrets
            rm .env

            # View contents
            charly secrets gpg show

            # Add a new secret
            charly secrets gpg set API_KEY sk-test-abc123

            # Edit in your editor
            charly secrets gpg edit

            # Remove a secret
            charly secrets gpg unset OLD_KEY

            # Add another person who can decrypt
            charly secrets gpg add-recipient THEIR_KEY_ID

            # See who can decrypt
            charly secrets gpg recipients
            ```

            ### Flags

            - `-f, --file` — Path to encrypted file (default: `.secrets` in current directory)
            - `-r, --recipient` — GPG key ID (repeatable, required for `encrypt`, optional for `set` on new files)
            - `-i, --input` — Input file for encrypt/decrypt (default: `.env` / `.secrets`)
            - `-o, --output` — Output file for encrypt/decrypt (default: `.secrets` / stdout)

            ### `charly secrets gpg import-key` — Import GPG Keys

            Import from file, directory, or KeePassXC Secret Service:

            ```bash
            charly secrets gpg import-key ~/Sync/Conf/gpg/           # From directory (all .asc/.gpg + ownertrust.txt)
            charly secrets gpg import-key ~/key.asc                   # From single file
            charly secrets gpg import-key --from-keystore              # From KeePassXC Secret Service
            charly secrets gpg import-key --from-keystore --key-id XX  # Specific key from KeePassXC
            charly secrets gpg import-key ~/keys/ --passphrase "xxx"   # With loopback pinentry (no GUI prompt)
            ```

            **Directory import** auto-detects `.asc`, `.gpg`, and `ownertrust.txt` files. **Keystore import** retrieves armored keys stored with schema `org.gnupg.Key` — these are created by `charly secrets gpg export-key --to-keystore`.

            The `--passphrase` flag uses GPG's loopback pinentry mode, avoiding the GUI prompt during import.

            ### `charly secrets gpg export-key` — Export GPG Keys

            Export to filesystem and/or KeePassXC:

            ```bash
            charly secrets gpg export-key ~/Sync/Conf/gpg/            # To directory (public.asc, secret.asc, ownertrust.txt)
            charly secrets gpg export-key --to-keystore                # To KeePassXC Secret Service
            charly secrets gpg export-key ~/backup/ --to-keystore      # Both filesystem and KeePassXC
            charly secrets gpg export-key --key-id XXXX --to-keystore  # Specific key
            charly secrets gpg export-key --to-keystore --passphrase X # Also store passphrase in Secret Service
            ```

            **Keystore export** stores the armored private key as a Secret Service entry (schema `org.gnupg.Key`, attributes: `keyid`, `uid`). This enables key recovery via `import-key --from-keystore` without filesystem backups.

            ### `charly secrets gpg setup` — One-Stop GPG Configuration

            Configures the full GPG/KeePassXC chain in one command:

            ```bash
            charly secrets gpg setup                                   # Interactive
            charly secrets gpg setup --import ~/Sync/Conf/gpg/         # Import key, then configure
            charly secrets gpg setup --from-keystore                    # Restore key from KeePassXC
            charly secrets gpg setup --passphrase "xxx"                 # Batch mode (no prompts)
            ```

            **Steps performed:**
            1. Check prerequisites: `gpg`, `gpg-connect-agent`, `pinentry-qt` (libsecret), `secret-tool`
            2. Install `~/.gnupg/gpg-agent.conf` (pinentry-qt, 8h cache, allow-preset-passphrase)
            3. Enable systemd socket activation (`gpg-agent.socket`, `gpg-agent-extra.socket`)
            4. Restart gpg-agent
            5. Import or generate GPG key (RSA-4096, 2-year expiry, git config for name/email)
            6. Store passphrase in Secret Service for ALL keygrips (primary + subkeys)
            7. Verify encrypt/decrypt round-trip

            **Flags:**
            - `--import <path>` — Import key from file/directory before setup
            - `--from-keystore` — Import key from KeePassXC before setup
            - `--passphrase <value>` — Batch mode: generate key + store passphrase without prompts
            - `--key-id <id>` — Use specific existing key
            - `--skip-secret-service` — Skip passphrase storage in Secret Service

            ### `charly secrets gpg doctor` — Health Check

            Read-only diagnostic of the full GPG/direnv chain:

            ```bash
            charly secrets gpg doctor                    # Check everything
            charly secrets gpg doctor -f .secrets.prod   # Check specific file
            ```

            **Checks:** gpg binary, gpg-agent status, gpg-agent.conf (pinentry, cache TTL), systemd sockets, secret keys, Secret Service availability, passphrase storage for each keygrip, key backups in Secret Service, .secrets file recipients and decrypt test.

            Returns non-zero exit code if any critical issue found.

            ## GPG/KeePassXC Integration Architecture

            ### Passphrase Flow (pinentry-qt ↔ KeePassXC)

            ```
            gpg --decrypt .secrets
              → gpg-agent (needs passphrase for subkey keygrip)
                → spawns pinentry-qt
                  → pinentry-qt: secret_password_lookup_nonpageable_sync()
                    schema: "org.gnupg.Passphrase", attr: keygrip="<40-char-hex>"
                  → KeePassXC returns stored passphrase (if found) → no GUI prompt
                  → OR: pinentry-qt shows GUI dialog → user enters passphrase
                → gpg-agent caches passphrase (8h default, 12h max)
              → decryption succeeds
            ```

            **Key facts:**
            - pinentry-qt links against libsecret and queries KeePassXC via `org.freedesktop.secrets` D-Bus API
            - Passphrase lookup uses schema `org.gnupg.Passphrase` with attribute `keygrip`
            - Each GPG key has multiple keygrips (one per key/subkey) — passphrases must be stored for ALL keygrips
            - `charly secrets gpg setup` stores passphrases for all keygrips automatically
            - gpg-agent's in-memory cache (8h/12h) reduces Secret Service lookups

            ### Key Storage in KeePassXC

            Two Secret Service schemas:
            - **`org.gnupg.Passphrase`** — passphrase per keygrip (compatible with pinentry-qt auto-lookup)
            - **`org.gnupg.Key`** — armored private key backup (for `import-key --from-keystore` recovery)

            Both are standard Secret Service entries visible in KeePassXC's FdoSecrets-exposed group.

            ### Error Diagnostics

            When decryption fails, `charly secrets gpg` now prints actionable diagnostics instead of raw GPG errors:
            - Which key ID the file is encrypted for
            - Whether the key exists in the local keyring
            - Whether the key is backed up in Secret Service (with restore command)
            - Agent status, config status, Secret Service availability
            - Specific `charly secrets gpg` commands to fix each issue

            ## Key Management Workflows

            ### First-Time Setup (New Machine)

            ```bash
            # Option A: Import existing key from backup
            charly secrets gpg setup --import ~/Sync/Conf/gpg/

            # Option B: Restore from KeePassXC (if key was previously exported)
            charly secrets gpg setup --from-keystore

            # Option C: Generate fresh key
            charly secrets gpg setup
            # Then re-encrypt .secrets: charly secrets gpg encrypt -r <NEW_KEY_ID> -i .env -o .secrets
            ```

            ### Backup Key to KeePassXC

            ```bash
            charly secrets gpg export-key --to-keystore              # Key backup
            charly secrets gpg export-key ~/Sync/Conf/gpg/           # Filesystem backup too
            ```

            ### Restore Key on New Machine

            ```bash
            charly secrets gpg import-key --from-keystore            # From KeePassXC
            charly secrets gpg setup                                 # Configure agent + store passphrase
            ```

            ### Troubleshooting

            | Symptom | Cause | Fix |
            |---------|-------|-----|
            | `gpg: No secret key` | Key not in keyring | `charly secrets gpg import-key <path>` |
            | Constant passphrase prompts | Passphrase not in Secret Service | `charly secrets gpg setup` (stores for all keygrips) |
            | `decrypting .secrets failed` | Diagnostics printed automatically | Follow suggested `charly secrets gpg` commands |
            | `no Secret Service on D-Bus` | KeePassXC not running/unlocked | Start KeePassXC, unlock database |
            | `Secret Service not available — pinentry-qt will prompt` | same cause, but only a warning during `setup` | Optional: start KeePassXC to avoid the prompt |
            | `secret-tool store` fails | No FdoSecrets exposed group | KeePassXC → right-click group → "Mark as Secret Service exposed" |
            | Passphrase stored but still prompted | Stored for wrong keygrip | `charly secrets gpg doctor` shows which keygrips need passphrases |

            ### Using .secrets Inside Containers

            For GPG agent forwarding into containers (so `gpg --decrypt` works inside), use the `agent-forwarding` layer. See `/charly-distros:agent-forwarding` for details. The container's GPG uses the host's agent via a forwarded socket — no GPG agent runs inside the container.

            ## Cross-References

            - `/charly-core:charly-config` — `secret_backend` and other settings keys
            - `/charly-automation:enc` — encrypted volume credential lookup, iteration-capable ssClient, broken-collection troubleshooting, source classification (`env`/`keyring`/`config`/`locked`/`unavailable`/`default`)
            - `/charly-build:settings` — `keyring_collection_label`, `secret_backend`, and other runtime config keys
            - `/charly-core:charly-doctor` — Secret Service collection health + shadow index consistency checks
            - `/charly-core:service` — container secrets (`secrets` field in charly.yml, provisioned at `charly config`)
            - `/charly-distros:agent-forwarding` — SSH/GPG agent forwarding into containers
            - `/charly-infrastructure:gnupg` — GnuPG package layer
            - `/charly-openwebui:openwebui` — two-tier secrets pattern: podman secrets (`WEBUI_SECRET_KEY` auto-generated) + GPG `.secrets` (API keys)
            - `/charly-coder:direnv` — direnv environment loader

            ## Source

            The credential store + the `charly secrets` CLI are EXTERNALIZED into the out-of-process
            `candy/plugin-secrets` plugin (the C2 dep-shed that removed `go-keyring` from
            `charly/go.mod`): `candy/plugin-secrets/command.go` (the `charly secrets` CLI: list/get/set/
            delete/import/export/migrate-secrets), `candy/plugin-secrets/secrets_gpg.go` (GPG `.secrets`
            commands + key management + diagnostics), `candy/plugin-secrets/{store,config_store,
            credential_keyring,credential_config,secret_service,verb_credential,credential_admin}.go`
            (the `verb:credential` backends + the env-less resolve + the doctor health probe). charly's
            core keeps only the thin adapter `charly/credential_plugin.go` (`ResolveCredential` /
            `DefaultCredentialStore` → the `credentialResolver` interface → `verb:credential`; the former
            `CredentialStore` interface + Get/Set/Delete/List/Name/awaitUnlock were DELETED at K-wave 2
            cone CONTESTED, zero production callers) + `candy/plugin-fleet/secrets_artifacts.go` + `candy/plugin-deploy-pod/secrets_resolve.go` (podman-secret provisioning — the former `charly/secrets.go` is DELETED, K-wave 2). On an
            installed host the plugin lives beside charly at `/usr/lib/charly/plugins` (every native
            package build — the distro repos' packaging workflows — bakes the binary + its `.providers`
            manifest, off the shared `scripts/host-command-plugins.txt` set).

            ## When to Use This Skill

            **MUST be invoked** when the task involves `charly secrets` commands, Secret Service / config-file credential management, GPG-encrypted `.secrets` file management, GPG key management, Secret Service integration, or credential import/export. Invoke this skill BEFORE reading source code or launching Explore agents.

settings-skill:
    skill:
        name: settings
        family: build
        owner: charly-build
        description: |-
            Runtime configuration management for the charly CLI.
            MUST be invoked before any work involving: charly settings commands, runtime configuration, engine selection, bind address, storage paths, or secret backend configuration.
        content: |
            # charly settings -- Runtime Configuration

            ## Overview

            Manage charly's runtime configuration stored in `~/.config/charly/config.yml`. Controls engine selection, networking, storage paths, secret backend, and agent forwarding.

            `charly settings` is a **compiled-in COMMAND-class plugin** (`candy/plugin-settings`, `command:settings`) that OWNS the command AND the config subsystem: the get/set/list/reset/path subcommand grammar + output formatting live in `candy/plugin-settings/{command.go,provider.go,plugin.go}`, and the runtime-config file I/O lives in `candy/plugin-settings/config.go` — `GetConfigValue` / `SetConfigValue` / `ListConfigValues` / `ResetConfigValue` / `resolveSettingsGet`, over `spec/hostenv.RuntimeConfigPath()` for `~/.config/charly/config.yml` (the former `charly/runtime_config.go` is DELETED, K-wave 2). `resolveSettingsGet` resolves the `get` special-cases in-package: `engine.*` via `ResolveRuntime`, and `secret_backend` / `vnc.password.*` via `InvokeProvider(verb:credential)` — there is no `"settings"` HostBuild seam (the former `charly/host_build_settings.go` is DELETED, K-wave 2). `settings` is compiled into the `charly` binary (`charly/charly.yml` `compiled_plugins:`) so its `Invoke(OpRun)` can serve `verb:credential` over the in-proc reverse channel; the out-of-process path has no reverse channel and errors. There is no hidden core-command forward.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Get a setting | `charly settings get <key>` | Show current value |
            | Set a setting | `charly settings set <key> <value>` | Update a setting |
            | List all | `charly settings list` | Show all settings with values |
            | Reset to default | `charly settings reset <key>` | Remove override, use default |
            | Config path | `charly settings path` | Print path to config.yml |
            | Migrate secrets | `charly secrets migrate-secrets [--dry-run]` | Move plaintext credentials to keyring (externalized to candy/plugin-secrets) |

            ## Key Settings

            | Key | Default | Env Var | Description |
            |-----|---------|---------|-------------|
            | `engine.build` | `docker` | `CHARLY_ENGINE_BUILD` | Build engine (docker/podman) |
            | `engine.run` | `docker` | `CHARLY_ENGINE_RUN` | Run engine (docker/podman) |
            | `run_mode` | `quadlet` | `CHARLY_RUN_MODE` | Deployment mode (quadlet/direct) |
            | `bind_address` | `127.0.0.1` | `CHARLY_BIND_ADDRESS` | Default bind address for ports |
            | `encrypted_storage_path` | `~/.local/share/charly/encrypted` | `CHARLY_ENCRYPTED_STORAGE_PATH` | Base path for gocryptfs volumes |
            | `volumes_path` | `~/.local/share/charly/volumes` | `CHARLY_VOLUMES_PATH` | Base path for bind-mounted volumes |
            | `secret_backend` | `auto` | `CHARLY_SECRET_BACKEND` | Credential backend (auto/keyring/config) |
            | `keyring_collection_label` | *(empty)* | `CHARLY_KEYRING_COLLECTION_LABEL` | Preferred Secret Service collection label. Empty = iterate naturally (default alias → listing order). Set to pin charly to a specific collection in multi-database setups (e.g. KeePassXC with multiple open databases). See `/charly-automation:enc` for the full iteration order. |
            | `forward_gpg_agent` | `true` | `CHARLY_FORWARD_GPG_AGENT` | Forward GPG agent into containers |
            | `forward_ssh_agent` | `true` | `CHARLY_FORWARD_SSH_AGENT` | Forward SSH agent into containers |
            | `hosts.<alias>` | *(none)* | — | SSH target for `charly --host <alias>` remote execution. Free-form: `host`, `user@host`, `user@host:port`. Consulted by the top-level `--host` flag to re-exec `charly` commands on another machine over SSH. See `/charly-core:ssh`. |

            ## Usage

            ### Engine Selection

            ```bash
            # Switch to podman for both build and run
            charly settings set engine.build podman
            charly settings set engine.run podman

            # Check current engine
            charly settings get engine.build
            ```

            ### Storage Paths

            ```bash
            # Change volume storage to NAS
            charly settings set volumes_path /mnt/nas/charly-volumes

            # Change encrypted storage location
            charly settings set encrypted_storage_path /mnt/encrypted/charly
            ```

            ### Secret Backend

            ```bash
            # Force the Secret Service keyring backend (incl. KeePassXC via FdoSecrets)
            charly settings set secret_backend keyring

            # Force the config-file plaintext fallback (headless hosts)
            charly settings set secret_backend config

            # Migrate plaintext secrets from config.yml to the keyring (the credential
            # store + secrets CLI are externalized into candy/plugin-secrets)
            charly secrets migrate-secrets

            # Preview migration without changes
            charly secrets migrate-secrets --dry-run
            ```

            ### Resolution Chain

            Settings resolve in this order: environment variable > config.yml > default value.

            ## Cross-References

            - `/charly-core:charly-config` -- deployment configuration (uses settings)
            - `/charly-build:secrets` -- credential management
            - `/charly-core:charly-doctor` -- diagnose settings and secret storage health
            - `/charly-automation:enc` -- encrypted volume paths

validate-skill:
    skill:
        name: validate
        family: build
        owner: charly-build
        description: |-
            MUST be invoked before any work involving: charly box validate command, validation rules, common validation errors, or checking charly.yml and layer definitions.
        triggers:
            - "`charly box validate` / schema error"
        content: |
            # charly box validate -- Validation Commands

            Invoked as `charly box validate`. See `/charly-image:image` for the family overview.

            ## Overview

            `charly box validate` checks `charly.yml` and all layer definitions for errors. Validation collects all errors at once rather than failing on the first.

            The param schema these rules enforce is **CUE-single-source**: the `@go()`-annotated `spec/schema/*.cue` defs are the sole source for both the Go param structs (generated into `spec/spec` by `task cue:gen`) and the load-time validation, so changing a validated field is a CUE edit → `task cue:gen` → see the `/charly-internals:go` recipe "How to change the charly.yml schema (CUE is the single source of truth)". The authoring surface is **node-form only** (name-first `<name>: {<kind>: …}`); a legacy kind-keyed document is rejected at load with a `charly migrate` hint.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Validate all | `charly box validate` | Check charly.yml + all layers (enabled images only) |
            | Validate disabled too | `charly box validate --include-disabled` | Extend the validation pass to images marked `enabled: false` (does not modify charly.yml) |
            | Check version | `charly version` | Verify CalVer computation |
            | Inspect image | `charly box inspect <image>` | Show resolved config |

            ## Exit Codes

            | Code | Meaning |
            |------|---------|
            | 0 | Validation passed |
            | 1 | Validation or user error |
            | 2 | Internal error |

            ## Validation Rules

            ### Layer Rules

            - Layer directory must contain at least one install source — `charly.yml` with a non-empty `plan:` (carrying `run:` steps) or a `rpm:` / `deb:` / `pac:` / `aur:` packages section; an auto-detected builder manifest (`pixi.toml`, `pyproject.toml`, `environment.yml`, `package.json`, `Cargo.toml`); an `external_builder:` selection (the candy's content is the multi-stage build its selected external builder plugin bakes — see `/charly-image:layer`); a `plugin:` block; or a `candy:` composition field (pure composition layers are valid).
            - **ADE is MANDATORY per candy:** every **local** candy MUST carry a non-empty `description:` string AND a `plan:` with at least one deterministic `check:` step (enforced by `validateCandyContents`; a hard error names the missing field). A fetched **remote** candy is exempt — its compliance is its own repo's concern, same scope as the mandatory `version:` rule. See `/charly-check:check`.
            - `depends` must reference existing layers (local or remote).
            - Circular dependencies are errors.
            - `volumes` names must match `^[a-z0-9]+(-[a-z0-9]+)*$`.
            - Volume names must be unique within a candy.
            - `aliases` in charly.yml require both `name` and `command`.
            - Alias names must match `^[a-zA-Z0-9][a-zA-Z0-9._-]*$`.
            - Setting `PATH` directly in `env` is an error (use `path_append`).
            - Only one pixi manifest per layer (`pixi.toml`, `pyproject.toml`, or `environment.yml`).

            ### `run:` Step Rules

            A `run:` step carries the deterministic state-change op inline (the same verb
            catalog the legacy `task:` map used). See `/charly-image:layer` for the full
            verb catalog. The validator enforces:

            - **Exactly one op verb per `run:` step.** A `run:` step must carry exactly one of `cmd` / `mkdir` / `copy` / `write` / `link` / `download` / `setcap` / `build`. Zero op verbs → the step has no action; more than one → conflicting actions.
            - **Per-verb required modifiers:**
              - `copy` → `to:` (destination) required; `copy:` value must be relative to the layer directory, no `..` traversal
              - `write` → `content:` required (non-empty)
              - `link` → `target:` required (what the symlink points to)
              - `download` → `to:` required unless `extract: sh` (piped install scripts)
              - `setcap` with non-empty `caps:` → caps pattern check (`cap_name=flags[,cap_name=flags]`)
            - **Path rules:** paths must be absolute, `~/`-prefixed, or `${HOME}`-prefixed. `copy:` source must exist under the layer directory at generate time.
            - **Mode rules:** `mode:` must match `^0[0-7]{3,4}$` (octal) if present.
            - **Download extract values:** must be one of `tar.gz` / `tar.xz` / `tar.zst` / `zip` / `none` / `sh` or empty.
            - **`cache:` rules:** only valid on `cmd:` / `download:` `run:` steps; each path must be absolute (or `~/` / `${HOME}`-prefixed). Declares extra BuildKit cache mounts (owned per the step `run_as:`).
            - **`build:` value:** must be `"all"` (initial implementation; specific builder names reserved for future use).
            - **`run_as:` format:** must be `root`, `${USER}`, a literal name matching `^[a-z_][a-z0-9_-]*$`, or numeric `<uid>:<gid>`. Unresolved `${VAR}` in `run_as:` errors.

            ### `var:` Rules

            - Keys must match `^[A-Z_][A-Z0-9_]*$` (shell identifier).
            - Keys may not collide with reserved auto-exports (`USER`, `UID`, `GID`, `HOME`, `ARCH`, `BUILD_ARCH`).
            - Keys may not collide with the same layer's `env:` keys.

            ### `${VAR}` Reference Resolution

            - In non-shell fields (paths, URLs, `to`, `target`, etc.), every `${NAME}` reference must resolve against `var:` ∪ auto-exports. Unresolved references error at validate time.
            - In shell fields (`cmd:` values, `write: content:`), references are passed through verbatim and resolved by bash at build time.

            ### Image Rules

            - `base` must reference a valid external image or another image in charly.yml
            - `layers` field is required
            - `builder` must reference an existing image
            - Self-referencing builder is allowed (skipped by generator)
            - `bootc: true` requires appropriate base image
            - Duplicate alias names within an image are errors
            - Box-level alias `command` defaults to `name` if omitted
            - `env` accepts list of `KEY=VALUE` strings (runtime only)
            - `env_file` accepts a path string (validated at runtime)
            - `security` at image level overrides layer-level security (not an error)

            ### Bind Mount Rules

            - `name` and `path` required, name must match volume name regex
            - No duplicate names within an image
            - Encrypted: `host` must be empty; Plain: `host` required
            - Names matching layer volume names override the volume (note, not error)
            - Warning if `gocryptfs` not in PATH when encrypted mounts exist

            ### Tunnel Rules

            - Tailscale serve (tailnet-only): any port works for HTTPS
            - Tailscale funnel (public): HTTPS port must be 443, 8443, or 10000
            - Cloudflare: `fqdn` required

            ### VM / Bootc Rules

            - `bootc: true` requires appropriate base image
            - `vm.rootfs` must be `ext4`, `xfs`, or `btrfs`
            - `vm.backend` must be `auto`, `libvirt`, or `qemu`

            ### Port Relay Rules

            - Each relay port must be 1-65535
            - Each relay port must also be declared in the layer's `port:`
            - No duplicate relay ports across layers in the same image

            ### Tunnel Multi-Port Rules

            - `ports` must be `"all"` or omitted
            - When `ports: all`, the image must have at least one port defined
            - Multi-port mode skips single-port HTTPS validation

            ### Port Protocol Rules

            - Only `tcp:` prefix is supported
            - Port number after prefix must be 1-65535

            ### Remote Layer Rules

            - Two remote repos exporting the same layer name is an error
            - Local layers shadow remote layers with same name (note emitted)
            - A layer (bare `@github` ref) referenced via two different git tags is **not**
              an error — the git tag is only the FETCH coordinate. The resolver reads each
              fetched layer's OWN `version:` and dedups by it: same per-entity version → no
              warning (a re-tag of an unchanged layer is silent); different per-entity
              versions → warns once and resolves to the **newest** (highest CalVer). Run
              `charly box reconcile` to align the pins and clear any warning. A fetched layer
              with no `version:` IS a hard error (the layer kind requires one).
            - Different layers from the same repo can use different versions
            - Collection is reachability-scoped: only layers reachable from the enabled
              images' `base:`/`builder:` chains are fetched. See `/charly-internals:go`
              "Remote-layer resolver" and `/charly-build:reconcile`.

            ## Common Validation Errors

            ### "circular dependency"

            Layers form a dependency cycle. Check `depends` fields.

            ### "layer X not found"

            A `depends` entry or `charly.yml` layer references a non-existent layer.

            ### "PATH must not be set directly"

            Use `path_append` in charly.yml instead of `env: PATH: ...`.

            ### "duplicate volume name"

            Volume names must be unique within a candy.

            ## Common Workflows

            ### Validate Before Building

            ```bash
            charly box validate && charly box build my-image
            ```

            ### Debug Validation Errors

            ```bash
            charly box validate 2>&1                     # See all errors at once
            charly box inspect <image>                   # Check resolved config
            charly box list candies                       # Verify layer exists
            ```

            ## Project directory override

            `charly box validate` resolves `charly.yml` via `os.Getwd()`. Override with `-C <dir>` / `--dir <dir>` / `CHARLY_PROJECT_DIR=<dir>`. See `/charly-image:image` "Project directory resolution".

            ## Cross-References

            ### `charly box` family siblings

            - `/charly-image:image` -- Family overview + charly.yml composition reference
            - `/charly-build:build` -- Building validated images
            - `/charly-build:generate` -- Containerfile generation after validation
            - `/charly-build:inspect` -- Inspect a specific image after validation
            - `/charly-build:list` -- Enumerate images/layers to validate
            - `/charly-build:merge` -- Post-build layer consolidation
            - `/charly-build:new` -- Scaffold new candies before validation
            - `/charly-build:pull` -- Pull prebuilt images (orthogonal to validation)

            ### Related skills

            - `/charly-image:layer` — **Canonical reference** for the `run:`/`check:` step verb catalog, `var:` substitution, YAML anchors, execution order. The validator rules above enforce what's documented there.
            - `/charly-build:generate` — What the generator emits from validated input (per-verb emitters, cache-mount inheritance, inline-content staging).
            - `/charly-internals:generate-source` — Internal architecture of the run-step emission pipeline.
            - `/charly-internals:egress` — the **egress** counterpart: `charly box validate` proves the INPUT config; `/charly-internals:egress` validates the config files charly WRITES to a system (cloud-init, kubernetes, units, ssh_config, libvirt XML) before the bytes hit disk.
            - `/charly-check:check` — `charly box validate` schema-checks every `check:` entry: exactly-one-verb, attribute types, scope/variable consistency (build-scope can't reference runtime-only vars), `id:` uniqueness per section, matcher operator allowlist, unroutable-check rejection. The live-container verbs (`cdp`/`wl`/`dbus`/`vnc`/`mcp`/`record`/`kube`/`adb`/`appium`/`spice`/`libvirt`) are out-of-process plugins: their method-name enum is enforced by CUE on core `#Op` (an unknown method is rejected with the allowed set listed) and their required-modifier checks run in the plugin at dispatch (deploy-scope-only).
            - `/charly-build:charly-mcp-cmd` — the standalone reference for the `mcp:` verb: required modifiers (`tool:` for `call`, `uri:` for `read`), the 7-method allowlist, and the URL-rewrite / port-publishing behavior that authors occasionally hit.
            - `/charly-check:cdp`, `/charly-check:wl`, `/charly-check:dbus`, `/charly-check:vnc` — per-verb references for the other four live-container verbs.

            ## Cross-kind name reuse across files — permitted; same-document collision — rejected

            The unified form is **name-first**: every entity flattens to a top-level `<name>:` key whose first child is its kind discriminator (`candy:` / `pod:` / `vm:` / `kubernetes:` / `local:` / `android:` / `group:` / …). There is no `box:` KIND — both images and layers are `candy:` nodes (an image carries `base:`/`from:`, a layer carries neither). Two consequences for `charly box validate`:

            - **Cross-FILE name reuse is fine.** The same name MAY exist simultaneously in SEPARATE discovered files — a layer `candy/redis/charly.yml` (a `candy:` node with no `base:`/`from:`) and an image `box/redis/charly.yml` (a `candy:` node carrying `base:`/`from:`) resolve to distinct internal maps (`uf.Candy` vs `uf.Box`, routed by `base:`/`from:` presence), and the validator does NOT flag them. Verbs disambiguate by command context (`ResolveDeployRef` is image-first; `--add-candy <name>` selects the layer-first path).
            - **Same-document collision IS rejected.** Two top-level entities WITHIN one document (e.g. the root `charly.yml` carrying a `pod` + a `vm` + a `local`) MUST NOT share a name — they would collide on one YAML key. `charly box validate` flags the collision; rename one (the convention: keep the user-facing deploy, suffix the template it deploys — a `check-local` deploy + a `check-local-app` local template).

            The loader still raises hard load-time errors on obsolete keys — the obsolete `qc` / `cachyos-dx` deployment names, and any obsolete `kind: deployment` doc or root-key `deployment:` (the deploy kind is now the name-first substrate kind: `pod:` / `vm:` / `kubernetes:` / `local:` / `android:` / `group:`). Every such error points at `charly migrate`. See the project rulebook (`AGENTS.md` / `CLAUDE.md`) and `/charly-build:migrate`.

            ## When to Use This Skill

            **MUST be invoked** when the task involves charly box validate command, validation rules, common validation errors, or checking charly.yml and layer definitions. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Pre-build. Validate before building to catch errors early.


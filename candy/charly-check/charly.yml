charly-check:
    candy:
        version: 2026.218.1200
        description: |-
            Concept candy owning the charly-check evaluation skills (check orchestration + the probe verbs). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the check concept candy's skill entities are present and generated into plugins/check/skills
              id: charly-check-present
              context:
                - build
              command: "true"

adb-skill:
    skill:
        name: adb
        family: check
        owner: charly-check
        description: |-
            MUST be invoked before any work involving: the `adb:` check verb (declarative, dispatched to the out-of-process plugin candy/plugin-adb), Android Debug Bridge interaction, APK install/uninstall, device shell command execution, system property reads, screencap, logcat tailing — anywhere the goal is to drive a running Android emulator from outside the container via the host-published ADB server port.
        triggers:
            - "the `adb:` check verb / Android Debug Bridge probing from a candy/box plan (out-of-process plugin; devices, shell, install, getprop, screencap, logcat, wait-for-device)"
        content: |
            # ADB — Android Debug Bridge

            ## Overview

            `adb:` is a DECLARATIVE check verb — authored as `adb: <method>` inside a
            candy/box plan `check:`/`run:` step. It is NOT a host CLI command: there is no
            `charly check adb`. The verb's implementation and its goadb ADB-wire dependency
            were dep-shed into the out-of-tree `candy/plugin-adb` plugin module; at check
            time the host dispatches `adb:` through the provider registry to that
            out-of-process plugin (the same path a bed's checks take via `charly check
            live` / `charly check run`).

            The plugin drives a host-side ADB client: it connects to the running
            container's host-published ADB server port (container `:5037` → host's
            `HOST_PORT:5037`, e.g. `35002` on the `check-android-emulator-pod` deploy)
            using `github.com/zach-klippenstein/goadb` and dispatches operations against
            the emulator backing that server.

            A host-side protocol client, no container-side helper, working against any
            deploy that publishes the adb-server port — pod / vm / host / nested all work
            transparently because the connection is plain TCP to `127.0.0.1:<host-port>`
            and the portforward / passt / etc. layer handles the rest.

            ### Authoring the `adb:` verb in a plan step

            The verb is one inline Op carried by a step — an ordered list item under the
            candy/box `plan:` (a probe is a `check:` step; an adb action that changes device
            state is a `run:` step). The method name is the scalar value for a bare-method step
            (`adb: devices`), or the `method:` key of the `adb:` map when the step carries
            adb-exclusive fields (`arg:`, `apk:`, `property:`, `key:`, `query:`, `amount:`,
            `artifact:` and the artifact validators) — those live INSIDE the `adb:` map. Only
            the shared matchers (`stdout:`, `stderr:`, `exit_status:`) and `context:`/`id:`/
            `timeout:` stay siblings.
            **`context: [deploy]` only** — needs a running container with a
            host-mapped ADB server port; the validator rejects `context: [build]`
            use at `charly box validate` time.

            Example — each step is an ordered list item under the candy/box `plan:` (mirror
            `candy/android-emulator-layer/charly.yml`):

            ```yaml
            - check: the emulator is attached to the adb server
              id: emulator-is-up
              adb: devices
              context: [deploy]
              stdout:
                - contains: "emulator-5554"
            - check: the emulator reports boot completed
              id: boot-done
              adb:
                method: getprop
                property: sys.boot_completed
              context: [deploy]
              stdout:
                - contains: "1"
              timeout: 300s
            ```

            See `/charly-check:check` for the full per-verb schema notes; this skill is the
            adb-specific method reference.

            ## Quick Reference

            These are the `adb:` declarative-verb methods (NOT host CLI commands — there is
            no `charly check adb`). The method name is the scalar `adb:` value for a bare-method
            step; when a step carries modifiers those go INSIDE the `adb:` map (`adb: {method:
            shell, arg: […]}`), and only `stdout:`/`stderr:`/`exit_status:` and
            `context:`/`id:`/`timeout:` stay siblings.

            | Method | Declarative form | Required map field | Description |
            |---|---|---|---|
            | `devices` | `adb: devices` | — | List devices/emulators with state |
            | `shell` | `adb: {method: shell, arg: [...]}` | `arg:` (list) | Run a shell command on the emulator |
            | `install` | `adb: {method: install, apk: …}` | `apk:` | Install an APK from the host filesystem |
            | `uninstall` | `adb: {method: uninstall, arg: [pkgid]}` | `arg: [pkgid]` | Remove a package by id |
            | `getprop` | `adb: {method: getprop, property: …}` | `property:` | Read a system property |
            | `screencap` | `adb: {method: screencap, artifact: …}` | `artifact:` | Capture a PNG screenshot to a host file |
            | `logcat-tail` | `adb: {method: logcat-tail, …}` (+ `amount:` / `query:`) | — | Dump recent logcat lines (uses `logcat -d`) |
            | `wait-for-device` | `adb: wait-for-device` (+ sibling `timeout:`) | — | Block until `sys.boot_completed=1` |
            | `wait-ui-settled` | `adb: wait-ui-settled` (+ sibling `timeout:`) | — | Block until the foreground is not an ANR dialog (dismissing via HOME) |
            | `current-focus` | `adb: current-focus` | — | Print the foreground window line (`mCurrentFocus`) |
            | `keyevent` | `adb: {method: keyevent, key: …}` | `key:` | Send a key event (`input keyevent KEYCODE_…`) |

            `serial:` selects a specific device (default `emulator-5554`). For a
            `<base>/<instance>` pod deploy the instance is addressed by the enclosing bed
            (or the `-i` flag on `charly check live` / `charly check run`).

            ## Method allowlist + required modifiers

            | Method | Required map field | Notes |
            |---|---|---|
            | `devices` | — | Output is one line per device: `<serial>\t<state>` |
            | `shell` | `arg:` | `arg[0]` is the program; `arg[1:]` are positional args. Prefix `--` is auto-added so flags don't leak into the outer Kong invocation. |
            | `install` | `apk:` | Pushes the APK via the sync protocol to `/data/local/tmp/`, then `pm install -r`. Best-effort cleanup of the staged file. Asserts `Success` in pm output. |
            | `uninstall` | `arg:` | `arg[0]` = package id (e.g. `com.example.android.apis`). Same `arg[0]` convention as `shell` to keep the modifier surface flat. |
            | `getprop` | `property:` | Property key like `sys.boot_completed`, `ro.build.version.release`. |
            | `screencap` | `artifact:` | Runs `screencap -p \| base64` on the device, decodes host-side, writes to `artifact:`. The `base64` round-trip is mandatory — raw binary stdout gets mangled by goadb's shell stream on some emulator builds. Pairs with `artifact_min_bytes:` for size assertion. |
            | `logcat-tail` | — | Uses `logcat -d` (dump-and-exit). `amount:` trims to the last N lines host-side; `query:` is the literal filter spec (e.g. `MyApp:I *:S`). |
            | `wait-for-device` | — | Polls `getprop sys.boot_completed` every 2s up to `timeout:` (default 60s). Lighter than the wire-protocol `wait-for-device` because that returns the moment the device ATTACHES (well before sys.boot_completed). |
            | `wait-ui-settled` | — | Polls `mCurrentFocus` (`dumpsys window`); while a system "Application Not Responding" dialog holds focus it dismisses it with `KEYCODE_HOME` and keeps polling, up to `timeout:`. Prints `settled` on success. **Set `timeout:` generously** (the android-emulator gate uses 600s) — the shared 30s default is too short for a churning emulator. Pure goadb — no in-container shell. |
            | `current-focus` | — | Prints the `mCurrentFocus` window line. Assert the foreground app (`stdout: contains: io.appium.android.apis`) or detect a stuck ANR dialog. |
            | `keyevent` | `key:` | `input keyevent <key>` via `key: KEYCODE_HOME` / `KEYCODE_BACK` / a numeric code. Generic input building block; `wait-ui-settled` uses the same call internally to dismiss dialogs. |

            ## Authoring gotchas

            ### `apk:` must be a host-side path

            The host `charly` binary reads the APK from its own filesystem and pushes
            via the sync protocol — `apk:` is a path on the host running `charly`, NOT
            a container-internal path. (Compare with `appium: install-app` where
            `apk:` is the in-container Appium server's view of the path because
            Appium reads the file itself.)

            ### `arg:` for shell commands; prefix `--` is automatic

            Always write shell args as a YAML list inside the `adb:` map:

            ```yaml
            - run: list the apidemos packages
              context: [deploy]
              adb:
                method: shell
                arg: [pm, list, packages, io.appium.android.apis]
            ```

            The `--` prefix is automatic — you don't have to escape `-l` / `-p` /
            `-fsS` etc. flags. Don't reach for `command:` here; `command:` is a
            different verb.

            ### `arg: [pkgid]` for uninstall

            Mirrors `shell`'s convention to avoid adding a dedicated `package:`
            field. The validator enforces `arg:` non-empty at config time.

            ### Host-side screencap needs `screencap -p | base64`

            A raw `screencap -p` produces binary PNG bytes that goadb's shell
            stream may mangle. The implementation always pipes through base64 and
            decodes host-side. This is invisible to authors — `adb: screencap`
            "just works" — but worth knowing when debugging.

            ### `wait-ui-settled` — UI readiness past `sys.boot_completed`

            A freshly-booted `google_apis_playstore` emulator runs minutes of GMS
            post-boot churn (Play Store auto-update, Chimera config, Heterodyne sync)
            that starves the GMS-coupled system UI (Pixel Launcher via AiAi,
            systemui). It ANRs, and the "Application Not Responding" dialog occludes
            whatever app is foreground — so a UI probe (appium find, `monkey`)
            fired right after `sys.boot_completed` silently fails. `sys.boot_completed`
            is necessary-but-not-sufficient readiness; `wait-ui-settled` is the
            sufficient half: it polls the focused window and dismisses any ANR dialog
            with `KEYCODE_HOME` until the foreground is clean. It is **load-independent**
            (the ANR is GMS churn, not host load) and adapts to a load-dilated churn
            purely via `timeout:`. Pure Go over goadb — no in-container shell, so it
            is immune to the stdin-heredoc hazard that breaks shell-based settle loops
            (see `/charly-check:check` "in-container `command:` stdin").

            ```yaml
            # Order matters — wait-for-device (boot) BEFORE wait-ui-settled (UI),
            # wait-ui-settled BEFORE any UI-interacting step (appium / monkey).
            # An ordered list item under the candy/box plan:
            - check: the emulator UI has settled past the ANR churn
              id: emulator-ui-settled
              adb: wait-ui-settled
              context: [deploy]
              timeout: 600s
              stdout:
                - contains: settled
            ```

            `current-focus` and `keyevent` are the building blocks `wait-ui-settled`
            composes — usable on their own to assert the foreground app or inject a
            key (`adb: keyevent` + `key: KEYCODE_BACK`).

            ### `query:` is a free-form logcat spec

            `query: "MyApp:I *:S"` passes `MyApp:I *:S` to logcat verbatim (each
            word becomes one positional arg). Don't quote individual words; the
            shell-fields split handles separation.

            ### Long-running wait

            `wait-for-device` blocks up to its `timeout:` (default 60s) — set
            `timeout:` on the plan step to at least that value, plus a small margin.
            Common pattern:

            ```yaml
            - check: wait for the device to finish booting
              adb: wait-for-device
              timeout: 120s
              context: [deploy]
            ```

            ## Implementation

            The `adb:` verb and its goadb ADB-wire client live in the out-of-tree
            `candy/plugin-adb` plugin module (an external-charly-verb plugin), NOT in
            charly's core (which carries no goadb dependency). The verb's method enum + every
            adb modifier live in the plugin's OWN input schema
            (`candy/plugin-adb/schema/adb.cue`, `#AdbInput`), served over the Describe channel
            and spliced onto the base for validation — so authoring is unchanged (`adb: devices`,
            not `plugin: adb`); the internal plugin/plugin_input wire envelope the sugar desugars
            to is never authored. At check time the host
            dispatches it through the provider registry —
            `providerRegistry.ResolveVerb("adb")` → the out-of-process `grpcProvider` →
            `invokeVerbProvider`, which hands the plugin the full `#Op` as params.

            The deploy seam (`target: android` install) drives the SAME plugin
            out-of-process — F6/FINAL-K5-unit-6a relocated the device-endpoint resolution
            + apk install-spec collection wholesale into `candy/plugin-adb/preresolve.go`
            (the DELETED `charly/android_deploy_cmd.go`'s `invokeAdbPlugin`/`AdbDeviceEnv`
            no longer exist host-side) — so the device probe, the committed-APK install,
            and the `adb:` verb never drift on adb behaviour.

            The plugin reads the host port from podman's `NetworkSettings.Ports` via
            `InspectContainer` — same source-of-truth used by the check test runner's
            `${HOST_PORT:N}` substitution. Host-networked containers expose the container
            port AS the host port.

            ## Related skills

            - `/charly-check:appium` — sibling verb for higher-level UI automation against the
              same emulator (W3C WebDriver).
            - `/charly-check:android` — the `kind: android` device + `apk:` package format +
              `target: android` deploy. The `adb: install` / `adb: install-app` verbs are thin
              wrappers over the SAME shared installer (`candy/plugin-adb/install.go`; the
              apk format's install-spec collection lives in the same plugin's
              `preresolve.go`, relocated from the now-DELETED `charly/android_deploy_preresolve.go`)
              — so the verb, the format, and the deploy target never drift.
            - `/charly-check:check` — the unified check system and the Op (a plan step) that
              holds every verb discriminator + modifier.
            - `candy/android-emulator` — the image these verbs target.

            ## When to Use This Skill

            **MUST be invoked** for any task involving the `adb:` declarative check verb or
            its plan steps. Invoke this skill BEFORE reading the plugin's Go source or
            reaching for `command: adb ...` workarounds.

android-skill:
    skill:
        name: android
        family: check
        owner: charly-check
        description: |-
            MUST be invoked before any work involving: the `kind: android` schema kind, a `target: android` deploy (the external `deploy:android` substrate), the `apk:` layer package format (installing Android apps declaratively), the android deploy preresolver, an in-pod emulator OR a remote/physical adb-endpoint device, or nested `pod → android` deployment. The first-class Android device + app surface that sits above the `adb:`/`appium:` check verbs.
        triggers:
            - "`kind: android` device / `target: android` deploy / `apk:` package format in candies / installing Android apps declaratively / remote-or-emulator adb endpoint / nested `pod \u2192 android`"
        content: |
            # kind: android + the `apk` package format

            ## Overview

            Android is a first-class deploy **substrate** in `charly`, modeled on `kind: kubernetes`.
            Two cooperating concepts:

            - **`kind: android`** — a DEVICE (the substrate). Either an in-pod emulator
              (referenced by `image:`) or a remote/physical adb endpoint (`adb:
              {host: <host:port>}`). The analogue of `kind: kubernetes` (the cluster).
            - **`apk` package format** — Android apps declared in LAYERS (NOT a kind),
              parallel to `package:`/`aur:`. A `target: android` deploy applies its layers'
              `apk:` packages onto the device. The app is the deployable workload, the way a
              `candy:` image (a `candy:` node carrying `base:`/`from:`) is the workload for a pod/kubernetes deploy.

            This sits ABOVE the device-interaction verbs: the `adb:` (`/charly-check:adb`)
            and `appium:` (`/charly-check:appium`) declarative check verbs drive a running
            device; `kind: android` + `target: android` declaratively describe a device and
            the apps installed on it. The install machinery is shared — see "One installer
            (R3)".

            ## `kind: android` — the device

            ```yaml
            # charly.yml — each device is its own name-first entity; the android: value holds
            # the WHOLE body — scalars AND the non-scalar google_account:/adb: fields, inline
            pixel9a-36:                          # in-pod emulator device
                android:
                    box: android-emulator       # `box:` source field → the `candy:` image that BAKES the emulator + system image
                    device: pixel_9a             # informational (documents the baked AVD profile)
                    api_level: 36                # informational (the API level is a BUILD property of box:)
                    google_account:              # credential-store secret-key refs for apkeep google-play
                        email_secret: GOOGLE_ACCOUNT_EMAIL
                        token_secret: GOOGLE_AAS_TOKEN

            my-phone:                            # remote/physical device
                android:
                    serial: 192.168.1.50:5555
                    adb:                         # an adb SERVER addr (a host running `adb connect`)
                        host: 192.168.1.50:5555
            ```

            **Device source is exclusive: `image:` XOR `adb:`.**

            - **`image:` (in-pod)** — apkeep runs INSIDE the emulator pod (`engine exec`);
              the pod's own adb installs onto its emulator. Needs nothing extra on the host.
            - **`adb:` (remote/physical)** — apkeep runs ON THE HOST; the APK is pushed to
              the endpoint via goadb (or `adb -H <host> -P <port>` for the apkeep-download
              path). The host needs `android-tools` (adb) + apkeep for the `package:` path
              (PKGBUILD optdepends; apkeep ships as an upstream binary — no Arch package);
              the committed-`apk:` path needs neither (pure goadb push).

            **Build-vs-runtime boundary (load-bearing).** The Android system image + API
            level are baked into the referenced `candy:` image at BUILD time (sdkmanager in
            the android-sdk layer). `kind: android` REFERENCES that image — it never drives
            a build. `device:`/`api_level:` are documentation, not assertions or build
            drivers. Two API levels = two images, each with its own `kind: android`.

            ## `apk:` — the package format (declared in layers)

            ```yaml
            # candy/my-android-apps/charly.yml — name-first: the candy name is the top-level key,
            # the apk: list is inline in the candy body
            my-android-apps:
                candy:
                    version: 2026.145.1700
                    apk:
                        - package: org.fdroid.fdroid   # apkeep download by id
                          source: apk-pure             # apk-pure(default) | google-play | f-droid | huawei-app-gallery
                          arch: x86_64                 # native ABI (apk-pure) — match the emulator
                        - apk: tests/data/MyApp.apk    # committed local APK (project-root- or layer-relative), goadb push
            ```

            Each entry is **`package:` (apkeep) XOR `apk:` (committed file)**. `source:`
            applies only to `package:`. The format compiles to an `ApkInstallStep` that
            ONLY `target: android` executes — at image build and on
            local/vm/pod/kubernetes targets it is recorded-skipped (there is no Android device
            there; this is the same "wrong-venue skip" `aur:` uses off-Arch). A layer
            carrying only `apk:` is valid install content.

            Compared to a sideloaded APK: apps with a static-library dependency (e.g.
            Chrome's Trichrome) can't be sideloaded — install those via the Play Store
            image (preinstalled) instead.

            ## `target: android` deploy

            ```yaml
            # charly.yml — the device deploys INTO the emulator pod (pod → android), so it is a
            # resource node placed UNDER the android-stack deploy
            android-stack:
                pod:
                    image: android-emulator
                device:                              # deploy-into member: applies apk: layers onto the device
                    android:
                        from: pixel9a-36             # → the kind: android device, deployed onto the emulator pod
                        add_candy:                   # deploy data inline in the substrate value
                            - my-android-apps        # layers whose apk: packages install onto the device
            ```

            `charly fleet add android-stack.device` resolves the device, gates on
            `sys.boot_completed`, and installs the `add_candy:` candies' `apk:` packages via
            the **external `deploy:android` substrate** (F1 — served out-of-process by
            candy/plugin-adb). Apps ride in on `add_candy:` (the same overlay mechanism
            local/vm targets use) — there is no separate apk-list field. `charly fleet del`
            best-effort `pm uninstall`s each `package:` id (replayed from the deploy's
            recorded reverse ops; the device/pod lifecycle is owned by the pod deploy).

            A top-level (non-nested) `target: android` deploy works too — for an `image:`
            device it resolves the running container by image name; for an `adb:` device it
            talks straight to the endpoint.

            ## Nested deployment (`pod → android`)

            Mirrors `vm → kubernetes`. The emulator runs in a pod; the device deploys onto it; the
            apps deploy onto the device. `target: android` is a **passthrough** hop in the
            deploy chain (the device shares its host pod's adb venue / the endpoint addr —
            there is no shell venue to "enter"), so `charly check live pod.android` runs the
            device's checks against the pod's published adb port. A pod's children can only
            deploy AFTER `charly start` (the container doesn't exist at `charly fleet add` time),
            so `charly fleet add --node-only` brings the pod up first and the children deploy
            afterwards by dotted path; `charly check run <bed>` automates this (deploy pod →
            config → start → deploy nested children → check-live).

            ## One installer + one plugin (R3 / F1)

            candy/plugin-adb owns ALL Android device interaction — the `adb:` check verb,
            the `deploy:android` substrate, AND the goadb-backed `charly status` probe — so
            the goadb dependency + the single apk install path (`install.go`:
            `installByPackage` apkeep+adb / `installFromHostApk` goadb push / `uninstall`)
            live in ONE plugin, never duplicated across verb and deploy.

            **F6/FINAL-K5-unit-6a moved the preresolve leg wholesale INTO the plugin**, and
            **K-wave W3a A3-phase-2 finished the job**: the deploy-tree node + `kind:android`
            entity lookups that used to reach the host over the generic
            `"deploy-entity-resolve"` HostBuild seam now self-load the project PLUGIN-SIDE
            too (`sdk/loaderkit.ResolveMergedTreeViaExecutor` / `ResolveAndroidEntityViaExecutor`,
            unblocked by the loader-orchestration move to `sdk/loaderkit`) — no HostBuild
            round trip remains in this leg:

            - **Plugin** (`candy/plugin-adb/preresolve.go`, the `deploy:android`
              preresolve leg) resolves the device endpoint (engine inspect /
              `${HOST_PORT:N}` / google-play creds from the credential store) and collects
              the apk install specs from the deploy's compiled plans (committed-APK paths
              → absolute host paths) itself, self-loading the deploy-tree node + the
              `kind:android` entity plugin-side and resolving google-play credentials
              peer-to-peer via `verb:credential`, and ships the result as
              `DeployVenue.Substrate` (a `spec.AndroidDeployVenue`).
            - **Plugin** (`candy/plugin-adb/deploy.go`, the `deploy:android` provider) gates
              on `sys.boot_completed`, installs each app with retry (reusing the SAME
              `install`/`install-app` method handlers the `adb:` verb dispatches), and returns
              the `pm uninstall` teardown ops the host records + replays at `charly fleet del`.

            So the apk format, the check verbs, and the deploy substrate can never drift on
            single/split/`.xapk` handling — they all flow through the one provider.

            ## R10 bed

            `check-android-emulator-pod` nests two devices: `device` (in-pod, installs
            F-Droid via apkeep) and `device-net` (the same emulator addressed as a remote
            adb ENDPOINT, installs the committed ApiDemos via goadb) — proving both device
            kinds with no physical hardware. The android-emulator-layer check ASSERTS the
            results (`apk-fdroid-present`/`-launch`, `apk-net-apidemos-present`).

            ## Implementation map

            `target: android` is an EXTERNAL deploy substrate (F1): it resolves to
            `pluginDeployTarget` (`charly/unified_targets.go`, S3b), dispatched via
            `candy/plugin-fleet`'s `Invoke(OpDeployDispatch)` to the substrate's own
            `InvokeProvider`, served by candy/plugin-adb. There is no in-proc android
            deploy target.

            **F6/FINAL-K5-unit-6a moved the ENTIRE preresolve leg plugin-side** — every
            host-core file that used to own it (`charly/android_spec.go`,
            `charly/android_deploy_cmd.go`, `charly/android_deploy_preresolve.go`, and the
            general per-substrate preresolver hook registry `charly/deploy_preresolve.go`)
            is DELETED. `candy/plugin-adb/preresolve.go` now owns it end-to-end (mirroring
            `candy/plugin-kube/preresolve.go`'s `deploy:kubernetes` move): it resolves the device
            endpoint (engine inspect / `${HOST_PORT:N}` / google-play creds) and collects
            the apk install specs itself. **K-wave W3a A3-phase-2** finished the move: the
            deploy-tree node lookup and the `kind:android` entity lookup — the two
            touches that used to reach the host over the generic `"deploy-entity-resolve"`
            HostBuild seam — now self-load the project PLUGIN-SIDE too
            (`sdk/loaderkit.ResolveMergedTreeViaExecutor` / `ResolveAndroidEntityViaExecutor`);
            google-play credentials resolve peer-to-peer via `verb:credential`. No
            HostBuild round trip remains anywhere in this leg — engine-inspect, port
            resolution, the committed-APK path walk, and the entity/tree self-load are
            ALL pure/portable and run plugin-side directly, returning a
            `spec.AndroidDeployVenue`.

            - `candy/plugin-adb/preresolve.go` — the `deploy:android` PRERESOLVE leg:
              `AndroidSpec`/`AndroidAdbEndpoint`/`AndroidGoogleAccount`/`ApkPackageSpec`,
              device-endpoint resolution, and the apk install-spec collection all live
              here now (relocated wholesale from the DELETED `charly/android_spec.go` +
              `android_deploy_cmd.go` + `android_deploy_preresolve.go`).
            - `charly/provider_deploy.go` — `externalizedDeploySubstrates` (the F1 source of
              truth) + the relaxed `checkDeployProviderBijection` (in-proc XOR externalized).
            - `charly/plugin_prescan.go` — `isExternalDeploySubstrate` (a substrate kind is
              external iff in `externalizedDeploySubstrates`).
            - `spec/schema/deploy.cue` (CUE-sourced; generated into `spec/spec/cue_types_gen.go`) — `#DeployVenue` (`.Substrate`) + `#AndroidDeployVenue`.
            - `candy/plugin-adb/deploy.go` — the `deploy:android` provider (boot gate + install
              loop with retry + uninstall reverse ops); `install.go` — the shared installer.
            - `deploykit.ApkInstallStep` (`sdk/deploykit/steps.go`); `sdk/deploykit/install_build.go` —
              `compileApkStep` (the plugin-side preresolver reads this step; no DeployTarget executes it).
            - `sdk/loaderkit/load_unified.go` — loader wiring (mirrors every `kubernetes` site; the former `charly/unified.go` is DELETED, K-wave 2).
            - `spec.Deploy` (the deploy node — the former `charly/deploy.go`'s `FleetNode` is DELETED, K-wave 2) with `target: android`; `charly/fleet_add_cmd.go` dispatch +
              `--node-only`; `sdk/deploykit/deploy_chain.go` / `charly/deploy_tree.go` passthrough.

            ## Related skills

            - `/charly-check:adb` — low-level device control (the verbs the installer shares).
            - `/charly-check:appium` — UI automation against the device.
            - `/charly-core:deploy` — `target: android` is one of the deploy targets.
            - `/charly-image:layer` — the `apk:` field is part of the layer schema.
            - `/charly-internals:install-plan` — the IR `ApkInstallStep` plugs into.
            - `/charly-kubernetes:kubernetes` — the `kind: kubernetes` pattern `kind: android` mirrors.

            ## When to Use This Skill

            **MUST be invoked** for any task involving `kind: android`, `target: android`
            (the external `deploy:android` substrate), the `apk:` layer package format, an
            adb-endpoint device, or nested `pod → android` deployment. Invoke BEFORE reading the android_*.go
            source or editing a device's `charly.yml` / a layer's `apk:` list.

appium-skill:
    skill:
        name: appium
        family: check
        owner: charly-check
        description: |-
            MUST be invoked before any work involving: the `appium:` check verb (declarative, dispatched to the out-of-process plugin candy/plugin-appium), Android UI automation, WebDriver session management, APK install via Appium, element find/click/send-keys, mobile-specific WebDriver caps — anywhere the goal is to drive a running Appium 3.x server inside a container via W3C WebDriver from outside.
        triggers:
            - "the `appium:` check verb / Android UI automation (out-of-process plugin) / W3C WebDriver sessions, element introspection, the gesture/app/key/device sugar groups, the generic `execute`/`raw` escape hatch"
        content: |
            # Appium — W3C WebDriver client

            ## Overview

            `appium:` is a DECLARATIVE check verb that drives a host-side Appium WebDriver
            client — authored as `appium: <method>` inside a candy/box plan `check:`/`run:`
            step. It is NOT a host CLI command: there is no `charly check appium`. The
            verb's implementation and its `github.com/tebeka/selenium` dependency were
            dep-shed into the out-of-tree `candy/plugin-appium` plugin module; at check
            time the host dispatches `appium:` through the provider registry to that
            out-of-process plugin (the same path a bed's checks take via `charly check
            live` / `charly check run`).

            The plugin talks W3C WebDriver to the container's host-published Appium port
            (container `:4723` → host's `HOST_PORT:4723`, e.g. `35001` on the
            `check-android-emulator-pod` deploy) at base path `/wd/hub`.

            Session lifecycle uses a persistent JSON session file at
            `~/.cache/charly/appium/sessions/<image>[_<instance>].json` so multi-step
            tests share one WebDriver session across separate `appium:` steps.
            `session-create` writes the file; the other operations load it;
            `session-delete` removes it and best-effort closes the remote session.

            The Appium-specific endpoints not in the standard WebDriver surface
            (`install_app`, `is_app_installed`, `remove_app`, etc.) route through
            the W3C escape hatch: `POST /session/<id>/execute/sync` with
            `{"script": "mobile: installApp", "args": [...]}`.

            ### Authoring the `appium:` verb in a plan step

            The verb is the inline Op of a step — an ordered list item under the candy/box
            `plan:` (deploy-context only — `context: [deploy]`); an Appium action that drives the
            UI is a `run:` step. The method name is the scalar value for a bare-method step
            (`appium: status`), or the `method:` key of the `appium:` map when the step carries
            appium-exclusive fields (`caps:`, `apk:`, `strategy:`, `selector:`, `text:`,
            `attribute:`, `app_id:`, `activity:`, `keycode:`, `params:`, `expression:`,
            `http_method:`, `path:`, `request_body:`, `session:`, `artifact:` and the artifact
            validators) — those live INSIDE the `appium:` map. Only the shared matchers
            (`stdout:`, `stderr:`, `exit_status:`) and `context:`/`id:`/`timeout:` stay siblings.

            ```yaml
            - check: the Appium server reports ready
              id: appium-up
              appium: status
              stdout: { contains: '"ready":true' }
              context: [deploy]
            - run: open a W3C WebDriver session against the emulator
              id: open-session
              appium:
                method: session-create
                caps: |
                  {"platformName":"Android","appium:automationName":"UiAutomator2","appium:deviceName":"emulator-5554"}
              context: [deploy]
            - run: install the ApiDemos test app
              id: install
              appium:
                method: install-app
                apk: ./tests/data/ApiDemos-debug.apk   # HOST path; staged into the container by the verb
              context: [deploy]
            - run: tap the Animation list entry
              id: tap-animation
              appium:
                method: click
                strategy: xpath
                selector: '//android.widget.TextView[@text="Animation"]'
              context: [deploy]
            - check: a screenshot of the post-tap screen is captured
              id: snapshot
              appium:
                method: screenshot
                artifact: /tmp/post-tap.png
                artifact_min_bytes: 10000
              context: [deploy]
            - run: close the WebDriver session
              id: close
              appium: session-delete
              context: [deploy]
            ```

            ## Quick Reference

            These are the `appium:` declarative-verb methods (NOT host CLI commands — there
            is no `charly check appium`). The method name is the scalar `appium:` value for a
            bare-method step; when a step carries modifiers those go INSIDE the `appium:` map
            (`appium: {method: click, selector: …}`), and only `stdout:`/`stderr:`/`exit_status:`
            and `context:`/`id:`/`timeout:` stay siblings.

            | Method | Declarative form | Required map field | Description |
            |---|---|---|---|
            | `status` | `appium: status` | — | GET /status, prints JSON, fails on HTTP != 200 |
            | `session-create` | `appium: {method: session-create, caps: …}` | `caps:` | Create W3C session, persist id |
            | `session-delete` | `appium: session-delete` | — | Close session and remove file |
            | `install-app` | `appium: {method: install-app, apk: …}` | `apk:` | mobile:installApp escape hatch |
            | `find` | `appium: {method: find, selector: …}` (+ `strategy:`) | `selector:` | Find element, prints W3C id |
            | `click` | `appium: {method: click, selector: …}` | `selector:` | Find + click |
            | `send-keys` | `appium: {method: send-keys, selector: …, text: …}` | `selector:`+`text:` | Find + type |
            | `screenshot` | `appium: {method: screenshot, artifact: …}` | `artifact:` | GET /screenshot, decode base64, write PNG |
            | `get-text` | `appium: {method: get-text, selector: …}` | `selector:` | find + GET .../text, prints element text |
            | `get-attribute` | `appium: {method: get-attribute, selector: …, attribute: …}` | `selector:`+`attribute:` | find + GET .../attribute/<a> (checked/enabled/text/...) |
            | `clear` | `appium: {method: clear, selector: …}` | `selector:` | find + POST .../clear |
            | `find-all` | `appium: {method: find-all, selector: …}` | `selector:` | POST /elements; prints count + ids |
            | `source` | `appium: source` | — | GET /source (UI hierarchy XML) |
            | `back` | `appium: back` | — | POST /back (navigate back) |

            ### Tier 2 — per-class sugar groups (flat `<group>-<op>` method names)

            Mirrors `wl`'s `sway-*` / `overlay-*` pattern — the gesture/app/key/device
            groups expose flat method names, e.g. `appium: gesture-tap` in a plan step.

            | Group | Ops (check-YAML method names) | Key modifiers |
            |---|---|---|
            | `gesture` | `gesture-tap`, `gesture-double-tap`, `gesture-long-press`, `gesture-drag`, `gesture-swipe`, `gesture-scroll`, `gesture-fling`, `gesture-pinch-open`, `gesture-pinch-close` | `selector`(+`strategy`) **or** `x`+`y`; `direction`+`percent` (swipe/scroll/fling); `params` (JSON: speed/duration/endX/endY/left/top/width/height) |
            | `app` | `app-start-activity`, `app-activate`, `app-terminate`, `app-remove`, `app-clear`, `app-is-installed`, `app-state`, `app-current-activity`, `app-current-package` | `app_id` (lifecycle ops); `activity` (`pkg/.activity`, start-activity, intent form) |
            | `key` | `key-press`, `key-hide`, `key-shown` | `keycode` (press; 4=BACK, 66=ENTER); `params` (metastate/flags) |
            | `device` | `device-info`, `device-battery`, `device-time`, `device-orientation`, `device-set-orientation`, `device-notifications`, `device-get-clipboard`, `device-set-clipboard`, `device-contexts`, `device-context` | `params` (value/name for set-orientation / set-clipboard / context switch) |

            ### Tier 3 — generic escape hatch (the cdp-`raw` equivalent — 100% coverage)

            | Method | Declarative form | Required map field | Description |
            |---|---|---|---|
            | `execute` | `appium: {method: execute, expression: …}` (+ `request_body:`) | `expression:` | `POST /execute/sync` — any `mobile:` command or JS. Object `request_body` → `[obj]`; array → as-is. Optional `selector:` resolves an element id for `{element}` substitution in `request_body`. |
            | `raw` | `appium: {method: raw, http_method: …, path: …}` (+ `request_body:`) | `http_method:`+`path:` | Any W3C call relative to `/session/<id>` (charly prepends it). `http_method:` is the W3C HTTP verb (the input's `method:` is always the verb method `raw`); `path:`/`request_body:` support the `{element}` token when `selector:` is set. Reaches **everything** including `mobile:` via `/execute/sync`. |

            **`raw` is the coverage guarantee** — anything not covered by a typed method or
            sugar group is reachable here (e.g. `raw GET /element/{element}/rect`,
            `raw POST /timeouts {"implicit":10000}`).

            `strategy:` accepts: `xpath` (default), `id`, `accessibility-id`,
            `class-name`, `android-uiautomator`, `name`, `css`. Mapped to W3C / Appium
            locator strings inside the implementation.

            ## Gotchas

            ### W3C capabilities (not legacy JSONWire)

            Appium 3.x rejects the legacy JSONWire capability format with HTTP 400.
            **Always use W3C-style caps** (the `caps:` value lives inside the `appium:` map):

            ```yaml
            appium:
              method: session-create
              caps: |
                {"platformName":"Android",
                 "appium:automationName":"UiAutomator2",
                 "appium:deviceName":"emulator-5554"}
            ```

            The `appium:` vendor prefix is mandatory on Appium-specific keys
            (`automationName`, `deviceName`, `app`, `appPackage`, `appActivity`,
            `noReset`, `newCommandTimeout`, …). Plain W3C keys (`platformName`,
            `browserName`) have no prefix.

            The selenium SDK we use (`github.com/tebeka/selenium`) handles the
            `alwaysMatch` wrapping internally — pass flat caps and the SDK wraps.
            We unwrap the user's `alwaysMatch` key if present to avoid double-
            wrapping.

            ### `apk:` is a HOST path for BOTH adb and appium

            - `adb: install` reads `apk:` from the host filesystem (the host `charly`
              binary pushes via the ADB sync protocol).
            - `appium: install-app` ALSO reads `apk:` from the host filesystem. Because
              the in-container Appium server's `mobile: installApp` requires an
              `appPath` it can read (the base64 `{"app": …}` form is rejected with HTTP
              400 "required parameter is missing: appPath"), the verb stages the host
              APK INTO the container via `<engine> cp` to a temp path, calls installApp
              with that in-container path, then removes the temp file. No bind-mount and
              no external staging step are needed — `apk:` is the host path, end to end.

            Both install verbs are therefore symmetric: `apk:` is always a host path
            (typically `./tests/data/<app>.apk`, resolved against the project root).
            If `appium: install-app` fails, check the host path exists, not a container
            path.

            ### `app-start-activity` uses the intent form (verified)

            `appium: app-start-activity` with `activity: io.appium.android.apis/.view.X`
            sends `mobile: startActivity {"intent":"<activity>"}`. The intent form
            (`pkg/.activity`) is what works on this UiAutomator2 build (verified live) —
            NOT a split `{appPackage,appActivity}`. Extra intent args go in `params:`.

            ### Set a W3C implicit wait, or finds race the activity

            `app-start-activity` returns before the activity's UI is laid out, so a `find`
            fired immediately after it returns "no such element". Set an implicit wait once
            after `session-create` so every `find` polls until the element renders:

            ```yaml
            - run: set a W3C implicit wait so every find polls until the element renders
              appium:
                method: raw
                http_method: POST
                path: /timeouts
                request_body: '{"implicit":10000}'
              context: [deploy]
            ```

            (Verified: without it, ~half the per-screen checks fail the layout race; with
            it, all pass. The `check-android-emulator-pod` bed does exactly this.)

            ### `{element}` substitution in execute/raw

            `execute` / `raw` resolve an element host-side when `selector:` is set and
            substitute its W3C id for the literal token `{element}` in `request_body:`
            (execute) and `path:`+`request_body:` (raw), e.g.
            `appium: {method: raw, http_method: GET, path: /element/{element}/text, selector: …}`. Single-brace
            `{element}` (deliberately NOT `${…}`) so the check runtime-variable resolver
            leaves it untouched. `charly box validate` errors if `{element}` appears with no
            `selector:`.

            ### Android-14 permission dialog covers the app

            On API 34, ApiDemos (and many apps) raise a runtime POST_NOTIFICATIONS dialog
            (`com.google.android.permissioncontroller`) on first launch that covers the
            app, so every find returns "no such element". Pre-grant the permission before
            driving the app: `adb: {method: shell, arg: [pm, grant, <pkg>, android.permission.POST_NOTIFICATIONS]}`
            then `adb: {method: shell, arg: [am, force-stop, <pkg>]}` for a clean launch.

            ### WebView context switch needs a pinned chromedriver (NOT --allow-insecure)

            The API-34 google_apis System WebView is **Chrome 113**. UiAutomator2's
            chromedriver autodownload was verified slow/hanging. Instead the `appium-server`
            layer pre-bakes chromedriver 113 at `/opt/chromedriver/113` and the WebView
            session sets `appium:chromedriverExecutableDir:"/opt/chromedriver/113"` +
            `appium:chromedriverDisableBuildCheck:true` (both plain caps, NOT insecure-
            gated). `device-contexts` (presence) works with no chromedriver and is the
            reliable floor; the `device-context` switch needs the pinned chromedriver.

            ### Base path `/wd/hub`; AUR-provisioned toolchain

            The container's Appium server (`/usr/bin/appium`, from the CachyOS/AUR `appium`
            package) listens at base path **`/wd/hub`**. The whole Android toolchain comes
            from CachyOS/AUR packages (`appium`, `android-sdk-*`, `android-emulator`,
            `android-sdk-build-tools-34` for aapt2) under `/opt/android-sdk`; only the
            API-34 system image is sdkmanager-fetched (no package exists).

            ## Method allowlist + required modifiers

            | Method | Required map field | Notes |
            |---|---|---|
            | `status` | — | Bypasses the SDK — plain `http.Get` against `/status`. |
            | `session-create` | `caps:` | Accepts both flat `{"k":"v"}` and pre-wrapped `{"alwaysMatch":{"k":"v"}}`. Use `caps: @path.json` to read from file. Deletes any pre-existing session for the same image+instance first (best-effort), then `selenium.NewRemote` + persist. |
            | `session-delete` | — | Best-effort `DELETE /session/<id>` + `rm` of session file. No-op if no session exists. |
            | `install-app` | `apk:` | `apk:` is a HOST path. The verb stages it into the container via `<engine> cp`, then `POST /session/<id>/execute/sync` with `mobile: installApp` + `{appPath: <in-container-temp>}`, then removes the temp file. Symmetric with `adb: install`. |
            | `find` | `selector:` | `POST /session/<id>/element`, prints the W3C element id (a UUID-ish string). |
            | `click` | `selector:` | Find + `POST /session/<id>/element/<eid>/click`. Atomic. |
            | `send-keys` | `selector:`+`text:` | Find + `POST /session/<id>/element/<eid>/value` with `{text: <text>}`. |
            | `screenshot` | `artifact:` | `GET /session/<id>/screenshot`, base64-decode, write to `artifact:`. Pairs with `artifact_min_bytes:`. |
            | `get-text` / `clear` / `find-all` | `selector:` | find-then-act over `/element[s]/<id>/{text,clear}` (find-all → `/elements`). |
            | `get-attribute` | `selector:`+`attribute:` | find + `GET .../attribute/<name>`. |
            | `source` / `back` | — | `GET /source` / `POST /back`. |
            | `gesture-*` | — (element-or-xy enforced); `gesture-swipe`/`scroll`/`fling` need `direction:` | `mobile: <name>Gesture`; element id from `selector:`, else `x:`/`y:`; `percent:`+`params:` merged into args. |
            | `app-start-activity` | `activity:` | `mobile: startActivity {intent}`. |
            | `app-activate`/`terminate`/`remove`/`clear`/`is-installed`/`state` | `app_id:` | `mobile: <name>App {appId}`. |
            | `app-current-activity`/`current-package` | — | `mobile: getCurrent{Activity,Package}`. |
            | `key-press` | `keycode:` | `mobile: pressKey {keycode}` (+`params:`). |
            | `key-hide`/`key-shown` | — | `mobile: hideKeyboard` / `isKeyboardShown`. |
            | `device-info`/`battery`/`time`/`notifications` | — | `mobile: deviceInfo`/`batteryInfo`/`getDeviceTime`/`openNotifications`. |
            | `device-orientation`/`contexts` | — | `GET /orientation` / `GET /contexts`. |
            | `device-set-orientation`/`set-clipboard` | `params:` | `POST /orientation` / `mobile: setClipboard`. |
            | `device-context`/`get-clipboard` | — | `device-context`: empty `params:` → `GET /context`, set → `POST /context {name}`. |
            | `execute` | `expression:` | `POST /execute/sync {script,args:[<request_body>]}`; `{element}` from `selector:`. |
            | `raw` | `http_method:`+`path:` | arbitrary W3C call under `/session/<id>`; `{element}` from `selector:`. |

            ## Session-file format + location

            `~/.cache/charly/appium/sessions/<image>[_<instance>].json` (XDG-cache; honours
            `XDG_CACHE_HOME`):

            ```json
            {
              "session_id": "37e8f3c1-a9b2-4d8e-b6c5-9a4f7c8b1e2d",
              "base_url": "http://127.0.0.1:35001/wd/hub",
              "created_at": "2025-01-15T14:32:17.481Z",
              "image": "check-android-emulator-pod",
              "instance": "",
              "caps": { ... }
            }
            ```

            Mode `0600`. Why XDG cache and NOT in-project / NOT `~/.local/share`:

            - Session ids are host-local ephemeral state. Different hosts running
              the same image have different containers with different session ids;
              sharing the file (e.g. via Syncthing of an in-project path) would
              corrupt cross-host setups.
            - `~/.local/share` is XDG **data** — explicitly Syncthing-replicated on
              this user's hosts. XDG **cache** is the correct location for ephemeral
              host-local state.

            Override the session id for a single check with `session:`:

            ```yaml
            - check: capture a screenshot against an explicit session id
              appium:
                method: screenshot
                artifact: /tmp/x.png
                session: 37e8f3c1-...   # bypass the session file
              context: [deploy]
            ```

            ## Implementation

            The `appium:` verb and its `github.com/tebeka/selenium` dependency live in the
            out-of-tree `candy/plugin-appium` plugin module (an external-charly-verb
            plugin), NOT in charly's core (which carries no selenium dependency). The verb's
            method enum + every appium modifier (including the absorbed `caps:` and the raw
            `http_method:`) live in the plugin's OWN input schema
            (`candy/plugin-appium/schema/appium.cue`, `#AppiumInput`), served over the Describe
            channel and spliced onto the base for validation — so authoring is unchanged
            (`appium: status`, not `plugin: appium`); the internal plugin/plugin_input wire
            envelope the sugar desugars to is never authored. At
            check time the host dispatches it through the provider registry —
            `providerRegistry.ResolveVerb("appium")` → the out-of-process `grpcProvider` →
            `invokeVerbProvider`, which hands the plugin the full `#Op` as params.

            Inside the plugin: `session-create` uses `tebeka/selenium`'s `NewRemote` (which
            handles W3C `alwaysMatch` wrapping); all other ops use a small raw-HTTP W3C
            client (`w3cSession`) because the SDK can't attach to an existing session id.
            The session file is loaded/saved/deleted with XDG path resolution.

            The plugin reads the host port from podman's `NetworkSettings.Ports` via
            `InspectContainer` — same path as the adb verb.

            ## Library risks (documented)

            `github.com/tebeka/selenium` last released v0.9.9 in 2022. The W3C
            WebDriver protocol is stable so it works against Appium 3.x today, but
            upstream activity is low. If it goes dormant we'll need to fork or
            migrate to a newer library. The blast radius is small — only
            `session-create` uses the SDK; the rest go through `w3cSession` (plain
            HTTP), so an SDK swap is a single Run() method's worth of code.

            `github.com/zach-klippenstein/goadb` (used by the sibling `/charly-check:adb`)
            has the same maintenance posture — pinned to a 2020 release. Same
            mitigation if it stops working.

            ## Related skills

            - `/charly-check:adb` — sibling verb for low-level Android Debug Bridge
              control (install / shell / screencap / logcat).
            - `/charly-check:android` — the `kind: android` device + `apk:` package format +
              `target: android` deploy this UI automation runs against.
            - `/charly-check:check` — the unified check system and the Op struct that
              holds every verb discriminator + modifier (one Op per plan step).
            - `candy/android-emulator` — the image these verbs target.

            ## When to Use This Skill

            **MUST be invoked** for any task involving the `appium:` declarative check verb
            or its plan steps. Invoke this skill BEFORE reading the plugin's Go source or
            reaching for `command: curl http://localhost:.../wd/hub/...` workarounds.

cdp-skill:
    skill:
        name: cdp
        family: check
        owner: charly-check
        description: |-
            Chrome DevTools Protocol browser automation via the declarative `cdp:` check
            verb, served out-of-process by `candy/plugin-cdp`.
            MUST be invoked before any work involving: the `cdp:` check verb, Chrome
            DevTools Protocol, browser automation, clicking elements, taking screenshots,
            or OAuth flows inside containers.
        content: |
            # CDP - Chrome DevTools Protocol

            ## Overview

            The `cdp:` check verb connects to Chrome DevTools Protocol (CDP) on port 9222
            inside running containers. It is **NOT a host `charly check` subcommand** — it is
            a declarative check verb served out-of-process by its plugin (`candy/plugin-cdp`),
            parallel to the `mcp:`/`record:`/`adb:`/`appium:` plugin verbs. Author a `cdp:` step
            in a candy/box plan and run it against a live deployment with
            `charly check live <image> --filter cdp`.

            It provides HTTP API operations (open, list, close tabs) and WebSocket CDP
            operations (click, type, eval, wait, text, html, screenshot) for headless browser
            automation.

            **Served out-of-process — no host CLI subcommand.** The host dispatches the `cdp:`
            verb through the provider registry exactly like a built-in (`ResolveVerb("cdp")` →
            the out-of-process gRPC provider → `Provider.Invoke` with the full `Op`), and the
            plugin drives the running container's CDP endpoint. Authoring is unchanged from a
            built-in verb: you write `cdp: open`, never `plugin: cdp`.

            ### Authoring a `cdp:` step

            Each method is the declarative `cdp:` step you author — an ordered list item under
            the candy/box `plan:`. The method name is the scalar value for a bare-method step
            (`cdp: status`), or the `method:` key of the `cdp:` map when the step carries any
            cdp-exclusive field (`tab:`, `expression:`, `url:`, `selector:`, `text:`, `x:`, `y:`,
            `artifact:`, `artifact_min_bytes:`, …) — those fields live INSIDE the `cdp:` map. The
            shared matchers (`stdout:`, `stderr:`, `exit_status:`) and `context:`/`id:`/`timeout:`
            stay siblings of the `cdp:` key. A query is a `check:` step; a navigation/click action
            is a `run:` step. All `cdp:` steps are **deploy-context only** (they need a running
            container), so author them with `context: [deploy]`. See `/charly-check:check` for the
            full method allowlist and YAML shape. Example:

            ```yaml
            - check: the page title is Dashboard
              context: [deploy]
              cdp:
                method: eval
                tab: "1"
                expression: document.title
              stdout: Dashboard
            ```

            ## Quick Reference

            | Action | Declarative step | Description |
            |--------|------------------|-------------|
            | Open URL | `cdp: open` + `url:` | Open URL in new Chrome tab |
            | List tabs | `cdp: list` | List all open tabs (id, title, url) |
            | Close tab | `cdp: close` + `tab:` | Close a tab by ID |
            | Get text | `cdp: text` + `tab:` | Get page text content |
            | Get HTML | `cdp: html` + `tab:` | Get page HTML source |
            | Get URL | `cdp: url` + `tab:` | Get page title and URL |
            | Screenshot | `cdp: screenshot` + `tab:` + `artifact:` | Capture PNG screenshot |
            | Click | `cdp: click` + `tab:` + `selector:` | Click element by CSS selector |
            | Coords | `cdp: coords` + `tab:` + `selector:` | Show element coords in viewport + desktop |
            | Type | `cdp: type` + `tab:` + `selector:` + `text:` | Type into input field |
            | Check JS | `cdp: eval` + `tab:` + `expression:` | Evaluate JavaScript |
            | Wait | `cdp: wait` + `tab:` + `selector:` | Wait for element |
            | Raw CDP | `cdp: raw` + `tab:` | Send raw CDP command |
            | Status | `cdp: status` | Check CDP availability, show port and tab count |
            | SPA click | `cdp: spa-click` + `tab:` + `x:` + `y:` | Click at canvas coords with SPA scale correction |
            | SPA type | `cdp: spa-type` + `tab:` + `text:` | Type text via SPA (bypasses local compositor/Chrome) |
            | SPA key | `cdp: spa-key` + `tab:` + `text:` | Send key press via SPA (Return, Escape, F1-F12, etc.) |
            | SPA key-combo | `cdp: spa-key-combo` + `tab:` + `text:` | Send modifier combo via SPA (super+e, ctrl+t, alt+F4) |
            | SPA mouse | `cdp: spa-mouse` + `tab:` + `x:` + `y:` | Move pointer with SPA scale correction |
            | SPA status | `cdp: spa-status` + `tab:` | Show SPA state (canvas, overlay, decoders) |

            In the table, each `+ <field>:` entry is a key INSIDE the `cdp:` map
            (`cdp: {method: open, url: …}`); only `stdout:`/`stderr:`/`exit_status:` and
            `context:`/`id:`/`timeout:` are siblings of the `cdp:` key.

            Run a candy's baked `cdp:` steps against a live deployment with
            `charly check live <image> --filter cdp`. The `-i <instance>` flag on `charly check
            live` selects a multi-instance deployment.

            ## Architecture

            1. Resolves the container name from image + instance (`charly-<image>[-<instance>]`)
            2. Discovers the mapped port 9222 via `podman port` / `docker port`
            3. **HTTP API** (`/json/list`, `/json/new?url=`, `/json/close/<id>`) for list, open, and close
            4. **CDP WebSocket** for interactive operations (click, type, eval, wait, text, html, screenshot, raw)

            ## Requirements

            - A Chrome candy with the `cdp-proxy` supervisord service
            - Chrome launched with `--remote-allow-origins='*'` and `--remote-debugging-port=9223` (internal port)
            - Container must be running (`charly start`)

            The `cdp-proxy` is essential because Chrome 146+ binds DevTools only to 127.0.0.1 and rejects connections with non-localhost Host headers. Chrome binds to `127.0.0.1:9223` internally. The `cdp-proxy` Python script listens on `0.0.0.0:9222` and forwards to Chrome with Host header rewriting. It also rewrites response URLs (`webSocketDebuggerUrl: ws://localhost:9223/...` to `ws://<client-host>:9222/...`) with Content-Length correction, ensuring CDP WebSocket connections work correctly from the host.

            ## Methods

            Each method below is the declarative `cdp:` step you author; queries produce
            assertable output (run them as `check:` steps), side-effect actions pass when they
            exit 0 (run them as `run:` steps, then follow with a query check to verify the
            effect). All steps are deploy-context only.

            ### Open a URL

            ```yaml
            - run: open example.com in a new tab
              context: [deploy]
              cdp:
                method: open
                url: https://example.com
            ```

            Uses HTTP API: `PUT /json/new?url=<encoded-url>`. Returns the new tab ID (the new
            tab is conventionally tab `1` — there is no framework-managed variable to carry a
            tab ID between steps; reference subsequent steps as `tab: "1"`).

            ### List Tabs

            ```yaml
            - check: a tab is open
              context: [deploy]
              cdp: list          # scalar sugar — bare method, no cdp-exclusive fields
              stdout:
                contains: example.com
            # Output: one line per tab — "ID  TITLE  URL"
            ```

            Uses HTTP API: `GET /json/list`.

            ### Close a Tab

            ```yaml
            - run: close the tab
              context: [deploy]
              cdp:
                method: close
                tab: "1"
            ```

            Uses HTTP API: `GET /json/close/<id>`.

            ### Get Page Content

            ```yaml
            - check: the page text contains the marker
              context: [deploy]
              cdp:
                method: text     # cdp: html → HTML source; cdp: url → title and URL
                tab: "1"
              stdout:
                contains: Example Domain
            ```

            Uses CDP WebSocket: `Runtime.evaluate` with `document.body.innerText` / `document.documentElement.outerHTML`, `Target.getTargetInfo`.

            ### Screenshot

            ```yaml
            - check: a non-empty screenshot is captured
              context: [deploy]
              cdp:
                method: screenshot
                tab: "1"
                artifact: /tmp/page.png
                artifact_min_bytes: 10000
            ```

            Uses CDP: `Page.captureScreenshot`. Combine with the artifact validators
            (`artifact_min_bytes`, `artifact_min_dimensions`, `artifact_not_uniform`) to assert
            the capture is real — see `/charly-check:check` "Artifact-validation modifiers".

            ### Click and Type

            ```yaml
            - run: click the submit button
              context: [deploy]
              cdp:
                method: click
                tab: "1"
                selector: button[type="submit"]
            - run: type the email address
              context: [deploy]
              cdp:
                method: type
                tab: "1"
                selector: input[name="email"]
                text: user@example.com
            ```

            Click uses CDP: `Runtime.evaluate` with `deepQuery()` to find element (piercing shadow DOM), `scrollIntoViewIfNeeded()` + `getBoundingClientRect()` for coordinates, `Input.dispatchMouseEvent` for click. Type uses `deepQuery()` + `scrollIntoViewIfNeeded()` + `focus()` to select the element, then `Input.dispatchKeyEvent` for each character (keyDown, char, keyUp — matching Puppeteer behavior).

            **Shadow DOM support:** All selector-based methods (click, type, wait) automatically pierce shadow DOM boundaries via recursive `deepQuery()`. This means selectors work on Chrome's internal pages (`chrome://settings/*`), Polymer/Lit web components, and any page using Web Components with shadow DOM. Hidden/zero-sized elements are skipped — only visible matches are returned.

            **Note on Chrome internal dialogs:** Some Chrome UI elements (e.g., the "Turn on sync" confirmation dialog) are rendered as native browser chrome, invisible to CDP. Interact with these via the surviving `vnc:` verb keyboard (a `vnc: key` step with `key: Tab` / `key: Return`). VNC screenshots (a `vnc: screenshot` step) show the full desktop including these dialogs, while CDP screenshots only show the page viewport.

            ### Coordinate Systems

            CDP coordinates are **viewport-relative** (relative to Chrome's content area). VNC coordinates are **desktop-absolute** (the full Wayland framebuffer). The offset between them includes Chrome's window position on the desktop plus Chrome's UI chrome (title bar, tab bar, address bar — typically ~107px).

            **`cdp: coords`** — Shows an element's coordinates in both systems:

            ```yaml
            - check: the sync button is located
              context: [deploy]
              cdp:
                method: coords
                tab: "1"
                selector: "#sync-button"
            # Element:  #sync-button (108x36)
            # Viewport: x=1166 y=310  center=(1220, 328)
            # Desktop:  x=1166 y=421  center=(1220, 439)  (via window.screenX/screenY, chromeHeight=107)
            # Sway:     window at (4, 4) size 1912x1032  (app_id=google-chrome)
            ```

            **Delivering a pointer click via VNC on a `chrome://` page** — CDP mouse events and
            JS `.click()` are blocked on `chrome://` pages. Locate the element with `cdp: coords`,
            then deliver the click through the surviving `vnc:` verb at the desktop center:

            ```yaml
            - run: click the sync button via VNC pointer
              context: [deploy]
              vnc:
                method: click
                x: 1220
                y: 439
            ```

            **Delivering the same click via the `wl:` verb** — the `wl:` verb (like `vnc:`)
            takes desktop-absolute coords directly, so it is the Wayland-native alternative on a
            wlroots desktop without VNC. Read the desktop center from the `cdp: coords` step
            above, then author a `wl: click` step at those `x:`/`y:`:

            ```yaml
            - run: click the sync button via the wl pointer
              context: [deploy]
              wl:
                method: click
                x: 1220
                y: 439
            ```

            ### Evaluate JavaScript

            ```yaml
            - check: read the document title
              context: [deploy]
              cdp:
                method: eval
                tab: "1"
                expression: document.title
              stdout:
                contains: Example
            ```

            Uses CDP: `Runtime.evaluate`. Returns the result value (e.g.
            `JSON.stringify(localStorage)` for the full local-storage blob).

            ### Wait for Element

            ```yaml
            - check: the heading appears
              context: [deploy]
              cdp:
                method: wait
                tab: "1"
                selector: h1
              timeout: 60s        # default 30s — shared #Op modifier, sibling of cdp:
            ```

            Polls with CDP until the CSS selector matches an element.

            ### Raw CDP Command

            ```yaml
            - run: navigate via a raw CDP method
              context: [deploy]
              cdp:
                method: raw
                tab: "1"
                http_method: Page.navigate           # the raw CDP protocol method
                params: '{"url":"https://example.com"}'   # its JSON params blob
            ```

            Sends an arbitrary CDP method with optional JSON params — `http_method:` names the
            CDP protocol method (the input's `method:` is always the verb method `raw`), `params:`
            carries the JSON args. Returns the raw CDP response.

            ## CDP Connection Diagnostics

            When a `cdp:` step fails to connect, the plugin's `diagnoseCDP()` routine runs automatically and provides targeted hints:

            1. **Chrome process check**: Is Chrome running inside the container? (`pgrep chrome`)
            2. **Proxy status**: Is the cdp-proxy forwarding to Chrome? (`supervisorctl status cdp-proxy`)
            3. **Port binding**: Is Chrome listening on 127.0.0.1:9223? Is cdp-proxy listening on 0.0.0.0:9222? (`ss -tlnp`)

            Hints direct users to relaunch Chrome with a `wl: exec` step running `chrome-wrapper` (the `wl:` verb dispatches out-of-process via `candy/plugin-wl`) — not `charly shell` with bare `swaymsg`, which may lack the correct `SWAYSOCK` path.

            ## browser-open Script and BROWSER Env

            Images with Chrome include a `browser-open` script and set `BROWSER=browser-open` in the environment. When CLI tools inside the container call `xdg-open` or use the `$BROWSER` variable to open a URL, it routes through CDP to open the URL in the running Chrome instance.

            ## OAuth Automation Example

            Complete flow for deploying openclaw with Codex OAuth. **All browser interactions must be VNC-visible** — deliver pointer clicks on the OAuth pages through the `vnc:` verb.

            **Critical:** The `openclaw models auth login` TUI requires a real terminal. Do not pipe or redirect it. Use the typed persistent terminal provider (see `/charly-automation:tmux`).

            The cdp/vnc interactions are authored as ordered plan steps and run with
            `charly check live <image> --filter cdp --filter vnc`; the surrounding host
            orchestration (`charly agent terminal`, `charly service`, `charly shell`) is a separate surface,
            unaffected by the verb externalization:

            ```bash
            IMG=sway-browser-vnc   # any image composing chrome-cdp + a Wayland desktop + VNC
            RUN=0198f140-6b7a-7b90-8a10-aabbccddee02
            TARGET='{"deployment":"sway-browser-vnc"}'
            PROFILE='{"name":"openclaw-oauth","entrypoint":["openclaw","models","auth","login","--provider","openai-codex","--set-default"],"cols":120,"rows":40,"persistence":"required","transcript":"both"}'

            # 1. Prerequisites: Chrome signed into Google with sync enabled
            #    See /charly-automation:openclaw-deploy for full Chrome sign-in procedure

            # 2. Start OAuth in a typed persistent terminal (real PTY)
            charly agent terminal launch "$PROFILE" --target "$TARGET" --run-id "$RUN"

            # 3. Read the structured screen/transcript, then drive the browser via the cdp:/vnc: steps below
            charly agent terminal snapshot "$PROFILE" --target "$TARGET" --run-id "$RUN"
            charly agent terminal transcript "$RUN"
            ```

            ```yaml
            # candy/<name>/charly.yml — the browser leg as ordered cdp:/vnc: plan steps
            plan:
                - run: open the OAuth URL captured from the TUI
                  context: [deploy]
                  cdp:
                    method: open
                    url: "${ENV_OAUTH_URL}"      # threaded in via the deploy env
                - run: click "Continue with Google" (VNC-visible)
                  context: [deploy]
                  cdp:                            # locate, then deliver the pointer via vnc:
                    method: coords
                    tab: "1"
                    selector: button._buttonStyleFix_wvuha_65
                - run: click "Continue" on the Codex consent page (VNC-visible)
                  context: [deploy]
                  cdp:
                    method: coords
                    tab: "1"
                    selector: button._primary_3rdp0_107
            ```

            ```bash
            # 6. Verify token exchange completed from typed evidence
            charly agent terminal snapshot "$PROFILE" --target "$TARGET" --run-id "$RUN"
            # Expected: "OpenAI OAuth complete", "Default model set to openai-codex/gpt-5.4"

            # 7. Restart gateway
            charly service restart $IMG openclaw
            charly shell $IMG -c "openclaw models status"
            ```

            **Tested selectors** (OpenAI auth page):
            - "Continue with Google": `button._buttonStyleFix_wvuha_65` (first matching social button)
            - "Continue" (consent): `button._primary_3rdp0_107` (black primary button)
            - These are CSS class selectors specific to OpenAI's auth UI — may change over time

            Key enablers:
            - `charly agent terminal launch` provides a real persistent terminal for the TUI (see `/charly-automation:tmux`)
            - the `cdp:` verb finds elements by CSS selector; the `vnc:` verb delivers the pointer click (visible to user)
            - `cdp-proxy` makes Chrome DevTools accessible from host through podman bridge networking (with Host header rewriting)
            - `shm_size: 1g` prevents Chrome from crashing due to /dev/shm exhaustion
            - Callback at `localhost:1455` is container-internal (no port mapping needed)

            **Stale port 1455:** If a previous OAuth attempt left port 1455 occupied, kill the stale holder: `charly shell $IMG -c 'kill -9 $(ss -tlnp sport = :1455 | grep -oP "pid=\K\d+")'`. If the surviving owner is a live agent run, treat it as an incident instead (per R1): preserve its evidence, complete RCA, and apply an explicit recovery decision.

            Source: `candy/plugin-cdp`.

            ## Google Sign-In Automation

            Sign into a Google account inside a running container. Requires `GMAIL_USER` and `GMAIL_PASSWORD` environment variables (set in `.env` or passed via `-e`).

            **App Passwords required:** Google accounts with 2FA (now mandatory for most accounts) require a 16-character [App Password](https://myaccount.google.com/apppasswords). App Passwords bypass all verification challenges and 2FA prompts — use them by default for automated sign-in.

            **Fresh profile prerequisite:** A fresh `chrome-data` volume triggers Chrome's first-run flow. Use `charly remove <image> --purge` before `charly config` to ensure a clean start. Just rebuilding the image does not reset named volumes.

            The sign-in flow is authored as ordered `cdp:`/`vnc:`/`wl:` steps and run with
            `charly check live <image> --filter cdp --filter vnc --filter wl`. `chrome://` pages
            block CDP mouse events, so the pointer is delivered through the surviving `vnc:`/`wl:`
            verbs; text is entered with the `vnc:` verb's real keysym events.

            ### Step 0: Dismiss Chrome First-Run Dialog

            On a fresh profile, Chrome opens a first-run dialog ("Make Google Chrome the default browser") as a **separate window** that CDP cannot see (no debuggable tabs). It tiles alongside any CDP-opened tabs in sway, breaking coordinate translation. Focus and dismiss it with `wl:` steps (sway IPC + a key press):

            ```yaml
            - run: focus the first-run dialog (typically the left window)
              context: [deploy]
              wl:
                method: sway-msg
                command: focus left      # sway-msg's argv rides wl's `command:` field
            - run: press OK to dismiss the dialog
              context: [deploy]
              wl:
                method: key
                key: Return
            ```

            After dismissal, Chrome shows `chrome://intro/` — "Sign in to Chrome" with shadow DOM buttons.

            ### Step 1: Click "Sign in" on chrome://intro

            `chrome://` pages block CDP mouse events and JS `.click()`. Locate the button with
            `cdp: coords` (shadow DOM path: `intro-app` > `sign-in-promo` > `#acceptSignInButton`),
            then deliver the click via the `vnc:` verb at the reported desktop center:

            ```yaml
            - check: the sign-in button is located
              context: [deploy]
              cdp:
                method: coords
                tab: "1"
                selector: "#acceptSignInButton"
            ```

            This opens a new tab with the Google sign-in page (conventionally tab `1`). The tab
            ID survives Google's same-tab navigations (email → password → result).

            ### Step 2: Enter Email (locate via CDP, deliver via VNC)

            ```yaml
            - check: the email field appears
              context: [deploy]
              cdp:
                method: wait
                tab: "1"
                selector: "#identifierId"
              timeout: 30s
            - check: the email field is located (focus via vnc: at these coords)
              context: [deploy]
              cdp:
                method: coords
                tab: "1"
                selector: "#identifierId"
            ```

            After focusing the field with `vnc: click` at the reported coords, type with the
            `vnc:` verb's real keysym events (a `vnc: type` step with `text: "${ENV_GMAIL_USER}"`). Use
            `cdp: coords` to inspect element position in all three coordinate systems (viewport,
            desktop via CDP, desktop via sway) for debugging.

            ### Step 3: Submit Email

            Click `#identifierNext` (locate via `cdp: coords`, deliver via `vnc:`), then verify the
            transition:

            ```yaml
            - check: the password challenge page is reached
              context: [deploy]
              cdp:
                method: url
                tab: "1"
              stdout:
                contains: challenge/pwd
            - check: a verification screenshot is captured
              context: [deploy]
              cdp:
                method: screenshot
                tab: "1"
                artifact: /tmp/step3.png
                artifact_min_bytes: 5000
            ```

            ### Step 4: Enter Password

            ```yaml
            - check: the password field appears
              context: [deploy]
              cdp:
                method: wait
                tab: "1"
                selector: input[type="password"]
              timeout: 15s
            - check: the password field is located (focus via vnc:, then vnc: type "$GMAIL_PASSWORD")
              context: [deploy]
              cdp:
                method: coords
                tab: "1"
                selector: input[type="password"]
            ```

            ### Step 5: Submit Password

            Click `#passwordNext` (locate via `cdp: coords`, deliver via `vnc:`), then capture
            verification screenshots — `cdp: screenshot` for the viewport and a
            `vnc: screenshot` step for the full desktop (catches native dialogs).

            ### Step 6: Enable Sync (chrome://sync-confirmation)

            After successful sign-in, Chrome navigates to `chrome://sync-confirmation/` — a `chrome://` page (NOT a native dialog). CDP can see it but the click must be delivered via `vnc:` (locate via `cdp: coords` on `#confirmButton`, "Yes, I'm in").

            Shadow DOM path: `sync-confirmation-app` > `#confirmButton`. Other buttons: `#notNowButton` ("No thanks"), `#settingsButton` ("Settings").

            ### Handling Challenges

            **2FA/CAPTCHA:** Take a VNC screenshot (a `vnc: screenshot` step) and complete manually via a VNC client. App Passwords bypass most challenges.

            **Search engine choice:** May appear as a new tab. Probe for it with a `cdp: list` step and select Google via a shadow DOM `cdp: coords` + `vnc:` click if present.

            ### Sign-In Persistence

            Cookies and sync state are stored in the `chrome-data` volume (`~/.chrome-debug`), persisting across container restarts. Use `charly remove <image> --purge` to clear for a fresh start.

            ### Coordinate Translation for Sign-In

            Pointer delivery via the `vnc:`/`wl:` verbs is essential for the sign-in flow:
            - **`chrome://` pages** (intro, sync-confirmation): CDP mouse events and JS `.click()` are blocked. `vnc: click` / `wl: click` (locate via `cdp: coords`) is the only way to click.
            - **Google sign-in pages**: real pointer events delivered via `vnc:` bypass anti-automation detection.
            - **Coordinate math**: viewport center + `window.screenX` + `window.screenY` + `chromeHeight` = desktop coords. On popup windows (no toolbar), `chromeHeight=0`. The `cdp: coords` step already reports the desktop center, so the `vnc: click` / `wl: click` step takes those `x:`/`y:` directly.

            Use a `cdp: coords` step to debug coordinate translation. It shows element position in viewport, desktop (via CDP), and desktop (via sway) systems.

            ## SPA Remote Desktop Interaction (`cdp: spa-*`)

            The `cdp: spa-*` methods provide first-class support for interacting with Selkies-style remote desktop SPAs. These bypass the local compositor and Chrome shortcut handlers — the **only way** to send Super+e, Ctrl+T, or Alt+F4 to the remote desktop.

            ### SPA DOM Structure

            - **`input#overlayInput`** (z-index 3, opacity 0, pointer-events: auto) — invisible input overlay capturing all events
            - **`canvas#videoCanvas`** (z-index 2, pointer-events: none) — H.264 video render surface
            - **Header controls** (fullscreen, gaming mode) — hidden at left=-132px, slide in on mouse hover

            ### Usage Example

            ```yaml
            - check: the SPA is in a healthy state
              context: [deploy]
              cdp:
                method: spa-status
                tab: "1"
            - run: click at canvas coordinates (where elements appear in CDP screenshots)
              context: [deploy]
              cdp:
                method: spa-click
                tab: "1"
                x: 990
                y: 375
            - run: type text (bypasses local compositor — no double-char issue)
              context: [deploy]
              cdp:
                method: spa-type
                tab: "1"
                text: hello world
            - run: send super+e to open a foot terminal in labwc
              context: [deploy]
              cdp:
                method: spa-key-combo
                tab: "1"
                text: super+e          # also: ctrl+t (new tab in REMOTE Chrome), alt+f4 (close window)
            - run: send a special key
              context: [deploy]
              cdp:
                method: spa-key
                tab: "1"
                text: return           # also: escape, F1-F12, etc.
            ```

            See `/charly-check:check` for the precise SPA-method modifier shape.

            ### Coordinate Scaling

            The SPA maps mouse events from canvas to remote desktop with an internal scaling factor; `cdp: spa-click` / `cdp: spa-mouse` apply the correction so a click at canvas position `(x, y)` lands on the right remote-desktop pixel. Determine the scale empirically by comparing the `cdp: spa-click` cursor position (via a `cdp: screenshot`) with the target.

            ### Keyboard Architecture

            `cdp: spa-type` / `cdp: spa-key` / `cdp: spa-key-combo` send `Input.dispatchKeyEvent` directly to the page. The SPA's `onkeydown` handler on `#overlayInput` (with `stopImmediatePropagation`) captures these and forwards to the remote compositor via WebSocket. Only keyDown + keyUp are sent (no "char" event) to prevent double input.

            ### When to use `spa` vs regular CDP vs VNC/WL

            | Scenario | Verb |
            |----------|------|
            | Click/type in a web page | `cdp: click` / `cdp: type` (CSS selector targeting) |
            | Click/type in a remote desktop via SPA | `cdp: spa-click` / `cdp: spa-type` (canvas coordinates) |
            | Send Super+key or Ctrl+T to remote desktop | `cdp: spa-key-combo` (only option that works) |
            | Click in local compositor | `wl: click` or `vnc: click` |
            | Take screenshot of stream content | `cdp: screenshot` (captures canvas) |
            | Take screenshot of full client desktop | `vnc: screenshot` or `wl: screenshot` |

            ## CDP Proxy Verification

            Author `cdp: status` → `cdp: open` → `cdp: eval` steps to verify proxy connectivity
            on an instance, then run `charly check live <image> -i <instance> --filter cdp`:

            ```yaml
            - check: CDP is available on port 9222
              context: [deploy]
              cdp: status
              stdout:
                equals: ok
            - run: open a test page
              context: [deploy]
              cdp:
                method: open
                url: https://ip.me
            - check: the proxy IP is reflected by the page
              context: [deploy]
              cdp:
                method: eval
                tab: "1"
                expression: document.querySelector('#ip-lookup').value
              stdout:
                contains: 198.145.102.110
            ```

            This pattern works for any page content extraction via JS — the `cdp: eval` step returns the expression's result directly.


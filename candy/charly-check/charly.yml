            - `/charly-check:wl` -- Wayland desktop automation via the declarative `wl:` verb served out-of-process by `candy/plugin-wl` (sibling verb; also the `wl:` sway-* methods for compositor control); takes desktop-absolute coords (use a `cdp: coords` step to translate viewport→desktop).
            - `/charly-check:vnc` -- VNC desktop automation via the declarative `vnc:` verb served out-of-process by candy/plugin-vnc (same container, pixel-level interaction); takes desktop-absolute coords (use a `cdp: coords` step to translate viewport→desktop).
            - `/charly-check:dbus` -- D-Bus calls and notifications via the declarative `dbus:` verb served out-of-process by `candy/plugin-dbus`.
            - `/charly-core:shell` -- Running commands in containers (`--tty` for OAuth flows)
            - `/charly-core:charly-config` -- Instance deployment, proxy configuration, removal workflow
            - `/charly-image:layer` -- Chrome candy configuration (cdp-proxy service, port declarations)
            - `/charly-selkies:selkies-labwc` -- Full SPA DOM structure, coordinate mapping, session resilience
            - `/charly-selkies:chrome-devtools-mcp` -- MCP-based browser automation via Streamable HTTP
            - `/charly-selkies:chrome` -- Chrome candy with cdp-proxy, env_accept (HTTP_PROXY)

            ## When to Use This Skill

            **MUST be invoked** when the task involves the `cdp:` check verb, Chrome DevTools Protocol, browser automation, clicking elements, taking screenshots, or OAuth flows inside containers. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Desktop automation. Use after a desktop container is running. Preferred over VNC for structured interaction. See also `/charly-check:vnc` (pixel), `/charly-check:wl` (sway subgroup) (window).

check-skill:
    skill:
        name: check
        family: check
        owner: charly-check
        description: |-
            MUST be invoked for every `charly check` mode, candy or box plan authoring,
            disposable test beds, R10 runs, agent grading, baked plan labels, or check
            operation. Covers image/live/run, the plugin-provided live probe verbs,
            deterministic verb catalog, runtime variables, overlays, plan inclusion,
            cross-deployment probing, and the bounded AI-iteration harness.
        triggers:
            - "`charly check *` (ANY check verb, incl. `charly check box`) / `charly check run <bed>` (the disposable-deploy R10 bed) / authoring `disposable: true` check beds / `charly check live` / the probe verbs (cdp/wl/dbus/vnc/mcp/record/spice/libvirt) / `iterate:` AI-agent scoring / `plan:` step authoring / `charlycheck/*` branches"
            - "Agent Driven Evaluation (ADE) / `charly box feature run` / `charly check feature run` / `charly feature list/pending/validate` / authoring a candy's `plan:` + `description:` string / the agent grader for `agent-check:` steps"
            - "the `adb:` check verb / Android Debug Bridge probing from a candy/box plan (out-of-process plugin; devices, shell, install, getprop, screencap, logcat, wait-for-device)"
            - "the `appium:` check verb / Android UI automation (out-of-process plugin) / W3C WebDriver sessions, element introspection, the gesture/app/key/device sugar groups, the generic `execute`/`raw` escape hatch"
            - "Verify a cutover by running the R10 beds (drive `charly check run <bed>`)"
            - "Evaluate/audit a deployment config (image or deploy, yours)"
        content: |
            # Check — unified declarative + AI-iteration evaluation

            ## Overview

            `charly` ships a goss-inspired declarative testing framework built into the
            CLI. Plan steps — each one intent keyword (`run:`/`check:`/`agent-run:`/
            `agent-check:`/`include:`) carrying prose, plus at most one verb-position key for
            `run:`/`check:` — are authored as an ordered unnamed list under `plan:` inside a
            `candy:` entity (layer or image) in `charly.yml`; an optional `id:` names a step.
            They are baked into the `ai.opencharly.description` OCI label
            (`LabelDescriptionSet`, which carries the collected plan steps with
            `candy:`/`box:`/`deploy` origin annotations) so any pulled image is self-testable
            without its source repo. A local `charly.yml` overlay can add steps or override
            baked ones by `id:`. The runner resolves deploy-time variables (actual host port
            mappings, volume backings, env vars, container IP, DNS) at execution time, so a
            check written once works unchanged when `charly.yml` remaps ports.

            The surface is three orthogonal verbs: **`charly check box <image>`** evaluates
            the built image artifact in an isolated disposable container (build-context
            `check:` steps only); **`charly check live <name>`** evaluates a running
            deployment (deploy-context steps too, with full runtime-variable resolution);
            **`charly check run <bed>`** runs a `disposable: true` R10 deploy end to end —
            or, when the bed carries an `iterate:` block, drives an AI runner through
            plateau-bounded iterations instead. Mode is explicit in the verb; there is no
            autodetect. Full detail: `references/beds-and-r10.md`.

            Agent Driven Evaluation (ADE) runs an entity's own baked plan as acceptance
            tests: a `check:` step's inline verb is graded deterministically, while an
            `agent-check:` step (prose only) is graded by an AI agent via `charly box/check
            feature run`. Every candy MUST ship a non-empty `description:` + at least one
            deterministic `check:` step (`charly box validate` enforces it); the live agent
            grader stays opt-in. Full detail: `references/authoring-gotchas.md`.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Pure-box check (disposable, build-context) | `charly check box <image>` | Candy + box sections only, in `podman run --rm` (no host port mappings, no volumes attached) |
            | Live full-stack check (running deployment) | `charly check live <name> [-i instance]` | All three sections run via `podman exec` / SSH / nested chain, with full runtime variable resolution |
            | R10 bed (full sequence) | `charly check run <bed>` | Build → check image → deploy → check live → fresh update → tear down on a `disposable: true` deploy (ONE bed per invocation). Canonical R10 gate; for a whole roster fan the short beds out via `/verify-beds` and own each long bed (`vm`/`android`, or last run ≥600s) as a persistent-session `run_in_background` task |
            | AI iteration loop | `charly check run <bed>` | Drives an AI through plateau-bounded iterations against a bed carrying an `iterate:` block |
            | Validate authored tests at config time | `charly box validate` | Schema, context/variable consistency, id uniqueness |
            | Inspect effective spec | `charly box inspect <image>` | JSON includes merged check structure |
            | Filter by verb | `charly check live <name> --filter file --filter port` | Repeatable |
            | Filter by section | `charly check live <name> --section deploy` | One of: candy / box / deploy |
            | Output format | `charly check live <name> --format json\|tap\|text` | Default text |

            ## Reference index

            Detail lives in sibling `references/*.md` files, loaded on demand:

            | Topic | Reference | Covers |
            |---|---|---|
            | Disposable beds, R10 acceptance gate | `references/beds-and-r10.md` | The bed roster, the "R10 gate by change class" matrix (sole owner), the 11 Testing Standards, "Flag discipline" (sole owner), exit codes, the three primary modes, wall-clock/timing data |
            | Deterministic verb catalog | `references/verb-catalog.md` | The `plan:` authoring model, the file/package/service/port/process/command/http/... verb catalog, shared modifiers, matcher forms, verb routing (executor selection), runtime variables, `charly.yml` overlay rules |
            | Live-container probe verbs | `references/live-probe-verbs.md` | The out-of-process `cdp`/`wl`/`dbus`/`vnc`/`mcp` verbs — method allowlists, worked examples, artifact-validation modifiers |
            | Authoring gotchas, ADE, AI harness | `references/authoring-gotchas.md` | Agent Driven Evaluation (the six-stage loop, the agent-grader contract), the 12 numbered authoring gotchas, the AI-iteration harness pgrep-deadlock defense |
            | Cross-deployment probing | `references/cross-deployment-probing.md` | Image preflight (host-target runs), venue-from-position members, `${HOST:...}` addressing, the pod→pod and host→pod/VM worked examples |

            ## Related skills

            - **Live-container probe verbs — ALL out-of-process** — the `wl:` Wayland verb (`/charly-check:wl`), the `cdp:` Chrome-DevTools verb (`/charly-check:cdp`), the `vnc:` VNC-framebuffer verb (`/charly-check:vnc`), the `dbus:` D-Bus verb (`/charly-check:dbus`), the `mcp:` MCP-protocol verb (`/charly-build:charly-mcp-cmd`), the `record:` recording verb (`/charly-check:record`), the `kube:` cluster-probe verb (`/charly-kubernetes:check-k8s`), the `adb:` ADB verb (`/charly-check:adb`), the `appium:` Android-UI verb (`/charly-check:appium`), the `spice:` SPICE-wire verb (`/charly-check:spice`), and the `libvirt:` VM-probe verb (`/charly-check:libvirt`) are NOT host `charly check` subcommands — each is a declarative check verb served out-of-process by its plugin (`candy/plugin-wl`, `candy/plugin-cdp`, `candy/plugin-vnc`, `candy/plugin-dbus`, `candy/plugin-mcp`, `candy/plugin-record`, `candy/plugin-kube`, `candy/plugin-adb`, `candy/plugin-appium`, `candy/plugin-spice`, `candy/plugin-vm`). See `references/live-probe-verbs.md`.
            - `/charly-image:layer` — layer authoring; the ordered `plan:` step list is part of every `charly.yml`.
            - `/charly-image:image` — image-level plan steps at composition time.
            - `/charly-core:deploy` — local `charly.yml` overlay rules and the plan-step merge.
            - `/charly-build:validate` — static schema + cross-scope variable checks; the first
              gate before `charly box build`.
            - `/charly-build:build` — how check entries are embedded into the OCI label at build
              time; LABELs-at-end cache behavior.
            - `/charly-build:inspect` — view the merged plan / description structure as JSON.
            - `/charly-build:migrate` — `charly migrate` brings legacy configs up to the
              current schema (one flat ordered `plan:` list per entity).
            - `/charly-internals:go` — implementation map. Core keeps the check-harness
              host seams + verb-catalog semantics: `checkspec.go` (`opActsInBuildDeploy`),
              `planrun_adapter.go` (the op-context grammar `opEffectiveContexts`/`opInContext`
              + `hostVerbResolver`/`hostCheckCarrier`), `checkrun.go` (verdict helpers +
              committed-APK anchoring data), `checkrun_charly_verbs.go`,
              `check_endpoint_resolve.go`, `check_graphics_endpoint.go`, `checkrun_act.go`,
              `check_venue_resolve.go`, `provider_checkenv.go`, the `host_build_check_*.go`
              check seams (`host_build_check_load_plugins.go`, `host_build_check_bed_gpu_prereq.go`),
              plus the `LabelDescriptionSet` type in `labels.go`. The
              op-level check validation (`validateOps` / `validateCheck`) moved out of core
              to `candy/plugin-box/validate_check.go`. The
              `charly check` CLI + AI-iteration harness (the management Cmds, the iteration
              loop, the watchdog, clone/note/synccreds/runlocal) + EVERY check-run mode body
              (box/live/feature-live/feature-box/score/preflight) live in the compiled-in
              `command:check` plugin `candy/plugin-check/` (the former "check-run" HostBuild
              seam is DELETED, K-wave 2 cone R4).
            - `/charly-internals:generate-source` — how `LabelDescriptionSet` is written into the Containerfile
              via `writeJSONLabel`, and why the LABEL block lives at the end of the
              final stage.
            - `/charly-internals:capabilities` — the `ai.opencharly.description` label (`LabelDescriptionSet`) carrying the baked plan is
              part of the same capability contract as `LabelService`.
            - `/charly-internals:agents` — the sub-agents (`check-bed-runner`,
              `deploy-verifier`) and dynamic workflows (`/verify-beds`,
              `/audit-deploy-configs`) that drive these beds, and the R10/disposable/
              paste-proof rules that bind any agent or workflow running `charly check run`.
            - `/charly-internals:plugin` — a `check:` step's `<word>: <input>` verb sugar dispatches
              to a plugin-provided verb (built-in or out-of-tree); the desugared internal input is
              validated at runtime against the plugin's served CUE schema before `runPluginVerb`
              invokes it.

            ## When to Use This Skill

            **MUST be invoked** before authoring, running, or debugging check
            behavior at any level. Triggers: `charly check` (any subcommand), `charly check
            run`, `charly check box`, `charly check live`, the plan steps / `description:`
            field in a candy/box `charly.yml`, the disposable test-bed deploys, the
            `ai.opencharly.description` OCI label, `kind: agent` (the agent grader) or a
            `disposable: true` deploy (+ its `iterate:` block),
            `charly check run <bed>` (disposable R10 deploys; roster fan-out via `/verify-beds`), or any check
            verb by name (file/port/http/command/package/service/cdp/wl/dbus/vnc/mcp/...).
        references:
            - name: authoring-gotchas
              content: |
                  # Authoring gotchas, ADE, and the AI-iteration harness

                  Full detail for `/charly-check:check`: Agent Driven Evaluation (the agent-graded steps + the six-stage loop), the numbered non-obvious authoring gotchas, and the AI-iteration harness's pgrep-deadlock defense.

                  ## Agent Driven Evaluation (ADE) — `charly box/check feature run` + the agent grader

                  ADE runs an entity's own baked plan (shipped in the
                  `ai.opencharly.description` OCI label) as acceptance tests. It is named for the
                  agent that drives the evaluation: an `agent-check:` step is graded by an AI
                  agent, and the agent's verdicts drive the red→green loop. `charly check box` /
                  `charly check live` and `charly box/check feature run` read the same baked
                  plan — `charly check box`/`live` run its deterministic `check:` steps, while
                  `charly box/check feature run` also bind the `agent-check:` (and `agent-run:`)
                  steps to the agent grader.

                  ### The six-stage loop

                  | Stage | Who | Command | What |
                  |---|---|---|---|
                  | **Specify** | you / an agent | hand-edit the candy's `plan:` list (or `charly box set candy.<name>.plan ...`) | Author the `description:` string + `plan:` steps on the CANDY that provides the behaviour (it bakes into every box that composes the candy — R3). |
                  | **Bind** | author (implicit) | `charly feature pending <entity>` lists the agent-graded steps | Use a `check:` step (inline verb) → deterministic; use an `agent-check:` step (prose) → agent-graded. |
                  | **Run** | you / CI | `charly box feature run <image>` / `charly check feature run <deployment>` | Execute the plan; per-step pass/fail + grader evidence. |
                  | **Iterate** | you / an agent | edit + re-run, OR `charly check run <bed>` (an `iterate:` bed) | Drive red→green by hand, or let the plateau-bounded AI loop write the code until the `check:` steps pass. |
                  | **Bake** | the build | `charly box build` | `description:` + plan steps bake into `ai.opencharly.description`; runs source-less against a pulled image. |
                  | **Gate** | R10 | `charly check run <bed>` | Runs the bed image's deterministic `check:` steps — every candy ships them (ADE authoring is mandatory: `charly box validate` requires a non-empty `description:` string and at least one deterministic `check:` step). The live agent grader via `charly check feature run` stays opt-in. |

                  ### The BIND contract — a step binds to its verifier by shape

                  ```yaml
                  # candy/<name>/charly.yml — description: + the ordered plan: list, all inline
                  # in the candy body (the ONE flat operational sequence)
                  dashboard:
                      candy:
                          description: Dashboard          # the candy's purpose; first line = summary
                          plan:
                              - check: the page title is Dashboard   # inline verb → deterministic
                                id: dashboard-title
                                cdp:
                                    method: eval
                                    expression: document.title
                              - agent-check: the chart looks populated, not empty   # prose-only → agent-graded
                  ```

                  A `check:` step carries an embedded probe verb (`file`/`http`/`command`/`cdp`/
                  `mcp`/…) and runs that check deterministically. An `agent-check:` step carries
                  only prose and binds to the agent grader. `charly feature pending` lists every
                  `agent-run:`/`agent-check:` step so an author sees the agent-graded work.

                  ### The two run verbs

                  - **`charly box feature run <image>`** — build context. A disposable container
                    (`podman run --rm` per check), deterministic `check:` steps only. An
                    `agent-check:`/`agent-run:` step has no stable target to probe, so it reports
                    unbound (advisory skip; `--strict` fails it). Resolves the image against local
                    storage (never `charly.yml`), like `charly check box`.
                  - **`charly check feature run <deployment>`** — deploy context. Against a running
                    image-backed (pod) deployment; deterministic `check:` steps run their checks and
                    `agent-check:` steps bind to the agent grader (unless `--no-agent`). Flags:
                    `-i/--instance`, `--format text|json|tap|junit`, `--tag <expr>`,
                    `--agent <name>`, `--timeout <dur>`, `--no-agent`, `--strict`.

                  Exit codes follow the 0/1/2 convention (a step fail → exit 2 via the sdk's
                  `CheckFailExitCode`; an infra error → 1). No plan baked → a no-op pass.

                  ### The agent grader contract

                  For a prose-only step (when grading is enabled), the runner spawns the
                  configured `kind: agent` CLI once (bounded — never the plateau loop), handing it the
                  entity's `description:`, the step's prose, the live
                  target name, and the instruction that it may probe via `charly cmd <target> …`,
                  `charly check live <target> --filter <verb>`, `charly status <target>`. The agent returns a
                  single-line JSON verdict `{"verdict":"pass|fail","evidence":"…"}`; the runner
                  parses it (plain or `stream-json`) into a pass/fail with evidence. An
                  unparseable / timed-out / launch-failed grader is a fail with the raw output
                  — never a silent pass. The grader wall-clock cap is `--timeout` → the ai entry's
                  `timeout:` → a 5m default. Which agent: `--agent <name>` → the sole configured `agent:`
                  entry → an explicit "specify --agent" error.

                  `--no-agent` is the deterministic-only mode (CI): `agent-check:` steps report
                  `unbound` (visible, never silently green). The unattended `charly check run <bed>`
                  gate runs `charly check feature run <bed> --no-agent` so a bed stays deterministic and
                  free; exercise the live grader with an explicit `charly check feature run <name>`.

                  ### Worked example (end to end)

                  ```bash
                  # 1. Author plan steps on the layer that provides the behaviour.
                  $EDITOR candy/web-layer/charly.yml    # add a `check:` step (cdp: eval) +
                                                        # an `agent-check:` prose step

                  # 2. See the agent-graded steps.
                  charly feature pending candy:web-layer

                  # 3. Build → run build-context acceptance (deterministic steps).
                  charly box build web
                  charly box feature run web

                  # 4. Deploy, then run deploy-context acceptance with the agent grader.
                  charly start web
                  charly check feature run web                # agent-check steps agent-graded against the live pod
                  charly check feature run web --no-agent     # deterministic-only (CI): agent-check steps report unbound
                  ```

                  Implementation: `candy/plugin-check/feature_cmd.go` (`CheckFeatureRunCmd`) + `feature_run_gather.go` + `feature_box_gather.go` (the `charly box feature run` engine — the former `charly/check_feature_run.go` is DELETED, K-wave 2), `sdk/kit/grader.go`
                  (`AgentGrader` + `RunAgentOnce` + `parseVerdict`, moved from `charly/check_feature_grader.go` (now `sdk/kit/grader.go`)
                  in P12a — core constructs `&AgentGrader{}` directly, so it lives in `kit`, reachable from
                  core code), and `sdk/deploykit/description_collect.go` (`CollectDescriptions`; the former `charly/description_collect.go` is DELETED, K-wave 2) for the `charly feature
                  list/pending/validate` surface. The `Runner.Grader` dispatch is `kit.RunPlan` (`sdk/kit/planrun.go`)
                  directly — the former 1-line `charly/description_run.go` wrapper was dissolved in P12a.
                  Target resolution is shared with the harness loop and `charly check box`/`live` (R3).

                  ## Authoring Gotchas (learned the hard way)

                  These are the non-obvious issues that surface only when you run the tests
                  against real containers. Skim before writing new checks.

                  ### 1. Host-side deploy tests: `127.0.0.1:${HOST_PORT:N}`, not `${CONTAINER_IP}:${HOST_PORT:N}`

                  In rootless podman, the container's pod-network IP (e.g. `10.89.0.x`) is
                  not routable from the host. `${HOST_PORT:N}` resolves to a port on the
                  host's loopback that forwards into the container. Combining them is
                  nonsense:

                  ```yaml
                  # ❌ WRONG — 10.89.0.x:HOST_PORT is unreachable from either side.
                  addr: ${CONTAINER_IP}:${HOST_PORT:8080}

                  # ✓ RIGHT — host-side access via the forwarded port.
                  addr: 127.0.0.1:${HOST_PORT:8080}

                  # ✓ ALSO RIGHT — in-container, using the container port directly.
                  command: curl -fsS http://127.0.0.1:8080/health
                  in_container: true
                  ```

                  Use `${CONTAINER_IP}` only from inside another container in the same pod.

                  ### 2. `http` status is a single int — no lists

                  ```yaml
                  # ❌ WRONG — yaml unmarshals a list to int fails with "cannot unmarshal !!seq"
                  status: [200, 301, 302]

                  # ✓ RIGHT — pick the most-likely code. Or author multiple tests.
                  status: 200
                  ```

                  For endpoints that return 400/401 when probed without auth (MCP servers,
                  API endpoints), `status: 400` is a legitimate "endpoint exists and refuses
                  empty input" check.

                  ### 3. `pgrep`, `ss`, `nc` are not in minimal images

                  The `process:`, `port: listening`, and `nc`-based command tests silently
                  fail on images that skip `procps-ng` / `iproute` / `ncat`. Portable
                  alternatives:

                  | Intent | Portable alternative |
                  |--------|----------------------|
                  | "supervisord is running" | `command: supervisorctl pid; exit_status: 0` (in_container) |
                  | "some program under supervisord" | `service: <name>; running: true` |
                  | "port N listening in-container" | `command: curl -fsS http://127.0.0.1:N/<route>; in_container: true` |
                  | "port reachable from host" | `addr: 127.0.0.1:${HOST_PORT:N}; reachable: true` (Go-native dial) |

                  ### 4. `supervisorctl status` exits 3 when any program is non-RUNNING

                  Layers like `hermes` declare `autostart=false` programs (e.g.
                  `hermes-whatsapp`), which leaves them STOPPED. `supervisorctl status`
                  returns exit 3 — fails `exit_status: 0` checks.

                  ```yaml
                  # ❌ BRITTLE — fails if any program is autostart=false.
                  command: supervisorctl status
                  exit_status: 0

                  # ✓ ROBUST — `pid` asks for supervisord's own PID, 0 iff the socket
                  # responds.
                  command: supervisorctl pid
                  exit_status: 0
                  in_container: true
                  ```

                  ### 5. Know which stream a `--version`-style command writes to

                  `charly version` writes to stdout (via `fmt.Println`) — the canonical
                  `candy/charly/charly.yml` test asserts a `stdout:` matcher.

                  ```yaml
                  plan:
                      - check: charly version prints a CalVer to stdout
                        id: charly-version
                        command: /usr/local/bin/charly version
                        exit_status: 0
                        stdout:
                            - matches: "[0-9]{4}\\.[0-9]+"
                  ```

                  But other tools genuinely write to stderr — `ssh -V`, `openssl version`,
                  some `*-config --version` scripts. Always probe first
                  (`charly cmd <image> '<cmd> 2>&1 >/dev/null'` — if the output shows up here
                  it was stderr; if silent, it's stdout). See also the `ssh-version`
                  check in `candy/ssh-client/charly.yml` which IS a real stderr case.

                  ### 6. Drop `$` anchor in `matches:` regexes on command output

                  Command stdout typically ends with `\n`. Go's `regexp` treats `$` as
                  end-of-input (not end-of-line by default), so `\.ipynb$` won't match
                  `path.ipynb\n`. Drop the anchor:

                  ```yaml
                  # ❌ WRONG — fails because trailing newline
                  stdout:
                    - matches: "\\.ipynb$"

                  # ✓ RIGHT — substring match is usually what you want
                  stdout:
                    - matches: "\\.ipynb"
                  ```

                  ### 7. `${VAR:-default}` is not supported by charly's resolver

                  charly's variable resolver accepts `${IDENT}` only — no bash-style defaults,
                  no parameter expansion. An unresolved variable is reported as a
                  `unresolved variables: <name>` SKIP.

                  ```yaml
                  # ❌ Parsed as a single var name; reported as unresolved if not set
                  command: psql -U ${POSTGRES_USER:-postgres}

                  # ✓ Plain env-var reference; resolves from the container's environment
                  # in the deploy context. For a true default, set it in the layer's `env:`.
                  command: psql -U ${POSTGRES_USER}
                  ```

                  ### 8. Fedora 43 package renames — query the installed name, not the dnf request

                  The `package:` verb does exact string equality against the rpm
                  database, not the dnf install request. When dnf resolves a virtual
                  provides, the test must name the actual installed package.

                  | dnf request | Installed name on Fedora 43 |
                  |-------------|-----------------------------|
                  | `redis` | `valkey-compat-redis` |
                  | `liberation-fonts` | `liberation-sans-fonts` (+ `-serif-fonts`, `-mono-fonts`) |

                  Always verify with `charly shell <image> -c 'rpm -qf /path/to/binary'`.

                  ### 9. Volume paths don't exist at build context

                  `/workspace`, `${VOLUME_CONTAINER_PATH:name}`, and similar paths
                  are provisioned by `charly config` at deploy time. A build-context step on
                  them fails in `charly check box` because the mount isn't attached.

                  ```yaml
                  # ❌ Fails under `charly check box` — workspace isn't mounted
                  - check: the workspace directory exists
                    id: workspace-dir
                    file:
                        file: /workspace
                        filetype: directory

                  # ✓ context: [deploy] so it runs only against live containers
                  - check: the workspace directory exists
                    id: workspace-dir
                    context: [deploy]
                    file:
                        file: /workspace
                        filetype: directory
                  ```

                  ### 10. Disposable tests run as the image's default user — not root

                  `charly check box` runs `podman run --rm <image>` with the image's USER
                  directive (typically uid 1000 for containers). Root-only files
                  (e.g. `/etc/sudoers.d/*` is root:root 0750) report as "missing" because
                  the user can't traverse the parent directory.

                  ```yaml
                  # ❌ Reports "exists=false" even though the file IS there (0750 dir)
                  - check: the charly-user sudoers drop-in exists
                    id: sudoers-charly-user
                    file:
                        file: /etc/sudoers.d/charly-user
                        exists: true

                  # ✓ Verify the semantic (can I sudo?) instead of the file bit
                  - check: the user can sudo without a password
                    id: sudoers-charly-user
                    command: sudo -n -l
                    exit_status: 0
                    stdout:
                        - contains: "NOPASSWD"
                  ```

                  **The same applies to a `vm:` bed**, where steps run as the cloud image's default
                  user (`arch`/`fedora`/`debian`/`ubuntu`) over `ssh vm sudo bash -s`. Every step that
                  drives a native package manager or writes under `/etc` must escalate explicitly —
                  `pacman-key needs to be run as root`, `dnf`/`apt-get` refusing, `Permission denied`
                  on `/etc/pacman.conf` are all this, not a repo or signing problem.

                  **`sudo` on the command does NOT cover a shell redirect**, and this is the half that
                  is easy to miss because the command itself looks elevated:

                  Wrong — the redirect is performed by the CALLING shell, still uid 1000:

                  ```sh
                  sudo echo 'deb …' > /etc/apt/sources.list.d/charly.list
                  sudo cat  > /etc/yum.repos.d/charly.repo <<'EOF'   # same trap with a heredoc
                  ```

                  Right — let the elevated process own the write:

                  ```sh
                  echo 'deb …' | sudo tee /etc/apt/sources.list.d/charly.list >/dev/null
                  sudo tee /etc/yum.repos.d/charly.repo >/dev/null <<'EOF'
                  curl -fsSL <url> | sudo gpg --dearmor -o /etc/apt/keyrings/charly.gpg
                  ```

                  Shown as shell rather than YAML on purpose: five sibling `command:` keys in one `yaml`
                  fence is rejected at line 4 by a duplicate-key-strict loader and — worse — PARSED by a
                  permissive `yaml.safe_load`, which keeps only the last key and silently discards the
                  other examples. A fenced block that a parser reads differently from a human is
                  a defect even when the fence is only illustrative.

                  **Where `sudo` comes from differs by substrate.** A cloud-image VM has passwordless
                  sudo via cloud-init, so it is simply available. A container box does NOT — a box that
                  needs in-container elevation has to install `sudo` and write its own
                  `/etc/sudoers.d/` drop-in (a candy doing exactly that should refuse if no uid-1000
                  account exists, rather than writing a rule for an account that is not there).

                  ### 11. Bootc images keep USER=root — tests must cover both modes

                  Gotcha 10 flips for bootc. `sdk/deploykit` (relocated from `charly/generate.go` in #67) deliberately omits the final `USER <uid>` directive on bootc images because systemd (PID 1 in a bootc VM) manages user sessions via login, so the container's own USER directive is irrelevant. Result: the same `charly check box` that runs as uid 1000 in a container runs as uid 0 in a bootc image.

                  That breaks any test that assumes the user-context default. A `sudo -n -l` check that expects `NOPASSWD` in the output works for non-bootc (USER=1000 → sudo lists the user's NOPASSWD rule) but fails for bootc (USER=0 → sudo prints root's Defaults block, which doesn't contain the literal string `NOPASSWD`). Same failure mode for any `test -f ~/.config/foo` that depends on `$HOME=/home/user`.

                  The fix: drop into `user` explicitly when running as root, stay as-is otherwise. Use `runuser -u user -- <cmd>` as the bridge — it's portable across util-linux versions and preserves stdout:

                  ```yaml
                  # Dual-mode: container (USER=1000) AND bootc (USER=root) both pass
                  - check: the user can sudo without a password (container AND bootc)
                    id: sudoers-charly-user
                    command: |
                        if [ "$(id -u)" = "0" ]; then
                          runuser -u user -- sudo -n -l
                        else
                          sudo -n -l
                        fi
                    exit_status: 0
                    stdout:
                        - contains: "NOPASSWD"
                  ```

                  Don't use `runuser -l user -s /bin/bash -c '…'`. On Arch's util-linux
                  (2.42+), `runuser -l … -c` swallows the wrapped command's stdout when
                  the shell is a login shell — reproduced: `runuser -l user -s /bin/bash
                  -c 'sudo -n -l'` prints nothing and exits 0; `runuser -u user -- sudo
                  -n -l` prints the full NOPASSWD listing. This bit the earlier shipping
                  form of the test; the sshd candy now uses `-u … --`.

                  Worked example: `/charly-coder:sshd` ships exactly the `-u user --` pattern. Alternative: give the step `context: [deploy]` so it runs against a live container where you control the user-switch externally.

                  ### 12. `charly check box <short-name>` is ambiguous with multiple CalVer tags — use the full registry ref

                  `charly check box` resolves its positional argument against local podman storage, not `charly.yml`. When the host has accumulated many CalVer tags for the same image (a normal consequence of iterative `charly box build` runs), the short form errors out:

                  ```
                  charly: error: ambiguous short name "openclaw-desktop" in local storage;
                             candidates: ghcr.io/opencharly/openclaw-desktop:latest,
                             ghcr.io/opencharly/openclaw-desktop:2026.109.1418,
                             ... Re-run with a full ref.
                  ```

                  Use the fully-qualified registry ref:

                  ```bash
                  charly check box ghcr.io/opencharly/openclaw-desktop:latest
                  ```

                  This is different from `charly box inspect`, `charly box build`, and `charly check live` (the live-service runner), which key off `charly.yml` and accept short names unambiguously. Only the disposable-container runner has this restriction because it does not consult `charly.yml` at all.

                  ## Issue 52328 (claude-code Bash + pgrep self-match deadlock) defense

                  The Claude Code runtime has a known issue documented in this project's
                  own `.check/ISSUE-claude-code-bash-pgrep-self-match-deadlock.md`: when
                  the AI uses `Bash{run_in_background: true}` with a `until ! pgrep -f
                  "<pattern>"` poll-loop, the literal pattern string is preserved in the
                  spawned bash's argv (because the wrapper uses `bash -c '… check
                  "<command>" …'`). `pgrep -f` then matches itself, the loop spins
                  forever, the parent `claude -p` process can't exit because it waits
                  for all background bash subprocesses, and the harness orchestrator
                  deadlocks waiting on claude.

                  The harness defends against this pattern between iterations: at every
                  iter end (in `candy/plugin-check/harness_loop.go`'s per-iteration commit), the
                  orchestrator runs
                  `podman exec charly-check-sandbox pkill -f "while true.*sleep [0-9]+"` to
                  clean up orphaned keepalive bashes left dangling by the AI's
                  `TaskOutput`-timeout pattern, and logs the kill count.

                  Workaround for the AI inside the loop: prefer `kill -0 <PID>`-style
                  checks (track the original PID via `cmd & echo $!`) over `pgrep -f`
                  when the pattern would also match the wrapping bash. The harness
                  defense is a safety net, not a license to use the broken pattern
                  deliberately.

                  ### 13. A step is SIGKILLed at 90s unless it declares `timeout:`

                  `ProbeNeverHang` (`sdk/kit/runner.go`) bounds every probe ATTEMPT at
                  `runnerProbeNeverHangFallback` = **90 seconds**. A step that runs longer is killed,
                  and the runner names the bound in the message — but the underlying exec-layer text is
                  still `process terminated by signal (signal: killed)`, which describes the mechanism
                  of death and not its cause. Read alone, it looks like the command crashed.

                  What crosses 90s in practice: **installing charly from a published distro repo pulls
                  ~190 packages** (podman, qemu, libvirt, gnupg, tailscale). On a 2-vCPU cloud-image VM
                  `dnf install` does not finish in time while `pacman -S` does — so two beds differing
                  only in package manager come out one green and one "killed", which invites a
                  distro-specific theory (repo layout, signing, cloud image) when the variable is
                  elapsed time against a shared floor. **Compare the step's duration to 90s before
                  theorising about the distro.**

                  The fix is authored, not code: `#Op` carries `timeout?: #Duration`, and
                  `ProbeNeverHang` honours a longer authored value over the floor (the effective
                  ceiling becomes `declared + 30s`). Declaring it is USING the mechanism's own
                  parameter — not an R4 workaround:

                  ```yaml
                  - check: dnf install charly installs the package
                    id: fedora-charly-installed
                    timeout: 10m          # ~190 packages on 2 vCPUs; the 90s floor kills this
                    exit_status: 0
                    command: |
                        sudo dnf install -y charly &&
                        rpm -q charly
                  ```

                  ### 14. A check must be able to FAIL for the reason it names

                  Four ways a step passed while measuring nothing, all found in one bed roster:

                  - **`test "$(a)" = "$(b)"` with both sides empty PASSES.** A version comparison whose
                    extraction was wrong for its tool (`apk info -v <pkg>` prints the package
                    DESCRIPTION, not `name-version-rN`) compared `""` with `""` and reported success.
                    Guard both sides — `test -n "$installed" && test -n "$packaged"` — and `echo` the two
                    values so a failure is diagnosable.
                  - **`apk update` / `apt-get update` / `pacman -Sy` exit 0 when a configured repo is
                    unreachable** (they warn and carry on), so none of them proves the repo resolved.
                    Prove the package is VISIBLE from a repo only that repo could serve
                    (`apk list <pkg>` / `pacman -Si <pkg>` / `apt-cache policy` showing a Candidate).
                  - **An installer's exit code is not registration.** Follow it with `apk info -e` /
                    `pacman -Q` / `rpm -q` / `dpkg-query -W`.
                  - **`<cmd>` on PATH inside a check may be the check runner's own STAGED binary**, not
                    the one the package installed. A check about a PACKAGED binary must name the
                    package's absolute path (`/usr/bin/charly version`), or it can pass with the package
                    absent entirely.

                  And query the INSTALLED package, not the available candidate: `dnf info` and
                  `apt-cache policy` report what COULD be installed. Prefer brace-free extraction
                  (`dpkg-query -W <pkg> | awk '{print $2}'`, `rpm -q <pkg> | sed …`) over
                  `-f='${Version}'` / `--queryformat '%{VERSION}'`, since a check `command:` also passes
                  through charly's own `${VAR}` substitution.
            - name: beds-and-r10
              content: |
                  # Beds and R10 — disposable acceptance gate reference

                  Full detail for `/charly-check:check`. Sole-owner content: the R10 gate-by-change-class matrix and the flag-discipline catalog (every other skill points here).

                  ## Disposable test-bed deploys + `charly check run <bed>` — config-driven R10 acceptance

                  The disposable R10 test beds are **`disposable: true` deploys in the project
                  `charly.yml`** — a check bed is just a deploy marked `disposable: true`, there is
                  no separate `check:` block. A deploy is a top-level entity resolved by name, so
                  every deploy verb resolves a bed by name; `charly check run <bed>` drives the
                  full R10 sequence on it:

                  This is the **ecosystem-wide** rule: every repo-shipped disposable test bed —
                  the main repo's beds AND every `box/<distro>` submodule's beds (the arch /
                  cachyos / debian / ubuntu / fedora bootstrap-VM and pacstrap/debootstrap beds) —
                  is a `disposable: true` deploy, a top-level entry in that repo's `charly.yml`. A
                  test bed is always `disposable: true`; the lone non-disposable deploy a repo
                  ships is an operator profile, not a test bed (the cachyos submodule's
                  `charly-cachyos` workstation profile); operator deployments otherwise live in the
                  per-host `~/.config/charly/charly.yml`. `disposable: true` is the sole
                  authorization for the unattended destroy + rebuild on any of them.

                  A bed is a **candybox** (the project rulebook "Candyboxing"): a disposable, secured
                  container / VM stocked with the full toolset — the entire `charly check` probe surface
                  (cdp/wl/dbus/vnc/mcp/adb/appium/kube), nested podman, real package managers, the
                  whole layer/image library — so the AI can build, deploy, and prove the *real*
                  composition inside it (the substance of RDD), and `disposable: true` makes
                  tearing it down and rebuilding fearless. The box is restricted at the boundary,
                  never by stripping the candy.

                  1. `charly box build <image> --dev-local-pkg` — build the test artifact (pod beds only). The check-bed runner sets `--dev-local-pkg` automatically, so a bed bakes the **in-development** charly toolchain (built via the `charly generate-packages` plugin from the local binary + plugins) — never a stale published release. A bed thus always tests the code under development; a production box build downloads the released package. See `/charly-tools:charly` "Check-vs-production binary source" + `/charly-internals:install-plan` "Check-vs-production charly toolchain".
                  2. `charly check box <image>` — box-section + baked candy-section probes.
                  3. `charly fleet add <bed> <ref>` — apply the bed (or `charly vm create` for vm beds).
                  4. (pod beds) `charly config <bed>` + `charly start <bed>`.
                  5. `charly check live <bed>` — full three-section live probe pass.
                  6. `charly update <bed>` — fresh-rebuild re-verification (R10 acceptance gate).
                  7. `charly remove <bed>` (or `charly vm destroy`) — leave the host clean.

                  **The bed tests the latest local candies — not the pinned remote.** Step 1 also
                  points a bed's parent-repo `@github.com/<org>/<parent>/candy/...:<tag>` candy refs
                  at the local superproject working tree — the candy-ref analogue of the auto
                  `--dev-local-pkg` toolchain build above. The check-bed setup op auto-appends a
                  `CHARLY_REPO_OVERRIDE` for the bed project's own superproject (detected via `git
                  rev-parse --show-superproject-working-tree`; the ref's `:vTAG` is ignored, so the
                  bed always builds the dev's current tree). So a `box/<distro>` submodule bed —
                  which pulls main's shared candies via `@github` refs — verifies the in-development
                  candy tree; without this it would build the stale pinned remote candy and serve no
                  purpose. An explicit operator `CHARLY_REPO_OVERRIDE` entry for the same repo still
                  wins (it is placed first). A bed whose project is its own root needs no override —
                  its candies already resolve from the local tree. Source:
                  `proc.SelfSuperprojectOverridePair` + `proc.MergeRepoOverrides` (`spec/proc`,
                  shared by `charly/plugin_loader.go` and the plugin), applied by `bedSetup` in
                  `candy/plugin-check/bed_session.go` — the check-bed session runs fully plugin-side
                  now (K-wave W3 B2-full dissolved the former `charly/host_build_check_bed.go` seam
                  entirely); the underlying `CHARLY_REPO_OVERRIDE` is the Go-`replace`-style "verify
                  before you push" mechanism.

                  **Exclusive-resource preemption wraps the sequence.** When a bed declares
                  `requires_exclusive: [token...]` (e.g. a GPU-passthrough bed needing the one
                  physical card), the check-bed runner acquires a resource-arbitration lease before step 1
                  and `defer`-releases it after teardown: any running `preemptible` holder of the
                  token (e.g. the operator's GPU workstation VM) is gracefully stopped — and the
                  arbiter waits until it actually powers off so the device is freed — then restored
                  when the bed finishes (even on failure, for `restore: always`). A holder is never
                  left stopped: `charly preempt status` / `charly preempt restore` recover a crashed run.
                  Triggering this — running a `requires_exclusive:` bed that stops the operator's
                  `preemptible` GPU holder — is standing-authorized (no per-run confirmation): it is
                  reversible by design (graceful stop + guaranteed restore), not a destroy.
                  See `/charly-internals:disposable` "The resource-arbitration axis" + `/charly-core:deploy`.

                  **A GPU bed runs on a passthrough host where host `nvidia-smi` fails — that is the
                  ready state, not a blocker.** A `requires_exclusive: [nvidia-gpu]` bed needs the card
                  bound to the `vfio-pci` host driver so the guest VM can claim it via VFIO; host-side
                  `nvidia-smi` / `rocm-smi` failing is therefore expected and does not mean the bed
                  can't run — the GPU comes alive inside the guest. Gauge readiness with `charly vm gpu
                  status` (or `charly vm gpu list` / `lspci -nnk` → `Kernel driver in use: vfio-pci`),
                  never host `nvidia-smi`. See `/charly-vm:vm` "GPU passthrough (VFIO)".

                  A `requires_shared: [nvidia-gpu]` bed (a GPU CDI pod) makes the arbiter flip the
                  whole IOMMU group vfio→nvidia at deploy and back nvidia→vfio at teardown — the
                  group-aware, `modprobe -r`-gated switch (`charly vm gpu mode`/`status`/`recover`).
                  Never manually sysfs-`unbind` a busy nvidia to "free" a card between bed runs:
                  that hangs the kernel `device_lock` (reboot-only). If a card shows wedged/poisoned
                  in `charly vm gpu status`, a host reboot is required; the arbiter refuses a poisoned
                  token until then. Full model + RCA: `/charly-vm:vm` "GPU driver-mode switch" +
                  `/charly-internals:disposable` "resource-arbitration axis".

                  `charly check run <bed>` runs exactly ONE bed. Flags: `--keep` (don't
                  tear down), `--no-rebuild` (skip step 6) — both scope-shrinking, governed by
                  "Flag discipline" below. Per-run logs land in
                  `.check/<bed>/<calver>/` (per-step `.log` files + `summary.yml`).

                  **`summary.yml`'s `ok:` does not distinguish a pass from a prereq skip.** A bed charly skips
                  for an absent host prereq (exit code **3**) still writes a summary recording success:

                  ```yaml
                  bed: check-cachyos-gpu-vm
                  steps:
                    - {name: prereq-gpu-skipped, duration_seconds: 0, ok: true}
                  total_seconds: 0
                  ok: true                     # ← a SKIP, not a pass
                  ```

                  So `ok: true` + `total_seconds: 0` + a single `prereq-*-skipped` step IS the skip signature.
                  The authoritative discriminator is the **process exit code 3** (charly also prints a
                  `SKIPPED — …` line); never count a bed as passed from `summary.yml` alone. `/verify-beds`
                  keys on the exit code for exactly this reason. And a wrapper script's own exit code is
                  not the bed verdict — a script that pipes or post-processes `charly check run` must
                  capture `${PIPESTATUS[0]}` (the charly exit) and corroborate the on-disk `summary.yml`;
                  a notification-level exit 0 can mask a charly exit 1.

                  To run a
                  whole roster, fan the beds out concurrently, by owner: the short beds via the
                  `/verify-beds` workflow (one `charly check run <bed>` process per agent), and every
                  long bed — a `vm`/`android` substrate, or one whose last run took ≥600s — as its own
                  `run_in_background` task owned by the persistent session, because an ephemeral
                  sub-agent cannot own a bed that outlives its turn. `/verify-beds` defers the long beds
                  (returning `deferredLongBeds[]`) and refuses host-local ones rather than running them;
                  its `gateComplete: false` means the roster is partial. Either way wall-clock collapses
                  to ≈ the slowest single bed (see "Approximate wall-clock" below).

                  ### Flag discipline — the `iterate:`/bed config IS the test specification

                  The `iterate:` block / the deploy config in the project's `charly.yml` IS the
                  test spec; the operator authorizes overrides, not Claude. Passing any
                  scope-shrinking flag to `charly check run` (or `charly check live`) without the user
                  explicitly naming that flag in the same conversation turn is the same fraud
                  class as dry-run-as-R10 (the project rulebook R10 flag-override clause). The catalog:
                  `--plateau-iteration`, `--max-scenario`, `--tag`, `--skip-rebuild`,
                  `--on-pod` / `--on-vm` / `--on-host`, `--keep-repo`, `--dry-run`, and the bed
                  flags `--no-rebuild` (skips the R10 fresh-rebuild gate) and `--keep`.
                  (Fanning the full roster out concurrently — the short beds via `/verify-beds`,
                  one `charly check run <bed>` per agent, and the long beds as persistent-session
                  `run_in_background` tasks — is scope-expanding, not shrinking: it is in-spec
                  without authorization when "R10 gate by change class" mandates the full
                  fan-out for a cross-cutting change, and needs authorization only as a
                  substitute for the class-mandated gate.) Internal-voice triggers — "tractable wall-clock", "for the
                  canary", "to fit session bounds", "shorten this run", "skip the heavy leg",
                  "faster iteration cycle" — are confessions, not defences. The `iterate:`
                  block's `plateau_iteration` and the AI's `progress_no_improvement_timeout` together
                  define the AI's recovery budget per phase; narrow neither without explicit
                  authorization. Speed levers that do not shrink scope (e.g. `--podman-jobs`, `--jobs`) need
                  no authorization — the lever catalog is `/charly-internals:agents` "Speed
                  levers".

                  **Run retention (`defaults.keep_check_runs`).** After `charly check run` (any path —
                  bed / `iterate:` entity), `.check/<name>/` is trimmed to the newest N run
                  artifacts (CalVer run dirs, `runs/<id>/` dirs, `result-<calver>.yml`) so harness
                  output doesn't accumulate unbounded. `NOTES.md` (the durable Syncthing-replicated
                  memory) is always preserved. Set `defaults.keep_check_runs` in `charly.yml`
                  (`0`/absent disables); apply on demand with `charly clean --check`. See
                  `/charly-core:clean`.

                  ### The ecosystem's disposable test-bed deploys

                  | Bed | Target | Ref | Surface |
                  |---|---|---|---|
                  | `check-sway-browser-vnc-pod` | pod | `image: sway-browser-vnc` | cdp/wl/vnc/dbus/mcp/record + pod-side file/service/port/process/http |
                  | `check-k3s-vm` | vm | `from: k3s-vm` | kube (all the methods) + guest-side file/service/port/process, http via port-forward, the external vm deploy end-to-end |
                  | `check-pod` | pod | `image: check-pod` | combined mechanism bed: `candy:` image build (a `candy:` carrying `base:`/`from:`) + `candy:` layer composition order + `kind: pod` runtime (nc :18794 + supervisord) + every DeployTarget rendering path |
                  | `check-local` | local | `from: check-local-app` | `kind: local` layer apply via ShellExecutor |
                  | `check-jupyter-pod` | pod | `image: jupyter` | jupyter-mcp regression coverage |
                  | `check-jupyter-ml-pod` | pod | `image: jupyter-ml` | jupyter-ml spacy/quarto + GPU MCP probes |
                  | `check-versa-pod` | pod | `image: versa` | versa OSM analytics + vector-tile + marimo MCP |
                  | `check-android-emulator-pod` | pod | `image: android-emulator` | Android 14 emulator (/dev/kvm) + adb/appium |
                  | `check-openclaw-pod` | pod | `image: openclaw` | minimal headless gateway + dbus/service/port and exact installed CLI version |
                  | `check-openclaw-full-pod` | pod | `image: openclaw-full` | maximal headless gateway + AI CLI and media/database tool stack |
                  | `check-openclaw-desktop-pod` | pod | `image: openclaw-desktop` | combined streamed desktop + gateway + AI CLI + ollama + nested Charly toolchain |
                  | `check-charly-vm` | vm | `from: charly-vm` | `charly` toolchain binary-install witness (the candy's `copy: bin/charly` run step lands the in-development binary at /usr/bin/charly) on the cloud VM |

                  Bed homes: the main repo's `charly.yml` owns `check-k3s-vm`, `check-local`, and
                  `check-charly-vm`; the pod beds above are top-level deploys in the `box/<distro>`
                  submodules' `charly.yml` (`check-pod`, `check-jupyter-pod`, `check-jupyter-ml-pod`,
                  `check-sway-browser-vnc-pod` in `box/fedora`; `check-versa-pod`,
                  `check-android-emulator-pod`, `check-openclaw-pod`, `check-openclaw-full-pod`,
                  and `check-openclaw-desktop-pod` in `box/cachyos`) and run from that submodule
                  (e.g. `charly -C box/fedora check run check-pod`).

                  Naming: `check-<descriptor>-<kind>`, dropping a redundant suffix when the
                  descriptor already equals the kind AND the short form is free (`check-local`,
                  `check-pod`). The harness AI-sandbox pod (the `iterate:` block's `sandbox:`
                  target) is named
                  `check-sandbox`, kept disjoint from these beds. Nothing in the `charly` Go code
                  hardcodes that name — it flows from the `iterate.sandbox:` field through
                  `ResolveIterateSandbox`, and prompts reference it via the `${TARGET_NAME}`
                  substitution token. **The sandbox is an operator-provisioned per-host
                  deploy** — the runner restarts-but-never-creates it: provision once with
                  `charly fleet add check-sandbox <ref> --disposable` + `charly start
                  check-sandbox` (the ref must provide charly + nested podman + the configured
                  AI CLI; the per-host overlay never ships with the repo). On a host without
                  the entry, `charly check run <bed>` fails fast with exactly that
                  remediation. The supporting
                  `vm: k3s-vm` entity lives in the project `charly.yml` alongside its beds, with a
                  SEPARATE `kind: kubernetes` profile per bed that deploys it (`check-k3s-vm-ctx`,
                  `check-k8s-deploy-cluster-ctx`) — each pinned to that bed's own per-deploy
                  kubeconfig context, so sibling beds sharing the one `vm:` entity never resolve
                  through each other's cluster. `disposable: true` is the sole authorization
                  for the unattended destroy+rebuild (see `/charly-internals:disposable`). Two
                  load-time guards back the beds: `validateCheckBeds` enforces the deploy's substrate
                  kind ∈ {pod, vm, local, android}, a resolvable cross-ref, and `disposable: true`;
                  `foldCheckBeds` enforces the deploy's name is disjoint from every other deploy.
                  Neither checks host ports —
                  disjoint ports across beds are the author's responsibility (an overlap fails the
                  second bed at deploy via `CheckPortAvailability`).

                  **Shared-fixture image isolation — a concurrency class beyond ports.**
                  `foldCheckBeds` keeps deploy names disjoint and port auto-allocation keeps host ports
                  disjoint; a third class — two beds (or two runs of one bed from different worktrees) that
                  build the same fixture image — is handled structurally by **per-run fixture image tags**:
                  a bed run tags the fixture `<bed-root>-<runCalver>`, so two beds building the same fixture
                  image name never share a tag and never race podman's store-global tag namespace. A shared
                  unscoped `<fixture>:<tag>` risks a concurrent build/retag/remove from one tree pulling the
                  tag out from under another tree's bed mid-run — invisible to a serial roster, surfacing
                  only under simultaneity. The per-run tag makes distinct beds collision-free by
                  construction.

                  ### Approximate wall-clock (10-CPU 32-GB reference host)

                  `check-pod` ~110s idle but **842s measured under a concurrent roster** (one build →
                  deploy → check → fresh-update → teardown cycle covering all four mechanisms) ·
                  `check-local` ~45s · `check-sidecar-pod` ~180–290s · `check-k3s-vm` ~5–7 min ·
                  `check-openclaw-full-pod` ~1414s · the heavy feature beds
                  (`check-sway-browser-vnc-pod` ~2477s ≈ 41 min incl. image build) longer.

                  **These are load-dependent, and the idle figures mislead.** A bed's own newest
                  `.check/<bed>/<calver>/summary.yml` `total_seconds:` is the only honest number, and it is
                  what `/verify-beds` reads to decide whether a bed is too long for a sub-agent to own
                  (≥600s ⇒ deferred to the persistent session). Under a 16-way roster, several pod beds cross
                  that line even though they finish in ~2 min idle. `charly check run <bed>` runs exactly ONE bed, so a roster run is N
                  of them — and running them sequentially would make wall-clock ≈ the sum. To
                  collapse that to ≈ the slowest single bed, fan the beds out concurrently — one
                  `charly check run <bed>` process per owner: a per-agent process for the short beds
                  (`/verify-beds`, an agent team), and a persistent-session `run_in_background` task for
                  each long bed, which no sub-agent can own (see `/charly-internals:agents`
                  "Speed levers"). The dominant cost is
                  the step-1 `charly box build`: a pod bed builds the image once — the "fresh
                  `charly update`" R10 step is a `systemctl restart` onto the already-built image, not
                  a second build — and same-base beds share cached layers, so pre-warming a shared
                  base once makes every sibling bed's build incremental.

                  **Handling a long-running bed — by mechanism, not by who owns it.** A VM/emulator
                  bed's `charly check run` orchestrator runs for minutes-to-tens-of-minutes and the
                  libvirt domain / emulator it spawns outlives a single turn. (1) **Launch it as a
                  harness-tracked background task** (`run_in_background`) — never foreground (the
                  Bash tool's `timeout`, 120s default / 600s max, kills the call mid-`vm-create`,
                  orphaning the domain) and
                  never a sleep/poll loop (the R4 bandaid). (2) **Let the completion notification
                  drive the next step** — the harness re-invokes the launching session when the run
                  exits, so the launcher must survive to completion to be notified: the persistent
                  main session does; an ephemeral sub-agent (returns synchronously) and an idle
                  teammate (torn down on idle) do not, and orphan the bed. Every full `charly check run <bed>`
                  is a `run_in_background` task owned by a persistent owner that survives across
                  turns to be notified — the main session, a background agent, or (interactive
                  tmux) a split-pane teammate; an in-process teammate cannot. Duration-independent;
                  the 600s is a Bash foreground cap, irrelevant to a backgrounded bed.
                  Teammates/sub-agents do bed-local edits + short foreground checks (`charly check
                  image`), never the full run. (3) **Reconnect via durable state** —
                  `.check/<bed>/<calver>/summary.yml` + the live domain are the truth: "done" =
                  summary.yml present; "alive" = the orchestrator is in the process table; clean up
                  an orphan (`running` domain, no live orchestrator) with `charly vm destroy <entity> --domain <bed>`
                  (or `charly remove <name>` for a pod) before re-running. **A bed's libvirt domain is keyed by the
                  deploy name, `charly-<bed>` (P33), not the shared `kind:vm` entity** — a `vm:` bed `check-charly-vm`
                  with `from: charly-vm` runs the domain `charly-check-charly-vm`, so its orphan is torn down with
                  `charly vm destroy charly-vm --domain check-charly-vm` (resolve the entity spec, target the per-deploy
                  domain); the bare `charly vm destroy charly-vm` targets `charly-charly-vm` — a domain a bed never
                  creates — and **fails with `no such VM`**. The check runner's expected-absence pre-clean and teardown
                  use `--if-exists`, which is idempotent and still cleans managed metadata. Confirm the intended domain
                  identity with `charly vm list`; see `/charly-vm:vm` "`charly vm destroy` — the DEPLOY name keys the
                  domain" and `/charly-internals:agents` "The binding rule".

                  Final target and member teardown are recorded acceptance steps. In particular, a targetless group
                  records `cleanup-members`; a failed members-down operation fails the bed rather than leaving cleanup
                  to inference from a later host inventory. The group fresh-rebuild transition likewise records and
                  requires `rebuild-members-down` before bringing the members back up.

                  ### Prereq for the vm bed

                  `check-k3s-vm` depends on the **libvirt user-session daemon**. Enable once:

                  ```bash
                  systemctl --user enable --now virtqemud.service     # libvirt >= 8 (modular)
                  # OR (older monolithic):
                  systemctl --user enable --now libvirtd.service
                  ```

                  (The host libvirt daemon is host infrastructure, not a charly-managed
                  resource — enabling it via systemctl sits outside the charly-CLI-only
                  mandate's scope.)

                  `charly check run check-k3s-vm` best-effort starts the unit before `charly vm create`
                  (via `vmshared.StartLibvirtUserSession()`, called from `candy/plugin-vm/vm_backend_resolve.go`'s
                  `resolveVmBackendPlugin` — the former `charly/vm_backend_lifecycle.go` is DELETED, K-wave 2), and the backend resolver now
                  spawns it too **before** probing the socket — so a cold socket is never mistaken
                  for "libvirt absent" (Arch/CachyOS ship no persistent `virtqemud.socket`; the
                  socket appears only after an autospawn). Never gauge libvirt readiness with
                  `systemctl is-active virtqemud.service` — a socket-activated / autospawn daemon
                  reports the service `inactive` while libvirt works fine; check the socket
                  (`$XDG_RUNTIME_DIR/libvirt/virtqemud-sock`) or `virsh -c qemu:///session list`
                  instead. `resolveVmBackend()` surfaces
                  a clear error when libvirt is absent. The `k3s-vm:` vm template pins
                  `backend: libvirt` explicitly so the silent `auto -> qemu` fallback can't mask
                  a missing daemon. See `/charly-vm:vm` "Prereq", `/charly-check:libvirt`.

                  ### Why this is config-driven

                  Beds are `disposable: true` deploys; the runner reads the deploy node directly.
                  This means the runner works for any deploy an operator defines — `charly check
                  run <name>` resolves the deploy by name through the same path every deploy verb
                  uses, with no hardcoded bed table to keep in sync.

                  ## Three primary modes (`charly check box` / `live` / `run`)

                  The surface is three orthogonal verbs, each named for what it evaluates:

                  - **`charly check box <image>`** — evaluates the image **artifact** in
                    isolation. Spawns a disposable container via `podman run --rm
                    <image-ref>` (`ImageExecutor`). Only `check:` steps at
                    `context: [build]` run; deploy-context steps are skipped with a clear
                    message. The right choice for build-time invariants ("did this
                    binary land at this path?", "is this package installed?") where a
                    running service would only add noise.

                  - **`charly check live <name>`** — evaluates a **running deployment**
                    (pod / vm / host / kubernetes; auto-resolved by `<name>` against
                    charly.yml). Uses `ContainerExecutor` / `SSHExecutor` /
                    `NestedExecutor` (for dotted-path children) + `ResolveCheckVarsRuntime`
                    so deploy-context steps see real supervisord state, real
                    `HOST_PORT:<N>` mappings (including host-networked containers via
                    `HostConfig.NetworkMode` detection), and real in-container env.
                    Same dispatcher that powers `charly check live parent.child` for
                    pod-in-vm topologies.

                  - **`charly check run <bed>`** — runs a `disposable: true` R10 deploy (full
                    sequence); when the bed carries an `iterate:` block it instead drives
                    an AI runner through plateau-bounded iterations. See
                    `references/authoring-gotchas.md` (Agent Driven Evaluation) and
                    "Realistic run-time expectations" below for the AI-iteration loop timing.

                  The mode is explicit in the verb; there is no autodetect or
                  implicit fallback. Choose the mode by picking the right verb.

                  ### Which artifact a build-scope verb evaluates

                  `charly check box`, `charly box feature run`, and `charly box labels` all
                  pronounce a verdict on a BUILT ARTIFACT, so they all resolve their image
                  argument the same guarded way (`spec/container.ResolveBuiltImageRef`):

                  - a **full ref** (`ghcr.io/opencharly/web:2026.227.0836`) or a
                    **`<box>:<calver>`** pin names one artifact — it is used verbatim;
                  - a **bare short name** (`web`) is elected against local container storage
                    by the content-derived `ai.opencharly.version` label first and the image's
                    CREATION TIME second, and the verb **REFUSES** when that election is not
                    the newest local BUILD of that box, naming both refs and the pinned
                    re-invocation.

                  **"Newest build" means creation time, not the tag** — and that distinction is
                  load-bearing rather than pedantic. `charly box build --tag <x>` REPLACES the
                  CalVer tag rather than adding to it, so every bed build carries a single tag
                  like `check-<bed>-<calver>`, which is not a CalVer at all. An ordering keyed on
                  the tag therefore ties every bed-built candidate and falls through to a
                  meaningless last resort; creation time does not tie, needs no tag convention,
                  and rides the same `images --format json` rows the resolver already reads.

                  Two consequences worth knowing:

                  - **Many tags on ONE image id are one artifact.** A `--tag` build and a plain
                    CalVer build of identical content share an id, so there is nothing older or
                    newer to arbitrate and the verb stays silent.
                  - **When the ordering cannot be established, the verb refuses.** An engine that
                    reports no creation time for some candidate yields an explicit "could not
                    establish which build is newest" error rather than a silent pass. Passing on
                    unknown is the shape that let a 17-hour-old image be certified green.

                  The refusal exists because the election's primary key is a CONTENT version:
                  an image built from a differently-versioned source tree (a sibling worktree,
                  a pulled release) outranks a newer build regardless of when either was
                  produced. Certifying the older artifact yields a green run with the right
                  step names that proves nothing about what you just built — the worst failure
                  this system has, because it is indistinguishable from a real pass. A verdict
                  verb therefore never guesses; it asks. Every other consumer of a short name
                  (deploy, `charly vm build`, builder bootstrap) shares the election but never
                  refuses.

                  Whatever the outcome, the verb prints the ref it resolved BEFORE it can bail —
                  including when the image carries no baked plan at all. A verdict that cannot
                  name the artifact it judged is unverifiable, and "read the `Image:` line" is
                  only a usable habit if the line is always there.

                  **The `Image:` line goes to STDERR, and for `charly box labels` that is a
                  contract, not a detail.** `charly box labels <ref> --format <key>` emits exactly
                  ONE raw value on stdout — the form every plan step pipes into `grep` — so the
                  provenance line must not land there. Both halves hold together: you can read
                  which artifact was inspected, and `--format` stdout stays byte-for-byte what it
                  always was. A step that captures stdout sees only the value; a human, or a log
                  that captures stderr, sees the ref as well.

                  This is also why the R10 bed sequence pins: `charly check run <bed>` builds
                  `box build <image> --tag <run-tag>` and then checks `<image>:<run-tag>`, an
                  explicit pin, so the guard never fires inside a bed.

                  **Which verb/bed proves what (the project rulebook R7):** `charly check box` passes on
                  zero-content stages too — it is not a substitute for the generated-artifact
                  checks (R8). For the R10 gate, pick the disposable bed whose kind matches
                  what you changed (`check-pod` for the combined box/candy/pod/DeployTarget
                  mechanism, `check-local`, `check-k3s-vm`, or a feature bed). `charly check run`
                  on an `iterate:` bed is the multi-hour AI-iteration benchmark, never a quick
                  gate — the same verb dispatches by whether the entity carries an `iterate:` block.

                  The banner after `charly check box` reports the image ref:

                  ```
                  Image: ghcr.io/opencharly/fedora-coder:latest
                  ```

                  The `meta.Box` short-name (from the `ai.opencharly.box` OCI
                  label) is used by `charly check live` for the `charly-<image>` container-name
                  lookup — full image refs like `ghcr.io/opencharly/fedora-coder:latest`
                  are correctly mapped to `charly-fedora-coder`. Implementation:
                  the live-gather engine in `charly/check_cmd.go` (carried by the `CheckLiveCmd`
                  struct); the `charly check box` flow lives in the `command:check` plugin
                  `candy/plugin-check`.

                  ## R10 gate by change class — pick the gate that exercises the change

                  The R10 principle is exercise, not ceremony: a gate that cannot fail on the
                  change proves nothing (wasted verification), and a change whose gate never
                  executed is unproven (the fraud class the project rulebook R10 bans). Pick the smallest
                  gate that genuinely exercises every changed code path — and run it in full.
                  The project rulebook R10 carries the mandate; this matrix is the authoritative detail.

                  | Change class | Pre-flight | The R10 gate | Tier on a clean pass | Explicitly NOT required |
                  |---|---|---|---|---|
                  | **Documentation-only change class** — `*.md` (`AGENTS.md` / `CLAUDE.md`, `plugins/**/SKILL.md`, READMEs, CHANGELOG), comment-only code edits, or a submodule pointer bump to an all-documentation submodule commit; zero behavior change | markdown integrity, link checks | The non-runtime standards: adversarial consistency review, the R5 grep self-test, cross-reference validation, and command-safety gates | `documentation reviewed` | ANY bed run or image build — beds cannot fail on prose |
                  | **Hook / workflow scripts** — `.claude/hooks/*.sh`, `.claude/workflows/*.js` | `bash -n` / async-body parse | Execute the changed script live: run the hook directly (paste its output); a workflow whose control flow changed runs against ONE bed matching the change. Prompt-string-only workflow edits: parse + the non-runtime standards | `fully tested and validated` | The full bed fan-out |
                  | **Harness project configuration** — `AGENTS.md`, `.codex/**`, repo-native `.agents/**`, or an executable that provisions or validates those surfaces | Parse the changed configuration; run the project profile and static-validator checks; verify exact gitlink and linked-worktree provenance | Run the final-tree repository harness gate: execute each changed validator/provisioner directly, verify only the gitlinks dispatched by the change class at their recorded revisions, and run the committed developer-profile checks. A Git-provisioning change also proves its canonical-object reference and exact-gitlink behavior in a dedicated linked worktree. Record the exact approved commands and active managed sandbox available for this run. This proves repository-controlled behavior; never claim that it proves settings loaded by a newly launched harness process. The fresh validator independently decides whether the final-tree delta additionally requires a Charly R10 bed and runs it when required. | `fully tested and validated` | A forced restart/new session, alternate home/cache/workspace, or unrelated VM/container roster that cannot exercise repository configuration |
                  | **`charly` Go code** | `go test ./...` + `go vet` + `task build:binary` (R9 freshness + `charly version` check against `./bin/charly`) | `charly check run <bed>` for EACH bed whose kind matches a touched code path: box/candy/pod/DeployTarget mechanism → `check-pod`; `target: local` → `check-local`; VM / kubernetes → `check-k3s-vm`; a feature surface → its feature bed. Cross-cutting loader / resolver / IR / unified-schema changes → fan every matching bed out concurrently, by owner: short beds via `/verify-beds` (one `charly check run <bed>` per agent), every long bed (`vm`/`android`, or last run ≥600s) as a persistent-session `run_in_background` task — in-spec for that class, not a scope override; a `/verify-beds` result with `gateComplete: false` is a partial roster, never a green gate | `fully tested and validated` | Beds whose substrate the change cannot reach |
                  | **Candy / box / pod / vm / kubernetes / local / android config** | `charly box validate` | Build + run a bed that composes the changed entity (a candy edit → a bed whose image stacks that candy); when no bed composes it, the R7 sequence on a disposable deploy: build → `charly check box` → deploy → `charly check live` → fresh `charly update` | `fully tested and validated` | Beds that do not compose the changed entity |
                  | **`iterate:` / ai check config** | `charly box validate` | The affected `iterate:` bed run as specified (see "Flag discipline") | `fully tested and validated` | Unrelated beds |

                  **Tier on a clean pass — the class fixes the gate; the gate fixes the tier.**
                  Passing a class's full gate earns the tier in that column. `analysed on a live
                  system` and `syntax check only` are partial-completion waypoints for the runtime
                  classes only — a live invocation ran but no fresh-rebuild R10 → `analysed on a
                  live system`; only compile / validate / dry-run ran → `syntax check only` (which
                  forbids commit). The Documentation-only change class has no live runner, so it
                  has no waypoint: its non-runtime standards either all pass (→ `documentation
                  reviewed`) or the change is not ready. The tier definitions live in each
                  harness root rulebook's "AI Attribution" section; this column names which tier each gate earns, it does not
                  redefine them.

                  Mixed changes take the union of their classes' gates (docs ride along with the
                  code class in the same commit, at that code class's runtime tier — never
                  `documentation reviewed`). Class assignment is honest, not aspirational:
                  a "comment" edit that changes a prompt string an agent executes is
                  script-text, not docs; a YAML comment is docs, but a YAML field is config. A
                  submodule pointer bump is documentation only when the bumped submodule commit is
                  itself all-documentation (the fresh validator inspects its `old..new` diff);
                  a bump integrating submodule code is a code class, at a runtime tier.

                  ## Exit codes

                  `charly check` uses a goss/pytest-style three-way exit convention so automation
                  (and `charly check run <bed>`) can tell "the thing under test is broken" apart from
                  "the check couldn't run":

                  | Code | Meaning |
                  |---|---|
                  | `0` | All checks passed. |
                  | `1` | Command / usage / infra error — bad args, undeclared deploy, container not running, image build/deploy/vm-create failed. The check never produced a pass/fail verdict. |
                  | `2` | The check RAN and one or more **checks FAILED** (`sdk.CheckFailExitCode`). |

                  `charly check box` / `charly check live` return `2` directly when checks fail.
                  `charly check run <bed>` propagates `2` when the bed's **check step** (check-image /
                  check-live) fails on checks, but `1` when an **infra step** (build / deploy /
                  vm-create) fails — so a broken bed image is distinguishable from a genuine
                  test failure. When `/verify-beds` fans a roster out, it aggregates the per-bed
                  exit codes — reporting `2` only when *every* failing bed failed on checks, and
                  `1` when any bed hit an infra failure. Implementation:
                  the sdk owns the error/exit types — `sdk.ExitCodeError` + `sdk.CheckFailExitCode` /
                  `sdk.CheckSkippedExitCode` — and charly's `main()` maps them to the process exit
                  code via `errors.As`.

                  ## The 11 Testing Standards

                  **Numbered 0–11, which is twelve entries.** Standard 0 (RDD) is the *proactive* bookend and is not
                  counted among the eleven: the eleven are the verification standards an attribution tier binds
                  against. Standard 0 and Standard 11 are the two ends of the same loop, which is why 0 sits in the
                  list rather than beside it. (referenced by the project rulebook R1–R10)

                  Unit tests are not a substitute for running the service — a green `go test ./...` proves compilation and loader behavior, not that a service actually starts.

                  These are the standards referenced in the project rulebook's AI attribution tier ("fully tested and validated"). Each is keyed to a project-rulebook R-rule. Apply them whenever a change could affect Containerfile generation, OCI labels, init systems, service startup, or deploy code.

                  0. **Prove every high-risk assumption before you edit (RDD — Risk Driven Development)** — the proactive bookend to Standard 11's fresh-rebuild gate. Low-risk orientation ("what does layer X do") is a skill lookup (R0, zero risk); every high-risk assumption — including any a skill or the code merely *asserts*, and above all whether this layer composition at its latest available versions builds / deploys / runs together — is proven on a `disposable: true` bed first (`charly check` it). Never accept docs or code as ground truth for a high-risk decision; if the bed disagrees with a skill, the skill is stale — fix it. Standard 0 (validate forward, riskiest-first) and Standard 11 (re-verify on a fresh rebuild) are the two ends of the same loop.

                  1. **Build a real artifact** (R7) — `charly box build <image>` / `go build` / `charly vm build <vm>`. Not just `go test`. Not just `charly box generate`.
                  2. **Verify the emitted artifact's content** (R8) — `grep -c supervisord-conf .build/<image>/Containerfile` for any image that uses supervisord; `charly check libvirt domain-xml <vm>` for a VM.
                  3. **Verify critical OCI / capability labels post-build** (R8) — `charly box labels <ref> --format init` (or any `ai.opencharly.<key>` shorthand) prints the built ref's label and exits non-zero when absent; `charly box labels <ref>` lists the whole capability contract (`/charly-internals:capabilities`). Empty / missing label → the detection path silently returned nil → regression.
                  4. **Deploy to a disposable target** (R10) — never experiment on a resource that doesn't carry `disposable: true`. If no suitable disposable target exists, create one first (`charly fleet add <name> <ref> --disposable` or mark a VM `disposable: true` in `charly.yml` and `charly vm create`). The setup is part of the task. On a disposable target: `charly update <name>` (unattended). On anything else: confirm with the user before any irreversible destroy — except preempting a declared-`preemptible:` holder, which is standing-authorized (reversible: graceful stop + guaranteed restore).
                  5. **Target must reach steady-state** — `charly status <image>` → `running`; `charly check libvirt info <vm>` → state `running`; SPICE socket file exists and accepts a handshake. If the service start-limit is hit, the container is crashing — read `charly logs <image>` and reproduce in a disposable shell (`charly shell <image>`, running the service command manually).
                  6. **Run the declarative test suite** — `charly check live <image>` full three-section pass against the live container (or `--uri` / `--host` remote equivalent for a remote target).
                  7. **Verify the deployed binary is the one you built** (R9) — `charly version` on the target matches the expected CalVer, and `charly status <image>` (detail `Image ref:` line; JSON `image_ref`) shows the running container's image ref carries THIS build's CalVer tag, not the prior one. Source-only changes (Syncthing, git push) do not update the deployed binary; you must build AND deploy on the target host.
                  8. **R9 covers PLUGIN binaries, not just `charly`** — a verb served OUT-OF-PROCESS
                     loads the packaged plugin from `/usr/lib/charly/plugins/` unless
                     `CHARLY_PLUGIN_DIR` points at your build. So a live run of an out-of-process
                     verb, and any bed that exercises one, proves NOTHING about your rebuild by
                     default: it runs the installed plugin and cannot fail on code you just wrote.
                     Both a live run and a full bed have shipped green this way before anyone
                     noticed. `CHARLY_PLUGIN_DIR` need only hold the plugin UNDER TEST — the loader
                     falls back to `/usr/lib/charly/plugins` for everything else, so staging the full set is
                     unnecessary. Set it — then assert the changed path actually executed rather
                     than inferring it from a PASS. Same failure family as invoking a stale
                     `/usr/bin/charly`: "the binary under test must be the one invoked" applies to
                     every binary in the chain.
                  9. **Verify runtime deps are installed via package management** (R9) — on the host: `charly doctor` (dependency status), or the host package manager directly (`rpm -q <pkg>` / `pacman -Q <pkg>` — host packages are not charly-managed resources, so the package manager IS their interface); inside a container: `charly cmd <box> 'rpm -q <pkg>'`. Manual installs do not count — they won't survive a fresh install on a synced host. Every runtime dep must live in `setup.sh` + the charly candy's `packaging:` section (`candy/charly/charly.yml`).
                  10. **Leave the target healthy, not paused/errored** — the final `charly status` (and `charly check libvirt info <vm>` for a VM) is healthy. If the target is in a broken state during exploration, `charly update` it back to the committed config before continuing — never layer experiments on broken state.
                  11. **Re-verify on a fresh rebuild after committing the source-level fix** (R10) — `charly update <disposable-target>` one more time from clean, with the new source applied. Run standards 1–10 again against this fresh rebuild. **This is the acceptance gate.** A fix that works on a hand-patched target but not on a fresh rebuild is a regression waiting for the next unrelated rebuild to wipe your patch. Paste both the exploratory-pass output and the fresh-rebuild-pass output into the conversation — the user sees both.

                  ### `charly check live parent.child` reaches the actual leaf

                  `charly check live <parent>.<child>` walks the dotted deployment path through
                  `ResolveDeployChain` (`sdk/deploykit/deploy_chain.go`) and constructs a multi-hop
                  `DeployExecutor` chain that lands probes inside the leaf's actual
                  venue — `command: id` for a pod-in-VM leaf returns the inner pod's user, not
                  the parent VM's. Live-check and AI-iteration-scoring chain construction go
                  through the same code path `charly fleet add` uses.
                  For deeply-nested paths, each segment adds one hop:

                  ```bash
                  charly check live check-vm                            # → SSHExecutor (1 hop)
                  charly check live check-vm.inner                      # → SSH + podman exec charly-check-vm_inner (2 hops)
                  charly check live check-vm.inner.deeper               # → SSH + 2× podman exec (3 hops)
                  ```

                  Same chain primitive (`NestedExecutor`) used everywhere — `charly fleet
                  add`, `charly check live`, `charly check run` (AI iteration scoring).

                  **Exception — a pod leaf nested in a VM delegates its check to the guest.** Because
                  the host-vantage probes (the protocol verbs cdp/wl/vnc/dbus, which dispatch
                  out-of-process via their plugin — `candy/plugin-cdp`/`candy/plugin-wl`/`candy/plugin-vnc`/`candy/plugin-dbus` —
                  against the container resolved on the host's podman; and
                  `${HOST_PORT}` addr/http, resolved via host `podman inspect`) cannot
                  reach a container living in the guest, `charly check live <vm>.<pod>` does not
                  chain-dispatch those per-check (they would skip). Instead `runVm` runs
                  `charly check live <pod>` in the guest over SSH (`guestNestedCheckCmd` →
                  `SSHExecutor.RunCapture`), where the nested pod is a direct pod — guest-local
                  podman, ports on guest localhost, the guest `charly` (installed by
                  `EnsureCharlyInGuest`) — so cdp/wl/mcp + `${HOST_PORT}` run natively, zero skips.
                  The guest reads the same baked checks from the cp-box'd pod image, so the check
                  set is identical; the host propagates the guest's report + exit code. A
                  pod-in-pod or vm-in-vm leaf (no host↔guest container boundary) still uses the
                  multi-hop chain above. See `references/cross-deployment-probing.md` ("Cross-deployment
                  probing") for the symmetric authoring surface in a bed's plan (venue-from-position members).

                  ### Standards violations to avoid

                  A green `go test ./...` run does not prove a cutover done — build, deploy, run, and test the live target every time. A post-`charly update` re-test must run against the freshly deployed container, not the prior one still resident from before the update (an `is not running` error on the new container means the update broke it, not that "tests pass in aggregate"). A service-start failure (`A dependency job for X failed` + immediate exit) is a real error to read (`charly logs`) and reproduce (`charly shell`), never a presumed transient. `disposable: true` is the sole destroy authorization — a `lifecycle: dev` tag and "it's a dev box" framing grant none; everything else needs user confirmation regardless of hostname. A fix verified only on a target hand-patched over an afternoon is unverified; re-run `charly update` from clean and re-verify before claiming success. A plan that said "one PR" gets no invented Phase 2. Docs and code are not proof for a high-risk assumption — prove it on a disposable bed first (Standard 0); conversely, don't bed-test a low-risk fact a skill already states — that is wasted effort. Risk, not documentation status, is the trigger.

                  If the container needs state that's only available in deploy (volumes, env, tunnel), author the step at `context: [deploy]`. If it needs something at build only (binary path, package presence), author at `context: [build]`. Both contexts must pass for the cutover to be real.

                  **Confidence tier mapping:** The "fully tested and validated" confidence level in the project rulebook's AI-attribution table requires all the standards met — including the fresh-rebuild re-verification. Anything short of that ships at a lower confidence tier.

                  ## Coverage snapshot

                  Reference numbers from the last end-to-end session:

                  | Image | Tests | Pass | Fail | Skipped |
                  |-------|-------|------|------|---------|
                  | `filebrowser` | 24 | 24 | 0 | 0 |
                  | `jupyter` | 32 | 32 | 0 | 0 (includes 3 declarative `mcp:` checks) |
                  | `openwebui` | 24 | 24 | 0 | 0 |
                  | `hermes` | 50 | 50 | 0 | 0 |
                  | `immich-ml` | 63 | 61 | 0 | 2 (redis port internal) |
                  | `selkies-desktop` | 91 | 91 | 0 | 0 |
                  | `sway-browser-vnc` | 92 | 92 | 0 | 0 (includes 7 declarative cdp/wl/dbus/vnc/mcp checks; 2 mcp tests come from the chrome-devtools-mcp layer) |

                  **Total: 376 checks across 7 images (0 failing).**

                  The "skipped" entries are intentional — they reference ports that
                  aren't mapped in the containing image's `port:` block. Skipping them
                  is correct behavior; they'd pass in an image that does expose those
                  ports.

                  ## Realistic run-time expectations

                  `charly check run default` is a multi-phase AI-iteration loop. Representative
                  per-phase durations (measured solving all 92/92 across 9 iterations on a
                  `disposable: true` check-sandbox):

                  | Phase | Plan segment | Typical iter1 duration | Notes |
                  |---|---|---|---|
                  | 1 | single-pod-system-state | ~10 min | trivial pod deploy |
                  | 2 | network-and-http | ~few min (cumulative scoring keeps phase 1 in scope) | nginx + curl in fedora:43 |
                  | 3 | cross-pod-nonce-traffic | ~few min | redis + redis-client; EVAL_NONCE_KEY/VALUE substituted per iter |
                  | 4 | mcp-protocol-probe | ~14 min | jupyter image build (~6 min) + check steps |
                  | 5 | kubernetes-cluster | ~20-30 min | k3s/kwok cluster bring-up |
                  | 6 | desktop-display-and-input | ~50 min iter1, ~10 min iter2 | sway-browser-vnc image build (~14 min) + 13 cdp/wl/vnc checks; commonly takes 2 iters due to Chrome SIGBUS instability |
                  | 7 | vm-control-libvirt-spice | ~40-50 min | libvirt domain (cloud-init, qemu-guest-agent) + 9 checks |
                  | 8 | nested-deployment-chain | ~40 min | socket-passthrough nested pods + 9 cross-hop checks |

                  **Total wall-clock for a fresh `charly check run default`**: typically
                  5-7 hours on dev-class hardware. Set expectations accordingly — this
                  is not a quick smoke. For a fast canary that exercises the loader +
                  scoring paths end-to-end without real AI work, run
                  `charly check run scaffolding-selftest` (~5 min, a single-segment plan
                  that `include:`s `composition-import-selftest`).

                  The plateau bound is `iterate.plateau_iteration` (default 3). In
                  progressive mode, plateau ends the whole run — it does not advance
                  to the next phase, so an AI that stalls on one phase doesn't collect
                  easy wins on later phases it never engaged with.
            - name: cross-deployment-probing
              content: |
                  # Image preflight and cross-deployment probing

                  Full detail for `/charly-check:check`: the host-target image-preflight fetch surface, and cross-deployment probing (one deployment testing another via venue-from-position members and `${HOST:...}` addressing).

                  ## Image preflight (host-target runs only)

                  When `charly check run --on-host <name>` (or any `iterate:` entity whose
                  sandbox resolves to `TargetKindHost`) dispatches the runner, an image
                  preflight runs first: walk the bed's plan, collect every
                  distinct step venue's image (per-step `Op.venue`, loader-derived from tree
                  position) plus the bed's target image, deduplicate, and
                  ensure each image is present in local podman storage before handing
                  off to the host runner.

                  For each discovered image, the algorithm is:

                  1. `LocalImageExists(podman, ref)` — short-circuit if already
                     present. Idempotent on re-runs.
                  2. `charly box pull <ref>` — preferred path. Resolves short names via
                     `cfg.Images[<name>]`, full registry refs pass-through, remote
                     `@github.com/...` refs walk through `ResolveRemoteImage`.
                  3. `charly box build <name>` — fallback when pull fails AND the
                     identifier is a short name resolvable via the project's
                     `charly.yml`. Build fallback is local-only; for any non-short
                     identifier that fails to pull, the preflight aborts with an
                     actionable error.

                  Failures abort the check before any plan step runs, so operators see
                  problems early rather than mid-run.

                  This is the **only** image-fetch surface in the system: deploys (any
                  target — `local`, `pod`, `vm`, `kubernetes`) emit zero image-pull steps. A
                  `kind: local` template has no `image:` field; image preflight lives on this
                  verb. Operators with legacy YAML run `charly migrate`. See
                  `/charly-local:local-spec` "What the deploy does NOT do" and the project rulebook
                  "Deploy fetches NOTHING speculative".

                  Lives in `candy/plugin-check`
                  (`preflight_images.go`'s `preflightImageCandidates` + `command.go`'s
                  `pluginCheckRunPreflight` — the "preflight" mode body, fully plugin-side since
                  K-wave 2 cone R4); the `command:check` plugin drives it for the host-target run
                  (the former `case TargetKindHost:` arm). Pod / VM / kubernetes
                  targets carry their own image inside their respective deploy schema
                  and never trigger the preflight.

                  ## Cross-deployment probing — venue-from-position members + `${HOST:...}`

                  A check normally probes the deployment under test. Cross-deployment probing
                  lets ONE deployment act as a test DRIVER against a SEPARATE deployment as the
                  SUBJECT — the canonical case being a Chrome DRIVER pod that CDP-probes a
                  separate web-server SUBJECT pod, so a real browser tests the subject without
                  baking Chrome into the subject image. "A different kind of deployment tests
                  another kind" — pod→pod, local→pod, and local→VM, all through one mechanism.

                  Two pieces compose it:

                  - **venue-from-position members** — bring the driver up alongside the subject on
                    the shared `charly` network (see `/charly-core:deploy` "Sibling members"). A deploy
                    declares each as a MEMBER NODE — a resource node on a substrate kind (`pod: {image: …}` / `vm: {from: …}` / `local: {from: …}`)
                    placed directly under the deploy — and a plan step's execution venue is its tree
                    position: a step in the `plan:` of member `M` runs on `M` (bare name), a step in the
                    `plan:` of a nested child `C` of parent path `P` runs on `P.C` (dotted). There is no authored
                    `on:`/`pod:` step field — both are retired; tree position is the sole source of
                    venue (`flattenFleetVenues` stamps it at load time). A `cdp:`/`vnc:`/`mcp:` step
                    placed under a driver member connects to that member's CDP/VNC/MCP endpoint; a
                    `command:` step runs in that member's venue. Members are brought up by the same
                    deploy verbs and are never check-live'd (instruments, not subjects). A GROUP
                    deploy (the `group:` kind) carries no workload of its own — it has no venue of its
                    own, so every plan step must live under a member (a direct step on a group root is a
                    hard load error). **Agent-provisioned members:** in an `iterate:` bed a member
                    marked `agent_provisioned: true` is the artifact the AI builds during the benchmark
                    (e.g. the `os` venue), not something the bed brings up — `foldMembers` skips it, so it
                    is never a top-level addressable entry (no auto bring-up) and never collides cross-bed
                    when the same venue name recurs across iterate beds; the scorer reaches its
                    `charly-<name>` container via the bare-name fallback (`resolveScoringChain`).
                  - **`${HOST:...}` address variable** — lets the driven probe target the subject;
                    the presence of a `:<port>` segment selects which form resolves:
                    - **`${HOST:<member>}`** (no `:<port>`) → the member's container DNS name on the shared
                      `charly` net (`charly-<member>`; also verifies it is running). The pod→pod address:
                      `http://${HOST:<subject>}:8080`. Reference the subject by its own deploy
                      name (for a bed, that's the bed name — the container is `charly-<bedname>`).
                    - **`${HOST:<member>:<port>}`** (with `:<port>`) → a host-reachable `127.0.0.1:NNNN` for
                      that member's `<port>` (container published port, or an ssh `-L` forward
                      for a VM/host subject). The host-vantage address a `local`/host driver uses to
                      reach a pod/VM subject. (Both are runtime-only — a build-context step can't use
                      them.)

                    An unresolvable `${HOST:...}` — the member/subject is unreachable (not running, bad
                    port, VM ssh-forward refused) — **fails** the referencing check, never skips it.
                    A skip on an unreachable dependency is a fake pass: it would let a bed go green
                    even though the cross-deployment probe never reached its target. (Legitimate
                    skips — `skip: true`, `exclude_distro`, a deploy-only var under build context —
                    are unaffected; only an unresolved mandatory `${HOST:...}` is treated as a failure.)

                  ### Worked example — a Chrome pod CDP-probes a web-server pod (pod→pod)

                  ```yaml
                  # charly.yml — a disposable GROUP deploy (no workload root): a web SUBJECT member +
                  # a chrome DRIVER member. Each is a resource node placed UNDER the deploy; each
                  # carries its own plan: list (venue = the member's name). Mirror
                  # box/fedora/charly.yml's check-cross-pod-cdp.
                  check-cross-pod-cdp:
                      group:
                          disposable: true             # group kind — no own workload (no image:/from:)
                      web:                             # the SUBJECT member (nginx fixture on :8080)
                          pod:
                              image: web
                              # No port: — every inherited container port auto-allocates a free
                              # 127.0.0.1 host port (conflict-free across concurrent beds). Pin with
                              # a port: entry (["H:C"]) only when a fixed host port is needed.
                              plan:
                                  - check: the web subject serves its marker
                                    id: web-fixture-up
                                    context: [runtime]
                                    http:
                                        http: http://127.0.0.1:${HOST_PORT:8080}/
                                        status: 200
                                        body:
                                            - contains: charly-fixture-web-content-marker
                      chrome:                          # the DRIVER member (headless Chrome + cdp-proxy, publishes 9222)
                          pod:
                              image: chrome-headless
                              plan:
                                  - check: chrome navigates to the subject over the charly net
                                    id: cdp-open-web-subject        # venue=chrome (DRIVE; passes on exit 0)
                                    context: [runtime]
                                    cdp:
                                        method: open
                                        url: http://${HOST:web}:8080
                                    eventually: 45s
                                    retry_interval: 3s
                                  - check: the rendered page carries the marker
                                    id: cdp-web-fixture-rendered    # also venue=chrome (ASSERT)
                                    context: [runtime]
                                    cdp:
                                        method: text
                                        tab: "1"       # the first page (cdp `open` lands on tab 1)
                                    eventually: 90s   # one wedged CDP call cycle measured 37.8s under load — 30s made retries vacuous
                                    retry_interval: 3s
                                    stdout:
                                        - contains: charly-fixture-web-content-marker
                  ```

                  `bringUpMembers` config+starts the chrome member alongside the web member; the
                  `cdp:` steps nested under `chrome` run with venue=chrome (dispatching the `cdp:`
                  verb out-of-process via `candy/plugin-cdp`, connecting to chrome's published 9222) while
                  `${HOST:web}` resolves to the web member's `charly-web` container, reached over the
                  shared net.

                  **Driver-box requirement (CDP):** a headless Chrome CDP driver must launch with
                  `--remote-allow-origins='*'` (Chrome 146+ rejects the CDP WebSocket upgrade
                  otherwise — `cdp open` via HTTP works, but `cdp text`/`check`/`screenshot` fail).
                  The `chrome-headless` box sets it; see `/charly-check:cdp` "Requirements".

                  ### Cross-kind: a host driver reaching a pod OR a VM subject (`${HOST:<member>:<port>}`)

                  The `:<port>` (endpoint) form `${HOST:<member>:<port>}` is kind-agnostic — it routes through the ONE host-vantage
                  port resolver (`resolveCheckEndpoint`): a pod subject resolves to its auto-
                  published port (`podman port`); a VM subject resolves to an `ssh -L
                  127.0.0.1:<rand>:127.0.0.1:<guestport>` forward over the managed `charly-<vm>` alias
                  (the same forward `check-k3s-vm` uses to reach the cluster API host-side). So the
                  identical check — `command: curl …${HOST:<subject>:<port>}` placed under a
                  `kind: local` host-driver MEMBER (venue = that member) — proves a pod subject
                  (`check-cross-local-http`) and a VM subject (`check-cross-vm-http`) with zero
                  kind-specific check code; only the subject kind differs.

                  **The VM subject is driven from a host-side (`local:`) driver member, not a pod
                  driver.** `${HOST:<member>:<port>}` is a host-vantage `127.0.0.1:NNNN` address; a pod
                  driver can't reach it (that loopback is the pod's own netns), and a rootless
                  `qemu:///session` VM shares no L2 bridge with rootless pods. The generic, no-hack
                  VM cell therefore uses a local driver member — the host where both the published
                  port and the ssh-forward live. (`${HOST:<member>}` — no `:<port>`, pod-net container DNS — is the
                  pod→pod address and does not reach a VM.)
            - name: live-probe-verbs
              content: |
                  # Live-container probe verbs — cdp, wl, dbus, vnc, mcp

                  Full detail for `/charly-check:check`. Covers the deploy-context-only probe verbs that dispatch out-of-process to their serving plugin candy. The `kube`/`adb`/`appium`/`spice`/`libvirt` verbs are each served by their own plugin and documented in their own skill — see this skill's "Related skills".

                  ## Live-container verbs — ALL served out-of-process

                  There are no in-core `charly check <verb>` host subcommands: every
                  live-container probe verb is served out-of-process by its plugin candy and
                  reached ONLY as a declarative step. `wl` was the last live-container verb
                  compiled into charly — after its move to `candy/plugin-wl`, zero check verbs are
                  in-core. The `charly check` command tree is now the three primary modes +
                  `feature` + the check-run management subcommands (`box`/`live`/`run`/`feature`,
                  `list`/`report`/`note`/…) — nothing else.

                  Each live-container verb (`cdp:`/`wl:`/`vnc:`/`dbus:`/`mcp:`/`record:`/`kube:`/
                  `adb:`/`appium:`/`spice:`/`libvirt:`) is authored as a declarative step and
                  dispatched through the provider registry exactly like a built-in verb
                  (`ResolveVerb` → the out-of-process gRPC provider → `Provider.Invoke`); run a
                  candy's baked steps with `charly check live <image> --filter <verb>`. `libvirt`
                  (served by `candy/plugin-vm`) and `kube`/`adb`/`appium` (each served by its own
                  plugin candy) are all dispatched through that same provider registry — there is no
                  separate in-`charly check` attach path. Authoring never
                  says `plugin: <verb>` — you write `wl: screenshot`, `libvirt: info`, etc. The
                  per-verb skill + serving plugin are listed in this skill's "Related skills" index.

                  Because no live-container verb is a host subcommand any more, an image's name can
                  never collide with one — `charly check live <name>` resolves the image
                  unambiguously.

                  ## Live-container verb catalog: `cdp`, `wl`, `dbus`, `vnc`, `mcp`

                  None of these verbs has a host `charly check` subcommand — each dispatches
                  out-of-process via its plugin (`candy/plugin-cdp`, `candy/plugin-wl`,
                  `candy/plugin-dbus`, `candy/plugin-vnc`, `candy/plugin-mcp`; parallel to the
                  `kube:`/`spice:`/`adb:`/`appium:` plugin verbs).
                  The `vnc` plugin covers pod AND vm targets — the host pre-resolves the RFB endpoint
                  (pod port-5900 or a VM's libvirt VNC via bridge/tunnel) and the plugin dials it.
                  Every live-container
                  operation (browser automation, Wayland input/screenshot, D-Bus calls, VNC
                  framebuffer capture, MCP protocol probes) is authorable as a declarative step.
                  All five are deploy-context only — they need a running container with port
                  mappings; `charly box validate` rejects them in build context, and `charly check
                  box` skips them at runtime with a clear message.

                  **Assertion semantics:** the runner dispatches the method to the out-of-process
                  plugin (`candy/plugin-cdp`, `candy/plugin-wl`, `candy/plugin-vnc`,
                  `candy/plugin-dbus`, `candy/plugin-mcp`), which captures stdout/stderr/exit and
                  feeds the output through the existing matcher pipeline. Queries
                  (status/list/eval/text/html/url/axtree/screenshot/…) produce assertable output.
                  Side-effect actions (click/type/open/close/…) pass when they exit 0 — follow them
                  with a query check to verify the effect.

                  **No state chaining:** there's no framework-managed variable to
                  carry a tab ID or window handle from one check to the next. Authors rely
                  on conventions (new tabs are usually ID 1) and inspect state via
                  follow-up `cdp: list` checks if needed.

                  ### Method allowlist — `cdp` (the methods + the SPA-nested ones)

                  Queries: `status`, `list`, `url`, `text`, `html`, `eval`, `axtree`,
                  `coords`, `raw`, `wait`, `screenshot`.
                  Actions: `open`, `close`, `click`, `type`.
                  SPA-nested (selkies coordinate-scaling / passthrough input):
                  `spa-status`, `spa-click`, `spa-type`, `spa-key`, `spa-key-combo`,
                  `spa-mouse`.

                  ```yaml
                  plan:
                      - check: the CDP endpoint is reachable
                        id: cdp-up
                        cdp: status                   # scalar sugar == {method: status}
                        stdout:
                            equals: ok

                      - check: the page title is Dashboard
                        id: cdp-page-title
                        cdp:
                            method: eval
                            tab: "1"
                            expression: "document.title"
                        stdout: "Dashboard"

                      - check: a non-empty CDP screenshot is captured
                        id: cdp-screenshot-valid
                        cdp:
                            method: screenshot
                            tab: "1"
                            artifact: /tmp/cdp.png
                            artifact_min_bytes: 10000   # PNG must be non-empty
                  ```

                  ### Method allowlist — `wl` (22 top-level + 4 overlay + 12 sway)

                  Queries: `screenshot`, `status`, `toplevel`, `windows`, `geometry`,
                  `xprop`, `atspi`, `clipboard`.
                  Actions: `click`, `double-click`, `mouse`, `scroll`, `drag`, `type`,
                  `key`, `key-combo`, `focus`, `close`, `fullscreen`, `minimize`, `exec`,
                  `resolution`.
                  Overlay-nested: `overlay-list`, `overlay-status`, `overlay-show`,
                  `overlay-hide`.
                  Sway-nested: `sway-tree`, `sway-workspaces`, `sway-outputs`, `sway-msg`,
                  `sway-focus`, `sway-move`, `sway-resize`, `sway-kill`, `sway-floating`,
                  `sway-layout`, `sway-workspace`, `sway-reload`.

                  ```yaml
                  plan:
                      - check: a non-empty desktop screenshot is captured
                        id: wl-desktop-captured
                        wl:
                            method: screenshot
                            artifact: /tmp/wl.png
                            artifact_min_bytes: 10000

                      - check: at least one toplevel window is present
                        id: wl-has-windows
                        wl: toplevel
                        stdout:
                            matches: "."      # at least one line of output

                      - check: sway reports workspace "1"
                        id: wl-sway-has-workspace-1
                        wl: sway-workspaces
                        stdout:
                            contains: '"name":"1"'
                  ```

                  ### Method allowlist — `dbus` (the methods)

                  Queries: `list`, `call`, `introspect`.
                  Actions: `notify`.

                  ```yaml
                  plan:
                      - check: the Notifications service is registered on the bus
                        id: dbus-notifications-registered
                        dbus: list
                        stdout:
                            contains: "org.freedesktop.Notifications"

                      - check: the Notifications service answers GetCapabilities
                        id: dbus-get-capabilities
                        dbus:
                            method: call
                            dest: org.freedesktop.Notifications
                            path: /org/freedesktop/Notifications
                            member: org.freedesktop.Notifications.GetCapabilities
                        stdout:
                            contains: body
                  ```

                  ### Method allowlist — `vnc` (the methods)

                  Queries: `status`, `screenshot`, `rfb`.
                  Actions: `click`, `mouse`, `type`, `key`, `passwd`.

                  ```yaml
                  plan:
                      - check: the VNC endpoint is reachable
                        id: vnc-up
                        vnc: status
                        stdout:
                            equals: ok

                      - check: a non-empty VNC framebuffer is captured
                        id: vnc-framebuffer-captured
                        vnc:
                            method: screenshot
                            artifact: /tmp/vnc.png
                            artifact_min_bytes: 5000
                  ```

                  ### Method allowlist — `mcp` (the methods)

                  Queries: `ping`, `servers`, `list-tools`, `list-resources`, `list-prompts`,
                  `read`.
                  Actions: `call`.

                  The `mcp` verb speaks the Model Context Protocol to any server advertised
                  via `mcp_provide`. URL resolution is automatic — the runner reads the
                  image's `ai.opencharly.mcp_provide` OCI label, substitutes
                  `{{.ContainerName}}`, runs the entries through `podAwareMCPProvides`, and
                  then rewrites the host portion to `127.0.0.1:<published-host-port>` using
                  the same port-mapping data that powers `${HOST_PORT:N}`. No URL argument
                  is needed in YAML.

                  Transport dispatch: `transport: http` (or empty) → Streamable HTTP;
                  `transport: sse` → SSE. Anything else is rejected at dial time.

                  Disambiguation: if an image declares multiple `mcp_provide` entries,
                  add `mcp_name: <server>` on the check; otherwise the single entry
                  auto-picks.

                  ```yaml
                  plan:
                      - check: the MCP server answers a ping
                        id: mcp-ping
                        context: [deploy]
                        mcp: ping
                        timeout: 10s              # optional; default 30s

                      - check: the MCP server lists its notebook tools
                        id: mcp-list-tools
                        context: [deploy]
                        mcp: list-tools
                        stdout:
                            - contains: insert_cell   # plaintext "name\tdescription" per line
                            - contains: execute_cell

                      - check: calling list_notebooks succeeds (no IsError)
                        id: mcp-call-tool
                        context: [deploy]
                        mcp:
                            method: call
                            tool: list_notebooks  # required
                            input: "{}"           # optional JSON arg blob
                        exit_status: 0            # assert no IsError

                      - check: reading a resource returns a non-empty body
                        id: mcp-read-resource
                        context: [deploy]
                        mcp:
                            method: read
                            uri: file:///tmp/example.txt
                        stdout:
                            - matches: "."        # non-empty body
                  ```

                  There is no host `charly check` subcommand for `mcp`: it is a
                  declarative-only check verb served out-of-process by `candy/plugin-mcp` (parallel
                  to `kube:`/`spice:`/`adb:`/`appium:`). Exercise it by running the candy's baked
                  `mcp:` steps against a live deployment — `charly check live <image> --filter mcp` —
                  or author the steps above. For multi-server images the `--name` flag is the
                  declarative `mcp_name:` modifier; the full verb reference (methods, URL rewriting,
                  port-publishing gotcha, validator rules) lives in `/charly-build:charly-mcp-cmd`.

                  Output format: tab-separated plaintext (one record per line) so matchers
                  can `contains:` without JSON decoding. `list-tools` emits
                  `<name>\t<description>`; `list-resources` emits `<uri>\t<name>\t<mime>`;
                  `call` emits the concatenated `TextContent` payloads; `ping` emits `ok`.

                  ### Artifact-validation modifiers

                  For artifact-producing methods (`cdp: screenshot`, `wl: screenshot`,
                  `vnc: screenshot`, `libvirt: screenshot`, `spice: screenshot`,
                  `record: stop`), set `artifact: <path>` to tell `charly` where to write the
                  output AND any combination of the modifiers below to assert the
                  artifact's correctness post-run.

                  - **`artifact_min_bytes: <N>`** — assert the file is at least N bytes
                    after the run. Guards against zero-byte files. Cheap (`os.Stat`
                    only).
                  - **`artifact_min_dimensions: WxH`** — assert decoded image width and
                    height are each at least the given values. Reads only the PNG/JPEG
                    header via `image.DecodeConfig`, so essentially free. Catches "the
                    screenshot ran but the compositor produced 320×240 instead of the
                    expected 1920×1080".
                  - **`artifact_not_uniform: true`** — assert the image is not uniformly
                    one color. Decodes the full image and samples 100 pixels at
                    deterministic stride positions; fails if every sampled pixel has
                    the same RGBA. Catches the failure mode `artifact_min_bytes` is
                    blind to: a 100KB all-black PNG passes the byte check but fails
                    this one. Use on every screenshot probe where "the image has real
                    content" matters.
                  - **`artifact_min_cast_events: <N>`** — for asciinema `.cast`
                    artifacts (e.g. `record: stop` in terminal mode): validates the
                    first line is the asciinema v2 header and counts at least N event
                    lines after it. Catches "the recording started and stopped but
                    captured nothing because nothing was typed".

                  ```yaml
                  plan:
                      # Combined screenshot validity assertion — bytes + dimensions + content.
                      - check: the CDP screenshot is a real, non-uniform image
                        id: cdp-screenshot-real
                        cdp:
                            method: screenshot
                            tab: "1"
                            artifact: /tmp/cdp.png
                            artifact_min_bytes: 5000
                            artifact_min_dimensions: 800x600
                            artifact_not_uniform: true

                      # Recording validity — bytes + event count.
                      - check: the terminal recording captured real events
                        id: record-cast-has-events
                        record:
                            method: stop
                            artifact: /tmp/session.cast
                            artifact_min_bytes: 200
                            artifact_min_cast_events: 5
                  ```

                  The four modifiers are independent — set just the one you need or
                  combine all four for the strongest "the artifact is real" assertion.
                  Failure messages identify the specific artifact and the specific
                  threshold that wasn't met.
            - name: verb-catalog
              content: |
                  # Verb catalog — deterministic checks, matchers, runtime variables, overlays

                  Full detail for `/charly-check:check`: the deterministic (non-live-container) check-verb catalog, the shared matcher/modifier vocabulary, execution routing, runtime variables, and the `charly.yml` overlay + workflow surface.

                  ## Authoring: the plan (the ordered `plan:` list)

                  Every step is an entry in the entity's ordered `plan:` list — ONE intent keyword
                  (`run:`/`check:`/`agent-run:`/`agent-check:`/`include:`) carrying prose, plus —
                  for `run:`/`check:` — at most one verb-position key (a builtin install verb, or
                  the plugin-verb sugar `<word>: <input>`: a map is the verb's input verbatim,
                  holding the verb-specific attributes; a scalar is the verb's primary-field
                  shorthand) and the shared step modifiers as siblings. An optional `id:` names a
                  step (reports + overlay merging), mirroring `candy/redis/charly.yml`. `run:`
                  steps ARE the install timeline; `check:` steps are the deterministic idempotent
                  probes `charly check`/`charly check live` run.

                  ### Gold-standard pattern (redis candy)

                  ```yaml
                  # candy/redis/charly.yml — the ordered plan: list inline in the candy body.
                  redis:
                      candy:
                          version: 2026.144.1531
                          description: A Redis-compatible key-value server supervised on 127.0.0.1:6379
                          plan:
                              # Build-context check: — run inside the built image via `podman run --rm`.
                              - check: the redis-server binary is installed
                                file:
                                    file: /usr/bin/redis-server
                                    exists: true
                              - check: the redis-cli binary is installed
                                file:
                                    file: /usr/bin/redis-cli
                                    exists: true
                              - check: the providing package is installed
                                package:
                                    package: valkey-compat-redis   # see references/authoring-gotchas.md #8 on renames
                                    package_map:
                                        arch: valkey
                                    installed: true
                              # Runtime check: — HOST_PORT:N resolves to the effective port mapping, so
                              # the same step works whether the deploy publishes 6379:6379 or 16379:6379.
                              - check: redis answers ping over the published port
                                id: redis-responds
                                context: [runtime]
                                stdout: PONG                       # shared matcher — a step-level sibling
                                command:
                                    command: redis-cli -h 127.0.0.1 -p 6379 ping
                                    in_container: true
                              - check: the redis port is reachable from the host
                                id: redis-port-open
                                context: [runtime]
                                addr: 127.0.0.1:${HOST_PORT:6379}  # scalar sugar: addr's primary field
                  ```

                  The five `check:` steps cover: binary existence, package identity, a functional
                  live probe, and raw TCP reachability. Adopt this shape for any primary
                  service layer.

                  ### Cross-distro package names (`package_map:`)

                  The `package:` verb chains `rpm -q || dpkg -s || pacman -Q` with a single
                  literal name, so a test that works on Fedora (`openssh-server`) fails on
                  Arch (where the package is just `openssh`). `package_map:` is the
                  authoring hook: the first key that matches any of the image's
                  `distro:` tags wins; otherwise the `package:` scalar is used as the
                  fallback. Source: `charly/checkrun_charly_verbs.go:resolvePackageName` + the
                  `Runner.Distros` field wired from `meta.Distro` at both test entry
                  points.

                  ```yaml
                  # candy/sshd/charly.yml — cross-distro authoring (a plan: step; the package-verb
                  # fields, package_map included, live INSIDE the package input map)
                  plan:
                      - check: the openssh-server package is installed
                        id: openssh-server-package
                        package:
                            package: openssh-server          # Fedora / Debian default
                            package_map:
                                arch: openssh                # Arch ships the metapackage as 'openssh'
                                fedora: openssh-server
                                fedora:43: openssh-server    # explicit version tag — matches before 'fedora'
                            installed: true
                  ```

                  Tag priority: entries in `distro:` are in priority order (e.g.
                  `["fedora:43", fedora]`), so `package_map:` can be keyed on either the
                  version-specific or the family tag, and the more-specific tag wins
                  naturally. An empty-string map value falls through to the next tag
                  (see `TestResolvePackageName` in `sdk/kit/kit_test.go`).

                  ### Verb catalog (goss-parity feature set)

                  Every verb-exclusive attribute below lives inside the verb's input map
                  (`file: {file: /x, exists: true}`), validated by the plugin's own served CUE
                  schema; a scalar value is the verb's primary-field shorthand (`file: /x`,
                  `command: id`, `cdp: status`, …). The shared step modifiers and the
                  `stdout`/`stderr`/`exit_status` matchers stay step-level siblings.

                  | Verb | Input attributes (inside the verb map) | Notes |
                  |------|---------------------|-------|
                  | `file` | `file` (primary), `exists`, `mode`, `owner`, `group_of`, `filetype`, `contains`, `sha256` | `group_of` (not `group`) — `group` is a reserved kind word, so the owning-group attribute is spelled `group_of` (the getent-group probe verb is `unix_group`) |
                  | `package` | `package` (primary), `installed`, `version`, `package_map` | Tries rpm / dpkg / pacman — exact match on installed name (see `references/authoring-gotchas.md` #8) |
                  | `service` | `service` (primary), `running`, `enabled` | Supervisord first, then systemd |
                  | `port` | `port` (primary), `listening`, `ip`, `reachable` | `listening` needs `ss`/`netstat` inside the container — absent from minimal images |
                  | `process` | `process` (primary), `running` | Needs `pgrep` — absent from minimal images |
                  | `command` | `command` (primary), `in_container` | Default runs via `podman exec`; set `in_container: false` to run from host. Assert via the shared `exit_status`/`stdout`/`stderr` step matchers |
                  | `http` | `http` (primary URL), `status` (int, single value), `body`, `headers`, `method`, `request_body`, `allow_insecure`, `no_follow_redirects`, `ca_file`, `timeout` | Host-side under `charly check live`; curl-in-container under `charly check box` |
                  | `dns` | `dns` (primary), `resolvable`, `addrs`, `server` | Host resolver for `charly check live`; `getent hosts` for `charly check box` |
                  | `user` | `user` (primary), `uid`, `gid`, `home`, `shell` | `getent passwd` |
                  | `unix_group` | `unix_group` (primary), `gid`, `groups` | `getent group` |
                  | `interface` | `interface` (primary), `mtu`, `addrs` | `ip -o addr show` |
                  | `kernel-param` | `kernel-param` (primary), `value` (scalar or matcher) | `sysctl -n` |
                  | `mount` | `mount` (primary), `mount_source`, `filesystem`, `opts` | `findmnt` |
                  | `addr` | `addr` (primary), `reachable`, `timeout` | Pure Go-native `net.DialTimeout` for `charly check live`; `nc` for `charly check box` |
                  | `matching` | `matching` (primary), `contains` | Pure in-process value matching — no target probe |
                  | `cdp` | `method` (primary: status/list/eval/text/html/url/axtree/screenshot/open/click/type/raw/wait/coords + spa-*) + method-specific fields (`tab`, `expression`, `url`, `selector`, `text`, `artifact`, `x`, `y`, `http_method` for `raw`) + `artifact_min_bytes` | Deploy-context only. Dispatches out-of-process via `candy/plugin-cdp` (no host subcommand). See `references/live-probe-verbs.md`. |
                  | `wl` | `method` (primary: screenshot/status/click/type/key/key-combo/mouse/scroll/drag/clipboard/toplevel/windows/focus/close/geometry/xprop/atspi/exec/resolution + overlay-*/sway-*) + method-specific fields (`x`, `y`, `text`, `key`, `combo`, `target`, `action`, `command`, `artifact`) | Deploy-context only. Dispatches out-of-process via `candy/plugin-wl` (no host subcommand; includes the `sway-*` and `overlay-*` nested methods). See `references/live-probe-verbs.md`. |
                  | `dbus` | `method` (primary: list/call/introspect/notify) + method-specific fields (`dest`, `path`, `member` — the fully-qualified interface.Method a `call` invokes, `arg`, `text`) | Deploy-context only. Dispatches out-of-process via `candy/plugin-dbus` (no host subcommand); EXEC-based, driving the venue's session bus with `gdbus`. |
                  | `vnc` | `method` (primary: status/screenshot/click/mouse/type/key/rfb/passwd) + method-specific fields (`x`, `y`, `text`, `key`, `artifact`) | Deploy-context only. Dispatches out-of-process via `candy/plugin-vnc` (no host subcommand); the host pre-resolves the RFB endpoint for pod AND vm targets. See `references/live-probe-verbs.md`. |
                  | `mcp` | `method` (primary: ping/servers/list-tools/list-resources/list-prompts/call/read) + method-specific fields (`tool`, `uri`, `input`, `mcp_name`) | Deploy-context only. Speaks `github.com/modelcontextprotocol/go-sdk` to any `mcp_provide` endpoint. See `references/live-probe-verbs.md` "Method allowlist — mcp". |

                  > **A step verb (or Op modifier) must never be spelled like a reserved kind word.** Kinds (`candy`, `pod`, `vm`, `kubernetes`, `local`, `android`, `group`, …) live only at a config edge — the opening discriminator of a top-level node or a tree-child node — never as a key in the middle of a step. A new probe verb that would collide with a kind word must pick a non-colliding spelling (the `k8s`/`group` probe verbs were renamed to `kube`/`unix_group` for exactly this reason). This is machine-enforced by `spec/spec` `TestNoKindWordAsStepVerb` + `TestNoKindWordAsOpModifier` — adding a colliding verb fails the build.

                  ### Shared modifiers

                  | Field | Purpose |
                  |-------|---------|
                  | `id` | Optional stable identifier. Enables `charly.yml` to override by `id`. Unique per section per image. |
                  | `description` | Human-readable label for reports. |
                  | `skip: true` | Always skip this check (reported but doesn't fail the run). |
                  | `exclude_distro: [<tag>, ...]` | Skip the check when any of the image's `distro:` tags matches an entry. Use for probes that only apply on some distros (e.g. `file: /usr/bin/fastfetch` is valid on Fedora/Arch/Debian but fastfetch is dropped from Ubuntu 24.04's noble main). Matched against the image's full distro list (`["ubuntu:24.04", "ubuntu", "debian"]`), so either `ubuntu:24.04` or `ubuntu` matches. See `charly/checkspec.go:Op.ExcludeDistros` and `charly/checkrun.go:runOne`. |
                  | `timeout: "5s"` | Per-check timeout (http, addr). |
                  | `context: [build\|deploy\|runtime]` | Which contexts the step runs in (a list). Build steps run in `charly check box`; deploy/runtime steps need a live deployment. |

                  #### `exclude_distro:` worked example

                  ```yaml
                  plan:
                      - check: the fastfetch binary is installed (skipped on Ubuntu)
                        id: fastfetch-binary
                        exclude_distro:
                            - ubuntu
                        file:
                            file: /usr/bin/fastfetch
                            exists: true
                  ```

                  On `ghcr.io/opencharly/ubuntu-coder:latest` this reports `skipped (excluded on distro "ubuntu")` instead of `failed`. On any other image it runs normally. Prefer this over dropping the test entirely — it keeps the guard in place for Fedora/Arch/Debian and documents why Ubuntu is special.

                  **Compared to `package_map:`** — `package_map:` changes what the test *probes for* per distro (same semantic, different package name). `exclude_distro:` skips the check entirely — use it when the functionality genuinely doesn't exist on a given distro.

                  ### Matcher forms

                  Any `MatcherList` attribute (`stdout`, `stderr`, `body`, `headers`,
                  `contains`, `opts`, `value`) accepts three shapes — picked by yaml.v3
                  at parse time:

                  ```yaml
                  stdout: PONG                         # scalar  → [{equals: PONG}]
                  stdout: [PONG, READY]                # list    → [{equals: PONG}, {equals: READY}]
                  stdout:
                    - equals: PONG                     # operator map
                    - contains: ["ready", "ok"]
                    - matches: "^[A-Z]+$"
                    - not_contains: "error"
                  ```

                  Supported operators: `equals`, `not_equals`, `contains`, `not_contains`,
                  `matches`, `not_matches`, plus `lt`/`le`/`gt`/`ge` (numeric, added as
                  verbs need them).

                  **`status:` is not a MatcherList** — it's a plain `int` on the `http`
                  verb. One code per test. See `references/authoring-gotchas.md` #2.

                  ## Three levels, three sections

                  | Section | Authored in | When it runs |
                  |---------|-------------|--------------|
                  | `candy` | `plan:` steps in the candy body, `candy/<name>/charly.yml` (build context) | `charly check box` + `charly check live` |
                  | `box` | `plan:` steps in the box body, `charly.yml` (build context) | `charly check box` + `charly check live` |
                  | `deploy` | a `plan:` step with `context: [deploy]`, or a local `charly.yml` overlay step | `charly check live <name>` only (deploy-context steps need a running deployment with port mappings, volumes, and resolved runtime variables) |

                  The `ai.opencharly.description` label carries the collected plan steps from all three
                  sections with `origin:` annotations (`candy:<name>`, `box:<name>`, `deploy-default`,
                  `deploy-local`). `CollectDescriptions` walks the base-image chain with a
                  visited-image guard: cycles are reported by `validateBoxDAG` at validate
                  time, but the collector itself terminates cleanly even if called on a
                  pathological config.

                  ## Verb routing (which executor runs each check)

                  Every verb dispatches through one of two executors depending on the run
                  mode — this is what makes the same plan work both against a
                  disposable container (`charly check box`) and a running service (`charly check live`):

                  | Verb + attributes | Under `charly check live` (running service) | Under `charly check box` (disposable) |
                  |-------------------|-----------------------------------|------------------------------------|
                  | file, package, service, process, user, unix_group, interface, kernel-param, mount | `ContainerExecutor` (`podman exec`) | `ImageExecutor` (`podman run --rm`) |
                  | port with `listening` | `ContainerExecutor` (`ss`/`netstat` inside) | `ImageExecutor` |
                  | port with `reachable` | Host-side `net.DialTimeout` | Skipped (no host port binding on a disposable run) |
                  | command (`in_container: true`, default) | `ContainerExecutor` | `ImageExecutor` |
                  | command (`in_container: false`) | Host-side `exec.Command` | Skipped |
                  | http, dns, addr | Host-side (from the `charly` process) | In-container `curl` / `getent hosts` / `nc` |
                  | matching | In-process matcher check | Same |

                  The routing table lives in `charly/checkrun.go` (`runOne` switch) and
                  `charly/checkrun_charly_verbs.go`. When a check is unroutable (e.g. `port:
                  reachable` under `charly check box`), the runner reports it as **skipped**
                  with a reason rather than failing the run.

                  ### in-container `command:` stdin is guarded

                  An in-container `command:` script (`in_container: true`, the default) is
                  delivered to the pod shell over a stdin heredoc (`NestedExecutor.wrapWithJump`,
                  "stdin-attached exec"). The runner wraps every such script in
                  `{ <script>; } </dev/null` (`wrapContainerCommand`, `charly/checkrun.go`) so a
                  subcommand that reads stdin — `adb shell`, `ssh`, `read`, `cat` — cannot consume
                  the rest of the heredoc (the not-yet-run script lines, which would otherwise
                  truncate the check to its first command). Authors write plain multi-line
                  scripts; no per-call-site `</dev/null` is needed. Host-side `command:`
                  (`in_container: false`) runs via `sh -c` argv and is unaffected. For Android UI
                  readiness, prefer the typed `adb: wait-ui-settled` / `current-focus` / `keyevent`
                  verbs (`/charly-check:adb`) over shell entirely.

                  ## Runtime variables

                  `charly check live` resolves these via `podman inspect` on the running container
                  before any check executes. `${NAME:arg}` is parameterized form.

                  | Variable | Source | Context |
                  |----------|--------|-------|
                  | `${USER}`, `${HOME}`, `${UID}`, `${GID}` | Image metadata (OCI labels) | build + deploy |
                  | `${IMAGE}` | Image metadata | build + deploy |
                  | `${DNS}`, `${ACME_EMAIL}` | Image metadata + charly.yml overlay | build + deploy |
                  | `${INSTANCE}` | `--instance` flag / charly.yml key | deploy |
                  | `${CONTAINER_NAME}`, `${CONTAINER_IP}` | `podman inspect` | deploy |
                  | `${HOST_PORT:N}` | Port mapping for container port N | deploy |
                  | `${VOLUME_PATH:name}` | Host path backing the named volume (bind source, encrypted mount, or `_data` dir) | deploy |
                  | `${VOLUME_CONTAINER_PATH:name}` | In-container mount path for a volume | deploy |
                  | `${ENV_NAME}` | Effective env var value on the running container | deploy |
                  | `${HOST:member}` | A separate member's container DNS name on the shared `charly` net (`charly-<member>`); no `:<port>` segment → container DNS; cross-member addressing (see `references/cross-deployment-probing.md`) | deploy |
                  | `${HOST:member:port}` | A host-reachable `127.0.0.1:NNNN` for a separate member's `port` (published port / VM ssh-forward); the `:<port>` segment selects host-vantage cross-member addressing | deploy |

                  Build-context steps may not reference deploy-context variables — the
                  validator flags this at `charly box validate` time.

                  **No bash-style defaults**: `${VAR:-fallback}` is unsupported (see
                  `references/authoring-gotchas.md` #7). Plain `${VAR}` only.

                  ## charly.yml overlay rules

                  A local `charly.yml` can contribute its own `plan:` steps per deploy.
                  Merge rules applied by `charly check live`:

                  1. Local entries with an `id:` matching a baked entry replace that entry.
                  2. Entries without a matching `id:` are appended.
                  3. To disable a baked check, reference it with `id:` and `skip: true`.

                  ```yaml
                  # ~/.config/charly/charly.yml — name-first: the redis-ml deploy with overlay plan: steps
                  redis-ml:
                      pod:
                          image: redis-ml
                          plan:
                              - check: redis answers ping             # overrides image's baked step (by id)
                                id: redis-responds
                                stdout: PONG
                                command:
                                    command: redis-cli -h 127.0.0.1 -p 16379 ping
                                    in_container: false
                              - check: the external tunnel is healthy # appended (no baked match)
                                id: external-tunnel
                                http:
                                    http: https://redis.tailnet.ts.net/health
                                    status: 200
                              - check: a legacy baked step            # disable a legacy baked step
                                id: old-probe
                                skip: true
                  ```

                  ## Typical workflow

                  ```bash
                  # 1. Author tests in candy/<name>/charly.yml.
                  # 2. Validate schema + references.
                  charly box validate

                  # 3. Build the image (the plan is auto-embedded as `LabelDescriptionSet`).
                  #    LABELs are emitted LAST in the final stage — a test edit rebuilds
                  #    in ~2 sec (cache hits every upstream RUN/COPY).
                  charly box build redis-ml

                  # 4. Run against a disposable container (build-context steps only).
                  charly check box redis-ml

                  # 5. Start the service and test end-to-end.
                  charly start redis-ml
                  charly check live redis-ml

                  # 6. Override a baked deploy check via local charly.yml, re-test.
                  $EDITOR ~/.config/charly/charly.yml    # add an overlay plan: step with matching id
                  charly check live redis-ml
                  ```

check-sway-browser-vnc-skill:
    skill:
        name: check-sway-browser-vnc
        family: check
        owner: charly-check
        description: |-
            The DISPOSABLE pod bed (check-sway-browser-vnc-pod) for R10 testing of the Sway
            desktop verb surface (cdp / wl / vnc / dbus / mcp / record). Deploys the
            shipping sway-browser-vnc image. Use when running or maintaining the
            live-container check bed for the sway stack.
        content: |
            # check-sway-browser-vnc

            `check-sway-browser-vnc-pod` is the canonical **disposable** pod bed for the
            live-container test verbs (cdp / wl / vnc / dbus / mcp / record) on the Sway
            stack. It deploys the **shipping `/charly-selkies:sway-browser-vnc` image directly**
            — there is no separate check image. It sits alongside the other `check-*` smoke
            beds (`check-pod` — the combined image/layer/pod/DeployTarget mechanism bed —
            and `check-local`) — all `disposable: true` deploys, top-level entries in their
            project's `charly.yml` (this bed and `check-pod` in `box/fedora`; `check-local`
            in main).

            ## Bed (a `disposable: true` deploy)

            A check bed is just a deploy marked `disposable: true` — there is no separate
            `check:` block. Each delta probe sway-browser-vnc doesn't bake is an ordered list
            item under the deploy's `plan:` (named by its `id:`); mirror `box/fedora/charly.yml`:

            ```yaml
            check-sway-browser-vnc-pod:
                pod:
                    image: sway-browser-vnc      # the shipping image, deployed as-is
                    disposable: true
                    lifecycle: dev
                    plan:
                        - check: CDP /json/version answers over the published HOST_PORT
                          id: esbv-pod-http-cdp
                          context: [deploy]
                          http:
                            http: "http://127.0.0.1:${HOST_PORT:9222}/json/version"
                            status: 200
                        - check: CDP enumerates the live debugging targets
                          id: esbv-pod-cdp-list
                          context: [deploy]
                          cdp: list
                        - check: the Sway tree is reachable over the Wayland socket
                          id: esbv-pod-wl-sway-tree
                          context: [deploy]
                          wl: sway-tree
                        - check: a terminal recording starts
                          id: esbv-pod-record-start
                          context: [deploy]
                          record:
                            method: start
                            record_name: check-term
                            record_mode: terminal
            ```

            `disposable: true` is the sole authorization for `charly update`/`charly remove` to
            destroy + rebuild the bed unattended (see `/charly-internals:disposable`). The bed
            publishes `sway-browser-vnc`'s canonical ports `5900/9222/9224`, so it shares
            those host ports with a real `sway-browser-vnc` deployment — only one runs at a
            time (`charly box validate` notes this).

            ## Probe coverage

            `sway-browser-vnc` already bakes binaries/services + cdp/vnc/wl/dbus checks,
            and inherits the two `mcp:` probes from the `chrome-devtools-mcp` layer.
            The bed's `plan:` steps above add the remaining deploy-context `check:` steps —
            operator-side `http:` (CDP `/json/version` via `HOST_PORT`), `cdp: list`,
            `wl: sway-tree`, and `record: start` — so a single `charly check live` run
            exercises the full cdp/wl/vnc/dbus/mcp/record surface.

            ## Usage

            ```bash
            # Canonical one-shot — the FULL R10 acceptance sequence (build → check image →
            # deploy → config → start → check live → fresh update → tear down):
            charly check run check-sway-browser-vnc-pod
            # Or drive the steps manually:
            charly config check-sway-browser-vnc-pod
            charly start  check-sway-browser-vnc-pod
            charly check live check-sway-browser-vnc-pod        # deploy-context cdp/wl/vnc/dbus/mcp/record
            charly update check-sway-browser-vnc-pod && charly check live check-sway-browser-vnc-pod  # fresh-rebuild re-verify
            ```

            Note: `charly config <key>` persists `image: <key>` (it assumes deploy-key ==
            image-name; see `/charly-core:deploy`). Because this bed's key
            (`check-sway-browser-vnc-pod`) differs from its image (`sway-browser-vnc`), set
            the operator ref to `sway-browser-vnc` in `~/.config/charly/charly.yml` (the check
            runner / `charly fleet add` does this for you — `charly` "never clobbers
            operator-authored refs").

            ## Related Skills

            - `/charly-selkies:sway-browser-vnc` — the shipping image this bed deploys
            - `/charly-check:check` — the check framework + the disposable test-bed table
            - `/charly-check:cdp`, `/charly-check:wl`, `/charly-check:vnc`, `/charly-check:dbus`, `/charly-check:record`,
              `/charly-build:charly-mcp-cmd` — the live-container verbs this bed covers
            - `/charly-core:deploy` — `disposable:` bed semantics, the deploy-key vs image-name caveat
            - `/charly-internals:disposable` — the `disposable: true` authorization model

            ## When to Use This Skill

            **MUST be invoked** when deploying, running, or troubleshooting the
            `check-sway-browser-vnc-pod` bed, or when running R10 verification for the Sway
            desktop verb surface.

dbus-skill:
    skill:
        name: dbus
        family: check
        owner: charly-check
        description: |-
            D-Bus interaction inside containers via the declarative `dbus:` check verb,
            served out-of-process by `candy/plugin-dbus` (EXEC-based, `gdbus` over the
            executor reverse channel).
            MUST be invoked before any work involving: the `dbus:` check verb, desktop
            notifications, D-Bus method calls, service introspection, or session bus
            interaction.
        content: |
            # D-Bus -- D-Bus Interaction Inside Containers

            ## Overview

            The `dbus:` check verb sends desktop notifications, calls D-Bus methods, lists
            services, and introspects objects on the venue's D-Bus **session bus**. It is
            **NOT a host `charly check` subcommand** — it is a declarative check verb served
            out-of-process by its plugin (`candy/plugin-dbus`), parallel to the
            `cdp:`/`vnc:`/`mcp:`/`record:` plugin verbs. Author a `dbus:` step in a candy/box
            plan and run it against a live deployment with
            `charly check live <image> --filter dbus`.

            **Served out-of-process — no host CLI subcommand.** `dbus` is EXEC-based: the host
            dispatches the `dbus:` verb through the provider registry exactly like a built-in
            (`ResolveVerb("dbus")` → the out-of-process gRPC provider → `Provider.Invoke` with
            the full `Op`), and the plugin drives the venue's session bus with `gdbus` (from
            `glib2`) over charly's live `DeployExecutor` reverse channel — there is no
            pre-resolved endpoint and no in-container `charly` binary involved. Authoring is
            unchanged from a built-in verb: you write `dbus: notify`, never `plugin: dbus`.

            ### Authoring a `dbus:` step

            Each method is the declarative `dbus:` step you author — an ordered list item under
            the candy/box `plan:`. The method name (list/call/introspect/notify) is the scalar
            value for a bare-method step (`dbus: list`), or the `method:` key of the `dbus:` map
            when the step carries dbus-exclusive fields (`dest:`, `path:`, `member:`, `arg:`,
            `text:`) — those live INSIDE the `dbus:` map. The shared matchers (`stdout:`,
            `stderr:`, `exit_status:`) and `description:` (the notify body, doubling as the step's
            report label) stay siblings of the `dbus:` key. All `dbus:` steps are
            **deploy-context only** (they need a running session bus), so author them with
            `context: [deploy]`. See `/charly-check:check` for the full YAML shape. Example:

            ```yaml
            - check: the notifications service is on the session bus
              context: [deploy]
              dbus: list
              stdout:
                contains: org.freedesktop.Notifications
            ```

            ## Quick Reference

            | Action | Declarative step | Description |
            |--------|------------------|-------------|
            | Send notification | `dbus: notify` + `text:` (+ sibling `description:` body) | Desktop notification via the Notifications interface |
            | Call method | `dbus: call` + `dest:` + `path:` + `member:` (+ optional `arg:`) | Generic D-Bus method call |
            | List services | `dbus: list` | List all registered session bus services |
            | Introspect | `dbus: introspect` + `dest:` + `path:` | Introspect a service's interfaces and methods |

            The `+ <field>:` entries (except `description:`) are keys INSIDE the `dbus:` map;
            `description:` and the `stdout:`/`stderr:`/`exit_status:` matchers stay siblings.

            Run a candy's baked `dbus:` steps against a live deployment with
            `charly check live <image> --filter dbus`.

            ## Methods

            Each method below is the declarative `dbus:` step you author; queries produce
            assertable output (run them as `check:` steps), side-effect actions pass when they
            exit 0 (run them as `run:` steps). All steps are deploy-context only.

            ### Desktop Notifications

            ```yaml
            - check: a desktop notification is delivered
              context: [deploy]
              dbus:
                method: notify
                text: Build Complete           # notification summary (dbus-exclusive, in the map)
              description: Image built successfully   # notification body (shared #Op sibling)
            ```

            Calls `org.freedesktop.Notifications.Notify` on the session bus; the notification
            appears via the running notification daemon (swaync or mako).

            ### Generic Method Calls

            ```yaml
            - check: the notifications service reports its capabilities
              context: [deploy]
              dbus:
                method: call
                dest: org.freedesktop.Notifications
                path: /org/freedesktop/Notifications
                member: org.freedesktop.Notifications.GetCapabilities   # the interface.Method to call
                # arg: [...]                  # optional typed call arguments (type:value)
            ```

            Calls an arbitrary D-Bus method on the session bus and returns its reply.

            ### List Services

            ```yaml
            - check: the session bus has the expected services registered
              context: [deploy]
              dbus: list
              stdout:
                contains: org.freedesktop.Notifications
            ```

            Lists all registered services on the venue's session bus.

            ### Introspect a Service

            ```yaml
            - check: the notifications object exposes the Notify method
              context: [deploy]
              dbus:
                method: introspect
                dest: org.freedesktop.Notifications
                path: /org/freedesktop/Notifications
              stdout:
                contains: Notify
            ```

            Introspects a service object's interfaces, methods, signals, and properties.

            ## Prerequisites

            - Container must have a D-Bus session bus running (provided by the `dbus` layer)
            - `gdbus` must be present in the venue (from `glib2` — the plugin drives it over
              the reverse channel)
            - For notifications: a notification daemon must be running (e.g., `swaync`)
            - Container must be running (`charly start <image>`)

            ## Cross-References

            - `/charly-check:check` -- parent router; the `dbus:` verb dispatches out-of-process via `candy/plugin-dbus`, and `charly check live <image> --filter dbus` runs a candy's baked steps.
            - `/charly-internals:plugin` -- the out-of-process provider model that serves `dbus` (the EXEC-based `gdbus`-over-reverse-channel plugin).
            - `/charly-check:cdp` -- Chrome DevTools Protocol automation (sibling out-of-process verb served by `candy/plugin-cdp`).
            - `/charly-check:vnc` -- VNC desktop automation (sibling out-of-process verb served by `candy/plugin-vnc`).
            - `/charly-check:wl` -- Wayland desktop automation (sibling out-of-process verb served by `candy/plugin-wl`).
            - `/charly-core:cmd` -- single command execution in running containers (its best-effort completion notification drives the session bus via `gdbus` from the host).
            - `/charly-core:shell` -- interactive shell access
            - `/charly-infrastructure:dbus-layer` -- D-Bus session bus layer configuration
            - `/charly-selkies:swaync` -- notification daemon layer

libvirt-skill:
    skill:
        name: libvirt
        family: check
        owner: charly-check
        description: |-
            the `libvirt:` libvirt-RPC check verb for VMs — domain info, framebuffer screenshots, send-key, passwd, QMP, qemu-guest-agent client, snapshots, events — served out-of-process by candy/plugin-vm.
        content: |
            # libvirt — VM libvirt-RPC check verb

            ## Overview

            `libvirt:` is a DECLARATIVE check verb — authored as `libvirt: <method>` inside
            a candy/box plan `check:`/`run:` step. It is **NOT a host `charly check`
            subcommand** — a declarative check verb served out-of-process by
            `candy/plugin-vm` (nested under `charly check` at runtime), parallel to the
            `kube:`/`adb:`/`appium:` plugin verbs. The VM/libvirt-API implementation (and
            the `go-libvirt` + `kata-containers/govmm` + `libvirt.org/go/libvirtxml`
            dependencies) lives entirely in that external plugin, NOT in charly's core; at
            check time the host dispatches `libvirt:` through the provider registry to the
            out-of-process plugin (the same path a bed's checks take via `charly check
            live` / `charly check run`).

            The verb maps every libvirt-RPC management/introspection surface a VM needs
            beyond what `charly vm` (lifecycle) provides — domain info, framebuffer
            capture, keyboard injection, live graphics-password patching, QMP passthrough,
            the qemu-guest-agent client, snapshots, and lifecycle events. **VM-only** — it
            needs a running libvirt domain.

            ### The host pre-resolves the VM target; the plugin speaks libvirtd

            charly core owns NO go-libvirt. The host pre-resolves the target's **per-deploy
            DOMAIN IDENTITY** host-side and passes it (`Runner.vmTargetName()` — the deploy name via
            `vmDomainIdentity`, NOT the shared `kind:vm` entity, P33) to the plugin, so the verb addresses
            the live domain `charly-<deploy>` — correctly distinct per bed even when several beds share one
            `kind:vm` entity. The plugin opens the libvirtd session connection and runs the method. Authoring is unchanged from a
            built-in verb: you write `libvirt: info`, never `plugin: libvirt`.

            ### Authoring a `libvirt:` step

            The method name is the scalar value for a bare-method step (`libvirt: info`), or
            the `method:` key of the `libvirt:` map when the step carries libvirt-exclusive
            fields (`text:`, `input:`, `key:`, `command:`, `uri:`, `artifact:` and the artifact
            validators) — those live INSIDE the `libvirt:` map. Two things stay step-level
            siblings of the `libvirt:` key: the shared matchers (`stdout:`, `stderr:`,
            `exit_status:`) AND the `target:` snapshot name (a genuinely shared `#Op` modifier
            the `snapshot/*` methods read). A query/probe is a `check:` step; an action that
            changes domain state (send-key, passwd, snapshot create/revert) is a `run:` step.
            **`context: [deploy]`** — the verb needs a running VM; under `charly check
            box` (no running VM) it skips. Run a candy's baked `libvirt:` steps against a
            live VM deployment with `charly check live <vm> --filter libvirt`.

            ## Method surface

            Every method below is the `libvirt:` map's `method:` (or the scalar value for a
            bare method). The Modifiers column names the libvirt-exclusive fields that live
            INSIDE the `libvirt:` map — EXCEPT `target:` (the `snapshot/*` name), which is a
            shared `#Op` sibling of the `libvirt:` key.

            **Top-level:**

            | `libvirt:` value | Modifiers | Description |
            |---|---|---|
            | `list` | — | all domains on the session |
            | `info` | — | state + graphics + uptime + agent |
            | `screenshot` | `artifact:` (+ `artifact_*` validators) | libvirt `DomainScreenshot` → PNG |
            | `send-key` | `key:` | keyboard injection (Linux keycode set); chord notation (`key: "ctrl+alt+F2"`) |
            | `passwd` | `text:` | live graphics password patch |
            | `qmp` | `text:` (QMP command) + `input:` (JSON args) | QMP passthrough |
            | `domain-xml` | — | dump the live domain XML |
            | `events` | — | poll lifecycle state transitions |
            | `console` | — | (stub) serial console — use `charly vm console <vm>` |

            **`guest/*` — qemu-guest-agent client:**

            | `libvirt:` value | Modifiers | Description |
            |---|---|---|
            | `guest/ping` | — | reach the agent |
            | `guest/info` | — | agent capability list |
            | `guest/os-info` | — | distro/kernel |
            | `guest/time` | — | guest clock + host delta |
            | `guest/hostname` | — | guest hostname |
            | `guest/users` | — | logged-in users |
            | `guest/interfaces` | — | IPs + MACs + stats |
            | `guest/disks` | — | block devices |
            | `guest/fsinfo` | — | mounted filesystems |
            | `guest/vcpus` | — | guest-side online state |
            | `guest/exec` | `command:` | run a command via `guest-exec` |
            | `guest/fstrim` | — | run TRIM on guest filesystems |

            **`snapshot/*`:**

            | `libvirt:` value | Modifiers | Description |
            |---|---|---|
            | `snapshot/list` | — | list snapshots |
            | `snapshot/create` | `target:` (snapshot name) | create a snapshot |
            | `snapshot/info` | `target:` | show snapshot XML |
            | `snapshot/revert` | `target:` | revert to a snapshot |
            | `snapshot/delete` | `target:` | delete a snapshot |

            The `libvirt: <method>` value validates against this method set — the
            `#LibvirtMethod` enum, now the `method:` field of the plugin's own `#LibvirtInput`
            schema (`candy/plugin-vm/schema/vm.cue`), served over the Describe channel and
            spliced onto the base — at `charly box validate` time.

            ### Nested-runtime operator commands (beyond the declarative set)

            A handful of qemu-guest-agent ops carry no declarative method — `guest file
            read`/`guest file write` and `guest fsfreeze status`/`freeze`/`thaw`, plus the
            ad-hoc flags `--screen N` (screenshot), `--hold` (send-key), `--type
            spice|vnc` / `--persistent` (passwd), `--config` (domain-xml), and `--duration`
            (events/console). Because the verb is also surfaced under `charly check` at
            runtime (dispatched through the provider registry, like `kube`/`adb`/`appium`), reach those
            through the nested out-of-process command `charly check libvirt guest file …` /
            `charly check libvirt guest fsfreeze …` for interactive operator use. They are
            NOT part of the declarative `libvirt:` step vocabulary.

            ## What it does

            Every method maps to one go-libvirt RPC (plus, for `guest/*`, the
            `QEMUDomainAgentCommand` passthrough). The method name mirrors the
            libvirt/virsh vocabulary so skills translate cleanly. Design choices:

            - **Target resolution** identical to the `spice:` verb's host-side
              pre-resolution: the resolved per-deploy DOMAIN IDENTITY (`Runner.vmTargetName()`,
              P33) → the `charly-<deploy>` libvirt domain → live XML via
              `libvirtxml.Domain`. Errors are the same across both.
            - **Framebuffer screenshot** (`libvirt: screenshot`) goes through
              `DomainScreenshot` — QEMU's VNC framebuffer capture, returned as PPM, decoded
              in-process and re-encoded as PNG. Independent of whichever graphics protocol
              (SPICE or VNC) the VM exposes on the wire.
            - **send-key** uses the Linux keycode set via `DomainSendKey`. A friendly
              keyname map in `candy/plugin-vm/libvirt_ops.go` covers
              letters/digits/modifiers/arrows/function keys. Supports chord notation
              (`key: "ctrl+alt+F2"`).
            - **passwd** patches the `<graphics type="spice|vnc" passwd="…">` attribute via
              `libvirtxml`, then calls `DomainUpdateDeviceFlags(LIVE)`.
            - **qmp** passes JSON commands through unchanged (`text:` = the QMP method name,
              `input:` = the JSON args). Flag 0 = QMP; HMP not exposed.
            - **guest/exec** uses `guest-exec` + polls `guest-exec-status` until exit
              (`command:` carries the argv). stdout/stderr are base64-decoded from the agent
              reply.
            - **events** is a 1-Hz lifecycle poller (not callback-based) — good enough for
              "did the VM actually shut down?" checks.

            ## End-to-end example

            Each step is an ordered list item under the candy/box `plan:`; a
            probe is a `check:` step, a state-changing action is a `run:` step. Run with
            `charly check live arch --filter libvirt`.

            ```yaml
            # Sanity — the domain is up and the agent is reachable.
            - check: the session lists the arch domain
              id: libvirt-domains-listed
              libvirt: list
              context: [deploy]
              stdout:
                contains: arch
            - check: the domain reports a reachable guest agent
              id: libvirt-agent-reachable
              libvirt: info
              context: [deploy]
              stdout:
                contains: "Agent: true"

            # Framebuffer capture (independent of SPICE wire state).
            - check: a non-uniform framebuffer screenshot is captured
              id: libvirt-framebuffer
              libvirt:
                method: screenshot
                artifact: /tmp/fb.png
                artifact_not_uniform: true
              context: [deploy]

            # Keyboard injection via libvirt (alternate path to the `spice: key` verb).
            - run: switch to VT2 via a libvirt key chord
              id: libvirt-send-chord
              libvirt:
                method: send-key
                key: "ctrl+alt+F2"
              context: [deploy]

            # QMP escape hatch.
            - check: QMP reports the running domain status
              id: libvirt-qmp-status
              libvirt:
                method: qmp
                text: query-status
              context: [deploy]
              stdout:
                contains: running

            # qemu-guest-agent (only if the guest has qemu-guest-agent installed).
            - check: the guest agent runs uname
              id: libvirt-guest-uname
              libvirt:
                method: guest/exec
                command: uname -a
              context: [deploy]
              stdout:
                contains: Linux

            # Transactional testing: snapshot → … → revert → delete.
            # The snapshot name rides the SHARED #Op `target:` sibling, not the libvirt map.
            - run: snapshot the domain before a destructive step
              id: libvirt-snapshot-create
              libvirt: snapshot/create
              target: pre-exp
              context: [deploy]
            - run: revert to the pre-experiment snapshot
              id: libvirt-snapshot-revert
              libvirt: snapshot/revert
              target: pre-exp
              context: [deploy]
            - run: delete the snapshot
              id: libvirt-snapshot-delete
              libvirt: snapshot/delete
              target: pre-exp
              context: [deploy]
            ```

            ## Remote libvirt (qemu+ssh://)

            A `libvirt:` step can target a VM on a remote libvirt host. Set
            `CHARLY_LIBVIRT_URI=qemu+ssh://[user@]host/session`: the host-side pre-resolver
            opens the SSH connection, discovers the remote virtqemud session socket (via
            `id -u`), and forwards it over the SSH channel — so `DomainScreenshot`,
            `DomainSendKey`, QMP, etc. all work against the remote hypervisor, with the
            artifact written by the `artifact:` modifier locally. Example:

            ```bash
            CHARLY_LIBVIRT_URI=qemu+ssh://o.example.org/session \
              charly check live arch --filter libvirt
            ```

            ## Agent prerequisite

            `guest/*` methods require `qemu-guest-agent` installed and running in the guest
            AND a `<channel type='unix' ... name='org.qemu.guest_agent.0'/>` in the domain
            XML. The opencharly layer `qemu-guest-agent` drops this in for bootc VMs;
            cloud-image VMs need to add it to `cloud_init.packages:` explicitly.

            Use a `libvirt: info` step — if it reports `Agent: false`, the agent is not
            reachable.

            ### Cloud-image VM packages

            When a cloud-image VM uses `charly_install.strategy: auto` (the modern
            default), the vm deploy plugin's `OpPrepareVenue` (via `kit.EnsureCharlyInGuest`)
            scps the **host** `charly` binary into the guest post-boot. The core charly binary is cgo-free for audio — the SPICE audio
            channels (the sole opus/portaudio cgo consumers) were dep-shed out of core
            into the out-of-tree `candy/plugin-spice`, gated behind `-tags spice_audio`.
            `ldd $(command -v charly)` shows no libportaudio/libopus, so the scp'd binary
            runs in the guest with NO portaudio/opusfile installed.

            Minimum cloud-image package list for full check-live coverage:

            ```yaml
            cloud_init:
              packages:
                - sudo
                - spice-vdagent      # for spice-vdagentd
                - qemu-guest-agent   # for the `libvirt: guest/*` probes
            ```

            ## Daemon prerequisite (host side)

            The `libvirt:` verb (and every `spice:` check verb) routes through the libvirt
            user-session daemon socket. The daemon must be running as a user-service:

            ```bash
            systemctl --user enable --now virtqemud.service     # libvirt ≥ 8 (modular)
            # OR (older monolithic):
            systemctl --user enable --now libvirtd.service
            ```

            `charly vm create` best-effort starts these units before resolving the VM
            backend (see `/charly-vm:vm` "Prereq"). The `charly check run <bed>` path for
            VM-targeting beds (e.g. `check-k3s-vm`) invokes the same hook. If the unit
            doesn't exist (libvirt not installed), the explicit-backend gate in
            `resolveVmBackend()` surfaces a clear error pointing at the remediation.

            ## Architecture split (vs. the `spice:` verb)

            The two VM verbs are single-protocol by design — both served out-of-process by
            the `candy/plugin-vm`/`candy/plugin-spice` plugins, neither a host CLI command:

            - **`libvirt:`** — libvirt RPC only. Every call goes through libvirtd. Works
              regardless of the VM's graphics protocol. Use when the thing under test is
              "is the VM working?" (framebuffer capture, keyboard injection, snapshots,
              domain state).
            - **`spice:`** — SPICE wire only. Proves the SPICE protocol path is alive
              end-to-end. Use when the thing under test is "is SPICE itself healthy?".

            For ambiguous display tests, run both and diff: compare `libvirt: screenshot`
            against `spice: screenshot` — if both render the same pixels, the SPICE server
            and the guest framebuffer agree.

            ## Implementation pointers

            The `libvirt:` verb is served OUT-OF-PROCESS by `candy/plugin-vm` (the
            go-libvirt shed moved it out of charly core). The host dispatches it through
            the provider registry, passing the resolved per-deploy DOMAIN IDENTITY
            (`Runner.vmTargetName()` — the deploy name, not the shared entity, P33) so the verb
            addresses the live domain `charly-<deploy>`, correctly distinct per bed.

            - `candy/plugin-vm/libvirt_cmd.go` — the libvirt command tree + all method implementations.
            - `candy/plugin-vm/libvirt_methods.go` — the method allowlist (op → subcommand-path + positional-args dispatch data).
            - `candy/plugin-vm/libvirt_ops.go` — shared helpers (screenshot PPM→PNG decode, key-name → Linux keycode map).
            - `candy/plugin-vm/libvirt_guest_agent.go` — typed client over `QEMUDomainAgentCommand` with methods for every QGA command in use.
            - `candy/plugin-vm/vm_target.go` — VM target resolution; `VmTarget.XML` gives you the live `libvirtxml.Domain` for fast field lookups.

            ## Dependencies

            These live in `candy/plugin-vm` (the out-of-process plugin), NOT charly core:

            - `github.com/digitalocean/go-libvirt` — pure-Go libvirt RPC client.
            - `libvirt.org/go/libvirtxml` — typed domain XML parsing/generation.
            - The `libvirt` Arch package (libvirtd, session socket) is already a hard dep of the charly package (`packaging.formats.archlinux.depends`).

            ## Cross-References

            - `/charly-check:check` — parent router; the `libvirt:` verb catalog entry, the artifact-validation modifiers, and `charly check live <vm> --filter libvirt`.
            - `/charly-check:spice` — the sibling `spice:` SPICE-wire check verb, also served out-of-process by `candy/plugin-vm`/`candy/plugin-spice`.
            - `/charly-internals:plugin` — the out-of-process provider model that serves `libvirt` (`candy/plugin-vm`).
            - `/charly-vm:vm` — the `charly vm` VM lifecycle command family (create/start/stop/destroy/ssh/console/gpu) — separate from this introspection verb.

            ## When to Use This Skill

            **MUST be invoked** before any work involving: the `libvirt:` check verb,
            libvirt RPC-based VM inspection/management, qemu-guest-agent probing, VM
            snapshots, domain event watching, or any VM-introspection surface beyond what
            `charly vm` (lifecycle) provides.

record-skill:
    skill:
        name: record
        family: check
        owner: charly-check
        description: |-
            Record terminal sessions (asciinema) or desktop video (pixelflux/wf-recorder)
            via the declarative `record:` check verb, served out-of-process by `candy/plugin-record`.
            MUST be invoked before any work involving: the `record:` check verb, terminal recording,
            desktop video recording, or session capture.
        content: |
            # Record -- Terminal and Desktop Recording

            ## Overview

            The `record:` check verb manages recording sessions inside running containers. It is
            **NOT a host `charly check` subcommand** — it is a declarative check verb served
            out-of-process by its plugin (`candy/plugin-record`), parallel to the
            `mcp:`/`adb:`/`appium:` plugin verbs. Author a `record:` step in a candy/box plan and
            run it against a live deployment with `charly check live <image> --filter record`. It
            supports these modes:

            1. **Terminal recording** (asciinema) — Records terminal sessions as `.cast` files
            2. **Desktop video recording** — Records full-screen video as MP4 files via pixelflux (selkies-desktop) or wf-recorder (sway-desktop)

            All recording sessions are managed via tmux sessions with a `record-` prefix. This provides background execution, output monitoring, and clean start/stop lifecycle.

            **Served out-of-process — no host CLI subcommand.** `record` is EXEC-based: the host
            dispatches the `record:` verb through the provider registry exactly like a built-in
            (`ResolveVerb("record")` → the out-of-process gRPC provider → `Provider.Invoke` with
            the full `Op`), and the plugin drives the venue (start/stop the recorder, send
            commands, copy the artifact out) over charly's live `DeployExecutor` reverse channel —
            there is no pre-resolved endpoint. Authoring is unchanged from a built-in verb: you
            write `record: start`, never `plugin: record`.

            ## Quick Reference

            | Action | Declarative step | Description |
            |--------|------------------|-------------|
            | Start recording | `record: start` (+ optional `record_name:`/`record_mode:`/`record_fps:`/`record_audio:`) | Start a recording session |
            | Stop recording | `record: stop` + `artifact:` (+ optional `record_name:`) | Stop and copy the recording file to the host artifact path |
            | List recordings | `record: list` | Show active recording sessions |
            | Send command | `record: cmd` + `text:` (+ optional `record_name:`) | Send a command line into the recording terminal |

            Every `+ <field>:` entry is a key INSIDE the `record:` map (`record: {method: start, record_name: …}`);
            only `stdout:`/`stderr:`/`exit_status:` and `context:`/`id:`/`timeout:` are siblings.

            Run a candy's baked `record:` steps against a live deployment with
            `charly check live <image> --filter record`.

            ## Methods

            Each method is the declarative `record:` step you author — an ordered list item under
            the candy/box `plan:`. The method name is the scalar value for a bare-method step
            (`record: list`), or the `method:` key of the `record:` map when the step carries
            record-exclusive fields (`record_name:`, `record_mode:`, `record_fps:`,
            `record_audio:`, `text:`, `artifact:` and the artifact validators) — those live INSIDE
            the `record:` map. Only the shared matchers (`stdout:`, `stderr:`, `exit_status:`) and
            `context:`/`id:`/`timeout:` stay siblings. All `record:` steps are **deploy-context
            only** (they need a running container), so author them with `context: [deploy]`.

            ### `record: start` — Start Recording

            ```yaml
            - check: a terminal recording starts
              context: [deploy]
              record:
                method: start
                record_name: demo          # session name (default: default); multiple concurrent recordings supported
                record_mode: terminal      # terminal (asciinema), desktop (video), or empty/auto (auto-detect)
                # record_fps: 30           # frames per second for desktop recording (default 30)
                # record_audio: true       # include PulseAudio audio capture (desktop mode)
            ```

            **Auto-detection order** (when `record_mode:` is empty/auto): pixelflux-record → wf-recorder → asciinema

            **Output files** (inside container):
            - Terminal: `/tmp/charly-recordings/<name>.cast`
            - Desktop: `/tmp/charly-recordings/<name>.mp4`

            ### `record: stop` — Stop Recording

            ```yaml
            - check: the terminal recording captured real events
              context: [deploy]
              record:
                method: stop
                record_name: demo
                artifact: /tmp/demo.cast    # the recording file is copied from the container to this host path
                artifact_min_bytes: 200
                artifact_min_cast_events: 5
            ```

            - Sends a graceful stop signal (exit for asciinema, SIGINT for video recorders), waits up to 5s for graceful shutdown, then force-kills.
            - `artifact:` copies the recording file out of the container to the host path. Combine with the artifact validators (`artifact_min_bytes`, `artifact_min_cast_events` for `.cast`, `artifact_not_uniform` for video frames) to assert the capture is real — see `/charly-check:check` "Artifact-validation modifiers".

            ### `record: list` — List Active Recordings

            ```yaml
            - check: the recording session is active
              context: [deploy]
              record: list
              stdout:
                contains: demo
            ```

            Emits all active recording sessions with name, mode, and file path.

            ### `record: cmd` — Send Command to Recording

            ```yaml
            - check: a command is sent into the recording
              context: [deploy]
              record:
                method: cmd
                record_name: demo
                text: echo 'Hello World'
            ```

            Sends a command into the recording plugin's private tmux session. For terminal recordings, the command and its output become part of the `.cast` file. This is the typed `record: cmd` operation, not a general terminal-control surface.

            ## Recording Tools

            | Tool | Layer | Desktop | Protocol |
            |------|-------|---------|----------|
            | asciinema | `asciinema` (or `dev-tools`) | N/A | Terminal capture |
            | pixelflux-record | `wl-record-pixelflux` | selkies-desktop | selkies WebSocket capture bridge → H.264 → ffmpeg |
            | wf-recorder | `wf-recorder` | sway-desktop | wlr-screencopy |

            ## Use Case: Terminal Demo Recording

            A demo is an ordered list of `record:` steps under a candy/box `plan:`, run together
            by `charly check live <image> --filter record`:

            ```yaml
            # candy/<name>/charly.yml — ordered record: steps drive the whole demo
            plan:
                - check: the terminal recording starts
                  context: [deploy]
                  record:
                    method: start
                    record_name: demo
                    record_mode: terminal
                - check: echo into the recording
                  context: [deploy]
                  record:
                    method: cmd
                    record_name: demo
                    text: echo 'Hello World'
                - check: ls into the recording
                  context: [deploy]
                  record:
                    method: cmd
                    record_name: demo
                    text: ls -la
                - check: the recording stops and is captured
                  context: [deploy]
                  record:
                    method: stop
                    record_name: demo
                    artifact: /tmp/demo.cast
                    artifact_min_cast_events: 3
            ```

            ```bash
            charly check live openclaw --filter record    # runs the ordered record: steps above
            asciinema play /tmp/demo.cast                  # play back the copied-out artifact
            ```

            Recording sessions are intentionally controlled through `record:` steps so the
            resulting cast and artifact checks remain correlated with the check run.

            ## Use Case: Desktop Walkthrough Video

            Compose `record:` with the `cdp:`/`wl:` verbs so the browser/desktop interaction is
            visible in the captured video:

            ```yaml
            - check: a desktop recording starts
              context: [deploy]
              record:
                method: start
                record_name: walkthrough
                record_mode: desktop
                record_audio: true
            - check: navigate the browser (visible in the recording)
              context: [deploy]
              cdp:
                method: open
                url: https://github.com
            - check: click on the desktop
              context: [deploy]
              wl:
                method: click
                x: 640
                y: 360
            - check: the walkthrough video is captured
              context: [deploy]
              record:
                method: stop
                record_name: walkthrough
                artifact: /tmp/walkthrough.mp4
                artifact_min_bytes: 10000
                artifact_not_uniform: true
            ```

            ```bash
            charly check live selkies-desktop --filter record --filter cdp --filter wl
            ```

            ## Prerequisites

            - **Terminal recording:** `asciinema` layer (or `dev-tools`)
            - **Desktop recording (selkies):** `wl-record-pixelflux` layer (included in `selkies-desktop` metalayer)
            - **Desktop recording (sway):** `wf-recorder` layer (included in `sway-desktop` metalayer)
            - **All modes:** `tmux` layer must be present (for session management)

            ## Implementation Notes

            - `record` is served out-of-process by `candy/plugin-record`; there is NO host `charly check` subcommand for it. The host dispatches the `record:` verb through the provider registry (`ResolveVerb("record")`) and the EXEC-based plugin drives the venue over the live `DeployExecutor` reverse channel.
            - `record: cmd` owns the recording session's input path. The cosmetic desktop notification is not part of the check verdict.

            ## Cross-References

            - `/charly-check:check` — the parent check router (the `record:` verb catalog entry, the artifact-validation modifiers, and `charly check live --filter record`)
            - `/charly-internals:plugin` — the out-of-process provider model that serves `record` (the EXEC-based reverse channel)
            - `/charly-automation:tmux` — Separate typed terminal provider for operator and agent terminal sessions
            - `/charly-coder:asciinema` — Terminal recording layer
            - `/charly-selkies:wl-record-pixelflux` — Pixelflux video recording layer
            - `/charly-selkies:wf-recorder` — wf-recorder video recording layer
            - `/charly-selkies:selkies-desktop-layer` — Desktop metalayer with pixelflux recording
            - `/charly-selkies:sway-desktop` — Desktop metalayer with wf-recorder
            - `/charly-check:wl` — Desktop automation (used alongside recording)
            - `/charly-check:wl-overlay` — Fullscreen overlays (title cards, lower-thirds, fades — compose with recording workflow)
            - `/charly-check:cdp` — Chrome automation (used alongside recording)

            ## When to Use This Skill

            **MUST be invoked** when the task involves:

            - Recording terminal sessions or desktop video
            - the `record:` check verb / `record: start`/`stop`/`list`/`cmd` steps
            - Creating demo videos or walkthroughs
            - Capturing asciinema sessions
            - "How do I record my desktop?"
            - "How do I make a demo video?"

spice-skill:
    skill:
        name: spice
        family: check
        owner: charly-check
        description: |-
            the `spice:` SPICE-wire check verb for VMs — handshake, native-SPICE display screenshots, and input injection, served out-of-process by candy/plugin-spice (the vendored Shells-com/spice library).
        content: |
            # SPICE — VM display-protocol check verb

            ## Overview

            `spice:` is a DECLARATIVE check verb — authored as `spice: <method>` inside a
            candy/box plan `check:`/`run:` step. **There is no host `charly check spice`
            command.** The SPICE-wire implementation (and the upstream SPICE client
            library + its cgo opus/portaudio audio transitives) was dep-shed into the
            out-of-tree `candy/plugin-spice` plugin module; at check time the host
            dispatches `spice:` through the provider registry to that out-of-process
            plugin (the same path a bed's checks take via `charly check live` / `charly
            check run`). This mirrors the `adb:` / `appium:` / `kube:` externalizations
            (see charly/check_cmd.go).

            The verb *proves* the SPICE server is speaking the protocol correctly on the
            wire — not just that the TCP port is open: main-channel handshake, auth,
            channel enumeration, native display-channel image decode, and input injection.
            VM-only — it needs a running libvirt VM that exposes a `<graphics type='spice'>`
            device.

            ### The plugin resolves its endpoint via a reverse-leg; then speaks the wire

            charly core owns NO go-libvirt. The out-of-process spice plugin resolves its own
            dialable endpoint through the GENERIC `cc.ResolveGraphicsEndpoint("spice")`
            reverse-leg; the host side of that leg (`resolveVerbGraphics` in
            `charly/check_graphics_endpoint.go` — a permanent core STAY on its own x/crypto/ssh
            containment reason, a DIFFERENT file from the endpoint-resolve reverse-leg
            `charly/check_endpoint_resolve.go`, whose resolution bodies relocated to
            `candy/plugin-check` under the compiled-in-REQUIRED placement class, #55 W3 B7)
            DELEGATES the vm.yml → libvirt-domain →
            live-XML → `<graphics type='spice'>` resolution to the out-of-process vm plugin
            (`invokeVmPlugin("resolve-spice", …)` → candy/plugin-vm's `ResolveVmTarget` /
            `SpiceEndpoint`, where the go-libvirt deps live), passing the resolved per-deploy DOMAIN
            IDENTITY (`Runner.vmTargetName()` — the deploy name, not the shared `kind:vm` entity, P33)
            as the domain target. The host opens any qemu+ssh://
            side tunnel itself (tracked for post-Invoke teardown) and returns a plain DIALABLE
            endpoint (+ the SPICE ticket); the spice plugin just dials it and runs the method.

            ## Authoring the `spice:` verb in a plan step

            The verb is one inline Op carried by a step — an ordered list item under the
            candy/box `plan:` (a display/handshake probe is a `check:` step; an input action
            that changes guest state is a `run:` step). The method name is the scalar value for
            a bare-method step (`spice: status`), or the `method:` key of the `spice:` map when
            the step carries spice-exclusive fields — those live INSIDE the `spice:` map:

            | Method | Declarative form | Map fields | Description |
            |---|---|---|---|
            | `status` | `spice: status` | — | handshake + channel enumeration (first line `SPICE:     ok`) |
            | `screenshot` | `spice: {method: screenshot, artifact: …}` | `artifact:` | native SPICE display-channel decode → PNG |
            | `cursor` | `spice: {method: cursor, artifact: …}` | `artifact:` | capture cursor bitmap + position → PNG |
            | `click` | `spice: {method: click, x: …, y: …}` | `x:`, `y:`, `button:` | mouse press/release via the inputs channel |
            | `mouse` | `spice: {method: mouse, x: …, y: …}` | `x:`, `y:` | pointer move (no click) |
            | `type` | `spice: {method: type, text: …}` | `text:` | type text as PC-AT scancodes |
            | `key` | `spice: {method: key, key: …}` | `key:` | press one named key (Return, Escape, F2, …) |

            The artifact validators (`artifact_min_bytes:`, `artifact_min_dimensions:`,
            `artifact_not_uniform:`) are spice-exclusive too, so they live inside the `spice:`
            map; only the shared matchers (`stdout:`, `stderr:`, `exit_status:`) and
            `context:`/`timeout:`/`id:` stay siblings of the `spice:` key. **`context: [deploy]`**
            — the verb needs a running VM; under `charly check box` (no running VM) it
            skips, and a SPICE-less deployment (e.g. a GPU desktop with no `<graphics
            type='spice'>` device) is reported N/A SKIP.

            The method-name enum (`status`/`screenshot`/`cursor`/`click`/`mouse`/`type`/`key`)
            and every spice modifier live in the plugin's OWN input schema
            (`candy/plugin-spice/schema/spice.cue`, `#SpiceInput`), served over the Describe
            channel and spliced onto the base for validation — so authoring is UNCHANGED from a
            built-in verb (`spice: status`, not `plugin: spice`); the internal
            plugin/plugin_input wire envelope the sugar desugars to is never authored.

            Example — each step is an ordered list item under the candy/box `plan:`:

            ```yaml
            - check: the SPICE server completes the handshake and enumerates channels
              id: spice-handshake
              spice: status
              context: [deploy]
              stdout:
                - contains: ok
                - contains: "inputs:    ready"
            - check: the SPICE display channel decodes a non-uniform framebuffer
              id: desktop-rendered
              spice:
                method: screenshot
                artifact: /tmp/spice-shot.png
                artifact_not_uniform: true
              context: [deploy]
            ```

            Input injection is authored as `run:` steps (each one mutates guest state) — a
            console login sequence walks the form with `spice: key` / `spice: type` steps:

            ```yaml
            - run: type the username and password at the console
              id: drive-login
              spice:
                method: key
                key: return
              context: [deploy]
            # … followed by `spice: {method: type, text: arch}` and `spice: {method: key, key: tab}`
            # steps to walk the login form.
            ```

            ## Remote libvirt (qemu+ssh://)

            A `spice:` step can target a VM on a remote libvirt host. Set
            `CHARLY_LIBVIRT_URI=qemu+ssh://[user@]host/session` (the former `--uri` flag
            carried this same env): the host-side pre-resolver runs locally, discovers the
            remote SPICE endpoint, and opens the side tunnel transparently — libvirt RPC
            rides the SSH control channel; the SPICE display channel gets a dedicated
            forward.

            - For VMs that declare `<listen type='socket'/>` (the arch default after the
              socket-listen cutover), the host forwards the UNIX socket.
            - For TCP-listener VMs, the host opens a `127.0.0.1:<random>` forward.

            GUI clients (virt-manager, `remote-viewer --connect qemu+ssh://…`) don't need
            any charly involvement for socket listeners — they auto-forward via libvirt
            RPC fd-passing. See `/charly-vm:arch-cloud-vm` "Connecting from a remote workstation"
            for the complete story.

            ## What it does (and doesn't)

            - **Speaks SPICE on the wire.** Main channel handshake, auth (None or
              SPICE_TICKET), channel enumeration (Display/Inputs/Cursor/Playback/
              Record/Webdav), display channel with native QUIC/GLZ/LZ/LZ4 image
              decode, input channel for key/mouse events.
            - **Endpoint resolved host-side.** The host loads vm.yml, finds the running
              libvirt domain, parses live XML via `libvirtxml.Domain`, and extracts the
              SPICE host/port/passwd from the `<graphics type='spice'>` element (honoring
              autoport='yes') before handing the plugin a dialable endpoint. The operator
              escape-hatches the former CLI exposed (`--address`, `--socket`, `--password`)
              are NOT part of the declarative verb — the endpoint comes from the bed's VM
              context.
            - **Native SPICE screenshot.** `spice: screenshot` is a native SPICE
              display-channel decode (NOT libvirt `DomainScreenshot`) — it proves the SPICE
              display path renders pixels end-to-end. `type`/`key` emit PC-AT scancodes
              (the friendly-keyname → scancode table lives in the plugin).
            - **Not implemented.** Audio playback/record (no user story) — the plugin is
              built WITHOUT `-tags spice_audio`, so the upstream library's cgo
              opus/portaudio audio channels are not linked. Complex agent-channel
              operations (clipboard, resolution change); the upstream library exposes them
              but the verb doesn't wrap them yet — use the `libvirt:` verb (`libvirt:
              passwd`, `libvirt: guest/exec`) for the corresponding management ops.

            ## Architecture split (vs. the `libvirt:` verb)

            The verbs are single-protocol by design:

            - **`spice:`** — every byte flows through the SPICE wire. Use when the thing
              under test is "is SPICE itself healthy?".
            - **`libvirt:`** — every call goes through libvirtd RPC. Use when the thing
              under test is "is the VM working?" (framebuffer capture, keyboard injection,
              snapshots, domain state). The `libvirt:` verb is likewise a declarative check
              verb served out-of-process — by `candy/plugin-vm` (see `/charly-check:libvirt`).

            For input testing, prefer `spice: type`/`key`/`click` to prove the SPICE wire
            delivers input to the guest. For display testing, compare `spice: screenshot`
            against `libvirt: screenshot` — if both render the same pixels, the SPICE
            server + the guest framebuffer agree.

            ## Implementation

            The `spice:` verb and its SPICE-wire client live in the out-of-tree
            `candy/plugin-spice` plugin module (an external-charly-verb plugin), NOT in
            charly's core (which carries no SPICE library and no opus/portaudio cgo deps).

            - `candy/plugin-spice/provider.go` — the out-of-process verb provider: it
              dials the host-pre-resolved endpoint, dispatches the method, then
              self-evaluates the stdout/stderr/exit_status matchers + the artifact
              validators itself.
            - `candy/plugin-spice/session.go` / `methods.go` — the connection wrapper over
              the SPICE library's `Connector`/`Driver` interfaces and the per-method
              implementations.
            - `candy/plugin-spice/third_party/spice` — the vendored Shells-com/spice
              library, built without the audio tag (`ch-audio-stub.go`).
            - `candy/plugin-spice/schema/spice.cue` — the plugin's served CUE schema: the
              `#SpiceInput` def carries the method enum + every spice modifier, served over
              the Describe channel and spliced onto the base for authored-input validation.

            Host side:

            - `charly/check_graphics_endpoint.go` — `resolveVerbGraphics("spice")`, the host side
              of the `cc.ResolveGraphicsEndpoint` reverse-leg: delegates vm.yml → libvirt domain →
              live XML → SPICE endpoint to the vm plugin, opens any qemu+ssh:// side tunnel, and
              returns a dialable endpoint (+ ticket) to the spice plugin. Stays in core (it owns no
              go-libvirt, and directly imports spec/sshx — x/crypto/ssh containment); shared with
              `vnc:` (the venue-aware vnc/spice resolution is one function). NOT
              `charly/check_endpoint_resolve.go` — that is the DIFFERENT, sibling reverse-leg file
              whose resolution bodies relocated to `candy/plugin-check/resolve_endpoint.go` (#55 W3 B7).
            - `candy/plugin-vm/vm_target.go` — the OUT-OF-PROCESS VM target resolution
              (`ResolveVmTarget` / `SpiceEndpoint`, go-libvirt); `VmTarget.XML` gives the live
              `libvirtxml.Domain`. The host reaches it via `invokeVmPlugin("resolve-spice", …)`,
              passing `Runner.vmTargetName()` (the resolved per-deploy DOMAIN IDENTITY — the deploy name
              via `vmDomainIdentity`, not the shared `kind:vm` entity, P33; the plugin prefixes `charly-`).
            - The registry dispatch: `providerRegistry.ResolveVerb("spice")` → the
              out-of-process `grpcProvider` → `invokeVerbProvider`, which hands the plugin
              the full `#Op` as params after the host pre-resolves the endpoint.

            ## Dependencies

            These now live in `candy/plugin-spice`, NOT in charly's core:

            - `github.com/Shells-com/spice` (MIT) — SPICE client library, vendored under
              `third_party/spice`.
            - `github.com/hraban/opus` + `github.com/gordonklaus/portaudio` — cgo audio
              transitives, indirect and NOT linked (the plugin is built without
              `-tags spice_audio`).

            The VM target resolution (go-libvirt / `libvirtxml`) runs OUT-OF-PROCESS in
            `candy/plugin-vm/vm_target.go` — the host reaches it via
            `invokeVmPlugin("resolve-spice", …)`, not a direct core call, and passes the
            resolved per-deploy DOMAIN IDENTITY (`Runner.vmTargetName()` — the deploy name, not the
            shared `kind:vm` entity, P33) so the plugin addresses the live domain `charly-<deploy>`,
            correctly distinct per bed even when several beds share one entity.

            ## Related skills

            - `/charly-check:libvirt` — the sibling declarative `libvirt:` check verb,
              served out-of-process by `candy/plugin-vm` (libvirt RPC: framebuffer
              screenshot, send-key, QMP, snapshots, guest agent).
            - `/charly-check:check` — the unified check system and the Op (a plan step)
              that holds every verb discriminator + modifier.
            - `/charly-vm:arch-cloud-vm` — the arch VM that ships SPICE by default; "Connecting from
              a remote workstation".
            - `/charly-internals:plugin` — the external-charly-verb plugin model the spice
              verb follows.

            ## When to Use This Skill

            **MUST be invoked** for any task involving the `spice:` declarative check verb,
            SPICE protocol debugging, or proving a libvirt VM's SPICE display path is alive
            end-to-end. Invoke this skill BEFORE reading the plugin's Go source.

vnc-skill:
    skill:
        name: vnc
        family: check
        owner: charly-check
        description: |-
            VNC/RFB desktop automation via the declarative `vnc:` check verb, served
            out-of-process by `candy/plugin-vnc` (covers pod AND vm targets).
            MUST be invoked before any work involving: the `vnc:` check verb, VNC
            automation, RFB protocol desktop interaction, VNC screenshots, clicking
            coordinates, or VNC authentication.
        content: |
            # VNC - VNC Desktop Automation

            ## Overview

            The `vnc:` check verb connects to VNC servers (RFB protocol on port tcp:5900)
            inside running containers — and to a VM's libvirt VNC display. It is **NOT a host
            `charly check` subcommand** — it is a declarative check verb served out-of-process
            by its plugin (`candy/plugin-vnc`), parallel to the `cdp:`/`mcp:`/`record:` plugin
            verbs. Author a `vnc:` step in a candy/box plan and run it against a live
            deployment with `charly check live <image> --filter vnc`. It provides screenshot
            capture, keyboard/mouse input, and VNC password management for Wayland desktop
            automation via wayvnc.

            **Served out-of-process — covers pod AND vm targets.** The host dispatches the
            `vnc:` verb through the provider registry exactly like a built-in
            (`ResolveVerb("vnc")` → the out-of-process gRPC provider → `Provider.Invoke` with
            the full `Op`). Before dialing, the host pre-resolves the RFB endpoint — a pod's
            published port 5900, or a VM's libvirt VNC reached via bridge/tunnel — and the
            plugin dials it and speaks RFB. ONE verb covers BOTH pod and vm targets — the two
            former host CLI subcommands (a per-method pod form and a separate
            `vnc vm <name> <method>` VM form) are gone. Authoring is unchanged from a built-in
            verb: you write `vnc: screenshot`, never `plugin: vnc`.

            ### Authoring a `vnc:` step

            Each method is the declarative `vnc:` step you author — an ordered list item under
            the candy/box `plan:`. The method name
            (status/screenshot/click/mouse/type/key/rfb/passwd) is the scalar value for a
            bare-method step (`vnc: status`), or the `method:` key of the `vnc:` map when the step
            carries vnc-exclusive fields (`x:`, `y:`, `button:`, `text:`, `key:`, `artifact:`,
            `artifact_min_bytes:`, …) — those live INSIDE the `vnc:` map. Only the shared matchers
            (`stdout:`, `stderr:`, `exit_status:`) and `context:`/`id:`/`timeout:` stay siblings.
            All `vnc:` steps are **deploy-context only** (they need a running deployment), so
            author them with `context: [deploy]`. See `/charly-check:check` for the full YAML
            shape. Example:

            ```yaml
            - check: a non-empty VNC framebuffer is captured
              context: [deploy]
              vnc:
                method: screenshot
                artifact: /tmp/vnc.png
                artifact_min_bytes: 5000
            ```

            ## Quick Reference

            | Action | Declarative step | Description |
            |--------|------------------|-------------|
            | Screenshot | `vnc: screenshot` + `artifact:` | Capture VNC framebuffer as PNG |
            | Click | `vnc: click` + `x:` + `y:` | Click at x,y coordinates |
            | Type text | `vnc: type` + `text:` | Send keyboard input as key events |
            | Send key | `vnc: key` + `key:` | Press a special key (Return, Escape, etc.) |
            | Move mouse | `vnc: mouse` + `x:` + `y:` | Move mouse without clicking |
            | Status | `vnc: status` | Check VNC server, show resolution and desktop name |
            | Set password | `vnc: passwd` | Set VNC auth password for deployment |
            | Raw RFB | `vnc: rfb` | Send raw RFB protocol message |

            The `+ <field>:` entries are keys INSIDE the `vnc:` map (`vnc: {method: click, x: …, y: …}`);
            only `stdout:`/`stderr:`/`exit_status:` and `context:`/`id:`/`timeout:` are siblings.

            Run a candy's baked `vnc:` steps against a live deployment with
            `charly check live <image> --filter vnc` (add `-i <instance>` for multi-instance).

            ## Architecture

            ```
            host (charly check live --filter vnc)
               -> resolveVerbGraphics (cc.ResolveGraphicsEndpoint reverse-leg): resolve the RFB endpoint
                    pod: podman port <name> 5900   |   vm: libvirt VNC via bridge/tunnel
               -> resolveVNCPassword (charly settings + VNC_PASSWORD env — retained host-side)
               -> Op + endpoint + password handed to candy/plugin-vnc over gRPC
            candy/plugin-vnc
               -> NewVNCClient(address, password) -> RFB handshake -> operation
            ```

            The host pre-resolves the dual pod/vm endpoint and the credential, then dispatches
            the verb out-of-process. The custom RFC 6143 VNC client (no external dependency;
            supports None, VNC auth (DES), and VeNCrypt (TLS + sub-auth) security types) lives
            in `candy/plugin-vnc`. The host retains only the endpoint pre-resolution and
            `resolveVNCPassword` (the VNC credential store).

            ## Requirements

            - Container must include the `wayvnc` layer (port tcp:5900)
            - Container must be running (`charly start`)
            - Wayland compositor must be active (sway)

            ## Methods

            Each method below is a `vnc:` plan step authored with `context: [deploy]`; run a
            candy's baked steps with `charly check live <image> --filter vnc` (add
            `-i <instance>` for a specific instance).

            ### Screenshot
            ```yaml
            - check: a non-empty VNC framebuffer is captured
              context: [deploy]
              vnc:
                method: screenshot
                artifact: /tmp/desktop.png        # host path for the captured PNG
                artifact_min_bytes: 5000
            ```

            ### Click
            ```yaml
            - run: left-click the desktop center (1920x1080)
              context: [deploy]
              vnc:
                method: click
                x: 960
                y: 540
            ```

            The `vnc:` verb takes **desktop-absolute** `x:`/`y:`. To click an element located by
            CSS selector, read its desktop coordinates from a `cdp: coords` step (it reports
            both viewport and desktop coords) and author the `vnc: click` with those `x:`/`y:`
            — see "Using CDP Coordinates with VNC" below. The sibling `wl: click` verb takes the
            same desktop-absolute coords and is the Wayland-native alternative on a wlroots
            desktop without VNC.

            ### Type
            ```yaml
            - run: type each character as key events
              context: [deploy]
              vnc:
                method: type
                text: hello world
            ```
            Only supports ASCII/Latin-1 characters. For special keys, use the `vnc: key` method.

            ### Key
            ```yaml
            - run: press a special key
              context: [deploy]
              vnc:
                method: key
                key: Return            # also Escape, Tab, F5, Control_L, ...
            ```

            Valid key names: Return, Escape, Tab, BackSpace, Delete, Home, End, Page_Up, Page_Down, Up, Down, Left, Right, Insert, F1-F12, Shift_L, Shift_R, Control_L, Control_R, Alt_L, Alt_R, Super_L, Super_R, Meta_L, Meta_R, Caps_Lock, space.

            ### Mouse
            ```yaml
            - run: move the mouse without clicking
              context: [deploy]
              vnc:
                method: mouse
                x: 500
                y: 300
            ```

            ### Status
            ```yaml
            - check: the VNC server reports its desktop and resolution
              context: [deploy]
              vnc: status
              stdout:
                contains: "1920x1080"
            # Output: Desktop: sway / Resolution: 1920x1080
            ```

            ### Password (`vnc: passwd`)

            ```yaml
            - run: provision VNC auth (VeNCrypt/TLS) for the deployment
              context: [deploy]
              vnc: passwd
            ```

            The `vnc: passwd` method sets up VNC authentication (VeNCrypt/TLS):
            1. Stores the password in the VNC credential store (system keyring or config file, depending on the `secret_backend` setting) as `vnc.password.<image>`
            2. Resolves `$HOME` inside the venue for absolute config paths
            3. Generates self-signed TLS cert+key (valid 3650 days) if not present
            4. Generates RSA key in traditional format (`-traditional` flag for OpenSSL 3.x) if not present
            5. Writes `~/.config/wayvnc/config` with `enable_auth=true` (wayvnc reads this automatically)
            6. Restarts the wayvnc supervisord service

            After a password is set, all `vnc:` operations authenticate transparently via VeNCrypt/TLS.

            ### Password Resolution Chain

            When connecting, the password is resolved by the host-side credential store
            (`resolveVNCPassword`, retained in core) in this order:
            1. `VNC_PASSWORD` environment variable (CI/automation override)
            2. System keyring lookup for `vnc.password.<image>-<instance>` (when `secret_backend=auto` or `keyring`)
            3. Config file lookup for `vnc.password.<image>-<instance>` (instance-specific)
            4. System keyring / config file lookup for `vnc.password.<image>` (image-level)
            5. Empty string (no auth — server must allow unauthenticated connections)

            ```bash
            # One-off password override via env (applies to the run)
            VNC_PASSWORD=secret charly check live sway-browser-vnc --filter vnc

            # Set password programmatically (alternative to the vnc: passwd step)
            charly settings set vnc.password.sway-browser-vnc mysecret

            # Instance-specific password
            charly settings set vnc.password.sway-browser-vnc-prod prodpassword
            ```

            Requires `openssl` inside the venue for TLS cert and RSA key generation.

            ### Raw RFB (`vnc: rfb`)

            A `vnc: rfb` step sends a raw RFB protocol message (raw key/pointer/cut-text
            events, framebuffer-update requests) for cases the typed methods above don't
            cover — the RFB sub-method rides the `http_method:` field and its JSON payload rides
            `params:`, both inside the `vnc:` map (the input's `method:` is always the verb method
            `rfb`). Prefer the typed `vnc: click`/`type`/`key` methods; reach for `vnc: rfb` only
            for low-level protocol work.

            ## Differences from CDP Commands

            | Aspect | `cdp:` verb (CDP) | `vnc:` verb (RFB) |
            |--------|----------------|----------------|
            | Protocol | WebSocket JSON | Binary TCP |
            | Scope | Browser tabs | Whole desktop |
            | Click | CSS selector (viewport-relative) | x,y coordinates (desktop-absolute) |
            | Type | CDP key events | Key events (keysyms) |
            | Screenshot | Browser page only | Full desktop |
            | JavaScript | Yes (check/wait) | No |
            | Use case | Web automation | Desktop automation |

            Source: `candy/plugin-vnc` (the out-of-process RFB client); host-side endpoint
            resolution (`resolveVerbGraphics`) in `charly/check_graphics_endpoint.go` + the VNC
            credential store (`resolveVNCPassword`) in `charly/check_endpoint_resolve.go` (folded in
            from the former `vnc_helpers.go`, FLOOR-SLIM Unit 4 — that file no longer exists).

            ## VNC as Anti-Detection Fallback

            Some websites (notably Google sign-in) detect and block CDP-based input. VNC provides a reliable fallback because the `vnc:` verb's `type` method sends real X11 keysym events through the Wayland compositor — indistinguishable from physical keyboard input.

            **CDP + VNC Hybrid Pattern:** Locate the element with a `cdp: coords` step (CDP selector precision — it reports the desktop coordinates), deliver the click with a `vnc: click` step at those desktop coords, and type credentials with a `vnc: type` step:

            ```yaml
            # 1. Locate via cdp: coords — reports both viewport and desktop coords for '#identifierId'
            - check: the email field is located
              context: [deploy]
              cdp:
                method: coords
                tab: "1"
                selector: "#identifierId"
            # 2. Deliver the click via VNC at the reported desktop coords
            - run: focus the email field via the VNC pointer
              context: [deploy]
              vnc:
                method: click
                x: 1166
                y: 421
            # 3. Type real key events through the compositor
            - run: type the email address
              context: [deploy]
              vnc:
                method: type
                text: "${ENV_GMAIL_USER}"
            ```

            **Tested timing:** the compositor needs a moment between the VNC click and VNC type; author the type step after the click in plan order. No characters were dropped during Google sign-in testing.

            When to use the VNC-delivered click and VNC type:
            - **`chrome://` pages** (required): CDP mouse events and JS `.click()` are blocked on Chrome's privileged pages (`chrome://intro/`, `chrome://sync-confirmation/`, `chrome://settings/`). Delivering the click via VNC is the only way to click.
            - Google sign-in or other anti-automation-protected forms
            - Sites that validate input event sequences (keyDown/keyPress/input/keyUp)
            - Any form where CDP type fails silently (value appears but form doesn't accept it)

            **Chrome first-run dialogs:** On fresh profiles, Chrome opens a first-run dialog as a separate window invisible to CDP. Dismiss it by focusing it (a `wl: sway-focus` step) then pressing Return with a `vnc: key` step (`key: Return`).

            See `/charly-check:cdp` for the full Google sign-in recipe.

            ## Using CDP Coordinates with VNC

            The `vnc:` verb takes desktop-absolute coordinates, while CDP returns
            viewport-relative coordinates. A **`cdp: coords`** step bridges them: it reports an
            element's position in three systems — viewport, desktop (via `window.screenX/screenY`),
            and desktop (via the sway tree) — so you author the `vnc: click` with the reported
            desktop `x:`/`y:`:

            ```yaml
            - check: the sync button is located
              context: [deploy]
              cdp:
                method: coords
                tab: "1"
                selector: "#sync-button"
            # Viewport: x=1166 y=310  center=(1220, 328)
            # Desktop:  x=1166 y=421  center=(1220, 439)   ← use these for vnc: click
            - run: click the sync button via the VNC pointer
              context: [deploy]
              vnc:
                method: click
                x: 1220
                y: 439
            ```

            The sibling `wl: click` verb takes the same desktop-absolute coords (the `cdp: coords`
            step reports them), so on a wlroots desktop without VNC author a `wl: click` step with
            the reported desktop `x:`/`y:` instead of `vnc: click`.

            ## NVIDIA Headless: VNC Screenshots Work

            VNC screenshots work correctly on NVIDIA headless for images using `sway-desktop-vnc` (the standard VNC composition). Two fixes enable this:

            1. **Pixman renderer** — `sway-desktop-vnc` forces `WLR_RENDERER=pixman` (software rendering), producing buffers wayvnc can reliably capture
            2. **DPMS workaround** — `wayvnc-wrapper` triggers the missing headless power event that wayvnc 0.9.1 waits for before starting capture

            Both the `vnc: screenshot` step and the `wl: screenshot` step (grim, always works) work on NVIDIA headless:
            ```yaml
            - check: a non-empty VNC framebuffer is captured (works with pixman + DPMS fix)
              context: [deploy]
              vnc:
                method: screenshot
                artifact: /tmp/out.png
                artifact_min_bytes: 5000
            - check: a non-empty Wayland screenshot is captured (grim)
              context: [deploy]
              wl:
                method: screenshot
                artifact: /tmp/wl-out.png
                artifact_min_bytes: 5000
            ```

            ## Cross-References

            - `/charly-check:check` — parent router; the `vnc:` verb dispatches out-of-process via `candy/plugin-vnc` (the host pre-resolves the pod/vm RFB endpoint).
            - `/charly-check:wl` — Wayland-native desktop automation (sibling verb; works on NVIDIA headless).
            - `/charly-check:cdp` — Chrome DevTools Protocol automation (sibling verb; same container, different protocol).
            - `/charly-check:dbus` — D-Bus calls and desktop notifications via the declarative `dbus:` verb served out-of-process by `candy/plugin-dbus`.
            - `/charly-check:wl` — the `wl:` verb's sway-* methods for Sway compositor control (window management, workspaces)
            - `/charly-core:charly-config` — VNC password storage, `secret_backend` setting, `migrate-secrets` command
            - `/charly-core:service` — Managing wayvnc supervisord service
            - `/charly-core:deploy` — VNC password setup in deployment workflows
            - `/charly-core:shell` — Executing commands inside containers
            - `/charly-image:layer` — wayvnc layer configuration (port tcp:5900)

            ## When to Use This Skill

            **MUST be invoked** when the task involves VNC automation, the `vnc:` check verb, RFB protocol desktop interaction, VNC screenshots, clicking coordinates, or VNC authentication. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Desktop automation. Use for pixel-level interaction when CDP can't reach the element. See also `/charly-check:cdp` (DOM, preferred), `/charly-check:wl` (sway subgroup) (window).

wl-skill:
    skill:
        name: wl
        family: check
        owner: charly-check
        description: |-
            MUST be invoked before any work involving: Wayland desktop automation — the `wl:` check verb (screenshots, click/type/scroll/drag, window management, clipboard, resolution control, AT-SPI2 introspection, window geometry), its nested `wl: sway-*` / `wl: overlay-*` methods, or `wl:` declarative steps inside `check:`/`run:` blocks. Served out-of-process by `candy/plugin-wl`. Covers sway-desktop and selkies-desktop image automation on sway, labwc, AND KWin (KDE Plasma) — window management routes to wlrctl on wlroots and kdotool on KWin.
        content: |
            # WL - Wayland Desktop Automation

            ## Overview

            The `wl:` check verb is the unified desktop automation verb for wlroots compositors (sway, labwc) **and KWin (KDE Plasma)**. It is **NOT a host `charly check` subcommand** — it is a declarative check verb served out-of-process by its plugin (`candy/plugin-wl`), parallel to the `cdp:`/`vnc:`/`dbus:` plugin verbs. Author a `wl:` step in a candy/box plan and run it against a live deployment with `charly check live <image> --filter wl`. It provides screenshots, input (click, type, key combos, scroll, drag), window management, clipboard, resolution control, accessibility introspection (AT-SPI2), and window geometry queries. Works on sway-desktop, selkies-desktop (labwc), and selkies-kde-desktop (KWin) images.

            **Served out-of-process — no host CLI subcommand.** The host dispatches the `wl:` verb through the provider registry exactly like a built-in (`ResolveVerb("wl")` → the out-of-process gRPC provider → `Provider.Invoke` with the full `Op`), and the plugin drives the running container's compositor. Authoring is unchanged from a built-in verb: you write `wl: screenshot`, never `plugin: wl`.

            **Per-compositor routing.** The plugin's `detectCompositor` picks the backend per method. On wlroots: `wlrctl` (pointer + `wlrctl toplevel` window management), `wlr-randr` (resolution). On **KWin**: window management (toplevel/windows/focus/close/fullscreen/minimize/geometry) via **`kdotool`** (KWin scripting) + screenshot via `pixelflux`; `status` reports `compositor: kwin`. KWin **keyboard** (type/key — `wtype` needs `zwp_virtual_keyboard_manager_v1`), **clipboard** (`wl-clipboard` needs `wlr-data-control`), **pointer** (click/double-click/mouse/scroll/drag) and **resolution** (`wlr-randr` needs `wlr-output-management`) have NO KWin backend — those wlroots protocols are unimplemented by KWin — so plugin-wl returns a clear "unsupported on KWin" error (not a hang). Proven live on `check-selkies-kde-pod`: `wl: status` → `compositor: kwin`. See the Compositor Compatibility table below.

            ### Authoring a `wl:` step

            Each method is the declarative `wl:` step you author — an ordered list item under the candy/box `plan:`. The method name is the scalar value for a bare-method step (`wl: screenshot`), or the `method:` key of the `wl:` map when the step carries wl-exclusive fields (`x:`, `y:`, `x2:`, `y2:`, `button:`, `text:`, `key:`, `combo:`, `direction:`, `amount:`, `target:`, `action:`, `query:`, `command:`, `artifact:` and the artifact validators) — those live INSIDE the `wl:` map. Only the shared matchers (`stdout:`, `stderr:`, `exit_status:`) and `context:`/`id:`/`timeout:` stay siblings. Nested methods are hyphenated: `wl: overlay-show`, `wl: sway-tree`, `wl: sway-workspaces`. A query is a `check:` step; a side-effect action (click/type/exec/…) is a `run:` step. All `wl:` steps are **deploy-context only** (they need a running deployment), so author them with `context: [deploy]`. See `/charly-check:check` for the full method allowlist. Example:

            ```yaml
            - check: a non-empty desktop screenshot is captured
              context: [deploy]
              wl:
                method: screenshot
                artifact: /tmp/desktop.png
                artifact_min_bytes: 10000
            ```

            ## Quick Reference

            | Action | Declarative step | Description |
            |--------|------------------|-------------|
            | Screenshot | `wl: screenshot` + `artifact:` | Capture desktop as PNG via grim |
            | Click | `wl: click` + `x:` + `y:` | Click at absolute coordinates via wlrctl |
            | Double-click | `wl: double-click` + `x:` + `y:` | Double-click with configurable delay |
            | Type text | `wl: type` + `text:` | Send keyboard input via wtype |
            | Send key | `wl: key` + `key:` | Press a named key via wtype |
            | Key combo | `wl: key-combo` + `combo:` | Send key combination (ctrl+c, alt+tab) |
            | Move mouse | `wl: mouse` + `x:` + `y:` | Move pointer to absolute coordinates |
            | Scroll | `wl: scroll` + `x:` + `y:` + `direction:` | Scroll at coordinates (up/down/left/right) |
            | Drag | `wl: drag` + `x:` + `y:` + `x2:` + `y2:` | Drag between coordinates (experimental) |
            | List windows | `wl: windows` | List windows (wlrctl toplevel, xdotool fallback) |
            | List toplevel | `wl: toplevel` | List Wayland toplevel windows via wlrctl |
            | Focus window | `wl: focus` + `target:` | Focus window (wlrctl toplevel, xdotool fallback) |
            | Close window | `wl: close` + `target:` | Close window via wlrctl toplevel |
            | Fullscreen | `wl: fullscreen` + `target:` | Toggle fullscreen via wlrctl toplevel |
            | Minimize | `wl: minimize` + `target:` | Toggle minimize via wlrctl toplevel |
            | Launch app | `wl: exec` + `command:` | Launch application in container |
            | Resolution | `wl: resolution` + `target:` | Set output resolution via wlr-randr |
            | Clipboard | `wl: clipboard` + `action:` (+ `text:` for set) | Read/write Wayland clipboard (get/set/clear) |
            | Window props | `wl: xprop` + `target:` | Query X11 window properties |
            | Window rect | `wl: geometry` + `target:` | Get window position/size as JSON |
            | A11y tree | `wl: atspi` + `action: tree` | Dump accessibility tree as JSON |
            | A11y find | `wl: atspi` + `action: find` + `query:` | Find elements by name/role |
            | A11y click | `wl: atspi` + `action: click` + `query:` | Click element by name/role |
            | Status | `wl: status` | Check all tool availability |
            | Overlay show | `wl: overlay-show` (+ overlay fields) | Show recording overlay (see `/charly-check:wl-overlay`) |
            | Overlay hide | `wl: overlay-hide` | Remove overlays |

            Every `+ <field>:` entry is a key INSIDE the `wl:` map (`wl: {method: scroll, x: …, y: …, direction: down}`);
            only `stdout:`/`stderr:`/`exit_status:` and `context:`/`id:`/`timeout:` are siblings.

            Run a candy's baked `wl:` steps against a live deployment with
            `charly check live <image> --filter wl` (add `-i <instance>` for multi-instance).

            ## Compositor Compatibility

            Backend availability per compositor (the plugin routes each method to the available one):

            | Tool | Protocol | sway | labwc (selkies) | KWin (KDE Plasma) |
            |------|----------|------|-----------------|-------------------|
            | grim | wlr-screencopy | YES | NO (nested compositor) | NO |
            | pixelflux-screenshot | pixelflux API | NO | YES | YES |
            | wtype | zwp_virtual_keyboard_v1 | YES | YES | NO — fail-fast (KWin lacks the protocol) |
            | wlrctl pointer | wlr-virtual-pointer | YES | YES | NO — pointer unsupported on KWin |
            | wlrctl toplevel | wlr-foreign-toplevel-management | YES | YES | NO — window mgmt via `kdotool` |
            | kdotool | KWin scripting (D-Bus) | NO | NO | YES (toplevel/focus/close/fullscreen/minimize/geometry) |
            | wlr-randr | wlr-output-management | YES | YES | NO — resolution unsupported on KWin |
            | wl-copy/paste | wlr-data-control | YES | YES | NO — fail-fast (KWin lacks wlr-data-control) |
            | xdotool | X11 (XWayland) | YES | YES (on-demand) | YES (on-demand) |
            | swaymsg | i3 IPC | YES | NO | NO |

            **KWin (selkies-kde-desktop) notes.** On a headless rootless nested KWin pod the
            wlroots-backed `wl:` tools do NOT work — KWin implements none of the wlroots
            protocols they need, so `wtype` (keyboard), `wl-clipboard` (clipboard), and
            `wlr-randr` (resolution) each HANG. `plugin-wl` is therefore **compositor-aware**
            (`detectCompositor`): on KWin it routes **status** (`compositor: kwin`),
            **screenshot** (`pixelflux`), and **window management** (toplevel/windows/focus/
            close/fullscreen/minimize/geometry) through **`kdotool`** (KWin's D-Bus scripting),
            and fail-fasts the wlroots paths with a clear "unsupported on KWin" error instead of
            hanging. Pointer (click/double-click/mouse/scroll/drag) likewise has no host-safe
            backend (`org_kde_kwin_fake_input` removed in KWin 6, RemoteDesktop portal
            approval-gated, `/dev/uinput` leaks into the host) and returns the same clear error.
            PROVEN live on `check-selkies-kde-pod`: the `wl-verb-dispatches` probe passes
            (`wl: status` → `compositor: kwin`) alongside the desktop-ready + frame-not-black
            stream coverage the labwc flavor also asserts. (The KDE session itself is a
            `kwin_wayland --wayland-display wayland-1` nested compositor — see
            `/charly-selkies:selkies-kde-desktop` "De-SDDM".)

            **Coordinates.** The `wl:` verb takes **desktop-absolute** `x:`/`y:`. To click an
            element located by CSS selector, read its desktop coordinates from a `cdp: coords`
            step (it reports both viewport and desktop coords) and author the `wl: click` with
            those `x:`/`y:` — see "CDP → WL Bridge" below.

            ## Architecture

            ```
            host (charly check live --filter wl)
               -> resolve the venue (engine + container name)
               -> Op + venue handed to candy/plugin-wl over gRPC
            candy/plugin-wl
               -> exec into the container: export WAYLAND_DISPLAY=… && <tool command>
               -> capture stdout (screenshot/query) or run silently (input)
            ```

            The plugin `exec`s into the container. All tools use native Wayland protocols — no daemon, no `/dev/uinput`, no VNC server required.

            ## Requirements

            - Container must include `wl-tools` layer (wtype, wlrctl, wl-clipboard, wlr-randr, xdotool, ydotool)
            - For screenshots: `wl-screenshot-grim` (sway) or `wl-screenshot-pixelflux` (selkies)
            - Container must have a running Wayland compositor (sway, labwc, etc.)
            - For AT-SPI2: `a11y-tools` layer (python3-pyatspi, python3-gobject) + `dbus` layer
            - For XWayland: an X11 app like `xterm` must be running to trigger XWayland start on labwc
            - Included in `sway-desktop` and `selkies-desktop` metalayers

            ## Methods

            Each method below is a `wl:` plan step authored with `context: [deploy]`; run a
            candy's baked steps with `charly check live <image> --filter wl` (add
            `-i <instance>` for a specific instance).

            ### Key Combo
            ```yaml
            - run: send a key combination
              context: [deploy]
              wl:
                method: key-combo
                combo: ctrl+shift+t        # also ctrl+c, alt+tab, super+l
            ```

            Modifiers: `ctrl`/`control`, `alt`, `shift`, `super`/`win`/`logo`, `meta`. Uses `wtype -M`.

            ### Scroll
            ```yaml
            - run: scroll down at the desktop center
              context: [deploy]
              wl:
                method: scroll
                x: 960
                y: 540
                direction: down            # up/down/left/right
            ```

            Uses xdotool click 4/5/6/7 (X11 scroll buttons) for XWayland windows. Falls back to wtype Page_Up/Page_Down.

            ### Drag (Experimental)
            ```yaml
            - run: drag from one point to another
              context: [deploy]
              wl:
                method: drag
                x: 100
                y: 100
                x2: 400                    # end coordinates
                y2: 300
            ```

            Requires XWayland (uses `xdotool mousemove + mousedown/mouseup`).

            ### Window Management (wlrctl toplevel)
            ```yaml
            - run: focus a window by title
              context: [deploy]
              wl:
                method: focus
                target: Chrome             # also close / fullscreen / minimize via the matching method
            - run: launch a terminal in the container
              context: [deploy]
              wl:
                method: exec
                command: foot              # exec's argv rides wl's `command:` field
            ```

            `wl: toplevel` lists all windows; `wl: close` / `wl: fullscreen` / `wl: minimize` take the same `target:`.

            ### Resolution
            ```yaml
            - run: set the output resolution
              context: [deploy]
              wl:
                method: resolution
                target: 1920x1080          # auto-detect output
            ```

            ### Clipboard
            ```yaml
            - run: write the Wayland clipboard
              context: [deploy]
              wl:
                method: clipboard
                action: set
                text: hello
            ```

            `action: get` reads the clipboard; `action: clear` clears it.

            ### Window Geometry
            ```yaml
            - check: the window geometry is reported
              context: [deploy]
              wl:
                method: geometry
                target: Chrome             # returns JSON: {"x":0,"y":0,"width":1920,"height":1080}
            - check: the active window's X11 properties are reported
              context: [deploy]
              wl: xprop
            ```

            ### AT-SPI2 Accessibility
            ```yaml
            - check: the accessibility tree is dumped
              context: [deploy]
              wl:
                method: atspi
                action: tree               # dump full accessibility tree as JSON
            - run: click an element by name AND role
              context: [deploy]
              wl:
                method: atspi
                action: click
                query: "Save:button"       # name / role / "name:role"
            ```

            Requires `a11y-tools` layer. Chrome needs `--force-renderer-accessibility` flag.

            ### CDP → WL Bridge

            Locate an element's viewport coords with the `cdp: coords` verb (CSS selector in
            Chrome) — it reports both the viewport and the desktop center — then deliver the
            click with a `wl: click` step at the reported desktop `x:`/`y:` (wlrctl pointer —
            critical for selkies-desktop which has no VNC):

            ```yaml
            - check: the submit button is located
              context: [deploy]
              cdp:
                method: coords
                tab: "1"
                selector: "#submit-button"
            - run: deliver the click via the wl pointer at the reported desktop center
              context: [deploy]
              wl:
                method: click
                x: 640
                y: 360
            ```

            ## Sway-Specific Methods (`wl: sway-*`)

            The sway IPC methods are the hyphenated `wl: sway-*` methods. They require a sway
            compositor (swaymsg) and error on labwc.

            ```yaml
            - check: the sway window tree is reported
              context: [deploy]
              wl: sway-tree
            - run: run any swaymsg command
              context: [deploy]
              wl:
                method: sway-msg
                command: focus left        # sway-msg's argv rides wl's `command:` field
            ```

            Other sway methods: `wl: sway-workspaces` / `sway-outputs` (JSON queries),
            `sway-focus` / `sway-move` / `sway-resize` / `sway-kill` / `sway-floating` /
            `sway-layout` / `sway-workspace` (window/workspace control via `target:`),
            and `sway-reload` (reload sway config).

            ## Differences from VNC

            | Aspect | `wl:` verb | `vnc:` verb |
            |--------|---------|----------|
            | Compositors | All wlroots (+ sway-* methods) | Requires wayvnc |
            | Transport | exec into container | TCP port 5900 |
            | Window mgmt | wlrctl toplevel + sway IPC | No |
            | Clipboard | wl-copy/paste | rfb cut-text |
            | Remote access | No | Yes (TCP) |
            | NVIDIA headless | Works | Works (pixman + DPMS fix) |

            Source: `candy/plugin-wl` (the out-of-process Wayland-automation provider).

            ## Cross-References

            - `/charly-check:check` — parent router; the `wl:` verb catalog entry, the method allowlist, and `charly check live <image> --filter wl`.
            - `/charly-internals:plugin` — the out-of-process provider model that serves `wl` (`candy/plugin-wl`).
            - `/charly-check:vnc` — VNC/RFB protocol alternative via the declarative `vnc:` verb (sibling verb; TCP-based, works remotely).
            - `/charly-check:cdp` — Chrome DevTools Protocol via the declarative `cdp:` verb (sibling verb; DOM-level interaction, `axtree` for accessibility).
            - `/charly-check:dbus` — D-Bus calls and desktop notifications via the declarative `dbus:` verb served out-of-process by `candy/plugin-dbus`.
            - `/charly-selkies:wl-tools` — Compositor-agnostic tools (wtype, wlrctl, wl-clipboard, wlr-randr, xdotool, ydotool)
            - `/charly-check:wl-overlay` — Fullscreen overlays for recordings (title cards, lower-thirds, countdowns, highlights, fades) via the `wl: overlay-*` methods
            - `/charly-selkies:wl-overlay-layer` — Overlay layer (gtk4-layer-shell, python3-gobject)
            - `/charly-selkies:wl-screenshot-grim` — Screenshot layer for sway (grim, wlr-screencopy)
            - `/charly-selkies:wl-screenshot-pixelflux` — Screenshot layer for selkies (pixelflux rendering pipeline)
            - `/charly-selkies:a11y-tools` — AT-SPI2 accessibility (python3-pyatspi, python3-gobject)
            - `/charly-selkies:xterm` — X11 terminal for XWayland testing
            - `/charly-selkies:sway-desktop` — Desktop metalayer (wl-tools + wl-screenshot-grim)
            - `/charly-selkies:selkies-desktop-layer` — Desktop metalayer (wl-tools + wl-screenshot-pixelflux + a11y-tools + xterm)

wl-overlay-skill:
    skill:
        name: wl-overlay
        family: check
        owner: charly-check
        description: |-
            Fullscreen Wayland overlays for screen recordings via gtk4-layer-shell.
            MUST be invoked before any work involving: the `wl: overlay-*` methods, recording
            overlays, title cards, lower-thirds, countdowns, or fade transitions.
        content: |
            # WL Overlay -- Wayland Desktop Overlays for Recording

            ## Overview

            The `wl: overlay-*` methods create and manage fullscreen Wayland overlays using the layer-shell protocol via gtk4-layer-shell. Overlays render directly in the compositor, appearing natively in screen recordings without post-production editing. Supports true alpha transparency — desktop content is visible through semi-transparent overlays. They are part of the `wl:` check verb — **NOT a host `charly check` subcommand** — served out-of-process by `candy/plugin-wl`. Author a `wl: overlay-show` / `wl: overlay-hide` step in a candy/box plan and run it against a live deployment with `charly check live <image> --filter wl`.

            ## Architecture

            Three components work together:

            1. **`wl-overlay` layer** — installs `gtk4-layer-shell`, `gtk4`, `python3-gobject` RPMs + `charly-overlay` Python daemon/client
            2. **The `wl: overlay-*` methods** — dispatched out-of-process to `candy/plugin-wl`, which resolves the container and invokes `charly-overlay` inside it
            3. **`charly-overlay` daemon** — GTK4 application managing multiple named overlay windows via Unix socket IPC

            The daemon starts on-demand in a tmux session (`charly-overlay-daemon`) when the first `overlay-show` runs. It persists until `overlay-hide` (with `all: true`) or the tmux session is killed.

            ## Quick Reference

            | Action | Declarative step | Description |
            |--------|------------------|-------------|
            | Show overlay | `wl: overlay-show` (+ `type:` + `text:`) | Display a named overlay |
            | Hide one | `wl: overlay-hide` + `name:` | Remove specific overlay |
            | Hide all | `wl: overlay-hide` + `all: true` | Remove all overlays |
            | List | `wl: overlay-list` | List active overlays (JSON) |
            | Status | `wl: overlay-status` | Check daemon health |

            ## Overlay Types

            Each example is a `wl: overlay-show` step authored with `context: [deploy]`. The former
            CLI flags are the step's sibling fields (see "Overlay-show fields" below).

            ### Text (Title Card)

            Full-screen semi-transparent overlay with centered text. Use for intro/outro title cards.

            ```yaml
            overlay-title:
                run: show a title card
                wl: overlay-show
                context: [deploy]
                type: text
                text: Building a REST API
                bg: rgba(0,0,0,0.7)
                font_size: 64
                name: title
            ```

            ### Lower-Third

            Bottom-anchored bar with name and optional subtitle. Use for speaker identification.

            ```yaml
            overlay-speaker:
                run: show a lower-third speaker ID
                wl: overlay-show
                context: [deploy]
                type: lower-third
                text: Andreas Trawoeger
                subtitle: Developer
                name: speaker
            ```

            ### Watermark

            Corner-anchored persistent text at low opacity. Use for draft/preview markers.

            ```yaml
            overlay-watermark:
                run: show a draft watermark
                wl: overlay-show
                context: [deploy]
                type: watermark
                text: DRAFT
                position: bottom-right
                color: red
                opacity: 0.5
                name: wm
            ```

            Default opacity is 0.3. Positions: `top-left`, `top-right`, `bottom-left`, `bottom-right`, `top`, `bottom`.

            ### Countdown

            Full-screen animated countdown that auto-hides on completion. Use before recording starts.

            ```yaml
            overlay-countdown:
                run: show a 5-second countdown
                wl: overlay-show
                context: [deploy]
                type: countdown
                seconds: 5
                name: cd
            ```

            ### Highlight

            Transparent overlay with a colored rectangle at specified coordinates. Use to draw attention to a screen region.

            ```yaml
            overlay-highlight:
                run: highlight a screen region
                wl: overlay-show
                context: [deploy]
                type: highlight
                region: "430,290,510,50"
                color: rgba(255,0,0,0.4)
                name: hl
            ```

            Region format: `X,Y,Width,Height` in pixels.

            ### Fade

            Full-screen solid color overlay. Use for transitions (fade to black, fade to white).

            ```yaml
            overlay-fade:
                run: fade to black
                wl: overlay-show
                context: [deploy]
                type: fade
                color: black
                name: outro
            ```

            ## Duration Auto-Hide

            Any overlay (except countdown, which has built-in auto-hide) can auto-remove after a duration via the `duration:` field:

            ```yaml
            overlay-intro:
                run: show an intro card that auto-hides after 5s
                wl: overlay-show
                context: [deploy]
                type: text
                text: INTRO
                duration: 5s
                name: intro
            ```

            Supported formats: `5s`, `1.5m`, `500ms`, or bare seconds (`5`).

            ## Recording Workflow

            Overlays compose naturally with the declarative `record:` verb (`/charly-check:record`,
            served out-of-process by `candy/plugin-record`): bracket the captured timeline with
            `record: start` … `record: stop` plan steps, and drive the overlay actions with sibling
            `wl: overlay-show` / `wl: overlay-hide` steps in the same plan. Run it with
            `charly check live <image> --filter record --filter wl`.

            ```yaml
            # candy/<name>/charly.yml — the recorded timeline as ordered record:/wl: steps
            title-card:
                run: show the title card
                wl: overlay-show
                context: [deploy]
                type: text
                text: Building a REST API
                bg: rgba(0,0,0,0.9)
                font_size: 64
                name: title
            record-begin:
                run: start the desktop recording
                record: start
                context: [deploy]
                record_mode: desktop
            title-hide:
                run: fade out the title card
                wl: overlay-hide
                context: [deploy]
                name: title
            lower-third:
                run: show the speaker lower-third
                wl: overlay-show
                context: [deploy]
                type: lower-third
                text: Andreas Trawoeger
                subtitle: Developer
                name: speaker
            outro-fade:
                run: fade to black for the ending
                wl: overlay-show
                context: [deploy]
                type: fade
                color: black
                name: outro
            record-end:
                run: stop and copy out the recording
                record: stop
                context: [deploy]
                artifact: /tmp/demo.mp4
            overlay-clear:
                run: remove all overlays
                wl: overlay-hide
                context: [deploy]
                all: true
            ```

            ## Compositor Compatibility

            All overlay types work on all wlroots-based compositors:

            | Compositor | Environment | Status | Notes |
            |-----------|-------------|--------|-------|
            | sway | sway-browser-vnc | WORKS | Instant rendering, captured by wayvnc |
            | labwc | selkies-desktop | WORKS | ~15s capture latency in controller mode (no browser). Instant in recordings |

            ### Key Technical Details

            - **True RGBA transparency**: enabled by `window { background: none; }` CSS at daemon startup. Without this, GTK4 on Wayland creates opaque surfaces
            - **Cairo-drawn backgrounds**: backgrounds are painted via `Gtk.DrawingArea` + Cairo, not CSS. GTK4 CSS `background-color` with `rgba()` does not composite correctly on layer-shell windows
            - **Layer**: uses `Gtk4LayerShell.Layer.OVERLAY` (highest z-order, above waybar/swaync)
            - **Keyboard**: `KeyboardMode.NONE` — overlays never capture input
            - **Exclusive zone**: `-1` — overlays don't push other windows
            - **Python interpreter**: uses `/usr/bin/python3` (system Python with PyGObject), not pixi's Python

            ### Selkies-Desktop Capture Latency

            On selkies-desktop, `pixelflux-screenshot` captures from the H.264 WebSocket stream. In controller mode (no browser client connected), the frame rate is very low — screenshots may take 15-30 seconds to reflect overlay changes. **This does NOT affect recordings** — the `record:` verb captures at 30fps, so overlays appear immediately in recorded video.

            ## IPC Protocol

            Socket: `/tmp/charly-overlay.sock` (Unix domain, JSON-line)

            ```json
            {"action":"show","type":"text","text":"Hello","name":"intro","bg":"rgba(0,0,0,0.7)"}
            {"action":"hide","name":"intro"}
            {"action":"hide_all"}
            {"action":"list"}
            {"action":"status"}
            ```

            ## Overlay-show fields

            The `wl: overlay-show` step carries these fields (the former CLI flags):

            | Field | Default | Description |
            |------|---------|-------------|
            | `type` | (required) | `text`, `lower-third`, `watermark`, `countdown`, `highlight`, `fade` |
            | `text` | `""` | Text content |
            | `subtitle` | `""` | Subtitle (lower-third only) |
            | `name` | auto-generated | Overlay identifier for hide/list |
            | `position` | `center` | Positioning (watermark: corner anchoring) |
            | `bg` | type-dependent | Background color (CSS rgba or named) |
            | `color` | `white` | Text/highlight color |
            | `font_size` | `48` | Font size in pixels |
            | `opacity` | `1.0` (watermark: `0.3`) | Overall window opacity |
            | `duration` | none | Auto-hide after duration (e.g. `5s`) |
            | `seconds` | `3` | Countdown seconds |
            | `region` | `100,100,400,300` | Highlight region `X,Y,W,H` |

            ## Requirements

            - Container must include `wl-overlay` layer (gtk4-layer-shell + python3-gobject)
            - Container must have a running Wayland compositor (sway, labwc)
            - Container must have `tmux` layer (for daemon hosting)
            - Included in `sway-desktop` and `selkies-desktop` metalayers

            ## Cross-References

            - `/charly-check:wl` — Compositor-agnostic desktop automation via the `wl:` verb (screenshots, input, windows)
            - `/charly-check:record` — Terminal and desktop recording via the `record:` verb (overlays compose with the recording workflow)
            - `/charly-check:cdp` — Chrome DevTools Protocol via the `cdp:` verb (DOM-level interaction)
            - `/charly-selkies:wl-overlay-layer` — Layer reference (RPM packages, dependencies)
            - `/charly-selkies:sway-desktop` — Desktop metalayer (includes wl-overlay)
            - `/charly-selkies:selkies-desktop-layer` — Desktop metalayer (includes wl-overlay)

            Source: `candy/plugin-wl` (the out-of-process provider), `candy/wl-overlay/charly-overlay` (Python daemon/client).


charly-core:
    candy:
        version: 2026.218.1200
        description: |-
            Concept candy owning the charly-core command skills (start/stop/status/logs/shell/ssh/deploy/…). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the core concept candy's skill entities are present and generated into plugins/core/skills
              id: charly-core-present
              context:
                - build
              command: "true"

charly-config-skill:
    skill:
        name: charly-config
        family: core
        owner: charly-core
        description: |-
            MUST be invoked before any work involving: charly config commands, image deployment setup, quadlet generation, secrets provisioning, encrypted volumes, data seeding, or volume backing configuration.
            Named `charly-config` (not `config`) to disambiguate from Claude Code's built-in `/config` slash command.
        content: |
            # charly config -- Image Deployment Configuration

            ## Overview

            `charly config` configures an image for deployment. In `run_mode=quadlet` (the default on systemd-user hosts) it generates a systemd quadlet unit, provisions container secrets, initializes encrypted volumes, and seeds data from data candies into the image's volumes. In `run_mode=direct` (auto-selected on nested environments without systemd-user — check-sandbox pods, supervisord-only containers, sysvinit hosts) it skips quadlet+systemctl and runs the container via `podman run -d`, recording a marker file at `~/.config/charly/direct/<name>.json` so `charly start`/`charly remove` can find it. Direct mode does NOT support sidecars, encrypted volumes, or cloudflare tunnel companion services (those require systemd) — warnings are emitted and the operation proceeds without those features.

            This is the **single entry point** for **container** deployment setup. `charly start` requires `charly config` to have been run first in quadlet mode.

            **Relationship to `charly fleet add`** — `charly config` remains the primary way to create/update a quadlet and provision secrets/volumes/sidecars for a container deploy. `charly fleet add <name> <ref>` (container target) wraps both `charly config` and `charly start` and additionally handles `--add-candy` overlay synthesis (an overlay Containerfile is built before the quadlet references the resulting overlay image). `charly fleet add host` bypasses `charly config` entirely — the host target has no quadlet; it writes systemd units directly (when `--with-services` is enabled) and records every action in the ledger at `~/.config/opencharly/installed/`. See `/charly-core:deploy` for the command family and `/charly-local:local-deploy` for host-target semantics.

            **`charly config` vs `charly settings` — common verb confusion.** `charly config <image>` configures an image for deployment (quadlet + secrets + volumes + data seed). `charly settings list` shows runtime config keys (secret_backend, vm.backend, etc.). A trailing `charly config show` parses as `charly config setup show` with `show` as the image positional — and errors with `image "show" is not available locally`. To inspect runtime configuration use `charly settings list`; to inspect a configured image's resolved deploy state use `charly box inspect <image>` or `charly fleet show <name>`.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Full setup | `charly config <image>` | Quadlet + secrets + volumes + data seed |
            | Instance setup | `charly config <image> -i <instance>` | Deploy named instance with separate config |
            | With bind mount | `charly config <image> --bind workspace=~/project` | Bind workspace to host dir |
            | With encryption | `charly config <image> --encrypt data` | Encrypted volume via gocryptfs |
            | Volume config | `charly config <image> -v data:bind:/mnt/nas` | Explicit volume backing |
            | Manual passwords | `charly config <image> --password manual` | Prompt for each secret |
            | Re-seed data | `charly config <image> --force-seed` | Overwrite existing data |
            | Seed from other image | `charly config <image> --data-from data-image:v1` | Use separate data image |
            | No data seed | `charly config <image> --no-seed` | Skip data provisioning |
            | Keep mounts | `charly config <image> --keep-mounted` | Keep encrypted volumes mounted after setup |
            | Show status | `charly config status <image>` | Show encrypted volume status |
            | Mount volumes | `charly config mount <image>` | Mount encrypted volumes |
            | Unmount volumes | `charly config unmount <image>` | Unmount encrypted volumes |
            | Change password | `charly config passwd <image>` | Change gocryptfs password |
            | Remove config | `charly config remove <image>` | Disable quadlet service (quadlet file remains) |

            ## Subcommands

            | Subcommand | Description |
            |------------|-------------|
            | `setup` (default) | Full setup: quadlet + secrets + encrypted volumes + data seed |
            | `status` | Show encrypted volume mount status |
            | `mount` | Mount encrypted volumes |
            | `unmount` | Unmount encrypted volumes |
            | `passwd` | Change gocryptfs password |
            | `remove` | Disable quadlet service (quadlet file remains) |

            ## Setup Flags

            | Flag | Short | Default | Description |
            |------|-------|---------|-------------|
            | `--tag` | | `latest` | Image tag to use |
            | `--build` | | | Force local build instead of pulling |
            | `--env` | `-e` | | Set container env var (KEY=VALUE), merged with existing vars (upsert by key) |
            | `--clean` | `-c` | | Replace all env vars instead of merging (clean slate) |
            | `--env-file` | | | Load env vars from file |
            | `--instance` | `-i` | | Instance name (multiple containers of same image) |
            | `--port` | `-p` | | Remap host port (newHost:containerPort) |
            | `--keep-mounted` | | | Keep encrypted volumes mounted after setup |
            | `--password` | | `auto` | `auto`: generate secrets, `manual`: prompt for each |
            | `--volume` | `-v` | | Configure volume backing (`name:type[:path]`). Type: volume\|bind\|encrypted |
            | `--bind` | | | Shorthand: configure volume as bind mount (name or name=path) |
            | `--encrypt` | | | Shorthand: configure volume as encrypted (gocryptfs) |
            | `--seed` | | `true` | Seed image volumes (bind mounts AND named volumes) with data from the image's data candies |
            | `--no-seed` | | | Disable data seeding |
            | `--force-seed` | | | Re-seed even if target directory is not empty |
            | `--data-from` | | | Seed data from a different data image |
            | `--no-auto-detect` | | | Disable GPU/device auto-detection (skips DRINODE, DRI_NODE, HSA_OVERRIDE_GFX_VERSION injection) |
            | `--ssh-key` | | `auto` | SSH public key: `auto` (default ~/.ssh key), path to .pub file, `generate`, or `none` |
            | `--update-all` | | | Regenerate quadlets for all other deployed images to pick up service env changes |
            | `--memory-max` | | | Cgroup `memory.max` hard OOM limit (e.g. `6g`, `500m`). Persists to charly.yml. |
            | `--memory-high` | | | Cgroup `memory.high` soft limit — reclaim pressure kicks in before OOM. Persists to charly.yml. |
            | `--memory-swap-max` | | | Cgroup `memory.swap.max` ceiling (e.g. `2g`). Persists to charly.yml. |
            | `--cpus` | | | CPU quota in cores (e.g. `2.5` for 2.5 cores). Persists to charly.yml. |

            ## How It Works

            1. Requires `run_mode=quadlet` (default) or `direct` (auto-selected on systemd-less hosts; skips quadlet+systemctl, runs via `podman run -d`)
            2. Resolves image reference (local or remote `github.com/...`)
            3. Ensures image exists in run engine (transfers if needed)
            4. Extracts metadata from OCI image labels
            5. Generates quadlet `.container` file in `~/.config/containers/systemd/`
            6. Provisions container secrets (from `ai.opencharly.secret` label)
            7. Resolves volume backing (named, bind, or encrypted)
            8. Initializes encrypted volumes (gocryptfs) if configured
            9. Seeds data candies into the image's volumes (bind mounts AND podman named volumes)
            10. Runs `systemctl --user daemon-reload`
            11. Injects `env_provide` entries from image labels into charly.yml `provides.env:` (resolves `{{.ContainerName}}` templates)
            12. Injects `mcp_provide` entries from image labels into charly.yml `provides.mcp:` (resolves templates, defaults transport to `http`)
            13. Synthesizes `CHARLY_MCP_SERVERS` JSON env var for consumer containers (pod-aware: same-image entries resolve to `localhost`)
            14. Warns about missing `mcp_require` servers (same pattern as `env_require` warnings)
            15. If `--update-all`, regenerates quadlets for all other deployed images (preserving Instance, Tunnel, PodName, Sidecars, and instance-scoped volume names) and reloads systemd

            ## Volume Backing

            Volumes declared in charly.yml default to named volumes. At `charly config` time, backing can be changed per-volume:

            ```bash
            # Named volume (default)
            charly config my-app

            # Bind mount to host directory
            charly config my-app --bind workspace=~/project
            charly config my-app -v workspace:bind:~/project    # Equivalent

            # Encrypted (gocryptfs)
            charly config my-app --encrypt data
            charly config my-app -v data:encrypted              # Equivalent
            charly config my-app -v data:encrypt:/mnt/ssd       # With explicit path

            # Multiple volumes
            charly config my-app --bind workspace=~/project --encrypt data -v models:bind
            ```

            Auto-path for bind without explicit host path: `<volumes_path>/<image>/<name>` (default: `~/.local/share/charly/volumes/`).

            ### Bind-mounting a project checkout for `charly mcp serve`

            The `charly-mcp` layer declares a `project` volume at `/workspace` (the volume NAME stays `project` for a stable deployer API) and sets `env: CHARLY_PROJECT_DIR=/workspace`. Bind-mount your opencharly checkout at config time so build-mode MCP tools (`box.build`, `box.list.boxes`, `box.inspect`) can read `charly.yml`. Alternatively, skip the bind-mount and `charly mcp serve` will auto-fall back to the upstream `opencharly/charly` repo (see `/charly-build:charly-mcp-cmd` "Project-dir wiring"):

            ```bash
            charly config charly-arch --bind project=/home/you/opencharly
            charly start charly-arch
            charly check live charly-arch --filter mcp
            # → the baked mcp: call box.list.boxes step lists images from the bind-mounted /home/you/opencharly
            ```

            The `CHARLY_PROJECT_DIR` env var is consumed by the charly binary's global `-C` / `--dir` / `CHARLY_PROJECT_DIR` flag (`charly/main.go` calls `os.Chdir(Dir)` before Kong dispatch). See `/charly-image:image` "Project directory resolution" and `/charly-build:charly-mcp-cmd` "Deployment: the `charly-mcp` layer" for the full pattern.

            ## Secret Provisioning

            Secrets declared in `charly.yml` `secret:` field are stored as OCI label metadata. At config time:

            - `--password auto` (default): generates random passwords for all secrets
            - `--password manual`: prompts for each secret

            **Idempotent:** existing Podman secrets are never overwritten. To force re-provisioning: `charly config <image> --refresh-secret <name>` (repeatable; `all` rotates every secret of the image, sidecars included; a candy-owned auto-generated secret gets a NEW value — re-initialize services that stored the old one). Unknown names produce a warning naming the image.

            ## Data Seeding

            Data candies (candies with `data:` field) stage files into `/data/<volume>/<dest>/` at build time. At config time:

            - **First config** (`--seed`, default true): copies staged data into the image's volumes (both bind mounts and named volumes)
            - **Subsequent config**: skips if `data_seeded` flag is set in charly.yml
            - **`--force-seed`**: re-seeds even if directory is not empty
            - **`--data-from <image>`**: seeds from a separate data image instead of the target image

            ### Volume-kind dispatch

            Seeding runs for both volume backings, with a minor difference in how podman is invoked:

            - **Bind mount** (`--bind <name>` or `--bind <name>=<path>`, or `type: bind` in charly.yml): the seeder runs `podman run --rm -v <host-path>:/seed --userns=keep-id:uid=<UID>,gid=<GID> <image> bash -c "cp -a /data/<vol>/. /seed/"`. The `--userns=keep-id` aligns the in-container UID with the real host UID so files end up owned by the host user.
            - **Named volume** (the default): the seeder runs `podman run --rm -v <charly-image-name>:/seed <image> bash -c "cp -a /data/<vol>/. /seed/"` — **without** `--userns=keep-id`. Named volumes live in the rootless subuid space; the runtime container reads them without keep-id, so the seeder must write with the same identity.

            For `FROM scratch` data images (`data_image: true`), bind-mount targets use `podman create` + `podman cp` (the simpler path), and named-volume targets use `podman run --mount type=image,src=<scratch>,dst=/staging,rw=false` with a lightweight `busybox:stable` helper image as the runnable side (pulled lazily on first use).

            ### Emptiness check

            `DataProvisionInitial` only runs when the target is empty:

            - **Bind mount**: checks the per-entry subdirectory (`<bind-root>/<dest>/`) via `os.ReadDir`, so data candies with distinct `dest:` values can coexist in the same bind mount.
            - **Named volume**: checks the volume root via `podman volume inspect --format {{.Mountpoint}}` followed by `os.ReadDir` of the returned path. Per-entry subdirectory checks aren't available without exec'ing into a container, so multiple entries targeting the same named volume all run on the initial seed and then transition to merge-safe `cp -an` on subsequent runs.

            ### Data candy ordering (bind mounts only)

            For **bind-mounted** targets, data candies that target the volume **root** (`dest:` absent or empty — e.g. `notebook-templates`, which drops `getting-started.ipynb` directly into `~/workspace/`) should be listed **first** in the box's `candy:` list. A root-targeted candy ordered after subdirectory-targeted candies will see the root as non-empty (because subdirs from earlier candies exist) and skip. This is a convention, not a hard-enforced rule.

            This ordering caveat does not apply to named-volume targets, where the initial seed runs against the whole volume regardless of sub-paths.

            ## Encrypted Volumes

            Encrypted volumes use gocryptfs. Each volume gets `{cipher,plain}` subdirectories:

            - Default path: `<encrypted_storage_path>/charly-<image>-<name>/`
            - Explicit path: `--volume name:encrypt:/path` stores directly at `/path/{cipher,plain}`
            - Mounted via `ExecStartPre=charly config mount` in the quadlet
            - Each mount runs in a `systemd-run --scope` unit (survives container restart)
            - `-allow_other` flag for rootless podman with `--userns=keep-id`

            ### Fast path: `charly config mount` short-circuit

            When every requested encrypted volume for an image is already mounted — the
            typical state on service restart, because `charly-enc-<image>-<volume>.scope`
            units survive container stop/restart independently of the service's cgroup —
            `charly config mount <image>` short-circuits and returns without touching the
            credential store at all. Output is:

                All encrypted volumes for <image> already mounted (N/N)

            This makes service restarts (`charly restart <image>`)
            resilient to temporary keyring backend problems: the only reason to query the
            keyring is to get the passphrase for a fresh `gocryptfs -init` or mount, and
            the short-circuit skips that entirely when no new mount is needed. A broken
            `default` alias in the Secret Service — for example, KeePassXC's FdoSecrets
            plugin advertising a stub collection — does NOT block restarts.

            When a volume IS unmounted and needs to be remounted, the normal path runs:
            `resolveEncPassphraseForMount` queries the credential store via the
            iteration-capable `ssClient` (not just the Secret Service default alias), so
            even then the broken-stub scenario still resolves automatically by finding
            the credential in a sibling healthy collection. See `/charly-automation:enc` for the full
            iteration order, the bounded `encMountDeadline` retry behavior, and the
            source classification (`env`/`keyring`/`config`/`locked`/`unavailable`/`default`).

            ## Resource Caps

            Memory and CPU caps flow through the same `security:` block as `shm_size`.
            Layers can declare defaults; image/deploy overrides replace them. CLI flags
            on `charly config` persist to `charly.yml` and take effect on the next quadlet
            regeneration.

            ```bash
            # Box-level default (all instances)
            charly config selkies-desktop --memory-max=6g --memory-high=5g --memory-swap-max=2g

            # Per-instance override (tighter cap for one instance)
            charly config selkies-desktop -i 192.241.92.221 --memory-max=8g

            # CPU quota on an unrelated image
            charly config jupyter --memory-max=16g --cpus=8
            ```

            Merge rules (see `sdk/deploykit/security.go`):

            - **Layers → image**: smallest value wins (`minCap` / `minCpus`). A tighter
              cap is a smaller blast radius, so it's the safer default.
            - **Box-level and deploy-level overrides**: full replace, identical to
              how `shm_size` is handled.

            Emitted as native systemd cgroup directives (`MemoryMax=`, `MemoryHigh=`,
            `MemorySwapMax=`, `CPUQuota=`) in the quadlet's `[Service]` section,
            guaranteed to work on every systemd version charly targets. For the runtime
            (non-quadlet) path, `SecurityArgs` also emits the equivalent
            `podman run --memory / --memory-reservation / --memory-swap / --cpus` flags.

            `CPUQuota` uses systemd's percentage form — `--cpus=2.5` → `CPUQuota=250%`
            (one full core is `100%`).

            ### Gotchas

            - Lowercase suffixes (`6g`) are auto-normalized to `6G`. systemd silently
              parses lowercase as `infinity` — no error, just no limit — so charly coerces
              everything to the canonical uppercase form before emitting the quadlet.
            - Field-level merge in deploy means `--memory-max` won't wipe co-set fields
              like `shm_size`. Unset CLI fields fall through to layer/image defaults
              rather than being replaced with zero values.
            - Resource caps merge **smallest-wins** across layers (tightest cap = smallest
              blast radius). Box-level and deploy-level overrides replace entirely.

            ## Port-conflict detection

            When a `-p HOST:CONTAINER` flag publishes onto a host port that another listener already holds, `charly config` emits a **soft warning** (does not abort) and suggests a remap:

            ```
            Warning: port conflicts detected:
              Port 13000 is in use
                Fix: find and stop the process using port 13000
                Or remap: charly start openclaw-desktop --port 13001:3000
            Wrote /home/user/.config/containers/systemd/charly-<image>-<instance>.container
            ```

            The quadlet is still written with the conflicting port, so `charly start` will fail at bind time unless you either free the port, re-run `charly config` with a remap, or edit `charly.yml`. Detection uses a local `net.Listen` probe per published port at configure time. Handy for multi-instance deployments alongside a production fleet (e.g., running `/charly-openclaw:openclaw-desktop` as a test instance while `/charly-selkies:selkies-labwc` holds the canonical 3000/9222/9224/2222 range).

            ## Deploy State

            All configuration is persisted to `~/.config/charly/charly.yml` in the compact
            node-form — a `version:` stamp, an optional top-level `provides:` directive, and each
            deploy as a name-first `<name>: {<substrate-kind>: <body>}` entry whose substrate-kind
            value carries the scalars, collections (`port:`/`volume:`/…), and `plan:` inline, with
            any nested/peer members as sibling child nodes (no `deploy:` map wrapper, no `target:`
            field — the substrate kind at the edge selects the target):

            ```yaml
            my-app:
              pod:
                image: my-app
                tag: latest
                data_seeded: true
                data_source: "my-app:latest"
                volume:
                  - name: workspace
                    type: bind
                    host: ~/project
            ```

            ## Common Workflows

            ### Deploy a Jupyter notebook server

            ```bash
            charly config jupyter-ml-notebook --bind workspace=~/notebooks
            charly start jupyter-ml-notebook
            # Open http://localhost:8888
            ```

            ### Deploy with encrypted model cache

            ```bash
            charly config ollama --encrypt models
            # Prompted for gocryptfs password on first setup
            charly start ollama
            ```

            ### Remove and reconfigure

            ```bash
            charly config remove my-app
            charly config my-app --bind workspace=/new/path
            ```

            ### Full instance removal

            `charly remove <image> -i <instance>` is the complete teardown: it stops the container, deletes the quadlet file, and reloads systemd. `charly config remove` only disables the quadlet service (the quadlet file remains), and `charly fleet reset` removes the charly.yml entry — neither is a full removal on its own:

            ```bash
            charly remove <image> -i <instance>          # Complete teardown: stop container, delete quadlet, reload systemd
            charly config remove <image> -i <instance>   # Disable quadlet service only (quadlet file remains)
            charly fleet reset <image> -i <instance>     # Remove charly.yml entry only
            ```

            Run `charly config <image> --update-all` after removing an instance so the clean state propagates to the remaining deployments.

            ### Multi-instance proxy deployment

            Deploy multiple browser instances with different HTTP proxies (e.g., for selkies-desktop):

            ```bash
            charly config selkies-desktop -i 198.145.102.110 \
              -e HTTP_PROXY=http://198.145.102.110:5466 \
              -e HTTPS_PROXY=http://198.145.102.110:5466 \
              -e "NO_PROXY=localhost,127.0.0.1" \
              -p 3006:3000 -p 9236:9222
            charly start selkies-desktop -i 198.145.102.110
            ```

            Each instance gets unique host ports. The Chrome layer's `chrome-wrapper` translates `HTTP_PROXY`/`HTTPS_PROXY` into Chrome's `--proxy-server` flag. Verify with the `cdp:` check verb (served out-of-process by candy/plugin-cdp) — author `cdp: status` / `cdp: open` (`url: https://ip.me`) / `cdp: eval` (`expression: document.querySelector('#ip-lookup').value`) steps and run them against the instance:

            ```bash
            charly check live selkies-desktop -i 198.145.102.110 --filter cdp
            ```

            ## Service Environment Injection

            When a configured image declares `env_provide` or `mcp_provide` in its layers (stored in OCI labels), `charly config` automatically injects those entries into the `provides:` section of `charly.yml`. This enables cross-container service discovery without manual configuration. Verify that an injected MCP endpoint is actually reachable with the `mcp:` check verb (`charly check live <image> --filter mcp`) — see `/charly-build:charly-mcp-cmd` for the full verb surface.

            ```yaml
            # charly.yml after `charly config ollama && charly config jupyter`
            provides:
              env:
                - name: OLLAMA_HOST
                  value: http://charly-ollama:11434
                  source: ollama
              mcp:
                - name: jupyter
                  url: http://charly-jupyter:8888/mcp
                  transport: http
                  source: jupyter
            ollama:
              pod:
                image: ollama
            jupyter:
              pod:
                image: jupyter
            ```

            **Self-exclusion (env):** An image's own env_provide vars are filtered out of its own environment — the image uses its own `env:` (e.g., `OLLAMA_HOST=0.0.0.0`), not the service discovery URL.

            **Pod-aware (MCP):** When provider and consumer share a container, MCP URLs resolve to `localhost` instead of container hostname. No self-exclusion for MCP — same-container consumers always see their own MCP servers.

            **Propagation:** Use `--update-all` to regenerate quadlets for all other deployed images so they pick up the new env vars immediately. Without `--update-all`, other images pick up the env vars on their next `charly config` or `charly update`.

            **Cleanup:** `charly config remove` and `charly remove` automatically remove the service's injected vars from the global env.

            See `/charly-image:layer` for `env_provide` field documentation.

            ### Instance-Aware MCP Server Naming

            When deploying with `-i <instance>`, `injectMCPProvides` appends `-<instance>` to each MCP server name. This prevents naming collisions when multiple instances of the same image provide the same MCP server:

            ```bash
            # Base deployment — MCP name: "chrome-devtools"
            charly config selkies-desktop --update-all

            # Instance deployment — MCP name: "chrome-devtools-31.58.9.4"
            charly config selkies-desktop -i 31.58.9.4 \
              -e HTTP_PROXY=http://31.58.9.4:6077 \
              -p 3001:3000 --update-all
            ```

            Result in `charly.yml` `provides.mcp`:
            ```yaml
            - name: chrome-devtools
              url: http://charly-selkies-desktop:9224/mcp
              source: selkies-desktop
            - name: chrome-devtools-31.58.9.4
              url: http://charly-selkies-desktop-31.58.9.4:9224/mcp
              source: selkies-desktop/31.58.9.4
            ```

            Consumers (e.g., hermes) see both as distinct MCP servers in `CHARLY_MCP_SERVERS`. On re-config, stale MCP entries from the same source are automatically cleaned before new entries are injected.

            Source: `candy/plugin-deploy-pod/provides_inject.go` (`injectMCPProvidesInto`).

            ## Hermes LLM Provider Auto-Configuration Example

            The hermes layer uses `-e` env vars to auto-configure its LLM provider on first start. Pass the API key at config time:

            ```bash
            # Ollama Cloud
            charly config hermes -e OLLAMA_API_KEY=your-key

            # OpenRouter
            charly config hermes -e OPENROUTER_API_KEY=sk-or-xxx

            # Local Ollama (OLLAMA_HOST auto-injected by charly config ollama --update-all)
            charly config ollama --update-all
            charly config hermes
            ```

            All providers whose keys are present get registered simultaneously. Priority (`OLLAMA_HOST` > `OLLAMA_API_KEY` > `OPENROUTER_API_KEY`) only determines the default. Override model with `-e HERMES_MODEL=...`. See `/charly-hermes:hermes` for auto-provider-config details.

            ## Open WebUI Auto-Configuration Example

            Open WebUI uses `env_require` for mandatory admin credentials and `env_accept` for optional LLM providers:

            ```bash
            # Minimal: admin credentials required (hard error if missing)
            eval "$(charly secrets gpg env)"
            charly config openwebui \
              -e "WEBUI_ADMIN_EMAIL=$WEBUI_ADMIN_EMAIL" \
              -e "WEBUI_ADMIN_PASSWORD=$WEBUI_ADMIN_PASSWORD" \
              -e "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
              -e "OLLAMA_API_KEY=$OLLAMA_API_KEY" \
              --update-all

            # Full workstation: Ollama + Jupyter + OpenWebUI
            charly config ollama
            charly config jupyter --update-all
            charly config openwebui ... --update-all
            ```

            The entrypoint auto-configures: OpenRouter + Ollama Cloud as semicolon-separated `OPENAI_API_BASE_URLS`, MCP servers from `CHARLY_MCP_SERVERS` → `TOOL_SERVER_CONNECTIONS`, Jupyter code execution from co-deployed jupyter container. `ENABLE_OLLAMA_API` is disabled unless a local Ollama is deployed via `env_provide`. See `/charly-openwebui:openwebui` for details.

            ## env_require Enforcement

            Layers can declare `env_require` in `charly.yml` for mandatory environment variables. `charly config` performs a hard check after resolving all env vars — if any required var is missing, it aborts before writing the quadlet and prints clear instructions:

            ```
            Error: openwebui requires the following environment variable(s):

              WEBUI_ADMIN_EMAIL — Admin email — pass via: charly config openwebui -e WEBUI_ADMIN_EMAIL=you@example.com

            Set them with -e flags, --env-file, or charly.yml env:

              charly config openwebui -e WEBUI_ADMIN_EMAIL=...
            ```

            Source: `candy/plugin-deploy-pod/config_setup_helpers.go` (`checkMissingEnvRequires`).

            ## secret_require Enforcement

            Parallel to `env_require` but for credential-backed env vars. Layers declare `secret_require` in `charly.yml` (see `/charly-image:layer`). `charly config` resolves each entry from the credential store via `ResolveCredential` and, if any required value is not stored, aborts with a clear remediation message:

            ```
            Error: openwebui requires the following credential-backed secret(s):

              WEBUI_ADMIN_PASSWORD — Initial admin account password for Open WebUI first-run setup

            Store them in the credential backend. For each entry:

              charly secrets set charly/secret WEBUI_ADMIN_PASSWORD <value>

            Alternatively, pass the value once via -e; it will be auto-imported:

              charly config openwebui -e WEBUI_ADMIN_PASSWORD=...
            ```

            Source: `candy/plugin-deploy-pod/config_setup_helpers.go` (`checkMissingSecretRequires`).

            ## Plaintext-to-Credential Migration Hook

            When `charly config <image>` runs, it automatically migrates any existing plaintext `NAME=VAL` entry in `charly.yml`'s `env:` list whose NAME is now declared as `secret_accept` / `secret_require` on the image. The sequence:

            1. Scan `dc.Images[deployKey(image, instance)].Env` for names that match `meta.SecretAccepts` / `meta.SecretRequires`
            2. For each match: copy the value to the credential store at the layer-declared `(service, key)` path (default `charly/secret/<NAME>`), remove the entry from `dc.Env`, mark the deploy config dirty
            3. On first mutation, back up `charly.yml` → `charly.yml.bak.<unix-timestamp>`
            4. Persist the cleaned deploy config via `SaveFleetConfig`
            5. Log each migrated entry on stderr: `"Migrated plaintext OPENROUTER_API_KEY from charly.yml to credential store (charly/api-key/openrouter)"`

            Idempotent — running on a clean host is a no-op. This gives pre-upgrade hosts an automatic one-time cleanup with a rollback point preserved.

            Source: `candy/plugin-deploy-pod/secret_migration.go` (`migratePlaintextEnvSecret`).

            ## `-e` Auto-Import for `secret_accept` / `secret_require`

            When a `-e NAME=VAL` flag targets an env var declared as `secret_accept` / `secret_require` on the image, `charly config` auto-imports the value into the credential store and strips it from `c.Env` before the plaintext env merge runs. The stderr output shows each imported key:

            ```
            Imported WEBUI_ADMIN_PASSWORD into credential store (charly/secret/WEBUI_ADMIN_PASSWORD)
            Imported OPENROUTER_API_KEY into credential store (charly/api-key/openrouter)
            ```

            The normal secret resolution path then picks up the value from the backend on the same `charly config` invocation. First-time setup is a single command; subsequent runs don't need `-e`.

            Plain `env_accept` / `env_require` entries are unaffected — their `-e` values continue to flow through the plaintext env merge into `charly.yml` and the quadlet as before.

            Source: `candy/plugin-deploy-pod/secret_migration.go` (`scrubSecretCLIEnv`).

            ## Provides Filtering (env_accept / env_require opt-in)

            `env_provide` is the **supply** side of cross-container env discovery. `env_accept` and `env_require` are the **demand** side. The provide-resolution pipeline in `provides.go` intersects the two sets per consumer, so env vars flow through charly.yml's `provides:` section only to consumers that explicitly asked for them.

            **Why filtering exists.** Without it, every deployed service would see every other service's `env_provide` — a chrome layer would receive tailscale sidecar `TS_*` vars, a postgres layer would receive ollama's `OLLAMA_HOST`, and the env table would quickly become noise. Explicit opt-in via `env_accept`/`env_require` is how we enforce the principle that services must declare the contracts they rely on.

            **Resolution per variable:**

            | Consumer declared | Provider deployed | Result |
            |---|---|---|
            | `env_require: [X]` (no default) | yes (X in `env_provide`) | X resolved, injected via `provides:` |
            | `env_require: [X]` (no default) | **no** | **`charly config` aborts with a hard error** |
            | `env_require: [X]` with default | no | default used |
            | `env_accept: [X]` | yes | X resolved, injected |
            | `env_accept: [X]` | no | var silently omitted |
            | neither accepts nor requires X | yes | **var is silently dropped** (filtering in action) |
            | neither accepts nor requires X | no | nothing happens |

            **Sidecar interaction.** Sidecars (e.g., the tailscale sidecar) participate in the same filtering pipeline — their `TS_*` env set is routed to the sidecar container, not auto-merged into the app container. For the app to see anything from the sidecar, it must declare `env_accept: [<var>]` or `env_require: [<var>]`. See `/charly-automation:sidecar` (Environment Contract) for the pattern.

            **`--update-all` effect.** When filtering rules change (e.g., a candy adds a new `env_accept` entry), `charly config <any-image> --update-all` re-runs the resolution pipeline for every deployed image and writes updated `provides:` blocks to their quadlets. Propagation is atomic per-image.

            Source: `candy/plugin-deploy-pod/provides_inject.go` (`injectEnvProvidesInto` / `injectMCPProvidesInto` — resolution, filtering, `{{.ContainerName}}` templating), `candy/plugin-deploy-pod/config_setup_helpers.go` (`checkMissingEnvRequires`).

            ## Sidecar Attachment

            Attach a sidecar container at deploy time:

            ```bash
            charly config --list-sidecars                    # List built-in sidecar templates
            charly config <image> --sidecar tailscale        # Attach tailscale sidecar
            charly config <image> --sidecar tailscale \
              -e TS_HOSTNAME=my-app \
              -e "TS_EXTRA_ARGS=--exit-node=<ip> --exit-node-allow-lan-access"
            ```

            - `--sidecar <name>` — Attach sidecar (repeatable). Saved to charly.yml
            - CLI `-e` env vars matching sidecar template keys (e.g., `TS_*`) are auto-routed to the sidecar, not the app container
            - Generates pod + sidecar + app quadlet files (3 instead of 1)

            See `/charly-automation:sidecar` for full sidecar documentation.

            ## Environment Variable Handling

            **Merge behavior (default):** `-e` performs upsert — new vars override existing vars with the same key; existing vars not in the new set are preserved. This means `charly config setup -e HTTP_PROXY=...` adds the proxy without dropping existing vars like `SSH_AUTHORIZED_KEYS`.

            **Clean behavior (`-c`):** `-c`/`--clean` replaces the entire env list in charly.yml. Use when you want to reset env vars to exactly what's specified on the command line.

            Kong `sep:"none"` on all `-e` flags means commas in values are preserved (no splitting). `NO_PROXY=localhost,127.0.0.1` works correctly as a single env var.

            `normalizeNoProxy()` auto-converts semicolons to commas in `NO_PROXY`/`no_proxy` values during env resolution. Legacy semicolon values in charly.yml are auto-healed.

            **NO_PROXY enrichment:** When `HTTP_PROXY` or `HTTPS_PROXY` is present, `charly config` automatically appends all deployed container hostnames to `NO_PROXY`. This is necessary because Chrome does not support CIDR ranges in NO_PROXY (unlike curl) — without explicit hostnames, Chrome routes internal traffic like `http://charly-immich-ml:2283` through the external proxy, causing Bad Gateway errors. Applied in both the main config path and `--update-all`. Source: `spec/hostenv/envfile.go` (`EnrichNoProxy`), `sdk/deploykit/fleet_derive.go` (`DeployedContainerNames`).

            **Tunnel persistence:** `charly config setup` automatically persists tunnel config from charly.yml back to charly.yml via `saveDeployState`. Tunnel is a deploy-time concern — see `/charly-core:deploy` for tunnel configuration.

            **Tunnel is charly.yml-only:** `labels.go:238` deliberately skips parsing the `ai.opencharly.tunnel` OCI image label. Tunnel config is ONLY sourced from `charly.yml`. New instances created with `charly config setup -i <name>` do NOT inherit tunnel config from the base image's charly.yml entry — you must manually add `tunnel: {provider: tailscale, private: all}` to the instance's charly.yml entry, then re-run `charly config setup` to regenerate the quadlet with `ExecStartPost=tailscale serve` commands.

            Source: `spec/hostenv/envfile.go` (`normalizeNoProxy`), `sdk/deploykit/deploy_state.go` (`MergeEnvVars`, `SaveDeployState`), `sep:"none"` in `candy/plugin-fleet/fleet_cmd.go` + `candy/plugin-pod/pod_cmd.go` (the former `charly/config_image.go`/`shell.go`/`start.go` are DELETED, K-wave 2).

            ## Cross-References

            ### Prerequisites

            - `/charly-build:pull` — Required before `charly config` can read OCI labels. Remote refs (`@github.com/...`) are rejected with a redirect to `charly box pull`. If the image isn't local, `ExtractMetadata` returns `ErrImageNotLocal` and the CLI prompts for a pull.

            ### Deploy-mode neighbors

            - `/charly-automation:sidecar` — Sidecar containers, pod networking, Tailscale exit nodes, Environment Contract (how sidecars participate in provides filtering)
            - `/charly-core:start` — Requires `charly config` first in quadlet mode
            - `/charly-core:deploy` — Deploy state file (charly.yml), sidecar pod deployment, tunnel lifecycle, instance tunnel inheritance, resource caps persistence
            - `/charly-automation:enc` — Encrypted storage details
            - `/charly-build:secrets` — Container secret management, `charly secrets gpg set TS_AUTHKEY`
            - `/charly-build:settings` — Runtime settings (engine, run_mode, encrypted_storage_path)
            - `/charly-core:service` — Service lifecycle (start, stop, status, logs)
            - `/charly-image:layer` — Volume, secret, `env_provide` / `env_require` / `env_accept` declarations, security resource cap fields, `service:` blocks
            - `/charly-image:image` — Image composition, inheritance, OCI label emission, tunnel charly.yml-only note (`labels.go:238`)
            - `/charly-core:charly-doctor` — Host GPU/device detection driving `appendAutoDetectedEnv()` (DRINODE, HSA_OVERRIDE_GFX_VERSION)
            - `/charly-core:shell` — Interactive shells share the same `appendAutoDetectedEnv()` path
            - `/charly-selkies:chrome` — Chrome HTTP proxy (`env_accept`), NO_PROXY auto-enrichment, cgroup resource caps
            - `/charly-infrastructure:supervisord` — Event listener pattern that pairs with the resource caps
            - `/charly-distros:nvidia`, `/charly-distros:rocm` — GPU layers that consume DRINODE auto-injection
            - `/charly-selkies:selkies` — Pixelflux DRINODE consumer + ScreenCapture singleton

            ## When to Use This Skill

            **MUST be invoked** when the task involves `charly config` commands, image deployment setup, quadlet generation, sidecar attachment, secret provisioning, encrypted volumes, data seeding, or volume backing configuration. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** After build, before start. `charly box build` → `charly config` → `charly start`.

            Source: `candy/plugin-deploy-pod/config_setup.go` / `plugin.go` (the `charly config` command grammar + `OpConfigSetup` drive — the former `charly/config_image.go` is DELETED, K-wave 2), `sdk/deploykit/quadlet.go` / `quadlet_pod.go` + `candy/plugin-deploy-pod/config_write.go` (quadlet generation — the former `charly/quadlet.go`/`charly/quadlet_pod.go` are DELETED, K-wave 2), `sdk/deploykit/deploy_state.go` (deploy state — the former `charly/deploy.go` is DELETED, K-wave 2), `candy/plugin-pod/enc_cmd.go` (encrypted volumes — the former `charly/enc.go` is DELETED, K-wave 2), `candy/plugin-fleet/secrets_artifacts.go` (secret provisioning — the former `charly/secrets.go` is DELETED, K-wave 2), `sdk/deploykit/data.go` (data seeding — the former `charly/data.go` is DELETED, K-wave 2).

            Live-deploy verification: see /charly-check:check (the 11 Testing Standards) and /charly-internals:disposable.

charly-doctor-skill:
    skill:
        name: charly-doctor
        family: core
        owner: charly-core
        description: |-
            Host dependency checker and hardware detector for the `charly doctor` CLI verb.
            Use when diagnosing host setup, checking dependencies, or verifying GPU detection.
            Named `charly-doctor` (not `doctor`) to disambiguate from Claude Code's built-in `/doctor` slash command.
        content: |
            # Doctor - Host Dependency Check

            ## Overview

            `charly doctor` checks all host dependencies grouped by feature area, probes for GPU and device hardware, and reports a summary. Use it to diagnose missing tools, verify GPU setup, or check if a host is ready for charly operations.

            `charly doctor` is a **compiled-in COMMAND-class plugin** (`candy/plugin-doctor`, `command:doctor`) — one of the externalized welded commands, following the same doctrine as `command:clean` and `command:settings`. The user-facing command is unchanged. The plugin OWNS the whole host-dependency report: the check list, the group orchestration, the pass/warn/fail verdicts, the human + JSON formatting, the exit code, AND the pure host ops it runs itself (binary probes via `exec.LookPath`, file reads like `/etc/fuse.conf` and the `~/.config/charly/config.yml` permissions `os.Stat`). `candy/plugin-doctor/command.go` holds `runDoctorCLI` plus every check/format function and the `DoctorCheckResult`/`CheckGroup`/`DoctorOutput` report types. The plugin gathers its host facts ITSELF (`candy/plugin-doctor/hostfacts.go` — the former generic "hostprobe" `HostBuild` seam and its `#HostProbeRequest`/`#HostProbeReply` wire types are DELETED, K-wave K5): the GPU/VFIO/device detection arrives via peer `InvokeProvider` to the compiled-in `candy/plugin-gpu`'s `verb:gpu` (the same peer-dispatch pattern the arbiter and `charly vm gpu` use), the credential-store health via peer `InvokeProvider` to `verb:credential`'s `health` method, and the install-hint / device-description data tables are plugin-doctor's OWN embed. Zero report, verdict, or host-fact logic lives in core. doctor is compiled-in (listed in `charly/charly.yml` `compiled_plugins`) because its `Invoke(OpRun)` needs the in-proc reverse channel for those peer `InvokeProvider` calls; dispatch is `dispatchInProcCommand` → `Invoke(OpRun)` → `runDoctorCLI`.

            ## Usage

            ```bash
            charly doctor              # Human-readable output
            charly doctor --json       # Machine-readable JSON (DoctorOutput struct)
            ```

            ## Check Groups

            Dependencies are organized into groups. Required groups cause a non-zero exit if all checks fail.

            ### Container Engine (required, OR-logic)

            At least one must be installed:
            - `docker`
            - `podman`

            ### Build Infrastructure

            - `go` — required to build charly from source
            - `git`
            - `docker buildx` — only checked if docker is available

            ### Service Management (quadlet mode)

            - `systemctl`
            - `podman` (for quadlet)

            ### Virtual Machines

            - `qemu-system-x86_64` (or arch-specific variant)
            - `qemu-img`
            - `virtiofsd` — checks PATH + `/usr/lib/virtiofsd` + `/usr/libexec/virtiofsd`
            - `virsh`
            - `ssh`
            - libvirt session socket

            ### Encrypted Storage

            - `gocryptfs`
            - `fusermount3`
            - `systemd-ask-password`

            ### Secret Storage

            - **Secret backend availability** — keyring or config. Reports which backend is active and whether it probed healthy.
            - **Config file permissions** — warns if `~/.config/charly/config.yml` is not `0600`.
            - **Plaintext credential count** — warns if `> 0` plaintext entries are in `config.yml` (suggests `charly secrets migrate-secrets`).
            - **Secret Service collections** — iterates the Secret Service provider's collections and reads the `Label` property on each. A *broken* collection is one whose `org.freedesktop.DBus.Properties.Get` returns `NoSuchObject` or a DBus I/O error — the hallmark of KeePassXC FdoSecrets stubs or a corrupt keyring. Status is `CheckOK` when all collections respond, `CheckWarning` when any are broken (charly iterates past them automatically — see `/charly-automation:enc`). The `Detail` field names the broken path(s) so the user can act on them (KeePassXC → Tools → Settings → Secret Service Integration → Exposed Databases).
            - **Keyring index consistency** — cross-checks the `keyring_keys` shadow index in `config.yml` against the live Secret Service via `findItemAnyCollection`. For every indexed `service/key` entry, looks it up through the iteration-capable read path. Status is `CheckOK` if `N/N` indexed keys resolve, `CheckWarning` with the stale entries listed otherwise. Remediation hint: `charly secrets set <service> <key>` to re-store, or prune the shadow index.

            ### Tunnels

            - `tailscale`
            - `cloudflared`

            ### Merge & Registry

            - `skopeo`

            ### Shell & TTY

            - `script`

            ### Podman Machine (conditional)

            Only shown if podman is installed:
            - `gvproxy` — checks PATH + `/usr/libexec/podman/gvproxy` + `/usr/lib/podman/gvproxy`

            ## Hardware Detection

            Probes GPU and device hardware, reports what flags containers will receive:

            | Device | Description | Container flag |
            |--------|-------------|---------------|
            | NVIDIA GPU | CUDA-capable GPU | `--gpus all` or CDI device |
            | AMD GPU | ROCm compute | `--group-add keep-groups` |
            | `/dev/dri/renderD*` | GPU render node | `--device /dev/dri/renderD128` |
            | `/dev/kfd` | AMD Kernel Fusion Driver | `--device /dev/kfd` |
            | `/dev/kvm` | KVM virtualization | `--device /dev/kvm` |
            | `/dev/vhost-net` | vhost network acceleration | `--device /dev/vhost-net` |
            | `/dev/vhost-vsock` | VM socket communication | `--device /dev/vhost-vsock` |
            | `/dev/fuse` | FUSE filesystem | `--device /dev/fuse` |
            | `/dev/net/tun` | TUN/TAP network device | `--device /dev/net/tun` |
            | `/dev/hwrng` | Hardware RNG | `--device /dev/hwrng` |

            AMD GPU detection also reports the GFX version (e.g., `gfx 11.0.0`) from KFD topology nodes and sets `HSA_OVERRIDE_GFX_VERSION` accordingly.

            **DRINODE auto-detection:** `charly` automatically finds the first `/dev/dri/renderD*` device and injects it as `DRINODE` and `DRI_NODE` environment variables into `charly config`, `charly start`, and `charly shell` sessions. This ensures GPU render node selection is consistent across all operations without manual configuration. Since C11 the detection runs in `candy/plugin-gpu` (the `DetectHostDevices` shim resolves+Invokes `verb:gpu`; `DetectedDevices.RenderNode` is the picked node, the type living in package spec); the injection stays centralized in `appendAutoDetectedEnv()` — relocated from `charly/devices.go` to `candy/plugin-deploy-pod/config_setup_helpers.go` in the 2026-07-22 dead-code-radical-removal batch (the charly-core copy was unreached residue once the plugin took over the real `charly config`/`start`/`shell` call sites).

            **Why centralized:** DRINODE injection lives in the single `appendAutoDetectedEnv()` helper (now in `candy/plugin-deploy-pod`) so `/charly-core:charly-config`, `/charly-core:start`, and `/charly-core:shell` all produce the identical env set — a fix applied to one reaches all three. `/charly-distros:nvidia` and `/charly-distros:rocm` ship no hardcoded render nodes in their charly.yml; they rely on this detection instead.

            **Disabling auto-detection:** Pass `--no-auto-detect` to `charly config` to skip all of DRINODE, DRI_NODE, and HSA_OVERRIDE_GFX_VERSION injection. Useful when you want to set these values explicitly or test a candy without host device dependence. See `/charly-core:charly-config` flag table.

            ## Output Format

            Human-readable output uses symbols:
            - `[+]` — installed / detected
            - `[-]` — missing
            - `[!]` — warning (installed but with caveats)
            - `[ ]` — not present (hardware, neutral)

            Each check shows the binary path and version when available, or an install hint when missing. Install hints are distro-aware (suggests `pacman`, `dnf`, `apt` as appropriate).

            ## JSON Output

            `charly doctor --json` emits a `DoctorOutput` struct with:
            - `system` — detected distro info
            - `groups` — all check groups with individual results
            - `hardware` — GPU flags, device list, container flags
            - `summary` — counts of installed, missing, warnings, devices

            ## Cross-References

            - `/charly-automation:udev` — install udev rules for GPU device access
            - `/charly-core:charly-config` — `engine.build`, `engine.run`, `secret_backend` settings, `--no-auto-detect` flag, DRINODE injection via `appendAutoDetectedEnv()`
            - `/charly-automation:enc` — credential lookup path behind the Secret Service collection + keyring-index checks; iteration-capable ssClient; broken-collection troubleshooting
            - `/charly-build:secrets` — `charly secrets set/list/prune` commands referenced by the keyring-index remediation hint
            - `/charly-build:settings` — `keyring_collection_label`, `secret_backend`, and other runtime config keys surfaced by the Secret Storage checks
            - `/charly-core:shell` — auto-detected env vars (DRINODE, DRI_NODE, HSA_OVERRIDE_GFX_VERSION) injected via the same `appendAutoDetectedEnv()` path
            - `/charly-core:start` — same auto-injection path at service-start time
            - `/charly-distros:nvidia` — NVIDIA GPU runtime support + DRINODE Auto-Injection section
            - `/charly-distros:rocm` — AMD ROCm runtime support + DRINODE/HSA_OVERRIDE_GFX_VERSION auto-detect table
            - `/charly-selkies:selkies` — Primary consumer of DRINODE for VAAPI H.264 encode

            ## Source

            `candy/plugin-doctor/{command.go,provider.go,plugin.go}` — the compiled-in `command:doctor` plugin that OWNS the whole report: `command.go` holds `runDoctorCLI`, the check/format functions, and the `DoctorCheckResult`/`CheckGroup`/`DoctorOutput` types; `provider.go` is the `Invoke(OpRun)` surface the compiled-in dispatch calls; `plugin.go` carries `NewMeta`/`NewProvider`/`CliMain`. `hostfacts.go` collects the host facts plugin-side (the former "hostprobe" `HostBuild` seam is DELETED, K-wave K5): GPU/VFIO/device detection via peer `InvokeProvider` to `candy/plugin-gpu`'s `verb:gpu`, credential-store health via peer `InvokeProvider` to `verb:credential`'s `health` method, and the install-hint / device-description data tables as plugin-doctor's own embed.

            ## When to Use This Skill

            Use when the user asks about:
            - Host dependency checks or setup verification
            - GPU hardware detection
            - Whether a system is ready for charly operations
            - The `charly doctor` command

charly-status-skill:
    skill:
        name: charly-status
        family: core
        owner: charly-core
        description: |-
            Service status display with tool probes and device detection.
            MUST be invoked before any work involving: charly status command, checking container state, tool availability, port mapping, or JSON status output.
            Named `charly-status` (not `status`) to disambiguate from Claude Code's built-in `/status` slash command.
        content: |
            # charly status -- Service Status Display

            ## Overview

            `charly status` is the **unified deployment-status surface**: one table (or one
            JSON array, or a single-deployment detail view) showing every charly deployment
            across all five substrates — **pod, vm, kubernetes, local, android** — side by side.
            A leading **KIND** column / `"kind"` JSON field discriminates which substrate
            each row came from.

            The architecture is a **generic word-dispatched fan-out**, not a registry: ALL
            FIVE substrates (pod/vm/kubernetes/local/android) are collected by ONE compiled-in
            provider (`candy/plugin-substrate`), served on its kind-provider `Invoke` as
            `sdk.OpStatusCollect`, dispatched by word — there is no `SubstrateCollector`
            interface or `init()`-time registry left in core (both were deleted once the
            last substrate, android, moved out). `flatCollector.collectFlat`
            (candy/plugin-substrate/status_flat.go — the former core `Collector.collectFlat`
            is DELETED, K-wave 2) calls each word over the registry + reaches the
            reverse-channel executor so the plugin can
            call back (`InvokeProvider("build","project", OpResolve)` for the resolved-project envelope for vm/kubernetes — the former `HostBuild("resolved-project")` seam is DELETED, `InvokeProvider`
            for vm→libvirt), merges the rows, applies the DEPLOY-CONE enrichment core alone
            can still do (pod tunnel/volume/port fallback, vm SSH-port/network), and sorts
            by `(Kind, image)`. The pod collector still does the batched `podman ps` +
            `podman inspect` + worker-pool probe fan-out (host probes — CDP/VNC — in
            parallel goroutines; guest probes — supervisord/dbus/charly/wl/sway — batched into
            one `podman exec sh -c`); the other collectors read their own backends
            (libvirt for vm, client-go for live kubernetes, the install ledger for local, adb for
            android) — ALL inside the plugin now.

            **Graceful degradation is the contract.** A word resolve miss or an
            `Invoke`/collect error logs a single `WARNING:` to stderr and contributes zero
            rows, but NEVER aborts the whole command. So `charly status` on a host with
            only podman shows the pod rows and silently omits vm/kubernetes/android; the surface
            always renders what it can.

            Source layout:

            The `charly status` surface is split across TWO homes now (K6 retired the
            third): the **command:status plugin** owns the CLI + render + the PURE nested
            overlay + the declared-nested-tree pre-resolution; the **substrate plugin**
            (candy/plugin-substrate) owns EVERYTHING ELSE — ALL FIVE per-substrate
            COLLECTORS (pod/vm/kubernetes/local/android), the FLAT fan-out + deploy-cone
            ENRICHMENT (formerly charly/status_collector.go's Collector — the "stays core,
            registry-boundary blocker" verdict was reopened and reversed: the registry
            fan-out dissolves into a direct in-package call once the orchestration moves
            into the plugin that already owns the per-word collectors, and every other
            dependency was already sdk-portable via K4 #64), the probes, and the
            externalized `charly reap-orphans` command. **Core keeps NO status business
            logic at all** — the plugin InvokeProvider(verb:status-fanout) directly (the
            former `status-substrate` HostBuild seam is DELETED, K-wave 2).

            - `candy/plugin-status/command.go` — the `charly status` Kong grammar + dispatch
              (the `--nested` and `--json` flags live here); InvokeProvider(verb:status-fanout)
              for the flat rows, calls the plugin's own `buildStatusRootsTree`
              for the declared tree, applies the PURE nested overlay + renders.
            - `candy/plugin-status/render.go` — the unified `DeploymentStatus` rendered
              shape + `RenderTable` / `RenderDetail` / `RenderJSON` / `RenderJSONOne` +
              cell formatters.
            - `candy/plugin-status/overlay.go` — the PURE nested-overlay fold.
            - `candy/plugin-status/nested_tree.go` — the declared-nested-tree pre-resolution
              (K5, relocated from charly/status_nested.go's buildStatusRootsTree): resolves
              the merged project + per-machine deploy tree directly (`HostBuild("resolved-
              project")` + `deploykit.LoadFleetConfig`) into the wire-safe
              `[]spec.StatusNestedNode` shape the overlay folds, including the `--nested`
              live-probe leg (`ResolveDeployChain` + `NestedExecutor`, the SAME primitive
              `charly fleet add` / `charly check live parent.child` use).
            - `candy/plugin-status/command.go` (`hostStatusSubstrate`) — the generic
              `status-substrate` F10 forward is DELETED with `charly/status_substrate_host.go`
              (K-wave 2): `command:status` now `InvokeProvider(verb:status-fanout)` DIRECTLY over
              the in-proc reverse channel, threads the executor, and returns the reply verbatim.
              No status-specific logic remains in core.
            - `candy/plugin-substrate/status_flat.go` — `flatCollector.collectFlat` (the
              substrate fan-out + merge + sort) / `flatCollector.collectSingle`;
              `collectWord` (a DIRECT in-package call to `statusCollect` for ALL FIVE
              words — no registry, no wire round-trip); `enrichOne` (the DEPLOY-ENRICHMENT
              half — charly.yml tunnel + image-label fallback, applied to the pod
              collector's LIVE rows); `enrichVmRow` (SSH-port/network from the matching
              target:vm deploy entry); `lookupDeploy`; `resolveSystemdState`;
              `listProvisionedSecretNames`; `parsePortStrings`; `formatTunnelSummary`.
              Served by `verb:status-fanout`'s `Invoke(sdk.OpStatusCollectAll)`
              (plugin.go) — an INTERNAL-ONLY verb, never a CLI subcommand, mirroring the
              `verb:libvirt`/`verb:credential`/`verb:arbiter` internal-dispatch precedent.
            - `candy/plugin-substrate/status_collect.go` — the COLLECTOR OpStatusCollect
              dispatch (by word pod/vm/kubernetes/local/android — ALL FIVE now).
            - `candy/plugin-substrate/status_pod.go` — the pod LIVE collection (SnapshotAll +
              the worker-pool fan-out + `collectPodLive` row builder + `runPodProbes` +
              `applyQuadletDescription` + `enabledQuadlets` + `parseQuadletDescription` +
              `formatLiveMounts`).
            - `candy/plugin-substrate/status_vm.go` — the vm collector (libvirt domains →
              vm rows, `Source="libvirt"`).
            - `candy/plugin-substrate/status_kubernetes.go` — the kubernetes collector (cluster
              workloads; live client-go probing under `--nested`).
            - `candy/plugin-substrate/status_android_collect.go` — the android collector
              (declared `android` devices → rows via adb `host:devices`, `Source="adb"`).
            - `candy/plugin-substrate/status_local.go` — the local install-ledger collector
              (`Source="ledger"`).
            - `candy/plugin-substrate/status_probes.go` — `Probe` / `HostProbe` /
              `GuestProbe` interfaces and the concrete probes (`SupervisordProbe`,
              `DbusProbe`, `CharlyProbe`, `WlProbe`, `SwayProbe` are guest; `CdpProbe`,
              `VncProbe` are host). `runGuestProbes` builds a single concatenated shell
              script with per-probe markers and splits the stdout chunks back out.
            - `candy/plugin-substrate/command_reap_orphans.go` — `ReapOrphansCmd` (the
              externalized `charly reap-orphans` command, K5, relocated from
              charly/status_reap.go), a new `command:reap-orphans` capability on the SAME
              provider; its vm-liveness probe reaches the verb:libvirt peer provider via
              `Executor.InvokeProvider` (F10) instead of a core-private accessor.
            - `sdk/enginekit` — `EngineClient` (the only place that touches podman/docker),
              `ContainerSnapshot`, structured `PortMapping` — the sdk kit the substrate
              plugin's pod-live collection imports.
            - `spec/spec/status_types.go` — `SubstrateKind` + `StatusFromState` (the shared
              state-vocab mapper, single-sourced for every plugin collector + the host's
              enrichment).

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Table (running) | `charly status` | Show all deployments across every substrate (pod/vm/kubernetes/local/android) |
            | Table (all) | `charly status --all` | Include stopped and enabled services |
            | Nested probe | `charly status --nested` | Probe nested children + live kubernetes workloads (multi-hop, slower) |
            | Detail | `charly status <image>` | Key-value detail for one service |
            | Detail (instance) | `charly status <image> -i <inst>` | Key-value detail for one instance |
            | JSON output | `charly status --json` | Machine-readable JSON (KIND-discriminated, structured ports, nested tree) |
            | Reap orphans | `charly reap-orphans` | Clean up ephemerals whose underlying resource is gone |

            ## Table Mode Columns

            Columns: `KIND  IMAGE  STATUS  PORTS  TUNNEL  DEVICES  TOOLS`. Rows are sorted
            by `(KIND, IMAGE)` so all rows of one substrate group together. Nested children
            render as indented IMAGE-cell rows (`  └─ <child>`) under their parent.

            | Column | Description |
            |--------|-------------|
            | KIND | Substrate discriminator: `pod` / `vm` / `kubernetes` / `local` / `android` (`-` when unset). Names which collector produced the row |
            | IMAGE | `image` for base deploys, `image/instance` for multi-instance (matches `deployKey` shape); for a vm/local/android row it is the vm name / local-template label / declared android device key |
            | STATUS | `running` / `stopped` / `enabled` / `failed` / `dead` / `paused`; substrate-specific values: `applied` (local ledger), `online` / `offline` / `absent` (android), `declared` / `reachable` / `unreachable` (nested children) |
            | PORTS | Sorted, deduped host port numbers from runtime `podman ps` (charly.yml / image labels are fallbacks for non-running rows) |
            | TUNNEL | `provider (all ports)` / `provider (ports H,H,H)` / `-` — read from charly.yml |
            | DEVICES | Compact tokens (`gpu`, `dri`, `kvm`, `fuse`, `tun`) sorted alphabetically |
            | TOOLS | Live-probed tools — port-based show `name:port`, socket-based show just `name` |

            ## Detail Mode Fields

            `charly status <image>` shows:

            | Field | Example |
            |-------|---------|
            | Kind | `pod` (omitted when unset) |
            | Image | `jupyter` (box short name) |
            | Image ref | `ghcr.io/opencharly/jupyter:2026.162.1319` — the RUNNING container's image ref:tag (runtime truth; JSON `image_ref`; the R9 freshness check reads this) |
            | Status | `running` |
            | Container | `charly-jupyter` |
            | Secrets | `charly-jupyter-db-password` — engine secrets provisioned for this box (detail view only; JSON `secrets`) |
            | Mode | `quadlet` |
            | Ports | `8888/tcp -> 127.0.0.1:8888` |
            | Devices | `nvidia (CUDA)` |
            | Tools | `cdp:9222, vnc:5900, sway, wl` |
            | Volumes | `data: bind /home/user/data` |
            | Network | `host` |
            | Tunnel | `cloudflare: jupyter.example.com` |
            | Nested | `android device (online)` — one line per declared nested child |

            The single-image detail path is pod-scoped (`Collector.Single` covers the
            podman/docker substrate). For the cross-substrate view use the table.

            ## Nested deployments

            A deploy can declare a nested tree (`pod → android`, `vm → pod`, `vm → host`,
            …). `charly status` reflects it WITHOUT a dedicated "nested" collector — a nested
            child's venue is always REACHED THROUGH its parent, so `applyNestedOverlay`
            post-processes the already-merged flat rows: it reads the DECLARED tree from
            the merged deploy config (project `charly.yml` incl. folded disposable check
            deploys + `~/.config/charly/charly.yml`) and attaches each declared child to its
            parent row's `Nested[]`.

            **Dedup — a declared nested child appears exactly once.** A child substrate
            collector may ALSO surface a flat top-level row for the same deployment: an
            `AndroidCollector` row keyed on the dotted path (`<parent>.device`), or a
            nested-pod row keyed on the flattened container name (`NestedContainerName` →
            `<seg1>_<seg2>`). When the overlay finds such a flat row, it **MOVES** that
            row's real collected data (status / uptime / container / ports / devices /
            tools / volumes / network / tunnel) into the nested position — preserving its
            real `Source` (`adb`, `podman`, …), NOT restamping `nested` — and **REMOVES**
            the flat row from the top level. So a nested android device shows ONLY under
            its parent pod's `nested[]`, never also as a flat row. A child with NO flat
            match keeps the synthesized declared row (`Source="nested"`).

            - **Default** (`charly status`): a child with a flat match inherits that flat row's
              live `status`/`uptime`/… (and real `Source`); a child with no flat match
              reads `declared` (`Source="nested"`). No multi-hop work, no extra
              subprocesses.
            - **`charly status --nested`**: each child's LIVE venue is probed through the real
              multi-hop chain (`ResolveDeployChain` → `NestedExecutor`, the SAME primitive
              `charly fleet add` and `charly check live parent.child` use — no bespoke nested dial)
              under a STRICT 4-second per-child context deadline. A timed-out / failing
              child renders `unreachable`; the table is NEVER blocked. The deadline is a
              context cancellation, never a sleep/retry loop. `--nested` also turns on live
              kubernetes-workload probing and the android `sys.boot_completed` readiness poll.

            A synthesized (no-flat-match) child carries `Source="nested"` in JSON so a
            consumer tells a declared-only child apart from a natively-collected substrate
            row; a MOVED child carries its origin collector's real `Source`.

            ## Tool Probes

            Two probe kinds. Host probes (cdp, vnc) run from the operator host using
            the snapshot's `HostPortFor(ctrPort, proto)` lookup — no extra `podman
            port` / `podman inspect` calls. Guest probes (supervisord, dbus, charly, wl,
            sway) batch into ONE `podman exec sh -c` per container; each probe's
            snippet emits a `KEY=value` line that its `Parse` recognises. The batcher
            delimits sections with `===PROBE:<name>===` / `===PROBE_END:<name>===`
            markers.

            | Tool | Kind | Snippet / Probe | Display |
            |------|------|-----------------|---------|
            | supervisord | guest | `command -v supervisorctl && supervisorctl status` | `supervisord` (with `N/M running` detail in detail view) |
            | dbus | guest | `pgrep -x dbus-daemon` + scan for `swaync`/`mako`/`dunst` | `dbus` (notifier list in detail view) |
            | charly | guest | `command -v charly && charly version` | `charly` (CalVer detail) |
            | wl | guest | `command -v wtype/wlrctl/grim/pixelflux-screenshot` | `wl` (detail lists available tools) |
            | sway | guest | discover SWAYSOCK then `swaymsg -t get_outputs` | `sway` (output dimensions in detail) |
            | cdp | host | HTTP GET `:HOST_PORT/json` (port from snapshot) | `cdp:HOST_PORT` |
            | vnc | host | TCP dial + RFB banner read | `vnc:HOST_PORT` |

            Adding a new probe: implement `HostProbe` (network) or `GuestProbe`
            (in-container) in `candy/plugin-substrate/status_probes.go` and register in the
            package-level `hostProbes` / `guestProbes` slice. No other file needs editing.

            ## JSON output schema

            `charly status --json` emits an array of `DeploymentStatus` objects — one per row,
            across every substrate. The leading `"kind"` field is the substrate
            discriminator; `"source"` records provenance (`podman` / `libvirt` / `ledger` /
            `adb` / `nested`); `"ports"` is a structured array (not `[]string`); `"nested"`
            is the recursive child tree (omitted when empty):

            ```json
            {
              "kind": "pod",
              "image": "selkies-desktop",
              "image_ref": "ghcr.io/opencharly/selkies-desktop:2026.162.1319",
              "instance": "work",
              "status": "running",
              "container": "charly-selkies-desktop-work",
              "ports": [
                { "host_ip": "127.0.0.1", "host_port": 9240, "container_port": 9222, "protocol": "tcp" }
              ],
              "tunnel": "tailscale (all ports)",
              "tools": [ { "name": "cdp", "status": "ok", "port": 9240, "detail": "3 tabs" } ],
              "run_mode": "quadlet",
              "source": "podman"
            }
            ```

            A deployment with a declared nested tree (e.g. `pod → android`) carries its
            children under `"nested"`. A child that surfaced as a flat substrate row is
            MOVED here with its real `"source"` (`adb`) and its collected data; a child
            with no flat row is synthesized (`"source": "nested"`, `"status": "declared"`):

            ```json
            {
              "kind": "pod",
              "image": "android-emulator",
              "status": "running",
              "container": "charly-android-emulator",
              "run_mode": "quadlet",
              "source": "podman",
              "nested": [
                { "kind": "android", "image": "device", "status": "online", "container": "emulator-5554", "source": "adb" },
                { "kind": "android", "image": "device-net", "status": "declared", "source": "nested" }
              ]
            }
            ```

            Because the JSON encoder indents (`SetIndent("", "  ")`), the on-the-wire
            substring for a substrate row is `"kind": "pod"` — a SPACE after the colon.
            Check `command` checks that grep `charly status --json` output assert on the spaced
            form (e.g. `contains: '"kind": "vm"'`). The four disposable check deploys each carry a
            `status-shows-*` member check that proves the live `charly status --json`
            reports the right kind (and, for android, the `"nested"` tree).

            Single-image (`charly status <image> -i <inst> --json`) emits one object,
            not an array.

            ## Source-of-truth priority for the PORTS column

            1. Runtime `podman ps` mappings (`ContainerSnapshot.Ports`) — wins for
               running containers.
            2. `charly.yml` `port:` (parsed via canonical `ParsePortMapping` —
               handles the `127.0.0.1:H:C/proto` IPv4-prefixed form correctly) —
               used when runtime data is empty.
            3. Image-label fallback (`ResolveNewestLocalCalVer` + `ExtractMetadata`)
               — last resort for stopped/enabled rows. **Lookup uses the BASE image
               name from the parsed quadlet description** (e.g. `selkies-desktop`),
               not the joined container name (`selkies-desktop-185.52.136.164`).

            ## `Volumes:` field — live mounts vs label fallback

            The `Volumes:` field is rendered from THREE sources, in priority order:

            1. **Live mounts** (`podman inspect .Mounts[]`) — wins for running containers. Format: `<name>: <source> -> <dest>` for named volumes, `bind: <source> -> <dest>` for bind mounts. Encrypted FUSE binds (source matches `<...>/encrypted/<vol>/plain`) get an `(enc)` suffix so the display distinguishes a `type: encrypted` deploy override from a plain bind.
            2. **charly.yml** volume names — fallback for stopped/enabled containers when no live mounts are available. Lists just the volume names from the deploy entry.
            3. **Image OCI label** (`ExtractMetadata`) — last-resort fallback when neither runtime nor deploy data is present. Format: `<volume-name> -> <container-path>` (the layer-declared default).

            This means a volume deployed with `--bind <name>=<path>` or `--encrypt <name>` shows up in the live form for running containers — what the container is ACTUALLY mounting, including the gocryptfs FUSE plain dir for encrypted volumes. Showing live mounts (rather than the image-label default) is what lets the operator tell, from `charly status` alone, whether an encrypted volume's gocryptfs FUSE is actually mounted: a running container binding `<...>/charly-immich-cache/plain -> /home/user/.immich/cache` with the FUSE unmounted would otherwise be writing plaintext over the cipher tree, and the live form makes that visible.

            For programmatic queries the same data is in `charly status --json`'s `volumes` array. Source: `candy/plugin-substrate/status_pod.go:formatLiveMounts` (relocated from core, P14a) + `sdk/enginekit` (the `MountInfo` parser). Tested by `candy/plugin-substrate/status_test.go` (the relocated live-mounts cases: the encryption-path detector + the renderer).

            Authoritative direct queries (when you need the raw mount data):

            ```bash
            charly status <image> --json    # volumes[] carries the live mounts
            charly fleet show <image>
            ```

            ## Usage

            ```bash
            # Quick overview of all deployments across every substrate
            charly status

            # Include stopped services
            charly status --all

            # Probe nested children + live kubernetes workloads (multi-hop, slower)
            charly status --nested

            # Detailed info for one service
            charly status jupyter

            # JSON for scripting
            charly status --json | jq '.[] | select(.status == "running")'

            # Filter to one substrate
            charly status --json | jq '.[] | select(.kind == "vm")'

            # List declared nested children
            charly status --json | jq '.[] | select(.nested) | .nested[].image'
            ```

            ## Cross-References

            - `/charly-build:pull` -- Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path

            - `/charly-core:start` -- start a service
            - `/charly-core:stop` -- stop a service (via `/charly-core:service`)
            - `/charly-core:logs` -- view service logs (via `/charly-core:service`)
            - `/charly-core:service` -- full service lifecycle management

            Live-deploy verification: see /charly-check:check (the 11 Testing Standards) and /charly-internals:disposable.

charly-update-skill:
    skill:
        name: charly-update
        family: core
        owner: charly-core
        description: |-
            Update image and restart service with data sync.
            MUST be invoked before any work involving: charly update command, pulling new image versions, data seeding, force-seed, or updating deployed services.
            Named `charly-update` (not `update`) to disambiguate from Claude Code's built-in `/update`/`/upgrade` slash commands.
        content: |
            # charly update -- Update Image and Restart

            ## Overview

            Redeploy the current artifact and restart the service — for EVERY deploy kind through ONE codepath. `charly update <name>` resolves the deploy via `ResolveTarget` and calls `LifecycleTarget.Rebuild` (`charly/unified_targets_*.go`); there is no per-kind update code. The unified contract is **redeploy the current artifact + restart by default; `--build` rebuilds the artifact first** — realized per substrate: pod → `deploy add → config → start` (`--build` rebuilds the image); vm → destroy→create the domain (reuse the qcow2 disk unless `--build`) **then re-apply the deploy node's layers idempotently** via the shared `deploy add` path (so a config change — a newly-added layer or nested pod — takes effect on the rebuilt guest, exactly like local/pod); local → re-apply layers idempotently. All three live substrates end in the SAME `charly fleet add <node>` layer-apply step. kubernetes has no live runtime to rebuild (apply it via `kubectl apply -k`), so `charly update <kubernetes>` errors uniformly. Data sync uses MERGE mode by default — adds new files without overwriting existing user modifications.

            **`charly update` does NOT auto-pull.** It redeploys the image already in local storage. To advance a deploy to a newer published image, `charly box pull <ref>` first, then `charly update`; or `charly update --build` to rebuild locally. (This consistency with vm's reuse-disk default replaced the former pod-only auto-pull, so `charly update` behaves identically across kinds.) See `/charly-core:deploy` for the unified command family and `/charly-local:local-deploy` for host-target specifics.

            **`charly update` obeys an EXPLICIT invocation on ANY target.** It does NOT refuse a non-`disposable: true` deploy — for a target that is neither disposable nor ephemeral it prints a one-line transparency note (`noteUpdateDisposability`, naming the deploy key + lifecycle, so the operator can catch a mistyped name) and proceeds with the rebuild. The `disposable:` flag stays load-bearing as the authorization for UNATTENDED autonomous destroy + rebuild (the project rulebook R10 (`AGENTS.md` / `CLAUDE.md`)) and for the check-runner's unattended fresh-rebuild (`validateCheckBeds`); it does NOT gate this explicitly-invoked verb. See `/charly-internals:disposable`.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Update | `charly update <image>` | Pull new image, seed data, restart |
            | Skip data sync | `charly update <image> --no-seed` | Pull and restart without data sync |
            | Force overwrite | `charly update <image> --force-seed` | Overwrite existing data (cp -a) |
            | Build instead of pull | `charly update <image> --build` | Build image locally before restart |
            | Specific tag | `charly update <image> --tag v2.0` | Update to a specific tag |
            | Named instance | `charly update <image> -i INSTANCE` | Update a named instance |
            | Cross-image data | `charly update <image> --data-from <other>` | Seed data from a different image |

            ## Data Sync Modes

            | Flag | Mode | Behavior |
            |------|------|----------|
            | `--seed` (default) | MERGE | `cp -an` -- adds new files, preserves existing |
            | `--no-seed` | SKIP | No data sync, just pull and restart |
            | `--force-seed` | OVERWRITE | `cp -a` -- overwrites all existing data |

            ## Usage

            ### Standard Update

            ```bash
            # Pull latest image, merge new data files, restart
            charly update jupyter
            ```

            ### Build and Update

            ```bash
            # Build locally then update
            charly update jupyter --build
            ```

            ### Force Data Reset

            ```bash
            # Overwrite all data with fresh image defaults
            charly update jupyter --force-seed
            ```

            ### Cross-Image Data Source

            ```bash
            # Use data layers from a different image
            charly update jupyter --data-from jupyter-custom
            ```

            ### Per-Instance Update with Volume Preservation

            ```bash
            charly update selkies-desktop -i 82.23.94.69
            ```

            When using `-i INSTANCE`, the update operates on a single named instance. The
            container is destroyed and recreated from the new image, but the per-instance named
            volumes are reattached:

            - `charly-selkies-desktop-82.23.94.69-chrome-data` → `/home/user/.chrome-debug`
            - `charly-selkies-desktop-82.23.94.69-selkies-config` → `/home/user/.config/selkies`

            User-side state in those volumes (Chrome cookies, profile, history, selkies client
            settings) **survives the restart**. The cgroup is recreated fresh, so any in-memory
            state — including any leaked memfd-backed shmem from the old container — is released.

            To roll a fleet of instances forward, loop the per-instance update:
            `for ip in ...; do charly update selkies-desktop -i $ip; done` — each active
            streaming session resumes cleanly on the new image with its per-instance
            volume state intact.

            ### Rollback to a previous CalVer tag

            Previous CalVer-tagged images stay in local storage after each `charly box build`
            (retention: `defaults.keep_images`, see `/charly-core:clean`). To roll back:

            ```bash
            # Find the previous tag (newest first; the (in use) marker shows the live one)
            charly box list tags selkies-desktop

            # Re-deploy the previous tag — repins + restarts through the unified update path
            charly update selkies-desktop --tag 2026.102.1933
            # or per-instance:
            charly update selkies-desktop -i 82.23.94.69 --tag 2026.102.1933
            ```

            This is fast (no network round-trip; `charly update` redeploys from local
            storage). The pinned `tag:` persists in the per-host overlay until the next
            `charly update --tag <newer>` advances it.

            ## Behavior by Mode

            ### Quadlet Mode

            1. Pull/build new image
            2. Sync data from data candies into the image's volumes — both bind mounts and podman named volumes (if `--seed`)
            3. `systemctl --user restart charly-<image>.service`
            4. Update `charly.yml` with new `data_source`

            ### Direct Mode

            1. Pull/build new image
            2. Sync data from data candies into the image's volumes (if `--seed`)
            3. Print restart instructions (manual restart required)

            ## Data Seeding

            Data candies (candies that declare a `data:` block in `charly.yml`) ship
            starter content that gets copied into the runtime volume on first
            deployment. Examples: `notebook-templates` ships
            `getting-started.ipynb` into jupyter's `workspace` volume;
            `notebook-finetuning` ships a set of Unsloth notebooks into
            `jupyter-ml-notebook`.

            ### Which volumes get seeded

            Both backings are seeded:

            - **Bind-mounted volumes** (`type: bind` in `charly.yml`) — the
              staged data is copied into the host directory via a throwaway
              `podman run` with `--userns=keep-id` so the files end up owned by
              the real host user.
            - **Named volumes** (the default when no `type: bind` override is set)
              — the staged data is copied via `podman run -v <name>:/seed`
              *without* `--userns=keep-id`, so the files match the rootless
              subuid identity the runtime container uses.

            ### Mode semantics

            - **`DataProvisionInitial`** (the default for `charly config`) — only
              seeds when the target volume is empty. For bind mounts, checks the
              per-entry subdirectory; for named volumes, checks the volume root
              via `podman volume inspect`.
            - **`DataProvisionMerge`** (the default for `charly update --seed`) —
              always runs `cp -an`, which adds new files without overwriting
              existing ones. Safe on non-empty targets.
            - **`DataProvisionForce`** (`charly update --force-seed` or
              `charly config --force-seed`) — runs `cp -a` unconditionally,
              overwriting existing files.

            When seeding populates a named volume, the output shows
            `  <volume> (named): provisioning from /data/<volume>/ ...`.

            ## Cross-References

            - `/charly-build:pull` -- Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path

            - `/charly-core:charly-config` -- initial deployment setup
            - `/charly-core:start` -- start a service
            - `/charly-build:build` -- building images locally
            - `/charly-core:charly-status` -- check service status after update

            Live-deploy verification: see /charly-check:check (the 11 Testing Standards) and /charly-internals:disposable.

charly-version-skill:
    skill:
        name: charly-version
        family: core
        owner: charly-core
        description: |-
            Show charly CLI version information.
            MUST be invoked before any work involving: charly version command or checking installed charly version.
            Named `charly-version` (not `version`) to disambiguate from Claude Code's built-in `/version` slash command.
        content: |
            # charly version -- CLI Version

            ## Overview

            Displays the installed version of the charly CLI binary.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Show version | `charly version` | Print charly version string |

            ## Usage

            ```bash
            charly version
            ```

            ## Testing Note

            `charly version` writes the CalVer tag to **stdout** via `fmt.Println`.
            Declarative tests should match `stdout:` — for example
            `candy/charly/charly.yml` uses:

            ```yaml
            - id: charly-version
              command: /usr/local/bin/charly version
              exit_status: 0
              stdout:
                - matches: "[0-9]{4}\\.[0-9]+"
            ```

            `VersionCmd` writes via `fmt.Println` (not Go's builtin `println`,
            which bypasses `os.Stderr` and writes directly to fd 2) so the
            in-process MCP tool-call path — which captures `os.Stdout` — surfaces
            the version correctly. See `/charly-check:check` Authoring Gotcha #5 and
            `/charly-build:charly-mcp-cmd` "Capture model" for the capture-pipeline detail.

            ## Cross-References

            - `/charly-core:charly-doctor` -- Full host dependency and health check
            - `/charly-build:settings` — runtime config where `secret_backend` and other settings live
            - `/charly-image:image` — build-mode family that stamps CalVer tags matching this version
            - `/charly-check:check` — declarative testing framework (Gotcha #5 covers the stdout rule)
            - `/charly-build:charly-mcp-cmd` — MCP server section explains why the stream choice matters for the capture pipeline
            - `/charly-internals:go` — `charly/version.go` CalVer computation; `main.go` `VersionCmd.Run` using `fmt.Println`

clean-skill:
    skill:
        name: clean
        family: core
        owner: charly-core
        description: |-
            Prune reusable build artifacts to defaults: retention (images, check runs) and
            sweep one-time makepkg leftovers.
            MUST be invoked before any work involving: charly clean, build-artifact retention,
            keep_images / keep_check_runs, image-tag pruning, or .check run cleanup.
        triggers:
            - "`charly clean` / build-artifact retention / `keep_images` / `keep_check_runs` / image-tag pruning / `.check` run cleanup"
        content: |
            # charly clean -- Build-artifact retention + cleanup

            ## Overview

            `charly clean` reclaims disk by applying the project's configured retention to
            **reusable** build artifacts and removing **one-time** transient leftovers. It is
            the on-demand counterpart to the auto-pruning that runs after `charly box build`
            and `charly check run`.

            `charly clean` is a **compiled-in COMMAND-class plugin** (`candy/plugin-clean`, `command:clean`) that OWNS the command AND (K1-alpha core-minimization) the **shared retention ENGINE** itself — `pruneImagesByRetention`, `pruneCheckRuns`, `pruneBuildCandyDirs`, `invalidateImageTags`, `pruneDeepDanglingImages`, and the charly-labeled image-tag CalVer/label inventory (`candy/plugin-clean/retention.go`), relocated from the former `charly/retention.go` since it has zero core-only dependencies (`kit.CalVer`/`kit.ListLocalImages`/`kit.BuildActivityDir` are all sdk-portable). The plugin owns the flag grammar (`--dry-run` / `--images` / `--check` / `--deep` / `--keep` / `--invalidate`), the category orchestration, the report output, and the local `pkg/arch` makepkg sweep (`cleanMakepkgArtifacts`, a single-caller file op moved into the plugin). `charly clean`'s own CLI calls the engine LOCALLY (no wire hop, same package). The other three callers — `charly box build`'s post-build prune, `charly box list tags`, and `charly check run`'s post-run prune (candy/plugin-check) — reach it via a new `verb:retention` capability (a `spec.RetentionRequest` → `spec.RetentionReply` Invoke), the SAME peer/core-adapter pattern verb:credential/verb:gpu/verb:tunnel already use: core's two callers (already running `LoadConfig` in-process) resolve `defaults.keep_images`/`keep_check_runs` themselves and pass the resolved ints in the request; plugin-check (a peer plugin, not core) reaches verb:retention via `InvokeProvider`. The SAME defaults, for its OWN CLI, resolve PLUGIN-SIDE via the shared `sdk/loaderkit.ResolveRetentionDefaultsViaExecutor` (K-wave 2 cone R6 — the former **"retention-defaults" `HostBuild` seam** `charly/host_build_retention_defaults.go` is DELETED: the loader is plugin-reachable over the reverse channel, so every `verb:retention` caller resolves the tunables itself). clean is **compiled-in** (`charly/charly.yml` `compiled_plugins:`) because its `Invoke(OpRun)` needs the in-proc reverse channel — threaded by `dispatchInProcCommand` ("Seam A") — to reach the host loader legs for that resolve; the out-of-process `CliMain` path has no reverse channel, so the categories needing a resolved keep-default (images/check/deep) error there — list/invalidate need no default and run standalone. This is the same "plugin owns the logic + generic seams for the core-coupled bits" doctrine the vm + pod deploy plugins established — no hidden core-command forward, and no plugin-specific command logic left in core.

            Two artifact classes, two policies (operator principle):

            - **One-time / transient → always cleaned immediately.** makepkg leftovers under
              `pkg/arch` (`src/`, `pkg/`, `*.pkg.tar.zst`, `*.log`) from a manual bare-host
              `makepkg` invocation (the legacy `charly box pkg` native-package build, removed
              with the nFPM cutover, never touched this tree) — `charly clean`
              sweeps any such leftover.
            - **Reusable → keep-last-N, configurable in `defaults:`.** Container image tags
              and `.check` run output. Retention is set in `charly.yml` `defaults:` and
              applied automatically at creation; `charly clean` applies it on demand.

            ## Config (charly.yml `defaults:`)

            ```yaml
            defaults:
              keep_images: 3      # per box: newest 3 distinct images, and at most 3 tags
                                  # of each, after `charly box build`
              keep_check_runs: 3   # newest run dirs to keep per bed/score after `charly check run`
            ```

            `0` (or absent → built-in fallback `0`) **disables** that retention. The repo
            opts in; third-party configs get no surprise pruning until they set a value.

            ## Commands

            ```bash
            charly clean              # apply retention now: prune images + check runs + makepkg leftovers
            charly clean --dry-run    # print everything that WOULD be removed; touch nothing
            charly clean --images     # only image-tag retention
            charly clean --check       # only check-run retention
            charly clean --deep        # store-wide untagged/dangling-image purge (see below); runs ONLY
                                       # this category unless combined with --images/--check
            charly clean --deep --dry-run   # the safe default probe: report the would-remove count +
                                            # an UPPER-BOUND reclaimable-bytes figure for --deep; touch nothing
            charly clean --keep N     # override the retention count for this run (0 = use defaults:)
            charly clean --invalidate '<glob>'   # remove charly-labeled image tags matching the glob
                                                 # (full ref or last segment; in-use skipped; runs ONLY this)
            ```

            With neither `--images` nor `--check` nor `--deep`, the three DEFAULT categories run (images +
            check + makepkg) — unchanged, `--deep` NEVER fires implicitly. `--keep N` overrides both the
            image and check-run retention counts for the invocation (it does not affect `--deep`, which has
            no keep-N — it purges every untagged image).

            **`--deep` — the store-wide untagged/dangling-image purge.** The default image-tag sweep above
            only ever touches images carrying the `ai.opencharly.box` label. A multi-stage build's
            INTERMEDIATE stage images (`FROM ... AS stagename`) are never labeled — `WriteLabels` stamps the
            `ai.opencharly.*` labels only on the FINAL stage — so they accumulate as unlabeled dangling
            images completely invisible to the default sweep, wasting disk and confounding build-corruption
            diagnosis on a host with many builds behind it. `charly clean --deep` closes this gap: it lists
            EVERY untagged (dangling) image in local storage, charly-labeled or not, and removes each one
            (`rmi` without `-f`, so any image still referenced by a container or a kept tag is safely
            skipped — the same backstop the default sweep relies on). It never runs mid-build (the same
            live-build guard the default dangling sweep uses) and never fires implicitly on a plain `charly
            clean` — it is strictly opt-in. Removing a dangling image also frees any layer blobs it alone
            held (the engine's overlay storage GCs an unreferenced layer once its last referencing image is
            gone), so `--deep` is effectively a dangling-image-plus-unused-layer prune in one pass.
            `--deep --dry-run` reports the would-remove image count plus an UPPER-BOUND reclaimable-bytes
            figure (summed from each candidate's reported storage size) without touching anything — the safe
            default probe before running it for real.

            **The reclaimable-bytes figure is "up to", never a firm prediction.** Each image's reported
            storage size counts EVERY layer it references, and dangling images routinely SHARE layers with
            images that stay (retained tags, other dangling images) — removing an image frees only the
            layers it held UNIQUELY, so actual disk freed is usually much less than the naive per-image sum.
            RDD-verified live: a `--deep` purge removing 68 untagged images (3,552 → 3,484 images) reported
            ~92.6 GiB via this sum but freed only ~4.6 GiB of real disk (132.6 GB → 128 GB) — most of those
            bytes stayed shared with the ~3,400 remaining (largely stale-tagged) images. Pair `--deep` with
            `--invalidate` (which removes stale image TAGS, freeing whatever layers only they still held) to
            get closer to the reported figure and reclaim more of the store.

            ## What gets pruned (and what never does)

            **Image-tag retention** (`keep_images`): images are grouped by the
            `ai.opencharly.box` label and ordered by the `ai.opencharly.version` CalVer label
            **when both rows carry one**, then a row carrying that label before one that does
            not, then **image creation time**, and only then the build tag.

            **Which key decides depends on which ordinal you are asking about**, and this page owns
            that fact. **Between distinct images**, the label decides whenever the two carry
            DIFFERENT datable labels — it is the primary key. Creation time decides only when the
            labels tie, which is the common case that motivates it: the label is content-stable, so
            repeated builds of an unchanged image all carry the same one. **Within one image's tag
            rows, the build tag decides** — every row of
            one image shares its label, its labelled-ness and its creation time by construction
            (`charlyImageTags` hoists them out of the per-ref loop), so the first three keys tie and
            the `:YYYY.DDD.HHMM` tag is the only one left to break it. So *"creation time, not the
            tag"* is true of the image budget and **false of the tag budget**.

            Why the tag cannot serve as the *image* recency key: `charly box build --tag` REPLACES
            the CalVer tag, so a bed build carries `check-<bed>-<calver>`, which parses as no CalVer
            at all. Ordering distinct images on the tag made every member of such a group compare
            equal, so `keep_images: N` kept an arbitrary N and could delete the newest build.
            Creation time is the only recency key total over the tags charly mints — and it is
            exactly the key that ties within one image, which is why the tag still ranks that image's
            own rows.

            `keep_images: N` budgets **two ordinals**: the newest N **distinct images** per group
            survive — a *distinct image* being a distinct image ID, so every tag pointing at one ID
            counts once — **and at most N tags of each, the same N** — so one image wearing many
            CalVer tags no longer consumes the whole budget, starving the distinct images behind it,
            while a content-stable image rebuilt many times still has its surplus tag rows reclaimed.

            **Within an image, the newest tags survive and the oldest are dropped** — newest by
            build-tag CalVer, since that is the only key that varies across one image's rows.
            **Tags that carry no CalVer — `latest`, `dev`, a bed's `check-<bed>-<calver>` — all tie
            on that key**, and a stable sort then keeps whatever order the engine listed them in. So
            which of several undatable tags survives the tag budget is NOT specified, and if the
            image itself carries a datable `ai.opencharly.version` label those rows are **not**
            protected by the undatable-row exemption (that guard needs BOTH to be undatable). Do not
            rely on `keep_images` to preserve a `latest` or a hand-applied tag on a
            frequently-rebuilt image — pin it with a full ref, or keep it on an image that retention
            does not group.

            **Safety**: any image referenced by a container (`podman ps -a`, including
            stopped/quadlet deploys) is skipped, and `rmi` runs WITHOUT `-f` so the engine refuses
            any still-referenced image as a backstop. Non-charly images (no `ai.opencharly.box`
            label) are never touched, and a tag row is exempted only when it has NEITHER a datable
            `ai.opencharly.version` label NOR a datable `:YYYY.DDD.HHMM` tag — the guard is an AND,
            so a row with either one is a normal candidate. A bed build (datable label, non-CalVer
            tag) is therefore prunable, not exempt.

            **Check-run retention** (`keep_check_runs`): each `.check/<bed|score>/` dir is
            trimmed to the newest N run artifacts — CalVer-named run dirs (bed runs),
            `runs/<id>/` dirs (score iterations), and `result-<calver>.yml` files.
            **`NOTES.md` is ALWAYS preserved** (it's the durable Syncthing-replicated harness
            memory), as is any other non-run file.

            **makepkg sweep**: removes `pkg/arch/{src,pkg,*.pkg.tar.zst,*.log}` (the package
            is already installed via pacman — pure transient waste).

            `--dry-run` is best-effort: it lists prune candidates but cannot see "external"
            build containers (buildah intermediates `podman ps -a` doesn't list), so an
            image held by one is listed yet safely skipped at removal time (the `rmi`
            backstop refuses it). The real run silently retains such in-use images.

            ## Auto-prune at creation

            The same retention runs automatically (no flag needed):

            - After `charly box build` (push runs excluded) → `keep_images`.
            - After `charly check run` (any path: bed / score) → `keep_check_runs`,
              after the new run's output is written so the newest run is kept.

            `charly clean` exists for on-demand sweeps and to clear a pre-existing backlog.

            ## Out of scope

            VM disk images (`output/`, `image/*/output/`) are single products per type
            (overwritten on rebuild, not accumulated) — remove them on demand with
            `charly vm destroy --disk`. The VM raw intermediate is already auto-cleaned during
            the qcow2 build.

            ## Implementation

            `candy/plugin-clean/` — the command plugin that OWNS `charly clean` AND the shared retention
            ENGINE: `command.go` (flag grammar + category orchestration via `cleanCategories` +
            `cleanMakepkgArtifacts` + `fetchRetentionDefaults`, which calls the one remaining host seam),
            `provider.go` (`Invoke`, dispatching by word — `"clean"` for the CLI, `"retention"` for the
            engine — the compiled-in dispatch surface for both), `plugin.go` (`NewProvider` / `NewMeta`
            advertising `command:clean` + `verb:retention` / `CliMain`), `retention.go` (the relocated
            engine: `pruneImagesByRetention`, `pruneCheckRuns`, `pruneBuildCandyDirs`, `invalidateImageTags`,
            `pruneDeepDanglingImages`, and the `charlyImageTags` inventory — all now in this package,
            importing only `sdk/kit` + `spec/spec`). `--deep` shares its engine with the default
            charly-labeled dangling sweep via `pruneDanglingImages`/`selectDanglingImages`
            (`candy/plugin-clean/retention.go`) parameterized by an `onlyCharly` bool: `pruneDanglingCharlyImages`
            (onlyCharly=true, the default sweep) and `pruneDeepDanglingImages` (onlyCharly=false, `--deep`)
            are both thin wrappers over the ONE shared selection + removal engine (R3 — no duplicated
            listing/removal logic between the two categories). The engine is reached two ways: `charly
            clean`'s own CLI calls `runRetention` in-package (no wire hop); the three OTHER callers reach
            `verb:retention` — the build command's post-build prune (`candy/plugin-box/box.go`'s
            `pruneAfterBuild`, resolving `defaults.keep_images` itself and passing it pre-resolved) and
            `charly box list tags` (`candy/plugin-box`'s `listImageTags` via `verb:retention`) resolve+Invoke
            the compiled-in provider directly (`providerRegistry.resolve
            (ClassVerb, "retention")`); `charly check run`'s post-run prune (the `command:check` plugin's
            harness, `candy/plugin-check`) reaches it over the PLUGIN↔PLUGIN `InvokeProvider` peer-dispatch
            leg (F10) instead, since it is itself a plugin and cannot resolve the core registry directly.
            Both non-core-adapter callers resolve `defaults.keep_images`/`keep_check_runs`
            PLUGIN-SIDE via the shared `sdk/loaderkit.ResolveRetentionDefaultsViaExecutor`
            (K-wave 2 cone R6 — the former "retention-defaults" `HostBuild` seam
            `charly/host_build_retention_defaults.go` is DELETED), reached over the compiled-in in-proc
            reverse channel threaded by `dispatchInProcCommand` (`charly/provider_command_external.go`).
            Retention keys live on `spec.BoxConfig` (CUE-sourced), merged via `mergeBoxConfig`
            (`spec/spec/merge_unified.go`), validated in `candy/plugin-box/validate_config_rules.go`
            (the `>= 0` keep rule — the former core `validateBuildTunables`/`validate.go` are DELETED,
            K-wave 2 cone R1).

            ## Cross-References

            - `/charly-build:build` — `charly box build` + the `keep_images` auto-prune.
            - `/charly-check:check` — `charly check run` + the `keep_check_runs` auto-prune.
            - `/charly-vm:vm` — `charly vm destroy --disk` for VM disk removal.
            - `/charly-image:image` — the `defaults:` block where retention keys live.

cmd-skill:
    skill:
        name: cmd
        family: core
        owner: charly-core
        description: |-
            Single command execution in a running container with D-Bus notification.
            MUST be invoked before any work involving: charly cmd command, running commands in containers, or container exec with notifications.
        content: |
            # charly cmd -- Single Command Execution

            ## Overview

            Runs a single command inside a running container via `<engine> exec` and sends a D-Bus desktop notification when the command completes. Useful for one-off commands without opening an interactive shell.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Run command | `charly cmd <image> "command"` | Execute command in running container |
            | With instance | `charly cmd <image> "command" -i 2` | Target specific instance |
            | With env vars | `charly cmd <image> "command" -e KEY=VALUE` | Pass environment variables |

            ## Usage

            ```bash
            # Run a command in a running container
            charly cmd fedora "uname -a"

            # Run with environment variables
            charly cmd jupyter "python script.py" -e CUDA_VISIBLE_DEVICES=0

            # Target a specific instance
            charly cmd ollama "ollama list" -i 2
            ```

            ## Flags

            | Flag | Description |
            |------|-------------|
            | `-i, --instance INSTANCE` | Target a specific container instance (default: 1) |
            | `-e, --env KEY=VALUE` | Pass environment variables to the command |
            | `--sidecar NAME` | Run in the named SIDECAR container (`charly-<box>[-<inst>]-<name>`) instead of the app container |

            ## Behavior

            - The container must already be running (`charly start <image>`)
            - Agent forwarding (SSH/GPG) env vars are injected automatically if enabled
            - A D-Bus desktop notification is sent on command completion (success or failure)
            - For interactive shells, use `charly shell` instead
            - For persistent sessions or long-running commands, use the typed `charly agent terminal` provider.

            ## Cross-References

            - `/charly-build:pull` -- Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path

            - `/charly-core:shell` -- Interactive shell sessions with workspace mounts
            - `/charly-check:dbus` -- D-Bus interaction inside containers
            - `/charly-automation:tmux` -- Typed persistent terminal sessions for long-running commands

deploy-skill:
    skill:
        name: deploy
        family: core
        owner: charly-core
        description: |-
            MUST be invoked before any work involving: `charly fleet add`/`charly fleet del` commands, quadlet generation, volume backing, tunnels (Tailscale/Cloudflare), `add_candy:` overlay, or per-machine deploy overlays.
        triggers:
            - "`charly fleet add/del` / pod or container deploys"
            - "`kind: android` device / `target: android` deploy / `apk:` package format in candies / installing Android apps declaratively / remote-or-emulator adb endpoint / nested `pod \u2192 android`"
            - "Disposable-flag semantics / `disposable: true` authorization / preemptible-flag / `requires_exclusive:` / `charly preempt` / exclusive host-resource arbitration (GPU passthrough contention)"
        content: |
            # Deploy - Deployment Configuration

            ## Schema overview

            - **A deploy is name-first; the target is the SUBSTRATE KIND at the edge** — the deploy's first child key is exactly one of `pod:` / `vm:` / `kubernetes:` / `local:` / `android:` (or `group:` for a targetless group of members) and selects `local | vm | pod | kubernetes | android`. There is NO authored `target:` field. Inside that substrate node, `image:` names the box/OCI image a `pod:`/`kubernetes:`/`android:` runs and `from:` inherits a same-kind `vm`/`kubernetes`/`local`/`android` template by name.
            - **The substrate node at the edge** — `vm: {from: <entity>}` for a VM target, `pod: {image: <name>}` for a pod target, `kubernetes: {from: <name>}` for a cluster target, `local: {from: <template>}` for a local-deploy. Deploy-into nesting is **tree position** (a resource node placed under another resource), not a `nested:` field; sibling members (a resource node placed under the deploy) replace the old `peer:` field.
            - **`host:` is a FIELD on `local:`, never a deploy KIND (MUST).** A host/remote deploy MUST be authored as `local: {from: <template>, host: <user@machine>}` — the `host:` scalar on a `local:` (or `pod:`) deploy: `host: local` / absent = this machine, `host: <user@machine>` = SSH. There is NO standalone `host:` venue KIND; authoring a `host:` node is a hard load error. See `/charly-local:local-deploy`.
            - **`group:` is EXCLUSIVELY a targetless deploy group.** A `group:` node carries only resource members (pod/vm/etc.) with no own workload — the targetless deploy group.
            - **Disposability is a deploy property** — `FleetNode.Disposable` (the `disposable:` scalar under the substrate node) is the sole source of truth.
            - **Resource arbitration is a deploy property** — the `preemptible:` field (holder; occupies exclusive host-resource token(s), may be gracefully stopped + restored), the `requires_exclusive:` field (claimant; needs SOLE use), and the `requires_shared:` field (claimant; REFCOUNTED shared use — many concurrent claimants; a GPU-token claim flips the whole IOMMU group vfio→nvidia+CDI at deploy, back at teardown when the LAST claimant releases) — all inline in the substrate node — drive the arbiter (`charly preempt`). A fourth axis ORTHOGONAL to disposable/ephemeral/lifecycle. See "Preemptible resource arbitration" below + `/charly-internals:disposable`.
            - **Disposable R10 test beds are just `disposable: true` deploys** (run via `charly check run <bed>`) — there is NO separate bed kind. The main repo's beds (`check-pod`, `check-k3s-vm`, `check-sway-browser-vnc-pod`, …) AND every `box/<distro>` submodule's beds (the arch / cachyos / debian / ubuntu / fedora bootstrap-VM + pacstrap/debootstrap beds, in each submodule's `charly.yml`) are disposable deploys. The cachyos submodule's `charly-cachyos` operator workstation profile is a non-disposable deploy (a profile, not a test bed). Operator deployments otherwise live in the per-host `~/.config/charly/charly.yml`. See `/charly-check:check` "disposable check deploys".

            ## Overview

            `charly fleet` is the parent verb for applying and tearing down deployments, plus managing `charly.yml` overrides. The command family has two distinct surfaces:

            1. **Execution verbs** — `charly fleet add <name>` / `charly fleet del <name>`. Apply or reverse a deployment. The target is dispatched by which substrate node the deploy carries:
               - `local: {from: <template>}` → the external `deploy:local` plugin (`candy/plugin-deploy-local`) applies to the local filesystem over the executor reverse channel (or, placed under another resource node via tree position, via NestedExecutor into the enclosing deployment). See `/charly-local:local-deploy`.
               - `vm: {from: <entity>}` → the external `deploy:vm` plugin (`candy/plugin-deploy-vm`) applies INSIDE a running VM over SSH via the reverse channel; the plugin auto-boots the venue in its `OpPrepareVenue` (via `HostBuild("cli")`), using the host prepare hook's resolved data. See "VM target" section below and `/charly-internals:vm-deploy-target`.
               - `pod: {image: <image>}` → the candy `plugin-deploy-pod` renders the overlay Containerfile (in its own code via `deploykit.OCITarget` + `deploykit.NewRenderGeneratorFromProject`) + the quadlet config-write (fully plugin-side in `candy/plugin-deploy-pod` + `sdk/deploykit/quadlet_paths.go` — the former core quadlet path is DELETED, K-wave 2).
               - `kubernetes: {from: <name>}` → Kustomize base/overlays tree. See `/charly-kubernetes:kubernetes`.
            2. **Config-file management** — `charly fleet show/export/import/reset/path/status`. Read and mutate `~/.config/charly/charly.yml` itself.

            ## Targets, one schema

            The same `FleetNode` shape feeds every target (`pod`, `local`, `vm`, `kubernetes`, `android`) — authors describe *what the workload needs* (ports, volumes, env, security, tests); the generator per target decides *how Kubernetes / quadlet / local apply / VM over SSH / Android apk-install* realizes it.

            A deploy's install timeline can include a `run:` step carrying a plugin verb (the `<word>: <input>` sugar — see `/charly-image:layer` "Plugin verb steps"). When the verb is served by an EXTERNAL (out-of-process) plugin, that step EXECUTES at deploy on a `local:`/`vm:` target — the plugin runs its effect on the live venue over the executor reverse channel (`Invoke(OpExecute)`) and returns teardown `ReverseOp`s the target records to the ledger and replays at `charly fleet del`. A builtin `ProvisionActor` verb keeps its in-proc shell path; the two are placement-agnostic (same authored step, the runtime picks the path). Detail → `/charly-internals:install-plan` (the `ExternalPluginStep` IR kind) + `/charly-internals:plugin`.

            **An `android:` deploy** installs a deploy's `add_candy:` candies' `apk:` packages
            onto an `android` device entity (an in-pod emulator or a remote/physical adb
            endpoint) via the EXTERNAL `deploy:android` substrate (F1 — served out-of-process
            by candy/plugin-adb; the host preresolves the device endpoint + apk specs, the
            plugin installs) — the Android analogue of a `kubernetes:` deploy emitting workloads onto
            a cluster. The substrate node is `android: {from: <device>}`; apps
            ride in on the deploy's inline `add_candy:` list (no apk-list field). A `pod → android` tree
            (the device placed under its emulator-pod node) mirrors `vm → kubernetes`; a pod's android
            children deploy AFTER `charly start` (use `--node-only` on the pod's deploy-add, then
            dotted-path `charly fleet add pod.device`). See `/charly-check:android`. Kubernetes-specific choices (storage class, ingress class, cert issuer, secret backend) live in a **cluster profile** file (`~/.config/charly/clusters/<name>.yaml` or in-repo `clusters/<name>.yaml`), *not* in the deployment. This means one deployment spec targets dev/staging/prod clusters with zero schema changes — only the cluster profile differs.

            `charly start` / `charly stop` remain as ergonomic wrappers: `charly start <image>` is equivalent to `charly fleet add <image> <image>` with the container target; `charly stop <name>` is `charly fleet del <name>`. New scripts should prefer the explicit `charly fleet add`/`charly fleet del` forms, especially when using `--add-candy` overlays or the `host` target.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Apply container deploy | `charly fleet add <name> <ref>` | Compile candies + build overlay if `add_candy:` present + run via quadlet |
            | Apply local deploy | `charly fleet add <name> <ref>` (entry with a `local:` substrate node) | Apply layers directly to local filesystem (see `/charly-local:local-deploy`) |
            | Tear down deploy | `charly fleet del <name>` | Stop container + reverse ReverseOps (host) + ledger cleanup |
            | Dry-run | `charly fleet add <name> <ref> --dry-run [--format=json]` | Print the InstallPlan without executing |
            | Layer overlay | `charly fleet add <name> <ref> --add-candy <ref>` | Extra layer(s) applied on top; repeatable |
            | Configure deployment | `charly config <image>` | Generate .container file + save charly.yml |
            | Configure instance | `charly config <image> -i <instance>` | Generate instance-specific quadlet + deploy entry |
            | Configure volume backing | `charly config <image> --bind name` | Set volume as host bind mount |
            | Provision data | `charly config <image> --seed` | Auto-provision data candies into bind mounts (default) |
            | Deploy status | `charly fleet status` | Audit charly.yml vs quadlet sync |
            | Show overrides | `charly fleet show [image]` | Display charly.yml contents |
            | Show instance overrides | `charly fleet show <image> -i <instance>` | Display instance-specific overrides |
            | Import config | `charly fleet import <files>` | Merge files into charly.yml |
            | Reset config | `charly fleet reset [image]` | Remove charly.yml overrides |
            | Reset instance config | `charly fleet reset <image> -i <instance>` | Remove instance overrides |
            | Push to registry | `charly box build --push` | Multi-platform push |

            For service lifecycle commands (start/stop/status/logs/update/remove), see `/charly-core:service`. For VM lifecycle (build/create/start/stop/ssh), see `/charly-vm:vm`; for in-VM layer deploys via `charly fleet add vm:<name>`, see the "VM target" section below and `/charly-internals:vm-deploy-target`. For encrypted storage, see `/charly-automation:enc`. For host-target semantics, see `/charly-local:local-deploy`. For Kubernetes targets, see `/charly-kubernetes:kubernetes`. For the Go IR that drives all five targets, see `/charly-internals:install-plan`.

            ## Command Family: `add` / `del`

            ### `charly fleet add <name> [<ref>]`

            Applies a deployment. The substrate node selects the target:

            - **`local: {from: <template>}`** — apply layers to the local filesystem via the external `deploy:local` plugin (`candy/plugin-deploy-local`) over the executor reverse channel. With `host: local` (default) the apply runs through a `ShellExecutor` directly; with `host: <user@machine>` it runs over an `SSHExecutor` (picked by `rootExecutorForDeployNode`). See `/charly-local:local-deploy`.
            - **`vm: {from: <entity>}`** — apply layers inside a running `vm` entity via SSH (the external `deploy:vm` plugin, `candy/plugin-deploy-vm`, over the reverse channel). `<vm-name>` must match a `vm` entity; the VM must already be created (`charly vm create <vm-name>`), or the plugin auto-boots it in its `OpPrepareVenue` (via `HostBuild("cli")`). See "VM target" section below.
            - **`kubernetes: {from: <name>}`** — emit a Kustomize base/overlays tree. See `/charly-kubernetes:kubernetes`.
            - **`pod: {image: <image>}`** (pod, the default target) — container deployment. Multiple pod deploys coexist (`my-dev`, `postgres-staging`, etc.); each gets its own quadlet, container name, and charly.yml entry.

            `<ref>` accepts four forms, auto-detected:

            | Form | Example | Resolution |
            |---|---|---|
            | Local image name | `fedora-coder` | Looked up in current project's `charly.yml` |
            | Local layer name | `pre-commit` | Looked up in current project's `candy/` directory |
            | Local YAML path | `./custom.yml`, `/abs/path/charly.yml` | File's top-level keys classify image vs layer |
            | Remote repo | `github.com/owner/repo[/box/<n>\|/candy/<n>][@ref]` | Fetched via existing `--repo` cache |

            Disambiguation: a ref containing `/candy/` resolves to a candy; `/box/` to a box. For local names, `box/` is checked before `candy/`; same-named entries in both are a hard error. The legacy `@host/org/repo:version` form (used by `require:` and `candy:` in charly.yml) is also accepted.

            When `<ref>` is omitted, the ref falls back to the deploy's `image:` field (or the deploy key itself if no explicit image is declared).

            ### `charly fleet add` flags

            **Universal:**
            - `--tag <calver>` — override charly.yml tag
            - `--dry-run` — print the InstallPlan without executing
            - `--format table|json` — with `--dry-run`
            - `--pull` — force re-fetch of remote refs / image pull
            - `--verify` — run layer `check:` post-deploy
            - `--add-candy <ref>` — repeatable; extra layer(s) applied on top (all 4 ref forms)

            **Local-target-specific** (silently ignored on pod deploys):
            - `--with-services` — opt-in for systemd unit installation (packaged-unit enable + drop-ins)
            - `--allow-repo-changes` — opt-in for repo config mutations (rpmfusion, copr, external `.repo` files)
            - `--allow-root-tasks` — opt-in for arbitrary `cmd: user: root` task bodies
            - `--skip-incompatible` — skip layers lacking a host-matching format section instead of failing
            - `--builder-image <ref>` — override the compile-builder image
            - `--yes` / `-y` — all three gates plus skip sudo preflight

            ### `charly fleet del <name>`

            Reverses a deployment. Gated host-side reversal respects `--keep-repo-changes` and `--keep-services`. Container teardown: `podman stop` + `rm` + overlay image removal (unless `--keep-image`) + ledger cleanup. VM teardown: SSH-executed ReverseOps in the guest, preserving the VM itself (use `charly vm destroy` separately). See `/charly-local:local-deploy` for the full 15-kind ReverseOp table.

            ## VM target: `charly fleet add vm:<vm-name> <ref>`

            Applies layer recipes **inside a running VM** over SSH. Same `InstallPlan` IR as host and container targets; the difference is that bash bodies run via `ssh guest 'sudo bash -s'` through an `SSHExecutor` (see `/charly-internals:vm-deploy-target`).

            **Prerequisite**: the VM must exist before `charly fleet add vm:...` runs. `charly fleet add vm:<name>` does NOT auto-provision; a missing VM produces a clean error pointing at `charly vm create`:

            ```bash
            charly vm create arch                            # provision VM first
            charly fleet add vm:arch ripgrep                # then apply layer in guest
            charly fleet add vm:arch fedora-coder \
                --add-candy team-extras \
                --add-candy github.com/team/configs/candy/sshkeys
            charly fleet del vm:arch                        # reverse all applied layers (VM stays up)
            ```

            ### `VmDeployState` schema in charly.yml

            When `charly fleet add vm:<name>` completes, a `vm_state:` block lands inline in the charly.yml deploy:

            ```yaml
            arch:                                          # the deploy name; addressable as vm:arch
              vm:
                from: arch                                 # inherit the vm template (implies the VM target)
                add_candy:
                  - ripgrep
                  - github.com/team/configs/candy/sshkeys
                install_opts:
                  verify: true
                vm_state:
                  instance_id: 7b3a8f42-...                # stable UUID across rebuilds
                  disk_path: /home/user/.local/share/charly/vms/arch.qcow2
                  seed_iso: /home/user/.local/share/charly/vms/arch-seed.iso
                  ssh_port: 2222
                  ssh_user: arch
                  backend: libvirt
            ```

            `vm_state` is the persisted venue state: re-applies pick up `instance_id` (cloud-init uses it as a stable identifier) plus the disk/seed paths and SSH endpoint. SSH access uses the managed `charly-<vmname>` ssh-config alias written by `charly vm create`.

            ### Marking a deploy VM-targeted: the `vm:` substrate node

            A deploy is VM-targeted when its first child key is the `vm:` substrate node carrying `from: <entity>` — there is no `target:` field. CLI dispatch additionally accepts a `vm:<vm-name>` prefix on the deploy-name argument (`charly fleet add vm:arch`), which `ResolveTarget` reads to route through `pluginDeployTarget` (S3b — the adapter for the external `vm` substrate, dispatched through `candy/plugin-fleet`'s `Invoke(OpDeployDispatch)`). The prefix is an addressing convenience; the `vm:` substrate node is the source of truth. Naming a `vm:` deploy whose `vm` entity isn't declared in `charly.yml` errors at `charly fleet add` time; a declared-but-unbooted VM is auto-booted by the vm deploy plugin's `OpPrepareVenue`.

            ### `add_candy:` overlay semantics for VM targets

            When `charly fleet add vm:<name> <ref>` runs with `--add-candy`, the extra layers are applied **inside the guest** alongside the primary ref. The compiler merges `<ref>` + `add_candy:` into a single topo-sorted `InstallPlan`; the external `deploy:vm` plugin's `kit.WalkPlans` walks it inside the guest over SSH. The host-side ledger (keyed by `computeDeployID`) records both the base and overlay layers' teardown ops so `charly fleet del vm:<name>` reverses the full set.

            This is the same merge semantics as a `local:` deploy — just with SSH-wrapped execution. See `/charly-internals:install-plan` for the compiler and `/charly-internals:vm-deploy-target` for the execution model.

            ### VM-relevant `install_opts:` fields

            `install_opts:` in the charly.yml entry mirrors the CLI flags on `charly fleet add`. For VM targets, the relevant ones are:

            | Field | Effect |
            |---|---|
            | `with_service` | Enable systemd units declared in layers' `service:` lists |
            | `allow_repo_changes` | Permit repo-config mutations (rpmfusion, copr) in the guest |
            | `allow_root_tasks` | Permit arbitrary `cmd: user: root` tasks in the guest |
            | `verify` | Run layer `check:` over SSH post-deploy |
            | `skip_incompatible` | Skip layers lacking a guest-matching format section |

            `builder_image` + `yes` also apply. Host-target-only gates that don't apply to VM target: none — the gate semantics are identical.

            ### Prerequisite chain

            ```
            charly.yml declares a vm entity (`<name>: {vm: …}`)
                → charly vm build <name>         (cloud_image: fetch+resize+seed ISO; bootc: install to-disk)
                → charly vm create <name>        (libvirt domain + SMBIOS ssh key + passt portForward)
                → charly vm start <name>         (boot)
                → charly fleet add vm:<name> <ref>  (SSH → cloud-init wait → charly install → layer apply)
                → charly fleet del vm:<name>    (SSH → ReverseOps; VM stays up)
                → charly vm destroy <name>       (remove libvirt domain; --disk to also delete qcow2)
            ```

            See `/charly-vm:vms-catalog` for vm-entity authoring, `/charly-vm:vm` for the lifecycle commands, `/charly-internals:vm-deploy-target` for the Emit flow.

            ### `add_candy:` overlay mechanism

            Both container and host targets accept extra candies at deploy time via `--add-candy <ref>` (repeatable) or the deploy's inline `add_candy:` list. Semantics:

            - **Container target**: synthesizes an overlay Containerfile (`FROM <base-image>` + the extra candies' build steps) and builds a deterministic overlay image tagged `<deploy-name>-overlay:<short-hash>`. The deploy runs the overlay, not the base image. Re-running with different overlays rebuilds. `charly fleet del <name>` removes the overlay unless `--keep-image`.
            - **Host target**: the compiler merges the box's candies with `add_candy:`, topo-sorts the union, and compiles one `InstallPlan` covering the combined set. The ledger records which candies (base + overlay) were applied so teardown reverses everything.

            Ref forms for `--add-candy` are identical to the primary `<ref>` positional (local name / local path / remote / legacy `@` form).

            ## Two supported deploy patterns

            Every pod deploy MUST declare its `image:` field
            explicitly (a pod deploy is defined by carrying `image:`; hard
            load-time error if absent — see "Why `image:` is required" below).
            With that contract locked, two distinct patterns are supported:

            ### Pattern A — Multiple instances of the same image

            Use the `<base>/<instance>` deploy-name form when you want N
            container instances backed by the same image (one per tenant,
            per workspace, per environment, …):

            ```yaml
            versa:                             # base instance — name == image (just convention)
              pod:
                image: versa

            versa/ecovoyage:                   # `<base>/<instance>` deploy name
              pod:
                image: versa                   # SAME image; explicit (no inference)
                volume:
                  - name: workspace
                    type: bind
                    host: /home/user/projects/ecovoyage
                port:
                  - "32718:2718"               # explicit pinned ports; other ports auto-allocate

            versa/another-tenant:              # second instance of versa
              pod:
                image: versa
                volume:
                  - name: workspace
                    type: bind
                    host: /srv/another-tenant/workspace
            ```

            Container names: `charly-versa`, `charly-versa-ecovoyage`,
            `charly-versa-another-tenant`. Equivalent CLI invocations:
            `charly update versa -i ecovoyage` ↔ `charly update versa/ecovoyage` (the
            `-i <inst>` flag and the `/` suffix are interchangeable for
            addressing instance deploys).

            ### Pattern B — Arbitrary deploy name with image (and optional version pin)

            The deploy key is purely a name; it does NOT have to match the
            `image:` value. Use this for version pinning, canary deploys, or
            when you want a more descriptive deploy name than the image name
            itself:

            ```yaml
            versa-prod:                                   # arbitrary deploy name
              pod:
                image: versa                              # short name → resolves to current build

            versa-pinned-2026.131.2134:                   # pinned-version deploy
              pod:
                image: ghcr.io/opencharly/versa:2026.131.2134  # explicit ref, never re-resolved

            versa-canary:                                 # canary deploy on a rolling tag
              pod:
                image: ghcr.io/opencharly/versa:next
            ```

            Container names: `charly-versa-prod`, `charly-versa-pinned-2026.131.2134`,
            `charly-versa-canary`. Only the single `<key>` form addresses these
            (`charly update versa-prod`, NOT `charly update versa -i prod` — that would
            target an instance of `versa`, which is a different deploy).

            ### Schema rules locked down by these patterns

            - **`image:` is REQUIRED on every pod deploy.** Hard
              load-time error if absent, with a remediation hint pointing at
              `charly migrate` (the one-shot migration that injects
              the field into legacy entries).
            - **The `image:` value is either**:
              - a **short name** (e.g. `versa`) — resolved against the `candy:`
                image entries (those carrying `base:`/`from:`) in `charly.yml` to the currently-built tag, OR
              - a **fully-qualified registry ref** (e.g.
                `ghcr.io/opencharly/versa:2026.131.2134` or
                `…@sha256:…`) — pinned to that exact image, never re-resolved.
                Use this for version pinning and canary deploys.
            - **The deploy key is purely a name.** It may contain `/` to express
              the multi-instance pattern (`<base>/<instance>`) but does NOT have
              to match `image:`. `versa-old`, `versa-canary`, and
              `my-tenant/staging` are all valid deploy keys.
            - **Container name rule**: `charly-<key-with-slash-replaced-by-dash>`
              (e.g. `charly-versa`, `charly-versa-ecovoyage`, `charly-versa-canary`).
            - **`charly update <key>` and `charly update <base> -i <inst>`** are
              equivalent ways to address a `<base>/<inst>` deploy (Pattern A).
              For Pattern B (arbitrary name), only the single `<key>` form
              works.

            ### Auto port mapping — inherited container ports, auto-allocated on 127.0.0.1

            A box's published CONTAINER ports are inherited from its candy chain (boxes
            declare no `port:` — see `/charly-image:image` "Ports"). At `charly config`,
            `ResolveDeployPorts` maps EACH inherited container port to a host:container
            publish entry: a fresh free **`127.0.0.1`** host port is auto-allocated unless
            the deploy explicitly **pins** it. The result persists as `resolved_port:` and a
            prior allocation is reused for stability across `charly update`. `localizePort` +
            `BindAddress` (default `127.0.0.1`) bind every published port — auto-allocated
            and pinned alike — to loopback only; `charly status` shows the live mapping and
            check probes resolve it via `${HOST_PORT:N}`.

            A deploy/bed `port:` entry is a **PIN** (`host:container`) for specific container
            ports — the rest still auto-allocate (it is no longer a wholesale replacement,
            and the legacy `port: [auto]` sentinel is retired — absence IS auto). Pin only
            when you need a fixed, predictable host port:

            ```yaml
            jupyter:
              pod:
                image: jupyter
                port: ["8888:8888"]   # pin 8888 for a stable bookmark; other ports auto-allocate
            ```

            **Port resolution is keyed by deploy-key, not image short-name.** Each deploy
            entry's quadlet `PublishPort=` is sourced from THAT entry's own
            `resolved_port:`/`port:`, looked up by its deploy key. Multiple deploys backed by
            the same image short-name on one host (Pattern A instances, Pattern B
            pinned/canary deploys, and disposable check deploys whose `image:` matches a running
            production deploy) each get their own independent ports — a bed's
            auto-allocation never collides with a sibling's (the allocator excludes other
            deploys' host ports). `MergeDeployOntoMetadata` and `dc.Lookup` both take the
            deploy key (typically `c.Image`), never a value derived from the baked
            `ai.opencharly.box` label, so an entry's resolved ports are never clobbered by a
            sibling that merely shares the image.

            ### Why `image:` is required (R10 implication)

            The check runner inspects exactly the image the operator declared in
            `image:`, never what the container happens to be. Without an explicit
            `image:` field the runner would resolve the running container's image
            ref via `containerImageRef()`; for volume-pinned deploys (where
            `data_source:` seeds workspace from a specific image tag) the running
            container sits at the seed-version, not the current image, so the
            runner would read the older OCI label and silently drop any probes
            added since. Requiring `image:` makes the inspected image deterministic.

            ## Examples

            **Deploy a local image as a container:**
            ```bash
            charly fleet add my-dev fedora-coder
            # Uses the my-dev deploy's inline volume/port/env/tunnel config.
            charly fleet del my-dev
            ```

            **Deploy directly to the host:**
            ```bash
            charly fleet add host fedora-coder --with-services --assume-yes
            charly fleet del host --assume-yes
            ```

            **Deploy from a remote repo:**
            ```bash
            charly fleet add my-coder github.com/opencharly/charly/box/fedora-coder@main
            charly fleet add host github.com/team-acme/private-configs/candy/my-team-tools
            ```

            **Add overlay layers:**
            ```bash
            charly fleet add host fedora-coder \
                --add-candy team-extras \
                --add-candy github.com/team/configs/candy/sshkeys \
                --add-candy ./private.yml \
                --with-services
            ```

            **Dry-run to preview the plan:**
            ```bash
            charly fleet add host fedora-coder --dry-run --format=json
            ```

            **`charly start`/`charly stop` equivalence:**
            ```bash
            charly start fedora-coder            # == charly fleet add fedora-coder fedora-coder (container target)
            charly stop fedora-coder             # == charly fleet del fedora-coder
            ```

            ## Quadlet Generation

            User-level systemd services via podman quadlet. Generated by `charly config`.

            ### Generated File

            Path: `~/.config/containers/systemd/charly-<image>.container` (or `charly-<image>-<instance>.container` with `-i`).

            Contents include:
            - `[Container]` section: image reference, container name, port mappings, volumes, environment
            - `[Service]` section: restart policy, lifecycle hooks
            - `[Install]` section: `WantedBy=default.target` (omitted only when encrypted volumes are backed by the `config` secret backend)
            - `PodmanArgs=` for security settings (privileged, capabilities, devices)
            - `Volume=` for named volumes and plain bind mounts
            - `Environment=` / `EnvironmentFile=` for env vars
            - `ExecStartPost=` / `ExecStopPost=` for tunnel commands

            Service name: `charly-<image>.service`. Container name: `charly-<image>`. Entrypoint: determined by the embedded `init:` vocabulary for the configured init system. Encrypted volumes are mounted via `ExecStartPre=charly config mount` in the quadlet, which creates transient `charly-enc-<image>-<volume>.scope` units for each encrypted volume. These scope units are independent of the container service — they survive stop/restart (see `/charly-automation:enc`). The boot gate is the **secret backend**: with a keyring-class backend (`keyring`, `auto`, or unset) the deploy starts at boot, and `ExecStartPre` blocks in the mount until the keyring unlocks (`TimeoutStartSec=0`, so it waits indefinitely rather than failing); with `secret_backend: config` there is no `WantedBy=default.target` and the deploy needs an explicit `charly start` — a security decision recorded at sdk#121, because a passphrase stored in cleartext must not be auto-mounted, unattended, at every boot.

            ### Security in Quadlet

            Layer and image-level security settings become `PodmanArgs=` in the quadlet file:

            - `privileged: true` -> `PodmanArgs=--privileged`
            - `cap_add` -> `PodmanArgs=--cap-add=<CAP>`
            - `devices` -> `PodmanArgs=--device=<DEV>`
            - `security_opt` -> `PodmanArgs=--security-opt=<OPT>`

            Source: `sdk/deploykit/security.go`, `sdk/deploykit/quadlet.go`.

            ### Image Transfer

            When `engine.build=docker`, `charly config` auto-detects if the image is missing from podman and transfers via `docker save | podman load`. `charly update` re-transfers if needed.

            Source: `sdk/deploykit/quadlet.go` + `sdk/deploykit/quadlet_pod.go` (generation), `charly/commands.go` (command structs).

            ## Tunnel Configuration

            Expose services outside the container host via tunnels. Tunnel config lives exclusively in `charly.yml` — it is NOT in `charly.yml` or OCI image labels. `charly config setup` persists tunnel config automatically via `saveDeployState`.

            ### Tailscale Serve (tailnet-private, default)

            Exposes a port to your Tailscale network only. No FQDN needed -- Tailscale handles TLS automatically. Any port works for tailnet-only serve.

            ```yaml
            tunnel: tailscale
            # or expanded:
            tunnel:
              provider: tailscale
              private: all       # all image ports on tailnet
            ```

            **`bind_address` must be `127.0.0.1` (the default).** Setting `0.0.0.0` causes the container to bind on the Tailscale interface, preventing Tailscale from intercepting TLS. Result: HTTPS fails with `wrong version number`.

            **Port form in `charly.yml`.** The canonical form is bare `H:C` (e.g. `8888:8888`); `charly config` prepends `127.0.0.1:` automatically when a tunnel is set. The IP-prefixed form `127.0.0.1:8888:8888` (and IPv6 `[::1]:8888:8888`) is also accepted — the canonical `ParsePortMapping` helper in `spec/spec/port_mapping.go` normalizes both shapes to a single-prefixed `PublishPort=` line, so neither form produces a doubled `127.0.0.1:127.0.0.1:8888:8888` quadlet. Unparseable port strings are logged loudly to stderr rather than silently dropped (a silent skip would otherwise suppress the entire `ExecStartPost=tailscale serve` block when even one port couldn't be parsed).

            ### Tailscale Funnel (public internet)

            Exposes a port to the public internet via Tailscale's edge network. Funnel restricts HTTPS ports to: 443, 8443, 10000.

            ```yaml
            tunnel:
              provider: tailscale
              public: [8080]    # funnel ports must be 443, 8443, or 10000
            ```

            ### Cloudflare Tunnel

            Routes traffic through Cloudflare's network. Requires the deploy's `dns:` hostname. Prerequisite: `cloudflared tunnel login` (one-time auth).

            ```yaml
            tunnel:
              provider: cloudflare
              port: 3001
              tunnel: my-tunnel    # optional, defaults to charly-<image>
            dns: "app.example.com"
            ```

            `charly config` handles the full tunnel lifecycle automatically:
            1. Creates the Cloudflare tunnel (`cloudflared tunnel create`) if it doesn't exist
            2. Writes the tunnel config YAML (`~/.config/charly/tunnels/<name>.yml`) with ingress rules
            3. Routes DNS with `--overwrite-dns` (creates or updates CNAME to tunnel)
            4. Generates a companion systemd service (`charly-<image>-tunnel.service`)
            5. Enables the tunnel service and adds `Wants=` to the container quadlet

            `charly start` then starts both the container and the tunnel service together.

            ### Backend Schemes

            Port protocols declared in `charly.yml` control the backend URL scheme used by tunnel commands. The protocol flows from layer → OCI label (`ai.opencharly.port_proto`) → tunnel command.

            **Tailscale serve/funnel schemes:**

            | Scheme | Target URL | Tailscale flag | Use case |
            |--------|-----------|----------------|----------|
            | `http` (default) | `http://127.0.0.1:PORT` | `--https` | Plain HTTP backends |
            | `https` | `https://127.0.0.1:PORT` | `--https` | HTTPS with valid cert |
            | `https+insecure` | `https+insecure://127.0.0.1:PORT` | `--https` | HTTPS with self-signed cert (e.g., Traefik) |
            | `tcp` | `tcp://127.0.0.1:PORT` | `--tcp` | Raw TCP forwarding |
            | `tls-terminated-tcp` | `tcp://127.0.0.1:PORT` | `--tls-terminated-tcp` | TLS-terminated TCP |

            **Cloudflare tunnel schemes:**

            | Scheme | Ingress service | Use case |
            |--------|----------------|----------|
            | `http` (default) | `http://localhost:PORT` | HTTP origins |
            | `https` | `https://localhost:PORT` | HTTPS origins (use with `noTLSVerify`) |
            | `tcp` | `tcp://localhost:PORT` | Raw TCP (requires client-side cloudflared) |
            | `ssh` | `ssh://localhost:PORT` | SSH tunneling |
            | `rdp` | `rdp://localhost:PORT` | RDP streaming |
            | `smb` | `smb://localhost:PORT` | SMB/CIFS file sharing |

            **UDP** ports are never tunneled — a warning is printed. UDP traffic works directly between tailnet nodes.

            `charly box validate` checks port schemes against provider capabilities. For example, `ssh` is valid for Cloudflare but not Tailscale; `tls-terminated-tcp` is valid for Tailscale but not Cloudflare.

            See `/charly-image:layer` for port protocol syntax in `charly.yml`.

            ### Multi-Port Tailscale Serve

            When `private: all` or `ports: all`, every image port gets its own `tailscale serve` command with scheme-appropriate flags:

            ```yaml
            tunnel:
              provider: tailscale
              private: all
            ```

            - `tailscale serve --bg --https=PORT http://127.0.0.1:PORT` (http, default)
            - `tailscale serve --bg --https=PORT https+insecure://127.0.0.1:PORT` (https+insecure)
            - `tailscale serve --bg --tcp=PORT tcp://127.0.0.1:PORT` (tcp)
            - `tailscale serve --bg --tls-terminated-tcp=PORT tcp://127.0.0.1:PORT` (tls-terminated-tcp)

            Quadlet generates multiple `ExecStartPost=` and `ExecStopPost=` lines. Requires `tailscale set --operator=$USER` for non-root access.

            Port protocols are stored in the `ai.opencharly.port_proto` image label so deploy-mode commands work without access to the original layer definitions. Remote refs require `charly box pull` first — see `/charly-build:pull`.

            ### Instance Tunnel Inheritance

            **Critical:** When deploying instances with `charly config setup -i <name>`, tunnel config is NOT auto-inherited from the base image's charly.yml entry. Each instance must have its own `tunnel:` section in charly.yml. Without it, the generated quadlet will have no `ExecStartPost=tailscale serve` commands and the instance will be unreachable via Tailscale.

            **Root cause:** `labels.go:238` deliberately skips parsing the `ai.opencharly.tunnel` OCI label — tunnel is charly.yml-only. When `charly config setup` creates a new instance, it writes ports/env/security to charly.yml but does not copy tunnel from the base entry.

            **Workaround:** After `charly config setup -i <name>`, manually edit `~/.config/charly/charly.yml` to add `tunnel: {provider: tailscale, private: all}` to the instance entry, then re-run `charly config setup -i <name>` to regenerate the quadlet.

            ### Resolution

            `tunnel` inherits from defaults (image -> defaults -> nil). The shorthand `tunnel: tailscale` defaults to `private: all` (all ports on tailnet). The shorthand `tunnel: cloudflare` defaults to `public: all`.

            Source: `sdk/deploykit/tunnel_resolve.go` (resolution + the shared `schemeTarget`/`tailscaleFlag`/`isTCPFamily` helpers — the former `charly/tunnel.go` is DELETED, K-wave 2), `candy/plugin-tunnel` (the `verb:tunnel` EXECUTION leg — `tunnel_exec.go` runs the tailscale serve/funnel + cloudflared lifecycle; the former core dispatch adapter `charly/tunnel_plugin.go` is DELETED, K-wave 2), `candy/plugin-deploy-pod` / `candy/plugin-pod` (the pod-lifecycle plugins that resolve a `TunnelConfig` and drive `verb:tunnel` directly), `sdk/deploykit/quadlet.go` (systemd integration). Tunnel config is a deploy-time concern (charly.yml only) — not validated at image-validate time.

            ## charly.yml — Source of Truth

            `~/.config/charly/charly.yml` is the **source of truth** for per-machine deployment configuration (not checked into git). All deployment commands read from image labels + charly.yml — no `charly.yml` needed.

            ### How it gets populated

            1. **`charly config`** automatically persists: workspace, ports, env (CLI -e), env_file, network, security (auto-detected devices), volume backing (--bind/--encrypt)
            2. **`charly fleet import`** merges pre-provisioned config (tunnel, volumes, DNS) from files
            3. **`charly remove`** cleans the entry (use `--keep-deploy` to preserve for re-config)

            ### Legacy-schema rejection

            The per-host config is compact node-form: top-level name-first `<name>: {<substrate-kind>: <full body>}` entries (the substrate-kind being `pod`/`vm`/`kubernetes`/`local`/`android`/`group`, its value carrying the deploy config INLINE, projected internally into the `FleetConfig.Fleet` map; the only named children are member sub-entities), preceded by a `version:` stamp and an optional `provides:` directive. `LoadFleetConfig` reads it through the unified node-form loader (`LoadUnified` → `ProjectFleetConfig`). A host still on a legacy root shape — the obsolete `image:`/`images:` root key, or the legacy `deploy.yml` filename — is detected and fails loud, so a misparse can never silently drop a `volume:` entry with `type: encrypted` — the encrypted-volume load is `LoadEncryptedVolume` (sdk/deploykit/enc_probe.go) — and quietly void the encryption guarantee; the failure points at `charly migrate`.

            `charly status` surfaces this as a non-fatal warning (graceful degradation falls back to image-label-driven display); the strictly-charly.yml-driven verbs (`charly fleet show`, `charly config status`, `charly start`) hard-fail. Run `charly migrate` to convert in place — it backs the original up to `<file>.bak.<unix-ts>` and rewrites to the latest schema. See `/charly-build:migrate` "charly migrate".

            ### Structure

            ```yaml
            version: 2026.186.2323
            my-app:
              pod:
                image: my-app
                dns: "app.example.com"
                env_file: "/home/user/project/.env"
                network: charly
                engine: podman
                tunnel:
                  provider: cloudflare
                  port: 2283
                volume:
                  - name: data
                    type: bind
                    host: "~/data/myapp"
                  - name: workspace
                    type: bind
                    host: /home/user/project
                    path: /workspace
                  - name: secrets
                    type: encrypted
                port:
                  - "2283:2283"
                env:
                  LOG_LEVEL: debug
                security:
                  devices:
                    - /dev/dri/renderD128
            ```

            Per-deploy fields: the substrate node (`pod`/`vm`/`kubernetes`/`local`/`android`/`group`) holds the COMPLETE deploy body inline — the scalars (`image:` for a pod, `from:` to inherit a same-kind template, `disposable`, `lifecycle`, `description`, `dns`, `acme_email`, `env_file`, `network`, `engine`) AND every collection (`tunnel`, `volume`, `port`, `env` — a map, `security`, `secret`, `sidecar`, `add_candy`, `install_opts`). The only named children a deploy carries are member sub-entities (see "Sibling members" below).

            ### The substrate node, `add_candy:`, and `install_opts:` fields

            The `charly fleet add`/`del` surface honors these per deploy, each only when relevant to the resolved target.

            **The substrate node** — `pod:` (the default, carrying `image:`), `vm:`, `kubernetes:`, `local:`, or `android:` (carrying `from:`) selects the target; there is no `target:` field. A local deploy carries the Ansible-style `host:` scalar (`host: local`, the default, runs directly; `host: <user@machine>` runs over SSH) and applies its `add_candy:` candies to the host filesystem.

            **`add_candy:`** — an inline list of extra layer refs applied on top of the image's base layers. Each entry accepts the same 4 ref forms as the command-line `--add-candy` flag (local name / local YAML path / remote `github.com/.../candy/<n>[@ref]`). See "add_candy: overlay mechanism" above for pod vs local semantics.

            **`install_opts:`** — an inline block of local-target defaults that mirror the CLI flags on `charly fleet add`. CLI flags win on conflict; the deploy provides defaults so you don't have to repeat `--with-services --allow-repo-changes` on every invocation.

            ```yaml
            my-host:
              local:
                from: fedora-coder                                    # inherit the kind: local template
                host: local                                           # present ⇒ local target
                add_candy:
                  - my-team-vimrc                                     # local layer
                  - github.com/team-acme/configs/candy/sshkeys        # remote layer
                  - ./private-overlay.yml                             # local file
                install_opts:
                  with_service: true
                  allow_repo_changes: true
                  allow_root_tasks: false
                  skip_incompatible: false
                  verify: true
                  builder_image: fedora-builder:2026.04
                env:
                  OPENCHARLY_DEV: "true"
            ```

            Fields ignored on pod deploys: `install_opts` (local-only). Fields ignored on local deploys: `volume`, `port`, `tunnel`, `sidecar`, `security`'s container-runtime bits.

            ### Resource Caps

            Cgroup memory and CPU limits are stored in the `security:` block of charly.yml and persist across `charly config` re-runs (a `--memory-max` flag applied once stays in effect until explicitly changed). The fields are:

            ```yaml
            selkies-desktop:
              pod:
                image: selkies-desktop
                security:
                  shm_size: "1g"
                  memory_max: "6g"
                  memory_high: "5g"
                  memory_swap_max: "2g"
                  cpus: "4.0"
            ```

            **Merge semantics** (authoritative, from `sdk/deploykit/security.go`):

            | Source | Merge rule |
            |---|---|
            | Layer → layer | Smallest value wins (tightest cap is the safer default) |
            | Layers → image-level `security:` in charly.yml | Box-level **replaces** the merged layer value |
            | Box-level → deploy-level `security:` in charly.yml | Deploy-level **replaces** the image-level value |
            | CLI flag → deploy-level | CLI flag **writes** directly to charly.yml (`--memory-max=...` on `charly config`) |

            Quadlet emission (`[Service]` section of `.container` file):

            - `memory_max` → `MemoryMax=6G` (lowercase `g` is auto-normalized to `G` because systemd parses lowercase as `infinity` — see `/charly-selkies:chrome` gotcha)
            - `memory_high` → `MemoryHigh=5G`
            - `memory_swap_max` → `MemorySwapMax=2G`
            - `cpus` → `CPUQuota=400%` (systemd percentage form: 1 core = 100%)

            Direct-mode emission (podman run flags, for `engine.run=direct`): `--memory`, `--memory-reservation`, `--memory-swap`, `--cpus`. `SecurityArgs` in `sdk/deploykit/security.go` emits both forms from the same source of truth.

            **Unset fields pass through** — setting `--memory-max=6g` alone will not wipe an existing `shm_size` from charly.yml. Only the fields you pass on the CLI get overwritten; everything else is preserved from the current charly.yml state.

            **Canonical consumer:** the chrome candy's cgroup caps. See `/charly-selkies:chrome` (Resource Caps) — the caps bound a Chrome crash loop's blast radius; a wedged loop (orphan memfd shmem) is cleared by restarting the container, which tears down the cgroup. See `/charly-infrastructure:supervisord` (Event Listeners) for the eventlistener pattern in general and `/charly-image:layer` (Security Declaration) for the authoring side.

            ### Provides (Top-Level)

            The `provides:` section holds all resolved env and MCP provides entries from deployed images. Managed automatically by `charly config` when images with `env_provide` or `mcp_provide` layers are deployed.

            ```yaml
            provides:
              env:
                - name: OLLAMA_HOST
                  value: http://charly-ollama:11434
                  source: ollama
                - name: PGHOST
                  value: charly-postgresql
                  source: postgresql
              mcp:
                - name: jupyter
                  url: http://charly-jupyter:8888/mcp
                  transport: http
                  source: jupyter
            my-app:
              pod:
                image: my-app
            ```

            - `provides.env:` — resolved env_provide entries with `{name, value, source}` (self-excluded per consumer)
            - `provides.mcp:` — resolved mcp_provide entries with `{name, url, transport, source}` (pod-aware, no self-exclusion)
            - `source` tracks which image injected each entry — used for cleanup on `charly remove`
            - Priority for env (last wins): provides.env < per-image deploy env < deploy env_file < workspace .env < CLI --env-file < CLI -e
            - `charly config remove` / `charly remove` automatically cleans up entries from the removed image
            - Instance-aware cleanup: removing an instance (e.g., `charly remove selkies-desktop -i work`) only cleans provides entries sourced from that specific instance (`selkies-desktop/work`), not from other instances of the same base image. Base image removal requires no other instances to exist before cleaning provides

            See `/charly-image:layer` for `env_provide`/`mcp_provide` field declarations and `/charly-core:charly-config` for `--update-all` propagation.

            ### Secrets

            Per-deployment secret source overrides. Secrets declared in image labels (from `charly.yml`) are provisioned as Podman secrets at `charly config` time. A deploy's inline `secret:` list can override where the value comes from:

            ```yaml
            my-app:
              pod:
                image: my-app
                secret:
                  - name: api-key             # matches layer secret name
                    source: keyring           # "keyring" (default), "env:VAR", "file:/path"
            ```

            If no source is specified, the credential resolution chain is used: env var > keyring > config file.

            ### Workspace recall

            Volume binding is configured at deploy time via `--bind` flags. The binding is persisted in charly.yml:

            ```bash
            charly config my-app --bind workspace=~/project    # Saves volume config to charly.yml
            charly remove my-app --keep-deploy                 # Quadlet removed, config preserved
            charly config my-app                               # Picks up volumes from charly.yml
            ```

            ### Deploy status audit

            ```bash
            charly fleet status
            # sway-browser-vnc              charly.yml: yes  quadlet: yes  (ok)
            # old-service                   charly.yml: yes  quadlet: no   (stale config)
            # manual-service                charly.yml: no   quadlet: yes  (no overrides)
            ```

            ### Labels-only architecture

            Deployment commands (`charly config`, `start`, `status`, `logs`, `update`, `remove`, `seed`, `service`) resolve all configuration from **OCI image labels** + **charly.yml** — no `charly.yml` dependency. This means you can deploy on any machine with just `charly box pull` + `charly config`.

            **Local-storage requirement.** Because deploy-mode commands read OCI labels directly from local container storage (via `ExtractMetadata` → `podman inspect`), the image must be pulled first. If it isn't, the command fails with `ErrImageNotLocal` and the CLI suggests `charly box pull`. See `/charly-build:pull` for the sentinel pattern and remote-ref (`@github.com/...`) handling.

            **`MergeDeployOntoMetadata` ordering gotcha.** When extending deploy-mode code, remember that deploy-overlay fields like `meta.Tunnel` are nil until `MergeDeployOntoMetadata` runs. A `if meta.Tunnel != nil` check before the merge is unreachable code — this was the actual bug fixed in `start.go` by the refactor.

            ### Instance Support

            Deploy multiple containers of the same image with `-i <instance>`:

            ```bash
            charly config selkies-desktop -i work -e TS_HOSTNAME=work -p 3001:3000
            charly config selkies-desktop -i personal -p 3002:3000
            charly start selkies-desktop -i work
            charly start selkies-desktop -i personal
            ```

            **Deploy key convention:** Base images use `selkies-desktop` as the charly.yml key. Instances use `selkies-desktop/work` (slash-separated). Functions: `DeployKey()` constructs keys, `ParseDeployKey()` splits them back (`spec/spec/deploy_key.go` — the former `charly/deploy.go` is DELETED, K-wave 2).

            **Container naming:** `charly-<image>-<instance>` (e.g., `charly-selkies-desktop-work`). Quadlet file: `charly-selkies-desktop-work.container`.

            **Deploy structure with instances:**

            ```yaml
            selkies-desktop:
              pod:
                image: selkies-desktop
                port: ["3000:3000"]
            selkies-desktop/work:
              pod:
                image: selkies-desktop
                port: ["3001:3000"]
                env:
                  TS_HOSTNAME: work
            selkies-desktop/personal:
              pod:
                image: selkies-desktop
                port: ["3002:3000"]
            ```

            **Instance lifecycle:** All commands accept `-i`: `charly start/stop/status/logs/remove <image> -i <instance>`, `charly fleet show/reset <image> -i <instance>`. Removing an instance only cleans its charly.yml entry — the base and other instances are unaffected. Provides cleanup waits until the last entry for a base image is removed.

            **Instance removal gotcha:** `charly config remove` disables the quadlet service but does NOT remove the charly.yml entry and does NOT delete the quadlet file. `charly remove <image> -i <instance>` is the complete teardown (stops the container, deletes the quadlet file, reloads systemd); `charly fleet reset <image> -i <instance>` removes the charly.yml entry. If you run `charly config --update-all` before cleaning charly.yml, stale quadlet files will be re-created. See `/charly-core:charly-config` for the removal semantics.

            **MCP name disambiguation:** When an instance provides MCP servers, the server name gets `-<instance>` appended (e.g., `chrome-devtools-work`). See `/charly-core:charly-config` for details.

            ## Volume Backing

            Layers declare what persistent storage they need via `volume:` in `charly.yml`. By default, all volumes are Docker/Podman named volumes. At `charly config` time, any volume's backing can be changed to a host bind mount or encrypted gocryptfs mount.

            ### Per-Volume Configuration via `charly config`

            ```bash
            # Default: all volumes as named volumes (no flags needed)
            charly config immich

            # Configure specific volumes as bind mounts
            charly config immich --bind import --bind external

            # Bind mount with explicit host path
            charly config immich --bind library=/mnt/nas/photos

            # Configure volume as encrypted (gocryptfs)
            charly config immich --encrypt library

            # Canonical syntax: --volume name:type[:path]
            charly config immich -v library:bind:/mnt/nas -v import:bind -v cache:encrypted

            # Fully automated via env vars (no prompts)
            CHARLY_VOLUMES_IMMICH="library:bind:/mnt/nas,import:bind" charly config immich --password auto
            ```

            ### charly.yml Volume Config

            Volume backing choices are persisted in charly.yml as the deploy's inline `volume:` list:

            ```yaml
            immich:
              pod:
                image: immich
                volume:
                  - name: library
                    type: bind
                    host: "/mnt/nas/photos"   # explicit host path
                  - name: import
                    type: bind                 # no host → auto path: <volumes_path>/<image>/import
                  - name: cache
                    type: encrypted            # gocryptfs managed
            ```

            **Fields:**
            - `name`: matches a layer-declared volume name
            - `type`: `volume` (default, named volume), `bind` (host directory), `encrypted` (gocryptfs)
            - `host`: explicit host path — for `bind` type (optional, omit for auto path); for `encrypted` type, the direct volume directory containing `cipher/` and `plain/` (optional, omit to use global `encrypted_storage_path` with `charly-<image>-<name>` prefix)
            - `path`: container path (only for deploy-only volumes not declared in any layer)
            - `data_seeded`: `bool` — tracks whether data from image data candies was provisioned (set by `charly config`)
            - `data_source`: `string` — image:tag that provided the data (updated by `charly config` and `charly update`)

            **Auto path:** When `type: bind` and no `host` is specified, the host path is computed at runtime: `<volumes_path>/<image>/<name>`. Default volumes_path: `~/.local/share/charly/volumes/`. Configurable: `charly settings set volumes_path /mnt/nas/charly` (env: `CHARLY_VOLUMES_PATH`).

            **Unconfigured volumes** remain named volumes — no charly.yml entry needed.

            ### Resolution Flow

            `ResolveVolumeBacking()` in `sdk/deploykit/deploy_volume.go` splits image volumes into named volumes and bind-backed mounts:

            1. Load all volumes from image labels (`ai.opencharly.volume`)
            2. Load charly.yml volume overrides for this image
            3. For each declared volume:
               - If charly.yml says `type=bind` → host bind mount (explicit path or auto path)
               - If charly.yml says `type=encrypted` → gocryptfs FUSE mount
               - Otherwise → named volume (Docker/Podman-managed)
            4. Deploy-only volumes (with `path:` set, not in any layer) are also supported

            ### Integration

            - **Data provisioning**: `charly config` automatically provisions data from data candies into bind-backed volumes (via `--seed`, default true). `charly update` merges new data non-destructively. See `/charly-core:charly-config` and `/charly-core:charly-update`
            - **`charly shell`/`charly start`**: resolves volume backing, verifies bind dirs exist and encrypted volumes are mounted, generates `-v` flags
            - **`charly config` (quadlet)**: bind-backed volumes become `Volume=` lines with host paths. `--userns=keep-id` added when bind-backed volumes exist
            - **`charly remove --purge`**: removes named volumes (also encrypted volumes + the `<name>-overlay` images — see `/charly-core:remove`)
            - **`charly box inspect --format bind_mounts`**: outputs deploy-configured volume backing

            Source: `charly/deploy.go` (`DeployVolumeConfig`, `ResolveVolumeBacking`), `candy/plugin-deploy-pod/resolve.go` (`deploykit.ResolvedBindMount` — the former `charly/enc.go` is DELETED, K-wave 2).

            ## VNC Password for Deployments

            For images with wayvnc (VNC on tcp:5900), provision a VNC password after enabling.
            Store the password in the VNC credential store (retained host-side), then configure
            server-side auth (VeNCrypt/TLS) by running the candy's `vnc: passwd` step:

            ```bash
            charly settings set vnc.password.sway-browser-vnc mysecret   # store in the VNC credential store
            charly config sway-browser-vnc
            # After the container starts, configure server-side auth via the vnc: passwd step:
            charly check live sway-browser-vnc --filter vnc
            ```

            See `/charly-check:vnc` for full VNC authentication documentation.

            ## Port Relay Pattern

            Some services (OpenClaw) bind only to loopback for security. The `port_relay` field in `charly.yml` creates a socat relay from the container's network interface to loopback, making the service accessible externally without weakening its security model.

            ```yaml
            # candy/openclaw/charly.yml — port_relay is a CANDY field, inline in the candy body
            openclaw:
              candy:
                port:
                  - 18789
                port_relay:
                  - 18789
            ```

            Requires the `socat` layer as a dependency. The relay runs as a `relay-<port>` service in the configured init system. See `/charly-openclaw:openclaw` for an example.

            **Chrome CDP exception:** Chrome DevTools no longer uses `port_relay`. Chrome 146+ rejects connections with non-localhost Host headers, so a simple socat relay is insufficient. Instead, Chrome uses a `cdp-proxy` Python supervisord service that listens on `0.0.0.0:9222`, forwards to Chrome on `127.0.0.1:9223` with Host header rewriting, and rewrites response URLs (e.g., `webSocketDebuggerUrl`) with Content-Length correction. See `/charly-selkies:chrome` and `/charly-check:cdp` for details.

            ## Provides Configuration

            Global environment and MCP server injection for all deployed images. Stored in charly.yml under `provides:`.

            ### Structure

            ```yaml
            provides:
              env:
                - name: OLLAMA_HOST
                  value: http://charly-ollama:11434
                  source: ollama
              mcp:
                - name: jupyter
                  url: http://charly-jupyter:8888/mcp
                  transport: http
                  source: jupyter
            ```

            - `provides.env:` — resolved env_provide entries with `{name, value, source}`
            - `provides.mcp:` — resolved mcp_provide entries with `{name, url, transport, source}`
            - `source` field tracks which image contributed each entry (used for cleanup on `charly remove`)
            - Entries resolved at `charly config` time from layer `env_provide:` and `mcp_provide:` declarations
            - `GlobalEnvForImage()` in `provides.go` resolves both env and MCP provides for each consumer image
            - Env provides: self-excluded (prevents own env_provide from overriding service bind addresses)
            - MCP provides: pod-aware (same-container entries resolve to `localhost`, no self-exclusion)
            - Consumer containers receive `CHARLY_MCP_SERVERS` JSON env var with resolved MCP server entries

            See `/charly-core:charly-config` for setup workflow and `/charly-image:layer` for declaration format.

            ## Sidecar Pod Deployment

            When sidecars are attached via `charly config --sidecar <name>`, deployment generates a Podman **pod** instead of a standalone container. See `/charly-automation:sidecar` for full sidecar documentation.

            ### Generated Files

            | File | Content |
            |------|---------|
            | `charly-<image>.pod` | Pod: `Network=charly`, `PodmanArgs=-p` (ports), `--shm-size` |
            | `charly-<image>-<sidecar>.container` | Sidecar: image, env, caps, devices, secrets |
            | `charly-<image>.container` | App: `Pod=charly-<image>.pod`, no ports/network |

            The pod owns the shared network namespace. Port mappings and ShmSize move from the container to the pod. The app container gets `Pod=` and loses `PublishPort=` and `Network=`.

            ### Dual Networking (Tailscale)

            When a Tailscale sidecar is attached, the pod has dual networking:
            - **"charly" bridge** — container-to-container connectivity, `env_provide` discovery
            - **Tailscale tun** — exit node routing for outbound internet traffic
            - `--exit-node-allow-lan-access` exempts bridge subnets from the tunnel

            Host `tunnel: tailscale` (ExecStartPost=tailscale serve) and the sidecar are **independent**: the host tunnel serves ports on the host's tailnet, while the sidecar handles exit node routing on a potentially different tailnet.

            ### charly.yml Sidecar Config

            ```yaml
            selkies-desktop:
              pod:
                image: selkies-desktop
                sidecar:
                  tailscale:
                    env:
                      TS_HOSTNAME: selkies-desktop
                      TS_EXTRA_ARGS: "--exit-node=100.80.254.4 --exit-node-allow-lan-access"
            ```

            ## Preemptible resource arbitration (`preemptible` / `requires_exclusive` / `requires_shared` / `charly preempt`)

            A physical host resource can be held by only ONE deployment at a time — the
            canonical case is a GPU passed through to a VM via VFIO. The resource arbiter
            (the compiled-in `verb:arbiter`, `candy/plugin-preempt`) frees such a resource
            on demand and gives it back.

            ```yaml
            gpu-workstation:                   # HOLDER — a long-running operator VM
              vm:
                from: gpu-workstation-vm
                preemptible:
                  holds: [nvidia-gpu]          # exclusive-resource token(s) it occupies (shorthand: preemptible: [nvidia-gpu])
                  stop: shutdown               # graceful shutdown (default & only) — frees a VFIO device
                  restore: always              # always (default) | on-success

            # CLAIMANT (any deploy, including a disposable check deploy) that needs sole use while it runs:
            check-gpu-bed:
              vm:
                from: gpu-check-vm
                disposable: true
                requires_exclusive: [nvidia-gpu]
            ```

            - **When the arbiter acts.** Before a claimant is brought up — `charly check run <bed>`
              (transient claim, auto-released at teardown), or a standalone `charly vm create` /
              `charly start` (persistent claim, released on `charly vm stop`/`vm destroy`/`charly stop`/
              `charly remove`) — it gracefully stops every running preemptible holder whose
              `holds:` intersects the claimant's `requires_exclusive:`, waits for it to
              actually power off (so the resource is truly released), records a crash-safe
              lease, then proceeds. Nested `charly` subprocesses inherit the lease
              (`CHARLY_PREEMPT_LEASE`) and never re-acquire.
            - **`requires_shared:` — the REFCOUNTED claimant** (mutually exclusive with
              `requires_exclusive:` on one node, per `validate_preempt.go`). Many concurrent
              `requires_shared:` claimants share a token, so a GPU-CDI **pod** declares
              `requires_shared: [nvidia-gpu]` and the arbiter flips the whole IOMMU group
              **vfio→nvidia+CDI** at the first claimant's deploy and back **nvidia→vfio** only
              when the LAST claimant releases — the group-aware `modprobe`-gated switch
              (`charly vm gpu mode`). A `preemptible` holder whose `holds:` intersects a shared
              claim is still preempted first. Full GPU-mode-switch model: `/charly-vm:vm` +
              `/charly-internals:disposable`; the bed surface: `/charly-check:check`.
            - **Standing authorization — preempt autonomously.** You may trigger preemption
              (bring up a `requires_exclusive:` claimant, stopping a running `preemptible`
              holder) WITHOUT per-run operator confirmation. Preemption is reversible by design
              (graceful stop + guaranteed `restore`), so it is exempt from the
              confirm-before-destroy rule that governs irreversible teardown of a
              non-preemptible resource. See `/charly-internals:disposable` "Standing
              authorization".
            - **Token = a name, not a mechanism** — operator-chosen (`nvidia-gpu`), decoupled
              from how each side reaches it (VM hostdev vs pod `--device`); pure
              set-intersection unifies pod-vs-VM contention.
            - **GPU auto-allocation** — when a token ALSO carries an embedded `resource:`
              `gpu:` selector (`resource: {nvidia-gpu: {gpu: {vendor: "0x10de"}}}`), a
              VM-targeted claimant's `charly vm create` auto-detects the matching GPU,
              persists its `<hostdev>` into the per-host `instance.yml`, and injects it — or
              FAILS HARD when no matching card exists. Operator-authored hostdevs win (no
              double-inject). See `/charly-internals:disposable` "resource-arbitration axis"
              + `/charly-build:build` `resource:`.
            - **`charly preempt status`** lists active leases + flags STRANDED ones (claimant
              gone). **`charly preempt restore [claimant]`** reconciles stranded leases (also run
              automatically at the next acquire) / force-releases a named one. A holder is
              NEVER left permanently stopped — the ledger
              (`~/.local/share/charly/preemption/leases.yml`) is written before any stop, and
              restore = "start every listed holder that isn't running".
            - **Orthogonal to disposable/ephemeral** — no derivation either way; a deploy may
              be both preemptible and disposable. Full reference: `/charly-internals:disposable`
              "The resource-arbitration axis".

            ## Deploy-into nesting — run a `local:` deploy INSIDE a VM (or pod)

            A resource node placed **under another resource node** deploys **INTO** that node's venue.
            Nesting is **tree position** — there is no `nested:` field, and the child carries **no `host:`
            field**. The executor is derived from the tree: `kit.NestedExecutor{Parent, Jump}` composes
            onto the parent's venue (`Venue()` → `nested:<jump>/ssh://arch@…`), so a `local:` child of a
            `vm:` node runs its layer-application **in the guest**, driven from the host. The child is
            addressed by dotted path (`<parent>.<child>`).

            **This is how you run `local:`-target testing inside a VM instead of on the operator's
            machine** — no `host:` retarget, no `charly --host`, no charly on the guest's PATH (the vm
            deploy stages the host binary into the guest for its own use).

            Canonical worked example — `check-arch-vm` in `box/arch/charly.yml` (a `vm:` bed with a
            nested `local:` child whose checks assert the ledger in the GUEST's home):

            ```yaml
            check-arch-vm:
              vm:
                from: arch
                disposable: true
              arch-host:                       # tree position ⇒ deploys INTO the VM above
                local:                         # NO host: field — the venue comes from the parent
                  disposable: true
                  add_candy:
                    - '@github.com/opencharly/charly/candy/direnv:v2026.183.1359'
                  plan:
                    - check: command=test -d /home/arch/.config/opencharly/installed/deploys
                      id: ah-ledger-deploys-dir       # the ledger lands in the GUEST, not the host
                      context: [runtime]
                      command: "test -d /home/arch/.config/opencharly/installed/deploys"
                    - check: command=direnv --version
                      id: ah-direnv-version
                      context: [runtime]
                      command: "direnv --version"
            ```

            Contrast the three ways a `local:` deploy reaches a machine — they are NOT interchangeable:

            | Shape | Executor | Where the layers land |
            |---|---|---|
            | `local: {host: local}` (or `host:` absent), **top-level** | `ShellExecutor` | this machine, direct shell |
            | `local: {host: user@machine}`, **top-level** | `SSHExecutor` | that remote machine |
            | `local:` **nested under** a `vm:`/`pod:` node | `NestedExecutor` over the parent venue | inside the enclosing deployment |

            A top-level `local:` bed marked `disposable: true` therefore applies its candies to the
            OPERATOR'S workstation. Nest it under a disposable `vm:` bed to keep the same `local:`
            authoring shape while writing only inside the guest.

            **What nesting does NOT preserve.** `ShellExecutor` runs ONLY for the table's FIRST row — a
            top-level `local:` deploy whose `host:` is `local` or absent. A nested child runs on
            `NestedExecutor` over the parent's venue — for a `vm:` parent, the guest `SSHExecutor` — and
            `RootExecutorForDeployNode` explicitly "does NOT handle the nested-inside-a-parent case"
            (`sdk/deploykit/deploy_chain.go`). So **the other two rows — a top-level `host:` retarget
            (`SSHExecutor`) and a nested child (`NestedExecutor`) — both bypass `ShellExecutor`**, nesting
            included. Relocating a `host: local` bed by either means deletes its `ShellExecutor` +
            `HostDeployTarget` coverage, which must then be replaced deliberately by another top-level
            `host: local` bed — never assumed to have moved with it.

            ## Sibling members — companion deployments brought up alongside

            A resource node placed directly **under a deploy** is a sibling **member** — a
            companion deployment brought up **ALONGSIDE** it on the shared `charly` network
            (*siblings*, not children). Contrast deploy-into nesting (a resource node placed
            **under another resource**), whose children run **inside** that node's venue and
            are addressed by a dotted path (`parent.child`). Membership is **tree position** —
            there is no `peer:` or `nested:` field. A member is a companion **instrument**: the
            canonical case is a Chrome DRIVER pod that CDP-probes a SEPARATE web-server
            SUBJECT, where the driving probe is a check step placed under the driver member and
            addresses the subject via `${HOST:<subject>}` (see `/charly-check:check`
            "Cross-deployment probing"). The SAME tree position + lifecycle serve a disposable
            check deploy and an operator deploy — one codebase.

            ```yaml
            webapp:                            # an operator deploy + a companion member
              pod:
                image: web
              chrome:                          # a SIBLING member, brought up on the shared charly net
                pod:
                  image: chrome-headless       # a full deploy (its own substrate/port/…)
                chrome-step-render:            # a driven probe — runs on chrome (tree position)
                  check: cdp renders the web subject over the shared net
                  cdp: text
                  url: http://${HOST:webapp}:8080   # address the subject member by HOST var
            ```

            - **Folded to addressable top-level entries.** At load time `foldMembers` reads each
              tree-position member into the internal `.Members` map and registers it as a top-level
              Fleet entry (so `charly config <member>` / `charly start <member>` resolve it
              through the exact path any deploy uses) carrying a derived `MemberOf: <owner>`. A
              member name must be **globally unique** (a collision with any deploy/bed/member is
              a hard load error) and carry **no `.`** (same rules as nested-member keys + bed
              names); the author keeps member **host ports disjoint** (the loader does not check
              ports — port absence, i.e. auto-allocation, avoids fixed-port collisions).
            - **One shared lifecycle (R3).** `BringUpMembers` / `TearDownMembers` (`sdk/deploykit/fleet_members.go`)
              bring members up after the owner and tear them down with it, by shelling out to the
              SAME verbs — a pod member via `charly config` + `charly start` (+ readiness wait), a
              non-pod member via `charly fleet add` / `charly fleet del`. Wired into `charly fleet add` /
              `charly fleet del` (operator path) AND the disposable-deploy bed runner (the bed's
              `--node-only` add never double-deploys; the runner brings members up after the root
              starts). A bed's `charly update` (destroy + rebuild) tears members down and back up too.
            - **Disposability is inherited, never invented.** `foldMembers` promotes a member to
              `disposable: true` only when its OWNER is disposable (so a disposable bed's
              rebuild is authorized to tear the member down); a member of a non-disposable operator
              deploy stays non-disposable. No new autonomy is granted — members are components of
              their owner, touched only by the owner's explicit add/del/update (R6,
              `/charly-internals:disposable`).
            - **Members are NOT check-live'd.** A disposable check deploy evaluates its SUBJECT
              (root + any nested members via `bedCheckLiveRefs`); sibling members are instruments,
              never evaluated themselves — the subject's checks placed under a member drive
              *through* it.
            - **Addressing the subject from a driven probe** uses the unified `${HOST:...}` variable —
              `${HOST:<member>}` (no `:<port>` → container DNS) or `${HOST:<member>:<port>}` (with
              `:<port>` → host-reachable endpoint) — see `/charly-check:check` "Cross-deployment
              probing".

            ## Cross-References

            **Deploy surface:**
            - `/charly-local:local-deploy` — Local-target execution model: the external `deploy:local` plugin, ledger, gates, ReverseOp kinds, sudo batching
            - `/charly-internals:install-plan` — The InstallPlan IR shared by the deploy targets: ALL FIVE substrates (local/vm/pod/kubernetes/android) are external out-of-process deploys via plugins over the executor reverse channel — local/vm consume the IR via `kit.WalkPlans` (vm's walk runs inside the guest); pod's plugin walks nothing — its candy `plugin-deploy-pod` lifecycle builds the overlay host-side: the core `overlay` host-builder runs the prep+resolve M-seam, the candy renders the overlay in its own code via `deploykit.OCITarget` + `deploykit.NewRenderGeneratorFromProject` (`add_candy:` synthesis, P11c); `charly box build` itself emits via the separate WriteCandySteps → EmitTasks generator in `sdk/deploykit` (relocated in #67), not the IR
            - `/charly-internals:local-infra` — Supporting Go files for local deploys: hostdistro, ledger, builder_run, shell_profile, reverse_ops, `sdk/deploykit/compile_service_steps.go` (service_render, relocated), `candy/plugin-fleet/deploy_ref.go` (deploy_ref, relocated)

            **Deploy-adjacent commands:**
            - `/charly-build:pull` — Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path
            - `/charly-automation:sidecar` — Sidecar containers, pod networking, Tailscale exit nodes, Environment Contract (provides filtering)
            - `/charly-core:service` — Service lifecycle (start/stop/update/remove)
            - `/charly-core:start` — Ergonomic alias for `charly fleet add <image> <image>` (container target)
            - `/charly-core:stop` — Ergonomic alias for `charly fleet del <name>`
            - `/charly-core:charly-update` — Per-instance update pattern; equivalent to `charly fleet add <name> --pull`
            - `/charly-core:charly-config` — Resource cap flags (`--memory-max/high/swap/cpus`), provides filtering, env_require enforcement, NO_PROXY auto-enrichment, `--sidecar`, `-i` instance support, MCP name disambiguation
            - `/charly-automation:enc` — Encrypted storage commands (charly config mount/unmount)
            - `/charly-check:vnc` — VNC password setup for desktop containers
            - `/charly-vm:vm` — Virtual machine deployment (charly vm)
            - `/charly-build:build` — Building images before deployment (+ the `--no-cache` intermediate scratch-stage caveat)
            - `/charly-build:charly-mcp-cmd` — verify the MCP endpoints declared by `provides.mcp:` entries are actually reachable (`charly check live <image> --filter mcp`); note the **port-publishing gotcha** when a `port:` override in charly.yml predates a newly-added mcp-providing layer
            - `/charly-image:image` — Image configuration, OCI label emission, `labels.go:238` tunnel read-skip
            - `/charly-image:layer` — Unified `service:` schema (use_packaged + structured custom), `env_provide`/`env_require`/`env_accept` field declarations, security resource caps
            - `/charly-check:check` — Local `check:` in charly.yml overlays image-baked deploy defaults: entries with matching `id:` replace, otherwise append. `id: X, skip: true` disables a baked check without a replacement.

            **Canonical layer worked examples:**
            - `/charly-selkies:chrome` — cgroup resource-caps consumer (caps bound a Chrome crash loop)
            - `/charly-infrastructure:supervisord` — Event listener pattern triggered by the caps; ServiceSchemaDef that renders `service:` entries to supervisord INI
            - `/charly-infrastructure:postgresql` — Canonical `use_packaged:` entry (packaged unit reuse)
            - `/charly-ollama:ollama`, `/charly-hermes:hermes` — Custom `service:` entries
            - `/charly-selkies:selkies-labwc` — Multi-instance proxy deployment, tunnel inheritance workaround

            ## Cross-kind name reuse + ResolveDeployRef precedence

            A deploy's name lives alongside every other top-level entity in its document. Cross-kind reuse of a name across SEPARATE discovered files is fine (a `candy/redis` + a `box/redis` resolve to distinct internal maps), but two top-level entities WITHIN one document MUST NOT share a name — they would collide on one YAML key (`charly box validate` flags it). The convention is to keep the user-facing deploy name and **suffix** the template it deploys: this repo's `charly-cachyos` deploy carries `local: {from: charly-cachyos-app}`, referencing the distinct `charly-cachyos-app` kind:local template. A deploy's substrate node (`pod:`, `vm:`, `local:`, `kubernetes:`, `android:`) is scoped to the matching kind, no fall-through.

            `ResolveDeployRef` (used by `charly fleet add <name> <ref>`) is box-first: when a name exists as BOTH a box and a candy, the box wins for the primary `<ref>` positional. The `--add-candy <ref>` path goes through `ResolveDeployRefAsCandy`, which is candy-first. A same-name box and candy (in separate files) is permitted.

            The loader raises a hard load-time error on obsolete deploy names (the retired `qc` / `cachyos-dx` keys) and on any obsolete root shape (a `kind: deployment` / `deployment:` / `kind: deploy` / `deploy:` / `fleet:` document — the kind is now the name-first substrate-node (`pod:`/`vm:`/`kubernetes:`/`local:`/`android:`/`group:`) discriminator); every such error points at `charly migrate`. See `/charly-build:migrate`.

            ## When to Use This Skill

            **MUST be invoked** when the task involves quadlet generation, tunnels, bind mounts, or deploy overlays. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** After `/charly-build:build`, before `/charly-core:service`.
            Previous step: `/charly-build:build` (build the image). Next step: `/charly-core:service` (start, status, logs).

            Live-deploy verification: see /charly-check:check (the 11 Testing Standards) and /charly-internals:disposable.

logs-skill:
    skill:
        name: logs
        family: core
        owner: charly-core
        description: |-
            Service log viewing for running containers.
            MUST be invoked before any work involving: charly logs command, viewing container output, or debugging service issues.
        content: |
            # charly logs -- Service Log Viewing

            ## Overview

            Displays logs from a running or recently stopped service container. In quadlet mode, reads from journalctl. In direct mode, reads from the container engine's log store.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | View logs | `charly logs <image>` | Show recent logs |
            | Follow logs | `charly logs <image> -f` | Stream logs in real time |
            | Tail N lines | `charly logs <image> -n 50` | Show last N lines |
            | With instance | `charly logs <image> -i 2` | Logs from specific instance |

            ## Usage

            ```bash
            # View recent logs
            charly logs jupyter

            # Follow logs in real time (Ctrl+C to stop)
            charly logs ollama -f

            # Show last 100 lines
            charly logs immich -n 100

            # Logs from a specific instance
            charly logs openclaw -i 2

            # Combine follow with tail
            charly logs comfyui -f -n 50
            ```

            ## Flags

            | Flag | Description |
            |------|-------------|
            | `-f, --follow` | Stream logs continuously |
            | `-n, --lines LINES` | Number of recent lines to show |
            | `-i, --instance INSTANCE` | Target a specific container instance |
            | `--sidecar NAME` | Show the named SIDECAR container's logs instead of the app container's |

            ## Behavior

            - **Quadlet mode:** Uses `journalctl --user -u charly-<image>.service`
            - **Direct mode:** Uses `<engine> logs <container>`
            - Quadlet mode is the default and recommended deployment method
            - Logs include both stdout and stderr from the container

            ## Cross-References

            - `/charly-build:pull` -- Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path

            - `/charly-core:charly-status` -- Check service status
            - `/charly-core:service` -- Service lifecycle management
            - `/charly-core:start` -- Starting services

remove-skill:
    skill:
        name: remove
        family: core
        owner: charly-core
        description: |-
            Remove service container, quadlet file, and charly.yml entry.
            MUST be invoked before any work involving: charly remove command, cleaning up containers, removing quadlets, or purging volumes.
        content: |
            # charly remove -- Remove Service Container

            ## Overview

            Removes a service container along with its quadlet file and charly.yml entry. `--purge` additionally purges the deploy's named volumes, its encrypted (gocryptfs) volumes, AND the synthesized `<name>-overlay` images an `add_candy:` overlay build produced (`charly/commands.go` `purgeDeployArtifacts`). Runs lifecycle hooks before removal.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Remove container | `charly remove <image>` | Remove container, quadlet, and deploy entry |
            | Purge volumes | `charly remove <image> --purge` | Also remove named + encrypted volumes AND the `<name>-overlay` images |
            | Keep deploy entry | `charly remove <image> --keep-deploy` | Keep charly.yml entry for re-configuration |
            | With env vars | `charly remove <image> -e KEY=VALUE` | Pass env vars to pre_remove hooks |

            ## Usage

            ```bash
            # Remove a service (container + quadlet + charly.yml entry)
            charly remove jupyter

            # Remove and purge all named volumes
            charly remove ollama --purge

            # Remove but keep charly.yml entry for later re-configuration
            charly remove immich --keep-deploy

            # Pass environment variables to pre_remove hooks
            charly remove openclaw -e CLEANUP_MODE=full
            ```

            ## Flags

            | Flag | Description |
            |------|-------------|
            | `--purge` | Also remove the deploy's named + encrypted volumes AND the synthesized `<name>-overlay` images (an `add_candy:` overlay build's artifacts) — so a pod check bed's `charly remove --purge` teardown no longer leaks its overlay image |
            | `--keep-deploy` | Preserve the charly.yml entry (useful for re-running `charly config`) |
            | `-e, --env KEY=VALUE` | Pass environment variables to pre_remove lifecycle hooks |

            ## Behavior

            1. Runs `pre_remove` lifecycle hooks (if defined in image labels)
            2. Stops the container if still running
            3. Removes the quadlet file (quadlet mode) or container (direct mode)
            4. Removes the charly.yml entry (unless `--keep-deploy`)
            5. With `--purge`: removes named volumes (`charly-<image>-<name>`)

            ## Lifecycle Hooks

            Images can define `pre_remove` hooks that run before the container is removed. These are useful for graceful shutdown, data export, or cleanup tasks. Use `-e` to pass context to hooks.

            ## Instance Removal

            Remove specific instances with `-i`:

            ```bash
            charly remove selkies-desktop -i 192.241.92.221          # Remove instance
            charly remove selkies-desktop -i 192.241.92.221 --purge  # Also purge volumes
            ```

            Instance removal automatically cleans the instance's `env_provide` and `mcp_provide` from `charly.yml` provides section. Other instances of the same base image are unaffected.

            ## Cross-References

            - `/charly-build:pull` -- Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path

            - `/charly-core:stop` -- Stop without removing
            - `/charly-core:charly-config` -- Configure/reconfigure services (see "Full instance removal" for the teardown semantics)
            - `/charly-core:deploy` -- Deploy.yml management, tunnel configuration
            - `/charly-core:service` -- Full service lifecycle
            - `/charly-build:charly-mcp-cmd` -- after `charly config remove` cleans this instance's `mcp_provide` from the global `provides.mcp:` list, consumers' `CHARLY_MCP_SERVERS` no longer lists it; use `charly check live <consumer> --filter mcp` to confirm the cleanup propagated

service-skill:
    skill:
        name: service
        family: core
        owner: charly-core
        description: |-
            MUST be invoked before any work involving: charly start/stop/status/logs/update/remove commands, charly config (deployment), init system service management, or container lifecycle.
        content: |
            # Service - Service Management

            ## Terminology note

            **"pod"** is the user-visible term for a single-container deployment (matches podman's vocabulary and the `target: pod` deploy-yml value). Internally, the pod overlay render is owned by the candy `candy/plugin-deploy-pod/overlay.go` (P11c — the former in-core pod overlay target + `charly/deploy_target_pod.go` were DELETED; the candy renders via `deploykit.OCITarget` + `deploykit.NewRenderGeneratorFromProject`, IMPORT-PURE). This skill's body uses the word "container" in many places because it's also the generic runtime artifact — read "container" as the runtime concept and "pod" as the target/deployment kind.

            `charly start/stop/status/logs/shell` operate on named pod deployments (the unit a user cares about); the underlying runtime is podman/docker (containers), managed via systemd user quadlet.

            ## Overview

            Container service lifecycle management with two modes: **quadlet** (systemd user services via podman quadlet, always preferred) and **direct** (`<engine> run -d` / `<engine> stop`, fallback only for platforms without quadlet support). Also manages individual init system services inside running containers (supervisord, systemd, etc. -- configured via the embedded `init:` vocabulary).

            ## Quick Reference

            ### Container Lifecycle

            | Action | Command | Description |
            |--------|---------|-------------|
            | Start service | `charly start <image>` | Start as background service |
            | Stop service | `charly stop <image>` | Stop running service |
            | Configure deployment | `charly config <image>` | Generate .container file, daemon-reload |
            | Remove deployment | `charly config remove <image>` | Disable quadlet service (quadlet file remains) |
            | Service status | `charly status [<image>]` | Structured status table (IMAGE, STATUS, PORTS, TUNNEL, DEVICES, TOOLS); IMAGE merges `image[/instance]` |
            | All services | `charly status --all` | Include stopped/enabled services in listing |
            | Detailed status | `charly status <image>` | Detailed key-value view with live tool probes |
            | JSON output | `charly status --json` | Machine-readable JSON output |
            | Service logs | `charly logs <image> -f` | Follow service logs |
            | Update service | `charly update <image>` | Update image and restart |
            | Remove service | `charly remove <image>` | Stop, remove service + charly.yml entry |
            | Purge (+ volumes) | `charly remove <image> --purge` | Also delete named volumes |
            | Remove keep config | `charly remove <image> --keep-deploy` | Remove service but keep charly.yml entry |

            ### Supervisord Services

            | Action | Command | Description |
            |--------|---------|-------------|
            | Service status | `charly service status <image>` | Show all service status |
            | Start service | `charly service start <image> <svc>` | Start a specific service |
            | Stop service | `charly service stop <image> <svc>` | Stop a specific service |
            | Restart service | `charly service restart <image> <svc>` | Restart a specific service |

            All commands accept `-i INSTANCE` for multi-instance support.

            ## Run Modes

            | Mode | Config | How it works |
            |------|--------|-------------|
            | `quadlet` | `run_mode: quadlet` | systemd user services via podman quadlet (always preferred) |
            | `direct` | `run_mode: direct` | `<engine> run -d` / `<engine> stop` (fallback only) |

            ```bash
            charly settings set run_mode quadlet  # Recommended -- systemd integration
            charly settings set run_mode direct   # Fallback for platforms without quadlet
            ```

            ## Quadlet Mode

            User-level systemd services via podman quadlet. No root required.

            ### Setup

            ```bash
            charly settings set run_mode quadlet
            charly settings set engine.run podman    # Required
            loginctl enable-linger $USER         # Required for user services
            ```

            ### Workflow

            ```bash
            charly config my-app --bind workspace=~/project              # Generate .container file
            charly config my-app -i prod --bind workspace=~/prod -e ENV=production   # Named instance
            charly start my-app                    # systemctl --user start (config required first)
            charly status my-app                   # systemctl --user status
            charly logs my-app -f                  # journalctl --user -u (follow)
            charly update my-app                   # Re-transfer image, restart
            charly stop my-app                     # systemctl --user stop
            charly config remove my-app            # Disable quadlet service (quadlet file remains)
            charly remove my-app                   # Stop + remove .container + charly.yml entry
            charly remove my-app --purge           # Also remove named volumes
            charly remove my-app --keep-deploy     # Remove service but keep charly.yml for re-config
            charly remove my-app -e KEY=VALUE      # Set env vars for lifecycle hooks
            ```

            `charly config` must be run before `charly start` in quadlet mode. If the quadlet file doesn't exist, `charly start` fails with: "not configured; run 'charly config <image>' first".

            ### Generated Files

            - Path: `~/.config/containers/systemd/charly-<image>.container` (or `charly-<image>-<instance>.container`)
            - Service name: `charly-<image>.service`
            - Container name: `charly-<image>`
            - Ports bound to configured `bind_address`
            - Entrypoint: determined by the embedded `init:` vocabulary (e.g., `supervisord -n -c /etc/supervisord.conf` for supervisord, `sleep infinity` if no init system)
            - Auto-restart on failure via `WantedBy=default.target` (encrypted services with a keyring-class secret backend also carry `ExecStartPre=charly config mount` + `TimeoutStartSec=0`, so they start at boot and wait for the keyring to unlock; with `secret_backend: config` there is no `WantedBy` — they require `charly start`)
            - The required dependency layer is INJECTED, not policed: a box composing a `service:` candy has the active init's `depends_candy` (from the embedded `init:` vocabulary) added to its composition automatically, so a box never has to list `supervisord` by hand and can no longer be missing it.
            - `Secret=charly-<image>-<name>,target=/run/secrets/<name>` for each layer-declared secret (Podman only)

            ### Container Secrets

            When image labels declare secrets (from `charly.yml` `secrets` field), `charly config` provisions them:
            1. Checks if Podman secret already exists — **if so, keeps it** (never overwrites)
            2. If missing: resolves secret values from the credential store (env var > keyring > config file)
            3. Creates Podman secrets via `podman secret create charly-<image>-<name>`
            4. Generates `Secret=` directives in the quadlet file
            5. Secrets are mounted at `/run/secrets/<name>` inside the container

            **Provisioning is idempotent** — existing secrets are never overwritten. This prevents breaking stateful services (e.g., PostgreSQL) that store their own copy of the password. To force re-provisioning: `charly config <image> --refresh-secret <name>` (repeatable; `--refresh-secret all` rotates every secret of the image, sidecars included). A candy-owned auto-generated secret gets a NEW value — re-initialize services that stored the old one.

            For Docker, secrets fall back to `Environment=` injection with a security warning.

            ### Environment Variables in Quadlet

            - **`Environment=`** lines for CLI `-e` flags (inline in .container file)
            - **`EnvironmentFile=`** directive for file-sourced vars (`--env-file`, workspace `.env`, or `env_file` in charly.yml)

            When `EnvironmentFile=` is used, only explicit CLI `-e` vars appear as inline `Environment=` to avoid duplication.

            ### Security in Quadlet

            Layer and image-level security settings become `PodmanArgs=` in the quadlet file:

            - `privileged: true` -> `PodmanArgs=--privileged`
            - `cap_add` -> `PodmanArgs=--cap-add=<CAP>`
            - `devices` -> `PodmanArgs=--device=<DEV>`
            - `security_opt` -> `PodmanArgs=--security-opt=<OPT>`

            Source: `sdk/deploykit/security.go`, `sdk/deploykit/quadlet.go`.

            ### Image Transfer

            When `engine.build=docker`, `charly config` auto-detects if the image is missing from podman and transfers via `docker save | podman load`. `charly update` re-transfers if needed.

            ## Direct Mode (Fallback)

            Only use direct mode on platforms that don't support quadlet (e.g., macOS Docker Desktop).

            ```bash
            charly start my-app                  # docker/podman run -d
            charly start my-app --bind workspace=~/project  # With volume binding
            charly start my-app -e LOG=debug     # With env vars
            charly status my-app                 # docker/podman inspect
            charly logs my-app -f                # docker/podman logs -f
            charly stop my-app                   # docker/podman stop
            charly update my-app --build         # Rebuild, stop old, start new
            charly remove my-app                 # Stop + remove container
            charly remove my-app --purge         # Also remove named volumes
            ```

            ## Init System Service Management

            Manage individual services inside a running container (uses the init system configured via the embedded `init:` vocabulary — supervisord, systemd, etc.):

            ```bash
            charly service status my-app               # Show status of all services
            charly service start my-app traefik        # Start a specific service
            charly service stop my-app traefik         # Stop a specific service
            charly service restart my-app traefik      # Restart a specific service
            charly service status my-app -i prod       # Named instance
            ```

            The service name must match an entry in the image's init system config. Available services are validated against the image's `ai.opencharly.service.<init>` label (e.g., `ai.opencharly.service.supervisord`). The management tool and commands are resolved from the embedded `init:` vocabulary at build time and **baked into the `ai.opencharly.init_def` label**; `charly service …` reads that label (so any vocabulary-declared init system — including custom ones — works at runtime, not just at build), falling back to the built-in `supervisord`/`systemd` registry only for images built before the label existed.

            Source: `candy/plugin-pod/command.go` + `candy/plugin-pod/service_resolve.go` (the `charly service` command — the former `charly/service.go` is DELETED, K-wave 2).

            ## Lifecycle Hooks

            Layers can declare hooks that run on the host at specific points:

            ```yaml
            # In charly.yml:
            hook:
              post_enable: |
                echo "Service enabled for $CHARLY_IMAGE"
              pre_remove: |
                echo "Cleaning up before removal"
            ```

            | Hook | When it runs |
            |------|-------------|
            | `post_enable` | After `charly config` generates the quadlet and reloads systemd |
            | `pre_remove` | Before `charly remove` stops and removes the service |

            Hooks from multiple layers are concatenated in layer order. Scripts run on the host (not inside the container). Use `charly remove -e KEY=VALUE` to pass environment variables to hook scripts.

            Source: `sdk/deploykit/hooks_collect.go` (`CollectHooks` — the former `charly/hooks.go` is DELETED, K-wave 2).

            ## Multi-Instance Support

            The `-i NAME` flag enables running multiple containers of the same image with separate state:

            ```bash
            charly config my-app -i prod --bind workspace=~/prod
            charly config my-app -i staging --bind workspace=~/staging
            charly start my-app -i prod
            charly status my-app -i staging
            ```

            Instance naming affects:
            - Container name: `charly-<image>` -> `charly-<image>-<instance>`
            - Volume names: `charly-<image>-<name>` -> `charly-<image>-<instance>-<name>`
            - Quadlet file: `charly-<image>.container` -> `charly-<image>-<instance>.container`
            - Service name: `charly-<image>.service` -> `charly-<image>-<instance>.service`

            Source: `sdk/deploykit/deploy_volume.go` (`VolumeMount`, `ResolveVolumeBacking`), `sdk/deploykit/quadlet.go` (the former `charly/volumes.go` is DELETED, K-wave 2).

            ## Data Provisioning

            Data from data candies is automatically provisioned into bind-backed volumes during `charly config` and synced during `charly update`. See `/charly-core:charly-config` for `--seed`/`--force-seed`/`--data-from` flags. Source: `sdk/deploykit/data.go` (the former `charly/data.go` is DELETED, K-wave 2).

            ## Troubleshooting

            ### Port Already in Use

            If `charly start` fails with `bind: address already in use`, another container or host process is using the port. Find the conflict:

            ```bash
            ss -tlnp | grep <port>           # Find what's listening (host-level, not a charly resource)
            charly status --json | jq -r '.[] | select(.ports[]?.host_port == <port>) | .image'   # Find the charly container
            ```

            Stop the conflicting container before starting. Common conflicts: standalone `ollama` container on 11434, existing VNC on 5900.

            ### Service Crash-Looping

            If `charly service status` shows a service cycling STARTING/STOPPED, run it manually to see the error:

            ```bash
            charly service stop <image> <service>
            charly shell <image> -c "<service-command>"
            ```

            ## Status Output

            `charly status` shows a structured table of all charly containers. The table
            has a TUNNEL column and the IMAGE column merges `image[/instance]`:

            ```
            IMAGE                              STATUS   PORTS                 TUNNEL                  DEVICES  TOOLS
            sway-browser-vnc                   running  5900,9222,9224        -                       dri,gpu  cdp:9222,dbus,charly,supervisord,sway,vnc:5900,wl
            selkies-desktop/work               running  3001,9240             tailscale (all ports)   -        cdp:9240,dbus,charly,supervisord,wl
            selkies-desktop/personal           running  3002,9241             tailscale (all ports)   -        cdp:9241,dbus,charly,supervisord,wl
            ollama                             running  11434                 -                       gpu      dbus,charly,supervisord
            jupyter                            stopped  8888                  tailscale (all ports)   -        -
            ```

            - **IMAGE**: `image` for base deploys, `image/instance` for multi-
              instance — matches the `deployKey` shape used in `charly.yml` keys and
              `-i <inst>` flags.
            - **PORTS**: Sorted, deduped host port numbers. **Source priority**:
              runtime `podman ps` mappings → `charly.yml` `port:` → image OCI label
              `ai.opencharly.port`. The runtime path uses the structured
              `[]PortMapping` carried on `ContainerSnapshot`; deploy/label paths go
              through canonical `ParsePortMapping` so the IPv4-prefixed
              `127.0.0.1:H:C/proto` form parses correctly.
            - **TUNNEL**: `provider (all ports)` / `provider (ports H,H,H)` /
              `provider` / `-`. Read from `charly.yml` only — tunnel config is
              deploy-yml-only (see `labels.go:238`).
            - **DEVICES**: Compact tokens (`gpu`, `dri`, `kvm`, `fuse`, `tun`),
              sorted alphabetically.
            - **TOOLS**: Live-probed tools with actual host ports, sorted
              alphabetically. Port-based tools show `name:port`; socket-based show
              just the name; non-running containers show `-`.

            ### Tool Probes

            `charly status` runs the probe set per running container with two distinct
            shapes:

            - **Host probes** (cdp, vnc) run from the operator's machine using the
              port mappings already on `ContainerSnapshot` — no `podman port` /
              `podman inspect` per probe.
            - **Guest probes** (supervisord, dbus, charly, wl, sway) batch into a
              **single `podman exec sh -c '<concat>'`** invocation per container.
              Each probe contributes a `Snippet()` that prints `KEY=value` lines; the
              batcher delimits sections with `===PROBE:<name>===` markers and
              dispatches each section to its probe's `Parse`.

            | Tool | Kind | Snippet / Probe | What it checks |
            |------|------|-----------------|---------------|
            | supervisord | guest | `command -v supervisorctl && supervisorctl status` | Process manager health, service count (`N/M running`) |
            | cdp | host | HTTP GET `<host_port_for_9222>/json` | Chrome DevTools Protocol (no `podman port` shell-out) |
            | vnc | host | TCP + RFB banner read on `<host_port_for_5900>` | VNC server (wayvnc) |
            | sway | guest | discover SWAYSOCK then `swaymsg -t get_outputs` | Sway compositor (output dimensions in detail) |
            | wl | guest | `command -v wtype/wlrctl/grim/pixelflux-screenshot` | Wayland tools (one snippet, four checks) |
            | dbus | guest | `pgrep -x dbus-daemon` + scan for swaync/mako/dunst | D-Bus session bus + notifier (one snippet, four checks) |
            | charly | guest | `command -v charly && charly version` | In-container charly binary + CalVer version |

            The `wl:` verb has its own `status` method (a `wl: status` step); the
            `vnc` and `cdp` status are the declarative `vnc: status` / `cdp: status` verbs
            (served out-of-process by candy/plugin-vnc / candy/plugin-cdp).
            These all use the same probe types via `runGuestProbes` / `cdpProbe.ProbeHost` /
            `vncProbe.ProbeHost`.

            **Note:** `supervisorctl status` exits with code 3 when any service
            isn't RUNNING (e.g. FATAL, STOPPED). The probe's `Snippet` ends with
            `|| true` so the outer shell never sees the non-zero exit; `Parse`
            classifies output regardless of exit code.

            ### Single Image Detail

            `charly status <image> -i <inst>` shows a detailed key-value view:

            ```
            Image:     selkies-desktop
            Instance:  work
            Status:    running (Up 3 days)
            Container: charly-selkies-desktop-work
            Mode:      quadlet
            Ports:     3001:3000/tcp, 9240:9222/tcp
            Devices:   nvidia.com/gpu=all, /dev/dri/renderD128
            Tools:     cdp:9240 (ok), dbus (ok), charly (ok), supervisord (ok), wl (ok)
            Volumes:   charly-selkies-desktop-work-data -> /home/abc/data
            Network:   charly
            Tunnel:    tailscale (all ports)
            ```

            ### JSON Output

            `charly status --json` emits an array; `charly status <image> --json` emits a
            single object. `ports` is a structured array (not `[]string`):

            ```json
            {
              "ports": [
                { "host_ip": "127.0.0.1", "host_port": 9240, "container_port": 9222, "protocol": "tcp" }
              ],
              "tunnel": "tailscale (all ports)"
            }
            ```

            ### Reaping Orphans

            Use the top-level `charly reap-orphans` command. It walks charly.yml
            ephemeral entries marked `active`, probes the underlying engine
            (libvirt for VM, podman for pod, kubectl for kubernetes) and runs `charly fleet
            del <name> --assume-yes` for orphans (NOT `--force` — that flag does not
            exist on `fleet del`; `deployDelArgv` is the single source of the correct
            flag, guarded by a regression test).

            Source: `candy/plugin-substrate/status_flat.go` (the collection engine — substrate fan-out + deploy enrichment; K6 relocated the LAST core-side status logic, incl. the deploy-cone enrichment, out of `charly/status_collector.go`, which is now deleted — core keeps only a thin generic HostBuild forward), `candy/plugin-substrate/command_reap_orphans.go` (orphan reaping, K5, relocated from charly/status_reap.go — its vm-liveness probe reaches verb:libvirt over `Executor.InvokeProvider`, F10). The status CLI + render live in `candy/plugin-status`; the live tool probes in `candy/plugin-substrate/status_probes.go` (P14a).

            ## Cross-References

            - `/charly-build:pull` -- Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path

            - `/charly-core:shell` -- Interactive shells and exec into running containers
            - `/charly-core:deploy` -- Quadlet generation details, tunnels, volume backing
            - `/charly-automation:enc` -- Encrypted storage (mounted inline by charly start)
            - `/charly-core:charly-config` -- `run_mode`, `auto_enable`, `engine.run` settings
            - `/charly-check:cdp` -- the `cdp:` check verb (`cdp: status`, served out-of-process by candy/plugin-cdp)
            - `/charly-check:vnc` -- the `vnc:` check verb (`vnc: status`, served out-of-process by candy/plugin-vnc)
            - `/charly-check:wl` -- Desktop automation + the `wl:` verb's sway-* methods (e.g. a `wl: sway-tree` step)
            - `/charly-check:wl` -- the `wl: status` method (tool availability check)

            ## When to Use This Skill

            **MUST be invoked** when the task involves starting, stopping, configuring, or managing container services, init system service management, or container lifecycle. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** After `/charly-build:build` and `/charly-core:deploy`. This skill covers the runtime lifecycle.
            Previous step: `/charly-core:deploy` (quadlet generation, tunnels). Next step: per-pod plugin (`/charly-jupyter:<name>`, `/charly-coder:<name>`, etc.) or `/charly-distros:<name> / /charly-languages:<name> / /charly-infrastructure:<name> / /charly-tools:<name>` for verification.

shell-skill:
    skill:
        name: shell
        family: core
        owner: charly-core
        description: |-
            MUST be invoked before any work involving: charly shell command, interactive shells, command execution in containers, workspace mounts, TTY allocation, or port relay.
        content: |
            # Shell - Shell & Execution

            ## Overview

            `charly shell` runs an interactive shell or executes commands inside containers. Supports workspace mounting, device auto-detection, environment injection, and TTY allocation for automation tools.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Interactive shell | `charly shell <image>` | Bash shell in container |
            | Bind workspace | `charly shell <image> --bind workspace=~/project` | Mount host dir as workspace volume |
            | Volume config | `charly shell <image> -v name:type[:path]` | Configure volume backing (volume\|bind\|encrypted) |
            | Run command | `charly shell <image> -c "cmd"` | Execute command and exit |
            | Force TTY | `charly shell <image> --tty -c "cmd"` | PTY allocation for automation |
            | Specific version | `charly shell <image> --tag v1.0.0` | Use specific image tag |
            | No devices | `charly shell <image> --no-auto-detect` | Disable device auto-detection |
            | Set env var | `charly shell <image> -e KEY=VALUE` | Inject environment variable |
            | Load env file | `charly shell <image> --env-file .env` | Load env from file |
            | Named instance | `charly shell <image> -i runner-1` | Use named instance |
            | Force build | `charly shell <image> --build` | Build locally before running |

            **Note:** `charly shell` does not accept remote refs (`@github.com/...`). Remote
            refs are handled exclusively by `charly box pull` (build-mode). Pull first,
            then `charly shell <image-name>` works via labels. See `/charly-build:pull`.

            ## How It Works

            1. Resolves image from OCI labels via `ExtractMetadata` (never `charly.yml`)
            2. Applies `charly.yml` overlay (volumes, env, sidecars, tunnel)
            3. Ensures image exists in run engine (transfers from build engine if needed)
            4. Resolves volumes (with deploy-time backing), ports, security, environment
            5. If container is already running: `<engine> exec` into it
            6. If not running: `<engine> run` with full configuration

            If the image isn't in local storage, `ExtractMetadata`/`EnsureImage` return
            `ErrImageNotLocal` and the CLI surfaces:
            ```
            Error: image "X" is not available locally.
                   Run 'charly box pull X' to fetch it first
            ```
            See `/charly-build:pull` for the full sentinel pattern.

            ## Volume Binding

            ```bash
            charly shell <image> --bind workspace=~/project  # Bind ~/project as workspace volume
            charly shell <image> --bind workspace=.          # Bind PWD as workspace volume
            charly shell <image>                             # No host mount (named volume)
            ```

            The `--bind` flag overrides volume backing for the session. For finer control, use `-v name:type[:path]` where type is `volume`, `bind`, or `encrypted`. The container working directory is `~/workspace` (resolved from the `workspace` volume). If a `.env` file exists in the bound directory, it is auto-loaded.

            ## --tty Flag

            Forces TTY allocation even when stdout is not a terminal. Uses `script(1)` from util-linux to provide a real PTY.

            ```bash
            # Without --tty: "not a tty" errors from interactive commands
            charly shell my-app -c "interactive-cli auth login"       # fails in CI/automation

            # With --tty: script(1) wraps the command in a PTY
            charly shell my-app --tty -c "interactive-cli auth login"  # works everywhere
            ```

            Essential for automation tools (Claude Code, CI runners) where stdout is a pipe, not a terminal. Many interactive CLI commands (OAuth flows, prompts) require a TTY.

            Works for both new containers (`<engine> run`) and exec into running containers (`<engine> exec`).

            ## Exec Into Running Containers

            When `charly shell` detects the container is already running (via `<engine> inspect`), it uses `<engine> exec` instead of `<engine> run`. The same flags work:

            ```bash
            charly start my-app                            # Start background service
            charly shell my-app -c "cat /etc/hostname"     # Exec into running container
            charly shell my-app                            # Interactive shell in running container
            ```

            ## Port Relay

            The `port_relay` field in charly.yml solves the problem of services that bind only to 127.0.0.1 inside the container (e.g., Chrome 146+ DevTools). Container port mappings only forward to interfaces visible from outside, so a loopback-only service is unreachable from the host.

            ```yaml
            # In charly.yml:
            port_relay:
              - 9222
            ```

            How it works:
            - socat binds to `eth0:<port>` and forwards to `127.0.0.1:<port>`
            - An init system service is auto-generated (via the embedded `init:` vocabulary's `<name>.relay_template`) with priority 1 (starts before other services)
            - The socat candy is automatically added as a dependency

            This makes loopback-only services accessible through normal podman/docker port mappings and `tailscale serve`.

            Source: `sdk/deploykit/routes.go` (`GenerateTraefikRoutes` / `EmitTraefikRouteStage`, relocated from `charly/generate.go` in #67), `sdk/deploykit/init.go` (`InitRenderRelayTemplate`, the relay-template renderer).

            ## Device Auto-Detection

            By default, `charly shell` auto-detects available host devices and passes them through. Use `--no-auto-detect` to disable.

            **Auto-detected devices:**
            - NVIDIA GPU (via `nvidia-smi`) -- `--gpus all` (Docker) or `--device nvidia.com/gpu=all` (Podman)
            - AMD GPU (via sysfs `amdgpu` driver) -- `--device /dev/kfd` + `--group-add keep-groups` + auto-detected `HSA_OVERRIDE_GFX_VERSION` from KFD topology
            - `/dev/dri/renderD*` -- GPU render nodes
            - `/dev/kfd` -- AMD Kernel Fusion Driver (ROCm compute)
            - `/dev/kvm` -- KVM virtualization
            - `/dev/vhost-net`, `/dev/vhost-vsock` -- virtio networking
            - `/dev/fuse` -- FUSE filesystem
            - `/dev/net/tun` -- TUN/TAP networking
            - `/dev/hwrng` -- hardware RNG

            When an AMD GPU is detected, `keep-groups` is auto-added to preserve host supplementary groups (video, render) inside the container, and `HSA_OVERRIDE_GFX_VERSION` is auto-set from the GPU's KFD topology (e.g., `10.3.0` for RDNA2). Additionally, the first detected `/dev/dri/renderD*` device is auto-injected as `DRINODE` and `DRI_NODE` env vars (used by selkies for VAAPI encoding). All auto-detected env vars can be overridden via `-e`.

            **Shared code path:** `charly shell` calls `appendAutoDetectedEnv()` in `candy/plugin-deploy-pod/config_setup_helpers.go` — the same function used by `charly config` and `charly start`. All three commands reach it through their own resolver file in that candy (`resolve_f12.go` for `shell`/`cmd`/`logs`, `config_setup.go` for `config`, `resolve.go` for `start`/`stop`), so they still produce an identical env set on every run. The DRINODE/HSA_OVERRIDE_GFX_VERSION/keep-groups injection logic moved wholesale from charly-core to `candy/plugin-deploy-pod` in the 2026-07-22 dead-code-radical-removal batch — the charly-core copies (`appendAutoDetectedEnv`/`appendGroupsForAMDGPU` in `charly/devices.go`) were deleted as unreached residue once the plugin took over the real call sites. See `/charly-core:charly-doctor` (Hardware Detection) for the probe side, `/charly-distros:nvidia` (DRINODE Auto-Injection) for the NVIDIA consumer, and `/charly-distros:rocm` (Runtime Environment) for the AMD consumer.

            Source: `candy/plugin-deploy-pod/config_setup_helpers.go` (`appendAutoDetectedEnv`, `appendGroupsForAMDGPU`) + `candy/plugin-deploy-pod/detect_devices.go` (`detectDevices`/`logDetectedDevices` — the relocated `LogDetectedDevices` + the `DetectHostDevices`/`EnsureCDI` shims, now peer `InvokeProvider(verb:gpu)` dispatches; `charly/devices.go` and the gpu_shim detection legs are DELETED, K-wave 2 cone R3).

            ## Environment Variables

            Runtime environment variables are injected from multiple sources. Resolution priority (last wins for duplicate keys):

            1. **Deploy config `env:`** (charly.yml / charly.yml) -- lowest priority
            2. **Deploy config `env_file:`** (charly.yml / charly.yml)
            3. **Workspace `.env`** file -- auto-loaded from `-w` directory
            4. **CLI `--env-file`** flag
            5. **CLI `-e`** flags -- highest priority

            ```bash
            charly shell <image> -e DB_HOST=localhost -e DB_PORT=5432
            charly shell <image> --env-file production.env
            ```

            Kong `sep:"none"` on `-e` means commas in values are safe (e.g., `NO_PROXY=localhost,127.0.0.1`).

            `.env` file format (Docker-compatible): `KEY=VALUE`, `KEY="VALUE"`, `KEY='VALUE'`, `KEY` (inherits from host), `#` comments, blank lines ignored.

            Source: `spec/hostenv/envfile.go` (`ParseEnvFile`, `ResolveEnvVars`, `LoadWorkspaceEnv`).

            ## Remote Image References

            `charly shell` **does not** accept `@github.com/...` remote refs. Pre-refactor
            versions did; post-refactor, deploy-mode commands read only from local OCI
            labels, so remote refs are rejected with a redirect:

            ```
            Error: remote refs are not accepted here;
                   run 'charly box pull @github.com/org/repo/my-app' first,
                   then 'charly shell my-app'
            ```

            To run a shell on a remote image, pull it first (via `charly box pull`) and
            then invoke `charly shell <short-name>`. See `/charly-build:pull` for the full remote-ref
            workflow.

            ## Cross-Engine Image Transfer

            When `engine.build` differs from `engine.run`, images are automatically transferred between engines on demand via `<src> save | <dst> load`.

            Source: `dispatchBuildEnsure` (`charly/dispatch_build_ensure.go`) dispatches to candy/plugin-build's `build:ensure` word (`candy/plugin-build/ensure.go`), which calls `kit.TransferImage` (`sdk/kit/transfer.go`, re-exporting `spec/container/transfer.go`). `charly/transfer.go`, this doc's former source citation, no longer exists.

            ## Container Networking

            All containers are connected to a shared `charly` network by default, enabling inter-container DNS resolution by container name. Override with `network: host` in charly.yml.

            Source: `sdk/deploykit/quadlet_pod.go` / `sdk/deploykit/quadlet.go` (the shared-`charly`-network quadlet emission — the former `charly/network.go` is DELETED, K-wave 2).

            ## `charly cmd` vs `charly shell -c`

            `charly cmd <image> "command"` is a dedicated single-command tool for **running containers only**. Key differences from `charly shell -c`:

            | | `charly cmd` | `charly shell -c` |
            |---|---------|--------------|
            | Container state | Running only | Running or starts new |
            | Notification | Yes (`--[no-]notify`) | No |
            | Process model | `exec.Command` (returns) | `syscall.Exec` (replaces) |
            | Workspace mount | No | Yes (`-w`) |
            | Device auto-detect | No | Yes |
            | Use case | Quick commands + notification | Full container setup + command |

            Use `charly cmd` for quick operations on running services. Use `charly shell -c` when you need workspace mounts, device passthrough, or need to start a new container.

            ## Cross-References

            ### Prerequisite

            - `/charly-build:pull` -- **Required** before `charly shell` can work on a fresh host. Fetches the image into local storage so `ExtractMetadata` can read its OCI labels. Handles remote refs (`@github.com/...`) that `charly shell` itself rejects.

            ### Deploy-mode neighbors

            - `/charly-core:cmd` -- Single command execution with D-Bus notification (running containers only)
            - `/charly-automation:tmux` -- Typed persistent terminal sessions (survive disconnects and support TTY-dependent TUI programs)
            - `/charly-core:service` -- Starting background services before exec
            - `/charly-core:start` -- Same `appendAutoDetectedEnv()` injection at service-start time
            - `/charly-core:charly-config` -- Deployment setup + same `appendAutoDetectedEnv()` at deploy time; `--no-auto-detect` flag disables it
            - `/charly-core:deploy` -- `charly.yml` overlay applied to labels before shell spawns
            - `/charly-check:cdp` -- Chrome DevTools Protocol automation
            - `/charly-check:wl` (sway subgroup) -- Sway compositor control
            - `/charly-core:charly-doctor` -- Host hardware probe that feeds `appendAutoDetectedEnv()` (DRINODE, HSA_OVERRIDE_GFX_VERSION)
            - `/charly-build:settings` -- Engine and bind address settings

            ### Build-mode references

            - `/charly-image:image` -- Box definitions (ports, volumes, env) in `charly.yml`; authoritative source before a pull
            - `/charly-build:build` -- Build the image you intend to shell into

            ### Layer skills

            - `/charly-distros:nvidia`, `/charly-distros:rocm` -- GPU layers consuming the auto-injected env

            ## When to Use This Skill

            **MUST be invoked** when the task involves charly shell command, interactive shells, command execution in containers, workspace mounts, TTY allocation, or port relay. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Any time. Interactive access to running or stopped containers.

ssh-skill:
    skill:
        name: ssh
        family: core
        owner: charly-core
        description: |-
            Generic SSH support for Charly. Use for host-alias remote execution or `charly ssh tunnel` access to remote SPICE and VNC endpoints.
        content: |
            MUST be invoked before any work involving: `charly --host <alias|target>`
            remote execution, `charly ssh tunnel` port forwarding for external SPICE/VNC
            viewers, or managing host aliases via `charly settings set hosts.<alias>`.

            ## Two orthogonal surfaces

            ### 1. `charly --host <alias>` — re-exec any charly command on a remote machine

            Set `--host` (or `CHARLY_HOST`) at the **top level** of any `charly` invocation.
            `charly` shells out to the system `ssh` binary, runs `charly <rest of argv>` on
            the remote host, and streams stdin/stdout/stderr through. Exit code
            propagates.

            ```bash
            # Alias setup (once per workstation):
            charly settings set hosts.o o.example.org
            charly settings set hosts.prod admin@prod.example.com:2222

            # Any charly verb works:
            charly --host o status
            charly --host o start openclaw
            charly --host o vm list
            charly --host o deploy add host fedora-coder
            charly --host o test libvirt info arch
            charly --host o test libvirt screenshot arch - > /tmp/local.png   # stdout pipes back
            ```

            **LocalOnly commands are NOT re-execed**, even when `--host` is set:
            `charly settings …`, `charly version`, `charly ssh tunnel …`. These manage the local
            workstation (settings file, CLI version, local tunnel listener) and
            would be meaningless on the remote host.

            **Transport:** system `ssh` binary via `os/exec`, so `~/.ssh/config`,
            agent forwarding, and ControlMaster all work transparently. If your
            target needs a specific key, set it in `~/.ssh/config` — `charly` stays out
            of SSH authentication.

            **Client-only flags stripped** before re-exec: `--host`, `--dir` / `-C`,
            `--repo`. These are workstation-local concerns and must not be
            forwarded to the remote side.

            ### 2. `charly ssh tunnel` — expose a remote VM's display for external GUI apps

            For apps that aren't `charly` (virt-viewer, remote-viewer with a bare URL,
            TigerVNC, Spicy), open an SSH-forwarded local endpoint:

            ```bash
            charly ssh tunnel spice <vm> [--uri qemu+ssh://user@host/session] [--tcp]
            charly ssh tunnel vnc   <vm> [--uri qemu+ssh://user@host/session] [--tcp]
            ```

            Default mode preserves the wire format: UNIX socket in, UNIX socket out
            (local path under `/tmp/charly-tunnel-<id>.sock`). `--tcp` forces a
            127.0.0.1:<random> TCP listener for clients that don't understand
            `spice+unix://` / `vnc+unix://`.

            ```
            $ charly ssh tunnel spice arch --uri qemu+ssh://o.example.org/session
            spice tunnel: spice+unix:///tmp/charly-tunnel-8e4c.sock
            Connect with: remote-viewer spice+unix:///tmp/charly-tunnel-8e4c.sock
            Press Ctrl-C to close the tunnel.
            ```

            Blocks until SIGINT/SIGTERM; closes listener + SSH client cleanly on
            exit.

            **Not needed for virt-manager or `remote-viewer --connect qemu+ssh://`**
            — those auto-forward UNIX-socket listeners through libvirt's RPC
            fd-passing, with zero charly involvement. See `/charly-vm:arch-cloud-vm`.

            ## Alias management

            | Command | Effect |
            |---|---|
            | `charly settings set hosts.<alias> <ssh-target>` | create/update alias |
            | `charly settings get hosts.<alias>` | print resolved target |
            | `charly settings reset hosts.<alias>` | delete alias |
            | `charly settings list` | show all settings including host_aliases map |

            `<ssh-target>` forms: `host`, `user@host`, `user@host:port`. When
            resolving, plain words that look like aliases (no `@`, no `.`) are
            looked up in `hosts.*`; anything else is treated as a raw ssh target
            and passed through.

            ## When NOT to use `--host`

            - When you want artifacts (screenshots, recordings) to land in the local
              filesystem → use the declarative `libvirt:`/`vnc:`/`spice:` check verbs against
              the vm target with `CHARLY_LIBVIRT_URI=qemu+ssh://…` set instead; it runs
              charly locally and forwards the display channel over SSH.
            - When `charly` isn't installed on the remote machine → set
              `CHARLY_LIBVIRT_URI` or use `charly ssh tunnel`.

            ## Cross-References

            - `/charly-vm:arch-cloud-vm` — "Connecting from a remote workstation" —
              the canonical worked example across all three paths.
            - `/charly-build:settings` — `hosts.<alias>` key schema.
            - `/charly-check:spice` — the declarative `spice:` check verb; the host resolves the VM's SPICE endpoint (honoring `CHARLY_LIBVIRT_URI` for a remote hypervisor).
            - `/charly-check:libvirt` — the declarative `libvirt:` check verb served out-of-process by candy/plugin-vm; honors `CHARLY_LIBVIRT_URI` for a remote hypervisor.
            - `/charly-check:vnc` — the declarative `vnc:` check verb (served out-of-process by candy/plugin-vnc); the host pre-resolves the RFB endpoint for pod AND vm targets (a VM's libvirt VNC via bridge/tunnel).

start-skill:
    skill:
        name: start
        family: core
        owner: charly-core
        description: |-
            Start a container as a background service.
            MUST be invoked before any work involving: charly start command, launching containers, quadlet vs direct mode startup, or encrypted volume auto-mounting.
        content: |
            # charly start -- Start Container Service

            ## Overview

            Start a container image as a background service. In quadlet mode, `charly config <image>` MUST be run first to generate the systemd quadlet unit. In direct mode, start creates an ephemeral container directly.

            **Relationship to `charly fleet add`** — `charly start <image>` is the ergonomic wrapper for `charly fleet add <image> <image>` (container target). New scripts should prefer `charly fleet add <name> <ref>` directly when they need explicit deploy names, `--add-candy` overlays, or the host target. `charly start` covers the common single-image case and is retained for backwards compatibility. See `/charly-core:deploy` for the unified command family and `/charly-local:local-deploy` for the host target.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Start (quadlet) | `charly start <image>` | Start via systemd quadlet unit |
            | Start (direct) | `charly start <image>` | Create ephemeral container (when run_mode=direct) |
            | With specific tag | `charly start <image> --tag TAG` | Use specific image tag |
            | Build first | `charly start <image> --build` | Build image before starting |
            | Named instance | `charly start <image> -i INSTANCE` | Start a named instance |

            ### Direct Mode Only

            | Action | Flag | Description |
            |--------|------|-------------|
            | Bind volume | `--bind name=path` | Override volume backing for session |
            | Volume config | `-v name:type[:path]` | Configure volume backing |
            | Environment | `-e KEY=VALUE` | Set environment variable |
            | Env file | `--env-file PATH` | Load environment from file |
            | Port mapping | `-p PORT` | Additional port mapping |

            **Note:** `-e` flags use Kong `sep:"none"` — commas in values are preserved (e.g., `NO_PROXY=localhost,127.0.0.1`).

            ## Label-Only Policy

            `charly start` reads only OCI labels (via `ExtractMetadata`) + `charly.yml`. It
            does not touch `charly.yml`. Remote refs (`@github.com/...`) are rejected
            with a redirect to `charly box pull`.

            If the image isn't in local storage, startup fails with the standard
            `ErrImageNotLocal` recommendation pointing to `charly box pull`. See
            `/charly-build:pull`.

            ## Important: Quadlet Mode Requires Prior Configuration

            In quadlet mode (default), `charly config <image>` **MUST** be run before `charly start`. If the quadlet file does not exist, start fails with:

            ```
            not configured; run 'charly config <image>' first
            ```

            The correct workflow is:

            ```bash
            # Step 1: Configure (generates quadlet, provisions secrets, sets up volumes)
            charly config sway-browser-vnc

            # Step 2: Start
            charly start sway-browser-vnc
            ```

            ## Usage

            ### Quadlet Mode (Default)

            ```bash
            # Configure first
            charly config jupyter --bind workspace --password auto

            # Start the service (systemctl --user start charly-jupyter.service)
            charly start jupyter
            ```

            Encrypted volumes declared in the image are auto-mounted at start time. In quadlet mode, `ExecStartPost` commands in the quadlet file register Tailscale serve/funnel rules (if tunnel is configured in charly.yml). These are automatically cleaned up by `ExecStopPost` on service stop.

            **Quadlet auto-mount hook.** Quadlets generated for encrypted-volume images carry an `ExecStartPre=charly config mount <image>` directive. Without it, a host reboot or any other event that drops the gocryptfs FUSE mount would let systemd start the container against an empty `plain/` mountpoint — at which point the container would write plaintext data on top of the populated cipher tree. If you have quadlets generated by an older `charly`, run `charly migrate` to regenerate them in place — see `/charly-build:migrate` "charly migrate". Direct-mode starts have a parallel safety net: `verifyBindMounts` fails loud when the cipher dir is populated and the plain mount is empty (see `/charly-automation:enc` "Pre-start safety check").

            ### Direct Mode

            ```bash
            # Start with workspace and env vars
            charly start jupyter -e JUPYTER_TOKEN=mytoken

            # Start with port mapping
            charly start jupyter -p 8888:8888
            ```

            ### Build and Start

            ```bash
            # Build the image first, then start
            charly start jupyter --build
            ```

            ## Cross-References

            ### Prerequisites

            - `/charly-build:pull` -- **Required** before `charly start` can work on a fresh host. `charly start` rejects remote refs (`@github.com/...`) — pull first.
            - `/charly-core:charly-config` -- **MUST run first** in quadlet mode (setup: quadlet + secrets + encrypted volumes)

            ### Deploy-mode neighbors

            - `/charly-core:service` -- Full service lifecycle (in-container supervisord/systemd services)
            - `/charly-core:stop` -- Stop a running service
            - `/charly-core:charly-status` -- Check service status
            - `/charly-core:charly-update` -- Update image and restart
            - `/charly-core:logs` -- View service logs
            - `/charly-core:shell` -- Interactive shell into the same image
            - `/charly-core:deploy` -- Tunnel configuration (ExecStartPost commands generated by quadlet)
            - `/charly-automation:enc` -- Encrypted volume mount lifecycle (inline mount in direct mode, `ExecStartPre=charly config mount` in quadlet mode, short-circuit fast path)
            - `/charly-build:secrets` -- Credential store hierarchy for encrypted volume passphrase resolution

            ### Build-mode references

            - `/charly-image:image` -- Box definitions (ports, volumes, env) in `charly.yml`
            - `/charly-build:build` -- Build the image you intend to start

            Live-deploy verification: see /charly-check:check (the 11 Testing Standards) and /charly-internals:disposable.

stop-skill:
    skill:
        name: stop
        family: core
        owner: charly-core
        description: |-
            Stop a running service container.
            MUST be invoked before any work involving: charly stop command, stopping containers, or halting services.
        content: |
            # charly stop -- Stop Service Container

            ## Overview

            Stops a running service container. In quadlet mode, stops the systemd user service. In direct mode, stops the container via the container engine.

            **Relationship to `charly fleet del`** — `charly stop <name>` is the ergonomic wrapper for `charly fleet del <name>` on a container deploy. The two are interchangeable for container deploys; `charly fleet del host` is required for the host-target teardown path (which runs ReverseOps, removes env.d files, and strips the shell managed block). See `/charly-core:deploy` and `/charly-local:local-deploy`.

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Stop service | `charly stop <image>` | Stop the running container |
            | With instance | `charly stop <image> -i 2` | Stop a specific instance |
            | Stop + tear down FUSE | `charly stop <image> --unmount` | Stop the container AND unmount encrypted volumes (drops `charly-enc-<image>-<volume>.scope` units) |

            ## Usage

            ```bash
            # Stop a running service
            charly stop jupyter

            # Stop a specific instance
            charly stop ollama -i 2

            # Stop and tear down encrypted FUSE mounts in one step
            charly stop immich --unmount
            ```

            ## Flags

            | Flag | Description |
            |------|-------------|
            | `-i, --instance INSTANCE` | Target a specific container instance |
            | `--unmount` | After the container stop succeeds, also tear down `charly-enc-<image>-<volume>.scope` units via `encUnmount`. Best-effort: per-volume unmount failures emit a warning but don't propagate (the container has already stopped; the user can retry with `charly config unmount <image>`). Default `false` — plain `charly stop` leaves gocryptfs scopes running so they survive container restart (the original load-bearing design from `/charly-automation:enc`). |

            ## Behavior

            - **Quadlet mode:** Runs `systemctl --user stop charly-<image>.service`
            - **Direct mode:** Runs `<engine> stop <container>`
            - Does not remove the container or its configuration -- use `charly remove` for that
            - Does not disable the service -- the container may restart on next login if enabled
            - To stop and disable: `charly start <image> --enable=false` then `charly stop <image>`
            - **By design**, plain `charly stop` does NOT tear down encrypted FUSE mounts — the `charly-enc-*.scope` units are deliberately decoupled from the container service cgroup so they survive `KillMode=mixed` on stop and let the next start fast-path through the `charly config mount` short-circuit. Use `--unmount` for the full teardown semantics.

            ## Cross-References

            - `/charly-build:pull` -- Prerequisite: fetch the image into local storage; handles remote refs (`@github.com/...`) and the `ErrImageNotLocal` recovery path

            - `/charly-core:start` -- Start services
            - `/charly-core:remove` -- Remove containers, quadlets, and deploy config
            - `/charly-core:charly-status` -- Check service status


githubrunner-skill:
    skill:
        name: githubrunner
        family: distros
        owner: charly-distros
        description: |-
            Self-hosted GitHub Actions runner on CachyOS, fully rootless — runs as
            uid=1000 with zero added capabilities (no root, no privileged) via
            container-nesting, with rootless nested podman/buildah/skopeo for CI.
            Host networking retained for reachability. MUST be invoked before building,
            deploying, configuring, or troubleshooting the githubrunner box.
        content: |
            # githubrunner
            
            Self-hosted GitHub Actions runner on **CachyOS**, fully rootless. Shares the
            rootless nested-container posture with `/charly-openclaw:openclaw-desktop` (uid=1000,
            no caps, `unmask=/proc/*` via `/charly-distros:container-nesting`).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | cachyos (`cachyos.cachyos`) |
            | Layers | agent-forwarding, github-runner, charly, dbus, container-nesting |
            | Build | pac |
            | Platforms | linux/amd64 |
            | UID / user | **1000 / user** (rootless — NO uid/privileged override) |
            | Network | host (reach the host-side ghcr pull-through mirror) |
            | Security | container-nesting's posture: `cap_add:[]`, `security_opt:[unmask=/proc/*]`, devices `/dev/fuse` + `/dev/net/tun` |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `cachyos` (`docker.io/cachyos/cachyos-v3`, via the `cachyos` import namespace)
            2. `agent-forwarding` — GPG/SSH/direnv (composes gnupg + direnv + ssh-client)
            3. `github-runner` — the Actions runner agent (under `${HOME}/actions-runner`),
               cosign, go/git/jq, qemu-user-static (aarch64 cross-arch CI), the .NET runtime
               deps, the credential-backed registration, the ghcr mirror config
            4. `charly` — the charly binary + `virtualization` + `gocryptfs` + `socat`
            5. `dbus` — session bus (for runner hooks)
            6. `container-nesting` — rootless nested podman/buildah/skopeo + the subuid/subgid
               layout + newuidmap/newgidmap file-caps + containers/storage/policy configs
            
            ## Rootless posture (genuinely uid 1000, no caps)
            
            The box carries **no uid/user/privileged override**, so it resolves to
            `container-nesting`'s posture: uid=1000, `cap_add:[]`, `security_opt:[unmask=/proc/*]`,
            devices `/dev/fuse` + `/dev/net/tun`. The runner process (`run.sh`), all CI jobs,
            and rootless nested podman all run as `user` (uid 1000). See
            `/charly-distros:container-nesting` for the `mount_too_revealing()` kernel RCA that
            makes nested podman work without caps or `--privileged`.
            
            `/charly-coder:sshd` (passwordless `/etc/sudoers.d/charly-user`) is composable if a
            workflow genuinely needs sudo; it is not composed by default.
            
            ## Nested container support
            
            `githubrunner` composes `/charly-distros:container-nesting` directly, so CI jobs get
            first-class **rootless nested podman/buildah/skopeo** (uid 1000, `/dev/fuse` +
            `unmask=/proc/*`, `crun` + `fuse-overlayfs`, `BUILDAH_ISOLATION=chroot`). The
            rootless image cache lives under `${HOME}/.local/share/containers`. Cross-arch
            container builds (aarch64) work via the repo `qemu-user-static` +
            `qemu-user-static-binfmt` packages.
            
            ## CI: the org's release-binary workflow runs on GitHub-hosted runners

            The legacy `release-packages` workflow (`.github/workflows/release-packages.yml`,
            which built the pac/rpm/deb packages on this self-hosted runner via `charly box
            pkg`) is REMOVED with the nFPM cutover. The release-binary workflow
            (`.github/workflows/release-binary.yml`) builds the CalVer-stamped binary + the
            welded plugins on a GitHub-hosted `ubuntu-latest` runner and publishes them as
            release assets; the per-distro package repos (built by the `charly
            generate-packages` plugin) consume those assets. This runner still carries the
            FULL `charly` PKGBUILD `depends=` set, so the charly CLI (and the CI jobs that
            drive it) runs fully here:

            - **pac** runs NATIVELY — the runner is an Arch (CachyOS) host, so `charly` and
              its deps resolve without a container. Every `depends=` is pre-installed, so no
              `sudo pacman` (the runner has no passwordless sudo).
            - **rpm + deb** run in the runner's rootless nested podman.

            The `github-runner` candy completes the `charly` runtime on the runner — beyond the .NET/runner deps it adds
            the `depends=` packages the charly/virtualization candies don't already provide
            (`slirp4netns`, `libisoburn`, `cdrtools`, `swtpm`).
            
            ## Token mechanism (credential-backed; obtained via `gh`)
            
            `RUNNER_TOKEN` is a `secret_accept` (credential-store-backed — never written to
            charly.yml or the quadlet); `RUNNER_ORG` is an `env_accept`. The registration
            token is short-lived and only consumed once at `charly config` time (the registered
            runner persists its own `.credentials` on the `state` volume), so it is obtained
            fresh from `gh`. The `post_enable`/`pre_remove` hooks are guarded — they skip
            when `RUNNER_TOKEN` is empty, so a token-less deploy (e.g. an check bed) brings the
            image up without registering, and a stale token never errors a teardown.
            
            ```bash
            # Obtain a fresh org registration token and register:
            TOKEN=$(gh api -X POST /orgs/<org>/actions/runners/registration-token --jq .token)
            charly config githubrunner -e RUNNER_ORG=<org> -e RUNNER_TOKEN="$TOKEN"   # token scrubbed → credential store
            charly start githubrunner
            ```
            
            Removal deregisters via the `pre_remove` hook, which needs a **remove**-token
            (distinct from the registration token):
            
            ```bash
            charly remove githubrunner -e RUNNER_TOKEN=$(gh api -X POST /orgs/<org>/actions/runners/remove-token --jq .token)
            ```
            
            ## Lifecycle
            
            ```bash
            charly box build githubrunner
            charly config githubrunner -e RUNNER_ORG=<org> -e RUNNER_TOKEN="$TOKEN"
            charly start githubrunner
            charly stop githubrunner
            charly remove githubrunner -e RUNNER_TOKEN=<remove-token>
            ```
            
            ## Key Candies
            
            - `/charly-distros:github-runner` — runner agent, hooks, registration, ghcr mirror, .NET deps + the charly-host `depends=` completion (native pac builds in CI)
            - `/charly-distros:container-nesting` — rootless nested podman/buildah/skopeo, subuid layout, caps
            - `/charly-tools:charly` — the charly binary + virtualization + gocryptfs + socat
            - `/charly-distros:agent-forwarding` — GPG/SSH/direnv for the `.secrets` workflow
            
            ## Related Boxes
            
            - `/charly-distros:cachyos` — the CachyOS base (parent, via the `cachyos` namespace)
            - `/charly-openclaw:openclaw-desktop` — same rootless container-nesting posture (uid 1000, no caps)
            - `/charly-distros:charly-fedora`, `/charly-coder:charly-arch` — the charly-toolchain siblings (root path, box-level full-hammer security)
            
            ## Related Commands
            
            - `/charly-core:charly-config` — deploy setup with RUNNER_ORG (env) / RUNNER_TOKEN (secret)
            - `/charly-core:start`, `/charly-core:stop`, `/charly-core:remove` — lifecycle + pre-remove deregistration
            - `/charly-core:charly-status`, `/charly-core:logs` — verify runner is idle + troubleshoot
            - `/charly-build:secrets` — the credential store backing `RUNNER_TOKEN`
            
            ## Verification
            
            Build-scope (`charly check box githubrunner`) + deploy-scope (`charly check live`) checks
            ship on the `github-runner` candy (functional: `config.sh --version` proves the
            .NET deps resolved; rootless nested `podman run` proves the posture). The
            disposable R10 bed is **`check-githubrunner-pod`** (`charly check run check-githubrunner-pod`)
            — it proves the rootless composition WITHOUT GitHub registration (no token →
            guarded hooks no-op).
            
            After `charly start` against a registered deploy:
            
            - `charly status githubrunner` — container running
            - `charly shell githubrunner -c "id"` — uid=1000(user) (rootless)
            - `charly shell githubrunner -c "podman run --rm quay.io/libpod/alpine:latest true"` — rootless nested podman works
            - Runner appears as "Idle" in the org's Settings > Actions > Runners
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the githubrunner box,
            self-hosted runners, or GitHub Actions CI/CD. Invoke this skill BEFORE
            reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)
            - `/charly-check:check` — the `check:` checks + the `check-githubrunner-pod` R10 bed

nvidia-layer-skill:
    skill:
        name: nvidia-layer
        family: distros
        owner: charly-distros
        description: |-
            NVIDIA GPU runtime support: driver libs, nvidia-container-toolkit (CDI), and VA-API.
            Fedora (negativo17) and Arch Linux (pac). Base candy for all GPU-accelerated boxes.
            Use when working with NVIDIA GPU support, CDI device injection, or the nvidia candy.
        content: |
            # nvidia -- NVIDIA GPU runtime
            
            NVIDIA runtime candy providing `nvidia-container-toolkit` for CDI device injection and VA-API hardware video acceleration. Driver userspace libraries (libcuda, libnvidia-ml, etc.) are NOT bundled — CDI provides host-matching driver libs at runtime, preventing version mismatches between container and host kernel module. Supports both Fedora and Arch Linux.
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `task:` |
            | Depends | none |
            
            ## Packages
            
            **RPM** (from negativo17 fedora-multimedia repo):
            - `nvidia-container-toolkit` — `nvidia-ctk` CLI for CDI spec generation
            - `libva-nvidia-driver` — VA-API hardware video acceleration
            
            **PAC** (Arch Linux):
            - `nvidia-utils` — NVIDIA GL/Vulkan userspace, `nvidia-smi`
            - `nvidia-container-toolkit` — `nvidia-ctk` CLI for CDI spec generation
            
            ## Environment Variables
            
            | Variable | Value |
            |----------|-------|
            | `LD_LIBRARY_PATH` | `/usr/lib64` (ensures CDI-injected host driver libs are found by the dynamic linker) |
            
            ## CDI Support
            
            The `nvidia-container-toolkit` provides `nvidia-ctk` which generates CDI (Container Device Interface) specs. `charly` triggers CDI regeneration plugin-side (`pluginEnsureCDI` in `candy/plugin-preempt/holder_dispatch.go`, via `spec.GpuSwitchActionEnsureCDI` — the former in-core `EnsureCDI()` shim is DELETED, K-wave 2 cone R3) before launching containers with GPU — if CDI specs don't exist at `/etc/cdi/nvidia.yaml`, it runs `nvidia-ctk cdi generate` to create them. This enables GPU access in nested containers where host CDI specs are not inherited.
            
            ### Build-time noise on GPU-less hosts (Arch)
            
            Arch's `nvidia-container-toolkit` ships a pacman post-install hook that
            invokes `nvidia-ctk cdi generate`. On a host with no NVIDIA driver
            loaded (e.g., an AMD-only build host), the hook fails NVML init:
            
            ```
            ERROR: failed to generate CDI spec: failed to initialize NVML: Driver Not Loaded
            error: command failed to execute correctly
            ```
            
            This is **benign for the build** — pacman still exits 0 (hooks don't
            affect the parent transaction's status), the candy finishes installing,
            and the resulting image works at runtime on a GPU-bearing host (where
            the CDI spec is generated via `pluginEnsureCDI` (`candy/plugin-preempt`) at container-launch time,
            not build time). You can ignore the error message. RPM installs don't
            trigger the hook, so Fedora-based boxes don't see this noise.
            
            If you ever build inside CI where even-benign hook errors matter,
            either build arch-nvidia images on a GPU-bearing runner, or patch the
            candy to carry a build-time `NVIDIA_VISIBLE_DEVICES=void` env var so
            nvidia-ctk skips CDI gen.
            
            ## DRINODE Auto-Injection
            
            NVIDIA VAAPI acceleration requires the container to know which DRM render node to bind the EGL context against. On multi-GPU hosts there may be `/dev/dri/renderD128`, `/dev/dri/renderD129`, … and the correct one depends on which physical card backs the NVIDIA driver.
            
            `charly` does **not** bake a hardcoded `DRINODE=/dev/dri/renderD128` into this candy. Instead, it auto-detects the correct render node at container-launch time and injects it as an environment variable. The detection + injection is consolidated in a single function, `appendAutoDetectedEnv()` in `candy/plugin-deploy-pod/config_setup_helpers.go` (relocated wholesale from charly-core's `charly/devices.go` in the 2026-07-22 dead-code-radical-removal batch), which is called by `charly config`, `charly start`, and `charly shell` via that candy's own `config_setup.go` / `resolve.go` / `resolve_f12.go` resolvers — so the commands always produce the same env set.
            
            Selkies is the primary consumer: pixelflux's Wayland compositor uses `DRINODE` to open the render node and set up the VAAPI H.264 encoder. Without the injection, selkies would fall back to software encode (`libx264`) and lose ~40% of its streaming bandwidth budget.
            
            GPU device injection is consolidated into the single `appendAutoDetectedEnv()` function rather than scattered across the `charly` source tree. If you see `DRINODE` referenced in candy scripts, you can assume it was auto-detected and injected by `charly`, not set by the user.
            
            See `/charly-core:charly-doctor` (Hardware Detection) for the detection probe and `/charly-distros:rocm` for the AMD-side counterpart using the same mechanism.
            
            ### Cross-GPU portability (nvidia-base boxes on AMD hosts)
            
            Boxes that declare `base: nvidia` (e.g., `/charly-selkies:selkies-labwc-nvidia`) still run cleanly on hosts with a different GPU vendor — the NVIDIA runtime libraries ride along as benign passengers. `charly config` auto-detects whatever the host actually exposes (e.g., `/dev/dri/renderD128` + `/dev/kfd` for an AMD RDNA3), injects those device nodes + `DRINODE`, and Mesa handles rendering. For example, `selkies-labwc-nvidia` (base: nvidia) runs on an AMD `gfx 11.0.0` host — all supervisord programs RUNNING, selkies streaming over Mesa, no CUDA calls attempted. The CUDA toolkit in the box simply goes unused.
            
            ## Install tasks
            
            Creates Vulkan ICD compatibility symlinks for nvidia-ctk CDI device injection.
            
            ## Used In Boxes
            
            - `/charly-distros:nvidia` — Fedora NVIDIA GPU base image (nvidia + cuda candies)
            - `/charly-distros:cachyos` — `cachyos.nvidia`, the CachyOS GPU base (cachyos + agent-forwarding + nvidia + cuda); the nvidia/cuda candies being multi-distro (rpm + pac) is what lets this Arch/CachyOS GPU base reuse them unchanged
            - `/charly-coder:charly-arch` — Arch Linux charly toolchain (shared candies + nvidia)
            - `/charly-distros:charly-fedora` — Fedora charly toolchain (shared candies + nvidia)
            
            ## Related Candies
            
            - `/charly-distros:cuda` — CUDA development toolkit (depends on nvidia)
            - `/charly-distros:rocm` — AMD GPU counterpart (ROCm runtime + OpenCL), uses the same `appendAutoDetectedEnv()` DRINODE injection
            - `/charly-selkies:selkies` — Primary consumer of the DRINODE env for VAAPI H.264 encode
            - `/charly-languages:python-ml`, `/charly-jupyter:llama-cpp`, `/charly-jupyter:jupyter-ml` — CUDA ML stacks that depend on this candy
            
            ## Related Commands
            
            - `/charly-core:charly-doctor` — Host NVIDIA detection (GPU probe, CDI spec status, driver version)
            - `/charly-core:shell` — DRINODE auto-injection applies to interactive shells too
            - `/charly-automation:udev` — Device permission management for `/dev/dri/*` and `/dev/nvidia*`
            - `/charly-core:charly-config` — Runtime GPU device injection at deployment time (same `appendAutoDetectedEnv()` path)
            - `/charly-core:start` — Runtime GPU device injection at service start time
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

tutorial-shell-skill:
    skill:
        name: tutorial-shell
        family: distros
        owner: charly-distros
        description: |-
            The teaching box quoted end to end by opencharly.ai — a minimal, real dev shell
            composing one tool candy and one service candy, with the container init injected.
            MUST be invoked before editing the tutorial-shell box, the check-tutorial-shell bed,
            or any documentation page that excerpts them.
        content: |
            # tutorial-shell
            
            The **documented example**. `tutorial-shell` exists so the quickstart and the concepts
            curriculum on [opencharly.ai](https://opencharly.ai) can quote a box that is real, builds, and is
            re-proven on every R10 roster run — instead of illustrating with YAML that nobody executes.
            
            Lives in the **`opencharly/distro-fedora`** repo (git submodule at **`box/fedora`**). Its
            `fedora` base is bare-local in the same self-contained submodule (`import: []`), and both composed
            candies are pulled by `@github` reference.
            
            ```bash
            charly -C box/fedora box build tutorial-shell
            charly -C box/fedora check run check-tutorial-shell
            ```
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | fedora |
            | Candies | ripgrep, sshd |
            | Ports | 2222 (tcp, from the sshd candy) |
            | Init | supervisord — **auto-injected**, not composed (see below) |
            | Bed | `check-tutorial-shell` (`disposable: true`, pod) |
            
            ## Why these candies
            
            Each one is there to teach exactly one thing, and the composed list is kept to two so it stays
            readable when quoted in full on a documentation page:
            
            | Candy | Teaches |
            |---|---|
            | `/charly-tools:ripgrep` | a **tool** candy — packages plus deterministic probes, no service |
            | `/charly-coder:sshd` | a **service** candy, and the canonical init-polymorphism example: ONE `service:` list carrying both a `use_packaged:` systemd form and a custom `exec:` supervisord form |
            
            **The init is deliberately absent from that list.** Because `sshd` declares a service, charly
            resolves the init the target needs and injects it — `supervisord` for a container image, nothing
            extra for a systemd machine venue, which already has an init. Composing the init by hand is
            neither required nor correct: it would be target-blind. That is why the box teaches with two
            candies rather than three.
            
            Together they cover the whole shape of a box without any of them being a fixture: a reader can
            build this, shell into it, and use it.
            
            ## What the box's own plan asserts — and what it deliberately does not
            
            The box carries **one** `check:` step, `tutorial-shell-service-wired-into-init`: the assembled
            `/etc/supervisord.conf` contains a `[program:sshd]` block.
            
            That is the only claim composition itself produces. The injected `supervisord`'s plan proves the
            init is installed; `sshd`'s proves the daemon is installed; **neither proves sshd became a
            supervisord program**. Drop `sshd` from the composed list and the check fails: with no `service:`
            declared, nothing selects an init, so no supervisord candy is injected and no
            `/etc/supervisord.conf` is assembled to hold a `[program:sshd]` block.
            
            **Co-residence is NOT checked here, on purpose.** Every composed candy's plan runs against *this*
            image, so ripgrep's probes and sshd's probes both passing already proves both landed. A box-level
            `command -v rg && command -v sshd` would duplicate them (R3), and it would pass for the wrong
            reason — testing the candies rather than the composition. The same applies to the bed, which
            carries no `plan:` of its own.
            
            This distinction is the reason the box exists in its current shape, and it is worth preserving: a
            teaching example that restates a candy's own probe in the composing box teaches the opposite of
            the rule the site's own "the spec is the test" page states.
            
            ## Editing rule — the site quotes this file verbatim
            
            Documentation pages **excerpt** `box/tutorial-shell/charly.yml`, they do not paraphrase it. Two
            consequences:
            
            1. **Keep it readable.** Comments in the box are written for a first-time reader, not for a
               maintainer. Resist adding candies: every addition costs a line on several published pages.
            2. **A change here is a documentation change.** After editing the box, re-read the pages that
               quote it (the quickstart and the concepts curriculum) and update the surrounding prose in the
               same cutover — a quoted block that no longer matches its source is a doc-vs-reality divergence
               (R1), not a cosmetic drift.
            
            ## Related Boxes
            
            - `/charly-distros:fedora` — the parent base image
            - `/charly-distros:charly-fedora` — the next box up in size: the same shape plus the charly toolchain
            - `/charly-coder:fedora-coder` — the kitchen-sink end of the same spectrum
            
            ## Related Commands
            
            - `/charly-build:build` — build the box
            - `/charly-check:check` — the bed model and `charly check run`
            
            ## When to Use This Skill
            
            **MUST be invoked** when editing the `tutorial-shell` box, the `check-tutorial-shell` bed, or any
            opencharly.ai page that quotes them.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` entries carrying `base:`/`from:`)
            - `/charly-build:docs` — the generator that publishes this card and the box's reference page

ubuntu-builder-skill:
    skill:
        name: ubuntu-builder
        family: distros
        owner: charly-distros
        description: |-
            Minimal Ubuntu 24.04 builder image (pixi + Node.js + build-toolchain)
            used as the multi-stage builder for Ubuntu-based boxes — currently
            ubuntu-coder. Runs as uid 1000 `ubuntu` (adopted from the upstream
            ubuntu:24.04 base image via the embedded distro vocabulary's base_user declaration).
            MUST be invoked before building, deploying, configuring, or troubleshooting
            the ubuntu-builder box.
        triggers:
            - "Ubuntu images / `ubuntu*` / `box/ubuntu` submodule"
        content: |
            # ubuntu-builder
            
            Ubuntu 24.04 (noble) counterpart of `/charly-distros:fedora-builder` and `/charly-distros:debian-builder`. Same role — pixi/npm/cargo multi-stage builder — with one important difference: the builder runs as `ubuntu` (uid 1000) because the upstream `ubuntu:24.04` base image ships a pre-existing `ubuntu:ubuntu` account at uid 1000, and the embedded `distro.ubuntu.base_user` vocabulary adopts it.
            
            Lives in the **`opencharly/distro-ubuntu`** repo (git submodule at **`box/ubuntu`**).
            Build it from the submodule: `charly -C box/ubuntu box build ubuntu-builder`
            (normally builds implicitly as a dependency of `ubuntu-coder`). Its
            `pixi`/`nodejs`/`build-toolchain` candies are pulled by github reference from the
            main repo.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | `ubuntu` (which = `ubuntu:24.04` + our bootstrap) |
            | Layers | `pixi`, `nodejs`, `build-toolchain` |
            | Platforms | `linux/amd64` |
            | Registry | `ghcr.io/opencharly` |
            | User | `ubuntu` / uid 1000 (**adopt mode** — see `/charly-image:image` "user_policy") |
            | Home | `/home/ubuntu` |
            
            ## Full candy stack
            
            1. `/charly-distros:ubuntu` — Ubuntu 24.04 + bootstrap. Inherits Debian's `apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg` pattern because the embedded `distro.ubuntu` vocabulary declares `inherits: debian`. Ubuntu-specific: `base_user: { name: ubuntu, uid: 1000, gid: 1000, home: /home/ubuntu }` — no `useradd` step emitted.
            2. `/charly-languages:pixi` — pixi package manager + env paths (`/home/ubuntu/.pixi`).
            3. `/charly-coder:nodejs` — Node.js + npm (generic `nodejs`).
            4. `/charly-coder:build-toolchain` — same Debian `-dev` packages as `/charly-distros:debian-builder`.
            
            ## Adopt-mode semantics
            
            When the generator emits the Containerfile for this image, the bootstrap section contains:
            
            ```
            # User ubuntu (uid=1000) adopted from base image (declared in the embedded distro.base_user vocabulary) — no useradd needed
            WORKDIR /home/ubuntu
            USER 1000
            ```
            
            No `useradd`, no `groupadd`, no `usermod -l` rename. The upstream `ubuntu:ubuntu` account is honored verbatim — HOME, npm prefix, pixi env, cargo home, sudoers all derive from `resolved.User = "ubuntu"`. See `/charly-image:image` "user_policy" and `/charly-internals:generate-source` "writeBootstrap".
            
            ## Role in the build system
            
            Declares `builds: [pixi, npm, cargo]` and is referenced from `ubuntu:` as:
            
            ```yaml
            ubuntu:
              builder:
                pixi: ubuntu-builder
                npm: ubuntu-builder
                cargo: ubuntu-builder
            ```
            
            During `charly box build ubuntu-coder`, cargo/npm/pixi-owning candies get their `FROM ubuntu-builder AS <layer>-<type>-build` stages from this image, then `COPY --from=<stage> --chown=1000:1000 /home/ubuntu /home/ubuntu` into the final ubuntu-coder. (The `--chown=1000:1000` numeric form works uniformly regardless of user name — see `/charly-coder:build-toolchain` for the builder-artifact COPY pattern.)
            
            ## Cross-distro sibling builders
            
            - `/charly-distros:fedora-builder` — RPM-family, `user:user` uid 1000 (create).
            - `/charly-distros:debian-builder` — deb-family, Debian 13, `user:user` (create — Debian 13 ships no pre-existing uid-1000 user).
            - `/charly-distros:arch-builder` — pacman-family, `user:user` + `yay` for AUR.
            
            The three builders have near-identical candy stacks (pixi + nodejs + build-toolchain). The only meaningful divergence is this box's adopt-mode `ubuntu:ubuntu` identity.
            
            ## Quick start
            
            ```bash
            charly -C box/ubuntu box build ubuntu-builder
            charly shell ubuntu-builder               # drops you into /home/ubuntu as uid 1000
            id                                    # uid=1000(ubuntu) gid=1000(ubuntu)
            ```
            
            Typically not invoked directly — it's a build-time dependency of `/charly-coder:ubuntu-coder`.
            
            ## Verification
            
            - `charly -C box/ubuntu box list | grep ubuntu-builder`
            - `charly shell ubuntu-builder -- id` → `uid=1000(ubuntu) gid=1000(ubuntu)`
            - `charly shell ubuntu-builder -- pixi --version && node --version && gcc --version`
            
            ## Related boxes
            
            - `/charly-distros:ubuntu` — parent base; declares `base_user:` in the embedded distro vocabulary.
            - `/charly-coder:ubuntu-coder` — the consumer that this builder serves.
            - `/charly-distros:debian-builder` — deb-family sibling without adopt mode.
            - `/charly-distros:fedora-builder` — canonical RPM-family sibling.
            
            ## Related candies
            
            - `/charly-languages:pixi`, `/charly-coder:nodejs`, `/charly-coder:build-toolchain`
            
            ## Related commands
            
            - `/charly-build:build` — `base_user:` declaration format in the embedded `distro.*` vocabulary
            - `/charly-image:image` — `user_policy:` field (auto / adopt / create) and the decision table
            - `/charly-build:generate` — adopt-vs-create writeBootstrap emission modes
            
            ## When to use this skill
            
            **MUST be invoked** when:
            
            - Building or troubleshooting `ubuntu-builder` itself.
            - Debugging multi-stage COPY-from errors or permission issues in a `ubuntu-coder` build (this is the source stage; uid 1000 = `ubuntu` by adoption).
            - Understanding why `${HOME}` = `/home/ubuntu` (not `/home/user`) inside builder stages.

ubuntu-debootstrap-skill:
    skill:
        name: ubuntu-debootstrap
        family: distros
        owner: charly-distros
        description: |-
            Bootstrap-from-scratch Ubuntu 24.04 rootfs via debootstrap inside a privileged
            builder (from: builder:debootstrap, bootstrap_builder_image:
            ubuntu-debootstrap-builder). Retained for offline/air-gapped builds. Lives in
            the opencharly/distro-ubuntu submodule (box/ubuntu).
            MUST be invoked before building or troubleshooting ubuntu-debootstrap.
        triggers:
            - "Ubuntu images / `ubuntu*` / `box/ubuntu` submodule"
        content: |
            # ubuntu-debootstrap
            
            Bootstrap-from-scratch Ubuntu 24.04 (noble) root filesystem, built via
            `debootstrap` inside the privileged `/charly-distros:ubuntu-debootstrap-builder`
            container (`from: builder:debootstrap`,
            `bootstrap_builder_image: ubuntu-debootstrap-builder`).
            
            > **Lives in `opencharly/distro-ubuntu`** (git submodule at `box/ubuntu`). Build:
            > `charly -C box/ubuntu box build ubuntu-debootstrap`.
            
            ## When to use it (and when not)
            
            The canonical Ubuntu base (`/charly-distros:ubuntu`) pulls the upstream-published
            `ubuntu:24.04` OCI image from Docker Hub — that is the recommended, faster path.
            This debootstrap variant exists for **offline / air-gapped** builds and as a
            worked example of the `from: builder:debootstrap` pattern.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | From | builder:debootstrap |
            | bootstrap_builder_image | ubuntu-debootstrap-builder |
            | Distro | ubuntu:24.04, ubuntu, debian |
            | Build | deb |
            | Home repo | opencharly/distro-ubuntu (`box/ubuntu`) |
            
            The `ubuntu` distro config (`inherits: debian`; debootstrap suite `noble`,
            mirror `http://archive.ubuntu.com/ubuntu`, components `main,universe`) lives in
            the embedded build vocabulary (`charly/charly.yml`, baked into the `charly`
            binary). The embedded vocabulary carries BOTH the `ubuntu` and `debian` distro
            configs, so the `inherits: debian` resolution needs no reference to
            `opencharly/distro-debian`.
            
            ## Cross-References
            
            - `/charly-distros:ubuntu` — the recommended Docker-Hub base
            - `/charly-distros:ubuntu-debootstrap-builder` — the privileged builder it uses
            - `/charly-vm:ubuntu-debootstrap-vm` — the VM built via the same debootstrap path
            
            ## When to Use This Skill
            
            **MUST be invoked** before building or debugging the Ubuntu debootstrap rootfs.
            Invoke BEFORE reading source code or launching Explore agents.

ubuntu-debootstrap-builder-skill:

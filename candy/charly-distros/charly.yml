arch-test-skill:
    skill:
        name: arch-test
        family: distros
        owner: charly-distros
        description: |-
            Test box for Arch Linux pacman and AUR package installation.
            MUST be invoked before building or troubleshooting the arch-test box.
        content: |
            # arch-test
            
            Test box that validates both `pac:` (pacman) and `aur:` (AUR) package formats on Arch Linux. Used to verify the multi-distro build system handles Arch packaging correctly.
            
            `arch-test` lives in the **`opencharly/distro-arch`** repo (git submodule at
            **`box/arch`**). The test candies `arch-pac-test` / `arch-aur-test` are vendored
            locally in this repo's `candy/` (resolved via its `discover:` block); the `arch`
            base + `arch-builder` are bare-local in the same self-contained submodule
            (`import: []`) — `base: arch`. Build from
            the submodule: `cd box/arch && charly box build arch-test`.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | arch |
            | Build | pac, aur |
            | Layers | agent-forwarding, arch-pac-test, arch-aur-test |
            | Platforms | linux/amd64 |
            | Registry | ghcr.io/opencharly |
            
            ## What It Tests
            
            - **`pac:` format** (via arch-pac-test) — installs `neovim` and `ripgrep` from official Arch repos
            - **`aur:` format** (via arch-aur-test) — installs `yay-bin` from the AUR using arch-builder
            
            ## Quick Start
            
            ```bash
            charly box build arch-test
            charly shell arch-test
            ```
            
            ## Verification
            
            ```bash
            charly shell arch-test -c "nvim --version"     # pac: package installed
            charly shell arch-test -c "rg --version"       # pac: package installed
            charly shell arch-test -c "which yay"          # aur: package installed
            ```
            
            ## Related
            
            - `/charly-distros:arch` — base image
            - `/charly-distros:arch-builder` — builder image (provides yay for AUR builds)
            - `/charly-distros:arch-pac-test` — pacman test candy
            - `/charly-distros:arch-aur-test` — AUR test candy
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves building or troubleshooting the arch-test box, or validating Arch Linux package format support.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

cachyos-pacstrap-skill:
    skill:
        name: cachyos-pacstrap
        family: distros
        owner: charly-distros
        description: |-
            Bootstrap-from-scratch CachyOS rootfs via pacstrap inside a privileged builder.
            Builds end-to-end as of charly 2026.141.1850 (shared pacstrap renderer emits
            Architecture + SigLevel); retained for offline/air-gapped builds. Lives in the
            opencharly/distro-cachyos submodule (box/cachyos).
            MUST be invoked before building or troubleshooting cachyos-pacstrap.
        content: |
            # cachyos-pacstrap
            
            Bootstrap-from-scratch CachyOS root filesystem, built via `pacstrap` inside the
            privileged `/charly-distros:cachyos-pacstrap-builder` container
            (`from: builder:pacstrap`, `bootstrap_builder_image: cachyos-pacstrap-builder`).
            
            > **Lives in `opencharly/distro-cachyos`** (git submodule at `box/cachyos`). Build:
            > `charly -C box/cachyos box build cachyos-pacstrap`.
            
            ## When to use it (and when not)
            
            The canonical CachyOS base (`/charly-distros:cachyos`) pulls the upstream-published
            OCI image from Docker Hub — that is the recommended path and the one the CachyOS
            project itself uses. This pacstrap variant exists for **offline / air-gapped**
            builds and as a worked example of the `from: builder:pacstrap` +
            `bootstrap_builder_image:` pattern.
            
            ## pacstrap x86_64_v3 + SigLevel (fixed)
            
            Earlier this path was unusable: the privileged pacstrap step rejected the
            CachyOS `x86_64_v3` packages (`package architecture is not valid`) and, on the
            VM path, tripped GPGME signature checks (`GPGME error: No data`). **Fixed as of
            charly 2026.141.1850** by the shared `renderPacstrapExtraConf` helper
            (`candy/plugin-vm/vm_bootstrap_engine.go:57`,
            used by both `runPrivilegedBootstrap` and the VM bootstrap engine — the former
            `charly/build.go`/`charly/vm_bootstrap.go` are DELETED, K-wave 2):
            
            1. it derives an `[options] Architecture = x86_64 x86_64_v3` directive from the
               cachyos-v3 repos' microarch token, so pacman accepts `linux-cachyos` etc.;
            2. it emits each repo's `SigLevel` — the VM bootstrap path previously open-coded
               the loop and dropped `SigLevel`, so `SigLevel = Never` cachyos repos fell
               back to signature-required and GPGME failed. Both paths now share one renderer
               (R3), so they can't diverge again.
            
            Verified live: `charly -C box/cachyos box build cachyos-pacstrap` produces a
            rootfs with `linux-cachyos` (`%ARCH% = x86_64_v3`) installed. (Requires an `charly`
            with this fix — newer than the published release.) The Docker-Hub `/charly-distros:cachyos`
            base is still the faster default (no privileged build).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | From | builder:pacstrap |
            | bootstrap_builder_image | cachyos-pacstrap-builder |
            | Distro | cachyos, arch |
            | Build | pac |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            The `cachyos` distro config (pacstrap base packages, CachyOS keyring
            `F3B607488DB35A47`, mirrorlist, `cachyos*` repos) lives in the embedded build
            vocabulary (`charly/charly.yml`, baked into the `charly` binary) and is resolved
            by name whenever a box declares `distro: cachyos`.
            
            ## Cross-References
            
            - `/charly-distros:cachyos` — the recommended Docker-Hub base
            - `/charly-distros:cachyos-pacstrap-builder` — the privileged builder it uses
            - `/charly-vm:cachyos-bootstrap-vm` — the VM built via the same pacstrap path
            
            ## When to Use This Skill
            
            **MUST be invoked** before building or debugging the CachyOS pacstrap rootfs.
            Invoke BEFORE reading source code or launching Explore agents.

cachyos-pacstrap-builder-skill:
    skill:
        name: cachyos-pacstrap-builder
        family: distros
        owner: charly-distros
        description: |-
            Privileged pacstrap builder image for bootstrapping a CachyOS rootfs from
            scratch. base: arch.arch (via the `arch` import namespace) + the pacstrap-builder
            candy. Lives in the opencharly/distro-cachyos submodule (box/cachyos).
            MUST be invoked before building or troubleshooting cachyos-pacstrap / cachyos-vm.
        content: |
            # cachyos-pacstrap-builder
            
            Privileged builder image used to bootstrap a CachyOS root filesystem via
            `pacstrap` inside a container. It is the `bootstrap_builder_image:` for
            `/charly-distros:cachyos-pacstrap` and the `builder_image:` for the
            `/charly-vm:cachyos-bootstrap-vm` VM.
            
            > **Lives in `opencharly/distro-cachyos`** (git submodule at `box/cachyos`). It is
            > `base: arch.arch` — the `arch` base from the **`opencharly/distro-arch`** submodule,
            > reached because the cachyos `charly.yml` imports that submodule under the `arch`
            > namespace. Its single candy, `pacstrap-builder`, lives in the main repo
            > (shared with `/charly-distros:arch-builder`'s pacstrap path) and is pulled by git
            > reference.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | `arch.arch` (from the `opencharly/distro-arch` submodule, via the `arch` import namespace) |
            | Layer | pacstrap-builder (`@github.com/opencharly/charly/candy/pacstrap-builder:<tag>`) |
            | Distro | arch |
            | Build | pac |
            | Home repo | opencharly/distro-cachyos (`box/cachyos`) |
            
            ## Quick Start
            
            ```bash
            charly -C box/cachyos box build cachyos-pacstrap-builder
            ```
            
            This is the R10 canary for the submodule's composition machinery: a successful
            build proves the `arch` import namespace resolves the `arch` base from the
            `opencharly/distro-arch` submodule, the git-ref'd `pacstrap-builder` candy
            materializes, and the embedded build vocabulary (pacstrap builder definition +
            cachyos distro config) is reachable.
            
            `charly check box cachyos-pacstrap-builder` runs the build-scope check: 4 probes pass
            (`/usr/sbin/pacstrap`, `arch-install-scripts` installed, `/usr/sbin/grub-install`,
            `/usr/sbin/parted`) — i.e. the pacstrap toolchain the builder must ship.
            
            ## Cross-References
            
            - `/charly-distros:cachyos` — the Docker-Hub CachyOS base (sibling, no pacstrap)
            - `/charly-distros:cachyos-pacstrap` — the rootfs this builder bootstraps
            - `/charly-vm:cachyos-bootstrap-vm` — the VM that uses this as `builder_image:`
            - `/charly-distros:arch` / `/charly-distros:arch-builder` — the Arch base + builder it mirrors
            
            ## When to Use This Skill
            
            **MUST be invoked** when building or debugging the CachyOS pacstrap path.
            Invoke BEFORE reading source code or launching Explore agents.

charly-fedora-skill:
    skill:
        name: charly-fedora
        family: distros
        owner: charly-distros
        description: |-
            Fedora box with the full charly toolchain using shared candies. Rootless-first —
            runs as uid=1000 with passwordless sudo (no root, no cap_add: ALL). Same candy
            list as charly-arch. Includes NVIDIA GPU runtime.
            MUST be invoked before building, deploying, configuring, or troubleshooting
            the charly-fedora box.
        triggers:
            - "Fedora images / `fedora*` / `box/fedora` submodule (incl. the GPU base `nvidia` / `python-ml` + `sway-browser-vnc`)"
        content: |
            # charly-fedora
            
            Fedora container with the full charly toolchain. Uses almost the same
            candy list as `/charly-coder:charly-arch` — the tag system handles
            Fedora-specific packages and scripts via `rpm:` sections. Supports
            nested containers at any depth via `/charly-distros:container-nesting`.
            
            Lives in the **`opencharly/distro-fedora`** repo (git submodule at **`box/fedora`**).
            Its `fedora` base is bare-local in the same self-contained submodule
            (`import: []`) — `base: fedora`; its
            candies (incl. the `nvidia` candy) are pulled by github reference. Build from the
            submodule: `charly -C box/fedora box build charly-fedora`. Deploy-mode verbs work
            from anywhere once the image is in local storage.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | fedora (quay.io/fedora/fedora:43) |
            | Tags | `[all, rpm, fedora, fedora:43]` |
            | Layers | agent-forwarding, charly, golang, gh, sshd, container-nesting, nvidia |
            | Platforms | linux/amd64 |
            | UID / user | **1000 / user** (rootless-first) |
            | Network | host |
            | Security | layer-level only (from `/charly-distros:container-nesting`) |
            | Registry | ghcr.io/opencharly |
            
            ### Rootless-first posture
            
            Runs as uid=1000 / `user` with no added capabilities. The
            `/charly-distros:container-nesting` kernel RCA establishes that
            `unmask=/proc/*` + subuid/subgid delegation is sufficient for rootless
            nested containers + rootless libvirt VMs, so this box — like its
            power-user siblings (`/charly-coder:charly-arch`, `/charly-coder:fedora-coder`,
            `/charly-distros:githubrunner`) — needs no `cap_add: [ALL]` or
            `label=disable` / `seccomp=unconfined`.
            
            The `/charly-coder:sshd` candy installs `/etc/sudoers.d/charly-user` with
            passwordless sudo for `user`, so anything that genuinely needs root
            is one `sudo` prefix away. Default user for every process is uid=1000.
            
            Resolved OCI security label:
            
            | Field | Value |
            |---|---|
            | `cap_add` | **(empty)** |
            | `security_opt` | `[unmask=/proc/*]` (from `/charly-distros:container-nesting`) |
            | `devices` | `[/dev/fuse, /dev/net/tun]` (from `/charly-distros:container-nesting`) |
            | `privileged` | `false` |
            
            See `/charly-openclaw:openclaw-desktop` (streaming-desktop sibling) and
            `/charly-coder:fedora-coder` (kitchen-sink dev sibling) for other boxes
            sharing this posture, and `/charly-distros:container-nesting` for the
            kernel `mount_too_revealing()` RCA.
            
            ### Why still `network: host`
            
            `charly-fedora` uses host networking (unlike `charly-arch`, which uses bridge)
            so the box can reach host services and the host namespace directly.
            charly-mcp's MCP URL rewriting (`candy/plugin-mcp/resolve.go`, the host-port
            mapping via the `cc.ResolveEndpoint` reverse-leg) handles host-networked containers via
            `HostConfig.NetworkMode=host` detection (see `sdk/kit/checkvars.go`'s
            `ContainerInspection.IsHostNetworked()`), so host networking does not break
            MCP URL rewriting. If you want charly-mcp on charly-fedora, compose it
            into the candy list — it will work on either networking mode.
            
            ## What's Installed
            
            Full charly toolchain via shared candies:
            
            - **charly** — the full toolchain: charly binary + VM tools (qemu-kvm, qemu-img, libvirt tools) + gocryptfs + socat + gvisor-tap-vsock + podman-machine
            - **golang** — Go compiler (`golang-bin`)
            - **gh** — GitHub CLI + `git` + `git-lfs` (single-responsibility; see `/charly-coder:gh`)
            - **sshd** — SSH server/client (`openssh-server`, `openssh-clients`) + passwordless sudo for `user`
            - **container-nesting** — buildah, fuse-overlayfs, shadow-utils, skopeo, tailscale, libsecret + nested container config (Tailscale from `tailscale-stable` repo)
            - **nvidia** — nvidia-container-toolkit, libva-nvidia-driver (from negativo17 repo; driver libs provided by CDI at runtime)
            
            ## Lifecycle
            
            ```bash
            # Build (from the opencharly/distro-fedora submodule)
            charly -C box/fedora box build charly-fedora
            
            # Interactive shell (as uid=1000)
            charly shell charly-fedora
            
            # Run a command
            charly shell charly-fedora -c "charly version"
            charly shell charly-fedora -c "sudo -n whoami"    # root (passwordless)
            
            # Start as service
            charly start charly-fedora
            charly status charly-fedora
            charly stop charly-fedora
            ```
            
            ## Nested Containers
            
            Rootless podman works inside charly-fedora at any nesting depth. The
            `/charly-distros:container-nesting` candy provides the config + env vars +
            subuid/subgid delegation per the podman/stable recipe:
            
            ```bash
            # Level 1: run containers inside charly-fedora
            charly shell charly-fedora -c "podman run --rm quay.io/libpod/alpine:latest echo hello"
            
            # Level 2: run charly inside charly-fedora inside charly-fedora
            charly shell charly-fedora -c "charly shell charly-fedora -c 'charly version'"
            ```
            
            Use `quay.io/libpod/alpine:latest` instead of
            `docker.io/library/alpine` to dodge Docker Hub rate limits.
            
            ## GPU Support
            
            The `/charly-distros:nvidia` candy provides NVIDIA GPU runtime:
            
            - `nvidia-container-toolkit` — CDI spec generation (driver userspace libs provided by CDI at runtime, matching host kernel module)
            - `libva-nvidia-driver` — VA-API acceleration
            
            `charly` triggers CDI regeneration plugin-side (`pluginEnsureCDI` in
            `candy/plugin-preempt/holder_dispatch.go`, via `spec.GpuSwitchActionEnsureCDI` — the
            former in-core `EnsureCDI()` shim is DELETED, K-wave 2 cone R3) before launching GPU
            containers. GPU access works at any nesting depth.
            
            ## Verification
            
            ```bash
            charly shell charly-fedora -c "id"                  # uid=1000(user)
            charly shell charly-fedora -c "sudo -n whoami"      # root
            charly shell charly-fedora -c "charly version"
            charly shell charly-fedora -c "charly doctor"
            charly shell charly-fedora -c "podman info"
            charly shell charly-fedora -c "podman run --rm quay.io/libpod/alpine:latest echo OK"
            charly shell charly-fedora -c "which nvidia-ctk"
            
            # Verify OCI tags
            charly box inspect charly-fedora --format tags
            # ["all","rpm","fedora","fedora:43"]
            ```
            
            ## Unified with charly-arch
            
            Both `charly-fedora` and `/charly-coder:charly-arch` use the exact same candy
            list. The tag system (`build: [rpm]` + `distro: ["fedora:43", fedora]`
            vs `build: [pac]` + `distro: [arch]`) selects the right packages
            and scripts per distro.
            
            ## Key Candies
            
            - `/charly-tools:charly` — the full toolchain: charly binary plus VM/encryption tools
            - `/charly-distros:container-nesting` — nested rootless podman/buildah (authoritative RCA for `mount_too_revealing()` + `unmask=/proc/*`)
            - `/charly-coder:sshd` — SSH daemon + passwordless sudo for `user`
            - `/charly-coder:gh` — GitHub CLI + git + git-lfs (owns all git tooling)
            - `/charly-distros:nvidia` — NVIDIA GPU runtime
            
            ## Related Boxes
            
            - `/charly-distros:fedora` — parent base image
            - `/charly-coder:charly-arch` — Arch counterpart, same layers, same rootless posture
            - `/charly-coder:fedora-coder` — kitchen-sink dev sibling (adds coding CLIs + DevOps)
            - `/charly-openclaw:openclaw-desktop` — streaming-desktop counterpart (charly toolchain + browser-accessible Wayland); shares the rootless-first posture

charly-image:
    candy:
        version: 2026.218.1200
        description: |-
            Concept candy owning the charly-image kind-authoring skills (image/layer schema). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the image concept candy's skill entities are present and generated into plugins/image/skills
              id: charly-image-present
              context:
                - build
              command: "true"
image-skill:
    skill:
        name: image
        family: image
        owner: charly-image
        description: |-
            MUST be invoked before any work involving: the `charly box` command family, box definitions in charly.yml, box inheritance, defaults, platforms, builder configuration, the box dependency graph, or the build/deploy scope boundary.
        triggers:
            - "Editing a box (`box/<name>/charly.yml` \u2014 boxes live in the `box/<distro>` submodules; main owns none), box composition"
        content: |
            # charly box -- Family Overview + Image Composition

            ## Overview

            `charly box` is the **only** command family that reads `charly.yml`. It groups
            every build-mode operation (build, generate, validate, list, merge, new,
            inspect, pull) under a single namespace. All other `charly` commands read
            exclusively from OCI labels embedded into built images + `charly.yml` for
            deployment overrides.

            Build-mode operations live only under `charly box`. Top-level invocations like
            `charly build`, `charly validate`, `charly list boxes`, or `charly inspect` return Kong's
            `unexpected argument` error.

            A **box** is an **image** — a named build target in `charly.yml`. Boxes compose
            candies into container images with configurable defaults, inheritance chains,
            platform targets, and builder configurations. The `charly` CLI resolves
            dependencies, generates Containerfiles, and builds images in the correct
            order.

            **Authoring rule (MUST).** An IMAGE MUST be authored as a `candy:` node carrying
            `base:` (an external base distro / OCI ref) **or** `from:` (a builder ref, e.g.
            `from: builder:pacstrap`) — there is **no `box:` KIND**. A `candy:` node carrying
            neither `base:` nor `from:` is a **LAYER** fragment (see `/charly-image:layer`).
            The `charly box` COMMAND family (build / validate / generate / inspect / list /
            merge / labels) is UNCHANGED — it operates on images (candies carrying `base:`/
            `from:`); only the YAML `box:` KIND keyword was removed. The `box/<name>/` and
            `candy/<name>/` discovery directories, and the `BoxConfig` / `uf.Box` Go types
            backing images, are likewise unchanged — a `candy:` node routes to `uf.Box`
            (image) or `uf.Candy` (layer) by the presence of `base:`/`from:`.

            ## The `charly box` Command Family

            | Subcommand | Purpose | Skill |
            |---|---|---|
            | `charly box build` | Build container images from charly.yml | `/charly-build:build` |
            | `charly box generate` | Write `.build/` Containerfiles | `/charly-build:generate` |
            | `charly box inspect` | Print resolved image config as JSON | `/charly-build:inspect` |
            | `charly box list {boxes,candies,targets,services,routes,volumes,aliases}` | List components from charly.yml | `/charly-build:list` |
            | `charly box merge` | Merge small layers in a built image | `/charly-build:merge` |
            | `charly box new candy <name>` | Scaffold a new candy directory | `/charly-build:new` |
            | `charly box pull` | Fetch an image into local storage | `/charly-build:pull` |
            | `charly check box` | Run declarative tests against a disposable container from a built image (reads the baked plan from the `ai.opencharly.description` OCI label) | `/charly-check:check` |
            | `charly box validate` | Check charly.yml + layers | `/charly-build:validate` |

            ## Scope Boundary (Build vs. Deploy)

            | | Reads `charly.yml` | Reads OCI labels | Reads `charly.yml` |
            |---|---|---|---|
            | `charly box …` | **Yes** (required) | Rarely | No |
            | Everything else | **No** | Yes (required for deploy-mode) | Yes (overlay) |

            If a new command needs to resolve candy dependencies, box inheritance, or
            registry tag configuration, it must live under `charly box`. Any command that
            operates on a running container or deployed image must go through
            `ExtractMetadata` (labels) + charly.yml — never `LoadConfig`.

            When a deploy-mode command is run against an image that isn't in local
            storage, `ExtractMetadata`/`EnsureImage` return `ErrImageNotLocal` and the
            top-level error handler renders: *"image 'X' is not available locally. Run
            'charly box pull X' to fetch it first."* See `/charly-build:pull` for the full sentinel
            pattern.

            ## Project directory resolution

            Every `charly box …` command resolves `charly.yml` (and `candy/`, imported files, etc.) **relative to the current working directory** — internally via `os.Getwd()` on every entry point. Five ways to override that default — three local, two remote:

            ```bash
            # Local project — pick a directory on disk:
            charly -C /path/to/opencharly box list boxes          # short flag
            charly --dir /path/to/opencharly box list boxes       # long flag
            CHARLY_PROJECT_DIR=/path/to/opencharly charly box list boxes   # env var

            # Remote project — clone (or hit cache) and chdir into it:
            charly --repo opencharly/charly box list boxes        # bare owner/repo → github.com/owner/repo@<default-branch>
            charly --repo opencharly/charly@main box list boxes   # pinned ref
            charly --repo default box list boxes                      # literal "default" → opencharly/charly
            CHARLY_PROJECT_REPO=opencharly/charly charly box list boxes
            ```

            `--repo` and `--dir` are mutually exclusive (passing both exits with `charly: --repo and --dir are mutually exclusive`). All five paths are declared on the top-level `CLI` struct in `charly/main.go`, and the cwd move is a single `os.Chdir(cli.Dir)` call **before** Kong dispatches the subcommand, so every existing `os.Getwd()` site picks up the new cwd — no per-command plumbing needed.

            **`--repo` additionally resolves EARLIER, in the pre-parse prescan** (`projectDirPreParse`, `charly/plugin_command_prescan.go`). The chdir above happens after `kong.Parse`, which has already FROZEN the grammar — so a command word that exists only in the `--repo` target would never be registered, and `charly --repo <owner/repo> <word>` reported an unknown verb. Reading `charly.yml` worked (that is after the chdir); finding the verb did not. Resolution there is attempted only when the flag or env var is present, so a bare invocation never touches the network, and an unresolvable spec falls through to cwd so the local grammar survives.

            **Repo spec normalization** (`spec.NormalizeRepoSpec`, `spec/spec/repo_identity.go` — the former `charly/main_repo.go` is DELETED, K-wave 2):

            - `default` → `github.com/opencharly/charly` at the default branch
            - bare `owner/repo` → `github.com/owner/repo` (auto-prefix when first segment has no dot)
            - bare `owner/repo@ref` → pinned to `ref`
            - `host.tld/owner/repo[@ref]` → used literally (the dot in the host disambiguates)

            Remote repos are cloned into `~/.cache/charly/repos/<repoPath>@<version>/` (override via `CHARLY_REPO_CACHE`). The cache is shared with the existing remote-layer fetcher (`sdk/loaderkit`'s refs seams — the former `charly/refs.go`/`charly/refs_git.go` are DELETED, K-wave 2) — both go through `EnsureRepoDownloaded`.

            **Canonical use case**: running `charly mcp serve` inside a container. The container's cwd is `/workspace` (set by the `charly-mcp` layer's env + volume declaration). There are three deployment patterns, in order of progressively less local setup:

            1. **Bind-mount** — the canonical `charly-mcp` pattern. Host project bind-mounted to the container's `/workspace`; volume NAME stays `project` for a stable deployer API. Use this when you want the agent to read your in-flight local edits.

               ```bash
               charly config charly-arch --bind project=/home/you/opencharly
               charly start charly-arch
               charly check live charly-arch --filter mcp   # the baked mcp: call box.list.boxes step
               ```

            2. **Remote pin** — set `CHARLY_PROJECT_REPO=opencharly/charly@<sha-or-ref>` in the container env. The agent reads from a pinned upstream version. No bind mount required.

            3. **Auto-default** — `charly mcp serve` with no `charly.yml` reachable at cwd silently falls back to `github.com/opencharly/charly`. The fallback fires whenever cwd lacks `charly.yml`, regardless of whether `CHARLY_PROJECT_DIR` is set (the `charly-mcp` layer permanently sets `CHARLY_PROJECT_DIR=/workspace`, so a fallback gated on the env var being empty would never fire). Pass `--no-default-repo` on the serve command to opt out. Only `charly mcp serve` auto-fetches; the top-level CLI stays opt-in.

            The error messages are explicit when misconfigured: `cannot chdir to --dir "/missing": no such file or directory`. See `/charly-build:charly-mcp-cmd` "Deployment: the `charly-mcp` layer" for the full bind-mount pattern and `/charly-internals:go` "main.go" for the implementation note (guarded by `TestCharlyDir_FlagChdir` + `TestCharlyDir_Errors` in `main_dir_test.go`, and `TestNormalizeRepoSpec` + `TestCharlyRepo_*` in `main_repo_test.go`).

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | List boxes | `charly box list boxes` | Boxes from charly.yml |
            | List build targets | `charly box list targets` | Build targets in dependency order (includes auto-intermediates) |
            | Inspect image | `charly box inspect <image>` | Print resolved config as JSON |
            | Inspect field | `charly box inspect <image> --format <field>` | Print single field (tag, base, layers, ports, etc.) |
            | Validate | `charly box validate` | Check charly.yml + layers |
            | Pull into local storage | `charly box pull <image>` | Fetch from registry so deploy-mode commands work |
            | Run build-time tests | `charly check box <image>` | Runs the baked `check:` steps in a disposable `podman run --rm` container (`context: [build]` steps only). For full-stack live check against a running deployment, use `charly check live <name>`. See `/charly-check:check`. |
            | Pre-prime remote repo cache | `charly box fetch [<spec>]` | Clones (or hits cache) for the spec — defaults to `default` (opencharly/charly). Prints the cache path. |
            | Force re-clone | `charly box refresh [<spec>]` | Removes the cache entry and re-clones. |

            ### Authoring (the MCP-first surface)

            Each verb below is also auto-exposed as an MCP tool (`box.new.project`, `box.new.box`, `box.set`, `box.add-candy`, `box.rm-candy`, `box.write`, `box.cat`, `candy.set`, `candy.add-rpm`, …) via the `charly __cli-model` reflection seam (`charly/cli_model_cmd.go`) consumed by the externalized MCP server (`candy/plugin-mcp` `command:mcp`). So an LLM agent driving `charly mcp serve` can author a project from scratch over RPC.

            | Action | Command |
            |--------|---------|
            | Scaffold a fresh project | `charly box new project <dir>` |
            | Add a box entry | `charly box new box <name> --base <ref> --candy <a,b,c>` |
            | Add a candy dir (stub `charly.yml`) | `charly box new candy <name>` |
            | Edit a value in `charly.yml` | `charly box set <dotpath> <yaml-value>` |
            | Append a candy to a box | `charly box add-candy <image> <layer>` |
            | Remove a candy from a box | `charly box rm-candy <image> <layer>` |
            | Edit a value in `candy/<name>/charly.yml` | `charly candy set <name> <dotpath> <yaml-value>` |
            | Append rpm/deb/pac/aur packages to a candy | `charly candy add-rpm <name> <pkg…>` (and `add-deb`, `add-pac`, `add-aur`) |
            | Write any file under the project root | `charly box write <rel-path> [--content X \| --from-stdin]` |
            | Read any file under the project root | `charly box cat <rel-path>` |

            **Safety boundary**: `charly box write` / `charly box cat` resolve the path against `os.Getwd()` (the project root) and reject absolute paths or `..` traversal that would escape the root. They are the deliberate escape hatch for free-form auxiliary files (`pixi.toml`, `package.json`, `root.yml`, `*.service`, scripts) that the schema-aware setters don't cover.

            **Comment preservation**: every YAML edit (`set`, `add-layer`, `rm-layer`, `add-rpm`, etc.) goes through the `yaml.v3` *node* API rather than the value API, so human-authored comments and key order are preserved across edits. Tested in `sdk/kit/yaml_test.go` and `sdk/kit/scaffold_test.go` (the former `charly/scaffold_project_test.go` is DELETED, K-wave 2).

            **Project scaffold contents**: `charly box new project` writes a minimal `charly.yml` with `discover: [box, candy]` + empty `box/`/`candy/` dirs. The default distro/builder/init/resource build vocabulary (and the default sidecar templates) are EMBEDDED in the `charly` binary (`charly/charly.yml`, `//go:embed` — the single embedded default config, plain compact-node-form YAML parsed by the same unified loader as any project `charly.yml`), so a new project is immediately usable with no build vocabulary to copy; declare `distro:`/`builder:`/`init:`/`resource:`/`sidecar:` (inline in `charly.yml` or an imported vocab file) only to extend or override the embedded default.

            ## charly.yml Structure

            ```yaml
            defaults:
              registry: ghcr.io/opencharly
              tag: auto                    # CalVer: YYYY.DDD.HHMM
              platform:
                - linux/amd64
                - linux/arm64
              build: [rpm]
              builder:                     # build type → builder image
                pixi: fedora-builder
                npm: fedora-builder
                cargo: fedora-builder
              merge:
                auto: false
                max_mb: 128

            # Every image is a compact name-first node: the single `candy:` kind key (an
            # image carries `base:`/`from:`) holds the COMPLETE body — scalars, the
            # build-vocabulary fields (base / version / builder / produce / platform /
            # build / description), AND every collection (distro identity tags, candy
            # composition, env, security) inline.
            fedora:
              candy:
                base: "quay.io/fedora/fedora:43"
                distro: ["fedora:43", fedora]

            fedora-builder:
              candy:
                base: fedora
                produce: [pixi, npm, cargo]  # declares what this builder can build
                candy:
                  - pixi
                  - nodejs
                  - build-toolchain

            my-app:
              candy:
                base: fedora
                env_file: "~/.config/my-app/.env"
                candy:
                  - traefik
                  - my-service          # declares service: — the init is injected, not listed here.
                                        # Published ports are inherited from the candies (no box `port:`)
                env:
                  MY_VAR: value
                security:
                  cap_add: [SYS_PTRACE]
            ```

            ## Inheritance Chain

            Every setting resolves through: **image -> defaults -> hardcoded fallback** (first non-null wins).

            | Field | Default | Description |
            |-------|---------|-------------|
            | `enabled` | `true` | Set `false` to disable (skipped by generate, validate, list) |
            | `version` | `""` | OPTIONAL dedicated CalVer (`YYYY.DDD.HHMM`). When set it IS the image's `ai.opencharly.version` label; when unset the label is derived as the highest layer version across the chain (`EffectiveVersion`, `deploykit.ComputeEffectiveVersions`). Layered images leave it unset (they derive — keeps the label content-stable); a layerless bare base on an EXTERNAL registry base needs it (else the label can't be derived) — `charly migrate` backfills those |
            | `base` | `quay.io/fedora/fedora:43` | External OCI image or name of another box |
            | `bootc` | `false` | Adds `bootc container lint`, enables disk image builds |
            | `platform` | `["linux/amd64", "linux/arm64"]` | Target architectures |
            | `tag` | `"auto"` | Image tag. `"auto"` for CalVer |
            | `registry` | `""` | Container registry prefix |
            | `distro` | `[]` | Distro identity tags in priority order: `["fedora:43", fedora]`. For packages: first matching section wins (override). For plan steps: additive. Inherited from base image |
            | `build` | `["rpm"]` | Package formats tied to builder definitions: `[rpm]` or `[pac, aur]`. ALL formats installed in order. Valid: rpm, deb, pac, aur. Inherited from base image |
            | `candy` | `[]` | Candy composition list (image-specific, not inherited) |
            | `user` | `"user"` | Username for non-root operations. See `user_policy:` — may be overridden at resolve time when adopt mode fires |
            | `uid` | `1000` | User ID (may be overridden by `base_user:` under adopt) |
            | `gid` | `1000` | Group ID (may be overridden by `base_user:` under adopt) |
            | `user_policy` | `"auto"` | How to reconcile `user:` against the base image's pre-existing uid-1000 account. Values: `auto` / `adopt` / `create`. See "user_policy" section below |
            | `merge` | `null` | Layer merge settings |
            | `alias` | `[]` | Command aliases |
            | `builder` | `{}` | Build type → builder image map (inherited from base image + defaults). Keys match the embedded `builder:` vocabulary — e.g., `builder.pixi` selects which image to use as the pixi builder |
            | `produce` | `[]` | What this builder image can build: `pixi`, `npm`, `cargo`, `aur` (not inherited) |
            | `env` | `{}` | Runtime env vars — a MAP (`env: {KEY: value}`). Not inherited from defaults |
            | `env_file` | `""` | Path to `.env` file for runtime injection. Not inherited |
            | `security` | `null` | Container security options. Overrides layer-level security |
            | `network` | `string` | Container network mode (default: shared `charly` network; set `host` for host networking) |

            VM-related fields (`vm`, `libvirt`) are not valid on `candy:` image entries — the loader rejects them. VMs are declared as `kind: vm` entities in `vm.yml` — see `/charly-vm:vms-catalog` for authoring. `bootc: true` stays on a `candy:` image entry (marks the image as a bootable container); a separate `kind: vm` entity with `source.kind: bootc` references it. A config still carrying the removed on-image `vm:`/`libvirt:` fields predates the schema floor and must be re-authored (see `/charly-build:migrate`).

            ## Builder and Builds

            Builder images provide build tools (pixi, npm, cargo, yay) for multi-stage builds without bloating final images. Three fields control this:

            - **`builder:`** on images — map of build type → builder image name. Inherited: image → base image → defaults → `{}`. The keys (`pixi`, `npm`, `cargo`, `aur`) match entries in the embedded `builder:` vocabulary — intentionally the same word, because both maps key on the same slot.
            - **`produce:`** on builder images — list declaring what the builder can build. Not inherited.
            - **`build:`** — package formats tied to builder definitions (`rpm`, `deb`, `pac`, `aur`). ALL formats installed in order. Inherited from base image. Default: `[rpm]`.
            - **`distro:`** — distro identity tags in priority order (`["fedora:43", fedora]`). First matching section overrides packages. Inherited from base image.

            ```yaml
            defaults:
              builder:
                pixi: fedora-builder
                npm: fedora-builder
                cargo: fedora-builder

            fedora-builder:
              candy:
                base: fedora
                produce: [pixi, npm, cargo]
                candy: [pixi, nodejs, build-toolchain]

            arch:
              candy:
                base: "quay.io/archlinux/archlinux:base-20260525.0.535911"
                build: [pac]
                builder:
                  pixi: arch-builder
                  npm: arch-builder
                  cargo: arch-builder
                  aur: arch-builder
                distro: [arch]

            arch-builder:
              candy:
                base: arch              # inherits build: [pac] AND builder: from arch
                produce: [pixi, npm, cargo, aur]
                candy: [pixi, nodejs, build-toolchain, yay]

            arch-test:
              candy:
                base: arch              # inherits builder: from arch
                build: [pac, aur]       # override to add aur format
                candy: [arch-pac-test, arch-aur-test]
            ```

            Each build type resolves its builder independently: **`box.builder[type]` → `base_box.builder[type]` → `defaults.builder[type]` → `""`**. This means you can use `fedora-builder` for pixi but `arch-builder` for npm on the same image.

            Self-reference protection: after merging defaults/base, any `builder` entry pointing to the image itself is filtered out. Builder images can't use themselves as builders.

            Validation checks that every builder referenced in `builder:` declares the matching capability in `produce:`.

            Source: `sdk/deploykit/order.go` (`BuilderRefForFormat`), `sdk/deploykit/graph.go` (`ResolveBoxOrder`, `BoxNeedsBuilder` — the former thin `charly/graph_shim.go` wrappers are DELETED, K-wave 2), `candy/plugin-box/validate_graph.go` (`validateBuilders`).

            ## Internal Base Images

            When `base` references another image in `charly.yml`, the generator resolves it to the full registry/tag and creates a build dependency. The referenced image must be built first.

            ```yaml
            fedora:
              candy:
                base: "quay.io/fedora/fedora:43"

            my-app:
              candy:
                base: fedora        # References fedora image above
                candy: [my-layer]
            ```

            ## user_policy: adopt vs create

            `user_policy:` cleanly handles base images that ship a pre-existing uid-1000 account (notably Ubuntu 24.04's `ubuntu:ubuntu`). A plain `getent passwd $UID || useradd …` bootstrap short-circuits on such accounts, leaving the image's configured `user:` never created — sudoers, `${HOME}`, npm prefix, etc. would then break because they assume the configured name exists.

            The mechanism: a **declarative** fact (what the base image ships, in the embedded `distro.<name>.base_user:` vocabulary — see `/charly-build:build`) + an **image-level policy** (how to reconcile with the image's `user:` field).

            ### Policy values

            | Policy | Behavior | Failure mode |
            |--------|----------|--------------|
            | `auto` (default) | If `base_user:` is declared for the image's distro AND the image didn't explicitly set `user:`, adopt the base_user. Otherwise create the configured user. | Never fails — falls through gracefully. |
            | `adopt` | Always adopt. Error if the distro has no `base_user:` declaration. | Hard error at config resolve time. Use when you specifically need to lock adopt semantics. |
            | `create` | Always create the configured user. | Build fails if `useradd` collides (should never happen on a "create" distro). |

            ### Decision matrix per base image

            | Base image | `base_user` declared? | `user_policy: auto` outcome | Resolved user |
            |---|---|---|---|
            | `/charly-distros:fedora` | no | create | `user` |
            | `/charly-distros:arch` | no | create | `user` |
            | `/charly-distros:debian` | no | create | `user` |
            | `/charly-distros:ubuntu` | **yes** (`ubuntu:1000:/home/ubuntu`) | adopt | `ubuntu` |

            This is why `ubuntu-coder`'s resolved identity is `ubuntu:/home/ubuntu` while the other three coder images are `user:/home/user`. The charly.yml for all four coder images is identical on the user-related fields (no explicit `user:`); the policy + base_user together decide the outcome.

            ### How resolution flows (`sdk/buildkit/config_resolve.go` `ResolveBox`)

            1. Resolve `User`, `UID`, `GID` from defaults → image overrides → hardcoded fallback `user` / `1000` / `1000`.
            2. Load the distro config (`DistroConfig` from the embedded build vocabulary), resolve the image's `DistroDef` by walking `distro:` tags.
            3. Apply `user_policy`:
               - `adopt` → overwrite User/UID/GID/Home with the distro's `BaseUser`, set `ResolvedBox.UserAdopted = true`.
               - `auto` → same overwrite IF `base_user` exists AND the image didn't explicitly set `user:`.
               - `create` → no-op.
            4. `WriteBootstrap` (`sdk/deploykit/bootstrap.go`, relocated from `charly/generate.go` in #67) keys on `UserAdopted`: adopt emits only a comment; create emits an idempotent `useradd` (see `/charly-build:generate`).

            ### Live verification

            ```bash
            charly box inspect ubuntu-coder | grep -E '"User"|"UID"|"Home"|UserAdopted'
            # "User": "ubuntu",
            # "UID": 1000,
            # "Home": "/home/ubuntu",
            # "UserAdopted": true,

            charly box inspect debian-coder | grep -E '"User"|"UID"|"Home"|UserAdopted'
            # "User": "user",
            # "UID": 1000,
            # "Home": "/home/user",
            # "UserAdopted": false,
            ```

            ### Layer consequences

            Adopt mode means `resolved.User` is not a stable string across distros. Layers that reference the uid-1000 account by name must NOT hardcode `user` — use `${USER}` where the generator substitutes (step fields like `run_as: ${USER}`), or use `getent passwd 1000 | cut -d: -f1` inside `command:` blocks (where the generator does NOT substitute — bash sees the script verbatim). The canonical getent example is `/charly-coder:sshd`'s sudoers step.

            See also `/charly-distros:ubuntu` (canonical adopt consumer), `/charly-build:build` "base_user:", `/charly-internals:go` "ResolvedBox.UserAdopted".

            ## External Bases Require Explicit `distro:`

            When `base` is a URL string (not the name of another image in `charly.yml`), the generator treats it as **external** and does not inherit distro tags or build formats. This is the canonical gotcha for bootc images, which typically use `quay.io/fedora/fedora-bootc:43`:

            ```yaml
            # ❌ BROKEN — no `distro:` list → Distro resolves to null, no RPM installs emitted
            my-bootc-image:
              candy:
                base: "quay.io/fedora/fedora-bootc:43"
                bootc: true
                candy: [sshd, qemu-guest-agent, ffmpeg]

            # ✓ CORRECT — explicit distro: tags matching the base, inline in the image body
            my-bootc-image:
              candy:
                base: "quay.io/fedora/fedora-bootc:43"
                bootc: true
                distro: ["fedora:43", fedora]
                candy: [sshd, qemu-guest-agent, ffmpeg]
            ```

            Symptom without `distro:`: `charly box inspect <image>` shows `"Distro": null`. The generator's install_template Phase-2 branch short-circuits on `img.DistroDef == nil`, so **no declarative package-install RUN steps are emitted**. The image builds cleanly but is missing every package from every layer that uses the declarative `distro:` package sections. Explicit `command: dnf install …` steps still run; the bug affects only the declarative package surface.

            Internal bases (`base: fedora`) inherit `distro:` and `build:` from the parent image automatically — you only need explicit tags on images whose `base:` is a URL. The `quay.io/fedora/fedora-bootc:43` example above is the canonical pattern: an external bootc base must declare its own `distro:` tags, or the generator sees `Distro: null` and emits no rpm-install RUN steps.

            ## Intermediate Images

            When multiple images share the same base and common layer prefixes, `charly` auto-generates intermediate images at branch points to maximize cache reuse.

            ```
            fedora (external)
              -> fedora-supervisord (auto: pixi + python + supervisord)
                 -> fedora-test (adds: traefik, testapi)
                 -> openclaw (adds: nodejs, openclaw)
            ```

            Auto-intermediates are marked with `Auto: true` and appear in `charly box list targets`.

            ### Algorithm

            `ComputeIntermediates()` runs during generation:
            1. `GlobalCandyOrder()` computes a deterministic layer ordering across all images, prioritizing layers by popularity (how many images need them) for cache efficiency.
            2. Images are grouped by their direct parent (base). For each sibling group with 2+ images, a **prefix trie** is built from their relative layer sequences.
            3. The trie is walked to detect branch points (where sibling layer sequences diverge). At each branch, an auto-intermediate image is created.
            4. Original images are rebased to the nearest intermediate, so shared layers are built once.

            Source: `sdk/deploykit/intermediates.go` (moved from `charly/intermediates.go`; the former `charly/intermediates_shim.go` is DELETED, K-wave 2) (`ComputeIntermediates`, `GlobalCandyOrder`, `walkTrieScoped`).

            ## Versioning

            CalVer: `YYYY.DDD.HHMM` (year, day-of-year, UTC time). Computed once per `charly box generate`.

            | `tag` value | Generated tag(s) |
            |-------------|-----------------|
            | `"auto"` | `YYYY.DDD.HHMM` + `latest` |
            | `"nightly"` | `nightly` only |
            | `"1.2.3"` | `1.2.3` only |

            Override: `charly box generate --tag <value>`.

            ## Runtime Environment Variables

            The `env` and `env_file` fields inject environment variables into containers at runtime (not build time):

            ```yaml
            my-app:
              candy:
                env_file: "~/.config/my-app/.env"
                env:                    # a MAP — the KEY=VALUE list form is gone
                  DB_HOST: localhost
                  LOG_LEVEL: info
            ```

            These are the lowest priority in the env resolution chain. CLI flags (`-e`, `--env-file`) and workspace `.env` take precedence. See `/charly-core:charly-config` and `/charly-core:start` for the full priority chain at config-time and run-time respectively.

            Source: `spec/hostenv/envfile.go` (`ResolveEnvVars`).

            ## Security Configuration

            Box-level `security:` overrides candy-level security settings:

            ```yaml
            my-app:
              candy:
                base: fedora
                security:
                  privileged: true
                  cap_add: [SYS_ADMIN]
                  devices: [/dev/fuse]
                  security_opt: [label:disable]
            ```

            Box `security.privileged` replaces the candy-derived value. `cap_add`, `devices`, `security_opt` are appended to candy-collected values (deduplicated). Applied as container run arguments at runtime (not build time).

            Source: `sdk/deploykit/security.go` (`CollectSecurity`).

            ## VM Configuration

            VMs are **not** configured on `candy:` image entries. The `vm:` and `libvirt:` fields on a `candy:` image are rejected at load time. VM primitives are declared as `kind: vm` entities in `vm.yml`:

            ```yaml
            # vm.yml (any file — the loader routes by shape, not filename)
            my-bootc-vm:
              vm:
                source:
                  kind: bootc
                  box: my-bootc-image        # `box:` source field → the `candy:` image node above (must have bootc: true)
                disk_size: 10G
                ram: 4G
                cpu: 2
                libvirt:
                  devices:
                    filesystems: [{type: mount, source: ..., target: ...}]
            ```

            See `/charly-vm:vms-catalog` for the full VmSpec schema, `/charly-vm:vm` for the `charly vm build/create/ssh` command family, and `/charly-build:migrate` for the schema floor/HEAD gate — the legacy `box.vm:` / `box.libvirt:` fields predate the floor and are no longer auto-converted, so re-author them as a `kind: vm` node.

            ## Ports — inherited from candies, auto-allocated at deploy

            **Boxes do NOT declare ports.** A box's published ports are inherited from EVERY candy in its base chain — the candy that runs a service declares the container port (the candy body's `port:` list), and `CollectBoxPorts` (`sdk/deploykit/ports_collect.go`, over the shared `boxCandyChain` walk in `sdk/kit/ports.go`) collects the full set. The same set feeds both the `ai.opencharly.port` OCI label and the Containerfile `EXPOSE` directives, so they can never diverge. A residual box-level `port:` is a hard load error pointing at `charly migrate`.

            ```bash
            charly box inspect android-emulator --format ports
            # 2222   (sshd)         3000  (selkies)      4723 (appium-server)
            # 5037   (android adb)  9222  (chrome-cdp)   9224 (chrome-devtools-mcp)
            # — all inherited from the candy chain; the box declares no `port:`
            ```

            **Host mappings are auto-allocated on `127.0.0.1` at deploy.** At `charly config`, every inherited container port without an explicit deploy pin gets a freshly-allocated free loopback host port (`ResolveDeployPorts`), persisted as `resolved_port:` and stable across `charly update`. A deploy/bed `port:` entry is a PIN (`host:container`) for specific container ports — the rest still auto-allocate. `charly status` shows the live mapping; check probes resolve it via `${HOST_PORT:N}`. See `/charly-core:deploy` and `/charly-check:check`.

            ## OCI Labels

            Every image `charly` builds carries a set of `ai.opencharly.*` OCI labels embedding the resolved image config so that `charly config` and `charly bundle` can work without the project source tree. The full list is assembled in `sdk/deploykit/write_labels.go` (emission) / read back via `ExtractMetadata` (`spec/container/box_metadata_coneb.go`) — label names in `spec/spec/label_consts.go`, the `spec.BoxMetadata` struct in `spec/schema/boxmetadata.cue` (see `/charly-internals:capabilities`):

            | Label | Contents |
            |---|---|
            | `ai.opencharly.volume` | Volume declarations from the layer chain |
            | `ai.opencharly.port` | Published container ports, **inherited from the candy chain** (`CollectBoxPorts`) — bare container ports; host mappings are auto-allocated at deploy |
            | `ai.opencharly.security` | `cap_add`, `devices`, `security_opt`, `mounts`, resource caps |
            | `ai.opencharly.env` | Runtime env keys |
            | `ai.opencharly.env_provide` | Cross-container env provides (resolved at deploy time) |
            | `ai.opencharly.env_require` | Declared env contracts (used for `charly config` hard-fail checks) |
            | `ai.opencharly.env_accept` | Opt-in allowlist for provides filtering |
            | `ai.opencharly.mcp_provide` | Cross-container MCP server provides |
            | `ai.opencharly.port_proto` | Port protocol annotations (non-default only) |
            | `ai.opencharly.platform.distro` | Distro identity (e.g. `["arch"]`) — first match picks bootstrap/format templates |
            | `ai.opencharly.platform.format` | Package formats installed (`pac`, `rpm`, `deb`, `pixi`, `aur`, …) |
            | `ai.opencharly.builder.use` | Consumer-side routing map: format → builder-image name |
            | `ai.opencharly.builder.provide` | Producer-side capability list: formats this image can build for others |

            All of the above round-trip via `charly config`: the label is read from the image manifest and applied to charly.yml + the quadlet. There is one deliberate exception.

            ### Tunnel is charly.yml-only

            The label→config apply path **explicitly skips reading** any tunnel label when resolving an image's deploy config (`charly/labels.go`, the file this behavior originally shipped in, no longer exists — the OCI-label surface relocated to `sdk/deploykit`/`spec/container`, see `/charly-internals:capabilities`; the tunnel-is-config-only RULE below is unchanged). Tunnels (Tailscale serve, Cloudflare tunnel) are treated as a **deployment** decision, not an image attribute — they live exclusively in `charly.yml`. This was the deliberate design of commit `2759124` (tunnel→charly.yml migration), motivated by three concerns:

            1. **Per-instance divergence.** One selkies-desktop image may be deployed with a Tailscale tunnel in one environment and no tunnel in another. Baking the tunnel choice into the image forecloses that.
            2. **`--update-all` safety.** Propagating config changes across deployed services must not accidentally rewrite tunnel settings from image labels and blow away per-instance overrides.
            3. **Instance inheritance gap.** Tunnel config is **not** auto-inherited from the base `charly config <image>` call to an `charly config <image> -i <instance>` call. This is a deliberate gap — see `/charly-selkies:selkies-labwc` (Multi-Instance Proxy Deployment) for the manual workaround and `/charly-core:deploy` (Instance Tunnel Inheritance) for the full lifecycle.

            **Practical implication:** you can inspect an image's tunnel declaration with `charly box inspect <image>` and see nothing useful — that's correct. To see a tunnel's actual state, read `charly.yml` directly (`charly bundle show <image>`) or the generated quadlet (`charly status <image>`).

            ## Common Workflows

            ### Add a New Image

            Add an entry to `charly.yml` with `base` and `candy`, then build:

            ```bash
            # Edit charly.yml
            # Then:
            charly box build my-new-image
            ```

            ### Layer Images (inheritance)

            Set `base` to another image name:

            ```yaml
            nvidia:
              candy:
                base: fedora
                platform: [linux/amd64]
                candy: [cuda]

            ml-workstation:
              candy:
                base: nvidia
                candy: [python-ml, jupyter]
            ```

            ### Disable an Image

            ```yaml
            experimental:
              candy:
                enabled: false
                base: fedora
                candy: [experimental-layer]
            ```

            ## Cross-References

            ### Family subcommand skills

            - `/charly-build:build` -- `charly box build` (+ the `--no-cache` intermediate scratch-stage caveat)
            - `/charly-build:generate` -- `charly box generate` (Containerfile generation including OCI label emission)
            - `/charly-build:inspect` -- `charly box inspect` (resolved OCI label set)
            - `/charly-build:list` -- `charly box list {boxes,candies,targets,services,routes,volumes,aliases}`
            - `/charly-build:merge` -- `charly box merge` (post-build layer consolidation)
            - `/charly-build:new` -- `charly box new candy <name>` (scaffold new candy directory)
            - `/charly-build:pull` -- `charly box pull` (fetch into local storage; `ErrImageNotLocal` recovery)
            - `/charly-build:validate` -- `charly box validate` (charly.yml + candies consistency check)

            ### Related skills

            - `/charly-image:layer` -- Candy definitions that compose into boxes (env_provide, env_require, env_accept, security resource caps)
            - `/charly-core:deploy` -- Deploying built images (quadlet, bootc, tunnel lifecycle, instance tunnel inheritance)
            - `/charly-core:charly-config` -- `charly config` reads OCI labels + charly.yml; tunnel is charly.yml-only
            - `/charly-internals:go` -- `LoadConfig`, `ExtractMetadata`, `EnsureImage`, `ErrImageNotLocal` source locations
            - `/charly-check:check` — Box-level plan steps (cross-candy invariants; deploy-default checks shipped with the image are `check:` steps carrying `context: [deploy]`). The plan steps are embedded in the `ai.opencharly.description` OCI label.
            - `/charly-build:charly-mcp-cmd` — if the image transitively bundles an mcp-providing candy (e.g. `jupyter`, `chrome-devtools-mcp`), the bundled candy's `mcp:` tests run as part of `charly check live <image> --filter mcp`; see the skill for per-verb details and the port-publishing gotcha.
            - `/charly-vm:vm` — `charly vm build/create/start/stop/ssh` command family; reads `vm.yml`, not `charly.yml`. Covers BIOS vs UEFI firmware, virtio-gpu video model, bootc caveats (rootful storage refresh, `-v /dev:/dev` loopback).
            - `/charly-vm:vms-catalog` — authoring reference for the `kind: vm` entity schema.
            - `/charly-build:migrate` — `charly migrate` brings a config up to the current schema (the legacy on-image `vm:`/`libvirt:` fields predate the floor and must be re-authored).

            ## Cross-kind name reuse

            Every entity is a top-level **name-first** node, so within a single document the top-level node names are **globally unique**: a `candy` (image or layer), a `pod`, a `vm`, a `k8s`, and a `local` in ONE `charly.yml` MUST NOT share a name (they would collide on the same YAML key — `charly box validate` flags it; rename one, e.g. the convention of suffixing the template a deploy inherits). Cross-FILE name reuse across SEPARATE discovered files (a layer `candy/redis` + an image `box/redis` — both `candy:` nodes, routed to distinct internal maps `uf.Candy` vs `uf.Box` by `base:`/`from:` presence) IS still permitted, and verbs disambiguate by command context. Authoring verbs (`charly box set`, `charly box new box`, `charly box add-candy`, `charly box rm-candy`, `charly box new project`) write exclusively to `charly.yml` — a per-kind sibling file is reachable only via the `import:` statement from `charly.yml`, never as a default authoring target. Missing `charly.yml` → hard error pointing at `charly box new project .` or `charly migrate`. See the project rulebook "cross-FILE cross-kind reuse is fine, but a single document's top-level node names are GLOBALLY UNIQUE" (`AGENTS.md` / `CLAUDE.md`).

            ### Files are generic kind-containers (per-kind filenames are a convenience)

            Every YAML file is a generic, kind-agnostic container — the loader routes each document by its top-level kind-key (its SHAPE), **NEVER by filename**. So ANY file may hold ANY mix of kinds. Splitting entities into per-kind sibling files named for their kind (`vm.yml` for VMs, `pod.yml` for pod deploys, …) is a pure user **CONVENIENCE** you express in `charly.yml`'s `import:` (and, for candy directories, `discover:`) — it is never required, and the code hardcodes no per-kind filename. **`charly.yml` is the only filename the code knows**; everything else (which files to `import:`, which directories + manifest names to `discover:`) is configured there. Inline maps in `charly.yml` and per-kind splits load identically. `discover:` is a flat generic scan-spec list (`- {path, recursive, manifest}`); the manifest defaults to `charly.yml` but is overridable per spec. Migration of legacy configs: `charly migrate` (idempotent). See `/charly-build:migrate`, `/charly-internals:go`.

            The kind schemas each document is validated against (`box` / `candy` / `vm` / …) are **CUE-single-source**: the `@go()`-annotated `spec/schema/*.cue` defs are the sole source for both the Go param structs (generated into `spec/spec` by `task cue:gen`) and load-time validation, so changing a box/candy field is a CUE edit → `task cue:gen` → see the `/charly-internals:go` recipe "How to change the charly.yml schema (CUE is the single source of truth)".

            ## The `import:` statement (composition + namespaces)

            `import:` is the **single** composition statement — a **list**, one statement per project. Each list item is one of two shapes:

            | Shape | YAML | Semantics |
            |---|---|---|
            | **Flat** | a bare string — `- build.yml`, `- '@github.com/owner/repo/build.yml:vTAG'` | Merge the referenced file's entities into THIS project's root namespace (root-wins). Use for same-repo per-kind file splits AND an optional project-level `build.yml` that overrides or extends the embedded `distro`/`builder`/`init` vocabulary. |
            | **Namespaced** | a single-key map — `- {cachyos: box/cachyos}`, `- {charly: ../..}`, `- {base: '@github.com/owner/repo:vTAG'}` | Mount another project as an isolated child namespace under `alias`; its entries are NOT flat-merged, they're referenced QUALIFIED as `alias.entry`. |

            ### Qualified refs (`ns.entry`)

            A namespaced import is reached through a dotted ref everywhere a name is resolved — `base:`, `builder:` map values, deploy cross-refs:

            ```yaml
            import:
              - build.yml                       # flat — optional build-vocabulary override
              - charly.yml                       # flat — this repo's own box nodes
              - cachyos: box/cachyos          # namespaced child import

            versa:
              candy:
                base: cachyos.cachyos           # the `cachyos` image inside the `cachyos` namespace
            ```

            Resolution is **namespace-relative**, exactly like Go package-member access: a bare ref inside a namespace resolves within that namespace first; a qualified ref descends one level per dot (`a.b.c` → namespace `a`, then `b`, then leaf `c`). The `arch` and `fedora` submodules are SELF-CONTAINED (`import: []`): their base/builder stacks are bare-local, so their images write `base: arch` / `base: fedora` and route builders to a bare-local `arch-builder` / `fedora-builder`. The `cachyos` submodule imports the **`opencharly/distro-arch`** submodule under the `arch` namespace, so it reaches the Arch base/builder as `arch.arch` / `arch.arch-builder`. The main repo, in turn, imports all three submodules (`arch` / `cachyos` / `fedora` namespaces) to reference their relocated boxes.

            ### Inheritance across a namespace boundary

            - **`distro:` / `build:`** are VALUES (distro tags, package formats) → inherited across a namespace boundary, so a `base: cachyos.cachyos` image still picks up cachyos's `distro:`/`build:`.
            - **`builder:`** is a map of REFS relative to the BASE's namespace → it does **NOT** cross the boundary. A consumer image that builds a multi-stage format declares its OWN `builder:` map, qualified to the right builder (e.g. the `cachyos` base, which imports the `arch` namespace, declares `builder: {pixi: arch.arch-builder}`). This avoids leaking a base-namespace-relative ref into a consumer where that namespace doesn't exist.

            A repo reached via two import paths (e.g. `arch`, reached both directly as main → `arch` and transitively as main → `cachyos` → `arch`) — or an import cycle between two projects that import each other — is resolved to a single materialization at load time **by repo identity, not pinned version** — see `/charly-internals:go` "import-namespace loader". The consequence for authors: **the importing project's namespace pins win**. When an imported namespace's release imports your repo back (`<root>: @…:<someOldPin>`), that back-reference resolves to YOUR local working tree (the root), NOT the old pinned snapshot — so a stale transitive pin in a published submodule release can never drag a divergent (or stale-schema) version of your own repo into the load.

            **`repo:` (optional root-only field).** Declare your project's canonical repo identity at the top of `charly.yml` (`repo: github.com/opencharly/charly`) so the loader recognizes a transitive back-import of your repo and short-circuits it to the local tree. When omitted, the loader infers it from `git remote origin`; absent both, the cycle-break degrades to version-keyed behavior. The field is purely additive (no migration needed).

            ### Candy-version resolution across namespaces — per-entity version

            A namespace is imported to provide bases/builders; the resolver fetches ONLY the layers reachable from the enabled images' `base:`/`builder:` chains (reachability-scoped collection) — a namespace's unreferenced images and its `kind:local` templates are not pulled. The git `:vTAG` on a layer ref is only the FETCH coordinate; the layer's OWN `version:` (read after fetch) is the identity. So when the SAME layer is referenced via two different repo git tags but its `version:` is unchanged (a re-tag for an unrelated push), the resolver picks one materialization with NO warning. Only when a layer resolves to two genuinely different per-entity versions (a family pinned to a newer layer than the shared infra it composes) does it **warn once** (naming both per-entity versions) and use the **newest** (highest CalVer). Run `charly box reconcile` to align the on-disk git-tag pins and clear any warning. See `/charly-internals:go` "Remote-layer resolver", `/charly-build:reconcile`.

            ## Base stacks live in their distro submodules

            The arch and fedora base-distro stacks are no longer carried by the main repo — each is owned by its `box/<distro>` submodule:

            - **`box/arch`** owns `arch` + `arch-builder` (+ `cuda-arch-builder`), bare-local, and is SELF-CONTAINED (`import: []`).
            - **`box/fedora`** owns `fedora` + `fedora-builder` + `fedora-nonfree` (+ the `nvidia` / `python-ml` GPU bases), bare-local, and is SELF-CONTAINED (`import: []`).
            - **`box/cachyos`** owns the `cachyos` base (+ the pacstrap pair and the selkies GPU desktops) and imports the `arch` namespace to reach `arch.arch` / `arch.arch-builder` / `arch.cuda-arch-builder`.

            The main repo imports all three submodules (`arch` / `cachyos` / `fedora` namespaces) to reference their relocated boxes from its own `check`/`vm`/`local`/`k8s`/`android` entities (one-directional — the submodules import nothing back from main). The distro/builder/init build vocabulary is embedded in the `charly` binary (no `build.yml` import). See `/charly-distros:arch`, `/charly-distros:fedora`, `/charly-distros:cachyos`.

            ## When to Use This Skill

            **MUST be invoked** when the task involves box definitions in charly.yml, box inheritance, defaults, platforms, builder configuration, or the box dependency graph. Invoke this skill BEFORE reading source code or launching Explore agents.

            **Workflow position:** Pre-build. Define images before building. See also `/charly-image:layer` (candy authoring), `/charly-build:build` (building).

            ## Related skills

            - `/charly-build:migrate` — `charly migrate` migrates legacy configs into the canonical single-`charly.yml` layout
            - `/charly-internals:capabilities` — OCI label contract emitted at build time and consumed by deploy commands

            Live-deploy verification: see /charly-check:check (the 11 Testing Standards) and /charly-internals:disposable.
layer-skill:
    skill:
        name: layer
        family: image
        owner: charly-image
        description: |-
            MUST be invoked before any work involving: candy authoring, charly.yml, plan steps, pixi.toml, package.json, Cargo.toml, or any file under candy/. This skill is the authoritative reference for the plan-step verb catalog (`run:`/`check:` steps), `var:` substitution, execution order, and per-verb validation. Every other skill defers here for install-schema questions.
        triggers:
            - "Editing a candy (`candy/<name>/charly.yml`), candy authoring, candy tasks/services"
        content: |
            # Layer - Layer Authoring

            ## Overview

            A **candy** is a directory under `candy/<name>/` that installs a single concern. Candies are the building blocks of container images in opencharly. Each candy is a **compact name-first node**: the top-level key is the candy NAME, under it a single `candy:` kind key holds the **FULL body** — the scalar fields (`version`, `description`, `status`, …), every collection (`package`, `env`, `service`, `volume`, …) inline, and the operational steps as an ordered list under `plan:` — all in a single `charly.yml` file.

            There is **one YAML file per candy** for install logic — no separate Taskfiles. Everything an author needs to install flows through the `run:` steps in the `plan:` list and auto-detected package manifests (`pixi.toml`, `package.json`, `Cargo.toml`).

            **Layer vs image — ONE `candy:` kind (MUST).** There is exactly one entity kind,
            `candy:`; there is **no `box:` KIND**. A `candy:` node carrying neither `base:`
            nor `from:` is a **LAYER fragment** (this skill). A `candy:` node carrying `base:`
            (an external base distro / OCI ref) **or** `from:` (a builder ref) is a full
            **IMAGE** — author it per `/charly-image:image`. The loader routes a `candy:`
            node to `uf.Box` (image) or `uf.Candy` (layer) purely on `base:`/`from:` presence;
            `candy/<name>/` and `box/<name>/` remain the two discovery directories, and a
            layer-named and image-named entity may coexist (distinct `uf.Candy` vs `uf.Box`
            maps). The `charly box` COMMAND family is UNCHANGED — only the YAML `box:` KIND
            keyword was removed.

            ## A candy's files live in the candy's own directory

            A charly.yml's relative file references (`copy:` / `write:` step paths, `data.src`, install-file
            probes like `pixi.toml` / `package.json`, service-file globs) resolve against **the directory
            containing charly.yml**. There is no field for pointing a candy somewhere else, and the
            resolution is not configurable.

            The boundary is enforced, not merely conventional: a `copy:` source containing `..` is rejected
            at validate time (`copy: "../../x" may not contain .. (no traversal)`), so a candy cannot reach a
            sibling directory, a parent, or another submodule. Keep a candy's supporting files beside its
            charly.yml.

            When a candy genuinely needs content that lives outside its own directory — a sibling submodule's
            source tree, a large upstream artifact — fetch it at build time with a `download:` step or a
            `command:` clone rather than looking for a path escape. Worked example: `/charly-tools:docs-site`
            clones the published `opencharly/docs` repository instead of reaching into the `docs/` submodule
            beside it.

            ## The compact node form (name-first, one kind key)

            Every charly.yml is self-describing. A candy flattens to a top-level `<name>:` key (the entity NAME) with EXACTLY ONE kind key — `candy:` — whose value is the COMPLETE body: scalars, every collection (`package`, `env`, `service`, `volume`, …) inline, and the operational steps as an ordered UNNAMED list under `plan:`. A step that needs a stable name for reports/overlays carries an `id:` field. This name-first shape is globally addressable, so candy files stay bundle-mergeable — stack the top-level keys (or concatenate with `---` separators) to form a single file containing many candies. (The only other children an entity may carry are sub-ENTITY members, and only under a deployable kind — see `/charly-core:deploy`; a candy nests no members.)

            ```yaml
            # candy/chrome/charly.yml
            chrome:
              candy:
                version: 2026.100.0000
                description: ...
                package: [chromium]
                plan:
                  - run: install the chrome managed-policy file
                    copy: policies.json
                    to: /etc/chromium/policies/managed/policy.json
            ```

            The runtime parser accepts only this compact form. `charly migrate` converts any legacy candy file — including the former named data/step child-node shape (`<name>-<key>:` collection nodes and per-step child nodes) — to the canonical shape in a single idempotent pass; a former meaningful step-node name becomes that step's `id:`.

            The candy + plan-step schema the parser validates against is **CUE-single-source**: the `@go()`-annotated `spec/schema/*.cue` defs (`#Candy`, `#Op`, …) are the sole source for both the Go param structs (generated into `spec/spec` by `task cue:gen`) and load-time validation, so adding or changing a candy field is a CUE edit → `task cue:gen` → see the `/charly-internals:go` recipe "How to change the charly.yml schema (CUE is the single source of truth)".

            ## Quick Reference

            | Action | Command | Description |
            |--------|---------|-------------|
            | Scaffold new candy | `charly box new candy <name>` | Create candy directory with starter `charly.yml` (see `/charly-build:new`) |
            | Edit a candy field | `charly candy set <name> <dotpath> <value>` | Comment-preserving YAML edit by dot-path |
            | Append rpm/deb/pac/aur packages | `charly candy add-rpm <name> <pkg…>` (plus `add-deb`, `add-pac`, `add-aur`) | Idempotent append; auto-upgrades scaffold's null `package:` to a sequence |
            | Add a plan step (`run:` / `check:` / agent step) | hand-edit the `plan:` list in `charly.yml`, or `charly candy set <name> <dotpath> <value>` | No dedicated convenience command — append plan steps by hand or via the comment-preserving dot-path setter (and `charly box write` for free-form files). See `/charly-check:check` "Agent Driven Evaluation" |
            | Write a free-form file (`pixi.toml`, `root.yml`, …) | `charly box write <rel-path> --content X` | Escape hatch for files the schema setters don't cover; guarded against `..` traversal |
            | List all candies | `charly box list candies` | Show available candies from filesystem |
            | List services | `charly box list services` | Candies with `service` in charly.yml |
            | List volumes | `charly box list volumes` | Candies with `volumes` in charly.yml |
            | List aliases | `charly box list aliases` | Candies with `aliases` in charly.yml |
            | Validate | `charly box validate` | Check all candies and boxes |

            Every editor verb above auto-becomes an MCP tool via Kong reflection (`candy.set`, `candy.add-rpm`, `box.write`, …) so an agent driving `charly mcp serve` can author candies from scratch over RPC without touching the filesystem directly. See `/charly-build:charly-mcp-cmd` "Authoring tools" for the worked end-to-end example, and `/charly-build:new` for the project / box / candy scaffolders that bootstrap the flow.

            ### Editing charly.yml via the CLI (no hand-edit required)

            The `charly candy …` group edits `candy/<name>/charly.yml` through the `yaml.v3` Node API, so **comments and key order are preserved** across edits. Unlike unmarshal-then-marshal, nothing gets scrambled when an agent (or a shell script) touches the file:

            > The top-level `charly candy` authoring tree is a **COMPILED-IN COMMAND-class plugin** (`candy/plugin-candy`, `command:candy`) that OWNS the entire logic — the `set` / `add-rpm` / `add-deb` / `add-pac` / `add-aur` subcommand grammar AND the comment-preserving `yaml.Node` mutation of `candy/<name>/charly.yml` (`candySet` / `appendCandyPackages` / `candyBodyNode` / `ensureMappingChild` all live IN the plugin, none in core). There is no core candy logic and no HostBuild seam — a plugin editing yaml owns that itself. The ONLY shared pieces are the generic yaml utilities `kit.SetByDotPath` + `kit.MappingChild` (`sdk/kit/yaml.go`), which also back `charly box set` + `charly box scaffold` — ONE copy (R3). Because it is self-contained (no reverse channel), `charly candy` works identically compiled-in OR out-of-process, like `migrate`; the host dispatches the compiled-in placement through `dispatchInProcCommand` → `Invoke(OpRun)` → `runCandyCLI` (which just runs directly). (This is NOT `charly new candy` — a child of `charly new` — which stays a builtin.)

            ```bash
            # Append packages (idempotent; handles scaffold's null `package:` value):
            charly candy add-rpm sshd openssh-server openssh-clients
            charly candy add-deb sshd openssh-server
            charly candy add-pac sshd openssh

            # Set any field by dot-path (value is parsed as YAML):
            charly candy set sshd env.SSHD_PORT 22
            charly candy set sshd service.name sshd
            charly candy set sshd port '["22:22"]'
            charly candy set sshd require '[build-toolchain]'

            # Free-form files (layer scripts, pixi.toml, root.yml, *.service):
            charly box write candy/sshd/sshd_config.d/99-charly.conf --content 'X11Forwarding no\n'
            charly box cat candy/sshd/sshd_config.d/99-charly.conf
            ```

            Implementation: `candy/plugin-candy/command.go` (the subcommand grammar + the `yaml.Node` mutation of `candy/<name>/charly.yml`) + the shared generic yaml utilities `kit.SetByDotPath` / `kit.MappingChild` in `sdk/kit/yaml.go`. The comment-preservation guarantee is exercised by `sdk/kit/yaml_test.go` (`TestSetByDotPath_ScalarReplacement` — top-of-file and inline comments survive round trips). See `/charly-internals:plugin` for the compiled-in command-plugin model.

            ## Install Surface (what a layer directory holds)

            A candy directory can contain any combination of these:

            | Artifact | Runs as | Purpose |
            |---|---|---|
            | `charly.yml` `distro:` map (+ top-level `package:` base) | root | System packages declared declaratively (see Package Surface below) |
            | `charly.yml` `plan:` `run:` steps | per-step `run_as:` | Ordered install operations — the primary extension point (see catalog below) |
            | `pixi.toml` / `pyproject.toml` / `environment.yml` | user (builder stage) | Python/conda packages. Multi-stage build. Only one per candy |
            | `package.json` | user (builder stage) | npm packages — installed globally via `npm install -g` |
            | `Cargo.toml` + `src/` | user (builder stage) | Rust crate — built via `cargo install --path` |
            | `build.sh` | user (builder stage) | Optional post-install script for pixi candies. Runs in the pixi builder after `pixi install`. For build-time logic that can't be expressed in pixi.toml (C extension compilation, npm builds, binary patching). |

            **Auto-detection:** The build system scans each candy directory for these files. `pixi.toml`, `pyproject.toml`, `environment.yml`, `package.json`, and `Cargo.toml` trigger automatic multi-stage builds — no manual install commands needed. Use `run:` steps only for things those manifests can't express (binary downloads, file copies from `/ctx`, inline config writes, post-install configuration, `go install`, etc.).

            **Root vs user rule:** Pixi/npm/cargo builders always run as user — never as root. For `run:` steps, the `run_as:` field per step is explicit: `run_as: root` for system-wide changes, `run_as: ${USER}` for anything under `${HOME}`, or a literal username for custom users (must be created earlier in the same candy via a `command:` step).

            ---

            ## Plan Step Verb Catalog

            Every state-change step is an entry in the candy's ordered `plan:` list carrying `run: <prose>` plus **at most one verb-position key** and optional sibling modifiers. The verb key is either one of the builtin install verbs below or the generic plugin-verb sugar `<word>: <input>` (see "Plugin verb steps"). The verb's value is the primary argument (scalar shorthand) or the verb's full input map. An optional `id:` names the step for reports and overlay merging. `charly box validate` rejects `run:` steps with zero verbs or multiple verbs. (A candy's `plan:` also holds `check:` probe steps and `agent-run:` / `agent-check:` agent steps — see `/charly-check:check` for their verb surface.)

            | Verb | Value | Required modifiers | Optional modifiers | Purpose |
            |---|---|---|---|---|
            | `command:` | shell command (multi-line OK) | — | `run_as`, `comment` | Arbitrary shell — last-resort escape hatch |
            | `mkdir:` | directory path | — | `run_as`, `mode`, `comment` | Create directory (`mkdir -p`; coalesces with adjacent) |
            | `copy:` | source relative to layer dir | `to:` | `run_as`, `mode`, `comment` | `COPY --from=<layer-stage> --chmod= [--chown=]` — no RUN |
            | `write:` | destination path | `content:` | `run_as`, `mode`, `comment` | Write inline content — staged + COPY, no shell heredoc |
            | `link:` | symlink path (where the link lives) | `target:` | `run_as`, `comment` | `ln -sf <target> <link>` (coalesces with adjacent) |
            | `download:` | URL | — (`to:` unless `extract: sh`) | `run_as`, `extract`, `to`, `extract_include`, `strip_components`, `mode`, `env`, `comment` | `curl` + optional extract (`tar.gz`/`tar.xz`/`tar.zst`/`zip`/`none`/`sh`). `strip_components: N` emits `tar --strip-components=N` for tar.* — drops leading path segments so tarballs that nest under a top-level arch/version dir (Go, Rust, Node binary releases) land files directly at `to:`. See `/charly-coder:uv` for the canonical uv-x86_64-unknown-linux-gnu/uv → /usr/local/bin/uv example. |
            | `setcap:` | file path | — | `run_as` (implicit root), `caps`, `comment` | File capabilities (`setcap -r` strip if `caps` empty) |
            | `build:` | `"all"` | — | `run_as` (default `${USER}`), `comment` | Run auto-detected builders (pixi/npm/cargo/aur) at this point (instead of end-of-candy) |

            ### Shared modifiers

            | Modifier | Applies to | Default | Purpose |
            |---|---|---|---|
            | `run_as` | all verbs | `root` | `root` / `${USER}` / literal username / `<uid>:<gid>` |
            | `mode` | `mkdir`, `copy`, `write`, `download` | type-specific (`0755`/`0644`) | Octal permissions |
            | `to` | `copy`, `download` | — | Destination in container |
            | `target` | `link` | — | What the symlink points to |
            | `content` | `write` | — | Inline file body (YAML block scalar) |
            | `extract` | `download` | `none` | Archive format — `tar.gz` / `tar.xz` / `tar.zst` / `zip` / `none` / `sh` |
            | `extract_include` | `download` | — | Extract only these paths (archive formats) |
            | `env` | `download` | — | Env vars for install scripts (`sh` extract) |
            | `caps` | `setcap` | empty (= strip) | Capability spec (e.g. `cap_setuid=ep`) |
            | `cache` | `command`, `download` | — | List of absolute BuildKit cache-mount paths for this step's RUN. Ownership follows `run_as:` (root → shared/locked, non-root → uid/gid-owned). Persists heavy downloads/build artifacts across builds the SAME way package caches do — surviving an upstream layer cache-miss. The cache-USE logic (sentinel guards, copy-into-place) lives in the step body; charly only mounts the cache. See "Caching downloads" below. |
            | `comment` | all | — | Emitted as a Containerfile comment above the step |

            ### Plugin verb steps (`<word>: <input>` sugar)

            A `run:` step can carry `<word>: <input>` for ANY plugin verb instead of a built-in install verb — it dispatches to the reserved word's `Provider`. A map value is the plugin's input verbatim; a scalar value is shorthand for `{<primary>: value}` (each verb declares its primary field — `file`→`file`, `command`→`command`, `http`→`http`, the live probe verbs→`method`). The parse-time desugar rewrites the sugar into the internal `plugin`/`plugin_input` pair — authoring `plugin:` or `plugin_input:` directly in a step is a HARD LOAD ERROR (`run: charly migrate`); they exist only on the wire/label form. In the BUILD context the step EXECUTES at image-build time to emit its Containerfile fragment, served PLACEMENT-AGNOSTICALLY: the SAME plugin works whether it is compiled into `charly` (a builtin) OR loaded from an out-of-tree candy (an EXTERNAL plugin, host-built + connected during generation). A builtin renders an act shell `RUN` in-proc; an external returns a Containerfile fragment over go-plugin gRPC, spliced verbatim (egress-validated). See `/charly-internals:plugin` (placement) + `/charly-build:generate` (the build-time emit).

            ### External multi-stage builder (`external_builder:`)

            A candy may set `external_builder: <word>` — the reserved word of an OUT-OF-TREE builder plugin (an external `ClassBuilder` provider, `builder:<word>`) — to contribute a multi-stage build at IMAGE BUILD. The generator resolves the word, `Invoke(OpResolve)`s the provider, and splices the returned reply: its `FROM…AS` stage PRE-main-FROM and its `COPY --from=<stage>` artifacts POST-main-FROM. This is the build-time BUILDER leg, the multi-stage counterpart of a `run:` step's `plugin:` verb. A built-in builder (pixi/cargo/npm/aur) is selected by detection files (`pixi.toml`, `Cargo.toml`, `package.json`, `aur:`), NOT this field. A candy whose only content is `external_builder:` is valid (it ships no install files). See `/charly-internals:plugin` (placement) + `/charly-build:generate` (the build-time emit).

            ### Caching downloads (`download:` auto-caches; `cache:` for heavy installers)

            Every `download:` step is **content-addressed cached automatically**: the file
            is fetched ONCE into the shared `/tmp/downloads` BuildKit cache mount (keyed by
            the URL's sha256), reused across builds, and integrity-safe (curl writes
            `<hash>.part`, atomically renamed only on success — a partial/corrupt download,
            e.g. from a flaky CDN, is never reused). No author action needed; prefer
            `download:` over a hand-rolled `command: curl …`.

            For a `command:` step that downloads/builds via its own tool (an SDK installer, a
            source build) and so can't use `download:`, declare a `cache:` mount and route
            the tool's downloads into it. Canonical worked example — caching the Android SDK
            so an upstream base cache-miss doesn't re-download ~1.5GB from Google's CDN:

            ```yaml
            plan:
              - run: cache and install the android sdk
                id: android-sdk-cache
                command: |
                  SDK_CACHE=/var/cache/charly-android-sdk
                  if [ ! -f "${SDK_CACHE}/.charly-sdk-complete" ]; then
                    rm -rf "${SDK_CACHE}"; mkdir -p "${SDK_CACHE}"
                    sdkmanager --sdk_root="${SDK_CACHE}" "platform-tools" "emulator" "system-images;…"
                    touch "${SDK_CACHE}/.charly-sdk-complete"   # sentinel: only after full success
                  fi
                  cp -a "${SDK_CACHE}/." /opt/android-sdk/   # materialize into the image
                run_as: user
                cache:
                  - /var/cache/charly-android-sdk               # owned (uid) because run_as: user
            ```

            The sentinel (`.charly-sdk-complete`, written only after a fully-successful install)
            guards against a partial/interrupted download populating the cache. AUR builds
            get the same treatment via the embedded build vocabulary's `aur` builder (owned `cache_mount`
            entries for makepkg `SRCDEST` + yay's clone cache) — see `/charly-build:build`.

            ### Verb examples

            ```yaml
            plan:
              # Arbitrary shell
              - run: install google chrome from the upstream rpm
                command: dnf install -y https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
                run_as: root

              # Multi-line shell (shared shell — cd persists)
              - run: build and install bar from source
                command: |
                  git clone --depth 1 https://github.com/foo/bar /tmp/src
                  cd /tmp/src
                  cargo build --release
                  install -m 755 target/release/bar /usr/local/bin/bar
                  rm -rf /tmp/src
                run_as: root

              # Make directory
              - run: create the traefik dynamic-config directory
                mkdir: /etc/traefik/dynamic
                run_as: root
                mode: "0755"

              - run: create the user's sway config directory
                mkdir: "${HOME}/.config/sway"
                run_as: "${USER}"

              # Copy existing file from layer dir to container (no RUN, pure COPY)
              - run: install the traefik static config
                copy: traefik.yml
                to: /etc/traefik/traefik.yml
                mode: "0644"
                run_as: root

              # Write new file from inline YAML content (no shell heredoc!)
              - run: write the X11 server-flags config
                write: /etc/X11/xorg.conf
                mode: "0644"
                run_as: root
                content: |
                  Section "ServerFlags"
                    Option "DontVTSwitch" "true"
                  EndSection

              # Create symlink
              - run: point node at node-24
                link: /usr/local/bin/node
                target: /usr/bin/node-24
                run_as: root

              # Download + extract
              - run: install the traefik release binary
                download: "https://github.com/traefik/traefik/releases/download/${TRAEFIK_VERSION}/traefik_${TRAEFIK_VERSION}_linux_${ARCH}.tar.gz"
                extract: tar.gz
                to: /usr/local/bin
                extract_include: [traefik]
                run_as: root

              # Install script piped into shell
              - run: install uv via the upstream installer
                download: "https://astral.sh/uv/install.sh"
                extract: sh
                env:
                  UV_INSTALL_DIR: /usr/local/bin
                run_as: root

              # File capabilities
              - run: strip capabilities from sway
                setcap: /usr/bin/sway      # no caps → strip (setcap -r)

              - run: grant the setuid capability to newuidmap
                setcap: /usr/bin/newuidmap
                caps: "cap_setuid=ep"

              # Explicit builder placement (lets you run steps AFTER pixi/npm/cargo)
              - run: run the auto-detected builders here
                build: all
                run_as: "${USER}"
              - run: install the vllm nightly wheel
                command: pip install --no-deps ./vllm-nightly.whl
                run_as: "${USER}"
            ```

            ### `copy:` vs `write:` — never conflate

            They happen to emit `COPY` directives under the hood, but they have entirely distinct semantics:

            | | `copy` | `write` |
            |---|---|---|
            | Source of bytes | File on disk under `candy/<name>/` | Inline `content:` block in `charly.yml` |
            | Replaces old pattern | `cp /ctx/foo bar` + `chmod` | `cat > foo << 'EOF' … EOF` |
            | Validation check | `src` must exist under candy dir at generate time | `content` must be non-empty |
            | Cache key | Layer-stage file content | Content-addressed staged file at `.build/<image>/_inline/<layer>/<sha256>` |
            | Shell-heredoc involvement | None | **None** — content never appears in the Containerfile |

            `write:` is the heredoc-safe path: the YAML `content:` is staged to disk at generate time and delivered via `COPY`. That means `$`, backticks, nested `EOF` markers, and arbitrary binary-safe text are all handled without any escaping. If you find yourself writing `cat > foo << 'EOF'` inside a `command:` block, use `write:` instead.

            ---

            ## `var:` and `${VAR}` Substitution

            `var:` is a candy-local `map[string]string`. Values are emitted as `ENV` before the candy's `run:`/`check:` steps, so every subsequent directive in the candy (including `COPY --chmod=` paths) sees them as shell-resolvable `${VAR}` references.

            ```yaml
            traefik:
              candy:
                var:
                  TRAEFIK_VERSION: v3.4.0
                plan:
                  - run: install the traefik release binary
                    download: "https://github.com/traefik/traefik/releases/download/${TRAEFIK_VERSION}/traefik_${TRAEFIK_VERSION}_linux_${ARCH}.tar.gz"
                    extract: tar.gz
                    to: /usr/local/bin
                    extract_include: [traefik]
                    run_as: root
            ```

            ### Auto-exports

            These names are reserved — `var:` may not shadow them:

            | Name | Value | Resolution |
            |---|---|---|
            | `USER` | image's configured username | Generate-time (from charly.yml resolution) |
            | `UID` | numeric user ID | Generate-time |
            | `GID` | numeric group ID | Generate-time |
            | `HOME` | resolved home directory | Generate-time |
            | `ARCH` | BuildKit-style: `amd64` / `arm64` / `ppc64le` / `s390x` | Build-time via `ARG TARGETARCH` + `ENV ARCH=${TARGETARCH}` at candy top |
            | `BUILD_ARCH` | uname-style: `x86_64` / `aarch64` / … | Build-time, shell-only (auto-injected inside `command:` and `download:` as `BUILD_ARCH=$(uname -m)`) |

            **Why two `ARCH` flavours:** `${ARCH}` is BuildKit form because that's what most upstream release naming uses (traefik, mcp-grafana, cosign, etc.). `${BUILD_ARCH}` is uname form because a handful of projects (pixi, yay, just, typst) use `x86_64`/`aarch64` in their release filenames. Pick whichever matches your URL template — the generator handles both.

            ### Where substitution applies

            `${VAR}` is resolved in every `run:`/`check:` step field **except**:

            - `command:` command text — passed verbatim to bash so shell-style `${VAR:-default}`, `$(command)`, and `$NAME` all work the way you'd expect. **But** RUN shells don't have `$USER` exported by default — use `getent passwd <UID>` for user-name discovery inside `command:`, not `$USER`.
            - `write: content:` — the file body is verbatim bytes (never substituted, never heredoc'd). If you need the resolved `${USER}` inside a file, use a `command:` step that writes via shell redirect after discovering the name via `getent passwd 1000 | cut -d: -f1`. Canonical worked example: `/charly-coder:sshd`'s sudoers drop-in.

            Everything else (paths, URLs, modes, `to`, `target`, `user`, etc.) resolves via the Docker-level ENV mechanism, so BuildKit sees the values and substitutes in COPY/RUN/ENV directives.

            **Why `$USER` isn't reliable in `command:`** — the generator resolves `${USER}` in step fields (paths, `run_as:` directive, COPY --chown) at generate time. But `command:` body text is passed through to bash at RUN time, and bash at RUN time doesn't export `$USER` unless the image explicitly set it via an `ENV USER=` directive (which we don't). `getent passwd <UID>` is the robust, fully-generic alternative that works equally under create mode (`user`) and adopt mode (`ubuntu`) — see `/charly-image:image` "user_policy".

            ### Validation

            - `var:` keys must match `^[A-Z_][A-Z0-9_]*$` (standard shell identifier)
            - Keys may not collide with auto-exports or with the candy's own `env:` keys
            - Unresolved `${VAR}` in non-shell fields (paths, URLs, etc.) errors at `charly box validate`

            ---

            ## Style: Explicit Plan Steps, No YAML Anchors

            Every `run:` step — root or user — must be written out in full. Do **not** use YAML anchors (`&name`, `<<: *name`) to share `run_as:` / `mode:` across steps. `gopkg.in/yaml.v3` parses anchors correctly, but the repo convention is that every `charly.yml` plan step reads end-to-end without indirection.

            ```yaml
            # Style across the repo — root and user steps look identical in shape:
            plan:
              - run: create the traefik config directory
                mkdir: /etc/traefik
                run_as: root
                mode: "0755"

              - run: create the user's local bin directory
                mkdir: "${HOME}/.local/bin"
                run_as: "${USER}"

              - run: install the chrome wrapper
                copy: chrome-wrapper
                to: "${HOME}/.local/bin/chrome-wrapper"
                mode: "0755"
                run_as: "${USER}"
              - run: install the chrome restart helper
                copy: chrome-restart
                to: "${HOME}/.local/bin/chrome-restart"
                mode: "0755"
                run_as: "${USER}"
            ```

            Why: anchor merges always override the verb (the interesting field), so the DRY saving is 1–2 trivial fields per step at the cost of forcing readers to jump to the anchor definition to understand each step. Adjacent-coalescing in the generator already collapses identical consecutive operations into one Containerfile directive — there is no build-time cost to explicit repetition.

            ---

            ## Execution Order

            **Plan `run:` steps run in the exact YAML order you wrote them. No reordering, ever.** This is load-bearing: `download` before `copy` that references the downloaded path; `mkdir` before `copy` into that directory; `command useradd` before `command` as that new user.

            ### Adjacent-coalescing (the only rendering optimisation)

            When two or more consecutive `run:` steps share the same verb AND the same resolved `run_as:` AND the verb supports batching, they render into one Containerfile directive instead of N. This is pure output optimisation — the operations still happen in authored sequence, and no step ever moves past a different-verb or different-user step.

            | Verb | Coalesces adjacent same-user? | Output |
            |---|---|---|
            | `mkdir` | Yes | `RUN mkdir -p p1 p2 p3 …` (one RUN; `chmod` grouped by mode) |
            | `link` | Yes | `RUN ln -sf t1 l1 && ln -sf t2 l2 …` |
            | `setcap` | Yes | `RUN setcap …` chain |
            | `copy` | No coalescing needed | Multiple `COPY` directives back-to-back, no RUN between them |
            | `write` | No coalescing needed | Same as `copy` but from staged-inline content |
            | `download` | No | Each URL gets its own RUN — merging would hide failures |
            | `command` | No | Each `command:` maps 1:1 to one RUN — merging arbitrary shell would erase author intent |
            | `build` | Singleton | One per candy (auto or explicit) |

            **Non-adjacent same-verb steps never coalesce.** `mkdir /a` → `copy foo /a/foo` → `mkdir /b` renders as three directives, not two. Collapsing the two mkdirs would change observable state (the copy would see a different directory layout) and is forbidden.

            ### `mkdir -p` ancestor registration

            When you declare `mkdir: /a/b/c`, the generator also treats `/a` and `/a/b` as "declared" — because Unix `mkdir -p` creates the full path. That means a later `copy` into `/a/b/foo` won't trigger a redundant auto-inserted `mkdir /a/b`. This matches author intent: you wrote one mkdir, you get one mkdir, even if multiple COPYs land under the same tree.

            ### Parent-directory auto-insertion

            The single, tightly-scoped exception to "no implicit inserts": if a `copy:` or `write:` step's destination parent isn't already declared (directly or via ancestor-registration above), the generator prepends a single `RUN mkdir -p <parent>` (as the step's `run_as:`) **immediately before** the COPY — never relocating anything, never merging across other steps. To opt out of auto-insertion for a specific path, declare the parent explicitly with `mkdir:` earlier in the list.

            ### USER directives

            The generator tracks the running USER and emits `USER <value>` only when the next step's resolved user differs. Eight consecutive `${USER}` steps get one `USER 1000` directive followed by eight directives — no redundant switches. Between different-user steps, a `USER` switch happens where author order requires.

            ---

            ## User Resolution

            The `run_as:` field accepts:

            | Value | Emits | COPY `--chown` pair |
            |---|---|---|
            | `root` / `"0"` / omitted | `USER 0` | — (root is the COPY default) |
            | `${USER}` | `USER <numeric UID>` | `<UID>:<GID>` (e.g. `1000:1000`) |
            | `<uid>:<gid>` (e.g. `1010:1010`) | `USER <uid>:<gid>` | same |
            | bare numeric `<uid>` | `USER <uid>` | `<uid>:<uid>` |
            | literal name (`postgres`, `immich`) | `USER <name>` | `<name>:<name>` |

            **Why `${USER}` resolves to a numeric UID:** avoids a `/etc/passwd` dependency at the instant the switch happens. Base images create the named user, but numeric always works even if `/etc/passwd` hasn't been read yet by whatever shell the RUN spawns.

            **User creation is explicit.** If you reference a literal username, an earlier `command:` step (as root) must `useradd` them. The generator does not auto-create users. Example:

            ```yaml
            plan:
              - run: create the immich service user
                command: |
                  useradd -r -u 1010 -g root -s /sbin/nologin immich
                  mkdir -p /srv/immich && chown -R immich:root /srv/immich
                run_as: root
              - run: build immich as that user
                command: |
                  cd /srv/immich
                  pnpm install --frozen-lockfile
                  pnpm build
                run_as: immich
            ```

            ---

            ## charly.yml Field Reference

            | Field | Type | Purpose |
            |-------|------|---------|
            | `version` | `string` | **MANDATORY** CalVer (`YYYY.DDD.HHMM`) of this candy definition — the candy kind requires it (`charly box validate` hard-errors when absent; `charly migrate` backfills it). The authoritative per-entity identity: it drives cross-repo layer resolution (`pickCandyVersion`) and, as the highest layer version, the consuming image's content-stable `ai.opencharly.version` label. Bump it when the candy's content changes. |
            | `status` | `string` | `working`, `testing`, or `broken`. Default: `testing`. |
            | `engine` | `string` | Optional container-engine requirement: `docker` or `podman`. |
            | `require` | `[]string` | Candy dependencies. Resolved transitively, topologically sorted. |
            | `candy` | `[]string` | Compose other candies into this one (splicing). |
            | `env` | `map[string]string` | Container-runtime environment variables. Merged across candies. |
            | `path_append` | `[]string` | Paths appended to `$PATH`. Deduplicated. |
            | `var` | `map[string]string` | **Build-time** candy-local variables for `${VAR}` substitution. Emitted as `ENV` before plan steps. |
            | `plan` | `[]Step` | The **ordered** operational plan — an UNNAMED list of steps, each carrying ONE intent keyword `run:` (state-change) / `check:` / `agent-run:` / `agent-check:` (probes) / `include: <kind>:<name>` (splice another entity's plan) plus at most one verb-position key and optional modifiers (`id:` names a step). Steps run in authored order. Every candy MUST ship ≥1 `check:` step (the ADE gate; `charly box validate` hard-errors otherwise). See Plan Step Verb Catalog above. |
            | `port` | `[]int \| []PortSpec` | The candy's **container** ports (1-65535) — the SINGLE source of truth for published ports. Every box composing this candy inherits them (`CollectBoxPorts`); boxes declare no `port:`. Host mappings are auto-allocated on `127.0.0.1` at deploy. Protocol-annotated form: `tcp:5900`, `https+insecure:3000`, etc. (the backend scheme rides into `ai.opencharly.port_proto`). |
            | `route` | `{host, port}` | Traefik reverse proxy route. |
            | `package` / `distro` | list / map | The package surface: top-level `package:` base + per-distro/version `distro:` map (bare / versioned / compound keys). Resolved via the most-specific-first cascade (see Package Surface). |
            | `apk` | `[]ApkPackageSpec` | **Android app-install package format** — apps installed onto a `kind: android` device by a `target: android` deploy (NOT into the image). Each entry is `package:` (apkeep download by id, with `source`/`arch`/`version`) XOR `apk:` (committed local APK). Device-scoped (top-level, not under `distro:`); compiles to an `ApkInstallStep` that ONLY `target: android` executes (skipped at image-build + on every other target). See `/charly-check:android`. |
            | `localpkg` | map (format→dir) | **Native-package deploy format** (sibling of `apk`). A per-format map (`pac`/`rpm`/`deb` → a bundled package SOURCE dir, e.g. the `charly` layer's `{pac: pkg/arch, rpm: pkg/fedora, deb: pkg/debian}`). Compiles to a `LocalPkgInstallStep` (`/charly-internals:install-plan`) emitted at "step 2.5", BEFORE the layer's `run:` steps. On a DEPLOY target (`target: local` / `target: vm`) charly picks the entry matching the target distro's package format, builds the package on the HOST (pac via `makepkg`; rpm/deb distro-natively in a podman container), and installs it via the format's AUTO-RESOLVING local-file install (`pacman -U` / `dnf install` / `apt-get install`) — so the package's repo dependencies resolve automatically and there is NO dependency-closure builder. Every command (build / install / probe / glob / `source_sentinel`) is rendered from the distro's `format.<fmt>.local_pkg:` block in the embedded build vocabulary — zero hardcoded package-manager literals in Go. The legacy scalar form (`localpkg: pkg/arch`) is rejected at load with an `charly migrate` hint. Resolution walks up from the deploy project dir, so a consumer under `box/<distro>` finds the superproject's `pkg/<fmt>`. Skipped at image build — the layer's own `run:` steps (curl/COPY) are the fallback. The `charly` layer uses this to install `charly` as the native OS package at `/usr/bin/charly` on every distro instead of a curl'd binary. |
            | `volume` | `[]{name, path}` | Persistent named volumes. |
            | `alias` | `[]{name, command}` | Host command aliases. |
            | `security` | object | Container security: `privileged`, `cap_add`, `devices`, `security_opt`, `shm_size`, resource caps. |
            | `port_relay` | `[]int` | Ports needing eth0 → loopback socat relay. Auto-adds `socat` dependency. |
            | `secret` | `[]SecretYAML` | Image-owned container secrets (auto-generated per instance). |
            | `hook` | `CandyHook` | Lifecycle hooks: `post_enable` (after `charly config`), `pre_remove` (before `charly remove`). |
            | `libvirt` | `[]string` | Raw libvirt XML snippets for VM domain XML injection. |
            | `data` | `[]DataYAML` | Data mappings (`src` → volume `dest`) for volume staging. |
            | `env_provide` | `map[string]string` | Env vars injected into OTHER containers when this service is deployed. Template: `{{.ContainerName}}`. |
            | `env_require` | `[]EnvDependency` | Plaintext env vars this candy MUST have. Hard error at `charly config` if missing. |
            | `env_accept` | `[]EnvDependency` | Plaintext env vars this candy CAN optionally use. Opt-in allowlist for `env_provide` injection. |
            | `secret_accept` / `secret_require` | `[]EnvDependency` | Credential-backed env vars. Values live in credential store, never in charly.yml/quadlet. |
            | `mcp_provide` / `mcp_require` / `mcp_accept` | various | MCP server discovery analogous to `env_*`. |
            | `service` | `[]ServiceEntry` | Unified service list — see "Service Declaration" below. |

            Field details for the non-step collection sections are below.

            ---

            ## Package Surface — the `distro:` map (single canonical surface)

            Packages are declared ONLY under the candy body's `distro:` map, plus an optional
            `package:` base list beside it. There is NO `rpm:` / `deb:` / `pac:` package-format
            key and NO top-level `debian:13:` / `debian,ubuntu:` tag key — those legacy forms
            are removed (a stray one is a hard load error pointing at `charly migrate`). The
            arch `aur:` sub-block is the one exception that stays a build format — see AUR below.

            ```yaml
            my-app:
              candy:
                package:               # the always-included BASE — installed on EVERY distro
                  - git                #   (cross-distro-valid package names)
                distro:
                  fedora:              # bare distro name → applies to every fedora version
                    package: [vim, ripgrep]
                    copr: [owner/project]
                    option: ["--setopt=tsflags=noscripts"]
                  arch:
                    package: [vim, ripgrep]
                  "debian,ubuntu":     # COMPOUND → shared by both (split into one tag each)
                    package: [vim, ripgrep]
                    repo:              # /etc/apt/sources.list.d/<name>.list + keyring
                      - name: myrepo
                        url: "https://example.com/repo"
                        key: "https://example.com/key.gpg"   # ASCII-armored; gpg --dearmor'd
                        suite: stable
                        components: main
                  ubuntu-24.04:        # VERSIONED (dash form) → overrides for that version only
                    repo: [{name: nodesource, url: "...", suite: nodistro, components: main}]
            ```

            ### Key forms (all under `distro:`)

            | Form | Example | Means |
            |---|---|---|
            | bare distro | `fedora` / `debian` / `ubuntu` / `arch` | every version of that distro |
            | versioned | `debian-13` / `ubuntu-24.04` | that specific version (dash form — robust YAML) |
            | compound | `"debian,ubuntu"` / `"debian-13,ubuntu-24.04"` | shared across the listed distros/versions (split into one per distro) |

            Each carries the full surface: `package` + `repo` + `copr` + `option` + `exclude`
            + `module` (and `aur` under `arch`). `repo` is the canonical key (singular).

            ### Resolution is a most-specific-first CASCADE

            For an image, the resolver walks the image's `distro:` tag chain — most-specific
            first (e.g. `[ubuntu:24.04, ubuntu]` or `[debian:13, debian]`) — plus the
            `package:` base list:

            - **packages = UNION** across the base + every matching level (deduped). A shared
              package on a broad level plus extras on a specific level accumulate.
            - **repo / copr / option / exclude / module = MOST-SPECIFIC matching level wins**
              (a `ubuntu-24.04` repo overrides the bare `ubuntu` repo).

            This is what makes per-distro repos DETERMINISTIC: each distro owns its own tag
            section, so debian and ubuntu can never race over one shared section (the old
            collapse that made the apt suite — trixie vs noble — depend on Go map order).
            Canonical examples: `/charly-tools:charly` (tailscale `debian`→trixie / `ubuntu`→noble),
            `/charly-coder:docker-ce` (per-version repos) and `candy/gh` (compound shared repo).

            ### The cascade cannot SUBTRACT — express exclusions structurally

            Because packages UNION across the chain, you cannot have a specific level REMOVE a
            package a broader level added. To keep a package OFF a distro/version, simply
            never list it on any level that distro resolves. Worked example: `/charly-coder:dev-tools`
            keeps `fastfetch` (absent from Ubuntu's repos) only under `debian` + `fedora` +
            `arch` — NOT under `ubuntu` — so the ubuntu cascade never includes it.

            ### Image distro chains (where the most-specific-first order comes from)

            An image declares its chain in `charly.yml` `distro:` (e.g. `[debian:13, debian]`,
            `[ubuntu:24.04, ubuntu]`); a `target: vm` deploy synthesizes the SAME chain from
            the distro's canonical `version:` in the embedded build vocabulary via `distroTagChain` — so
            per-version selection works identically on image builds and VM deploys. fedora /
            arch carry only a bare tag (`[fedora]` / `[arch]`) and reach their packages via
            the bare-distro tag section. See `/charly-build:build` and `/charly-internals:install-plan`.

            ### AUR (`distro.arch.aur:`)

            AUR packages are compiled by `yay` in a multi-stage build, then the resulting
            `.pkg.tar.zst` artifacts are `pacman -U`-installed into the final image. Two
            conditions must BOTH hold for the AUR stage to be emitted:

            1. The consuming **image declares `aur` in its `build:` list** (e.g.
               `build: [pac, aur]`). The `arch` AND `cachyos` bases both declare only
               `build: [pac]`, so a consumer that needs AUR MUST add `aur` itself (the
               `arch-test` and `selkies-desktop` precedents). Without it the AUR section is
               silently skipped — by design, so a multi-distro candy can carry `aur:` for
               Arch consumers without forcing every Fedora consumer to invoke a builder.
            2. **`builder.aur` is configured** — `arch-builder` for BOTH the `arch` and
               `cachyos` bases. CachyOS is Arch-derived and routes all four
               pixi/npm/cargo/aur formats to `arch-builder`, so an `aur:` layer builds
               **identically on arch and cachyos** — there is no cachyos-specific AUR path.

            **Canonical form — nested under `distro.arch`** (how the repo's candies author it:
            `chrome`, `vscode`, `wl-tools`). The `aur:` block sits beside the regular
            `package:` list inside the arch distro section, so ONE candy carries Fedora RPMs
            and Arch repo + AUR packages together; the generator picks the section matching
            the image's `distro:` tags:

            ```yaml
            chrome:
              candy:
                distro:
                  arch:
                    package:               # Arch repo (core/extra) packages
                      - vulkan-icd-loader
                    aur:                   # AUR packages — need build: [pac, aur] on the image
                      package:
                        - google-chrome
                      option:
                        - --nocheck
                      # `replace:` lists distro-repo packages whose file paths conflict
                      # with the AUR build artifact. Each entry is removed via
                      # `pacman -Rs --noconfirm <pkg>` BEFORE the AUR `pacman -U` install.
                      # Idempotent — entries that aren't installed are silently skipped.
                      # Required when the AUR build owns paths also owned by an Arch repo
                      # package (e.g. `visual-studio-code-bin` and `code` both own /usr/bin/code).
                      replace:
                        - code
                  fedora:
                    package:
                      - vulkan-loader
            ```

            The `aur:` block lives ONLY nested under `distro.arch` — there is no top-level
            `aur:` (or `pac:`) section; the nested block flattens to the internal `aur`
            format section (`charly/layers.go` `derivePackageSectionsFromCalamares`).

            The `replace:` mechanism applies to host (`target: local`) deploys; in OCI image builds the candy is applied to a fresh rootfs that never has the conflicting package, so `replace:` is a no-op there.

            ---

            ## Dependencies

            Candies declare dependencies via `require`. The generator resolves transitively, topologically sorts, and pulls missing dependencies automatically. Circular dependencies are a validation error.

            ```yaml
            my-app:
              candy:
                require:
                  - python
                  - build-toolchain
            ```

            ### `require` vs `candy` (composition)

            | | `require` | `candy` |
            |---|---|---|
            | Purpose | Prerequisite ordering | Group composition |
            | Effect | Ensures dependency is installed first | Splices candies at this candy's position |
            | Transitive | Yes — pulls in sub-dependencies | Yes — recursively expands |
            | Typical use | Runtime/build prerequisites | Metalayers, candy bundles |

            **Common mistake:** `require: [pixi]` when you mean `require: [python]`. The `pixi` candy installs the pixi binary (build tool). The `python` candy installs Python via pixi. Your candy needs Python.

            ---

            ## Environment Variables

            ```yaml
            my-app:
              candy:
                env:
                  PIXI_CACHE_DIR: "~/.cache/pixi"
                  MY_VAR: "value"
                path_append:
                  - "~/.pixi/bin"
                  - "~/.local/bin"
            ```

            `~` and `$HOME` expand to the resolved home directory at generation time. Setting `PATH` directly in `env` is a validation error — use `path_append`. Later candies override earlier for the same key.

            **`env:` vs `var:`:** `env:` is container **runtime** environment (emitted as `ENV` and persists into the running container). `var:` is **build-time** substitution for `${VAR}` references inside the candy's `run:`/`check:` steps — also emitted as `ENV` so BuildKit can substitute in COPY paths, but conceptually scoped to the candy's install. There's no hard rule against using `env:` for both purposes, but keeping them separate makes intent clearer.

            **`env:` is a MAP, not a list — everywhere** (candies, boxes, AND deploys). The parser decodes it as `map[string]string`, not `[]string`. Authoring it as `- KEY=value` fails with `cannot unmarshal !!seq into map[string]string` at `charly box validate`. Always use map form:

            ```yaml
            # ❌ WRONG — parser rejects the list shape
            env:
              - CHARLY_PROJECT_DIR=/workspace
              - GOPATH=~/go

            # ✓ RIGHT — map form
            env:
              CHARLY_PROJECT_DIR: "/workspace"
              GOPATH: "~/go"
            ```

            The `charly-mcp` candy is the canonical example of the map form used to thread a container-level env var into the MCP server process via supervisord.

            ---

            ## Service Declaration — unified `service:` schema

            A candy declares services via the **unified `service:` list**. One schema covers both distro-packaged systemd units and fully custom entries, rendered to supervisord INI (for container init) or systemd unit files (for bootc images + host deploys) by the init-system's `service_schema` in the embedded build vocabulary.

            Every entry has one `name:` plus either a `use_packaged:` reference (reuse a distro-shipped unit) OR a structured custom spec (`exec`, `env`, `restart`, ...). The two forms are mutually exclusive.

            ### Form 1 — reuse a packaged systemd unit

            For services shipped by a distro package (postgresql, nginx, redis, sshd, ...). charly enables the packaged unit with optional drop-in overrides — it never regenerates the unit file. The packaged unit at `/usr/lib/systemd/system/<unit>.service` stays untouched; override config lands at `/etc/systemd/system/<unit>.service.d/charly-<layer>.conf`.

            ```yaml
            postgresql:
              candy:
                service:
                  - name: postgresql
                    use_packaged: postgresql.service   # distro-shipped unit
                    enable: true                        # systemctl enable --now
                    scope: system                       # system | user
                    overrides:                          # optional — rendered as drop-in
                      env:
                        PGDATA: /var/lib/postgresql/data
                      after: [network-online.target]
            ```

            **Supervisord caveat**: `use_packaged:` is a systemd-only concept. On supervisord-targeted images (containers using the default init), packaged entries render a warning and get skipped; either author a custom entry (form 2) or target a systemd image.

            ### Form 2 — custom service

            For services that aren't distro-packaged (ollama, custom daemons, candy-provided binaries). charly renders the spec through the init-system's `service_template` in the embedded build vocabulary — supervisord-init containers get INI fragments, systemd-init containers and bootc/host deploys get `.service` unit files.

            ```yaml
            ollama:
              candy:
                service:
                  - name: ollama
                    exec: /usr/bin/ollama serve
                    env:
                      OLLAMA_HOST: "0.0.0.0:11434"
                      OLLAMA_KEEP_ALIVE: "-1"
                    restart: always                     # no | on-failure | always | unless-stopped
                    working_directory: /var/lib/ollama
                    user: ollama
                    after: [network.target]
                    before: [ollama-exporter]
                    stdout: journal                     # journal | file:<path> | none
                    stop_timeout: "30s"
                    scope: system                       # system | user
                    enable: true
            ```

            ### Mixed entries in one candy

            A candy can declare multiple entries mixing both forms. The `sshd` candy is the canonical example: it enables the packaged `sshd.service` for systemd-init scope AND runs a custom wrapper via supervisord.

            ```yaml
            sshd:
              candy:
                service:
                  - name: sshd
                    use_packaged: sshd.service         # bootc/systemd scope
                    enable: true
                    scope: system

                  - name: sshd                          # name may repeat across forms (different init system renders each)
                    exec: /usr/local/bin/sshd-wrapper
                    restart: always
                    priority: 3
                    enable: true
                    scope: system
            ```

            ### Field reference

            | Field | Required | Applies to | Description |
            |---|---|---|---|
            | `name` | yes | both | Service identifier; passed to `service_template` as `.Name` |
            | `use_packaged` | form 1 | packaged | Distro-shipped unit name (e.g., `postgresql.service`); mutually exclusive with `exec` |
            | `exec` | form 2 | custom | Command to run (`ExecStart` in systemd, `command` in supervisord) |
            | `distro` | no | both | List of distros this entry renders on — a bare name (`debian`) or a versioned tag (`debian:13`). Empty/absent = every distro (the default). The service analogue of a check step's `exclude_distros:` — it scopes an entry to the distros whose packaging actually ships that unit/binary, so ONE candy carries per-distro-DIVERGENT daemons without a `<name>-host` sibling (R3). Filtered at render time in BOTH the build path (supervisord fragments + bootc `system_enable`) and the deploy path (`compileServiceSteps`). Canonical example: `/charly-infrastructure:virtualization` (modular `virtqemud`/`virtnetworkd` on Fedora/Arch vs monolithic `libvirtd` on Debian/Ubuntu). |
            | `env` | no | both | Map of env vars; systemd renders as `Environment="K=V"`, supervisord as `environment=K="V",...` |
            | `restart` | no | custom | `no` / `on-failure` / `always` / `unless-stopped`; mapped by init-specific template helper |
            | `working_directory` | no | custom | `WorkingDirectory=` (systemd) / `directory=` (supervisord) |
            | `user` | no | custom | Service runtime user |
            | `after` | no | both | List of unit names this service starts after; systemd `After=`, supervisord priority ordering |
            | `before` | no | custom | Inverse of `after` |
            | `stdout` | no | custom | `journal` / `file:<path>` / `none`; init-specific mapping |
            | `stop_timeout` | no | custom | `TimeoutStopSec=` (systemd) / `stopwaitsecs=` (supervisord) |
            | `scope` | no | both | `system` (default, `/etc/systemd/system/`) or `user` (`~/.config/systemd/user/`) |
            | `enable` | no | both | Whether to `systemctl enable --now` at install time |
            | `overrides` | no | packaged | Drop-in modifications: `env`, `after`, `exec` |
            | `priority` | no | supervisord-only | Startup priority; translated from `after`/`before` on systemd |

            ### Lifecycle-directive overlay (supervisord-only fields)

            Beyond the core `service:` schema above, supervisord-rendered entries accept additional lifecycle fields: `auto_start`, `start_retries`, `start_secs`, `stop_signal`, `exit_codes`, `priority`, `kind: eventlistener` + `events:`. See `/charly-infrastructure:supervisord` for the directive table and `/charly-selkies:chrome` for the eventlistener worked example.

            ### Rendering to init systems

            The actual unit text is rendered by the init-system's `service_schema` block in the embedded build vocabulary:

            - **Supervisord init** — `service_template` produces `[program:NAME]` INI fragments with `autorestart` / `environment` / etc.; fragments go to `/etc/supervisord.d/<layer>-<name>.conf` and are assembled at container-build time.
            - **Systemd init (bootc + host deploys)** — `service_template` produces `[Unit]` / `[Service]` / `[Install]` blocks; the rendered file goes to `/etc/systemd/system/charly-<layer>-<name>.service` (or the user-scope path when `scope: user`). For `use_packaged:` entries, `dropin_template` + `dropin_path_template` produce an override file alongside the packaged unit.

            See `/charly-infrastructure:supervisord` for the supervisord ServiceSchemaDef template, `/charly-build:build` for the three-phase template model, and `/charly-local:local-deploy` for how the host target consumes `service:` entries.

            ### Worked examples in-tree

            - `/charly-infrastructure:postgresql` — canonical `use_packaged:` entry with drop-in overrides
            - `/charly-ollama:ollama` — single custom entry (common shape)
            - `/charly-hermes:hermes` — custom entry with complex env and ordering
            - `/charly-coder:sshd` — mixed (packaged + custom) within one candy
            - `/charly-infrastructure:virtualization` — mixed entries + per-entry `distro:` filter: modular virtqemud/virtnetworkd on Fedora/Arch vs monolithic libvirtd on Debian/Ubuntu (canonical polymorphism example)
            - `/charly-infrastructure:traefik` — multiple custom entries for a multi-service candy

            ### Anti-pattern: `<name>-host` / `<name>-pod` sibling candies

            Do **NOT** split a polymorphic service into two candies like `myservice` (supervisord variant) + `myservice-host` (systemd variant). The mixed-entries pattern above (same `name:`, one `use_packaged:` entry, one `exec:` entry — init system at deploy time picks) is the supported way to carry both.

            If you find yourself reaching for a `-host` suffix on a candy name, reach for a second `service:` entry instead. The same rule applies to `-pod` suffixes for the inverse case (a candy that needs container-only behavior under systemd targets).

            `charly box validate` does NOT (yet) statically reject `*-host` / `*-pod` candy names, because some legitimate uses might exist (a candy whose package literally only exists on host distros). The rule lives in the project rulebook "Init-system polymorphism via mixed `service:` entries" (`AGENTS.md` / `CLAUDE.md`) + this skill + `/charly-infrastructure:supervisord` — agents that load any of those before authoring will see the guidance. Canonical worked examples: `/charly-coder:sshd` (mixed), `/charly-infrastructure:virtualization` (mixed; CANONICAL example), `/charly-infrastructure:postgresql` (use_packaged-only).

            ## Volume Declaration

            ```yaml
            my-app:
              candy:
                volume:
                  - name: data
                    path: "~/.myapp"
            ```

            Names must match `^[a-z0-9]+(-[a-z0-9]+)*$`. Docker/podman volume names become `charly-<image>-<name>`. Collected across the full image base chain; first declaration wins.

            ## Security Declaration

            ```yaml
            my-app:
              candy:
                security:
                  privileged: false
                  cap_add:
                    - SYS_PTRACE
                  devices:
                    - /dev/dri
                  security_opt:
                    - label:disable
                  group_add:
                    - keep-groups
                  mounts:
                    - /dev/input:/dev/input:rw
                    - tmpfs:/run/udev:rw,size=1m
                  shm_size: "1g"
                  memory_max: "8g"         # hard limit
                  memory_high: "6g"        # soft limit
                  memory_swap_max: "0"     # disable swap
                  cpus: "4.0"              # CPU quota
            ```

            Security settings merge across candies (union for lists; `privileged` true if any candy sets it; smallest-wins for resource caps). Box-level `security:` in `charly.yml` overrides `privileged` and replaces resource caps.

            Resource caps (memory / cpus) bound the blast radius of a Chrome crash loop on the chrome candy. See `/charly-selkies:chrome` (Resource Caps) and `/charly-infrastructure:supervisord` for the (generic) eventlistener pattern.

            ---

            ## port_relay

            Ports needing an eth0 → loopback socat relay inside the container. For services that bind only to 127.0.0.1. Auto-adds `socat` dependency and generates a relay service.

            ```yaml
            my-app:
              candy:
                port_relay:
                  - 9222
            ```

            Note: the chrome candy uses a dedicated `cdp-proxy` supervisord service instead of `port_relay`, to handle Chrome 146+ Host header validation.

            ## Port Protocol Annotations

            Ports support a protocol prefix that controls tunnel backend scheme and EXPOSE format:

            ```yaml
            my-app:
              candy:
                port:
                  - 18789                   # http (default) → tailscale --https, cloudflared http://
                  - "https+insecure:3000"   # https+insecure → HTTPS tunnel with self-signed OK
                  - tcp:5900                # raw TCP
                  - "tls-terminated-tcp:22" # tailscale TLS-terminated-tcp
                  - udp:47998               # EXPOSE /udp, not tunneled
                  - 9222                    # http (default)
            ```

            Tailscale schemes: `http`, `https`, `https+insecure`, `tcp`, `tls-terminated-tcp`. Cloudflare adds `ssh`, `rdp`, `smb`. HTTPS backends (Traefik with self-signed certs) MUST use `https+insecure` — plain `http` proxying to HTTPS returns 404.


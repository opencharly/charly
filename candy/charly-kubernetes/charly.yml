charly-kubernetes:
    candy:
        version: 2026.218.1200
        description: |-
            Concept candy owning the charly-kubernetes kind-authoring skills (kubernetes schema + cluster probes). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the kubernetes concept candy's skill entities are present and generated into plugins/kubernetes/skills
              id: charly-kubernetes-present
              context:
                - build
              command: "true"
check-k8s-skill:
    skill:
        name: check-k8s
        family: kubernetes
        owner: charly-kubernetes
        description: |-
            Kubernetes cluster-probe declarative check verb — the `kube:` check verb (nodes, pods, ingress, storage class, addon health, apply/delete, and arbitrary resource GETs) served out-of-process by the candy/plugin-kube plugin (vendored client-go; no external kubectl required).
        triggers:
            - "the `kube:` check verb / Kubernetes cluster probing from a candy/box plan (out-of-process plugin; nodes, pods, ingress, wait-ready, storageclass, addons, apply/delete, raw resource GETs)"
        content: |
            MUST be invoked before any work involving: the declarative `kube:` check
            verb, cluster-readiness probes from a candy/box plan, ingress / storage
            class assertions, k3s default-addon health checks, or authoring `kube:`
            steps in a candy/box plan (the candy's `plan:` list) in charly.yml.

            **There is no host `charly check kube` command.** `kube` is a DECLARATIVE
            check verb only: it is authored as a `kube: <method>` inline Op in a candy/box
            plan `check:` step and dispatched through the provider registry to the
            out-of-process `candy/plugin-kube` module — the same way the bed's checks run
            under `charly check live` / `charly check run`. The Kubernetes
            cluster-probe implementation (and the `k8s.io/client-go` +
            `k8s.io/apimachinery` dependency) lives entirely in that external plugin, NOT
            in charly's core. This mirrors the `adb:` and `appium:` verbs (see
            charly/check_cmd.go).

            The cluster-probe verb is spelled `kube`; the deploy KIND is spelled
            `kubernetes` (`kind: kubernetes`, a `kubernetes:` entity or cross-ref).

            ## Method surface

            Every method below is the `kube:` map's `method:` (or the scalar value for a bare
            method). The Modifiers column names the kube-exclusive fields that live INSIDE the
            `kube:` map — EXCEPT `timeout:`, which is a shared `#Op` sibling of the `kube:` key.
            A `kube:` step is a `check:` step.

            | `kube:` value | Modifiers | Output |
            |---|---|---|
            | `nodes` | — | `<name> <Ready\|NotReady>` per line |
            | `wait-nodes` | `kube_count:` (N), `name:` (host), `timeout:` (120s) | block until N (or the named) node is Ready |
            | `pods` | `namespace:`, `label:` (selector) | `<ns>/<name> <phase>` per line |
            | `wait-ready` | `kube_kind:` (K), `name:` (N), `namespace:`, `timeout:` (120s) | block until the resource is Ready |
            | `ingress` | `namespace:` | `<ns>/<name> class=<c> hosts=<h> backends=<b>` |
            | `ingressclass` | — | `<name> default=<bool>` |
            | `storageclass` | — | `<name> default=<bool>` |
            | `service` | `namespace:` | `<ns>/<name> <type> <clusterIP> <externalIP>` |
            | `lb-external-ip` | `namespace:`, `name:` (svc), `timeout:` (60s) | print the assigned external IP |
            | `addons` | `namespace:` (kube-system), `timeout:` (180s) | roll-up: Traefik + ServiceLB + local-path all Ready |
            | `apply` | `manifest:` (path), `namespace:` | apply multi-doc YAML via the dynamic client |
            | `delete` | `manifest:` (path), `namespace:` | delete the resources named in the manifest |
            | `raw` | `kube_resource:` (plural), `kube_group:`, `kube_version:` (v1), `name:`, `namespace:` | GET an arbitrary resource as JSON |

            The full kube-map field set: `name:`, `namespace:`, `label:`, `cluster:`,
            `kubeconfig:`, `kube_context:`, `kube_kind:`, `kube_count:`, `manifest:`,
            `kube_resource:`, `kube_group:`, `kube_version:`, `json:` (all inside the `kube:`
            map). The only shared `#Op` sibling a `kube:` step commonly carries is `timeout:`.

            ## Cluster selection

            Every method accepts the same three cluster-selection modifiers. The plugin
            resolves the `cluster:` profile to a concrete kubeconfig context via the generic
            `cc.ResolveClusterContext` reverse-leg; the precedence is:

            1. `kubeconfig: <path>` — direct kubeconfig file pointer. Overrides
               everything.
            2. `cluster: <name>` — a `kind: kubernetes` cluster template name. The
               plugin resolves it via `ResolveKubernetesEntityViaExecutor` (the
               project `charly.yml` loader) to the template's `kubeconfig_context:`,
               which selects the context; the kubeconfig path defaults to `$KUBECONFIG`
               then `~/.kube/config`.
            3. `kube_context: <name>` — override the kubeconfig context directly.
            4. None given → current-context of the default kubeconfig (matches
               `kubectl` with no flags).

            `charly fleet add vm:k3s-srv` (or any deploy whose layers include
            `k3s-server`) provisions a cluster whose kubeconfig is merged into the
            default kubeconfig under a context named after the deploy (the plugin-side
            `k3s-post-provision` finalization dispatched by `candy/plugin-fleet`'s
            `k3sPostProvision` (InvokeProviding `verb:kube` peer-to-peer — the former
            core `invokeKubePluginWithBroker` seam is deleted), which retrieves the
            kubeconfig, rewrites its
            guest-forwarded server, and merges it via `mergeKubeconfig` — all inside
            `candy/plugin-kube`), so a plan step can then address it with `cluster: k3s-srv`:

            ```yaml
            - check: every node reports Ready
              kube:
                method: nodes
                cluster: k3s-srv
              stdout: {contains: "Ready"}
              context: [deploy]
            ```

            ## Declarative `kube:` steps in a candy's plan

            The verb is authored from a candy's plan steps via the `kube:`
            discriminator on a step's `Op`. In the unified node-form the plan IS a `plan:`
            list — each step is an ordered list item under the candy's `plan:` (named by its
            optional `id:`). Every method above maps to a method name; its kube-exclusive
            fields (`name:`, `namespace:`, `cluster:`, `kubeconfig:`, `kube_kind:`,
            `kube_count:`, `manifest:`, `kube_resource:`, `kube_group:`, `kube_version:`) go
            INSIDE the `kube:` map, while `timeout:` stays a sibling. A `kube:` step is a
            `check:` step.

            Example from the main repo's `charly.yml` — the `check-k3s-vm` bed's
            cluster-readiness steps, each naming ITS OWN `kind: kubernetes` profile by literal:

            ```yaml
            check-k3s-vm:
              vm:
                from: k3s-vm
                disposable: true
                plan:
                  # … guest-side command / process / port / file steps elided …
                  - check: kubernetes=wait-nodes
                    id: kv-kubernetes-wait-nodes
                    kube:
                      method: wait-nodes
                      cluster: "check-k3s-vm-ctx"    # this bed's OWN kind:kubernetes profile
                      kube_count: 1
                    timeout: 180s
                    stdout: {contains: "Ready"}
                    context: [runtime]
                  # `addons` BLOCKS until Traefik + ServiceLB + local-path are all Ready, so it
                  # MUST precede any ingressclass/storageclass step — those resources are
                  # registered by the addon stack. Ordering matters: `ingressclass`/`storageclass`
                  # are one-shot list verbs with no internal wait, and they exit 0 on an EMPTY
                  # list, so a `contains` matcher run before the addons settle FAILS rather than
                  # waits. Gate first, assert second.
                  - check: kubernetes=addons
                    id: kv-kubernetes-addons
                    kube:
                      method: addons
                      cluster: "check-k3s-vm-ctx"
                    timeout: 240s
                    context: [runtime]
                  - check: kubernetes=ingressclass
                    id: kv-kubernetes-ingressclass-traefik
                    kube:
                      method: ingressclass
                      cluster: "check-k3s-vm-ctx"
                    stdout: {contains: "traefik"}
                    context: [runtime]
            ```

            **A `kube:` step belongs to whoever can NAME the cluster — which is the deploy, not
            a generic candy.** The bed above names `check-k3s-vm-ctx`, a `kind: kubernetes` profile it
            alone owns, pinned to its own per-deploy kubeconfig context. Its sibling bed
            `check-k8s-deploy` names `check-k8s-deploy-cluster-ctx`, so the two never resolve
            through each other's context even though both deploy the SAME shared `kind: vm`
            entity.

            **Do NOT write `cluster: "${DEPLOY_NAME}"`.** `${DEPLOY_NAME}` is a runtime-only
            check var holding the sanitized name (`:`/`.`/`/` → `-`) of the deployment under
            check, and it is not a cluster selector: for a VM live check it is seeded from the
            `kind: vm` ENTITY name (`candy/plugin-check/live_gather.go`, `pluginCheckLiveVM`),
            which every bed deploying that entity SHARES — so it addresses another deployment's
            context, or none at all, and the step fails with `no kubeconfig context selected`.
            Threading the profile through a deploy-set env var is worse, not better: an
            unresolved check var is a SKIP rather than a failure (`sdk/kit/planrun.go`), and the
            VM check-var environment is a fixed map carrying no arbitrary deploy env, so such a
            step goes silently vacuous. A generic candy that must prove its own control plane
            came up probes it IN-VENUE instead — `candy/k3s-server/charly.yml` drives the k3s
            client entrypoint (`/usr/local/bin/kubectl`) against the server's local kubeconfig,
            needing no host kubeconfig merge, no port-forward, and no `kind: kubernetes` entity.

            (`${DEPLOY_NAME}` is UPPERCASE because the check-var expander only recognizes
            uppercase names; a lowercase `${deploy_name}` — the artifact-path token — is NOT a
            check var and is rejected by `charly box validate` in kube identifier fields.)

            `wait-nodes` with `name:` set matches a single specific node — the shape a
            multi-node deploy uses to confirm one named worker joined. Without `name:`, it
            waits until `kube_count:` nodes are Ready.

            ## Method notes

            - **apply / delete** — limited to the kinds in `kindToPluralResource()`
              (in the plugin's `cluster.go`). Static table by design; adding a new
              kind is a one-line addition, avoiding the RESTMapper discovery bloat.
              Documents without a namespace inherit `namespace:`.
            - **raw** — escape hatch for any resource not covered by the named
              methods. `kube: {method: raw, kube_resource: nodes}` lists nodes;
              `kube: {method: raw, kube_resource: configmaps, namespace: kube-system,
              name: foo}` prints one ConfigMap as JSON.
            - **addons** — assumes the stock k3s addon stack (Traefik, ServiceLB,
              local-path-provisioner) in `kube-system`. Explicit `disable:` in a
              k3s-server layer will cause this method to fail — the failure is
              intentional since the test speaks to "default k3s stack healthy".
            - **lb-external-ip** — polls `.status.loadBalancer.ingress[].ip` /
              `[].hostname` until one appears; for k3s this is ServiceLB
              (klipper-lb) advertising the host's node IP.

            ## Implementation

            The verb is dispatched out-of-process; the client-go stack does not link into
            charly's core binary.

            - `candy/plugin-kube` — the out-of-tree plugin module that owns the verb and
              the entire `k8s.io/client-go` + `k8s.io/apimachinery` dependency:
              - `provider.go` — the Provider that advertises the `kube` verb; the
                registry routes a `kube:` step to it (`ResolveVerb("kube")` → its
                `grpcProvider` → `invokeVerbProvider` hands it the full `#Op` as
                `params_json`).
              - `cluster.go` — builds the `rest.Config` from kubeconfig + context (the
                dynamic client via `k8s.io/client-go/dynamic` + `unstructured` walkers,
                no typed clientset) and `kindToPluralResource()` for apply/delete.
              - `methods.go` — the `dispatch()` method router + the 13 method
                implementations (`runNodes`, `runWaitNodes`, `runApply`, …).
              - `merge.go` — `mergeKubeconfig`: the clientcmd merge that folds a retrieved
                k3s kubeconfig into the operator's `~/.kube/config` under a named context
                (so the `k8s.io/client-go/tools/clientcmd` dependency lives here too, not
                in core). Called DIRECTLY by this same plugin's `k3s_post.go`
                (`k3sPostProvision`) — no separate host-orchestrated merge round-trip.
              - `k3s_post.go` — the WHOLE k3s post-provision finalization (S3, FINAL/K5
                unit 6, relocated wholesale from the former `charly/k3s_post.go`, itself
                now DELETED — see below): `k3sPostProvision` checks the retrieved-kubeconfig
                path, rewrites its GUEST-local server URL to the HOST-forwarded port
                (`deployVMForwards` resolves the deploy tree node + the `kind:vm` entity's
                declared `port_forwards` by self-loading the project PLUGIN-SIDE — K-wave
                W3a A3-phase-2, `sdk/loaderkit.ResolveMergedTreeViaExecutor` /
                `ResolveVmEntityViaExecutor` — no HostBuild round trip remains for this
                leg, then reads the PERSISTED port-forward allocation ledger via the
                PLUGIN-SIDE `hostConfigResolveVmState` → `sdk/loaderkit.ResolveVmStateViaExecutor`
                read (the config-resolve HostBuild seam is DELETED, K-wave 2 cone R2 bank D —
                the SAME read `candy/plugin-vm`'s own `hostConfigResolve` + `candy/plugin-deploy-vm`'s
                `resolvePriorVmState` use, R3 — a FIX-ROUND regression fix: a direct
                `deploykit.LoadDeployConfigForRead` call from this out-of-process plugin
                silently found nothing every time, since `deploykit.DeployStateHost` is
                wired only by charly-core's own `init()`), then calls `mergeKubeconfig`
                directly.
              - `schema/kube.cue` — the plugin's served CUE schema: the `#KubeInput` def
                carries the method enum + every kube modifier, served over the Describe
                channel and spliced onto the base for validation. Authoring is unchanged
                (`kube: nodes`, not `plugin: kube`); the internal plugin/plugin_input wire
                envelope the sugar desugars to is never authored.
            - `charly/k8s_plugin.go` / `charly/k3s_post.go` / `charly/k8s_config.go` are
              ALL DELETED — the former core seam that built a synthetic `kube:` `#Op` and
              dispatched it to the plugin WITH the reverse-channel broker
              (`invokeKubePluginWithBroker`) is gone. `candy/plugin-fleet`'s own
              `k3sPostProvision` (`secrets_artifacts.go`) InvokeProviders `verb:kube`
              peer-to-peer directly (`exec.InvokeProvider(ctx, "verb", "kube", …)`, with
              an explicit `kit.ShellExecutor{}` venue override reproducing the original
              "broker only, no live venue" contract) to trigger the
              `k3s-post-provision` method. The retrieve-check, port-forward rewrite, and
              merge all run INSIDE `candy/plugin-kube` (see `k3s_post.go` above); the
              cluster-template lookup that used to need `charly/k8s_config.go`'s
              `findKubernetesSpec` now self-loads plugin-side too (`sdk/loaderkit.ResolveKubernetesEntityViaExecutor`,
              K-wave W3a A3-phase-2). No client-go import, and no `kube:`-specific host
              seam, remains in core.

            There is no `charly/k8s_cmd.go`, `kubeMethods` table, `runKube` dispatcher,
            `posKube*` flag builder, or `k8sClusterFlags`/`LoadClusterProfile` symbol —
            all were removed when the verb was externalized.

            ## Related skills

            - `/charly-check:check` — the unified `charly check` surface (image / live /
              run), the plan-step vocabulary, and how the provider registry dispatches
              declarative verbs.
            - `/charly-kubernetes:kubernetes` — deploying images to a Kubernetes cluster
              (`kind: kubernetes` cluster templates, Kustomize generation, `charly fleet`).
            - `/charly-internals:plugin` — the Provider model and the out-of-process
              plugin dispatch the `kube:` verb rides on.
            - `/charly-infrastructure:k3s` — the k3s-server / k3s-agent candies whose
              plans author these `kube:` readiness steps.
helm-skill:
    skill:
        name: helm
        family: kubernetes
        owner: charly-kubernetes
        description: |-
            The helm words — the `step:helm-release` install step (an `helm upgrade --install` performed IN-VENUE, returning a `helm uninstall` ReverseOp) and the `verb:helm` declarative release-status assertion, both served out-of-process by candy/plugin-helm; plus the `helm_charts:` deploy field the k8sgen emitter renders as a kustomize `helmCharts:` transformer entry.
        triggers:
            - "`step:helm-release` / `verb:helm` / installing a Helm chart from a candy plan / the `helm_charts:` deploy field and its kustomize `helmCharts:` emission / the `--enable-helm` apply path"
        content: |
            MUST be invoked before any work involving: the `helm-release` install
            step, the `helm:` check verb, the `helm_charts:` deploy field, the
            `--enable-helm` kustomize apply path, or `candy/plugin-helm`.

            charly speaks helm through **two words and one deploy field**, and none of
            them puts helm knowledge in the kernel — `candy/plugin-helm` is a
            standalone Go module served out-of-process over go-plugin gRPC via the
            SDK, and it owns NO Kubernetes client library (the verb is EXEC-based over
            the live DeployExecutor reverse channel).

            | Surface | Class | What it does |
            |---|---|---|
            | `helm-release:` | install step (`step:helm-release`) | `helm upgrade --install` IN-VENUE; returns a `helm uninstall` ReverseOp |
            | `helm:` | check verb (`verb:helm`) | assert a release's existence / status / revision / values hash |
            | `helm_charts:` | `kubernetes:` deploy field | emitted as a kustomize `helmCharts:` entry, applied with `--enable-helm` |

            ## `step:helm-release` — the install step

            A plugin-contributed `external:helm-release` install-step KIND (F3) whose
            OPAQUE payload is the plugin's `#HelmReleaseStep`, carried through the
            InstallPlan IR and validated against the plugin's served schema at
            authoring time. Field set:

            | Field | Required | Meaning |
            |---|---|---|
            | `chart` | yes | chart name (bare, resolved via `repo`) or a full reference |
            | `release` | yes | the release name |
            | `repo` | no | chart repository URL; omit for a pre-added repo or an OCI ref |
            | `version` | no | pin the chart version (`--version`) |
            | `namespace` | no | target namespace (created if absent) |
            | `values` | no | inline values map |
            | `values_files` | no | values YAML paths, venue-relative (`-f`) |
            | `wait` | no | `--wait` for readiness |
            | `timeout` | no | wait timeout, e.g. `5m` |

            **Kubeconfig resolution is a three-arm precedence chain**, not a fixed
            path. In order, first match wins:

            1. an operator-set `KUBECONFIG` — never clobbered;
            2. the k3s guest default `/etc/rancher/k3s/k3s.yaml`, when present;
            3. the standard `$HOME/.kube/config`, when present.

            Arm 3 is the one that carries a non-k3s cluster: on any venue that is
            not a k3s guest, it is what makes an unconfigured `helm-release` step
            find the cluster at all. helm reads `KUBECONFIG` itself, so exporting it
            is the whole resolution.

            **Teardown is record-and-replay.** The step returns a `helm uninstall`
            ReverseOp that the host records and replays at teardown — you never author
            an uninstall step yourself.

            ## The authoring law this surfaced: mutating installs live in a CANDY

            A bed's own plan runs **verify-only** (mutating steps skipped), and
            `charly fleet add` lowers only **candy** plans' `run:` steps. So any
            mutating install — the `helm-release` invocation itself, and any in-venue
            `kubectl wait` it depends on — MUST live in a candy's `run:` steps, never
            in the bed's own plan. Authoring the install into the bed produces a bed
            that passes while installing nothing.

            A second-order trap rides along: a `check:` step does **not** run during
            `fleet add`, so the `k3s-server` candy's own node-ready check cannot gate
            your install. An install candy waits for the node itself.

            **`context:` is what decides when a step runs**, and the example below
            depends on it. `context: [deploy]` runs during `charly fleet add` —
            that is where the mutating install belongs. `context: [runtime]` runs
            under `charly check live` / `charly check run` against the deployed
            system. That is how one candy can both install a release at deploy time
            and assert it at check time without the assertion running too early: the
            `check:` step below is `[runtime]`, so it does not execute during
            `fleet add`, which is exactly what the law above describes.

            `candy/helm-chart` is the worked example — the `check-helm-vm` bed's
            install leg, reproduced in full because the readiness step's exact
            shape is the lesson:

            ```yaml
            helm-chart:
              candy:
                require: [k3s-server, plugin-helm]   # plugin-helm must be in the
                plan:                                # scanned candy set to be built
                  - run: wait for the k3s node to be Ready in-venue
                    id: hc-wait-node-ready
                    command: |
                      set -euo pipefail
                      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                      # The kubeconfig lands when the k3s API server STARTS, which can
                      # be seconds-to-minutes after the k3s service starts. So poll
                      # /readyz until the apiserver answers, THEN let kubectl wait for
                      # the node. Waiting on the node alone fails on a cold cluster.
                      deadline=$(( $(date +%s) + 300 ))
                      until /usr/local/bin/kubectl get --raw /readyz >/dev/null 2>&1; do
                        if [ "$(date +%s)" -ge "$deadline" ]; then
                          echo "k3s apiserver did not become ready within 300s" >&2
                          exit 1
                        fi
                        sleep 1
                      done
                      /usr/local/bin/kubectl wait --for=condition=Ready node --all --timeout=300s
                    context: [deploy]
                  - run: install the chart via the external helm-release step
                    id: hc-helm-release-install
                    context: [deploy]
                    helm-release:
                      repo: https://prometheus-community.github.io/helm-charts
                      chart: prometheus-pushgateway
                      release: web-pushgateway
                      namespace: web
                      wait: true
                      timeout: 5m
                  - check: the release is deployed in the web namespace
                    id: hc-release-exists
                    context: [runtime]
                    helm:
                      method: release-exists
                      release: web-pushgateway
                      namespace: web
            ```

            Three things about that readiness step are deliberate. **The `/readyz`
            poll is bounded and condition-driven**, with an explicit deadline and a
            non-zero exit — it is a synchronization primitive, not an R4
            `sleep`-and-hope; a bare `sleep 60` in its place is the workaround the
            rule forbids. **Waiting on the node alone is not enough**: on a cold
            cluster `kubectl wait node` runs before the apiserver answers at all, so
            the step must gate on the apiserver first.

            And its `export KUBECONFIG=…` is **the candy's own line, for its own
            `kubectl` calls in that one shell** — it is not you configuring the helm
            step, and it does not contradict the three-arm chain above. Each step
            runs in its own shell, so that export does not reach the
            `helm-release:` step; that step resolves the kubeconfig itself, by the
            chain. The candy hardcodes the k3s path because it is a k3s-guest bed
            fixture; a candy for another venue would not.

            Note the Agent Driven Evaluation (ADE) split (R3) — ADE is the
            spec-is-the-test discipline owned by `/charly-check:check`: the candy that
            installs the release also asserts it exists; the bed's own plan keeps only
            the deeper status/revision assertions.

            **Where the `helm` binary comes from.** The step shells `helm` IN-VENUE,
            so the venue must already carry it — `candy/plugin-helm` ships the WORD,
            never the binary. The binary comes from the **`kubernetes` candy** (the
            Kubernetes client toolchain: `kubectl`, `helm`, `k3d`, from the distro
            package with an upstream `get-helm-3` fallback). `check-helm-vm` composes
            it explicitly — `add_candy: [k3s-server, kubernetes, helm-chart]` — and a
            venue that omits it fails the step at execution, not at authoring. Compose
            `kubernetes` into any venue where you author a `helm-release` step.

            ## `verb:helm` — the declarative assertion

            The `verb:kube` analog. Its PRIMARY input field is `method`, so
            `helm: release-exists` desugars to `{method: "release-exists"}`.

            | `helm:` method | Method-exclusive modifiers | Asserts |
            |---|---|---|
            | `release-exists` | — | the release exists |
            | `status` | `status:` (default `deployed`) | the release status |
            | `revision` | `revision:` (int) | release revision ≥ N |
            | `values-hash` | `values_hash:` | SHA-256 of the rendered values |

            Every method takes `release:` (required) and `namespace:` (default
            `default`). The verb is EXEC-based and probes a live cluster, so it runs
            under `charly check live` / `charly check run` (runtime context) and
            **skips visibly under `charly check box`** — there is no cluster at image
            time, and a skip is reported, never silently green.

            ## The `kubernetes:` substrate arm — the `helm_charts:` field

            A `kubernetes:` deploy does NOT shell out to helm — that would be a
            boundary-law violation. It declares `helm_charts:` on the deploy, which
            the k8sgen emitter translates into a kustomize `helmCharts:` transformer
            entry in the OVERLAY kustomization (the base stays chart-free).

            `helm_charts:` is a list of `#HelmChart` entries. Six fields — a SUBSET
            of the step's, with no `values:`, `wait:` or `timeout:` (kustomize renders
            the chart, so there is no release to wait on at apply time):

            | Field | Required | Meaning |
            |---|---|---|
            | `chart` | yes | chart name → the kustomize entry's `name` |
            | `release` | yes | release name → `releaseName` |
            | `repo` | no | chart repository URL |
            | `version` | no | chart version to pin |
            | `namespace` | no | target namespace |
            | `values_files` | no | **first entry only** → `valuesFile`; see below |

            ```yaml
            my-app:
              kubernetes:
                image: my-app
                from: production
                deploy:
                  helm_charts:
                    - repo: https://prometheus-community.github.io/helm-charts
                      chart: prometheus-pushgateway
                      release: web-pushgateway
                      namespace: web
            ```

            **`values_files` is where the two arms diverge — do not assume it
            carries over.** A kustomize `helmCharts` entry holds exactly one
            `valuesFile`, so the emitter takes the FIRST entry and silently discards
            the rest (`candy/plugin-k8sgen/k8sgen.go:204-205`). The `helm-release:`
            step passes every file, one `--values` each. So
            `values_files: [base.yaml, prod.yaml]` applies both files through the
            step and only `base.yaml` through a `kubernetes:` deploy — no error, no
            warning. If a `kubernetes:` deploy needs several values files, pre-merge
            them into one.

            The emitter also sets `includeCRDs: true` on every entry,
            unconditionally (`k8sgen.go:207`); there is no field to turn it off.

            `chart`, `release`, `repo`, `version` and `namespace` do mean the same
            thing in both arms, so those transfer between venues unchanged.

            Because the kustomize helmCharts transformer is gated behind
            `--enable-helm`, which `kubectl apply -k` cannot pass, the apply path
            renders first: `kubectl kustomize --enable-helm <overlay> | kubectl apply
            -f -` (and the symmetric form for delete).

            ## Beds

            - `check-helm-vm` — the R10 bed: a disposable `k3s-server` guest,
              `candy/helm-chart` as the install leg, `verb:helm` + `kube:` assertions.
              Its own `kind: kubernetes` profile is `check-helm-vm-ctx`, per-deploy
              scoped so it never resolves through a sibling bed's context.
            - `check-k8s-deploy` — proves the `helm_charts:` emission and the
              `--enable-helm` apply on the externalized `deploy:kubernetes` substrate.

            ## Related skills

            - `/charly-kubernetes:check-k8s` — the `kube:` verb these beds pair with.
            - `/charly-kubernetes:kubernetes` — the `kubernetes:` deploy substrate and
              its Kustomize generation.
            - `/charly-check:check` — the plan-step vocabulary and how the provider
              registry dispatches declarative verbs.
            - `/charly-internals:plugin` — the Provider model and out-of-process
              dispatch this rides on.
            - `/charly-internals:install-plan` — defines the vocabulary this page
              uses for the step: the **InstallPlan IR** the step is carried through,
              the **F3** plugin-contributed `external:<word>` step KIND and its
              **OPAQUE payload**, and the **ReverseOp** record-and-replay teardown
              (see that skill's step-kinds reference page).
            - `/charly-infrastructure:k3s` — the `k3s-server` candy the beds deploy.
            - `/charly-coder:kubernetes-layer` — the `kubernetes` candy that installs
              the `helm` binary the step shells in-venue.
kubernetes-skill:
    skill:
        name: kubernetes
        family: kubernetes
        owner: charly-kubernetes
        description: |-
            MUST be invoked before any work involving: `charly fleet add`, `charly fleet from-box`, Kustomize manifest generation, cluster profiles, Kubernetes deployments, `deploy:` block in deploy spec, or OCI-label capabilities.
        content: |
            # Kubernetes — Deploying OpenCharly Images to Kubernetes Clusters

            ## Overview

            OpenCharly can deploy built images to a Kubernetes cluster by emitting a Kustomize `base/` + `overlays/` tree. The deployment schema stays **target-agnostic** — the deploy node describes *what the workload needs* (kind, replica, resources, exposure, storage, probes); a per-cluster **`kind: kubernetes` cluster template** (the `kubernetes:` entity, which absorbed the former cluster-profile file) supplies the Kubernetes-specific knobs (storage class, ingress class, cert issuer, secret backend).

            Every box runtime contract is baked into OCI labels at build time, so **a Kubernetes deploy is possible without access to `charly.yml`** — the `charly fleet from-box` verb reads capabilities from the pushed image alone.

            ## Quick reference

            | Action | Command | Description |
            |---|---|---|
            | Add Kubernetes deploy | `charly fleet add <name> <ref>` | Read BoxConfig + the deploy node + the `kind: kubernetes` cluster template; emit `.opencharly/k8s/<name>/` Kustomize tree |
            | Source-less deploy | `charly fleet from-box <registry/name:tag> [name] --cluster <name>` | Deploy from OCI labels only — no `charly.yml` needed (see Part F.10) |
            | Sync to cluster | `charly fleet sync <name>` | `kubectl apply -k .opencharly/k8s/<name>/overlays/default` |
            | Show generated manifests | `charly fleet show <name>` | `kubectl kustomize …` — see what would apply |
            | Delete Kubernetes deploy | `charly fleet del <name>` | Remove overlay dir; base stays if other instances reference it |

            ## The three-layer model

            | Concern | Schema slot | OCI label home |
            |---|---|---|
            | **Build** — what goes INTO the image | `box.build:` (or legacy `BoxConfig`) | no (consumed at build) |
            | **Capabilities** — box runtime contract | `box.capabilities:` (or layer rollups) | **yes** — every field under `ai.opencharly.*` |
            | **Deployment** — how to run the image | a name-first deploy node (substrate kind at the edge — here `kubernetes:`) in `charly.yml` + `~/.config/charly/charly.yml` overlay | no |

            The completeness invariant: every exported field on `spec.BoxMetadata` (there is no more `Capabilities` alias — see `/charly-internals:capabilities`) has a `CapabilityLabelMap` entry. A compile-time test enforces this — a new capability field without a label mapping fails the build. See `sdk/deploykit/capabilities.go`.

            ## Deployment schema — target-agnostic fields

            A Kubernetes deployment is a name-first `kubernetes:` deploy: the `kubernetes:` value carries the
            scalars + the cross-refs (`image:` = the box to deploy, `from:` = the `kind: kubernetes`
            cluster template) AND every non-scalar field (resources / security / expose /
            storage / probes / the `deploy:` deploy-knobs block) — all inline in the `kubernetes:`
            value.

            ```yaml
            openclaw:
              kubernetes:
                image: openclaw                 # the box to deploy (falls back to the deploy name)
                from: production                # cross-ref → inherit the kind:kubernetes cluster template
                kind: service                   # service | daemon | batch | scheduled | oneshot
                replica: 3
                restart: always                 # always | on-failure | never (honored on Pod/Job/CronJob)
                resources:
                  cpu_request: "500m"
                  memory_request: 512Mi
                security:
                  memory_max: 2Gi               # → resources.limits.memory
                  cpus: "1.5"                   # → resources.limits.cpu
                expose:
                  host: openclaw.example.com
                  path: /
                  tls: true                     # → cert-manager annotation from the cluster template
                storage:
                  - {name: data, size: 20Gi, class_hint: fast, access: single-writer}
                probes:
                  liveness:  {http: {path: /healthz, port: 8080}}
                  readiness: {http: {path: /ready,   port: 8080}}
                deploy:
                  namespace: apps               # optional override of the cluster template default
                  patches: []                   # escape hatch: strategic / JSON6902 patches
                  raw: []                       # escape hatch: paths to raw manifests included verbatim
            ```

            **Workload kind heuristic** (`selectWorkloadKind`, inside `candy/plugin-k8sgen/k8sgen.go` — the compiled-in generator candy itself; reached from `candy/plugin-kube/materialize.go`'s `materializeKustomize` via `verb:k8sgen`/`OpEmit` peer dispatch, PLUGIN-SIDE now — the former core `charly/k8s_generate.go` is deleted, K5-A item 6):

            ```
            kind: service   + storage: []       → Deployment
            kind: service   + storage: [...]    → StatefulSet  (auto volumeClaimTemplates)
            kind: daemon                        → DaemonSet
            kind: batch                         → Job
            kind: scheduled (+schedule:)        → CronJob
            kind: oneshot                       → Pod
            ```

            Explicit override: `deploy.workload: Deployment` (rare — prefer `kind:`).

            ## Cluster template (`kind: kubernetes`)

            One `kind: kubernetes` entity per cluster, declared name-first in `charly.yml`. The `kubernetes:` kind **absorbed the former `kind: cluster-profile` file** — `charly migrate` synthesizes a `kind: kubernetes` entry from any pre-existing `clusters/<name>.yaml`. It is the **only** place cluster-specific Kubernetes knobs live; a deploy reaches it by name through its `from:` cross-ref. The `kubernetes:` value carries the scalars (`box:` cross-ref, `kubeconfig_context:`, `admission_policy:`, `default_namespace:`) AND every non-scalar policy block (storage / ingress / secret / image_default / pod_default / defaults) — all inline in the `kubernetes:` value.

            ```yaml
            production:                          # a kind: kubernetes cluster template (name-first)
              kubernetes:
                box: ""                          # empty → a cluster-policy-only template (the workload box is named on the deploy)
                kubeconfig_context: gke_prod_us-east1
                admission_policy: restricted     # restricted | baseline | privileged
                default_namespace: apps
                storage:
                  class_default: fast-ssd-retain
                  class_fast: fast-ssd
                  class_cheap: hdd-delete
                  class_encrypted: fast-ssd-luks
                  access_mode_default: ReadWriteOnce
                ingress:
                  enabled: true
                  class: nginx
                  cert_issuer: letsencrypt-prod  # cert-manager ClusterIssuer
                  path_type_default: Prefix
                secret:
                  backend: external-secrets      # external-secrets | sealed-secrets | raw
                  store: vault-prod
                  prefix: prod/
                image_default:
                  pull_policy: IfNotPresent
                  pull_secrets: [regcred-prod]
                pod_default:
                  priority_class: standard
                  tolerations: []
                  node_selector: {}
                defaults:
                  labels: {managed-by: opencharly}
            ```

            New cluster = write a new `kind: kubernetes` template; zero deploy changes.

            ## Generator output

            ```
            .opencharly/k8s/<deployment-name>/
            ├── base/
            │   ├── kustomization.yaml           # commonLabels, resources: […]
            │   ├── deployment.yaml              # or statefulset.yaml / daemonset.yaml / job.yaml / cronjob.yaml / pod.yaml
            │   ├── service.yaml
            │   ├── pvc-<name>.yaml              # per storage entry (Deployment/DaemonSet); StatefulSet uses volumeClaimTemplates
            │   ├── ingress.yaml                 # when expose.host set AND the kubernetes template's ingress.enabled
            │   └── raw/                         # copied from deploy.raw:
            └── overlays/
                └── <instance>/                  # "default" for bare name; "prod" for image/prod
                    └── kustomization.yaml       # namespace override + patches from deploy.patches:
            ```

            Apply: `kubectl apply -k .opencharly/k8s/<name>/overlays/<instance>` (or `charly fleet sync <name>`).

            **Egress validation.** Every manifest is validated through `validateEgressValue`/`writeYAML`
            (candy/plugin-kube/materialize.go) before it
            is written: workload / service / pvc / ingress against the `#K8sObject` envelope
            (non-empty `apiVersion`/`kind` + named `metadata`), and the base + overlay
            `kustomization.yaml` against `#Kustomization`. A structurally-broken manifest fails
            deploy generation instead of reaching the cluster. Owned by `/charly-internals:egress`.

            ## Source-less deploy — `charly fleet from-box`

            Proves the self-contained image invariant: a deploy pipeline with **no access to `charly.yml`** can still produce a correct Kustomize tree.

            ```bash
            # On a machine that doesn't have the source repo:
            charly fleet from-box quay.io/myorg/openclaw:v2 openclaw \
                --cluster production --namespace apps
            # Reads: OCI labels (capabilities) + the `production` kind:kubernetes cluster template
            #        + ~/.config/charly/charly.yml (if present, for per-machine overrides)
            # Emits: .opencharly/k8s/openclaw/base/ + overlays/default/
            charly fleet sync openclaw                   # kubectl apply -k ...
            ```

            ## Relevant code

            - `spec/spec/cue_types_gen.go` (generated) — `KubernetesDeploy` (`KubernetesDeployConfig`, the deploy's `deploy:` deploy-knobs block: namespace / workload override / patches / raw; the former `charly/k8s_config.go` is DELETED, K-wave 2)
            - `spec/spec/cue_types_gen.go` (generated) — `KubernetesSpec` (the `kind: kubernetes` cluster template; absorbed the former `ClusterProfile` / `clusters/*.yaml`)
            - `candy/plugin-kube/preresolve.go` — the PLUGIN-side `deploy:kubernetes` preresolver (F6/FINAL-K5-unit-6a, relocated from the DELETED `charly/k8s_deploy_preresolve.go`). `target: kubernetes` is an EXTERNAL deploy substrate (F1): it resolves out-of-process to candy/plugin-kube's `deploy:kubernetes` provider (beside its `kube:` verb), NOT a compiled-in DeployTarget. The preresolver resolves the image Capabilities + the `kind: kubernetes` cluster template by self-loading the project PLUGIN-SIDE (`sdk/loaderkit.ResolveKubernetesEntityViaExecutor`, K-wave W3a A3-phase-2 — no HostBuild round trip remains for this lookup), runs `materializeKustomize` (`materialize.go`) — which InvokeProviders the compiled-in `verb:k8sgen`/`OpEmit` for the manifest docs and `verb:egress`/`OpValidate` to validate each one, entirely peer-to-peer, no host round trip — and ships the egress-validated overlay path in `DeployVenue.Substrate`; the plugin runs `kubectl --context <ctx> apply -k`. The user-facing surface (schema, cluster templates, Kustomize output) is unchanged. See `/charly-internals:install-plan` + `/charly-internals:plugin`.
            - `charly/k8s_generate.go` / `host_build_k8s_generate.go` are DELETED — the former "k8s-generate-kustomize" HostBuild seam they served is retired (K5-A item 6): the Kustomize GENERATION now runs entirely inside `candy/plugin-kube/materialize.go` (see above), and `candy/plugin-fleet/deploy_from_box.go`'s `charly fleet from-box` path calls `materializeKustomize` the same way. The generator itself still lives in `candy/plugin-k8sgen/k8sgen.go`, reached over `verb:k8sgen` peer dispatch, not a core shim
            - `candy/plugin-k8sgen/` — the compiled-in Kustomize GENERATOR candy (M13): `k8sgen.go` (the ported workload/service/pvc/ingress/kustomization builders + the workload-kind heuristic + `GenerateTree`), serving `verb:k8sgen`/`OpEmit` over `spec.KubernetesGenInput` → `spec.KubernetesGenReply` manifest docs; no client-go (split from the heavy external plugin-kube so it resolves in the project-less from-box path)
            - `candy/plugin-fleet/deploy_from_box.go` — the plugin-side `charly fleet from-box` Kubernetes path (`--cluster`), calling `materializeKustomize` the same way (`charly/fleet_from_box_cmd.go` is DELETED, K-wave 2 cone R2 — the pod path lives in `candy/plugin-fleet/from_box_pod.go`)
            - `sdk/deploykit/capabilities.go` — `CapabilityLabelMap` + completeness check, over `spec.BoxMetadata` (`charly/capabilities.go`, this row's former citation, no longer exists — see `/charly-internals:capabilities`)

            ## Related skills

            - `/charly-core:deploy` — unified `charly fleet add`/`del` verb; Kubernetes is one of the five deploy substrates
            - `/charly-internals:capabilities` — OCI label contract the Kubernetes generator reads from
            - `/charly-internals:install-plan` — shared IR across build + deploy targets
            - `/charly-internals:egress` — the CUE egress gate that validates every generated manifest before write (`#K8sObject` / `#Kustomization`)

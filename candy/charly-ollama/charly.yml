charly-ollama:
    candy:
        version: 2026.229.1218
        description: |-
            Metadata concept candy owning the charly-ollama skills whose names have no namesake candy (ollama LLM-server image). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the ollama concept candy's skill entities are present and generated into plugins/ollama/skills
              id: charly-ollama-present
              context:
                - build
              command: "true"

ollama-layer-skill:
    skill:
        name: ollama-layer
        family: ollama
        owner: charly-ollama
        description: |-
            Ollama LLM server on port 11434 with model persistence, CPU-only by default and
            opt-in CUDA/ROCm backends composed at the box level.
            Use when working with Ollama, LLM serving, or local AI model inference.
        content: |-
            # ollama -- Local LLM inference server
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord` |
            | Ports | 11434 |
            | Volumes | `models` -> `~/.ollama` |
            | Aliases | `ollama` -> `ollama` |
            | Service | `ollama` (supervisord) |
            | Install files | none — packaged `ollama` on Arch (`distro:`), upstream tarball in `plan:` elsewhere |
            
            ## Environment Variables
            
            | Variable | Value |
            |----------|-------|
            | `OLLAMA_HOST` | `0.0.0.0` |
            | `OLLAMA_MODELS` | `~/.ollama/models` |
            
            ## Build-time Variables (`var:`)
            
            | Variable | Default | Purpose |
            |----------|---------|---------|
            | `OLLAMA_VERSION` | `latest` | Upstream release for the TARBALL path only — `latest` tracks the newest GitHub release; set a tag (e.g. `v0.32.14`) to pin. Ignored on Arch, where the packaged `ollama` is installed and pacman owns the version |

            ## GPU backends (opt-in, box level)

            The candy itself is CPU-only. A box adds a backend by composing one of
            the sibling candies, which is what keeps a CPU image small:

            | Candy | Adds | Installed size |
            |-------|------|----------------|
            | `ollama-cuda` | NVIDIA CUDA backend (`libggml-cuda.so`) | ~988 MiB |
            | `ollama-rocm` | AMD ROCm/HIP backend (`libggml-hip.so`) | ~2.9 GiB |

            On Arch these are the split `ollama-cuda` / `ollama-rocm` packages, which
            depend on `ollama` and drop their backend into the same
            `/usr/lib/ollama/` runner directory rather than replacing anything.
            
            ## Service Environment (injected into other containers)
            
            | Variable | Template Value | Resolved Example |
            |----------|---------------|-----------------|
            | `OLLAMA_HOST` | `http://{{.ContainerName}}:11434` | `http://charly-ollama:11434` |
            
            Pod-aware: same-container consumers receive `http://localhost:11434`, cross-container consumers receive `http://charly-ollama:11434`. When `charly config ollama` runs, `OLLAMA_HOST` is automatically injected into the global `charly.yml` env. Use `charly config ollama --update-all` to propagate to already-deployed services immediately.
            
            See `/charly-image:layer` for `env_provide` field docs and `/charly-core:charly-config` for `--update-all`.
            
            ## Usage
            
            ```yaml
            # charly.yml
            ollama:
              candy:
                - ollama
            ```
            
            ```bash
            charly alias install ollama    # install host 'ollama' command
            ollama run llama3          # uses the alias
            ```
            
            ## Used In Boxes
            
            - `/charly-ollama:ollama`
            
            ## Cross-Container Integration
            
            The `env_provide` mechanism makes `OLLAMA_HOST` available to all containers. The `hermes` candy auto-detects this variable and configures itself to use local Ollama as its LLM provider (highest priority in the auto-detection chain: `OLLAMA_HOST` > `OLLAMA_API_KEY` > `OPENROUTER_API_KEY`). See `/charly-hermes:hermes` for details on the auto-provider-configuration.
            
            ## Tests
            
            The candy ships its acceptance steps in its `plan:`,
            baked into the `ai.opencharly.description` OCI label (see `/charly-check:check`
            for the full schema). Each step is one inline Op — a probe is a `check:`
            step — and its `context:` list gates where it runs:
            
            - **`context: [build]`** (run under `charly check box`):
              - the ollama binary exists at `/usr/bin/ollama` (`file:` check)
            - **`context: [runtime]`** (run under `charly check live` against a live
              service; `${HOST_PORT:11434}` resolves the deploy-time host port so
              port remapping works unchanged):
              - `GET http://127.0.0.1:${HOST_PORT:11434}/api/tags` returns 200 (`http:` check)
              - `ollama --version` stdout matches `^ollama version` (`command:` check)
              - `ollama list` exits 0 against the live service (`command:` check)
              - three HOST-side steps (`in_container: false`) driving `${CHARLY_BIN}`,
                which prove the companion `command:ollama` plugin end to end:
                `charly ollama help` dispatches, `charly ollama version` round-trips
                the live API, and `charly ollama list` reads the model table. They
                live on the candy rather than on any one bed, so every box composing
                ollama inherits them.
            - one `agent-check:` grades that models pulled via `ollama pull` persist
              under the `~/.ollama` models volume across a service restart.

            A composed backend candy adds its own build-scope probe — `ollama-cuda`
            asserts `libggml-cuda.so` and `ollama-rocm` asserts `libggml-hip.so`, each
            globbed under `/usr/lib/ollama/*/` so a CUDA/ROCm version bump does not
            break the check.
            
            ## Related Candies
            
            - `/charly-infrastructure:supervisord` -- process manager dependency
            - `/charly-distros:cuda` -- CUDA toolkit (GPU boxes compose it at the IMAGE level, not via this candy)
            - `/charly-ollama:ollama-cli` -- the compiled-in `charly ollama` management CLI (candy/plugin-ollama)
            - `/charly-openclaw:openclaw` -- AI gateway that can use Ollama as backend
            - `/charly-hermes:hermes` -- AI agent that auto-detects `OLLAMA_HOST` for local Ollama provider
            
            ## Related Commands
            
            - `/charly-core:charly-config` — Deploy with quadlet (secrets, volumes, env_provide injection)
            - `/charly-core:start` — Start the Ollama service
            - `/charly-core:service` — Manage Ollama service inside container
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Ollama setup or model management
            - LLM serving or inference
            - Port 11434 configuration
            - Ollama model storage volume
            - The `ollama` host alias

charly-tools:
    candy:
        version: 2026.218.1200
        description: |-
            Metadata concept candy owning the charly-tools skills whose names have no namesake candy (CLI utilities). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the tools concept candy's skill entities are present and generated into plugins/tools/skills
              id: charly-tools-present
              context:
                - build
              command: "true"

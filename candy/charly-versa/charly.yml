charly-versa:
    candy:
        version: 2026.218.1200
        description: |-
            Metadata concept candy owning the charly-versa skills whose names have no namesake candy (versa geo/marimo images). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            plugins→candies migration; candy/plugin-marketplace regenerates the plugins/ corpus
            from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the versa concept candy's skill entities are present and generated into plugins/versa/skills
              id: charly-versa-present
              context:
                - build
              command: "true"

airflow-layer-skill:
    skill:
        name: airflow-layer
        family: versa
        owner: charly-versa
        description: |-
            Apache Airflow 3.x with LocalExecutor + SQLite (single-node, dev-friendly), 4 supervisord services (init, scheduler, dag-processor, webserver). Layer is service-only — its Python deps live in /charly-versa:marimo-layer's pixi env. No MCP wrapper (no upstream v2 release exists; consumers drive Airflow via direct REST /api/v2 calls).
            Use when working with the airflow layer, Airflow 3.x compatibility findings, the SimpleAuthManager auth-fix pattern, the dag-processor split-from-scheduler architecture change, or the JWT-issuance + REST API trigger flow used by self-authoring notebooks.
        content: |-
            # airflow — Apache Airflow 3.x layer
            
            LocalExecutor + SQLite — zero external services. Suitable for
            single-node dev / R10 verification. For multi-node production swap
            in CeleryExecutor + Postgres + Valkey (those layers stayed available
            under `candy/postgresql/` + `candy/valkey/`).
            
            This layer is **service-only**: it ships no `pixi.toml`. Its Python
            deps (`apache-airflow`) live in `/charly-versa:marimo-layer`'s pixi env,
            so airflow runs alongside marimo in the same pod with one combined
            Python environment.
            
            ## Layer properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `marimo` (for the pixi env), `supervisord` |
            | Ports | `8080` (api-server, host-mapped to **28080**) |
            | Services | `airflow-init` (one-shot) + `airflow-scheduler` + `airflow-dag-processor` + `airflow-webserver` |
            | Volumes | `airflow-data` at `~/airflow` |
            | Secrets | `airflow-fernet-key`, `airflow-webserver-secret`, `airflow-admin-password` |
            | MCP provides | none (no Airflow-3 / `/api/v2` release of the upstream `mcp-server-apache-airflow` package exists; consumers drive the REST API directly via JWT + `/api/v2/`) |
            | DAG folder | `/workspace/dags` (`AIRFLOW__CORE__DAGS_FOLDER`) |
            
            ## Airflow 3.x compatibility — 8 RCA findings
            
            The layer was hardened across multiple RCA cycles to handle Airflow
            3.x's architectural changes. Each finding is encoded in either the
            init script, env vars, or supervisord service list:
            
            ### 1. SimpleAuthManager replaced FAB
            
            Airflow 3.x removed `airflow users create`. The new SimpleAuthManager
            generates a **random** admin password on first boot and writes it to
            `${AIRFLOW_HOME}/simple_auth_manager_passwords.json.generated` —
            that random value bears no relation to the `AIRFLOW_ADMIN_PASSWORD`
            secret we inject, so JWT auth via `/auth/token` rejects every request
            with 401.
            
            **Fix in `airflow-init.sh`**: overwrite the passwords file from
            `${AIRFLOW_ADMIN_PASSWORD}` on every boot. Idempotent; tolerant of
            secret rotation.
            
            ```bash
            mkdir -p "${HOME}/airflow"
            printf '{"admin": "%s"}\n' "${AIRFLOW_ADMIN_PASSWORD}" \
              > "${HOME}/airflow/simple_auth_manager_passwords.json.generated"
            chmod 0600 "${HOME}/airflow/simple_auth_manager_passwords.json.generated"
            ```
            
            ### 2. dag_dir_list_interval moved to dag_processor section
            
            The Airflow-2 key path `[scheduler] dag_dir_list_interval` is
            deprecated in 3.x; the canonical key is now
            `[dag_processor] refresh_interval`. Layer env block sets:
            
            ```yaml
            env:
              AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
            ```
            
            Default is 300 seconds — far too slow for the runtime-DAG-write
            pattern (notebook drops a `.py` and triggers it within seconds). 10s
            makes the scan effectively interactive at negligible CPU cost on a
            single-user dev pod.
            
            ### 3. DAG processor split from scheduler
            
            Airflow 3.x splits the DAG processor out of the scheduler — without a
            separate `airflow dag-processor` daemon, the dags folder is **never
            scanned** (notebooks waiting on registration deadlock forever).
            
            **Fix**: new `airflow-dag-processor` supervisord service alongside
            `airflow-scheduler`. Without this service, `dag_processor.refresh_interval`
            has no effect because nothing honors it.
            
            ### 4. POST /dagRuns requires logical_date
            
            Airflow 2.x auto-generated `logical_date` if omitted; 3.x rejects with
            422. Notebook trigger code must include:
            
            ```python
            from datetime import datetime, timezone
            requests.post(f"{api}/api/v2/dags/{dag_id}/dagRuns",
                          headers=auth,
                          json={"conf": {}, "logical_date": datetime.now(timezone.utc).isoformat()},
                          timeout=10)
            ```
            
            ### 5. webserver renamed to api-server
            
            Airflow 3.x dropped `airflow webserver` in favor of `airflow api-server`
            (FastAPI-based). The `airflow-webserver.sh` wrapper was updated:
            
            ```bash
            exec "${HOME}/.pixi/envs/default/bin/airflow" api-server
            ```
            
            ### 6. Auth backend defaults to JWT
            
            The api-server uses JWT issued by SimpleAuthManager. Clients fetch
            a token via `POST /auth/token` (admin/password JSON body), then pass
            `Authorization: Bearer <token>` on subsequent calls. Basic auth is
            rejected on `/api/v2/` endpoints by default.
            
            ### 7. airflow-init must NOT block boot
            
            `airflow-init` is a one-shot supervisord program (`restart: "no"`,
            `exit_codes: "0"`) that runs `airflow db migrate` + writes the
            passwords file. It exits cleanly on success; the long-running daemons
            start at higher priority numbers (30+) once init has finished.
            
            ## Service list (4 entries)
            
            | Name | Priority | Restart | Purpose |
            |---|---:|---|---|
            | `airflow-init` | 25 | no | `airflow db migrate` + write SimpleAuthManager passwords file |
            | `airflow-scheduler` | 30 | always | Schedule DAG runs from the metadata DB |
            | `airflow-dag-processor` | 31 | always | Scan dags folder + serialise DAGs into the DB |
            | `airflow-webserver` | 31 | always | `airflow api-server` (FastAPI on :8080) |
            
            ## Check probes (8 — proves the auth + REST paths work)
            
            Build-scope (4):
            - `airflow-init-script` `/usr/local/bin/airflow-init.sh` exists + executable
            - `airflow-webserver-script` ditto
            - `airflow-scheduler-script` ditto
            - `airflow-dag-processor-script` ditto (added with #3 above)
            
            Deploy-scope (4):
            - `airflow-init-db-created` — `~/airflow/airflow.db` exists (SQLite metadata)
            - `airflow-scheduler-running`, `airflow-dag-processor-running`, `airflow-webserver-running` — supervisord program states
            - `airflow-port-reachable` — TCP 8080 reachable
            - `airflow-http-version` — `GET /api/v2/version` returns 200
            - `airflow-jwt-issuance` — `POST /auth/token` with admin creds returns body containing `access_token` (THE notebook auth path; locks in finding #1)
            
            ## Notebook self-author DAG pattern
            
            The marimo notebook in `/charly-versa:notebook-osm` writes its own DAG
            file into `/workspace/dags/` and triggers it via the REST API:
            
            1. POST `/auth/token` (admin / `$AIRFLOW_ADMIN_PASSWORD`) → JWT
            2. Wait for the DAG to register: poll `GET /api/v2/dags/<id>`
               (typically <30 s with `REFRESH_INTERVAL=10`)
            3. Unpause: PATCH `/api/v2/dags/<id>` with `{"is_paused": false}`
            4. Trigger: POST `/api/v2/dags/<id>/dagRuns` with `logical_date`
            5. Poll: GET `/api/v2/dags/<id>/dagRuns/<run_id>` until `state in
               ("success", "failed")`
            
            The notebook uses this pattern to fire BOTH `notebook_osm_pipeline`
            and `notebook_gtfs_pipeline` in parallel.
            
            ## Cross-references
            
            - `/charly-versa:marimo-layer` — pixi env that owns the airflow Python deps
            - `/charly-versa:notebook-osm` — canonical user of the REST trigger pattern
            - `/charly-versa:versa` — the image composing this layer
            - `/charly-infrastructure:supervisord` — service mgmt
            - `/charly-build:secrets` — the 3 airflow secrets injected via this layer

debug-tools-layer-skill:
    skill:
        name: debug-tools-layer
        family: versa
        owner: charly-versa
        description: |-
            Debug toolkit for inspecting deployed services from inside the container — network probes (ip/ss/lsof/ping/dig/nc/socat/tcpdump/traceroute/mtr/wget), process inspection (ps/top/htop/pgrep/free/vmstat/strace/ltrace), file inspection (file/tree/xxd/vim/nano), system stats (iotop/iftop/sysstat), session helpers (tmux/rsync/yq). Distro-agnostic.
            Use when working with the debug-tools layer, the per-distro package-name divergence (nmap-ncat vs ncat vs gnu-netcat), or the 16 build-scope check probes that lock in headline binary presence.
        content: |-
            # debug-tools — distro-agnostic debug toolkit
            
            Single-purpose layer that installs ~50 standard debugging utilities
            across 5 categories: network, process, file, system stats, session
            helpers. Composed by `/charly-versa:versa` so operators can debug
            the deployed services (marimo, airflow, martin, maputnik, etc.) from
            INSIDE the running container.
            
            Without this layer, `charly cmd versa "ps"` returns
            "command not found" — minimal Fedora images don't ship procps-ng,
            iproute, bind-utils, etc. by default.
            
            ## Layer properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | none |
            | Distros | fedora, arch, debian, ubuntu (per-distro package lists) |
            | Ports | none |
            | Services | none |
            | Volumes | none |
            | Check probes | 16 build-scope (one per headline binary) |
            
            ## Tool catalog
            
            ### Network
            
            `ip`, `ss`, `netstat`, `lsof`, `ping`, `dig`, `nslookup`, `nc`,
            `socat`, `tcpdump`, `traceroute`, `mtr`, `wget`
            
            Cover the full DNS / TCP / packet-capture / ICMP / port-relay surface.
            `curl` already comes from elsewhere (jq layer dep), so `wget`
            complements it.
            
            ### Process
            
            `ps`, `top`, `htop`, `pgrep`, `pkill`, `kill`, `killall`, `pidof`,
            `free`, `vmstat`, `watch`, `slabtop`, `strace`, `ltrace`, `iotop`,
            `iftop`
            
            Process inspection (procps-ng) + system tracing (strace/ltrace) +
            I/O & network tops (iotop/iftop).
            
            ### File / text
            
            `file`, `tree`, `vim`, `nano`, `xxd`
            
            `xxd` ships with `vim-common` (auto-installed alongside vim-enhanced).
            
            ### System stats
            
            `sysstat` package provides `iostat`, `mpstat`, `pidstat`, `sar`,
            `sadf` — historical metrics + per-task accounting.
            
            ### Session helpers
            
            `tmux`, `rsync`, `yq`
            
            Multi-pane shell sessions, file sync, YAML manipulation.
            
            ## Per-distro package divergence
            
            Tool names aren't portable — each distro is enumerated separately
            to avoid silent "installed nothing" on the wrong distro:
            
            | Tool | fedora | arch | debian | ubuntu |
            |---|---|---|---|---|
            | Process basics (ps, top, free, kill, pgrep, vmstat) | `procps-ng` | `procps-ng` | `procps` | `procps` |
            | ip + ss + tc | `iproute` | `iproute2` | `iproute2` | `iproute2` |
            | netstat + ifconfig | `net-tools` | `net-tools` | `net-tools` | `net-tools` |
            | dig + nslookup + host | `bind-utils` | `bind-tools` | `dnsutils` | `dnsutils` |
            | ping | `iputils` | `iputils` | `iputils-ping` | `iputils-ping` |
            | nc | `nmap-ncat` | `gnu-netcat` | `ncat` | `ncat` |
            | traceroute | `traceroute` | `traceroute` | `traceroute` | `traceroute` |
            | mtr | `mtr` | `mtr` | `mtr-tiny` | `mtr-tiny` |
            | vim | `vim-enhanced` | `vim` | `vim` | `vim` |
            | yq | `yq` (Fedora py) | `go-yq` (mikefarah Go) | (omitted — snap-only) | (omitted) |
            
            Single common name (`socat`, `tcpdump`, `lsof`, `file`, `tree`,
            `nano`, `htop`, `strace`, `ltrace`, `iotop`, `iftop`, `sysstat`,
            `tmux`, `rsync`, `wget`) covers all four distros.
            
            ## Check coverage (probes — locks in headline binaries)
            
            Spot-checks one binary per category. If a future package rename
            breaks one, the build fails loudly at image build time:
            
            - `ps-binary`, `ss-binary`, `lsof-binary`, `ping-binary`, `dig-binary`,
              `nc-binary`, `tcpdump-binary` — network/process headlines
            - `htop-binary`, `strace-binary` — interactive/tracing
            - `vim-binary`, `nano-binary`, `tree-binary`, `file-binary` — file/text
            - `tmux-binary`, `wget-binary`, `rsync-binary` — session/transfer
            
            `ping-binary` and `nc-binary` are checked via `command -v` rather
            than file path because the binary's location varies across distros
            (Fedora: `/usr/bin/ping`; Debian: `/usr/bin/ping` but historically
            `/bin/ping`).
            
            ## Use case: debugging versa services
            
            | Scenario | Tools |
            |---|---|
            | "Is martin actually listening on 3000?" | `ss -tlnp \| grep 3000`, `lsof -i :3000` |
            | "What's the airflow scheduler doing?" | `ps auxf \| grep airflow`, `htop`, `strace -p <pid>` |
            | "Is the marimo MCP responding?" | `curl http://localhost:2718/mcp/server`, `nc -zv localhost 2718` |
            | "Why is the GTFS download slow?" | `iftop -i eth0`, `traceroute api.transitous.org` |
            | "Is the workspace volume filling up?" | `du -sh /workspace/*`, `iotop` |
            | "What's eating CPU?" | `htop`, `pidstat -u 1` |
            
            ## Cross-references
            
            - `/charly-versa:versa` — image composing this layer
            - `/charly-versa:airflow-layer` — services this toolkit debugs
            - `/charly-versa:osm-tools-layer` — martin server this toolkit debugs
            - `/charly-versa:marimo-layer` — marimo runtime this toolkit debugs
            - `/charly-coder:dev-tools` — overlapping but heavier (includes qemu, AWS CLI, etc.); not composed by versa

maputnik-layer-skill:
    skill:
        name: maputnik-layer
        family: versa
        owner: charly-versa
        description: |-
            Maputnik — visual editor for MapLibre GL vector-tile styles. Pure-JS SPA built from upstream source via npm at image build time, served as static dist by python -m http.server. Pairs with osm-tools's martin tile server.
            Use when working with the maputnik layer, the Vite --base=/ build override (critical fix; default --base=/maputnik/ produces 404 asset paths), or the asset-base lock-in check test.
        content: |-
            # maputnik — visual MapLibre style editor
            
            Maputnik is a pure-JS SPA for visually editing MapLibre GL JS style
            JSON files. Built from upstream source (`felt/maputnik`) via npm at
            image build time, served as a static dist by Python's stdlib
            `http.server`. Composed by `/charly-versa:versa` so operators can
            iterate on the streets-map style against the in-pod martin tile
            server (`/charly-versa:osm-tools-layer`).
            
            ## Layer properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord` |
            | Distros | `fedora` (sole; needs node + npm + git for build) |
            | Build deps | nodejs, npm, git |
            | Ports | `8000` (host-mapped to **28000**) |
            | Service | `maputnik` (supervisord, `restart: always`) |
            | Static dist | `/opt/maputnik/build/` (Vite `dist/` renamed) |
            
            ## Service spec
            
            ```yaml
            maputnik:
              candy:
                service:
                  - name: maputnik
                    exec: /usr/bin/python3 -m http.server 8000 --directory /opt/maputnik/build
                    restart: always
                    working_directory: /opt/maputnik
                    priority: 34
            ```
            
            Pure stdlib server — no marimo-pixi-env coupling. The system
            `python3` from supervisord's own RPM dep handles the static serve.
            
            ## Critical: Vite --base=/ override
            
            Maputnik's `package.json` defines `"build": "tsc && vite build"`.
            Vite's default base path for builds is `--base=/maputnik/`. That
            default bakes `/maputnik/assets/*` URL references into the emitted
            `index.html` — but we serve the dist at root (`/`) via
            `python -m http.server`, so all those baked URLs **404 in the
            browser**.
            
            Symptom (before fix): the maputnik UI loads at
            `http://127.0.0.1:28000/` showing a blank page; browser dev-tools
            shows asset 404s for `/maputnik/assets/index-*.js` etc.
            
            **Fix in the build cmd** — an ordered `plan:` step:
            
            ```yaml
            plan:
              - run: build maputnik from upstream source with the Vite --base=/ override
                command: |
                  set -euo pipefail
                  git clone --depth 1 https://github.com/maplibre/maputnik /tmp/maputnik
                  cd /tmp/maputnik
                  npm ci --no-audit --no-fund
                  # Override Vite's default --base=/maputnik/ so asset URLs are
                  # root-relative and resolve against our serve path. The `--`
                  # forwards the flag through npm to vite.
                  npm run build -- --base=/
                  if [ -d dist ]; then
                    mkdir -p /opt/maputnik
                    cp -r dist /opt/maputnik/build
                  else
                    echo "maputnik build did not produce ./dist directory" >&2
                    ls -la
                    exit 1
                  fi
                  cd /
                  rm -rf /tmp/maputnik /root/.npm
                run_as: root
            ```
            
            ## Check lock-in
            
            A deploy-context `check:` step greps the served HTML for the
            (forbidden) `/maputnik/` prefix and fails if present. It is a `check:`
            step, so it is a deterministic
            acceptance step that locks in the fix against a future revert to the
            Vite default. The step is an ordered `plan:` entry; its former node name
            becomes the step's `id:`:
            
            ```yaml
            plan:
              - check: maputnik serves a root-relative SPA
                id: maputnik-asset-base-not-prefixed
                exit_status: 0
                context: [deploy]
                command:
                  command: |
                    ! curl -fsS http://localhost:8000/ | grep -q '"/maputnik/'
                  in_container: true
            ```
            
            Plus the standard probe steps (also `context: [deploy]`):
            
            - `maputnik-running` — supervisord program is RUNNING
            - `maputnik-port-reachable` — TCP 8000 reachable
            - `maputnik-http-up` — `GET /` returns 200
            
            ## Use case in versa
            
            The streets-map style in `/charly-versa:notebook-osm` cell 7 is a
            small inline JSON. Operators iterating on richer styles can:
            
            1. Open maputnik at `http://127.0.0.1:28000/`
            2. Connect to martin's TileJSON URL `http://127.0.0.1:23000/monaco`
            3. Visually edit polygon/line/circle layer paint properties
            4. Export the style JSON
            5. Paste into the notebook cell (or save to a server-mounted file
               and load via `style: 'http://...'` in the MapLibre constructor)
            
            ## Cross-references
            
            - `/charly-versa:versa` — image composing this layer
            - `/charly-versa:osm-tools-layer` — companion martin tile server
            - `/charly-versa:notebook-osm` — uses an inline style; maputnik can author richer ones
            - `/charly-infrastructure:supervisord` — service runtime

marimo-layer-skill:
    skill:
        name: marimo-layer
        family: versa
        owner: charly-versa
        description: |-
            marimo reactive notebook server (also runs as MCP server via --mcp), GPU-accelerated OSM/GTFS analytics deps (cudf-polars-cu13, polars, geopandas, quackosm, gtfs-parquet), Apache Airflow Python deps (the airflow layer ships no pixi env), and the marimo-team/learn curriculum + marimo-team/skills bundle for you.
            Use when working with the marimo layer, its pixi environment, the supervisord service spec, or the cell-display + mo.iframe rendering patterns.
        content: |-
            # marimo — reactive notebook + MCP server
            
            The marimo layer composes the entire notebook runtime: a single
            pixi env that hosts marimo + airflow + GPU-accelerated polars +
            geospatial tooling (the airflow layer is service-only and reaches
            into THIS pixi env for its Python). The supervisord service starts
            marimo with `--mcp` so the same port (2718) serves both the editor
            UI and the MCP server.
            
            ## Layer properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `cuda`, `supervisord` |
            | Distros | `fedora` (sole supported — cudf-polars-cu13 is amd64-fedora-only) |
            | Ports | `2718` (marimo edit + MCP — host-mapped to `22718`) |
            | Service | `marimo` (supervisord, `restart: always`) |
            | MCP provides | `marimo` at `http://{{.ContainerName}}:2718/mcp/server` (Streamable HTTP) |
            | Install files | `charly.yml`, `pixi.toml`, `marimo-skills.tar.gz` (curriculum bundle) |
            | Env (runtime) | `MARIMO_SKILLS_DIR=/opt/marimo-skills`, `NVIDIA_PYTHON_PROJECT=~/.pixi`, `LD_LIBRARY_PATH=/usr/lib64` |
            
            ## Pixi env — version-pin rationale
            
            The pixi env is large. Headline pins worth
            understanding:
            
            ```toml
            python = "<3.14"          # build #7 picked 3.14, no Python framework supports it yet
            polars = "*"              # constrained by cudf-polars-cu13 to >=1.30,<1.39
            cudf-polars-cu13 = "*"    # CUDA-13 RAPIDS 26.4 series, NOT polars[gpu]
            torch = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
            marimo = "*"
            nbformat = "*"            # required by `marimo export ipynb --include-outputs`
            apache-airflow = "*"      # the airflow layer reaches into THIS env
            mcp-server-apache-airflow = "*"
            fastmcp = "*"
            quackosm = "*"            # PBF → GeoParquet via DuckDB Spatial
            gtfs-parquet = "*"        # GaspardMerten/gtfs-parquet — GTFS zip → polars Parquet
            geopandas = "*"           # + shapely, fiona, pyproj
            folium = "*"              # Leaflet wrapping
            ```
            
            **`cudf-polars-cu13` deliberately**: NOT `polars[gpu]`. The `[gpu]`
            extra pulls `cudf-polars-cu12`, which would conflict with our cu130
            torch wheels. Direct alignment with cu130 — no forward-compat gamble,
            no fallback path needed. The trade-off: `polars` resolver-pinned to
            `>=1.30,<1.39` per cudf-polars-cu13's own constraint.
            
            **`nbformat` was added** for verification tooling — without it,
            `marimo export ipynb --include-outputs` fails with "nbformat is
            required to convert marimo notebooks to ipynb" and the per-cell
            output capture path is unavailable.
            
            **`gtfs-parquet`** added in commit `623b542` — provides
            `parse_gtfs(zip_or_url) → write_parquet(dir)` for the GTFS DAG that
            the notebook self-authors at runtime.
            
            ## Service spec
            
            ```yaml
            service:
              - name: marimo
                exec: "%(ENV_HOME)s/.pixi/envs/default/bin/marimo edit --host 0.0.0.0 --port 2718 --no-token --headless --mcp --mcp-allow-remote %(ENV_HOME)s/workspace"
                restart: always
                working_directory: "%(ENV_HOME)s"
            ```
            
            Flag breakdown:
            
            - `--host 0.0.0.0` — bind all interfaces so the host-port mapping reaches it
            - `--port 2718` — base port for both editor UI and MCP
            - `--no-token` — dev posture; no editor login
            - `--headless` — don't try to open a browser inside the container
            - `--mcp` — enable the MCP HTTP server on the same port (`/mcp/server`)
            - `--mcp-allow-remote` — **mandatory** with `--host 0.0.0.0`; otherwise
              marimo's MCP endpoint refuses non-localhost requests, breaking the
              charly host-port-rewrite path
            
            ## mo.iframe pattern for inline HTML rendering
            
            Marimo cells display the value of the **last expression** in the cell
            body. To render a string of HTML (e.g. a custom MapLibre map) inside
            the notebook output area, use:
            
            ```python
            import marimo as mo
            mo.iframe(html_string, height="500px")
            ```
            
            `mo.iframe` wraps the HTML in a sandboxed `<iframe srcdoc>` that
            loads in the marimo UI. Used by the streets MapLibre cell in
            `/charly-versa:notebook-osm` to render martin's vector tiles
            (folium's TileLayer can't decode PBF).
            
            For folium maps that DON'T need iframe wrapping, return the
            `folium.Map` instance as the cell's last expression. The trust-wrapper
            bypass is documented in `/charly-versa:notebook-osm`.
            
            ## Cell-display gotcha
            
            Marimo's "display value" is the cell's **last expression**, NOT the
            return value. An assignment is a statement — it has no display value:
            
            ```python
            # WRONG — cell displays nothing
            @app.cell
            def __():
                df = pl.scan_parquet("...").collect()
                return df,                            # exports df, but no display
            
            # RIGHT — bare expression is the display value
            @app.cell
            def __():
                df = pl.scan_parquet("...").collect()
                df                                     # marimo displays this
                return df,
            ```
            
            ## Marimo session persistence (gotcha)
            
            When a marimo session is open and the file on disk changes (e.g.
            `charly update --force-seed` rewrites the notebook), marimo re-persists
            the file with its session's cell order, NOT the new file's order.
            Symptom: cells appear in scrambled order in the editor; markdown
            header lands at the bottom; etc.
            
            Surgical reset (kill marimo, restore from `/data/`, restart):
            
            ```bash
            charly service stop versa marimo
            charly cmd versa "cp /data/workspace/notebooks/osm-monaco-viz.py \
                 /workspace/notebooks/osm-monaco-viz.py"
            charly service start versa marimo
            ```
            
            Then the user reloads their browser tab (the old session's WebSocket
            is dead after the restart anyway).
            
            ## Cross-references
            
            - `/charly-versa:versa` — the image that composes this layer
            - `/charly-versa:marimo-mcp` — the MCP server tool catalog
            - `/charly-versa:notebook-osm` — the canonical notebook using this env
            - `/charly-distros:cuda` — required dep
            - `/charly-infrastructure:supervisord` — required dep
            - `/charly-image:layer` — layer authoring conventions

marimo-mcp-skill:
    skill:
        name: marimo-mcp
        family: versa
        owner: charly-versa
        description: |-
            marimo's built-in MCP server (10 read-only inspection tools — get_active_notebooks, get_cell_outputs, get_notebook_errors, etc.) at port 2718 path /mcp/server.
            Use when working with the marimo MCP tool catalog, programmatic notebook diagnostics, or the cells-don't-execute-via-MCP gap (marimo MCP is read-only; cells run via WebSocket from a browser OR `marimo export ipynb --include-outputs` for headless execution).
        content: |-
            # marimo-mcp — marimo's built-in MCP server (read-only inspection)
            
            marimo's notebook server has a built-in MCP endpoint enabled by the
            `--mcp` flag (see `/charly-versa:marimo-layer` service spec). It serves
            10 inspection tools for diagnosing active notebook sessions —
            **read-only**: cells cannot be executed via this MCP. Execution
            requires a browser-attached WebSocket session OR
            `marimo export ipynb --include-outputs` for headless runs.
            
            ## URL pattern
            
            ```
            http://{{.ContainerName}}:2718/mcp/server   # in-pod
            http://localhost:22718/mcp/server           # host-side (mapped port)
            ```
            
            Transport: Streamable HTTP. Registered in this plugin's `.mcp.json`
            as the `marimo` server.
            
            ## Tool catalog
            
            All tools are **read-only**. Each takes an `args` JSON object as
            the sole parameter (often `{}` or `{"session_id": "..."}`).
            
            | Tool | Purpose |
            |---|---|
            | `get_marimo_rules` | Returns the official marimo rules for you |
            | `get_active_notebooks` | Lists currently-open notebooks + session IDs + active connection counts |
            | `get_lightweight_cell_map` | Per-cell preview (cell_id, line_count, runtime_state, has_output, has_errors) for a session |
            | `get_cell_runtime_data` | Full runtime data for one or more cells: code, errors, declared variables |
            | `get_cell_outputs` | Cell execution outputs (visual display + console streams) |
            | `get_tables_and_variables` | All tables and variables visible in a session |
            | `get_database_tables` | Database table info (regex query supported) |
            | `get_notebook_errors` | All errors in a session, organised by cell |
            | `lint_notebook` | Lint a marimo notebook for issues |
            | `get_cell_dependency_graph` | Cell dependency graph (variable-flow edges) |
            
            ## Why no execute tool
            
            marimo's reactive runtime executes cells based on dependency-graph
            analysis when variable values change in the editor. The MCP exposes
            a *read* surface against an active session — there's no "run cell N"
            RPC because that's not how marimo orchestrates cells.
            
            Two paths to execute notebook content programmatically:
            
            1. **Browser-attached run** — open the notebook in a browser; marimo
               reactively runs all reachable cells. The marimo MCP can then read
               the session state (cell outputs, errors, variables).
            
            2. **Headless export** — `marimo export ipynb --include-outputs` runs
               every cell server-side and writes a Jupyter notebook with embedded
               outputs. Used in this repo's R10 acceptance for the
               osm-monaco-viz.py notebook:
            
               ```bash
               charly cmd versa "/home/user/.pixi/envs/default/bin/marimo \
                 export ipynb /workspace/notebooks/osm-monaco-viz.py \
                 --include-outputs --sort topological -o /tmp/notebook-run.ipynb -f"
               ```
            
               Requires `nbformat` in the pixi env (already pinned in
               `candy/marimo/pixi.toml`).
            
            ## Verification
            
            Run the candy's baked `mcp:` steps (ping + catalog enumeration) against a live
            deployment — the `mcp:` check verb is declarative-only, served out-of-process by
            `candy/plugin-mcp` (there is no host `charly check` subcommand for it):
            
            ```bash
            charly check live versa --filter mcp   # runs the baked mcp: ping / list-tools steps (mcp_name: marimo)
            ```
            
            Author them as declarative steps on the candy:
            
            ```yaml
            marimo-mcp-ping:
                check: the marimo mcp server responds to ping
                mcp: ping
                mcp_name: marimo
                context: [deploy]
            marimo-mcp-list-tools:
                check: the marimo mcp server lists its tools
                mcp: list-tools
                mcp_name: marimo
                context: [deploy]
            ```
            
            For an ad-hoc, multi-call diagnostic (e.g. `get_active_notebooks` → extract a
            `session_id` → `get_lightweight_cell_map`) the declarative verb has no cross-call
            state chaining; point an external MCP client (`/charly-tools:mcporter`) at the
            server's published host port instead.
            
            ## MCP name decoupling
            
            The MCP server name `marimo` is the service contract — declared in
            `candy/marimo/charly.yml` `mcp_provide.name: marimo`. This plugin's
            `.mcp.json` keys off the same name. Renames of the layer / Python
            package / image MUST NOT change this name unless the contract is
            explicitly broken in a hard cutover.
            
            ## Cross-references
            
            - `/charly-versa:marimo-layer` — layer that runs the server
            - `/charly-versa:airflow-layer` — Airflow service in the same pod; it has no MCP wrapper
            - `/charly-versa:notebook-osm` — example notebook diagnosed via this MCP
            - `/charly-build:charly-mcp-cmd` — MCP probe verb authoring + URL rewriter
            - `/charly-check:check` — `mcp:` declarative check-verb reference

osm-tools-layer-skill:
    skill:
        name: osm-tools-layer
        family: versa
        owner: charly-versa
        description: |-
            OpenStreetMap data pipeline tooling: tippecanoe (GeoJSON → MBTiles/PMTiles, built from source), gdal/ogr2ogr, jq, martin (Rust musl static binary on port 3000), pmtiles CLI. Martin reads tiles from /workspace/tiles/pmtiles/.
            Use when working with the osm-tools layer, tippecanoe build steps, the martin tile server config, the martin "Underlying data source was modified" cache issue + DAG-completion supervisord-restart pattern, or the vector-tiles-only output that requires MapLibre GL JS clients (NOT folium TileLayer).
        content: |-
            # osm-tools — OSM tooling + martin vector-tile server
            
            Bundles every CLI needed to ingest, transform, and serve OSM data
            in the versa image. Martin (Rust) is the long-running tile server
            at port 3000 (host-mapped to **23000**); everything else is invoked
            ad-hoc from DAGs / shell.
            
            ## Layer properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord` |
            | Distros | `arch` + `fedora` (tippecanoe needs gcc-c++/sqlite-devel/zlib-devel on Fedora and gcc/sqlite on Arch for the source build) |
            | Ports | `3000` (martin HTTP, host-mapped to **23000**) |
            | Service | `martin` (supervisord, `restart: always`) |
            | Tile dir | `/workspace/tiles/pmtiles/` |
            | Distros packages | gdal, jq, rust + tippecanoe build deps (git, make, gcc-c++/gcc, sqlite-devel/sqlite, zlib-devel where applicable) |
            
            ## Tools installed
            
            | Tool | Source | Purpose |
            |---|---|---|
            | `tippecanoe` | Built from `felt/tippecanoe` source | GeoJSON → MBTiles/PMTiles |
            | `ogr2ogr` / `ogrinfo` | Distro pkg `gdal` | Format conversion (e.g. GeoParquet → GeoJSON for tippecanoe) |
            | `jq` | Distro pkg `jq` | JSON manipulation (also for inspecting martin's `/catalog`) |
            | `martin` | GitHub release musl binary | Rust tile server |
            | `pmtiles` | GitHub release tarball (resolved via API) | PMTiles inspection |
            | `gpq-tiles` | `cargo install gpq-tiles --root /usr/local` | Direct GeoParquet → PMTiles converter (geoparquet-io/gpq-tiles v0.6.0) |
            
            Tippecanoe is built from source because no Fedora package exists and
            upstream ships only source. Build is small (~200 MB clone, <1 min
            `make -j`); cleanup keeps the image lean.
            
            gpq-tiles is cargo-installed because its PyPI wheels cover only
            Python 3.8 / Linux x86_64 (v0.6.0) — the marimo pixi env is
            Python `<3.14` and its `[pypi-options] no-build = true`
            (load-bearing for the apache-airflow resolution) blocks sdist
            builds. Cargo builds the binary from crates.io directly; the
            ~/.cargo/registry + .cargo/git caches are dropped after install to
            keep the image-size delta tractable (~50 MB for the final binary).
            
            Martin is the **musl** static binary, NOT the gnu build — gnu
            hard-depends on `libicuuc.so.74` / `libicui18n.so.74` which Fedora
            43 doesn't ship (it has libicu 77). musl is self-contained.
            
            ## Service spec
            
            ```yaml
            service:
              - name: martin
                exec: /usr/local/bin/martin-wrapper.sh
                restart: always
                working_directory: /home/user
            ```
            
            The wrapper:
            
            ```bash
            #!/usr/bin/env bash
            set -euo pipefail
            DIR="/workspace/tiles/pmtiles"
            mkdir -p "$DIR"
            exec /usr/local/bin/martin --listen-addresses 0.0.0.0:3000 "$DIR"
            ```
            
            The `mkdir -p` ensures martin doesn't error/warn when the dir
            doesn't exist yet (pre-DAG-run state on a fresh deploy). Martin
            auto-discovers tile files in the directory and serves each as a
            named source.
            
            ## CRITICAL: martin caches pmtiles file mtime at startup
            
            When martin starts, it caches the mtime of every pmtiles file in
            its watched directory. If the file is rewritten LATER (e.g. by a
            DAG re-run), martin returns:
            
            ```
            HTTP/1.1 500 Internal Server Error
            Underlying data source was modified
            ```
            
            for some tile fetches and `HTTP 204 No Content` for others. **All
            tile fetches break** until martin restarts and re-reads the file.
            
            Martin has NO `--watch` flag (verified via `martin --help`). The
            `--cache-expiry` and `--cache-idle-timeout` flags control the tile
            cache, not the file-mtime cache.
            
            **Fix in the OSM DAG**: add a `reload_martin` task as the final
            DAG step:
            
            ```python
            @task
            def reload_martin(pmtiles_path: str) -> str:
                import subprocess
                subprocess.run(["supervisorctl", "restart", "martin"], check=True)
                return pmtiles_path
            ```
            
            uid 1000 has supervisorctl access in this image (the `supervisord.sock`
            is readable by the container user). The DAG triggers martin restart
            after writing each new pmtiles, so martin always serves the freshest
            tiles after any DAG run.
            
            ## CRITICAL: martin output is VECTOR tiles, not raster
            
            Tippecanoe produces Mapbox Vector Tile (MVT/PBF) format. Martin
            serves them with `Content-Type: application/x-protobuf`. **Folium's
            `TileLayer` is RASTER-only** — it tries to render the PBF as PNG/JPG,
            fails silently → grey map.
            
            The canonical client for vector tiles is **MapLibre GL JS**.
            `/charly-versa:notebook-osm` cell 10 uses `mo.iframe` with embedded
            MapLibre HTML pointing at martin's TileJSON URL
            (`http://localhost:23000/monaco`) as a vector source, with separate
            polygon/line/circle layers filtered by `geometry-type`. Three
            sibling cells (11-13) render the alternative-engine outputs at
            sibling source URLs:
            
            | Source name | Producer DAG | Notebook cell |
            |---|---|---|
            | `monaco` | `notebook_osm_pipeline` (tippecanoe via duckdb-spatial GeoJSON) | 10 |
            | `monaco-gpqtiles` | `notebook_osm_gpqtiles_pipeline` (gpq-tiles direct converter) | 11 |
            | `monaco-duckdb-mvt` | `notebook_osm_duckdb_mvt_pipeline` (DuckDB ST_AsMVT + pmtiles.Writer) | 12 |
            | `monaco-duckdb-freestiler` | `notebook_osm_duckdb_freestiler_pipeline` (DuckDB → freestiler) | 13 |
            
            `/charly-versa:maputnik-layer` is a visual editor for these styles —
            useful for iterating on map appearance without notebook rebuilds.
            `/charly-versa:pmtiles-viewer` is a sibling SPA on port 28001 that
            inspects any of the four PMTiles archives' bbox / zoom range /
            metadata directly in the browser.
            
            ## Martin URL surface
            
            Martin auto-discovers files in the watched directory and exposes:
            
            | URL | Purpose |
            |---|---|
            | `/catalog` | JSON listing of all available sources |
            | `/<source>` | TileJSON for a source (use as MapLibre `style.sources[…].url`) |
            | `/<source>/{z}/{x}/{y}` | Vector tile fetch for a coord |
            | `/health` | Liveness probe |
            
            For monaco.pmtiles → source name `monaco` → tiles at
            `/monaco/{z}/{x}/{y}`. Martin reflects the request `Origin` in
            `access-control-allow-origin` so cross-port (22718 → 23000) XHR from
            marimo works without proxy tricks.
            
            ## Check probes
            
            Build-scope:
            - `tippecanoe-installed`, `gdal-installed`, `jq-installed`,
              `martin-installed`, `pmtiles-installed` — `--version` exit 0
            - `martin-wrapper-installed` — `/usr/local/bin/martin-wrapper.sh`
              exists with mode 0755
            
            Deploy-scope:
            - `martin-running` — supervisord program is RUNNING
            - `martin-port-reachable` — TCP 3000 reachable
            - `martin-http-catalog` — `GET /catalog` returns 200
            - `martin-tiles-dir-runtime` — `/workspace/tiles/pmtiles/` exists
            
            The catalog probe passes pre-DAG (with empty source list) and
            post-DAG (with the monaco source listed). Tile-content probes are
            NOT included — they'd false-fail on cold deploys before any DAG ran.
            
            ## Cross-references
            
            - `/charly-versa:versa` — image composing this layer
            - `/charly-versa:notebook-osm` — DAG that produces pmtiles + MapLibre cell consuming them
            - `/charly-versa:maputnik-layer` — visual style editor for the same vector tiles
            - `/charly-infrastructure:supervisord` — service runtime

sway-browser-ecovoyage-skill:
    skill:
        name: sway-browser-ecovoyage
        family: versa
        owner: charly-versa
        description: |-
            Sway-browser-vnc instance wired to versa/ecovoyage tailnet URLs — chrome-devtools-mcp + CDP for debugging the generated MapLibre + folium maps.
        content: |-
            # sway-browser-ecovoyage — chrome-devtools-mcp debug bed for versa/ecovoyage maps
            
            Deploys `sway-browser-vnc` as a pinned Pattern A instance
            (`sway-browser-vnc/ecovoyage`) preconfigured to debug the maps
            rendered by the `versa/ecovoyage` notebook (`osm-monaco-viz.py`).
            The pod's chrome-devtools-mcp + raw CDP + VNC ports are all exposed
            on the host's existing tailnet identity (`ac.armadillo-quail.ts.net`)
            so external Claude Code / agents — and you —
            can drive Chrome programmatically over Streamable HTTP MCP.
            
            ## Why this exists
            
            The `versa/ecovoyage` notebook generates 5 client-rendered maps
            (4 MapLibre via `martin`, 1 shortbread via `versatiles`, 1 folium).
            Verifying these from a sandboxed agent context requires a browser
            that can reach the dynamic tile URLs (e.g.
            `https://ac.armadillo-quail.ts.net:33000/monaco/{z}/{x}/{y}`).
            
            The existing `check-sway-browser-vnc-pod` is general-purpose and
            isn't preconfigured with the ecovoyage URLs — and its loopback
            isn't the same loopback as the host, so 127.0.0.1 references to
            versa/ecovoyage's host ports don't resolve. Tailnet URLs solve
            both problems: same identity from any device on the tailnet, no
            loopback collision, TLS-terminated by tailscaled.
            
            ## Deploy
            
            ```bash
            charly config sway-browser-vnc/ecovoyage
            charly start sway-browser-vnc/ecovoyage
            ```
            
            The deploy entry is fully specified in `~/.config/charly/charly.yml` —
            it pins host ports (5901 VNC, 9230 CDP, 9232 MCP) and forwards
            every `*_PUBLIC_URL` env var so chrome's address bar + scripts
            + chrome-devtools-mcp tooling all see the same tailnet URLs the
            versa/ecovoyage notebook embeds in its MapLibre HTML.
            
            ## URL inventory
            
            ### Inbound — debug-bed services exposed on tailnet
            
            | Endpoint | Tailnet URL | What it is |
            |---|---|---|
            | chrome-devtools-mcp | `https://ac.armadillo-quail.ts.net:9232/mcp` | Streamable HTTP MCP |
            | Chrome DevTools raw | `https://ac.armadillo-quail.ts.net:9230` | CDP `/json/version` etc. |
            | VNC | `tcp://ac.armadillo-quail.ts.net:5901` | wayvnc, no auth |
            
            ### Outbound — versa/ecovoyage tailnet URLs the browser will load
            
            These are passed in as env vars (`MARTIN_PUBLIC_URL`,
            `AIRFLOW_PUBLIC_URL`, etc.) so chrome scripts can use them via
            `process.env` or via the supervisord-launched `VERSA_ECOVOYAGE_MARIMO_URL`:
            
            | Var | Tailnet URL |
            |---|---|
            | `VERSA_ECOVOYAGE_MARIMO_URL` | `https://ac.armadillo-quail.ts.net:32718/?file=notebooks/osm-monaco-viz.py` |
            | `MARTIN_PUBLIC_URL` | `https://ac.armadillo-quail.ts.net:33000` |
            | `AIRFLOW_PUBLIC_URL` | `https://ac.armadillo-quail.ts.net:38080` |
            | `PMTILES_VIEWER_PUBLIC_URL` | `https://ac.armadillo-quail.ts.net:38001` |
            | `VERSATILES_PUBLIC_URL` | `https://ac.armadillo-quail.ts.net:38090` |
            | `VERSATILES_ASSETS_PUBLIC_URL` | `https://ac.armadillo-quail.ts.net:38002` |
            | `VERSATILES_STYLE_PUBLIC_URL` | `https://ac.armadillo-quail.ts.net:38002/style` |
            
            ## Map-debug recipe
            
            Author the recipe as ordered `cdp:` plan steps (the `cdp:` verb is served
            out-of-process by candy/plugin-cdp) and run them with
            `charly check live sway-browser-vnc/ecovoyage --filter cdp`:
            
            ```yaml
            # 1. Open the marimo notebook in chrome
            map-open:
                run: open the marimo notebook
                cdp: open
                context: [deploy]
                url: "https://ac.armadillo-quail.ts.net:32718/?file=notebooks/osm-monaco-viz.py"
            # 2. Run all stale cells (after the DAGs finish executing)
            map-run-cells:
                run: click every run-button
                cdp: eval
                context: [deploy]
                tab: "1"
                expression: 'document.querySelectorAll("button[data-testid=run-button]").forEach(b => b.click())'
            # 3. Wait for the streets MapLibre canvas to appear
            map-wait-canvas:
                check: the MapLibre canvas appears
                cdp: wait
                context: [deploy]
                tab: "1"
                selector: ".maplibregl-canvas"
                timeout: 90s
            # 4. Screenshot — validate dimensions + non-uniform content
            map-screenshot:
                check: the streets map renders real, non-uniform content
                cdp: screenshot
                context: [deploy]
                tab: "1"
                artifact: /tmp/ecovoyage-streets.png
                artifact_min_bytes: 50000
                artifact_min_dimensions: 800x600
                artifact_not_uniform: true
            # 5. Inspect the iframe contents directly (catch JS errors before they
            #    silently produce blank canvases — see the hyphen-in-JS-identifier
            #    bug story below)
            map-inspect-iframes:
                check: the iframe canvases are populated
                cdp: eval
                context: [deploy]
                tab: "1"
                expression: |
                    [...document.querySelectorAll("iframe")].map(f => ({
                      src: f.src, canvas: !!f.contentDocument?.querySelector("canvas"),
                      consts: [...(f.contentDocument?.body?.innerHTML?.matchAll(/const map_[a-z_-]+/g) || [])].map(m=>m[0])
                    }))
            ```
            
            ## chrome-devtools-mcp from external Claude Code
            
            The `chrome-devtools-mcp` server's MCP endpoint is published on the
            tailnet so any Claude Code instance — local or remote on the tailnet —
            can plug it into its MCP config:
            
            ```jsonc
            // .mcp.json
            {
              "mcpServers": {
                "chrome-devtools-ecovoyage": {
                  "url": "https://ac.armadillo-quail.ts.net:9232/mcp",
                  "transport": "http"
                }
              }
            }
            ```
            
            In opencharly's `provides:` registry this server is published as
            `chrome-devtools-ecovoyage` (instance-suffixed by `charly config`'s
            MCP name-disambiguation rule — see `/charly-core:deploy`) so it
            doesn't collide with the `check-sway-browser-vnc-pod`'s base
            `chrome-devtools` provide.
            
            ## Hard-won lessons (carried over from this skill's authoring session)
            
            ### Iframe canvas check beats iframe count
            
            When verifying that maps render, count the **canvas elements inside
            each iframe**, not just the iframes themselves. A failed `const map_…`
            declaration leaves the iframe with its `<script>` tag present but no
            canvas — and the iframe count is unchanged. The right check:
            
            ```js
            [...document.querySelectorAll("iframe")].map(f => ({
              canvas: !!f.contentDocument?.querySelector("canvas")
            }))
            ```
            
            A `canvas: false` row for a map cell is the signal that MapLibre
            threw during init. Pull the script body and grep for invalid
            identifiers (hyphens in `const` names was the canonical bug:
            `const map_duckdb-mvt = …` parses as `map_duckdb − mvt`).
            
            ### Container chrome ≠ host chrome on `127.0.0.1`
            
            If you debug from a container-sandboxed chrome
            (e.g. `check-sway-browser-vnc-pod`), `127.0.0.1` is **that pod's
            loopback**, not the host's. Maps with `http://127.0.0.1:<host-port>`
            tile URLs will silently fail to fetch tiles even though MapLibre
            instantiates the canvas. This is why every `*_PUBLIC_URL` env var
            should be **tailnet-form** for browser-side consumption — tailnet
            URLs are the same from anywhere on the tailnet, including
            sandboxed pods.
            
            ## Related
            
            - `/charly-versa:notebook-osm` — the marimo notebook whose 5 maps this skill exists to debug
            - `/charly-versa:versa` — the image hosting the maps (versa/ecovoyage = Pattern A instance)
            - `/charly-selkies:sway-browser-vnc` — the base image this deploy instantiates
            - `/charly-selkies:chrome-devtools-mcp` — the layer providing the MCP server
            - `/charly-check:cdp` — the verb catalog driving Chrome
            - `/charly-build:charly-mcp-cmd` — verifying the MCP endpoint via the `mcp:` check verb (`charly check live <image> --filter mcp`)
            - `/charly-core:deploy` — Pattern A multi-instance + MCP name disambiguation
            - `/charly-automation:sidecar` — alternative tailscale sidecar pattern (not used here; this skill uses host-serve)

versa-skill:
    skill:
        name: versa
        family: versa
        owner: charly-versa
        description: |-
            versa — image bundling marimo reactive notebook environment with Apache Airflow + GPU-accelerated OSM/GTFS analytics + martin vector tiles + 3D terrain via MapLibre + Polars geospatial extensions (polars-st, geopolars) + GeoArrow + deck.gl rendering via lonboard.
            Composes a marimo + airflow + OSM/GTFS analytics stack (agent-forwarding, nvidia, cuda, marimo, airflow, osm-tools, maputnik, notebook-osm, notebook-graph, debug-tools, dbus, charly, plus the versatiles tile-serving layers) on a CachyOS / Arch base into a single pod that exposes 7 host ports and 1 MCP server.
            MUST be invoked before building, deploying, configuring, or troubleshooting the versa image.
        content: |-
            # versa — marimo + Airflow + OSM/GTFS + martin
            
            GPU-accelerated marimo notebook environment that composes a full
            analytics + visualisation stack: marimo notebooks (also acting as MCP
            server), Apache Airflow (LocalExecutor + SQLite), OSM data pipeline
            (quackosm → tippecanoe → martin), GTFS transit pipeline (gtfs-parquet),
            and a MapLibre style editor (maputnik). One MCP server is exposed
            (marimo for notebook diagnostics).
            
            The `versa` image name is OUR image identity, deliberately decoupled
            from the upstream marimo notebook software the image bundles. The
            `candy/marimo/` directory + the `mcp_provide.name: marimo`
            MCP-server identity reflect that upstream software identity.
            
            ## Image properties
            
            | Property | Value |
            |----------|-------|
            | Base | `cachyos.cachyos` — owned by the **`opencharly/distro-cachyos`** submodule (`box/cachyos`); main reaches it via the `cachyos` import namespace (the deliberate main → cachyos coupling). CUDA 13 / cuDNN / python-onnxruntime-cpu via CachyOS `extra` repo |
            | Platforms | `linux/amd64` only (cuDF + cu130 torch are amd64-only) |
            | Layers | 19 (see "Layer stack" below) |
            | Ports | 7 (see "Ports + host mappings") |
            | MCP servers | 1 (marimo @ container 2718). No airflow MCP wrapper — no Airflow-3 / `/api/v2` release of the upstream package exists; consumers drive Airflow via direct REST `/api/v2/` calls |
            | Registry | `ghcr.io/opencharly` |
            | Image tag pattern | CalVer (`YYYY.DDD.HHMM`) |
            | Builder | `arch.arch-builder` (pixi/npm/cargo/aur) — inherited from versa's bare-local `base: cachyos`. The cachyos base declares the `builder:` map and, because a `builder:` map does NOT cross a namespace boundary, names the qualified `arch.arch-builder` ref (the Arch builder in the `opencharly/distro-arch` submodule, reached via cachyos's `arch` import namespace). versa lives in the same submodule as that base, so it inherits the map directly. See `/charly-distros:cachyos`. |
            
            ## Layer stack (composition order)
            
            1. `cachyos` (base — `docker.io/cachyos/cachyos-v3` OCI image, digest-pinned; matches the upstream CachyOS docker repo workflow)
            2. `agent-forwarding` — SSH/GPG agent forwarding for in-container git push
            3. `nvidia` — driver runtime (`nvidia-utils`, `nvidia-container-toolkit`)
               — an explicit layer entry because the cachyos base doesn't bundle it
            4. `cuda` — CUDA toolkit (`cuda` + `cudnn` + `python-onnxruntime-cpu`
               from CachyOS extra repo; `/opt/cuda` symlinked into
               `/usr/{bin,include,lib64}` for path compatibility with the Fedora
               layout). No AUR builds in this image — `build:` is `[pac]` only.
            5. `marimo` — `/charly-versa:marimo-layer` — pixi env (cudf-polars-cu13,
               torch cu130, geopandas, quackosm, gtfs-parquet, folium, marimo,
               airflow Python deps, plus polars-st / geopolars / geoarrow-pyarrow /
               geoarrow-pandas / lonboard for Polars-native spatial ops + deck.gl
               rendering, plus freestiler for direct DuckDB → PMTiles tile
               generation — gpq-tiles is system-installed via the osm-tools layer
               instead, because its PyPI wheels don't cover Python 3.13/Linux x86_64
               and the pixi env's `no-build = true` blocks sdist resolution),
               supervisord service `marimo edit … --mcp`
            6. `airflow` — `/charly-versa:airflow-layer` — 4 supervisord services
               (init/scheduler/dag-processor/webserver). No airflow-mcp wrapper —
               no Airflow-3 v2 release of `mcp-server-apache-airflow` exists;
               consumers drive Airflow via direct REST `/api/v2/` calls.
            7. `osm-tools` — `/charly-versa:osm-tools-layer` — tippecanoe (built from
               source), gdal, jq, martin (Rust binary), pmtiles CLI (Go binary),
               gpq-tiles (cargo-installed Rust binary; v0.6.0 from crates.io —
               the system-install fallback for the PyPI-wheel gap)
            8. `maputnik` — `/charly-versa:maputnik-layer` — MapLibre style editor
               built with Vite `--base=/`
            9. `pmtiles-viewer` — `/charly-versa:pmtiles-viewer` — protomaps/PMTiles
               /app SPA, visual inspector for PMTiles archives (port 8001 → 28001)
            10. `shortbread` — `/charly-versa:shortbread` — systemed/tilemaker (C++/Lua)
                + shortbread-tilemaker config — produces shortbread-schema vector
                tiles into `/workspace/tiles/shortbread/`
            11. `versatiles-style` — `/charly-versa:versatiles-style` — @versatiles/style
                MapLibre style generator bundled to `/opt/versatiles-style/`
            12. `versatiles-fonts` — `/charly-versa:versatiles-fonts` — SDF font glyphs
                (Noto Sans + 9 others) bundled to `/opt/versatiles-fonts/`
            13. `maplibre-versatiles-styler` — `/charly-versa:maplibre-versatiles-styler` —
                interactive MapLibre style-switcher control bundled to
                `/opt/maplibre-versatiles-styler/`
            14. `versatiles` — `/charly-versa:versatiles` — versatiles-rs CLI binary
                (convert/serve/probe) + `versatiles serve` supervisord service on
                port 8090 → 28090 (parallel tile server to martin)
            15. `versatiles-frontend` — `/charly-versa:versatiles-frontend` —
                versatiles-org/versatiles-frontend SPA (port 8002 → 28002); also
                re-exports versatiles-style / fonts / styler at `/style/`,
                `/fonts/`, `/styler/`
            16. `notebook-osm` — `/charly-versa:notebook-osm` — data-only layer
                seeding the OSM+GTFS+pipelines notebook into `/workspace/notebooks/`
            17. `notebook-graph` — data-only layer in `candy/notebook-graph`
                seeding `gpu-libraries-demo.py` into `/workspace/notebooks/`;
                exercises cuGraph (nx-cugraph backend), cuML (KMeans), PyG
                (GCNConv on cuda:0 with torch_scatter), and graphistry
            18. `debug-tools` — `/charly-versa:debug-tools-layer` — 49 standard
                debug utilities (network/process/file/system/session)
            19. `dbus` — D-Bus session bus
            20. `charly` — `charly` CLI binary inside the container
            
            ## Ports + host mappings
            
            The image declares container ports; the `versa` deploy entry
            remaps to host ports for browser reachability:
            
            | Service | Container port | Host port | Path |
            |---|---|---|---|
            | marimo edit + MCP | 2718 | **22718** | `/` for editor, `/mcp/server` for MCP |
            | airflow api-server | 8080 | **28080** | `/api/v2/`, `/auth/token`, `/api/v2/dags/<id>/dagRuns` |
            | martin tile server | 3000 | **23000** | `/<source>/{z}/{x}/{y}` (vector tiles), `/<source>` (TileJSON), `/catalog` |
            | maputnik static editor | 8000 | **28000** | `/` (SPA root) |
            | pmtiles-viewer SPA | 8001 | **28001** | `/` (SPA root — load remote PMTiles archive via the UI's URL input) |
            | versatiles-frontend SPA | 8002 | **28002** | `/` (SPA root); `/style/` re-exports versatiles-style bundle |
            | versatiles serve | 8090 | **28090** | `/tiles/<source>/{z}/{x}/{y}.pbf` (parallel tile server to martin; serves /workspace/tiles/shortbread/) |
            
            **Host port 8080 is NOT used** for airflow because traefik already
            binds it on the operator's machine. Always use **28080** for airflow
            from the host.
            
            ## Required charly.yml entry
            
            The versa deploy entry is minimal — the seven URL env vars the
            notebook reads are all auto-injected via per-producing-layer
            `env_provide:` blocks, and the eight container ports are
            auto-allocated to free host ports by default: absence of a
            deploy-level `port:` key IS auto-allocation (`/charly-core:deploy`
            "Auto port mapping" — the legacy `port: [auto]` sentinel is retired).
            The user's browser is on the
            host; container-internal `localhost:N` URLs do NOT resolve there —
            but the auto-derived `*_PUBLIC_URL` vars correctly carry the
            host-side mapping, so the browser-bound and kernel-bound URL spaces
            stay in sync automatically:
            
            ```yaml
            versa:
              pod:
                image: versa
                disposable: true
                lifecycle: dev
                # No port: key — every image-declared container port auto-allocates to a
                # free host port. The resolved expansion is persisted as `resolved_port:`
                # alongside this entry on the next `charly config versa` / `charly update
                # versa` run.
            ```
            
            That's the entire entry. No `env:` block — the seven URL env vars
            flow from layer `env_provide:`:
            
            | env var | Producer layer | Template |
            |---|---|---|
            | `MARTIN_PUBLIC_URL` | `osm-tools` | `http://127.0.0.1:{{.HostPort 3000}}` |
            | `AIRFLOW_PUBLIC_URL` | `airflow` | `http://127.0.0.1:{{.HostPort 8080}}` |
            | `AIRFLOW_API_INTERNAL_URL` | `airflow` | `http://{{.ContainerName}}:8080` (rewritten to `localhost:8080` same-pod) |
            | `AIRFLOW_DAGS_DIR` | `airflow` | `/workspace/dags` (static) |
            | `VERSATILES_PUBLIC_URL` | `versatiles` | `http://127.0.0.1:{{.HostPort 8090}}` |
            | `VERSATILES_STYLE_PUBLIC_URL` | `versatiles-frontend` | `http://127.0.0.1:{{.HostPort 8002}}/style` |
            | `VERSATILES_ASSETS_PUBLIC_URL` | `versatiles-frontend` | `http://127.0.0.1:{{.HostPort 8002}}` |
            
            If you need stable host ports across rebuilds (e.g. browser
            bookmarks), pin them with an explicit `port:` list (the container
            side; unlisted container ports keep auto-allocating) — the
            `env_provide:` templates substitute against whichever ports you
            chose, so the URL env vars stay correct either way:
            
            ```yaml
            versa:
              pod:
                image: versa
                port:
                  - "22718:2718"
                  - "28080:8080"
                  - "23000:3000"
                  - "28000:8000"
                  - "28001:8001"
                  - "28002:8002"
                  - "28090:8090"
            ```
            
            For cross-pod topologies (airflow in a separate pod on the shared
            `charly` podman network), no special handling needed — the
            `AIRFLOW_API_INTERNAL_URL` template renders to
            `http://<airflow-pod-name>:8080` because `{{.ContainerName}}`
            resolves to the airflow image's container, and `podAwareEnvProvides`
            only rewrites to `localhost` when consumer and producer share a pod.
            
            **To verify the resolved URLs once the deploy is running**, open the
            notebook — the new diagnostic cell at the top (`_resolved_urls`)
            renders a polars DataFrame listing every URL env var, its current
            value, and whether it came from `env_provide` injection or the
            fallback default. See `/charly-versa:notebook-osm` cell #2.
            
            ### Multi-instance pattern (Pattern A from /charly-core:deploy)
            
            Run multiple instances of versa side-by-side using the
            `<base>/<instance>` deploy-key form. Each instance gets its own
            container (`charly-versa`, `charly-versa-ecovoyage`, …), its own workspace
            volume, and its own host-port mappings:
            
            ```yaml
            versa:
              pod:
                image: versa
                disposable: true
                # No port: key — every container port auto-allocates to a free host port.
            
            versa/ecovoyage:
              pod:
                image: versa               # SAME image, explicit field required
                disposable: true
                volume:
                  - name: workspace
                    type: bind
                    host: /home/user/projects/ecovoyage
                port:
                  - "32718:2718"           # explicit pinned ports for stable bookmarks
                  - "38080:8080"
                  - "33000:3000"
                  - "38000:8000"
                  - "38001:8001"
                  - "38002:8002"
                  - "38090:8090"
            ```
            
            CLI: `charly update versa/ecovoyage` ↔ `charly update versa -i ecovoyage`.
            
            ### Pinned-version pattern (Pattern B from /charly-core:deploy)
            
            Run a specific image tag under an arbitrary deploy name (useful for
            canaries, regression bisection, or holding back a specific version):
            
            ```yaml
            versa-pinned-2026.131.2134:
              pod:
                image: ghcr.io/opencharly/versa:2026.131.2134  # exact ref, never re-resolved
                disposable: true
                # No port: key — every container port auto-allocates to a free host port.
            ```
            
            Container name: `charly-versa-pinned-2026.131.2134`. CLI:
            `charly update versa-pinned-2026.131.2134`. The deploy key has no
            relation to the image name; `charly update` always pulls the exact tag
            declared in `image:`.
            
            ## MCP servers
            
            This image publishes one MCP endpoint (registered by this plugin's
            `.mcp.json`):
            
            | Name | Container URL | Tool count | Skill |
            |---|---|---:|---|
            | marimo | `http://localhost:2718/mcp/server` | 10 (read-only inspection) | `/charly-versa:marimo-mcp` |
            
            The marimo MCP server name reflects the upstream software identity,
            not OUR image identity. There is no `airflow` MCP — no Airflow-3 /
            `/api/v2` release of the upstream `mcp-server-apache-airflow` package
            exists, so consumers drive Airflow via direct REST `/api/v2/` calls
            instead.
            
            ## R10 acceptance
            
            ```bash
            charly update --build --force-seed versa
            charly check live versa         # → 97 passed · 0 failed · 0 skipped
            ```
            
            The 4 GPU-library probes (cuGraph/cuML/PyG/graphistry) live alongside
            the 11 OSM/GTFS probes as `context: [deploy]` steps in the box's
            `plan:` in `charly.yml` so they run AFTER every
            per-layer plan section:
            
            | probe id | what it checks |
            |---|---|
            | `versa-notebook-export` | end-to-end `marimo export ipynb` — triggers all 6 self-authored DAGs and renders every cell server-side (the single highest-value probe; 600s timeout) |
            | `versa-notebook-size` | rendered `.ipynb` is ≥100 KB (catches empty-cell renders) |
            | `versa-martin-monaco` | TileJSON for the canonical `monaco` source returns 200 + body contains `tilejson` + `vector_layers` |
            | `versa-martin-monaco-gpqtiles` | same for `monaco-gpqtiles` |
            | `versa-martin-monaco-duckdb-mvt` | same for `monaco-duckdb-mvt` |
            | `versa-martin-monaco-duckdb-freestiler` | same for `monaco-duckdb-freestiler` |
            | `versa-versatiles-shortbread-tile` | versatiles serve returns a non-empty PBF tile for the shortbread output (HEAD content-length probe) |
            | `versa-artifact-parquet` | post-DAG `monaco.parquet` ≥500 KB |
            | `versa-artifact-pmtiles` | post-DAG `monaco.pmtiles` ≥1 MB |
            | `versa-artifact-gtfs` | post-DAG `monaco.gtfs.zip` ≥500 KB |
            | `versa-artifact-shortbread` | post-DAG `monaco-shortbread.pmtiles` ≥100 KB |
            | `versa-graph-imports` | cugraph + cuml + torch_geometric + torch_scatter + graphistry import + GPU visible |
            | `versa-graph-cugraph-pagerank` | `nx.pagerank(G, backend="cugraph")` on karate club; returns the rows |
            | `versa-graph-notebook-export` | end-to-end `marimo export ipynb` of `gpu-libraries-demo.py` (600s timeout) |
            | `versa-graph-notebook-size` | rendered `.ipynb` is ≥10 KB (matches the ~18 KB observed live) |
            
            End-to-end notebook test (executes all the cells via marimo's own
            export):
            
            ```bash
            charly cmd versa "/home/user/.pixi/envs/default/bin/marimo \
              export ipynb /workspace/notebooks/osm-monaco-viz.py \
              --include-outputs --sort topological -o /tmp/notebook-run.ipynb -f"
            ```
            
            Expected outputs (verified end-to-end):
            
            - both DAGs reach `state: success`
            - OSM parquet ~824 KB at `/workspace/tiles/work/monaco.parquet`
            - pmtiles ~2.6 MB at `/workspace/tiles/pmtiles/monaco.pmtiles`
            - GTFS zip ~770 KB at `/workspace/gtfs/raw/monaco.gtfs.zip`
            - 98 stops, 15 routes, 5846 trips in `/workspace/gtfs/parquet/`
            - streets MapLibre HTML embeds martin URL, mapterhorn DEM, hillshade,
              terrain, sky, TerrainControl
            - transit folium HTML embeds 98 `circleMarker` calls
            - neither folium map carries the "Make this Notebook Trusted" wrapper
            
            ## Deferred GPU libraries
            
            The image installs every GPU library that has a working Linux-cp313
            CUDA-13 wheel upstream. The following are skipped because no
            compatible wheel exists at build time; re-add them once wheels ship.
            
            - **DGL** — `https://data.dgl.ai/wheels/` has no `cu130/` directory.
              DGL's release matrix typically lags CUDA by 1-2 major versions;
              source-building inside `arch-builder` would cost 20-40 min of
              image-build time and is brittle against CUDA toolkit-layout
              assumptions in DGL's CMake.
            - **PyTorch3D** — `https://github.com/facebookresearch/pytorch3d/releases`
              has no cu130 wheel. Source-building would break the pixi
              `no-build = true` invariant load-bearing for the apache-airflow pin.
            - **FAISS GPU** — `https://pypi.org/project/faiss-gpu-cu13/` 404s.
              conda-forge ships `faiss-gpu` but pinned to CUDA 11/12, which would
              force a conflicting conda-forge CUDA stack alongside the existing
              PyPI cu130 install. `faiss-cpu` is functional but the user-facing
              decision is "skip rather than CPU fallback".
            - **pyg-lib** — only a Windows-cp313 wheel exists at
              `https://data.pyg.org/whl/torch-2.11.0+cu130.html`. PyG falls back
              to pure-Python message-passing without it; the visible API is
              unchanged.
            - **torch-spline-conv** — no cp313 wheel at all. Niche convolution
              layer; PyG's other layer types are unaffected.
            
            ## Load-bearing transitive: pytest in the pixi env
            
            `pytest` is an explicit `[pypi-dependencies]` entry in
            `candy/marimo/pixi.toml` despite no code in this env using pytest as a
            test framework. It is an **involuntary runtime dep** of the cupy + torch
            2.11 combination:
            
            - cupy ships `testing` as `importlib.util.LazyLoader`
              (`cupy/__init__.py`), and `cupy/testing/__init__.py` eagerly imports
              `cupy.testing._random` which does `import pytest` at module top.
            - torch 2.11's `library.custom_op` decorator runs
              `inspect.getmodule(frame) → hasattr(module, "__file__")` during
              fake-op registration, which trips the LazyLoader and forces the
              cupy.testing chain.
            - Joint import sequence `import cugraph; import torch_geometric`
              therefore needs `pytest` available in the env, or it
              `ModuleNotFoundError`s deep in torch's fake-op registration.
            
            Upstream cupy packaging defect (a runtime testing helper should not
            eagerly `import pytest`); the downstream fix is supplying pytest. Pure-
            Python wheel — does not break the `no-build = true` invariant the
            `apache-airflow` pin requires.
            
            ## Known gotchas
            
            - **User charly.yml needs `image:` field.** `~/.config/charly/charly.yml`
              versa entry must include `image: versa` — otherwise
              `charly update --build` fails with "deploy has no 'image:' field".
            - **Marimo session persistence reorders cells.** When a marimo session
              is open and the file changes (e.g. after `--force-seed`), marimo
              re-persists with its session's cell order. Surgical reset:
              `charly service stop versa marimo`, then `charly cmd versa "cp /data/workspace/notebooks/osm-monaco-viz.py /workspace/notebooks/"`, then `charly service start versa marimo`.
            - **Martin caches pmtiles mtime at startup.** Re-run a DAG that
              rewrites `monaco.pmtiles` → martin returns 500/204 forever until
              restart. The OSM DAG's `reload_martin` task handles this automatically;
              see `/charly-versa:osm-tools-layer`.
            - **Notebook needs `image:` field too.** Already covered above —
              same point worth emphasizing.
            

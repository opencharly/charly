charly:
    candy:
        version: 2026.162.1430
        description: |
            The full charly toolchain on a deployment — the on-PATH charly CLI plus its composed VM / encrypted-storage / console-relay stack.
            Full charly toolchain — the CLI binary + the VM stack (virtualization),
            encrypted storage (gocryptfs), and console relay (socat) — composed into
            ONE layer that works identically on container/pod, host/local, and
            bootc/VM targets via the `virtualization` layer's mixed-entry `service:`
            pattern. This is the single canonical `charly` layer: bake it where a
            deployment needs a persistent on-`$PATH` charly or the full toolchain inside
            (the `charly-mcp` server, the `*-charly` showcases, nested-pod orchestrators).
            Images that only need transient in-container `charly` (the dbus delegation
            path) need NOT bake it — the host copies `charly` in on demand
            (`EnsureCharlyInDeployVenue`; see `/charly-tools:charly`).
        candy:
            - virtualization
            - gocryptfs
            - socat
        distro:
            debian:
                # tailscale is a mandatory charly dep but is NOT in Debian main, so the
                # .deb (pkg/debian) omits it; the charly candy supplies it for deb-family
                # via the tailscale apt repo. arch/fedora get tailscale from their
                # native package's deps instead, so it is deb-family-scoped here.
                package:
                    - tailscale
                repo:
                    - name: tailscale
                      url: "https://pkgs.tailscale.com/stable/debian"
                      key: "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
                      suite: trixie
                      components: main
            ubuntu:
                package:
                    - tailscale
                repo:
                    - name: tailscale
                      url: "https://pkgs.tailscale.com/stable/ubuntu"
                      key: "https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg"
                      suite: noble
                      components: main
        # On a DEPLOY target charly is installed as the proper OS-tracked package for the
        # target distro's format (LocalPkgInstallStep): pac → opencharly-git built from
        # pkg/arch via makepkg + pacman -U; rpm → opencharly built from pkg/fedora via
        # rpmbuild + dnf install; deb → opencharly built from pkg/debian via
        # dpkg-buildpackage + apt-get install. Each install AUTO-RESOLVES the package's
        # dependencies from the target's repos. The sources live at the SUPERPROJECT
        # root (pkg/<fmt>) — resolved by walking UP from the deploy project dir, so a
        # consumer nested under box/<distro> still finds them. An IMAGE build has no
        # host-package-build step, so it DOWNLOADS the published package
        # (format.<fmt>.local_pkg.download_template) and installs it via the same
        # dep-resolving install command — same OS-tracked result, no curl'd raw binary.
        localpkg:
            pac: pkg/arch
            rpm: pkg/fedora
            deb: pkg/debian
        plan:
            - check: the charly binary resolves on the deployment's PATH
              exit_status: 0
              command: command -v charly
            - check: charly version prints a CalVer build stamp on stdout
              exit_status: 0
              stdout:
                - matches: "[0-9]{4}\\.[0-9]+"
              command: charly version
            - check: the gocryptfs encrypted-storage binary (gocryptfs candy) is installed
              file:
                file: /usr/bin/gocryptfs
                exists: true
            - check: the socat console-relay binary (socat candy) is installed
              file:
                file: /usr/bin/socat
                exists: true
            - check: the libvirt virsh client (virtualization candy) is installed
              file:
                file: /usr/bin/virsh
                exists: true
            - check: the qemu system emulator (virtualization candy) is installed
              file:
                file: /usr/bin/qemu-system-x86_64
                exists: true
            - check: charly doctor runs and emits its Summary line
              exit_status: 0
              command: charly doctor 2>&1 | grep -q "Summary:"
            - check: command=command -v charly
              id: charly-binary
              exit_status: 0
              stdout:
                # Path-agnostic: the package installs to /usr/bin/charly, but on a
                # usr-merged distro (Arch/CachyOS: /usr/sbin -> bin, /usr/sbin ahead
                # of /usr/bin in PATH) `command -v` reports it via /usr/sbin — the
                # SAME inode. Accept any /usr[/local]/{bin,sbin}/charly so the probe
                # passes regardless of which PATH alias resolved it (RE2: no $ anchor,
                # which wouldn't match the trailing newline).
                - matches: "/usr/(local/)?s?bin/charly"
              command: command -v charly

charly-skill:
    skill:
        name: charly
        family: tools
        owner: charly
        description: |-
            OpenCharly CLI (charly) binary installed into container/VM images for in-container use.
            Use when working with charly binary deployment inside containers, in-container charly CLI usage, or the full charly toolchain (charly binary + virtualization + gocryptfs + socat).
        content: |
            # charly -- OpenCharly CLI binary
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `run:` step, `bin/charly` |
            
            ## What It Provides
            
            The `charly` binary inside containers provides the full charly CLI for in-venue
            scripting, service management, and automation. **The box need NOT bake the `charly`
            candy for charly to run inside a venue:** when a flow needs `charly` present and the
            venue lacks it (nested from-image delegation), the generic copy-`charly`-into-a-running-venue
            mechanism (`EnsureCharlyInDeployVenue` over `DeployExecutor.PutFile` — `podman cp` for a
            container, `scp` for a VM/host) copies the host's own binary in on demand and invokes
            the delivered copy. Baking the candy only pre-stages the binary so the first such call
            skips the copy.
            
            ## Check-vs-production binary source — disposable beds bake the IN-DEV charly
            
            The `charly` candy installs the binary as a proper, dependency-resolving OS
            package via `localpkg:` (`{pac: pkg/arch, rpm: pkg/fedora, deb: pkg/debian}`).
            The BINARY SOURCE depends on the box type — a hard distinction, NEVER mixed:
            
            - **Disposable check beds** (`disposable: true` deploys) bake the latest **in-development**
              charly: the check-bed runner builds every bed image with `charly box build
              --dev-local-pkg`, so the package is BUILT from the local working tree
              (`pkg/<fmt>` + `charly/`). A bed therefore tests the charly code under
              development — never a stale published release.
            - **Production boxes** bake the latest **published** charly: a normal
              `charly box build` DOWNLOADS the published release package
              (`releases/latest/download/opencharly-<arch>.<fmt>`).
            
            ONE decision point (`deploykit.RenderLocalPkgImageInstall`), generic across all kinds and
            all localpkg candies; the check-bed runner sets `--dev-local-pkg` automatically, a
            production build never does. A dev build that cannot find its local source HARD
            errors (R4 — no silent fallback to the release). Full mechanics:
            `/charly-internals:install-plan` "Check-vs-production charly toolchain". This is
            WHY a fresh check bed exercises your uncommitted charly changes while a real box
            ships the released toolchain.
            
            ## Updating the Binary — dual-path gotcha
            
            The `charly` candy's `copy: bin/charly` run step is resolved **relative to the candy directory**, so the box build reads `candy/charly/bin/charly` — NOT the repo-root `bin/charly`. Two independent paths need to stay in sync:
            
            | Path | Who reads it |
            |------|-------------|
            | `bin/charly` (repo root) | Host-side `charly` invocations; users running `/tmp/charly` style tests |
            | `candy/charly/bin/charly` | The `charly` candy's COPY into boxes during `charly box build` |
            
            **Canonical workflow** — `task build:binary` compiles to repo-root AND syncs to the layer:
            
            ```bash
            task build:binary                              # Builds + syncs both paths; rebuild images after.
            ./bin/charly box build <image>               # Rebuild affected images.
            ```
            
            **Manual workflow** — if you skip `task build:binary` and build with `go build` directly, you MUST sync the candy path, or boxes will bake the previous binary:
            
            ```bash
            cd charly && go build -o ../bin/charly .           # Only updates repo-root bin/charly.
            cp bin/charly candy/charly/bin/charly                 # REQUIRED — sync to layer path.
            ./bin/charly box build <image>               # Rebuild affected images.
            ```
            
            **Why this bites**: `charly box build` uses auto-generated intermediate images (e.g., `ghcr.io/opencharly/charly-fedora-2-dbus-nodejs`) that cache the `charly` candy. If you update `bin/charly` in repo-root but forget the candy copy, the intermediate's cache hit serves stale content. After cleaning up a stale dual-path situation, `charly clean --invalidate 'charly-fedora-2*'` forces a clean intermediate rebuild.
            
            ## `charly status` Probe
            
            The `charly` probe checks:
            1. Whether the `charly` binary exists in the container
            2. The CalVer version (`charly version`)
            
            Shows as `charly:ok (2026.94.1417)` in `charly status` detail view. Returns `-` for boxes without the `charly` candy.
            
            **Note:** `charly version` writes to **stdout** via `fmt.Println` (the prior
            `println(version)` emitted to stderr; the move to `fmt.Println` landed
            with the MCP server work so the in-process tool-call path — which
            captures `os.Stdout` — returns the CalVer correctly). The candy test at
            `candy/charly/charly.yml` asserts `stdout:` matches `[0-9]{4}\.[0-9]+`. The
            `charly status` probe uses `CombinedOutput()` so it's agnostic to the
            stream.
            
            ## Usage
            
            ```yaml
            # charly.yml — the charly candy is composed into all supervisord images
            my-image:
              candy:
                base: fedora
                candy: [charly]
            ```
            
            ## Used In Boxes
            
            - The `charly` candy is the full toolchain (charly binary + virtualization + gocryptfs + socat); composed into githubrunner, charly-fedora, charly-arch
            - Now directly added to all boxes with supervisord (openclaw, jupyter, ollama, sway-browser-vnc, selkies-desktop, immich, etc.)
            
            ## Related Candies
            
            - `/charly-infrastructure:virtualization`, `/charly-infrastructure:gocryptfs`, `/charly-infrastructure:socat` -- the candies the `charly` candy composes alongside the binary to form the full toolchain
            - `/charly-coder:charly-mcp` -- candies: [charly, supervisord] meta-composition that deploys `charly mcp serve` (~192-tool MCP gateway) with a `/workspace` bind mount (volume NAME `project`) for build-mode tools + auto-fallback to opencharly/charly when nothing is bound
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Installing the charly binary inside containers
            - The full charly toolchain composition (charly binary + virtualization + gocryptfs + socat)
            - In-container charly CLI usage
            - Updating the charly candy binary after code changes
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

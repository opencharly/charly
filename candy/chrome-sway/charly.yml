chrome-sway:
    candy:
        version: 2026.144.1443
        description: |
            Sway autostarts the Chrome CDP browser via a config.d drop-in that execs chrome-wrapper
            A composition candy with one install of its own: a Sway config.d
            drop-in (chrome-sway.conf) holding `exec chrome-wrapper`, so the
            compositor launches Chrome on startup. It composes /charly-selkies:sway
            (the headless compositor that reads config.d), /charly-selkies:chrome
            (the browser), and /charly-selkies:chrome-cdp (which installs the
            chrome-wrapper launcher the snippet execs). Every fact below is
            observable: the installed drop-in, its exec directive, the
            chrome-wrapper target it references, and the composed Chrome + Sway
            binaries the autostart depends on.
        require:
            - '@github.com/opencharly/pod-sway:v2026.235.2057'
        candy:
            - '@github.com/opencharly/layer-chrome:v2026.235.2057'
            - '@github.com/opencharly/pod-chrome-cdp:v2026.235.2057'
        plan:
            - run: mkdir=${HOME}/.config/sway/config.d
              mkdir: "${HOME}/.config/sway/config.d"
              run_as: "${USER}"
            - run: copy=chrome-sway.conf
              copy: chrome-sway.conf
              to: "${HOME}/.config/sway/config.d/chrome-sway.conf"
              mode: "0644"
              run_as: "${USER}"
            - check: the chrome-sway autostart snippet is installed in sway's config.d drop-in dir
              file:
                file: ${HOME}/.config/sway/config.d/chrome-sway.conf
                exists: true
                mode: "0644"
            - check: the snippet tells sway to exec the chrome-wrapper launcher on startup
              file:
                file: ${HOME}/.config/sway/config.d/chrome-sway.conf
                contains:
                    - contains: "exec chrome-wrapper"
            - check: the chrome-wrapper launcher the snippet execs is installed and executable
              file:
                file: ${HOME}/.local/bin/chrome-wrapper
                exists: true
                mode: "0755"
            - check: Google Chrome is installed for the compositor to launch
              file:
                file: /usr/bin/google-chrome-stable
                exists: true
            - check: the sway compositor that reads the config.d drop-in is installed
              file:
                file: /usr/bin/sway
                exists: true

chrome-sway-skill:
    skill:
        name: chrome-sway
        family: selkies
        owner: chrome-sway
        description: |-
            Google Chrome running on Sway compositor via exec autostart with DevTools protocol.
            Use when working with Chrome in Sway, browser automation, or CDP in desktop containers.
        content: |-
            # chrome-sway -- Chrome browser on Sway compositor
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `sway` |
            | Candies (includes) | `chrome` |
            | Install files | `task:`, `chrome-sway.conf` |
            
            ## Usage
            
            ```yaml
            # charly.yml -- typically included via sway-desktop composition
            my-browser:
              candy:
                - chrome-sway
            ```
            
            ## Used In Boxes
            
            Part of `/charly-selkies:sway-desktop` composition.
            
            ## Chrome Lifecycle in Sway
            
            Chrome is launched by Sway's `exec` directive (autostart) via `chrome-wrapper`. It is **not** a supervisord service -- Sway owns the Chrome process. This means:
            
            - **Autostart**: Chrome starts when Sway starts (via `exec chrome-wrapper` in sway config).
            - **Crashes/exits**: Chrome does not auto-restart. If Chrome exits, it must be relaunched manually.
            - **Manual restart**: Relaunch Chrome with a `wl: exec` step running `chrome-wrapper` (the `wl:` verb dispatches out-of-process via candy/plugin-wl). Do **not** use `charly shell` with bare `swaymsg` -- the shell may lack the correct `SWAYSOCK` path.
            - **On-demand launch**: The `browser-open` helper auto-launches Chrome if it's not running (see `/charly-selkies:chrome` for details).
            
            ## Related Candies
            
            - `/charly-selkies:sway` -- compositor dependency
            - `/charly-selkies:chrome` -- Chrome browser and DevTools (included via candies)
            - `/charly-selkies:sway-desktop` -- composition that includes chrome-sway
            - `/charly-selkies:wayvnc` -- VNC access to see Chrome desktop
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Chrome running in Sway desktop
            - Browser autostart in compositor
            - CDP (Chrome DevTools Protocol) in desktop containers
            - Chrome-sway configuration
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

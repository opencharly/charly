clawhub:
    candy:
        version: 2026.144.1443
        description: |
            ClawHub CLI for searching and installing OpenClaw skills
            Installs the `clawhub` npm package globally (via package.json,
            requires nodejs), landing the commander-based `clawhub` CLI on the
            npm global bin path at ~/.npm-global/bin (npm also creates the
            `clawdhub` alias). The CLI searches, installs, and updates OpenClaw
            skills from the ClawHub registry; `clawhub --cli-version` reports its
            version offline, so the install + bin wiring is verifiable without
            network access.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
        plan:
            - check: the clawhub CLI binary is installed on the npm global bin path
              file:
                file: ${HOME}/.npm-global/bin/clawhub
                exists: true
            - check: running clawhub --cli-version prints a semantic version and exits zero
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+\\.[0-9]+"
              command: ${HOME}/.npm-global/bin/clawhub --cli-version
            - agent-check: clawhub search <term> queries the ClawHub registry and returns matching OpenClaw skills
            - check: file=${HOME}/.npm-global/bin/clawdhub
              id: clawdhub-alias-binary
              file:
                file: ${HOME}/.npm-global/bin/clawdhub
                exists: true
            - check: command=${HOME}/.npm-global/bin/clawhub --help
              id: clawhub-help-subcommands
              exit_status: 0
              stdout:
                - contains: search
                - contains: install
              command: ${HOME}/.npm-global/bin/clawhub --help

clawhub-skill:
    skill:
        name: clawhub
        family: openclaw
        owner: clawhub
        description: |-
            ClawHub CLI for searching and installing OpenClaw skills.
            Use when working with the clawhub candy.
        content: |-
            # clawhub -- ClawHub skill registry CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `package.json` |
            | Depends | `nodejs` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — composition is an inline candy: list in the body
            my-box:
                candy:
                    base: fedora
                    candy:
                        - clawhub
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:nodejs` — Required Node.js runtime parent dependency
            - `/charly-openclaw:openclaw-full` — Metalayer bundling clawhub with codex/gemini/claude-code
            - `/charly-openclaw:openclaw` — OpenClaw gateway service that consumes installed skills
            
            ## Related Commands
            - `/charly-build:build` — Builds the candy (npm global install via package.json)
            - `/charly-automation:openclaw-deploy` — OpenClaw gateway configuration where clawhub installs skills
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - ClawHub skill registry
            - Installing or searching OpenClaw skills
            - The `clawhub` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan steps, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

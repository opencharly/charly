cloud-init:
    candy:
        version: 2026.144.1443
        description: |
            Cloud-init NoCloud provisioning for first-boot VM/cloud instance bootstrap.
            Installs cloud-init and the growpart partition-resize utility, then
            pins the datasource to NoCloud via a drop-in at
            /etc/cloud/cloud.cfg.d/99-nocloud.cfg so a bootc/VM guest reads its
            seed ISO (user-data/meta-data) at first boot. The cloud-init binary,
            the growpart binary, and the NoCloud drop-in are all baked into the
            image and independently checkable.
        require:
            - '@github.com/opencharly/pod-sshd:v2026.237.558'
        package:
            - cloud-init
        distro:
            arch:
                package:
                    - cloud-guest-utils
            debian:
                package:
                    - cloud-guest-utils
            fedora:
                package:
                    - cloud-utils-growpart
            ubuntu:
                package:
                    - cloud-guest-utils
        service:
            - name: cloud-init-local
              use_packaged: cloud-init-local.service
              enable: true
              scope: system
            - name: cloud-init
              use_packaged: cloud-init.service
              enable: true
              scope: system
            - name: cloud-config
              use_packaged: cloud-config.service
              enable: true
              scope: system
            - name: cloud-final
              use_packaged: cloud-final.service
              enable: true
              scope: system
        plan:
            - run: mkdir=/etc/cloud/cloud.cfg.d
              mkdir: /etc/cloud/cloud.cfg.d
              run_as: root
            - run: write=/etc/cloud/cloud.cfg.d/99-nocloud.cfg
              write: /etc/cloud/cloud.cfg.d/99-nocloud.cfg
              mode: "0644"
              run_as: root
              content: |
                datasource_list: [ NoCloud, None ]
            - check: the cloud-init binary is present in the image
              file:
                file: /usr/bin/cloud-init
                exists: true
            - check: cloud-init responds to --version with a version string
              exit_status: 0
              stdout:
                - matches: '[0-9]+\.[0-9]'
              command: cloud-init --version 2>&1
            - check: the NoCloud datasource drop-in is installed mode 0644
              file:
                file: /etc/cloud/cloud.cfg.d/99-nocloud.cfg
                exists: true
                mode: "0644"
            - check: the drop-in restricts the datasource list to NoCloud
              file:
                file: /etc/cloud/cloud.cfg.d/99-nocloud.cfg
                contains:
                    - contains: datasource_list
                    - contains: NoCloud
            - check: the growpart partition-resize utility is installed
              file:
                file: /usr/bin/growpart
                exists: true
            - check: package=cloud-init
              id: cloud-init-package
              package:
                package: cloud-init
                installed: true
            - check: file=/etc/cloud/cloud.cfg.d/99-nocloud.cfg
              id: cloud-init-nocloud-datasource
              file:
                file: /etc/cloud/cloud.cfg.d/99-nocloud.cfg
                exists: true
                mode: "0644"
                contains:
                    - contains: datasource_list
                    - contains: NoCloud
                    - contains: None
            - check: package=cloud-utils-growpart
              id: cloud-init-growpart-package
              package:
                package: cloud-utils-growpart
                package_map:
                    arch: cloud-guest-utils
                    debian: cloud-guest-utils
                    ubuntu: cloud-guest-utils
                    fedora: cloud-utils-growpart
                installed: true

cloud-init-skill:
    skill:
        name: cloud-init
        family: distros
        owner: cloud-init
        description: |-
            Cloud-init for instance initialization in cloud/VM environments with NoCloud datasource.
            Use when working with cloud-init, VM provisioning, or cloud instance bootstrapping.
        content: |
            # cloud-init -- cloud instance initialization
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `sshd` |
            | Install files | `run:` steps, `charly.yml` |
            
            ## Packages
            
            - `cloud-init` (RPM) -- cloud instance initialization
            - `cloud-utils-growpart` (RPM) -- partition growing utility
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-cloud-image:
              candy:
                base: "quay.io/fedora/fedora-bootc:43"
                bootc: true
                candy: [cloud-init]
            ```
            
            ## Used In Boxes
            
            Used in bootc images for VM/cloud deployments. Depends on `sshd`.
            
            ## Host-side pairing with `kind: vm` entities
            
            This candy installs the **guest-side** cloud-init package — the daemon that reads a NoCloud seed ISO at first boot. The **host-side** companion is the `RenderCloudInit` path in the `charly` binary itself (`/charly-internals:cloud-init-renderer`), which produces that seed ISO from the structured `VmSpec.CloudInit` block on a `kind: vm` entity.
            
            The two sides cooperate across the host/guest boundary:
            
            - `/charly-internals:cloud-init-renderer` emits `user-data` + `meta-data` + `network-config` + seeds ISO via xorriso.
            - This guest-side candy installs cloud-init so the guest reads `/dev/sr0` (the seed ISO) at boot.
            - The `composeUsers` adopt-merge pattern (renderer-side) deposits the SSH pubkey in `~<base_user>/.ssh/authorized_keys` without `useradd`.
            
            For cloud_image VMs (`source.kind: cloud_image`), cloud-init typically comes pre-installed in the upstream qcow2 — this candy isn't needed; author the VM entity directly in `vm.yml`. For bootc VMs that want cloud-init provisioning, add this candy explicitly. See `/charly-vm:vms-catalog` for the authoring guide and `/charly-vm:arch-cloud-vm` for a worked example.
            
            ## Related Skills
            
            - `/charly-coder:sshd` -- SSH server dependency
            - `/charly-distros:qemu-guest-agent` — host-guest communication (paired with cloud-init in VMs)
            - `/charly-vm:vm` — VM lifecycle (create, start, stop, ssh) for kind:vm entities
            - `/charly-vm:vms-catalog` — kind:vm authoring reference
            - `/charly-internals:cloud-init-renderer` — host-side renderer producing the NoCloud seed ISO this candy reads
            - `/charly-image:layer` — candy authoring reference
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Cloud-init configuration or NoCloud datasource
            - VM instance provisioning
            - Cloud instance bootstrapping
            - Partition growing with growpart
            - System services: cloud-init-local, cloud-init, cloud-config, cloud-final
            
            ## Related
            
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

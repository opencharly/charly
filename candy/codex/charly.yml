codex:
    candy:
        version: 2026.199.1330
        description: |
            Installs the OpenAI Codex CLI globally via npm so `codex` is on PATH.
            The candy depends on nodejs and ships a package.json pinning
            @openai/codex, which the build installs globally into
            ~/.npm-global/bin. The result is verifiable: the codex binary exists at
            that path and `codex --version` exits cleanly. A CUE-validated tmux
            terminal profile exposes it through the generic Charly agent channel.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
        agent_provide:
            - provider: tmux
              protocol_version: 2
              profiles: [codex]
              interaction_modes: [terminal]
              persistence: required
              semantic_completion: true
        terminal_profile:
            codex:
                name: codex
                entrypoint: [codex]
                cols: 120
                rows: 40
                semantic_adapter: codex
                keys: [enter, escape, tab, backspace, up, down, left, right, home, end, page-up, page-down, delete, insert, ctrl-a, ctrl-c, ctrl-d, ctrl-e, ctrl-l, ctrl-z]
                signals: [interrupt, eof, suspend]
                persistence: required
                transcript: both
        plan:
            - check: the installed Codex package exactly matches the declared deterministic pin
              command: node -e 'const p=require(process.env.HOME+"/.npm-global/lib/node_modules/@openai/codex/package.json");if(p.version!=="0.144.6")process.exit(1)'
              exit_status: 0
            - check: the codex binary is installed into the npm global bin directory
              file:
                file: ${HOME}/.npm-global/bin/codex
                exists: true
            - check: running codex --version exits cleanly
              exit_status: 0
              command: ${HOME}/.npm-global/bin/codex --version

codex-skill:
    skill:
        name: codex
        family: coder
        owner: codex
        description: |-
            OpenAI Codex CLI coding agent.
            Use when working with the codex candy.
        content: |-
            # codex -- OpenAI Codex CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `package.json` |
            | Depends | `nodejs` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
                candy:
                    base: fedora
                    candy: [codex]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:nodejs` — Required Node.js runtime parent dependency
            - `/charly-coder:claude-code` — Sibling AI coding agent CLI bundled in same metalayers
            - `/charly-coder:gemini` — Sibling Google Gemini CLI bundled alongside
            
            ## Related Commands
            - `/charly-build:build` — Builds the candy (npm global install via package.json)
            - `/charly-core:shell` — Interactive shell to invoke `codex` inside the container
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - OpenAI Codex CLI in containers
            - AI coding agent setup
            - The `codex` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

comfyui:
    candy:
        version: 2026.144.1531
        description: |
            GPU image-generation server with ComfyUI + the Manager and model-download tooling baked in
            Clones ComfyUI to ~/ComfyUI plus the ComfyUI-Manager custom node and
            the full model directory tree, and installs the aria2 + git-lfs tooling
            used to fetch model checkpoints. A supervisord service runs
            `main.py --listen 0.0.0.0` on port 8188. Each piece is verifiable: the
            cloned entrypoint and Manager, the model dirs, the download-tooling
            packages, and the live /system_stats API on port 8188.
        require:
            - '@github.com/opencharly/layer-cuda:v2026.235.2121'
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
        distro:
            arch:
                package:
                    - aria2
                    - git-lfs
            fedora:
                package:
                    - aria2
                    - git-lfs
        port:
            - 8188
        volume:
            - name: comfyui
              path: "~/ComfyUI"
        service:
            - name: comfyui
              exec: "python %(ENV_HOME)s/ComfyUI/main.py --listen 0.0.0.0"
              restart: always
              working_directory: "%(ENV_HOME)s/ComfyUI"
              enable: true
              scope: system
        plan:
            - run: |
                command=git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git ${HOME}/ComfyUI || true
                cd ${HOME}/ComfyUI
                mkdir -p models/{checkpoints,clip,clip_vision,configs,controlnet}
                mkdir -p models/{diffusers,diffusion_models,embeddings,gligen,hypernetworks,loras}
                mkdir -p models/{photomaker,style_models,text_encoders,unet,upscale_models,vae,vae_approx}
                mkdir -p custom_nodes output input user
                git clone --depth 1 https://github.com/ltdrdata/ComfyUI-Manager.git ${HOME}/ComfyUI/custom_nodes/ComfyUI-Manager || true
              run_as: "${USER}"
              command: |
                git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git ${HOME}/ComfyUI || true
                cd ${HOME}/ComfyUI
                mkdir -p models/{checkpoints,clip,clip_vision,configs,controlnet}
                mkdir -p models/{diffusers,diffusion_models,embeddings,gligen,hypernetworks,loras}
                mkdir -p models/{photomaker,style_models,text_encoders,unet,upscale_models,vae,vae_approx}
                mkdir -p custom_nodes output input user
                git clone --depth 1 https://github.com/ltdrdata/ComfyUI-Manager.git ${HOME}/ComfyUI/custom_nodes/ComfyUI-Manager || true
            - check: the ComfyUI server entrypoint main.py is baked into ~/ComfyUI
              file:
                file: ${HOME}/ComfyUI/main.py
                exists: true
            - check: the ComfyUI-Manager custom node directory is cloned alongside it
              file:
                file: ${HOME}/ComfyUI/custom_nodes/ComfyUI-Manager
                filetype: directory
            - check: aria2c is installed so model checkpoints can be fetched in parallel
              file:
                file: /usr/bin/aria2c
                exists: true
            - check: git-lfs is installed for pulling large model repositories
              package:
                package: git-lfs
                installed: true
            - agent-check: the comfyui supervisord service comes up and serves the image-generation web UI and /system_stats API on port 8188
            - check: file=${HOME}/ComfyUI/models/checkpoints
              id: comfyui-models-checkpoints
              file:
                file: ${HOME}/ComfyUI/models/checkpoints
                filetype: directory
            - check: package=aria2
              id: comfyui-aria2-package
              package:
                package: aria2
                installed: true
            - check: file=/usr/bin/git-lfs
              id: comfyui-git-lfs-binary
              file:
                file: /usr/bin/git-lfs
                exists: true
            - check: service=comfyui
              id: comfyui-service-running
              context:
                - runtime
              service:
                service: comfyui
                running: true
            - check: addr=127.0.0.1:${HOST_PORT:8188}
              id: comfyui-port-reachable
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:8188}
                reachable: true
            - check: http=http://127.0.0.1:${HOST_PORT:8188}/system_stats
              id: comfyui-system-stats-api
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8188}/system_stats
                status: 200
                body:
                    - contains: system

comfyui-skill:
    skill:
        name: comfyui
        family: comfyui
        owner: comfyui
        description: |-
            ComfyUI image generation server with CUDA GPU support.
            Runs as a supervisord service on port 8188 with persistent storage.
            MUST be invoked before building, deploying, configuring, or troubleshooting the comfyui box.
        content: |-
            # comfyui
            
            GPU-accelerated ComfyUI image generation server with node-based workflow UI.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | nvidia |
            | Candies | agent-forwarding, comfyui, dbus, charly |
            | Platforms | linux/amd64 |
            | Ports | 8188 |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `fedora` → `nvidia` (CUDA base)
            2. `pixi` → `python` → `supervisord` (transitive)
            3. `comfyui` — ComfyUI server, models/output volume
            
            ## Ports
            
            | Port | Service | Protocol |
            |------|---------|----------|
            | 8188 | ComfyUI web UI | HTTP |
            
            ## Quick Start
            
            ```bash
            charly box build comfyui
            charly config comfyui
            charly start comfyui
            # Open http://localhost:8188
            ```
            
            ## Key Candies
            
            - `/charly-comfyui:comfyui` — ComfyUI installation, supervisord service, volume
            - `/charly-distros:nvidia` — GPU runtime and CDI device auto-detection (base)
            - `/charly-distros:cuda` — CUDA toolkit and libraries (via nvidia base)
            - `/charly-infrastructure:dbus-layer` — session bus for desktop notifications
            - `/charly-tools:charly` — in-container `charly` CLI toolchain (scripting, service management)
            - `/charly-distros:agent-forwarding` — SSH/GPG/direnv agent forwarding
            
            ## Related Boxes
            
            - `/charly-distros:nvidia` — parent (GPU without ComfyUI)
            - **CachyOS variant** — `cachyos.comfyui` is the CachyOS GPU sibling (built on the `cachyos.nvidia` GPU base) in the `opencharly/distro-cachyos` submodule. See `/charly-distros:cachyos`.
            
            ## Verification
            
            After `charly start`:
            - `charly status comfyui` — container running
            - `charly service status comfyui` — all services RUNNING
            - `curl -s -o /dev/null -w '%{http_code}' http://localhost:8188` — ComfyUI HTTP returns 200
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the comfyui box, image generation, or ComfyUI workflows. Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

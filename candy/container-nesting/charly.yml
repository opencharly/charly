container-nesting:
    candy:
        version: 2026.185.1940
        description: |
            Rootless nested podman/buildah/skopeo inside a rootless outer container -- zero added capabilities, no --privileged.
            Ports quay.io/podman/stable's canonical rootless-in-rootless configuration
            into the candy system. Installs podman + crun + buildah + skopeo +
            fuse-overlayfs, writes containers.conf with every namespace=host (the
            userns=host line is what bypasses the kernel mount_too_revealing /proc
            check), a two-range subuid layout that fits the keep-id window,
            newuidmap/newgidmap file caps, policy.json and storage.conf -- so an inner
            `podman run` of a fresh container succeeds with no cap_add and no
            --privileged. Every artifact below is observable in the built image; the
            end-to-end nested run is provable on a live deployment.
        package:
            - buildah
            - fuse-overlayfs
            - skopeo
        distro:
            arch:
                package:
                    - crun
                    - libsecret
                    - podman
                    - shadow
                    - tailscale
            debian:
                package:
                    - crun
                    # libcap2-bin provides setcap(8): the candy's setcap step grants
                    # cap_setuid=ep to newuidmap so a nested rootless userns can be
                    # delegated. Fedora/Arch ship setcap transitively (libcap in base);
                    # Debian/Ubuntu do NOT, so without this the setcap step exits 127
                    # and the RUN hard-fails the build. RDD-confirmed.
                    - libcap2-bin
                    - libsecret-1-0
                    - passwd
                    - podman
                    - uidmap
            debian-13:
                package:
                    - crun
                    # libcap2-bin provides setcap(8): the candy's setcap step grants
                    # cap_setuid=ep to newuidmap so a nested rootless userns can be
                    # delegated. Fedora/Arch ship setcap transitively (libcap in base);
                    # Debian/Ubuntu do NOT, so without this the setcap step exits 127
                    # and the RUN hard-fails the build. RDD-confirmed.
                    - libcap2-bin
                    - libsecret-1-0
                    - passwd
                    - podman
                    - tailscale
                    - uidmap
                repo:
                    - name: tailscale
                      url: "https://pkgs.tailscale.com/stable/debian"
                      key: "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
                      suite: trixie
                      components: main
            fedora:
                package:
                    - crun
                    - libsecret
                    - podman
                    - shadow-utils
                    - tailscale
                repo:
                    - name: tailscale-stable
                      url: "https://pkgs.tailscale.com/stable/fedora/tailscale.repo"
            ubuntu:
                package:
                    - crun
                    # libcap2-bin provides setcap(8): the candy's setcap step grants
                    # cap_setuid=ep to newuidmap so a nested rootless userns can be
                    # delegated. Fedora/Arch ship setcap transitively (libcap in base);
                    # Debian/Ubuntu do NOT, so without this the setcap step exits 127
                    # and the RUN hard-fails the build. RDD-confirmed.
                    - libcap2-bin
                    - libsecret-1-0
                    - passwd
                    - podman
                    - uidmap
            ubuntu-24.04:
                package:
                    - crun
                    # libcap2-bin provides setcap(8): the candy's setcap step grants
                    # cap_setuid=ep to newuidmap so a nested rootless userns can be
                    # delegated. Fedora/Arch ship setcap transitively (libcap in base);
                    # Debian/Ubuntu do NOT, so without this the setcap step exits 127
                    # and the RUN hard-fails the build. RDD-confirmed.
                    - libcap2-bin
                    - libsecret-1-0
                    - passwd
                    - podman
                    - tailscale
                    - uidmap
                repo:
                    - name: tailscale
                      url: "https://pkgs.tailscale.com/stable/ubuntu"
                      key: "https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg"
                      suite: noble
                      components: main
        volume:
            - name: storage
              path: /var/lib/containers/storage
        security:
            # NO cap_add — rootless nested podman needs zero additive capabilities
            # when the mount_too_revealing kernel check is bypassed at the mount
            # level (via security_opt unmask=/proc/* below).
            #
            # Root cause, empirically identified: podman's default rootless
            # container spec includes linux.maskedPaths covering /proc/kcore,
            # /proc/keys, /proc/timer_list etc. When nested crun tries to mount /proc
            # for an inner container, the kernel's fs/namespace.c:mount_too_revealing
            # check rejects it because the new /proc would expose submounts the outer
            # is masking. Removing those maskedPaths via unmask=/proc/* eliminates
            # the mismatch — no caps or --privileged needed.
            #
            # unmask=/proc/* is necessary but NOT sufficient once a GPU CDI device
            # (nvidia.com/gpu=all) is attached: the nvidia toolkit injects a REAL
            # /proc/driver/nvidia/params submount that unmask cannot remove, so the
            # containers.conf `mounts` line below binds the outer /proc into every
            # nested container (avoiding the fresh mount) — the GPU-compatible fix.
            #
            # Security trade-off: /proc/kcore (kernel memory) and /proc/keys (keyring)
            # become visible inside the outer container. Within a rootless user
            # namespace, reading these still requires CAP_SYS_ADMIN in the init
            # userns (which we don't have), so the actual info leak is minimal.
            #
            # Images that genuinely want the old full-hammer posture (charly-fedora,
            # charly-arch, githubrunner) assert `security: {cap_add: [ALL], security_opt:
            # [...]}` at the image level; charly/security.go unions onto this layer.
            security_opt:
                - unmask=/proc/*
            devices:
                # /dev/fuse is needed by fuse-overlayfs (inner podman's storage driver
                # of choice when the kernel overlay isn't usable from a rootless outer).
                - /dev/fuse
                # /dev/net/tun is probed by podman/pasta at startup even when
                # containers.conf sets netns=host; absence causes an init-time warning
                # that can mask later failures.
                - /dev/net/tun
        env:
            CHARLY_BUILD_ENGINE: "podman"
            CHARLY_RUN_ENGINE: "podman"
            # These two env vars are the hidden contract that makes rootless-in-rootless
            # podman work without --privileged:
            #
            # _CONTAINERS_USERNS_CONFIGURED=""  (empty string — set, not unset): tells
            #   the inner podman "you are already inside a rootless user namespace, do
            #   not re-exec via newuidmap to create a new one". Without this, the
            #   inner podman creates a DESCENDANT user namespace, and the kernel's
            #   mount_too_revealing check refuses the /proc mount downstream.
            #
            # BUILDAH_ISOLATION=chroot: tells buildah RUN steps to use chroot
            #   isolation instead of the OCI runtime. Without this, buildah falls
            #   back to OCI runtime isolation which re-creates a descendant user
            #   namespace and re-triggers the same kernel check during builds.
            _CONTAINERS_USERNS_CONFIGURED: ""
            BUILDAH_ISOLATION: "chroot"
        plan:
            - run: |
                command=touch /etc/subuid /etc/subgid
                sed -i "/^root:/d" /etc/subuid /etc/subgid
                echo "root:1:65535" >> /etc/subuid
                echo "root:1:65535" >> /etc/subgid
                uid1000=$(getent passwd 1000 2>/dev/null | cut -d: -f1 || true)
                if [ -n "${uid1000}" ] && [ "${uid1000}" != "root" ]; then
                  sed -i "/^${uid1000}:/d" /etc/subuid /etc/subgid
                  {
                    echo "${uid1000}:1:999"
                    echo "${uid1000}:1001:64535"
                  } >> /etc/subuid
                  {
                    echo "${uid1000}:1:999"
                    echo "${uid1000}:1001:64535"
                  } >> /etc/subgid
                fi
              run_as: root
              command: |
                touch /etc/subuid /etc/subgid
                sed -i "/^root:/d" /etc/subuid /etc/subgid
                echo "root:1:65535" >> /etc/subuid
                echo "root:1:65535" >> /etc/subgid
                uid1000=$(getent passwd 1000 2>/dev/null | cut -d: -f1 || true)
                if [ -n "${uid1000}" ] && [ "${uid1000}" != "root" ]; then
                  sed -i "/^${uid1000}:/d" /etc/subuid /etc/subgid
                  {
                    echo "${uid1000}:1:999"
                    echo "${uid1000}:1001:64535"
                  } >> /etc/subuid
                  {
                    echo "${uid1000}:1:999"
                    echo "${uid1000}:1001:64535"
                  } >> /etc/subgid
                fi
            - run: |
                grant cap_setuid/cap_setgid to newuidmap/newgidmap AND strip the
                setuid-root bit. Debian/Ubuntu's uidmap package ships these binaries
                setuid-root (mode 4755); a newuidmap that is BOTH setuid-root AND
                file-capability'd fails inside a nested rootless user namespace with
                "newuidmap: open of uid_map failed: Permission denied". Fedora/Arch
                ship them cap-only (no setuid bit), so `chmod u-s` makes every distro
                match that working posture and is a no-op where the bit is already
                absent. RDD-confirmed.
              run_as: root
              command: |
                if [ -f /usr/bin/newuidmap ]; then
                  setcap cap_setuid=ep /usr/bin/newuidmap
                  setcap cap_setgid=ep /usr/bin/newgidmap
                  chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
                fi
            - run: mkdir=/etc/containers
              mkdir: /etc/containers
              run_as: root
            - run: mkdir=${HOME}/.config/containers
              mkdir: "${HOME}/.config/containers"
              run_as: "${USER}"
            - run: write=/etc/containers/containers.conf
              write: /etc/containers/containers.conf
              run_as: root
              mode: "0644"
              content: &containers_conf_content |
                [containers]
                # Bind the outer /proc into every nested container instead of letting
                # crun mount a fresh procfs. Required when a GPU CDI device
                # (nvidia.com/gpu=all) is passed to the outer container: the nvidia
                # container toolkit injects a /proc/driver/nvidia/params tmpfs submount,
                # and the kernel's mount_too_revealing check then refuses the inner
                # fresh /proc mount EVEN WITH unmask=/proc/* (unmask removes masked
                # paths, not real submounts). Binding the outer /proc avoids the fresh
                # mount entirely, so nested podman works with or without a GPU.
                mounts = ["type=bind,source=/proc,destination=/proc,bind-propagation=rslave"]
                cgroups = "disabled"
                cgroupns = "host"
                ipcns = "host"
                netns = "host"
                userns = "host"
                utsns = "host"
                log_driver = "k8s-file"

                [engine]
                cgroup_manager = "cgroupfs"
                events_logger = "file"
                runtime = "crun"
            - run: write=${HOME}/.config/containers/containers.conf
              write: "${HOME}/.config/containers/containers.conf"
              run_as: "${USER}"
              mode: "0644"
              content: *containers_conf_content
            - run: write=/etc/containers/policy.json
              write: /etc/containers/policy.json
              run_as: root
              mode: "0644"
              content: &policy_json_content |
                {"default":[{"type":"insecureAcceptAnything"}]}
            - run: write=${HOME}/.config/containers/policy.json
              write: "${HOME}/.config/containers/policy.json"
              run_as: "${USER}"
              mode: "0644"
              content: *policy_json_content
            - run: write=/etc/containers/storage.conf
              write: /etc/containers/storage.conf
              run_as: root
              mode: "0644"
              content: |
                [storage]
                driver = "overlay"
                runroot = "/run/containers/storage"
                graphroot = "/var/lib/containers/storage"

                [storage.options.overlay]
                mount_program = "/usr/bin/fuse-overlayfs"
                mountopt = "nodev,fsync=0"
            - run: write=${HOME}/.config/containers/storage.conf
              write: "${HOME}/.config/containers/storage.conf"
              run_as: "${USER}"
              mode: "0644"
              content: |
                [storage]
                driver = "overlay"
                runroot = "${HOME}/.local/share/containers/run"
                graphroot = "${HOME}/.local/share/containers/storage"

                [storage.options.overlay]
                mount_program = "/usr/bin/fuse-overlayfs"
                mountopt = "nodev,fsync=0"
            - check: the podman container engine is installed for in-container use
              file:
                file: /usr/bin/podman
                exists: true
            - check: the buildah image-build tool is installed
              file:
                file: /usr/bin/buildah
                exists: true
            - check: the skopeo image-copy tool is installed
              file:
                file: /usr/bin/skopeo
                exists: true
            - check: containers.conf pins userns=host so the inner /proc mount is not rejected by the kernel mount_too_revealing check
              exit_status: 0
              command: grep -E '^userns\s*=\s*"host"' /etc/containers/containers.conf
            - check: policy.json is present so podman pull/run accepts an image signature policy
              file:
                file: /etc/containers/policy.json
                exists: true
            - check: newuidmap carries the cap_setuid file capability so a nested user namespace can be delegated
              exit_status: 0
              command: getcap /usr/bin/newuidmap | grep -c cap_setuid
            - check: newuidmap is NOT setuid-root — only the cap_setuid file capability remains; a binary that is BOTH setuid-root (Debian/Ubuntu's uidmap default) AND cap-bearing fails to write uid_map inside a nested rootless user namespace
              id: newuidmap-not-setuid
              exit_status: 0
              command: test ! -u /usr/bin/newuidmap
            - check: /etc/subuid declares the username:start:count delegation ranges the inner podman maps from
              exit_status: 0
              command: grep -cE '^[a-z0-9_-]+:[0-9]+:[0-9]+$' /etc/subuid
            - agent-check: a fresh rootless `podman run` of an inner container succeeds end-to-end with no added capabilities and no --privileged
            - check: command=/usr/bin/podman --version
              id: podman-version
              exit_status: 0
              command: /usr/bin/podman --version
            - check: command=/usr/bin/buildah --version
              id: buildah-version
              exit_status: 0
              command: /usr/bin/buildah --version
            - check: command=/usr/bin/skopeo --version
              id: skopeo-version
              exit_status: 0
              command: /usr/bin/skopeo --version
            - check: file=/usr/bin/newuidmap
              id: newuidmap-binary
              file:
                file: /usr/bin/newuidmap
                exists: true
            - check: file=/usr/bin/newgidmap
              id: newgidmap-binary
              file:
                file: /usr/bin/newgidmap
                exists: true
            - check: file=/usr/bin/tailscale
              id: tailscale-binary
              file:
                file: /usr/bin/tailscale
                exists: true
            - check: command=/usr/bin/tailscale version
              id: tailscale-version
              exit_status: 0
              command: /usr/bin/tailscale version
            - check: the uid-1000 user has exactly two subuid delegation ranges (cross-distro — the user is `user` on fedora/arch but `ubuntu`/`debian` under adopt user-policy, so resolve the name via getent rather than hardcoding `user:`)
              id: subuid-user-two-ranges
              exit_status: 0
              stdout:
                - matches: ^2
              command: 'u=$(getent passwd 1000 | cut -d: -f1); grep -cE "^${u}:[0-9]+:[0-9]+$" /etc/subuid'
            - check: command=grep -E '^userns\s*=\s*"host"' ${HOME}/.config/containers/containers.conf
              id: user-containers-conf-userns-host
              exit_status: 0
              command: grep -E '^userns\s*=\s*"host"' ${HOME}/.config/containers/containers.conf
            - check: command=sh -c 'env | grep -q "^_CONTAINERS_USERNS_CONFIGURED="'
              id: env-containers-userns-configured
              exit_status: 0
              command: sh -c 'env | grep -q "^_CONTAINERS_USERNS_CONFIGURED="'
            - check: command=sh -c 'env | grep -qx "BUILDAH_ISOLATION=chroot"'
              id: env-buildah-isolation
              exit_status: 0
              command: sh -c 'env | grep -qx "BUILDAH_ISOLATION=chroot"'
            - check: command=podman run --rm quay.io/libpod/alpine:latest /bin/true
              id: nested-podman-run
              timeout: 60s
              context:
                - runtime
              command:
                command: podman run --rm quay.io/libpod/alpine:latest /bin/true
                in_container: true

container-nesting-skill:
    skill:
        name: container-nesting
        family: distros
        owner: container-nesting
        description: |-
            Rootless nested podman/buildah/skopeo recipe. Ships zero cap_add — works
            via surgical `unmask=/proc/*` security_opt plus dual-location
            containers.conf/storage.conf/policy.json plus two canonical env vars
            plus subuid layout that fits inside the outer user namespace. Authoritative
            source for the `mount_too_revealing()` kernel RCA.
            Use when working with nested containers, the container-nesting candy,
            or any "rootless-in-rootless podman" question.
        content: |
            # container-nesting -- Rootless nested podman, buildah, skopeo
            
            ## Overview
            
            Adds everything needed to run **rootless** podman/buildah/skopeo **inside
            a rootless outer container** — at the default uid 1000, with zero added
            capabilities, no `--privileged`, no `seccomp=unconfined`, no
            `label=disable`. The recipe is a direct port of `quay.io/podman/stable`'s
            canonical configuration, ported into the charly candy system so any box
            can compose it.
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | `cap_add` | **(none)** |
            | `security_opt` | `unmask=/proc/*` |
            | `devices` | `/dev/fuse`, `/dev/net/tun` |
            | Volumes | `storage` at `/var/lib/containers/storage` (only used by root images) |
            | Env | `CHARLY_BUILD_ENGINE=podman`, `CHARLY_RUN_ENGINE=podman`, `_CONTAINERS_USERNS_CONFIGURED=""`, `BUILDAH_ISOLATION=chroot` |
            
            ## Packages
            
            **RPM:** `buildah`, `fuse-overlayfs`, `shadow-utils`, `skopeo`,
            `tailscale`, `libsecret` (Tailscale from the `tailscale-stable` repo).
            
            **Pacman:** `buildah`, `crun`, `fuse-overlayfs`, `libsecret`, `podman`,
            `shadow`, `skopeo`, `tailscale`.
            
            **Arch must declare `podman` and `crun` explicitly:** the candy's whole
            purpose is **rootless nested podman**, and the `containers.conf` shipped
            by this candy explicitly sets `runtime = "crun"`. RPM users get `podman`
            transitively via the Fedora base image; Arch has no such transitive
            pull, so both `podman` and `crun` are declared explicitly in the `pac:`
            list (declaring `docker` instead, or omitting `crun`, leaves the
            Arch-based box with no `podman` binary in `$PATH`).
            
            ## The kernel-level RCA (why none of the obvious fixes work)
            
            This is the load-bearing section — if you're here because "nested
            podman fails with `crun: mount proc to proc: Operation not permitted`",
            read this before trying anything else.
            
            ### What actually fails
            
            When the inner podman starts a new container (e.g., alpine) inside a
            rootless outer container, `crun` tries to mount a fresh procfs for the
            new container's mount namespace. The call is roughly:
            
            ```c
            mount("proc", "/proc", "proc", MS_NOSUID|MS_NODEV|MS_NOEXEC, NULL);
            ```
            
            The Linux kernel refuses with `EPERM`. Not because of capabilities,
            not because of seccomp, not because of SELinux.
            
            ### Why the kernel refuses
            
            `fs/namespace.c:mount_too_revealing()` is a security check introduced
            to prevent information leakage across user-namespace boundaries. It
            rejects a procfs mount when:
            
            - The calling process is in a **descendant user namespace** of the
              existing procfs's owning user namespace, AND
            - The existing procfs has **submounts** that the new mount would
              expose (the classic example: `/proc/kcore` has been bind-mounted
              over with `/dev/null` to hide kernel memory, and a fresh mount
              would "un-hide" it).
            
            Podman's default rootless outer container generates an OCI spec with
            `linux.maskedPaths` covering:
            
            ```
            /sys/kernel, /proc/acpi, /proc/kcore, /proc/keys,
            /proc/latency_stats, /proc/sched_debug, /proc/scsi,
            /proc/timer_list, /proc/timer_stats,
            /sys/devices/virtual/powercap, /sys/firmware,
            /sys/fs/selinux, /proc/interrupts
            ```
            
            Each of these paths is either bind-mounted over with `/dev/null` or
            mounted as a read-only tmpfs. When the inner container tries to mount
            its own fresh `/proc`, the kernel sees that would reveal those paths
            → `mount_too_revealing` → `EPERM`.
            
            ### Why capability-based fixes don't work
            
            Empirically tested:
            
            | Attempt | Result |
            |---|---|
            | `--cap-add=SYS_ADMIN` | FAIL — caps aren't the issue |
            | `--cap-add=ALL` | FAIL — same |
            | `--cap-add=ALL --security-opt seccomp=unconfined --security-opt label=disable` | FAIL — caps + seccomp + SELinux aren't the issue |
            | `--privileged` | PASS — but only because `--privileged` coincidentally also removes the masked_paths |
            | `--security-opt unmask=/proc/*` | **PASS** — surgical fix, no caps needed |
            
            `unmask=/proc/*` tells podman NOT to emit those `maskedPaths` entries
            for /proc on the outer container. With nothing to mismatch,
            `mount_too_revealing` has nothing to reject. The inner `/proc` mount
            proceeds cleanly.
            
            This candy's `security:` block is `security_opt: [unmask=/proc/*]` +
            `devices: [/dev/fuse, /dev/net/tun]`. No capability added. No seccomp
            touched. No SELinux touched. The surgical minimum.
            
            ### Security trade-off
            
            `unmask=/proc/*` exposes `/proc/kcore` (kernel memory) and
            `/proc/keys` (kernel keyring) on the outer container's filesystem.
            
            Reading those files still requires `CAP_SYS_ADMIN` **in the init user
            namespace** — which a rootless container never has. The actual
            information leak is minimal. Compared to `--privileged` (which
            ALSO removes the masks, plus grants every capability, plus disables
            seccomp, plus passes through every host device, plus disables path
            masking entirely), this is the least-privilege fix available.
            
            ## Subuid / subgid layout (must fit inside the outer namespace)
            
            `charly shell` launches the outer container with `--userns=keep-id:uid=1000,gid=1000`
            (default — the keep-id userns arg is emitted by `candy/plugin-deploy-pod/resolve_f12.go`;
            the `charly shell` command itself is `candy/plugin-pod/command.go`, the former
            `charly/shell.go` is DELETED, K-wave 2). That creates a uid_map inside the
            outer of:
            
            ```
            0    1000    1           # inner uid 0 → host uid 1000
            1    100000  65535       # inner uid 1-65535 → host uid 100000-165534
            ```
            
            So inside the outer, **only inner uids 0-65535 exist**. Subid
            delegation ranges that fall outside this window fail at
            `newuidmap write to uid_map: EPERM`.
            
            The candy emits two non-overlapping ranges for the primary uid-1000
            user, skipping uid 1000 itself (because keep-id already owns it):
            
            ```
            user:1:999
            user:1001:64535
            ```
            
            …plus a full-range entry for root (used by `charly-fedora`/`charly-arch`/
            `githubrunner`, which run as uid 0):
            
            ```
            root:1:65535
            ```
            
            This pattern matches `quay.io/podman/stable`'s `/etc/subuid` layout
            exactly. A range like `524288:65536` would fall outside the outer
            namespace's mapped window and cause an obscure `newuidmap` write
            failure — the delegation ranges MUST fit inside the keep-id window.
            
            The `newuidmap`/`newgidmap` binaries get `cap_setuid=ep` / `cap_setgid=ep`
            file capabilities (via a dedicated task) so any uid invoking them can
            delegate subids.
            
            **The `setcap(8)` binary MUST be installed for that task to do anything.**
            Fedora and Arch ship it transitively (`libcap` is in the base image), but
            Debian/Ubuntu do NOT — so the candy's deb sections declare **`libcap2-bin`**
            explicitly. Without it the `setcap cap_setuid=ep /usr/bin/newuidmap` step exits
            127 (`setcap: command not found`) and, because the step is a bare `RUN`, the
            build hard-fails on the deb path (and any image that did slip through would ship
            a capability-less `newuidmap`, so nested podman dies at runtime with
            `newuidmap: open of uid_map failed: Permission denied`). RDD-confirmed
            This is the one non-format-agnostic deb dependency — every other
            piece of the recipe is shared.
            
            ## Config files — written to both system-wide and user locations
            
            Rootless podman **prefers `~/.config/containers/*` over `/etc/containers/*`**.
            Writing only the system-wide location is a no-op for the desktop user.
            This candy writes every config to both locations.
            
            ### `containers.conf`
            
            Identical at `/etc/containers/containers.conf` and `~/.config/containers/containers.conf`:
            
            ```ini
            [containers]
            cgroups = "disabled"
            cgroupns = "host"
            ipcns = "host"
            netns = "host"
            userns = "host"
            utsns = "host"
            log_driver = "k8s-file"
            
            [engine]
            cgroup_manager = "cgroupfs"
            events_logger = "file"
            runtime = "crun"
            ```
            
            Why each setting:
            
            - `cgroups = "disabled"` — rootless cgroupv2 delegation isn't
              guaranteed at nesting depth 2+; disabling avoids "cannot set up
              cgroup" errors.
            - `cgroup_manager = "cgroupfs"` — systemd cgroup delegation likewise
              not guaranteed.
            - `netns = "host"` — pasta (rootless networking) needs
              `/proc/sys/net/ipv4/ping_group_range` writable, which is
              read-only in a rootless outer. `netns=host` makes the inner reuse
              the outer's netns, bypassing the need.
            - `userns = "host"` — required by the `mount_too_revealing` analysis
              above. Without it, the inner podman creates a descendant userns and
              hits the kernel check on every `/proc` mount.
            - `ipcns`, `utsns`, `cgroupns = "host"` — match the canonical
              `quay.io/podman/stable` config; prevents a cascade of namespace
              permission errors observed when only some are set.
            
            ### `storage.conf`
            
            System-wide (for root images) at `/etc/containers/storage.conf`:
            
            ```ini
            [storage]
            driver = "overlay"
            runroot = "/run/containers/storage"
            graphroot = "/var/lib/containers/storage"
            
            [storage.options.overlay]
            mount_program = "/usr/bin/fuse-overlayfs"
            mountopt = "nodev,fsync=0"
            ```
            
            User-level (for uid-1000 images) at `~/.config/containers/storage.conf` —
            **different graphroot** so it's user-writable:
            
            ```ini
            [storage]
            driver = "overlay"
            runroot = "${HOME}/.local/share/containers/run"
            graphroot = "${HOME}/.local/share/containers/storage"
            
            [storage.options.overlay]
            mount_program = "/usr/bin/fuse-overlayfs"
            mountopt = "nodev,fsync=0"
            ```
            
            `mount_program = "/usr/bin/fuse-overlayfs"` is the critical line —
            the kernel overlay driver can't mount from a rootless outer (no
            `CAP_SYS_ADMIN` in init userns); `fuse-overlayfs` can.
            
            If the user-level file is missing, rootless podman uses the system
            default, which points at `/var/lib/containers/storage` — unwritable by
            uid 1000 → `mkdir graphroot: permission denied` on first `podman run`.
            
            ### `policy.json`
            
            Same content at both `/etc/containers/policy.json` and
            `~/.config/containers/policy.json`:
            
            ```json
            {"default":[{"type":"insecureAcceptAnything"}]}
            ```
            
            Without this, `podman pull` fails with `no policy.json file found`.
            
            ## Env vars — the two hidden contracts
            
            | Env var | Value | Role |
            |---|---|---|
            | `_CONTAINERS_USERNS_CONFIGURED` | `""` (empty string, SET not UNSET) | Tells the inner podman "you're already inside a rootless user namespace". Without this, the inner re-execs itself via `newuidmap` to create a new descendant user namespace — defeating `userns=host` in containers.conf and re-triggering `mount_too_revealing`. |
            | `BUILDAH_ISOLATION` | `chroot` | Tells buildah RUN steps to use chroot isolation instead of the OCI runtime. Without this, nested `podman build` falls back to OCI isolation which creates a descendant user namespace and hits the same kernel check. |
            
            Both are baked into the candy's `env:` section so they land in the
            OCI env of any box composing this candy.
            
            ## Box-level compatibility (union semantics)
            
            `sdk/deploykit/security.go` (`SecurityArgs`'s merge, via `AppendUnique`) **unions**
            box-level `CapAdd`, `SecurityOpt`,
            `Devices` onto the candy-level merged set. Box
            values can only ADD, never strip.
            
            Consequence: boxes that want the old full-hammer posture
            (`charly-fedora`, `charly-arch`, `githubrunner`) must assert it at the box
            level, not expect this candy to donate it. Their `charly.yml` entries
            carry:
            
            ```yaml
            security:
              cap_add: [ALL]
              security_opt:
                - label=disable
                - seccomp=unconfined
            ```
            
            The resolved OCI label then unions to
            `cap_add:[ALL] + security_opt:[unmask=/proc/*, label=disable, seccomp=unconfined]`,
            which matches their historical posture.
            
            Rootless boxes like `/charly-openclaw:openclaw-desktop` don't add a
            box-level `security:` block, so the resolved posture stays at
            `security_opt:[unmask=/proc/*]` only — zero capability escalation.
            
            ## Cross-distro coverage
            
            `rpm:` (Fedora), `pac:` (Arch), plus per-distro deb sections (`debian:` / `debian-13:` / `ubuntu:` / `ubuntu-24.04:`) over the shared deb package set (`podman`, `buildah`, `skopeo`, `fuse-overlayfs`, `crun`, `uidmap`, `passwd`, `libsecret-1-0`, plus **`libcap2-bin`** — the `setcap` provider, see the subuid/subgid section above). The version-specific `debian-13:` / `ubuntu-24.04:` sections additionally declare the Tailscale apt repo (`https://pkgs.tailscale.com/stable/debian` or `.../ubuntu`) with signed-by key for the `tailscale` package. Drops on deb: none at the nesting recipe level — all the critical pieces (containers.conf, storage.conf, subuid layout, `_CONTAINERS_USERNS_CONFIGURED=""` env) are format-agnostic task content; the sole deb-only addition is `libcap2-bin`.
            
            ## Usage — rootless image (uid 1000)
            
            ```yaml
            # charly.yml
            openclaw-desktop:
              base: cachyos.cachyos
              candy:
                - '@github.com/opencharly/pod-selkies-desktop:v2026.237.937'
                - '@github.com/opencharly/layer-openclaw-full:v2026.237.937'
                - '@github.com/opencharly/pod-ollama:v2026.237.457'
                - charly
                - container-nesting   # donates unmask + devices + config + env
                - ...
              # NO uid/gid/user/network override
            ```
            
            ## Usage — root image (uid 0)
            
            ```yaml
            # charly.yml
            charly-fedora:
              base: fedora
              uid: 0
              gid: 0
              user: root
              network: host
              security:
                cap_add: [ALL]
                security_opt:
                  - label=disable
                  - seccomp=unconfined
              candy:
                - charly
                - '@github.com/opencharly/layer-container-nesting:v2026.237.938'
                - ...
            ```
            
            Both paths work; they just resolve to different OCI security labels.
            
            ## Verification
            
            ```bash
            # Rootless posture on openclaw-desktop
            charly box inspect openclaw-desktop | jq '.HostConfig? // .Config.Labels."ai.opencharly.security"'
            # → cap_add:[], security_opt:[unmask=/proc/*], devices:[/dev/fuse,/dev/net/tun]
            
            # Nested podman smoke (inside the running container)
            charly shell openclaw-desktop -c 'podman run --rm quay.io/libpod/alpine:latest true'
            # → exit 0, NO "mount proc to proc: Operation not permitted"
            
            # Diagnostic: inspect the OCI spec generated for a nested container
            charly shell openclaw-desktop -c '
              podman create --name t quay.io/libpod/alpine:latest /bin/true >/dev/null
              sf=$(find ~/.local/share/containers -name config.json -path "*/userdata/*" | head -1)
              jq ".linux.maskedPaths" "$sf"'
            # → empty list or no /proc entries = unmask worked
            ```
            
            If `mount proc to proc: EPERM` still happens after a rebuild, check in
            this order:
            
            1. `env | grep _CONTAINERS_USERNS_CONFIGURED` — must print one line with empty value (SET, not UNSET).
            2. `grep '^userns' /etc/containers/containers.conf ~/.config/containers/containers.conf` — both must say `host`.
            3. `cat /etc/subuid` — must show the 1:999 + 1001:64535 pattern for the primary user.
            4. `podman inspect <outer-container> --format '{{.HostConfig.SecurityOpt}}'` — must include `unmask=/proc/*`.
            

direnv:
    candy:
        version: 2026.168.0935
        description: |
            direnv — automatic per-directory environment loading from .envrc files
            direnv installs the `direnv` binary (one package name across
            fedora/arch/debian) AND declaratively wires the per-shell hook that
            makes .envrc autoload work. At `charly box build` the shell: schema
            bakes the POSIX hook into /etc/profile.d/charly-direnv-<shell>.sh for
            bash/zsh/sh (the generic body `eval "$(direnv hook <shell>)"` with
            ${SHELL_NAME} substituted) and the fish-specific hook into
            /etc/fish/conf.d/charly-direnv.fish (`direnv hook fish | source`).
            The scenarios assert both the installed/runnable binary AND the baked
            hook drop-ins, so they fail if either the package or the shell wiring
            is missing.
        package:
            - direnv
        # Shell hooks installed declaratively via the shell: schema (2026-05).
        # bash/zsh/sh use the POSIX-style hook `eval "$(direnv hook X)"` — handled
        # by the generic body with ${SHELL_NAME} substituted at install time.
        # fish uses different syntax, so it gets a per-shell override.
        shell:
            init: |
                eval "$(direnv hook ${SHELL_NAME})"
            fish:
                init: |
                    direnv hook fish | source
        plan:
            - check: the direnv binary is installed at /usr/bin/direnv for the .envrc/.secrets autoload workflow
              file:
                file: /usr/bin/direnv
                exists: true
            - check: direnv reports its version without error
              exit_status: 0
              command: /usr/bin/direnv version
            - check: the bash shell-init drop-in EVALs the direnv hook so .envrc loads on directory change (a check-for-eval typo would silently break the hook and spam every login shell with a command-not-found error)
              file:
                file: /etc/profile.d/charly-direnv-bash.sh
                exists: true
                contains:
                    - 'eval "$(direnv hook bash)"'
            - check: sourcing the bash direnv drop-in installs the hook cleanly, with no command-not-found error from a malformed check-for-eval hook body
              id: direnv-hook-sources-clean
              stdout:
                - equals: "0"
              command: bash -c '. /etc/profile.d/charly-direnv-bash.sh 2>&1' | grep -c 'command not found' || true
            - check: the fish shell-init drop-in is baked into its conf.d and sources the direnv fish hook
              file:
                file: /etc/fish/conf.d/charly-direnv.fish
                exists: true
                contains:
                    - "direnv hook fish"
            - check: package=direnv
              id: direnv-package
              package:
                package: direnv
                installed: true
            - check: command=/usr/bin/direnv version
              id: direnv-version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: /usr/bin/direnv version

direnv-skill:
    skill:
        name: direnv
        family: coder
        owner: direnv
        description: |-
            direnv -- automatic environment variable loading from .envrc files.
            Use when working with direnv, .envrc, .secrets, or environment management.
        content: |-
            # direnv -- Automatic environment variable loading
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (packages only) |
            
            ## Packages
            
            RPM: `direnv` · PAC: `direnv` · DEB: `direnv` — full cross-distro parity.
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - direnv
            ```
            
            Typically used as part of the `agent-forwarding` composition candy rather than directly. Also available in the heavyweight `dev-tools` candy.
            
            ## Runtime Behavior
            
            Provides the `direnv` binary AND the per-shell hook installation for automatic environment variable loading from `.envrc` files.
            
            **Shell hooks are declarative.** The candy carries a `shell:` block:
            
            ```yaml
            shell:
              init: |
                eval "$(direnv hook ${SHELL_NAME})"   # bash/zsh/sh — POSIX-style
              fish:
                init: |
                  direnv hook fish | source            # fish — different syntax
            ```
            
            Container images get `/etc/profile.d/charly-direnv-<shell>.sh` and `/etc/fish/conf.d/charly-direnv.fish` emitted at `charly box build` time. `target: local` host deploys get a managed-block in `~/.bashrc` / `~/.zshrc` plus `~/.config/fish/conf.d/charly-direnv.fish` at `charly fleet add` time, only for shells the runtime probe finds. The fish hook lands in `~/.config/fish/conf.d/charly-direnv.fish` (its own conf.d drop-in), so it works without editing `~/.config/fish/config.fish`.
            
            The primary use case in OpenCharly is the `.secrets` workflow: `.envrc` calls `eval "$(charly secrets gpg env)"` which decrypts a GPG-encrypted `.secrets` file in memory and exports the variables — no plaintext on disk. No external `direnvrc` dependency needed.
            
            ## Used In Boxes
            
            Part of `agent-forwarding` composition candy, used in application boxes.
            
            Also available in the `dev-tools` candy.
            
            ## Related Candies
            
            - `/charly-distros:agent-forwarding` -- metalayer that includes gnupg + direnv + ssh-client
            - `/charly-infrastructure:gnupg` -- GPG tools (needed for `.secrets` decryption)
            - `/charly-coder:dev-tools` -- heavyweight candy that also includes direnv
            
            ## Cross-References
            
            - `/charly-build:secrets` -- `charly secrets gpg` commands for managing `.secrets` files, `charly secrets gpg setup` for GPG agent + KeePassXC configuration, `charly secrets gpg doctor` for health checks
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - direnv or `.envrc` files
            - The `direnv` candy
            - Automatic environment variable loading
            - The `.secrets` + direnv workflow
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

docker-ce:
    candy:
        version: 2026.144.1443
        description: |
            Docker CE engine, containerd runtime, and the buildx/compose plugins
            The docker-ce candy installs the upstream Docker Community Edition stack -
            the docker CLI + dockerd engine, the containerd runtime, and the buildx and
            compose plugins - from Docker's own repositories (the docker metapackage on
            Arch). It also queues the iptable_nat kernel module for load at boot so the
            docker bridge network can NAT. Every artifact is a fixed on-disk path or a
            CLI that reports its version, so the install is directly verifiable.
        distro:
            arch:
                package:
                    - containerd
                    - docker
                    - docker-buildx
                    - docker-compose
            debian-13:
                package:
                    - containerd.io
                    - docker-buildx-plugin
                    - docker-ce
                    - docker-ce-cli
                    - docker-compose-plugin
                repo:
                    - name: docker-ce-debian
                      url: "https://download.docker.com/linux/debian"
                      key: "https://download.docker.com/linux/debian/gpg"
                      suite: trixie
                      components: stable
            fedora:
                package:
                    - containerd.io
                    - docker-buildx-plugin
                    - docker-ce
                    - docker-ce-cli
                    - docker-compose-plugin
                repo:
                    - name: docker-ce-stable
                      url: "https://download.docker.com/linux/fedora/docker-ce.repo"
            ubuntu-24.04:
                package:
                    - containerd.io
                    - docker-buildx-plugin
                    - docker-ce
                    - docker-ce-cli
                    - docker-compose-plugin
                repo:
                    - name: docker-ce-ubuntu
                      url: "https://download.docker.com/linux/ubuntu"
                      key: "https://download.docker.com/linux/ubuntu/gpg"
                      suite: noble
                      components: stable
        plan:
            - run: command=mkdir -p /etc/modules-load.d && echo "iptable_nat" >> /etc/modules-load.d/ip_tables.conf
              run_as: root
              command: mkdir -p /etc/modules-load.d && echo "iptable_nat" >> /etc/modules-load.d/ip_tables.conf
            - check: the docker CLI binary is installed at /usr/bin/docker
              file:
                file: /usr/bin/docker
                exists: true
            - check: the docker CLI reports its version and exits cleanly
              exit_status: 0
              command: /usr/bin/docker --version
            - check: the containerd runtime binary is installed at /usr/bin/containerd
              file:
                file: /usr/bin/containerd
                exists: true
            - check: the containerd runtime reports its version and exits cleanly
              exit_status: 0
              command: /usr/bin/containerd --version
            - check: the docker compose plugin is wired into the docker CLI
              exit_status: 0
              command: /usr/bin/docker compose version
            - check: the iptable_nat module is queued for load at boot so the docker bridge can NAT
              file:
                file: /etc/modules-load.d/ip_tables.conf
                contains: iptable_nat
            - check: package=docker-ce
              id: docker-ce-package
              package:
                package: docker-ce
                package_map:
                    arch: docker
                    fedora: docker-ce
                installed: true
            - check: package=containerd.io
              id: containerd-package
              package:
                package: containerd.io
                package_map:
                    arch: containerd
                    fedora: containerd.io
                installed: true

docker-ce-skill:
    skill:
        name: docker-ce
        family: coder
        owner: docker-ce
        description: |-
            Docker CE engine with buildx and compose plugins from the official Docker repository.
            Use when working with Docker, container builds, or Docker Compose.
        content: |-
            # docker-ce -- Docker CE engine and plugins
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `task:` |
            
            ## Packages
            
            RPM (from `docker-ce-stable` repo): `containerd.io`, `docker-buildx-plugin`, `docker-ce`, `docker-ce-cli`, `docker-compose-plugin`
            
            ## Cross-distro coverage
            
            `rpm:` (Fedora — Docker's yum repo), `pac:` (Arch — `docker` metapackage from `extra`), `deb:` — via distro-version tag sections `debian:13:` and `ubuntu:24.04:` because the upstream apt repo URL differs per distro codename (`https://download.docker.com/linux/debian trixie` vs `.../ubuntu noble`). Each tag section declares its own `repos:` block with the correct URL + GPG key; packages (`docker-ce`, `docker-ce-cli`, `containerd.io`, `docker-buildx-plugin`, `docker-compose-plugin`) are identical. See `/charly-image:layer` "distro-version tag sections".
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - docker-ce
            ```
            
            ## Used In Boxes
            
            - (none currently enabled)
            
            ## Related Candies
            - `/charly-distros:container-nesting` — Alternative podman-based nested container support
            - `/charly-coder:kubernetes-layer` — Sibling kubectl/Helm commonly paired with docker-ce
            - `/charly-coder:github-actions` — Sibling candy needing a container engine for act runs
            
            ## Related Commands
            - `/charly-build:build` — Build the bootc image including docker-ce packages
            - `/charly-vm:vm` — Run the bootc image as a VM to test the docker engine
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Docker CE inside containers
            - Docker buildx or compose plugins
            - The `docker-ce` candy or Docker repository setup
            
            ## Related
            
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

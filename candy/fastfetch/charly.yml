fastfetch:
    candy:
        version: 2026.144.1443
        description: |
            Fast system-information report (neofetch successor) covering OS, kernel, CPU, and memory
            Installs the fastfetch package on arch and fedora, landing the
            /usr/bin/fastfetch binary. fastfetch prints a system-information
            report (OS, kernel, host, CPU, GPU, memory) beside an ASCII distro
            logo and exposes a --version flag, so both its presence and its
            runtime behaviour are verifiable inside a disposable container.
        distro:
            arch:
                package:
                    - fastfetch
            fedora:
                package:
                    - fastfetch
        plan:
            - check: the fastfetch binary is installed at /usr/bin/fastfetch
              file:
                file: /usr/bin/fastfetch
                exists: true
            - check: fastfetch --version prints a version banner and exits 0
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: /usr/bin/fastfetch --version 2>&1
            - check: running fastfetch in pipe mode prints a system-information report and exits 0
              exit_status: 0
              command: /usr/bin/fastfetch --pipe --logo none 2>&1
            - agent-check: the report is human-readable, grouping system facts (OS, kernel, CPU, memory) into labelled lines
            - check: package=fastfetch
              id: fastfetch-package
              package:
                package: fastfetch
                installed: true

fastfetch-skill:
    skill:
        name: fastfetch
        family: selkies
        owner: fastfetch
        description: |-
            Fast system information tool (neofetch successor).
            Use when working with the fastfetch candy.
        content: |-
            # fastfetch -- Fast system information tool
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (packages only) |
            | Depends | none |
            
            ## Packages
            
            RPM: `fastfetch`
            
            ## What It Does
            
            Displays system information (OS, kernel, CPU, GPU, memory, etc.) with ASCII art logo. Active successor to the archived neofetch project. Useful for verifying container environment and creating visual demos.
            
            ## Usage
            
            ```yaml
            # a box composing this candy — the candy list is inline
            my-box:
              candy:
                base: fedora
                candy: [fastfetch]
            ```
            
            ## Included In
            
            - `sway-desktop` metalayer (and all sway-desktop-* variants)
            - `selkies-desktop` metalayer (and all selkies-desktop-* variants)
            
            ## Used In Boxes
            
            - `/charly-selkies:sway-browser-vnc` (via `sway-desktop` metalayer)
            - `/charly-selkies:selkies-labwc` (via `selkies-desktop` metalayer)
            - `/charly-selkies:selkies-labwc-nvidia` (via `selkies-desktop` metalayer)
            
            ## Related Candies
            - `/charly-selkies:sway-desktop` — Metalayer that pulls fastfetch in
            - `/charly-selkies:selkies-desktop-layer` — Metalayer that pulls fastfetch in
            - `/charly-coder:dev-tools` — Sibling that also packages fastfetch via dnf
            
            ## Related Commands
            - `/charly-build:build` — Builds the fastfetch RPM into the box
            - `/charly-core:shell` — Interactive shell to run `fastfetch` for environment verification
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - System information display in containers
            - fastfetch or neofetch in containers
            - The `fastfetch` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, `run:`/`check:` step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

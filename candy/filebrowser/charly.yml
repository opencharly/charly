filebrowser:
    candy:
        version: 2026.162.1430
        description: |
            Browser-based file manager (FileBrowser Quantum) served over HTTP on port 8080
            Downloads the gtsteffaniak/filebrowser ${FILEBROWSER_VERSION} static
            binary to /usr/local/bin/filebrowser (0755), writes its server config
            to /etc/filebrowser/config.yaml (listen port 8080, SQLite database + a
            "Files" source under ~/.filebrowser/files), and runs it as the
            always-restart `filebrowser` service under the init system. The data
            and files volumes persist the database and the user-browsable tree.
            Every fact below is observable: the installed binary, the config
            contents, the running service, and the HTTP 200 the web UI returns.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
        env:
            FILEBROWSER_CONFIG: "/etc/filebrowser/config.yaml"
        port:
            - 8080
        volume:
            - name: data
              path: "~/.filebrowser/data"
            - name: files
              path: "~/.filebrowser/files"
        alias:
            - name: filebrowser
              command: filebrowser
        var:
            FILEBROWSER_VERSION: v1.2.4-stable
        service:
            - name: filebrowser
              exec: /usr/local/bin/filebrowser
              env:
                FILEBROWSER_CONFIG: /etc/filebrowser/config.yaml
              restart: always
              enable: true
              scope: system
        plan:
            - run: download=https://github.com/gtsteffaniak/filebrowser/releases/download/${FILEBROWSER_VERSION}/linux-${ARCH}-filebrowser
              download: "https://github.com/gtsteffaniak/filebrowser/releases/download/${FILEBROWSER_VERSION}/linux-${ARCH}-filebrowser"
              extract: none
              to: /usr/local/bin/filebrowser
              mode: "0755"
              run_as: root
            - run: mkdir=/etc/filebrowser
              mkdir: /etc/filebrowser
              run_as: root
            - run: copy=config.yaml
              copy: config.yaml
              to: /etc/filebrowser/config.yaml
              mode: "0644"
              run_as: root
            - check: the filebrowser binary is installed and executable at /usr/local/bin/filebrowser
              file:
                file: /usr/local/bin/filebrowser
                exists: true
                mode: "0755"
            - check: the server config is present at /etc/filebrowser/config.yaml
              file:
                file: /etc/filebrowser/config.yaml
                exists: true
            - check: the config declares the listen port 8080
              file:
                file: /etc/filebrowser/config.yaml
                contains:
                    - matches: "port: 8080"
            - check: the filebrowser service is running under the init system
              context:
                - runtime
              service:
                service: filebrowser
                running: true
            - check: the web UI answers HTTP 200 on the published port
              timeout: 5s
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/
                status: 200
            - check: addr=127.0.0.1:${HOST_PORT:8080}
              id: filebrowser-port
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:8080}
                reachable: true
            - check: file=${VOLUME_CONTAINER_PATH:data}
              id: filebrowser-volumes-exist
              context:
                - runtime
              file:
                file: ${VOLUME_CONTAINER_PATH:data}
                filetype: directory

filebrowser-skill:
    skill:
        name: filebrowser
        family: filebrowser
        owner: filebrowser
        description: |-
            FileBrowser Quantum web file manager with Tailscale tunnel.
            MUST be invoked before building, deploying, configuring, or troubleshooting the filebrowser box.
        content: |-
            # filebrowser
            
            Web file manager accessible via Tailscale private tunnel.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | fedora |
            | Candies | agent-forwarding, filebrowser, dbus, charly |
            | Platforms | linux/amd64 |
            | Ports | 8085:8080 |
            | Tunnel | tailscale (private: all) |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `fedora` (base)
            2. `pixi` -> `python` -> `supervisord` (transitive)
            3. `agent-forwarding` -- SSH/GPG agent forwarding
            4. `filebrowser` -- web file manager, data + files volumes
            5. `dbus` -- D-Bus session bus
            6. `charly` -- charly CLI inside container
            
            ## Ports
            
            | Port | Service | Protocol |
            |------|---------|----------|
            | 8085 (host) -> 8080 (container) | FileBrowser | HTTP |
            
            ## Volumes
            
            | Name | Path | Purpose |
            |------|------|---------|
            | data | ~/.filebrowser/data | Database (SQLite) and cache |
            | files | ~/.filebrowser/files | User-accessible files (bind-mount target) |
            
            ## Quick Start
            
            ```bash
            charly box build filebrowser
            charly config filebrowser --bind files=~/Documents
            charly start filebrowser
            # Access at http://localhost:8085
            # Tailscale: https://<hostname>:8085
            # Default login: admin / admin
            ```
            
            ## Bind Mount Examples
            
            ```bash
            # Browse home directory
            charly config filebrowser --bind files=~/
            
            # Browse NAS mount
            charly config filebrowser --bind files=/mnt/nas/shared
            
            # Browse specific project
            charly config filebrowser --bind files=~/projects
            ```
            
            ## Host Alias
            
            ```bash
            charly alias install filebrowser
            # Now: filebrowser  (runs inside the container)
            ```
            
            ## Key Candies
            
            - `/charly-filebrowser:filebrowser` -- FileBrowser Quantum service, config, volumes
            - `/charly-distros:agent-forwarding` -- SSH/GPG agent forwarding
            - `/charly-infrastructure:dbus-layer` -- D-Bus session bus
            - `/charly-tools:charly` -- charly CLI for in-container management
            
            ## Related Boxes
            
            - `/charly-distros:fedora` -- parent base image
            - `/charly-ollama:ollama` -- similar simple service pattern
            
            ## Verification
            
            After `charly start`:
            - `charly status filebrowser` -- container running
            - `curl -s http://localhost:8085` -- web UI responds (HTTP 200)
            - `curl -s http://localhost:8085/health` -- `{"message":"ok"}`
            - Tailscale: `https://<hostname>:8085` from any tailnet device
            
            ## Test Coverage
            
            Latest `charly check live filebrowser` run: **24 passed, 0 failed, 0 skipped**.
            All scenario steps embedded in the `ai.opencharly.description` OCI label, covering
            agent-forwarding prerequisites (gpg, ssh, direnv binaries), supervisord
            + dbus daemon + charly binary presence, filebrowser binary + config, and
            `context: [deploy]` steps: service up, port reachable on `127.0.0.1:${HOST_PORT:8080}`,
            HTTP 200 on `/`, data volume mounted.
            
            See `/charly-check:check` for the framework and author-facing gotchas.
            
            ## Related Skills
            
            - `/charly-filebrowser:filebrowser` — candy authoring
            - `/charly-check:check` — declarative testing framework
            - `/charly-core:charly-config` — deploy-mode setup with volume backing and tunnels
            - `/charly-build:build` — LABELs-at-end cache efficiency
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the filebrowser box, web file management deployment, or the FileBrowser Quantum service. Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)

gifgrep:
    candy:
        version: 2026.144.1443
        description: |
            GIF search and download CLI installed from source via go install
            Installs the gifgrep Kong-based CLI (github.com/steipete/gifgrep)
            with `go install`, landing the binary at ${HOME}/go/bin/gifgrep
            (GOPATH=~/go, with ~/go/bin appended to PATH). The install is
            verifiable without the network: the binary is present and
            executable, and `gifgrep --help` runs (exit 0) and prints its Kong
            usage banner listing the search/tui/still/sheet subcommands.
        require:
            - golang
        env:
            GOPATH: "~/go"
        path_append:
            - "~/go/bin"
        plan:
            - run: |
                command=go install github.com/steipete/gifgrep/cmd/gifgrep@latest
                go clean -cache
              run_as: "${USER}"
              command: |
                go install github.com/steipete/gifgrep/cmd/gifgrep@latest
                go clean -cache
            - check: the gifgrep binary is installed at ~/go/bin/gifgrep
              file:
                file: ${HOME}/go/bin/gifgrep
                exists: true
            - check: running gifgrep --help exits 0 and prints the Kong usage banner
              exit_status: 0
              stdout:
                - contains: "Usage:"
              command: "${HOME}/go/bin/gifgrep --help 2>&1"
            - check: command=test -x ${HOME}/go/bin/gifgrep
              id: gifgrep-binary-executable
              exit_status: 0
              command: "test -x ${HOME}/go/bin/gifgrep"

gifgrep-skill:
    skill:
        name: gifgrep
        family: tools
        owner: gifgrep
        description: |-
            GIF search and download CLI.
            Use when working with the gifgrep candy.
        content: |
            # gifgrep -- GIF search and download
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (`run:` step) |
            | Depends | `golang` |
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `GOPATH` | `~/go` |
            | PATH append | `~/go/bin` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [gifgrep]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:golang` — required Go toolchain dependency
            - `/charly-openclaw:openclaw-full` — metalayer that includes gifgrep
            - `/charly-tools:goplaces` — sibling Go-based CLI in openclaw-full
            
            ## Related Commands
            - `/charly-build:build` — compiles gifgrep via the Go builder during image build
            - `/charly-core:shell` — run gifgrep interactively inside a container
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - GIF search and download tools
            - Go-based GIF CLI
            - The `gifgrep` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)

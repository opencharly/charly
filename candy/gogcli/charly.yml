gogcli:
    candy:
        version: 2026.144.1443
        description: |
            Installs the gog Google Workspace CLI (Gmail, Calendar, Drive, Contacts, Sheets, Docs) into the user's Go bin
            gogcli builds the upstream `gog` binary from
            github.com/steipete/gogcli via `go install`, landing it at
            ~/go/bin/gog (placed on PATH by path_append). `gog` is a single
            static Go binary that exposes the Google Workspace APIs as
            subcommands (gmail, calendar, drive, ...). `gog --version` and
            `gog --help` run locally with no OAuth or network, so the install
            is verifiable at build scope; live Workspace access additionally
            needs OAuth credentials provisioned at deploy time.
        require:
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
        env:
            GOPATH: "~/go"
        path_append:
            - "~/go/bin"
        plan:
            - run: |
                command=go install github.com/steipete/gogcli/cmd/gog@latest
                go clean -cache
              run_as: "${USER}"
              command: |
                go install github.com/steipete/gogcli/cmd/gog@latest
                go clean -cache
            - check: the gog binary is installed at ~/go/bin/gog
              file:
                file: ${HOME}/go/bin/gog
                exists: true
            - check: running `gog --version` exits 0, proving the built binary actually runs
              exit_status: 0
              command: ${HOME}/go/bin/gog --version
            - check: '`gog --help` lists the Google Workspace subcommands (gmail, calendar)'
              exit_status: 0
              stdout:
                - contains: gmail
                - contains: calendar
              command: ${HOME}/go/bin/gog --help 2>&1
            - agent-check: once OAuth credentials are provisioned, gog authenticates and lists the user's Gmail messages

gogcli-skill:
    skill:
        name: gogcli
        family: tools
        owner: gogcli
        description: |-
            Google Workspace CLI (Gmail, Calendar, Drive, Contacts, Sheets, Docs).
            Use when working with the gogcli candy.
        content: |
            # gogcli -- Google Workspace CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (`run:` step) |
            | Depends | `golang` |
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `GOPATH` | `~/go` |
            | PATH append | `~/go/bin` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [gogcli]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:golang` — required Go toolchain dependency
            - `/charly-openclaw:openclaw-full` — metalayer that includes gogcli
            - `/charly-tools:goplaces` — sibling Google API CLI in openclaw-full
            
            ## Related Commands
            - `/charly-build:secrets` — provision Google OAuth credentials for gogcli
            - `/charly-core:shell` — run gogcli interactively inside a container
            - `/charly-build:build` — compiles gogcli via the Go builder during image build
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Google Workspace CLI access (Gmail, Calendar, Drive, Contacts, Sheets, Docs)
            - Google API tools in containers
            - The `gogcli` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

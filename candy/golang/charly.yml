golang:
    candy:
        version: 2026.144.1443
        description: |
            Go programming language compiler — the `go` toolchain on $PATH
            Installs the Go compiler/toolchain from each distro's package repo
            (arch `go`, debian/ubuntu `golang-go`, fedora `golang-bin`), landing
            the `go` driver binary at /usr/bin/go. Verifiable end to end: the
            binary exists, `go version` reports a Go toolchain version, and the
            toolchain actually compiles and runs a standalone Go program.
        distro:
            arch:
                package:
                    - go
            debian:
                package:
                    - golang-go
            fedora:
                package:
                    - golang-bin
            ubuntu:
                package:
                    - golang-go
        plan:
            - check: the go compiler binary is installed at /usr/bin/go
              file:
                file: /usr/bin/go
                exists: true
            - check: running `go version` succeeds and prints a Go toolchain version
              exit_status: 0
              stdout:
                - matches: "go version go[0-9]"
              command: /usr/bin/go version
            - check: the toolchain compiles and runs a standalone Go program and prints its output
              exit_status: 0
              stdout:
                - contains: charly-go-build-ok
              command: |
                set -e
                d=$(mktemp -d)
                printf 'package main\nimport "fmt"\nfunc main() { fmt.Println("charly-go-build-ok") }\n' > "$d/main.go"
                cd "$d"
                export HOME="$d" GOCACHE="$d/.gocache" GOPATH="$d/.gopath" GOFLAGS=-mod=mod
                /usr/bin/go mod init charlygotest >/dev/null 2>&1 || true
                /usr/bin/go run main.go
            - check: package=go
              id: go-package
              package:
                package: go
                package_map:
                    arch: go
                    debian: golang-go
                    ubuntu: golang-go
                    fedora: golang-bin
                installed: true

golang-skill:
    skill:
        name: golang
        family: coder
        owner: golang
        description: |-
            Go programming language compiler via RPM package.
            Use when working with Go development or Go builds.
        content: |-
            # golang -- Go compiler
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (packages only) |
            
            ## Packages
            
            RPM: `golang-bin` · PAC: `go` · DEB: `golang-go` — full cross-distro parity.
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - golang
            ```
            
            ## Used In Boxes
            
            - (none currently enabled)
            
            ## Related Skills
            
            - `/charly-coder:language-runtimes` -- also includes `golang-bin` alongside other runtimes
            - `/charly-coder:rust`, `/charly-coder:nodejs` — sibling language runtimes
            - `/charly-coder:build-toolchain` — C/C++ toolchain often paired with Go builds
            - `/charly-distros:github-runner` — consumes go for Actions workflows
            - `/charly-image:layer` — candy authoring
            - `/charly-internals:go` — charly CLI is itself built from Go — development conventions
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Go compiler in containers
            - Go development environment
            - The `golang` candy
            
            ## Related
            
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

google-cloud-npm:
    candy:
        version: 2026.144.1443
        description: |
            Installs the Firebase CLI globally via npm so `firebase` is on PATH.
            The candy depends on google-cloud + nodejs and ships a package.json
            pinning firebase-tools, which the build installs globally under
            NPM_CONFIG_PREFIX (~/.npm-global). The result is verifiable: the
            firebase binary lands in ~/.npm-global/bin, the firebase-tools package
            is unpacked under ~/.npm-global/lib/node_modules, and firebase --version
            exits cleanly and prints a semantic version. The Gemini CLI is provided
            by the `gemini` candy (which pins @google/gemini-cli) — this candy
            requires it rather than re-installing gemini at an unpinned version,
            so a composing box that also composes `gemini` never has its pinned
            version overwritten by a `*` install.
        require:
            - google-cloud
            - nodejs
            - gemini
        plan:
            - check: the firebase binary is installed into the npm global bin directory
              file:
                file: ${HOME}/.npm-global/bin/firebase
                exists: true
            - check: the firebase-tools package is unpacked under the npm global lib directory
              file:
                file: ${HOME}/.npm-global/lib/node_modules/firebase-tools/package.json
                exists: true
            - check: running firebase --version exits cleanly and prints a semantic version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: ${HOME}/.npm-global/bin/firebase --version

google-cloud-npm-skill:
    skill:
        name: google-cloud-npm
        family: coder
        owner: google-cloud-npm
        description: |-
            Google Cloud npm packages: firebase-tools and Gemini CLI.
            Use when working with Firebase, Gemini CLI, or GCP Node.js tooling.
        content: |-
            # google-cloud-npm -- GCP npm packages
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `google-cloud`, `nodejs` |
            | Install files | `package.json` |
            
            ## Packages
            
            - `firebase-tools` (npm) -- Firebase CLI
            - `@google/gemini-cli` (npm) -- Gemini CLI
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - google-cloud-npm
            ```
            
            ## Used In Boxes
            
            Not currently used in any enabled boxes. Depends on `google-cloud` + `nodejs`.
            
            ## Related Candies
            
            - `/charly-coder:google-cloud` -- Google Cloud SDK dependency
            - `/charly-coder:nodejs` -- Node.js runtime dependency
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Firebase CLI tools or deployment
            - Gemini CLI for Google AI
            - GCP npm packages
            
            ## Author + Test References
            
            - `/charly-image:layer` — candy authoring reference (tasks, vars, env_provide, tests block syntax)
            - `/charly-check:check` — declarative testing framework for the `check:` block

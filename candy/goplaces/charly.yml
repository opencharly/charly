goplaces:
    candy:
        version: 2026.144.1443
        description: |
            Installs the goplaces Google Places API CLI as a user-built Go binary on PATH.
            The goplaces candy go-installs github.com/steipete/goplaces into the
            user's GOPATH bin. With GOPATH=~/go and ~/go/bin appended to PATH,
            the build's single observable effect is a compiled, executable
            binary at ${HOME}/go/bin/goplaces. If the install step were skipped
            the binary would be absent, so its presence and executable bit are
            the verifiable proof the candy did its job.
        require:
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
        env:
            GOPATH: "~/go"
        path_append:
            - "~/go/bin"
        plan:
            - run: |
                command=go install github.com/steipete/goplaces/cmd/goplaces@latest
                go clean -cache
              run_as: "${USER}"
              command: |
                go install github.com/steipete/goplaces/cmd/goplaces@latest
                go clean -cache
            - check: the goplaces binary is go-installed into the user's GOPATH bin
              file:
                file: ${HOME}/go/bin/goplaces
                exists: true
            - check: the installed goplaces binary carries the executable bit
              exit_status: 0
              command:
                command: test -x ${HOME}/go/bin/goplaces
                in_container: true

goplaces-skill:
    skill:
        name: goplaces
        family: tools
        owner: goplaces
        description: |-
            Google Places API CLI for location search.
            Use when working with the goplaces candy.
        content: |
            # goplaces -- Google Places API CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (`run:` step) |
            | Depends | `golang` |
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `GOPATH` | `~/go` |
            | PATH append | `~/go/bin` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [goplaces]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:golang` — required Go toolchain dependency
            - `/charly-openclaw:openclaw-full` — metalayer that includes goplaces
            - `/charly-tools:gogcli` — sibling Google API CLI in openclaw-full
            
            ## Related Commands
            - `/charly-build:secrets` — provision Google Places API key for the CLI
            - `/charly-core:shell` — run goplaces interactively inside a container
            - `/charly-build:build` — compiles goplaces via the Go builder during image build
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Google Places API access
            - Location search tools
            - The `goplaces` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

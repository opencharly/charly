heroic:
    candy:
        version: 2026.144.1443
        description: |
            Heroic Games Launcher (Epic/GOG/Amazon) on a Sway desktop with MangoHud and GameMode
            Installs the Heroic Games Launcher from its GitHub-release RPM
            (the heroic package and /usr/bin/heroic launcher) alongside the
            MangoHud FPS overlay and Feral GameMode performance optimizer from
            the Fedora repos. Heroic config, Wine/Proton tools, and game
            installs persist in the heroic-config and heroic-games volumes.
        require:
            - '@github.com/opencharly/pod-sway:v2026.235.2110'
        distro:
            fedora:
                package:
                    - mangohud
                    - gamemode
        volume:
            - name: heroic-config
              path: "~/.config/heroic"
            - name: heroic-games
              path: "~/Games/Heroic"
        var:
            HEROIC_VERSION: 2.20.1
        plan:
            - run: |
                command=ARCH=$(uname -m)
                curl -fsSL "https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/releases/download/v${HEROIC_VERSION}/Heroic-${HEROIC_VERSION}-linux-${ARCH}.rpm" -o /tmp/heroic.rpm
                dnf install -y /tmp/heroic.rpm
                rm -f /tmp/heroic.rpm
              run_as: root
              command: |
                ARCH=$(uname -m)
                curl -fsSL "https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/releases/download/v${HEROIC_VERSION}/Heroic-${HEROIC_VERSION}-linux-${ARCH}.rpm" -o /tmp/heroic.rpm
                dnf install -y /tmp/heroic.rpm
                rm -f /tmp/heroic.rpm
            - check: the Heroic Games Launcher binary is installed on PATH
              file:
                file: /usr/bin/heroic
                exists: true
            - check: the heroic RPM is registered in the package database
              package:
                package: heroic
                installed: true
            - check: a desktop entry installs so the launcher appears in the application menu
              file:
                file: /usr/share/applications/heroic.desktop
                exists: true
            - check: the MangoHud overlay is installed for in-game FPS and stats
              package:
                package: mangohud
                installed: true
            - check: Feral GameMode is installed to optimize the CPU governor while gaming
              package:
                package: gamemode
                installed: true
            - check: the heroic-config volume is mounted as a directory so Wine/Proton tools and settings survive a rebuild
              context:
                - runtime
              file:
                file: ${VOLUME_CONTAINER_PATH:heroic-config}
                filetype: directory
            - agent-check: installed games and their Wine prefixes are retained between container restarts

heroic-skill:
    skill:
        name: heroic
        family: selkies
        owner: heroic
        description: |-
            Heroic Games Launcher for Epic, GOG, and Amazon Prime Gaming with mangohud and gamemode.
            Use when working with Heroic, Epic Games, GOG, or non-Steam game launchers in containers.
        content: |-
            # heroic -- Heroic Games Launcher
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `sway` |
            | Volumes | `heroic-config` -> `~/.config/heroic`, `heroic-games` -> `~/Games/Heroic` |
            | Install files | `task:` |
            
            ## Packages
            
            - `mangohud` (RPM, Fedora repos) — FPS overlay for games
            - `gamemode` (RPM, Fedora repos) — Feral GameMode performance optimizer
            - `heroic` (RPM, downloaded from GitHub releases in tasks: — not in Fedora repos)
            
            ## Usage
            
            ```yaml
            # charly.yml — typically used with sway-desktop-vnc + steam
            sway-browser-vnc-steam-heroic:
              candy:
                - sway-desktop-vnc
                - steam
                - heroic
            ```
            
            ## Installation
            
            Heroic is an Electron app distributed as an RPM on GitHub releases. The `task:` downloads and installs it via `dnf install -y /tmp/heroic.rpm` (auto-resolves deps). Version pinned to v2.20.1.
            
            COPR repos exist (`atim/heroic-games-launcher`) but builds are currently failing — GitHub RPM is more reliable.
            
            ## CLI Flags
            
            | Flag | Purpose |
            |------|---------|
            | `heroic --fullscreen` | Controller-friendly full-screen UI |
            | `heroic --no-gui` | Start minimized to system tray |
            | `heroic://launch/<runner>/<app>` | Protocol handler — launch a specific game directly |
            
            ## Game Stores
            
            Heroic manages three game stores:
            - **Epic Games Store** (via Legendary backend)
            - **GOG** (via gogdl backend)
            - **Amazon Prime Gaming** (via Nile backend)
            
            ## Wine/Proton Management
            
            Heroic manages its own Wine/Proton independently from Steam:
            - Downloads Wine-GE, Proton-GE, Wine-Lutris, etc. to `~/.config/heroic/tools/`
            - Also supports UMU (Universal Proton runner)
            - Does NOT depend on Steam's Proton installations
            
            ## Data Directories
            
            | Path | Content |
            |------|---------|
            | `~/.config/heroic/` | Config, game settings, Wine/Proton tools |
            | `~/Games/Heroic/` | Game installs + Wine prefixes |
            
            Both are persistent named volumes.
            
            ## Related Candies
            
            - `/charly-selkies:steam` — Steam client (sibling game launcher)
            - `/charly-selkies:sway` — Wayland compositor (dependency)
            - `/charly-selkies:sway-desktop-vnc` — Desktop composition with VNC
            
            ## Used In Boxes
            
            Not used in any current box definition. Standalone gaming candy requiring a Sway desktop box.
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Heroic Games Launcher installation
            - Epic Games Store, GOG, or Amazon Prime Gaming in containers
            - Non-Steam game launchers
            - mangohud or gamemode configuration
            - Wine/Proton management outside of Steam
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

himalaya:
    candy:
        version: 2026.144.1443
        description: |
            Himalaya IMAP/SMTP email CLI compiled into the image
            Builds and installs the himalaya email CLI from crates.io via
            `cargo install himalaya --locked`, run as the image user so the
            binary lands in the user's cargo bin (~/.cargo/bin, which the
            required `rust` candy puts on PATH). himalaya is a single
            self-contained Rust binary that speaks IMAP and SMTP to manage
            accounts, folders, envelopes and messages from the command line.
            The install is fully verifiable at build scope: the binary file is
            present, runs `--version` cleanly, and its `--help` advertises the
            email-management subcommands.
        require:
            - '@github.com/opencharly/layer-rust:v2026.237.458'
        plan:
            - run: command=cargo install himalaya --locked
              run_as: "${USER}"
              command: cargo install himalaya --locked
            - check: the himalaya binary is installed into the user's cargo bin directory
              file:
                file: ${HOME}/.cargo/bin/himalaya
                exists: true
            - check: the installed himalaya binary runs --version and exits cleanly
              exit_status: 0
              command: ${HOME}/.cargo/bin/himalaya --version
            - check: himalaya --help advertises the IMAP/SMTP email-management subcommands
              exit_status: 0
              stdout:
                - matches: "account|folder|envelope|message"
              command: ${HOME}/.cargo/bin/himalaya --help
            - agent-check: given valid IMAP/SMTP account credentials, himalaya lists folders and fetches message envelopes from the configured remote mailbox

himalaya-skill:
    skill:
        name: himalaya
        family: tools
        owner: himalaya
        description: |-
            Himalaya email CLI (IMAP/SMTP).
            Use when working with the himalaya candy.
        content: |
            # himalaya -- Email CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (`run:` step) |
            | Depends | `rust` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [himalaya]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:rust` — required Rust toolchain dependency
            - `/charly-openclaw:openclaw-full` — metalayer that includes himalaya
            - `/charly-infrastructure:gnupg` — pairs with himalaya for PGP-encrypted email
            
            ## Related Commands
            - `/charly-build:secrets` — provision IMAP/SMTP credentials for himalaya
            - `/charly-core:shell` — run himalaya interactively inside a container
            - `/charly-build:build` — compiles himalaya via the Cargo builder during image build
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Email CLI access (IMAP/SMTP)
            - Himalaya email client in containers
            - The `himalaya` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

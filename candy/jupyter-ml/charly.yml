jupyter-ml:
    candy:
        version: 2026.144.1531
        description: |
            GPU JupyterLab serving notebooks plus a CRDT MCP endpoint, composing the llama.cpp + vLLM/unsloth ML stack.
            A Tier-2 GPU meta-layer that serves JupyterLab on port 8888 from the
            /workspace volume under supervisord and exposes a CRDT MCP endpoint at
            /mcp for agent-driven notebook editing. It composes the llama-cpp
            (llama.cpp CLI + GGUF tools), unsloth (vLLM inference + LoRA
            fine-tuning), and jupyter-mcp candies on top of the spaCy NLP model and
            the jupyterlab-quarto extension. Every composed piece lands a concrete,
            probeable artifact: the llama-cli binary, the vLLM wheel in the pixi
            env, the spaCy model, the quarto labextension, and the live notebook +
            MCP API — so being wrong is observable, not silent.
        require:
            - '@github.com/opencharly/layer-cuda:v2026.235.2121'
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
            # plugin-mcp is the OUT-OF-TREE plugin that serves the `mcp:` check verb
            # (the github.com/modelcontextprotocol/go-sdk MCP CLIENT lives there, not in
            # charly's core check surface). This candy AUTHORS `mcp:` checks, so requiring
            # plugin-mcp puts it in every composing image's scanned candy set; the host's
            # collectReferencedPluginWords then build-connects it before the baked `mcp:`
            # checks dispatch — otherwise they SKIP with `unknown verb "mcp"`. (box/<distro>
            # adopts the matching @github pin via reconcile later — the deliberate cross-repo
            # lag; the R10 bed loads the LOCAL candy via the superproject override.)
            - plugin-mcp
        candy:
            - '@github.com/opencharly/layer-llama-cpp:v2026.237.457'
            - '@github.com/opencharly/layer-unsloth:v2026.237.557'
            - '@github.com/opencharly/layer-jupyter-mcp:v2026.237.556'
        env:
            NVIDIA_PYTHON_PROJECT: "~/.pixi"
            LD_LIBRARY_PATH: "/usr/lib64:$HOME/llama.cpp"
        distro:
            arch:
                package:
                    - git
                    - gcc
            fedora:
                package:
                    - git
                    - gcc
                    - gcc-c++
        port:
            - 8888
        mcp_provide:
            - name: jupyter
              url: "http://{{.ContainerName}}:8888/mcp"
              transport: http
        volume:
            - name: workspace
              path: /workspace
        service:
            - name: jupyter-ml
              exec: "bash -c 'if [ -n \"${JUPYTER_TOKEN_FILE:-}\" ] && [ -f \"${JUPYTER_TOKEN_FILE}\" ]; then TOKEN=$(cat \"${JUPYTER_TOKEN_FILE}\"); exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --notebook-dir=/workspace --IdentityProvider.token=\"$TOKEN\" --ServerApp.allow_origin=\"*\" --ServerApp.base_url=\"/\" --ServerApp.allow_root=True; else exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --notebook-dir=/workspace --IdentityProvider.token=\"\" --ServerApp.password=\"\" --ServerApp.allow_origin=\"*\" --ServerApp.base_url=\"/\" --ServerApp.allow_root=True; fi'"
              restart: always
              working_directory: "%(ENV_HOME)s"
              enable: true
              scope: system
        plan:
            - check: the spaCy en_core_web_sm model loads inside the pixi default environment
              exit_status: 0
              command: ${HOME}/.pixi/envs/default/bin/python -c "import spacy; spacy.load('en_core_web_sm')"
            - check: the jupyterlab-quarto extension is enabled in the labextension registry
              exit_status: 0
              stdout:
                - matches: "jupyterlab-quarto.*enabled.*OK"
              command: ${HOME}/.pixi/envs/default/bin/jupyter labextension list 2>&1
            - check: the llama.cpp CLI binary is present from the composed llama-cpp candy
              file:
                file: ${HOME}/llama.cpp/llama-cli
                exists: true
            - check: the vLLM inference engine wheel is installed in the pixi env from the composed unsloth candy
              exit_status: 0
              stdout:
                - contains: "Name: vllm"
              command: ${HOME}/.pixi/envs/default/bin/pip show vllm
            - check: the workspace volume is mounted for notebooks
              context:
                - runtime
              file:
                file: /workspace
                filetype: directory
            - check: the JupyterLab service is running under supervisord
              context:
                - runtime
              service:
                service: jupyter-ml
                running: true
            - check: the JupyterLab REST API answers on the published port with a server version
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8888}/api
                status: 200
                body:
                    - contains: version
            - check: the Jupyter CRDT MCP server responds to a protocol ping
              mcp: ping
              timeout: 30s
              eventually: 90s
              retry_interval: 3s
              context:
                - runtime
            - check: the MCP tool catalog exposes the cell manipulation tools
              mcp: list-tools
              stdout:
                - contains: cell_insert
                - contains: cell_execute
              context:
                - runtime
            - agent-check: an agent can create a notebook and drive its cells through the MCP server end to end
            - check: command=${HOME}/.pixi/envs/default/bin/python -c "import spacy; spacy.load('en_core_web_sm')"
              id: spacy-import
              exit_status: 0
              command: ${HOME}/.pixi/envs/default/bin/python -c "import spacy; spacy.load('en_core_web_sm')"
            - check: command=${HOME}/.pixi/envs/default/bin/jupyter labextension list 2>&1
              id: jupyterlab-quarto-enabled
              exit_status: 0
              stdout:
                # Regex (not literal contains) because `jupyter labextension list`
                # emits ANSI color codes inline between "enabled" and "OK" even on
                # a non-TTY pipe (e.g. \x1b[32menabled\x1b[0m \x1b[32mOK\x1b[0m).
                # The .* spans them.
                - matches: "jupyterlab-quarto.*enabled.*OK"
              command: ${HOME}/.pixi/envs/default/bin/jupyter labextension list 2>&1
            - check: mcp=call
              id: mcp-jupyter-ml-list-notebooks
              mcp:
                method: call
                tool: notebook_list
                input: "{}"
              exit_status: 0
              context:
                - runtime

jupyter-ml-skill:
    skill:
        name: jupyter-ml
        family: jupyter
        owner: jupyter-ml
        description: |-
            Full CUDA ML JupyterLab box with real-time collaboration and CRDT MCP server.
            Base: nvidia. Port 8888. GPU-accelerated ML training + collaborative notebooks.
            MUST be invoked before building, deploying, or troubleshooting the jupyter-ml box.
        content: |-
            # jupyter-ml -- GPU ML Jupyter with CRDT MCP
            
            ## Box Definition
            
            ```yaml
            jupyter-ml:
              base: nvidia
              candy:
                - '@github.com/opencharly/layer-agent-forwarding:v2026.237.804'
                - '@github.com/opencharly/pod-jupyter-ml:v2026.237.936'
                - '@github.com/opencharly/layer-notebook-templates:v2026.237.557'
                - '@github.com/opencharly/pod-dbus:v2026.235.2115'
                - charly
              ports:
                - "8888:8888"
              platforms:
                - linux/amd64
            ```
            
            ## Candy Composition
            
            The `jupyter-ml` candy is a Tier 2 environment-owning meta-layer that composes:
            - `llama-cpp` — llama.cpp prebuilt binaries + GGUF tools
            - `unsloth` — vLLM 0.19 cu130 inference engine + fine-tuning (unsloth + unsloth-zoo) + vLLM torch.compile patch
            - `jupyter-mcp` — CRDT MCP extension (fastmcp + jupyter_mcp package)
            
            Additional candies from the box:
            - `agent-forwarding` — SSH/GPG agent forwarding
            - `notebook-templates` — Starter notebooks (data candy, seeds /workspace)
            - `dbus` — D-Bus session bus
            - `charly` — OpenCharly CLI
            
            ## Base Chain
            
            ```
            quay.io/fedora/fedora:43
            └── fedora
                └── fedora-nonfree (RPM Fusion repos)
                    └── nvidia (NVIDIA drivers + container toolkit)
                        └── jupyter-ml
            ```
            
            ## Ports
            
            | Port | Service |
            |------|---------|
            | 8888 | JupyterLab + MCP endpoint at `/mcp` |
            
            ## Volumes
            
            | Name | Path | Purpose |
            |------|------|---------|
            | workspace | /workspace | Persistent notebook storage |
            | models | ~/.cache/huggingface | HuggingFace model cache (from unsloth sub-candy) |
            
            ## Service Environment Integration
            
            This box receives env_provide variables from infrastructure candies when they are deployed:
            
            | Variable | Injected by | Value |
            |----------|------------|-------|
            | `OLLAMA_HOST` | `/charly-ollama:ollama` | `http://charly-ollama:11434` |
            | `PGHOST` | `/charly-infrastructure:postgresql` | `charly-postgresql` |
            | `PGPORT` | `/charly-infrastructure:postgresql` | `5432` |
            | `REDIS_URL` | `/charly-infrastructure:redis` or `/charly-infrastructure:valkey` | `redis://charly-<image>:6379` |
            
            These variables are injected automatically into the container environment at `charly config` time when the corresponding service is deployed. No manual `-e` flags needed.
            
            ## Key Capabilities
            
            - **JupyterLab** with real-time collaboration (jupyter-collaboration, Y-CRDT)
            - **CRDT MCP Server** at `/mcp` — the tools for programmatic notebook access (server manages CRDT rooms invisibly; see `/charly-jupyter:jupyter-mcp` for the auto-attach + canonicalization design)
            - **PyTorch** >= 2.10.0 with CUDA 13.0
            - **vLLM** 0.19 inference engine
            - **Unsloth** fine-tuning (LoRA, QLoRA)
            - **LangChain** RAG stack (chromadb, faiss-cpu)
            - **Evaluation** tools (evidently, sacrebleu, rouge-score)
            - **Notebook templates** seeded into /workspace
            
            ## Quick Start
            
            ```bash
            charly box build jupyter-ml
            charly config jupyter-ml
            charly start jupyter-ml
            charly status jupyter-ml
            charly logs jupyter-ml -f
            # JupyterLab: http://localhost:8888
            # MCP endpoint: http://localhost:8888/mcp
            ```
            
            ## Verify
            
            ```bash
            charly shell jupyter-ml -c "pixi run verify-pytorch"
            charly shell jupyter-ml -c "pixi run verify-vllm"
            charly shell jupyter-ml -c "pixi run verify-unsloth"
            charly shell jupyter-ml -c "pixi run verify-mcp"
            charly shell jupyter-ml -c "pixi run verify-collaboration"
            ```
            
            ## Comparison with Other Jupyter Images
            
            | | jupyter | jupyter-ml |
            |---|---|---|
            | Base | fedora | nvidia |
            | CUDA | No | Yes |
            | Arch | amd64 + arm64 | amd64 |
            | MCP | CRDT | CRDT |
            | Collaboration | Yes | Yes |
            | ML Stack | No | Full |
            | Volume | workspace | workspace + models |
            | Notebook dir | /workspace | /workspace |
            
            ## Related Boxes
            
            - `/charly-jupyter:jupyter-ml-notebook` — Same stack with fine-tuning notebooks
            - `/charly-jupyter:jupyter` — Lightweight variant (no CUDA, multi-arch)
            - `/charly-languages:python-ml` — ML base without Jupyter
            - **CachyOS variant** — `cachyos.jupyter-ml` is the CachyOS GPU sibling (built on the `cachyos.nvidia` GPU base) in the `opencharly/distro-cachyos` submodule. See `/charly-distros:cachyos`.
            
            **MCP testing:** inherits 3 deploy-scope `mcp:` checks from the `jupyter-ml` candy (`ping`, `list-tools`, `call list_notebooks`). Run `charly check live jupyter-ml --filter mcp` to exercise them. See `/charly-build:charly-mcp-cmd`.
            
            ## When to Use This Skill
            
            MUST be invoked before building, deploying, configuring, or troubleshooting the jupyter-ml box.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

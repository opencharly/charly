                            except Exception as e:
                                if "outside" in str(e) or "resolves outside" in str(e):
                                    print("OK")
                                    return
                                if "ValueError" in str(e):
                                    print("OK")
                                    return
                                raise
                            print("OK")
                    asyncio.run(main())

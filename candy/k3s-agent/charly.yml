k3s-agent:
    candy:
        version: 2026.144.1443
        description: |
            k3s worker (agent) node — joins an existing k3s-server via pre-shared token
            The k3s-agent candy renders /etc/rancher/k3s/config.yaml (mode 0600) with the
            cluster server URL and the shared pre-shared token, then installs and enables a
            k3s-agent.service systemd unit that runs `k3s agent`. On a deployed node the
            agent registers with the control plane and the node reaches the Ready state —
            no join-token handoff, only the server URL plus the credential-store token.
        require:
            - k3s
        # Same pre-shared token as k3s-server consumes. Both layers declare
        # secret_require with the same name, so whichever resolves first
        # auto-generates a 32-byte hex token via the credential store
        # (DefaultCredentialStore.Set) and the other reads the persisted
        # value — server and every agent automatically share the token with
        # zero operator setup. Override only when you need a specific value:
        #   charly secrets set charly/secret/K3S_CLUSTER_TOKEN <value>
        secret_require:
            - name: K3S_CLUSTER_TOKEN
              description: Pre-shared token matching the cluster server's token. Auto-generated on first deploy; shared via the credential store.
        # K3S_SERVER_URL is declarative (the operator knows the server's URL
        # when authoring deploy.yml). Typical value: https://k3s-srv.lan:6443.
        env_require:
            - name: K3S_SERVER_URL
              description: URL of the k3s server's API (e.g., https://k3s-srv.lan:6443). Required.
        plan:
            - run: |
                command=set -euo pipefail
                if [ -z "${K3S_SERVER_URL}" ]; then
                  echo "K3S_SERVER_URL is required — set it in deploy.yml env for this agent." >&2
                  exit 1
                fi
                mkdir -p /etc/rancher/k3s
                cat >/etc/rancher/k3s/config.yaml <<YAML
                server: "${K3S_SERVER_URL}"
                token: "${K3S_CLUSTER_TOKEN}"
                YAML
                chmod 0600 /etc/rancher/k3s/config.yaml
              run_as: root
              # K3S_CLUSTER_TOKEN comes from the secrets injector;
              # K3S_SERVER_URL from deploy.yml env. Do not re-declare here.

              command: |
                set -euo pipefail
                if [ -z "${K3S_SERVER_URL}" ]; then
                  echo "K3S_SERVER_URL is required — set it in deploy.yml env for this agent." >&2
                  exit 1
                fi
                mkdir -p /etc/rancher/k3s
                cat >/etc/rancher/k3s/config.yaml <<YAML
                server: "${K3S_SERVER_URL}"
                token: "${K3S_CLUSTER_TOKEN}"
                YAML
                chmod 0600 /etc/rancher/k3s/config.yaml
            - run: |
                command=set -euo pipefail
                cat >/etc/systemd/system/k3s-agent.service <<'UNIT'
                [Unit]
                Description=Lightweight Kubernetes (agent)
                Documentation=https://k3s.io
                Wants=network-online.target
                After=network-online.target

                [Service]
                Type=notify
                ExecStart=/usr/local/bin/k3s agent
                KillMode=process
                Delegate=yes
                LimitNOFILE=1048576
                LimitNPROC=infinity
                LimitCORE=infinity
                TasksMax=infinity
                TimeoutStartSec=0
                Restart=always
                RestartSec=5s

                [Install]
                WantedBy=multi-user.target
                UNIT
                systemctl daemon-reload
                systemctl enable --now k3s-agent.service
              run_as: root
              command: |
                set -euo pipefail
                cat >/etc/systemd/system/k3s-agent.service <<'UNIT'
                [Unit]
                Description=Lightweight Kubernetes (agent)
                Documentation=https://k3s.io
                Wants=network-online.target
                After=network-online.target

                [Service]
                Type=notify
                ExecStart=/usr/local/bin/k3s agent
                KillMode=process
                Delegate=yes
                LimitNOFILE=1048576
                LimitNPROC=infinity
                LimitCORE=infinity
                TasksMax=infinity
                TimeoutStartSec=0
                Restart=always
                RestartSec=5s

                [Install]
                WantedBy=multi-user.target
                UNIT
                systemctl daemon-reload
                systemctl enable --now k3s-agent.service
            - check: the rendered agent config exists with owner-only permissions
              file:
                file: /etc/rancher/k3s/config.yaml
                exists: true
                mode: "0600"
            - check: the config points the agent at the cluster server URL
              file:
                file: /etc/rancher/k3s/config.yaml
                contains: "server:"
            - check: the k3s-agent systemd unit is installed
              file:
                file: /etc/systemd/system/k3s-agent.service
                exists: true
            - check: the unit starts the node in agent (worker) mode
              file:
                file: /etc/systemd/system/k3s-agent.service
                contains: "k3s agent"
            - check: the worker node registers with the server and reaches Ready
              kube:
                method: wait-nodes
                cluster: "${K3S_CLUSTER}"
                name: "${HOSTNAME}"
              timeout: 180s
              stdout:
                contains: "Ready"
              context:
                - runtime
            - agent-check: the joined worker becomes schedulable so cluster workloads can land on it
            - check: file=/etc/rancher/k3s/config.yaml
              id: k3s-agent-config-file
              context:
                - build
              file:
                file: /etc/rancher/k3s/config.yaml
                exists: true
                mode: "0600"
            - check: file=/etc/systemd/system/k3s-agent.service
              id: k3s-agent-service-unit
              context:
                - build
              file:
                file: /etc/systemd/system/k3s-agent.service
                exists: true

k3s-agent-skill:
    skill:
        name: k3s-agent
        family: infrastructure
        owner: k3s-agent
        description: |-
            k3s worker (agent) node — joins an existing k3s-server via pre-shared token.
            Fully declarative: same charly secrets set once + env K3S_SERVER_URL per agent deploy.
        content: |
            # k3s-agent -- k3s worker node
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `task:`, `service:`, `secret_require:`, `env_require:` |
            | Depends on | `/charly-infrastructure:k3s` |
            | Service | `k3s-agent.service` (system scope, enabled) |
            
            ## What this candy does
            
            1. Reads `K3S_CLUSTER_TOKEN` from the credential store (same secret the
               server consumes — auto-generated on the first server-or-agent
               deploy via `ensureCandySecret`; subsequent deploys read the
               persisted value, so agents and server automatically share the
               token without operator setup).
            2. Requires `K3S_SERVER_URL` from charly.yml env (e.g.,
               `https://k3s-srv.lan:6443`).
            3. Writes `/etc/rancher/k3s/config.yaml` with `server:` and `token:`.
            4. Emits `/etc/systemd/system/k3s-agent.service` running `k3s agent`.
            
            No join-token handoff, no kubeconfig retricheck — agents only need the
            server URL (declarative, known at author time) and the pre-shared token
            (from the credential store).
            
            ## Usage
            
            ```yaml
            # charly.yml (assumes k3s-srv already up; see /charly-infrastructure:k3s-server)
            
            # The VM hardware template (a kind: vm entity — name-first node form).
            k3s-ag1-vm:
              vm:
                source: { kind: cloud_image, url: "…" }
                ram: 4G
                cpu: 2
            
            # The disposable deploy: overlay the k3s-agent candy into the VM. `from:`
            # selects the template; disposable / add_candy / env live on the deploy node.
            k3s-ag1:
              vm:
                from: k3s-ag1-vm
                disposable: true
                add_candy: [k3s-agent]
                env:
                  K3S_SERVER_URL: https://k3s-srv.lan:6443
                  # K3S_CLUSTER must match the cluster profile name registered by the server.
                  K3S_CLUSTER: k3s-srv
            ```
            
            ```bash
            charly fleet add vm:k3s-ag1
            ```
            
            The agent registers; a server-side `kube: wait-nodes` check step confirms the
            join — the declarative `kube:` verb served out-of-process by `candy/plugin-kube`
            (there is no host `charly check kube` command):
            
            ```yaml
              confirm-join:
                check: both nodes reach Ready once the agent joins
                kube: wait-nodes
                cluster: k3s-srv
                kube_count: 2
                timeout: 3m
                context: [deploy]
            ```
            
            ## Tests
            
            Build-scope:
            - `/etc/rancher/k3s/config.yaml` exists, mode 0600.
            - `/etc/systemd/system/k3s-agent.service` exists.
            
            Deploy-scope (uses `/charly-kubernetes:check-k8s`). The cluster-probe verb is
            the declarative `kube:` check verb (served out-of-process by `candy/plugin-kube` —
            there is no host `charly check kube` command); the deploy KIND is spelled
            `kubernetes`:
            - `kube: wait-nodes name=${HOSTNAME}` — this node reaches Ready on the
              server.
            
            ## Related Candies
            - `/charly-infrastructure:k3s` — Base candy installing the k3s binary (required dep)
            - `/charly-infrastructure:k3s-server` — Control-plane node this agent joins
            - `/charly-kubernetes:check-k8s` — Test verb used by the agent-joined check

k3s-server:
    candy:
        version: 2026.216.1851
        description: |
            A single-node k3s control plane that boots with ServiceLB, Traefik, and local-path-provisioner enabled by default.
            Renders /etc/rancher/k3s/config.yaml (admin-only, disabling no
            default addons), runs `k3s server` as a managed service, and
            publishes the cluster kubeconfig back to the operator. The
            observable proof the control plane came up: a live deploy reaches a
            Ready node with Traefik as the default IngressClass and local-path
            as the default StorageClass.
        require:
            - k3s
            # plugin-kube is the OUT-OF-TREE plugin that serves the `kube:` cluster-probe
            # check verb AND the clientcmd-backed k3s kubeconfig-merge K3sPostProvision
            # performs (the heavy k8s.io/client-go + k8s.io/apimachinery stack lives there,
            # not in charly's core). Requiring it puts it in every k3s-server deploy's
            # scanned candy set, so loadProjectPlugins (in the bed runner AND in
            # `charly fleet add`) builds + connects it before the deploy's kubeconfig
            # merge and the bed's `kube:` checks dispatch. (box/<distro> adopts the
            # matching @github pin via reconcile later — the deliberate cross-repo lag;
            # the R10 bed loads the LOCAL candy via the superproject override.)
            - plugin-kube
        # Layer-intrinsic container security. Applied ONLY to pod targets via
        # quadlet PodmanArgs; VM and host targets silently ignore this block
        # (they have full kernel access in their own right). Verified live:
        # k3s bootstraps in ~7s with all three set; fails with "failed to
        # find cpuset cgroup (v2)" without cgroupns=host, fails with
        # "overlayfs snapshotter ... failed to mount overlay" without
        # fuse-overlayfs snapshotter (set in the config.yaml task below).
        #
        # - privileged: k3s runs its own containerd + CNI + kube-proxy; these
        #   need SYS_ADMIN/NET_ADMIN/NET_RAW/SYS_MODULE. Narrower cap subsets
        #   are fragile across k3s releases. Upstream k3s-in-docker docs
        #   document --privileged as the supported path.
        # - cgroupns=host: rootless podman's default cgroup sub-slice (under
        #   user@1000.service) only delegates cpu/memory/pids — cpuset is
        #   missing. Sharing the host's cgroup namespace surfaces the full
        #   controller set including cpuset, which k3s's kubelet requires.
        # - devices /dev/fuse: needed by the fuse-overlayfs snapshotter that
        #   k3s's containerd uses (see config.yaml task comment).
        security:
            privileged: true
            cgroupns: host
            devices:
                - /dev/fuse
        # K3S_CLUSTER_TOKEN is the shared pre-shared token that authorizes
        # k3s-agent nodes to join this server. Auto-generated on first deploy
        # — the resolver in charly/layer_secrets.go (ensureLayerSecret) generates
        # a 32-byte hex token via DefaultCredentialStore.Set the first time
        # this layer (or k3s-agent — same name) resolves the secret. Both
        # layers read the same persisted value on subsequent calls, so the
        # server and every agent automatically share the token without
        # operator setup. Override only when you need a specific value:
        #   charly secrets set charly/secret/K3S_CLUSTER_TOKEN $(openssl rand -hex 32)
        # Retrieve the auto-generated value:
        #   charly secrets get charly/secret K3S_CLUSTER_TOKEN
        secret_require:
            - name: K3S_CLUSTER_TOKEN
              description: Pre-shared token used by k3s-agent nodes to join the cluster. Auto-generated on first deploy; shared between k3s-server and every k3s-agent via the credential store.
        # K3S_SERVER_HOSTNAME is the DNS name or IP by which the server is
        # reachable from the operator's machine AND from every agent. Goes into
        # tls-san: so the emitted kubeconfig server URL is valid.
        #
        # K3S_KUBECONFIG_SERVER is an optional full-URL override applied ONLY
        # to the retrieved kubeconfig's `server:` field, for a port-forwarded
        # reachability path where the host port differs from the guest-side
        # :6443. NOT needed for a charly `vm:` deploy: its host port-forward is
        # resolved (an `auto:<guest>` entry is allocated + persisted in vm_state)
        # and k3s_post automatically rewrites the retrieved kubeconfig's :6443 to
        # the allocated host port. Set this override only for a NON-charly /
        # manual forward with no vm_state entry.
        env_accept:
            - name: K3S_SERVER_HOSTNAME
              description: Public hostname/IP of the k3s server (used for tls-san). Defaults to the hostname seen by uname -n.
            - name: K3S_KUBECONFIG_SERVER
              description: Optional full-URL override for the retrieved kubeconfig's server field, for a manual/non-charly port-forward. A charly vm deploy needs no override — k3s_post rewrites the guest port 6443 to the auto-allocated host port from vm_state. Default falls back to "https://${K3S_SERVER_HOSTNAME}:6443".
        # The kubeconfig ends up at /etc/rancher/k3s/k3s.yaml after k3s boots.
        # We publish it back to the operator via the new artifacts: mechanism
        # (charly/layer_artifacts.go), rewriting the server URL from 127.0.0.1 to
        # the reachable K3S_SERVER_HOSTNAME so the retrieved kubeconfig works
        # directly from the operator's machine. Mode 0600 because kubeconfig
        # contains the cluster admin cert + key.
        artifact:
            - name: kubeconfig
              path: /etc/rancher/k3s/k3s.yaml
              # register: kubeconfig — declares this artifact needs the post-retrieve
              # kubeconfig-merge registration (K3sPostProvision: server-URL rewrite to the
              # host-forwarded port + merge into ~/.kube/config). Dispatched generically by
              # retrieveArtifactsAndK3s off THIS declaration, never a hardcoded candy-name
              # special-case.
              register: kubeconfig
              mode: "0600"
              # k3s.service reaches systemd "active" when the binary execs, but
              # /etc/rancher/k3s/k3s.yaml lands seconds-to-minutes later when the API
              # server finishes starting. 300s: a concurrent bed roster (multiple VMs
              # booting + image builds sharing the host) stretches guest cold-boot —
              # measured live: boot→unit-start alone took 115s of a 120s budget, the
              # kubeconfig landed ~7s after unit-start, missing the old deadline by
              # seconds while k3s itself was perfectly healthy. File existence is the
              # synchronization primitive (R4); polling cadence is 1s in retrieveOne —
              # a larger cap costs nothing when the file lands early.
              wait_second: 300
              rewrite:
                # K3S_KUBECONFIG_SERVER wins when set (covers port-forwarded
                # setups where the host-side port differs from the guest-side
                # :6443). Falls back to "https://${K3S_SERVER_HOSTNAME}:6443"
                # when K3S_KUBECONFIG_SERVER is unset — the shell-style ${K:-d}
                # default lets the second rewrite rule below handle plain
                # hostname substitutions without a port change.
                - find: "https://127.0.0.1:6443"
                  replace: "${K3S_KUBECONFIG_SERVER:-https://127.0.0.1:6443}"
                - find: "127.0.0.1"
                  replace: "${K3S_SERVER_HOSTNAME:-127.0.0.1}"
              retrieve_to: ~/.cache/charly/clusters/${deploy_name}/kubeconfig.yaml
        service:
            - name: k3s
              exec: /usr/local/bin/k3s server
              restart: always
              priority: 50
              stop_timeout: "30"
              after: [network-online.target]
              scope: system
              enable: true
              # Two guards bracketing k3s's own start. Both are systemd-only, which is
              # exactly the coverage needed: every deploy of this candy is a `vm:` deploy,
              # and the pod path already obtains cpuset via the cgroupns: host setting
              # above. Each runs on EVERY start, restarts included — which is what makes
              # the post-start heal able to break a crash loop it did not start in.
              #
              # PRE — remove the trigger (the cgroup cpuset-delegation race).
              exec_start_pre:
                  - /usr/local/bin/k3s-cpuset-ensure.sh
              # POST — heal the permanent wedge that trigger leaves behind. The leading
              # "-" is systemd's ignore-failure marker: a guard must never be able to take
              # down the service it exists to protect.
              exec_start_post:
                  - -/usr/local/bin/k3s-crd-heal.sh %n
        plan:
            - run: install the cgroup cpuset pre-start guard the k3s service execs
              write: /usr/local/bin/k3s-cpuset-ensure.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/sh
                # Assert that the cgroup-v2 cpuset controller is delegated at the ROOT cgroup
                # before k3s starts.
                #
                # Why the root cgroup specifically: k3s runs kubelet with
                # --cgroup-driver=systemd and no --cgroup-root, which defaults to "/", so
                # kubelet creates the TOP-LEVEL kubepods.slice and validates that its PARENT —
                # the root cgroup — delegates every controller it needs. systemd populates a
                # cgroup's subtree_control lazily, so on a cold first boot k3s can start before
                # cpuset has been delegated there and kubelet dies with:
                #   failed to initialize top level QOS containers: error validating root
                #   container [kubepods] : cgroup ["kubepods"] has some missing controllers: cpuset
                # Measured on a wedged bed VM: that crash struck exactly once, 15s into the
                # first-ever start, and its fallout permanently bricked the cluster (see
                # k3s-crd-heal.sh). Verified there that the root cgroup is the deciding one:
                # its subtree_control carried cpuset while system.slice's held only "memory pids".
                #
                # This is a state ASSERTION, not a wait: read, enable if absent, verify. There
                # is nothing to poll for — the controller is available the moment the kernel
                # lists it, and writing it is idempotent.
                set -eu

                control=/sys/fs/cgroup/cgroup.subtree_control
                available=/sys/fs/cgroup/cgroup.controllers

                if [ ! -e "$control" ]; then
                  echo "k3s-cpuset-ensure: no cgroup-v2 unified tree at $control; nothing to assert"
                  exit 0
                fi
                if grep -qw cpuset "$control"; then
                  echo "k3s-cpuset-ensure: cpuset already delegated at the root cgroup"
                  exit 0
                fi
                if ! grep -qw cpuset "$available"; then
                  echo "k3s-cpuset-ensure: kernel exposes no cpuset controller; leaving it to k3s"
                  exit 0
                fi
                if [ ! -w "$control" ]; then
                  echo "k3s-cpuset-ensure: $control is not writable; cannot assert cpuset delegation" >&2
                  exit 1
                fi
                echo "+cpuset" > "$control"
                if ! grep -qw cpuset "$control"; then
                  echo "k3s-cpuset-ensure: wrote +cpuset but the root cgroup still does not delegate it" >&2
                  exit 1
                fi
                echo "k3s-cpuset-ensure: enabled cpuset delegation at the root cgroup"

            - run: install the CRD-establishment wedge healer the k3s service execs after start
              write: /usr/local/bin/k3s-crd-heal.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/sh
                # Heal the k3s CRD-establishment wedge — a DIAGNOSED remediation for one exact
                # signature, never a blind retry.
                #
                # The wedge: if k3s dies in the ~1s window between creating its embedded CRDs and
                # their establishment, the apiserver's EstablishingController never re-queues them
                # after the restart (an upstream defect). The CRD is then frozen at
                # NamesAccepted=True / Established=False FOREVER, and every subsequent k3s start
                # dies after its fixed 60s wait with:
                #   failed to start controllers: failed to create new server context: failed to
                #   register CRDs: failed waiting on CRD 'helmchartconfigs.helm.cattle.io':
                #   timed out waiting for the condition
                # The result is a permanent ~68s crash loop that keeps `process=k3s-server` and
                # `port=6443` GREEN while the cluster never bootstraps — kube-system stays empty.
                # Measured on a real wedged bed VM: 49 restarts, node Ready, zero kube-system pods.
                #
                # The remedy, proven on that same VM: delete the stuck CRD. k3s recreates AND
                # establishes it from its embedded manifests on the next start, and the cluster
                # bootstrapped fully (traefik + svclb + local-path + coredns all Ready) with the
                # restart count then holding steady.
                #
                # Why ExecStartPost and not ExecStartPre: the fix needs the apiserver, and between
                # restarts there is no apiserver at all — the previous process has already exited.
                # Only a post-start hook runs while k3s is up.
                #
                # Cost on a healthy start is zero: the journal gate below fails immediately and the
                # script exits before ever contacting the apiserver.
                set -u

                unit=${1:-}
                KUBECTL=/usr/local/bin/kubectl
                KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                export KUBECONFIG

                # 1. A first-ever start has no datastore and therefore nothing stale to heal.
                [ -d /var/lib/rancher/k3s/server/db ] || exit 0
                [ -x "$KUBECTL" ] || exit 0

                # 2. FAST GATE — diagnose from the journal, which needs no apiserver and costs
                #    milliseconds. Only k3s's own fatal CRD-wait message opens the gate.
                [ -n "$unit" ] || exit 0
                journalctl -u "$unit" --no-pager -n 500 2>/dev/null |
                  grep -q "failed waiting on CRD" || exit 0
                echo "k3s-crd-heal: $unit has failed on a CRD wait; checking for a stuck CRD"

                # 3. Bounded readiness probe for the apiserver. The deadline stays well inside
                #    systemd's default 90s TimeoutStartSec so this hook can never be the reason a
                #    start times out; on expiry we simply give up and let k3s carry on.
                deadline=$(( $(date +%s) + 45 ))
                until "$KUBECTL" get --raw /readyz >/dev/null 2>&1; do
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "k3s-crd-heal: apiserver did not become ready within 45s; skipping" >&2
                    exit 0
                  fi
                  sleep 2
                done

                # 4. CONFIRM against live CRD state, then delete. This confirmation is what makes
                #    the hook safe AND idempotent: the journal gate matches for the rest of the
                #    boot even after a successful heal, but a healed CRD reads Established=True,
                #    so a re-run finds nothing and deletes nothing.
                #
                #    Only CRDs k3s itself owns and recreates from embedded manifests are eligible.
                #    A user CRD is never touched — deleting one would destroy its custom resources.
                # The column spec is QUOTED: it contains [?(...)], which the shell would otherwise
                # try to glob (a bracket expression) — harmless only until a matching filename
                # exists in the working directory.
                "$KUBECTL" get crd \
                  -o 'custom-columns=NAME:.metadata.name,EST:.status.conditions[?(@.type=="Established")].status' \
                  --no-headers 2>/dev/null |
                while read -r name est; do
                  case "$name" in
                    *.k3s.cattle.io|*.helm.cattle.io) ;;
                    *) continue ;;
                  esac
                  if [ "$est" = "True" ]; then
                    continue
                  fi
                  echo "k3s-crd-heal: deleting stuck CRD $name (Established=$est); k3s will recreate and establish it"
                  "$KUBECTL" delete crd "$name" --wait=false || true
                done
                exit 0

            - run: render the k3s server config, adding rootless-userns tolerances under supervisord
              run_as: root
              # K3S_CLUSTER_TOKEN comes from ResolveLayerSecrets via
              # InjectSecretsIntoPlans (deploy_add_cmd.go) — do NOT declare it
              # here or the "layer env takes precedence" rule would block the
              # injection. K3S_SERVER_HOSTNAME is a plain env from deploy.yml.

              command: |
                set -euo pipefail
                mkdir -p /etc/rancher/k3s
                # When running under supervisord (container pod), emit extra
                # config to make k3s tolerant of a rootless user namespace:
                #  - snapshotter: fuse-overlayfs — kernel overlayfs can't nest
                #    on podman's overlayfs (see "failed to mount overlay").
                #  - kubelet-arg feature-gates KubeletInUserNamespace=true —
                #    kubelet tries to open /dev/kmsg to watch OOM events;
                #    userns uid=0 → host uid=1000 can't access it; this gate
                #    makes kubelet skip that check.
                #  - kube-proxy-arg feature-gates KubeletInUserNamespace=true —
                #    kube-proxy honours the same feature gate for its own
                #    userns-aware paths.
                # VM and host deploys run with full kernel access and skip all
                # of these.
                if [ -f /etc/supervisord.conf ]; then
                  cat >/etc/rancher/k3s/config.yaml <<YAML
                write-kubeconfig-mode: "0644"
                token: "${K3S_CLUSTER_TOKEN}"
                tls-san:
                  - "${K3S_SERVER_HOSTNAME:-$(uname -n)}"
                disable: []
                snapshotter: fuse-overlayfs
                kubelet-arg:
                  - "feature-gates=KubeletInUserNamespace=true"
                kube-proxy-arg:
                  - "feature-gates=KubeletInUserNamespace=true"
                YAML
                else
                  cat >/etc/rancher/k3s/config.yaml <<YAML
                write-kubeconfig-mode: "0644"
                token: "${K3S_CLUSTER_TOKEN}"
                tls-san:
                  - "${K3S_SERVER_HOSTNAME:-$(uname -n)}"
                disable: []
                YAML
                fi
                chmod 0600 /etc/rancher/k3s/config.yaml
            - check: the k3s server config file is rendered with admin-only (0600) permissions
              file:
                file: /etc/rancher/k3s/config.yaml
                exists: true
                mode: "0600"
            - check: the k3s control-plane binary the service execs is installed by the required k3s candy
              file:
                file: /usr/local/bin/k3s
                exists: true
            # The four cluster-level assertions below probe the control plane FROM THE
            # VENUE this candy was installed on, driving k3s's own embedded kubectl
            # against the server's local kubeconfig — never through a host-side `kube:`
            # cluster profile.
            #
            # A generic candy cannot name a profile. `cluster:` resolves a kind:kubernetes
            # ENTITY, and the only variable a candy could reach for, ${DEPLOY_NAME},
            # resolves for a VM live check to the sanitized kind:vm ENTITY name
            # (candy/plugin-check/live_gather.go, pluginCheckLiveVM) — an entity every
            # bed deploying it SHARES, so it names no bed's own kubeconfig context and
            # resolves to none at all once each bed owns a per-deploy context. Threading
            # the profile through a deploy-set env var fails worse: an unresolved check
            # var is a SKIP, not a failure (sdk/kit/planrun.go), and the VM check-var env
            # is a fixed map that carries no arbitrary deploy env — so the step would go
            # silently vacuous exactly where it matters.
            #
            # Probing in-venue removes the dependency instead of renaming it: no host
            # kubeconfig merge, no port-forward, and no kind:kubernetes entity, so the same
            # acceptance holds on a vm, a target:local host, or a pod. The host-side view
            # — kubeconfig retrieved, rewritten, merged, reachable over the forward — is
            # the DEPLOY's property, and each bed asserts it with its own profile.
            #
            # The client entrypoint is addressed absolutely, so nothing rests on the
            # venue's PATH: /usr/local/bin/kubectl is the argv[0] symlink onto the k3s
            # multi-call binary that the required k3s candy installs and asserts. Every
            # wait is kubectl's own condition-wait rather than a sleep.
            #
            # That symlink does NOT suppress the "open /etc/rancher/k3s/config.yaml:
            # permission denied" warning — it is the same multi-call binary, so it reads
            # the root-only server config on every invocation whatever argv[0] says, and
            # a non-root check user gets the warning either way. It is HARMLESS (the
            # steps below pass with it on stderr), and charly prints stderr only for a
            # FAILING step, which is exactly why it looks like a cause when it is not:
            # a roster run whose addon rollouts timed out showed this warning in the
            # failure text and sent an RCA after a config-permission bug that does not
            # exist. Read the exit status, not the warning.
            - check: the cluster reports at least one Ready node
              id: k3s-server-node-ready
              command: |
                set -euo pipefail
                export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                /usr/local/bin/kubectl wait --for=condition=Ready node --all --timeout=180s
              timeout: 240s
              stdout:
                contains: "condition met"
              context:
                - runtime
            - check: Traefik, ServiceLB, and local-path addons are all Ready
              id: k3s-server-addons-ready
              command: |
                set -euo pipefail
                export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                /usr/local/bin/kubectl -n kube-system rollout status deployment/traefik --timeout=240s
                /usr/local/bin/kubectl -n kube-system rollout status deployment/local-path-provisioner --timeout=240s
                # ServiceLB's DaemonSet carries a generated suffix, so match it by prefix
                # exactly as the kube: addons method does for svclb-traefik.
                svclb=$(/usr/local/bin/kubectl -n kube-system get daemonset -o name | grep -m1 '^daemonset\.apps/svclb-traefik')
                /usr/local/bin/kubectl -n kube-system rollout status "$svclb" --timeout=240s
              timeout: 300s
              exit_status: 0
              context:
                - runtime
            - check: Traefik is registered as the cluster's default ingress class
              id: k3s-server-ingressclass-traefik
              command: |
                set -euo pipefail
                export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                /usr/local/bin/kubectl get ingressclass traefik -o yaml |
                  grep -q 'ingressclass.kubernetes.io/is-default-class: "true"'
                echo "ingressclass traefik default=true"
              timeout: 60s
              stdout:
                contains: "ingressclass traefik default=true"
              context:
                - runtime
            - check: local-path is registered as the cluster's default storage class
              id: k3s-server-storageclass-localpath
              command: |
                set -euo pipefail
                export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                /usr/local/bin/kubectl get storageclass local-path -o yaml |
                  grep -q 'storageclass.kubernetes.io/is-default-class: "true"'
                echo "storageclass local-path default=true"
              timeout: 60s
              stdout:
                contains: "storageclass local-path default=true"
              context:
                - runtime
            - check: file=/etc/rancher/k3s/config.yaml
              id: k3s-config-file
              context:
                - build
              file:
                file: /etc/rancher/k3s/config.yaml
                exists: true
                mode: "0600"
            - check: file=/usr/local/bin/k3s
              id: k3s-binary
              context:
                - build
              file:
                file: /usr/local/bin/k3s
                exists: true

k3s-server-skill:
    skill:
        name: k3s-server
        family: infrastructure
        owner: k3s-server
        description: |-
            k3s control-plane (server) node with ServiceLB, Traefik v2, and local-path-provisioner enabled by default.
            Publishes kubeconfig back to the operator via layer artifacts and registers a ClusterProfile on first boot.
        content: |
            # k3s-server -- k3s control-plane node
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `task:`, `service:`, `artifact:`, `secret_require:` |
            | Depends on | `/charly-infrastructure:k3s` |
            | Service | `k3s.service` (system scope, enabled) |
            
            ## What this candy does
            
            1. Reads `K3S_CLUSTER_TOKEN` from the credential store (`secret_require:`).
            2. Writes `/etc/rancher/k3s/config.yaml` with:
               - `token:` — the pre-shared cluster token
               - `write-kubeconfig-mode: "0644"` — so the operator can scp the kubeconfig back
               - `tls-san:` — `${K3S_SERVER_HOSTNAME}` (or `hostname -n` fallback)
               - `disable: []` — **explicitly empty**, so ServiceLB, Traefik v2, and
                 local-path-provisioner all install as default k3s addons.
            3. Emits `/etc/systemd/system/k3s.service` running `k3s server`.
            4. After setup, the runtime publishes `/etc/rancher/k3s/k3s.yaml` back to
               the operator via the new `artifact:` candy-schema feature. The
               retrieved file lands at `~/.cache/charly/clusters/<deploy_name>/kubeconfig.yaml`
               with `127.0.0.1` rewritten to `${K3S_SERVER_HOSTNAME}` so the operator
               can `kubectl` the cluster from their machine.
            5. The `K3sPostProvision` hook (Go, runs after artifact retricheck)
               merges the kubeconfig into `~/.kube/config` under context
               `<deploy_name>` and writes a matching ClusterProfile to
               `~/.config/charly/clusters/<deploy_name>.yaml` with `ingress.class=traefik`
               and `storage.class_default=local-path`.
            
            ## Operator setup — none required (auto-generated)
            
            `K3S_CLUSTER_TOKEN` auto-generates on first deploy. The resolver
            (`sdk/deploykit/secret_candy_resolve.go` — `EnsureCandySecret`) detects the missing
            `secret_require:` entry, generates a 32-byte hex token via
            `GenerateAndStoreSecret` (`sdk/deploykit/secret_provision.go`), and persists it to the active credential
            backend (keyring / config-file fallback). Every subsequent
            `k3s-server` and `k3s-agent` deploy reads the same persisted value —
            zero operator setup, server and agents automatically share the token.
            
            **Override** with a specific value (uncommon — only when reproducing a
            specific cluster identity, e.g., disaster recovery):
            
            ```bash
            charly secrets set charly/secret/K3S_CLUSTER_TOKEN $(openssl rand -hex 32)
            ```
            
            **Retrieve** the auto-generated token (for debugging or
            out-of-band agent join):
            
            ```bash
            charly secrets get charly/secret K3S_CLUSTER_TOKEN
            ```
            
            ## Usage
            
            ```yaml
            # charly.yml
            
            # The VM hardware template (a kind: vm entity — name-first node form).
            k3s-srv-vm:
              vm:
                source: { kind: cloud_image, url: "…" }
                ram: 4G
                cpu: 2
            
            # The disposable deploy: overlay the k3s-server candy into the VM. `from:`
            # selects the template; disposable / add_candy / env live on the deploy node.
            k3s-srv:
              vm:
                from: k3s-srv-vm
                disposable: true
                add_candy: [k3s-server]
                env:
                  K3S_SERVER_HOSTNAME: k3s-srv.lan  # optional but recommended
            ```
            
            ```bash
            charly vm create k3s-srv
            charly fleet add vm:k3s-srv
            # → kubeconfig auto-retrieved + ClusterProfile written
            kubectl --context k3s-srv get nodes
            # addon health is asserted by the candy's declarative `kube: addons` check step
            # (served out-of-process by candy/plugin-kube — see Deploy-scope below); there is
            # no host `charly check kube` command.
            ```
            
            ## Tests
            
            Build-scope:
            - `/etc/rancher/k3s/config.yaml` exists, mode 0600.
            - `/etc/systemd/system/k3s.service` exists.
            
            Deploy-scope (using the declarative `kube:` check verb — see `/charly-kubernetes:check-k8s`).
            The cluster-probe verb is the declarative `kube:` check verb (served out-of-process by
            `candy/plugin-kube` — there is no host `charly check kube` command); the `k8s` spelling is
            reserved for the deploy KIND only:
            - `kube: wait-nodes` — at least 1 node Ready.
            - `kube: ingressclass` — `traefik` present.
            - `kube: storageclass` — `local-path` present.
            - `kube: addons` — Traefik + ServiceLB + local-path-provisioner all Ready.
            

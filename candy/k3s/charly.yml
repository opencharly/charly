k3s:
    candy:
        version: 2026.144.1443
        description: |
            Installs the verified-checksum k3s multi-call binary plus its CNI runtime dependencies
            Downloads the k3s binary (sha256-verified against the release
            manifest) to /usr/local/bin/k3s, symlinks kubectl/crictl/ctr onto it
            (k3s dispatches on argv[0]), and installs the iptables/conntrack/
            socat/ethtool runtime dependencies via the distro package manager.
            No service is started here — k3s-server and k3s-agent wrap this
            binary with the right verb. Every installed artifact is
            file/command/package-checkable at build scope.
        package:
            - ca-certificates
            - ethtool
            - fuse-overlayfs
            - socat
        distro:
            arch:
                package:
                    - conntrack-tools
                    - iptables-nft
            debian:
                package:
                    - conntrack
                    - iptables
            fedora:
                package:
                    - conntrack-tools
                    - iptables
            ubuntu:
                package:
                    - conntrack
                    - iptables
        plan:
            - run: |
                command=set -euo pipefail
                # Pinned version — update when cutting over.
                K3S_VERSION="v1.31.11+k3s1"
                K3S_VERSION_URL="v1.31.11%2Bk3s1"
                MACHINE="$(uname -m)"
                case "${MACHINE}" in
                  x86_64) BIN_SUFFIX=""; SHA_SUFFIX="amd64";;
                  aarch64) BIN_SUFFIX="-arm64"; SHA_SUFFIX="arm64";;
                  *) echo "unsupported arch: ${MACHINE}" >&2; exit 1;;
                esac
                BASE="https://github.com/k3s-io/k3s/releases/download/${K3S_VERSION_URL}"
                TMPDIR="$(mktemp -d)"
                trap 'rm -rf "${TMPDIR}"' EXIT
                curl -fsSL --retry 3 "${BASE}/k3s${BIN_SUFFIX}" -o "${TMPDIR}/k3s"
                curl -fsSL --retry 3 "${BASE}/sha256sum-${SHA_SUFFIX}.txt" -o "${TMPDIR}/sha256.txt"
                EXPECTED_SHA="$(awk -v b="k3s${BIN_SUFFIX}" '$2==b{print $1}' "${TMPDIR}/sha256.txt")"
                if [ -z "${EXPECTED_SHA}" ]; then
                  echo "could not find sha256 for k3s${BIN_SUFFIX} in release checksum file" >&2
                  exit 1
                fi
                ACTUAL_SHA="$(sha256sum "${TMPDIR}/k3s" | awk '{print $1}')"
                if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
                  echo "sha256 mismatch: got ${ACTUAL_SHA}, want ${EXPECTED_SHA}" >&2
                  exit 1
                fi
                install -D -m 0755 -o root -g root "${TMPDIR}/k3s" /usr/local/bin/k3s
                # Symlinks for kubectl / crictl / ctr — k3s is multi-call and
                # dispatches on argv[0].
                ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl
                ln -sf /usr/local/bin/k3s /usr/local/bin/crictl
                ln -sf /usr/local/bin/k3s /usr/local/bin/ctr
              run_as: root
              command: |
                set -euo pipefail
                # Pinned version — update when cutting over.
                K3S_VERSION="v1.31.11+k3s1"
                K3S_VERSION_URL="v1.31.11%2Bk3s1"
                MACHINE="$(uname -m)"
                case "${MACHINE}" in
                  x86_64) BIN_SUFFIX=""; SHA_SUFFIX="amd64";;
                  aarch64) BIN_SUFFIX="-arm64"; SHA_SUFFIX="arm64";;
                  *) echo "unsupported arch: ${MACHINE}" >&2; exit 1;;
                esac
                BASE="https://github.com/k3s-io/k3s/releases/download/${K3S_VERSION_URL}"
                TMPDIR="$(mktemp -d)"
                trap 'rm -rf "${TMPDIR}"' EXIT
                curl -fsSL --retry 3 "${BASE}/k3s${BIN_SUFFIX}" -o "${TMPDIR}/k3s"
                curl -fsSL --retry 3 "${BASE}/sha256sum-${SHA_SUFFIX}.txt" -o "${TMPDIR}/sha256.txt"
                EXPECTED_SHA="$(awk -v b="k3s${BIN_SUFFIX}" '$2==b{print $1}' "${TMPDIR}/sha256.txt")"
                if [ -z "${EXPECTED_SHA}" ]; then
                  echo "could not find sha256 for k3s${BIN_SUFFIX} in release checksum file" >&2
                  exit 1
                fi
                ACTUAL_SHA="$(sha256sum "${TMPDIR}/k3s" | awk '{print $1}')"
                if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
                  echo "sha256 mismatch: got ${ACTUAL_SHA}, want ${EXPECTED_SHA}" >&2
                  exit 1
                fi
                install -D -m 0755 -o root -g root "${TMPDIR}/k3s" /usr/local/bin/k3s
                # Symlinks for kubectl / crictl / ctr — k3s is multi-call and
                # dispatches on argv[0].
                ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl
                ln -sf /usr/local/bin/k3s /usr/local/bin/crictl
                ln -sf /usr/local/bin/k3s /usr/local/bin/ctr
            - check: the verified k3s multi-call binary is installed at /usr/local/bin/k3s
              file:
                file: /usr/local/bin/k3s
                exists: true
            - check: the k3s binary is executable (mode 0755)
              file:
                file: /usr/local/bin/k3s
                mode: "0755"
            - check: the binary reports the pinned k3s version
              exit_status: 0
              stdout:
                contains: "k3s version v1."
              command: /usr/local/bin/k3s --version
            - check: kubectl dispatches through the k3s multi-call binary via a symlink
              file:
                file: /usr/local/bin/kubectl
                exists: true
                filetype: symlink
            - check: crictl dispatches through the same multi-call binary
              file:
                file: /usr/local/bin/crictl
                exists: true
                filetype: symlink
            - check: conntrack is installed for kube-proxy connection tracking
              package:
                package: conntrack-tools
                package_map:
                    debian: conntrack
                    ubuntu: conntrack
                installed: true
            - check: socat is installed for the k3s apiserver tunnel proxy
              package:
                package: socat
                installed: true
            - check: iptables is installed for service and pod network routing
              package:
                package: iptables
                package_map:
                    arch: iptables-nft
                installed: true

k3s-skill:
    skill:
        name: k3s
        family: infrastructure
        owner: k3s
        description: |-
            k3s binary installer (common base for k3s-server and k3s-agent).
            Use when building images that need the k3s binary but do NOT want a server/agent service started automatically.
        content: |
            # k3s -- k3s binary installer (base layer)
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (binary fetch + symlinks via a `run:` plan step) |
            | Pinned version | `v1.31.11+k3s1` (edit `K3S_VERSION` in `charly.yml` vars to cut over) |
            
            ## What this candy does
            
            Downloads the verified-checksum k3s binary (plus sha256sum from the
            release manifest), installs it to `/usr/local/bin/k3s`, and creates
            symlinks for `kubectl`, `crictl`, `ctr` (k3s is multi-call). Installs
            runtime dependencies (`iptables`, `conntrack`, `socat`, `ethtool`,
            `ca-certificates`) via the distro package manager — **not** via the
            upstream `curl | sh` installer. Deliberate, per R9.
            
            **No service is started by this candy.** Role selection happens in the
            dependent candies `/charly-infrastructure:k3s-server` and `/charly-infrastructure:k3s-agent`,
            which emit systemd units that wrap this binary with the right CLI verb
            (`k3s server` vs `k3s agent`).
            
            ## Usage
            
            Typically not used directly — compose `/charly-infrastructure:k3s-server` or
            `/charly-infrastructure:k3s-agent` (both depend on this candy).
            
            ```yaml
            # For a bare binary-only image (rare) — a box composes the candy via an
            # inline candy: list in its body:
            k3s-base:
              candy:
                base: fedora
                candy:
                  - k3s
            ```
            
            ## Cross-distro coverage
            
            - `rpm:` (Fedora) — `conntrack-tools`, `iptables`, `ethtool`, `socat`, `ca-certificates`
            - `pac:` (Arch) — `conntrack-tools`, `iptables-nft`, `ethtool`, `socat`, `ca-certificates`
            - `deb:` (Debian/Ubuntu) — `conntrack`, `iptables`, `ethtool`, `socat`, `ca-certificates`
            
            ## Tests
            
            - `k3s --version` matches pinned version.
            - `/usr/local/bin/k3s` is mode 0755.
            - `/usr/local/bin/kubectl` exists as a symlink.
            - Each runtime package is installed (per-distro `package_map` handles Debian's `conntrack` rename).
            
            ## Related Candies
            - `/charly-infrastructure:k3s-server` — Control-plane node (depends on this candy)
            - `/charly-infrastructure:k3s-agent` — Worker node (depends on this candy)
            - `/charly-coder:kubernetes-layer` — Distro `kubectl`/`helm` binaries for the operator, not the cluster

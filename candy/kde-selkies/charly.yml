kde-selkies:
    candy:
        version: 2026.185.0030
        description: |
            A full KDE Plasma Wayland session nested inside pixelflux and streamed over selkies/WebRTC
            The KDE Plasma flavor PRIMITIVE for the selkies streaming desktop: runs a
            full KDE Plasma Wayland session (kwin_wayland + plasmashell — the shell
            launched explicitly on kwin's wayland-0) NESTED inside pixelflux's virtual compositor (wayland-1) via
            kde-selkies-session, so the browser stream shows Plasma. This is the KDE
            analogue of the labwc layer — the swappable nested-compositor seam.

            Composes selkies (transport) + kde-shell (the SDDM-free Plasma session)
            + pipewire (audio) — NO seat, NO SDDM, NO graphical.target. The
            kde-selkies-session service uses supervisord's %(ENV_HOME)s syntax
            (resolved for both supervisord pods and systemd-user targets by
            sdk/deploykit/compile_service_steps.go — the former charly/service_render.go
            is DELETED, K-wave 2) and is started by a poll-for-wayland-1 service exactly
            like labwc — the wrapper's socket poll IS the ordering primitive, so it
            runs headless as a pod with no graphical-session.target. The encoder is
            left UNSET so pixelflux auto-detects per host: NVENC on the NVIDIA flavor
            (pixelflux built un-stubbed against the cuda-arch-builder), VA-API on the
            AMD flavor, CPU x264 otherwise — so the SAME layer streams on every GPU
            config (the encoder identity is asserted per-image in the GPU check beds).

            This streamed Plasma is the pixelflux virtual-framebuffer session —
            intentionally distinct from any SDDM/Plasma DRM session a physical monitor
            shows on a real GPU output (that is kde-desktop's job).
        require:
            - '@github.com/opencharly/pod-selkies:v2026.235.2110'
            - '@github.com/opencharly/layer-kde-shell:v2026.237.457'
            - '@github.com/opencharly/pod-pipewire:v2026.235.2110'
            - '@github.com/opencharly/pod-dbus:v2026.235.2115'
        env:
            SELKIES_FRAMERATE: "60"
        service:
            # Nested KDE Plasma session, started after pixelflux (selkies, priority 8)
            # has created wayland-1. The wrapper polls for the socket — so NO
            # graphical-session.target / seat / SDDM ordering is needed (headless pod;
            # identical contract to labwc-wrapper at the same priority).
            - name: kde-selkies-session
              exec: "%(ENV_HOME)s/.local/bin/kde-selkies-session"
              restart: always
              priority: 12
              start_sec: 3
              enable: true
              # user scope: the nested Plasma session runs in the deploy user's
              # session (session bus + XDG_RUNTIME_DIR from the user manager), so it
              # finds pixelflux's wayland-1 at the same per-user runtime dir.
              scope: user
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=kde-selkies-session
              copy: kde-selkies-session
              to: "${HOME}/.local/bin/kde-selkies-session"
              mode: "0755"
              run_as: "${USER}"
            - # Strip cap_sys_nice from kwin_wayland so the launcher can exec it DIRECTLY as a
              # NESTED compositor: the pod's no-new-privileges rejects exec of a file-capability
              # binary ("Operation not permitted"), and the DRM/seat scheduling cap is unneeded
              # when nesting into pixelflux. RCA-proven: without this + the direct
              # `--wayland-display` launch, kwin runs headless and the stream is a black frame.
              run: strip cap_sys_nice from kwin_wayland so it execs directly as a nested compositor under the pod's no-new-privileges
              run_as: root
              command: |
                for kw in /usr/bin/kwin_wayland /usr/sbin/kwin_wayland; do
                  [ -e "$kw" ] && setcap -r "$kw" 2>/dev/null || true
                done
              id: kde-selkies-strip-caps
            - check: the kde-selkies-session launcher is installed and executable in the deploy user's PATH
              file:
                file: ${HOME}/.local/bin/kde-selkies-session
                exists: true
                mode: "0755"
            - check: the launcher execs kwin_wayland DIRECTLY nested into pixelflux (--wayland-display wayland-1), not startplasma-wayland's headless fallback
              file:
                file: ${HOME}/.local/bin/kde-selkies-session
                contains:
                    - contains: "kwin_wayland --wayland-display wayland-1"
            - check: kwin_wayland has NO cap_sys_nice file capability, so the launcher can exec it directly under the pod's no-new-privileges (the nested-compositor caps-strip)
              command: |
                caps=$(getcap /usr/bin/kwin_wayland 2>/dev/null)
                if [ -n "$caps" ]; then echo "FAIL: kwin_wayland still has caps: $caps"; exit 1; fi
                echo "kwin_wayland caps stripped (execs directly under no-new-privileges)"
            - check: the KWin Wayland compositor that renders the nested session into pixelflux is present
              file:
                file: /usr/bin/kwin_wayland
                exists: true
            - check: kdotool — the KWin window-automation tool that drives the `wl` check verb on this session — is present
              file:
                file: /usr/bin/kdotool
                exists: true
            - check: the pipewire audio daemon composed for the streamed session is present
              file:
                file: /usr/bin/pipewire
                exists: true
            - check: the nested KDE Plasma session reaches RUNNING under supervisord without crash-looping
              stdout:
                - matches: "RUNNING"
              # supervisord + the Plasma session only run in a live deployment, not a
              # disposable `podman run --rm` box (no init, no compositor) — runtime-only.
              context:
                - runtime
              command:
                command: |
                    sleep 20
                    supervisorctl status kde-selkies-session
                in_container: true
            - check: the selkies web UI streams the live Plasma desktop over HTTPS on port 3000
              timeout: 10s
              context:
                - runtime
              http:
                http: https://127.0.0.1:${HOST_PORT:3000}/
                status: 200
                allow_insecure: true
            - agent-check: the streamed frames show a real KWin-composited KDE Plasma desktop (panel + wallpaper), not a black frame or a wlroots session
            - check: |
                command=sleep 20
                supervisorctl status kde-selkies-session
              id: kde-selkies-stable
              stdout:
                - matches: "RUNNING"
              context:
                - runtime
              command:
                command: |
                    sleep 20
                    supervisorctl status kde-selkies-session
                in_container: true
            - check: the Plasma shell (plasmashell — panel + wallpaper) is launched on kwin's wayland-0 and running in the streamed session
              id: kde-selkies-plasmashell-running
              exit_status: 0
              eventually: 60s
              retry_interval: 3s
              context:
                - runtime
              command:
                command: pgrep -x plasmashell
                in_container: true
            - check: http=https://127.0.0.1:${HOST_PORT:3000}/
              id: kde-selkies-stream-https
              timeout: 10s
              context:
                - runtime
              http:
                http: https://127.0.0.1:${HOST_PORT:3000}/
                status: 200
                allow_insecure: true

kde-selkies-skill:
    skill:
        name: kde-selkies
        family: selkies
        owner: kde-selkies
        description: |-
            The KDE nested-compositor PRIMITIVE for the selkies streaming desktop — startplasma-wayland nested in pixelflux, de-SDDM, started by a supervisord poll-for-wayland-1 service. MUST be invoked before editing the kde-selkies candy or its kde-selkies-session wrapper.
        content: |-
            # kde-selkies — KDE Plasma nested-compositor primitive (the KDE seam)
            
            `kde-selkies` is the KDE analogue of the `labwc` candy: the swappable
            nested-compositor primitive that renders a desktop into pixelflux's `wayland-1`.
            It runs a FULL KDE Plasma Wayland session (`startplasma-wayland` =
            kwin_wayland + plasmashell) nested in pixelflux, so selkies streams Plasma.
            
            ## Headless de-SDDM design (load-bearing)
            
            `require: [selkies, kde-shell, pipewire, dbus]` — NOT `kde-desktop`. A pod has
            no DRM seat, no SDDM, no `graphical.target`. So:
            
            - ONE supervisord service `kde-selkies-session` (priority 12, `scope: user`,
              `%(ENV_HOME)s` exec — resolves for both supervisord pods AND systemd-user
              targets via the service render (`sdk/deploykit`'s renderSeamCaller). **No `after: graphical-session.target`** —
              the wrapper's poll-for-`/tmp/wayland-1` IS the ordering primitive (identical to
              `labwc-wrapper`).
            - `kde-selkies-session` waits for pixelflux's `wayland-1`, sets
              `WAYLAND_DISPLAY=wayland-1` (so kwin renders INTO pixelflux), then
              `exec dbus-run-session startplasma-wayland`. kwin creates `wayland-0` for
              Plasma's own clients.
            - **Chrome:** this session script does NOT launch Chrome. The supervised
              `[program:chrome]` service in the shared `selkies-core` candy
              (`/charly-selkies:selkies-core` "Chrome supervision", `restart: always`) owns it for
              both selkies flavors — `chrome-wrapper` self-polls for the `wayland-0` client
              socket kwin publishes, so it needs no per-flavor handoff and supervisord
              relaunches Chrome if it self-exits during the startup-race. Chrome works headless
              under KDE.
            
            This headless-no-seat path is exercised by the `check-selkies-kde-pod` bed:
            `kde-selkies-session` RUNNING ≥20s, `https://:3000/` → 200, Chrome CDP
            `/json/version` → 200, plus the deploy-scope `wl` KWin checks this candy ships.
            
            ## Encoder
            
            `kde-selkies` sets NO `SELKIES_ENCODER` — pixelflux auto-detects at runtime
            (VAAPI on an AMD/Intel renderD via libva-native; NVENC from the cuda-arch-builder
            pixelflux on the `*-nvidia` box; x264 otherwise). So ONE kde-selkies candy
            streams on every GPU config. The encoder identity is asserted per-box in the
            GPU check beds, not here.
            
            ## Related
            
            - `/charly-selkies:labwc` — the other nested-compositor primitive (the labwc seam).
            - `/charly-selkies:kde-shell` — the SDDM-free Plasma session packages kde-selkies requires.
            - `/charly-selkies:selkies-kde-desktop` — the flavor metalayer composing this.
            - `/charly-distros:cachyos` — CachyOS/Arch base where the KDE Plasma stack lives.

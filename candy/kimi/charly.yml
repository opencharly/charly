kimi:
    candy:
        version: 2026.199.2359
        description: |
            Installs the Moonshot Kimi Code CLI globally via npm so `kimi` is on PATH for AI coding assistance.
            The candy depends on nodejs and ships a package.json pinning
            @moonshot-ai/kimi-code, which the build installs globally under
            NPM_CONFIG_PREFIX (~/.npm-global). The result is verifiable: the
            kimi binary lands at ~/.npm-global/bin/kimi, the scoped package
            is unpacked under ~/.npm-global/lib/node_modules/@moonshot-ai/kimi-code,
            and `kimi --version` exits cleanly and prints a semantic version.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
        plan:
            - check: the kimi binary is installed into the npm global bin directory
              file:
                file: ${HOME}/.npm-global/bin/kimi
                exists: true
            - check: the @moonshot-ai/kimi-code scoped package is unpacked under the npm global lib directory
              file:
                file: ${HOME}/.npm-global/lib/node_modules/@moonshot-ai/kimi-code/package.json
                exists: true
            - check: running kimi --version exits cleanly and prints a semantic version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: ${HOME}/.npm-global/bin/kimi --version

kimi-skill:
    skill:
        name: kimi
        family: coder
        owner: kimi
        description: |-
            Moonshot Kimi Code CLI installed globally via npm from @moonshot-ai/kimi-code.
            Use when working with Kimi Code, AI coding assistants, or Moonshot tooling.
        content: |-
            # kimi -- Moonshot Kimi Code CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `nodejs` |
            | Install files | `charly.yml`, `package.json` |
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-dev:
              candy:
                - '@github.com/opencharly/layer-kimi:v2026.237.556'
            ```
            
            ## Used In Boxes
            
            - No enabled boxes use this candy yet — composition into the AI-CLI metalayers
              (`hermes-full`, `openclaw-full`) and the coder boxes is the named
              `@github`-pin follow-up once the candy carries a published tag (see
              `/charly-build:reconcile`)
            
            ## Related Skills
            
            - `/charly-coder:nodejs` -- required dependency (provides npm)
            - `/charly-coder:claude-code`, `/charly-coder:codex`, `/charly-coder:gemini` — sibling AI CLIs (codex and gemini share the npm-global install pattern; claude-code uses the official native installer)
            - `/charly-image:layer` — candy authoring reference
            - `/charly-check:check` — declarative testing framework (this candy's tests verify `${HOME}/.npm-global/bin/kimi`, the unpacked `@moonshot-ai/kimi-code` package, and `kimi --version`)
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Moonshot Kimi Code CLI in containers
            - AI coding assistance tools
            - The `kimi` candy

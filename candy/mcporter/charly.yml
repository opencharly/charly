mcporter:
    candy:
        version: 2026.144.1443
        description: |
            Installs the mcporter MCP CLI globally via npm so `mcporter` is on PATH for listing, configuring, and calling MCP tools.
            The candy depends on nodejs and ships a package.json pinning
            mcporter, which the build installs globally under NPM_CONFIG_PREFIX
            (~/.npm-global). The result is verifiable: the mcporter binary lands
            at ~/.npm-global/bin/mcporter, the mcporter package is unpacked under
            ~/.npm-global/lib/node_modules/mcporter, `mcporter --version` exits
            cleanly and prints a semantic version, and `mcporter --help` lists the
            core MCP commands (list, call) that define the CLI surface.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
        plan:
            - check: the mcporter binary is installed into the npm global bin directory
              file:
                file: ${HOME}/.npm-global/bin/mcporter
                exists: true
            - check: the mcporter package is unpacked under the npm global lib directory
              file:
                file: ${HOME}/.npm-global/lib/node_modules/mcporter/package.json
                exists: true
            - check: running mcporter --version exits cleanly and prints a semantic version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: ${HOME}/.npm-global/bin/mcporter --version
            - check: running mcporter --help lists the list and call MCP commands
              exit_status: 0
              stderr:
                - contains: "list"
                - contains: "call"
              command: ${HOME}/.npm-global/bin/mcporter --help

mcporter-skill:
    skill:
        name: mcporter
        family: tools
        owner: mcporter
        description: |-
            MCP server CLI for listing, configuring, and calling MCP tools.
            Use when working with the mcporter candy.
        content: |
            # mcporter -- MCP server CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `package.json` |
            | Depends | `nodejs` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [mcporter]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:nodejs` — required runtime dependency
            - `/charly-openclaw:openclaw-full` — metalayer that includes mcporter
            - `/charly-coder:claude-code` — sibling AI CLI commonly paired with MCP tools
            
            ## Related Commands
            - `/charly-core:shell` — run mcporter interactively to list/call MCP tools
            - `/charly-build:build` — installs mcporter via the npm builder during image build
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - MCP server management in containers
            - Listing or calling MCP tools
            - The `mcporter` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

nano-pdf:
    candy:
        version: 2026.144.1443
        description: |
            A natural-language PDF editing CLI installed as a pixi-managed console script.
            The nano-pdf candy ships a pixi.toml that installs the nano-pdf PyPI
            distribution (a Typer CLI depending on pypdf, pdf2image, pytesseract
            and google-genai) into the shared default pixi environment. The console
            script lands at ~/.pixi/envs/default/bin/nano-pdf and the distribution is
            importable, so it is verifiable by the script's existence, the installed
            distribution version it reports, and the CLI's own --help usage banner.
        require:
            - '@github.com/opencharly/layer-python:v2026.235.2057'
        plan:
            - check: the nano-pdf console script exists in the default pixi environment
              file:
                file: ${HOME}/.pixi/envs/default/bin/nano-pdf
                exists: true
            - check: the nano-pdf distribution is installed at version 0.2.1
              exit_status: 0
              stdout:
                - contains: "0.2.1"
              command: ${HOME}/.pixi/envs/default/bin/python -c "import importlib.metadata as m; print(m.version('nano-pdf'))"
            - check: the Typer CLI runs and prints its usage banner without error
              exit_status: 0
              stdout:
                - contains: "Usage"
              command: ${HOME}/.pixi/envs/default/bin/nano-pdf --help

nano-pdf-skill:
    skill:
        name: nano-pdf
        family: tools
        owner: nano-pdf
        description: |-
            nano-pdf CLI for PDF editing with natural language.
            Use when working with the nano-pdf candy.
        content: |
            # nano-pdf -- PDF editing CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `pixi.toml` |
            | Depends | `python` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [nano-pdf]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-languages:python` — required Python runtime dependency
            - `/charly-openclaw:openclaw-full` — metalayer that includes nano-pdf
            - `/charly-coder:uv` — sibling Python tooling in openclaw-full
            
            ## Related Commands
            - `/charly-build:build` — installs nano-pdf via the pixi builder during image build
            - `/charly-core:shell` — run nano-pdf interactively inside a container
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - PDF editing with natural language
            - nano-pdf CLI tools
            - The `nano-pdf` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

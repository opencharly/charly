nodejs:
    candy:
        version: 2026.159.1324
        description: |
            A Node.js runtime with the npm and pnpm package managers on the default PATH.
            Installs the distro nodejs package (NodeSource node 20.x on Ubuntu so the
            in-box CLIs that require node >=20 work), the matching npm CLI, and a
            self-contained pnpm standalone binary at /usr/local/bin/pnpm. Every artifact
            is a real file at a known path with a working --version, so the runtime is
            directly verifiable.
        env:
            NPM_CONFIG_PREFIX: "~/.npm-global"
            npm_config_cache: "~/.cache/npm"
        path_append:
            - "~/.npm-global/bin"
        package:
            - nodejs
        distro:
            arch:
                package:
                    - npm
            debian:
                package:
                    - npm
            fedora:
                package:
                    - npm
            ubuntu:
                # Ubuntu 24.04 (noble) apt freezes nodejs at 18.19.1 — too old for the
                # box's own npm CLIs (firebase requires node >=20; gemini-cli's undici
                # needs the node>=20 global `File`; oracle's string-width needs the
                # node>=20 unicode-sets `v` regex flag). Install nodejs from NodeSource
                # (node 20.x): apt prefers its higher version over noble's 18. The base
                # `package: [nodejs]` (top-level) supplies the package name; this section
                # only adds the repo. The apt `npm` package is INTENTIONALLY omitted —
                # NodeSource's nodejs BUNDLES npm at /usr/bin/npm, and installing the
                # separate apt `npm` alongside it pulls conflicting node-* deps (broken
                # packages). debian/fedora/arch keep their apt/dnf/pacman npm (their base
                # node is already >=20). This is the deliberate "NodeSource upgrade that
                # DROPS the separate npm" the prior note described — now required because
                # the in-box CLIs outgrew noble's frozen node 18.
                repo:
                    - name: nodesource
                      url: "https://deb.nodesource.com/node_20.x"
                      key: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
                      suite: nodistro
                      components: main
        var:
            PNPM_VERSION: "10.33.4"
        plan:
            - run: |
                command=case "${BUILD_ARCH}" in
                  x86_64)  PNPM_ARCH="x64" ;;
                  aarch64) PNPM_ARCH="arm64" ;;
                  *) echo "Unsupported arch: ${BUILD_ARCH}"; exit 1 ;;
                esac
                curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-${PNPM_ARCH}" -o /usr/local/bin/pnpm
                chmod 0755 /usr/local/bin/pnpm
              run_as: root
              command: |
                case "${BUILD_ARCH}" in
                  x86_64)  PNPM_ARCH="x64" ;;
                  aarch64) PNPM_ARCH="arm64" ;;
                  *) echo "Unsupported arch: ${BUILD_ARCH}"; exit 1 ;;
                esac
                curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-${PNPM_ARCH}" -o /usr/local/bin/pnpm
                chmod 0755 /usr/local/bin/pnpm
            - check: the node interpreter is installed at /usr/bin/node
              file:
                file: /usr/bin/node
                exists: true
            - check: node reports its version and exits cleanly
              exit_status: 0
              command: /usr/bin/node --version
            - check: the npm package manager is installed at /usr/bin/npm
              file:
                file: /usr/bin/npm
                exists: true
            - check: npm reports its version and exits cleanly
              exit_status: 0
              command: /usr/bin/npm --version
            - check: the self-contained pnpm binary lands on the system PATH at /usr/local/bin/pnpm
              file:
                file: /usr/local/bin/pnpm
                exists: true
            - # pnpm hard-requires a homedir and dies with "Could not find the homedir" when $HOME
              # is unset — unlike node and npm, which do not care. A live-container exec provides
              # no HOME, so this check passed at image build and failed under `charly check live`
              # on every box composing this candy. Derive it from passwd when unset, which is the
              # same getent-based discovery the layer skill prescribes for `command:` steps
              # (RUN shells do not export $USER or $HOME reliably either).
              check: pnpm runs and reports its version
              exit_status: 0
              # No `${...}` anywhere: a check step's command goes through charly's variable
              # substitution, which reads `${HOME:-default}` as a variable named
              # `HOME:-default`, fails to resolve it, and SKIPS the step — trading a red check
              # for a silently absent one. `$( )` is not substituted, so derive the homedir
              # with it and hand the result to env(1).
              command: |
                env HOME="$(getent passwd "$(id -u)" | cut -d: -f6)" pnpm --version
            - check: package=nodejs
              id: nodejs-package
              package:
                package: nodejs
                installed: true

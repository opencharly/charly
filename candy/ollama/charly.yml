ollama:
    candy:
        version: 2026.229.1218
        description: |
            GPU-agnostic Ollama LLM inference server on port 11434
            Installs the Ollama binary and runs `ollama serve` as a custom supervisord
            service that listens on 0.0.0.0:11434 (no systemd). Two install paths, one
            resulting layout (/usr/bin/ollama plus the backend libraries under
            /usr/lib/ollama): on a distro that PACKAGES ollama the package is installed
            and the package manager owns the version; everywhere else the upstream
            release tarball is extracted to /usr at the version the var OLLAMA_VERSION
            selects. That var is PINNED to a release tag and must stay one: the download
            cache is content-addressed by the sha256 of the URL, so a `latest` URL would
            hash to one key forever and serve the first tarball it ever fetched, long
            after upstream moved on. The candy is CPU-only
            and carries no GPU dependency — a GPU backend is an IMAGE-level composition
            choice (compose ollama-cuda or ollama-rocm), which is what keeps this layer
            small. Pulled models persist under the ~/.ollama models volume. The running
            service exposes the Ollama HTTP API (e.g. /api/tags) so any composing box
            can serve and query local models. The companion plugin candy plugin-ollama
            adds the `charly ollama` management CLI against a deployed server.
        require:
            # GPU-agnostic: the ollama binary auto-detects the GPU at runtime (CPU
            # fallback when none present), so CUDA is an IMAGE-level composition choice
            # (the `ollama` image lists `cuda` explicitly), NOT a layer dependency.
            # This lets CPU consumers (e.g. `openclaw-desktop` on cachyos) compose the
            # layer without dragging the Fedora/NVIDIA `cuda` layer onto a pac base.
            - supervisord
        var:
            # Upstream Ollama release for the TARBALL path only — the distros that
            # package ollama let their package manager own the version.
            #
            # A concrete tag, NOT `latest`, and the reason is correctness rather than
            # taste. The download verb content-addresses its cache by sha256 OF THE URL.
            # With `latest` the URL is constant while the artifact behind it changes, so
            # the cache would serve whichever build was fetched first, forever — a silent
            # pin to an arbitrary old version that no amount of rebuilding would shake
            # loose. A `latest` URL and a content-addressed cache are incompatible; the
            # tag is what makes the key honest.
            #
            # (Secondarily: GitHub serves the two cases from structurally different URLs —
            # releases/latest/download/... vs releases/download/<tag>/... — so one template
            # could not express both anyway, and pinning matches the house pattern set by
            # CUE_VERSION and APKEEP_VERSION.) Bump it here to move the tarball distros.
            OLLAMA_VERSION: v0.32.14
        distro:
            # Arch (and its derivatives, CachyOS included) ships ollama in `extra`,
            # tracking upstream closely — 0.32.14-1 landed the day upstream tagged
            # v0.32.14. The packaged base is 66 MiB installed (16 MiB download); the
            # upstream tarball it replaces is a 1.32 GiB DOWNLOAD, because that one
            # archive bundles every GPU backend
            # while the package splits them into the ollama-cuda / ollama-rocm
            # add-ons this candy deliberately does NOT require.
            arch:
                package:
                    - ollama
        env:
            OLLAMA_HOST: "0.0.0.0"
            OLLAMA_MODELS: "~/.ollama/models"
        env_provide:
            OLLAMA_HOST: "http://{{.ContainerName}}:11434"
        port:
            - 11434
        volume:
            - name: models
              path: "~/.ollama"
        alias:
            - name: ollama
              command: ollama
        service:
            - name: ollama
              exec: "ollama serve"
              restart: always
              enable: true
              scope: system
        plan:
            # Capability-gated, not distro-gated. The `distro:` package sections above
            # compile into the plan BEFORE this step (BuildDeployPlan phase 1 vs phase 3),
            # so on a distro that packages ollama the binary already exists here and
            # `unless_exists:` skips the fetch entirely. Detection rather than a distro
            # name, so any distro that later gains an ollama package is picked up with no
            # edit — and a plan step has no build-time distro filter to gate it with
            # anyway (`exclude_distro:` is read by the check runner, not the emitter).
            #
            # This is the declarative `download:` verb rather than a hand-rolled curl, so
            # it keeps what the verb provides and a hand-rolled step forfeits: the
            # content-addressed /tmp/downloads cache (no re-fetch of a 1.32 GiB archive on
            # every cache-miss build), the atomic .part -> mv rename, and the stage-user
            # -correct cache mount. `unless_exists:` is the capability that made that
            # possible; before it, the gate could only be expressed by abandoning the verb.
            - run: install the upstream ollama release tarball on distros that ship no ollama package (var OLLAMA_VERSION)
              download: "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
              extract: tar.zst
              to: /usr
              unless_exists: /usr/bin/ollama
              run_as: root
            - check: the ollama binary is installed at /usr/bin/ollama
              file:
                file: /usr/bin/ollama
                exists: true
            - check: the running ollama service answers the model-tags API with HTTP 200 on port 11434
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:11434}/api/tags
                status: 200
            - check: the ollama CLI reports an "ollama version" string
              stdout:
                - matches: "^ollama version"
              context:
                - runtime
              command: ollama --version
            - check: the ollama CLI lists models against the live service with exit 0
              exit_status: 0
              context:
                - runtime
              command: ollama list
            # Host-side proof of the companion command:ollama plugin, authored HERE on
            # the candy that provides the server rather than on any one bed, so every
            # box composing ollama inherits it (R3) instead of each bed repeating the
            # steps. ${CHARLY_BIN} is the ACTIVE charly (kit.StampCharlyBin), never a
            # stale PATH pick, and is stamped for any runtime check run — not just beds.
            - check: charly ollama help exits 0 and prints the plugin usage, proving the compiled-in command:ollama plugin registers and dispatches
              id: ollama-cli-help
              exit_status: 0
              stdout:
                - contains: 'manage a deployed Ollama server'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} ollama help
                in_container: false
            - check: charly ollama version reports the server version over the published port, proving a live API round-trip against the deployed server
              id: ollama-cli-version
              exit_status: 0
              stdout:
                - contains: 'ollama server version is'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} ollama version --server http://127.0.0.1:${HOST_PORT:11434}
                in_container: false
            - check: charly ollama list prints the model table header over the published port, proving the list API path against the deployed server
              id: ollama-cli-list
              exit_status: 0
              stdout:
                - contains: 'NAME'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} ollama list --server http://127.0.0.1:${HOST_PORT:11434}
                in_container: false
            - agent-check: models pulled via `ollama pull` are stored under the ~/.ollama models volume and survive a service restart

ollama-skill:
    skill:
        name: ollama
        family: ollama
        owner: ollama
        description: |-
            Standalone Ollama LLM inference server with CUDA GPU support.
            Runs as a supervisord service on port 11434 with persistent model storage.
            MUST be invoked before building, deploying, configuring, or troubleshooting the ollama box.
        content: |-
            # ollama
            
            GPU-accelerated Ollama LLM inference server.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | nvidia |
            | Candies | agent-forwarding, ollama |
            | Platforms | linux/amd64 |
            | Ports | 11434 |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `fedora` → `nvidia` (CUDA base)
            2. `pixi` → `python` → `supervisord` (transitive)
            3. `ollama` — LLM server, models volume
            
            ## GPU is box-level — the `ollama` candy is GPU-agnostic
            
            The `ollama` **candy** installs the Ollama binary and a supervisord
            `ollama serve` service, and carries **no GPU dependency** — it only
            `require:`s `supervisord`. Two install paths converge on one layout
            (`/usr/bin/ollama` plus backends under `/usr/lib/ollama`): on Arch and its
            derivatives the packaged `ollama` (66 MiB installed) is installed, and elsewhere
            the upstream release tarball is extracted to `/usr`. The step is gated on
            whether the binary already exists rather than on a distro name, so any distro
            that gains an ollama package is picked up without an edit.

            GPU support is a **composition choice made at the box level**, and on the
            packaged path that choice is what keeps images small: the tarball bundles
            every backend into one 1.32 GiB download, while the packages split them out.
            Sizes below are INSTALLED, not download, so they are comparable to each other.

            - The `ollama` box keeps GPU acceleration via `base: nvidia` and composes
              `ollama-cuda` (~988 MiB) for the CUDA backend.
            - The `ollama-rocm` box composes `ollama-rocm` (~2.9 GiB) for AMD.
            - CPU-only consumers compose the `ollama` candy alone and pay for neither —
              e.g. `/charly-openclaw:openclaw-desktop` (cachyos base, no GPU candy).
            
            ## Ports
            
            | Port | Service | Protocol |
            |------|---------|----------|
            | 11434 | Ollama API | HTTP |
            
            ## Volumes
            
            | Name | Path | Purpose |
            |------|------|---------|
            | models | ~/.ollama | Model storage |
            
            ## Quick Start
            
            ```bash
            charly box build ollama
            charly config ollama
            charly start ollama
            charly shell ollama -c "ollama pull llama3"
            charly shell ollama -c "ollama run llama3 'Hello'"
            ```
            
            ## Host Alias
            
            ```bash
            charly alias install ollama
            # Now: ollama pull llama3  (runs inside the container)
            ```
            
            ## The `charly ollama` management CLI
            
            The compiled-in `command:ollama` plugin (`candy/plugin-ollama`) manages a
            deployed Ollama server from the host over its HTTP API — no shell alias
            needed:
            
            ```bash
            charly ollama list --server http://127.0.0.1:11434
            charly ollama pull llama3 --server http://127.0.0.1:11434
            charly ollama run llama3 "Hello" --server http://127.0.0.1:11434
            ```
            
            Endpoint resolution: `--server` flag > `OLLAMA_HOST` env > `http://127.0.0.1:11434`.
            See `/charly-ollama:ollama-cli` for the full command tree.
            
            ## Pinning the upstream version
            
            The candy installs the newest upstream release by default. Set the
            candy-local `var:` `OLLAMA_VERSION` to a release tag (e.g. `v0.32.14`)
            to pin an exact version.
            
            ## Service Environment
            
            When deployed via `charly config ollama`, this box automatically provides `OLLAMA_HOST=http://charly-ollama:11434` to all other deployed containers via the `env_provide` mechanism. Use `--update-all` to propagate to already-deployed services:
            
            ```bash
            charly config ollama --update-all
            ```
            
            This means containers like `jupyter-ml-notebook` automatically discover the Ollama endpoint without manual `OLLAMA_HOST` configuration.
            
            ## Key Candies
            
            - `/charly-ollama:ollama` — Ollama binary, supervisord service, model volume
            - `/charly-distros:cuda` — GPU support (via nvidia base)
            
            ## Related Boxes
            
            - `/charly-distros:nvidia` — parent (GPU without Ollama)
            - **CachyOS variant** — `cachyos.ollama` is the CachyOS GPU sibling (built on the `cachyos.nvidia` GPU base) in the `opencharly/distro-cachyos` submodule. See `/charly-distros:cachyos`.
            - `/charly-openclaw:openclaw-desktop` — composes the `ollama` candy CPU-only (cachyos base, no `cuda`) alongside a streaming desktop + the openclaw gateway + the nested charly toolchain
            - `/charly-jupyter:jupyter-ml-notebook` — Jupyter with Ollama integration notebooks (receives `OLLAMA_HOST` automatically via env_provide when ollama is deployed)
            - `/charly-openwebui:openwebui` — Open WebUI (receives `OLLAMA_HOST` via env_provide, auto-configures as `OLLAMA_BASE_URL`)
            
            ## Related Candies
            
            - `/charly-ollama:ollama` — the Ollama binary candy
            - `/charly-ollama:ollama-cli` — the compiled-in `charly ollama` management CLI (candy/plugin-ollama)
            - `/charly-jupyter:notebook-ollama` — 6 Jupyter notebooks demonstrating Ollama APIs (requests, OpenAI, ollama lib, Anthropic, HuggingFace, GPU)
            
            ## Verification
            
            After `charly start`:
            - `charly status ollama` — container running
            - `charly service status ollama` — all services RUNNING
            - `curl -s http://localhost:11434/api/tags` — Ollama API responds
            - `charly ollama list` (or `charly check live ollama`) — the baked runtime checks pass: `/api/tags` 200, `ollama --version`, `ollama list` exit 0
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the ollama box, LLM model serving, or the standalone Ollama deployment. Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

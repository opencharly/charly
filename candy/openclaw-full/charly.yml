openclaw-full:
    candy:
        version: 2026.200.1600
        description: |
            Maximal headless OpenClaw deployment — gateway plus all feasible CLI tools/skills, no system Chrome/CDP
            openclaw-full is a pure meta-composition candy: it installs nothing of
            its own and instead composes a large set of candies — the openclaw gateway, the
            claude-code CLI, and the tool candies (codex, gemini, clawhub, mcporter,
            oracle, xurl, summarize, playwright, ripgrep, sqlite, tmux, ffmpeg, gh,
            uv, himalaya, …). The observable effect of the composition is that every
            composed tool's key artifact lands in ONE image: the openclaw / mcporter
            binaries under ~/.npm-global/bin, the claude binary under /usr/local/bin
            (native installer, relocated at build time so it survives the deploy-time
            home-volume mount), uv under /usr/local/bin, and rg / sqlite3 / tmux /
            ffmpeg / gh under /usr/bin. The scenarios and check
            block assert that cross-section — they FAIL if any composed candy is
            dropped from the metalayer. The gateway's own port reachability is
            already checked by the composed openclaw candy and rides along.
        candy:
            - '@github.com/opencharly/pod-openclaw:v2026.237.558'
            - '@github.com/opencharly/layer-claude-code:v2026.237.456'
            - '@github.com/opencharly/layer-codex:v2026.237.556'
            - '@github.com/opencharly/layer-gemini:v2026.235.2110'
            - '@github.com/opencharly/layer-clawhub:v2026.237.556'
            - '@github.com/opencharly/layer-mcporter:v2026.237.556'
            - '@github.com/opencharly/layer-oracle:v2026.237.557'
            - xurl
            - '@github.com/opencharly/layer-summarize:v2026.237.557'
            - '@github.com/opencharly/layer-playwright:v2026.237.557'
            - '@github.com/opencharly/layer-blogwatcher:v2026.237.455'
            - '@github.com/opencharly/layer-gifgrep:v2026.237.457'
            - '@github.com/opencharly/layer-wacli:v2026.237.458'
            - '@github.com/opencharly/layer-goplaces:v2026.237.457'
            - '@github.com/opencharly/layer-songsee:v2026.237.458'
            - '@github.com/opencharly/layer-sag:v2026.237.458'
            - '@github.com/opencharly/layer-camsnap:v2026.237.455'
            - '@github.com/opencharly/layer-gogcli:v2026.237.457'
            - '@github.com/opencharly/layer-ordercli:v2026.237.457'
            - '@github.com/opencharly/layer-himalaya:v2026.237.806'
            - '@github.com/opencharly/layer-uv:v2026.237.458'
            - '@github.com/opencharly/layer-nano-pdf:v2026.237.556'
            - '@github.com/opencharly/layer-gh:v2026.237.456'
            - '@github.com/opencharly/layer-tmux:v2026.235.2057'
            - '@github.com/opencharly/layer-ffmpeg:v2026.235.2057'
            - '@github.com/opencharly/layer-ripgrep:v2026.235.1653'
            - '@github.com/opencharly/layer-sqlite:v2026.237.458'
        plan:
            - check: the claude-code CLI is composed into the image under the native install location
              file:
                file: /usr/local/bin/claude
                exists: true
            - check: claude --version exits cleanly and prints the Claude Code banner
              exit_status: 0
              stdout:
                - contains: "Claude Code"
              command: /usr/local/bin/claude --version
            - check: the mcporter MCP CLI is composed into the image
              file:
                file: ${HOME}/.npm-global/bin/mcporter
                exists: true
            - check: ripgrep's rg binary is present from the composed ripgrep candy
              file:
                file: /usr/bin/rg
                exists: true
            - check: the sqlite3 shell is present from the composed sqlite candy
              file:
                file: /usr/bin/sqlite3
                exists: true
            - check: tmux is present from the composed tmux candy
              file:
                file: /usr/bin/tmux
                exists: true
            - check: ffmpeg is present from the composed ffmpeg candy
              file:
                file: /usr/bin/ffmpeg
                exists: true
            - check: the GitHub CLI gh is present from the composed gh candy
              file:
                file: /usr/bin/gh
                exists: true
            - check: the uv Python package manager is composed into the image at /usr/local/bin/uv
              file:
                file: /usr/local/bin/uv
                exists: true
            - agent-check: the running OpenClaw gateway exposes the bundled CLI tools to agent requests without relying on a system browser
            - check: package=ripgrep
              id: openclaw-full-ripgrep-package
              package:
                package: ripgrep
                installed: true
            - check: file=/usr/bin/git
              id: openclaw-full-git-binary
              file:
                file: /usr/bin/git
                exists: true
            - check: file=/usr/local/bin/uvx
              id: openclaw-full-uvx-binary
              file:
                file: /usr/local/bin/uvx
                exists: true

openclaw-full-skill:
    skill:
        name: openclaw-full
        family: openclaw
        owner: openclaw-full
        description: |-
            Headless OpenClaw with all tool candies. No desktop environment.
            MUST be invoked before building, deploying, or troubleshooting the openclaw-full box.
        content: |-
            # openclaw-full
            
            Headless OpenClaw box with maximal tool/skill coverage. No desktop, no VNC.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | cachyos |
            | Candies | agent-forwarding, openclaw-full |
            | Platforms | linux/amd64 |
            | Ports | 18789 (gateway) |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `cachyos` (external base, Arch-derived — pacman/AUR)
            2. `openclaw-full` metalayer (no system browser):
               - `openclaw` — AI gateway
               - `claude-code` — Claude Code CLI
               - the tool candies (codex, gemini, clawhub, mcporter, oracle, xurl, summarize, playwright, blogwatcher, gifgrep, wacli, goplaces, songsee, sag, camsnap, gogcli, ordercli, himalaya, uv, nano-pdf, gh, tmux, ffmpeg, ripgrep, sqlite)
            
            ## Ports
            
            | Port | Service | Protocol |
            |------|---------|----------|
            | 18789 | OpenClaw gateway | HTTP |
            
            ## Quick Start
            
            ```bash
            charly box build openclaw-full
            charly config openclaw-full
            charly start openclaw-full
            ```
            
            ## Key Candies
            
            - `/charly-openclaw:openclaw-full` — Metalayer composition (all tools)
            - `/charly-openclaw:openclaw` — AI gateway service
            
            ## Related Boxes
            
            - `/charly-openclaw:openclaw` — minimal (gateway only)
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the openclaw-full box or the headless maximal OpenClaw deployment.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

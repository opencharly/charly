openclaw:
    candy:
        version: 2026.200.0158
        description: |
            Headless OpenClaw AI gateway service on port 18789
            Installs the openclaw npm package globally (package.json ->
            npm install -g) so the gateway binary lands at
            ~/.npm-global/bin/openclaw, then runs it as the supervised
            `openclaw` service (`openclaw gateway --port 18789
            --allow-unconfigured --bind loopback` — loopback bind needs no
            auth and matches the socat relay; unconfigured lets the headless
            gateway start before any operator setup). socat
            relays the loopback-bound gateway onto the container interface
            and a `data` volume persists ~/.openclaw. Binary presence, the
            supervised service, and the reachable port are all verifiable.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
            - '@github.com/opencharly/layer-socat:v2026.235.2057'
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
        env:
            NODE_ENV: "production"
        port:
            - 18789
        port_relay:
            - 18789
        volume:
            - name: data
              path: "~/.openclaw"
        alias:
            - name: openclaw
              command: openclaw
        service:
            - name: openclaw
              exec: "%(ENV_HOME)s/.npm-global/bin/openclaw gateway --port 18789 --allow-unconfigured --bind loopback"
              restart: always
              enable: true
              scope: system
        plan:
            - check: the openclaw gateway binary is installed into the npm global bin
              file:
                file: ${HOME}/.npm-global/bin/openclaw
                exists: true
            - check: the openclaw gateway reports the exact security-patched package version
              exit_status: 0
              stdout:
                - matches: "2026\\.7\\.1-2"
              command: ${HOME}/.npm-global/bin/openclaw --version
            - check: the openclaw gateway runs as a supervised service
              context:
                - runtime
              service:
                service: openclaw
                running: true
            - check: the running gateway accepts a TCP connection on its published port 18789
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:18789}
                reachable: true

openclaw-skill:
    skill:
        name: openclaw
        family: openclaw
        owner: openclaw
        description: |-
            Headless OpenClaw AI gateway box. Runs the gateway on port 18789
            without a desktop environment. Use when working with the headless
            MUST be invoked before building, deploying, configuring, or troubleshooting the openclaw box.
        content: |-
            # openclaw
            
            Headless OpenClaw AI gateway — no desktop, no browser, just the gateway service.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | cachyos |
            | Candies | agent-forwarding, openclaw, dbus, charly |
            | Platforms | linux/amd64 |
            | Ports | 18789 |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `cachyos` (docker.io/cachyos/cachyos-v3, digest-pinned, Arch-derived)
            2. `pixi` → `python` → `supervisord` (transitive)
            3. `nodejs` (transitive via openclaw)
            4. `openclaw` — gateway on :18789, data volume
            5. `dbus` — message bus; `charly` — charly CLI toolchain
            
            ## Ports
            
            | Port | Service | Protocol |
            |------|---------|----------|
            | 18789 | OpenClaw gateway + Control UI | HTTP |
            
            ## Quick Start
            
            ```bash
            charly box build openclaw
            charly config openclaw
            charly start openclaw
            # Gateway at http://localhost:18789
            ```
            
            ## Key Candies
            
            - `/charly-openclaw:openclaw` — gateway npm package, supervisord service, data volume
            
            ## Related Boxes
            
            - `/charly-openclaw:openclaw-full` — maximal variant (gateway + browser + all tools)
            
            ## Verification
            
            After `charly start`:
            - `charly status openclaw` — container running
            - `charly service status openclaw` — all services RUNNING
            - `curl -s http://localhost:18789` — OpenClaw gateway responds
            
            ## Port Relay Architecture
            
            OpenClaw gateway (18789) uses port relay (socat) — the gateway binds to loopback, socat forwards from the container interface. This avoids the `allowedOrigins` requirement for the Control UI.
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the headless openclaw box, deploying openclaw without a desktop, or comparing openclaw variants. Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

openwebui:
    candy:
        version: 2026.144.1443
        description: |
            Open WebUI LLM chat front-end with an auto-configuring entrypoint, served as a supervised HTTP service on port 8080.
            Installs the Open WebUI server (the `open-webui` PyPI package via pixi)
            and copies a bash auto-config entrypoint to
            ${HOME}/.local/bin/openwebui-entrypoint (mode 0755). A supervised system
            service runs that entrypoint, which wires up LLM providers from
            env/secrets (OpenRouter, Ollama Cloud, direct OpenAI, local Ollama, MCP
            servers, and Jupyter code execution), enforces mandatory admin
            credentials (WEBUI_ADMIN_EMAIL + WEBUI_ADMIN_PASSWORD), reads the
            auto-generated WEBUI_SECRET_KEY, then exec's `open-webui serve` on port
            8080. Every fact below is observable: the installed executable
            entrypoint, the running service, the admin email injected into its
            environment, and the HTTP 200 the web UI returns on its published port.
        require:
            - '@github.com/opencharly/layer-python:v2026.235.2057'
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
        env:
            DATA_DIR: "/opt/data"
            PORT: "8080"
            DOCKER: "true"
            ENABLE_DIRECT_CONNECTIONS: "true"
            ENABLE_CODE_EXECUTION: "true"
            ENABLE_PERSISTENT_CONFIG: "false"
            ENABLE_VERSION_UPDATE_CHECK: "false"
        env_require:
            - name: WEBUI_ADMIN_EMAIL
              description: "Admin account email (identifier, not a credential) — pass via: charly config openwebui -e WEBUI_ADMIN_EMAIL=you@example.com"
        env_accept:
            - name: OLLAMA_HOST
              description: "Local Ollama server URL (auto-injected by ollama layer env_provides)"
            - name: OPENAI_API_BASE_URL
              description: "OpenAI-compatible API base URL"
            - name: WEBUI_AUTH
              description: "Enable authentication (default: true)"
            - name: CHARLY_MCP_SERVERS
              description: "JSON array of MCP servers (auto-injected by mcp_provide layers)"
            - name: IMMICH_API_URL
              description: "Immich HTTP API URL (auto-injected by immich layer env_provides)"
        # Credential-store-backed env vars. Values live in the user's credential
        # backend (keyring/config) and are injected at runtime via podman
        # secrets (Secret=<name>,type=env,target=<var>). Never land in deploy.yml
        # or the quadlet file as plaintext. See /charly-build:secrets and /charly-image:layer.
        #
        # WEBUI_ADMIN_PASSWORD: auto-generated on first deploy as a 32-byte hex
        # random value via DefaultCredentialStore.Set (see charly/layer_secrets.go
        # ensureLayerSecret). To use the auto-generated password to log in for
        # the first time:
        #   charly secrets get charly/secret WEBUI_ADMIN_PASSWORD
        # To override with a specific value before deploying:
        #   charly secrets set charly/secret WEBUI_ADMIN_PASSWORD <password>
        secret_require:
            - name: WEBUI_ADMIN_PASSWORD
              description: "Initial admin account password for Open WebUI first-run setup. Auto-generated on first deploy; retrieve via `charly secrets get charly/secret WEBUI_ADMIN_PASSWORD`."
        secret_accept:
            - name: OPENROUTER_API_KEY
              description: "API key for OpenRouter (maps to OPENAI_API_KEY with OpenRouter base URL)"
              key: charly/api-key/openrouter
            - name: OLLAMA_API_KEY
              description: "API key for Ollama Cloud inference"
              key: charly/api-key/ollama
            - name: OPENAI_API_KEY
              description: "Direct OpenAI API key"
              key: charly/api-key/openai
            - name: IMMICH_API_KEY
              description: "Immich API key for programmatic access to the running immich instance"
              key: charly/api-key/immich
        mcp_accept:
            - name: jupyter
              description: "JupyterLab CRDT MCP server for notebook manipulation"
            - name: chrome-devtools
              description: "Chrome DevTools MCP server for browser automation"
        port:
            - 8080
        volume:
            - name: data
              path: "/opt/data"
        alias:
            - name: open-webui
              command: open-webui
        secret:
            - name: webui-secret-key
              env: WEBUI_SECRET_KEY
        service:
            - name: openwebui
              exec: "%(ENV_HOME)s/.local/bin/openwebui-entrypoint"
              restart: always
              working_directory: "%(ENV_HOME)s"
              enable: true
              scope: system
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=openwebui-entrypoint
              copy: openwebui-entrypoint
              to: "${HOME}/.local/bin/openwebui-entrypoint"
              mode: "0755"
              run_as: "${USER}"
            - check: the auto-config entrypoint script is present and executable at ${HOME}/.local/bin/openwebui-entrypoint
              file:
                file: ${HOME}/.local/bin/openwebui-entrypoint
                exists: true
                mode: "0755"
            - check: the openwebui service is running under the init system
              context:
                - runtime
              service:
                service: openwebui
                running: true
            - check: the Open WebUI web interface answers HTTP 200 on the published port
              timeout: 30s
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/
                status: 200
            - check: the mandatory admin email is injected into the running service environment
              exit_status: 0
              context:
                - runtime
              command: printenv WEBUI_ADMIN_EMAIL
            - agent-check: the rendered landing page presents the Open WebUI sign-in experience for the auto-provisioned admin account, ready to start an LLM chat
            - check: addr=127.0.0.1:${HOST_PORT:8080}
              id: openwebui-port
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:8080}
                reachable: true

openwebui-skill:
    skill:
        name: openwebui
        family: openwebui
        owner: openwebui
        description: |-
            Open WebUI box with auto-configured LLM providers, MCP servers, and Jupyter on port 8080.
            MUST be invoked before building, deploying, configuring, or troubleshooting the openwebui box.
        content: |-
            # Box: openwebui
            
            Open WebUI with auto-configured LLM providers (Ollama, OpenRouter), MCP server discovery, and Jupyter code execution. No manual setup needed — secrets auto-managed via `charly secrets`.
            
            ## Definition
            
            ```yaml
            openwebui:
              base: fedora
              candy:
                - '@github.com/opencharly/layer-agent-forwarding:v2026.237.804'
                - openwebui
                - '@github.com/opencharly/pod-dbus:v2026.235.2115'
                - charly
              ports:
                - "8080:8080"
            ```
            
            ## Candy Stack
            
            | Candy | Purpose |
            |-------|---------|
            | `agent-forwarding` | SSH + GPG agent forwarding into container |
            | `openwebui` | Open WebUI with auto-config entrypoint |
            | `dbus` | D-Bus session bus |
            | `charly` | OpenCharly CLI for in-container management |
            
            ## Quick Start
            
            ```bash
            charly box build openwebui
            charly config openwebui -e OPENROUTER_API_KEY=sk-or-xxx
            charly start openwebui
            # Open http://localhost:8080
            ```
            
            ## Deployment Patterns
            
            ### Standalone with GPG secrets (recommended)
            ```bash
            charly secrets gpg setup
            charly secrets gpg set OPENROUTER_API_KEY sk-or-xxx
            charly box build openwebui
            charly config openwebui --env-file .secrets
            charly start openwebui
            ```
            
            ### With local Ollama
            ```bash
            charly config ollama
            charly config openwebui --env-file .secrets --update-all
            charly start ollama openwebui
            ```
            
            ### Full workstation (Ollama + Jupyter + Browser)
            ```bash
            charly config ollama
            charly config jupyter --update-all
            charly config selkies-desktop --update-all
            charly config openwebui --env-file .secrets --update-all
            charly start ollama jupyter selkies-desktop openwebui
            ```
            
            ## Secrets Management
            
            ```bash
            # Tier 1: Auto-generated infrastructure secrets
            charly secrets list charly/openwebui
            charly secrets get charly/openwebui webui-secret-key
            charly secrets set charly/openwebui admin-password --generate
            
            # Tier 2: User API keys (GPG-encrypted)
            charly secrets gpg set OPENROUTER_API_KEY sk-or-new-key
            charly secrets gpg show
            charly config openwebui --env-file .secrets --update-all
            ```
            
            ## Cross-Container Service Discovery
            
            Deploy alongside provider containers for full functionality:
            
            ```bash
            # 1. Deploy ollama (provides OLLAMA_HOST)
            charly config ollama
            charly start ollama
            
            # 2. Deploy jupyter (provides jupyter MCP server)
            charly config jupyter --update-all
            charly start jupyter
            
            # 3. Deploy openwebui (consumes both)
            charly config openwebui --env-file .secrets --update-all
            charly start openwebui
            ```
            
            Open WebUI receives:
            - `OLLAMA_BASE_URL=http://charly-ollama:11434` — local LLM inference
            - `TOOL_SERVER_CONNECTIONS=[...]` — MCP servers (jupyter + chrome-devtools)
            - `CODE_EXECUTION_ENGINE=jupyter` — code execution via Jupyter
            
            ## Key Candies
            
            - `/charly-openwebui:openwebui` — Auto-config entrypoint, secrets, env_accept, TOOL_SERVER_CONNECTIONS format
            - `/charly-distros:agent-forwarding` — SSH/GPG forwarding
            
            ## Related Boxes
            
            - `/charly-jupyter:jupyter` — deploy alongside for MCP notebooks and code execution
            - `/charly-ollama:ollama` — deploy alongside for local LLM inference
            - `/charly-hermes:hermes` — alternative AI frontend (CLI agent vs web UI)
            - `/charly-selkies:selkies-labwc` — deploy alongside for shared Chrome browser
            
            ## Verification
            
            ```bash
            charly status openwebui
            charly service status openwebui                    # openwebui: RUNNING
            curl -s -o /dev/null -w '%{http_code}' http://localhost:8080   # 200
            charly shell openwebui -c "open-webui version"
            
            # Verify secrets
            charly status openwebui   # the Secrets: line lists the provisioned charly-openwebui-* engine secrets              # webui-secret-key, admin-password
            
            # Verify MCP (inside container process)
            charly cmd openwebui "cat /proc/3/environ" | tr '\0' '\n' | grep TOOL_SERVER_CONNECTIONS
            ```
            
            ## Test Coverage
            
            Latest `charly check live openwebui` run: **24 passed, 0 failed, 0 skipped**.
            Covers: openwebui entrypoint script presence, pixi python + charly binary,
            and deploy-scope: service up, port reachable on `127.0.0.1:${HOST_PORT:8080}`,
            HTTP 200 on `/` (30-second timeout for first-request startup), admin
            email env var injected. See `/charly-check:check` for the framework.
            
            ## Related Skills
            
            - `/charly-openwebui:openwebui` — candy authoring
            - `/charly-check:check` — declarative testing framework
            - `/charly-build:secrets` — WEBUI_ADMIN_PASSWORD + provider API keys
            - `/charly-core:charly-config` — `-e WEBUI_ADMIN_EMAIL=...` deploy-time env setup
            
            ## When to Use This Skill
            
            **MUST be invoked** before building, deploying, configuring, or troubleshooting the openwebui box.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

oracle:
    candy:
        version: 2026.144.1443
        description: |
            Oracle CLI for bundling prompts and running multi-engine AI queries
            Installs the @steipete/oracle npm package globally from package.json,
            placing the oracle executable on PATH at ${HOME}/.npm-global/bin/oracle.
            Requires the nodejs runtime. The binary's presence and its --version
            entrypoint are deterministically verifiable in the built image with no
            network access or API credentials.
        require:
            - nodejs
        plan:
            - check: the oracle executable is installed at ${HOME}/.npm-global/bin/oracle
              file:
                file: ${HOME}/.npm-global/bin/oracle
                exists: true
            - check: running oracle --version exits cleanly
              exit_status: 0
              command: ${HOME}/.npm-global/bin/oracle --version
            - agent-check: the oracle CLI and its nodejs runtime are installed in the image
            - agent-check: a user runs oracle with a fleetdverb prompt against its configured AI engines
            - agent-check: oracle dispatches the prompt to each configured engine and returns their answers

oracle-skill:
    skill:
        name: oracle
        family: coder
        owner: oracle
        description: |-
            Oracle CLI for prompt bundling and multi-engine AI queries.
            Use when working with the oracle candy.
        content: |-
            # oracle -- Prompt bundling CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `package.json` |
            | Depends | `nodejs` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
                candy:
                    base: fedora
                    candy: [oracle]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:nodejs` -- runtime dependency
            - `/charly-openclaw:openclaw-full` -- parent metalayer that bundles oracle
            
            ## Related Commands
            - `/charly-automation:openclaw-deploy` -- gateway/skill configuration
            - `/charly-core:shell` -- run oracle CLI inside the container
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Prompt bundling for AI queries
            - Multi-engine AI query tools
            - The `oracle` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

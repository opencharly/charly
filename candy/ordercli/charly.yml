ordercli:
    candy:
        version: 2026.144.1443
        description: |
            Foodora/Deliveroo/Glovo food-delivery order status from the command line via the ordercli binary.
            Installs the steipete/ordercli Go binary into ${HOME}/go/bin with
            `go install` (require: golang provides the toolchain). The candy is
            verifiable because the installed binary lands at a fixed path, is an
            executable file, and prints its delivery-provider subcommands when
            run with --help; a live order-status query needs Foodora auth and is
            genuinely free-form (agent-graded).
        require:
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
        env:
            GOPATH: "~/go"
        path_append:
            - "~/go/bin"
        plan:
            - run: |
                command=go install github.com/steipete/ordercli/cmd/ordercli@latest
                go clean -cache
              run_as: "${USER}"
              command: |
                go install github.com/steipete/ordercli/cmd/ordercli@latest
                go clean -cache
            - check: the ordercli binary is installed at ${HOME}/go/bin/ordercli
              file:
                file: ${HOME}/go/bin/ordercli
                exists: true
                filetype: file
            - check: running ordercli --help prints its delivery-provider subcommands
              stdout:
                - equals: ran
              exit_status: 0
              command: '${HOME}/go/bin/ordercli --help 2>&1 | grep -qiE "foodora|deliveroo|glovo|usage" && echo ran'
            - agent-check: ordercli authenticates to Foodora and reports the current delivery order status

ordercli-skill:
    skill:
        name: ordercli
        family: tools
        owner: ordercli
        description: |-
            Food delivery order status CLI (Foodora).
            Use when working with the ordercli candy.
        content: |
            # ordercli -- Food delivery order CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (`run:` step) |
            | Depends | `golang` |
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `GOPATH` | `~/go` |
            | PATH append | `~/go/bin` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [ordercli]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:golang` -- build/runtime dependency
            - `/charly-openclaw:openclaw-full` -- parent metalayer that bundles ordercli
            
            ## Related Commands
            - `/charly-core:shell` -- run ordercli inside the container
            - `/charly-automation:openclaw-deploy` -- skill registration in OpenClaw gateway
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Food delivery order tracking
            - Foodora order status
            - The `ordercli` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

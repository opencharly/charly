pipewire:
    candy:
        version: 2026.149.1500
        description: |
            PipeWire audio/media server with PulseAudio compat and WirePlumber, supervised in the container
            Installs the PipeWire media server, the pipewire-pulse PulseAudio
            compatibility shim, the pw-* control utilities, and the WirePlumber
            session manager, then copies a pipewire-wrapper launch script into
            the user's local bin. A user-scope supervisord service runs that
            wrapper, which starts pipewire + wireplumber + pipewire-pulse so
            container desktops (sway-desktop) get working audio. Verifiable by
            the installed binaries, the launch wrapper, and the running service.
        require:
            - supervisord
        distro:
            arch:
                package:
                    - pipewire
                    - pipewire-pulse
                    - wireplumber
            fedora:
                package:
                    - pipewire
                    - pipewire-pulseaudio
                    - pipewire-utils
                    - wireplumber
        service:
            - name: pipewire
              exec: "%(ENV_HOME)s/.local/bin/pipewire-wrapper"
              restart: always
              priority: 5
              start_sec: 2
              enable: true
              # user scope: pipewire/wireplumber need the user session bus + per-user
              # runtime dir. supervisord ignores scope → container render unchanged.
              scope: user
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=pipewire-wrapper
              copy: pipewire-wrapper
              to: "${HOME}/.local/bin/pipewire-wrapper"
              mode: "0755"
              run_as: "${USER}"
            - check: the PipeWire media server binary is installed at /usr/bin/pipewire
              file:
                file: /usr/bin/pipewire
                exists: true
            - check: the WirePlumber session manager binary is installed at /usr/bin/wireplumber
              file:
                file: /usr/bin/wireplumber
                exists: true
            - check: the PulseAudio compatibility shim is installed at /usr/bin/pipewire-pulse
              file:
                file: /usr/bin/pipewire-pulse
                exists: true
            - check: the pw-cli control utility is installed at /usr/bin/pw-cli
              file:
                file: /usr/bin/pw-cli
                exists: true
            - check: the pipewire-wrapper launch script is installed in the user's local bin
              file:
                file: ${HOME}/.local/bin/pipewire-wrapper
                exists: true
            - check: the pipewire service is running under the init system
              context:
                - runtime
              service:
                service: pipewire
                running: true
            - agent-check: the running PipeWire graph exposes a working core that audio clients can query

pipewire-skill:
    skill:
        name: pipewire
        family: selkies
        owner: pipewire
        description: |-
            PipeWire audio and media server with WirePlumber session manager.
            Use when working with audio in containers, PipeWire, or PulseAudio compatibility.
        content: |-
            # pipewire -- Audio/media server for containers
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord` |
            | Service | `pipewire` (supervisord, priority 5) |
            | Install files | `task:`, `pipewire-wrapper` |
            
            ## Environment Variables
            
            | Variable | Value |
            |----------|-------|
            | `XDG_RUNTIME_DIR` | `/tmp` |
            
            ## Packages
            
            - `pipewire` (RPM)
            - `pipewire-pulseaudio` (RPM) -- PulseAudio compatibility
            - `pipewire-utils` (RPM) -- CLI utilities (pw-cli, pw-dump, pw-top, pw-cat, pw-record, pw-play)
            - `wireplumber` (RPM) -- session manager
            
            ## Usage
            
            ```yaml
            # charly.yml -- typically included via sway-desktop composition
            my-desktop:
              candy:
                - pipewire
            ```
            
            ## Used In Boxes
            
            Part of `/charly-selkies:sway-desktop` composition.
            
            ## Related Candies
            
            - `/charly-infrastructure:supervisord` -- process manager dependency
            - `/charly-selkies:sway-desktop` -- composition that includes pipewire
            - `/charly-selkies:wayvnc` -- VNC server (sibling in desktop stack)
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Audio in containers
            - PipeWire or PulseAudio setup
            - WirePlumber session management
            - Desktop audio configuration
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

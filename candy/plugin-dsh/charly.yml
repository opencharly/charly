plugin-dsh:
    candy:
        version: 2026.226.1600
        description: |-
            The `charly dsh` management CLI for a deployed deepseek-harness (dsh)
            box PLUS the declarative `dsh:` check verb — a COMPILED-IN
            command:dsh + verb:dsh plugin. `charly dsh status --box <name>`
            reports the dsh version and web UI health in the box; `profile list`
            lists the profiles under $DSH_HOME/profiles; `plugin list --profile
            <name>` lists a profile's plugins. The command reaches a DEPLOYED box
            over the reverse channel via the plugin-cmd pattern (the
            "pod-lifecycle" host-builder's op="cmd" — compiled-in placement
            required). The `dsh:` check verb is the declarative in-box probe
            counterpart, authored as a `check:` step (`dsh: version`,
            `web-running`, `profile-list`, `plugin-list`): it runs dsh commands
            INSIDE the venue via cc.Exec().RunCapture — the one place plugin-dsh
            diverges from plugin-agentteams' host-based cc.ResolveEndpoint (the
            loopback-bound web UI is probed in-box on 127.0.0.1:3080).
        plugin:
            providers:
                - command:dsh
                - verb:dsh
            source: builtin
        plan:
            - # ADE check: a deterministic build-context check that does NOT depend on the
              # dsh runtime the `charly dsh` command needs. Mirrors
              # plugin-fleet / plugin-example-command — a build-context `command` check
              # running `true`. The full CLI end-to-end (`charly dsh status` /
              # `profile list` against a deployed box) is exercised by the Go e2e +
              # the live R10 bed roster (the check-dsh-pod host steps).
              check: the command:dsh plugin ships a buildable Go module the host compiles into charly and the dsh command tree dispatches; the full `charly dsh` CLI is exercised by the Go e2e + the live R10 bed roster
              id: dsh-module-present
              context:
                - build
              command: "true"
dsh-cli-skill:
    skill:
        name: dsh-cli
        family: tools
        owner: plugin-dsh
        description: |-
            The compiled-in `charly dsh` management CLI for a deployed
            deepseek-harness (dsh) box. MUST be invoked before managing the dsh
            version, profiles, or plugins of a running dsh deployment.
        content: |-
            # dsh-cli

            The compiled-in `charly dsh` management CLI for a deployed
            deepseek-harness (dsh) box — a `command:dsh` plugin. It reaches a
            DEPLOYED box over the reverse channel via the plugin-cmd pattern (the
            "pod-lifecycle" host-builder's op="cmd"), so it requires COMPILED-IN
            placement. Use it to inspect a running dsh deployment: the dsh
            version, the web UI health, the profiles under $DSH_HOME/profiles,
            and a profile's plugins.

            ## Command tree

            - `charly dsh status --box <name> [--instance <name>]` — dsh version + web UI health in the box.
            - `charly dsh profile list --box <name> [--instance <name>]` — profiles under `$DSH_HOME/profiles`.
            - `charly dsh plugin list --box <name> [--instance <name>] --profile <name>` — a profile's plugins (default profile: `web`).

            Every leaf takes `--box <name>` (required) + `--instance`. The
            command's stdout rides the host-held interactive leg straight to the
            operator's terminal; a non-zero exit in the box propagates as the
            command's own exit code.

            ## The `dsh:` check verb

            The plugin ALSO serves the declarative `dsh:` check verb — the
            in-box probe counterpart of the CLI, authored as a `check:` step in
            a candy/box plan. It is IN-BOX (the one place plugin-dsh diverges
            from plugin-agentteams' host-based `cc.ResolveEndpoint`): the
            provider runs dsh commands INSIDE the venue via `cc.Exec()`
            (`cc.Exec()` works under both box and live modes — the built image
            carries the dsh binary + $DSH_HOME layout). Methods:

            - `dsh: version` — `dsh --version` in the venue (build + deploy context).
            - `dsh: web-running` — probe `http://127.0.0.1:3080/` in-box via curl
              (deploy context; skips under `charly check box` — no running
              service on a disposable `podman run --rm`).
            - `dsh: profile-list` — list profiles under `$DSH_HOME/profiles` (build + deploy context).
            - `dsh: plugin-list` — list plugins for a profile (`profile: <name>`,
              default `web`) via `dsh plugin --profile <name> list` (build + deploy context).

            The verb's method + method-exclusive modifiers ride the desugared
            plugin input, validated at runtime against the served `#DshInput`
            schema.

            ## Example

            ```
            charly dsh status --box my-dsh-box
            charly dsh profile list --box my-dsh-box
            charly dsh plugin list --box my-dsh-box --profile web
            ```

            ## Cross-References

            - `/charly-tools:dsh` — the dsh candy: the npm-installed CLI + the socat-exposed web service.
            - `/charly-internals:plugin` — compiled-in command plugins, the provider model.

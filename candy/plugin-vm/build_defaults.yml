# build_defaults.yml — the OVMF firmware tables this out-of-process plugin resolves
# firmware paths from. It is embedded (vm_phaseA_shims.go) because the plugin runs as its
# own process and cannot reach charly core's //go:embed.
#
# It carries ONLY the two keys the resolver actually decodes: ovmf_paths and
# ovmf_distro_aliases (sdk/vmshared/ovmf_paths.go, reached via the
# vmshared.UnmarshalEmbeddedDefaults seam — the file's single consumer).
#
# It previously carried a near-complete copy of charly/charly.yml — 28 top-level keys,
# 1273 lines, including the entire distro build vocabulary — of which 26 keys were read
# by NOTHING. That dead copy was a standing R3 trap: it read as a vocabulary that had to
# be kept in sync with core's, so a distro added to core looked like it needed adding here
# too, and adding it changed no behaviour whatsoever. build_defaults_keys_test.go fails if
# a third top-level key reappears.

ovmf_paths:
    fedora:
        secure:
            - {code: /usr/share/OVMF/OVMF_CODE.secboot.fd, vars: /usr/share/OVMF/OVMF_VARS.secboot.fd}
            - {code: /usr/share/edk2/ovmf/OVMF_CODE.secboot.fd, vars: /usr/share/edk2/ovmf/OVMF_VARS.secboot.fd}
        nonsecure:
            - {code: /usr/share/OVMF/OVMF_CODE.fd, vars: /usr/share/OVMF/OVMF_VARS.fd}
            - {code: /usr/share/edk2/ovmf/OVMF_CODE.fd, vars: /usr/share/edk2/ovmf/OVMF_VARS.fd}
    arch:
        secure:
            - {code: /usr/share/edk2/x64/OVMF_CODE.secboot.4m.fd, vars: /usr/share/edk2/x64/OVMF_VARS.4m.fd}
            - {code: /usr/share/edk2-ovmf/x64/OVMF_CODE.secboot.fd, vars: /usr/share/edk2-ovmf/x64/OVMF_VARS.fd}
        nonsecure:
            - {code: /usr/share/edk2/x64/OVMF_CODE.4m.fd, vars: /usr/share/edk2/x64/OVMF_VARS.4m.fd}
            - {code: /usr/share/edk2-ovmf/x64/OVMF_CODE.fd, vars: /usr/share/edk2-ovmf/x64/OVMF_VARS.fd}
    debian:
        secure:
            - {code: /usr/share/OVMF/OVMF_CODE_4M.ms.fd, vars: /usr/share/OVMF/OVMF_VARS_4M.ms.fd}
            - {code: /usr/share/OVMF/OVMF_CODE.secboot.fd, vars: /usr/share/OVMF/OVMF_VARS.secboot.fd}
        nonsecure:
            - {code: /usr/share/OVMF/OVMF_CODE_4M.fd, vars: /usr/share/OVMF/OVMF_VARS_4M.fd}
            - {code: /usr/share/OVMF/OVMF_CODE.fd, vars: /usr/share/OVMF/OVMF_VARS.fd}
# device_descriptions — host device path -> human description for `charly doctor`'s
# hardware section, formerly the Go var deviceDescriptions (doctor.go).

ovmf_distro_aliases:
    fedora: fedora
    centos: fedora
    rhel: fedora
    rocky: fedora
    alma: fedora
    arch: arch
    manjaro: arch
    endeavouros: arch
    debian: debian
    ubuntu: debian

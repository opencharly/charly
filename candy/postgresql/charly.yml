postgresql:
    candy:
        version: 2026.144.1531
        description: |
            A Docker-compatible PostgreSQL server that self-initializes its cluster and accepts client connections.
            Installs the PostgreSQL server (postgres, initdb, pg_ctl), the psql
            client + pg_isready readiness probe, and the pgvector similarity-search
            extension. A generated entrypoint wrapper
            (/usr/local/bin/postgresql-entrypoint.sh) performs first-run initdb,
            database creation, password handling, and /docker-entrypoint-initdb.d
            processing, then execs the server on a unix socket under ~/.postgresql
            listening on 127.0.0.1:5432. Every behaviour below is observable: the
            binaries on disk, the executable entrypoint, and a live server whose
            cluster was initialized and that answers pg_isready. Deploy-scope steps
            stay auth-independent so the scenario holds for every box composing this
            candy (consumers such as immich override POSTGRES_USER/POSTGRES_DB).
        require: []
        distro:
            arch:
                # Arch `postgresql` ships the server (postgres, initdb, pg_ctl); psql,
                # pg_isready and pg_config come from postgresql-libs (a hard dependency,
                # pulled transitively). pgvector moved from the AUR into the
                # official `extra` repo (extra/pgvector), so it installs as a
                # plain pacman package — no aur builder stage.
                package:
                    - postgresql
                    - pgvector
            fedora:
                package:
                    - postgresql-server
                    - postgresql-contrib
                    - pgvector
        env:
            PGDATA: "~/.postgresql/data"
            POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
        port:
            - 5432
        volume:
            - name: pgdata
              path: "~/.postgresql/data"
        service:
            - name: postgresql
              exec: /usr/local/bin/postgresql-entrypoint.sh
              restart: always
              priority: 10
              enable: true
              scope: system
        plan:
            - run: |
                command=mkdir -p /home/user/.postgresql
                chown 1000:1000 /home/user/.postgresql
                mkdir -p /docker-entrypoint-initdb.d
              run_as: root
              command: |
                mkdir -p /home/user/.postgresql
                chown 1000:1000 /home/user/.postgresql
                mkdir -p /docker-entrypoint-initdb.d
            - run: write=/usr/local/bin/postgresql-entrypoint.sh
              write: /usr/local/bin/postgresql-entrypoint.sh
              run_as: root
              mode: "0755"
              content: |
                #!/bin/bash
                set -euo pipefail

                HOME=${HOME:-/home/user}
                POSTGRES_USER=${POSTGRES_USER:-postgres}
                POSTGRES_DB=${POSTGRES_DB:-$POSTGRES_USER}
                POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
                PGDATA=${PGDATA:-$HOME/.postgresql/data}
                PGDATA="${PGDATA/#~/$HOME}"
                SOCKET_DIR="$HOME/.postgresql"

                # Docker-compatible: read password from file
                if [ -n "${POSTGRES_PASSWORD_FILE:-}" ] && [ -f "$POSTGRES_PASSWORD_FILE" ]; then
                    POSTGRES_PASSWORD=$(cat "$POSTGRES_PASSWORD_FILE")
                    export POSTGRES_PASSWORD
                fi

                # Password required unless trust auth
                if [ "${POSTGRES_HOST_AUTH_METHOD}" != "trust" ] && [ -z "${POSTGRES_PASSWORD:-}" ]; then
                    echo "Error: POSTGRES_PASSWORD is required (or set POSTGRES_HOST_AUTH_METHOD=trust)" >&2
                    exit 1
                fi

                # Initialize cluster only on first run
                if [ ! -f "$PGDATA/PG_VERSION" ]; then
                    echo "Initializing PostgreSQL cluster in $PGDATA..."
                    mkdir -p "$PGDATA" "$SOCKET_DIR"

                    INITDB_ARGS=(-D "$PGDATA" --username="$POSTGRES_USER"
                                 --encoding=UTF8 --locale=C
                                 --auth-host="$POSTGRES_HOST_AUTH_METHOD"
                                 --auth-local=trust)

                    [ -n "${POSTGRES_INITDB_ARGS:-}" ]   && INITDB_ARGS+=($POSTGRES_INITDB_ARGS)
                    [ -n "${POSTGRES_INITDB_WALDIR:-}" ] && INITDB_ARGS+=(--waldir="$POSTGRES_INITDB_WALDIR")

                    if [ "${POSTGRES_HOST_AUTH_METHOD}" != "trust" ] && [ -n "${POSTGRES_PASSWORD:-}" ]; then
                        PWFILE=$(mktemp)
                        chmod 600 "$PWFILE"
                        echo "$POSTGRES_PASSWORD" > "$PWFILE"
                        INITDB_ARGS+=(--pwfile="$PWFILE")
                        trap 'rm -f "$PWFILE"' EXIT
                    fi

                    initdb "${INITDB_ARGS[@]}"

                    SPL_OPTS=""
                    if [ -n "${POSTGRES_SHARED_PRELOAD_LIBRARIES:-}" ]; then
                        SPL_OPTS="-c shared_preload_libraries=$POSTGRES_SHARED_PRELOAD_LIBRARIES"
                    fi

                    pg_ctl -D "$PGDATA" -o "-c unix_socket_directories=$SOCKET_DIR -c listen_addresses='' $SPL_OPTS" -w start

                    if [ "$POSTGRES_DB" != "postgres" ]; then
                        psql -v ON_ERROR_STOP=1 --username="$POSTGRES_USER" --host="$SOCKET_DIR" postgres \
                            -c "CREATE DATABASE \"$POSTGRES_DB\"" \
                            -c "GRANT ALL PRIVILEGES ON DATABASE \"$POSTGRES_DB\" TO \"$POSTGRES_USER\"" \
                            -c "ALTER DATABASE \"$POSTGRES_DB\" OWNER TO \"$POSTGRES_USER\""
                    fi

                    for f in /docker-entrypoint-initdb.d/*; do
                        [ -e "$f" ] || continue
                        echo "Running init script: $f"
                        case "$f" in
                            *.sh)     bash "$f" ;;
                            *.sql)    psql -v ON_ERROR_STOP=1 --username="$POSTGRES_USER" --host="$SOCKET_DIR" --dbname="$POSTGRES_DB" < "$f" ;;
                            *.sql.gz) gunzip -c "$f" | psql -v ON_ERROR_STOP=1 --username="$POSTGRES_USER" --host="$SOCKET_DIR" --dbname="$POSTGRES_DB" ;;
                            *)        echo "Ignoring: $f" ;;
                        esac
                    done

                    pg_ctl -D "$PGDATA" -m fast -w stop
                    echo "PostgreSQL initialization complete."
                fi

                mkdir -p "$SOCKET_DIR"
                POSTGRES_ARGS=(-D "$PGDATA" -c "unix_socket_directories=$SOCKET_DIR" -c "listen_addresses=127.0.0.1")
                if [ -n "${POSTGRES_SHARED_PRELOAD_LIBRARIES:-}" ]; then
                    POSTGRES_ARGS+=(-c "shared_preload_libraries=$POSTGRES_SHARED_PRELOAD_LIBRARIES")
                fi
                exec /usr/bin/postgres "${POSTGRES_ARGS[@]}"
            - check: the PostgreSQL server binary is installed
              file:
                file: /usr/bin/postgres
                exists: true
            - check: the psql client binary is installed
              file:
                file: /usr/bin/psql
                exists: true
            - check: the initdb cluster-bootstrap tool is installed
              file:
                file: /usr/bin/initdb
                exists: true
            - check: the pg_isready readiness probe is installed
              file:
                file: /usr/bin/pg_isready
                exists: true
            - check: the Docker-compatible entrypoint wrapper is present and executable
              file:
                file: /usr/local/bin/postgresql-entrypoint.sh
                exists: true
                mode: "0755"
            - check: the pgvector similarity-search extension package is installed
              package:
                package: pgvector
                installed: true
            - check: the entrypoint initialized the cluster data directory on first run
              exit_status: 0
              context:
                - runtime
              command:
                command: test -f ${HOME}/.postgresql/data/PG_VERSION
                in_container: true
            - check: the running server reports ready on its unix socket
              exit_status: 0
              context:
                - runtime
              command:
                command: pg_isready -h ${HOME}/.postgresql
                in_container: true
            - check: package=postgresql-server
              id: postgresql-package
              package:
                package: postgresql-server
                package_map:
                    arch: postgresql
                installed: true
            - check: service=postgresql
              id: postgresql-service-running
              context:
                - runtime
              service:
                service: postgresql
                running: true

postgresql-skill:
    skill:
        name: postgresql
        family: infrastructure
        owner: postgresql
        description: |-
            PostgreSQL database server on port 5432 with pgvector extension and persistent data.
            Entrypoint supports POSTGRES_SHARED_PRELOAD_LIBRARIES for extension loading.
            Use when working with PostgreSQL, database configuration, or pgvector.
        content: |
            # postgresql -- PostgreSQL database server
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | none |
            | Ports | 5432 |
            | Volumes | `pgdata` -> `~/.postgresql/data` |
            | Service | `postgresql` (supervisord, priority 10) |
            | Install files | `plan:` |
            
            ## Environment Variables
            
            | Variable | Value |
            |----------|-------|
            | `PGDATA` | `~/.postgresql/data` |
            | `POSTGRES_HOST_AUTH_METHOD` | `scram-sha-256` |
            | `POSTGRES_SHARED_PRELOAD_LIBRARIES` | *(optional)* — comma-separated `.so` names loaded at startup |
            
            The entrypoint also reads these variables (with defaults, not set in charly.yml):
            - `POSTGRES_USER` (default: `postgres`) — set by consuming candies (e.g., immich sets `immich`)
            - `POSTGRES_DB` (default: `$POSTGRES_USER`) — set by consuming candies
            - `POSTGRES_PASSWORD` — required unless `POSTGRES_HOST_AUTH_METHOD=trust`
            
            ## Service Environment (injected into other containers)
            
            | Variable | Template Value | Resolved Example |
            |----------|---------------|-----------------|
            | `PGHOST` | `{{.ContainerName}}` | `charly-postgresql` |
            | `PGPORT` | `5432` | `5432` |
            
            Pod-aware: same-container consumers receive `PGHOST=localhost`, cross-container consumers receive `PGHOST=charly-postgresql`. When `charly config` runs, these are automatically injected into the global `charly.yml` env for PostgreSQL service discovery.
            
            See `/charly-image:layer` for `env_provide` field docs.
            
            ## Packages
            
            The candy is multi-distro:
            
            - **RPM (Fedora):** `postgresql-server`, `postgresql-contrib`, `pgvector` (vector similarity search extension)
            - **PAC (Arch/CachyOS):** `postgresql`, `postgresql-libs` — the Arch `postgresql` package ships the server + contrib tooling; pgvector on Arch is built from the AUR (see `/charly-infrastructure:vectorchord`).
            
            ## Usage
            
            ```yaml
            # charly.yml — a box composes postgresql via an inline candy: list in its body
            my-image:
              candy:
                base: fedora
                candy: [postgresql]
            ```
            
            ## Used In Boxes
            
            - `/charly-immich:immich`
            - `/charly-immich:immich-ml`
            
            ## Entrypoint Features
            
            The custom entrypoint (`/usr/local/bin/postgresql-entrypoint.sh`) supports:
            
            - **First-run initialization** — `initdb`, database creation, and `/docker-entrypoint-initdb.d/` scripts
            - **Password management** — `POSTGRES_PASSWORD` or `POSTGRES_PASSWORD_FILE`
            - **`POSTGRES_SHARED_PRELOAD_LIBRARIES`** — when set, adds `-c shared_preload_libraries=...` to both the init-phase temp server and the final exec. Used by the `vectorchord` candy to load `vchord.so`. Generic mechanism — any extension candy can use it.
            
            ## Related Candies
            
            - `/charly-immich:immich` -- primary consumer (depends on postgresql)
            - `/charly-infrastructure:vectorchord` -- sets `POSTGRES_SHARED_PRELOAD_LIBRARIES=vchord.so`
            - `/charly-infrastructure:redis` -- often paired with postgresql in service stacks
            
            ## Related Commands
            
            - `/charly-core:charly-config` — Deploy with secrets provisioning (db-password)
            - `/charly-build:secrets` — Manage database credentials
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - PostgreSQL database setup in containers
            - pgvector extension
            - Database volume or `PGDATA` configuration
            - Port 5432 service
            - Database initialization
            
            ## Related
            
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

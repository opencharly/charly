python-ml:
    candy:
        version: 2026.144.1443
        description: |
            A CUDA-ready Python 3.13 ML environment with PyTorch, transformers, and a vLLM inference runtime
            The python-ml candy owns the pixi.toml that builds the core ML
            Python environment under ~/.pixi/envs/default: PyTorch (cu130),
            torchvision/torchaudio, transformers, accelerate and the full vLLM
            runtime-dependency closure. After the pixi environment is built, a
            user-phase task pip-installs the vLLM nightly wheel (--no-deps) into
            that same interpreter. Every interpreter and library lands at a
            fixed path under ~/.pixi/envs/default, so its presence and
            importability are directly checkable.
        require:
            - '@github.com/opencharly/layer-cuda:v2026.235.2110'
        candy:
            - llama-cpp
        env:
            NVIDIA_PYTHON_PROJECT: "~/.pixi"
            LD_LIBRARY_PATH: "/usr/lib64:$HOME/llama.cpp"
        plan:
            - run: |
                command=~/.pixi/envs/default/bin/python -m pip install --no-deps \
                  'https://wheels.vllm.ai/f53fa26e05c476a43f6db048a9e3b43bcb2b72fb/vllm-0.19.1rc1.dev39%2Bgf53fa26e0.cu130-cp38-abi3-manylinux_2_35_x86_64.whl'
              run_as: "${USER}"
              command: |
                ~/.pixi/envs/default/bin/python -m pip install --no-deps \
                  'https://wheels.vllm.ai/f53fa26e05c476a43f6db048a9e3b43bcb2b72fb/vllm-0.19.1rc1.dev39%2Bgf53fa26e0.cu130-cp38-abi3-manylinux_2_35_x86_64.whl'
            - check: the pixi default-environment Python interpreter is present
              file:
                file: ${HOME}/.pixi/envs/default/bin/python
                exists: true
            - check: PyTorch imports inside the pixi environment and prints its version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: ${HOME}/.pixi/envs/default/bin/python -c "import torch; print(torch.__version__)"
            - check: the transformers library imports inside the pixi environment and prints its version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: ${HOME}/.pixi/envs/default/bin/python -c "import transformers; print(transformers.__version__)"
            - check: the vLLM nightly wheel installed by the user-phase task imports and prints its version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: ${HOME}/.pixi/envs/default/bin/python -c "import vllm; print(vllm.__version__)"
            - check: command=${HOME}/.pixi/envs/default/bin/python -c "import torch; print(torch.__version__)"
              id: python-ml-torch-importable
              exit_status: 0
              command: ${HOME}/.pixi/envs/default/bin/python -c "import torch; print(torch.__version__)"
            - check: command=${HOME}/.pixi/envs/default/bin/python -c "import vllm; print(vllm.__version__)"
              id: python-ml-vllm-importable
              exit_status: 0
              command: ${HOME}/.pixi/envs/default/bin/python -c "import vllm; print(vllm.__version__)"
            - check: command=${HOME}/.pixi/envs/default/bin/python -c "import transformers; print(transformers.__version__)"
              id: python-ml-transformers-importable
              exit_status: 0
              command: ${HOME}/.pixi/envs/default/bin/python -c "import transformers; print(transformers.__version__)"

python-ml-skill:
    skill:
        name: python-ml
        family: languages
        owner: python-ml
        description: |-
            GPU-accelerated Python ML environment with CUDA, PyTorch, and llama.cpp.
            No Jupyter server — use as a base for ML workloads or interactive shell.
            MUST be invoked before building, deploying, configuring, or troubleshooting the python-ml box.
        content: |
            # python-ml
            
            GPU-accelerated Python environment with ML libraries — PyTorch, transformers, vLLM, llama.cpp.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | nvidia |
            | Candies | agent-forwarding, python-ml |
            | Platforms | linux/amd64 |
            | Registry | ghcr.io/opencharly |
            
            ## Candy Composition
            
            The `python-ml` candy is a **Tier 2 environment-owner meta-layer** that:
            1. Owns the pixi.toml (core ML Python environment)
            2. Composes `llama-cpp` (Tier 1 sub-candy) via `candy: [llama-cpp]`
            3. Installs vLLM 0.19 wheel via a cmd task (after pixi env is established)
            
            Build order: pixi environment → llama-cpp (binaries) → vLLM 0.19 wheel
            
            ## Full Candy Stack
            
            1. `fedora` → `nvidia` (CUDA base)
            2. `pixi` → `python` (transitive)
            3. `python-ml` — ML pixi environment (Tier 2, owns pixi.toml)
            4. `llama-cpp` — llama.cpp binaries (Tier 1, via `candy:` field)
            
            ## Quick Start
            
            ```bash
            charly box build python-ml
            charly shell python-ml
            # python -c "import torch; print(torch.cuda.is_available())"
            ```
            
            ## Key Candies
            
            - `/charly-languages:python-ml` — ML Python packages via pixi (Tier 2 meta-layer)
            - `/charly-jupyter:llama-cpp` — llama.cpp binaries (sub-candy)
            - `/charly-distros:cuda` — GPU support (via nvidia base)
            
            ## Related Boxes
            
            - `/charly-distros:nvidia` — parent (GPU without ML packages)
            - `/charly-jupyter:jupyter-ml` — adds JupyterLab + collaboration + MCP + unsloth on top of ML stack
            - `/charly-jupyter:jupyter` — legacy Jupyter with ML stack (monolithic)
            - `/charly-jupyter:unsloth-studio` — fine-tuning UI with similar ML stack
            
            ## Verification
            
            After `charly box build`:
            - `charly shell python-ml -c "python -c 'import torch; print(torch.cuda.is_available())'"` — CUDA OK
            - `charly shell python-ml -c "python -c 'import vllm; print(vllm.__version__)'"` — vLLM OK
            - `charly shell python-ml -c "ls ~/llama.cpp/llama-quantize"` — llama.cpp OK
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the python-ml box, ML training environments, or GPU-accelerated Python. Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

python:
    candy:
        version: 2026.144.1443
        description: |
            A CPython 3.13 interpreter provided as a pixi-managed conda-forge environment.
            The python candy ships a pixi.toml that pins python >=3.13,<3.14 from
            conda-forge. A pixi builder stage materializes the environment at
            ~/.pixi/envs/default, so the CPython interpreter lands at a fixed,
            PATH-contributed path. It is verifiable by file existence, the version
            it reports, and by running real standard-library code through it.
        require:
            - pixi
        plan:
            - check: the pixi-managed CPython interpreter exists at the default environment bin path
              file:
                file: ${HOME}/.pixi/envs/default/bin/python
                exists: true
            - check: the interpreter reports a CPython 3.13 version
              exit_status: 0
              stdout:
                - contains: "3.13"
              command: ${HOME}/.pixi/envs/default/bin/python --version
            - check: the interpreter executes a standard-library snippet (incl. the sqlite3 C extension) and reports major.minor 3 13
              exit_status: 0
              stdout:
                - contains: "3 13"
              command: ${HOME}/.pixi/envs/default/bin/python -c "import sys, json, sqlite3; print(sys.version_info.major, sys.version_info.minor)"

python-skill:
    skill:
        name: python
        family: languages
        owner: python
        description: |-
            Python 3.13 runtime installed via pixi (conda-forge).
            Use when working with Python, pixi environments, or Python dependencies.
        content: |
            # python -- Python 3.13 via pixi
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `pixi` |
            | Install files | `charly.yml`, `pixi.toml` |
            
            ## Packages
            
            Pixi (conda-forge): `python >=3.13,<3.14`
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - python
            ```
            
            ## Used In Boxes
            
            - Transitive dependency via `supervisord` in most service boxes (`openclaw`, `jupyter`, `ollama`, `comfyui`, `immich`, etc.)
            
            ## Related Candies
            
            - `/charly-languages:pixi` -- required dependency (provides pixi binary)
            - `/charly-languages:python-ml` -- ML-focused Python with CUDA support
            - `/charly-coder:language-runtimes` -- depends on python
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Python runtime in containers
            - Pixi-managed Python installation
            - The `python` candy
            - Why `pip install` and `conda install` are not used (pixi is the only Python package manager)
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

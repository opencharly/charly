qemu-guest-agent:
    candy:
        version: 2026.149.1200
        description: |
            QEMU guest agent — full host↔guest control channel with an application-consistent fsfreeze snapshot hook.
            Installs the qemu-guest-agent package (identical name on Arch/CachyOS
            and Fedora), enables the system service, and writes
            /etc/qemu/qemu-ga.conf pinning the full RPC surface (guest-exec,
            guest-file-*, guest-fsfreeze-*, guest-set-* — the package default
            blocks none). The fsfreeze hook dispatcher runs every executable in
            /etc/qemu/fsfreeze-hook.d/ on freeze/thaw so the host can take
            application-consistent snapshots. Every artifact — the qemu-ga
            binary, the package, the config, the executable dispatcher and its
            drop-in dir — is file- and command-checkable inside the built image.
            The guest-side virtio-serial channel (`org.qemu.guest_agent.0`) is
            declared on the VM ENTITY, not this candy — see the vm-libvirt
            deploy's own `libvirt.devices.channels:`.
        package:
            - qemu-guest-agent
        service:
            - name: qemu-guest-agent
              use_packaged: qemu-guest-agent.service
              enable: true
              scope: system
        plan:
            - run: mkdir=/etc/qemu/fsfreeze-hook.d
              mkdir: /etc/qemu/fsfreeze-hook.d
              run_as: root
            - run: write=/etc/qemu/fsfreeze-hook
              write: /etc/qemu/fsfreeze-hook
              run_as: root
              mode: "0755"
              content: |
                #!/bin/sh
                # OpenCharly-managed qemu-ga fsfreeze hook dispatcher.
                set -e
                command="$1"
                case "$command" in
                    freeze|thaw) ;;
                    *) echo "usage: $0 freeze|thaw" >&2; exit 1 ;;
                esac
                FSFREEZE_D=/etc/qemu/fsfreeze-hook.d
                [ -d "$FSFREEZE_D" ] || exit 0
                for hook in "$FSFREEZE_D"/*; do
                    [ -f "$hook" ] && [ -x "$hook" ] && "$hook" "$command"
                done
                exit 0
            - run: write=/etc/qemu/qemu-ga.conf
              write: /etc/qemu/qemu-ga.conf
              run_as: root
              mode: "0644"
              content: |
                # OpenCharly: full guest-agent functionality. No RPCs are blocked
                # (guest-exec, guest-file-*, guest-fsfreeze-*, guest-set-* all work).
                [general]
                fsfreeze-hook=/etc/qemu/fsfreeze-hook
            - check: the qemu-ga daemon binary is installed at /usr/bin/qemu-ga
              file:
                file: /usr/bin/qemu-ga
                exists: true
            - check: the cross-distro qemu-guest-agent package is installed
              package:
                package: qemu-guest-agent
                installed: true
            - check: the fsfreeze hook dispatcher is installed and references its drop-in dir
              file:
                file: /etc/qemu/fsfreeze-hook
                contains: "fsfreeze-hook.d"
            - check: the per-application freeze/thaw drop-in directory exists
              file:
                file: /etc/qemu/fsfreeze-hook.d
                filetype: directory
            - check: freezing filesystems with no hooks installed runs the dispatcher and exits 0
              exit_status: 0
              command: /etc/qemu/fsfreeze-hook freeze
            - check: the guest-agent config wires in the fsfreeze hook
              file:
                file: /etc/qemu/qemu-ga.conf
                contains: "fsfreeze-hook=/etc/qemu/fsfreeze-hook"
            - check: the config documents that no guest-agent RPCs are blocked
              file:
                file: /etc/qemu/qemu-ga.conf
                contains: "No RPCs are blocked"
            - check: file=/etc/qemu/qemu-ga.conf
              id: qemu-ga-config
              file:
                file: /etc/qemu/qemu-ga.conf
                contains: "fsfreeze-hook"

qemu-guest-agent-skill:
    skill:
        name: qemu-guest-agent
        family: distros
        owner: qemu-guest-agent
        description: |-
            QEMU guest agent for host-guest communication in virtual machines.
            Use when working with QEMU/KVM VMs, guest agent setup, or libvirt channel configuration.
        content: |
            # qemu-guest-agent -- QEMU guest agent
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` |
            
            ## Packages
            
            - `qemu-guest-agent` -- QEMU guest agent daemon. The package name is identical on
              Arch/CachyOS (`pac`) and Fedora (`rpm`), so the top-level `package:` covers both
              — this is a cross-distro candy, not RPM-only.
            
            ## Full functionality (all RPCs + fsfreeze)
            
            The candy exposes the **complete** guest-agent surface — `guest-exec`,
            `guest-file-*`, `guest-fsfreeze-*`, `guest-set-*`. The package default blocks no
            RPCs; the candy's `/etc/qemu/qemu-ga.conf` makes that explicit and turns on the
            **fsfreeze hook** (the one capability not active by default), so the host can take
            application-consistent snapshots. The hook is a standard dispatcher
            (`/etc/qemu/fsfreeze-hook`) that runs every executable in
            `/etc/qemu/fsfreeze-hook.d/` with `freeze`/`thaw`; drop per-app scripts there.
            
            The candy also enables the `qemu-guest-agent.service` (system scope) and
            contributes the virtio-serial channel (below). On a `kind: vm` entity the channel
            is usually declared structurally instead — `channels: [{type: unix, name:
            org.qemu.guest_agent.0}]` (see `/charly-internals:libvirt-renderer`).
            
            ## Usage
            
            ```yaml
            # charly.yml -- add to a bootc image's layer list
            my-vm-image:
              bootc: true
              candy:
                - qemu-guest-agent
            # or applied to a VM guest at deploy time:
            #   charly fleet add vm:<name> qemu-guest-agent
            ```
            
            ## Used In Boxes
            
            Composed into bootc images directly, or applied to a VM guest at deploy time (`charly fleet add vm:<name> qemu-guest-agent`).
            
            ## virtio-serial channel (libvirt XML contribution)
            
            The candy contributes a raw libvirt XML snippet that the libvirt renderer places in the VM's `<devices>` section:
            
            ```xml
            <channel type='unix'>
              <target type='virtio' name='org.qemu.guest_agent.0'/>
            </channel>
            ```
            
            Emitted in `charly.yml` as:
            
            ```yaml
            libvirt:
              snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"
            ```
            
            This is the `/` classification case: `isDeviceElement` flags it as device-scoped, so the renderer injects it inside `<devices>` rather than before `</domain>`. See `/charly-internals:libvirt-renderer` for the injection pipeline and `/charly-vm:vm` for the QEMU-user-net caveat (the agent shows as enabled/inactive under `charly`'s QEMU backend; libvirt backend activates it).
            
            ## Related Candies
            
            - `/charly-coder:sshd` -- SSH server (commonly paired in bootc/VM images)
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - QEMU guest agent installation
            - Host-guest communication in VMs
            - Libvirt virtio channel configuration
            - The `org.qemu.guest_agent.0` channel
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations, `libvirt.snippets:`)
            - `/charly-vm:vm` — VM lifecycle; bootc VM caveats; QEMU-user-net limitation
            - `/charly-vm:vms-catalog` — `kind: vm` entity schema that consumes this candy's contribution
            - `/charly-internals:libvirt-renderer` — renderer that injects this candy's snippet into `<devices>`
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

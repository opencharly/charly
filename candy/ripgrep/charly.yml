ripgrep:
    candy:
        version: 2026.144.1443
        description: |
            Fast recursive text search (rg)
            Installs the ripgrep package, which provides the `rg` binary at
            /usr/bin/rg — a fast recursive grep that honours .gitignore by
            default. Verifiable end to end: the binary lands at a fixed path,
            `rg --version` reports a parseable version on stdout, and `rg`
            returns the matching line (exit 0) for a present pattern and
            exit 1 for an absent one.
        package:
            - ripgrep
        plan:
            - check: the rg binary is installed at /usr/bin/rg
              file:
                file: /usr/bin/rg
                exists: true
            - check: rg reports a parseable ripgrep version on stdout
              exit_status: 0
              stdout:
                - matches: "ripgrep [0-9]"
              command: rg --version
            - check: rg prints the matching line for a pattern present in piped input
              exit_status: 0
              stdout:
                - contains: beta
              command: printf 'alpha\nbeta\ngamma\n' | rg beta
            - check: rg exits 1 (no match) when the pattern is absent, never matching spuriously
              exit_status: 0
              command: printf 'alpha\nbeta\n' | rg ZZZ-no-such-pattern; test $? -eq 1
            - check: package=ripgrep
              id: ripgrep-package
              package:
                package: ripgrep
                installed: true
            - check: command=printf 'needle-in-haystack\nother-line\n' | rg needle
              id: ripgrep-search-matches
              exit_status: 0
              stdout:
                - contains: needle-in-haystack
              command: printf 'needle-in-haystack\nother-line\n' | rg needle

ripgrep-skill:
    skill:
        name: ripgrep
        family: tools
        owner: ripgrep
        description: |-
            Fast recursive text search (rg).
            Use when working with the ripgrep candy.
        content: |
            # ripgrep -- Fast text search
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (packages only) |
            | Depends | none |
            
            ## Packages
            
            RPM: `ripgrep`
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [ripgrep]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:dev-tools` -- bundles ripgrep alongside other CLI utilities
            - `/charly-openclaw:openclaw-full` -- parent metalayer that bundles ripgrep
            
            ## Related Commands
            - `/charly-core:shell` -- run rg interactively inside the container
            - `/charly-core:cmd` -- one-shot rg invocation in a running service
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - ripgrep (rg) in containers
            - Fast text search tools
            - The `ripgrep` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

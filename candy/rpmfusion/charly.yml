rpmfusion:
    candy:
        version: 2026.227.0830
        description: |
            Enables the RPM Fusion free and nonfree Fedora repositories.
            Installs the rpmfusion-free-release and rpmfusion-nonfree-release
            packages from download.rpmfusion.org with their OpenPGP signatures
            VERIFIED, by importing the RPM Fusion keys from Fedora's own signed
            distribution-gpg-keys package first. Each release package registers
            its RPM Fusion repo definitions under /etc/yum.repos.d/ and drops the
            repo signing-key FILES under /etc/pki/rpm-gpg/ — it does NOT import
            them into the rpm database, which is why the key-import step in the
            plan below is a separate step rather than a side effect. Verifiable
            because both
            release packages land in the rpm database, their .repo files appear
            on disk, and the imported keys are queryable via rpm -q gpg-pubkey.
        require: []
        plan:
            # The release packages are fetched as URLs, which dnf treats as the
            # @commandline repo and — with default settings — installs WITHOUT an
            # OpenPGP check, printing "skipped OpenPGP checks for 2 packages". A
            # warning is not a pass (R1), and the naive fixes are all worse: the
            # RPM Fusion keys are distributed ONLY inside these very packages
            # (rpmfusion.org publishes no standalone key file — every documented
            # URL 404s), so extracting the key from the unverified rpm would be
            # circular, and --nogpgcheck would hide the warning rather than remove
            # its cause.
            #
            # The trust chain upstream documents (rpmfusion.org/keys) is real and
            # non-circular: Fedora's OWN signed repo ships distribution-gpg-keys,
            # which carries the RPM Fusion keys; importing from there lets
            # localpkg_gpgcheck=1 verify the release rpms for real. Proven in a
            # throwaway fedora:43 container — the warning disappears and the
            # install exits 0.
            - run: import the RPM Fusion keys from Fedora's signed distribution-gpg-keys, then install both release packages with their signatures verified
              run_as: root
              command: |
                dnf install -y distribution-gpg-keys
                rpmkeys --import \
                  /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-$(rpm -E %fedora) \
                  /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-$(rpm -E %fedora)
                dnf install -y --setopt=localpkg_gpgcheck=1 \
                  https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm \
                  https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
            - check: the RPM Fusion free signing key is in the rpm database, proving the release packages were verified rather than trusted blind
              id: rpmfusion-key-imported
              exit_status: 0
              stdout:
                - contains: rpmfusion
              command: rpm -q gpg-pubkey --qf '%{SUMMARY}\n'
            - check: the RPM Fusion free repo definition file is present on disk
              file:
                file: /etc/yum.repos.d/rpmfusion-free.repo
                exists: true
            - check: the rpmfusion-free-release package is recorded in the rpm database
              package:
                package: rpmfusion-free-release
                installed: true
            - check: the RPM Fusion nonfree repo definition file is present on disk
              file:
                file: /etc/yum.repos.d/rpmfusion-nonfree.repo
                exists: true
            - check: the rpmfusion-nonfree-release package is recorded in the rpm database
              package:
                package: rpmfusion-nonfree-release
                installed: true
            - check: the free repo file declares the rpmfusion-free repository section header
              file:
                file: /etc/yum.repos.d/rpmfusion-free.repo
                contains:
                    - contains: "[rpmfusion-free]"

rpmfusion-skill:
    skill:
        name: rpmfusion
        family: distros
        owner: rpmfusion
        description: |-
            RPM Fusion free and nonfree repository configuration for Fedora.
            Use when working with RPM Fusion repos, multimedia codecs, or nonfree packages.
        content: |
            # rpmfusion -- RPM Fusion repository configuration
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `task:` |
            
            ## Usage
            
            ```yaml
            # charly.yml
            fedora-nonfree:
              base: fedora
              candy:
                - '@github.com/opencharly/layer-rpmfusion:v2026.237.458'
            ```
            
            ## Used In Boxes
            
            - `/charly-distros:fedora-nonfree` (base for immich and other boxes needing nonfree packages)
            - `/charly-distros:fedora-builder` — applied **before** `build-toolchain` so cargo crates that
              need RPM Fusion free system libs (`libva-devel`, `x264-devel`, `ffmpeg-devel`) can install
              via dnf in the builder stage. Required for building pixelflux from source — see
              `/charly-selkies:selkies` (Patched pixelflux build pipeline).
            
            ## Related Candies
            - `/charly-selkies:ffmpeg` -- nonfree multimedia codecs installed from RPM Fusion
            - `/charly-immich:immich` -- consumes nonfree codecs via fedora-nonfree
            
            ## Related Commands
            - `/charly-build:build` -- build the fedora-nonfree base image
            - `/charly-image:image` -- inspect base/box inheritance
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - RPM Fusion repository setup
            - Nonfree or multimedia packages on Fedora
            - The `fedora-nonfree` base image
            - Enabling additional Fedora repositories
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

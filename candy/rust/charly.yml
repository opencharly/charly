rust:
    candy:
        version: 2026.144.1443
        description: |
            Rust toolchain (rustc compiler + cargo package manager) installed from distro repositories
            Installs the Rust compiler (rustc) and the Cargo package manager from
            the distro repositories: the rust + cargo packages on Arch and Fedora,
            rustc + cargo on Debian and Ubuntu, with ~/.cargo/bin appended to PATH.
            Both binaries land at /usr/bin and report a version string, so a
            developer can compile and build Rust crates inside the image.
        path_append:
            - "~/.cargo/bin"
        distro:
            arch:
                package:
                    - rust
            debian:
                package:
                    - rustc
                    - cargo
            fedora:
                package:
                    - rust
                    - cargo
            ubuntu:
                package:
                    - rustc
                    - cargo
        plan:
            - check: the rustc compiler binary is installed at /usr/bin/rustc
              file:
                file: /usr/bin/rustc
                exists: true
            - check: rustc reports a version string and exits cleanly
              exit_status: 0
              stdout:
                - matches: "rustc [0-9]"
              command: /usr/bin/rustc --version
            - check: the cargo package manager binary is installed at /usr/bin/cargo
              file:
                file: /usr/bin/cargo
                exists: true
            - check: cargo reports a version string and exits cleanly
              exit_status: 0
              stdout:
                - matches: "cargo [0-9]"
              command: /usr/bin/cargo --version
            - check: command=/usr/bin/rustc --version
              id: rustc-version
              exit_status: 0
              command: /usr/bin/rustc --version
            - check: command=/usr/bin/cargo --version
              id: cargo-version
              exit_status: 0
              command: /usr/bin/cargo --version
            - check: package=rust
              id: rust-compiler-package
              package:
                package: rust
                package_map:
                    arch: rust
                    fedora: rust
                    debian: rustc
                    ubuntu: rustc
                installed: true

rust-skill:
    skill:
        name: rust
        family: coder
        owner: rust
        description: |-
            Rust compiler and Cargo package manager via system packages (RPM/DEB).
            Use when working with Rust development or Cargo builds.
        content: |-
            # rust -- Rust compiler and Cargo
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (packages only) |
            
            PATH additions: `~/.cargo/bin`
            
            ## Packages
            
            RPM: `rust`, `cargo`
            DEB: `rustc`, `cargo`
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - '@github.com/opencharly/layer-rust:v2026.237.458'
            ```
            
            ## Used In Boxes
            
            - No enabled boxes use this candy directly
            - Transitive dependency of `language-runtimes`
            
            ## When to use the `rust` candy vs the `build-toolchain` `rust`+`cargo` packages
            
            Two places now ship a Rust toolchain. Choose based on **where** you need it:
            
            | Need | Use |
            |------|-----|
            | Rustc/cargo at **runtime** in the final container (developer shells, CI runners, on-the-fly cargo builds) | Add `/charly-coder:rust` to the runtime candies list of the box |
            | Rustc/cargo at **build time only**, for compiling a cdylib that's copied into the final image (e.g., pixelflux_wayland) | Already provided by `/charly-distros:fedora-builder` via `/charly-coder:build-toolchain`'s system `rust`+`cargo` packages — no extra candy needed |
            
            Builder-stage cargo (the build-toolchain path) keeps the runtime image small because the
            toolchain stays in the multi-stage builder and never lands in the final layers.
            
            ## Related Candies
            
            - `/charly-coder:language-runtimes` -- includes rust as a dependency
            - `/charly-coder:build-toolchain` -- now also ships `rust`+`cargo` for builder-stage compilation
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Rust compiler in containers
            - Cargo builds or Rust development
            - The `rust` candy
            
            ## Author + Test References
            
            - `/charly-image:layer` — candy authoring reference (tasks, vars, env_provide, tests block syntax)
            - `/charly-check:check` — declarative testing framework for the `check:` block

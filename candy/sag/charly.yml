sag:
    candy:
        version: 2026.144.1443
        description: |
            ElevenLabs text-to-speech CLI
            Installs the sag ElevenLabs text-to-speech CLI by go-installing
            github.com/steipete/sag into the user's GOPATH bin (~/go/bin) and
            appending that directory to PATH, so `sag` is invokable by the
            container user. On Fedora the alsa-lib-devel headers are pulled in
            for the cgo audio backend. The install is verifiable by the binary's
            presence and its resolution on PATH.
        require:
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
        distro:
            fedora:
                package:
                    - alsa-lib-devel
        env:
            GOPATH: "~/go"
        path_append:
            - "~/go/bin"
        plan:
            - run: |
                command=go install github.com/steipete/sag/cmd/sag@latest
                go clean -cache
              run_as: "${USER}"
              command: |
                go install github.com/steipete/sag/cmd/sag@latest
                go clean -cache
            - check: the sag binary is present in the user's Go bin directory
              file:
                file: ${HOME}/go/bin/sag
                exists: true
            - check: the sag command resolves on PATH from the Go bin directory
              exit_status: 0
              stdout:
                - contains: go/bin/sag
              command: command -v sag
            - check: the Fedora alsa development headers for sag's cgo audio backend are installed
              exclude_distro:
                - arch
                - cachyos
                - debian
                - ubuntu
              package:
                package: alsa-lib-devel
                installed: true

sag-skill:
    skill:
        name: sag
        family: tools
        owner: sag
        description: |-
            ElevenLabs text-to-speech CLI.
            Use when working with the sag candy.
        content: |
            # sag -- ElevenLabs TTS CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (`run:` step) |
            | Depends | `golang` |
            
            ## Packages
            
            RPM: `alsa-lib-devel`
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `GOPATH` | `~/go` |
            | PATH append | `~/go/bin` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [sag]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:golang` -- build/runtime dependency
            - `/charly-tools:sherpa-onnx` -- offline TTS sibling
            - `/charly-tools:whisper` -- speech-to-text counterpart
            
            ## Related Commands
            - `/charly-core:shell` -- run sag CLI inside the container
            - `/charly-build:secrets` -- supply ELEVENLABS_API_KEY
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - ElevenLabs text-to-speech
            - TTS in containers
            - The `sag` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

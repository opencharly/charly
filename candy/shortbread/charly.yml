shortbread:
    candy:
        version: 2026.144.1443
        description: |
            Generate Shortbread-schema OSM vector tiles with a source-built Tilemaker plus the official shortbread config fleet.
            Builds systemed/tilemaker (C++/Lua) from source — there is no Arch/Fedora
            package and no release binary — and installs it at /usr/local/bin/tilemaker.
            Clones the official shortbread-tiles/shortbread-tilemaker fleet (the
            process.lua per-feature classifier + the config.json layer/zoom schema)
            to /opt/shortbread-tilemaker with its .git history stripped. With both in
            place the notebook DAG can convert an OSM PBF into monaco-shortbread.pmtiles
            under the versatiles-watched /workspace/tiles/shortbread directory. The
            Shortbread schema is the de-facto general-purpose OSM vector-tile schema
            documented at https://shortbread-tiles.org.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
        distro:
            arch:
                package:
                    # Tilemaker's build deps. On Arch the gcc package supplies the
                    # C++ frontend (no -devel split). lua is the embedding runtime
                    # the shortbread process.lua hooks into. boost-libs / protobuf
                    # / shapelib / sqlite / zlib are the linkage-level deps the
                    # tilemaker Makefile expects.
                    - git
                    - make
                    - gcc
                    - lua
                    - sqlite
                    - boost-libs
                    - boost # headers — tilemaker's Makefile includes <boost/...>
                    - protobuf
                    - shapelib
                    - rapidjson # tilemaker's include/shared_data.h: #include "rapidjson/document.h"
                    # NOTE: no explicit zlib (CachyOS ships zlib-ng-compat which
                    # provides the same ABI; tippecanoe in osm-tools-layer follows
                    # the same pattern).
            fedora:
                package:
                    - git
                    - make
                    - gcc-c++
                    - lua-devel
                    - sqlite-devel
                    - zlib-devel
                    - boost-devel
                    - protobuf-devel
                    - shapelib-devel
                    - rapidjson-devel
        plan:
            - run: |
                command=set -euo pipefail
                git clone --depth 1 https://github.com/systemed/tilemaker /tmp/tilemaker
                cd /tmp/tilemaker
                # Boost 1.91+ (shipped by CachyOS / Arch) made
                # boost::system a HEADER-ONLY library: `libboost_system.so`
                # no longer exists. tilemaker's Makefile still ships
                # `-lboost_system` in its link line, which fails with
                # `cannot find -lboost_system`. Strip the flag — the
                # boost::system functionality lives in headers, no link
                # step needed. boost_filesystem + boost_program_options
                # still ship as .so libraries, so we keep those.
                sed -i 's/-lboost_system//g' Makefile
                make -j"$(nproc)"
                make install PREFIX=/usr/local
                cd /
                rm -rf /tmp/tilemaker
              run_as: root
              command: |
                set -euo pipefail
                git clone --depth 1 https://github.com/systemed/tilemaker /tmp/tilemaker
                cd /tmp/tilemaker
                # Boost 1.91+ (shipped by CachyOS / Arch) made
                # boost::system a HEADER-ONLY library: `libboost_system.so`
                # no longer exists. tilemaker's Makefile still ships
                # `-lboost_system` in its link line, which fails with
                # `cannot find -lboost_system`. Strip the flag — the
                # boost::system functionality lives in headers, no link
                # step needed. boost_filesystem + boost_program_options
                # still ship as .so libraries, so we keep those.
                sed -i 's/-lboost_system//g' Makefile
                make -j"$(nproc)"
                make install PREFIX=/usr/local
                cd /
                rm -rf /tmp/tilemaker
            - run: |
                command=set -euo pipefail
                git clone --depth 1 https://github.com/shortbread-tiles/shortbread-tilemaker /opt/shortbread-tilemaker
                rm -rf /opt/shortbread-tilemaker/.git
              run_as: root
              command: |
                set -euo pipefail
                git clone --depth 1 https://github.com/shortbread-tiles/shortbread-tilemaker /opt/shortbread-tilemaker
                rm -rf /opt/shortbread-tilemaker/.git
            - run: mkdir=/workspace/tiles/shortbread
              mkdir: /workspace/tiles/shortbread
              run_as: root
              mode: "0755"
            - check: the tilemaker binary built from systemed/tilemaker source is installed under /usr/local/bin
              file:
                file: /usr/local/bin/tilemaker
                exists: true
            - check: tilemaker resolves on PATH so the notebook DAG can invoke it (tilemaker ships no --version flag, so resolve by name)
              exit_status: 0
              command: command -v tilemaker
            - check: the shortbread per-feature Lua classifier is bundled for tilemaker --process
              file:
                file: /opt/shortbread-tilemaker/process.lua
                exists: true
            - check: the shortbread layer and zoom schema definition is bundled for tilemaker --config
              file:
                file: /opt/shortbread-tilemaker/config.json
                exists: true
            - check: the cloned fleet has its .git history stripped to keep the image small
              file:
                file: /opt/shortbread-tilemaker/.git
                exists: false
            - check: the versatiles-watched output directory is pre-created at build time so versatiles serve starts cleanly on a fresh deploy
              file:
                file: /workspace/tiles/shortbread
                exists: true
            - agent-check: a tilemaker run converts an OSM PBF into a monaco-shortbread.pmtiles archive in that directory using the bundled config.json and process.lua
            - check: package=lua
              id: shortbread-lua-runtime
              package:
                package: lua
                package_map:
                    fedora: lua-devel
                installed: true
            - check: command=test -d /workspace/tiles/shortbread
              id: shortbread-tiles-dir-runtime
              exit_status: 0
              context:
                - runtime
              command:
                command: test -d /workspace/tiles/shortbread
                in_container: true

shortbread-skill:
    skill:
        name: shortbread
        family: versa
        owner: shortbread
        description: |-
            Shortbread vector-tile schema generation via Tilemaker. The Shortbread schema (https://shortbread-tiles.org) is the de-facto general-purpose OSM vector-tile schema; the layer builds systemed/tilemaker (C++/Lua) from source and bundles the official shortbread-tiles/shortbread-tilemaker Lua + JSON configuration. The notebook's `notebook_osm_shortbread_pipeline` DAG invokes tilemaker on the Monaco PBF to produce `/workspace/tiles/shortbread/monaco-shortbread.pmtiles`, which the versatiles serve service auto-discovers.
            MUST be invoked before building, deploying, or troubleshooting the shortbread layer.
        content: |-
            # shortbread — Shortbread vector-tile schema generation
            
            ## Layer properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord` (transitive; no service of its own) |
            | Distros | `arch` + `fedora` (tilemaker is source-built) |
            | Build deps | git, make, gcc/gcc-c++, lua/lua-devel, sqlite/sqlite-devel, boost+boost-libs/boost-devel, protobuf/protobuf-devel, shapelib/shapelib-devel, zlib-devel (Fedora only — Arch uses zlib-ng-compat) |
            | Output dir | `/workspace/tiles/shortbread/` (versatiles serve watches this) |
            | Tools installed | `/usr/local/bin/tilemaker`, `/opt/shortbread-tilemaker/{config.json,process.lua,...}` |
            
            ## Why source-built
            
            `systemed/tilemaker` ships no Arch/Fedora package and no GitHub release
            binaries. Build from source mirrors the existing tippecanoe pattern in
            `/charly-versa:osm-tools-layer`: shallow clone → `make -j$(nproc)` →
            `make install PREFIX=/usr/local`. Build duration: ~2-3 minutes on a
            warm package cache; binary lands at `/usr/local/bin/tilemaker`.
            
            ## Shortbread config bundle
            
            `shortbread-tiles/shortbread-tilemaker` ships:
            
            - `process.lua` — per-feature Lua classifier (decides which OSM tags
              go into which vector-tile layer at which zoom)
            - `config.json` — layer/zoom schema definition consumed by tilemaker
              via `--config`
            - `get-shapefiles.sh`, `build_test_dataset.sh` — helper scripts (not
              used by the in-pod DAG; bundled for operator reference)
            
            The bundle is cloned to `/opt/shortbread-tilemaker/` at image-build
            time with `.git/` removed (image-size reduction).
            
            ## DAG invocation
            
            ```python
            @task
            def tilemaker_convert() -> str:
                pbf = "/workspace/tiles/work/monaco.osm.pbf"
                out = "/workspace/tiles/shortbread/monaco-shortbread.pmtiles"
                subprocess.run([
                    "tilemaker",
                    "--input", pbf,
                    "--output", out,
                    "--config", "/opt/shortbread-tilemaker/config.json",
                    "--process", "/opt/shortbread-tilemaker/process.lua",
                ], check=True)
                return out
            ```
            
            Tilemaker v3.0+ detects the `.pmtiles` extension on `--output` and
            produces a PMTiles archive directly (no `.mbtiles` intermediate).
            Monaco-scale runs complete in ~30 seconds.
            
            ## Check probes
            
            Build-scope:
            - `tilemaker-installed` — `tilemaker --version` exit 0
            - `shortbread-process-lua` — `/opt/shortbread-tilemaker/process.lua` exists
            - `shortbread-config-json` — `/opt/shortbread-tilemaker/config.json` exists
            
            Deploy-scope:
            - `shortbread-tiles-dir-runtime` — `/workspace/tiles/shortbread/` exists
            
            ## Cross-references
            
            - `/charly-versa:versa` — image composing this layer
            - `/charly-versa:versatiles` — the tile-server service that auto-discovers
              `/workspace/tiles/shortbread/*.pmtiles` files
            - `/charly-versa:versatiles-style` — MapLibre style generator targeting
              the Shortbread schema (the notebook's shortbread cell renders the
              pipeline output using `colorful()`)
            - `/charly-versa:notebook-osm` — DAG cell 2 self-authors the
              `notebook_osm_shortbread_pipeline` that drives this layer
            - `/charly-versa:osm-tools-layer` — sibling tippecanoe pipeline + martin
              tile server (parallel infrastructure on port 23000)

sqlite:
    candy:
        version: 2026.144.1443
        description: |
            Provides the sqlite3 command-line shell for creating and querying self-contained SQLite databases.
            The sqlite candy installs the sqlite package, which ships the
            sqlite3 CLI at /usr/bin/sqlite3. The binary runs SQL against an
            in-memory or on-disk SQLite database, so its behaviour is verifiable
            by executing a real query and asserting the returned row.
        distro:
            arch:
                package:
                    - sqlite
            fedora:
                package:
                    - sqlite
        plan:
            - check: the sqlite3 binary is installed at /usr/bin/sqlite3
              file:
                file: /usr/bin/sqlite3
                exists: true
            - check: the sqlite package is present in the image
              package:
                package: sqlite
                installed: true
            - check: sqlite3 reports a 3.x version string
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+\\.[0-9]+"
              command: sqlite3 --version
            - check: sqlite3 runs SQL against an in-memory database and returns the stored row
              stdout:
                - equals: "42"
              command: 'sqlite3 :memory: "CREATE TABLE t(x INTEGER); INSERT INTO t VALUES(42); SELECT x FROM t;"'

sqlite-skill:
    skill:
        name: sqlite
        family: infrastructure
        owner: sqlite
        description: |-
            SQLite database CLI.
            Use when working with the sqlite candy.
        content: |
            # sqlite -- SQLite database CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (packages only) |
            | Depends | none |
            
            ## Packages
            
            RPM: `sqlite`
            
            ## Usage
            
            ```yaml
            # box charly.yml — a box composes the candy via an inline candy: list in its body
            my-box:
              candy:
                base: fedora
                candy:
                  - '@github.com/opencharly/layer-sqlite:v2026.237.458'
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:dev-tools` -- common dev CLI bundle that pairs with sqlite
            - `/charly-openclaw:openclaw-full` -- parent metalayer that bundles sqlite
            
            ## Related Commands
            - `/charly-core:shell` -- run sqlite3 inside the container
            - `/charly-core:cmd` -- one-shot sqlite query in a running service
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - SQLite database in containers
            - SQLite CLI tools
            - The `sqlite` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan steps, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

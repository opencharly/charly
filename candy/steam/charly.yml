steam:
    candy:
        version: 2026.144.1443
        description: |
            Steam gaming client plus the gamescope nested compositor on a Sway/XWayland desktop
            Installs the Steam client and the gamescope micro-compositor from the
            Fedora + RPM Fusion nonfree repos, and pins
            STEAM_RUNTIME_PREFER_HOST_LIBRARIES=0 so Steam uses its own bundled
            runtime instead of host libraries. The launcher binary, the gamescope
            binary, both RPM packages, and the runtime env pin are all directly
            verifiable inside the built image.
        require:
            - '@github.com/opencharly/pod-sway:v2026.235.2110'
        env:
            STEAM_RUNTIME_PREFER_HOST_LIBRARIES: "0"
        distro:
            fedora:
                package:
                    - steam
                    - gamescope
                option:
                    - --allowerasing
        security:
            shm_size: "1g"
        volume:
            - name: steam-data
              path: "~/.local/share/Steam"
        plan:
            - check: the Steam client launcher is installed at /usr/bin/steam
              file:
                file: /usr/bin/steam
                exists: true
            - check: the steam RPM is present in the package database
              package:
                package: steam
                installed: true
            - check: the gamescope nested Wayland compositor binary is installed
              file:
                file: /usr/bin/gamescope
                exists: true
            - check: the gamescope RPM is present in the package database
              package:
                package: gamescope
                installed: true
            - check: STEAM_RUNTIME_PREFER_HOST_LIBRARIES is pinned to 0 so Steam uses its bundled runtime
              stdout: "0"
              command: printenv STEAM_RUNTIME_PREFER_HOST_LIBRARIES

steam-skill:
    skill:
        name: steam
        family: selkies
        owner: steam
        description: |-
            Steam gaming client with gamescope.
            Use when working with Steam, gaming, or gamescope in containers.
        content: |-
            # steam -- Steam gaming client
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `sway` |
            | Security | `shm_size: 1g` |
            | Volume | `steam-data` -> `~/.local/share/Steam` |
            | Install files | `task:` |
            
            ## Environment Variables
            
            | Variable | Value |
            |----------|-------|
            | `STEAM_RUNTIME_PREFER_HOST_LIBRARIES` | `0` |
            
            ## Packages
            
            - `steam` (RPM, from RPM Fusion nonfree)
            - `gamescope` (RPM, Fedora main repos)
            
            XWayland is provided by the base `sway` candy.
            
            ## Usage
            
            ```yaml
            # charly.yml — requires nvidia base (RPM Fusion nonfree via fedora-nonfree)
            sway-browser-vnc-steam:
              base: nvidia
              candy:
                - sway-desktop-vnc
                - steam
            ```
            
            ## XWayland
            
            Steam is an X11 application — it requires XWayland. The base sway config has `xwayland disable` for headless optimization. This candy installs a sway drop-in config at `~/.config/sway/config.d/xwayland.conf` that enables XWayland.
            
            ## Gamescope
            
            Gamescope is a nested Wayland compositor for games. Use it in Steam launch options:
            
            ```
            gamescope -W 1920 -H 1080 -r 60 -- %command%
            ```
            
            Features: resolution spoofing, FSR/NIS upscaling, FPS limiting, HDR support.
            
            ## First Login
            
            Steam Guard requires interactive login. Connect via VNC desktop, launch Steam, and log in manually. Auth tokens persist in the `steam-data` volume for subsequent container restarts.
            
            ## Related Candies
            
            - `/charly-selkies:sway` — Wayland compositor (dependency)
            - `/charly-selkies:sway-desktop-vnc` — Desktop composition with VNC
            - `/charly-distros:cuda` — NVIDIA GPU support (via nvidia base)
            
            ## Used In Boxes
            
            Not used in any current box definition. Standalone gaming candy requiring a Sway desktop box.
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Steam installation in containers
            - Gaming on Sway/Wayland containers
            - Gamescope configuration
            - XWayland setup
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

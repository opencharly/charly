summarize:
    candy:
        version: 2026.144.1443
        description: |
            Installs the @steipete/summarize CLI globally via npm so `summarize` extracts text/transcripts from URLs and files on PATH.
            The candy depends on nodejs and ships a package.json pinning
            @steipete/summarize, which the build installs globally under
            NPM_CONFIG_PREFIX (~/.npm-global). The result is verifiable: the
            summarize binary and its summarizer alias land at ~/.npm-global/bin,
            the scoped package is unpacked under
            ~/.npm-global/lib/node_modules/@steipete/summarize, and
            `summarize --version` prints a version and exits cleanly.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
        plan:
            - check: the summarize binary is installed into the npm global bin directory
              file:
                file: ${HOME}/.npm-global/bin/summarize
                exists: true
            - check: the summarizer alias binary is installed alongside it
              file:
                file: ${HOME}/.npm-global/bin/summarizer
                exists: true
            - check: the @steipete/summarize package is unpacked under the npm global lib directory
              file:
                file: ${HOME}/.npm-global/lib/node_modules/@steipete/summarize/package.json
                exists: true
            - check: running summarize --version prints a version and exits cleanly
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: ${HOME}/.npm-global/bin/summarize --version

summarize-skill:
    skill:
        name: summarize
        family: tools
        owner: summarize
        description: |-
            Summarize CLI for extracting text/transcripts from URLs and files.
            Use when working with the summarize candy.
        content: |
            # summarize -- URL/transcript extractor CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `package.json` |
            | Depends | `nodejs` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [summarize]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:nodejs` — runtime dependency
            - `/charly-openclaw:openclaw-full` — metalayer that bundles summarize
            - `/charly-tools:whisper` — speech-to-text companion in the `openclaw-full-ml` candy
            
            ## Related Commands
            - `/charly-core:shell` — run summarize CLI inside the container
            - `/charly-build:build` — rebuild after candy changes
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Extracting text or transcripts from URLs
            - Content summarization tools
            - The `summarize` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

sway-desktop:
    candy:
        version: 2026.144.1443
        description: |
            Composes a complete headless Sway desktop userland (Wayland automation, screen capture, browser, terminal, file manager, status bar, notifications, audio) with no install of its own
            sway-desktop is a pure meta-composition: it ships no packages or
            tasks itself and instead pulls in pipewire, the wl-tools /
            wl-screenshot-grim / wl-overlay / wf-recorder capture stack,
            chrome-sway, xfce4-terminal, thunar, waybar, desktop-fonts, swaync,
            pavucontrol, tmux, asciinema, and fastfetch. The observable effect of
            the composition is that every member candy's key binary lands in the
            image, so the metalayer is verified by asserting those composed
            artifacts are present and actually run inside a disposable container.
        candy:
            - '@github.com/opencharly/pod-pipewire:v2026.235.2110'
            - xdg-portal
            - '@github.com/opencharly/layer-wl-tools:v2026.237.459'
            - '@github.com/opencharly/layer-wl-screenshot-grim:v2026.237.459'
            - '@github.com/opencharly/layer-wl-overlay:v2026.237.458'
            - '@github.com/opencharly/layer-wf-recorder:v2026.237.458'
            - '@github.com/opencharly/layer-chrome-sway:v2026.237.456'
            - xfce4-terminal
            - thunar
            - '@github.com/opencharly/pod-waybar:v2026.237.458'
            - desktop-fonts
            - '@github.com/opencharly/pod-swaync:v2026.237.458'
            - '@github.com/opencharly/layer-pavucontrol:v2026.237.457'
            - '@github.com/opencharly/layer-tmux:v2026.235.2057'
            - '@github.com/opencharly/layer-asciinema:v2026.237.455'
            - '@github.com/opencharly/layer-fastfetch:v2026.237.456'
        plan:
            - check: the waybar status bar binary from the composed waybar candy is installed
              file:
                file: /usr/bin/waybar
                exists: true
            - check: the swaync notification daemon from the composed swaync candy is installed
              file:
                file: /usr/bin/swaync
                exists: true
            - check: the thunar file manager from the composed thunar candy is installed
              file:
                file: /usr/bin/thunar
                exists: true
            - check: the xfce4-terminal emulator from the composed xfce4-terminal candy is installed
              file:
                file: /usr/bin/xfce4-terminal
                exists: true
            - check: the grim screenshot tool from the composed wl-screenshot-grim candy is installed
              file:
                file: /usr/bin/grim
                exists: true
            - check: the wtype keyboard-injection tool from the composed wl-tools candy is installed
              file:
                file: /usr/bin/wtype
                exists: true
            - check: the wf-recorder Wayland screen recorder from the composed wf-recorder candy is installed
              file:
                file: /usr/bin/wf-recorder
                exists: true
            - check: Google Chrome from the composed chrome-sway candy is installed for the desktop to launch
              file:
                file: /usr/bin/google-chrome-stable
                exists: true
            - check: the PipeWire audio server from the composed pipewire candy is installed
              file:
                file: /usr/bin/pipewire
                exists: true
            - check: the pavucontrol mixer from the composed pavucontrol candy is installed
              file:
                file: /usr/bin/pavucontrol
                exists: true
            - check: tmux from the composed tmux candy reports its version and exits cleanly
              exit_status: 0
              stdout:
                - matches: "^tmux"
              command: /usr/bin/tmux -V
            - check: asciinema from the composed asciinema candy reports its version and exits cleanly
              exit_status: 0
              stdout:
                - contains: asciinema
              command: /usr/bin/asciinema --version
            - check: fastfetch from the composed fastfetch candy reports its version and exits cleanly
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: /usr/bin/fastfetch --version 2>&1
            - agent-check: the composed binaries together form a coherent headless Sway desktop userland (capture, browser, terminal, audio) with no missing member candy
            - check: file=/usr/bin/wlr-randr
              id: sway-desktop-wlr-randr-binary
              file:
                file: /usr/bin/wlr-randr
                exists: true

sway-desktop-skill:
    skill:
        name: sway-desktop
        family: selkies
        owner: sway-desktop
        description: |-
            Base Sway desktop composition with audio, portals, Wayland tools, Chrome, terminal, file manager, and status bar.
            Use sway-desktop-vnc for VNC remote access.
        content: |-
            # sway-desktop -- Base desktop composition (no display server)
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Candies (composition) | `pipewire`, `xdg-portal`, `wl-tools`, `wl-screenshot-grim`, `wl-overlay`, `wf-recorder`, `chrome-sway`, `xfce4-terminal`, `thunar`, `waybar`, `desktop-fonts`, `swaync`, `pavucontrol`, `tmux`, `asciinema`, `fastfetch` |
            | Install files | none (pure composition) |
            
            ## Usage
            
            Not used directly in boxes — use `sway-desktop-vnc` instead:
            
            ```yaml
            # charly.yml — VNC variant
            sway-browser-vnc:
              candy:
                - sway-desktop-vnc
            ```
            
            ## Related Candies
            
            - `/charly-selkies:pipewire` -- audio/media server (included)
            - `/charly-selkies:xdg-portal` -- XDG desktop portal infrastructure (included)
            - `/charly-selkies:wl-tools` -- Wayland automation tools: grim, wtype, wlrctl (included)
            - `/charly-selkies:wl-overlay-layer` -- Fullscreen overlays via gtk4-layer-shell for recordings (included)
            - `/charly-selkies:wf-recorder` -- Wayland screen recorder for desktop video (included)
            - `/charly-selkies:chrome-sway` -- Chrome browser on Sway (included)
            - `/charly-selkies:waybar` -- status bar and auto-tiling (included)
            - `/charly-selkies:sway-desktop-vnc` -- VNC variant (adds wayvnc)
            
            ## Used In Boxes
            
            - `/charly-selkies:sway-browser-vnc` (via `sway-desktop-vnc` metalayer)
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Desktop container composition architecture
            - Base desktop without display server
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

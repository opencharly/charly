testapi:
    candy:
        version: 2026.144.1443
        description: |
            A FastAPI test service answering HTTP on port 9090 under supervisord
            Installs fastapi + uvicorn into a pixi environment and copies app.py
            (the FastAPI app exposing GET / and GET /health) into the service
            working directory. supervisord runs `uvicorn app:app` on 0.0.0.0:9090,
            so the running container answers HTTP 200 on / ({"status":"ok"}) and
            /health ({"healthy":true}). Every claim below is independently checked.
        require:
            - supervisord
        port:
            - 9090
        route:
            host: testapi.localhost
            port: 9090
        service:
            - name: testapi
              exec: "/home/user/.pixi/envs/default/bin/uvicorn app:app --host 0.0.0.0 --port 9090"
              restart: always
              working_directory: /home/user/testapi
              enable: true
              scope: system
        plan:
            - run: mkdir=${HOME}/testapi
              mkdir: "${HOME}/testapi"
              run_as: "${USER}"
            - run: copy=app.py
              copy: app.py
              to: "${HOME}/testapi/app.py"
              mode: "0644"
              run_as: "${USER}"
            - check: the FastAPI application module is installed in the service working directory
              file:
                file: /home/user/testapi/app.py
                exists: true
            - check: the pixi environment can import the fastapi and uvicorn modules
              exit_status: 0
              command: '/home/user/.pixi/envs/default/bin/python -c "import fastapi, uvicorn"'
            - check: a GET request to /health on the running service returns HTTP 200
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:9090}/health
                status: 200
                body:
                    - contains: healthy
            - check: a GET request to / reports a JSON status of ok
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:9090}/
                status: 200
                body:
                    - contains: ok
            - check: file=/home/user/.pixi/envs/default/bin/uvicorn
              id: testapi-uvicorn-binary
              file:
                file: /home/user/.pixi/envs/default/bin/uvicorn
                exists: true
            - check: service=testapi
              id: testapi-service-running
              context:
                - runtime
              service:
                service: testapi
                running: true
            - check: addr=127.0.0.1:${HOST_PORT:9090}
              id: testapi-port-reachable
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:9090}
                reachable: true
            - check: http=http://127.0.0.1:${HOST_PORT:9090}/
              id: testapi-root-responds
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:9090}/
                status: 200
                body:
                    - contains: ok
            - check: http=http://127.0.0.1:${HOST_PORT:9090}/health
              id: testapi-health-responds
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:9090}/health
                status: 200
                body:
                    - contains: healthy

testapi-skill:
    skill:
        name: testapi
        family: infrastructure
        owner: testapi
        description: |-
            FastAPI test service on port 9090 routed via testapi.localhost for development testing.
            Use when working with the test API, Traefik routing validation, or service health checks.
        content: |
            # testapi -- FastAPI test service
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord` |
            | Ports | 9090 |
            | Route | `testapi.localhost:9090` |
            | Service | `testapi` (supervisord) |
            | Install files | `task:`, `pixi.toml`, `app.py` |
            
            ## Usage
            
            ```yaml
            # charly.yml
            fedora-test:
              candy:
                - testapi
            ```
            
            ## Used In Boxes
            
            - `/charly-distros:fedora-test`
            
            ## Related Candies
            
            - `/charly-infrastructure:supervisord` -- process manager dependency
            - `/charly-infrastructure:traefik` -- reverse proxy for route handling
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Test API service
            - Traefik route testing
            - `testapi.localhost` endpoint
            - Port 9090 service
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

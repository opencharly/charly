thunar:
    candy:
        version: 2026.167.2301
        description: |
            Thunar file manager is installed and bound to $mod+e in the Sway desktop
            Installs the Thunar Xfce file manager (the Fedora rpm is named Thunar with a
            capital T, which provides the lowercase thunar that dnf installs by; binary at
            /usr/bin/thunar) and drops a Sway config.d snippet that binds $mod+e to launch
            it. Verifiable by the installed binary + package and by the keybinding drop-in
            whose content wires the $mod+e launcher line.
        require:
            - '@github.com/opencharly/pod-sway:v2026.235.2057'
        distro:
            fedora:
                package:
                    - thunar
        plan:
            - run: mkdir=${HOME}/.config/sway/config.d
              mkdir: "${HOME}/.config/sway/config.d"
              run_as: "${USER}"
            - run: copy=thunar.conf
              copy: thunar.conf
              to: "${HOME}/.config/sway/config.d/thunar.conf"
              mode: "0644"
              run_as: "${USER}"
            - check: the thunar file manager binary is installed at /usr/bin/thunar
              file:
                file: /usr/bin/thunar
                exists: true
            - check: the thunar package is present in the package database
              package:
                package: thunar
                package_map:
                    fedora: Thunar
                installed: true
            - check: a Sway config.d drop-in is installed for thunar
              file:
                file: ${HOME}/.config/sway/config.d/thunar.conf
                exists: true
            - check: the drop-in binds $mod+e to launch thunar
              file:
                file: ${HOME}/.config/sway/config.d/thunar.conf
                contains:
                    - contains: "bindsym $mod+e exec thunar"

thunar-skill:
    skill:
        name: thunar
        family: selkies
        owner: thunar
        description: |-
            Thunar file manager for Sway desktop environments with sway config integration.
            Use when working with file management in Sway desktop containers.
        content: |-
            # thunar -- Xfce file manager for Sway
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `sway` |
            | Install files | `charly.yml`, `task:` |
            
            ## Packages
            
            - `thunar` (RPM) -- Xfce file manager
            
            ## Usage
            
            ```yaml
            # charly.yml -- typically used via sway-desktop composition
            my-image:
              candy:
                - sway-desktop
            ```
            
            ## Used In Boxes
            
            Part of the `sway-desktop` composition candy. Used transitively in all desktop boxes.
            
            ## Related Candies
            
            - `/charly-selkies:sway` -- Sway compositor dependency
            - `/charly-selkies:sway-desktop` -- composition that includes this candy
            - `/charly-selkies:xfce4-terminal` -- terminal emulator (also in sway-desktop)
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Thunar file manager in Sway containers
            - File browsing in desktop boxes
            - Sway desktop application configuration
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

unsloth-studio:
    candy:
        version: 2026.168.1108
        description: |
            Unsloth Studio web UI for GPU LLM fine-tuning, backed by a pixi PyTorch/transformers environment and composed llama.cpp GGUF export tools
            unsloth-studio owns the pixi fine-tuning environment (Python 3.13 +
            PyTorch/CUDA + transformers + PEFT/TRL) and composes the llama-cpp and
            unsloth candies, then runs the Unsloth Studio web UI as a supervisord
            service on port 8888. Every owned artifact lands at a fixed path -- the
            pixi interpreter at ~/.pixi/envs/default and the composed llama.cpp CLI
            at ~/llama.cpp -- so the environment and the composition's effect are
            directly checkable.
        require:
            - '@github.com/opencharly/layer-cuda:v2026.235.2121'
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
        candy:
            - '@github.com/opencharly/layer-llama-cpp:v2026.237.457'
            - '@github.com/opencharly/layer-unsloth:v2026.237.557'
        # The unsloth Studio installer (install.sh) builds its GGUF inference engine
        # from source at install time and HARD-requires cmake + git + a C/C++ toolchain;
        # on Arch it does NOT auto-install them (apt-only), so it aborts with
        # "deps missing: cmake". Provide them so the installer run step succeeds.
        distro:
            arch:
                package:
                    - base-devel
                    - cmake
                    - git
        env:
            NVIDIA_PYTHON_PROJECT: "~/.pixi"
            LD_LIBRARY_PATH: "/usr/lib64:$HOME/llama.cpp"
        port:
            - 8888
            - 8000
        volume:
            - name: workspace
              path: "/workspace"
        service:
            # The `unsloth` CLI is NOT a pip console-script — it is installed by the
            # official curl installer (the `install the Unsloth Studio CLI` run step
            # below), which self-installs uv, lands the launcher at ~/.local/bin/unsloth,
            # and bootstraps the studio runtime venv at ~/.unsloth/studio AT BUILD TIME
            # so the supervised launch is immediate (no slow first-run venv bootstrap
            # that would trip supervisord's startsecs). `unsloth studio` re-execs in
            # place into that venv and blocks in the foreground, so the supervised PID
            # IS the long-lived FastAPI server (no `pixi run`/deno_task_shell wrapper to
            # leave it an untracked grandchild). Invoke via the ABSOLUTE launcher path
            # so the service resolves it regardless of supervisord's PATH.
            - name: unsloth-studio
              exec: "%(ENV_HOME)s/.local/bin/unsloth studio -H 0.0.0.0 -p 8888"
              restart: always
              working_directory: "%(ENV_HOME)s"
              enable: true
              scope: system
        plan:
            - run: install the Unsloth Studio CLI and bootstrap its runtime venv via the official installer
              run_as: "${USER}"
              cache:
                - ${HOME}/.cache/uv
              command: |
                set -e
                curl -fsSL https://unsloth.ai/install.sh | sh
                # Fail the build loudly if the launcher did not land (a silent install
                # failure would otherwise only surface as the supervisord FATAL
                # "can't find command 'unsloth'" at deploy time).
                test -x "${HOME}/.local/bin/unsloth"
            - check: the Unsloth Studio CLI launcher is installed by the official installer (the `unsloth` console-script is NOT in the pixi env — it comes from install.sh)
              id: unsloth-cli-present
              file:
                file: ${HOME}/.local/bin/unsloth
                exists: true
            - check: the pixi fine-tuning environment provides a Python interpreter at ~/.pixi/envs/default
              file:
                file: ${HOME}/.pixi/envs/default/bin/python
                exists: true
            - check: PyTorch imports successfully inside that environment
              stdout:
                - contains: torch
              command: ${HOME}/.pixi/envs/default/bin/python -c "import torch; print('torch', torch.__version__)"
            - check: the composed llama.cpp CLI binary is present so fine-tuned models can be exported to GGUF
              file:
                file: ${HOME}/llama.cpp/llama-cli
                exists: true
            - agent-check: the Unsloth Studio web UI is served on port 8888 and is usable for interactive LLM fine-tuning
            - check: command=${HOME}/.pixi/envs/default/bin/python -c "import transformers, peft, trl; print('finetune-stack-ok')"
              id: unsloth-studio-finetuning-stack
              stdout:
                - contains: finetune-stack-ok
              command: ${HOME}/.pixi/envs/default/bin/python -c "import transformers, peft, trl; print('finetune-stack-ok')"
            - check: service=unsloth-studio
              id: unsloth-studio-service-running
              context:
                - runtime
              service:
                service: unsloth-studio
                running: true
            - check: addr=127.0.0.1:${HOST_PORT:8888}
              id: unsloth-studio-ui-reachable
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:8888}
                reachable: true

unsloth-studio-skill:
    skill:
        name: unsloth-studio
        family: jupyter
        owner: unsloth-studio
        description: |-
            Unsloth Studio fine-tuning web UI with CUDA GPU support, vLLM inference, and llama.cpp.
            Runs as a supervisord service on ports 8888 (Studio) and 8000 (vLLM API).
            MUST be invoked before building, deploying, configuring, or troubleshooting the unsloth-studio box.
        content: |-
            # unsloth-studio
            
            Unsloth Studio web UI for LLM fine-tuning with GPU acceleration.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | nvidia |
            | Candies | agent-forwarding, unsloth-studio, notebook-finetuning, dbus, charly |
            | Platforms | linux/amd64 |
            | Ports | 8888, 8000 |
            | Registry | ghcr.io/opencharly |
            
            ## Candy Composition
            
            The `unsloth-studio` candy is a **Tier 2 environment-owner meta-layer** that:
            1. Owns the pixi.toml (fine-tuning Python environment)
            2. Composes two Tier 1 sub-candies via `candy: [llama-cpp, unsloth]`
            3. Defines the supervisord service for the Studio web UI
            
            Build order: pixi environment → llama-cpp (binaries) → unsloth (vLLM 0.19 wheel + unsloth pip + torch.compile patch) → supervisord config
            
            ## Full Candy Stack
            
            1. `fedora` → `nvidia` (CUDA base)
            2. `pixi` → `python` → `supervisord` (transitive)
            3. `unsloth-studio` — Tier 2 meta-layer (owns pixi.toml, service config)
            4. `llama-cpp` — llama.cpp binaries (Tier 1, via `candy:`)
            5. `unsloth` — vLLM 0.19 + unsloth pip install + torch.compile patch (Tier 1, via `candy:`)
            
            ## Ports
            
            | Port | Service | Protocol |
            |------|---------|----------|
            | 8888 | Unsloth Studio UI | HTTP |
            | 8000 | vLLM API server | HTTP |
            
            ## Volumes
            
            | Name | Path | Purpose |
            |------|------|---------|
            | models | ~/.cache/huggingface | HuggingFace model cache |
            | workspace | /workspace | Training data and outputs |
            
            ## Quick Start
            
            ```bash
            charly box build unsloth-studio
            charly config unsloth-studio
            charly start unsloth-studio
            # Open http://localhost:8888
            ```
            
            ## Key Candies
            
            - `/charly-jupyter:unsloth-studio` — Studio web UI service + pixi.toml (Tier 2)
            - `/charly-jupyter:llama-cpp` — llama.cpp binaries (Tier 1 sub-candy)
            - `/charly-jupyter:unsloth` — vLLM 0.19 + unsloth fine-tuning + torch.compile patch (Tier 1 sub-candy)
            - `/charly-jupyter:notebook-finetuning` — 37 Unsloth fine-tuning notebooks provisioned into workspace volume
            - `/charly-distros:nvidia` — GPU runtime and CDI device auto-detection (base)
            - `/charly-distros:cuda` — CUDA toolkit and libraries (via nvidia base)
            - `/charly-infrastructure:dbus-layer` — session bus for desktop notifications
            - `/charly-tools:charly` — in-container `charly` CLI toolchain (scripting, service management)
            - `/charly-distros:agent-forwarding` — SSH/GPG/direnv agent forwarding
            
            ## Related Boxes
            
            - `/charly-distros:nvidia` — parent (GPU without Studio)
            - `/charly-jupyter:jupyter-ml` — alternative ML UI with JupyterLab + CRDT MCP (same Tier 1 sub-candies)
            - `/charly-languages:python-ml` — ML libraries without any UI
            - `/charly-jupyter:jupyter` — legacy Jupyter with ML (shares port 8888)
            - **CachyOS variant** — `cachyos.unsloth-studio` is the CachyOS GPU sibling (built on the `cachyos.nvidia` GPU base) in the `opencharly/distro-cachyos` submodule. See `/charly-distros:cachyos`.
            
            ## Verification
            
            After `charly start`:
            - `charly status unsloth-studio` — container running
            - `charly service status unsloth-studio` — all services RUNNING
            - `curl -s -o /dev/null -w '%{http_code}' http://localhost:8888` — Studio HTTP returns 200
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the unsloth-studio box, LLM fine-tuning via web UI, or Unsloth Studio deployment. Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

vectorchord:
    candy:
        version: 2026.144.1531
        description: |
            VectorChord vector-search extension installed into the PostgreSQL layer
            VectorChord (vchord) is a PostgreSQL extension for vector similarity
            search. This candy downloads the per-Postgres-major release zip and
            installs the vchord.so shared library into the server's pkglibdir plus
            the vchord.control manifest and vchord--*.sql migration files into the
            extension sharedir, then sets POSTGRES_SHARED_PRELOAD_LIBRARIES=vchord.so
            so the running server preloads it. The control manifest and shared
            library are concrete, distro-agnostic artifacts whose presence proves
            the download-and-install ran; CREATE EXTENSION vchord against the live
            server proves it is actually loadable.
        require:
            - '@github.com/opencharly/pod-postgresql:v2026.237.458'
        distro:
            arch:
                package:
                    - unzip
            fedora:
                package:
                    - unzip
        env:
            VECTORCHORD_VERSION: "1.1.1"
            POSTGRES_SHARED_PRELOAD_LIBRARIES: "vchord.so"
        var:
            # Also expose the version as a task-context var so the URL template below
            # reads naturally. Keep in sync with env.VECTORCHORD_VERSION above — this
            # duplication is unfortunate but separates build-time (vars:) from
            # runtime (env:). A future enhancement could unify them.
            VCHORD_VERSION: "1.1.1"
        plan:
            - run: |
                command=PG_MAJOR=$(postgres --version | awk '{print $NF}' | cut -d. -f1)
                PKGLIBDIR=$(dirname "$(find /usr/lib* -name plpgsql.so -print -quit 2>/dev/null)")
                SHAREDIR=""
                for d in /usr/share/pgsql /usr/share/postgresql; do
                    [ -d "$d/extension" ] && SHAREDIR="$d" && break
                done

                if [ -z "$PKGLIBDIR" ] || [ ! -d "$PKGLIBDIR" ]; then
                    echo "Error: Could not detect PostgreSQL pkglibdir (plpgsql.so not found)" >&2
                    exit 1
                fi
                if [ ! -d "$SHAREDIR/extension" ]; then
                    echo "Error: PostgreSQL sharedir not found at $SHAREDIR/extension" >&2
                    exit 1
                fi

                echo "Detected PostgreSQL ${PG_MAJOR}: pkglibdir=${PKGLIBDIR}, sharedir=${SHAREDIR}"

                VCHORD_URL="https://github.com/tensorchord/VectorChord/releases/download/${VCHORD_VERSION}/postgresql-${PG_MAJOR}-vchord_${VCHORD_VERSION}_${BUILD_ARCH}-linux-gnu.zip"
                echo "Downloading VectorChord ${VCHORD_VERSION} for PostgreSQL ${PG_MAJOR} (${BUILD_ARCH})..."
                curl -fsSL "$VCHORD_URL" -o /tmp/vchord.zip

                cd /tmp
                unzip -q vchord.zip

                cp /tmp/pkglibdir/vchord.so "$PKGLIBDIR/"
                chmod 755 "$PKGLIBDIR/vchord.so"

                cp /tmp/sharedir/extension/vchord.control "$SHAREDIR/extension/"
                cp /tmp/sharedir/extension/vchord--*.sql "$SHAREDIR/extension/"

                rm -rf /tmp/vchord.zip /tmp/pkglibdir /tmp/sharedir

                echo "VectorChord ${VCHORD_VERSION} installed:"
                ls -la "$PKGLIBDIR/vchord.so"
                ls "$SHAREDIR/extension/vchord.control"
              run_as: root
              command: |
                PG_MAJOR=$(postgres --version | awk '{print $NF}' | cut -d. -f1)
                PKGLIBDIR=$(dirname "$(find /usr/lib* -name plpgsql.so -print -quit 2>/dev/null)")
                SHAREDIR=""
                for d in /usr/share/pgsql /usr/share/postgresql; do
                    [ -d "$d/extension" ] && SHAREDIR="$d" && break
                done

                if [ -z "$PKGLIBDIR" ] || [ ! -d "$PKGLIBDIR" ]; then
                    echo "Error: Could not detect PostgreSQL pkglibdir (plpgsql.so not found)" >&2
                    exit 1
                fi
                if [ ! -d "$SHAREDIR/extension" ]; then
                    echo "Error: PostgreSQL sharedir not found at $SHAREDIR/extension" >&2
                    exit 1
                fi

                echo "Detected PostgreSQL ${PG_MAJOR}: pkglibdir=${PKGLIBDIR}, sharedir=${SHAREDIR}"

                VCHORD_URL="https://github.com/tensorchord/VectorChord/releases/download/${VCHORD_VERSION}/postgresql-${PG_MAJOR}-vchord_${VCHORD_VERSION}_${BUILD_ARCH}-linux-gnu.zip"
                echo "Downloading VectorChord ${VCHORD_VERSION} for PostgreSQL ${PG_MAJOR} (${BUILD_ARCH})..."
                curl -fsSL "$VCHORD_URL" -o /tmp/vchord.zip

                cd /tmp
                unzip -q vchord.zip

                cp /tmp/pkglibdir/vchord.so "$PKGLIBDIR/"
                chmod 755 "$PKGLIBDIR/vchord.so"

                cp /tmp/sharedir/extension/vchord.control "$SHAREDIR/extension/"
                cp /tmp/sharedir/extension/vchord--*.sql "$SHAREDIR/extension/"

                rm -rf /tmp/vchord.zip /tmp/pkglibdir /tmp/sharedir

                echo "VectorChord ${VCHORD_VERSION} installed:"
                ls -la "$PKGLIBDIR/vchord.so"
                ls "$SHAREDIR/extension/vchord.control"
            - check: the vchord.control extension manifest is registered in the PostgreSQL extension sharedir
              exit_status: 0
              command: 'SD=$(for d in /usr/share/pgsql /usr/share/postgresql; do [ -d "$d/extension" ] && echo "$d" && break; done); test -f "$SD/extension/vchord.control"'
            - check: the vchord.so shared library is installed alongside the server's plpgsql.so in pkglibdir
              exit_status: 0
              command: 'PL=$(dirname "$(find /usr/lib* -name plpgsql.so -print -quit 2>/dev/null)"); test -f "$PL/vchord.so"'
            - agent-check: CREATE EXTENSION vchord succeeds against the running PostgreSQL server, exposing the vchord vector index access methods
            - check: command=printenv POSTGRES_SHARED_PRELOAD_LIBRARIES
              id: vchord-shared-preload-env
              exit_status: 0
              stdout:
                - contains: "vchord.so"
              context:
                - runtime
              command: printenv POSTGRES_SHARED_PRELOAD_LIBRARIES

vectorchord-skill:
    skill:
        name: vectorchord
        family: infrastructure
        owner: vectorchord
        description: |-
            VectorChord PostgreSQL extension for optimized vector similarity search.
            Use when working with VectorChord, vector indices, or smart search performance.
        content: |
            # vectorchord -- VectorChord vector similarity extension for PostgreSQL
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `postgresql` |
            | Ports | none |
            | Volumes | none |
            | Service | none |
            | Install files | `task:` |
            
            ## Environment Variables
            
            | Variable | Value |
            |----------|-------|
            | `VECTORCHORD_VERSION` | `1.1.1` |
            | `POSTGRES_SHARED_PRELOAD_LIBRARIES` | `vchord.so` |
            
            ## Packages
            
            - `unzip` (RPM / PAC) -- for extracting VectorChord release archives
            
            The candy is multi-distro (Fedora + Arch/CachyOS). On Arch, pgvector comes from
            the AUR (see `/charly-infrastructure:postgresql`).
            
            ## Build Process (tasks:)
            
            Downloads VectorChord from GitHub releases (tensorchord/VectorChord) and installs the extension:
            
            1. Detects PostgreSQL major version via `postgres --version`
            2. Detects extension directories via `pg_config --pkglibdir` and
               `pg_config --sharedir` — this resolves correctly on both Fedora
               (`/usr/lib64/pgsql`, `/usr/share/pgsql`) and Arch/CachyOS
               (`/usr/lib/postgresql`, `/usr/share/postgresql`)
            3. Downloads `postgresql-<PG_MAJOR>-vchord_<VERSION>_<ARCH>-linux-gnu.zip`
            4. Extracts `vchord.so` to `pkglibdir` and `.control`/`.sql` files to `sharedir/extension/`
            
            Supports both `x86_64` and `aarch64` architectures. PostgreSQL version is detected dynamically.
            
            ## How It Works
            
            VectorChord provides the `vchordrq` index type for PostgreSQL, replacing pgvector's `ivfflat` with an optimized approximate nearest-neighbor search algorithm. Key differences:
            
            - **No result cap** -- pgvector's ivfflat has an inherent limit (~40 results); vchordrq does not
            - **`shared_preload_libraries`** -- VectorChord's `.so` must be loaded at PostgreSQL startup via the `POSTGRES_SHARED_PRELOAD_LIBRARIES` env var (consumed by the postgresql candy's entrypoint)
            - **Extension creation** -- `CREATE EXTENSION vchord CASCADE;` (handled by the immich candy's migration script)
            
            ## Version Requirements (Immich v2.7.2)
            
            - pgvector >= 0.7, < 0.9 (provided by postgresql candy)
            - VectorChord >= 0.3, < 2.0 (provided by this candy)
            - PostgreSQL >= 14, < 19 (Fedora 43 ships PG 18)
            
            ## Usage
            
            ```yaml
            # charly.yml -- used alongside postgresql for Immich smart search
            my-image:
              candy:
                - '@github.com/opencharly/pod-postgresql:v2026.237.458'
                - '@github.com/opencharly/layer-vectorchord:v2026.237.937'
                - '@github.com/opencharly/pod-immich:v2026.237.806'
            ```
            
            ## Used In Boxes
            
            - `/charly-immich:immich`
            - `/charly-immich:immich-ml`
            
            ## Related Candies
            
            - `/charly-infrastructure:postgresql` -- required dependency (provides PostgreSQL server and pgvector)
            - `/charly-immich:immich` -- primary consumer (migration script creates the extension)
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - VectorChord extension installation or configuration
            - Vector similarity search performance
            - PostgreSQL shared_preload_libraries configuration
            - Immich smart search or face recognition index types
            - `vchordrq` index type
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

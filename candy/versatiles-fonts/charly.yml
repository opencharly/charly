versatiles-fonts:
    candy:
        version: 2026.144.1443
        description: |
            Pre-rendered SDF glyph PBFs for the VersaTiles font families, installed locally for MapLibre GL JS label rendering.
            Installs the versatiles-org/versatiles-fonts release bundle
            (fonts.tar.gz — all the families: Fira Sans, Lato, Libre Baskerville,
            Merriweather Sans, Noto Sans, Nunito, Open Sans, PT Sans, Roboto,
            Source Sans 3) into /opt/versatiles-fonts as signed-distance-field
            PBFs laid out per MapLibre's {fontstack}/{range}.pbf glyph-URL
            convention. Serving the glyphs locally lets the shortbread MapLibre
            cell render labels without hitting tiles.versatiles.org as a runtime
            font CDN; the bundle is re-exported by versatiles-frontend at /fonts/.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
        distro:
            arch:
                package:
                    - curl
                    - jq
            fedora:
                package:
                    - curl
                    - jq
        plan:
            - run: mkdir=/opt/versatiles-fonts
              mkdir: /opt/versatiles-fonts
              run_as: root
            - run: |
                command=set -euo pipefail
                ASSET=$(curl -fsSL "https://api.github.com/repos/versatiles-org/versatiles-fonts/releases/latest" \
                  | jq -r '.assets[].browser_download_url' \
                  | grep -E '/fonts\.tar\.gz$' \
                  | head -1)
                if [ -z "$ASSET" ]; then
                  echo "ERROR: could not find fonts.tar.gz on versatiles-fonts latest release" >&2
                  curl -fsSL "https://api.github.com/repos/versatiles-org/versatiles-fonts/releases/latest" \
                    | jq -r '.assets[].name' >&2
                  exit 1
                fi
                TMPDIR=$(mktemp -d)
                cd "$TMPDIR"
                curl -fsSL "$ASSET" -o fonts.tar.gz
                tar -xzf fonts.tar.gz -C /opt/versatiles-fonts
                cd /
                rm -rf "$TMPDIR"
              run_as: root
              command: |
                set -euo pipefail
                ASSET=$(curl -fsSL "https://api.github.com/repos/versatiles-org/versatiles-fonts/releases/latest" \
                  | jq -r '.assets[].browser_download_url' \
                  | grep -E '/fonts\.tar\.gz$' \
                  | head -1)
                if [ -z "$ASSET" ]; then
                  echo "ERROR: could not find fonts.tar.gz on versatiles-fonts latest release" >&2
                  curl -fsSL "https://api.github.com/repos/versatiles-org/versatiles-fonts/releases/latest" \
                    | jq -r '.assets[].name' >&2
                  exit 1
                fi
                TMPDIR=$(mktemp -d)
                cd "$TMPDIR"
                curl -fsSL "$ASSET" -o fonts.tar.gz
                tar -xzf fonts.tar.gz -C /opt/versatiles-fonts
                cd /
                rm -rf "$TMPDIR"
            - check: the install directory /opt/versatiles-fonts exists
              file:
                file: /opt/versatiles-fonts
                filetype: directory
            - check: at least one signed-distance-field glyph PBF was unpacked from the release tarball
              exit_status: 0
              command: |
                find /opt/versatiles-fonts -name '*.pbf' -size +1c | head -1 | grep -q .
            - check: the default MapLibre font Noto Sans Regular is present
              exit_status: 0
              command: |
                find /opt/versatiles-fonts -path '*noto_sans_regular*' -name '*.pbf' | head -1 | grep -q .
            - check: glyphs follow MapLibre's {range}.pbf naming so the base 0-255.pbf range file exists
              exit_status: 0
              command: |
                find /opt/versatiles-fonts -name '0-255.pbf' | head -1 | grep -q .
            - agent-check: a MapLibre GL JS client can fetch any installed family's glyph ranges via the standard {fontstack}/{range}.pbf glyph-URL template
            - check: package=curl
              id: versatiles-fonts-curl
              package:
                package: curl
                installed: true
            - check: package=jq
              id: versatiles-fonts-jq
              package:
                package: jq
                installed: true

versatiles-fonts-skill:
    skill:
        name: versatiles-fonts
        family: versa
        owner: versatiles-fonts
        description: |-
            VersaTiles SDF font glyphs for MapLibre GL JS. Font families (Fira Sans, Lato, Libre Baskerville, Merriweather Sans, Noto Sans, Nunito, Open Sans, PT Sans, Roboto, Source Sans 3) bundled locally from versatiles-org/versatiles-fonts GitHub releases. Installed so the notebook's shortbread MapLibre cell renders labels without hitting tiles.versatiles.org as a runtime font CDN. Re-exported by the versatiles-frontend layer's http.server at /fonts/.
            MUST be invoked before building, deploying, or troubleshooting the versatiles-fonts layer.
        content: |-
            # versatiles-fonts — SDF glyph PBFs for MapLibre
            
            ## Layer properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord` (transitive; no service of its own) |
            | Distros | `arch` + `fedora` |
            | Build deps | curl, jq |
            | Install path | `/opt/versatiles-fonts/` |
            | Re-exported at | `/opt/versatiles-frontend/fonts/` (by the versatiles-frontend layer) |
            
            ## What it ships
            
            `versatiles-org/versatiles-fonts` releases a `fonts.tar.gz` containing
            all the font families pre-rendered as SDF (signed distance field) PBFs
            that MapLibre GL JS can fetch via its standard glyph URL template:
            
            ```
            {glyphs}/{fontstack}/{range}.pbf
            ```
            
            The directory layout inside the tarball (verified at install time):
            
            ```
            versatiles-fonts/
            ├── Fira Sans Regular/
            │   ├── 0-255.pbf
            │   ├── 256-511.pbf
            │   └── ...
            ├── Noto Sans Regular/
            │   ├── 0-255.pbf
            │   └── ...
            ├── Roboto Regular/
            │   └── ...
            └── ...
            ```
            
            ## MapLibre glyphs URL pattern
            
            The notebook's shortbread cell patches the style's glyphs URL:
            
            ```javascript
            style.glyphs = 'http://127.0.0.1:28002/fonts/{fontstack}/{range}.pbf';
            ```
            
            MapLibre substitutes `{fontstack}` (e.g. `Noto Sans Regular`) and
            `{range}` (e.g. `0-255`) when fetching each glyph range as the user
            pans/zooms. The versatiles-frontend http.server serves the files
            directly — no special URL rewriting needed.
            
            ## Check probes
            
            Build-scope:
            - `versatiles-fonts-bundle-present` — at least one `*.pbf` glyph file exists under `/opt/versatiles-fonts/`
            - `versatiles-fonts-noto-sans` — `Noto Sans Regular` family is present (sanity check that the tarball wasn't a partial variant)
            
            ## Cross-references
            
            - `/charly-versa:versa` — image composing this layer
            - `/charly-versa:versatiles-style` — sibling MapLibre style generator; the generated styles reference the glyph URL pattern this layer provides
            - `/charly-versa:versatiles-frontend` — re-exports this bundle at `/fonts/`
            - `/charly-versa:maplibre-versatiles-styler` — UI control that lets users switch between font families exposed by this layer
            - `/charly-versa:notebook-osm` — the shortbread MapLibre cell that patches `style.glyphs` to point at this layer's bundle

versatiles:
    candy:
        version: 2026.144.1443
        description: |
            VersaTiles CLI (versatiles-rs) + tile server — convert/serve/probe tile containers, serving vector tiles over HTTP on port 8090
            Installs the versatiles-rs single Rust binary at /usr/local/bin/versatiles
            (convert / serve / probe / dev for the .versatiles, .pmtiles, .mbtiles and
            .tar tile-container formats), plus a supervisord-managed wrapper that runs
            `versatiles serve` on port 8090 (host-mapped 28090). The wrapper always
            includes the public download.versatiles.org/osm.versatiles source so the
            service starts cleanly on a fresh deploy before any local shortbread tiles
            exist, then appends local /workspace/tiles/shortbread/ containers as the OSM
            DAG produces them. The convert subcommand is symmetric (PMTiles ↔ .versatiles
            ↔ MBTiles round-trip). Every fact below is observable: the installed binary,
            the linked convert subcommand, the serve wrapper, the running service, the
            reachable port, and the HTTP 200 a known OSM tile endpoint returns.
        require:
            - supervisord
        distro:
            arch:
                package:
                    # curl + jq pull the GitHub-API release listing dynamically so
                    # the install step picks up whatever versatiles-rs version is
                    # current at build time (mirrors the pmtiles install in
                    # /charly-versa:osm-tools-layer). jq is already pulled by
                    # osm-tools so this is a soft dep; declared here for layer
                    # composability if osm-tools is ever removed.
                    - curl
                    - jq
            fedora:
                package:
                    - curl
                    - jq
        port:
            - 8090 # versatiles serve HTTP (host-mapped 28090)
        # VERSATILES_PUBLIC_URL is browser-side — embedded into MapLibre HTML
        # for the shortbread map cell (which fetches /tiles/<source>/{z}/{x}/{y}
        # directly from versatiles serve, bypassing the martin path).
        env_provide:
            VERSATILES_PUBLIC_URL: "http://127.0.0.1:{{.HostPort 8090}}"
        service:
            - name: versatiles
              exec: /usr/local/bin/versatiles-wrapper.sh
              restart: always
              priority: 37
              enable: true
              scope: system
        plan:
            - run: |
                command=set -euo pipefail
                # The release asset name follows the pattern
                # `versatiles-linux-gnu-x86_64.tar.gz` (gnu BEFORE x86_64,
                # verified against v4.0.0). musl variants also ship; we
                # pick gnu since the versa image's other Rust binaries
                # (martin) also use the gnu glibc variant.
                ASSET=$(curl -fsSL "https://api.github.com/repos/versatiles-org/versatiles-rs/releases/latest" \
                  | jq -r '.assets[].browser_download_url' \
                  | grep -E 'versatiles-linux-gnu-x86_64\.tar\.gz$' \
                  | head -1)
                if [ -z "$ASSET" ]; then
                  echo "ERROR: could not find versatiles-rs linux-x86_64-gnu tarball" >&2
                  curl -fsSL "https://api.github.com/repos/versatiles-org/versatiles-rs/releases/latest" \
                    | jq -r '.assets[].name' >&2
                  exit 1
                fi
                TMPDIR=$(mktemp -d)
                cd "$TMPDIR"
                curl -fsSL "$ASSET" -o vt.tar.gz
                tar -xzf vt.tar.gz
                # The tarball lays out `versatiles` directly at the archive
                # root (no inner directory). Find it generically so a future
                # layout change doesn't silently break.
                BIN=$(find . -name versatiles -type f -executable | head -1)
                install -m 0755 "$BIN" /usr/local/bin/versatiles
                cd /
                rm -rf "$TMPDIR"
              run_as: root
              command: |
                set -euo pipefail
                # The release asset name follows the pattern
                # `versatiles-linux-gnu-x86_64.tar.gz` (gnu BEFORE x86_64,
                # verified against v4.0.0). musl variants also ship; we
                # pick gnu since the versa image's other Rust binaries
                # (martin) also use the gnu glibc variant.
                ASSET=$(curl -fsSL "https://api.github.com/repos/versatiles-org/versatiles-rs/releases/latest" \
                  | jq -r '.assets[].browser_download_url' \
                  | grep -E 'versatiles-linux-gnu-x86_64\.tar\.gz$' \
                  | head -1)
                if [ -z "$ASSET" ]; then
                  echo "ERROR: could not find versatiles-rs linux-x86_64-gnu tarball" >&2
                  curl -fsSL "https://api.github.com/repos/versatiles-org/versatiles-rs/releases/latest" \
                    | jq -r '.assets[].name' >&2
                  exit 1
                fi
                TMPDIR=$(mktemp -d)
                cd "$TMPDIR"
                curl -fsSL "$ASSET" -o vt.tar.gz
                tar -xzf vt.tar.gz
                # The tarball lays out `versatiles` directly at the archive
                # root (no inner directory). Find it generically so a future
                # layout change doesn't silently break.
                BIN=$(find . -name versatiles -type f -executable | head -1)
                install -m 0755 "$BIN" /usr/local/bin/versatiles
                cd /
                rm -rf "$TMPDIR"
            - run: write=/usr/local/bin/versatiles-wrapper.sh
              write: /usr/local/bin/versatiles-wrapper.sh
              mode: "0755"
              run_as: root
              content: |
                #!/usr/bin/env bash
                set -euo pipefail
                DIR="/workspace/tiles/shortbread"
                mkdir -p "$DIR"
                # versatiles serve refuses to start when given an empty directory
                # ("no tiles found" error). To guarantee at least one valid
                # source on every startup (including fresh deploys before the
                # shortbread DAG has run), always include the public
                # download.versatiles.org/osm.versatiles container as the FIRST
                # source. After the shortbread DAG produces local files and
                # calls supervisorctl restart, this wrapper re-runs and APPENDS
                # the local tile containers to the arg list — they appear as
                # /tiles/monaco-shortbread/ etc., parallel to the remote /tiles/osm/.
                ARGS=("https://download.versatiles.org/osm.versatiles")
                # Append local tile containers individually. shopt -s nullglob
                # so the loop doesn't run with literal '*.pmtiles' when empty.
                shopt -s nullglob
                for f in "$DIR"/*.pmtiles "$DIR"/*.versatiles "$DIR"/*.mbtiles; do
                  ARGS+=("$f")
                done
                echo "versatiles-wrapper: starting versatiles serve with ${#ARGS[@]} source(s)" >&2
                exec /usr/local/bin/versatiles serve --port 8090 "${ARGS[@]}"
            - check: the versatiles binary is installed and executable at /usr/local/bin/versatiles
              file:
                file: /usr/local/bin/versatiles
                exists: true
                mode: "0755"
            - check: the installed binary reports its version
              exit_status: 0
              command: versatiles --version
            - check: the convert subcommand is compiled into the binary (not a stripped-down build)
              exit_status: 0
              command: versatiles convert --help
            - check: the supervisord serve wrapper is installed and executable at /usr/local/bin/versatiles-wrapper.sh
              file:
                file: /usr/local/bin/versatiles-wrapper.sh
                exists: true
                mode: "0755"
            - check: the versatiles service is running under the init system
              context:
                - runtime
              service:
                service: versatiles
                running: true
            - check: the serve port is reachable on the host loopback
              timeout: 10s
              context:
                - runtime
              addr:
                addr: "127.0.0.1:${HOST_PORT:8090}"
                reachable: true
            - check: a known OSM tile endpoint returns HTTP 200
              timeout: 10s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:8090}/tiles/osm/0/0/0.pbf"
                status: 200
            - check: |
                command=set -euo pipefail
                SRC=/workspace/tiles/pmtiles/monaco.pmtiles
                # If the OSM DAG hasn't run yet on this deploy, skip the
                # check cleanly — the notebook's R10 end-to-end covers the
                # post-DAG state. The check here covers the static binary
                # surface; the DAG path is exercised by the notebook test.
                if [ ! -f "$SRC" ]; then
                  echo "SKIP: $SRC not present yet (OSM DAG has not run on this deploy)"
                  exit 0
                fi
                TMP=$(mktemp -d)
                trap "rm -rf $TMP" EXIT
                versatiles convert "$SRC" "$TMP/monaco.versatiles"
                versatiles convert "$TMP/monaco.versatiles" "$TMP/monaco-roundtrip.pmtiles"
                test -s "$TMP/monaco.versatiles"
                test -s "$TMP/monaco-roundtrip.pmtiles"
                # Probe both ends to verify they're readable + parseable.
                versatiles probe "$SRC" >/dev/null
                versatiles probe "$TMP/monaco-roundtrip.pmtiles" >/dev/null
              id: versatiles-convert-roundtrip
              exit_status: 0
              context:
                - runtime
              command:
                command: |
                    set -euo pipefail
                    SRC=/workspace/tiles/pmtiles/monaco.pmtiles
                    # If the OSM DAG hasn't run yet on this deploy, skip the
                    # check cleanly — the notebook's R10 end-to-end covers the
                    # post-DAG state. The check here covers the static binary
                    # surface; the DAG path is exercised by the notebook test.
                    if [ ! -f "$SRC" ]; then
                      echo "SKIP: $SRC not present yet (OSM DAG has not run on this deploy)"
                      exit 0
                    fi
                    TMP=$(mktemp -d)
                    trap "rm -rf $TMP" EXIT
                    versatiles convert "$SRC" "$TMP/monaco.versatiles"
                    versatiles convert "$TMP/monaco.versatiles" "$TMP/monaco-roundtrip.pmtiles"
                    test -s "$TMP/monaco.versatiles"
                    test -s "$TMP/monaco-roundtrip.pmtiles"
                    # Probe both ends to verify they're readable + parseable.
                    versatiles probe "$SRC" >/dev/null
                    versatiles probe "$TMP/monaco-roundtrip.pmtiles" >/dev/null
                in_container: true

versatiles-skill:
    skill:
        name: versatiles
        family: versa
        owner: versatiles
        description: |-
            VersaTiles CLI (versatiles-rs) — a single Rust binary that handles `convert` / `serve` / `probe` / `dev` for the `.versatiles`, `.pmtiles`, `.mbtiles`, and `.tar` tile-container formats. Installed from the pre-built linux-x86_64-gnu tarball on GitHub releases. Ships a supervisord service running `versatiles serve` on port 8090 (host 28090) that watches `/workspace/tiles/shortbread/`, parallel to martin on 3000/23000. The `convert` subcommand is symmetric — PMTiles ↔ .versatiles ↔ MBTiles round-trip — and is exercised end-to-end by both the layer's deploy-scope check probe and a dedicated notebook cell.
            MUST be invoked before building, deploying, or troubleshooting the versatiles layer.
        content: |-
            # versatiles — VersaTiles CLI + tile server
            
            ## Layer properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord` |
            | Distros | `arch` + `fedora` (binary download) |
            | Build deps | curl, jq (for the dynamic release-asset URL resolution) |
            | Ports | `8090` (versatiles serve HTTP; host-mapped to **28090**) |
            | Service | `versatiles` (supervisord, `restart: always`) |
            | Tile dir | `/workspace/tiles/shortbread/` (parallel to martin's `/workspace/tiles/pmtiles/`) |
            
            ## Why binary download (not cargo install)
            
            versatiles-rs ships pre-built linux-x86_64-gnu binaries on every
            release. `cargo install versatiles` would compile 200+ transitive
            crates inside the versa image — wasteful when the upstream CI
            already publishes a ready binary. Download pattern mirrors martin's
            in `/charly-versa:osm-tools-layer`: GitHub release API → asset URL
            matching `versatiles-*linux*x86_64*gnu*.tar.gz` → curl + tar →
            `install -m 0755 versatiles /usr/local/bin/`.
            
            ## Service spec
            
            ```yaml
            service:
              - name: versatiles
                exec: /usr/local/bin/versatiles-wrapper.sh
                restart: always
                priority: 37
            ```
            
            The wrapper:
            
            ```bash
            #!/usr/bin/env bash
            set -euo pipefail
            DIR="/workspace/tiles/shortbread"
            mkdir -p "$DIR"
            exec /usr/local/bin/versatiles serve --port 8090 "$DIR"
            ```
            
            Same `mkdir -p` defensive pattern as `martin-wrapper.sh` — first-deploy
            state has no PMTiles files yet; versatiles serve starts cleanly on an
            empty dir and auto-discovers files as the DAG produces them.
            
            ## URL surface
            
            `versatiles serve` exposes:
            
            | URL | Purpose |
            |---|---|
            | `GET /` | Server root (HTML directory listing) |
            | `GET /tiles/<source>/{z}/{x}/{y}.pbf` | Vector tile fetch (the shortbread DAG outputs `monaco-shortbread.pmtiles`, so the source name is `monaco-shortbread`) |
            | `GET /tiles/<source>/tilejson.json` | TileJSON metadata |
            | `GET /tiles/<source>/style.json` | Default style (if shipped in the container) |
            
            URL format differs from martin's `/<source>/{z}/{x}/{y}` (no `/tiles/`
            prefix). The notebook's shortbread cell hardcodes the
            `/tiles/monaco-shortbread/{z}/{x}/{y}` pattern in the MapLibre style
            override.
            
            ## Convert subcommand
            
            `versatiles convert <input> <output>` infers format from extension:
            
            ```bash
            # PMTiles → .versatiles
            versatiles convert monaco.pmtiles monaco.versatiles
            # .versatiles → PMTiles (lossless round-trip)
            versatiles convert monaco.versatiles monaco-rt.pmtiles
            # MBTiles → PMTiles
            versatiles convert legacy.mbtiles new.pmtiles
            # Directory of PNGs → .versatiles (for raster tilesets)
            versatiles convert /tiles-dir/ tiles.versatiles
            ```
            
            Tile content (MVT-PBF blobs for vector, image bytes for raster) is
            copied verbatim — only the container changes. Conversions involving
            re-encoding (PNG → WebP, etc.) are also supported via subcommand
            flags but not exercised by this image.
            
            The layer's **deploy-scope `versatiles-convert-roundtrip` check
            probe** runs the PMTiles → .versatiles → PMTiles round-trip on the
            OSM DAG's `monaco.pmtiles` output every time R10 runs, asserting
            both intermediate files are readable via `versatiles probe`. The
            notebook's dedicated `versatiles convert` demo cell re-runs the
            round-trip and renders a `polars.DataFrame` comparing tile counts +
            file sizes across all three steps for visual inspection.
            
            ## Check probes
            
            Build-scope:
            - `versatiles-installed` — `versatiles --version` exit 0
            - `versatiles-convert-help` — `versatiles convert --help` exit 0 (verifies the subcommand is linked into the binary)
            - `versatiles-wrapper-installed` — `/usr/local/bin/versatiles-wrapper.sh` exists with mode 0755
            
            Deploy-scope:
            - `versatiles-running` — supervisord service RUNNING
            - `versatiles-port-reachable` — TCP 8090 reachable
            - `versatiles-http-up` — `GET /` returns 200
            - `versatiles-convert-roundtrip` — end-to-end PMTiles round-trip via
              the OSM DAG output; cleanly SKIPs when `monaco.pmtiles` isn't
              present yet (pre-DAG fresh deploy) so the probe doesn't false-fail
              on first-run state
            
            ## CRITICAL: supervisord restart race (same as martin)
            
            Parallel DAGs that call `supervisorctl restart versatiles` race
            exactly like the four `reload_martin` calls do. The shortbread DAG's
            `reload_versatiles` task uses the same proper synchronization
            primitives:
            
            1. `fcntl.flock("/tmp/charly-versatiles-restart.lock")` — serializes the
               supervisorctl invocations globally.
            2. TCP readiness probe (bounded 30s) — waits for port 8090 to accept
               connections after restart.
            3. HTTP `/` 200 assertion — verifies the END STATE, not the
               supervisorctl exit code (which can be non-zero even when versatiles
               ends up healthy).
            
            See `/charly-versa:osm-tools-layer` "CRITICAL: martin caches pmtiles file
            mtime at startup" — same restart-race pattern applies.
            
            ## Cross-references
            
            - `/charly-versa:versa` — image composing this layer
            - `/charly-versa:shortbread` — produces the PMTiles files versatiles serves
            - `/charly-versa:versatiles-style` — MapLibre style generator paired with
              versatiles serve as tile backend
            - `/charly-versa:versatiles-frontend` — pre-built SPA on port 28002 for
              visually exploring tile content
            - `/charly-versa:osm-tools-layer` — sibling martin tile server (port
              23000); the two run in parallel for the comparison surface
            - `/charly-versa:notebook-osm` — the versatiles convert round-trip demo
              cell + the shortbread MapLibre cell

wacli:
    candy:
        version: 2026.144.1443
        description: |
            WhatsApp messaging and history sync from the command line — the `wacli` binary in the user's Go bin
            Installs the wacli WhatsApp CLI by `go install`-ing
            github.com/openclaw/wacli/cmd/wacli@latest with GOPATH=~/go, so the
            `wacli` binary lands in the user's Go bin (~/go/bin, already appended
            to $PATH). Verifiable end to end: the binary exists at ~/go/bin/wacli,
            carries the executable bit, and the required Go toolchain that builds
            and runs it is present at /usr/bin/go (the golang dependency).
        require:
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
        env:
            GOPATH: "~/go"
        path_append:
            - "~/go/bin"
        plan:
            - run: |
                command=go install github.com/openclaw/wacli/cmd/wacli@latest
                go clean -cache
              run_as: "${USER}"
              command: |
                go install github.com/openclaw/wacli/cmd/wacli@latest
                go clean -cache
            - check: the wacli WhatsApp CLI binary is installed in the user's Go bin directory
              file:
                file: ${HOME}/go/bin/wacli
                exists: true
            - check: the installed wacli binary carries the executable bit and can be invoked
              exit_status: 0
              command:
                command: test -x ${HOME}/go/bin/wacli
                in_container: true
            - agent-check: invoking wacli in the running deployment presents its WhatsApp command interface (login/pairing prompt) instead of crashing
            - check: file=/usr/bin/go
              id: wacli-go-toolchain
              file:
                file: /usr/bin/go
                exists: true

wacli-skill:
    skill:
        name: wacli
        family: selkies
        owner: wacli
        description: |-
            WhatsApp CLI for message sending and history sync.
            Use when working with the wacli candy.
        content: |-
            # wacli -- WhatsApp CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (a `run:` install step) |
            | Depends | `golang` |
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `GOPATH` | `~/go` |
            | PATH append | `~/go/bin` |
            
            ## Usage
            
            ```yaml
            # a box composing this candy — the candy list is inline
            my-box:
              candy:
                base: fedora
                candy: [wacli]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:golang` — Go toolchain dependency
            - `/charly-openclaw:openclaw-full` — metalayer that bundles wacli
            - `/charly-hermes:hermes` — companion messaging stack with WhatsApp bridge
            
            ## Related Commands
            - `/charly-core:shell` — run wacli inside the container
            - `/charly-build:secrets` — store WhatsApp session credentials
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - WhatsApp messaging from containers
            - WhatsApp history sync
            - The `wacli` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, `run:`/`check:` step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

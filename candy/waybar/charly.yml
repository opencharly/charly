waybar:
    candy:
        version: 2026.144.1443
        description: |
            Waybar status bar and Sway auto-tiling for the Sway desktop
            Installs the waybar package, stages the waybar-wrapper launcher and the
            sway-autotile helper into the user's ~/.local/bin, and stages the shared
            Catppuccin Mocha waybar config + stylesheet under ~/.config/waybar. Two
            supervisord services then run the bar and the auto-tiler against the Sway
            Wayland session. Every installed artifact is file-verifiable at build scope.
        require:
            - '@github.com/opencharly/pod-sway:v2026.235.2110'
        distro:
            fedora:
                package:
                    - waybar
        service:
            - name: waybar
              exec: "%(ENV_HOME)s/.local/bin/waybar-wrapper"
              env:
                WAYLAND_DISPLAY: wayland-0
                XDG_RUNTIME_DIR: /tmp
              restart: always
              priority: 15
              start_sec: 0
              enable: true
              scope: system
            - name: sway-autotile
              exec: "%(ENV_HOME)s/.local/bin/sway-autotile"
              env:
                WAYLAND_DISPLAY: wayland-0
                XDG_RUNTIME_DIR: /tmp
              restart: always
              priority: 16
              start_sec: 0
              enable: true
              scope: system
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: mkdir=${HOME}/.config/waybar
              mkdir: "${HOME}/.config/waybar"
              run_as: "${USER}"
            - run: copy=waybar-wrapper
              copy: waybar-wrapper
              to: "${HOME}/.local/bin/waybar-wrapper"
              mode: "0755"
              run_as: "${USER}"
            - run: copy=sway-autotile
              copy: sway-autotile
              to: "${HOME}/.local/bin/sway-autotile"
              mode: "0755"
              run_as: "${USER}"
            - run: copy=config.json
              copy: config.json
              to: "${HOME}/.config/waybar/config"
              mode: "0644"
              run_as: "${USER}"
            - run: copy=style.css
              copy: style.css
              to: "${HOME}/.config/waybar/style.css"
              mode: "0644"
              run_as: "${USER}"
            - check: the waybar status-bar binary is installed from the distro package
              file:
                file: /usr/bin/waybar
                exists: true
            - check: waybar is recorded as installed in the package database
              package:
                package: waybar
                installed: true
            - check: the waybar-wrapper launcher script is installed under the user's bin
              file:
                file: ${HOME}/.local/bin/waybar-wrapper
                exists: true
            - check: the sway-autotile helper script is installed under the user's bin
              file:
                file: ${HOME}/.local/bin/sway-autotile
                exists: true
            - check: the waybar module-layout config is staged for the user
              file:
                file: ${HOME}/.config/waybar/config
                exists: true
            - check: the Catppuccin Mocha stylesheet is staged for the user
              file:
                file: ${HOME}/.config/waybar/style.css
                exists: true
            - agent-check: the waybar status bar appears on the running Sway desktop showing the taskbar, Chrome-restart, and notification toggle modules

waybar-skill:
    skill:
        name: waybar
        family: selkies
        owner: waybar
        description: |-
            Waybar status bar and sway-autotile for the Sway desktop compositor.
            Use when working with Waybar configuration, status bar, or automatic tiling.
        content: |-
            # waybar -- Status bar and auto-tiling for Sway
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `sway` |
            | Service | `waybar` (supervisord, priority 15), `sway-autotile` (priority 16) |
            | Install files | `task:`, `config.json`, `style.css`, `waybar-wrapper`, `sway-autotile` |
            
            ## Packages
            
            - `waybar` (RPM)
            
            Fonts (JetBrains Mono, Symbols Nerd Font) provided by the `desktop-fonts` candy in metalayers.
            
            ## Configuration
            
            Unified config shared with the `waybar-labwc` candy (Catppuccin Mocha, bottom bar):
            
            ### Modules
            
            | Position | Module | Purpose |
            |----------|--------|---------|
            | Left | `custom/chrome` | (Re)start Chrome button — calls `chrome-restart` (see `/charly-selkies:chrome`) |
            | Center | `wlr/taskbar` | Running app icons — click to activate, middle-click to close, right-click to minimize |
            | Right | `custom/notification` | swaync notification toggle — click to open notification panel (see `/charly-selkies:swaync`) |
            
            ### Style
            
            Catppuccin Mocha theme — semi-transparent dark background, JetBrains Mono + Symbols Nerd Font.
            
            ## Key Files
            
            - `waybar-wrapper` — Waits for Wayland socket, discovers SWAYSOCK, then exec waybar
            - `sway-autotile` — Subscribes to sway window events, auto-tiles windows restored from scratchpad
            - `config.json` — Unified module layout (same as waybar-labwc candy)
            - `style.css` — Catppuccin Mocha styling (same as waybar-labwc candy)
            
            ## Used In Boxes
            
            Part of `/charly-selkies:sway-desktop` composition.
            
            ## Related Candies
            
            - `/charly-selkies:sway` -- compositor dependency
            - `/charly-selkies:sway-desktop` -- composition that includes waybar
            - `/charly-selkies:swaync` -- notification daemon (notification bell module)
            - `/charly-selkies:pavucontrol` -- volume control (pulseaudio on-click)
            - `/charly-selkies:desktop-fonts` -- JetBrains Mono + Nerd Font icons
            
            ## Related Commands
            - `/charly-check:wl` — interact with the Wayland session hosting waybar
            - `/charly-core:shell` — restart waybar via supervisorctl
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Waybar configuration or styling
            - Status bar in Sway desktop
            - Automatic window tiling
            - Desktop UI customization
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

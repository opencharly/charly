whisper:
    candy:
        version: 2026.144.1443
        description: |
            OpenAI Whisper local speech-to-text CLI (GPU-capable)
            Installs openai-whisper via pixi into the default env, composing the
            python + cuda + ffmpeg candies (ffmpeg is required for audio
            decoding). Verifiable: the whisper CLI lands in the pixi default env,
            runs `--help`, and ffmpeg is available for decoding.
        require:
            - '@github.com/opencharly/layer-python:v2026.235.2057'
            - '@github.com/opencharly/layer-cuda:v2026.235.2110'
            - '@github.com/opencharly/layer-ffmpeg:v2026.235.2057'
        plan:
            - check: the whisper CLI is installed in the pixi default env
              file:
                file: ${HOME}/.pixi/envs/default/bin/whisper
                exists: true
            - check: the whisper CLI runs and prints its usage
              exit_status: 0
              stdout:
                - contains: "--model"
              command: ${HOME}/.pixi/envs/default/bin/whisper --help
            - check: ffmpeg is available on PATH for audio decoding
              exit_status: 0
              stdout:
                - contains: ffmpeg
              command: ffmpeg -version

whisper-skill:
    skill:
        name: whisper
        family: tools
        owner: whisper
        description: |-
            OpenAI Whisper local speech-to-text.
            Use when working with the whisper candy.
        content: |
            # whisper -- OpenAI Whisper STT
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `pixi.toml` |
            | Depends | `python`, `cuda`, `ffmpeg` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [whisper]
            ```
            
            ## Used In Boxes
            
            
            ## Related Candies
            
            - `/charly-languages:python` — Python runtime — required dependency
            - `/charly-distros:cuda` — CUDA toolkit — required dependency
            - `/charly-selkies:ffmpeg` — FFmpeg multimedia (nonfree codecs) — required dependency
            - `/charly-tools:sherpa-onnx` — alternative STT engine (ONNX-based, lighter weight)
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Speech-to-text in containers
            - OpenAI Whisper setup
            - Audio transcription with CUDA
            - The `whisper` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

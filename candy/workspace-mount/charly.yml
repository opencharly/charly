workspace-mount:
    candy:
        version: 2026.149.1200
        description: |
            Mount a virtiofs `workspace` share at /workspace in a VM guest via a systemd .mount unit
            Writes and enables /etc/systemd/system/workspace.mount so a virtiofs
            share tagged `workspace` re-mounts at /workspace on every boot
            (load-bearing for an autostarting VM). The mount tag is the contract
            between a kind:vm entity's filesystem `target:` and this layer's
            `What=`. Guest-side only — meaningful on a running VM that has the
            share attached; a no-op (start tolerated) at image build where no
            device exists. systemd-based (Arch/CachyOS, Fedora, bootc).
        plan:
            - run: mkdir=/workspace
              mkdir: /workspace
              run_as: root
            - run: write=/etc/systemd/system/workspace.mount
              write: /etc/systemd/system/workspace.mount
              run_as: root
              mode: "0644"
              content: |
                [Unit]
                Description=OpenCharly workspace share (virtiofs)
                # No After=local-fs.target: a .mount unit is implicitly ordered
                # Before=local-fs.target, so adding After= creates an ordering cycle
                # that systemd breaks non-deterministically (the mount silently fails
                # to come up on some boots). The virtiofs device is present early, so
                # systemd mounts this when multi-user.target is reached.

                [Mount]
                What=workspace
                Where=/workspace
                Type=virtiofs
                Options=defaults

                [Install]
                WantedBy=multi-user.target
            - run: |
                command=systemctl daemon-reload || true
                systemctl enable workspace.mount || true
                systemctl start workspace.mount || true
              run_as: root
              command: |
                systemctl daemon-reload || true
                systemctl enable workspace.mount || true
                systemctl start workspace.mount || true
            - check: the systemd .mount unit is installed and declares the virtiofs type
              file:
                file: /etc/systemd/system/workspace.mount
                contains: "Type=virtiofs"
            - agent-check: when a workspace share is attached, /workspace is a writable virtiofs mount
            - check: |
                command=if ! findmnt -n /workspace >/dev/null 2>&1; then
                  echo "WORKSPACE-OK (N/A: no /workspace share attached to this target)"
                  exit 0
                fi
                fstype=$(findmnt -n -o FSTYPE /workspace)
                if [ "$fstype" != "virtiofs" ]; then
                  echo "FAIL: /workspace is $fstype, expected virtiofs"
                  exit 1
                fi
                probe=/workspace/.charly-workspace-write-probe
                if touch "$probe" 2>/dev/null && rm -f "$probe" 2>/dev/null; then
                  echo "WORKSPACE-OK (virtiofs read-write at /workspace)"
                else
                  echo "FAIL: /workspace virtiofs share is not writable"
                  exit 1
                fi
              id: workspace-virtiofs-rw
              stdout:
                contains: WORKSPACE-OK
              command: |
                if ! findmnt -n /workspace >/dev/null 2>&1; then
                  echo "WORKSPACE-OK (N/A: no /workspace share attached to this target)"
                  exit 0
                fi
                fstype=$(findmnt -n -o FSTYPE /workspace)
                if [ "$fstype" != "virtiofs" ]; then
                  echo "FAIL: /workspace is $fstype, expected virtiofs"
                  exit 1
                fi
                probe=/workspace/.charly-workspace-write-probe
                if touch "$probe" 2>/dev/null && rm -f "$probe" 2>/dev/null; then
                  echo "WORKSPACE-OK (virtiofs read-write at /workspace)"
                else
                  echo "FAIL: /workspace virtiofs share is not writable"
                  exit 1
                fi

workspace-mount-skill:
    skill:
        name: workspace-mount
        family: distros
        owner: workspace-mount
        description: |-
            Mounts a virtiofs share tagged `workspace` at /workspace inside a VM guest via
            a systemd .mount unit. Use when a kind:vm entity shares a host directory into
            the guest and you need it auto-mounted (and re-mounted at every boot).
        content: |
            # workspace-mount — virtiofs /workspace mount
            
            A guest-side candy that mounts the virtiofs share tagged `workspace` at
            `/workspace` and enables it so it re-mounts on every boot — load-bearing for an
            **autostarting** VM that must come back with its share already mounted.
            
            ## What it does
            
            - `mkdir /workspace`
            - writes `/etc/systemd/system/workspace.mount` (`What=workspace`, `Where=/workspace`,
              `Type=virtiofs`, `WantedBy=multi-user.target`)
            - `systemctl daemon-reload` + `enable` (boot) + `start` (now, tolerant) — the
              start is `|| true` so an image-build chroot with no device / no systemd does
              not fail the candy; the enabled unit mounts at the next boot.
            
            ## The contract
            
            The mount **tag `workspace`** is the contract between the host-side share and
            this candy. The `kind: vm` entity must declare a matching virtiofs filesystem:
            
            ```yaml
            libvirt:
              devices:
                filesystems:
                  - {driver: virtiofs, accessmode: passthrough, source: /home/me, target: workspace}
            ```
            
            `target: workspace` (the entity) ↔ `What=workspace` (this candy). The shared
            memory backing virtiofs requires is auto-paired by the renderer (see
            `/charly-internals:libvirt-renderer`), so the entity declares only the filesystem.
            
            ## Check
            
            - `workspace-mount-unit` — the `.mount` unit file contains `Type=virtiofs`.
            - `workspace-virtiofs-rw` — skip-aware: N/A when no share is attached (image
              build / no-device target); when `/workspace` IS mounted it MUST be `virtiofs`
              and writable. Mirrors the GPU check gate's skip-with-explanation pattern.
            
            ## Used in
            
            The `cachyos-coder` operator workstation VM (`box/cachyos`), mounting the
            operator's `/home/<user>` → `/workspace`. Generic for any pod-in-VM share.
            
            ## Related
            
            - `/charly-internals:libvirt-renderer` — `mapFilesystem` + `ensureVirtiofsSharedMemory`
            - `/charly-vm:vms-catalog` — `filesystems:` authoring on the kind:vm entity
            - `/charly-vm:cachyos-bootstrap-vm` — the CachyOS VM family that consumes it
            - `/charly-image:layer` — candy authoring reference
            
            ## When to Use This Skill
            
            Use when authoring or debugging a virtiofs host-directory share mounted into a VM
            guest, or the `workspace-mount` candy specifically.

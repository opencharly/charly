xfce4-terminal:
    candy:
        version: 2026.144.1443
        description: |
            Xfce4 terminal emulator wired into the sway session
            Installs xfce4-terminal and a sway config.d snippet so the terminal
            is available in the desktop. Verifiable: the xfce4-terminal binary is
            installed and the sway config snippet lands at its expected path.
        require:
            - '@github.com/opencharly/pod-sway:v2026.235.2057'
        distro:
            fedora:
                package:
                    - xfce4-terminal
        plan:
            - run: mkdir=${HOME}/.config/sway/config.d
              mkdir: "${HOME}/.config/sway/config.d"
              run_as: "${USER}"
            - run: copy=xfce4-terminal.conf
              copy: xfce4-terminal.conf
              to: "${HOME}/.config/sway/config.d/xfce4-terminal.conf"
              mode: "0644"
              run_as: "${USER}"
            - check: the xfce4-terminal binary is installed at /usr/bin/xfce4-terminal
              file:
                file: /usr/bin/xfce4-terminal
                exists: true
            - check: the sway config snippet for the terminal is installed
              file:
                file: ${HOME}/.config/sway/config.d/xfce4-terminal.conf
                exists: true

xfce4-terminal-skill:
    skill:
        name: xfce4-terminal
        family: selkies
        owner: xfce4-terminal
        description: |-
            Xfce4 terminal emulator for Sway desktop environments with sway config integration.
            Use when working with terminal emulators in Sway desktop containers.
        content: |-
            # xfce4-terminal -- terminal emulator for Sway
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `sway` |
            | Install files | `charly.yml`, `task:` |
            
            ## Packages
            
            - `xfce4-terminal` (RPM) -- Xfce terminal emulator
            
            ## Usage
            
            ```yaml
            # charly.yml -- typically used via sway-desktop composition
            my-image:
              candy:
                - sway-desktop
            ```
            
            ## Used In Boxes
            
            Part of the `sway-desktop` composition candy. Used transitively in all desktop boxes.
            
            ## Related Candies
            
            - `/charly-selkies:sway` -- Sway compositor dependency
            - `/charly-selkies:sway-desktop` -- composition that includes this candy
            - `/charly-selkies:thunar` -- file manager (also in sway-desktop)
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Terminal emulator in Sway containers
            - Xfce4 terminal configuration
            - Sway desktop terminal access
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

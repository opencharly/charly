xurl:
    candy:
        version: 2026.200.1305
        description: |
            xurl — X (Twitter) API CLI for posts, search, DMs, and media
            Installs the @xdevplatform/xurl npm package globally (npm -g into
            ~/.npm-global/bin, placed on PATH by the nodejs candy). The package's
            postinstall downloads the real platform binary, but npm >=12 blocks
            install scripts unless they are explicitly allowed (the builder image
            carries npm 12), so the plan runs that one audited download script
            itself after the global install. Verifiable: the xurl binary lands at
            ~/.npm-global/bin/xurl and runs `--help`.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
        plan:
            - run: fetch the xurl platform binary — npm >=12 blocks the package postinstall (install.js) by default; run the package's own download script explicitly
              command: node "${HOME}/.npm-global/lib/node_modules/@xdevplatform/xurl/install.js"
              run_as: ${USER}
            - check: the xurl CLI is installed in the npm global bin
              file:
                file: ${HOME}/.npm-global/bin/xurl
                exists: true
            - check: the xurl CLI runs and prints its usage
              exit_status: 0
              command: ${HOME}/.npm-global/bin/xurl --help

xurl-skill:
    skill:
        name: xurl
        family: tools
        owner: xurl
        description: |-
            X (Twitter) API CLI for posts, search, DMs, and media.
            Use when working with the xurl candy.
        content: |
            # xurl -- X/Twitter API CLI
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `package.json` |
            | Depends | `nodejs` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [xurl]
            ```
            
            ## Used In Boxes
            
            - `openclaw-full` (via `openclaw-full` metalayer)
            
            ## Related Candies
            - `/charly-coder:nodejs` — runtime dependency
            - `/charly-openclaw:openclaw-full` — metalayer that bundles xurl
            - `/charly-hermes:hermes` — companion social/messaging agent
            
            ## Related Commands
            - `/charly-core:shell` — run xurl inside the container
            - `/charly-build:secrets` — store X/Twitter API credentials
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - X/Twitter API access in containers
            - Posting, searching, or managing Twitter/X content
            - The `xurl` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

        description: >-
            Proves the charly-dev candy installs the in-development binary on a disposable Arch cloud VM via the `copy: bin/charly` run step (the OS-tracked package install lives in the `charly` candy — this is the local-source variant for charly check beds). One command probe asserts charly resolves to /usr/bin/charly and charly version runs (CHARLY-BINARY-OK).

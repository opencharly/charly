              command: |
                installed="$(/usr/bin/charly version)" &&
                packaged="$(rpm -q charly | sed -n 's/^charly-\([0-9][0-9.]*\)-.*/\1/p')" &&
                echo "installed=[$installed] packaged=[$packaged]" &&
                test -n "$installed" && test -n "$packaged" &&
                test "$installed" = "$packaged" &&
                echo FEDORA-REPO-VERSION-OK
            - check: the welded command plugins dispatch project-less from /tmp
              id: fedora-welded-command-project-less
              exit_status: 0
              stdout:
                - contains: FEDORA-WELDED-CMD-OK
              context:
                - runtime
              command: |
                cd /tmp &&
                charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo FEDORA-WELDED-CMD-OK
check-debian-repo:
    vm:
        from: debian-repo-vm
        disposable: true
        lifecycle: dev
        description: >-
            Proves the repo-based install from the published charly-debian apt repo (opencharly.github.io/charly-debian) — the R10 acceptance for the nFPM packaging cutover's Debian leg. Boots the disposable Debian 13 (trixie) cloud-image VM (debian-repo-vm), installs the charly GPG key + adds the apt repo, `apt install charly`, asserts the PACKAGED /usr/bin/charly reports the same version the package manager recorded for the installed package, and proves the welded command plugins dispatch project-less from /tmp.
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: curl + gnupg are available for the key import
              id: debian-key-tooling
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              command: |
                sudo apt-get update &&
                sudo apt-get install -y curl gnupg
            - check: the charly GPG key is dearmored into /etc/apt/keyrings
              id: debian-repo-key-installed
              exit_status: 0
              context:
                - runtime
              command: |
                sudo mkdir -p /etc/apt/keyrings &&
                curl -fsSL https://opencharly.github.io/charly-debian/charly.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/charly.gpg &&
                test -s /etc/apt/keyrings/charly.gpg
            - check: the charly apt repo is added
              id: debian-repo-added
              exit_status: 0
              context:
                - runtime
              command: |
                echo 'deb [signed-by=/etc/apt/keyrings/charly.gpg] https://opencharly.github.io/charly-debian/ stable main' | sudo tee /etc/apt/sources.list.d/charly.list >/dev/null &&
                grep -q 'charly-debian' /etc/apt/sources.list.d/charly.list
            - check: apt-get update resolves the charly repo
              id: debian-apt-update
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              # apt-get update can exit 0 with only a warning for a failed repo;
              # a Candidate version can only come from the charly repo.
              command: |
                sudo apt-get update &&
                apt-cache policy charly | grep -qE 'Candidate: [0-9]'
            - check: apt-get install charly installs the package
              id: debian-charly-installed
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              command: |
                sudo apt-get install -y charly &&
                dpkg-query -W charly
            - check: charly version equals the repo's published CalVer
              id: debian-charly-version
              exit_status: 0
              stdout:
                - contains: DEBIAN-REPO-VERSION-OK
              context:
                - runtime
              command: |
                installed="$(/usr/bin/charly version)" &&
                packaged="$(dpkg-query -W charly | awk '{print $2}')" &&
                echo "installed=[$installed] packaged=[$packaged]" &&
                test -n "$installed" && test -n "$packaged" &&
                test "$installed" = "$packaged" &&
                echo DEBIAN-REPO-VERSION-OK
            - check: the welded command plugins dispatch project-less from /tmp
              id: debian-welded-command-project-less
              exit_status: 0
              stdout:
                - contains: DEBIAN-WELDED-CMD-OK
              context:
                - runtime
              command: |
                cd /tmp &&
                charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo DEBIAN-WELDED-CMD-OK

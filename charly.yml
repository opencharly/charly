        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
ubuntu-repo-vm:
    vm:
        source:
            kind: cloud_image
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
            base_user: ubuntu
            # REQUIRED, not decorative: sshUnitForDistro + composePackages are bare
            # lookups into the generated distro tables — nothing is inferred from
            # base_user, so omitting this renders an EMPTY sshd unit name and the wrong
            # package name on a Debian-family guest.
            distro: ubuntu
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
# alpine-repo-box — the check-alpine-repo bed's pod workload. A minimal Alpine base box
# (a raw registry image cannot be a pod's `image:` — the check-bed runner's image-build
# phase resolves it as a box name — so the pod needs a real charly box whose base IS the
# alpine image). No init metadata → the pod deploy starts it with `sleep infinity`; the
# repo-install check steps run in-container.
sudo-nopasswd:
    candy:
        version: 2026.229.0900
        description: |-
            Installs sudo and grants the uid-1000 account passwordless sudo via
            /etc/sudoers.d/charly-user, for a check bed that must drive a native
            package manager IN-CONTAINER. A charly box runs as uid 1000
            (WriteBootstrap has no root branch) and `run_as:` on a check step is not
            honoured by the check executor, so an in-container `apk add` has no other
            elevation path. Mirrors the sudoers rule /charly-coder:sshd installs,
            without pulling in an sshd service.
        distro:
            alpine:
                package:
                    - sudo
        plan:
            - run: grant the uid-1000 account passwordless sudo
              run_as: root
              command: |
                  account=$(getent passwd 1000 | cut -d: -f1)
                  if [ -z "$account" ]; then
                    echo "sudo-nopasswd: no uid-1000 account found, refusing to write sudoers" >&2
                    exit 1
                  fi
                  printf '%s ALL=(ALL) NOPASSWD: ALL\n' "$account" > /etc/sudoers.d/charly-user
                  chmod 0440 /etc/sudoers.d/charly-user
            - check: the sudo binary is installed
              id: sudo-nopasswd-binary
              exit_status: 0
              command: command -v sudo
            - check: passwordless sudo works and the drop-in is mode 0440
              id: sudo-nopasswd-sudoers
              exit_status: 0
              stdout:
                  - contains: "440"
              # Routed THROUGH sudo deliberately: /etc/sudoers.d is 0750 root:root,
              # so the uid-1000 account cannot stat inside it directly. Reading the
              # mode via sudo proves both halves at once — the drop-in is 0440 AND
              # the NOPASSWD rule actually grants elevation. The step fails if
              # either is wrong, which a direct stat could never show.
              command: sudo -n stat -c '%a' /etc/sudoers.d/charly-user
# =============================================================================
# charly-dev — the LOCAL-SOURCE charly install, for charly check beds ONLY.
#
# Declared HERE rather than in a candy/ directory on purpose. A candy takes its
# DECLARING FILE's directory as SourceDir (loader_threaded.go:395), so `copy:
# bin/charly` below resolves against the REPO ROOT — where `task build:binary`
# already writes the binary. The former candy/charly-dev/bin/charly copy, and the
# `cp` in taskfiles/Build.yml that kept it in step, existed only to make that path
# resolve from a candy dir; both are gone.
#
# General-use boxes compose `charly` (installed from the published per-distro
# package repos). This variant is the ONLY surviving `copy: bin/charly` install
# path, and a remote fetch of it is not a valid use: the binary is gitignored.
# =============================================================================
charly-dev:
    candy:
        version: 2026.238.1243
        description: |
            The in-development charly toolchain installed from LOCAL SOURCE — the on-PATH
            charly CLI baked from the repo-root `bin/charly` that `task build:binary`
            produces, plus the composed VM / encrypted-storage / console-relay stack. This
            is the CHECK-BED variant of the `charly` candy: it exists so a disposable R10
            bed always tests the code under development, and it is the ONLY place the
            legacy local-binary `copy: bin/charly` install path survives.
            General-use boxes compose `charly` (which installs the binary from the published
            per-distro package repos — charly-{alpine,arch,fedora,ubuntu,debian}); this
            charly-dev candy is for charly check beds ONLY.
            Consumed by bare name from the charly checkout (check-charly-vm, check-local-vm).
            It is declared in THIS file rather than a candy/ directory so that `copy:
            bin/charly` resolves against the repo root — a candy takes its declaring file's
            directory as SourceDir. There is no separate synced copy of the binary and no
            sync step: the candy reads the build output directly. The binary is gitignored,
            so this candy is inherently checkout-bound and has no meaningful remote form.
        candy:
            - '@github.com/opencharly/pod-virtualization:v2026.237.458'
            - '@github.com/opencharly/layer-gocryptfs:v2026.237.457'
            - '@github.com/opencharly/layer-socat:v2026.235.2057'
            # The four DETECTION-builders (pixi/npm/cargo/aur) are EXTERNAL out-of-process
            # plugins; the candy de-submodule cutover (Phase 4) deleted their in-repo dirs, so
            # they must be PINNED here for the connect path's pass-1 (the project's own candy
            # closure) to vendor them by tag — a version-less remote ref would fall to the
            # mutable default branch and hang on the freshness check.
            - '@github.com/opencharly/plugin-builder-pixi/candy/plugin-builder-pixi:v2026.237.1416'
            - '@github.com/opencharly/plugin-builder-npm/candy/plugin-builder-npm:v2026.237.1415'
            - '@github.com/opencharly/plugin-builder-cargo/candy/plugin-builder-cargo:v2026.237.1415'
            - '@github.com/opencharly/plugin-builder-aur/candy/plugin-builder-aur:v2026.237.1415'
            # The example plugins the test fixtures + check beds host-build/connect by word ref —
            # pinned here (post-cutover) so the project closure vendors them and the lazy-connect
            # pass-1 finds them by word without a version-less remote fetch.
            - '@github.com/opencharly/plugin-example-dispatch/candy/plugin-example-dispatch:v2026.237.1420'
            - '@github.com/opencharly/plugin-example-bootstrap/candy/plugin-example-bootstrap:v2026.237.1419'
            - '@github.com/opencharly/plugin-example-command/candy/plugin-example-command:v2026.237.1420'
            - '@github.com/opencharly/plugin-example-deploy/candy/plugin-example-deploy:v2026.237.1420'
            - '@github.com/opencharly/plugin-example-external/candy/plugin-example-external:v2026.237.1420'
            - '@github.com/opencharly/plugin-example-kind/candy/plugin-example-kind:v2026.237.1421'
            - '@github.com/opencharly/plugin-example-step/candy/plugin-example-step:v2026.237.1421'
            - '@github.com/opencharly/plugin-example-stepkind/candy/plugin-example-stepkind:v2026.237.1421'
            - '@github.com/opencharly/plugin-example-structkind/candy/plugin-example-structkind:v2026.237.1422'
        distro:
            debian:
                # tailscale is a mandatory charly dep but is NOT in Debian main, so the
                # .deb (packaging.formats.deb) omits it; the charly candy supplies it for
                # deb-family via the tailscale apt repo. arch/fedora get tailscale from
                # their native package's deps instead, so it is deb-family-scoped here.
                package:
                    - tailscale
                repo:
                    - name: tailscale
                      url: "https://pkgs.tailscale.com/stable/debian"
                      key: "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
                      suite: trixie
                      components: main
            ubuntu:
                package:
                    - tailscale
                repo:
                    - name: tailscale
                      url: "https://pkgs.tailscale.com/stable/ubuntu"
                      key: "https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg"
                      suite: noble
                      components: main
        plan:
            # The legacy local-binary install: bake the in-development binary at
            # /usr/bin/charly. `copy:` resolves against this manifest's own directory —
            # the repo root — so it reads the CalVer-stamped bin/charly that
            # `task build:binary` writes, with no intermediate copy.
            - run: copy=bin/charly
              copy: bin/charly
              to: /usr/bin/charly
              mode: "0755"
            - check: charly version prints a CalVer build stamp on stdout
              exit_status: 0
              stdout:
                - matches: "[0-9]{4}\\.[0-9]+"
              command: charly version
            - check: the gocryptfs encrypted-storage binary (gocryptfs candy) is installed
              file:
                file: /usr/bin/gocryptfs
                exists: true
            - check: the socat console-relay binary (socat candy) is installed
              file:
                file: /usr/bin/socat
                exists: true
            - check: the libvirt virsh client (virtualization candy) is installed
              file:
                file: /usr/bin/virsh
                exists: true
            - check: the qemu system emulator (virtualization candy) is installed
              file:
                file: /usr/bin/qemu-system-x86_64
                exists: true
            - check: charly doctor runs and emits its Summary line
              exit_status: 0
              command: charly doctor 2>&1 | grep -q "Summary:"
            - check: command=command -v charly
              id: charly-binary
              exit_status: 0
              stdout:
                # The local binary installs to /usr/bin/charly (the copy step's `to:`), but
                # on a usr-merged distro (Arch/CachyOS: /usr/sbin -> bin, /usr/sbin ahead
                # of /usr/bin in PATH) `command -v` reports it via /usr/sbin — the SAME
                # inode. Accept any /usr[/local]/{bin,sbin}/charly so the probe passes
                # regardless of which PATH alias resolved it (RE2: no $ anchor, which
                # wouldn't match the trailing newline).
                - matches: "/usr/(local/)?s?bin/charly"
              command: command -v charly
alpine-repo-box:
    candy:
        version: 2026.225.1508
        base: docker.io/library/alpine:3.24
        description: |-
            Minimal Alpine base box — the check-alpine-repo bed's pod workload. A small
            charly image whose ai.opencharly labels the pod deploy reads to start the
            container (no init → sleep infinity). The repo-install check steps run
            in-container.
        candy:
            - sudo-nopasswd
        build:
            - apk
        distro:
            - alpine
        plan:
            - check: the alpine base image is present
              id: alpine-base-present
              exit_status: 0
              command: cat /etc/alpine-release
# check-k3s-vm-ctx / check-k8s-deploy-cluster-ctx — per-BED kind:kubernetes cluster templates (task #18
# rework). check-k3s-vm and check-k8s-deploy-cluster both `from: k3s-vm` (the SAME shared kind:vm
# entity), so their kubeconfig contexts are now per-deploy-DOMAIN-scoped, not shared by entity (see
# candy/plugin-deploy-vm/lifecycle.go's OpArtifactKey + candy/plugin-kube/k3s_post.go) — each bed's
# k3sPostProvision merge lands under kit.SanitizeDeployName("vm:"+vmshared.VmDomainIdentity(<bed>)),
# i.e. literally "vm-check-k3s-vm" / "vm-check-k8s-deploy-cluster".
#
# `cluster: "${DEPLOY_NAME}"` CANNOT address this: for a VM-mode live check, DEPLOY_NAME is
# populated from the SHARED VM ENTITY name (candy/plugin-check/live_gather.go's
# pluginCheckLiveVM: `kit.SanitizeDeployName("vm:" + vmName)`, vmName being the kind:vm entity
# "k3s-vm" — NOT the deploy/bed name), so BOTH sibling beds resolve DEPLOY_NAME to the identical
# "vm-k3s-vm" — the cross-bed leak an earlier revision of this fix reintroduced (R10 catch: both
# beds' checks resolved through whichever ONE shared kubernetes profile "vm-k3s-vm" happened to be
# pinned to). Each bed instead names ITS OWN dedicated kind:kubernetes profile by LITERAL string —
# independent of the DEPLOY_NAME mechanism entirely, so no shared-entity leak is possible.
check-k3s-vm-ctx:

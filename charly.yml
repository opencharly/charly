# =================================================================
# check-gpu-local — R10 witness for cutover C11's externalized GPU/VFIO HOST-DETECTION
# (candy/plugin-gpu, verb:gpu) — the DETECTION cluster of the core-externalization program.
# A disposable kind:local deploy on host: local that runs the two deterministic, GPU-less
# `charly vm gpu` sub-commands host-side:
#   - `charly vm gpu status` → exits 0 and prints the VFIO/passthrough report; the in-core
#     Detect* shims (gpu_shim.go) resolve verb:gpu and Invoke the COMPILED-IN plugin, so
#     DetectVFIO() + MemlockLimitBytes() run THROUGH plugin-gpu (the IOMMU / vfio-pci /
#     memlock lines are always printed, so the assertion is host-independent).
#   - `charly vm gpu list`   → exits 0 (DetectVFIO() dispatches; prints the hostdevs block or
#     "No GPUs detected" — both host-dependent, so only exit 0 is asserted).
# The bed does NOT assert "GPUs: none detected": scanVFIO reports ANY display-class PCI
# device (incl. an integrated GPU), so that string is not host-deterministic — the always-
# printed header/IOMMU/vfio-pci/memlock lines are. The real driver-flip/NVENC path is NOT
# this bed's gate (it stays the gated cachyos GPU beds); the DRIVER-SWITCH + auto-allocation
# externalization is cutover C9 (arbiter + `charly vm gpu` coupling).
# =================================================================
check-gpu-app:
    local:
        description: |-
            Minimal kind:local template for the check-gpu-local bed — composes the
            compiled-in candy/plugin-gpu (verb:gpu, no install content) so the bed exercises
            the externalized GPU/VFIO host-detection via `charly vm gpu` host-side.
        candy:
            - '@github.com/opencharly/plugin-gpu/candy/plugin-gpu:v2026.237.1422'
check-gpu-local:
    local:
        from: check-gpu-app
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of cutover C11's externalized GPU/VFIO HOST-DETECTION (candy/plugin-gpu, verb:gpu), the DETECTION cluster of the core-externalization program. A disposable kind:local deploy on host: local runs `charly vm gpu status` + `charly vm gpu list` host-side: the in-core Detect* shims (gpu_shim.go) resolve verb:gpu and Invoke the COMPILED-IN plugin, so DetectVFIO() + MemlockLimitBytes() run through plugin-gpu. Both commands exit 0 and print the VFIO/passthrough report — proving plugin-gpu loads + the detection code path dispatches through it on this host. The driver-switch + auto-allocation primitives stay in core and externalize with the arbiter (cutover C9).
        plan:
            - check: command=charly vm gpu status exits 0 and prints the VFIO/passthrough report (proving DetectVFIO + MemlockLimitBytes dispatch through the compiled-in verb:gpu plugin)
              id: gpu-status-runs
              exit_status: 0
              stdout:
                - contains: 'VFIO / GPU passthrough status'
                - contains: 'IOMMU:'
                - contains: 'vfio-pci driver:'
                - contains: 'memlock limit:'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} vm gpu status
                in_container: false
            - check: command=charly vm gpu list exits 0 (proving DetectVFIO dispatches through the compiled-in verb:gpu plugin on a GPU-less-or-iGPU host)
              id: gpu-list-runs
              exit_status: 0
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} vm gpu list
                in_container: false

# =================================================================
# check-preflight-local — R10 witness for the RELOCATED check-run image
# PREFLIGHT (K-wave 2 cone R4: the "check-run" HostBuild kind's last arm
# "preflight" moved to candy/plugin-check's pluginCheckRunPreflight).
#
# The preflight arm fires ONLY on the ITERATE path when the sandbox classifies
# as TargetKindHost (candy/plugin-check/run_cmd.go, case targetKindHost). The
# bed is a GROUP (targetless → its resource children fold as MEMBERS with
# BARE-name venues), so the member named after the real project box
# check-k8s-deploy-app makes preflightImageCandidates(reply.Plan) yield a
# GENUINE image ref (NOT the bed's own name). pluginCheckRunPreflight then
# loads the project via loaderkit, filters agent-provisioned venues (this
# member is NOT agent_provisioned, so it is NOT skipped), and
# InvokeProvider("build","ensure")-ensures the candidate into local podman
# storage BEFORE the harness drives the AI. The member's check is a
# deterministic HOST probe — the member is a kind:local deploy (host-rooted),
# so the scoring chain is the host executor — asserting the ensured image is
# in local storage. NO other roster bed exercises this arm (no "preflight:"
# line in any bed log) and it has no end-to-end test (only the pure
# preflightImageCandidates unit test); this bed closes that gap live.
# =================================================================
check-preflight-sandbox:
    local:
        from: check-feature-app
        host: local
        description: >-
            Host-rooted sandbox marker for the check-preflight-local iterate bed. The ONLY
            deploy shape that classifies an iterate sandbox as TargetKindHost is a host-rooted
            venue (kind:local — venue shell, not leaf-only), so `charly check run
            check-preflight-local` dispatches the host-target arm that fires
            pluginCheckRunPreflight before the harness. Never brought up (a host-target run
            drives the harness in-process on the host).
check-preflight-local:
    group:
        disposable: true
        lifecycle: dev
        description: >-
            R10 witness for the RELOCATED check-run image preflight (K-wave 2 cone R4) — the
            pluginCheckRunPreflight body (candy/plugin-check/command.go) running live. A GROUP
            iterate bed whose sandbox is a host-rooted kind:local deploy (TargetKindHost): the
            host-target run arm collects preflightImageCandidates from the plan — the group's
            targetless root folds its resource children as MEMBERS with BARE-name venues, so the
            member named after the real box check-k8s-deploy-app yields that image ref as the
            preflight candidate — and pluginCheckRunPreflight ensures it into local podman
            storage via InvokeProvider("build","ensure") BEFORE the harness drives the AI. The
            member's check is a deterministic host probe (the member is a kind:local deploy, so
            its scoring chain is the host executor): `charly box list tags check-k8s-deploy-app`
            proves the ensured image is present locally. The AI's one iteration merely confirms
            the pre-ensured state; the preflight arm is the thing under test.
        iterate:
            sandbox: check-preflight-sandbox
            agent: [claude]
            plateau_iteration: 1
            prompt: >-
                == Where you are ==
                You are on the host directly (no container sandbox). The image
                `check-k8s-deploy-app` has ALREADY been ensured into local podman
                storage by the bed's preflight step — nothing to build, pull, or
                deploy.

                == Bed purpose ==
                This bed proves the relocated check-run image preflight. The only
                scored check probes the host for the ensured image:
                `charly box list tags check-k8s-deploy-app` (or `charly box list
                tags` and confirm `check-k8s-deploy-app` appears).

                == Your task ==
                Run that probe and confirm the image is present. Do NOT modify
                anything, do not build or deploy, do not create or delete files.
                Report the probe output and done.
    check-k8s-deploy-app:
        local:
            from: check-feature-app
            host: local
            plan:
                - check: the preflight ensured the check-k8s-deploy-app image into local podman storage — the host probe lists it among the local tags (proving pluginCheckRunPreflight's InvokeProvider("build","ensure") leg ran live before the harness)
                  id: preflight-image-ensured
                  context:
                    - runtime
                  command:
                    command: ${CHARLY_BIN} box list tags check-k8s-deploy-app
                    in_container: false
                  stdout:
                    - contains: check-k8s-deploy-app

# =============================================================================
# docs-site-app + check-docs — the R10 bed for the opencharly.ai documentation site.
#
# The bed builds the SITE ITSELF inside a disposable box: `npm ci` against the committed
# lockfile, then the production Astro build, then a set of checks asserting the built site's
# SHAPE. It is the acceptance gate for candy/plugin-docs (the runtime `charly docs` plugin) and
# for the published docs repo's committed content at the pinned DOCS_REF — a generator regression
# and a site-source regression both surface here, at image build, rather than as a broken deploy
# on Cloudflare. (The docs repo is standalone since the de-submodule cutover; its own deploy
# workflow owns generation, the content-drift gate, the Astro build and the publish — this bed
# proves the recipe still works against the current site.)
#
# The load-bearing assertion lives in the docs-site candy: a page for a plugin that is NOT in
# compiled_plugins (plugin-cdp), rendering both its runtime placement and its CUE parameter
# schema. That step fails the moment the generator narrows to documenting only what is compiled
# into the binary — the exact failure mode the catalog design exists to prevent.
# =============================================================================
docs-site-app:
    candy:
        version: 2026.215.1207
        base: quay.io/fedora/fedora:43
        description: |-
            The documentation-site box: a minimal Fedora base composing the docs-site candy,
            which clones the published docs repo, installs its node dependencies from the
            committed lockfile, and runs the production Astro build. The candy's checks run in
            BOTH contexts, so `charly check box docs-site-app` proves the site builds and has the
            right shape without deploying anything, and `charly check live` re-proves the same
            shape against the running pod — which is what makes the bed's fresh-rebuild leg
            assert the site rather than merely that the container is up.
        # The distro tag chain is load-bearing, not decoration: the package resolver walks the
        # IMAGE's declared chain most-specific-first, so a box that declares `base:` alone
        # matches no per-distro section and silently installs nothing. Omitting it is why the
        # first bed run died with `git: command not found` — docs-site's distro.fedora.package
        # never resolved, and no dnf step was emitted at all. Mirrors check-k8s-deploy-app.
        distro:
            - fedora:43
            - fedora
        candy:
            - '@github.com/opencharly/layer-docs-site:v2026.237.456'
check-docs:
    pod:
        image: docs-site-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the opencharly.ai documentation site. Deploying it to steady state proves
            the docs-site box — whose image build ran `npm ci` + the production Astro build and
            asserted the built site's shape (a generated CLI page, a candy page carrying its
            published acceptance plan, a recipe card with rewritten cross-references, a RUNTIME
            out-of-process plugin's page with its CUE schema, and the provider cross-index) —
            builds, starts, and stays up. The generator's own cross-reference integrity gate (an
            unresolvable /charly-x:y reference fails generation) is covered by the plugin's Go
            tests; this bed covers the artifact those produce. Content staleness against the
            pinned charly is gated by the docs repo's own deploy workflow, not here.
        plan:
            - check: the docs-site pod reached steady state (the built site's box runs)
              id: docs-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-docs
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the built site is present in the running container, entry point included
              id: docs-pod-site-present
              exit_status: 0
              stdout:
                - contains: OpenCharly
              context:
                - runtime
              command: cat /srv/docs/dist/index.html

# =============================================================================

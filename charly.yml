# candy/plugin-example-deploy (recognized at parse time via the plugin-declaration
# pre-scan, connected at deploy time via loadDeployPlugins). Add Invokes the plugin
# out-of-process; it dials back through the SDK Executor to write markers on the host
# venue under a disposable /tmp scratch dir, and returns a plugin-script reverse op
# the host records + replays at teardown. Zero operator side-effect (markers under
# /tmp, removed by `charly fleet del`).
check-exampledeploy:
    exampledeploy:
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the external (out-of-process) deploy-target lifecycle (Add/Test/Update/Del) over the E3b ExecutorService reverse channel, AND of the F2 executable deploy channel. Composes plugin-example-deploy as an external deploy: substrate; Add Invokes the host-built plugin out-of-process with the deployment's InstallPlan views — carrying the serializable per-step IR. The plugin dials back through the SDK Executor to (a) write an apply + a probe marker, (b) WALK + EXECUTE the plan's steps on the host venue (a file-write step lands /tmp/charly-exampledeploy-steps/written and a shell-hook env step lands env.d/plugin-example-deploy.env), and (c) PUSH /tmp/charly-exampledeploy-steps/pushed via the reverse-channel PutFile leg. Host-side command probes assert the probe marker, the executed-step effects, and the pushed file; the fresh-rebuild (charly update) re-applies idempotently; teardown (charly fleet del) replays the recorded plugin-script reverse ops so every scratch dir is gone (zero residue).
        add_candy:
            - '@github.com/opencharly/plugin-example-deploy/candy/plugin-example-deploy:v2026.237.1420'
        plan:
            - check: command=test -f /tmp/charly-exampledeploy/check-exampledeploy/probe && echo EXAMPLEDEPLOY-PROBE-PRESENT
              id: exampledeploy-applied
              description: the external deploy plugin applied its probe marker on the host venue via the E3b reverse channel
              stdout:
                - contains: EXAMPLEDEPLOY-PROBE-PRESENT
              context:
                - runtime
              command:
                command: "test -f /tmp/charly-exampledeploy/check-exampledeploy/probe && echo EXAMPLEDEPLOY-PROBE-PRESENT"
                in_container: false
            - check: the external deploy plugin EXECUTED the file-write step from the round-tripped per-step IR — the authored dest holds the step's content
              id: exampledeploy-step-write
              description: F2 — the serializable InstallPlan.Steps round-tripped to the plugin, which executed the Op write step on the venue
              stdout:
                - contains: EXAMPLEDEPLOY-STEP-WRITE-OK
              context:
                - runtime
              command:
                command: "cat /tmp/charly-exampledeploy-steps/written"
                in_container: false
            - check: the external deploy plugin EXECUTED the shell-hook (env:) step — the rendered env.d file holds the contributed env var
              id: exampledeploy-step-env
              description: F2 — the ShellHook step round-tripped and the plugin materialized its env var on the venue
              stdout:
                - contains: EXAMPLEDEPLOY_STEP_ENV=present
              context:
                - runtime
              command:
                command: "cat /tmp/charly-exampledeploy-steps/env.d/plugin-example-deploy.env"
                in_container: false
            - check: the external deploy plugin PUSHED a file via the new reverse-channel PutFile leg — the pushed file landed on the venue with its content
              id: exampledeploy-putfile
              description: F2 — the ExecutorService PutFile RPC placed plugin-originated content on the venue
              stdout:
                - contains: EXAMPLEDEPLOY-PUTFILE-OK
              context:
                - runtime
              command:
                command: "cat /tmp/charly-exampledeploy-steps/pushed"
                in_container: false
# charly-dev candy binary-install witness against the LOCAL charly-dev candy (no @github):
# deploys the charly-dev candy declared in THIS file to a disposable Arch Cloud VM, where
# the layer's `copy: bin/charly` run step places the in-development binary at
# /usr/bin/charly. The
# OS-tracked package install (the former localpkg: map) is GONE — the sdk's
# localpkg machinery now builds via the `charly generate-packages` plugin
# (sdk/packagekit) from the `charly` candy's `packaging:` section. The copy step
# survives ONLY in the charly-dev candy (the local-source install for charly check
# beds); this bed proves the in-development binary lands on a fresh Arch VM (the
# repo-based install proof lives in the per-distro check beds).
check-charly-vm:
    vm:
        from: charly-vm

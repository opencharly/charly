# The five per-distro REPO check beds — the R10 acceptance for the nFPM packaging
# cutover's repo-based install leg. Each proves the published distro repo
# (opencharly.github.io/charly-{alpine,arch,fedora,ubuntu,debian}) installs charly
# via the NATIVE package manager (apk add / pacman -S / dnf install / apt install),
# that `charly version` equals the repo's published CalVer, and that the welded
# command plugins dispatch project-less from /tmp. They deliberately do NOT rely on
# the localpkg mechanism (the check-bed runner auto-sets --dev-local-pkg, which
# forces the dev build path) — the plan steps add the published repo + key and
# install via the package manager, so a bed passes only when the published repo is
# live and correct. The arch bed additionally installs the `charly-minimal` variant
# and asserts its minimal plugin set.
check-alpine-repo:
    pod:
        image: alpine-repo-box
        disposable: true
        lifecycle: dev
        description: >-
            Proves the repo-based install from the published charly-alpine apk repo (opencharly.github.io/charly-alpine) — the R10 acceptance for the nFPM packaging cutover's Alpine leg. Deploys a disposable Alpine container pod (alpine-repo-box — a raw registry image cannot be a pod's `image:`, and Alpine's cloud-init/OpenRC path is not systemd, so a container is the honest substrate), installs the charly RSA key + adds the apk repo, `apk add charly`, asserts the PACKAGED /usr/bin/charly reports the same version the package manager recorded for the installed package, and proves the welded command plugins dispatch project-less from /tmp.
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: the charly apk repo RSA key is installed and the repo is added
              id: alpine-repo-key-and-repo
              exit_status: 0
              context:
                - runtime
              command: |
                sudo apk add --no-cache curl &&
                sudo curl -fsSL -o /etc/apk/keys/charly.rsa.pub https://opencharly.github.io/charly-alpine/charly.rsa.pub &&
                echo 'https://opencharly.github.io/charly-alpine/amd64' | sudo tee -a /etc/apk/repositories >/dev/null &&
                grep -q '^https://opencharly.github.io/charly-alpine/amd64$' /etc/apk/repositories
            - check: apk update resolves the charly repo
              id: alpine-apk-update
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              # `apk update` alone exits 0 even when a repo is unreachable — it
              # warns and carries on — so it cannot prove the charly index was
              # fetched. Listing the package proves it: `charly` is in no Alpine
              # repo, so a non-empty listing is only possible from the charly
              # index at <repo>/<apk-arch>/APKINDEX.tar.gz.
              command: |
                sudo apk update &&
                apk list charly | grep -q '^charly-'
            - check: apk add charly installs the package
              id: alpine-charly-installed
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              command: |
                sudo apk add charly &&
                apk info -e charly
            - check: charly version equals the repo's published CalVer
              id: alpine-charly-version
              exit_status: 0
              stdout:
                - contains: ALPINE-REPO-VERSION-OK
              context:
                - runtime
              command: |
                installed="$(/usr/bin/charly version)" &&
                packaged="$(apk list --installed charly | sed -n 's/^charly-\([0-9][0-9.]*\) .*/\1/p')" &&
                echo "installed=[$installed] packaged=[$packaged]" &&
                test -n "$installed" && test -n "$packaged" &&
                test "$installed" = "$packaged" &&
                echo ALPINE-REPO-VERSION-OK
            - check: the welded command plugins dispatch project-less from /tmp
              id: alpine-welded-command-project-less
              exit_status: 0
              stdout:
                - contains: ALPINE-WELDED-CMD-OK
              context:
                - runtime
              command: |
                cd /tmp &&
                charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo ALPINE-WELDED-CMD-OK
check-arch-repo:
    vm:
        from: arch-repo-vm
        disposable: true
        lifecycle: dev
        description: >-
            Proves the repo-based install from the published charly-arch pacman repo (opencharly.github.io/charly-arch) — the R10 acceptance for the nFPM packaging cutover's Arch leg. Boots the disposable Arch cloud-image VM (arch-repo-vm, ssh.port_auto so it never collides with check-arch-vm's fixed port 2224), imports + locally signs the charly GPG key, adds the [charly] repo, `pacman -S charly`, asserts the PACKAGED /usr/bin/charly reports the same version the package manager recorded for the installed package, then removes charly and installs the `charly-minimal` variant, asserting its minimal plugin set dispatches.
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: the charly GPG key is imported and locally signed
              id: arch-repo-key-imported
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              command: |
                sudo pacman-key --init &&
                sudo pacman-key --populate archlinux &&
                curl -fsSL -o /tmp/charly.gpg https://opencharly.github.io/charly-arch/charly.gpg &&
                sudo pacman-key --add /tmp/charly.gpg &&
                KEYID=$(gpg --with-colons --import-options show-only --import /tmp/charly.gpg | awk -F: '/^pub/{print $5}') &&
                test -n "$KEYID" &&
                sudo pacman-key --lsign-key "$KEYID"
            - check: the [charly] repo is added to pacman.conf
              id: arch-repo-added
              exit_status: 0
              context:
                - runtime
              command: |
                printf '[charly]\nServer = https://opencharly.github.io/charly-arch/amd64\nSigLevel = Required\n' | sudo tee -a /etc/pacman.conf >/dev/null &&
                grep -q '^\[charly\]$' /etc/pacman.conf &&
                grep -q '^Server = https://opencharly.github.io/charly-arch/amd64$' /etc/pacman.conf
            - check: pacman -Sy refreshes the charly repo db
              id: arch-pacman-sy
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              # -Sy alone cannot prove the charly repo resolved (it warns and
              # carries on); -Si can only succeed from the charly sync DB.
              command: |
                sudo pacman -Sy --noconfirm &&
                pacman -Si charly >/dev/null
            - check: pacman -S charly installs the package
              id: arch-charly-installed
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              command: |
                sudo pacman -S --noconfirm charly &&
                pacman -Q charly
            - check: charly version equals the repo's published CalVer
              id: arch-charly-version
              exit_status: 0
              stdout:
                - contains: ARCH-REPO-VERSION-OK
              context:
                - runtime
              command: |
                installed="$(/usr/bin/charly version)" &&
                packaged="$(pacman -Q charly | awk '{print $2}' | cut -d- -f1)" &&
                echo "installed=[$installed] packaged=[$packaged]" &&
                test -n "$installed" && test -n "$packaged" &&
                test "$installed" = "$packaged" &&
                echo ARCH-REPO-VERSION-OK
            - check: the welded command plugins dispatch project-less from /tmp
              id: arch-welded-command-project-less
              exit_status: 0
              stdout:
                - contains: ARCH-WELDED-CMD-OK
              context:
                - runtime
              command: |
                cd /tmp &&
                charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo ARCH-WELDED-CMD-OK
            - check: charly-minimal installs after removing charly (both provide /usr/bin/charly)
              id: arch-charly-minimal-installed
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              command: |
                sudo pacman -R --noconfirm charly &&
                sudo pacman -S --noconfirm charly-minimal
            - check: the minimal variant ships only the doctor/clean/settings plugin set
              id: arch-minimal-plugin-set
              exit_status: 0
              stdout:
                - contains: ARCH-MINIMAL-PLUGIN-SET-OK
              context:
                - runtime
              command: |
                test -f /usr/lib/charly/plugins/plugin-doctor.providers &&
                test -f /usr/lib/charly/plugins/plugin-clean.providers &&
                test -f /usr/lib/charly/plugins/plugin-settings.providers &&
                test ! -f /usr/lib/charly/plugins/plugin-vm.providers &&
                echo ARCH-MINIMAL-PLUGIN-SET-OK
check-fedora-repo:
    vm:
        from: fedora-repo-vm
        disposable: true

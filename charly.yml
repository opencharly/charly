        description: |-
            The marketplace-corpus box: a minimal Fedora base composing the plugin-marketplace
            candy, whose plan: clones the published opencharly/marketplace repo at the pinned
            MARKETPLACE_REF and gates its shape (catalogs, manifests, baked headers, setup).
            The checks run in BOTH contexts, so `charly check box marketplace-app` proves the
            published corpus shape without deploying anything, and `charly check live` re-proves
            it against the running pod.
        # The distro tag chain is load-bearing (the docs-site-app precedent).
        distro:
            - fedora:43
            - fedora
        candy:
            - '@github.com/opencharly/plugin-marketplace/candy/plugin-marketplace:v2026.241.1105'
check-marketplace:
    pod:
        image: marketplace-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the published marketplace corpus. Building the marketplace-app box ran
            the plugin-marketplace candy's plan: — the clone at the pinned MARKETPLACE_REF plus
            the shape gates (catalogs, no-version manifests, baked skill headers, executable
            pinned-commit check); deploying the pod to steady state proves the box builds,
            starts, and stays up. The generator's fail-closed drift gate + the Go coverage are
            covered by the plugin's Go tests and the marketplace repo's own deploy workflow;
            this bed covers the published artifact those produce.
        plan:
            - check: the marketplace-app pod reached steady state (the corpus-gating box runs)
              id: marketplace-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-marketplace
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the published marketplace clone is present in the running pod
              id: marketplace-clone-present
              exit_status: 0
              stdout:
                - contains: charly-plugins
              context:
                - runtime
              command: cat /srv/marketplace/.claude-plugin/marketplace.json

# =============================================================================
# dsh-app + check-dsh-pod — the R10 bed for the deepseek-harness dsh candy + the
# compiled-in plugin-dsh management plugin (command:dsh + verb:dsh).
#
# The bed builds a minimal Fedora box composing nodejs + dsh. The npm builder
# (fedora.fedora-builder) installs @deepseek-ai/dsh 0.1.0-rc.6 globally; node-pty
# (a dsh dependency) ships NO linux-x64 prebuild in the npm tarball, so its install
# script falls through to node-gyp — the fedora-builder's build-toolchain provides
# gcc/make/python3, and the compiled pty.node is N-API (ABI-stable across node
# versions, so building against the builder's node 20 runs on the image's node 22).
# The dsh service boots `dsh web` (loopback-only, 127.0.0.1:3080) and the
# charly-owned dsh-entrypoint exec's a socat forwarder exposing it on eth0:3081
# (socat cannot share port 3080 with the loopback listener — Linux forbids a
# wildcard + specific pair on one port — so the published port maps the
# auto-allocated host port to container 3081).
# The bed asserts: the pod reaches steady state, the dsh service runs, the web UI
# answers HTTP 200 in-box AND through the published port (the socat forwarder),
# node >= 22.19.0 (the dsh floor), the four dsh: verb methods dispatch in-box, and
# the compiled-in `charly dsh status` command reaches the deployed box over the
# pod-lifecycle reverse channel.
# =============================================================================
dsh-app:
    candy:
        version: 2026.226.1600
        base: quay.io/fedora/fedora:43
        description: |-
            The deepseek-harness box: a minimal Fedora base composing the nodejs and
            dsh candies. The npm builder installs @deepseek-ai/dsh 0.1.0-rc.6 globally
            (node-pty's native module builds via node-gyp in the fedora-builder's
            build-toolchain); the dsh service boots the loopback-bound web UI and a
            socat forwarder exposes it on the container's eth0. The candy's checks run
            in BOTH contexts, so `charly check box dsh-app` proves the CLI installs and
            the node floor holds without deploying, and `charly check live` re-proves
            the same shape against the running pod plus the service + web UI.
        # The distro tag chain is load-bearing (the docs-site-app precedent): the
        # package resolver walks the IMAGE's declared chain most-specific-first, so a
        # box that declares `base:` alone matches no per-distro section and silently
        # installs nothing.
        distro:
            - fedora:43
            - fedora
        # The npm builder must be explicit: a namespace-qualified base contributes no
        # builder map, and the distro-keyed default (from the fedora box) provides bare
        # `fedora-builder` values that don't resolve in the main repo. The namespaced
        # `fedora.fedora-builder` matches the main repo's convention (check-builder-vm).
        builder:
            npm: fedora.fedora-builder
        candy:
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
            - '@github.com/opencharly/pod-dsh:v2026.237.558'
check-dsh-pod:
    pod:
        image: dsh-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the deepseek-harness dsh candy + the compiled-in plugin-dsh
            management plugin. Deploying it to steady state proves the dsh-app box —
            whose image build ran the npm builder (installing @deepseek-ai/dsh
            0.1.0-rc.6 globally, node-pty's native module built via node-gyp) and
            asserted the CLI + node floor — builds, starts, and stays up with the dsh
            service running, the loopback-bound web UI answering HTTP 200 in-box AND
            through the socat forwarder on the published port, the four dsh: verb
            methods dispatching in-box, and the compiled-in `charly dsh status`
            command reaching the deployed box over the pod-lifecycle reverse channel.
        plan:
            - check: the dsh-app pod reached steady state (the dsh box runs)
              id: dsh-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-dsh-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the dsh service is running under the init system in the pod
              id: dsh-service-running
              service:
                service: dsh
                running: true
              context: [runtime]
            - check: the dsh web UI answers HTTP 200 on 127.0.0.1:3080 in-box
              id: dsh-web-inbox
              timeout: 30s
              context: [runtime]
              command: curl -fsS -o /dev/null http://127.0.0.1:3080/
            - check: the dsh web UI answers HTTP 200 through the published port (the socat forwarder)
              id: dsh-web-published
              timeout: 30s
              context: [runtime]
              http:
                http: "http://127.0.0.1:${HOST_PORT:3081}/"
                status: 200
            - check: node is at least 22.19.0 (the deepseek-harness dsh floor)
              id: dsh-node-floor
              exit_status: 0
              context: [runtime]
              command: |
                node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22||(maj===22&&min<19)) process.exit(1)'
            - check: the dsh version verb reports the dsh version in-box
              id: dsh-verb-version
              dsh:
                method: version
              context: [runtime]
            - check: the dsh web-running verb probes the web UI in-box
              id: dsh-verb-web-running
              dsh:
                method: web-running
              context: [runtime]
            - check: the dsh profile-list verb lists the profiles in-box
              id: dsh-verb-profile-list
              dsh:
                method: profile-list
              context: [runtime]
            - check: the dsh plugin-list verb lists the web profile's plugins in-box
              id: dsh-verb-plugin-list
              dsh:
                method: plugin-list
              context: [runtime]
            - check: the compiled-in charly dsh status command reaches the deployed box over the reverse channel
              id: dsh-cmd-status
              exit_status: 0
              stdout:
                - contains: "web UI: HTTP 200 on 127.0.0.1:3080"
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} dsh status --box check-dsh-pod
                in_container: false

# =============================================================================
# agentteams + agentteams-manager + check-agentteams-pod — the R10 bed for the
# full AgentTeams stack (minio, matrix, element, higress, controller) on the
# cachyos base. Every service runs as the image user (uid 1000) against its own
# home-relative volume (~/.agentteams/minio, ~/.agentteams/matrix,
# ~/.agentteams/higress, ~/.agentteams/controller) — the rootless charly
# architecture, no root anywhere. The bed binds the host rootless podman socket
# into the box so the controller can spawn the manager container from the
# pre-built agentteams-manager image (AGENTTEAMS_MANAGER_IMAGE) on the charly
# network.
# =============================================================================
agentteams:
    candy:
        version: 2026.223.1500
        base: cachyos.cachyos
        description: |-
            The AgentTeams top box: a cachyos base composing the agentteams top
            composition candy — agentteams-minio (MinIO S3 + mc-mirror),
            agentteams-matrix (Tuwunel Matrix homeserver), agentteams-element
            (Element Web via rootless nginx), agentteams-higress (the Higress AI
            gateway: apiserver, controller, pilot, envoy gateway, console), and
            agentteams-controller (the kine-backed kube-apiserver + Manager/
            Worker/Team/Human reconciler serving the REST API on :8090). Every
            service runs as the image user (uid 1000) against its own
            home-relative volume (~/.agentteams/minio, ~/.agentteams/matrix,
            ~/.agentteams/higress, ~/.agentteams/controller) — the rootless charly
            architecture, no root anywhere. All service start scripts are
            charly-owned (written by the candies), not upstream AgentTeams
            scripts. Spawned Manager/Worker containers join the charly network
            and reach the controller — and every in-container service — by the
            controller container's DNS name.
        candy:
            - '@github.com/opencharly/layer-supervisord:v2026.239.1300'
            - '@github.com/opencharly/layer-agentteams:v2026.237.804'
agentteams-manager:
    candy:
        version: 2026.224.0600
        base: cachyos.cachyos
        tag: manager
        description: |-
            The AgentTeams manager image: a cachyos base composing the
            agentteams-manager layer — the openclaw gateway runtime (built from
            the pinned upstream source commit because the matrix channel
            extension is not in the npm openclaw package) with the agt REST
            client and mc. The controller spawns this image for the default
            Manager CR through the host rootless podman socket; the manager
            joins the charly network and reaches the controller's in-container
            services by the controller container's DNS name. Rootless: the
            service runs as the image user (uid 1000).
        # The controller spawns the manager container DIRECTLY from this image's
        # baked OCI config (its dockerCreatePayload sends no Cmd/Entrypoint), with
        # no charly deploy in the loop to inject the init command — so the manager
        # box bakes the supervisord init as its OCI entrypoint. The base image's
        # inherited default command is cleared at emission (CMD []), so the
        # entrypoint runs bare. /etc/supervisord.conf is assembled at build time.
        entrypoint:
            - supervisord
            - -n
            - -c
            - /etc/supervisord.conf
        candy:
            - '@github.com/opencharly/layer-supervisord:v2026.239.1300'
            - '@github.com/opencharly/pod-agentteams-manager:v2026.239.1603'
agentteams-worker:
    candy:
        version: 2026.224.0600
        base: cachyos.cachyos
        tag: worker
        description: |-
            The AgentTeams worker image: a cachyos base composing the
            agentteams-worker layer — the openclaw gateway runtime (built from
            the pinned upstream source commit) with the agt REST client, mc, and
            the shared AgentTeams protocol libs. The controller spawns this image
            for Worker CRs through the host rootless podman socket; the worker
            joins the charly network and reaches the controller's in-container
            services by the controller container's DNS name. Rootless: the
            service runs as the image user (uid 1000).
        # The controller spawns the worker container DIRECTLY from this image's
        # baked OCI config (its dockerCreatePayload sends no Cmd/Entrypoint), with
        # no charly deploy in the loop to inject the init command — so the worker
        # box bakes the supervisord init as its OCI entrypoint, exactly like the
        # manager box. The base image's inherited default command is cleared at
        # emission (CMD []), so the entrypoint runs bare. /etc/supervisord.conf is
        # assembled at build time.
        entrypoint:
            - supervisord
            - -n
            - -c
            - /etc/supervisord.conf
        candy:
            - '@github.com/opencharly/layer-supervisord:v2026.239.1300'
            - '@github.com/opencharly/pod-agentteams-worker:v2026.239.1600'
check-agentteams-pod:
    pod:
        image: agentteams
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the full AgentTeams stack. Deploying the box to steady state proves
            the minio S3 API, the Tuwunel Matrix homeserver, the Element Web client, the
            Higress AI gateway, and the controller (kube-apiserver + REST API) all build,
            start, and stay up as uid 1000 against their own home-relative volumes
            (~/.agentteams/minio, ~/.agentteams/matrix, ~/.agentteams/higress,
            ~/.agentteams/controller) — and that the controller spawns the manager container
            from the pre-built agentteams-manager image through the host rootless podman
            socket (AGENTTEAMS_MANAGER_IMAGE), then creates a Worker CR and spawns the
            worker container from the pre-built agentteams-worker image
            (AGENTTEAMS_WORKER_IMAGE), which reaches Running and joins its Matrix room.
        volume:
            - name: podman-socket
              type: bind
              host: /run/user/1000/podman/podman.sock
              path: /run/user/1000/podman/podman.sock
        env:
            AGENTTEAMS_MANAGER_IMAGE: ghcr.io/opencharly/agentteams-manager:manager
            AGENTTEAMS_WORKER_IMAGE: ghcr.io/opencharly/agentteams-worker:worker
        security:
            security_opt:
                - label=disable
        plan:
            - check: the agentteams pod reached steady state
              id: agentteams-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-agentteams-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the minio S3 API answers its health probe
              id: agentteams-minio-health
              timeout: 30s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:9000}/minio/health/live"
                status: 200
            - check: the Matrix homeserver answers the client versions endpoint
              id: agentteams-matrix-versions
              timeout: 30s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:6167}/_matrix/client/versions"
                status: 200
            - check: the Element Web client answers on its port
              id: agentteams-element-http
              timeout: 30s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:8088}/"
                status: 200
            - check: the Higress apiserver answers on its internal port
              id: agentteams-higress-apiserver
              timeout: 60s
              context:
                - runtime
              command: 'curl -sk https://127.0.0.1:18443/version | grep -q "gitVersion"'
            - check: the Higress gateway is healthy (pilot-agent + envoy answer the status port; bounded probe — envoy's V8 WASM engine segfaults once at startup under the upstream --concurrency default and the init's restart policy covers the ~15s down window on both substrates)
              id: agentteams-higress-gateway-health
              timeout: 60s
              context:
                - runtime
              command: 'for i in $(seq 1 28); do curl -sf http://127.0.0.1:15021/healthz/ready && exit 0; sleep 2; done; exit 1'
            - check: the Higress gateway serves the console on its ingress port (the 8080 listener only materializes when the proxy node LABELS match the Gateway selector; bounded probe for the same startup/restart window)
              id: agentteams-higress-gateway-http
              timeout: 60s
              context:
                - runtime
              command: |
                  for i in $(seq 1 28); do
                      code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
                      [ "${code}" = "200" ] && exit 0
                      sleep 2
                  done
                  exit 1
            - check: the Higress console answers on its port
              id: agentteams-higress-console-http
              timeout: 60s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:8001}/"
                status: 200
            - # The `agentteams:` check verb (the declarative controller-probe counterpart of
              # the `charly agentteams` command plugin) replaces the raw curl sequence: the
              # provider resolves the controller's in-venue :8090 to a host-routable address
              # over the reverse channel (the box's published port), pulls the admin SA token
              # from the venue, and probes with the SAME apiClient the command uses (R3 — one
              # REST surface covers the CLI and every bed).
              check: the controller spawns the default manager and it reaches Running phase (proves the manager image is in the host store under AGENTTEAMS_MANAGER_IMAGE and the controller can spawn it through the bound podman socket)
              id: agentteams-manager-running
              timeout: 300s
              context:
                - runtime
              agentteams:
                method: manager-running
              stdout:
                - contains: "Running"
            - check: the controller creates a Worker CR, spawns the worker container from the pre-built agentteams-worker image, and the worker reaches Running with its Matrix room created (proves AGENTTEAMS_WORKER_IMAGE is in the host store and the controller can spawn the worker through the bound podman socket)
              id: agentteams-worker-running
              timeout: 300s
              context:
                - runtime
              agentteams:
                method: worker-running
              stdout:
                - contains: "room alias resolvable"
            - # The `agentteams:` check verb exercised LIVE against the running controller —
              # the declarative counterpart of the compiled-in `charly agentteams` command
              # plugin. The verb is HOST-BASED (the mcp pattern): the provider resolves the
              # controller's in-venue :8090 to a host-routable address over the reverse
              # channel (the box's published port), pulls the admin SA token from the venue,
              # and probes with the SAME apiClient the command uses (R3 — one REST surface
              # covers the CLI and every bed).
              check: "the `agentteams: status` verb reaches the live controller with the admin token and reports the resource counts"
              id: agentteams-plugin-status
              timeout: 60s
              context:
                - runtime
              agentteams:
                method: status
              stdout:
                - contains: "Total Workers:"
            - check: "the `agentteams: worker-list` verb lists the bed-worker the controller spawned (proves the verb's REST client + token discovery work end-to-end)"
              id: agentteams-plugin-worker-list
              timeout: 60s
              context:
                - runtime
              agentteams:
                method: worker-list
              stdout:
                - contains: "bed-worker"
            - # The compiled-in `charly agentteams config` command reports the controller
              # endpoint WITHOUT any network — a deterministic live proof that the CLI's
              # default fallback matches the box's actual host-mapped port. The controller
              # serves :8090 in-container and the box host-maps it by default
              # auto-allocation, so the default is http://127.0.0.1:8090 (the R4a fix that
              # replaced the unreachable upstream 18090 published-port default). The env is
              # cleared so a host-shell AGENTTEAMS_CONTROLLER_URL cannot mask the default.
              check: the compiled-in `charly agentteams config` command reports the controller endpoint default 8090
              id: agentteams-plugin-config-default
              timeout: 60s
              context:
                - runtime
              command:
                command: |
                    unset AGENTTEAMS_CONTROLLER_URL AGENTTEAMS_AUTH_TOKEN AGENTTEAMS_AUTH_TOKEN_FILE
                    "${CHARLY_BIN}" agentteams config
                in_container: false
              stdout:
                - contains: "Controller URL: http://127.0.0.1:8090"
# check-agentteams-snapshot — the R10 bed for Factory Unit 6, the snapshot/hydrate
# round-trip.
#
# The round-trip is asserted by STATE THAT SURVIVES IT, never by the two commands
# exiting 0 — a snapshot that writes an empty bundle and a hydrate that applies
# nothing both exit 0, so exit status cannot distinguish a working round-trip from
# a vacuous one.
#
# The worker is DELETED between snapshot and apply and its absence asserted. That
# is what makes the hydrate half discriminate: `charly agentteams apply` never
# deletes (control.go's applyPathWithClient has no delete path), so with the worker
# left in place a completely vacuous hydrate would still satisfy the final
# assertion. Without the delete the check could not fail for the reason it names.
#
# The check runs INSIDE the controller pod: the controller serves its REST API on
# 127.0.0.1:8090 and refuses a connection from outside, so a host-side invocation
# cannot reach it. The `agentteams` box deliberately does NOT carry the charly
# toolchain — it is a production composition — so the bed overlays
# candy/agentteams-snapshot via add_candy: on the DEPLOY rather than bloating the
# box for a check.
check-agentteams-snapshot:
    pod:
        image: agentteams
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for Factory Unit 6. Proves the snapshot/hydrate round-trip against a
            live AgentTeams deploy: the controller's worker is captured into a hydration
            bundle, the worker is DELETED, the bundle is applied back, and the worker is listed again.
        # The worker is DELETED between snapshot and apply, and its absence asserted,
        # so the hydrate half can fail: `charly agentteams apply` never deletes
        # (control.go's applyPathWithClient has no delete path), so without the
        # delete a completely vacuous hydrate would leave the worker in place and
        # the final assertion would pass regardless. That made the check unable to
        # fail for the reason it names.
        #
        # The round-trip check runs `charly agentteams snapshot|apply` INSIDE the
        # controller pod: the controller serves its REST API on 127.0.0.1:8090 and
        # refuses a connection from outside, so a host-side invocation cannot reach
        # it. The `agentteams` box deliberately does NOT carry the charly toolchain
        # — it is a production composition — so the bed overlays it here instead of
        # bloating the box for a check. Without this the step fails with
        # `sh: charly: command not found`, which is what the first run did.
        add_candy:
            - agentteams-snapshot
        volume:
            - name: podman-socket
              type: bind
              host: /run/user/1000/podman/podman.sock
              path: /run/user/1000/podman/podman.sock
        env:
            AGENTTEAMS_MANAGER_IMAGE: ghcr.io/opencharly/agentteams-manager:manager
            AGENTTEAMS_WORKER_IMAGE: ghcr.io/opencharly/agentteams-worker:worker
        security:
            security_opt:
                - label=disable
        plan:
            - check: the snapshot/hydrate round-trip preserves the controller's worker
              id: snapshot-roundtrip
              exit_status: 0
              stdout:
                - contains: ROUNDTRIP-OK
              context:
                - runtime
              command:
                command: >-
                    sh -c 'set -e;
                    charly agentteams worker list | grep -q bed-worker ||
                    charly agentteams worker create --name bed-worker --no-wait;
                    charly agentteams worker list | grep -q bed-worker;
                    rm -rf /tmp/at-snap;
                    charly agentteams snapshot --out /tmp/at-snap >/dev/null;
                    test -s /tmp/at-snap/workers.yml;
                    grep -q bed-worker /tmp/at-snap/workers.yml;
                    charly agentteams worker delete bed-worker >/dev/null;
                    ! charly agentteams worker list | grep -q bed-worker;
                    charly agentteams apply -f /tmp/at-snap >/dev/null;
                    charly agentteams worker list | grep -q bed-worker;
                    echo ROUNDTRIP-OK'
                in_container: true
# agentteams-vm — the disposable VM substrate for the AgentTeams stack. The
# check-agentteams-vm bed installs the agentteams top composition candy (all five
# foundation candies) into this Arch cloud-image guest via add_candy, so the
# services run as systemd units under uid 1000 (init polymorphism — no supervisord
# in a VM). The controller candy's plan step sets up the rootless podman socket
# (/run/user/1000/podman/podman.sock) gated on systemd, and the bed's host-side
# cp-box steps deliver the pre-built manager/worker images into the guest's
# rootless store — the controller then spawns them through the socket, exactly as
# on the pod substrate. 8G RAM / 4 CPU / 40G disk: the full stack (minio, matrix,
# element, higress ×5, controller) plus the spawned manager + worker containers.
agentteams-vm:
    vm:
        source:
            kind: cloud_image
            url: https://geo.mirror.pkgbuild.com/images/v20260701.551070/Arch-Linux-x86_64-cloudimg-20260701.551070.qcow2
            checksum:
                type: sha256
                value: a99844dda491606f81f463ce96851ae03d90ca8fa727671cac2da86a07a7cd61
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 40G
        ram: 8G
        cpu: 4
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
# check-agentteams-vm — the R10 bed for the AgentTeams stack on the VM substrate.
# The add_candy model installs the agentteams top composition (minio, matrix,
# element, higress, controller) into the Arch cloud-image guest, where the services
# run as systemd units under uid 1000 (init polymorphism — no supervisord in a VM).
# The controller's rootless podman socket is set up by the controller candy's plan
# step; the bed's host-side cp-box steps deliver the PRE-BUILT manager/worker images
# (charly box build agentteams-manager / agentteams-worker — the same pre-requisite
# the check-agentteams-pod bed has) into the guest's rootless store, and the
# controller spawns the manager + a worker from them through the rootless socket —
# proving the full controller-spawns-manager → create-worker → room sequence
# in-guest. The manager reconciler retries a failed spawn every 30s, so the
# controller's initial spawn (before the images arrive) self-heals once the cp-box
# delivers them. The liveness probes run IN-GUEST over SSH (the http verb curls
# in-guest; the command verbs run via the SSH executor), so no host→guest port
# forwards are needed for them — but the `agentteams:` verb steps are the
# exception: the verb is HOST-BASED (the mcp pattern), so it runs in the
# provider's process on the HOST and resolves the controller's in-venue :8090 to
# a host-routable address over the reverse channel (a live ssh -L forward into
# the guest), pulling the admin SA token from the venue over the executor.
check-agentteams-vm:
    vm:
        from: agentteams-vm
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the AgentTeams stack on the VM substrate. The add_candy
            model installs the agentteams top composition (minio, matrix, element,
            higress, controller) into the Arch cloud-image guest, where the
            services run as systemd units under uid 1000 (init polymorphism — no
            supervisord in a VM). The controller's rootless podman socket is set
            up by the controller candy's plan step; the bed's host-side cp-box
            steps deliver the pre-built manager/worker images into the guest's
            rootless store, and the controller spawns the manager + a worker from
            them through the rootless socket — proving the full
            controller-spawns-manager → create-worker → room sequence in-guest.
        add_candy:
            - agentteams
        install_opts:
            with_service: true
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: the agentteams VM reached steady state
              id: agentteams-vm-running
              exit_status: 0
              stdout:
                - contains: '"kind": "vm"'
                - contains: check-agentteams-vm
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: deliver the pre-built manager image into the guest rootless store (idempotent — skips when the guest already holds it verified intact)
              id: agentteams-vm-cp-manager
              timeout: 600s
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} vm cp-box agentteams-vm ghcr.io/opencharly/agentteams-manager:manager --rootless --domain check-agentteams-vm
                in_container: false
            - check: deliver the pre-built worker image into the guest rootless store (idempotent — skips when the guest already holds it verified intact)
              id: agentteams-vm-cp-worker
              timeout: 600s
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} vm cp-box agentteams-vm ghcr.io/opencharly/agentteams-worker:worker --rootless --domain check-agentteams-vm
                in_container: false
            # VM venue: the http verb's ${HOST_PORT:<N>} variables are only
            # populated for container venues (live_gather populates HOST_PORT:22 for
            # a VM), so these probes run as in-guest command checks over the SSH
            # executor — the same pattern as the higress-apiserver/gateway-health
            # checks below and the check-k3s-vm bed. The `agentteams:` verb steps
            # below are the exception: the verb is HOST-BASED (the mcp pattern), so
            # it runs in the provider's process on the HOST and resolves the
            # controller's in-venue :8090 to a host-routable address over the
            # reverse channel — a live ssh -L forward into the guest (spec/checkhost
            # EndpointForVenue) — pulling the admin SA token from the venue over the
            # executor. No in-guest curl, no host CLI, one REST surface (R3).
            - check: the minio S3 API answers its health probe
              id: agentteams-vm-minio-health
              timeout: 30s
              context:
                - runtime
              command: 'curl -fsS http://127.0.0.1:9000/minio/health/live'
            - check: the Matrix homeserver answers the client versions endpoint
              id: agentteams-vm-matrix-versions
              timeout: 30s
              context:
                - runtime
              command: 'curl -fsS http://127.0.0.1:6167/_matrix/client/versions'
            - check: the Element Web client answers on its port
              id: agentteams-vm-element-http
              timeout: 30s
              context:
                - runtime
              command: 'curl -fsS http://127.0.0.1:8088/'
            - check: the Higress apiserver answers on its internal port
              id: agentteams-vm-higress-apiserver
              timeout: 60s
              context:
                - runtime
              command: 'curl -sk https://127.0.0.1:18443/version | grep -q "gitVersion"'
            - check: the Higress gateway is healthy (pilot-agent + envoy answer the status port; bounded probe — envoy's V8 WASM engine segfaults once at startup under the upstream --concurrency default and the init's restart policy covers the ~15s down window on both substrates)
              id: agentteams-vm-higress-gateway-health
              timeout: 60s
              context:
                - runtime
              command: 'for i in $(seq 1 28); do curl -sf http://127.0.0.1:15021/healthz/ready && exit 0; sleep 2; done; exit 1'
            - check: the Higress gateway serves the console on its ingress port (the 8080 listener only materializes when the proxy node LABELS match the Gateway selector; bounded probe for the same startup/restart window)
              id: agentteams-vm-higress-gateway-http
              timeout: 60s
              context:
                - runtime
              command: |
                  for i in $(seq 1 28); do
                      code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
                      [ "${code}" = "200" ] && exit 0
                      sleep 2
                  done
                  exit 1
            - check: the Higress console answers on its port
              id: agentteams-vm-higress-console-http
              timeout: 60s
              context:
                - runtime
              command: 'curl -fsS http://127.0.0.1:8001/'
            - check: the controller spawns the default manager and it reaches Running phase (proves the manager image is in the guest rootless store under AGENTTEAMS_MANAGER_IMAGE and the controller can spawn it through the rootless podman socket)
              id: agentteams-vm-manager-running
              timeout: 600s
              context:
                - runtime
              agentteams:
                method: manager-running
              stdout:
                - contains: "Running"
            - check: the controller creates a Worker CR, spawns the worker container from the pre-built agentteams-worker image, and the worker reaches Running with its Matrix room created (proves AGENTTEAMS_WORKER_IMAGE is in the guest rootless store and the controller can spawn the worker through the rootless podman socket)
              id: agentteams-vm-worker-running
              timeout: 600s
              context:
                - runtime
              agentteams:
                method: worker-running
              stdout:
                - contains: "room alias resolvable"

# =============================================================================
# check-retention-app — the FIXTURE BOX of the retention discriminator bed.
#
# BLOCKED, NOT DISABLED. This box is `enabled: false` for ONE named reason, and it
# becomes satisfiable the moment that reason is removed:
#
#   candy/plugin-box/box.go:296-302 acquires the build-activity lock and holds it
#   "across the whole build (the candy podman drive) + the post-build prune", so
#   the post-build retention pass ALWAYS observes live >= 1 — its own lock. That
#   makes candy/plugin-clean/retention.go's `if live > 0 { … if lastTag { return
#   false } }` engage on every build, so `charly box build` can never remove an
#   image's LAST tag and therefore can never reclaim a distinct image. The lock's
#   stated purpose is to stop a SIBLING build from untagging a pin an in-flight
#   build may still resolve; blocking the build's own prune is an unintended
#   effect the comment does not contemplate.
#
# The bed this fixture serves asserts a PAIR: that a multi-tag image keeps every
# tag (which discriminates the two-ordinal ranking from the pre-fix tag-row one),
# and that the distinct sibling past the budget is REMOVED (which discriminates
# nothing, but fails under exactly the conditions that would falsely satisfy the
# first). The second assertion is the canary, and it cannot pass while the
# self-lock stands: the only verb that removes a last tag is `charly clean`, which
# a bed must not run. Measured live on 2026-08-16 — four generations built, gen1
# left at rank 3 under keep_images: 3, and NOT reclaimed.
#
# EXCLUDE THE BUILD'S OWN LOCK FROM THE LIVE COUNT AND THIS BED GOES GREEN. Until
# then it would assert something the product cannot do, so it stays unbuilt rather
# than shipping as a check that cannot fail on its own subject.
#
# The base is a raw registry ref rather than a distro box on purpose: the fixture
# must be a LEAF image with nothing built FROM it, because `podman rmi` refuses an
# image another image depends on and retention swallows that refusal silently
# (observed on fedora-nonfree:check-docs-2026.227.1835 — selected by retention,
# refused by the engine, absent from the removed list, still in the store).
# =============================================================================
check-retention-app:
    candy:
        version: 2026.228.0400
        enabled: false
        base: quay.io/fedora/fedora:43
        description: |-
            Fixture box for the retention discriminator bed: a minimal Fedora base composing
            check-retention-fixture, whose generation stamp is the only varying content. Built
            repeatedly (four generations plus two `--tag` rebuilds of the third) to construct a
            box group where one image wears three tags and distinct siblings sit behind it — the
            only shape on which `keep_images`' two ordinals and the pre-fix single tag-row
            ordinal choose differently. Blocked on the post-build prune counting its own
            build-activity lock as live; see the comment above this entry.
        distro:
            - fedora:43
            - fedora
        candy:
            - check-retention-fixture

# =============================================================================
# `charly box load` — the container-venue image-delivery verb (Factory unit 5).
# The fixture box is a pod that serves its own nested podman API socket; the bed
# delivers a host image into THAT store and proves it landed there and nowhere
# else. Without the verb this transfer has no charly-native form at all — the
# only path was a hand-run `podman save | podman --remote load` pipeline (R4).
# =============================================================================
check-boxload-app:
    candy:
        version: 2026.229.1100
        base: quay.io/fedora/fedora:43
        description: |-
            Fixture box for the `charly box load` bed: a minimal Fedora base composing
            container-nesting (nested rootless podman, zero added capabilities) plus
            nested-podman-socket, which serves that podman's API socket at uid 1000. Together
            they make the pod a venue with an image store of its own, separate from the host's
            — which is the venue `charly box load` exists to deliver into.
        distro:
            - fedora:43
            - fedora
        candy:
            - '@github.com/opencharly/layer-supervisord:v2026.239.1300'
            - '@github.com/opencharly/pod-nested-podman-socket:v2026.237.940'
check-boxload-pod:
    pod:
        image: check-boxload-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for `charly box load`. It delivers a host-store image into the pod's NESTED
            uid-1000 podman store and then asserts, through the socket, that the image is
            actually there — the pair of facts the verb claims. The image loaded is the bed's own
            app image, which step 1 of the bed guarantees is in the host store, so the bed needs
            no external image and no second build. The assertion deliberately queries the nested
            socket rather than running `podman images` in the container: only the socket-scoped
            query can fail if the image were ever delivered to the wrong store.
        plan:
            - check: box load delivers the host image into the pod's nested uid-1000 store
              id: boxload-deliver
              timeout: 600s
              context:
                - runtime
              exit_status: 0
              command:
                command: ${CHARLY_BIN} box load check-boxload-pod check-boxload-app --as localhost/charly-boxload-probe:latest
                in_container: false
            - check: the delivered image is present in the NESTED store, queried through the socket
              id: boxload-present-in-nested-store
              context:
                - runtime
              exit_status: 0
              command:
                command: podman --remote --url unix:///run/user/1000/podman/podman.sock image exists localhost/charly-boxload-probe:latest
                in_container: true

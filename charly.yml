# =============================================================================
# kind: check — disposable, zero-operator-side-effect R10 test beds.
# =============================================================================
# Each entry is a disposable deployment (a FleetNode), folded into the
# Fleet map at load time so every deploy verb resolves it by name. Run the
# full R10 acceptance sequence on any of them — build → check box → deploy →
# check live → fresh update (R10 gate) → tear down — with:
#
#     charly check run <bed>          # one bed
#     charly check run --all-beds     # every bed, name-sorted
#
# `disposable: true` is the SOLE authorization for that unattended destroy +
# rebuild (see /charly-internals:disposable). Naming: check-<descriptor>-<kind>,
# dropping a redundant suffix when descriptor == kind AND the short form is
# free (check-local, check-pod). The harness AI-sandbox pod is named
# `check-sandbox` (the score `pod:` target), kept disjoint from these beds.
#
# Bed-to-verb coverage map:
#   check-k3s-vm               (vm)  — kubernetes (all 13 methods) + guest-side
#                                     file/service/port/process, http via
#                                     port-forward, the external vm deploy end-to-end
#   check-k8s-deploy           (vm)  — the EXTERNALIZED deploy:kubernetes substrate (F1):
#                                     a k3s VM cluster + a target:kubernetes workload
#                                     member (check-k8s-deploy-app) applied via the
#                                     out-of-process plugin's kubectl apply -k
#   check-pod                  (pod) — combined: kind:image build + kind:layer
#                                     composition order + kind:pod runtime
#                                     (nc :18794 + supervisord) + every
#                                     deploy-target rendering path
#   check-local                (local) — kind:local layer apply via ShellExecutor
#   check-jupyter-pod          (pod) — jupyter-mcp regression coverage
#   check-jupyter-ml-pod       (pod) — jupyter-ml spacy/quarto + GPU MCP probes
#   check-versa-pod            (pod) — versa OSM analytics + vector-tile + marimo MCP
#   check-android-emulator-pod (pod) — Android 16 emulator (/dev/kvm) + adb/appium
#   check-openclaw-pod         (pod) — minimal openclaw gateway on the cachyos base
#   check-openclaw-full-pod    (pod) — maximal openclaw-full on cachyos (AUR chrome,
#                                     gogcli@latest, ffmpeg/sqlite arch coverage)
#   check-openclaw-desktop-pod (pod) — all-in-one: selkies desktop + openclaw-full
#                                     (claude-code/codex/gemini) + CPU ollama +
#                                     nested charly toolchain (charly+container-nesting)
#
# Zero-operator-side-effect: pod beds → rootless podman; check-k3s-vm → libvirt
# qcow2; check-local → a disposable scratch dir. No test writes to ~/.local/bin,
# ~/.config/opencharly, /etc, /usr, or any operator-side directory.
# =============================================================================
# check-k3s-vm — disposable libvirt VM running k3s-server. Kubeconfig is
# pulled back for host-side kubernetes: probes (all 13 methods) via the forwarded
# :6443. A VM (native kernel + cgroup tree) sidesteps the rootless-podman
# cpuset-delegation blocker that makes a pod-hosted k3s impossible.
# References the vm: entity `k3s-vm` (defined below).
check-k3s-vm:
    vm:
        from: k3s-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole deterministic proof of the external-vm-deploy->kubernetes end-to-end path and the full 13-method kubernetes probe surface against a real k3s control plane, and the R10 for ssh.port_auto. A disposable libvirt Arch cloud VM (an auto-allocated host->guest 6443 forward, charly installed post-boot via the vm substrate (EnsureCharlyInGuest)) overlays k3s-server over SSH, then runs guest command/process/port/file probes plus the full kubernetes suite (nodes/wait-nodes/pods/wait-ready/addons/ingressclass/storageclass/raw/service) against its own dedicated per-deploy-domain-scoped cluster context (cluster: "check-k3s-vm-ctx" — task #18: each bed sharing the k3s-vm entity gets its OWN kind:kubernetes profile pinned to its OWN collision-free kubeconfig context, since DEPLOY_NAME cannot distinguish sibling VM beds sharing one entity), an agent-check matching probe, and a host-side charly status --json (status-shows-vm).
        add_candy:
            - k3s-server
        env:
            # The host port is auto-allocated (network.port_forwards: ["auto:6443"]);
            # k3s_post rewrites the retrieved kubeconfig's :6443 to the allocated host
            # port from vm_state automatically, so NO hardcoded K3S_KUBECONFIG_SERVER
            # override is set (a fixed value would force a stale port). K3S_SERVER_HOSTNAME
            # stays for the tls-san / hostname rewrite.
            K3S_SERVER_HOSTNAME: 127.0.0.1
        install_opts:
            with_service: true
            allow_repo_changes: true # pacman sync / repo key import
            skip_incompatible: true # skip rpm:/deb:-only layer sections
            verify: true
        plan:
            - check: command=id
              id: kv-guest-identity
              stdout: {contains: "uid=1000(arch)"}
              context: [runtime]
              command: id
            - check: command=cat /etc/os-release
              id: kv-guest-os-release
              stdout: {contains: "ID=arch"}
              context: [runtime]
              command: "cat /etc/os-release"
            - check: process=k3s-server
              id: kv-k3s-process
              context: [runtime]
              process:
                process: "k3s-server"
                running: true
            - check: port=6443
              id: kv-port-6443-listening
              context: [runtime]
              port:
                port: 6443
                listening: true
            - check: file=/etc/rancher/k3s/k3s.yaml
              id: kv-kubeconfig-file
              context: [runtime]
              file:
                file: /etc/rancher/k3s/k3s.yaml
                exists: true
            - check: kubernetes=nodes
              id: kv-kubernetes-nodes
              kube:
                method: nodes
                cluster: "check-k3s-vm-ctx"
              context: [runtime]
            - check: kubernetes=wait-nodes
              id: kv-kubernetes-wait-nodes
              kube:
                method: "wait-nodes"
                cluster: "check-k3s-vm-ctx"
                kube_count: 1
              timeout: "300s"
              context: [runtime]
            - check: kubernetes=pods
              id: kv-kubernetes-pods
              kube:
                method: pods
                cluster: "check-k3s-vm-ctx"
                namespace: kube-system
              context: [runtime]
            - check: kubernetes=wait-ready
              id: kv-kubernetes-wait-ready
              kube:
                method: "wait-ready"
                cluster: "check-k3s-vm-ctx"
                kube_kind: Deployment
                namespace: kube-system
                name: coredns
              timeout: "180s"
              context: [runtime]
            - check: kubernetes=addons
              id: kv-kubernetes-addons
              kube:
                method: addons
                cluster: "check-k3s-vm-ctx"
              context: [runtime]
            - check: kubernetes=ingressclass
              id: kv-kubernetes-ingressclass-traefik
              kube:
                method: ingressclass
                cluster: "check-k3s-vm-ctx"
              stdout: {contains: "traefik"}
              context: [runtime]
            - check: kubernetes=storageclass
              id: kv-kubernetes-storageclass-localpath
              kube:
                method: storageclass
                cluster: "check-k3s-vm-ctx"
              stdout: {contains: "local-path"}
              context: [runtime]
            - check: kubernetes=raw — the raw escape hatch lists an arbitrary resource (namespaces)
              id: kv-kubernetes-raw
              kube:
                method: raw
                cluster: "check-k3s-vm-ctx"
                kube_resource: namespaces
              context: [runtime]
              stdout:
                - contains: kube-system
            - check: kubernetes=service
              id: kv-kubernetes-service-kubernetes
              kube:
                method: service
                cluster: "check-k3s-vm-ctx"
                namespace: default
                name: kubernetes
              context: [runtime]
            - check: command=${CHARLY_BIN} version
              id: kv-charly-version
              stdout: {matches: "[0-9]{4}\\.[0-9]+"}
              context: [runtime]
              command:
                command: "${CHARLY_BIN} version"
                in_container: false
            - agent-check: agent-check
              id: kv-matching
              context: [runtime]
            - check: command=charly status --json
              id: status-shows-vm
              stdout:
                - contains: '"kind": "vm"'
                - contains: k3s-vm
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
# check-helm-vm — the R10 bed for the out-of-tree plugin-helm (Unit 1): a disposable
# libvirt Arch cloud VM (the shared k3s-vm entity) overlaying k3s-server (the cluster)
# + kubernetes (the helm client — /usr/bin/helm; R3: no dedicated candy/helm, the
# toolchain candy already installs it) + helm-chart (the install leg). The bed proves
# BOTH helm capabilities end to end IN-VENUE. The INSTALL lives in the helm-chart
# candy, NOT the bed's own plan: fleet add lowers only CANDY plans' run: steps, and
# `charly check live` runs the bed's plan in verify-only mode (mutating steps skipped),
# so a mutating `run: helm-release:` step in the bed's own plan would never execute.
# The helm-chart candy's run: steps run during fleet add — an in-venue kubectl wait
# for the node to be Ready (the k3s-server candy's node-ready check is a check: step
# that does not run during fleet add), then the `helm-release:` step lowers to the
# external:helm-release install-step KIND (F3 — the plugin's declared StepContract
# {Scope system, Venue host-native, Emits false} carried opaquely through the
# InstallPlan IR), Invokes the plugin's OpExecute over the E3b reverse channel with
# the guest's live SSH executor, runs `helm upgrade --install` against the guest's own
# /etc/rancher/k3s/k3s.yaml, and returns a teardown ReverseOp (`helm uninstall`) the
# host records + replays. The `helm:` check steps in the bed's plan then assert the
# release is deployed via the EXEC-based verb (release-exists / status / revision) —
# the declarative release-status assertion, the verb:kube analog. The kube:
# readiness steps gate the helm assertions (addons must settle before a chart can
# schedule).
check-helm-vm:
    vm:
        from: k3s-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole deterministic proof of the out-of-tree plugin-helm end-to-end path: a
            disposable libvirt Arch cloud VM overlaying k3s-server + the kubernetes
            toolchain candy (helm at /usr/bin/helm) + the helm-chart candy installs a
            real chart via the external:helm-release install step (a deploy-context
            `run: helm-release:` step in the helm-chart candy's plan, lowered to the
            F3 external step-kind, Invoked over the E3b reverse channel IN-VENUE
            against the guest's own k3s kubeconfig) and asserts it deployed via the
            EXEC-based verb:helm (release-exists/status/revision). The kube: readiness
            steps run against this bed's OWN per-deploy-domain cluster context
            (cluster: "check-helm-vm-ctx" — task #18: each bed sharing the k3s-vm
            entity gets its OWN kind:kubernetes profile pinned to its OWN
            collision-free kubeconfig context).
        add_candy:
            - k3s-server
            - kubernetes
            - helm-chart
        env:
            # The host port is auto-allocated (network.port_forwards: ["auto:6443"]);
            # k3s_post rewrites the retrieved kubeconfig's :6443 to the allocated host
            # port from vm_state automatically, so NO hardcoded K3S_KUBECONFIG_SERVER
            # override is set. K3S_SERVER_HOSTNAME stays for the tls-san / hostname
            # rewrite.
            K3S_SERVER_HOSTNAME: 127.0.0.1
        install_opts:
            with_service: true
            allow_repo_changes: true # pacman sync / repo key import
            skip_incompatible: true # skip rpm:/deb:-only layer sections
            verify: true
        plan:
            - check: command=id
              id: ch-guest-identity
              stdout: {contains: "uid=1000(arch)"}
              context: [runtime]
              command: id
            - check: process=k3s-server
              id: ch-k3s-process
              context: [runtime]
              process:
                process: "k3s-server"
                running: true
            - check: file=/etc/rancher/k3s/k3s.yaml
              id: ch-kubeconfig-file
              context: [runtime]
              file:
                file: /etc/rancher/k3s/k3s.yaml
                exists: true
            - check: command=helm version
              id: ch-helm-binary
              # Arch ships helm 4 (v4.2.2+gb05881c) — the `candy/kubernetes` toolchain's
              # get-helm-3 installs the distro package, which is helm 4 on Arch. Assert the
              # major version, not a pinned minor.
              stdout: {contains: "v4"}
              context: [runtime]
              command: "helm version --short"
            - check: kubernetes=wait-nodes
              id: ch-kubernetes-wait-nodes
              kube:
                method: "wait-nodes"
                cluster: "check-helm-vm-ctx"
                kube_count: 1
              timeout: "300s"
              context: [runtime]
            - check: kubernetes=addons
              id: ch-kubernetes-addons
              kube:
                method: addons
                cluster: "check-helm-vm-ctx"
              timeout: "240s"
              context: [runtime]
            # The INSTALL (helm-chart candy's run: steps) already happened during fleet
            # add — the bed's own plan is verify-only, so it asserts, never mutates.
            # The release-exists assertion is the helm-chart candy's own ADE check step
            # (R3 — the candy that installs also asserts existence); the bed keeps the
            # deeper status + revision assertions.
            - check: verb=helm status
              id: ch-helm-status
              context: [runtime]
              helm:
                method: status
                release: web-pushgateway
                namespace: web
                status: deployed
            - check: verb=helm revision
              id: ch-helm-revision
              context: [runtime]
              helm:
                method: revision
                release: web-pushgateway
                namespace: web
                revision: 1
# check-k8s-deploy-app — the check-k8s-deploy bed's target:kubernetes WORKLOAD fixture.
# A minimal Fedora base box composed from LOCAL pure-rpm candies (supervisord +
# os-layer; no builder, no @github candy refs), so it builds from the root project —
# where the distro namespace boxes (fedora.web, …) do NOT, because their candies are
# @github refs the root resolver does not materialize. It is a disposable-bed FIXTURE
# (the minimal charly image the deploy:kubernetes substrate deploys), analogous to the
# kind:local check-*-app templates — not a production box, so it does not breach the
# "main owns no boxes" inversion (which concerns the shipped image catalog).
check-k8s-deploy-app:
    candy:
        version: 2026.180.1000
        base: quay.io/fedora/fedora:43
        description: |-
            Minimal Fedora base box — the check-k8s-deploy bed's target:kubernetes workload
            AND the check-sidecar-pod bed's pod workload. A small charly image whose
            ai.opencharly labels the deploy:kubernetes preresolver reads to generate the
            Kustomize tree. Composes check-keepalive (→ supervisord + a `keepalive`
            sleep-infinity program) + os-layer (local pure-rpm / coreutils candies, no
            builder/@github) so it builds from the root project. The keepalive program
            makes supervisord non-degenerate — it supervises a real program, so
            `charly service status` reports it (the K4 service-move coverage on
            check-sidecar-pod). The deployed pod is not asserted Ready (the locally-built
            image is absent from the disposable cluster's containerd); the kubernetes bed asserts
            only that the Deployment OBJECT landed — exactly the externalized `kubectl apply -k`.
        distro:
            - fedora:43
            - fedora
        candy:
            - '@github.com/opencharly/pod-check-keepalive:v2026.239.1625'
            - '@github.com/opencharly/pod-os-layer:v2026.237.457'
# =============================================================================
# check-k8s-deploy — disposable proof of the EXTERNALIZED deploy:kubernetes SUBSTRATE
# (F1, candy/plugin-kube serving deploy:kubernetes beside verb:kube). A GROUP bed (the
# proven sibling-member shape — cf. box/fedora check-cross-pod-cdp) with two members
# brought up name-sorted: check-k8s-deploy-cluster (a libvirt k3s VM reusing the
# SAME k3s-vm entity + k3s-server candy check-k3s-vm proves) comes up FIRST and
# merges its kubeconfig to context vm-check-k8s-deploy-cluster (its own per-deploy
# domain identity, task #18 — collision-free from check-k3s-vm's OWN context even
# though both beds share the k3s-vm entity — see check-k3s-vm-ctx / this doc's
# header comment for why the two beds each need their OWN dedicated kind:kubernetes
# profile rather than a shared `cluster: "${DEPLOY_NAME}"`); check-k8s-deploy-workload (a
# `target: kubernetes` deploy of check-k8s-deploy-app) comes up SECOND — at bring-up the
# plugin's own preresolve.go (F6, FINAL/K5 unit 6a) reads the box Capabilities +
# the check-k8s-deploy-cluster-ctx cluster template (self-loading the project PLUGIN-SIDE now,
# K-wave W3a A3-phase-2 — no HostBuild round trip left in this leg; its
# kubeconfig_context is pinned to vm-check-k8s-deploy-cluster, its sibling member's
# per-domain context) and GENERATES an
# egress-validated Kustomize tree, then the
# out-of-process plugin applies it with `kubectl --context vm-check-k8s-deploy-cluster apply -k`. The
# kube: checks under the cluster member (host-side probes; run after BOTH members are
# up) assert the workload Deployment OBJECT landed — the externalized apply ran
# end-to-end. (The workload POD is not asserted Ready: the locally-built box image is
# not in the VM's containerd, and image-into-cluster delivery is a separate concern
# the deploy substrate does not own; the Deployment-object proof IS the substrate.)
# =============================================================================
check-k8s-deploy:
    group:
        disposable: true
        lifecycle: dev
        description: >-
            R10 for the EXTERNALIZED deploy:kubernetes substrate (F1) — `target: kubernetes` resolves out-of-process to candy/plugin-kube's deploy:kubernetes provider over the E3b reverse channel, not a compiled-in deploy target. A group bed with two name-sorted sibling members: check-k8s-deploy-cluster (a disposable libvirt k3s VM, the shared k3s-vm + k3s-server stack, an auto-allocated host->guest 6443 forward) brings up a control plane and merges kubeconfig to context vm-check-k8s-deploy-cluster (its own per-deploy domain identity, task #18 — collision-free from check-k3s-vm's own context despite sharing the k3s-vm entity); check-k8s-deploy-workload (a target:kubernetes deploy of check-k8s-deploy-app) is brought up second — its host preresolver generates an egress-validated Kustomize tree and its out-of-process plugin runs `kubectl --context vm-check-k8s-deploy-cluster apply -k`. The kube: checks (wait-nodes + raw deployments GET + pods) prove the Deployment object landed on the cluster — the externalized substrate applied the workload end-to-end. The pod is not asserted Ready (the local box image is absent from the VM's containerd; image-into-cluster delivery is orthogonal to the substrate).
    # MEMBER 1 (name-sorts first) — the k3s control plane. bringUpMembers does vm
    # create + fleet add (k3s-server over SSH); K3sPostProvision merges the
    # kubeconfig to context vm-check-k8s-deploy-cluster (this member's own per-deploy
    # domain identity, task #18). The kube: assertion checks live HERE (this
    # member has a real SSH venue; the kube: verb dispatches host-side regardless,
    # and group check-live runs them only after BOTH members are up).
    check-k8s-deploy-cluster:
        vm:
            from: k3s-vm
            add_candy:
                - k3s-server
            env:
                # Host port auto-allocated (port_forwards: ["auto:6443"]); k3s_post
                # rewrites the kubeconfig to the allocated port from vm_state
                # automatically — no hardcoded K3S_KUBECONFIG_SERVER (cf. check-k3s-vm).
                K3S_SERVER_HOSTNAME: 127.0.0.1
            install_opts:
                with_service: true
                allow_repo_changes: true
                skip_incompatible: true
                verify: true
            plan:
                - check: the k3s control plane reports a Ready node before the workload assertion
                  id: kd-wait-nodes
                  kube:
                    method: wait-nodes
                    cluster: "check-k8s-deploy-cluster-ctx"
                    kube_count: 1
                  timeout: "300s"
                  stdout: {contains: "Ready"}
                  context: [runtime]
                - check: the externalized deploy:kubernetes substrate applied the workload Deployment object to the cluster
                  id: kd-deployment-landed
                  kube:
                    method: raw
                    cluster: "check-k8s-deploy-cluster-ctx"
                    kube_resource: deployments
                    kube_group: apps
                    kube_version: v1
                    namespace: default
                    name: check-k8s-deploy-workload
                  stdout: {contains: "check-k8s-deploy-workload"}
                  context: [runtime]
                - check: the applied Deployment's controller scheduled the workload pod onto the cluster
                  id: kd-pod-scheduled
                  kube:
                    method: pods
                    cluster: "check-k8s-deploy-cluster-ctx"
                    namespace: default
                  stdout: {contains: "check-k8s-deploy-workload"}
                  context: [runtime]
                - check: the helm_charts release's Deployment object landed on the cluster — the kustomize helmCharts transformer rendered the chart and the --enable-helm apply path deployed it
                  id: kd-helm-release-landed
                  kube:
                    method: raw
                    cluster: "check-k8s-deploy-cluster-ctx"
                    kube_resource: deployments
                    kube_group: apps
                    kube_version: v1
                    namespace: web
                    name: web-pushgateway-prometheus-pushgateway
                  stdout: {contains: "web-pushgateway-prometheus-pushgateway"}
                  context: [runtime]
    # MEMBER 2 (name-sorts second) — the target:kubernetes workload. check-k8s-deploy-app is built
    # locally by the group bed's member-build arm (box build check-k8s-deploy-app), so the host
    # preresolver's ExtractMetadata reads its OCI labels. `from: check-k8s-deploy-cluster-ctx`
    # selects the kind:kubernetes cluster template (kubeconfig_context: vm-check-k8s-deploy-cluster,
    # task #18 — pinned to the sibling member's own per-domain context). Deploy-only (no
    # own checks — it is an instrument; the cluster member's kube: checks assert it).
    # helm_charts: the k8sgen emitter translates this into a kustomize `helmCharts:`
    # overlay entry, and the deploy substrate renders it with `kubectl kustomize
    # --enable-helm` (the kustomize helmCharts transformer is gated behind
    # --enable-helm, which `kubectl apply -k` cannot pass) before applying the stream —
    # the live proof that the Unit 1 helm_charts field runs end to end on the
    # kubernetes substrate (the check-helm-vm bed proves the vm/helm venue; this proves
    # the kustomize emission + the --enable-helm apply path).
    check-k8s-deploy-workload:
        kubernetes:
            image: check-k8s-deploy-app
            from: check-k8s-deploy-cluster-ctx
            deploy:
                helm_charts:
                    - repo: https://prometheus-community.github.io/helm-charts
                      chart: prometheus-pushgateway
                      release: web-pushgateway
                      namespace: web
# =============================================================================
# check-sidecar-pod — disposable R10 for the sidecar de-type (Cutover D). The
# sidecar KIND's business logic (embedded<project<deploy template MERGE, CLI
# env-flag ROUTING, and volume/secret-name + env_from RESOLUTION) moved out of the
# kernel into candy/plugin-sidecar's OpResolve leg; the kernel stores sidecar defs
# OPAQUELY (map[string]json.RawMessage). This bed deploys the minimal fedora
# check-k8s-deploy-app pod with the project `mypause` sidecar attached: `charly
# config` resolves the sidecar THROUGH the plugin (providerRegistry.ResolveKind →
# Invoke(OpResolve)) and generates the sidecar quadlet. If the de-type broke
# resolution, config errors and the bed never reaches steady state; the pause
# sidecar (a tiny always-running infra image) proves the resolved quadlet deployed
# as a live pod member beside the app.
# =============================================================================
mypause:
    sidecar:
        description: a trivial always-running sidecar for the sidecar de-type R10 bed
        image: registry.k8s.io/pause:3.9
check-sidecar-pod:
    pod:
        image: check-k8s-deploy-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 for the sidecar de-type (Cutover D) — candy/plugin-sidecar's OpResolve
            owns all sidecar business logic; the kernel stores sidecar defs opaquely.
            Deploys the minimal check-k8s-deploy-app pod with the `mypause` sidecar
            attached: reaching steady state proves the plugin resolved + generated the
            sidecar quadlet end-to-end (a broken de-type fails `charly config` at deploy).
        sidecar:
            mypause: {}
        plan:
            - check: command=charly status --json
              id: sidecar-pod-running
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-sidecar-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: charly service status reprints the in-container supervisorctl output — the keepalive program RUNNING — proving the K4 service move (charly service → LifecycleTarget.Shell → the pod plugin's OpShell captured exec) carries the container command's output back through the host. A swallowing capture bug yields EMPTY output and FAILS this step; the host-resolved `<engine> exec <ctr> supervisorctl status` argv is executed IN the pod plugin over the served executor, not by core.
              id: service-status-output-present
              exit_status: 0
              stdout:
                - contains: keepalive
                - contains: RUNNING
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} service status check-sidecar-pod
                in_container: false
            - run: stop the pod through the K4 deep-body STOP path (charly stop → LifecycleTarget.Stop → the pod plugin's podStop over F6, with the arbiter release bracket)
              exit_status: 0
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} stop check-sidecar-pod
                in_container: false
            - run: start the pod again through the K4 deep-body START path (charly start → LifecycleTarget.Start → the pod plugin's podStart over F6, with the arbiter acquire bracket)
              exit_status: 0
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} start check-sidecar-pod
                in_container: false
            - check: after the explicit stop→start cycle the pod is running again — the BOTH-DIRECTIONS coverage that would FAIL without the K4 deep-body start/stop move (a broken lifecycle dispatch leaves the pod down after stop, or never restarts it)
              id: sidecar-pod-restarted
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-sidecar-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: charly shell -c runs a ONE-SHOT non-interactive command through the consolidated pod-lifecycle-dispatch seam (charly shell → dispatchLifecycleTarget("shell",…) → LifecycleTarget.Attach, host_build_pod_lifecycle_dispatch.go's hostBuildPodShell) — the Cutover B unit 2 round-trip's shell coverage. A broken consolidation either fails the exec or drops the echoed marker from stdout.
              id: shell-oneshot-roundtrip
              exit_status: 0
              stdout:
                - contains: shell-roundtrip-ok
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} shell check-sidecar-pod -c "echo shell-roundtrip-ok"
                in_container: false
            - run: charly logs (bounded, non-follow) through the consolidated seam (charly logs → dispatchLifecycleTarget("logs",…) → LifecycleTarget.Logs, hostBuildPodLogs) — proves the logs verb still dispatches and returns after the file consolidation.
              exit_status: 0
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} logs check-sidecar-pod
                in_container: false
            - run: charly logs -f (follow mode) BOUNDED by a shell-level `timeout` wrapper — proves follow-mode streaming through the SAME consolidated seam terminates cleanly under an external cutoff rather than hanging the bed run forever. Accepts ONLY exit 0 (the process exited on its own before the cutoff) or 124 (timeout(1)'s own signal-kill code, the expected/intended path) — any OTHER exit (a crash, a command-not-found, an unrelated failure) still FAILS the step; this is deliberately narrower than a bare `|| true`, which would mask every failure, not just timeout's. The step-level timeout field below (20 seconds) is a last-resort framework-side backstop.
              exit_status: 0
              timeout: 20s
              context:
                - runtime
              command:
                command: timeout 5 ${CHARLY_BIN} logs check-sidecar-pod -f; case $? in 0|124) true;; *) false;; esac
                in_container: false
            - run: charly update rebuilds/redeploys the artifact through dispatchByDeployTarget (update_deploy_dispatch.go — the irreducible loadDeployPlugins+ResolveTarget leg pair since K-wave 2 cone CONTESTED; the deploy-node resolution moved plugin-side) — proves the update path still works after the consolidation.
              exit_status: 0
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} update check-sidecar-pod
                in_container: false
            - run: charly remove --keep-deploy tears the pod down through candy/plugin-pod's FULLY-ported remove orchestration (RemoveCmd.Run() → remove_tunnel.go's tunnel-stop + remove_orchestration.go's runPodRemove, reaching the host only for the arbiter-release bracket, the credential-backed hook env, and the deploy-entry cleanup's registry-resugar) — keeps the charly.yml deploy entry so the very next step can recreate it, proving remove's fully-relocated orchestration still works end-to-end.
              exit_status: 0
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} remove check-sidecar-pod --keep-deploy
                in_container: false
            - check: after remove→start the pod is running again — the round-trip's final assertion, proving the FULL consolidated pod-lifecycle-dispatch family (start/stop/shell/logs/update/remove/service) composes end-to-end, not just each verb in isolation.
              id: sidecar-pod-roundtrip-final
              # Killed at the 120s per-attempt ceiling under the full 28-bed roster (~30-40
              # containers resident; `charly status` fans out per-container), while green solo.
              # 300s covers the measured worst case (2m0s kill point) with honest headroom. The
              # underlying status fan-out COST is a separate concern, tracked as task #26 — this
              # budget buys the bed correctness, it does not excuse the cost.
              timeout: 300s
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-sidecar-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} start check-sidecar-pod && ${CHARLY_BIN} status --json
                in_container: false
            - check: the NESTED ephemeral vm member (check-sidecar-pod-ephvm, tree position, sibling to the pod node above) registered its lifecycle through candy/plugin-fleet's OpEphemeralRegister (FINAL/K5 unit 6a, the ephemeral_lifecycle.go move) when `charly fleet add check-sidecar-pod` brought up the whole tree — the persisted EphemeralRuntime block in charly.yml AND the systemd TTL transient timer are the register-half proof. vm is the ONLY substrate whose Add path calls the ephemeral seam today (validate_ephemeral.go rejects pod/kubernetes ephemeral at load time, tracked to the bed-robustness batch). The TIMER conjunct runs FIRST so each conjunct's verdict is independently visible on failure (RCA #5). Asserted via the WHOLE-DUMP `fleet show` form (no positional box arg), NOT `fleet show <name>` — that single-arg lookup (deploykit.DeployKey, a bare pass-through) can never find a vm entry's per-host state, which every vm deploy persists under a "vm:"-prefixed, VmDomainIdentity-sanitized key (a PRE-EXISTING, universal gap unrelated to this cutover, registered to the bed-robustness batch — RCA in CHANGELOG). The grep anchors on the entry's OWN unique `deploy_address` marker (EphemeralRuntime.DeployAddress, FINAL/K5 unit 6a) — not any ephemeral marker anywhere in the dump — so this step is structurally unable to pass vacuously, and doubles as the DeployAddress field's own persistence proof. RCA #4 (unit 6a): the systemd-timer conjunct's grep pattern greps the STABLE PREFIX of the unit `registerTransientTimer` actually creates — `charly-fleet-del-<SanitizeUnitName(fullDottedDeployName)>-<unix-ts>` (sdk/deploykit's SanitizeUnitName, dots AND slashes to hyphens, applied to the FULL dotted deploy address, not the leaf name) — a bed-caught real bug in the assertion itself (registration was proven to fire correctly via a live leftover systemd timer; the pre-fix pattern used the leaf name alone and could never match). RCA #5 (unit 6a): the explicit del + clear-half round-trip this step pair USED TO prove is DROPPED here — `charly check live` is documented, intentional `VerifyOnly` (runs ONLY check:/agent-check: steps, NEVER run:/agent-run:), so a `run: fleet del ...` step between two check: steps NEVER EXECUTES during a check-live pass; that precondition was structurally unfireable regardless of keying/env. The persist/clear round-trip's CLEAR half is now proven by an orchestrator-driven LIVE PROBE instead (mutating round-trips are probe territory, idempotent state checks are check-live territory) — see CHANGELOG.
              id: ephemeral-register-roundtrip
              stdout:
                - contains: EPHEMERAL-REGISTERED-OK
              exit_status: 0
              context:
                - runtime
              command:
                command: |
                  systemctl --user list-timers 2>/dev/null | grep -q charly-fleet-del-check-sidecar-pod-check-sidecar-pod-ephvm &&
                  ${CHARLY_BIN} fleet show 2>/dev/null | grep -q 'deploy_address:.*check-sidecar-pod\.check-sidecar-pod-ephvm' &&
                  echo EPHEMERAL-REGISTERED-OK
                in_container: false
            - check: proves the FINAL/K5 unit 6a M4c "box pull" command-dispersal end to end — candy/plugin-box's new command-pull word (pullGrammar/dispatchPull) reenters the hidden core "__box-pull" command over the "cli" HostBuild seam, which still runs BoxPullCmd's UNCHANGED Run body (dispatchBuildEnsure, core-min wave 3 — a call into the compiled-in candy/plugin-build build:ensure word rather than an in-core ensure-image orchestration). Targets check-k8s-deploy-app (the underlying BOX name check-sidecar-pod's pod image deploys — NOT the deploy name itself, which is not a resolvable box), already present in local storage from this bed's own image-build phase, so the pull is a genuine idempotent no-op — asserts the build:ensure word's own unchanged "present" line on stderr. Fails without the new grammar/dispatch/reentry chain actually working; mutates nothing.
              id: box-pull-dispersal-roundtrip
              exit_status: 0
              stderr:
                - contains: 'ensure-image:'
                - contains: 'present'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} box pull check-k8s-deploy-app
                in_container: false
    check-sidecar-pod-ephvm:
        vm:
            from: eval-vm
            ephemeral:
                ttl: 30m
        # NESTED under check-sidecar-pod (tree position, sibling to the pod: node above) so it
        # is brought up automatically as part of `charly fleet add check-sidecar-pod` and torn
        # down as part of the bed's own cleanup (or explicitly, mid-plan, by the steps above).
        # 30m TTL keeps the systemd safety-net window well inside the bed's own run duration.
check-pod-overlay:
    pod:
        image: check-k8s-deploy-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 for add_candy: on a pod: deploy — the FIRST disposable bed in this repo to
            combine the pod substrate with add_candy:, and the acceptance gate for the
            three-bug fix that makes the feature work end-to-end for the first time: (1)
            hostBuildOverlay's ctx-threaded plans carrier (overlayBuildInputs) is now seeded
            in production at (*pluginDeployTarget).Add, so the overlay's candy scan actually
            sees add_candy: [ripgrep] instead of an empty plan list; (2) the overlay's
            first-ever PrepareVenue state-save (ResolvedImage, and separately a first-ever
            `charly config` volume-persist, VolumeProjectChecked) no longer falls through
            fleetDiscForEntity's pod-workload check to "group", which used to corrupt
            charly.yml on the next read; (3) the check-bed runner's config/start steps no
            longer force --tag <base-build-tag> for an add_candy bed (CheckBedReply.HasAddCandy),
            so they deploy the just-built overlay instead of clobbering it with the un-overlaid
            base image. ripgrep's `package:` field compiles to a SystemPackagesStep, so
            add_candy: [ripgrep] forces a REAL overlay Containerfile synthesis
            (hostBuildOverlay + deploykit.OCITarget), not a synthetic no-op. This is

            (the bed runner's own post-rebuild check-live pass, extended by this same
            cutover to cover every runtime pod bed — not only ones with nested children —
            re-evaluates this plan's checks against the ACTUALLY-rebuilt container, not a
            same-pass no-op): any of the three bugs regressing breaks the overlay build
            itself or drops ripgrep from the running container, on EITHER the initial deploy
            or the fresh rebuild.
        add_candy:
            - '@github.com/opencharly/layer-ripgrep:v2026.235.1653'  # the standalone repo (the cutover's kind-prefixed naming)
        plan:

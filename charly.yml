debian-repo-vm:
    vm:
        source:
            kind: cloud_image
            url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
            base_user: debian
            # REQUIRED, not decorative: sshUnitForDistro + composePackages are bare

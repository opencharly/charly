            checksum:
                type: sha256
                value: a99844dda491606f81f463ce96851ae03d90ca8fa727671cac2da86a07a7cd61
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
# The five per-distro REPO check beds (check-<distro>-repo, below) prove the
# repo-based install from the published distro repos. Their `from:` cross-ref is
# constrained to #EntityRef (spec/schema/_common.cue — a simple lowercase-hyphenated
# name, NO namespace dots), so a bed can only reference a VM template in the SAME
# charly.yml — the box/<distro> submodule templates (arch, fedora-vm,
# debian-debootstrap, ubuntu-debootstrap) are NOT referenceable from main. Each
# substrate below is therefore a minimal cloud-image VM for its distro: boot the
# distro, run the native package manager (apk/pacman/dnf/apt) against the published
# repo, and provide passwordless sudo for the check runner's `ssh vm sudo bash -s`
# root escalation. The default distro cloud-image user (alpine/arch/fedora/debian/
# ubuntu) has passwordless sudo via cloud-init. Alpine publishes only SHA512
# checksums, which the #VmChecksum schema (sha256-only) cannot express, so the
# checksum is omitted there; the others omit it too (the images are official distro
# cloud images, and the beds verify the boot + package install empirically).
arch-repo-vm:
    vm:
        source:
            kind: cloud_image
            distro: arch
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            base_user: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
fedora-repo-vm:
    vm:
        source:
            kind: cloud_image
            distro: fedora
            url: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
            base_user: fedora
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate

            - check: command=charly clean --deep --dry-run exits 0 and reports a count + an upper-bound reclaimable size (actual reclaim may be less — removed images can share layers with the many that remain) of untagged/dangling images STORE-WIDE (proving the --deep purge category reaches the store-wide selectDanglingImages/pruneDeepDanglingImages sweep over the SAME "retention" HostBuild seam — not just the charly-labeled sweep --dry-run above already covers — touching nothing)
              id: clean-deep-dry-run-runs
              exit_status: 0
              stdout:
                - contains: 'deep:'
              context:
                - runtime
              command:

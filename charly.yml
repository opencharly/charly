              # containers resident; `charly status` fans out per-container), while green solo.
              # 300s covers the measured worst case (2m0s kill point) with honest headroom. The
              # underlying status fan-out COST is a separate concern, tracked as task #26 — this
              # budget buys the bed correctness, it does not excuse the cost.
              timeout: 300s
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-pod-overlay
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: ripgrep (an add_candy overlay layer whose `package:` field compiles to a SystemPackagesStep) is installed + functional INSIDE the running overlay container — proving the overlay-plans ctx-seed fix actually threaded add_candy's compiled plan into the overlay build, baking a REAL host-coupled system-packages fragment into the image (not a synthetic no-op). Re-evaluated by the bed runner's post-rebuild check-live pass against the container produced by a genuine `charly update`, so this SAME assertion is the fresh-rebuild's own non-vacuous proof too — no separate embedded rebuild step is needed in this plan.
              id: pod-overlay-ripgrep-installed
              exit_status: 0
              stdout:
                - matches: "ripgrep [0-9]"
              command:

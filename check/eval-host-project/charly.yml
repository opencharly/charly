# Pruned GUEST PROJECT for the check-local guest-as-host bed (eval-host-vm).
#
# The superproject `check-local` bed (a top-level `vm: {from: eval-host-vm}` deploy)
# rsyncs THIS file into the guest at /home/arch/eval-project — and THIS FILE ALONE. The
# four closure candies (check-local-layer, examplestep-deploy-consumer,
# plugin-example-step, plugin-deploy-local) are pinned below by @github ref and resolved
# by the guest itself, the way the sdk + spec contract modules already were. Then runs `charly --host charly-check-local-vm check run
# check-local` (the guest's domain/alias is named after the DEPLOY check-local-vm, not the
# eval-host-vm entity — P33). The guest's welded charly (add_candy:[charly] → copy: bin/charly) resolves
# THIS project via CHARLY_PROJECT_DIR (set in the guest's /etc/environment) and runs the
# check-local bed below against its OWN `host: local` venue — the guest ShellExecutor +
# HostDeployTarget path — so the kind:local layer-application coverage is preserved OFF
# the operator's workstation (all /etc + /tmp markers land in the disposable guest).
#
# PRUNED: only deploy:local + examplestep build in-guest (2 out-of-tree Go plugins whose
# go.mods resolve the sdk + spec contract modules from the module proxy at the pinned
# require versions), never the full superproject plugin fleet (which OOM'd a 3.8G
# guest). No `import:` of the distro submodules — check-local-app is a kind:local template
# with no base image, so no distro closure is needed.
#
# NOT discovered by the superproject — `check/` is not on its `discover:` path. The candy
# closure is pinned in this file, so there is no lockstep with a superproject directory
# list to keep any more — that coupling is what the pins remove.
version: 2026.240.1943
check-local-app:
    local:
        description: |-
            Minimal kind:local template applying check-local-layer to the guest host.
        candy:
            - '@github.com/opencharly/layer-check-local-layer:v2026.241.1216'
check-local:
    local:
        from: check-local-app
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            Guest-run proof of the kind:local layer-application path via ShellExecutor +
            HostDeployTarget, executed INSIDE the disposable eval-host-vm guest (driven from
            the operator host by `charly --host`). Applies check-local-layer to the guest's
            own `host: local`, dropping /etc/check-local-marker in the GUEST, then runs host-side
            command/file probes plus charly status --json asserting kind:local + source:ledger.
            ALSO the witness for the STEP DEPLOY-EXECUTE leg of external plugin execution:
            add_candy composes examplestep-deploy-consumer (a DEPLOY-context `run: plugin:
            examplestep` step) + plugin-example-step (the out-of-tree examplestep verb, built
            in-guest from the proxy-resolved sdk contract module), so at local deploy charly lowers the run-step
            to an ExternalPluginStep and Invokes the plugin's OpExecute over the E3b
            ExecutorService reverse channel — the plugin writes /tmp/charly-examplestep/
            examplestep-deploy/{applied,probe} on the GUEST venue and returns a plugin-script
            reverse op the host records; teardown (charly fleet del) replays it so the markers
            are gone. Every side effect is confined to the disposable guest.
        add_candy:
            - '@github.com/opencharly/plugin-example-step/candy/plugin-example-step:v2026.239.1643'
            - '@github.com/opencharly/layer-examplestep-deploy-consumer:v2026.241.1216'
            - '@github.com/opencharly/plugin-deploy-local/candy/plugin-deploy-local:v2026.241.1003'
        plan:
            - check: command=charly status --json
              id: status-shows-local
              stdout:
                # local deploy-ids are content hashes (not the bed name), so assert
                # the substrate renders via the kind discriminator + ledger source.
                - contains: '"kind": "local"'
                - contains: '"source": "ledger"'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the external examplestep verb-as-step EXECUTED at local deploy — its OpExecute wrote the probe marker on the guest venue over the E3b reverse channel (proves ExternalPluginStep → InvokeWithExecutor(OpExecute))
              id: examplestep-deploy-marker
              stdout:
                - contains: EXAMPLESTEP-DEPLOY-PROBE-PRESENT
              context:
                - runtime
              command:
                command: "test -f /tmp/charly-examplestep/examplestep-deploy/probe && echo EXAMPLESTEP-DEPLOY-PROBE-PRESENT"
                in_container: false
            # #55 W3 B4 coverage — proves the render-service DISPATCH path a target:local
            # deploy-compile actually exercises (deploy-compile -> CompileServiceSteps ->
            # renderServiceViaSeam -> renderSeamCaller.renderService -> direct
            # InvokeProvider(kind:init) + InvokeProvider(verb:egress)), not just the
            # RENDERER unit-tested in isolation (candy/plugin-init's own
            # render_service_unit_test.go) or the mocked wiring test
            # (sdk/deploykit/plan_compile_test.go). check-local-layer's custom
            # check-local-marker-daemon service: entry writes this marker on start.
            - check: the check-local-layer custom systemd service wrote its marker on the guest — proves the rendered unit was installed, enabled, and started at deploy
              id: check-local-service-marker
              stdout:
                - contains: check-local-service v1
              context:
                - runtime
              command:
                command: "cat /etc/check-local-service-marker"
                in_container: false
            - check: the check-local-layer custom systemd service reports active — proves the rendered unit itself, not just its ExecStart side effect
              id: check-local-service-active
              stdout:
                - contains: check-local-service-active-present
              context:
                - runtime
              command:
                command: |
                  UNIT=$(systemctl list-units --all --plain --no-legend 2>/dev/null | awk '{print $1}' | grep -i check-local-marker-daemon | head -1)
                  if [ -n "$UNIT" ] && systemctl is-active --quiet "$UNIT"; then
                    echo check-local-service-active-present
                  fi
                in_container: false

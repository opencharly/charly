charly:
    candy:
        version: 2026.162.1430
        description: |
            The full charly toolchain on a deployment — the on-PATH charly CLI plus its composed VM / encrypted-storage / console-relay stack.
            Full charly toolchain — the CLI binary + the VM stack (virtualization),
            encrypted storage (gocryptfs), and console relay (socat) — composed into
            ONE layer that works identically on container/pod, host/local, and
            bootc/VM targets via the `virtualization` layer's mixed-entry `service:`
            pattern. This is the single canonical `charly` layer: bake it where a
            deployment needs a persistent on-`$PATH` charly or the full toolchain inside
            (the `charly-mcp` server, the `*-charly` showcases, nested-pod orchestrators).
            Images that only need transient in-container `charly` (the dbus delegation
            path) need NOT bake it — the host copies `charly` in on demand
            (`EnsureCharlyInDeployVenue`; see `/charly-tools:charly`).
        candy:
            - '@github.com/opencharly/pod-virtualization:v2026.237.458'
            - '@github.com/opencharly/layer-gocryptfs:v2026.237.457'
            - '@github.com/opencharly/layer-socat:v2026.235.2057'
            # The four DETECTION-builders (pixi/npm/cargo/aur) are EXTERNAL out-of-process
            # plugins; the candy de-submodule cutover (Phase 4) deleted their in-repo dirs, so
            # they must be PINNED here for the connect path's pass-1 (the project's own candy
            # closure) to vendor them by tag — a version-less remote ref would fall to the
            # mutable default branch and hang on the freshness check.
            - '@github.com/opencharly/plugin-builder-pixi/candy/plugin-builder-pixi:v2026.237.1416'
            - '@github.com/opencharly/plugin-builder-npm/candy/plugin-builder-npm:v2026.237.1415'
            - '@github.com/opencharly/plugin-builder-cargo/candy/plugin-builder-cargo:v2026.237.1415'
            - '@github.com/opencharly/plugin-builder-aur/candy/plugin-builder-aur:v2026.237.1415'
            # The example plugins the test fixtures + check beds host-build/connect by word ref —
            # pinned here (post-cutover) so the project closure vendors them and the lazy-connect
            # pass-1 finds them by word without a version-less remote fetch.
            - '@github.com/opencharly/plugin-example-dispatch/candy/plugin-example-dispatch:v2026.237.1420'
            - '@github.com/opencharly/plugin-example-bootstrap/candy/plugin-example-bootstrap:v2026.237.1419'
            - '@github.com/opencharly/plugin-example-command/candy/plugin-example-command:v2026.237.1420'
            - '@github.com/opencharly/plugin-example-deploy/candy/plugin-example-deploy:v2026.237.1420'
            - '@github.com/opencharly/plugin-example-external/candy/plugin-example-external:v2026.237.1420'
            - '@github.com/opencharly/plugin-example-kind/candy/plugin-example-kind:v2026.237.1421'
            - '@github.com/opencharly/plugin-example-step/candy/plugin-example-step:v2026.237.1421'
            - '@github.com/opencharly/plugin-example-stepkind/candy/plugin-example-stepkind:v2026.237.1421'
            - '@github.com/opencharly/plugin-example-structkind/candy/plugin-example-structkind:v2026.237.1422'
        distro:
            debian:
                # tailscale is a mandatory charly dep but is NOT in Debian main, so the
                # .deb (packaging.formats.deb) omits it; the charly candy supplies it for
                # deb-family via the tailscale apt repo. arch/fedora get tailscale from
                # their native package's deps instead, so it is deb-family-scoped here.
                package:
                    - charly
                    - tailscale
                repo:
                    - name: charly
                      url: "https://opencharly.github.io/charly-debian"
                      key: "https://opencharly.github.io/charly-debian/charly.gpg"
                      suite: stable
                      components: main
                    - name: tailscale
                      url: "https://pkgs.tailscale.com/stable/debian"
                      key: "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
                      suite: trixie
                      components: main
            ubuntu:
                package:
                    - charly
                    - tailscale
                repo:
                    - name: charly
                      url: "https://opencharly.github.io/charly-ubuntu"
                      key: "https://opencharly.github.io/charly-ubuntu/charly.gpg"
                      suite: stable
                      components: main
                    - name: tailscale
                      url: "https://pkgs.tailscale.com/stable/ubuntu"
                      key: "https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg"
                      suite: noble
                      components: main
            fedora:
                package:
                    - charly
                repo:
                    - name: charly
                      url: "https://opencharly.github.io/charly-fedora/amd64/"
                      gpgkey: "https://opencharly.github.io/charly-fedora/RPM-GPG-KEY-charly"
            arch:
                package:
                    - charly
                repo:
                    - name: charly
                      server: "https://opencharly.github.io/charly-arch/amd64/"
                      # The published key FILE (charly.gpg — fingerprint
                      # 978DFF11A951A830F7ADA2D4062B073E9D1BAE2E): fetched via curl +
                      # pacman-key --add by the unified pac install body. Deterministic
                      # and keyserver-free, matching deb/ubuntu/fedora/alpine — a VM
                      # guest cannot always reach the keyservers the fingerprint form
                      # depends on.
                      key: "https://opencharly.github.io/charly-arch/charly.gpg"
                      siglevel: Required DatabaseOptional
            alpine:
                package:
                    - charly
                repo:
                    - name: charly
                      url: "https://opencharly.github.io/charly-alpine/amd64/"
                      key: "https://opencharly.github.io/charly-alpine/charly.rsa.pub"
        # The `packaging:` section is the native-package metadata source for
        # `charly generate-packages` (sdk/packagekit): the per-distro package repos
        # (charly-alpine/arch/fedora/ubuntu/debian/openwrt) download this candy's
        # charly.yml from the release and pass it to the plugin as --candy. The deps
        # were transcribed from the three legacy pkg/* files (arch PKGBUILD, fedora
        # spec, debian control), removed with the nFPM cutover; the section is now the
        # single source — charly/packaging_test.go asserts it parses and every entry
        # is a plain package name. The charly binary is installed from the published
        # per-distro package repos (charly-{alpine,arch,fedora,ubuntu,debian,openwrt})
        # via the distro: repo: + package: entries above — the same repos the
        # generate-packages plugin (sdk/packagekit) builds from this section.
        packaging:
            name: charly
            description: The OpenCharly CLI — the open infrastructure compiler for you and your agents.
            maintainer: Andreas Trawoeger <atrawog@opencharly.ai>
            homepage: https://github.com/opencharly/charly
            license: MIT
            section: admin
            variants:
                default:
                    description: The seven everyday welded command plugins.
                    plugins:
                        - plugin-secrets
                        - plugin-feature
                        - plugin-vm
                        - plugin-doctor
                        - plugin-clean
                        - plugin-settings
                        - plugin-candy
                full:
                    description: All nine welded command plugins.
                    plugins:
                        - plugin-secrets
                        - plugin-udev
                        - plugin-preempt
                        - plugin-feature
                        - plugin-vm
                        - plugin-doctor
                        - plugin-clean
                        - plugin-settings
                        - plugin-candy
                minimal:
                    description: The doctor/clean/settings core.
                    plugins:
                        - plugin-doctor
                        - plugin-clean
                        - plugin-settings
            formats:
                archlinux:
                    depends:
                        - glibc
                        - podman
                        - gocryptfs
                        - fuse3
                        - openssh
                        - util-linux
                        - skopeo
                        - qemu-full
                        - qemu-img
                        - virtiofsd
                        - libvirt
                        - libarchive
                        - iproute2
                        - tmux
                        - fuse-overlayfs
                        - slirp4netns
                        - libisoburn
                        - cdrtools
                        - edk2-ovmf
                        - dnsmasq
                        - swtpm
                        - gnupg
                        - pinentry
                        - openssl
                        # record: gif — the asciinema candy's agg gif generator needs a
                        # monospace font to render, and record: start's post-start
                        # verification needs pgrep (procps-ng). agg itself is NOT in the
                        # Arch repos (AUR-only: asciinema-agg), so the Rust toolchain is a
                        # hard dep to build it from source when the prebuilt download is
                        # unavailable.
                        - ttf-dejavu
                        - procps-ng
                        - rust
                    optdepends:
                        tailscale: deploy-time tunnels (the tailscale-up candy installs it when a deploy opts in)
                        docker: alternative container engine — only needed for engine.run=docker (podman is the default)
                        cloudflared-bin: Cloudflare tunnels (AUR)
                        gvisor-tap-vsock: podman-machine networking — provides /usr/lib/podman/gvproxy (AUR)
                        nvidia-utils: nvidia-smi GPU detection + nvidia-ctk CDI generation (GPU targets only)
                        kubectl: Kubernetes deploys + charly eval k8s probes (kind:k8s targets only)
                        android-tools: "host adb for the remote `target: android` package-download install path"
                        libsecret: secret-tool CLI + pinentry-qt Secret Service passphrase auto-retrieval; the bundled plugin-secrets credential store uses the pure-Go go-keyring D-Bus client
                        dmidecode: SMBIOS inspection inside guests when debugging VM key-injection
                        openbsd-netcat: remote virt-manager/virt-viewer SPICE console over qemu+ssh (charly eval spice connects directly without it)
                        go-task: provides /usr/bin/task for `task build:binary` and dev workflows from a source checkout
                        tesseract: OCR engine for the `artifact_contains_text:` check assertion (reads text out of a screenshot); needs a language pack too
                        tesseract-data-eng: English OCR data for `artifact_contains_text:` — tesseract without a language pack cannot read anything
                rpm:
                    depends:
                        - glibc
                        - podman
                        - gocryptfs
                        - fuse3
                        - fuse-overlayfs
                        - slirp4netns
                        - openssh-clients
                        - openssh-server
                        - util-linux
                        - skopeo
                        - qemu-system-x86
                        - qemu-img
                        - virtiofsd
                        - libvirt
                        - libvirt-client
                        - bsdtar
                        - iproute
                        - xorriso
                        - genisoimage
                        - edk2-ovmf
                        - dnsmasq
                        - swtpm
                        - gnupg2
                        - pinentry
                        - openssl
                        # record: gif — the asciinema candy's agg gif generator needs a
                        # monospace font to render, and record: start's post-start
                        # verification needs pgrep (procps-ng). agg itself is NOT in the
                        # Fedora repos, so the Rust toolchain is a hard dep to build it
                        # from source when the prebuilt download is unavailable.
                        - dejavu-sans-mono-fonts
                        - procps-ng
                        - rust
                    suggests:
                        - tailscale
                        - docker
                        - cloudflared
                        - gvisor-tap-vsock
                        - xorg-x11-drv-nvidia-cuda
                        - kubernetes-client
                        - tesseract
                        - tesseract-langpack-eng
                deb:
                    depends:
                        - podman
                        - gocryptfs
                        - fuse3
                        - fuse-overlayfs
                        - slirp4netns
                        - openssh-client
                        - openssh-server
                        - util-linux
                        - skopeo
                        - qemu-system-x86
                        - qemu-utils
                        - virtiofsd
                        - libvirt-daemon-system
                        - libvirt-clients
                        - libarchive-tools
                        - iproute2
                        - xorriso
                        - genisoimage
                        - ovmf
                        - dnsmasq-base
                        - swtpm
                        - gnupg
                        - pinentry-curses
                        - openssl
                        # record: gif — the asciinema candy's agg gif generator needs a
                        # monospace font to render, and record: start's post-start
                        # verification needs pgrep (procps). agg itself is NOT in the
                        # Debian repos, so the Rust toolchain (rustc + cargo) is a hard
                        # dep to build it from source when the prebuilt download is
                        # unavailable.
                        - fonts-dejavu-core
                        - procps
                        - rustc
                        - cargo
                    suggests:
                        - docker.io
                        - cloudflared
                        - gvisor-tap-vsock
                        - nvidia-driver
                        - kubectl
                        - tesseract-ocr
                        - tesseract-ocr-eng
                apk:
                    depends:
                        - podman
                        - gocryptfs
                        - fuse3
                        - fuse-overlayfs
                        - slirp4netns
                        - openssh
                        - util-linux
                        - skopeo
                        - qemu-system-x86_64
                        - qemu-img
                        - virtiofsd
                        - libvirt
                        - libvirt-client
                        - libarchive-tools
                        - iproute2
                        - xorriso
                        - ovmf
                        - dnsmasq
                        - swtpm
                        - gnupg
                        - pinentry
                        - openssl
                        # record: gif — the asciinema candy's agg gif generator needs a
                        # monospace font to render, and record: start's post-start
                        # verification needs pgrep (procps-ng). agg itself is NOT in the
                        # Alpine repos, so the Rust toolchain (rust + cargo) is a hard
                        # dep to build it from source when the prebuilt download is
                        # unavailable.
                        - ttf-dejavu
                        - procps-ng
                        - rust
                        - cargo
                    suggests:
                        - tailscale
                        - tesseract-ocr
                        - tesseract-ocr-data-eng
                ipk:
                    # OpenWrt's repos lack the mandatory charly deps (podman/qemu/
                    # libvirt/…), so the .ipk carries an empty depends list — the
                    # package installs, but full functionality needs the host's tooling.
                    depends: []
                msix:
                    # Deferred: charly has no Windows binary (core uses syscall.Exec —
                    # Linux-only), so no .msix can be built. Kept so the plugin's msix
                    # format path has a metadata entry to parse.
                    depends: []
        plan:
            - check: the charly binary resolves on the deployment's PATH
              exit_status: 0
              command: command -v charly
            - check: charly version prints a CalVer build stamp on stdout
              exit_status: 0
              stdout:
                - matches: "[0-9]{4}\\.[0-9]+"
              command: charly version
            - check: the gocryptfs encrypted-storage binary (gocryptfs candy) is installed
              file:
                file: /usr/bin/gocryptfs
                exists: true
            - check: the socat console-relay binary (socat candy) is installed
              file:
                file: /usr/bin/socat
                exists: true
            - check: the libvirt virsh client (virtualization candy) is installed
              file:
                file: /usr/bin/virsh
                exists: true
            - check: the qemu system emulator (virtualization candy) is installed
              file:
                file: /usr/bin/qemu-system-x86_64
                exists: true
            - check: charly doctor runs and emits its Summary line
              exit_status: 0
              command: charly doctor 2>&1 | grep -q "Summary:"
            - check: command=command -v charly
              id: charly-binary
              exit_status: 0
              stdout:
                # Path-agnostic: the package installs to /usr/bin/charly, but on a
                # usr-merged distro (Arch/CachyOS: /usr/sbin -> bin, /usr/sbin ahead
                # of /usr/bin in PATH) `command -v` reports it via /usr/sbin — the
                # SAME inode. Accept any /usr[/local]/{bin,sbin}/charly so the probe
                # passes regardless of which PATH alias resolved it (RE2: no $ anchor,
                # which wouldn't match the trailing newline).
                - matches: "/usr/(local/)?s?bin/charly"
              command: command -v charly

charly-skill:
    skill:
        name: charly
        family: tools
        owner: charly
        description: |-
            OpenCharly CLI (charly) binary installed into container/VM images for in-container use.
            Use when working with charly binary deployment inside containers, in-container charly CLI usage, or the full charly toolchain (charly binary + virtualization + gocryptfs + socat).
        content: |
            # charly -- OpenCharly CLI binary
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install | native package from the published per-distro repos (`distro:` `package:`/`repo:`) |
            | Binary source | the published release (charly-{alpine,arch,fedora,ubuntu,debian,openwrt}); the in-development binary lives in the `charly-dev` candy (check beds only) |
            
            ## What It Provides
            
            The `charly` binary inside containers provides the full charly CLI for in-venue
            scripting, service management, and automation. **The box need NOT bake the `charly`
            candy for charly to run inside a venue:** when a flow needs `charly` present and the
            venue lacks it (nested from-image delegation), the generic copy-`charly`-into-a-running-venue
            mechanism (`EnsureCharlyInDeployVenue` over `DeployExecutor.PutFile` — `podman cp` for a
            container, `scp` for a VM/host) copies the host's own binary in on demand and invokes
            the delivered copy. Baking the candy only pre-stages the binary so the first such call
            skips the copy.
            
            ## Binary source — the published per-distro package repos

            The `charly` candy installs the binary from the **published per-distro package
            repos** (charly-{alpine,arch,fedora,ubuntu,debian,openwrt}) via the `distro:`
            `package:` + `repo:` entries above — the native package manager (apk add /
            pacman -S / dnf install / apt install) pulls the release binary + its OS deps.
            The `packaging:` section is the single metadata source those repos build from
            (`charly generate-packages`, sdk/packagekit).

            The IN-DEVELOPMENT binary (the local working tree, synced by
            `task build:binary`) installs via the **`charly-dev`** candy — the local-source
            variant used ONLY by charly check beds (`add_candy: [charly-dev]`), so a fresh
            bed always exercises the code under development while a real box ships the
            published release.
            
            ## Updating the Binary
            
            **The commands in this section are maintenance the charly repository performs on itself.** They are not steps an charly user runs: the charly-dev candy's binary source is a working tree (see "Binary source" above), so this is something a contributor does inside a charly checkout. It is recorded here because it is this candy's own build contract — named as maintenance, not as instructions for the reader.
            
            There is **one** path. The `charly-dev` candy is declared in the repo-root `charly.yml`, and a candy's `copy:` resolves against its declaring file's directory, so `copy: bin/charly` reads the repo-root `bin/charly` that `task build:binary` writes:
            
            ```bash
            task build:binary                            # Builds repo-root bin/charly.
            ./bin/charly box build <image>               # Rebuild affected images.
            ```
            
            Building with `go build -o ../bin/charly .` directly is equivalent for this purpose — the candy reads whatever is at repo-root `bin/charly`. There is no second copy to keep in step.
            
            This used to be a two-path contract: charly-dev lived in `candy/charly-dev/`, so its `copy:` resolved against the candy directory and needed its own `bin/charly`, synced there by `task build:binary`. Forgetting that sync baked the PREVIOUS binary into every check bed — silently, because nothing failed. Declaring the candy where the path already resolves removed the second path, and the class of mistake with it.
            
            **Still worth knowing**: `charly box build` uses auto-generated intermediate images (e.g., `ghcr.io/opencharly/charly-fedora-2-dbus-nodejs`) that cache the `charly-dev` candy. If an intermediate serves stale content, `charly clean --invalidate 'charly-fedora-2*'` forces a clean rebuild.
            
            ## `charly status` Probe
            
            The `charly` probe checks:
            1. Whether the `charly` binary exists in the container
            2. The CalVer version (`charly version`)
            
            Shows as `charly:ok (2026.94.1417)` in `charly status` detail view. Returns `-` for boxes without the `charly` candy.
            
            **Note:** `charly version` writes to **stdout** via `fmt.Println` (the prior
            `println(version)` emitted to stderr; the move to `fmt.Println` landed
            with the MCP server work so the in-process tool-call path — which
            captures `os.Stdout` — returns the CalVer correctly). The candy test at
            `candy/charly/charly.yml` asserts `stdout:` matches `[0-9]{4}\.[0-9]+`. The
            `charly status` probe uses `CombinedOutput()` so it's agnostic to the
            stream.
            
            ## Usage
            
            ```yaml
            # charly.yml — the charly candy is composed into all supervisord images
            my-image:
              candy:
                base: fedora
                candy: [charly]
            ```
            
            ## Used In Boxes
            
            - The `charly` candy is the full toolchain (charly binary + virtualization + gocryptfs + socat); composed into githubrunner, charly-fedora, charly-arch
            - Now directly added to all boxes with supervisord (openclaw, jupyter, ollama, sway-browser-vnc, selkies-desktop, immich, etc.)
            
            ## Related Candies
            
            - `/charly-infrastructure:virtualization`, `/charly-infrastructure:gocryptfs`, `/charly-infrastructure:socat` -- the candies the `charly` candy composes alongside the binary to form the full toolchain
            - `/charly-coder:charly-mcp` -- candies: [charly, supervisord] meta-composition that deploys `charly mcp serve` (the MCP gateway) with a `/workspace` bind mount (volume NAME `project`) for build-mode tools + auto-fallback to opencharly/charly when nothing is bound
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Installing the charly binary inside containers
            - The full charly toolchain composition (charly binary + virtualization + gocryptfs + socat)
            - In-container charly CLI usage
            - Updating the charly candy binary after code changes
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

[permissions]
mode = "ask"
allow = [
    # Built-in exploration
    "explore",
    # Submodule and plugin discovery
    "Bash(cd $PWD && git submodule status plugins 2>/dev/null; ls plugins/ 2>/dev/null | head -5; echo \"---\"; ls .claude/skills/ 2>/dev/null || echo \"no .claude/skills/\"; echo \"---\"; ls .reasonix/ 2>/dev/null || echo \"no .reasonix/\")",
    "Bash(cd $PWD && cat .agents/skills/.charly-profile.json | python3 -c \"import json,sys; d=json.load(sys.stdin); print(json.dumps(list(d.keys())[:5], indent=2)); print('...'); print('total entries:', len(d))\" 2>/dev/null || echo \"parse failed\")",
    "Bash(cd $PWD && cat .agents/skills/.charly-profile.json | python3 -c \"\nimport json,sys\nd=json.load(sys.stdin)\nprint('version:', d.get('version'))\nprint('links count:', len(d.get('links',[])))\nfor l in d.get('links',[])[:3]:\n    print(' ', l)\n\")",
    "Bash(cd $PWD && git submodule status 2>/dev/null)",
    "Bash(cd $PWD && cat .agents/skills/.charly-profile.json | python3 -c \"\nimport json,sys\nd=json.load(sys.stdin)\nprint('version:', d.get('version'))\nlinks = d.get('links',{})\nprint('links count:', len(links))\n# Show a few entries\nfor k in list(links.keys())[:5]:\n    print(f'  {k} -> {links[k]}')\n\")",
    # Charly R10/check verbs (parity with Claude Code + Kimi)
    "Bash(charly check run:*)",
    "Bash(charly check live:*)",
    "Bash(charly check box:*)",
    "Bash(charly status:*)",
    # GitHub PR merge (pr-validator)
    "Bash(gh pr merge:*)",
    "Bash(gh api --method POST repos/opencharly:*)",
]

# --- Container-engine sandbox fix (root cause of "podman broken for the agent") ---
# Reasonix's OS-level Bash sandbox (global `~/.reasonix/config.toml` `[sandbox]
# bash = "enforce"`) jails every agent Bash call: it sets NoNewPrivs=1, empties the
# capability bounding set, drops the process into a nested user namespace
# (`uid_map 1000 0 1`), and remounts /run and $HOME read-only. Rootless podman —
# which charly uses for all box build/check/deploy ops — requires BOTH a writable
# runroot (a subdir of /run) AND the `newuidmap`/`newgidmap` subordinate-id-mapping
# capabilities. The jail strips both, so podman fails only for the agent ("read-only
# file system", "newuidmap: Could not set caps") while working fine in a normal
# terminal. `bash = "off"` runs the project's agent Bash commands on the real host
# (like an operator terminal), restoring podman. This is project-scoped and does not
# change the operator's global reasonix security posture. See the "Running charly
# under reasonix" doc for the full RCA.
[sandbox]
bash = "off"

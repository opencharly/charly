# Docs.yml — the opencharly.ai documentation site (standalone since the docs de-submodule cutover).
#
# The site lives in the opencharly/docs repo (a subrepo NO LONGER — charly dropped the docs
# submodule; the docs repo pins charly in ITS .gitmodules instead). Generation, the
# content-drift gate, the Astro build and the publish are owned SOLELY by the docs repo's
# `deploy.yml` workflow, which runs `charly docs generate` against the charly commit its
# .gitmodules pins; a docs PR bumps that pin and carries the regenerated pages.
#
# What remains here is ONE maintenance task: keeping candy/docs-site's DOCS_REF honest. The
# check-docs R10 bed clones the published docs repo at that immutable commit, so a stale pin
# silently stops testing new site content. There is no `docs` gitlink to compare against
# anymore — charly has none since the cutover — so `docs:pin` compares DOCS_REF against the
# docs repo's LIVE main HEAD (a network fetch) and fails with bump instructions on drift.
version: '3'

tasks:
  pin:
    desc: Fail if candy/docs-site's DOCS_REF has drifted from the docs repo's current main HEAD
    cmds:
      - cmd: |
          file=candy/docs-site/charly.yml
          declared=$(grep -E '^\s+DOCS_REF:' "$file" | awk '{print $2}')
          # The sha appears TWICE in the candy on purpose: once as DOCS_REF (the clone's cache
          # key) and once as a literal in the pinned-commit check's stdout matcher, because a
          # check step's substitution does not resolve a candy var: and would SKIP the step
          # instead. Both must track the docs main commit, so both are asserted here.
          occurrences=$(grep -c "$declared" "$file" || true)
          live=$(git ls-remote https://github.com/opencharly/docs.git refs/heads/main | awk '{print $1}')
          if [ -z "$live" ]; then
            echo "docs: could not fetch opencharly/docs main HEAD (network?) — skipping" >&2
            exit 0
          fi
          if [ "$declared" != "$live" ]; then
            echo "docs: DOCS_REF drift" >&2
            echo "  DOCS_REF: $declared" >&2
            echo "  docs main: $live" >&2
            echo "The check-docs bed would build the WRONG commit — and, because the clone" >&2
            echo "layer's cache key is that string, would keep passing while doing it." >&2
            echo "Bump both occurrences in candy/docs-site/charly.yml in a charly PR." >&2
            exit 1
          fi
          if [ "$occurrences" -lt 2 ]; then
            echo "docs: the pinned sha appears $occurrences time(s) in candy/docs-site/charly.yml; expected 2" >&2
            echo "(DOCS_REF plus the docs-site-pinned-commit check's stdout matcher)" >&2
            echo "A stale literal means the anti-staleness check asserts the WRONG commit." >&2
            exit 1
          fi
          echo "docs: DOCS_REF ($declared) matches the docs repo's current main head; both occurrences present."
        silent: true

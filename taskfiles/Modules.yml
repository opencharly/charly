version: '3'

# Modules.yml — maintenance sweeps over every in-repo Go module that requires the
# sdk / spec contract modules at the shared pins.
#
# That set is larger than it looks, and the difference is what makes this a sweep rather
# than a one-liner. Every plugin candy is its OWN module (the deliberate dependency-shed
# design: a heavy plugin's deps never merge into the ~60 light plugins' graphs), but the
# same coupling reaches `tools/generate-packages` — the command-plugin re-export shim,
# which is a candy module that is NOT named `plugin-*` and no longer lives under candy/ at
# all — and the `tools/golden-*` fixture modules. A glob that assumes `candy/plugin-*`
# silently skips all three.
#
# WHY they must move together. A module here requires `github.com/opencharly/sdk` at the
# shared pinned version, so sdk's OWN `github.com/opencharly/spec` requirement enters its
# module graph. Under MVS the module must then list a spec version at least as new as sdk's —
# and the shared-pin invariant is what keeps the numbers honest now that both contract
# modules resolve from the module proxy (there is no local checkout whose code could hide
# a stale number: the require version IS the resolution). Bump the shared sdk pin without
# this sweep and `GOWORK=off go build` dies in every straggler with "go: updates to go.mod
# needed", which the build-time plugin loader then demotes to a warning before failing
# downstream on an unrelated-looking "no provider registered".
#
# Two mechanisms keep the surface drift-free: the canonical-go.mod GATE
# (tools/gomod-canonical/gomod_canonical_test.go — Shape-A' for the plugin candies, plus
# the shared-pin equality assertion across every module this sweep touches) and this
# `mods:tidy` sweep, which keeps each go.sum in step with its imports. Run tidy after
# adding or removing a dep, and after ANY shared-pin adoption.

tasks:
  tidy:
    desc: Adopt the shared sdk/spec pins in every in-repo module that carries them, then tidy (keeps go.mod AND go.sum in step)
    cmds:
      - |
        set -e
        # The pins are read from charly/go.mod — the single in-tree source of truth the
        # canonical-go.mod gate also anchors on — and PUSHED into each lockstep module
        # with `go mod edit` before tidying.
        #
        # The push is load-bearing: plain `go mod tidy` canNOT adopt a newer shared pin.
        # tidy only ADDS/REMOVES requires to satisfy the imports; it never RAISES an
        # already-satisfied require to a newer version. So a sweep of bare tidy runs
        # green while `tools/*` stays on the old pin, and the gate keeps failing with
        # "run task mods:tidy" — the remedy naming a task that could not perform it.
        # That exact loop is why this task now edits the requires itself.
        core=charly/go.mod
        want_sdk=$(sed -n 's/^[[:space:]]*github\.com\/opencharly\/sdk[[:space:]]\+\(v[^[:space:]]*\).*/\1/p' "$core" | head -1)
        want_spec=$(sed -n 's/^[[:space:]]*github\.com\/opencharly\/spec[[:space:]]\+\(v[^[:space:]]*\).*/\1/p' "$core" | head -1)
        [ -n "$want_sdk" ] || { echo "mods:tidy: no sdk pin found in $core" >&2; exit 1; }
        [ -n "$want_spec" ] || { echo "mods:tidy: no spec pin found in $core" >&2; exit 1; }
        echo "shared pins: sdk=$want_sdk spec=$want_spec"

        n=0; fail=0
        for d in tools/*/; do
          [ -f "$d/go.mod" ] || continue
          # Only modules that require either contract module are part of the lockstep
          # set; a module with no sdk/spec require has nothing to keep in step.
          grep -qE 'github\.com/opencharly/(sdk|spec)' "$d/go.mod" || continue
          if ( cd "$d" \
               && GOWORK=off GOFLAGS=-mod=mod go mod edit \
                    -require="github.com/opencharly/sdk@$want_sdk" \
                    -require="github.com/opencharly/spec@$want_spec" \
               && GOWORK=off GOFLAGS=-mod=mod go mod tidy ); then
            n=$((n+1))
          else
            echo "TIDY FAILED: $d" >&2; fail=1
          fi
        done
        echo "aligned and tidied $n modules"
        exit $fail

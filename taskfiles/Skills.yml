# Skills.yml — the harness/marketplace surface, generated from candy config.
#
# The `charly-plugins` marketplace lives in the STANDALONE opencharly/marketplace repo since the
# marketplace de-submodule cutover: it pins charly in its own .gitmodules, and its own deploy
# workflow builds charly from the pin and regenerates the corpus under a drift gate. charly
# itself carries only the harness surface (.claude/ hooks + settings, the R0 dispatcher),
# generated here by the same `charly marketplace generate` from the candies' `skill:` / `hook:` /
# `marketplace:` kind entities — served by the plugin-marketplace candy, which the Phase-4
# de-submodule cutover moved OUT of this repo into standalone opencharly/plugin-marketplace and
# which charly.yml consumes at a pinned ref. It is a RUNTIME plugin, deliberately absent from
# charly/charly.yml's compiled_plugins (a dev-time generator, the plugin-docs placement). `--out` is the marketplace checkout the corpus is written to (or
# compared against); `charly marketplace drift` is the fail-closed no-op gate for both trees.
version: '3'

vars:
  # The sibling checkout of the opencharly/marketplace repo. Contributors keep one clone next to
  # this repo (the default below) and regenerate the corpus into it; its own CI gates it.
  MARKETPLACE_DIR: '{{.ROOT_DIR}}/../marketplace'

tasks:
  sync:
    desc: Regenerate the charly harness surface + the marketplace corpus from candy config
    cmds:
      - task: refs
      - task: :build:binary
      - '{{.ROOT_DIR}}/bin/charly marketplace generate --root {{.ROOT_DIR}} --out {{.MARKETPLACE_DIR}}'
      - cmd: |
          if [ -n "$(git -C {{.ROOT_DIR}} status --porcelain -- .claude CLAUDE.md AGENTS.md)" ]; then
            echo
            echo "skills: regeneration changed the harness surface — review and commit:"
            git -C {{.ROOT_DIR}} status --short -- .claude CLAUDE.md AGENTS.md | head -20
          fi
          if [ -d {{.MARKETPLACE_DIR}}/.git ] && [ -n "$(git -C {{.MARKETPLACE_DIR}} status --porcelain)" ]; then
            echo
            echo "skills: regeneration changed the marketplace corpus — review and commit it in the"
            echo "marketplace repo (opencharly/marketplace):"
            git -C {{.MARKETPLACE_DIR}} status --short | head -20
          fi
        silent: true

  drift:
    desc: Fail if the generated marketplace/harness surface is stale (regeneration must be a no-op)
    cmds:
      # The gate runs THIS tree's binary, never whatever bin/charly happens to be lying
      # around: a stale (or absent) binary would emit a stale (or no) verdict, and a gate
      # that cannot fail truthfully is worse than no gate. `sync` builds for the same
      # reason; drift is the read-only half of the same pair.
      - task: refs
      - task: :build:binary
      - cmd: |
          raw=$({{.ROOT_DIR}}/bin/charly marketplace drift --root {{.ROOT_DIR}} --out {{.MARKETPLACE_DIR}} 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$raw"
          [ "$rc" -eq 0 ] || { echo "skills: marketplace drift failed (see above)." >&2; exit 1; }
        silent: true
      - cmd: |
          if [ -n "$(git -C {{.ROOT_DIR}} status --porcelain -- .claude CLAUDE.md AGENTS.md)" ]; then
            echo "skills: DRIFT — the committed harness surface does not match candy config." >&2
            git -C {{.ROOT_DIR}} status --short -- .claude CLAUDE.md AGENTS.md >&2
            exit 1
          fi
          echo "skills: no drift."
        silent: true

  refs:
    desc: Fail if this repo's candy/charly-marketplace/charly.yml has drifted from the marketplace's AUTHORITATIVE copy
    cmds:
      # The marketplace deploy workflow copies ITS candy/charly-marketplace/charly.yml OVER the
      # cloned charly's before generating, so that file -- not this repo's -- decides which candy
      # versions the corpus is built from. This repo's copy is only what `sync`/`drift` below feed
      # the generator. Nothing kept the two in sync, so a ref bumped only here moved the LOCAL gate
      # green while CI kept resolving the old version: that is how a removed MCP server was
      # regenerated back into the corpus with `skills:drift` reporting "no drift" the whole time.
      # Equality is what makes the local gate faithful, so it is asserted before every generation.
      - cmd: |
          ours="{{.ROOT_DIR}}/candy/charly-marketplace/charly.yml"
          theirs="{{.MARKETPLACE_DIR}}/candy/charly-marketplace/charly.yml"
          if [ ! -f "$theirs" ]; then
            echo "refs: no marketplace checkout at {{.MARKETPLACE_DIR}}" >&2
            echo "Clone opencharly/marketplace next to this repo; without it the refs list this" >&2
            echo "gate compares against does not exist and the local run cannot match CI." >&2
            exit 1
          fi
          if ! diff -q "$ours" "$theirs" >/dev/null; then
            echo "refs: DRIFT — candy/charly-marketplace/charly.yml differs from the marketplace's copy." >&2
            diff -u "$theirs" "$ours" | sed -n '1,40p' >&2
            echo >&2
            echo "The marketplace's copy is AUTHORITATIVE: its deploy workflow copies it over this" >&2
            echo "repo's before generating. A bump that lands only here changes nothing CI resolves," >&2
            echo "and the drift gate below would still pass. Land the same change in a marketplace PR." >&2
            exit 1
          fi
          echo "refs: OK — refs list matches the marketplace's authoritative copy."
        silent: true

  pin:
    desc: Fail if the plugin-marketplace candy ref pinned in charly.yml has drifted from that repo's latest published tag
    cmds:
      # The plugin-marketplace candy LEFT this repo in the Phase-4 de-submodule cutover: it is a
      # standalone repo now, consumed at a pinned tag, and MARKETPLACE_REF -- the marketplace commit
      # the check-marketplace bed clones -- lives THERE, in that repo's own candy. charly therefore
      # cannot assert that sha any more; the lever it still owns is the candy REF it pins below, and
      # a stale ref transitively pins a stale MARKETPLACE_REF. That transitive coupling is what this
      # gate asserts. (Until this fix the task still read candy/plugin-marketplace/charly.yml, a path
      # deleted by the same cutover, so it reported an EMPTY MARKETPLACE_REF as "drift" and told the
      # reader to bump a file that no longer exists -- a gate that could not pass truthfully.)
      - cmd: |
          file=charly.yml
          declared=$(grep -oE "@github\.com/opencharly/plugin-marketplace/candy/plugin-marketplace:v[0-9.]+" "$file" \
                     | sed 's/.*://' | sort -u)
          if [ -z "$declared" ]; then
            echo "marketplace: no plugin-marketplace candy ref found in $file" >&2
            echo "The check-marketplace bed composes that candy; without the ref the bed cannot pin it." >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$declared" | wc -l)" -ne 1 ]; then
            echo "marketplace: $file pins plugin-marketplace at MORE THAN ONE ref:" >&2
            printf '  %s\n' $declared >&2
            echo "One pin per candy: two refs mean two different MARKETPLACE_REFs reachable from one tree." >&2
            exit 1
          fi
          live=$(git ls-remote --tags --sort=-v:refname https://github.com/opencharly/plugin-marketplace.git 2>/dev/null \
                 | sed -n 's#.*refs/tags/\(v[0-9.]*\)$#\1#p' | head -1)
          if [ -z "$live" ]; then
            echo "marketplace: could not fetch opencharly/plugin-marketplace tags (network?) — skipping" >&2
            exit 0
          fi
          if [ "$declared" != "$live" ]; then
            echo "marketplace: plugin-marketplace ref drift" >&2
            echo "  pinned in charly.yml: $declared" >&2
            echo "  latest published tag: $live" >&2
            echo "The check-marketplace bed builds the candy AT THE PINNED REF, and that candy carries the" >&2
            echo "MARKETPLACE_REF it clones — so a stale pin gates a stale published corpus while still" >&2
            echo "reporting green. Bump the ref in charly.yml in a charly PR." >&2
            exit 1
          fi
          echo "marketplace: plugin-marketplace ref ($declared) matches the repo's latest published tag."
        silent: true
